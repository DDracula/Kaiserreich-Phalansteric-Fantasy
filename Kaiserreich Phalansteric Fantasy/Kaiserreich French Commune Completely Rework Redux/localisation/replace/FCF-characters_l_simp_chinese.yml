  #陆军将领
  FRA_diego_brosset:0 "迪戈·布罗塞"
  FRA_diego_brosset_commander_desc:0 "$faction_sore$-$faction_sore_oldl$\n§Y隶属：§!$party_CNS$\n§Y生于：§!§L1898年10月3日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L迭戈·查尔斯·约瑟夫·布罗塞，里昂人，其父是布宜诺斯艾利斯的股票经纪人。迪戈两岁回国，早年在里昂和多勒的耶稣会学校学习，成绩不佳且厌恶校规，十五岁辍学。他受“炽热的神秘主义”驱动，对战争和祖国感兴趣。1916年志愿入伍，成为第六十八高山猎兵营的列兵。1917年参加马尔迈松战役。 1918年参加第一次亚眠战役和参加第三次皮卡第战役，在莫里斯尔和莫雷伊作战，晋升下士。1919年3月参加贡比涅战役、第三次索姆河战役、瓦兹河战役，晋升中士。最后参加圣米耶尔战役。随着兵变浪潮席卷六十八营。迪戈不想停战，但承认屠杀应该停止。12月末成为准尉，准备就读军事步兵学院。贝当政变后，重启战争，第六十八营再次兵变，军政府准备镇压六十八营。在路上的迪戈被动员至政府军，但迪戈拒绝与战友开战，临阵脱逃至六十八营。随着内战爆发，最终参加革命。一战期间，迪戈总共获得四枚军事十字勋章。革命胜利后，前往上萨瓦，与瑞军对峙，结识柯尼希，晋升少尉。1922年，进入军事步兵学院学习。在校勤奋且乐于运动，曾获得全法军人运动会800米和1500米冠军，并在乔因维尔体操与击剑学院学习。1924年毕业，晋升中尉。被选入第三国际行动部门。自告奋勇前往非洲服役，在撒哈拉活动，负责调查当地情况、联系反殖民势力、组织游击队等。他精通阿拉伯语与撒哈拉文化，是撒哈拉通。期间升任上尉和少校。1929年兼总参谋部非洲与东方事务处副处长，晋升中校。1932年回国进入总参谋部工作，同时考入巴黎东方语言文化学院，晋升上校。1934年获东方语言学士学位并考入陆军高级指挥学校学习，锐评其圈子封闭，“没有灵魂”，1935年毕业，成为第二十四步兵旅旅长，晋升准将。迪戈非常规作战经验丰富，军事思想反传统：强调士官主动性与小兵团作战。迪戈具有民族主义与神秘主义倾向，与索雷尔派不谋而合。他对撒哈拉文化异常热爱，绰号：“骆驼人”。热爱写作，著有小说《撒哈拉，远离西方的人》。热情似火，常有大胆的举动，如把吉普车开到楼梯上。§!\n§Y重要：迪戈支持守旧派。他对于撒哈拉地区十分了解。§!"
  FRA_diego_brosset_high_command_desc:0 "$faction_sore$-$faction_sore_oldl$\n§Y隶属：§!$party_CNS$\n§Y生于：§!§L1898年10月3日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L迭戈·查尔斯·约瑟夫·布罗塞，里昂人，其父是布宜诺斯艾利斯的股票经纪人。迪戈两岁回国，早年在里昂和多勒的耶稣会学校学习，成绩不佳且厌恶校规，十五岁辍学。他受“炽热的神秘主义”驱动，对战争和祖国感兴趣。1916年志愿入伍，成为第六十八高山猎兵营的列兵。1917年参加马尔迈松战役。 1918年参加第一次亚眠战役和参加第三次皮卡第战役，在莫里斯尔和莫雷伊作战，晋升下士。1919年3月参加贡比涅战役、第三次索姆河战役、瓦兹河战役，晋升中士。最后参加圣米耶尔战役。随着兵变浪潮席卷六十八营。迪戈不想停战，但承认屠杀应该停止。12月末成为准尉，准备就读军事步兵学院。贝当政变后，重启战争，第六十八营再次兵变，军政府准备镇压六十八营。在路上的迪戈被动员至政府军，但迪戈拒绝与战友开战，临阵脱逃至六十八营。随着内战爆发，最终参加革命。一战期间，迪戈总共获得四枚军事十字勋章。革命胜利后，前往上萨瓦，与瑞军对峙，结识柯尼希，晋升少尉。1922年，进入军事步兵学院学习。在校勤奋且乐于运动，曾获得全法军人运动会800米和1500米冠军，并在乔因维尔体操与击剑学院学习。1924年毕业，晋升中尉。被选入第三国际行动部门。自告奋勇前往非洲服役，在撒哈拉活动，负责调查当地情况、联系反殖民势力、组织游击队等。他精通阿拉伯语与撒哈拉文化，是撒哈拉通。期间升任上尉和少校。1929年兼总参谋部非洲与东方事务处副处长，晋升中校。1932年回国进入总参谋部工作，同时考入巴黎东方语言文化学院，晋升上校。1934年获东方语言学士学位并考入陆军高级指挥学校学习，锐评其圈子封闭，“没有灵魂”，1935年毕业，成为第二十四步兵旅旅长，晋升准将。迪戈非常规作战经验丰富，军事思想反传统：强调士官主动性与小兵团作战。迪戈具有民族主义与神秘主义倾向，与索雷尔派不谋而合。他对撒哈拉文化异常热爱，绰号：“骆驼人”。热爱写作，著有小说《撒哈拉，远离西方的人》。热情似火，常有大胆的举动，如把吉普车开到楼梯上。§!\n§Y重要：迪戈支持守旧派。他对于撒哈拉地区十分了解。§!"
  FRA_diego_brosset_trait:0 "\n$faction_sore_oldl$"

  FRA_marie_pierre_koenig:0 "马里-皮埃尔·柯尼希"
  FRA_marie_pierre_koenig_commander_desc:0 "$faction_sore$-$faction_sore_oldl$\n§Y隶属：§!$party_CNS$\n§Y生于：§!§L1898年10月10日；法兰西共和国、卡尔瓦多斯省卡昂§!\n§Y背景：§!§L马里-约瑟夫-皮埃尔-弗朗索瓦·柯尼希，祖籍阿尔萨斯，父亲是著名风琴制造师，母亲是花商。早年在圣玛丽学院和马尔赫布中学求学，并积极参与先锋青年俱乐部活动（天主教会赞助的体育俱乐部）。1917年，刚刚高中毕业便手持毕业证参军，并于同年4月17日编入第三十六步兵团。随后前往伊苏丹的预备军官学校学习，成为候补军官。1918年2月毕业并成为准尉，5月参加利斯河战役、6月参加马茨战役、8月参加西线大反攻。因表现出色，获军功奖章和战争十字勋章，并升少尉。1919年3月参加贡比涅战役，4月参加克莱蒙战役——再获战争十字勋章。最终参与了五月攻势。随着圣米耶尔战役的大败，7月爆发遍及全军的兵变，柯尼希保持中立。11月，政府签订《第二次凡尔赛和约》，柯尼希极其反对。1920年贝当政变，推举霞飞为“护国大元帅”，撤销一切改革措施并试图重启战争，激怒了工人阶级与基层官兵。在索雷尔的号召下，“总兵变”爆发了，第三十六步兵团经投票决定支持兵变，作为基层军官的柯尼希默认投票结果。随着内战爆发，三十六团参加革命。由此，柯尼希成为了人民军最早的解放战士之一。革命胜利后，柯尼希继续服役。1921年，他加入第十五高山猎兵营，在上萨瓦地区与瑞军对峙并晋升中尉。1922年，转任第四十步兵师情报官。1924年任职于第四十三师参谋部，晋升上尉。1926年，志愿去第三国际军事处，参与指导智利革命与巴塔哥尼亚的军队建设。1929年，因表现出色，晋升少校。1932年，晋升中校。1935年回国，进入第十四步兵师参谋部，担任卡特鲁的副官，并晋升上校。\n\n柯尼希长期在智利南部和巴塔哥尼亚地区服役，与阿根廷渗透军打运动战。这种非正规战争模式使他更强调军队的机动性，不认可堑壕战。基于自身长期的基层服役经验，他还强调士官的作用，强调士官的主动性。\n\n柯尼希具有浓厚的天主教色彩，并不是社会主义者。但他是坚定的民族主义者，以法兰西利益为先，认为孱弱的阿尔及尔政府无法完成光复故土的使命，因而选择公社，尤其支持索雷尔派。尽管有天主教徒和索雷尔派的双重身份，但他意外地同情犹太人。§!\n§Y重要：柯尼希是坚定的民族主义者，支持索雷尔守旧派。但除此之外，他不一定认同索雷尔派的其他观点。§!"
  FRA_marie_pierre_koenig_high_command_desc:0 "$faction_sore$-$faction_sore_oldl$\n§Y隶属：§!$party_CNS$\n§Y生于：§!§L1898年10月10日；法兰西共和国、卡尔瓦多斯省卡昂§!\n§Y背景：§!§L马里-约瑟夫-皮埃尔-弗朗索瓦·柯尼希，祖籍阿尔萨斯，父亲是著名风琴制造师，母亲是花商。早年在圣玛丽学院和马尔赫布中学求学，并积极参与先锋青年俱乐部活动（天主教会赞助的体育俱乐部）。1917年，刚刚高中毕业便手持毕业证参军，并于同年4月17日编入第三十六步兵团。随后前往伊苏丹的预备军官学校学习，成为候补军官。1918年2月毕业并成为准尉，5月参加利斯河战役、6月参加马茨战役、8月参加西线大反攻。因表现出色，获军功奖章和战争十字勋章，并升少尉。1919年3月参加贡比涅战役，4月参加克莱蒙战役——再获战争十字勋章。最终参与了五月攻势。随着圣米耶尔战役的大败，7月爆发遍及全军的兵变，柯尼希保持中立。11月，政府签订《第二次凡尔赛和约》，柯尼希极其反对。1920年贝当政变，推举霞飞为“护国大元帅”，撤销一切改革措施并试图重启战争，激怒了工人阶级与基层官兵。在索雷尔的号召下，“总兵变”爆发了，第三十六步兵团经投票决定支持兵变，作为基层军官的柯尼希默认投票结果。随着内战爆发，三十六团参加革命。由此，柯尼希成为了人民军最早的解放战士之一。革命胜利后，柯尼希继续服役。1921年，他加入第十五高山猎兵营，在上萨瓦地区与瑞军对峙并晋升中尉。1922年，转任第四十步兵师情报官。1924年任职于第四十三师参谋部，晋升上尉。1926年，志愿去第三国际军事处，参与指导智利革命与巴塔哥尼亚的军队建设。1929年，因表现出色，晋升少校。1932年，晋升中校。1935年回国，进入第十四步兵师参谋部，担任卡特鲁的副官，并晋升上校。\n\n柯尼希长期在智利南部和巴塔哥尼亚地区服役，与阿根廷渗透军打运动战。这种非正规战争模式使他更强调军队的机动性，不认可堑壕战。基于自身长期的基层服役经验，他还强调士官的作用，强调士官的主动性。\n\n柯尼希具有浓厚的天主教色彩，并不是社会主义者。但他是坚定的民族主义者，以法兰西利益为先，认为孱弱的阿尔及尔政府无法完成光复故土的使命，因而选择公社，尤其支持索雷尔派。尽管有天主教徒和索雷尔派的双重身份，但他意外地同情犹太人。§!\n§Y重要：柯尼希是坚定的民族主义者，支持索雷尔守旧派。但除此之外，他不一定认同索雷尔派的其他观点。§!"
