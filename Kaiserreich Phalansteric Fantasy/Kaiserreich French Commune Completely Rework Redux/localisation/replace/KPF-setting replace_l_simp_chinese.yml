  LAT_totalist_party: "革命工人党"
  LAT_totalist_party_long: "拉脱维亚革命工人党(Latvijas Revolucionārā strādnieku partija)\n§L领导拉脱维亚革命工人党的正是当初败于德军之手的布尔什维克。\n\n面对法式革命意识形态无可辩驳的影响力，重组后的拉脱维亚革命工人党内部分裂出一支更加亲近工团主义的派系，但其他人对此不以为然。§!\n"
  LAT_radical_socialist_party: "革命工人党"
  LAT_radical_socialist_party_long: "拉脱维亚革命工人党(Latvijas Revolucionārā strādnieku partija)\n§L领导拉脱维亚革命工人党的正是当初败于德军之手的布尔什维克。\n\n面对法式革命意识形态无可辩驳的影响力，重组后的拉脱维亚革命工人党内部分裂出一支更加亲近工团主义的派系，但其他人对此不以为然。§!\n"
