  #BAT
  BAT_totalist_Riga: "拉脱维亚革命工人党"
  BAT_totalist_Riga_long: "拉脱维亚革命工人党(Latvijas Revolucionārā strādnieku partija)\n§L拉革工的里加支部一直不知疲倦地发动罢工和煽动叛乱，努力使新近得到解放的拉脱维亚与其历史首都再度统一。但里加有的是安全部队，却没几个激进群众。换言之，若没有大规模的武装对抗，他们是不太可能达成目标的。§!\n"
  BAT_radical_socialist_Riga: "拉脱维亚革命工人党"
  BAT_radical_socialist_Riga_long: "拉脱维亚革命工人党(Latvijas Revolucionārā strādnieku partija)\n§L拉革工的里加支部一直不知疲倦地发动罢工和煽动叛乱，努力使新近得到解放的拉脱维亚与其历史首都再度统一。但里加有的是安全部队，却没几个激进群众。换言之，若没有大规模的武装对抗，他们是不太可能达成目标的。§!\n"
  BAT_totalist_union: "波罗的地区革命工人党"
  BAT_totalist_union_long: "波罗的地区革命工人党(Revolutionary Workers' Party of the Baltic Territories)\n§L在波罗的各国的激进左翼革命者看来，促成新波罗的联盟建立还远远不够，他们正寻求更进一步建立无产阶级专政以造福产业工人。他们甚至与自己的革命社会主义同志对立，并自诩为“真正的”先锋党，旨在引领波罗的各国迈向真正的革命。§!\n"
  BAT_radical_socialist_union: "立革工-拉爱革命联盟"
  BAT_radical_socialist_union_long: "立陶宛革命工人党-拉脱维亚和爱沙尼亚革命联盟(Revolutionary Workers' Party of Lithuania-Revolutionary Alliance of Latvian and Estonian Territories)\n§L随着波罗的联合公国的彻底崩溃，以及一个表面上由本民族统治的新波罗的国家的建立，拉爱革命联盟继续履行其使命，并建立了各民族分部。拉爱革命联盟与立陶宛革命工人党的同志们携手合作，他们仍然是革命社会主义和波罗的无产阶级的坚定支持者。§!\n"
