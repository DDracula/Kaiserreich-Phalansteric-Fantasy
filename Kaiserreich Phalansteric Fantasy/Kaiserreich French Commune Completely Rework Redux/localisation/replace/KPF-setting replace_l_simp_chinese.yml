  #ARM
  ARM_totalist_party: "革命工人党"
  ARM_totalist_party_long: "革命工人党(Heghapokhakan Banvorakan Kusaktsutyun)"
  ARM_first_popular_assembly: "首届人民大会"
  ARM_first_popular_assembly_desc: "革命已经成功，现在是时候决定我国未来事业的方向了。目前国内有两大主要派系：革命工人党人及钟声党人，两派都希望继续传承革命火炬。我们应当召开第一屇人民大会，并由群众决定谁来引领我们走向兴旺发达的未来。"
  ARM_communist_victory: "革命工人党胜利"
  ARM_communist_victory_desc: "人民大会已经闭幕，革命工人党将扛起革命的大旗！这一更激进的派别将会彻底用马克思主义改造整个经济，并且对社会上种种不平等现象重拳出击。拭目以待吧，各位，看看他们能否达成目标，将这里变成一片乐土，一片马克思梦想中的乐土！"
  armenia_events.12.d: "由钟声党人和革命工人党人组成的革命联盟赢得了亚美尼亚的首届选举，这为实现一场真正的革命，和为亚美尼亚人民带来更美好的生活铺平了道路。但是，尽管现在权力已经牢牢地掌握在了他们的手中，钟声党人和革命工人党人们充分意识到了他们彼此在许多问题上持有截然不同的观点，例如在我国的经济或是外交政策方面。不过，两党都依旧忠于革命精神，因此并没有让这些分歧在彼此之间产生隔阂。经过几场简短的辩论，他们设法找到了一个能让他们双方都满意的解决方案，那就是举办一场亚美尼亚人民大会。\n\n这场大会将在埃里温召开，届时将决定两个派系中的哪一派会在革命联盟中取得主导地位，从而决定我国未来的政治走向。来自亚美尼亚各地的受邀代表们现在涌入了我们的首都。虽然他们中的一些人是钟声党或是革命工人党事业的死忠捍卫者，但大部分人都对现状持观望态度。这使得这场大会的结果充满了不确定性，并因此激发了报纸上与咖啡馆里的政治讨论与猜测。似乎全体亚美尼亚人们都在屏息等待着大会做出的第一个决定。很快，革命者们将会发表他们在大会上的第一场演说，而大会的第一场辩论也将随后举行，我们民族的未来亦将在此被大会决定。"
  armenia_events.13.d: "这一天终于到来了！今天，革命联盟的诸位代表们将齐聚一堂，通过投票来共同决定新政府的主要政治目标。\n\n较为温和的钟声党人们认为，普普通通的工人们，是亚美尼亚，以及世界上所有国家的支柱。工人们在受苦，也就意味着国家在受苦。鉴于我们勤劳的工人们在奥斯曼政府，以及亚美尼亚第一任临时政府治下所受的那些恶劣对待，钟声党人们认为有必要将劳工权利条款写入宪法，从而提高我们整个国家的生活水平标准。毕竟，对于一个现代的，革命的国家来说，让它的公民只能在最贫困的条件下为一口面包而工作，这是完全不可接受的。\n\n革命工人党人们同意钟声党人们所说的大部分内容，但他们想要更进一步地，彻底地改造我们的国家。据革命工人党人所言，资本主义辜负了亚美尼亚人民，因此应当受到严格的限制。他们提倡一种更加马克思主义的做法，而这将为亚美尼亚人民带来他们为之奋斗许久的平等与自治。尽管在理论上听起来不错，但一些钟声党政客始终在公开地质疑这类激进做法的有效性与必要性，宣称这些手段对于亚美尼亚来说弊大于利。\n\n双方在最近的几天里都在大力地捍卫着自己的观点，试图说服尽可能多的代表站到他们的一边。今天，就让我们看看这两派究竟谁更有说服力一点。"
  armenia_events.14.d: "大会下一项议程是经济政策。虽然钟声党和革命工人党都同意我们现存的经济体系状态不佳，需要大刀阔斧地改革，但应该如何改革则有待商榷。\n\n正如预料，钟声党支持更温和的办法。他们认为若能在社会改革和经济改革中找到平衡，将同时利好亚美尼亚经济和人民生活水平。举个例子，廉价医保和适当的最低工资可以减轻公民生活负担，同时累进税和财富分配制度将会帮助我们实现无阶级社会的目标。在无阶级社会，经济不单单服务于上层阶级。而且，这些改革措施推行起来非常简单，只需要通过一些新法律即可。\n\n但同时，革命工人党提出了更激进的办法。为了实现真正的平等，打造一个利己主义人人喊打的社会，他们认为有必要集体化和国有化关键企业和商业活动。国控经济将更好地满足亚美尼亚人民的需求，还能确保财富被平均分配给人民，但也会剥夺企业家的自由——一个革命工人党愿意接受的交换。"
  armenia_events.15.d: "大会最后一项议程是我国的外交政策。这个问题被留在最后是有意为之的，因为革命工人党和钟声党在这上面的分歧最大。\n\n钟声党认为亚美尼亚有必要将武装力量重组为革命军队，即便面对强敌也能保卫祖国，并不惜一切代价拯救亚美尼亚。为进一步强调军队对我国自由的重要性，钟声党领袖格雷戈里·叶吉基扬在大会上进行了一场爱国演讲，向我国勇敢的士兵致敬，并强调说，土耳其人、俄罗斯人和波斯人很快便会试图再次征服我国——只有靠建立一支足以保卫亚美尼亚及其人民的军队才能避免这种结局。\n\n然而，革命工人党认为这太过火了。组建革命军队会让社会变得好斗，这点会被邻国利用，对我国进行先发制人的打击。他们觉得应该只注重于国内事务并保持低调。这能让我们有机会在没有外国干预情况下发展国家，和平且低调地走向繁荣，但也会让我国变得十分脆弱。"
  armenia_events.16.t: "革命工人党掌权"
  armenia_events.16.d: "首届亚美尼亚人民大会已经闭幕，代表们依次打道回府。在所有议题都经过投标表决后，计票结果显示阿纳斯塔斯·米高扬领导的革命工人党取得了胜利。他们的政治目标和方针得到了代表和人民的支持，该党也因此取得了多数席位。消息传遍全国后，米高扬在电台发表了讲话。他感谢人民给予自己和革命工人党的信任，承诺其政策将带领亚美尼亚走向其应得的和平和繁荣。\n\n尽管有人觉得钟声党会为因败选而痛苦，但考虑到是他们首先将革命理念带入亚美尼亚，且应该也希望在未来保卫革命，钟声党政治家们倒是对他们在联盟中的新位置感到满意。格雷戈里·叶吉基扬甚至向米高扬一派的胜选表示了祝贺，承诺将在对方彻底改革国家的过程中给予帮助。两党看起来如往常般亲密，迫不及待地要发动一场亚美尼亚革命。"
  armenia_events.17.d: "首届亚美尼亚人民大会已经闭幕，代表们依次打道回府。在所有议题都经过投标表决后，计票结果显示格雷戈里·叶吉基扬领导的钟声党取得了胜利。看来代表和人民都不想要激进的改变，而更青睐温和的改革以改善生活水平。在今早对媒体的讲话中，米纳相表示自己并不意外，称从不怀疑大会将选择钟声党来领导国家。但他依旧感谢人民对他的支持，并承诺将带来平等和自由。\n\n随着温和派执掌大权，更激进的革命工人党看起来有点失望。虽然他们仍认为钟声党的改革不足以让亚美尼亚变得更好，但仍避免公开质疑大会的决定，并承诺将继续支持钟声党。如今，有钟声党领导的联盟引领我们，和平和繁荣就在眼前！"
  armenia_events.31.d: "选举日益临近，两个竞选联盟现已开始利用其资源进行选举广告宣传。为了让人民相信他们的政治目标和议程，两大阵营现在都向广播电台和报社派出了他们最出色的政客。在这些现代媒体的帮助下，他们可以轻而易举地向全国人民发出呼吁。\n\n民主派联盟由自由派的民主自由党和社会民主派的革命联盟组成，拥有相对广泛的支持者基础，其中包括企业家、知识分子，甚至还包括一小部分普通工人。由于民主派确信中上层阶级相当不喜欢革命的想法，他们认为这部分人的支持是理所当然的。因此，他们决定把广告宣传的重点放在亚美尼亚社会的下层，承诺革命联盟倡导的温和改革会给人民带来繁荣，同时还声称革命派的承诺弊多利少。\n\n与此同时，由钟声党和革命工人党人组成的革命派联盟也在试图说服下层民众相信他们的政策。他们谴责民主派是伪君子，认为自由派只想代表资本主义上层阶级的利益，而不是亚美尼亚辛勤工作的人们的福祉。革命工人党领导人阿纳斯塔斯·米高扬在今天上午发表的广播讲话中强调，必须进行一场彻底的革命，这场革命将引发一场彻底的社会动荡，并为我国劳动者带来他们所渴望的权利和财富。\n\n由于两派都在争夺一个阶级的选票，我国的工人和农民现在基本上处于“拥王者”的地位。我们很快就会知道哪一方在普通民众眼中更有说服力。"
  ARM_guide: "£white_dot 注意：要解锁§Y亚美尼亚§!的政治线，就必须先打赢反抗§Y奥斯曼帝国§!的§r独立战争§!。\n\n§M氏族信仰运动§!（$national_populist_coloured$）\n£white_dot 与§Y奥斯曼帝国§!停火时，§P家长制独裁§!支持率要高于50%。\n£white_dot 停火时§Y俄罗斯§!的领袖必须是§n鲍里斯·萨文科夫§!。\n£white_dot 在§Y民主派归来§!事件中，选择第二个选项（“纳日德赫对军方的影响力依然强劲”），从而巩固§n氏族信仰运动§!的统治。\n\n§M图存党§!（$paternal_autocrat_coloured$）\n£white_dot 与§Y奥斯曼帝国§!停火时，§P家长制独裁§!支持率要高于50%。\n£white_dot 停火时§Y俄罗斯§!的领袖必须§r不是§!§n鲍里斯·萨文科夫§!。\n\n§M亚美尼亚的真救世主§!（$authoritarian_democrat_coloured$）\n£white_dot 按§n氏族信仰运动§!的前两步进行游戏。\n£white_dot 在§Y民主派归来§!事件中，选择第一个选项（“军队忠于民主”），从而推翻§n氏族信仰运动§!的统治。\n\n§M民主联盟§!（$market_liberal_coloured$/$social_conservative_coloured$/$social_democrat_coloured$/$social_liberal_coloured$）\n£white_dot 与§Y奥斯曼帝国§!停火时，§P家长制独裁§!支持率要低于50%。\n£white_dot 完成国策§Y首届亚美尼亚选举§!\n£white_dot 在触发的事件中，让§S民主派联盟§!胜利。\n£white_dot 在§Y$armenia_events.33.t$§!事件中，你可以选择§S鲁本·特尔·米纳相的革命联盟§!或者§m米格兰·达马江的民主自由党§!执政。\n£white_dot 若要选举§c亚美尼亚平民党§!或§l亚美尼亚人党§!，需要等到两年后§S民主联盟§!分裂并组织第二次选举。\n\n§M革命派§!（$radical_socialist_coloured$/$totalist_coloured$）\n£white_dot 按§S民主派的胜利§!的前两步进行游戏。\n£white_dot 在触发的事件中，让§r革命派§!拿下压倒性胜利。\n£white_dot 完成国策§Y首届人民大会§!。\n£white_dot 要让§R钟声党§!掌权，必须至少在两个事件中选择第一个选项。\n£white_dot 要让§o革命工人党§!掌权，必须至少在两个事件中选择第二个选项。"
