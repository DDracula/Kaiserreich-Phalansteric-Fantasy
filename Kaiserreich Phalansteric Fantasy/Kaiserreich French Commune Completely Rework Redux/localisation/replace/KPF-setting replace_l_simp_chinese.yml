  #SRI
  socialist_italy_events.46.d: "墨索里尼当然不在乎罗塞利事件引发的一系列负面影响，但他发现，这是一个抨击他所谓的亲密战友——阿尔切斯特·德·安布里斯的大好机会。\n\n墨索里尼曾与德·安布里斯共事数十载有余，但德·安布里斯在政治上一直保持着高度的独立状态，而墨索里尼并不喜欢他这一独立行事的风格。在《法西斯法》出台前，德·安布里斯的立场对于墨索里尼的统治还是极为有利的，它维系了主席与政府之间名义上的独立状态，很好地安抚了各路反对派。但如今，德·安布里斯已经成为了墨索里尼道路上的又一障碍。\n\n因此，德·安布里斯很快因处理罗塞利事件不力而引咎辞职，取而代之的是墨索里尼更为亲密的政治盟友——帕尔米罗·陶里亚蒂，他在革命初期就与墨索里尼结下了私人友谊。尽管陶里亚蒂的意识形态与墨索里尼大相径庭（他一直领导着意大利革命工人党，直至其于1932年与革命行动法西斯合并），但他的政治力量要远远弱于墨索里尼，这才是最重要的一点。当然，黑衫军（他们更青睐德·安布里斯的国家工团主义思想）是不会喜欢这种变化的。"
  socialist_italy_events.48.d: "陶里亚蒂在墨索里尼被刺后成为新任主席——此事完全在革命法西斯的意料之外，对他们而言也是一记沉重打击。看来，墨索里尼为法西斯运动留下的遗产就只有他个人主义计划的灾难影响，这严重危害了法西斯主义整体；确实如此——陶里亚蒂已经开始尝试与旧列宁主义运动乃至残存的工会建立联系，并任命其朋友、著名反法西斯者路易吉·隆哥为总理。\n\n革命行动法西斯旋即乱作一团：由于旧意大利革命工人党党员都追随陶里亚蒂，大部分人法西斯派团结了在前总理德·安布里斯周围。此刻，黑衫军正在向罗马进军，以图为法西斯革命续命，而他们能否成功则取决于军队对哪一方忠诚。"
  SRI_palmiro_togliatti_leader_desc: "§Y生于：§!§L1893年3月26日；意大利王国、热那亚§!\n§Y背景：§!§L帕尔米罗·陶里亚蒂生于一个中产家庭之中。他在早年时因父亲的教职关系而不得不四次搬迁——先是到诺瓦拉，再到都灵、松德里奥最后到萨萨里。因父亲于1911年悲剧离世而回到都灵的他获得了入读法学院的奖学金，不过他其实更想读哲学。\n\n陶里亚蒂在1914年——世界大战前夕——加入了意大利社会党，他支持意大利在大战中加入协约国一方。他最终于1915年尾毕业，尽管他一直都想攻读哲学学位，但他因为近视而加入了红十字会，其后在前线奋战。在意大利内战爆发时，他加入了共和阵线以及日后兴起的“红色”派系。\n\n与大多数工团主义者不同，陶里亚蒂强烈主张军国主义以尽快将意大利统一在工团旗帜之下。这一点，加上他反对无序的工团制度和建立集权政府的愿景，让他转向支持日益壮大的法西斯运动。这些支持在1927年后成为了正式联盟，当时意大利联邦解体，但意大利社会主义共和国却未能抓住机会。在墨索里尼的压力下，陶里亚蒂最终采纳了法西斯宣言作为意大利革命工人党的党纲，作为回报，他成为了墨索里尼的二把手。\n\n在墨索里尼遇害后，陶里亚蒂看到了将法西斯运动引向新方向的机会，他也随即当机立决。他一方面重建了与工会的联系，另一方面迫使工会接受更大程度的中央控制，同时还谴责了黑衫军的过火行为，他的管治似乎与墨索里尼截然不同。但问题仍存——黑衫军会接受陶里亚蒂作为领袖吗？§!"
  SRI_guide: "§R行动党：$SRI_carlo_rosselli$§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡中间让激社当选。\n£white_dot 在完成国策§Y$SRI_constitutional_restoration$§!之前完成国策§Y$SRI_break_enemies_of_democracy$§!。\n\n§R行动党：$SRI_emilio_lussu$§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡中间让激社当选。\n£white_dot 在完成国策§Y$SRI_break_enemies_of_democracy$§!之前完成国策§Y$SRI_constitutional_restoration$§!。\n\n§r总工会-工团联盟§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡左边让工团当选。\n\n§o革命行动法西斯§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡右边让极权当选。\n\n§o革命行动法西斯：$SRI_alceste_de_ambris$§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡右边让极权当选。\n£white_dot 完成国策§Y$SRI_reform_the_party$§!，在墨索里尼被枪杀后让黑衫军恢复法西斯革命路线。\n\n§o意大利革命工人党§!\n£white_dot 在统一后首次选举中，通过保持在权力平衡右边让极权当选。\n£white_dot 完成国策§Y$SRI_reform_the_party$§!，在墨索里尼被枪杀后让陶里亚蒂带领军队突袭。"
  SRI_totalist_pcdi_party_long: "意大利革命工人党(Partito Rivoluzionario dei Lavoratori d'Italia)"
  SRI_totalist_pcdi_party: "意革工"
  #SWE
  SWE_nils_flyg_leader_desc: "§Y生于：§!§L1891年6月9日；瑞典王国、南曼兰省斯德哥尔摩南马尔姆岛§!\n§Y背景：§!§L瑞典极权主义的代表人物尼尔斯·尼瑟·弗吕格被许多人认为是一位履历丰富的人。弗吕格出生于斯德哥尔摩的工人阶级居住区南岛，他从小就活跃在瑞典激进左翼组织中。1917年，他与塞特·赫格隆德和卡尔·希尔布姆脱离瑞典社民工党，组建了瑞典革命工人党，这一短暂的试验很快就在俄国革命被粉碎后失败了。尽管如此，年轻的弗吕格将被证明是瑞典左翼的一支中坚力量。\n\n近几年来，弗吕格与不那么激进的同志们保持距离，接受了法兰西公社的索雷尔派和不列颠联盟的奥斯瓦尔德·莫斯利宣扬的全力献身革命的理论，不过他也加入了他自己独特的观点：众所周知，弗吕格反对美国本土的社会主义革命，而讽刺的是，俄罗斯认为革命必须起源于欧洲，否则它将以反欧洲帝国主义的形式出现，他指出，俄罗斯和美国都不存在正统的极权主义运动。§!"
  #SYR
  syrian_republic_events.3.d: "然而，显而易见的是，国民联盟和人民党这两个组织都驯服于老一代人的传统意识，他们的唯一目的就是维护旧的社会制度，从科斯坦丁尼耶那里争取自治。通过奥斯曼人民党的教育努力，加上欧洲的巨大变化所催化，新一代叙利亚人走上了舞台，而他们与长辈的观点截然不同。在欧洲社会主义运动启迪下，叙利亚的社会党和革命工人党正在利用经济萧条和黎凡特战争造成的贫困和危机，并在欧洲左翼的支持下，加强其政党的实力。在政治光谱的另一侧，叙利亚社会民族党从意大利和俄罗斯的运动中汲取灵感，在叙利亚地区创建了一个世俗并具有革命性理想的军国主义组织。\n\n不过对国民联盟的最大威胁是国家行动联盟。这个组织由受过高等教育的第二代阿拉伯民族主义者创建，并采取了一个温和中间派政纲，他们既支持极端分子的世俗化野心，也相信选举的力量。报纸、广播、童子军和民兵组织是他们党派的主要组成部分，同时他们在黎凡特战争中的服役经历也是他们的重要加分项。\n\n只有时间才能证明，孰死孰生，各个党派要么戴上权力的桂冠，要么就随风飘散于黄沙……"
  #UKR
  UKR_totalist_party: "乌革工"
  UKR_totalist_party_long: "乌克兰革命工人党(Ukrainska Revoliutsiina Robitnycha Partiia)\n§L在从乌克兰布尔什维克大崩溃中恢复过后，乌克兰革命工人党已经彻底与布尔什维克分道扬镳。乌革工于巴黎召开了流亡大会，并在大会上选举了制定党章的代表。这些代表主要由前布尔什维克，以及对斗争派和委员会革命集团失望的激进乌克兰共产主义者组成。乌革工虽吸收了许多旧布尔什维克纲领，但他们之间依旧有着决定性的区别：即对乌克兰民族问题的态度。乌革工以安定多数通过了深化“民族意识”的路线，但面对总目标，乌革工仍然有几个问题尚待解决。究竟是应该加入乌克兰的革命阵线，彻底抛弃同俄国革命的联系，还是继续维持同俄国革命运动的良好关系，淡化同乌克兰革命的联系？自然而然，党内也因此产生了许多嫌隙。但最后，党的大权还是交给了弗拉斯·丘巴尔，他被视作是党内脆弱内部妥协的产物，人们希望他能够带领革命翻开新的一章。不管曾经如何，截至目前，乌革工所有试图立足政坛的努力都毫无疑问地失败了。§!\n"
  UKR_bakhmut_meeting_agree_to_ukapist: "§R乌克兰革命工人党会是有用的盟友，但我们应该相信这些旧布尔什维克吗？§!"
  UKR_bakhmut_meeting_no_agreement: "§R乌克兰革命工人党会玷污我们的理念，但没了他们，我们还能挺下去吗？§!"
  UKR_borotbyst_popularity_mechanic_tt: "§O如果我们选择与§!§o乌克兰革命工人党§!§O结盟，将获得一个效果基于§!$syndicalist_coloured$§O支持率的增益。§!"
  ukraine_borotbyst_events.14.d: "对于斗争派而言，赤卫队向来是一个异类。的确，斗争派是头号革命政党，组织了很多抗议活动和农民互助团体，不过他们却与赤卫队的组建无干。在革命派高层一番深入调查后，他们发现赤卫队和其他附属团体是受乌克兰革命工人党的许多高级成员“遥控”指挥的，如米科拉·斯克里普尼克、瓦西尔·沙赫赖伊和谢尔希·马兹拉赫。尽管双方在推动并成功发动革命推翻共和国方面有着明显的共同利益，但双方之间也存有极大的不互信。他们的原则并不相悖，不过斗争派的队伍主要在农村，而乌革工则在城市地区有更大发言权。大家真正担忧的是，对方会试图排挤己方以及己方的支持者。\n\n尽管如此，随着共和国局势日益恶化，罢工和冲突越发常见，革命的可能性也越来越大了。斗争派和乌革工的顶层代表同意就共同对抗共和国进行谈判。主持谈判的是中间人阿纳托利·皮索茨基，他是极左的委员会革命集团成员及其主要领袖。乌革工和委革表示如果斗争派愿意提高城市工人，特别是采矿工人的代表权，他们便愿意同斗争派合作。中央革命委员会的部分成员因此便倒向了乌革工和委革。谈判取得了一些成果，但事实不可否认，斗争派仍是全国最强大的革命组织，如有需要完全可以独自发动革命，可话说回来，乌革工和委革的支持或许也十分宝贵。"
  ukraine_borotbyst_events.60.d: "乌克兰革命工人党主席弗拉斯·丘巴尔提出与斗争派结盟。乌革工规模虽小，却组织严密。他们对乌克兰劳动群众的直接影响有限，但其追随者都无一例外地忠心耿耿、无可指摘。这一联盟兴许能派上用场，不过我们同时也得保持警惕。一旦有机会，乌革工势必会将自己的势力渗透进地方议会与工会组织。如果我们表现出一丝软弱或分裂的迹象，乌革工必将立即采取行动，以牺牲我们的利益为代价，毫不留情地壮大自身的影响。"
  ukraine_borotbyst_events.60.b: "不妥，乌克兰革命工人党恐怕不愿久居人下。"
  ukraine_republican_events.6.d: "劳工代表大会的选举即将举行。此次选举与以往不同，只有那些承诺拥护革命、服务于工人阶级利益的人才能参加。\n\n革命已告成功，反革命分子已被妥善处理，工人民主联盟的前景变得清晰起来：其两个组成部分，委员会革命集团及乌克兰社会革命党已同意和平解散工民盟，并分别参加劳工代表大会选举。总的来说，委革与社革两派都在争夺劳工代表大会的控制权，委革支持沃洛迪米尔·温尼琴科竞选主席，而社革则支持尼基弗·赫里霍里耶夫。\n\n不过，参与劳工代表大会的可不止这两派。斗争派也转而拥护我们的胜利，并打算参与代表大会选举。虽然他们这些年的支持大幅回落，但如果他们要与社革和解并重新合流，也能突显其影响力。乌克兰革命工人党也表示将参与代表大会，他们的意识形态大体上与委革有很多相似之处，与当中的皮索茨基派尤其谈得拢。虽然很多人估计皮索茨基会被边缘化，但他在委革中仍有许多同情者，这些人认为革命已经巩固，故而温尼琴科的温和路线已无必要。\n\n有人担忧乌社民工党在革命后将变得不再重要，而其中一些更为独立的成员继续与社革温和派结盟，他们相信科瓦列夫斯基的影响力会逼使赫里霍里耶夫妥协。最后，还有温尼琴科本人的问题。委革很可能无法在劳工代表大会中取得多数，就如同在国民议会那时，被社革议员在数量上压制。不过，无人能否认，温尼琴科的妥协手腕与高超领导才能为他争得了不少支持。温尼琴科到底能否争取到足够的支持推行其“集体统治”议程，还是说他会屈服于党内更为激进的成员，目前仍未可知。最终，劳工代表大会首次选举的结果是……"
  ukraine_republican_events.37.d: "在即将到来的选举中，工会的支持尤为珍贵。按照惯例，工会一般会支持斗争派和革命工人党，遵循正统工团主义路线；但时局已变，盖特曼对社会主义者残酷镇压，逼迫许多人倒向愈发激进的极左翼革命立场。现在，人民共和国已然凯旋，革命者不用再饱受打压和摧残，其他政党则试图在工会内部寻得一席立足之地。革命后。独立工会大量涌现，这是赢得他们支持的大好时机。然而，人民共和国羽翼未丰，政府是否能有效治理还未经证明，因此一部分人仍心存顾虑，不太愿意去效忠一个新政党。\n\n而对于社民工党而言，关键在于我们是否要去拉拢，又该怎样去拉拢那些更为激进的工会成员。或许强调社民工党的激进历史会是个明智之举；如果我们被视为争取工作场所民主与反抗盖特曼暴政的斗士先锋，那些更加反对改良的工会没准会愿意接纳我们。不过，党内也有一些人认为这纯粹是徒劳之举。现在，工会已经能够自由组织自己，而毫无疑问，社民工党也将成为其中不可忽视的一股力量。"
  ukraine_events.92.d: "在乌克兰草原上，各种奇迹和神圣的故事无处不在。在卢甘斯克省的每个小镇中，都能找到一位森林传教士，他们会颂扬自然生活方式之美德。这些人通常会在冬季偃旗息鼓，让圣周时的街道安静下来。但今年的圣周不同以往。\n\n在一个零下45摄氏度的苦寒夜晚，一群男女出现在卢甘斯克的户外。有人上报警察，要求逮捕他们。警察们把他们抓到屋子里，接着大吃一惊。这群人大多不穿上衣，也不穿鞋子，为首的是个留着白色长须的矮胖男人。\n\n警察发出的第一份报告称他们抓住了圣诞老人，这被人们当作节日玩笑而不予理会。然而，当地政府却发来询问，问我们新年过后会如何处置他们。他们是活生生的人，自称是波尔菲里·伊万诺夫的追随者。他们不是基督教徒，也不是旧礼仪派。他们的领袖曾登记成为俄罗斯革命工人党党员，但他又是个传教士。显然，这些成员怀有错误的信仰，认为待在零下温度的户外会治愈他们身上所有的疾病。\n\n这简直是发疯，但也许还有种另类理论？让这些疯子继续存在，实际上对乌克兰政府的财政有帮助。他们拒绝一切福利、药物医疗、肉食以及一切慈善。如果我们允许这一团体在国内继续传播，他们能为政府省下大笔福利金。但显而易见，这将导致许多追随者死亡，毕竟他们以为能受到的医疗纯属幻想，而卢甘斯克市也难以容忍他们的异端邪说。"
  ukraine_republican_events.144.d: "革命终告完成。自盖特曼政权垮台而始的乌克兰革命最终落下帷幕，伴随着革命的胜利，工人民主联盟所立下的誓言照进了现实。经过多年的斗争，乌克兰终于挣脱德意志帝国的重重枷锁，可以鼓足干劲朝着社会主义的方向迈进了。\n\n革命的这些年来发生了很多变化。工农委员会担起了一些国家下放给他们的职责，他们已能够最终决定劳工代表大会的组成。然而，委革不遗余力地在这些委员会中攫取了极大的席位和影响，从而在代表大会内外均取得主导地位。可以说，该党依靠自己的实力，外加革命工人党中支持他们的伙伴，已称霸了乌克兰政坛。委革自身也大不相同了：温尼琴科主席坐上冷板凳，一个由党员选举产生的主席团成为党的最高统治机构。主席团决定最高级别事务，而这些决定随即成为党的政策基础，所有成员都应该毫无例外地遵从。这与布尔什维克主张的民主集中制别无二致。\n\n虽说如此，但也不能把人民共和国称作真正的党国。委革并不乐于完全控制劳工代表大会和各委员会，而仍然让其他派系充当制衡。社会革命党虽然大不如前，但依然能与其他在各委员会中站稳脚跟的较小团体携手维持存在。虽然委革鼓励其他外围派系与其合作，但并没有强制执行力，而且在实际执行政策时，委革的党委也还没有架空共和国的行政部门。委革崛起的设计师、共和国第一人民部长、委革主席团第一书记，以及党的真正领袖阿纳托利·皮索茨基并不打算强行打造党国，他认定这种局面必然是暂时的。或早或晚，各种政党将不再有存在必要，而所有真正进步的势力会自然而然地团结为一个整体。强行推动团结只会创造出反动反对派，团结自会随着物质条件的满足而实现。\n\n时间会证明他是否正确。"
  ukraine_republican_events.145.d: "革命终告完成。自盖特曼政权垮台而始的乌克兰革命最终落下帷幕，伴随着革命的胜利，工人民主联盟所立下的誓言照进了现实。经过多年的斗争，乌克兰终于挣脱德意志帝国的重重枷锁，可以鼓足干劲朝着社会主义的方向迈进了。\n\n革命的这些年来发生了很多变化。随时间推移，权力逐渐下放到全国各地的工农委员会手上，而在不远的未来，战时措施将变得不再必要，人们预计权力下放的进程还会加快。乌克兰人口结构的现实决定，农民委员会的数量和重要性将远超工人委员会，而如果不采取特别措施，这种情况将持续存在——对当局而言十分完美。这些委员会在劳工代表大会的组成上拥有一定的话语权，而这种权力设计旨在保持代表大会的无产阶级性质。但在此之外，代表大会其实与其取代的国民议会惊人地相似，是有些类似传统议会制体制的中心。因此，即使是激进民主党和社民工党也能在代表大会中获得自己的席位，不过都相当边缘化就是了。\n\n由激进派领导的社会革命党塑造了发展的新格局，并登上了新革命秩序中心。主席之位从沃洛迪米尔·温尼琴科传到社革的尼基弗·赫里霍里耶夫。政府现在由第一人民部长帕夫洛·赫里斯秋克掌舵，他是社革崛起的最大推手。在他的指导下，斗争派被纳入革命队伍，而其中的农业派也同心系农民的政府积极开展合作。委革基本已被曾经的盟友赶超，但仍然在与革命工人党人争夺工人选民，充当政府的建设性反对派，而非像革命工人党这种专职反对派。两党选民的区别在于，委革工人选民相信可以与农村合作，而革命工人党工人选民则认为自己已被农村所甩开。\n\n社革却不这样认为。农民受到盖特曼枷锁的压迫，却在乌克兰的田野中撒下了革命的种子，谁能说不应该由他们收获革命的果实呢？"
  ukraine_republican_events.146.d: "革命终告完成。自盖特曼政权垮台而始的乌克兰革命最终落下帷幕，伴随着革命的胜利，工人民主联盟所立下的誓言照进了现实。经过多年的斗争，乌克兰终于挣脱德意志帝国的重重枷锁，可以鼓足干劲朝着社会主义的方向迈进了。\n\n革命的这些年来发生了很多变化……但有的人觉得实际的改变并不多。工农委员会已经逐渐从中央政府手中接过下放的权力，在战时措施终止后，他们的权力很可能还会扩大。这些委员会在劳工代表大会的组成上拥有一定的话语权，以维护代表大会的无产阶级性质——而那些期望采取更为彻底的革命手段取代国民议会的人则对此大失所望。代表大会依然以传统议会模式运作，新政府对于打压资产阶级与左派修正主义分子也漠不关心，这意味着乌社民工党在左翼阵线中仍占有一定的地位，激进民主党人有时也能以“劳动知识分子”的身份与会。更令人震惊乃至恐慌的是，在数量远超工人委员会的农民委员会中，人们甚至发现一些保守的无党派人士也成为了大会代表。\n\n尽管各进步派势力之间存在着摩擦与分歧，但其中大多数人事实上已建立起一种行之有效的合作关系，只是偶尔会稍显勉强。温尼琴科的主席一职最终让位给了社革的尼基弗·赫里霍里耶夫，而这场优美合奏真正的总指挥则是第一人民部长米科拉·科瓦列夫斯基。他领导着社会革命党的温和派，维系着革命势力与改良势力间的平衡及各方间的政治和平，将社革置于代表大会的主导地位。现在，社会革命党带上了社民工党，领导着他们与委员会革命集团组建起来的人民阵线，此外，革命工人党人则成为了这个体系的主要反对派。\n\n这一局面能否长期维持下去仍是个未知数。有的人预测人民阵线行将崩溃，代表大会将被更激进的势力占据；也有的人认为阵线会被反动势力渗透，进而从内部颠覆。但那都是后话了，回望当下，革命分子的蜜月仍在继续。"
  ukraine_republican_events.37.d2: "在即将到来的选举中，工会的支持尤为珍贵。按照惯例，工会一般会支持斗争派和革命工人党，遵循正统工团主义路线；但时局已变，盖特曼对社会主义者残酷镇压，逼迫许多人倒向愈发激进的极左翼革命立场。现在，人民共和国已然凯旋，革命者不用再饱受打压和摧残，其他政党则试图在工会内部寻得一席立足之地。革命后。独立工会大量涌现，这是赢得他们支持的大好时机。然而，人民共和国羽翼未丰，政府是否能有效治理还未经证明，因此一部分人仍心存顾虑，不太愿意去效忠一个新政党。\n\n当然，工民盟是乃是工人的同盟，我们在工人中的地位自然比较稳固。不过，斗争派和革命工人党在工会的优势地位倒是给我们出了个难题。也许最好的办法是同斗争派达成协议：我们不去干涉他们在地方选举中取得优势的地区，而他们则在议会选举上给我们支持。社革对这个协议颇有微词，毕竟他们还要和斗争派在地区选举中争夺选票。可如果协议没能达成，委革肯定也会对此说三道四，因为这样他们在城市工人选民手里拿到的选票就大不如前了。"
  ukraine_republican_events.52.d: "罢工权是人民共和国宪法保障的基本权利之一，而且似乎有些人已经准备好充分行使这一权利。独立矿工工会是一个新兴组织，它与既有的工会结构无关，而是在取消了盖特曼国对劳工协会的限制后成立的。该组织得到了顿巴斯地区矿工的大力支持，并对目前困扰矿业的多次罢工负责。由于经济最近才开始从黑色星期一危机的冲击中复苏，罢工是意料之中的事，但这些罢工的战斗性和激进性更容易让人联想起1936年那段激情燃烧的岁月。\n\n很明显，虽然工人们有不满情绪是可以理解的，但毫无疑问站在独立工会背后的革命工人党和斗争派却在利用当下势态来达成他们自己的政治目的：扰乱公共秩序，诋毁我们新成立的政府。我们在社民工党的盟友设法与工会的主要人物达成了某种谅解，并向我们提交了一份旨在从长计议来缓解劳资紧张关系的路线图。\n议题的两个要点是：将矿企置于国家监督之下，以及国家继续支持有组织的劳工。对这些事业的承诺可能会赢得工会领导层的信任，并平息目前的紧张局势。\n\n这一主张立即引起了党内的怀疑。有人认为，社民工党不过是在利用当前的危机来推动他们的狭隘目标。没人能保证，即使取得了成功，社民工党也只会为此邀功，以牺牲我们为代价捞取自己的政治资本。毕竟，罢工总有结束的一天，而且人民民兵可以确保罢工不会扰乱公共秩序。不过，无所作为和优柔寡断可能会给我们的政府带来不好的影响，所以也许选择社民工党的计划才是正确的。"
  ukraine_republican_events.150.d: "在反抗盖特曼国的过程中，极左翼发挥了非常重要的作用，共产主义者维护着抵抗的星火，带领被压迫者举起义旗，对我们有很大的帮助。不过，这并不意味着他们与我们毫无分歧，在他们中，一些人像工人民主联盟中大多数人一样，选择融入新的政坛体制，而其他人的态度则更为模糊，甚至公开与人民共和国敌对。\n\n这种情况不容忽视。即使抛开政治分歧不谈，无论过去有何功绩，那些拒绝承认共和国有存在权利的人都应该被打击。目前，在德国同行的帮助下，我们的安全部门有两个主要任务：密切监管某些激进团体的内部组织措施，同时调查它们是否与境外势力有联系。\n\n在执行第一项任务的过程中，米哈伊洛·波洛兹的名字立刻引起了安全部门的注意。在盖特曼时期，波洛兹是地下行动的天才协调人，看来，如今他又一次参与了“革命”。他与著名斗争派人士列夫科·科瓦利夫一道，在波尔塔瓦地方议会中领导着一个势力颇大的左翼派系，在当地有着优良的行动基础。\n\n在第二项任务中，重点被放在了革命工人党和工民盟激进派上。我们怀疑，斯坦尼斯拉夫·柯西奥尔和拉扎尔·卡汉诺维奇（乌克兰语，即卡冈诺维奇）领导的乌革工“国际派”与俄罗斯社会主义者有联系。\n此外又有传闻称，以阿纳托利·皮索茨基和帕夫洛·赫里斯秋克为首的某些工民盟人士与巴黎有广泛的联系。鉴于我国地位不稳，德国的安全保障又至关重要，我们应该密切关注此类活动。"