  LAT_SOV_party_supremacy_desc: "革命工人党是联盟中的社会主义者们的唯一领导核心。工会、公社、红军、执法部门和所有机构都必须由党的官员控制，并确保他们自始至终的忠于马克思-列宁主义。"
  LAT_guide: "§M祖国卫队-游击队协会：行政权力受限§!（$authoritarian_democrat_coloured$）/§M祖国卫队-游击队协会：强人政治§!（$paternal_autocrat_coloured$）\n£white_dot 在处理曼陀菲尔的叛乱时不要相信社会主义者。\n£white_dot 完成国策§Y召开大会§!以开启事件链。\n£white_dot §a约束行政部门§!：选择不削弱立法机构，认清情况并让议会在利耶帕亚举行会议，让库雷利斯只担任总统，直到危机过去，要求议会批准政府的外交政策决定，不要让行政部门对议会拥有权力。\n£white_dot §P赋予行政部门权力§!：选择赋予总统不受限制的否决权，坚持议会唯一可以会面的地方是里加，修改并在宪法中规定库雷利斯是终身总统，让大将军继续控制外交政策，并让总统能够解散议会。\n\n§M拉脱维亚革命工人党：布尔什维克复兴§!（$radical_socialist_coloured$）/§M拉脱维亚革命工人党：拥抱工团主义§!（$totalist_coloured$）\n£white_dot 在处理曼陀菲尔的叛乱时向彼得斯和红军寻求帮助。\n£white_dot 在大会召开时悄悄逮捕彼得斯，在他逃跑时抓住他之前不要离开利耶帕亚。\n£white_dot $totalist_coloured$路线：在“分岔路口”事件中选择实施工团主义模式。\n£white_dot $radical_socialist_coloured$路线：在“分岔路口”事件中选择坚持布尔什维克的理想。\n§C注意：要重建苏维埃联盟，按§M布尔什维克重生§!路线进行游戏，当俄罗斯不存在时，重建苏维埃联盟的决议就会出现，拥有并控制莫斯科地区就可以完成该决议。§!"
  LAT_jekabs_peterss_totalist_leader_desc: "§Y生于：§!§L1886年12月3日；俄罗斯帝国、库尔兰省布林基§!\n§Y背景：§!§L$LAT_jekabs_peterss_desc_body$为达此目的，也为了促进与第三国际国家的一体化、确保拉脱维亚人民在世界上的地位，彼得斯在拉脱维亚革命工人党内部宣传革命工团主义和布尔什维主义的意识形态协调。§!"
  #MON
  MON_roman_ungern_sternberg_desc_body: "“疯男爵”罗曼·恩琴-施滕贝格的成长经历十分坎坷，搬家是家常便饭，1905年，恩琴在爱沙尼亚的家族庄园被焚毁。后来，恩琴进入圣彼得堡的巴甫洛夫军事学校学习，在那里他开始对佛教产生兴趣。毕业后他被调往西伯利亚，加入了伦宁坎普的哥萨克部队。1913年，他请求帮助蒙古从中国控制下独立，然而上级回绝了他的要求。随后，他搬到了外蒙的科布多，担任俄罗斯领事馆下属支队的一名军官。\n\n世界大战中，恩琴首先前往加利西亚作战，总共五次受伤，每次都不等伤口恢复就返回前线。随后他与朋友格里戈里·谢苗诺夫一起在弗兰格尔男爵麾下在高加索作战。俄罗斯内战爆发后，他与谢苗诺夫和其他白军在西伯利亚作战，以相对独立的身份对抗革命工人党。\n\n恩琴早在1918年就参与到了泛蒙古地区事务中，他抓住各种机会，试图参与进蒙古人与中国人的斗争。1920年，恩琴率领著名的亚洲骑兵师入侵蒙古并赶走了当地占领军，之后他又镇压了1921年和1924年的连续两次蒙人党叛乱。恩琴为人严谨，尊重蒙古传统，他正以摄政身份执政，等待着第九世哲布尊丹巴呼图格图成年的那一天。恩琴经验丰富，他非常偏好自己在顿河哥萨克服役期间学会的那套富有侵略性、凶猛无比而又计划充分的骑兵战术，并在亚洲骑兵师中将它加以完善。"
