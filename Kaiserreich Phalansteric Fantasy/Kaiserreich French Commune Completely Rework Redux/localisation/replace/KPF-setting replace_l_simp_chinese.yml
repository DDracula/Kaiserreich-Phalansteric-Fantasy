  #NOR
  norway_events.6.t: "挪威革命工人党的终结"
  norway_events.6.d: "由于未能充分利用当前经济危机，挪威革命工人党在今天自行解散，其成员加入了新建立的挪威国家工团党。基于贝尼托·墨索里尼和奥斯瓦尔德·莫斯利等政治家的新理论“极权主义”，该党希望追求比共产主义更远大的事物。"
  NOR_country_intro_content: "挪威正站在历史的十字路口上前。尽管国家看上去仍然相对繁荣，国内社会仍然被政治斗争和发展停滞所困扰。\n\n左派的内部的分歧导致了工党的分裂。1921年温和派脱离工党组建社会民主工党，激进的工团主义分子在1923年脱离工党组建挪威工团联盟。此外，挪威革命工人党正在苦苦挣扎，有谣言称他们即将按照国家工团主义原则组建新的极左翼先锋队政党。\n\n在政治光谱的另一端，有数个民族主义组织正在争夺权力和影响力。尽管他们在反对社会主义这个问题上是一致的，单他们的手段和目标是不一样的。\n\n虽然政治斗争没能导致内战，但执政的自由党少数派政府无力处理任何问题。战争的阴霾再次笼罩欧洲大陆，人民正在焦急地等待着1936年10月的选举。"
