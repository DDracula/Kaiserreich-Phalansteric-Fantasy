  GUA_guide: "§M自由联邦党§!（$authoritarian_democrat_coloured$）/§M进步自由党§!（$paternal_autocrat_coloured$）\n£white_dot 在事件“311人之信”发生时，不要准备选举，以确保奥雷利亚纳与§a自由联邦党§!掌权。\n£white_dot 或者，准备选举以让乌维科与§P进步自由党§!发动政变推翻政府。\n£white_dot 在事件“开场的战略”中选择“专注于根除首都的反对派”。\n£white_dot 在事件“选择目标”中选择“他们会像苍蝇一般坠落，向克察尔特南戈进军！”。\n£white_dot 这样我们便能赢得内战，确保我们的统治。\n\n§M革命工人党§!（$radical_socialist_coloured$）/§M统一党§!（$social_conservative_coloured$）/§M国家革新党§!（$social_democrat_coloured$）\n£white_dot 在事件“开场的战略”中选择“保卫临时边境，不能丢失一寸领土！”。\n£white_dot 在事件“选择目标”中选择“他们会像苍蝇一般坠落，向克察尔特南戈进军！”。\n£white_dot 这样§S国家革新党§!便能赢得内战。\n£white_dot 在选举中选择你心怡的政党。\n\n§M联合果品反革命§!（$paternal_autocrat_coloured$）\n£white_dot 在事件“开场的战略”中选择“保卫临时边境，不能丢失一寸领土！”。\n£white_dot 在事件“选择目标”中选择“他们会像苍蝇一般坠落，向克察尔特南戈进军！”。\n£white_dot 这样§S国家革新党§!便能赢得内战。\n£white_dot 在选举中选择§R危地马拉革命工人党§!或§S国家革新党§!其一。\n£white_dot 在事件“反革命！”中让乌维科击败政府。"
  #GXC
  GXC.earlygame.310.d: "虽然中国的社会主义运动很大程度上受到俄式布尔什维主义、克鲁泡特金的无政府主义及法式工团主义的影响，但张东荪却被英式行会社会主义所吸引。起初，张东荪追随大众民主，并在新生民国中推广着此类主义。然而，袁世凯独断专行，促使张东荪改变了对民国支柱的看法，转而寻求建立一个强大的现代国家。张东荪对源自费边社的国家社会主义产生了兴趣，费边社基于工人阶级的生存条件驳斥了资本主义，并主张通过国有制和社会立法来推行集体主义。\n\n张东荪之所以对费边主义特别感兴趣，是因为其所蕴含的政治精英主义，这种精神伴随了他整个政治生涯。民国初年的混乱令张东荪、梁启超和张君劢认为要像他们这样的现代知识分子来领导政治改良。1920年，伯特兰·罗素应梁、张二人之邀前往中国，张东荪终于转向了行会社会主义。罗素写道，社会主义国家如果累积了太多权力，便会发展出暴政，并批评俄国的布尔什维克革命只造成了革命工人党专政，而非无产阶级专政。\n\n而张东荪同样批判俄国革命，赞扬了罗素提倡的温和的社会主义，并褒奖了产业工会与国有制之间的平衡，以此来去确保劳工的最大自由，在鼓励劳工参政的同时，也要对他们施加必要的约束。罗素最终放弃了在中国实现行会社会主义的希望，这令张东荪认为罗素未能正确认识中国。张东荪与西方正统理论割席后，开始发展自己的、适应中国国情的行会社会主义，以证明其在中国的可行性。"
  GXC.lategame.567.d: "为了向党内左派表明自己立场并完善政治修辞，胡汉民决定在广州向包括南京方面在内的全体国民党发表演讲。胡汉民在演讲中说：“兄弟在法国的时候，接见了世界各国社会主义党不少，他们所问我的问题，我都能答复到使他们满意，我做的文字，在法国各大城市的报纸发表的都不下十几万言，但是有一回和日本革命工人党领袖之一的片山潜谈话，他问我一个问题，我就实在无法可答。”\n\n“他说：‘中国国民党为什么要分左右派？你们有两个人在一起就要分左右，分到剩一个人了还要分左右手，难道左右手也要拼起来，连一个人都要拼完么？’我听了这句话，我真是欲哭无泪了，教我如何能够回答他。武装同志，我们国民党的左右是我们自己分的，还是中国工团党给我们分的呢？”\n\n“我们的党是革命的，我们的党员是革命的，我们的革命军尤其是革命的，我们是整个的革命力量。我们之所以不能任人分割，犹之乎我们的肚皮里头不能给人跨进来跨出去。”\n\n尽管胡汉民的语气颇为和解且似乎有些遗憾，但许多人认为，胡汉民的这次讲话是在间接指责汪精卫对国民党的分裂领导以及无政府主义与工团主义的阴谋。其他人则因他们对中国工团主义者同盟的看法感到愤怒。离开讲台时，胡汉民对自己的演讲非常满意，他既完善了自己的修辞，又对南京方面表达了自己的立场。"
