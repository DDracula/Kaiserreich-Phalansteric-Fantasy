  #POR
  POR_totalist_party: "葡革工(拉特斯派)"
  POR_totalist_party_long: "葡萄牙革命工人党(拉特斯派)Partido Revolucionário dos Trabalhadores Português (Rates)\n§L1926年，葡革工前总书记若泽·卡洛斯·拉特斯被驱逐出党，只因其拒绝与工团派领导的总工会合作。尔后，他带着分裂出去的人们成立了新党，继续坚定不移地反对同无政府主义者合作。在老一辈的革命工人党员中，拉特斯仍是个有头面的人物，旅法期间接受了诸如修正主义、民族主义和极权主义思想的熏陶。拉特斯若夺还了革命工人党的领导权，很可能会对那伙赶他下台的左翼施加报复，然后按技术官僚制施行社会主义制度，于国内与国外双面保卫革命果实。§!\n"
  POR_syndicalist_party_long: "工会统一战线委员会(Comité de Unidade de Frente Única)\n§L由在若泽·德·索萨联合下，革命工人党与工会组成了工会统一战线委员会这个社会主义团体，其成员于1930年总罢工后要么遭到大规模逮捕，要么流亡至巴黎。劳工总联盟（简称总工会）与葡萄牙无政府主义者联合会本是两个密切相关的组织，共同撑起了统一战线的工团派别。总工会名义上由正在狱中的曼努埃尔·若阿金·德·索萨领导，驻巴黎代表则是若泽·德·席尔瓦·桑托斯·阿拉尼亚，该组织被认为是葡萄牙境内最具战斗性的革命组织，面临着里斯本政府雷厉风行的镇压。葡萄牙无政府主义者联合会则是伊比利亚无政府主义者联合会的支部，乃是总工会之外的另一政治表现。尽管德·索萨支持伊比利亚大团结，可总工会内部不少人对其要么保持怀疑态度，要么公开表露敌意。§!\n"
  POR_radical_socialist_party_long: "工会统一战线委员会(Comité de Unidade de Frente Única)\n§L由在若泽·德·索萨联合下，革命工人党与工会组成了工会统一战线委员会这个社会主义团体，其成员于1930年总罢工后要么遭到大规模逮捕，要么流亡至巴黎。葡萄牙革命工人党在君主制复辟以来一直艰苦斗争，在本托·安东尼奥·贡萨尔维斯的领导下与无政府派以及工团派达成合作，但党内的若泽·卡洛斯·拉特斯却对两派保持敌意态度。革命工人党以实用主义来妥协革命，希望统一战线策略能顺利发扬光大。工人协会社会主义联合会代表了统一战线中那些社会主义工会的温和派，他们不那么激进，因而仍存于葡萄牙国内。但规模太小，仅发挥中介总工会与葡革工的作用。§!\n"
  #PRF
  PRF_radical_socialist_party_alternative: "印度革命工人党"
  PRF_radical_socialist_party_alternative_long: "印度革命工人党(Revolutionary Workers' Party of India)"
  princely_federation_events.348.d: "尼扎姆目前在联邦不受欢迎，就如同俄罗斯人对《布列斯特-立托夫斯克条约》愤愤不平一样。尼扎姆屡次否决政府的核心政策，而且他否决的是一个得到全国大多数选民支持、通过选举上台的政府，这导致尼扎姆精心打造的国家救世主形象正在迅速消亡，其消失速度甚至比提斯塔河（提斯塔河因流速快、冲刷两岸而闻名）周围的土地还要快。\n\n由于尼扎姆民望日益下降，社会主义残余势力在残存的印度革命工人党周围重组了起来，并形成了一支规模可观的势力。这些社会主义者旨在推翻尼扎姆政权，并推行尼扎姆一直阻挠的改革。虽然在通常情况下，这支社会主义势力不会有太大影响力，只会和其他异见分子一同遭到镇压，但关于全印度大议会出于对尼扎姆的愤怒而与这些反叛势力展开合作的谣言现已开始流传。\n\n由于担心拉奥可能很快就会投奔这场潜在的叛乱，拉兹维和他麾下的拉扎卡尔民兵纷纷表示，只需尼扎姆一声令下，他们将立即逮捕拉奥并消灭这些社会主义分子。至于尼扎姆是否愿意采取镇压行动，目前仍不得而知……"
  princely_federation_events.349.d: "虽然拉奥或许在私下里对尼扎姆的越权行为表达过愤怒，但直到有人将尼扎姆下令逮捕他的消息泄露给拉奥，他才开始考虑发动叛乱。尼扎姆的逮捕行动几乎立刻就将拉奥推向了叛军的怀抱，在拉奥政府的推动下，全印度大议会和印度革命工人党迅速联手并煽动起了一场叛乱。由于奥斯曼如今声望扫地，很少有人愿意伸出援手，大部分军队也都站在拉奥政府一边反对奥斯曼。拉扎卡尔民兵迅速溃败，拉兹维至今仍下落不明。\n\n尼扎姆及其家人在预见到形势不妙后，现已乘飞机逃走，但尚未有人知晓或确认尼扎姆流亡的具体地点。与此同时，在国内，拉奥及其新盟友迅速抓住这一势头，宣布成立共和国。拉奥宣誓就任总统，印度革命工人党领导人P·克里希纳·皮莱则出任新任国家底万。王公议会也被解散，在政府与王公谈判后，王公治下各邦被允许继续作为联邦成员存在，但王公的权力较之前有所削弱。\n\n虽然随着尼扎姆的倒台，局势似乎迅速稳定了下来，但没人能预测新共和国未来将走向何方，许多王公仍在担心，一旦革命工人党获得足够的影响力，那他们的好日子就要到头了。不过就目前而言，大多数人都沉浸在摆脱暴君尼扎姆的喜悦中，还没有被对未来的担忧所困扰。"
  #PUE
  PUE_totalist_party: "革命工人党"
  PUE_totalist_party_long: "波多黎各革命工人党(Partido Revolucionario de los Trabajadores de Puerto Rico)"
  puerto_rico_events.206.d: "出于对社会党新的“阶级叛徒”政权感到失望，党内规模更小、更为左翼的许多成员抛弃了我们，转而组建自己的组织或加入现有的包括革命工人党在内的各组织。博利瓦尔·帕甘·卢卡谴责激进派抛弃了党，作为报复，他用政府的赞助成立了新的工会联合会波多黎各劳工联合会(FPT)，与岛上的劳工总联盟(CGT)与自由工人联合会(FLT)竞争。此举拯救了我们，让我们的情况不至于滑向更糟，忠于社会党和政府的工会很快就转向了新的劳联，但我们仍然失去了较多支持。"
  PUE_cesar_andreu_iglesias_leader_desc: "§Y生于：§!§L1915年7月31日；美利坚合众国、波多黎各领地庞塞§!\n§Y背景：§!§L塞萨尔·伊格莱西亚斯·安德鲁从波多黎各大学获得社会科学学位后开始了他的政治生涯，他开始为波多黎各革命工人党的报纸《真理》(Verdad)撰写文章。到这个阶段，塞萨尔已入党多年，但随着他的作品开始流行，他的声望超过了似乎颜面无光的党内领导层。随着外国占领者接管波多黎各并意图将权力交给一个特殊的社会主义政权，塞萨尔因其反帝国主义和不惜一切代价追求平等的言论，以及作为一名优秀的临时总统的相对政治专长而被立即推荐。时间将给出答案，选择这名年轻作家的决定是使波多黎各变得更美好，还是将它推向向他国利益屈服的深渊。§!"
  #RUS
  RUS_totalist_party: "俄革工(布)"
  RUS_totalist_party_long: "俄罗斯革命工人党（布尔什维克）(Rossiyskaya Revolyutsionnaya Rabotnicheskaya Partiya (bolshevikov))\n§L起初，在弗拉基米尔·列宁激情四射的领导下，布尔什维克的大名响彻全国，还有希望最为渺茫、处境最为凄凉的阶层给予其支持。但爬得越高、摔得越惨，同为社会主义盟友的他们在苏维埃内刀枪相向，“红色恐怖”成了他们的代名词，而包括列宁本人在内的许多人也在革命斗争中献身。\n\n那些得以逃脱白军报复的布尔什维克残部齐聚巴黎，在雅科夫·斯维尔德洛夫的领导下重整旗鼓，随后便投身于世界各地的革命中。在斯维尔德洛夫治下，该党以列宁著作为纲，并对西方革命模式持批评态度。虽然党内充满分歧、派系林立，还在俄国国内实力大减、饱受诋毁，但党的核心仍然忠于革命事业。§!\n"
  RUS_syndicalist_party_long: "全俄罗斯工会中央理事会(Vserossiysky Tsentralny Sovet Professionalnykh Soyuzov)\n§L在革命工人党几近在俄国政坛上绝迹之后，那些不想加入激进民主党的孟什维克和与中央委员会失去联系的布尔什维克最后选择依靠激进工会活动。尽管屡屡触及法律的底线，但俄国革命的核心得以通过草根劳工运动的方式保持着活力。随着共和国局势愈发不稳，工会内的社会主义者也变得愈发大胆，最后成功在俄罗斯工会中央组织中占据了多数。§!\n"
  RUS_totalist5_party_long: "$RUS_totalist5_party_long_tt$\n§L季诺维也夫的共产主义派系成功接管全俄劳联后，他成功说服俄罗斯革命工人党（布尔什维克）放弃党争，联合起来共同追求世界革命。尽管雅科夫·斯维尔德洛夫试图阻止，但被赶下了台，最终由前流亡布尔什维克、新领导人米哈伊尔·伏龙芝组织了这次合并。随着全俄劳联吸收了流亡的俄革工(布)，共产主义者自此合流为一个组织，结束了数十年的分裂，列宁的追随者们再次团结了起来。§!\n"
  RUS_bolshevik_gamble_event_tt: "我们将运用§o格里戈里·季诺维也夫§!所拥有的全部影响力来尝试接管§o俄罗斯革命工人党（布尔什维克）§!。"
  russia_events.127.d: "在内务部部队的领导，斯沃博德尼克志愿军和当地警察的协助下，俄罗斯多个城市展开了对工会活动人士的大规模逮捕活动。根据《国家保卫法案》，当局拥有调查、逮捕和惩戒革命工人党人与一切潜在共产主义同伙的能力。\n\n而其中最大规模的行动目标是彼得格勒中的全俄工会中央理事会，许多成员早已逃亡出去躲藏起来了。虽然理事会的中央机关早就被查禁了，但执法部门也心知肚明，他们不过是转入地下继续领导了——而这种情况今天就会结束。为了证明这场大规模迫害的合法性，同时当局也发起了一场名为“针对布尔什维主义的最终指控”的新闻运动。\n\n最严重的冲突发生在普梯洛夫工厂，该处工人试图反抗逮捕，打伤了二十余人送去住院治疗。其后总共有数十人遭到枪杀，数百人被打去住院或是逮捕，而劳工领袖也遭到了追捕。俄罗斯各地都爆发了声援的抗议和罢工，但很显然，在这样的迫害下，合法的工会几乎都被消灭了。\n\n基于此，许多人也只想苟且偷生，只要这样的暴力不影响自己就可以了。鉴于理事会中有不少前红军成员，保卫联盟认为如今对他们的监禁不过是内战时欠下的，久久迟到的正义——他们只是在以前宪民盟-社革党政府的网开一面之下才逍遥法外。"
  russia_events.263.d: "在单一党组织的控制下精简内务安全机构是一个任重道远的目标。在过去的政府中，执法松懈怠慢，革命工人党人得以横行。在新的总统法令下，国家卫队（简称Gosstrazha，全称Gosudarstvennaya Strazha）将被扩大为一个集管辖边防、执法和秘密警察为一体的综合安全机关。同样，国家卫队还将挑选出最忠诚的俄罗斯人，宣誓只对元首本人效忠，以此承担起保卫总统与党领导层的职责。萨文科夫任命曾担任保卫部主管的弗列贡特·克列皮科夫为国家卫队主管。克列皮科夫主管刚走马上任就开始人员调动，以此确保组织的效率与忠诚。\n\n而国家卫队的权限范围问题也令军方担忧。有人建议把特殊的军事地区，比如北高加索或者未来解放的其他领土交给国家卫队管辖。这样，军队可以专心对付外部的敌人，而把后方交给卫队来安心打理。然而，这实际上也让其从一个安全机构扩编成为了元首及其拥趸直接指挥的彻头彻尾的“影子军队”。这引发了不少军方领导层对于人力和资源低效使用的忧虑——不过他们比较爱惜自己的小命，所以从来没敢明说。"
  russia_democratic_events.27.d.soc: "重生的共和国继承了另一种契卡的局面。革命工人党人面临的内部抵抗越多，全俄政保局的规模就越大，自然，其他安全机关就大大缩减了。可以说这帮人中许多并非顽固的社会主义者，而我们必须借助赦免他们才能重建安全部队。\n\n话虽如此，极左派渗透安全机关也是灾难性的。毕竟，我们承受不起第三次俄国革命了。"
  russia_democratic_events.47.d: "《革命工人党人入主克里姆林宫！》，令人不安的右翼媒体头版散播着对新内阁的恐慌，紧张的情绪很快便传染到国家杜马。新任总理[GetSecondInCommand]已经因其在政治事务上的素人表现饱受抨击，更糟的是他手底下的两位部长也正越发地不被杜马所容：一位是前孟什维克、现社会革命党人，出任教育部长的亚历山大·叶利亚舍维奇；另一位更是重量级，现担任工业与贸易部长的工会主义和社会主义者丹尼尔·苏利莫夫。\n\n总理辩称，里希特政府需要左翼社革党和激进民主党的支持，而部长的人选也正是基于这一考量，事实证明，两人都是俄罗斯民主的坚定支持者，但右翼人士却对此视而不见。政府在第一次不信任投票中险胜，许多右翼社革党人在投票中弃权。"
  russia_democratic_events.53.d: "全俄罗斯工会中央理事会代表大会公布了他们的十三项要求，并宣布其所有成员工会都将开始罢工，直到政府证明自身是一个真正的“工人政府”并接受他们的方案为止。劳工部长鲍里斯·别拉茨基一直愿意与他们进行谈判，但实际上，全盘接受这些要求等于向革命工人党投降。\n\n这十三项要求中有些内容还算合理，如要求改善工资与工作环境。但其他要求还包括赦免被关押或流放的布尔什维克、将共产主义政治活动全部合法化等。为了声援他们的要求，金属工人工会、码头工人工会和其他一些无名小工会在俄罗斯各地发起了罢工。\n\n蒂托夫本人简称，接受全俄工会中央理事会的要求只会让他们得寸进尺。而且相比于全俄工会中央理事会，在选战中获胜的激进民主党更能代表“全俄罗斯工人”。"
  russia_democratic_events.54.d: "血染街头！内务部长、社会革命党员皮季里姆·索罗金一直在允许罢工和控制局面二者间寻找平衡，迄今为止，他已经尽力确保了俄罗斯大部分地区的和平——但在今早的彼得格勒海军部造船厂，当革命工人党人试图强迫其他工人离开造船厂时，一场械斗还是爆发了，共产主义罢工者与不愿罢工的社会民主党工人间的冲突随后演变成了与警方的冲突，事件造成7人重伤，2人死亡。\n\n事后，彼得格勒法院裁定，警方使用武力制止暴力的行为完全合法，虽然不幸造成了人员伤亡，但不会以故意杀人罪起诉这些警员。而14名共产主义者和5名社会民主党人则因袭击、互殴和拒捕被判刑。\n\n这起“海军部造船厂案”只会加剧紧张局势。全俄工会中央理事会下属的报纸已经开始抨击蒂托夫政府，尤其针对索罗金对警察的处理方式，谴责这个“假社会主义”政府只是资本家和反动派的狗腿子。"
  russia_monarchist_events.13.d: "经过政府的大力游说，最高法院最终裁定将共和复兴联盟归类为“与共产主义结盟的组织”，并判决予以取缔。法院援引的理由是，像谢尔盖·梅德韦杰夫和亚历山大·什利亚普尼科夫这样的革命工人党人士在复兴联盟内担任高层职位，而复兴联盟既无能力也无意愿将这些人清除出组织。\n\n警方随后展开了一系列协调一致的突袭行动，查封了复兴联盟的会员档案、印刷设备以及资金。尽管大部分高层都被逮捕，但对许多人的指控却缺乏确凿依据。针对“密谋推翻宪法”的指控，在能证明有实际共产主义关联的情况下，法院才允许相关诉讼，这使得复兴联盟的大部分高层最终得以无罪释放。\n\n尽管如此，共和复兴联盟作为一个组织的瓦解，以及其最左翼成员的被捕，仍然为我们争取了一些喘息空间。然而，可以预见，共和派反对势力如今的怨恨必然愈发炽烈。"
  russia_socialist_events.4.d: "在经历了长期的非法查禁和政治迫害后，俄罗斯的社会主义者终于可以自由地组织政治活动了。尽管大多数社会主义者加入了列维茨基领导的全俄劳联，或继续忠于社会革命党的事业，但仍有许多小型政党陆续成立。\n\n在“旧共和国”政党中，唯一仍保有影响力的是泽勒领导的社会主义民主同盟。社民盟主要是遭受过大幅削弱的激进民主党重组而成，激进派离开后，其吸纳了一些来自右翼的新成员，他们希望通过该党推动更保守或温和的议程。\n\n另一个重新崛起的老牌政党是复兴的俄罗斯革命工人党（布尔什维克），其中央委员会在斯维尔德洛夫的领导下从流亡中回归。然而，这个党派的力量已远不及当年的辉煌时期。托姆斯基以及其他涉足俄国工会主义运动的布尔什维克没有回归，而是选择加入全俄劳联以寻求更大的政治影响力，这进一步削弱了布尔什维克的力量。布尔什维克并不特别受欢迎，各政党间还达成了一项非正式协议，避免让布尔什维克接触关键权力职位。\n\n与此同时，还有数十个围绕左翼知名人物或边缘意识形态（如无政府主义、妇女权益）成立的小党派。这些小党派和独立议员中还包含大量并非真正信奉社会主义、只是在表面上追随的成员。虽然这些小党派单独影响有限，但确实在代表大会中组成了一个相对庞大的少数派集团。"
  russia_socialist_events.31.t: "俄罗斯革命工人党"
  russia_socialist_events.31.d: "在雅科夫·斯维尔德洛夫和米哈伊尔·伏龙芝的领导下，老布尔什维克已经在俄罗斯建立起自己的政党。尽管他们的选举前景尚未明朗，但伏龙芝在彼得格勒的集会已经引发了广泛关注。在集会上，他对俄罗斯人民高喊所谓“在这座革命圣城”云云，对过去的历史事件丝毫没有表现出悔意或遗憾。他详尽讲述了自己与同志们在各地游历中对共产主义本质的领悟：从新法兰西的法伦施泰尔，再到红色伯明翰和巴塔哥尼亚草原的激战。\n\n这些经历直接启发了俄国布尔什维克革命工人党新政治纲领《怎么办？》的形成。这份纲领揭示了一场虚假的革命，在这场革命之后，自由派和资本家依然逍遥法外，现出“工人的”代表的双重面孔。那些杜马里的“香槟社会主义者”，以及过去二十年间在文学俱乐部里消磨时光的社民党分子，早已背离了真正的社会主义道路。而斯皮里多诺娃呢？是的，她的党派确实战斗过，但彼得格勒的人民绝不应被蒙蔽，比起关心你们，她更关心自己心爱的宝贝农民。在当年，只有列宁真正关心过你们，而现在，也只有列宁的追随者依然在乎你们！"
  russia_socialist_events.35.d: "被告：俄国革命工人党（布尔什维克）前成员\n指控：--------\n\n斯维尔德洛夫同志始终保持冷静，而伏龙芝则在酒醉后大发雷霆。少数人拒捕，有些已经逃亡，有些已经死亡。\n\n在内战期间幸存下来的布尔什维克高层被押送至人民法庭，面对一系列严厉指控。其中之一是他们在镇压社会革命党抗议时，谋杀了数百名左翼社革党成员——据称许多命令来自斯维尔德洛夫。此外，布尔什维克高层还被控对人民实施恐怖统治，滥用职权，在没有正当理由的情况下，杀戮、拷打并监禁俄国劳动人民及其他社会主义者。审判现场混乱不堪，指控繁多，被告人数众多，但在社会革命党和全俄劳联右翼的强烈要求下，审判仍如期进行。\n\n大多数被告坚称自己无罪，有些人被判无罪释放。然而，高层，尤其是斯维尔德洛夫，遭到了人民检察官的严厉追究。在长达一个月的马拉松式审判中，检察官逐步构建了证据链条，试图证明列宁的核心圈子有意下令屠杀数千人。尽管这些领导人的目标可能带有崇高理想，但他们的手段却异常残忍。虽然案件细节在当时的混乱局势下显得模糊不清，但证人众多，证据充分。\n\n陪审团最终裁定大多数被告有罪，并判处他们长期苦役，这一结果并不让人意外。布尔什维克的多数高层将在接下来的十多年里，从事采矿和伐木的劳役来赎罪。审判结束后，当这些被告被押解出法庭时，法院外还爆发了一些同情者组织的抗议活动。"
  russia_socialist_events.39.d: "本周，位于巴什基里亚的小村庄下阿夫江成为了所有新闻的焦点。前不久，别洛列茨克人民民兵获悉，19岁的全俄劳联活动家兼工程专业学生伊万·谢尔盖耶维奇·茹连科失踪——后来发现他已遇害。茹连科是莫斯科人，曾积极志愿前往乌拉尔农村担任人民教师。\n\n事情的来龙去脉仍有待调查，但茹连科组织当地工人并成立马克思主义读书会的尝试似乎遭到了敌视。在一小群武装农民解散读书会后，茹连科拒绝离开，几天后在路边被发现时已被斧头砍死。三天后，凶手浮出了水面——现年52岁的农民、退伍军人伊戈尔·伊戈列维奇·别洛夫。被捕时，他大吼大叫，反复高喊“你们革命工人党人都该被枪毙”。\n\n各大社会主义报刊对这起案件的报道方式掩盖了悲剧的真相。这些报刊将别洛夫同志描绘成典型的农民形象，无知且粗野。与此同时，高举茹连科同志照片的抗议活动则要求严惩这个“杀童者“。以强硬派马克思主义者伊万·格龙斯基为中心的杜马派系呼吁采取更加严厉的措施以平定农村，并要求今后除了教师外，还要派遣忠诚的民兵陪同他们。"
  russia_socialist_events.183.d: "俄罗斯官方支持斗争派迟早会对俄乌关系产生重大影响。上周，哈尔科夫拖拉机厂钢铁工人的罢工演变成了混乱，警方被派去平息抗议活动。\n\n革命者迅速采取行动，斗争派和乌克兰革命工人党武装了钢铁工人，并做好了应对即将到来攻击的准备。乌克兰政府意识到形势严峻，并决定出动军队；但主要的防御组织者已成功越过边境逃往别尔哥罗德。\n\n此后又发生了一系列重要事件。斗争派运动随即被宣布为非法，理由是该运动是一个由外国势力资助的恐怖组织，旨在推翻政府。[202.GetName]方面试图传唤俄罗斯大使，并要求引渡共产主义罪犯回国受审。\n\n最终，乌方没有收到任何回复，我们与那些工人阶级压迫者没什么可谈的。作为回应，乌方选择断绝与俄罗斯的所有外交关系。[202.GetName]方面会如此行动早在意料之中，但他们无疑凸显了欧洲的紧张局势正在失控，鲜有人愿意拯救这片大陆免于不可避免的毁灭。"
  russia_socialist_events.404.d: "格里戈里·季诺维也夫同志是一位充满激情的国际主义者，显然是代表俄罗斯出席第三国际会议的不二人选。凭借他在世界社会主义运动中的人脉，全俄劳联得以成为唯一的俄罗斯代表。在最近的一次会议上，《极权宪章》签署者相关的话题引起了热议，与会者纷纷质疑他们与国际社会主义的一致性。随后，季诺维也夫登台发表演讲，他提醒代表们，布尔什维克呼吁在组织、理论和纲领上严格统一，如此共产国际才不仅是一个宣传协会，而是一个在不同国家拥有分支机构的单一革命工人党。如今，新的第三国际未能保护自己免受修正主义、社会爱国主义和小资产阶级的影响。虽然季诺维也夫这番话在针对谁已经非常明显，但他还是明确谴责了“左翼共和派”和“莫斯利派”倾向，这引起了许多代表的骚动，经过一段时间才平息下来。季诺维也夫明确指出了造成这种情况的原因——纪律松懈；对民主形式的盲目尊重，为此甚至不惜损害无产阶级的利益；以及对那些策略和行动上公然反对革命无产阶级的政党过于宽容。\n\n季诺维也夫的演讲在第三国际全会上引起了轩然大波，会议一结束，代表们之间就爆发了激烈的争论。工团主义者和一些共产主义左派对季诺维也夫深表赞同。许多左派和中间派则颇感震惊困惑，觉得自己受到了牵连，其他人则驳斥了这种强硬的反民主论调，称其为“极权主义反对极权主义”。《极权宪章》签署者也作出了严厉回应，谴责季诺维也夫是个一心想要遏制民族自治的极左狂人。然而，最激动的当属全俄劳联的其他代表，季诺维也夫未经协商就发表了如此大胆的声明令他们倍感愤怒。不久之后，莫斯科便收到了一封谴责季诺维也夫并等待[ROOT.GetLeader]回复的电报。"
  russia_flavour_events.55.d.szrs: "内战结束后，俄罗斯不得不面对过去的种种血腥事件。究竟是什么导致了我们对彼此犯下的累累暴行？一夜之间，布尔什维克变得声名狼藉，绝大多数的社会主义者都开始争夺反布尔什维克急先锋的名号，试图证明自己最先站在历史正确的一方。而像瓦西里·马克拉科夫和维克托·切尔诺夫这类主张宽恕与和解的人，则在20世纪20年代初期沦为了少数派。紧随而至对一切沾染共产主义色彩的报复性清洗，给俄罗斯共和国的合法性与自由名声留下了污点。\n\n时间转眼来到20世纪30年代，许多的前革命工人党高层诸如阿列克谢·李可夫均已刑满释放，尔后他们加入了激进民主党。尽管总统马克拉科夫试图缓和局势，但左右两翼之间的鸿沟仍在不断加深。保卫祖国与自由联盟战斗队在光天化日之下刺杀革命工人党人，而潜伏在地下的社会主义激进分子则时刻伺机予以还击。正是在这一充斥着暴力的背景下，保卫联盟迅速崛起，最终于1934年将萨文科夫推上了总统宝座。\n\n历史教科书被篡改得面目全非，以体现所谓的“白卫史观”——即布尔什维克起义并非仅是一场普通的起义那么简单，而是一场国际阴谋的产物，这些人妄图彻底摧毁神圣的俄罗斯，使其永无翻身可能。国际阴谋集团负责给布尔什维克党提供资助，支持他们在俄罗斯中部的起义，若不是最后用武力将起义镇压了下去，这场起义最终将会使整个俄罗斯支离破碎。这些教科书特意提到了弗拉基米尔·列宁是被德国人送回彼得格勒这一事实，并强调布尔什维克党的许多主要成员都并非俄罗斯人——而是高加索人、波罗的人、波兰人尤其是犹太人。"
  russia_flavour_events.55.d.lib: "内战结束后，俄罗斯不得不面对过去的种种血腥事件。究竟是什么导致了我们对彼此犯下的累累暴行？一夜之间，布尔什维克变得声名狼藉，绝大多数的社会主义者都开始争夺反布尔什维克急先锋的名号，试图证明自己最先站在历史正确的一方。而像瓦西里·马克拉科夫和维克托·切尔诺夫这类主张宽恕与和解的人，则在20世纪20年代初期沦为了少数派。紧随而至对一切沾染共产主义色彩的报复性清洗，给俄罗斯共和国的合法性与自由名声留下了污点。\n\n时间转眼来到20世纪30年代，许多的前革命工人党高层诸如阿列克谢·李可夫均已刑满释放，尔后他们加入了激进民主党。尽管总统马克拉科夫试图缓和局势，但左右两翼之间的鸿沟仍在不断加深。保卫祖国与自由联盟战斗队在光天化日之下刺杀革命工人党人，而潜伏在地下的社会主义激进分子则时刻伺机予以还击。正是在这一充斥着暴力的背景下，保卫联盟迅速崛起，最终于1934年将萨文科夫推上了总统宝座。\n\n在萨文科夫政权统治下，历史教科书被篡改得面目全非，以体现所谓的“白卫史观”。他们鼓吹布尔什维主义是犹太人、德国人还有少数族裔所编制的国际阴谋网络中的一环，其最终目的是彻底摧毁俄罗斯。但在更为理智的政权重执权柄后，这些阴谋言论很快便被取缔。虽然我们彼此之间对内战的史观仍然存在着巨大分歧，但我们必须公正地向人民教授国家的历史——时刻提醒俄罗斯人民不要重蹈覆辙，避免让革命的血泪悲剧再度重演，永远警惕共产主义的幽灵。"
  russia_flavour_events.95.c: "“那句话怎么说来着？何苦要在我们国家当个革命工人党人呢？”"
  RUS_yakov_sverdlov_leader_desc: "§Y生于：§!§L1885年6月3日；俄罗斯帝国、下诺夫哥罗德省下诺夫哥罗德§!\n§Y背景：§!§L雅科夫·米哈伊洛维奇·斯维尔德洛夫出生在下诺夫哥罗德的一个犹太家庭。其父替地下革命组织匿藏武器，并且支持子女的革命观点。受其家庭背景影响，斯维尔德洛夫的选择毫不出奇，他在1902年加入了社会民主工党，后来在党分裂时支持列宁的布尔什维克。\n\n斯维尔德洛夫参与了1905年革命，最终遭逮捕并被关进叶卡捷琳堡的监狱。此后十年间他都在牢狱和流亡中度过，而他坚持阅读学习马克思、列宁和考茨基等人的著作。二月革命后，他抓住机会返回彼得格勒，成为布尔什维克的核心人物。他在十月革命和内战中发挥了不可或缺的作用，例如一手操办了对沙皇的处决，并开展了广泛的革命恐怖，获得了“黑魔鬼”的绰号。\n\n列宁遇刺后，斯维尔德洛夫成为布尔什维克领导团体三驾马车中的首要人物，最终成为了流亡巴黎的俄罗斯革命工人党（布尔什维克）残余势力的领导者。斯维尔德洛夫是一位至死不渝的列宁主义者，他有一则著名论调——法国的各个政党和工会罔顾革命团结、一意争夺权力，致使他们的社会主义国家正朝着“官僚宗派主义”蜕变。不过，他的政党也难称团结。\n\n米哈伊尔·伏龙芝与格里戈里·季诺维也夫都曾试图挑战斯维尔德洛夫的领导权，以季诺维也夫为首的分裂派别最终于1931年造成了党的分裂。社会主义俄罗斯重建后，斯维尔德洛夫将他的政党定位为真正的革命者，即反对列维茨基“掺水共产主义”的人。就个人而言，斯维尔德洛夫更像一名组织家而非煽动家，他明白老布尔什维克的力量在于他们的人脉和军事经验，而他们的目的是继续高举列宁思想的火炬——这一点无比重要。§!"
  RUS_grigory_zinovyev_leader_desc: "§Y生于：§!§L1883年9月23日；俄罗斯帝国、赫尔松省叶利沙维特格勒§!\n§Y背景：§!§L格里戈里·叶夫谢耶维奇·季诺维也夫满腔热忱，他需要证明和纠正很多事情。季诺维也夫是一位深谙马克思主义的布尔什维克高层，自俄社民工党分裂以来便一直是列宁的亲密盟友。他虽外表文静瘦弱，但很快便证明了自己是一名精明强干的鼓动者和演说家，总能给人带来惊喜。然而，无论是受到了加米涅夫谨慎性格的影响，还是他那敏锐的政治直觉预料到了武装起义的结局，总之他强烈反对发动十月起义。不过，他的反对并不是出于对抽象民主原则的尊重；无论如何，他都会不惜一切代价以维护无产阶级的权力——他只是认为革命注定会被粉碎，布尔什维克最好等待时机，增强实力，并赢得潜在盟友的同情。他在内战期间仍然忠于列宁，布尔什维克冒险行动的失败证明了他的先见之明。后来，他与斯维尔德洛夫一道被迫流亡。\n\n抵达巴黎后，季诺维也夫很快就和斯维尔德洛夫在斗争策略问题上产生了严重的分歧。斯维尔德洛夫始终是一名鼓动家，反对季诺维也夫的谨慎策略，并为1917年的鲁莽起义辩护。1931年，季诺维也夫脱党前往英国，在那里与达特的先锋派和潘克赫斯特派建立起联系。不久后，他便重拾信心回到了俄罗斯，并在全俄劳联内部组建了一个小规模的革命工人党。如今，他已成为全俄劳联的领导人。他汲取了列宁和普列汉诺夫的教训，他的雄心壮志超越了对“民主制度”的迷恋。他深知一切都要以时间、地点、条件为转移，革命的利益——便是最高准则。除此之外，无产阶级领导权也必须得到保证。§!"
  RUS_sergey_syrtsov_advisor_desc: "§Y生于：§!§L1893年7月17日；俄罗斯帝国、叶卡捷琳诺斯拉夫省斯拉夫哥罗德§!\n§Y背景：§!§L谢尔盖·伊万诺维奇·瑟尔佐夫是一名来自顿河畔罗斯托夫的商店职员之子，在圣彼得堡学习期间加入俄社民工党，他的经济学学业也因此中断。他是顿河哥萨克军团地区布尔什维克的核心之一，当地的布尔什维克、孟什维克和社革党能以“联合民主军事革命委员会”的形式开展合作，很大程度上要归功于他。他担任过军事委员，还曾组织去哥萨克化，不过他只将去哥萨克化视作经济重组问题，而非一项原则。\n\n1920年，瑟尔佐夫逃离俄罗斯，并加入了流亡中的革命工人党。他在法国完成了高等教育，学习政治经济学，尤其是西欧模式下的农业机械化。他一直游走于政治边缘，对过于激进的做法不感兴趣。他是社会主义技术官僚的典型代表，即是组织者和管理者，而非煽动者。§!"
  RUS_vasily_chuykov_commander_desc: "§Y生于：§!§L1900年2月12日；俄罗斯帝国、图拉省谢列布里亚内耶普鲁德§!\n§Y背景：§!§L瓦西里·伊万诺维奇·崔可夫生于一户俄罗斯农民家庭，早年就读于教会学校，十二岁时前往彼得格勒谋生，成为鞋匠学徒。\n\n1918年，崔可夫志愿加入红军，前往莫斯科接受首次军事培训，在那里参与镇压了左翼社革党叛乱。1919年，他加入了俄罗斯革命工人党（布尔什维克），并接过了第5步兵师第43团团长一职，随即加入东部方面军作战并多次负伤，最后被高尔察克的军队俘虏。\n\n康复出院后，崔可夫回到了家乡，在那里与妻子瓦莲京娜结婚。但是战争已然改变了他的生活，1923年他再次回到俄军服役。\n\n后来，崔可夫进入苏沃洛夫军事学校深造，1926年毕业后分配到驻扎在俄罗斯远东地区的第82西伯利亚步兵师任职。\n\n中东路冲突期间，崔可夫所在的团受到不可抗力的严重影响，导致表现不佳，崔可夫因此被降职为少尉，并被明令禁止晋升。\n\n然而，这一切并没有影响崔可夫尽忠职守。他为自己赢得了坦诚直率、才干过人（但有时鲁莽）的军官名声，并得到了士兵们的一致尊敬。\n\n崔可夫年轻时就同情社会主义，是主要的晋升候选人，这让他终于有机会施展才华为国效力。§!"
  RUS_mikhail_frunze_army_chief_desc: "§Y生于：§!§L1885年2月2日；俄罗斯帝国、七河州比什凯克§!\n§Y背景：§!§L米哈伊尔·瓦西里耶维奇·伏龙芝是20世纪最杰出的俄国革命者之一。就读于维尔尼的文理中学时，他首次接触到革命思想。不久后，他便加入了俄国社会民主工党。1905年革命期间，他参加了俄社民工党在莫斯科及其周边地区的活动，并策划了一系列的罢工、暗杀和武装暴动，后来又出席了俄社民工党的第四次代表大会，并在会上结识了弗拉基米尔·列宁。他险些因其革命活动被判处死刑，在公众压力下才得以幸免，最终被流放西伯利亚，在多个流放地中服刑。逃到赤塔后，他用假身份搬到了明斯克，成为了当地的警察局长，这标志着第一支白罗斯警察队伍的诞生。\n\n十月革命爆发后，伏龙芝参加了莫斯科的战斗，后来被任命为雅罗斯拉夫尔军区的军事委员。俄国内战期间，他在东部方面军指挥多支集团军作战时，为许多不战而降的白军提供了安全保障。莫斯科沦陷后，布尔什维克且战且退，他在此过程中发挥了关键的组织作用。\n\n流亡法国期间，尽管身体欠佳，伏龙芝还是与其他流亡者一同创建了布尔什维克国际旅。他经常担任法国政府和布尔什维克流亡指挥官的中间人，并确保了布尔什维克国际旅能够参与英国革命和巴塔哥尼亚起义。他既在维持红军流亡者军事力量的方面发挥着不可或缺的作用，又保持着他在革命工人党中的领导地位。§!"
  russia_flavour_events.184.d: "随着伟大的革命战争取得胜利，曾经的犹太区上空飘扬起红旗，东欧犹太人终于摆脱了资本主义和资产阶级民族主义的剥削，迎来了新的曙光。现在大多数犹太民族（尽管这个词所指涉的范围一直存在争议）都已站在社会主义旗帜下，犹太社区内的政治讨论也达到了白热化。现在世界革命看来已不可避免，而那些已经获得解放的犹太工人已开始努力创造那个几代人位置不懈奋斗的新社会。\n\n谢苗·迪曼施泰因是一名追随季诺维也夫和加米涅夫加入全俄劳联的老布尔什维克，也是以不信者为主的俄社民工党中的少数信徒之一。1918年，在与列宁和雅科夫·斯维尔德洛夫仔细交谈后，他受命组建了“犹太支部”(Yevsektsiya)，即革命工人党的犹太支部。斯维尔德洛夫虽然是犹太人，但强烈反对党内存在任何形式的“犹太支部”。布党后来在内战中失败，他因此未能落实列宁的政策。他目前在社会主义劳工共和国联盟民族事务委员会工作，邀请了许多重要文化人物加入政府，其中包括著名演员所罗门·米霍埃尔斯、作家伊利亚·爱伦堡，甚至莫斯科现任首席拉比什洛莫·施莱费尔。\n\n虽然在实践中，犹太支部的运转方式与其他社会主义政党倡导的民族文化自治形式类似，但全俄劳联左派也推动了一项全面的本土化(Korenizatsiya)计划，旨在推动意第绪语的本地使用和保护，以及实施强有力的平权行动计划。社会主义犹太复国主义政党，尤其是青年卫士和锡安工人党左派，获准在犹太支部的指导下相对自由地运作。由于中央委员会愈发怀疑将巴勒斯坦作为移民目的地的做法，人们开始讨论犹太工人自愿聚集进行领土自治的替代地点。第一个提议是在西伯利亚，但人们担心这片土地不适合居住，需要沙文主义胁迫才能实现，因而最终遭到否决。党内一些人提出克里米亚是合适地点，虽然这会给克里米亚半岛当地团体带来新的麻烦——但随着社会主义犹太文化在党的集体先知的指导下获得发展，工人们如今对红色锡安充满了希望。"
  #SER
  SER_radical_socialist_breakaway_party: "塞尔维亚革命工人党"
  SER_radical_socialist_breakaway_party_long: "塞尔维亚革命工人党(Komunistička partija Srbije)\n§L社会主义工人党是一个塞尔维亚马克思主义和南斯拉夫主义政党，在改良主义和革命愿望之间徘徊。在法国和俄罗斯激进运动已到尾声的1919年，塞尔维亚社会民主党(Srpska socijaldemokratska partija)将以日夫科·托帕洛维奇为核心的温和沙文主义派系驱逐出党，社民党的剩余部分与黑山革命者合并，成立了社工党。在亚历山大二世的王室独裁统治下，社工党很快便被宣布为非法政党，但随着1926年君主制被人民革命推翻，社工党的命运很快便迎来了转机。\n\n鉴于社工党对塞尔维亚短暂的失败治理导致其所有努力都已化为乌有，其内部一些更为激进的成员认为革命遭到了背叛，于是他们联合起来成立了塞尔维亚革命工人党，并将不惜一切代价，寻求革命的胜利。§!\n"
  SER_syndicalist_breakaway_party: "塞革工(瓦哈比派)"
  SER_totalist_breakaway_party: "塞革工(佩拉吉奇派)"
  SER_pardon_communist_revolutionaries_desc: "革命工人党是少数几个曾经积极对亚历山大二世国王的政权发动武装反抗的团体之一，特别是黑山地区，武卡辛·马尔科维奇的游击队在撤往阿尔巴尼亚之前就在那里的山区中发动袭击。尽管他们或许仍然心怀疑虑，但我们还是应该听从社会党同仁们的建议，在最终完全赦免他们。"
  SER_dragomir_vasic_leader_desc: "§Y生于：§!§L1885年10月2日；塞尔维亚王国、摩拉瓦州上米拉诺瓦茨§!\n§Y背景：§!§L德拉戈米尔·“德拉吉萨”·瓦西奇是塞尔维亚共和国的第二任总统，他在共和党的倡议下参选，并于1931年就职。不幸的是，瓦西奇恰好属于被送往巴尔干战争和世界大战壕沟的那一代塞尔维亚人。在第二次巴尔干战争期间，瓦西奇的革命志向愈演愈烈，他当时是个作家，处女作是一部名为《帕科》的短篇小说，描述了一名参与布雷加尼察战役的塞尔维亚士兵，因同情一名倒下的保加利亚军官，想要在一片无人之地为他举办合适的葬礼，结果惨遭敌人射杀，他当时正对着一个木制十字架祷告。对卡拉乔尔杰维奇王朝的幻灭后，他的革命热情愈发明显，在萨洛尼卡审判之后更是达到顶峰，他的表亲柳博米尔·武洛维奇因属于“黑手”的一员而被处决。\n\n战后，瓦西奇跟随流亡者回到塞尔维亚，从事法律职业，创办了《进步报》，但没过多久报纸被查封，也因他为革命工人党人辩护，律师执照被王室独裁政权吊销。作为回应，他加入了共和党，因其出色的文学水平，与在塞尔维亚军中的众多人脉，成为了共和党人地下组织的重要成员。当革命到来时，瓦西奇选择参与革命，他被选入议会，并担任驻法兰西公社大使。虽然访问巴黎的经历没有把他变成一个工团主义者，但法国人取得的成就依旧让他为此着迷。\n\n阴谋集团怀疑总统雅沙·普罗达诺维奇的反军国主义立场，1931年迫使他下台，并因瓦西奇过去与“黑手”的联系，认为其更容易掌控，而谨慎邀请他在下届选举中参选。瓦西奇不情愿地同意了，至今仍在担任总统，他的进步观点和他的金主阴谋集团相割裂。对他而言，与保加利亚的斗争不仅仅是民族统一的问题，而是自由的问题，当保加利亚成为二元独裁君主制后，塞尔维亚多次被证明是巴尔干半岛的自由堡垒。但塞尔维亚真的能声称，自己是保加利亚的自由先驱吗？§!"
  #SIA
  SIA_totalist_party: "暹罗革命工人党"
  SIA_totalist_party_long: "暹罗革命工人党(Pak Khon-ngan Patiwat Siam)"
