  #BUL
  BUL_communist_party: "保加利亚革命工人党"
  BUL_communist_party_long: "保加利亚革命工人党(Bŭlgarska Revolyutsionna Rabotnicheska Partiya)\n§L紧密派社会主义者战胜了他们在“弗拉斯节”中的农业派同僚，开始寻求建立“无产阶级专政”，这一理念很大程度上受到了布尔什维克在俄国内战期间垮台前提出的治理方案的启发。表面上其行动是为了产业工人的福祉，但实际上他们在寻求快速推进保加利亚的工业化和现代化，并可能为实现这一目标而采取愈发激进的手段。§!\n"
  bulgaria_events.63.d: "随着农业人民联盟被清洗后转入地下，祖国阵线内部也就仅剩两大政治倾向了。尽管他们都自称是希望建立社会主义共和国的社会主义者，但他们在目标和意识形态上都有所分歧。因此祖国阵线已经召开了针对这个问题的特别大会，在大会上将选举出新的领导层，并决定阵线未来的政治方针。\n\n紧密派社会主义者，也就是俗称的“革命工人党”是祖国阵线的组建者，共产主义者的领袖是格奥尔基·季米特洛夫。虽然季米特洛夫在流亡期间的大部分时间都是在法国度过的，但是他对公社的政治制度颇有怨言，他指出公社制度只适合在高度工业化的西方国家实行，保加利亚这样的落后国家的新生社会主义国家必须先专注于现代化，然后才能实行正统社会主义理论。而现代化进程必须由受过专业教育的先锋队指引，季米特洛夫指出，二十年前在俄罗斯那场最终失败的著名革命的经验可以为他们所用。\n\n与此同时，农业职业联合会“弗拉斯节”则是一个专注于团结保加利亚农业工人的工会委员会。在马诺尔·瓦谢夫的领导下其日渐趋于无政府工团主义。现在他们希望将这种意识形态带向保加利亚的农民之间。他们希望将国家的权力下放到各地农村公社，再汇总到权力机构最高处的劳工联合会议。这样就可以按照农业工人团体的意见来管理保加利亚。\n\n理论上讲阵线的领导人是紧密派社会主义者，但是他们的领导人们最近才刚从流亡中归国，在那之前是他们的工团主义盟友在国内苦苦支撑正面反抗君主，他们的抗争赢得了人民的尊重，这也使得紧密派的力量受到了牵制。"
  #FER
  russia_far_east_events.103.d: "在最高总督季捷里赫斯的严密指挥下，安全部门掀起了一波恐怖浪潮。叛逃至圣格奥尔基结社的前萨文科夫派成员康斯坦丁·克罗米亚迪上校组建了一个人称“特辖军”(Oprichniks)的准军事组织，这个名字来自伊凡雷帝麾下的古代安全部门。这些“警卫旅”的目的是追捕那些国家之敌，包括分离主义者、革命工人党员以及其他各种罪犯。凭借他们手中凌驾于法律之上的权力，这些小队不断进行公开处决，并且每次都要确保村里所有人都对这次处决看得一清二楚。\n\n凭借这一残酷的手段，大多数公开抗议活动都被消灭，抵抗分子只能转入地下。尽管仍有一些社会主义恐怖分子组织在继续活动并袭击沙皇的官员，但他们毫无胜算。\n\n尼基塔沙皇在对全国的讲话中解释了采取严厉措施以确保持久和平与稳定的必要性。毕竟那些忠诚而虔信的俄罗斯人是不用害怕这些手段的，但由于社会主义者和俄奸们渗透进了俄罗斯社会的每一个角落，仍有许多叛徒和人民之敌混进了群众当中。沙皇鼓励人们加入君主制同盟及其附属组织以证明自己的忠诚，并为从分裂、反叛和动乱之中重建旧俄罗斯出一份力。"
  #FOP
  FOP_the_communist_supremacy_desc: "虽然在俄国十月革命失败后遭遇了重大挫折，阿根廷革命工人党最终还是设法取得了权力，在劳联会中保有多数席位。虽然他们及布尔什维克在共产主义大旗下共建世界新秩序的梦想还遥遥无期，但这一胜利无疑使他们向目标更进了一步。"
  patagonia_events.106.d: "今天发生了一起悲剧，前线部队中有两个营的战士们发生了交火。交火时间并不长，当双方战士注意到对方的破衣烂衫和老式步枪时，他们立刻意识到对方是和自己处于统一战线的战友——然而这场小冲突造成了5名士兵阵亡，约12人受伤。不出意料，一个营的指挥官是革命工人党员，另一个营的指挥官是一位著名的无政府主义者。虽然双方都在进行调查，以查明谁是这起事故的主要责任方，但很明显，现在双方都陷入了指责推诿之中，想要查明真相日益变得困难。由于死者家属不断要求为他们伸张正义，主席必须就此事做出最终决定。"
  patagonia_events.110.d: "在发生了几次小规模的逃兵事件后，共产主义派系提议向前线各支作战部队引入“政治委员”一职。这批军官将从各营的党政干部中选出，负责确保我们的士兵不会对反动派心慈手软。虽然巴塔哥尼亚革命爆发之前，革命工人党人就已经在使用这种手段，但是他们的举动还是和其他派系发生了冲突。随着局势日渐升级，一些人认定这是共产主义者们试图在革命胜利前先清除异己的卑劣手段。不过，鉴于被征召入伍的普通人开小差的情况愈发普遍，或许共产主义者的这个办法能够确保士兵的忠诚。"
  patagonia_events.111.d: "前线今天传回了一个糟糕的消息：由富塔莱乌富区居民征召组建而成一个营，显然是在一场和阿根廷陆军发生的小规模冲突后从战线上集体开了小差。由于我们正努力征召一切可以充入部队的战士，为了降低入伍标准，对战士的政治可靠性的审查显然已被放到了较低档次——故而发生今天的事件似乎并不让人意外。让事态雪上加霜的是，革命工人党人立刻跳出来称这是因为该部队没有设立政委一职；他们的行为再一次动摇了政府拒绝设立政委一职的决定，并导致事态更为复杂化。"
  patagonia_events.203.d: "在阿根廷革命的起步时期，由于布尔什维主义的失败和工团主义的兴起，阿根廷革命工人党受到了严重的削弱；不过正是有了许多先行者的努力，阿根廷革命工人党才成功延续了他们的力量，创立了他们自己的工会——阶级工团联盟委员会。不仅如此，在革命期间，由于许多阿根廷人把无政府主义视作一种危险的思想，作为革命团体中无政府主义对立面的共产主义者就吸引到了他们的支持——这些阿根廷人认为，支持共产主义能够打击无政府主义，而且在革命胜利后自己也能适应新的革命社会。虽然过去他们在劳联会内部的实力低人一等，但革命胜利后他们新获得的支持仍帮助他们有机会在劳联会上与其他党派一决高下；因此，阶级工团联盟委员会决定不分割他们政党的选票，把所有选票全部投给了鲁道夫·吉奥尔迪，让他作为阶级工团联盟委员会的领头人出席劳联会。只有时间才能证明，吉奥尔迪的理念是否能让他们脱颖而出……"
  patagonia_events.336.d: "在安第西亚崩溃后，利沃里奥·胡斯托失掉了他在阶级工团联盟委员会和革命工人党人中的绝大多数支持。今天，阶级工团联盟委员会做出了人们预想范围内最大的动作：他们向劳联会提出了一份针对胡斯托的不信任案——通过的几率几乎是百分百。名誉扫地的胡斯托决定在投票通过前辞职，随后阶级工团联盟委员会决议重选主席。由于缺乏反对者，吉奥尔迪一跃成为最受欢迎的候选人，成功获选为新任主席。由于吉奥尔迪采取了相对温和的政策，他将着眼国内，修复胡斯托留下的烂摊子，并试图撤回一些胡斯托发出的严酷政策。"
  patagonia_events.340.d: "在恩特雷里奥斯省俄罗斯移民社群的协助下，今天胡斯托主席为一座纪念十月革命的纪念碑举行了揭幕式。该纪念碑以铜铸成，主体内容是弗拉基米尔·列宁和他身后追随着的一群工人；过去几个月间，当纪念碑还在建造过程中时，媒体就浓墨重笔地报道了该纪念碑的建造细节，揭幕式上主席也就此发表了一大段讲话。通常情况下，主席参与这类活动会有助于提高革命工人党的支持率，但这次却截然相反——在纪念讲话中，胡斯托主席称十月革命失败并不是因为德意志帝国主义等外国势力的干涉，而是革命运动内部其他流派的争权夺利分裂了革命的实力。他的讲话内容很快就被境内外断章取义的媒体所曲解，被他们解读成了反对第三国际的“宣言”。现在一座小小的普通纪念碑不仅成了阿根廷的焦点，也成了全世界的焦点……"
  FOP_totalist_party_long: "阶级工团联盟委员会(Comite de Union Sindical Clasista)\n§L阶级工团联盟委员会(CUSC)的成员基本上都是布尔什维克、革命工人党人和其他同情右派的社会主义者，当中大多数人都来自俄罗斯。CUSC的党主席是维多利奥·科多维利亚，他曾出任基地位于布宜诺斯艾利斯的阿根廷革命工人党党主席，但党内的实际权力基本上都由年轻激进且魅力过人的鲁道夫·吉奥尔迪掌握。许多党员都视吉奥尔迪为科多维利亚的实际上司。但由于科多维利亚与法兰西公社内的布尔什维克流亡派及整个工团主义第三国际都有良好关系，故此他在党内的地位可谓坚如磐石。尽管臭名昭著的强盗阿尔弗雷德·丰特表面上与政治毫无相干，但他其实与CUSC的领导层有所关联，同样声名狼藉的“政治家”利沃里奥·胡斯托亦是如此。\n\n成立于：§Y1929年§!\n意识形态：\n-共产主义§!\n"
  FOP_rodolfo_ghioldi_leader_desc: "§Y生于：§!§L1897年1月21日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L罗多尔福·何塞·吉奥尔迪的政治生涯自1917年阿根廷革命工人党成立的那一刻开始，那时他被选为青年社会主义者联盟的副主席。而在俄国革命的火焰被扑灭后，吉奥尔迪成为了一名教师，而在悲惨一周和巴塔哥尼亚爆发起义，红色恐慌随之爆发后，吉奥尔迪也因为政治观点的问题被下岗了。吉奥尔迪认为留在继续留在故乡布宜诺斯艾利斯市没什么意义，因此决定开始联络阿根廷革命工人党的战友，并与他的兄弟阿美利科和奥雷斯特前往巴塔哥尼亚。在他抵达巴塔哥尼亚后，前党总书记路易斯·艾米利奥·雷卡瓦伦因为革命工人党和无政府主义者之间的派系斗争而自杀。在莫伊塞斯·伊萨卡诺维奇·坎托尔的帮助下，吉奥尔迪临危受命，在竞选中成为革命工人党的新总书记，1924年开始，吉奥尔迪在他弟弟奥雷斯特的帮助下领导革命工人党。吉奥尔迪为了缓解革命工人党人与无政府主义者间的紧张关系，向对方做出了妥协，他一直忙碌于协调二者间的关系，让他们能团结一心对抗共同的敌人，党内的激进分子指责吉奥尔迪过于软弱，为了不起冲突牺牲了阿根廷革命工人党的利益。但是吉奥尔迪依然是工人阵线中很受人尊敬的温和派。§!"
  FOP_liborio_justo_leader_desc: "§Y生于：§!§L1902年2月6日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L“坚木将军”利沃里奥·胡斯托是阿根廷将军阿古斯丁·P·胡斯托的儿子，由于其父是埃尔帕洛马军校的校长，利沃里奥也从小接受军事化管理，因此他经常和他的父亲在一起，但讽刺的是，他最终却在革命中与他的父亲兵戎相见，老胡斯托经常挥师镇压阿根廷的红色分子，而小胡斯托却选择南下投身革命，他游历于广袤的巴塔哥尼亚各地，与当地农民打成一片，后来并与工人阵线并肩奋战，为了在战场上对抗政府军，他为民兵们带来了埃尔帕洛马军校的藏书。很快，他就成为了革命工人党人反抗阿根廷政府最重要的领导人之一，虽然他不如他父亲那般老练，但事实证明小胡斯托是一名出色的指挥官。再加上他渴望南美革命和全面推翻资本主义的鼓动性主张，让他在革命工人党内的地位扶摇直上，原本他的影响力并不足以和吉奥尔迪对抗，但是最终他还是成功推翻了吉奥尔迪的统治。如今他身为阿根廷主席，他公开表示，他将成为“拉丁美洲革命的救世主”，区区阿根廷革命不过是他计划中的第一步罢了……§!"
  FOP_jose_fernando_penelon_advisor_desc: "§Y生于：§!§L1890年9月8日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L何塞·费尔南多·佩内隆于1906年、在路易斯·伯纳德领导的制图员罢工期间成为了工会领袖，而他此前的生涯则几乎无人知晓。佩内隆在同年加入了阿根廷社会党并协助成立了阿根廷史上的首个工会。他在1908年协助成立了社会主义青年团，为后来成功统筹十八个工会组织的工会宣传委员会的工作方向和成立打下了基础。他在1910年加入了布宜诺斯艾利斯制图员工会，而由于布宜诺斯艾利斯制图联会在1912年首次被资方认可为该行业的工人代表，联会内开始出现改良主义思想。佩内隆曾协助成立“卡洛斯-马克思”学习中心并在《社会主义之言》报刊首次出版时批评了该报刊的改革主义思想。他曾在1915年当选《制图工人报》的董事，创立国际红色联盟阿根廷委员会，也曾在1916年参选众议员，但无功而还。曾多次批评改良主义的佩内隆在1917年被社会党开除党籍，此后他创立了阿根廷国际社会党，此党将在未来成为阿根廷革命工人党。\n\n在1919年3月1日，在“悲剧周”发生后的两个月左右，佩内隆以“国际”之名发表文章大力评击阿根廷当局的所作所为，并绘描了手无寸铁的和平示威者在“悲剧周”中所经历的骇人见闻。他的居所与其他工团主义领袖一样都曾被袭击，阿根廷地区工人联合会更因此要求保护佩内隆。在1920年的夏季，巴塔哥尼亚地区的罢工演变为了总罢工，后更成为了一场导致巴塔哥尼亚地区脱离阿根廷的全面叛乱（称巴塔哥尼亚起义）。佩内隆在此期间加入了巴塔哥尼亚以协助它构筑一个新的未来。目前他主要掌管与其他社会主义国家的外交事务，殚精竭虑地为这个新生国家争取一切国际援助。§!"
  FOP_victorio_codovilla_advisor_desc: "§Y生于：§!§L1894年2月8日；意大利王国、帕维亚大区奥托比亚诺§!\n§Y背景：§!§L维托里奥·科多维利亚于1894年生于一个中产家庭之中。他是维南西奥·科多维利亚与胡安娜·费兰迪纳七个儿子中最小的一子。维托里奥在一间位于莫尔塔拉的商学读书时结识了社会主义领袖埃吉斯托·卡格诺尼，并在对方的引荐下加入了意大利社会主义青年团。因经济原因而不得不辍学的科多维利亚在1910年加入了一间电报公司，他在次年加入了意大利社会党，就此开始了与国际主义者共事的生涯。\n\n被意大利社会党委派到阿根廷的科多维利亚在1912年12月12日抵达布宜诺斯艾利斯，他加入了阿根廷社会主义青年团并将自己的名字由维托里奥(Vittorio)改为维多利奥(Victorio)。但维多利奥很快就离开了温和社会主义团体并加入了支持因在内战中战败而流亡的苏维埃俄国社会主义团体。这个团体将会成为未来的阿根廷革命工人党，而维多利奥则会在迅速挤身领导层。在巴塔哥尼亚起义爆发后，维多利奥与其他工团主义及社会主义领袖乘坐渔船逃到了马德林港。维多利奥其后成为了阶级工团联盟委员会的主席，一个实际上由鲁道夫·吉奥尔迪掌握实权的极权派派系。许多人都视吉奥尔迪为维多利奥的上级。阶级工团联盟委员会被视为是继阿根廷工团联盟和阿根廷地区工人联合会后巴塔哥尼亚内第三重要的派系。§!"
  #GEO
  GEO_totalist_party: "格鲁吉亚革命工人党"
  GEO_totalist_party_long: "格鲁吉亚革命工人党(Sakartvelos Komunisturi Partia)\n§L格鲁吉亚革命工人党是在俄罗斯内战接近尾声时，当地与布尔什维克合作的民族主义者与俄罗斯革命工人党在格鲁吉亚境内的少数支部联合建立的。当格鲁吉亚被纳入德国的势力范围后，它几乎没有任何影响力，更何况还遭受了严重的政治迫害。这是一个非法的小型组织，成员大多通过秘密集会交流，政治观点也逐渐开放，并形成共产主义与格鲁吉亚民族主义更有内涵的结合，其明显借鉴了西欧极权主义的思想。该党的一些成员与社会革命党保持着联系，希望以此来让这个格鲁吉亚唯一合法的极左翼党派接受更多共产主义与极权主义的思想。§!\n"
  GEO_sasha_gegechkori_leader_desc: "§Y生于：§!§L1887年12月5日；俄罗斯帝国、库塔伊西省纳哈莱维§!\n§Y背景：§!§L阿列克西·“萨沙”·格格奇科里于1887年出生在马尔特维利附近的一个小村庄，他生于一户贫穷的贵族家庭。1902年，格格奇科里开始参加革命活动，他为俄国社会民主工党布尔什维克派效力，在整个高加索地区乃至全俄罗斯的多个城市工作，尤其是在车里雅宾斯克。他曾多次被捕，最终被流放到阿斯特拉罕，并在那里待到1917年二月革命爆发后才重返高加索。在那里，他被任命为西外高加索革命委员会的负责人，并受任在自己家乡萨梅格列罗发动起义。然而，他于1918年3月7日被孟什维克当局以煽动叛乱的罪名逮捕，直到俄国内战结束后才获释出狱。出狱后，他重新加入了被摧毁后转入地下的格鲁吉亚革命工人党。当该党的领导人菲利普·马哈拉泽退休后，格格奇科里接过了领导权，并从那时起一直致力于重建该党，并使其恢复一定的影响力。最终，在外部力量的帮助下，该党得以成功上台掌权。§!"
  #GER
  germany_swr_events.39.d: "又是一天，祖国党反动派出现了新问题——这一次的问题人物是胡根贝格的高级副手保罗·邦，他以一系列尖锐的反社会主义文章脱颖而出，走上台前。自鲁尔激斗以来，右翼对于工团主义者破坏与干涉德国政治的担忧达到了历史新高，邦则在其中煽风点火，推波助澜。正如他所宣称的那样，“敌人在左边！”而“左边”并不仅仅指满是法国间谍和傀儡的羸弱革命工人党——根据邦的说法，社会民主党事实上在为工团主义者影响德国工人和知识分子牵线搭桥，甚至可能是有意为之。\n\n自不必说，已经为此争论了数十年的社会民主党完全不同意这种指责——但邦的强硬反社会主义立场在极右翼之中得到了支持，例如马格努斯·冯·莱韦措。鲁尔地区的工业巨头和阿尔弗雷德·胡根贝格，希望粉碎工会和工人运动以提高生产力，也加入了祖国党反动派的战线。与之相反，领导着祖国党的哈塞尔派更倾向于采取更谨慎的方法——当然，摧毁社会民主主义是黑白红同盟每一个人的目标，但他们应该如此仓促行事吗？"
