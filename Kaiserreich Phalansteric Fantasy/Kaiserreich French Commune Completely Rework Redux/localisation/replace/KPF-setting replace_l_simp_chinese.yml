  #INS
  INS_munawar_musso_leader_desc: "§Y生于：§!§L1897年8月12日；荷属东印度、东爪哇省帕古§!\n§Y背景：§!§L穆诺纳尔·慕梭是1925年革命的领袖之一，这场受英国革命启发的革命最终被殖民政府镇压，而印度尼西亚革命工人党也因此毁于一旦。穆诺纳尔·慕梭则紧急逃往了孟加拉人民共和国，在那里他接触到了来自欧洲的极权主义思想家，并被这种新的革命思想所吸引。在加尔各答，他主持了一次印度尼西亚流亡者大会，在会议上他朗读了被翻译过的《极权宪章》，并宣布印度尼西亚革命工人党的继承者——印度尼西亚极权党正式成立。而这也导致他们与陈马六甲及其追随者们割席断交，因为印度尼西亚极权党拒绝和穆斯林教徒合作争取独立，而印度尼西亚社会主义者间永不愈合的隔阂也就此诞生。§!"
