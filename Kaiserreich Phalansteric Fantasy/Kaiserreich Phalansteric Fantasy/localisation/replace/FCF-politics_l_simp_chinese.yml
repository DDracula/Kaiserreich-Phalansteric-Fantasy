  CSP_adopt_suggestion_event_desc:0 "公共安全委员会作为执行人民意志的临时机关，在十数年的运转中逐渐确立了自己的权威，事物代表们尽管在名义上服从劳总联的安排，但那只不过是“总体规划”。至于如何实现总体规划所要求的，不同立场、不同阅历、不同意识形态的个体都有自己的道路想法。他们的想法可能未必是对的，但由于位高权重，一次小小的失误在官僚机制的传导下就有可能造成滔天大祸，可若是害怕这权力模式的必然隐患而碌碌无为，那么这千万人觊觎的宝座的主人就要换到别人去了。"

