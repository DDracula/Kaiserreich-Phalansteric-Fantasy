  oppo_unit_politics_landscape:0 "§Y迫不得已的联盟§!\n§g为了对抗日益官僚化的建制派与表现出反民主倾向的雅各宾与索雷尔派系，工农共产党与联邦主义无政府主义者协会联合在了一起。但这种联合却更像是走投无路的合作，当共同的敌人消失后，工农共和联安协是否还能联合在一起，谁也不能打包票。但至少现在，联盟还有很多问题值得共同去解决。§!\n当前的§Y联盟团结状况§!：\n[PCOP_AFA_union_loc]（[?PCOP_AFA_union|.0]）\n联盟凝聚力：[?PCOP_AFA_unity|G.0]\n\n§C迫在眉睫的问题§!\n总工会问题：[PCOP_AFA_problem_CGT]"
