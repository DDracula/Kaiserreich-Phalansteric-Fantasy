  cofpolitics.148.title:0 "与戴亚会面"
  cofpolitics.148.desc:0 ""
  cofpolitics.148.a:0 "高效是我们的共同追求。"
  cofpolitics.148.b:0 "稳定是最重要的政治原则。"
  cofpolitics.148.c:0 "官僚们想要什么？"

  cofpolitics.149.title:0 "拭目以待"
  cofpolitics.149.desc.a:0 ""
  cofpolitics.149.desc.b:0 ""
  cofpolitics.149.a:0 "官僚们的想法很容易摸透。"

  cofpolitics.150.title:0 "巴别塔"
  cofpolitics.150.desc:0 ""
  cofpolitics.150.a:0 "我们会尽可能做到的。"
  cofpolitics.150.b:0 "他们知道这是不可能的事情。"  

  cofpolitics.151.title:0 "改革之风"
  cofpolitics.151.desc:0 ""
  cofpolitics.151.a:0 "让我们快起来吧。"

  cofpolitics.152.title:0 "不合作"
  cofpolitics.152.desc:0 ""
  cofpolitics.152.a:0 "但愿这只是暂时的。"

  cofpolitics.153.title:0 "与加香会面"
  cofpolitics.153.desc:0 ""
  cofpolitics.153.a:0 "有什么不能聊的呢？"

  cofpolitics.154.title:0 "务实的群众工作者"
  cofpolitics.154.desc:0 ""
  cofpolitics.154.a:0 "农民的利益当然是首要的。"
  cofpolitics.154.b:0 "小商贩们是我们经济的主要贡献者。"
  cofpolitics.154.c:0 "知识分子昭示着公社的未来。"

  cofpolitics.155.title:0 "其他人？"
  cofpolitics.155.desc.a:0 ""
  cofpolitics.155.desc.b:0 ""
  cofpolitics.155.desc.c:0 ""
  cofpolitics.155.a:0 "我们当然不会忘记他们。"
  cofpolitics.155.b:0 "他们当然很重要，但没有那么重要。"
  cofpolitics.155.c:0 "这里就只有我们，没有其他人。"

  cofpolitics.156.title:0 "成交"
  cofpolitics.156.desc:0 ""
  cofpolitics.156.a:0 "任务繁重啊……"

  cofpolitics.157.title:0 "怀疑"
  cofpolitics.157.desc:0 ""
  cofpolitics.157.a:0 "我们要把精力集中在单一的地方。"
  cofpolitics.157.b:0 "我们只是在说明优先级上的问题，而非是取舍。"

  cofpolitics.158.title:0 "顾此失彼"
  cofpolitics.158.desc:0 ""
  cofpolitics.158.a:0 "真是蛮不讲理。"

  cofpolitics.159.title:0 "优先级"
  cofpolitics.159.desc:0 ""
  cofpolitics.159.a:0 "慢慢来，总会解决的。"

  cofpolitics.160.title:0 "迟疑，然后是离开"
  cofpolitics.160.desc:0 ""
  cofpolitics.160.a:0 "这算是我们自找的？"

  cofpolitics.161.title:0 "重归于好"
  cofpolitics.161.desc.a:0 ""
  cofpolitics.161.desc.b:0 ""
  cofpolitics.161.a:0 "欢迎回来，同志。"

  cofpolitics.162.title:0 "事不过三"
  cofpolitics.162.desc.a:0 ""
  cofpolitics.162.desc.b:0 ""
  cofpolitics.162.a:0 "他们并没有看走眼。"

  cofpolitics.163.title:0 "效率就是生命"
  cofpolitics.163.desc.a:0 ""
  cofpolitics.163.desc.b:0 ""
  cofpolitics.163.a:0 "就感到快。"

  cofpolitics.164.title:0 "失望透顶"
  cofpolitics.164.desc.a:0 ""
  cofpolitics.164.desc.b:0 ""
  cofpolitics.164.a:0 "官僚们应该做好他们的本职工作。"

  cofpolitics.165.title:0 "不被遗忘的人们"
  cofpolitics.165.desc.a:0 ""
  cofpolitics.165.desc.b:0 ""
  cofpolitics.165.desc.c:0 ""
  cofpolitics.165.desc.d:0 ""
  cofpolitics.165.desc.e:0 ""
  cofpolitics.165.a:0 "我们从未抛弃任何一个人。"

