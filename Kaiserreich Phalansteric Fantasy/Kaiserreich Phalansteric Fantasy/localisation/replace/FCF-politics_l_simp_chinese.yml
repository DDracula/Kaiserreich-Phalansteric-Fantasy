##革行派议程
  jaco_revo_politics_landscape:0 "§Y新罗伯斯庇尔§!\n§g法兰西是一个革命的民族，从大革命开始，再到巴黎公社，最终于法兰西公社联邦作结，法兰西民族始终走在人类文明的前列。然而，革命往往都被背叛、被摧毁、被污蔑。并不是因为革命的理想是错误的，而是革命的领导者们太过软弱、理想主义，对堕落之徒抱有不切实际的幻想，最终被篡夺了革命的果实。现在也是一样，我们已经看到了革命的自我堕落，妥协者们将法兰西民族的希望打包送给反动派，而领袖(Le Chef)要做的，就是拯救革命，拯救法兰西民族！§!\n"

##守旧派议程
  sore_oldl_politics_landscape:0 "§Y革命，统一而不可分割§!\n§g资本主义将资产阶级的腐朽道德标准作为了普世真理，但革命让工人的道德重新成为了社会的主导力量。然而，那股恶臭堕落的姿态却重新出现在革命之中：他们鄙夷战壕的火药味；瞧不起工厂的机油味；嫌弃田地的汗水味。资产阶级又一次死而复生，而这一切都归因于破坏生产秩序的无政府主义和败坏工人道德的官僚主义。无数的政治寡头、投机者和腐败官僚试图将革命变成他们分赃的场所，但有良知的工人、农民和军人绝不会束手就擒。索雷尔的意志始终与我们同在，没有任何人可以背叛我们的革命。§!\n"

##青年派议程
  sore_yout_politics_landscape:0 "§Y青年§!\n§g“改造世界”，马克思说过：“改变生活”，对于我们来说，这两个口号是一回事。超现实主义是通往全面解放的道路，它不仅仅是一种诗学，它是一种破坏性的、革命性的力量，旨在摧毁资产阶级的逻辑与秩序。庸俗的经济发展带来的并不是工人的解放，而是资产阶级的复辟，社会主义的斗争不只是物质的斗争，它更多是精神的斗争：如果一个人的思想是自由的，那么他就不可能被奴役。§!\n"

