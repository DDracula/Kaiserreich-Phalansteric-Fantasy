  synd_mode_politics_landscape_finished:0 "§C伟大社会§!\n§g"工团主义有两面：一面是改善，通过日常斗争赢取得当下的福祉；另一面是解放，为未来社会的到来做好准备。"\n\n起初，谁也无法料到工会将是国家的下一个阶段：从部落到国家、再从国家到工会。但辩证法与组织学告诉我们，这种演变是无疑且确定的。因为它此时此刻就在这片土地上实践着。从工人到农民、从商人到学者、从官僚到士兵，他们无一例外都是§R劳动者§!。劳动者没有祖国，他们有的是通过劳动而联系起来的工会，那里是他们出生的地方、学习的地方、成长的地方、工作的地方、结婚的地方、生育的地方、衰老的地方、死去的地方。那里是他们的亲人、朋友、师徒、见过的、没见过的人所生活的地方。\n\n你无法从国家看到生命，但却可以在工会看到一切。§!"
