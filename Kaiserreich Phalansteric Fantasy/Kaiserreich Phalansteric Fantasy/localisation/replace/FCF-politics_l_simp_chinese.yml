#法案
  bill_CGT_leadership:0 "总工会领导地位"
  bill_CGT_leadership_desc:0 "总工会(Confédération Générale du Travail)在革命前就是法兰西最大的工会组织，并成为了革命的主心骨。革命胜利后，它也理所当然地成为了参与立法事务的最大组织。凭借强大的组织能力与政治影响力，总工会为自身争取到了诸多法律上的庇护。尽管公社宣称对所有工会一视同仁，但在“平等”的法律条文背后，却总有“某些工会更平等”的情况存在。\n\n总工会不仅是强大的经济指导组织，更是强而有力的政治团体。由于公社中央政府权力受限，总工会反而凭借其在地方的广泛影响力，逐渐演变为一个“影子政府”。加之工团派长期执政，多数政治决策并非出自劳总联或公安委，而是直接由总工会主导。"

  bill_CGT_depoliticized:0 "《工会非政治化法案》"
  bill_CGT_depoliticized_desc:0 "总工会曾是革命的心脏，是推翻旧世界的先锋。但如今，这颗心脏已经硬化、腐朽。它凭借着革命的功绩，演变成了一个盘踞在共和国躯体上的独立王国，一个不受议会和法律约束的“影子政府”。它用行会的私利对抗国家的理性，用地方的顽固阻碍统一的规划。多数决策不再出自代表人民的议会，而是由这个庞大的官僚利维坦在幕后敲定。\n\n《工会非政治化法案》，便是国家意志对这种行会主义的最终宣判。它将用理性的手术刀，彻底剥夺总工会一切超越其本职的权力。从此以后，工会将回归其唯一应该存在的位置：作为国家经济蓝图中的一个执行单元，负责组织劳工、提高生产纪律。工会不再是目的，它只是实现国家理性的工具。"

  bill_CGT_pluralistic:0 "《工会多元化法案》"
  bill_CGT_pluralistic_desc:0 "§L工会，是劳动者用以对抗压迫的盾牌，它理应属于每一个用双手创造价值的人。这部法律，是对这一原则的庄严宣告。它将彻底打破总工会对“工会”一词的垄断。从此以后，农民将能组建自己的农会，艺术家将能成立自己的创作社，教师和医生也将拥有代表自己利益的联合会。法兰西的土地上，将有千百种工会之花竞相绽放，一个更普遍、更多元、更自由的联合体，将取代那个单一而僵化的旧日巨灵。"

  bill_CGT_legitimacy:0 "《总工会正当性法案》"
  bill_CGT_legitimacy_desc:0 "总工会并非共和国的阻碍，而是其根基。正是这座工人阶级铸成的堡垒，在旧世界的瓦砾中挺立，为劳动者赢得了尊严、权利与希望。如今，那些自诩“理性”的改革者妄图用剪刀切断共和国的脐带，令其沦为无根之木、无源之水。\n\n《总工会正当性法案》将捍卫这份遗产，并将其推向新阶段。所有工人、农民、公务员、知识分子、手工业者——凡在共和国中以劳动为生者，皆需加入总工会的统一体系。所有行业工会、农会、学术社团，将被整合为总工会的直属组织，共同构成共和国之下的“劳动统一体”。从今往后，总工会不再只是代表工人，而是代表全体劳动者的共和国支柱，其地位将以法律的形式，庄严确立。"

  bill_basic_speech_freedom:0 "基本言论自由"
  bill_basic_speech_freedom_desc:0 "言论自由是人的基本权力，我们赋予了所有公民合理合法的发声能力。"

  bill_complete_speech_freedom:0 "完全言论自由"
  bill_complete_speech_freedom_desc:0 ""

  bill_speech_freedom_under_scrutiny:0 "受审查的言论自由"
  bill_speech_freedom_under_scrutiny_desc:0 ""

  bill_speech_control:0 "言论管制"
  bill_speech_control_desc:0 ""

  bill_limited_womens_rights:0 "受限的妇女权益"
  bill_limited_womens_rights_desc:0 "旧共和国时期，尽管他们自称为“民主”，然而，占据人民一半的女性们却连投票都做不到。很多傲慢知识分子都认为女人愚昧无知，会被教权主义影响，就像第二共和国时期农民投给路易·波拿巴一样。而那些保守派，甚至都不将女性作为一个独立的人类。但事实证明，女性投票的方式和男人并无不同，无非是根据相应的社会阶层做出相应的选择。自然，在革命后，我们给予了女性选举权，虽然这一举动引起了很多保守的革命者的反对，但革命就是这样——如果什么都没有改变，那我们为什么要革命？\n\n当然，在国家层面上的革命并不能一瞬间改变全社会个体的认识。实际情况是，女性的权益并没有得到完善的保障，依旧有些行业不对女性开放或者直接对女性进行赤裸裸的就业歧视——并且其中许多行为都得到了法律背书。而很多妇女们，尤其是在落后地区的女性，她们同样有着浓重的思想刻印，尽管我们给予了她们选举权，但她们却“耻于”投票。与此同时，城市里的女性工人以及女性知识分子却在呼吁完善对女性权益的保护——就像男人一样，女人之间也会出现阶层分化。"

  bill_developing_womens_rights:0 "发展中的妇女权益"
  bill_developing_womens_rights_desc:0 "旧共和国时期，尽管他们自称为“民主”，然而，占据人民一半的女性们却连投票都做不到。很多傲慢知识分子都认为女人愚昧无知，会被教权主义影响，就像第二共和国时期农民投给路易·波拿巴一样。而那些保守派，甚至都不将女性作为一个独立的人类。但事实证明，女性投票的方式和男人并无不同，无非是根据相应的社会阶层做出相应的选择。自然，在革命后，我们给予了女性选举权，虽然这一举动引起了很多保守的革命者的反对，但革命就是这样——如果什么都没有改变，那我们为什么要革命？\n\n当然，在国家层面上的革命并不能一瞬间改变全社会个体的认识。不过，我们已经开始做出改变，女性的权益正在逐渐得到进一步的保障，虽然仍然有些行业不对女性开放或者直接对女性进行赤裸裸的就业歧视——但现在至少在法律上，他们的行为是违法的。但依然有很多妇女们，尤其是在落后地区的女性，她们依旧有着浓重的思想刻印，尽管我们给予了她们选举权，但她们却“耻于”投票。与此同时，城市里的女性工人以及女性知识分子却在呼吁完善对女性权益的保护——就像男人一样，女人之间也会出现阶层分化。"

