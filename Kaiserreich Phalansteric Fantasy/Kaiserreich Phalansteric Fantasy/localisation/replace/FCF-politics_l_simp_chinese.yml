##激进派议程
  synd_radi_politics_landscape:0 "§Y一个大工会§!\n§g总工会逐渐偏离了工团主义的理想，对于充满活力的基层劳动交易所毫不关注，只知道坐在巴黎办公室里发号施令——和那些背离列宁理想的布尔什维克们走上了同样的歧途。联合工人党的任务就是扭转这一局面，将总工会改造成实现佩卢蒂埃、索雷尔与列宁理想的机构。§!\n§r党§!-§R工会§!关系：[POU_relationship_with_syndicat]\n§r党§!组织规模：[?POU_organization_size|.0Y]\n§r党§!在§R总工会§!的影响力：[?POU_influence_in_CGT|.1G]\n§r党§!内思想：[POU_ideology_unity_loc]（[?POU_ideology_unity|.1%%]）§!"
