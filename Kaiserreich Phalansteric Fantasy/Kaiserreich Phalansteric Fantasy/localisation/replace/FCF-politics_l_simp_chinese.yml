##共产党议程
  oppo_comm_politics_landscape:0 "§Y马克思之梦§!\n§g无政府主义者被证明不值得被信任，他们对于社会主义的认识在根本上就是错误的。正如数十年前马克思对于蒲鲁东的批判一样：无政府主义者们只不过是典型的摇摆不定的“小资产阶级”！没有他们的干扰，我们一样可以建设社会主义，并且比他们要好得多。§!\n"
     
##无政府议程
  oppo_anar_politics_landscape:0 "§Y蒲鲁东之梦§!\n§g马克思主义者被证明不值得被信任，他们对于社会主义的认识在根本上就是错误的。正如数十年前蒲鲁东对于马克思的批判一样：马克思主义者们只不过是想要给人民套上另一种教条！没有他们的干扰，我们一样可以建设社会主义，并且比他们要好得多。§!\n"

##新社会议程
  jaco_neos_politics_landscape:0 "§Y秩序，权威，国家§!\n§g无政府主义的幽灵在这个伟大的国家肆虐了太久，哲学家们只懂得靠着诡辩在人民面前夸夸其谈，但形而上的概念并不能改变贫瘠的物质现实。我们国家需要的是经济学家、工程师和科学家，而不是只会作秀的政客或花枝招展的艺术家。他们可以为人民的生活点缀，但不能给他们带来面包和葡萄酒。没有先进生产力的社会主义不过是原始部落在现代的重演，而这只会带来灾难。没有坚实的经济基础，革命就无法展现出它的优越性。§!\n当前改革方向：§C[technocrat_reform_type]§!\n$technocrat_government_people_resist$：[?technocrat_government_people_resist|R.1]\n$technocrat_government_opposition_threat$：[?technocrat_government_opposition_threat|R.1]\n\n\n$technocrat_reform_progress$：[?technocrat_reform_progress|.1G%%]\n$technocrat_reform_efforts$：[technocrat_reform_efforts_loc]（[?technocrat_reform_efforts|.1]）§![belua_multorum_capitum]"

