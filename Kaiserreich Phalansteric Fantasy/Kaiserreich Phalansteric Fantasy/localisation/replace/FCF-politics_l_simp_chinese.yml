##第二次德雷福斯
  cofpolitics.14.title:0 "不正常的交易信"
  cofpolitics.14.desc:0 ""
  cofpolitics.14.a:0 "总有一种不好的预感。"

  cofpolitics.15.title:0 "间谍的字迹"
  cofpolitics.15.desc:0 ""
  cofpolitics.15.a:0 "我们这次肯定会找正经的字迹专家了！"
  cofpolitics.15.b:0 "该死，这字迹是……"

  cofpolitics.16.title:0 "线索的指向"
  cofpolitics.16.desc:0 ""
  cofpolitics.16.a:0 "去找铁路系统的负责人。"
  cofpolitics.16.b:0 "工人比起官僚更值得信任。"

  cofpolitics.17.title:0 "一无所知"
  cofpolitics.17.desc:0 ""
  cofpolitics.17.a:0 "他们难道只会坐在办公室里面发呆吗？！"
  cofpolitics.17.b:0 "他们肯定有所隐瞒，必须彻查。"

  cofpolitics.18.title:0 "办公室的客人"
  cofpolitics.18.desc:0 ""
  cofpolitics.18.a:0 "我们现在少了一份工作。"

  cofpolitics.19.title:0 "国工联接管调查"
  cofpolitics.19.desc:0 ""
  cofpolitics.19.a:0 "他们很快会找到犯人。"

  cofpolitics.20.title:0 "犹太间谍"
  cofpolitics.20.desc:0 ""
  cofpolitics.20.a:0 "铁证如山。"

  cofpolitics.21.title:0 "奇怪的踪迹"
  cofpolitics.21.desc:0 ""
  cofpolitics.21.a:0 "英雄也有点不良嗜好？"

  cofpolitics.22.title:0 "相似或是巧合"
  cofpolitics.22.desc:0 ""
  cofpolitics.22.a:0 "审问他不就知道了？"
  cofpolitics.22.b:0 "老兵的赌博问题不足为奇。"

  cofpolitics.23.title:0 "意料之外的阻碍"
  cofpolitics.23.desc:0 ""
  cofpolitics.23.a:0 "他们的确更熟悉这里。"
  cofpolitics.23.b:0 "这是联邦的事，不是他们的。"

  cofpolitics.24.title:0 "新的方向"
  cofpolitics.24.desc:0 ""
  cofpolitics.24.a:0 "半途而废可不是好习惯。"
  cofpolitics.24.b:0 "让我们看看工人的说法。"

  cofpolitics.25.title:0 "赝品的英雄"
  cofpolitics.25.desc:0 ""
  cofpolitics.25.a:0 "接下来是什么，出卖情报给德国吗？"

  cofpolitics.26.title:0 "另一个嫌疑人"
  cofpolitics.26.desc:0 ""
  cofpolitics.26.a:0 "显然，一切证据都指向莫里斯先生。"
  cofpolitics.26.b:0 "显然，一切证据都指向列维先生。"

  cofpolitics.27.title:0 "并不淳朴的人们"
  cofpolitics.27.desc:0 ""
  cofpolitics.27.a:0 "真是一帮种族歧视的混蛋。"

  cofpolitics.28.title:0 "来自德国的犹太人"
  cofpolitics.28.desc:0 ""
  cofpolitics.28.a:0 "行踪鬼祟，还有什么？"

  cofpolitics.29.title:0 "汇款目的地"
  cofpolitics.29.desc:0 ""
  cofpolitics.29.a:0 "没想到反间谍这行这么轻松。"
  cofpolitics.29.b:0 "这难道是巧合吗？"

  cofpolitics.30.title:0 "意料之外的协助"
  cofpolitics.30.desc:0 ""
  cofpolitics.30.a:0 "他们值得我们的信任。"
  cofpolitics.30.b:0 "感谢他们的好意。"

  cofpolitics.31.title:0 "步履蹒跚"
  cofpolitics.31.desc:0 ""
  cofpolitics.31.a:0 "我们已经竭尽所能了。"
  cofpolitics.31.a:0 "一定还有漏网之鱼。"

  cofpolitics.32.title:0 "来自国工联的突破性证据"
  cofpolitics.32.desc:0 ""
  cofpolitics.32.a:0 "一切都解释的通了"

  cofpolitics.33.title:0 "烂醉的战争英雄"
  cofpolitics.33.desc:0 ""
  cofpolitics.33.a:0 "他似乎在说德语？"

  cofpolitics.34.title:0 "得来全不费工夫"
  cofpolitics.34.desc:0 ""
  cofpolitics.34.a:0 "差点重演了德雷福斯的悲剧。"

  cofpolitics.35.title:0 "审判列维"
  cofpolitics.35.desc:0 ""
  cofpolitics.35.a:0 "犹太人就是这样。"
  cofpolitics.35.b:0 "还好他没有成为新的德雷福斯。"

  cofpolitics.36.title:0 "审判莫里斯"
  cofpolitics.36.desc:0 ""
  cofpolitics.36.a:0 "差点闹出了第二次德雷福斯案。"
  cofpolitics.36.b:0 "种族歧视差点酿成大祸。"
  cofpolitics.36.c:0 "现在轮到处理我们的烂摊子了。"
