  cofpolitics.167.a:0 "从第一步开始。"

  cofpolitics.168.title:0 "从无到有"
  cofpolitics.168.desc:0 ""
  cofpolitics.168.a:0 "真正开始了。"

  cofpolitics.169.title:0 "披荆斩棘"
  cofpolitics.169.desc:0 ""
  cofpolitics.169.a:0 "如火如荼！"

  cofpolitics.170.title:0 "精雕细琢"
  cofpolitics.170.desc:0 ""
  cofpolitics.170.a:0 "这件事要耐心点。"

  cofpolitics.171.title:0 "“这是梦吗？”"
  cofpolitics.171.desc:0 ""
  cofpolitics.171.a:0 "“我们活在现实！”"

