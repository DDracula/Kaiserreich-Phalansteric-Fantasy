  bill_anti_discrimination_desc:0 ""

  bill_national_immigration:0 "《国民移民法案》"
  bill_national_immigration_desc:0 ""

  bill_freedom_of_religion:0 "宗教自由"
  bill_freedom_of_religion_desc:0 "法国是一个多宗教的国家，除了传统的基督教体系的天主教和新教各宗派，还有犹太教甚至伊斯兰教。虽然很多革命者都坚持无神论的观点，但冒然施行强制的反宗教措施注定会导致人民的反对。总的来说，我们延续的旧共和国的宗教自由政策，并没有做出太大的修改。"

  bill_freedom_of_religion_amendment:0 "《宗教自由修订法》"
  bill_freedom_of_religion_amendment_desc:0 "§L法国是一个多宗教的国家，除了传统的基督教体系的天主教和新教各宗派，还有犹太教甚至伊斯兰教。虽然很多革命者都坚持无神论的观点，但冒然施行强制的反宗教措施注定会导致人民的反对。为了安抚一部分善良的人民，我们重新起草了一份宗教法案，更加符合社会主义的意识形态的同时并确保那些不危害革命的宗教徒的正常生活。§!"

  bill_state_atheism:0 "国家无神论"
  bill_state_atheism_desc:0 ""  

  bill_catholicism_first:0 "天主教的优势地位"
  bill_catholicism_first_desc:0 ""  

  bill_free_immigration:0 "自由移民"
  bill_free_immigration_desc:0 "法兰西自工业革命以来便是一个移民大国，我们的国内有来自南欧、中欧和东欧的劳工移民，也有前法属非洲殖民地的穆斯林与黑人移民。而在革命后，虽然很多保守派和旧共和国的走狗逃往了非洲，但大多数移民也都接受了社会主义革命的现状——毕竟他们大多数同样是劳工。依靠着我们作为第一个社会主义国家与世界革命中心的地位，很多国家的左翼人士或者是单纯讨生活的劳工都希望参与到我们的革命建设中，我们当然没有理由拒绝这些同志的善意。不过，旧共和国一直存在的种族主义与民族主义也无法在短短十几年内削除，不少法国人都对这些少数族裔移民——特别是犹太人——心存不满。"
  bill_free_immigration_tt:0 "§G这将允许我们在世界其他地方爆发危机时接受难民§!\n§R然而，这将导致国内民族主义者与本土主义者的不满§!"

  bill_gender_equality:0 "《性别平等法》"
  bill_gender_equality_desc:0 ""

  bill_glorious_mothers:0 "《光荣母亲法案》"
  bill_glorious_mothers_desc:0 ""

  bill_rural_education_subsidy:0 "《乡村教育资助法案》"
  bill_rural_education_subsidy_desc:0 "《乡村教育资助法案》的正式实施，标志着共和国的资源流向发生了历史性的逆转。数十年来被忽视的田野，将迎来知识与革命精神的双重洗礼——新建的学校、现代化的教材、受训的革命教师，将走进每一个偏远村落，把觉醒的种子播撒在农民子弟的心田。\n\n这不仅是教育政策，更是一次社会结构的再塑造。我们正在将教育的火炬从工人阶级延伸到农村，把过去沉默的多数转变为有文化、有觉悟、有组织的社会主义建设者。"

  bill_comprehensive_education_program:0 "《全面教育法案》"
  bill_comprehensive_education_program_desc:0 "《全面教育法案》的通过，标志着法兰西公社的教育事业进入了一个崭新的阶段。我们的目标不再仅仅是扫除文盲，而是要培养能够引领国家走向未来的“多面手”人才。根据法案，公社将加大对科学、技术工程、艺术和体育等领域的投入，确保我们的公民拥有强健的体魄和先进的思想。虽然推行该法案所需的资源在短期内可能加剧地区间的不平衡，但从长远来看，一个由全面发展的公民组成的国家，必将在与德意志等资本主义强权的竞争中占据优势。"

  bill_massive_tax_cuts:0 "《“税收即盗窃”法案》"
  bill_massive_tax_cuts_desc:0 "劳总联最终通过了这项激进的财政改革法案，这标志着公社的经济权力结构发生了根本性的转变。中央政府的税收和统筹权力被大幅削减，大部分财政资源将回归地方，由三万六千个公社自行支配。这一变革旨在最大限度地激发地方合作社的自主性和创造力，建立一个真正自下而上的互助经济网络。虽然这无疑会削弱中央进行大规模国家规划的能力，但支持者坚信，一个由充满活力的、自由的社区组成的联邦，远比一个由中央官僚驱动的国家更加稳固和繁荣。"

  bill_eight_hour_workdays:0 "八小时工作制"
  bill_eight_hour_workdays_desc:0 "“八小时劳动，八小时娱乐，八小时休息”一直是社会主义的基本要求，如果一个政权连八小时工作制都无法落实，那它只能愧对于社会主义的名号。很多资本主义国家因为害怕工人的革命——就像我国一样——也施行了八小时工作制。但资本家们所说的八小时工作制不是真正的八小时工作制，加班、拖欠工资、对工作外生活的干涉都在说明，资本主义国家所实施的八小时工作制不过是假借社会主义的名号换种方式对人民进行盘剥。\n\n八小时工作制并不像那些反对者所说的是“懒惰的借口”，恰恰相反，我们的工人在八小时工作制下爆发了远比十小时工作制或者其他时间更久的工作制所拥有的生产力更盛的劳动效率。不仅如此，八小时工作制给了工人充分的业余时间，他们可以发展自己的兴趣与学习更多的事物，而这带来的是全体人民素质的上升。"

  bill_six_hour_workdays:0 "六小时工作制"
  bill_six_hour_workdays_desc:0 "在经过激烈的辩论后，“六小时工作制”正式在法兰西公社的土地上成为现实。这不仅是劳动者权益的一次巨大飞跃，更是公社对自身社会主义制度优越性的一次响亮宣告。缩短的工作时间，意味着我们的同志将拥有更多的时间用于自我提升、文化创造和家庭生活。批评者担忧这会削弱我们的工业产出。但事实却是，一个由得到充分休息、精神自由的劳动者组成的社会，其所能爆发出的长远创造力和凝聚力，将是任何加班加点都无法比拟的。"

  bill_industrial_structure_optimization_act:0 "《产业结构优化法案》"
  bill_industrial_structure_optimization_act_desc:0 "《产业结构优化法案》将授予公共安全委员会通过一个新成立的国家规划机构来识别并系统性地拆解被认定为过时产业部门的权力。国家将监督目标工厂的关闭、其资产的清算以及资本向指定的“优先产业”的重新定向。该法案还建立了一个针对失业工人的国家再培训和重新安置计划，旨在帮助他们过渡到更现代的产业部门。其宣称的目标是提高国家生产力、加速技术进步，并确保法兰西经济的长远竞争力。"

  bill_national_industrial_synergy_act:0 "《国家产业协同法案》"
  bill_national_industrial_synergy_act_desc:0 "一部新的法典将被写入共和国的律法。它将催生一个名为“国家工业现代化总署”的庞大机构，其触角将延伸至每一个落后的角落。巴黎的工程师将与乡村的铁匠并肩而立，先进的技术将与古老的经验交融。低息贷款将如细雨般滋润干涸的土地，专家的蓝图将在蒙尘的黑板上展开。法案的目标是输血，而非截肢；是拉起每一个掉队的同志，而非制造一批被时代抛弃的幽灵。它承诺，在通往未来的道路上，法兰西将作为一个整体，共同前进。"

  bill_national_employment_platform:0 "联邦劳动交易所"
  bill_national_employment_platform_desc:0 "旧的庇护所已经崩塌，工人们在失业的寒风中无所适从，而工厂则在地方保护主义的泥潭中苦苦寻找着所需的齿轮。联邦劳动交易所，就是共和国对这场混乱的回应。它将用国家的钢铁意志，取代地方工会的任人唯亲；用机电制表机的冰冷逻辑，取代酒馆里的口头承诺。一个覆盖全国的巨大网络将被建立，它将成为共和国新的心脏，将每一滴拥有技能的血液，泵送到最需要它的岗位上。从此以后，决定你价值的，不再是你认识谁，而是你会什么。"

  bill_socio_economic_participation_promotion:0 "《社会经济参与促进法》"
  bill_socio_economic_participation_promotion_desc:0 "《社会经济参与促进法》的通过，意味着共和国将在信贷与经营准入标准方面迈出实质性改革步伐。该法案大幅放宽了对小规模合作社、乡村集体和个体生产单位的放款限制，并简化了公社内部商品交换和服务提供的注册程序。\n\n其核心目标，是激活基层经济活力，鼓励广大劳动群众在不背离社会主义原则的前提下，自主组织生产、开展服务、参与商品流通。这不仅有助于缓解国家计划经济的压力，也有望逐步形成一种更加多元而富有弹性的社会主义市场结构。"
  bill_socio_economic_participation_promotion_tt:0 "[bill_socio_economic_participation_promotion_extra]"

  Cof_piece_rate_economy_buff:0 "《社会经济参与促进法》"
  bill_socio_economic_participation_promotion_extra_tt:0 "\n每座§Y$industrial_complex$§!每个月将消耗[?0.1|R.1]的$econ_industry_basic$，并给我提供：\n  $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?0.002|.2%+=]\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$：[?0.001|.2%+=]\n $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：[?0.002|.2%+=]\n加成只会在$econ_industry_basic$大于[?50|.1Y]时生效"

  bill_green_industry:0 "《绿色工业法案》"
  bill_green_industry_desc:0 "工业的烟囱曾是共和国力量的象征，如今却也成了人们眼中污染与疾病的源头。《绿色工业法案》的提出，意在打破这种对立。在不牺牲发展速度的前提下，我们要引导共和国走上一条兼顾生态与效率的新道路。\n\n法案计划推行新一轮的工业转型政策，对高污染企业征收重税，鼓励清洁能源的研发与应用，为绿色项目提供贷款便利与税收优惠。同时，国家将投资一批“生态工厂”试点，以期为全行业树立转型样板。\n\n这是共和国对未来的一项长期承诺：在工人建设的世界中，连空气也应是属于人民的。"

