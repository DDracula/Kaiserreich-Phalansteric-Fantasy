##议会事件
  cofpolitics.1000.title.a:0 "劳总联通过议案"
  cofpolitics.1000.title.b:0 "劳总联否决议案"
  cofpolitics.1000.desc.a:0 "经过三十天的审议以及多轮辩论，虽然途中出现了些许挫折，但法案最终到达了326票的通过标准。现场的支持者欢欣鼓舞，认定这份法案是带领[FRA.GetName]走向社会主义与正义的又一次伟大胜利；而反对派则沉默以表示抗议，想必他们在表决后又要和自己的同事发牢骚，或者说到哪个广场发表谴责这项法案的演讲。\n\n但总而言之，这份议案依靠简单多数原则表决通过，并将由劳工总联合所授权，由公共安全委员会进行具体工作。也就是说，这份议案已经不在是议员手头上可以随手丢弃的废纸，而是得到宪法保护的神圣法律。或许用不了多久，这份法案就将改变整个社会。"
  cofpolitics.1000.desc.b:0 "经过三十天的审议以及多轮辩论，议案并没有争取到需要的326票通过票，这也就意味着，这项充满争议的议案将被否决，并在一个冷却周期内无法被再次递交。现场的支持者们大多垂头丧气，有几个激进的支持者上到台上重新计票，但大多都是无功而返。反对者们则显得轻松，和身边的同僚开始拉扯家长里短，这一次是他们的胜利。\n\n无论如何，没有通过就是没有通过，再抱怨与仇恨也无法改变这个事实。议案的支持者宣称社会失去了一次进步的机会，而反对者则认为这份议案完全是与社会的需求背道而驰。即使在表决之后，两边依然对此争论不休，不过可以肯定的是，这样的社会可能还没有做好这份议案到来的准备。"
  cofpolitics.1000.a:0 "好！今天最高兴了！"
  cofpolitics.1000.b:0 "别愁眉苦脸了，来喝一杯吧！"

  cofpolitics.1001.title:0 "我们的筹码？"
  cofpolitics.1001.desc:0 "政治就是交易与妥协，只要我们给出足购的利益，就没有人会拒绝。"
  cofpolitics.1001.a:0 "只需要一点点助力"
  cofpolitics.1001.b:0 "确保成功。"
  cofpolitics.1001.c:0 "我们要全力以赴。"
  cofpolitics.1001.d:0 "算了。"

  cofpolitics.1002.title.preach:0 "在议会里的演讲"
  cofpolitics.1002.title.argue:0 "与反对者辩论"
  cofpolitics.1002.desc.preach:0 "穹顶之下，劳工总联合所的议事厅内庄严肃穆。讲台上的灯光有些刺眼，台下是数百双审视的眼睛，他们代表着整个法兰西的意志。我们的声音将通过国家广播传遍每一个角落。为了我们所捍卫的观点，必须以一个强有力的开篇来抓住所有人的注意力，为接下来的陈述奠定基调。我们应当如何开始？" 
  cofpolitics.1002.desc.argue:0 "议事厅内的空气凝重得仿佛能听见彼此的心跳。我们与我们的反对者分坐两侧，壁垒分明。这不仅仅是一场辩论，这是一场意志的较量。国家广播的麦克风已经开启，我们必须用一个充满攻击性的开场，从一开始就摧毁对手的阵脚。" 
  cofpolitics.1002.pa:0 "从革命原则与法理入手。"
  cofpolitics.1002.pb:0 "用事实与数据进行理性分析。"
  cofpolitics.1002.pc:0 "诉诸情感，争取人心的支持。"
  cofpolitics.1002.aa:0 "揭露其论点的虚伪。"
  cofpolitics.1002.ab:0 "用知识构建壁垒。"
  cofpolitics.1002.ac:0 "质疑其辩论动机。"
  cofpolitics.1002.d:0 "还是算了。"

  cofpolitics.1003.title.preach:0 "[title_preach_turn_two]"
  title_preach_turn_two_win:0 "初战告捷"
  title_preach_turn_two_draw:0 "中规中矩"
  title_preach_turn_two_lose:0 "开局不利"
  cofpolitics.1003.title.argue:0 "[title_argue_turn_two]"
  title_argue_turn_two_win:0 "漂亮的一击"
  title_argue_turn_two_draw:0 "试探"
  title_argue_turn_two_lose:0 "措手不及"
  cofpolitics.1003.desc.preach:0 "[desc_preach_turn_two]" 
  desc_preach_turn_two_win:0 "我们掷地有声的发言，赢得了支持者们热烈的掌声，就连几个中立党派的代表也频频点头。势头正向我们倾斜，必须乘胜追击，将优势化为胜势。"
  desc_preach_turn_two_draw:0 "一阵礼节性的掌声过后，会场陷入了沉思。我们的发言并未激起强烈的反响，但也未招致公开的反对。代表们在观望，在权衡。接下来的发言，将决定天平的走向。"
  desc_preach_turn_two_lose:0 "几声刻意的咳嗽和邻座间的窃窃私语，打断了我们陈述的节奏。会场的气氛变得有些微妙，一些代表已经心不在焉。我们必须立刻调整方略，夺回主动权。"
  cofpolitics.1003.desc.argue:0 "[desc_argue_turn_two]" 
  desc_argue_turn_two_win:0 "我们尖锐的驳斥显然击中了对方的痛处！反对派的代表脸色铁青，阵脚大乱，而我们的支持者则发出了压抑的喝彩声。我们必须乘胜追击，将他们的防线彻底撕碎！"
  desc_argue_turn_two_draw:0 "第一轮交锋更像是一场试探。双方的言辞都如重拳击打在棉花上，未能对彼此造成实质性的伤害。整个议事厅都在观望，等待着真正血腥的厮杀开始。"
  desc_argue_turn_two_lose:0 "对手的反击比我们预想的更加犀利，我们的论点被巧妙地回避，甚至引来了几声嘲讽的窃笑。局面对我们相当不利，必须立刻找到对方的破绽，发动反击！"
  cofpolitics.1003.pa:0 "坚持理论权威，深化论点。"
  cofpolitics.1003.pb:0 "提出具体数据，回应潜在质疑。"
  cofpolitics.1003.pc:0 "分享个人经历，拉近与代表的距离。"
  cofpolitics.1003.aa:0 "寻找新的突破口。"
  cofpolitics.1003.ab:0 "用更复杂的论据反击。"
  cofpolitics.1003.ac:0 "将辩论引向对他们不利的领域。"

  cofpolitics.1004.title.preach:0 "[title_preach_turn_three]"
  title_preach_turn_three_draw_draw:0 "僵局"
  title_preach_turn_three_win_draw:0 "顺风"
  title_preach_turn_three_win_lose:0 "焦灼"
  title_preach_turn_three_lose_draw:0 "脱困"
  cofpolitics.1004.title.argue:0 "[title_argue_turn_three]"
  title_argue_turn_three_draw_draw:0 "辩论的堑壕"
  title_argue_turn_three_win_draw:0 "推进"
  title_argue_turn_three_win_lose:0 "鼻青脸肿"
  title_argue_turn_three_lose_draw:0 "背水一战"
  cofpolitics.1004.desc.preach:0 "[desc_preach_turn_three]" 
  desc_preach_turn_three_draw_draw:0 "两轮不温不火的陈述过后，会场陷入了一种微妙的僵持。我们没能激起热烈的支持，但也未曾失言。代表们在观望，在权衡，在等待一个能让他们最终下定决心的声音。我们必须用这最后的机会，打破僵局，为我们的议案注入决定性的力量。"
  desc_preach_turn_three_win_draw:0 "我们已经占据了上风。前两轮的发言为我们赢得了宝贵的支持，会场的气氛明显对我们有利，支持者们的眼神中充满了期待。胜利的曙光就在眼前，现在，我们只需用一个强有力的收尾，将优势彻底转化为决定性的胜利。"
  desc_preach_turn_three_win_lose:0 "议事厅内的空气紧张得近乎凝固。经过两轮激烈的思想交锋，我们与潜在的反对者们打成了平手。每一位尚未做出决定的代表都在等待着我们的最后陈词。这最后一轮的发言，将成为压垮天平的最后一根稻草。我们所有的努力，成败在此一举！"
  desc_preach_turn_three_lose_draw:0 "我们正处在被动的境地。之前的发言未能说服多数代表，会场中弥漫着怀疑与观望的气氛。我们被逼到了墙角，时间所剩无几。这最后一轮的发言，是我们扭转局势、反败为胜的最后机会。"
  cofpolitics.1004.desc.argue:0 "[desc_argue_turn_three]" 
  desc_argue_turn_three_draw_draw:0 "这已经变成了一场消耗战。两轮交锋都以平局告终，双方都未能找到对方的致命弱点。代表们已经开始显露疲态。我们必须用这最后的机会，打破僵局，一举击溃对手的意志。"
  desc_argue_turn_three_win_draw:0 "我们已经占据了绝对上风，对手的辩词变得愈发混乱，只能勉强招架。会场的气氛完全被我们掌控，胜利近在咫尺。现在，只需用一个无可辩驳的最终陈词，将对手彻底钉在耻辱柱上！"
  desc_argue_turn_three_win_lose:0 "一场血腥的平局！两轮交锋过后，双方都已是伤痕累累，但谁也未能将对方击倒。议事厅内的空气紧张得能拧出水来。这最后的反驳，将是决定性的。我们所有的努力，在此一举！"
  desc_argue_turn_three_lose_draw:0 "我们正被逼入绝境。对手的攻势一波猛过一波，而我们只能勉强守住阵线。会场中弥漫着怀疑与观望的气氛。这最后一轮发言，是我们扭转战局、反败为胜的最后机会！"
  cofpolitics.1004.pa:0 "用革命法理做最终总结。"
  cofpolitics.1004.pb:0 "以最终的利弊分析结束。"
  cofpolitics.1004.pc:0 "发出最诚挚的呼吁。"
  cofpolitics.1004.aa:0 "直击要害，发动最终攻击。"
  cofpolitics.1004.ab:0 "旁征博引，进行最终总结。"
  cofpolitics.1004.ac:0 "煽动群众，彻底孤立对手。"

  cofpolitics.1005.title.preach:0 "[title_preach_result]"
  title_preach_result_200:0 "酣畅淋漓"
  title_preach_result_201:0 "正确的发言"
  title_preach_result_210:0 "有惊无险"
  title_preach_result_102:0 "平淡"
  title_preach_result_111:0 "凝固的空气"
  title_preach_result_000:0 "耳旁风"
  title_preach_result_012:0 "惜败"
  title_preach_result_120:0 "犯错"
  title_preach_result_021:0 "一次落败"
  title_preach_result_020:0 "如同灾难"
  cofpolitics.1005.title.argue:0 "[title_argue_result]"
  title_argue_result_200:0 "居高临下"
  title_argue_result_201:0 "主宰"
  title_argue_result_210:0 "胜利者"
  title_argue_result_102:0 "惊险"
  title_argue_result_111:0 "无疾而终"
  title_argue_result_000:0 "无疾而终"
  title_argue_result_012:0 "遗憾"
  title_argue_result_120:0 "平凡的失败"
  title_argue_result_021:0 "无力回天"
  title_argue_result_020:0 "无能为力"
  cofpolitics.1005.desc.preach:0 "[desc_preach_result]" 
  desc_preach_result_200:0 "当最后一句陈词落下，讲堂里爆发出雷鸣般的掌声，经久不息，如同革命胜利那日的欢呼！我们的论点无懈可击，每一次阐述都直击人心，彻底征服了整个议会。支持者们的眼中闪烁着信念的火焰，就连最顽固的代表也面露敬佩，无言以对。毫无疑问，这不仅仅是一场演讲的胜利，更是一次思想的完胜。"
  desc_preach_result_201:0 "我们的发言结束时，会场响起了热烈而持久的掌声。我们的论点清晰有力，主导了整场演讲的走向。虽然有一个观点未能激起波澜，但整体的势头已不可阻挡。我们牢牢掌控了局势，为呼吁支持者铺平了最坚实的道路。"
  desc_preach_result_210:0 "这是一场艰苦的演讲。我们的一段陈述曾引发了代表们的疑虑和交头接耳，但我们迅速调整了策略，在接下来的发言中以更强大的说服力重新夺回了主动权！当演讲结束时，支持者们如释重负的欢呼声淹没了一切。我们赢了，虽然赢得惊险，但胜利的果实因此更显珍贵。"
  desc_preach_result_102:0 "演讲结束了。会场里没有雷鸣般的掌声，只有支持者们略显克制的相互点头和祝贺。我们在关键议题上取得了突破，那个观点深深打动了在场的许多人。尽管其余时间都未能激起太大的波澜，但这关键的一击，或许足以决定议案的命运。"
  desc_preach_result_111:0 "讲堂里的空气仿佛凝固了。我们的演讲既有赢得满堂喝彩的闪光点，也有引发一片沉默的失误之处。最终，支持与反对的声音相互抵消，整个议会陷入了微妙的平衡。最终的投票结果，将取决于那些尚未做出决定的摇摆者。"
  desc_preach_result_000:0 "我们的演讲……波澜不惊。它既没有冒犯任何人，也没能激励任何人。代表们礼节性地听完了全程，给予了稀疏的掌声，然后便立刻回到了各自的交谈中。我们的声音在议事厅里回响过，却没能留下任何痕迹。"
  desc_preach_result_012:0 "尽管一部分核心论点都未能说服听众，甚至引起了一些质疑，但我们其中一段充满激情的陈述，却意外地点燃了部分代表心中的火焰，赢得了他们发自内心的尊重。我们或许输掉了这场演讲，但我们播下的火种，或许会在未来某刻燃烧。"
  desc_preach_result_120:0 "我们一直努力地维持着场面，避免犯错，但最终还是在某些关键问题上失言，引来了代表们的阵阵议论。尽管我们努力补救，但最终也只获得了中立的反应。我们未能说服议会，只能寄望于支持者们坚定的立场了。"
  desc_preach_result_021:0 "这是一场令人沮丧的演讲。我们精心准备的论点都遭到了代表们的冷遇，会场中弥漫着怀疑与不信任的气氛。我们拼尽全力，也只换来了一次不痛不痒的平局。看起来，局势对我们相当不利。"
  desc_preach_result_020:0 "一场彻头彻尾的溃败。我们的每一个论点都石沉大海，换来的只是代表们礼貌而疏远的沉默，甚至是后排传来的窃窃私语。我们不仅没能争取到任何支持，反而可能让一些中立者彻底倒向了另一边。"
  cofpolitics.1005.desc.argue:0 "[desc_argue_result]" 
  desc_argue_result_200:0 "一场完美的屠杀！我们的每一次反驳都如同一把利刃，精准地刺穿了对手的谎言与诡辩。当辩论结束时，反对派的代表面如死灰，甚至不敢抬头迎接我们胜利的目光。整个议事厅，只剩下我们支持者雷鸣般的喝彩！"
  desc_argue_result_201:0 "我们主宰了这场辩论。对手的反击在我们的铁壁面前显得苍白无力，只能勉强自保，最终被我们彻底压制。虽然未能赢得每一次交锋，但我们的胜利是无可置疑的，整个议会都见证了他们的溃败。"
  desc_argue_result_210:0 "这是一场艰苦的拉锯战。反对派一度发起了有力的反击，在某一回合中占了上风。但我们迅速调整了策略，在接下来的交锋中重新夺回了主动权，并给予了决定性的一击！当辩论结束时，支持者们如释重负的欢呼声淹没了一切。我们赢了！"
  desc_argue_result_102:0 "辩论结束了。会场里没有雷鸣般的掌声，只有支持者们略显克制的相互点头和祝贺。我们在关键回合中取得了突破，但其余时间都陷入了与对手的僵持和相互消耗中。我们以微弱的优势胜出，但这足以决定议案的命运。"
  desc_argue_result_111:0 "讲堂里一片沉寂，既无胜利的欢呼，亦无失败的叹息。激烈的交锋过后，双方都未能取得决定性的优势；或是整场辩论都未能触及核心，最终变成了一场令人困惑的僵局。我们的论点引发了讨论，也制造了困惑。这场思想的交锋，以平局告终。"
  desc_argue_result_000:0 "讲堂里一片沉寂，既无胜利的欢呼，亦无失败的叹息。激烈的交锋过后，双方都未能取得决定性的优势；或是整场辩论都未能触及核心，最终变成了一场令人困惑的僵局。我们的论点引发了讨论，也制造了困惑。这场思想的交锋，以平局告终。"
  desc_argue_result_012:0 "我们几乎就要守住了……在大部分时间里，我们成功地与对手周旋，将辩论拖入了僵局。然而，在最关键的一轮，对方的论述撕开了一道微小的缺口，并最终决定了整场辩论的走向。反对派的阵营里传来了压抑着的、如释重负的庆祝声。我们虽未溃败，但终究是输了。"
  desc_argue_result_120:0 "我们一度看到了胜利的曙光，在某个回合中，我们犀利的反击曾让对手哑口无言。但遗憾的是，反对派凭借更充分的准备，在后续的交锋中重新占据了上风。演讲结束时，会场里响起支持者们充满遗憾的叹息。我们虽败犹荣，但失败的苦涩依然难以下咽。"
  desc_argue_result_021:0 "这是一场令人沮丧的辩论。从一开始，我们就处在被动防守的境地，只能勉强招架对手一轮又一轮的攻势。尽管我们拼尽全力扳回一局平手，但最终还是无力回天。反对派的胜利是理所当然的，我们必须承认，在这次交锋中，我们的准备远不如人。"
  desc_argue_result_020:0 "一场彻头彻尾的溃败。我们的每一个论点都被对方无情地解构、批驳得体无完肤。讲堂里弥漫着失败的气息，支持者们士气低落，而反对者的阵营则爆发出毫不掩饰的嘲笑与喝彩。我们被沉默了，被压制了。在这场交锋中，我们输得毫无悬念。"
  cofpolitics.1005.a:0 "静待命运的裁决。"

