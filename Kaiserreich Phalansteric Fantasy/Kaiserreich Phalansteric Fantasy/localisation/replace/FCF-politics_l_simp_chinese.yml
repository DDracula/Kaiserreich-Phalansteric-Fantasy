  cofpolitics.174.b:0 "这只不过是反对派的谣言。"
  cofpolitics.174.c:0 "什么时候花边小报也能当成信源了？"

  cofpolitics.175.title:0 "自作主张"
  cofpolitics.175.desc:0 ""
  cofpolitics.175.a:0 "这下完了！"
  cofpolitics.175.b:0 "赶紧把他们关起来！"  

  cofpolitics.176.title:0 "丑闻！"
  cofpolitics.176.desc:0 ""
  cofpolitics.176.a:0 "为什么他们总是和我们对着干！"

