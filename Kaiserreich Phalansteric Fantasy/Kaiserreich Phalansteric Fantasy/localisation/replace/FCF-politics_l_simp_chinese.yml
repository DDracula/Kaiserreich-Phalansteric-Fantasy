  synd_mode_politics_landscape:0 "§Y大帐篷之下§!\n§g自革命成功以来，政治派系之间的攻伐从未结束过。但所有人都明白，彼此之间的共同点远远多于不同点，我们的目的是一致的：建设社会主义。当谈判成为了争吵，当合作成为了斗争，那么一切的可能都会论为无效的内耗。团结，谅解，合作才能将社会主义从理论的漩涡中拖拽到现实里。革命是为了改革，改革是为了革命！§!\n$sorelian_sincerity$：[?sorelian_sincerity|.0+=][under_tent_sorelian]\n$anarchist_sincerity$：[?anarchist_sincerity|.0+=][under_tent_anarchist]\n$technocrat_sincerity$：[?technocrat_sincerity|.0+=][under_tent_technocrat]\n$communist_sincerity$：[?communist_sincerity|.0+=][under_tent_communist][crack_extremists][syndicats_stratification][midway_society]"
