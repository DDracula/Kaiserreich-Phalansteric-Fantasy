#事件
##城乡矛盾
  cofsociety.1.title:0 "面包与齿轮的争吵"
  cofsociety.1.desc:0 "夜，巴黎，贝尔维尔区。一家工人酒馆的空气，像凝固的黄油一样，混杂着汗水、烟草和廉价葡萄酒的气味。\n\n艾蒂安·卢梭感觉自己像个外乡人。他确实是。三个月前，他告别了法兰西中部那片被遗忘的、贫瘠的土地和他家小小的农庄，带着公社的招工许诺和一口浓重的乡音，来到了这座钢铁与蒸汽的巨兽。白天，他在雷诺工厂的车间里，用那双习惯了泥土和犁耙的手，去伺候冰冷的冲压机。到了晚上，他会来这里，试图用一杯酒洗去一天的疲惫和孤独。\n\n麻烦就是在这里找上他的。\n\n邻桌是几个年轻的、穿着体面工装的本地人。他们是巴黎公社的宠儿——技术学校的学生，未来的工程师。他们的谈话充满了艾蒂安听不懂的术语和一种与生俱来的、俯瞰众生的自信。\n\n“……所以说，问题的根源在于生产关系的异化，而不是生产力本身……”其中一个戴眼镜的年轻人高谈阔论着，他的目光扫过艾蒂安，带着一丝不易察觉的轻蔑。“当然，要让某些同志理解这一点，可能有点困难。”\n\n他的同伴们发出一阵窃笑。另一个瘦高的青年开口了，声音不大，却像针一样刺耳：“看看他的手。纯粹的劳动力。他们把最强壮的牲口送到巴黎来转动齿轮，自己却留在乡下，享受着我们创造的现代生活。这就是革命的城乡分工，不是吗？”\n\n酒馆里的嘈杂声似乎瞬间降低了几个分贝。艾蒂安握紧了酒杯，指节因为用力而发白。他抬起头，迎着那几双戏谑的眼睛，一字一句地说：“我的手，是用来种出你们嘴里的面包的。这双手，和你们摆弄图纸的手一样，都在为法兰西服务。不，这双手更重要，因为没有面包，你们的理论和齿轮，都只是一堆会生锈的废铁。”\n\n空气凝固了。戴眼镜的青年站了起来，他的脸涨得通红。“废铁？你管革命的工业心脏叫废铁？你懂什么，乡巴佬！我们正在用科学和秩序建设一个全新的国家，而你们，你们这些农民，只会像几个世纪前一样，面朝黄土背朝天！你们是法兰西的过去，而我们，是未来！”\n\n“未来不能填饱肚子！”艾蒂安也站了起来，打翻了桌上的酒杯。\n\n一场推搡和扭打随之而来，很快就被其他工人拉开。但这已不再重要。这场关于面包和齿轮的争吵，像一滴墨水，滴入了法兰西这杯看似清澈的水中。第二天，巴黎的小报用煽动的标题报道了此事——《一个农民对工业的无知与怨恨》。而外省的报纸则针锋相对——《城市的傲慢：谁在忘恩负义?》。\n\n一件小事，在一个错误的时刻，变成了一根足以撬动整个国家的杠杆。城乡之间那道早已存在的、深刻的鸿沟，被血淋淋地撕开，暴露在所有人面前。"
  cofsociety.1.a:0 "我们做错了什么？"
  cofsociety.1.b:0 "我们做了太多错误，同志。"
  Cof_intensified_urban_rural_conflicts:0 "日益激化的城乡矛盾"
  Cof_intensified_urban_rural_conflicts_desc:0 "法兰西有两颗心脏，它们以不同的频率跳动，将这个国家撕裂成两个互不理解的世界。一颗在巴黎的熔炉与议会里轰鸣，用齿轮和理论构建着世界的明天；它为自己的力量感到骄傲，将广袤的乡野视作其宏伟蓝图上一块落后但必要的拼图。另一颗，则在无尽的田野间沉默地跳动，用汗水和古老的节律，供养着那座日益遥远而傲慢的城市。\n\n革命曾许诺要将这两颗心脏联通，但剪刀差的冰冷现实，却只换来了精英不耐烦的轻蔑和机器运转中的恼人杂音。现在，沉默的心脏终于开始发出自己的声音，诉说着被遗忘的辛劳与贡献。一道深刻的裂痕，正在共和国的大地上无声地蔓延，将同志变成了邻人，将邻人变成了敌人。"
  Cof_eased_urban_rural_conflicts:0 "缓和的城乡矛盾"
  Cof_eased_urban_rural_conflicts_desc:0 "那道曾将法兰西撕裂成两个世界的鸿沟，正在缓慢地弥合。\n\n巴黎熔炉的轰鸣声，似乎不再那么刺耳；而在广袤的田野间，长久的沉默也正被一种谨慎的希望所取代。从城市运来的新拖拉机和化肥，是对过去亏欠的迟来补偿；而从乡间送往首都的，除了面包，还有一份被重新唤起的、对共同事业的信任。\n\n在工人的酒馆里，人们开始谈论粮食的来之不易；在乡村的集市上，人们也开始讨论工业带来的新变化。两个法兰西，正在笨拙地、试探性地，学习说同一种语言。\n\n裂痕犹在，伤疤未愈，通往真正团结的道路依然漫长。但至少，城市与乡村不再背对彼此，而是开始并肩，朝着同一个方向前行。"
##妇女节游行
  cofsociety.2.title:0 "四月十一日的怒火"
  cofsociety.2.desc:0 "1938年4月11日，巴黎。按照官方安排，为纪念在1871年4月11日成立的“保卫巴黎和救护伤员妇女联盟”(Union des Femmes)而设立的妇女节的庆祝活动正在共和国广场有条不紊地进行。BGT的代表在台上发表着千篇一律的演说，赞扬着女性同志在工厂和家庭中为革命做出的“同等重要的贡献”。然而，台下的气氛却远非和谐。在官方游行队伍的外围，一支规模远超预期的队伍正在集结，她们高举着未经审查的标语：“面包和玫瑰，缺一不可！”、“我们的子宫不为国家服务！”、“打倒家务劳动的暴政！”\n\n\这些是来自公社内部最激进的女权主义者、无政府主义者和左翼社会主义者。在她们看来，这场官方庆典不过是男性领导层用以粉饰太平的又一场政治作秀。革命胜利多年，但妇女的真正解放却被无限期地推迟了。她们依然被困在传统的家庭角色中，同工同酬的承诺在许多工会中仍是一纸空文，而在BGT和CSP的高层会议里，女性的声音更是微乎其微。像梅·皮奎雷这样的资深活动家早已对这种“父权制的工团主义”失去了耐心。\n\n当官方游行队伍准备出发时，这支“不速之客”突然汇入了主干道，她们高唱着充满战斗性的歌曲，口号声浪盖过了官方的喇叭。混乱随之而来。负责维持秩序的民兵试图将她们隔离开，却引发了激烈的推搡和扭打。几名带头的女权主义者被强行逮捕，但这反而激起了更多女性的愤怒。很快，整场游行演变成了一场席卷巴黎市中心的骚乱，商店橱窗被砸碎，交通陷入瘫痪。\n\n这场“妇女节骚乱”震惊了整个公社。它如同一道刺眼的闪电，划破了革命团结的表象，将一个尖锐的问题摆在了所有人的面前：这场革命，究竟是谁的革命？"
  cofsociety.2.a:0 "又一个烂摊子。"

