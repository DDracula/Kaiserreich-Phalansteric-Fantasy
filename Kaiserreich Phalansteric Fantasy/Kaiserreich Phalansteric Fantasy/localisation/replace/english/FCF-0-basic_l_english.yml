  FCF_phalanstere:0 "Member of the Phalanstère"
  FCF_phalanstere_desc:0 "[INT_internationale_industry_system][mio_phalanstere_industry_investment_loc]An old dream of Charles Fourier, a utopia of harmonious communities—the Phalanstère. Amid the fires of revolution, that dream has been forged anew. No longer a fantasy confined to paper, it has become a great undertaking led by the Commune of France to unite socialist comrades throughout the world.\n\nAs a member of this red bastion, we no longer stand alone. We form part of a global front against imperialism and capitalism, and together lay the foundations of a new world order. We share the most advanced technologies and coordinate our production; our fate is now inseparably bound to that of every oppressed people. The Phalanstère belongs to all humanity, and its glory is ours as well."
  FCF_phalanstere_tt:0 "Due to $phalanstere_unity$ of [?global.phalanstere_unity|Y.1%%]: [INT_targeted_modifier_tt]"
  INT_targeted_modifier_tt:0 "[INT_targeted_modifier_content]"
  INT_targeted_modifier:0 "\n(§YAll Members of the Phalanstère§!) $MODIFIER_TRADE_COST_TO_TARGET_FACTOR$: [?-0.33|%.2-=]"
  mio_phalanstere_industry_investment_tt:0 "§WPhalanstère Investment Progress: [?global.phalanstere_industry_investment_progress|.1G%%]\n§g$phalanstere_industry_tooltip$§!§!\n--------------\n"

  phalanstere_unity_detail:0 "[phalanstere_unity_detail_loc]"
  phalanstere_unity_detail_tt:0 "$phalanstere_unity$: [?global.phalanstere_unity|G.1%%]\nMonthly Change: [?global.phauc_monthly|+=.1%%]$tooltip_dividing_line$\n[?global.phauc_monthly1|+=.1%%] from [?global.phalanstere_member^num|Y.0] §YMembers of the Phalanstère§!\n[?global.phauc_monthly2|+=.1%%] [phalanstere_unity_monthly_change_ideology]"
  phalanstere_unity_monthly_change_ideology_no:0 "from ideological disarray"
  phalanstere_unity_monthly_change_ideology_totalist:0 "from the number of §Y$FCF_phalanstere$§! whose ideology differs from the prevailing ideology ($phalanstere_totalist_advantage_tt$)"
  phalanstere_unity_monthly_change_ideology_syndicalist:0 "from the number of §Y$FCF_phalanstere$§! whose ideology differs from the prevailing ideology ($phalanstere_syndicalist_advantage_tt$)"
  phalanstere_unity_monthly_change_ideology_radical_socialist:0 "from the number of §Y$FCF_phalanstere$§! whose ideology differs from the prevailing ideology ($phalanstere_radical_socialist_advantage_tt$)"
  phalanstere_unity_monthly_change_ideology_social_democrat:0 "from the number of §Y$FCF_phalanstere$§! whose ideology differs from the prevailing ideology ($phalanstere_social_democrat_advantage_tt$)"

  phalanstere_ideology_1_tt:0 "§YRevolutionary Workerism§!\nRevolutionary Workerism is a synthesis of French syndicalism and the practical experiences of the Russian and French revolutions. At its core lies close and equal cooperation between professional revolutionary organisations and revolutionary trade unions, drawing upon the theories of Marx, Pelloutier, De Leon, Sorel, Lenin and others. Its supporters believe that it strikes the perfect balance between the organisation and spontaneity required by a revolution, citing the success of the French Revolution and the early vitality of the Russian Revolution as the strongest evidence for their claim. By contrast, the centralising measures adopted by the Bolsheviks after Lenin's death are regarded as the principal cause of the Russian Revolution's ultimate failure. Consequently, this doctrine has become the overwhelmingly dominant current within the international revolutionary socialist movement. Its adherents commonly name their organisations “Workers' Parties”, or, more directly, “Syndicalist Parties”."
  phalanstere_ideology_2_tt:0 "§YRevolutionary Social Democracy§!\nRevolutionary Social Democracy inherits and develops the orthodox Marxism of the Second International. It places party activity above all else and remains ever vigilant against the adventurist tendencies found within syndicalism. Although it encourages parliamentary struggle, its ultimate objective remains the seizure of political power; it rejects the notion that socialism can be achieved merely by reforming the bourgeois state apparatus. Parties of this persuasion generally possess a deep Marxist theoretical tradition, taking pride in such revolutionary forebears as Marx, Engels, Guesde, Jaurès and Plekhanov, while lamenting the eventual betrayal of the revolution by Kautsky, one of the tradition's most important inheritors. Lenin and the Bolsheviks, meanwhile, are regarded as heterodox deviationists: in particular, the dissolution of the Constituent Assembly and the break with the Mensheviks are still widely considered decisive causes of the Russian Revolution's failure."
  phalanstere_ideology_3_tt:0 "§YRadical Reformism§!\nRadical Reformism is, as its name suggests, a variety of reformist socialism distinguished by more radical political commitments—although this radicalism is often less a matter of conviction than a reluctant accommodation to the worldwide tide of socialist revolution. It has little interest in seizing political power, concerning itself instead with improving the welfare of working people through gradual social reforms. This has earned it enthusiastic support among those who have materially benefited from its efforts. It possesses no unified theoretical foundation: a minority may genuinely draw inspiration from Fabianism or Bernstein, but most of its adherents are motivated by sympathy for the real suffering of their people and a simple humanitarian spirit. In recent years, the influence of Belgian Labour Party theorist Henri de Man and his “Planisme” has led a handful of Radical Reformist parties in a more authoritarian direction."
  phalanstere_ideology_4_tt:0 "§YAnarcho-Syndicalism§!\nAnarcho-Syndicalism originated chiefly among those currents of the international syndicalist movement that firmly rejected any association with professional revolutionary organisations. From anarchist forebears such as Proudhon and Bakunin, they inherited an abiding hostility towards socialist political parties. With the advance of industrialisation and the labour movement, anarchism and anarcho-syndicalism have in practice become virtually inseparable, each serving as the other's political and industrial expression. Meanwhile, the widespread popularity of Revolutionary Workerism has confined Anarcho-Syndicalism to a position of relative dominance in only a few countries and regions, most notably the Spanish CNT–FAI and the Argentine Syndical Union."
  phalanstere_ideology_5_tt:0 "§YNational Syndicalism§!\nNational Syndicalism can be traced to the “New School” that flourished around the journal Mouvement socialiste during the late Belle Époque—in other words, the intellectual circle surrounding Sorel. Alongside Sorel himself, its principal theorists included Hubert Lagardelle, Édouard Berth and Agostino Lanzillo. Early syndicalism lacked a clearly defined and systematic doctrine, but was evidently influenced by Bernstein's theories, Proudhon's conception of virtue, Bergsonism and Le Bon's psychology of crowds. Sorel likewise recognised the economic value of Marxism, yet insisted that every theory must submit to practical experience and necessity. Through subsequent interpretations by figures such as Grayson, this revisionism ultimately evolved into a fervent exaltation of political struggle and, above all, political mobilisation. Whether Sorel would have approved or not, the National Syndicalist ideal now ascendant within the Commune has come to signify a proletarian revolution conducted through the nation: one that will purge the parasitism of bureaucrats, rentiers, international financiers and corporate lobbyists alike, and establish a proletarian warrior-state capable of defending the collective interests of the people."
  phalanstere_ideology_6_tt:0 "§YFascism§!\nFascism can trace its name to the Sicilian peasant Fasci of the late nineteenth century; in Italian, this ancient word means a “union” or “league”. During the Weltkrieg, establishment parliamentary groups known as the “Fasci di Difesa Nazionale” also emerged within the Italian legislature. After the Italian Civil War began and Austria intervened by force of arms, left-wing interventionists, revolutionary syndicalists and moderate socialists found themselves united upon the common ground of Italian patriotism. For a long period thereafter, Fascism remained a fervent champion of Italy's “Second Risorgimento”, directing most of its political passion towards the reunification of Italy.\n\nThrough the influence of Hubert Lagardelle and others, political currents tinged with Fascism have gradually emerged within the Commune as well. Fascist organisations in the Commune likewise embrace the name “Faisceau”, but unlike their Italian comrades, French Fascist activists direct their ire against the inefficient federal system and what they call “absolute parliamentary despotism”. The Fascists were among the most steadfast supporters of prosecuting the trade unions during the Martin Affair. They charge that the Commune has failed to escape the cages of bureaucracy and representative government, advocating referendums, a stronger executive, the consolidation of central institutions and higher organisational thresholds for political parties. Through these measures, they hope to rekindle the political passion of the Communard people and transform the Commune into a truly revolutionary state of the common masses. French Fascists believe that only beneath the guarantee of a genuine “volonté générale” can the French nation find its leader, and the Revolution its proper direction."
  phalanstere_ideology_7_tt:0 "§YRevolutionary Vanguardism§!\nRevolutionary Vanguardism originated in the organisational principles set out by Lenin in What Is to Be Done?, emphasising the secrecy and centralisation required of professional revolutionary organisations operating under intense political repression. After Lenin's death and the failure of the Russian Revolution, a profound dispute arose over his legacy between Zinoviev's accommodationist faction and Sverdlov's hardliners. The former sought to revise their doctrine so as to draw closer to the international revolutionary mainstream, while reconciling with the Mensheviks engaged in legal political struggle. The latter resolutely defended theoretical purity and organisational independence, only to fall into the opposite extreme. The hardliners ultimately prevailed, completely rejecting the encroachment of syndicalist ideas and parliamentary politics. They instead embraced a strategy of pure armed insurrection, advocating a highly centralised organisation and displaying open hostility towards spontaneous activity. Although they remain a minority within the international socialist movement, committed adherents of this doctrine can still be found throughout the world."
  phalanstere_ideology_8_tt:0 "§YLeft-Wing Nationalism§!\nLeft-Wing Nationalism is distinguished by the particular questions it seeks to address. Its central purpose is to oppose imperialism and colonialism while combining socialism with indigenous traditions. The current encompasses an extraordinarily broad range of tendencies, including conventional nationalism as well as pan-nationalist movements such as revivalism and Pan-Africanism. Its methods are equally varied, ranging from moderate reform to violent revolution."

