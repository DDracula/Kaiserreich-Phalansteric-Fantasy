  economy_industry_field_name:0 "Ind."
  eib_detail:0 "§gThe foundation of the national economy lies in the output of its core industries. The supply of basic materials such as steel, coal and electricity directly determines the limits of our industrial system. These resources are prerequisites for constructing factories and laying railways, as well as the material foundation of national defence. Ensuring the steady growth of these fundamental sectors is a strategic task confronting the Commune at every stage of development, for both our survival and our future depend upon them.§!"

  eip_detail:0 "§gAdvanced machinery is undoubtedly important, but the effective organisation of workers and equipment is what ultimately determines productive efficiency. This is a test of our command of scientific management: optimising production processes, improving the organisation of labour and encouraging the initiative of the workers so as to reduce friction and waste. A well-designed organisational system allows industry to realise far more of its potential and ensures that we extract the greatest possible output from every investment.§!"

  eia_detail:0 "§gIn the face of grave external threats, formidable industrial potential must be rapidly convertible into reliable military strength. This indicator measures our ability to transform the power of the civilian economy into the means of self-defence, including the capacity of our arsenals, the modernity of our weapons and our potential for wartime mobilisation. A military-industrial system capable of independently producing advanced armaments and rapidly expanding their production is an indispensable bulwark against aggression and the surest defence of the Revolution's achievements.§!"

  economy_agriculture_field_name:0 "Agri."
  eam_detail:0 "§gAgriculture is the foundation of the national economy, yet traditional cultivation can no longer meet the needs of a modern state. The extent to which agricultural production has been modernised determines whether rural labour can be freed from exhausting manual work. By introducing tractors, combine harvesters and other modern machinery, we can greatly increase agricultural productivity while releasing millions of workers for emerging industries.§!"

  eae_detail:0 "§gNational food security requires us to overcome the ancient dependence of agriculture upon the whims of nature. The production and application of modern chemical products such as fertilisers and pesticides directly determine the productive potential of our soil. Developing these industries will allow more scientific cultivation and higher yields per hectare. This is essential to feeding a growing urban population, preserving long-term social stability and maintaining supplies in wartime.§!"

  eaa_detail:0 "§gThe value of agriculture should not end with raw produce at the farm gate. Developing food processing, textiles, biomaterials and related industries can greatly increase the value added to agricultural products. A complete chain stretching from raw materials to consumer goods will increase the incomes of peasants and local cooperatives, create employment, stimulate domestic consumption and establish a virtuous economic cycle between town and countryside. Such integration is one of the defining marks of agricultural modernisation.§!"

  economy_society_field_name:0 "Social"
  eq_detail:0 "§gThe historical imbalance between town and countryside, and between different regions, is both an internal contradiction restricting our development and a potential source of social instability. Our efforts to narrow income gaps, extend public services and coordinate regional development will directly affect the stability of society. Greater equality is not merely an ideological aspiration, but a practical necessity for strengthening internal cohesion, unleashing the population's consumer potential and consolidating the legitimacy of the Communard order.§!"

  el_detail:0 "§gA national economy is not merely the sum of its individual industries, but a complex and interconnected network. The efficiency with which resources, goods and information flow between different sectors directly determines the overall cost of economic activity. Historical circumstances have left our industrial system fragmented, producing needless waste and friction. Greater coordination between its various branches is therefore essential to reducing losses and improving the efficiency of the economy as a whole.§!"

  ei_detail:0 "§gIn the long contest between nations, technological superiority will ultimately decide the victor. This encompasses our investment in fundamental science, our ability to organise the development of new technologies and the mechanisms through which scientific achievements are rapidly converted into productive forces. While capitalist innovation remains constrained by short-term profit, we can concentrate upon fields possessing long-term strategic significance for the country and its people. Herein lies one of the fundamental advantages of our system.§!"

