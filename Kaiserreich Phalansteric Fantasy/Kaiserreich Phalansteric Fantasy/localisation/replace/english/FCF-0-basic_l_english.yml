# Dynamic Modifiers
  FCF_economy_modifier:0 "Federal Economy"
  FCF_economy_modifier_desc:0 "Post-reconstruction, the federal economy shows steady growth. Regional gaps persist, but commune development is broadly successful. Without capitalist accounting, selected metrics still quantify performance. Describing the model is difficult; we can only identify and classify common features. Thus economic direction is set by concrete activity, not abstract descriptions."
  FCF_economy_modifier_tt:0 "Effects of $economy_values$: [cof_economy_situation] ([?economy_values|+=.1])\n- $MODIFIER_POLITICAL_POWER_GAIN$: [?ev1_show|.2+=]\n- $economy_power_gain$: [?ev1_show|.2+=]\n\nEffects of [?economy_industry_basic|Y.1] $economy_industry_basic$:\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: [?eib1_show|.2%+=]\n- $modifier_production_speed_industrial_complex_factor$: [?eib2_show|.2%+=]\n- $MODIFIER_LOCAL_RESOURCES_FACTOR$: [?eib3_show|.2%+=]$economy_industry_basic_extra$\nEffects of [?economy_industry_process|Y.1] $economy_industry_process$:\n- $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: [?eip1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: [?eip2_show|.2%+=]\n- $MODIFIER_FACTORY_ENERGY_CONSUMPTION$: [?eip3_show|.1%-=]$economy_industry_process_extra$\nEffects of [?economy_industry_arms|Y.1] $economy_industry_arms$:\n- $modifier_production_speed_arms_factory_factor$: [?eia1_show|.2%+=]\n- $MODIFIER_CONVERSION_COST_CIV_TO_MIL_FACTOR$: [?eia2_show|-=.2%]$economy_industry_arms_extra$\n\nEffects of [?economy_agriculture_mechanized|Y.1] $economy_agriculture_mechanized$:\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?eam1_show|.0%+=]$economy_agriculture_mechanized_extra$\nEffects of [?economy_agriculture_chemical|Y.1] $economy_agriculture_chemical$:\n- $MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: [?eae1_show|.2%-=]\n- $MODIFIER_ENERGY_GAIN_FACTOR$: [?eae2_show|.2%+=]$economy_agriculture_chemical_extra$\nEffects of [?economy_agriculture_chain|Y.1] $economy_agriculture_chain$:\n- $MODIFIER_CONSUMER_GOODS_FACTOR$: [?eaa1_show|Y.1%]$economy_agriculture_chain_extra$\n\nEffects of [?economy_equal|Y.1] $economy_equal$:\n- $MODIFIER_STABILITY_FACTOR$: [?eq1_show|.2%+=]\n- $MODIFIER_CONSUMER_GOODS_FACTOR$: [?eq2_show|Y.1%]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: [?eq3_show|.2%+=]$economy_equal_extra$\n\nEffects of [?economy_link|Y.1] $economy_link$:\n- $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: [?el1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: [?el2_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: [?el3_show|.2%+=]$economy_link_extra$\n\nEffects of [?economy_innovate|Y.1] $economy_innovate$:\n- $MODIFIER_RESEARCH_SPEED_FACTOR$: [?ei1_show|.2%+=]$economy_innovate_extra$\n\nAltogether, we receive:"

