  iri_targeted_name:0 "[?ROOT.iri_targeted^0.GetName]\n[?ROOT.iri_targeted^0.GetRulingIdeology]"
  iri_intro_information:0 "Select a flag on the right to filter the available intervention options\nand review the conditions for intervention in that country"
  iri_information:0 "§Y[?ROOT.iri_targeted^0.GetName]§! is ruled by the §Y[?ROOT.iri_targeted^0.GetRulingParty]§! under §Y[?ROOT.iri_targeted^0.GetLeader]§!.\n§gIts society is [iri_information_stability]§!\n§tIts domestic left-wing forces are [iri_information_left]§![iri_information_loc]"
  iri_information_stability_50:0 "stable. The people have little appetite for revolution, making revolutionary activity difficult to organise."
  iri_information_stability_25:0 "riven with contradictions. The people place their hopes in reform, although some have already committed themselves to revolution."
  iri_information_stability_10:0 "deeply unstable. Chaos is sweeping the country, and growing numbers are willing to join the revolution."
  iri_information_stability_0:0 "on the brink of collapse. Mass movements are erupting one after another, offering tremendous opportunities for the revolutionary cause."
  iri_information_stability_00:0 "in complete collapse. The people are sick of the status quo, mass movements are surging, and the revolution needs only one final push!"
  iri_information_left_50:0 "extremely powerful, commanding enough support nationwide to organise strikes or even a revolution."
  iri_information_left_35:0 "highly active, enjoying sufficient support across the country to organise demonstrations and strikes."
  iri_information_left_20:0 "active, with a degree of influence throughout the country."
  iri_information_left_10:0 "weak, capable of exerting influence only in a few core regions."
  iri_information_left_0:0 "extremely weak, with only sporadic activity."
  iri_detail_ideology:0 "§RPan-Socialist Ideologies§!: [?ROOT.iri_targeted_ideology^1|R.1%%]\n§3Pan-Democratic Ideologies§!: §3[?ROOT.iri_targeted_ideology^2|.1%%]§!\n§gPan-Reactionary Ideologies§!: [?ROOT.iri_targeted_ideology^3|g.1%%]"
  iri_detail_stability:0 "§YStability§!: [?ROOT.iri_targeted_ideology^0|Y.1%]"
  iri_detail_revolution:0 "Revolutionary Viability: [?ROOT.iri_targeted_4|G.1%%]\nShould a revolution break out, [which_type_of_revolution]\n§gNote: certain countries cannot undergo a revolution in this manner§!"
  socialist_revolution:0 "it will be a §RSocialist Revolution§!"
  democrat_revolution:0 "it will be a §3Democratic Revolution§!"
  iri_cooperate_with_democrat:0 "If they agree, the revolution's chances of success will increase substantially, but it will become a §3Democratic Revolution§!. This means that the democratic government established after the war will not be a §RSocialist§! government. However, if the strength of §RPan-Socialism§! exceeds twice that of §3Pan-Democracy§!, the revolution will ultimately establish a §RSocialist§! government."
  republic_revolution:0 "it will be a §ORepublican Revolution§!"
  iri_cooperate_with_republic:0 "If they agree, the revolution's chances of success will increase substantially, but it will become a §ORepublican Revolution§!. This means that the republic established after the war will not be a §RSocialist§! state. However, if the strength of §RPan-Socialism§! exceeds twice that of §3Pan-Democracy§!, the revolution will ultimately establish a §RSocialist§! republic."

