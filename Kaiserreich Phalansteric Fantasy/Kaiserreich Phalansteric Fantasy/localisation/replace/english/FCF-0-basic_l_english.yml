  FCF_military_modifier_desc:0 "Although both the Federal Army and the Communal Militias are considered parts of the Commune's armed forces, the more regular Federal Army is unquestionably the revolutionary force upon which we can truly rely. Amid the political upheaval brought by the Revolution, the army itself has also become politicised. Every faction seeks influence within its ranks, while the army hopes that the government in Paris will settle the incessant internal disputes over the course of military reform."
