# Extremist Groups
  FCF_extreme_political_group:0 "Political Extremist Groups"
  FCF_extreme_political_group_desc:0 "Revolution is no cure for every ailment. The problems of the old Republic have resurfaced within the Commune as well. Far-right organisations such as the §YCamelots du Roi§! may have long since vanished from metropolitan France, but nothing has prevented new forms of political extremism from taking their place. Most are dissatisfied with the Commune's political order or embittered by their own circumstances, although some merely hope to profit from the grey areas of Communard society.\n\nEven when these groups do not openly threaten or oppose the revolutionary character of the Commune, their activities have a very real effect on the lives of its people. Those possessing sufficient influence have even begun to interfere in grassroots politics. Standing idle in the face of such developments would hardly befit a government of the people. Yet while some regard these factions as thorns in our side, others may see them as useful allies."
  FCF_extreme_political_group_tt:0 "Currently active extremist groups: [vertes_information][commando_information][mafia_information][red_guard_information]\n§GSuppressing these extremists will improve national stability§!"
