### OPENING SITUATION ###
##########
  FCF_weak_central_government:0 "Feeble Central Authority"
  FCF_weak_central_government_desc:0 "Before the Revolution, a federation of local communes was widely regarded as the most likely revolutionary model. After the Revolution—whether to fulfil that idealistic promise or simply because no one possessed the means to integrate the entire country—decentralisation became established practice. The central government can barely counter local decisions, while local authorities can exert influence at the centre through their delegates. Although local government likewise operates through a dual system of assemblies and committees intended to restrain one another, these checks exist largely in theory. Local political bosses have all but monopolised legislative and executive power. In principle, the Comité de salut public may issue instructions to local committees; after passing through layer upon layer of non-cooperation and overt or covert resistance, however, orders from the centre effectively cease to exist.\n\nMany anarchists and localists support this arrangement, but from the perspective of the country as a whole, it severely obstructs the allocation of resources across regions. Regional disparities have existed since the old Republic. Without a central authority capable of transferring resources between regions, France's uneven development will become still more distorted. Whatever doctrine one follows, anyone who remains committed to socialism cannot simply stand by and allow this situation to continue."

  FCF_CGT_special_statues:0 "The CGT's Special Status"
  FCF_CGT_special_statues_desc:0 "Even before the Revolution, the Confédération Générale du Travail was the largest trade-union organisation in France and subsequently became the backbone of the Revolution. After victory, it naturally emerged as the largest organisation participating in legislative affairs. Through its formidable organisational capacity and political influence, the CGT secured extensive legal protections for itself. Although the Commune proclaims that every union is treated equally, behind the language of equality there always seem to be certain unions that are more equal than others.\n\nThe CGT is not merely a powerful body for economic coordination, but a formidable political organisation as well. As the authority of the Commune's central government remained constrained, the CGT used its extensive local influence to evolve gradually into a kind of shadow government."

  FCF_CGT_contested:0 "The Contested CGT"
  FCF_CGT_contested_desc:0 "Even before the Revolution, the Confédération Générale du Travail was the largest trade-union organisation in France; when the Revolution came, the CGT became its central organising force. After the Revolution, it ceased to be merely a labour union and began participating directly in economic decision-making and political affairs—which originally accorded with the demands of syndicalism. Then came the 1934 case against the CGT. The policy of unity could no longer silence those whose interests had been harmed by the Confederation's monopoly. Debate over the CGT's post-revolutionary status has once again erupted on a vast scale. Whatever its future may hold, it cannot continue in its present form."
  FCF_CGT_contested_tt:0 "§RWe must handle the question of the CGT carefully before the conflict escalates§!"

##########
### NATIONAL FOCUSES ###
##########
  commune_of_france_focus:0 "Fédération des Communes de France Focus Tree"
# Economy
  FCF_focus_on_northern_industry:0 "Prioritise Northern Industry"
  FCF_focus_on_northern_industry_desc:0 "The coal smoke of northern France has never dispersed. From Calais to Lille and from Valenciennes to Maubeuge, the region's mines, blast furnaces and textile workshops form the backbone of federal industry. Yet ageing equipment, transport bottlenecks and energy shortages are steadily eroding this inheritance. We must direct investment northward and transform northern France into one of Europe's foremost industrial centres."

  FCF_city_of_shining_universally:0 "The City Whose Light Shines Everywhere"
  FCF_city_of_shining_universally_desc:0 "Paris is not merely the political heart of the Federation, but a beacon of socialist thought. Its influence must not remain confined within the city walls—the light of Paris should illuminate every corner of the Federation."

  FCF_invest_in_rhone_valley:0 "Invest in the Rhône Valley"
  FCF_invest_in_rhone_valley_desc:0 "The Rhône Valley is another of the Federation's industrial lifelines. The armaments factories of Lyon lie far from the northern frontier and consequently possess irreplaceable strategic value in wartime. We must build new factories, railways and power stations here, allowing the industrial strength of the Rhône Valley to translate directly into federal military power."

  FCF_continue_miracle_of_bordeaux:0 "Continue the Bordeaux Miracle"
  FCF_continue_miracle_of_bordeaux_desc:0 "The Bordeaux Miracle is the most dazzling economic achievement since the Revolution. Rather than declining after losing colonial trade, this port city transformed itself through wine, shipbuilding and emerging industries. We should distil Bordeaux's experience into a model that can be replicated in other regions struggling with economic transition."

  FCF_leading_port_in_the_mediterranean:0 "The Mediterranean's Foremost Port"
  FCF_leading_port_in_the_mediterranean_desc:0 "Marseille is the Federation's gateway to the Mediterranean. Resources arriving from the east must all pass through its harbour, whose capacity determines how much we can receive. We must expand the container terminals, modernise the warehouses and establish an industrial base for ship repairs, making Marseille the busiest and most efficient port in the Mediterranean."

  FCF_revival_of_brittany:0 "Revive Brittany"
  FCF_revival_of_brittany_desc:0 "Brittany's Atlantic coastline is long and desolate. Its fishing traditions run deep, but industry is almost entirely absent. Young people either leave or spend their lives aboard fishing boats. We must change this by constructing new port facilities at Brest, establishing a centre for food-processing technology in Rennes and developing maritime industries in Lorient. Reviving Brittany is not merely an economic undertaking, but the fulfilment of the Federation's promise to every region: the fruits of the Revolution belong to all."

  FCF_land_without_night:0 "A Land Without Night"
  FCF_land_without_night_desc:0 "France should not fall into darkness when the sun sets. Widespread access to electricity is both a measure of industrialisation and a guarantee of the workers' quality of life. We must build new hydroelectric stations, promote wind-power technology and expand the transmission grid so that every factory and village receives ample electricity at night. A land without night is more than a technical ambition—it represents respect for the worker's time. Production should be governed by human will, not subordinated to the rhythms of nature."

  FCF_federal_railway:0 "Federal Railways"
  FCF_federal_railway_desc:0 "The railways are the arteries of the Federation. The trunk line between Paris and Lyon must be electrified, branches leading to the eastern frontier reinforced, and new routes laid between the northern industrial region and the Rhône Valley. We should establish unified traffic control, a common track gauge and standardised signalling. The Federal Railways are more than a means of transport: they are essential to wartime mobilisation, and every kilometre of track serves the Federation's security."

  FCF_block_model:0 "The Regional Bloc Model"
  FCF_block_model_desc:0 "France is not a single undifferentiated economy, but a collection of regions possessing distinct advantages: coal and iron in the north, hydroelectricity in the Rhône Valley, agriculture and wine in the southwest, and fisheries in Brittany. Policy should not impose a single formula upon them all, but adapt itself to local conditions. Regional committees and industrial federations should jointly devise development plans for each bloc, keeping decisions as close as possible to material realities."

  FCF_complementary_economy:0 "A Complementary Economy"
  FCF_complementary_economy_desc:0 "General idea: the industries of the different regional blocs support and complement one another."

  FCF_economic_reform_issues:0 "The Question of Economic Reform"
  FCF_economic_reform_issues_desc:0 "The post-revolutionary economic system was assembled hastily amid war and upheaval, with many arrangements resting upon informal conventions and improvised negotiation. More than a decade later, its accumulated problems of efficiency and fairness can no longer be ignored: coordination between unions is excessively costly, the local tax base is too narrow, and the depreciation of the franc is consuming workers' savings. Reform does not mean repudiating the past, but learning from its experience."

  FCF_federal_leadership:0 "Federal Leadership"
  FCF_federal_leadership_desc:0 "Certain economic affairs can only be coordinated at the federal level: tariff policy, trade negotiations, the allocation of investment in interregional infrastructure and the development of strategic emerging industries. These matters concern the collective interests of the Federation, and no individual region possesses either the authority or the resources to decide them independently. Federal leadership does not negate local autonomy; it preserves the necessary capacity for unified coordination within a federal framework."

  FCF_local_leadership:0 "Local Leadership"
  FCF_local_leadership_desc:0 "Economic decisions should be made at the lowest practical level. Regional and grassroots committees possess a better understanding of local resources, industrial conditions and the needs of residents, making it reasonable for them to direct local economic development, public services and land-use planning. Local leadership permits greater flexibility and diversity: different communes may follow different paths of development, and therein lies the strength of federalism."

  FCF_standardized_management:0 "Standardised Administration"
  FCF_standardized_management_desc:0 "Coordination between industrial federations has long depended upon personal relationships and unwritten conventions. Such methods may function while the system remains sufficiently efficient, but they have now reached their limits. We must establish common statistical standards, transparent procedures for adjusting exchange ratios and publicly accessible records of federation decisions. Standardisation does not mean bureaucratisation. It makes coordination more reliable and predictable, reducing friction and improving efficiency."

  FCF_democratic_progress:0 "Democracy Brings Progress"
  FCF_democratic_progress_desc:0 "Democratic mechanisms are not ornamental, but essential to economic efficiency. When workers participate in drafting production plans, they have a greater incentive to carry them out; when regional delegates participate in federal decisions, policy better reflects actual conditions. Democracy is not the enemy of efficiency. On the contrary, without democratic participation, every plan remains nothing more than words on paper."

  FCF_integrate_small_industry:0 "Integrate Small-Scale Industry"
  FCF_integrate_small_industry_desc:0 "France's industrial landscape contains countless small workshops and household enterprises. Existing outside the trade-union system, they enjoy neither its raw-material allocations nor its technical intelligence, while remaining beyond the constraints of industrial coordination. Integrating these small industries means giving them a path into the federal economy through technical assistance and access to market information. Integration is not annexation; it ensures that every productive capacity finds its proper place."

  FCF_new_production_plan:0 "A New Production Plan"
  FCF_new_production_plan_desc:0 "The annual production plan lies at the heart of coordination between industrial federations, but the current drafting process can no longer keep pace with changing economic conditions. While retaining the annual framework, we must introduce quarterly adjustments and emergency revision procedures. The new production plan should be based upon current production data rather than belated statistical reports. Each industrial federation should retain sufficient room for flexible adjustment within the overall planning framework."

  FCF_from_where:0 "Whence It Comes"
  FCF_from_where_desc:0 "The Federation's economic resources do not appear from nowhere. They come from the labour of workers, the coordinating efficiency of industrial federations, regional and federal taxation, and the mutual exchange of goods through trade. Answering the question of where wealth comes from is not merely an accounting exercise, but a matter of political legitimacy. The more clearly we explain its origins, the more readily workers will understand and support our allocation of resources."

  FCF_red_economic_circle:0 "The Red Economic Sphere"
  FCF_red_economic_circle_desc:0 "The Red Economic Sphere is a network independent of the capitalist world market. Within it, we do not rely upon the gold standard or borrow from America and Germany, instead conducting trade wherever possible through labour vouchers and international clearing certificates. The sphere's boundaries are not walls; they are an attempt to establish autonomy and control in essential fields. The closer the cooperation within the sphere, the weaker the threats beyond it become."

  FCF_invest_in_worker_enterprises:0 "Invest in Workers' Enterprises"
  FCF_invest_in_worker_enterprises_desc:0 "General idea: invest in workers' enterprises within capitalist countries and establish trade with them."

  FCF_pragmatic_foreign_trade:0 "Pragmatic Foreign Trade"
  FCF_pragmatic_foreign_trade_desc:0 "Ideology must not become an obstacle to trade. The Federation needs to export industrial goods in exchange for essential raw materials and equipment. Provided that our fundamental interests are not compromised, commerce with capitalist countries is acceptable. Pragmatic foreign trade means exploiting the opportunities of the international market while maintaining our principles. We will become no one's dependency, but neither will we reject cooperation from any quarter."

  FCF_contact_progress_capital:0 "Engage with Progressive Capital"
  FCF_contact_progress_capital_desc:0 "Not all capital is equally reactionary. Certain capitalist enterprises—particularly those facing pressure from organised labour and willing to cooperate technologically or provide employment—may be regarded as progressive capital. Under strict supervision, the Federation's industrial federations may engage in limited cooperation with such enterprises. Clear rules must govern every arrangement, preventing foreign capital from acquiring control over our economic decisions through the guise of cooperation."

  FCF_barter_system:0 "Barter Trade"
  FCF_barter_system_desc:0 "The continuing depreciation of the franc has made barter a practical alternative. Large-scale trade between the Federation and socialist India already follows this model: our agricultural machinery and fertiliser are exchanged for Indian jute and cotton. Barter avoids exchange-rate risk and reduces dependence upon the franc. We must establish uniform standards for valuing goods and settling transactions, thereby ensuring that barter remains fair and efficient."

  FCF_where_to_go:0 "Whither It Goes"
  FCF_where_to_go_desc:0 "The ultimate purpose of economic activity is not production for its own sake, but the satisfaction of human needs. The fruits of our economy should flow into workers' pockets, the renovation of factories, improved public services and stronger national defence. Answering the question of where wealth should go lies at the heart of budgetary allocation. The Federation's wealth must neither be monopolised by a minority nor consumed by bureaucracy; it should benefit every worker."

  FCF_peoples_needs:0 "The People's Needs"
  FCF_peoples_needs_desc:0 "Bread, housing, education and healthcare are not by-products of economic activity, but its purpose. The Federation's economic plans should begin with the needs of the people rather than end with abstract production targets. Any policy that departs from this objective, however technically ingenious it may appear, will ultimately prove a failure."

  FCF_prosperous_life_for_citizens:0 "A Prosperous Life for Every Citizen"
  FCF_prosperous_life_for_citizens_desc:0 "The citizens of the Federation deserve prosperous lives. This is neither charity nor indulgence, but a proper reward for the wealth created by their labour. Prosperity means adequate nutrition, comfortable housing, high-quality education, dependable healthcare and a dignified retirement. Our economic policies should narrow disparities in living standards between regions, industries, towns and countryside."

  FCF_people_centered_economy:0 "A People-Centred Economy"
  FCF_people_centered_economy_desc:0 "The federal economy should be oriented towards the people's welfare. Investment decisions, production plans and trade policies must first consider their effects upon the lives of ordinary citizens. A people-centred economy does not oppose industrialisation or technological progress; it ensures that their benefits reach everyone. Only an economy serving the people's welfare can remain sustainable and resilient."

  FCF_future_needs:0 "The Needs of the Future"
  FCF_future_needs_desc:0 "The decisions of today must answer for the world of tomorrow. Demographic change, technological progress, resource depletion and shifts in the international order are long-term trends that must be adequately reflected in present policy. Investing for the future means maintaining sustained commitments to education, research, infrastructure and environmental protection. The choices we make today determine what will be possible tomorrow."

  FCF_basic_human_security:0 "Basic Human Security"
  FCF_basic_human_security_desc:0 "Every citizen of the Federation is entitled to basic human security: food, shelter, healthcare, education and work. These are rights, not charity. Responsibility is shared between communal committees and industrial federations—the former provide territorial public services, while the latter administer social protections associated with employment. Connecting these two systems is the central challenge of federal social policy."

  FCF_military_industrial_complex:0 "Military Industry in Service of Civilian Welfare"
  FCF_military_industrial_complex_desc:0 "Military industry is not merely necessary for defence; it can also drive the civilian economy. Military technology can be adapted for civilian purposes, surplus capacity in armaments factories redirected towards civilian production, and military research used to advance materials science and engineering. We should not treat defence and civilian welfare as irreconcilable, but explore how the two can develop in concert."

  FCF_technology_driven_economy:0 "A Technology-Driven Economy"
  FCF_technology_driven_economy_desc:0 "The Federation's future depends upon technology. Advances in chemistry, metallurgy, machinery, aviation and radio will determine our economic competitiveness. A technology-driven economy requires greater investment in research, stronger technical education and closer cooperation between industrial federations and research institutions. Merely catching up will not suffice; in certain fields, we must strive to lead."

  FCF_crisis_needs:0 "The Needs of a Crisis"
  FCF_crisis_needs_desc:0 "The Federation must prepare for emergencies. War, natural disaster and economic blockade may strike at any moment. Preparation requires strategic stockpiles, reserve capacity in critical industries and mechanisms for converting production under emergency conditions. Peacetime economic planning must always account for our ability to respond in times of crisis."

  FCF_military_civilian_facilities:0 "Dual-Use Factories"
  FCF_military_civilian_facilities_desc:0 "Factories need not produce exclusively civilian or exclusively military goods. Dual-use factories can manufacture goods for public consumption in peacetime and rapidly convert to armaments production during war. Such flexibility is a central principle of the federal defence economy. Investing in dual-use factories means preparing for war while peace still endures."

  FCF_military_driven_economy:0 "A Military-Driven Economy"
  FCF_military_driven_economy_desc:0 "When confronted by external threats, the Federation may need to adopt a military-driven economy. Resources would be allocated first to defence industries, production plans oriented towards military requirements and labour concentrated in armaments sectors. Such an economy should not be permanent, but may become necessary in a moment of crisis. The Federation must possess the ability to move rapidly between a peacetime and wartime economy."

  FCF_new_and_old:0 "The New and the Old"
  FCF_new_and_old_desc:0 "General idea: the conflict between the great metropolitan centres and smaller communes."

  FCF_urban_leadership:0 "Metropolitan Development"
  FCF_urban_leadership_desc:0 "The great cities are the centres of economic activity. Paris, Lyon, Marseille and Bordeaux contain the Federation's most advanced productive capacity, densest concentrations of expertise and most developed infrastructure. Prioritising industrial and infrastructural investment in these cities allows us to exploit economies of scale and agglomeration. Metropolitan prosperity should stimulate development throughout the surrounding regions."

  FCF_rural_leadership:0 "Communal Development"
  FCF_rural_leadership_desc:0 "France contains thousands of grassroots communes, which sustain small-scale production and local services. Communal development means supporting small factories, workshops and local cooperatives, preserving municipal public services and preventing the excessive concentration of population and resources in the largest cities. The vitality of these communes is the foundation of social stability throughout the Federation."

  FCF_plan_of_ideal_city:0 "The Ideal City Programme"
  FCF_plan_of_ideal_city_desc:0 "Every city should be a dignified place in which to live. The Ideal City Programme seeks to provide every urban resident with ample green space, convenient public transport, good schools and hospitals, cultural institutions and sporting facilities. This is no utopian fantasy, but an objective that can be achieved gradually through systematic planning and investment. Regional committees will direct the programme with the joint participation of industrial federations and communal committees."

  FCF_plan_of_new_frontiers:0 "The New Frontiers Programme"
  FCF_plan_of_new_frontiers_desc:0 "The Federation's territory has diminished, but ample room for development remains. The New Frontiers Programme will develop regions that have long been neglected: forestry and animal husbandry in the Massif Central, tourism and hydroelectric resources in the Alps, and fishing and maritime industries along the Atlantic coast. These new frontiers do not represent geographical expansion, but the liberation of economic potential."

  FCF_support_industral_commune:0 "Support Industrial Communes"
  FCF_support_industral_commune_desc:0 "Industrial communes often depend upon a single industry, leaving their economies dangerously fragile. When that industry declines, these communities bear the first and heaviest blow. Supporting industrial communes means providing transitional assistance, diversified investment, vocational retraining and improved infrastructure. They must not be abandoned, but given the support necessary to weather their difficulties."

  FCF_focus_on_specialized_industries:0 "Prioritise Specialised Industries"
  FCF_focus_on_specialized_industries_desc:0 "Every region possesses characteristic industries: wine in Bordeaux, silk in Lyon, machinery in Grenoble and fishing in Brittany. These industries form the pillars of their local economies. Policy should help each region specialise according to its strengths by supporting technical modernisation, access to new markets and the development of recognised brands, rather than forcing every region to pursue an identical industrial structure."

  FCF_complete_development:0 "Comprehensive Development"
  FCF_complete_development_desc:0 "Comprehensive development does not require every region to possess every industry. It requires every region to receive opportunities appropriate to its particular resources. It means eliminating extreme poverty, guaranteeing essential public services and narrowing disparities between regions. Every commune and every region should experience the benefits of progress."

  FCF_optimize_agricultural_structure:0 "Optimise the Agricultural Structure"
  FCF_optimize_agricultural_structure_desc:0 "Agriculture is the foundation of the federal economy, but the vulnerability of smallholder farming is becoming increasingly apparent. Optimising its structure means encouraging agricultural cooperation, providing technical extension services and improving rural infrastructure. The purpose is not to eliminate smallholders, but to increase agricultural productivity and raise farmers' living standards."

  FCF_agrarian_industrialization:0 "Agricultural Industrialisation"
  FCF_agrarian_industrialization_desc:0 "Agriculture must not remain confined to traditional manual labour. Agricultural industrialisation means spreading machinery, fertiliser and improved seed varieties, developing food-processing industries and establishing stable relations of exchange between agriculture and industry. It does not seek to eradicate rural life, but to raise agricultural labour productivity and release rural workers for industrial production."

  FCF_strengthen_commodity_economy:0 "Strengthen Commercial Agriculture"
  FCF_strengthen_commodity_economy_desc:0 "Farmers should not produce solely for their own subsistence, but participate in the market economy. Strengthening commercial agriculture means improving distribution between countryside and city, establishing stable purchase prices for agricultural products and providing market-information services. Commercial agriculture can supply the cities with sufficient food while giving farmers a dependable cash income."

  FCF_visionary_urban_planning:0 "Far-Sighted Urban Planning"
  FCF_visionary_urban_planning_desc:0 "Urban planning must look beyond immediate requirements. Far-sighted planning means arranging industrial and residential districts sensibly, reserving corridors for transport and green space, and accounting for future population growth and industrial change. Regional committees should retain planning authority, while the standards and principles guiding their work are coordinated at the federal level."

  FCF_cgt_issues:0 "The Question of the CGT"
  FCF_cgt_issues_desc:0 "The Confédération Générale du Travail lies at the heart of the federal economic system, controlling essential powers over industrial coordination, raw-material allocations and the distribution of technical intelligence. Yet the tension between power and responsibility is becoming increasingly apparent. Do federation decisions genuinely reflect the wishes of grassroots factory committees? Do federation officials still maintain contact with ordinary workers? The question facing the CGT is how to preserve efficient coordination while preventing the concentration and alienation of power."

  FCF_reform_cgt:0 "Reform the CGT"
  FCF_reform_cgt_desc:0 "Reform is not intended to weaken the Confédération Générale du Travail, but to make it more efficient and accountable. Possible measures include increasing the participation of grassroots factory committees in federation decisions, improving transparency and establishing regular rotation and performance reviews for union officials. Reform must be an ongoing process, not a task completed once and for all."

  FCF_self_supervised_syndicats:0 "Self-Supervising Trade Unions"
  FCF_self_supervised_syndicats_desc:0 "External audits are necessary, but insufficient. The Confédération Générale du Travail must establish its own mechanisms of internal supervision: independent supervisory committees within the federations, channels through which members can submit complaints, regular self-assessments and public reports. Self-supervision deepens the principle of trade-union autonomy rather than repudiating it."

  FCF_professional_governance:0 "Towards Professional Administration"
  FCF_professional_governance_desc:0 "Trade-union officials must possess professional competence. Moving towards professional administration means expanding their technical, managerial and policy training. A trade union should not merely be an organisation of protest, but an organisation capable of governance. It must be able to draft production plans, assess technical proposals and reconcile the interests of an entire industry."

  FCF_against_cgt:0 "Challenge the CGT"
  FCF_against_cgt_desc:0 "Discontent with the power of the Confédération Générale du Travail exists throughout the Federation. Some regard it as excessively centralised and bureaucratic, advocating the reduction of its authority and greater autonomy for localities and factories. These demands come from anarchist unions, Catholic trade unions and certain regional committees. Their opposition need not be destructive; it may provide the impetus required to reform the CGT."

  FCF_antitrust_investigation:0 "An Antitrust Investigation"
  FCF_antitrust_investigation_desc:0 "Should the Confédération Générale du Travail's monopoly over industrial coordination be restricted? An antitrust investigation will determine whether the CGT has abused its authority, excluded competitors or harmed the interests of small factories and consumers. The investigation need not result in the Confederation's dissolution, but may compel it to alter certain practices."

  FCF_economic_administration:0 "Administrative Authority over the Economy"
  FCF_economic_administration_desc:0 "Should the Federation possess administrative authority over the economy? At present, economic decisions are divided among industrial federations, regional committees and the Conseil général fédéral. Some wish to grant the Comité de salut public broader economic powers so that it can act rapidly during a crisis. Others fear that doing so would erode the fundamental principles of syndicalism. The question remains unsettled."

  FCF_federal_supervisory_committee:0 "Federal Supervisory Committee"
  FCF_federal_supervisory_committee_desc:0 "The Federal Supervisory Committee is an oversight body subordinate to the Conseil général fédéral. It supervises the economic decisions of industrial federations, investment committees and the Comité de salut public. Its members are elected by the Conseil général fédéral and may not simultaneously hold another position in economic administration. The committee reviews the legality of major economic decisions and submits reports to the Conseil général fédéral."

  FCF_new_cgt:0 "A Renewed CGT"
  FCF_new_cgt_desc:0 "General idea: the Confédération Générale du Travail has been reborn through reform."

  FCF_diverse_syndicats_strategies:0 "A Pluralist Trade-Union Strategy"
  FCF_diverse_syndicats_strategies_desc:0 "The Federation should not depend upon the Confédération Générale du Travail alone. Catholic trade unions, anarchist unions and other smaller organisations offer workers a range of alternatives. A pluralist trade-union strategy means recognising the legitimacy of different unions, establishing mechanisms for coordination between them and preventing any single organisation from acquiring a monopoly."

  FCF_focus_on_work_syndicats:0 "Trade Unions Focused on Their Work"
  FCF_focus_on_work_syndicats_desc:0 "The essential functions of a trade union are to organise production and protect workers' rights. Unions should neither be captured by political struggle nor transformed into ideological battlegrounds. A union focused on its work concentrates upon production planning, technical improvements, better working conditions and improved welfare for its members. Its political influence should arise from its concrete achievements in the economic sphere."
# Society
  FCF_new_direction:0 "A New Spirit"
  FCF_new_direction_desc:0 "The hierarchy, privilege and oppression of the old system have been abolished and replaced by a new order founded upon workers' self-management, local autonomy and industrial coordination. This new spirit represents more than institutional change; it is a transformation in the hearts of the people, as workers experience for the first time what it means to be masters of their own country. Consolidating this new spirit is the foremost objective of federal social policy."

  FCF_what_we_lack:0 "What We Lack"
  FCF_what_we_lack_desc:0 "General idea: what the Federation still lacks."

  FCF_unemployment_benefits:0 "Unemployment Benefits"
  FCF_unemployment_benefits_desc:0 "When workers lose their jobs because of an industrial downturn, they should be able to await recovery with dignity. Unemployment benefits are paid from the unemployment-insurance funds of the industrial federations, amounting to a proportion of the recipient's former wage and lasting for no more than one year. While unemployed, workers must participate in retraining arranged by their federation."

  FCF_employment_training_platform:0 "Employment Training Platform"
  FCF_employment_training_platform_desc:0 "Technological change and industrial restructuring place many workers at risk of seeing their skills become obsolete. Jointly operated by industrial federations and regional committees, the Employment Training Platform provides courses for different industries and levels of expertise. Training is not merely an opportunity to acquire new skills, but a bridge by which workers can re-enter the productive process."

  FCF_talent_education_fund:0 "Talent Education Fund"
  FCF_talent_education_fund_desc:0 "The Federation must maintain continuous investment in developing its people. Funded by appropriations from the Conseil général fédéral and matching contributions from the industrial federations, the Talent Education Fund allows promising workers to pursue higher education or specialised technical training. Applications have no upper age limit and require no particular political background; only the applicant's ability and aspirations are considered."

  FCF_ensure_basic_education:0 "Guarantee Basic Education"
  FCF_ensure_basic_education_desc:0 "Every citizen of the Federation should receive a basic education. Primary education is compulsory and organised by the regional committees. Guaranteeing basic education means providing sufficient schools, qualified teachers and free teaching materials. The quality of this education directly shapes the Federation's future productivity and social cohesion."

  FCF_examine_womens_issues:0 "Examine the Women's Question"
  FCF_examine_womens_issues_desc:0 "Women played an important role in the Revolution, yet they remain unequal within the post-revolutionary economy. Examining the women's question means investigating their actual circumstances in employment, wages, promotion and trade-union participation, identifying discriminatory practices and proposing improvements. Women's emancipation is not a by-product of the Revolution, but one of its objectives."

  FCF_support_female_workers:0 "Support Women Workers"
  FCF_support_female_workers_desc:0 "Women in the factories are often relegated to the lowest-paid and least secure positions. Supporting women workers means guaranteeing equal pay for equal work, providing maternity leave and childcare assistance, and increasing women's representation on factory committees and within trade-union leadership. Excluding half the population from productive work is an enormous waste; women's labour rights are also a matter of economic efficiency."

  FCF_support_housewives:0 "Support Homemakers"
  FCF_support_housewives_desc:0 "Homemakers bear responsibility for domestic labour and raising children. Although this work earns no wage, it remains an essential component of social reproduction. Supporting homemakers means recognising the social value of domestic labour and providing childcare allowances and public services to ease its burdens. This does not encourage women to withdraw from the labour market, but respects their choices."

  FCF_what_we_have:0 "What We Inherited"
  FCF_what_we_have_desc:0 "General idea: policies inherited by the Federation from the old Republic."

  FCF_state_of_all_workers:0 "A State for All Workers"
  FCF_state_of_all_workers_desc:0 "General idea: welcome workers immigrating from throughout the world."

  FCF_beware_of_political_infiltration:0 "Beware Political Infiltration"
  FCF_beware_of_political_infiltration_desc:0 "General idea: restrict immigration to prevent political infiltration."

  FCF_state_atheism:0 "State Atheism"
  FCF_state_atheism_desc:0 "General idea: abandon religion and embrace thoroughgoing state atheism."

  FCF_reaffirm_religious_freedom:0 "Reaffirm Freedom of Religion"
  FCF_reaffirm_religious_freedom_desc:0 "General idea: continue the policy of religious freedom."

  FCF_special_status_of_catholicism:0 "Catholicism's Special Status"
  FCF_special_status_of_catholicism_desc:0 "General idea: grant the Catholic Church greater rights."

  FCF_what_we_guard:0 "What We Safeguard"
  FCF_what_we_guard_desc:0 "General idea: the institutions and principles upon which social stability depends."

  FCF_complete_freedom_of_speech:0 "Complete Freedom of Speech"
  FCF_complete_freedom_of_speech_desc:0 "General idea: guarantee complete freedom of speech."

  FCF_repress_heretical_speech:0 "Restrain Dangerous Speech"
  FCF_repress_heretical_speech_desc:0 "General idea: maintain freedom of speech subject to limited restrictions."

  FCF_antirevolutionary_speech_control:0 "Control Counter-Revolutionary Speech"
  FCF_antirevolutionary_speech_control_desc:0 "General idea: subject freedom of speech to political censorship."

  FCF_free_assembly:0 "Freedom of Assembly"
  FCF_free_assembly_desc:0 "General idea: guarantee freedom of assembly."

  FCF_assembly_registration:0 "Assembly Registration"
  FCF_assembly_registration_desc:0 "General idea: require public assemblies to be registered in advance."

  FCF_militia_policeization:0 "Transform the Militia into a Police Force"
  FCF_militia_policeization_desc:0 "During the Revolution, the militia served as an organisation of workers' self-defence. In peacetime, it must develop into a professional police force. This transformation requires unified standards of training, discipline and command while preserving the militia's grassroots character: the police should come from the community and serve the community."

  FCF_autonomous_police_system:0 "Autonomous Policing"
  FCF_autonomous_police_system_desc:0 "Policing should be administered locally. Regional and communal committees will take responsibility for law enforcement within their respective jurisdictions. An autonomous policing system can respond more closely to the actual needs of each community while remaining faithful to the principles of federalism."

  FCF_federal_security_police:0 "Federal Security Police"
  FCF_federal_security_police_desc:0 "The Federal Security Police is a nationwide police force subordinate to the Conseil général fédéral. It is responsible for crimes spanning multiple regions, political offences and matters of national security."

  FCF_what_we_should:0 "What We Should Have"
  FCF_what_we_should_desc:0 "The seven-hour working day, annual leave and pensions are not luxuries, but rights owed to working people. What we should have is no distant utopia, but a reality that can be achieved gradually through the policies of today. Its attainment requires sustained economic growth and continuous social progress."

  FCF_seven_hour_work_day:0 "The Seven-Hour Working Day"
  FCF_seven_hour_work_day_desc:0 "The seven-hour working day is a central objective of federal labour policy. Shorter working hours will improve workers' quality of life and create additional employment while preserving overall levels of work. Its introduction must be coordinated with the production plans of the industrial federations to ensure that productive efficiency is maintained."

  FCF_annual_leave:0 "Annual Leave"
  FCF_annual_leave_desc:0 "Every worker is entitled to paid annual leave. Leave is not merely a right to rest, but an opportunity to participate in cultural life and reunite with one's family. Its duration will be negotiated between industrial federations and factory committees, but may not fall below the minimum standard established by the Federation."

  FCF_pension_system:0 "The Pension System"
  FCF_pension_system_desc:0 "Pensions guarantee workers a secure old age. The federal pension system combines occupational pensions administered by industrial federations with local old-age support provided by communal committees. Payments are calculated according to years of service and average wages, ensuring that retired workers can maintain a dignified standard of living."

  FCF_enhanced_soldier_benefits:0 "Improve Soldiers' Welfare"
  FCF_enhanced_soldier_benefits_desc:0 "Soldiers make sacrifices for the security of the Federation. Improving their welfare means increasing military pay, improving barracks, and providing vocational training and material security after discharge. Soldiers' welfare is not merely a moral obligation, but a guarantee of military morale and fighting strength."

  FCF_what_we_rule:0 "What Reigns Supreme"
  FCF_what_we_rule_desc:0 "General idea: the supreme organs of authority within the Federation."

  FCF_reform_cgf:0 "Reform the Conseil général fédéral"
  FCF_reform_cgf_desc:0 "The Conseil général fédéral is the Federation's supreme legislative body, but does its manner of operation require reform? Reform could mean adjusting the allocation of seats, improving parliamentary procedure and strengthening its supervision of the Comité de salut public. Any proposal will require negotiation among the regions and approval by the Conseil général fédéral."

  FCF_expand_CGF_authority:0 "Strengthen the Authority of the General Council"
  FCF_expand_CGF_authority_desc:0 "General idea: expand the powers of the Conseil général fédéral so that it can serve the people more effectively."

  FCF_reform_election:0 "Electoral Reform"
  FCF_reform_election_desc:0 "General idea: reform the electoral mechanisms of the Conseil général fédéral."

  FCF_reform_csp:0 "Reform the Comité de salut public"
  FCF_reform_csp_desc:0 "The Comité de salut public is the Federation's executive body, and its powers and responsibilities must be clearly defined. Reform means adjusting its composition, clarifying the scope of its authority and strengthening supervision by the Conseil général fédéral. The Comité de salut public must not become an unchecked centre of power."

  FCF_expand_chairman_power:0 "Expand the Chairman's Authority"
  FCF_expand_chairman_power_desc:0 "Should the powers of the Chairman of the Comité de salut public be expanded? Supporters argue that stronger executive leadership would improve the efficiency of decision-making and our response to crises; opponents fear that it would undermine the principle of collective decision-making. The question has produced profound divisions within the Federation."

  FCF_strengthen_administrative_supervision:0 "Strengthen Administrative Oversight"
  FCF_strengthen_administrative_supervision_desc:0 "Whatever the eventual powers of the Comité de salut public, supervision remains essential. Strengthening administrative oversight means establishing stricter reporting, auditing and accountability procedures. Supervisory authority belongs to the Conseil général fédéral, although its exercise may be delegated to specialised committees."

  FCF_advancing_federalism_reform:0 "Advance Federalist Reform"
  FCF_advancing_federalism_reform_desc:0 "Federalism is a fundamental principle of the Federation. Advancing federalist reform means transferring further powers to the regions and communes, strengthening their capacity for self-government and reducing federal intervention in local affairs. Federalist reform does not weaken the Federation; it places it upon firmer foundations."

  FCF_advancing_centralized_reform:0 "Advance Centralising Reform"
  FCF_advancing_centralized_reform_desc:0 "General idea: strengthen the authority of the Federation."

  FCF_what_we_enjoy:0 "What We Enjoy"
  FCF_what_we_enjoy_desc:0 "General idea: recreation and entertainment for the citizens of the Federation."

  FRA_point_du_jour_studios:0 "Develop the Film Industry"
  FRA_point_du_jour_studios_desc:0 "Cinema is both a popular art and a vehicle for ideology. Developing the film industry means supporting film production, constructing cinemas and training filmmakers. Federal cinema should tell the stories of workers, depict the course of the Revolution and display the culture and landscapes of France. The industry requires both financial support and creative freedom."

  FCF_support_worker_clubs:0 "Support Workers' Clubs"
  FCF_support_worker_clubs_desc:0 "Workers' clubs are important centres of life beyond the workplace. They provide opportunities for reading, discussion, entertainment and sport, while giving workers space for self-education and self-organisation. Supporting these clubs means providing premises, funding and assistance with activities, although their administration should remain in the hands of the workers themselves."

  FCF_encourage_public_sports:0 "Encourage Sport for All"
  FCF_encourage_public_sports_desc:0 "Sport promotes a healthy way of life and cultivates a collective spirit. Encouraging sport for all means constructing facilities, organising popular sporting events and supporting the establishment of athletic clubs. Sport is not the exclusive preserve of an elite, but the right of every citizen."

  FCF_modernize_traditional_arts:0 "Modernise the Traditional Arts"
  FCF_modernize_traditional_arts_desc:0 "France possesses a rich heritage of literature, theatre, music, painting and architecture. Modernising the traditional arts means combining this inheritance with contemporary aesthetics and technology to create new forms that both preserve tradition and face towards the future."

  FCF_expand_printing_industry:0 "Expand the Printing Industry"
  FCF_expand_printing_industry_desc:0 "Printing is the foundation upon which knowledge is disseminated. Expanding the industry means investing in printing equipment, training skilled printers and reducing publishing costs. The widespread availability of books, newspapers and periodicals is a prerequisite for civic education and the foundation of public debate."

  FCF_people_live_on_rice:0 "No Work on an Empty Stomach"
  FCF_people_live_on_rice_desc:0 "The physical well-being of working people is the foundation of social productivity. We must attend to their nutrition and health by providing sufficient food, improving the working environment and promoting healthier ways of life. Workers' health is not merely a private concern, but a social responsibility."

  FCF_la_la_land:0 "A Nation of Music Lovers"
  FCF_la_la_land_desc:0 "Music expresses emotions that transcend language. We should support musical education, construct concert halls and provide assistance to orchestras and choirs. Music is not merely entertainment, but a source of social cohesion. It should become an indispensable part of every citizen's life."
# Diplomacy
  FCF_international_congress:0 "The Third Internationale Congress"
  FCF_international_congress_desc:0 "General idea: convene a new congress of the Third Internationale."

  FCF_strengthen_phalanstere_connection:0 "Strengthen the Bonds of the Phalanstère"
  FCF_strengthen_phalanstere_connection_desc:0 "General idea: strengthen relations among the members of the Phalanstère."

  FRA_arab_committee:0 "Comité anticolonial"
  FRA_arab_committee_desc:0 "General idea: establish an international organisation dedicated to anti-colonialism and anti-imperialism."

  FCF_destroy_algerian_government:0 "Destroy the Algiers Government"
  FCF_destroy_algerian_government_desc:0 "The government in Algiers is a remnant of the old colonial order in North Africa. Destroying it means supporting the Algerian independence movement, severing its international support and ultimately liberating Algeria from colonial rule. Achieving this objective will require a combination of military, economic and diplomatic measures."

  FCF_break_racial_segregation:0 "Break Apart Racial Segregation"
  FCF_break_racial_segregation_desc:0 "General idea: support the South African Revolution."

  FCF_liberate_equatorial_africa:0 "Liberate Equatorial Africa"
  FCF_liberate_equatorial_africa_desc:0 "General idea: undermine German Central Africa."

  FCF_against_ottomans:0 "Confront the Ottomans"
  FCF_against_ottomans_desc:0 "The Ottoman Empire controls vast territories across the Middle East and eastern Mediterranean. Confronting it means supporting national independence movements within its borders, weakening Ottoman power in the eastern Mediterranean and protecting federal shipping interests. The dissolution of the Ottoman Empire is one objective of the Federation's geopolitical strategy."

  FCF_invest_in_desert_warfare:0 "Invest in Desert Warfare"
  FCF_invest_in_desert_warfare_desc:0 "General idea: support Egypt and Iran, drawing the Ottoman Empire into the quagmire of war."

  FCF_indian_revolutionary_plan:0 "The Indian Revolutionary Programme"
  FCF_indian_revolutionary_plan_desc:0 "The revolutionary movement in India continues to develop. The Indian Revolutionary Programme means supporting the cause of socialist India, strengthening our cooperation with India within the tripartite trading sphere and helping it consolidate the gains of its revolution. India's stability and prosperity are essential to the Federation's economic security."

  FCF_chinese_gambling:0 "The Chinese Gambit"
  FCF_chinese_gambling_desc:0 "China is a major power in Asia. The Chinese Gambit calls for the Federation to adopt a cautious but active approach to Chinese affairs: supporting progressive forces, opposing imperialist control and finding a balance between trade and politics. China's development will shape the future of Asia and the wider world."

  FCF_only_one_sun:0 "Two Suns Cannot Share the Sky"
  FCF_only_one_sun_desc:0 "General idea: support China in its resistance against Japan."

  FCF_archipelagic_dreams:0 "Dreams of the Archipelago"
  FCF_archipelagic_dreams_desc:0 "General idea: support the Indonesian independence movement."

  FCF_indochinese_revolution:0 "Revolution Stirs in Indochina"
  FCF_indochinese_revolution_desc:0 "A revolutionary movement is gathering strength in Indochina. We must monitor developments in the region, support local independence movements and create favourable conditions for a future revolution. An independent Indochina would transform the balance of power in Southeast Asia."

  FCF_philippine_freedom_fighters:0 "The Free People of the Philippines"
  FCF_philippine_freedom_fighters_desc:0 "General idea: attempt to bring the Philippines into the neutral camp—or even the socialist cause."

  FCF_revolutionary_support_committee:0 "Comité de soutien révolutionnaire"
  FCF_revolutionary_support_committee_desc:0 "The Comité de soutien révolutionnaire is the federal institution responsible for assisting revolutionary movements abroad. Its duties include assessing their prospects, providing material and technical assistance, and coordinating cooperation among revolutionary organisations in different countries. Its work represents the institutional expression of the Federation's internationalist commitments."

  FCF_against_the_entente:0 "Confront the Entente"
  FCF_against_the_entente_desc:0 "General idea: oppose the Entente."

  FCF_quebec_crisis:0 "The Québec Crisis"
  FCF_quebec_crisis_desc:0 "General idea: exploit the crisis in Québec to bring down Canada."

  FCF_land_of_the_undivided:0 "A Land No Longer Divided"
  FCF_land_of_the_undivided_desc:0 "General idea: support the Central American Revolution."

  FCF_chicago_agreement:0 "The Chicago Agreement"
  FCF_chicago_agreement_desc:0 "General idea: contact the Socialist Party of America and support the American Revolution."

  FCF_red_south_cone:0 "The Red Southern Cone"
  FCF_red_south_cone_desc:0 "General idea: support the revolutionary movements in Patagonia and Chile."

  FCF_columbia_legacy:0 "Bolívar's Unfinished Dream"
  FCF_columbia_legacy_desc:0 "General idea: support revolution throughout South America."

  FCF_kangaroo_comrades:0 "Even the Kangaroos Shall Revolt"
  FCF_kangaroo_comrades_desc:0 "General idea: support the Australian Revolution."

  FCF_against_the_empire:0 "Confront the Reichspakt"
  FCF_against_the_empire_desc:0 "General idea: oppose the Reichspakt."

  FCF_barcelona_agreement:0 "The Barcelona Agreement"
  FCF_barcelona_agreement_desc:0 "General idea: support the revolutionary forces in Spain."

  FCF_second_unification_movement:0 "The Second Unification Movement"
  FCF_second_unification_movement_desc:0 "General idea: support the Socialist Republic of Italy."

  FCF_red_glacier:0 "The Red Glacier"
  FCF_red_glacier_desc:0 "General idea: support the socialists of Northern Europe."

  FCF_piercing_red_nail:0 "A Red Nail in the Eastern Wall"
  FCF_piercing_red_nail_desc:0 "General idea: support the socialists behind Germany's eastern defensive line."

  FCF_dyed_green_island:0 "Paint the Emerald Isle Red"
  FCF_dyed_green_island_desc:0 "General idea: attempt to influence Ireland."

  FCF_red_haired_nation:0 "The Land of the Red-Haired"
  FCF_red_haired_nation_desc:0 "General idea: support the socialists of the Netherlands."

  FCF_balkan_partnership:0 "A Balkan Partnership"
  FCF_balkan_partnership_desc:0 "General idea: support the Belgrade Pact and attempt to spread socialist ideas throughout the Balkans."

  FCF_revolutionary_vanguard:0 "Vanguard of the Revolution"
  FCF_revolutionary_vanguard_desc:0 "General idea: France is the leader of world socialism and the vanguard of the global revolution."

  FCF_pragmatic_measures:0 "A Pragmatic Course"
  FCF_pragmatic_measures_desc:0 "General idea: cooperate with anti-imperialist capitalist countries and identify our primary enemy."

  FCF_nile_friends:0 "Friends on the Nile"
  FCF_nile_friends_desc:0 "General idea: establish contact with Egypt and oppose the Ottoman Empire."

  FCF_contact_russia:0 "Contact Russia"
  FCF_contact_russia_desc:0 "General idea: establish contact with Russia and oppose Germany."

  FCF_anti_imperialist_united_front:0 "The Anti-Imperialist United Front"
  FCF_anti_imperialist_united_front_desc:0 "General idea: establish a united front with progressive capitalist countries against German hegemony."

  FCF_special_relationship_with_switzerland:0 "A Special Franco-Swiss Relationship"
  FCF_special_relationship_with_switzerland_desc:0 "General idea: establish a special relationship between France and Switzerland and guarantee peace along the frontier."

  FCF_national_recovery_bureau:0 "Bureau national de la récupération territoriale"
  FCF_national_recpvery_bureau_desc:0 "General idea: recover the territories lost during the Weltkrieg and the Revolution."

  FCF_isolated_corsica:0 "The Isolated Island of Corsica"
  FCF_isolated_corsica_desc:0 "General idea: incite an uprising in Corsica or seize the island through direct military intervention."

  FRA_demand_haute_savoie:0 "Claim Haute-Savoie"
  FRA_demand_haute_savoie_desc:0 "General idea: demand that Switzerland return the occupied region of Haute-Savoie."

  FCF_dont_forget_alsace:0 "Never Forget Alsace"
  FCF_dont_forget_alsace_desc:0 "General idea: Alsace, lost in the Franco-Prussian War, remains of immense strategic importance."

  FCF_dunkirk_crisis:0 "The Dunkirk Crisis"
  FCF_dunkirk_crisis_desc:0 "General idea: the time has come to exploit the crisis and recover Dunkirk."

  FCF_red_chicken_wallonia:0 "The Red Walloon Rooster"
  FCF_red_chicken_wallonia_desc:0 "General idea: support independence for the French-speaking population of Wallonia."

  FCF_war_of_liberation:0 "A War of Liberation"
  FCF_war_of_liberation_desc:0 "General idea: declare war upon Germany and liberate the German people."

  FCF_war_of_revenge:0 "A War of Revenge"
  FCF_war_of_revenge_desc:0 "General idea: declare war upon Germany and avenge our defeat in the Weltkrieg."

  FCF_liberate_iberia:0 "Liberate Iberia"
  FCF_liberate_iberia_desc:0 "General idea: wage war in Iberia and secure our Atlantic rear."

  FCF_liberate_italy:0 "Liberate the Italian Peninsula"
  FCF_liberate_italy_desc:0 "General idea: wage war in Italy and establish a red Western Europe."

  FCF_ardennes_assault:0 "Assault through the Ardennes"
  FCF_ardennes_assault_desc:0 "General idea: attack Germany through the Low Countries."

  FCF_red_danube:0 "The Red Danube"
  FCF_red_danube_desc:0 "General idea: declare war upon the Austrian Empire and revive the Springtime of Nations."
# Military
  FCF_continental_army_strategy:0 "Continental Army Strategy"
  FCF_continental_army_strategy_desc:0 "General idea: establish a large standing army."

  FCF_lower_conscription_age:0 "Lower the Conscription Age"
  FCF_lower_conscription_age_desc:0 "General idea: expand the available pool of recruits."

  FCF_elite_forces:0 "Elite Forces"
  FCF_elite_forces_desc:0 "General idea: establish a moderately sized elite army."

  FCF_streamline_formations:0 "Streamline Our Formations"
  FCF_streamline_formations_desc:0 "General idea: abolish unnecessary organisational structures."

  FCF_reform_foreign_legion:0 "Reform the Légion étrangère"
  FCF_reform_foreign_legion_desc:0 "General idea: reform the Légion étrangère to meet the demands of a new era."

  FCF_regularize_international_brigades:0 "Regularise the International Brigades"
  FCF_regularize_international_brigades_desc:0 "General idea: reorganise the International Brigades into a regular military force."

  FCF_federal_military_academy:0 "Federal Military Academy"
  FCF_federal_military_academy_desc:0 "General idea: establish a Federal Military Academy to train military personnel."

  FCF_optimize_daily_training:0 "Optimise Daily Training"
  FCF_optimize_daily_training_desc:0 "General idea: reform the army's daily training programme."

  FCF_the_brain:0 "The Brain"
  FCF_the_brain_desc:0 "General idea: strengthen the duties and authority of officers within the army."

  FCF_leapfrog_command_authority:0 "Direct Command over Lower Echelons"
  FCF_leapfrog_command_authority_desc:0 "General idea: allow officers to issue orders directly to rank-and-file soldiers."

  FCF_the_nerves:0 "The Nerves"
  FCF_the_nerves_desc:0 "General idea: strengthen the duties and authority of non-commissioned officers within the army."

  FCF_nco_initiative:0 "NCO Initiative"
  FCF_nco_initiative_desc:0 "General idea: grant non-commissioned officers greater autonomy."

  FCF_the_cells:0 "The Cells"
  FCF_the_cells_desc:0 "General idea: strengthen the duties and authority of ordinary soldiers within the army."

  FCF_reform_soldiers_committees:0 "Reform the Soldiers' Committees"
  FCF_reform_soldiers_committees_desc:0 "General idea: reform the Soldiers' Committees and promote grassroots democracy."

  FCF_strengthen_officer_learning:0 "Improve Officer Education"
  FCF_strengthen_officer_learning_desc:0 "General idea: ensure that officers and NCOs continue to study and retain an enterprising spirit."

  FCF_improve_soldier_treatment:0 "Improve Soldiers' Conditions"
  FCF_improve_soldier_treatment_desc:0 "General idea: improve conditions for ordinary soldiers and strengthen their sense of belonging and identification with the army."

  FCF_new_warfare_thinking:0 "A New Conception of Warfare"
  FCF_new_warfare_thinking_desc:0 "General idea: support mobile warfare."

  FCF_red_wedge_into_white:0 "Beat the Whites with the Red Wedge"
  FCF_red_wedge_into_white_desc:0 "General idea: emphasise decisive breakthroughs."

  FCF_battlefield_concept_of_time_and_space:0 "Time and Space on the Battlefield"
  FCF_battlefield_concept_of_time_and_space_desc:0 "General idea: exchange space for time."

  FCF_la_revolution_est_comme_le_vent:0 "The Revolution Sweeps Like the Wind"
  FCF_la_revolution_est_comme_le_vent_desc:0 "General idea: the time has come to seize the initiative. Revolution has never meant curling up in some isolated corner for our own satisfaction. Speed will dominate the battlefield, and every enemy who dares challenge us will be crushed beneath the chariot of revolution."

  FCF_learn_from_the_great_war:0 "Learn from the Weltkrieg"
  FCF_learn_from_the_great_war_desc:0 "General idea: support positional and trench warfare."

  FCF_Moi_le_deluge:0 "The Deluge Is Coming—the Deluge Is Here"
  FCF_Moi_le_deluge_desc:0 "General idea: advance continuously in successive stages, leaving the enemy unable to mount an effective resistance."

  FCF_little_strokes_fell_great_oaks:0 "Little Strokes Fell Great Oaks"
  FCF_little_strokes_fell_great_oaks_desc:0 "General idea: gradually weaken the enemy through continuous attrition."

  FCF_rising_from_barricades:0 "Born upon the Barricades"
  FCF_rising_from_barricades_desc:0 "General idea: the legacy of the barricades has led us to study urban combat and extend its principles to larger battlefields, using superior familiarity with the terrain to force the enemy onto the defensive."

  FCF_excellent_experiment_opportunity:0 "An Excellent Opportunity for Experimentation"
  FCF_excellent_experiment_opportunity_desc:0 "General idea: test new equipment and tactical concepts in revolutionary civil wars throughout the world."

  FCF_focus_on_armor:0 "Prioritise Armour"
  FCF_focus_on_armor_desc:0 "General idea: emphasise the importance of armour within the army."

  FCF_accelerate_mechanization:0 "Accelerate Mechanisation"
  FCF_accelerate_mechanization_desc:0 "General idea: accelerate the mechanisation of every branch of the army."

  FCF_infantry_tank_coordination:0 "Infantry–Tank Coordination"
  FCF_infantry_tank_coordination_desc:0 "General idea: improve coordination between infantry and armour."

  FCF_armor_research_funding:0 "Fund Armoured Research"
  FCF_armor_research_funding_desc:0 "General idea: provide additional funding for the development of armoured vehicles."

  FCF_focus_on_firepower:0 "Prioritise Firepower"
  FCF_focus_on_firepower_desc:0 "General idea: strengthen the position of artillery within the army."

  FCF_pursue_large_caliber:0 "Pursue Larger Calibres"
  FCF_pursue_large_caliber_desc:0 "General idea: increase the calibre of our artillery to maximise its destructive power."

  FCF_saturation_attack:0 "Saturation Bombardment"
  FCF_saturation_attack_desc:0 "General idea: expand artillery production and overwhelm the enemy through sheer volume of fire."

  FCF_fund_artillery_development:0 "Fund Artillery Development"
  FCF_fund_artillery_development_desc:0 "General idea: provide additional funding for the improvement and production of artillery."

  FCF_improve_from_experiments:0 "Improve through Experimentation"
  FCF_improve_from_experiments_desc:0 "General idea: improve our equipment and military thinking through practical combat experience."

  FCF_another_battlefield:0 "Another Battlefield"
  FCF_another_battlefield_desc:0 "General idea: the armed struggle extends beyond the soldiers fighting upon the conventional battlefield."

  FCF_expand_intelligence_agencies:0 "Expand the Intelligence Services"
  FCF_expand_intelligence_agencies_desc:0 "General idea: increase the scale of our intelligence services."

  FCF_unconventional_sabotage:0 "Unconventional Sabotage"
  FCF_unconventional_sabotage_desc:0 "General idea: use espionage and infiltration to disrupt the enemy's military plans."

  FCF_authorize_military_industrial_coops:0 "Authorise Military-Industrial Cooperatives"
  FCF_authorize_military_industrial_coops_desc:0 "General idea: entrust the development and production of military equipment to more dynamic enterprises."

  FCF_optimize_logistics_structure:0 "Optimise the Logistics System"
  FCF_optimize_logistics_structure_desc:0 "General idea: reform the army's logistical organisation."

  FCF_establish_radio_superiority:0 "Establish Radio Superiority"
  FCF_establish_radio_superiority_desc:0 "General idea: expand and improve the military use of radio."

  FCF_angels_of_the_battlefield:0 "Angels of the Battlefield"
  FCF_angels_of_the_battlefield_desc:0 "General idea: strengthen the presence and role of medical personnel within the army."

  FCF_war_infrastructure_projects:0 "Wartime Infrastructure Projects"
  FCF_war_infrastructure_projects_desc:0 "General idea: undertake a series of construction projects in preparation for war."

  FCF_eastern_bulwark:0 "The Eastern Bulwark"
  FCF_eastern_bulwark_desc:0 "General idea: expand the border fortifications facing Germany."
# Air Force
  FCF_power_of_the_sky:0 "Power in the Skies"
  FCF_power_of_the_sky_desc:0 "General idea: develop the air force."

  FCF_build_more_northern_airfields:0 "Build More Northern Airfields"
  FCF_build_more_northern_airfields_desc:0 "General idea: construct additional airfields throughout northern France."

  FCF_consolidate_air_defense_network:0 "Consolidate the Air-Defence Network"
  FCF_consolidate_air_defense_network_desc:0 "General idea: strengthen the air-defence network along the Franco-German frontier."

  FCF_alpine_wind_tunnel_base:0 "Alpine Wind-Tunnel Complex"
  FCF_alpine_wind_tunnel_base_desc:0 "General idea: construct wind tunnels in the Alps for aeronautical research."

  FCF_air_force_talent_training:0 "Train Aeronautical Specialists"
  FCF_air_force_talent_training_desc:0 "General idea: train specialised aviation personnel, including pilots and researchers."

  FCF_train_female_pilots:0 "Train Women Pilots"
  FCF_train_female_pilots_desc:0 "General idea: train women to serve as pilots."

  FCF_establish_paratroopers:0 "Establish the Paratroopers"
  FCF_establish_paratroopers_desc:0 "General idea: establish paratrooper units subordinate to the air force."

  FCF_pragmatic_design:0 "Pragmatic Design"
  FCF_pragmatic_design_desc:0 "General idea: design aircraft according to pragmatic principles."

  FCF_multirole:0 "A Jack of All Trades"
  FCF_multirole_desc:0 "General idea: pursue versatile multirole aircraft."

  FCF_coordination_above_all:0 "Coordination above All"
  FCF_coordination_above_all_desc:0 "General idea: emphasise cooperation between the air force and ground forces."

  FCF_under_bombardment:0 "Under Bombardment"
  FCF_under_bombardment_desc:0 "General idea: employ aerial bombardment to destroy the enemy's organisation and productive capacity."

  FCF_from_theory_to_production:0 "From Theory to Production"
  FCF_from_theory_to_production_desc:0 "General idea: translate aircraft designs into practical mass production."
# Navy
  FCF_cut_naval_budget:0 "Cut the Naval Budget"
  FCF_cut_naval_budget_desc:0 "General idea: prioritising the army and air force inevitably confronts us with insufficient funds. Expenditure must therefore be transferred from the navy to the land and air forces."

  FCF_maintain_naval_budget:0 "Maintain the Naval Budget"
  FCF_maintain_naval_budget_desc:0 "General idea: we cannot abandon the navy. Despite fiscal pressure, its budget must be maintained—and, if possible, expanded."

  FCF_expand_seaports:0 "Expand the Naval Harbours"
  FCF_expand_seaports_desc:0 "General idea: expand shipyards and harbours in preparation for the navy's future development."

  FCF_conclusion_of_shipbuilding_plan:0 "Complete the Shipbuilding Programme"
  FCF_conclusion_of_shipbuilding_plan_desc:0 "General idea: complete the shipbuilding projects that have continued for several years."

  FCF_victory_through_quantity:0 "Victory through Quantity"
  FCF_victory_through_quantity_desc:0 "General idea: expand the production of torpedo boats."

  FCF_rely_on_local_superiority:0 "Rely upon Local Superiority"
  FCF_rely_on_local_superiority_desc:0 "General idea: expand the production of battleships."

  FCF_british_naval_cooperation:0 "Naval Cooperation with Britain"
  FCF_british_naval_cooperation_desc:0 "General idea: establish naval cooperation with the Union of Britain and learn from its advanced naval experience and shipbuilding technology."

  FCF_prepare_landing_operations:0 "Prepare Amphibious Operations"
  FCF_prepare_landing_operations_desc:0 "General idea: establish a specialised force of marines for amphibious landings."

  FCF_secure_naval_supply:0 "Secure Maritime Supply"
  FCF_secure_naval_supply_desc:0 "General idea: expand transport-ship production and improve our convoy-escort capabilities."