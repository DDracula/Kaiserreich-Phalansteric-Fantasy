  pop_total_text_tt:0 "[pop_total_text_loc]"
  pop_total_text:0 "Average Social Satisfaction: [?pop_satisfaction|Y.1%%]\nInfluence of Social Classes:\n$class_pop_workers$: [?pop_workers|Y.1%%]\n$class_pop_peasants$: [?pop_peasants|Y.1%%]\n$class_pop_merchants$: [?pop_merchants|Y.1%%]\n$class_pop_scholars$: [?pop_scholars|Y.1%%]\n$class_pop_bureaucrats$: [?pop_bureaucrats|Y.1%%]\n$class_pop_army$: [?pop_army|Y.1%%]$tooltip_dividing_line$\nEffects of [?pop_satisfaction|Y.1%%] Average Social Satisfaction:\n- $MODIFIER_STABILITY_FACTOR$: [?t1_show|.2%+=]"
  pop_total_text_delayed:0 "§gThe influence of each social class and its support for the various factions affect those factions' political strength. A class's influence and satisfaction also modify the course of economic and military reform. National focuses, events and decisions may cause a class's influence and satisfaction to affect additional matters. When a class possesses more than 35% influence, its satisfaction will produce an additional effect. When a class possesses more than 10% influence but less than 30% satisfaction, a powerful section of society has been driven to anger—with potentially dreadful consequences.§!"

  pop_worker_ui_text_tt:0 "[pop_worker_ui_text_loc]"
  pop_worker_ui_text:0 "$class_pop_workers$: [?pop_workers|Y.1%%]\nSatisfaction: [?pop_satisfaction_workers|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popsw|+=.1%%]\n\n[?popswfade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopswc|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popsw|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_workers|Y.1%%] satisfaction among the $class_pop_workers$, who possess [?pop_workers|Y.1%%] influence:\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: [?w1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: [?w2_show|.2%+=][FCF_pop_modifier_w]$pop_workers_impact_extra$"
  popw_text:0 "§gThe £pop_worker_texticon §OWorkers§! have benefited more than any other group under the Communard system and display a keen interest in politics. Although most £pop_worker_texticon §OWorkers§! support the rule of the §YConfédération Générale du Travail§!, some—particularly those living in regions governed by other factions—display pronounced regionalist sympathies. The §YAffaire de la CGT§! has nevertheless created new divisions within the working class. Those £pop_worker_texticon §OWorkers§! who are not members of the §YConfédération Générale du Travail§! have increasingly begun to seek other solutions.§!"

  pop_peasant_ui_text_tt:0 "[pop_peasant_ui_text_loc]"
  pop_peasant_ui_text:0 "$class_pop_peasants$: [?pop_peasants|Y.1%%]\nSatisfaction: [?pop_satisfaction_peasants|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popsp|+=.1%%]\n\n[?popspfade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopspc|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popsp|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_peasants|Y.1%%] satisfaction among the $class_pop_peasants$, who possess [?pop_peasants|Y.1%%] influence:\n- $MODIFIER_LOCAL_RESOURCES_FACTOR$: [?p1_show|.2%+=]\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?p2_show|.0%+=]$pop_peasants_impact_extra$[FCF_pop_modifier_p]"
  popp_text:0 "§gMany £pop_peasant_texticon §7Peasants§! feel little affection for the present Communard regime. Its unmistakable preference for the £pop_worker_texticon §OWorkers§! has left the £pop_peasant_texticon §7Peasants§! with few of the Revolution's promised fruits of liberation. The deep roots of Christianity in rural France have also fostered strong religious sentiments and an attraction to authority among parts of the peasantry. Although France is a major industrial power, the £pop_peasant_texticon §7Peasants§! still constitute a majority of its population. The villages scattered across its vast countryside have grown weary of Parisian contempt, leading most £pop_peasant_texticon §7Peasants§! to support the £faction_oppo_texticon §RWorkers and Peasants§! faction.§!"

  pop_merchant_ui_text_tt:0 "[pop_merchant_ui_text_loc]"
  pop_merchant_ui_text:0 "$class_pop_merchants$: [?pop_merchants|Y.1%%]\nSatisfaction: [?pop_satisfaction_merchants|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popsm|+=.1%%]\n\n[?popsmfade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopsmc|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popsm|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_merchants|Y.1%%] satisfaction among the $class_pop_merchants$, who possess [?pop_merchants|Y.1%%] influence:\n- $modifier_production_speed_industrial_complex_factor$: [?m1_show|.2%+=]\n- $modifier_production_speed_infrastructure_factor$: [?m2_show|.2%+=][FCF_pop_modifier_m]"
  popm_text:0 "§gTo some, the £pop_merchant_texticon §mPetite Bourgeoisie§! is a class that ought to be \"liquidated\". In reality, progressive members of the pre-revolutionary £pop_merchant_texticon §mPetite Bourgeoisie§! and prosperous £pop_worker_texticon §OWorkers§! emerging after the Revolution together form this somewhat less than ideologically \"proper\" section of Communard society. The category is extremely broad, encompassing everyone from factory managers to humble stallholders at rural markets. Its members consequently differ greatly from one another, but they generally favour whichever faction promises them a better life.§!"

  pop_scholar_ui_text_tt:0 "[pop_scholar_ui_text_loc]"
  pop_scholar_ui_text:0 "$class_pop_scholars$: [?pop_scholars|Y.1%%]\nSatisfaction: [?pop_satisfaction_scholars|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popss|+=.1%%]\n\n[?popssfade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopssc|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popss|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_scholars|Y.1%%] satisfaction among the $class_pop_scholars$, who possess [?pop_scholars|Y.1%%] influence:\n- $MODIFIER_RESEARCH_SPEED_FACTOR$: [?s1_show|.2%+=]\n- $MODIFIER_COMPLIANCE_GAIN_ADD$: [?s2_show|.2%+=][FCF_pop_modifier_s]"
  pops_text:0 "§gFrance's £pop_scholar_texticon §0Intellectuals§! have long been the pride of the world's intellectual life, and never more so than after the Revolution. With the rule of the reactionary haute bourgeoisie overthrown, our £pop_scholar_texticon §0Intellectuals§! are finally free to speak their minds—even when their words do not suit us. Professors, students, writers and artists make up this class. They are the nation's future and do much to determine its course. They possess their own political convictions, but they are united by a desire for change. The stale air of the old order will inevitably drive the £pop_scholar_texticon §0Intellectuals§! to rebel with pen and paper.§!"

  pop_bureaucrat_ui_text_tt:0 "[pop_bureaucrat_ui_text_loc]"
  pop_bureaucrat_ui_text:0 "$class_pop_bureaucrats$: [?pop_bureaucrats|Y.1%%]\nSatisfaction: [?pop_satisfaction_bureaucrats|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popsb|+=.1%%]\n\n[?popsbfade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopsbc|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popsb|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_bureaucrats|Y.1%%] satisfaction among the $class_pop_bureaucrats$, who possess [?pop_bureaucrats|Y.1%%] influence:\n- $MODIFIER_POLITICAL_POWER_FACTOR$: [?b1_show|.0%+=]\n- $economy_power_factor$: [?b2_show|.0%+=][FCF_pop_modifier_b]$pop_bureaucrats_impact_extra$"
  popb_text:0 "§gThe £pop_bureaucrat_texticon §3Bureaucrats§! are the backbone that keeps the entire country functioning. Without them, almost no reform could be put into practice. Yet even the Revolution has done little to eradicate the bureaucracy's inherent maladies. Corruption, the exchange of power for money and the other vices associated with bourgeois states have not spared our own £pop_bureaucrat_texticon §3Bureaucrats§!. They may be mere executors of our highest will, but they remain human beings with thoughts and interests of their own. Officials in different positions may pursue different ends, yet one conviction approaches a consensus among the £pop_bureaucrat_texticon §3Bureaucrats§!: their own powers should be expanded.§!"

  pop_army_ui_text_tt:0 "[pop_army_ui_text_loc]"
  pop_army_ui_text:0 "$class_pop_army$: [?pop_army|Y.1%%]\nSatisfaction: [?pop_satisfaction_army|Y.1%%]\nMonthly Change: [?modifier@monthly_change_popsa|+=.1%%]\n\n[?popsafade|+=.1%%] from natural decay\n[?popsfdis|+=.1%%] from the §Y$CSI$§!'s [CSI_attitude] attitude\n[?popsfev|.1%%+=] from $economy_values$: [?economy_values|.1+=]\n[?popsfeq|.1%%+=] from $economy_equal$: [?economy_equal|.1Y]\n[?billpopsac|+=.1%%] from advisers, Social Legislation or National Spirits\n[?state_strategy_monthly_change_popsa|+=.1%%] from local policies$tooltip_dividing_line$\nEffects of [?pop_satisfaction_army|Y.1%%] satisfaction among the $class_pop_army$, who possess [?pop_army|Y.1%%] influence:\nWith [?pop_army_officers|Y.1%%] $class_pop_officers$ influence:\n- $MODIFIER_MAX_PLANNING$: [?ao1_show|.1%+=]\nWith [?pop_army_ncos|Y.1%%] $class_pop_ncos$ influence:\n- $MODIFIER_ARMY_ORG_FACTOR$: [?an1_show|.1%+=]\nWith [?pop_army_soldiers|Y.1%%] $class_pop_soldiers$ influence:\n- $MODIFIER_ORG_LOSS_WHEN_MOVING$: [?as1_show|.1%-=][FCF_pop_modifier_a]"
  popa_text:0 "§gThe £pop_army_texticon §NArmed Forces§! are governed by hierarchy and discipline. Obedience may be the soldier's first duty, but had we not defied the orders of the bourgeoisie, how could a revolutionary government ever have been founded? The £pop_army_texticon §NArmed Forces§! possess their own divisions between £pop_officer_texticon §POfficers§!, £pop_nco_texticon §zNCOs§! and £pop_soldier_texticon §aSoldiers§!, perhaps even harsher than those of civilian society. Nevertheless, the £pop_army_texticon §NArmed Forces§! remain convinced that the Commune is worth the blood and lives of every one of them—unless they should find themselves compelled to save their country from the Commune itself.§!"

# Dynamic Modifiers
  FCF_pop_modifier:0 "Social Conditions"
  FCF_pop_modifier_desc:0 "The Commune, shaped by all society, is propelled by the common people. Class conflict transforms every sphere. Politics demands compromise, not universal satisfaction. The perennial dilemma: sacrifice some interests for others? Reality will force the answer."
  FCF_pop_modifier_tt:0 "From [?pop_satisfaction|Y.1%%] Average Social Satisfaction:\n- $MODIFIER_STABILITY_FACTOR$: [?t1_show|.2%+=]\n\nFrom [?pop_satisfaction_workers|Y.1%%] satisfaction among the $class_pop_workers$, who possess [?pop_workers|Y.1%%] influence:\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: [?w1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: [?w2_show|.2%+=][FCF_pop_modifier_w]$pop_workers_impact_extra$\n\nFrom [?pop_satisfaction_peasants|Y.1%%] satisfaction among the $class_pop_peasants$, who possess [?pop_peasants|Y.1%%] influence:\n- $MODIFIER_LOCAL_RESOURCES_FACTOR$: [?p1_show|.2%+=]\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?p2_show|.0%+=]$pop_peasants_impact_extra$[FCF_pop_modifier_p]\n\nFrom [?pop_satisfaction_merchants|Y.1%%] satisfaction among the $class_pop_merchants$, who possess [?pop_merchants|Y.1%%] influence:\n- $modifier_production_speed_industrial_complex_factor$: [?m1_show|.2%+=]\n- $modifier_production_speed_infrastructure_factor$: [?m2_show|.2%+=][FCF_pop_modifier_m]\n\nFrom [?pop_satisfaction_scholars|Y.1%%] satisfaction among the $class_pop_scholars$, who possess [?pop_scholars|Y.1%%] influence:\n- $MODIFIER_RESEARCH_SPEED_FACTOR$: [?s1_show|.2%+=]\n- $MODIFIER_COMPLIANCE_GAIN_ADD$: [?s2_show|.2%+=][FCF_pop_modifier_s]\n\nFrom [?pop_satisfaction_bureaucrats|Y.1%%] satisfaction among the $class_pop_bureaucrats$, who possess [?pop_bureaucrats|Y.1%%] influence:\n- $MODIFIER_POLITICAL_POWER_FACTOR$: [?b1_show|.0%+=]\n- $economy_power_factor$: [?b2_show|.0%+=][FCF_pop_modifier_b]$pop_bureaucrats_impact_extra$\n\nFrom [?pop_satisfaction_army|Y.1%%] satisfaction among the $class_pop_army$, who possess [?pop_army|Y.1%%] influence:\nWith [?pop_army_officers|Y.1%%] $class_pop_officers$ influence:\n- $MODIFIER_MAX_PLANNING$: [?ao1_show|.1%+=]$pop_army_officers_impact_extra$\nWith [?pop_army_ncos|Y.1%%] $class_pop_ncos$ influence:\n- $MODIFIER_ARMY_ORG_FACTOR$: [?an1_show|.1%+=]$pop_army_ncos_impact_extra$\nWith [?pop_army_soldiers|Y.1%%] $class_pop_soldiers$ influence:\n- $MODIFIER_ORG_LOSS_WHEN_MOVING$: [?as1_show|.1%-=]$pop_army_soldiers_impact_extra$[FCF_pop_modifier_a]\n\nAltogether, we receive:"

