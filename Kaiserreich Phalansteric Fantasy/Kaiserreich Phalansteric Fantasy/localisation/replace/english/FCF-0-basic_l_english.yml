  army_pop_text:0 "[army_pop_text_loc]"
  army_pop_text_loc_tt:0 "$class_pop_army$: [?pop_army|Y.1%%]\nSatisfaction: [?pop_satisfaction_army|Y.1%%]\n$class_pop_officers$: [?pop_army_officers|Y.1%%]\n$class_pop_ncos$: [?pop_army_ncos|Y.1%%]\n$class_pop_soldiers$: [?pop_army_soldiers|Y.1%%]$tooltip_dividing_line$\nDue to [?pop_satisfaction_army|Y.1%%] satisfaction among the [?pop_army|Y.1%%] influence of the Armed Forces\nDue to the [?pop_army_officers|Y.1%%] share of $class_pop_officers$\n- $MODIFIER_MAX_PLANNING$: [?ao1_show|.1%+=]\nDue to the [?pop_army_ncos|Y.1%%] share of $class_pop_ncos$\n- $MODIFIER_ARMY_ORG_FACTOR$: [?an1_show|.1%+=]\nDue to the [?pop_army_soldiers|Y.1%%] share of $class_pop_soldiers$\n- $MODIFIER_ORG_LOSS_WHEN_MOVING$: [?as1_show|.1%-=][FCF_pop_modifier_a]"
  army_pop_text_delay:0 "[army_pop_text_delay_loc]"
  army_pop_text_delay_loc_tt:0 "§g$class_pop_officers$ are the senior members of the armed forces. In a system where subordinates must obey their superiors, they unquestionably wield the greatest authority. They are often veteran fighters advanced in years, although some are theoretical commanders who have never seen the front. Their knowledge and experience allow them to devise detailed plans and anticipate the course of a campaign through exercises and simulations.\n\n$class_pop_ncos$ form the armed forces' intermediate leadership. Most were promoted from the ranks of ordinary $class_pop_soldiers$, giving them both frontline experience and a measure of theoretical knowledge. Although they cannot direct the broader course of a campaign as $class_pop_officers$ can, a moment of inspiration from an $class_pop_ncos$ may turn defeat into victory under exceptional circumstances.\n\n$class_pop_soldiers$ are the fundamental components of the armed forces. Their duty is to obey and carry out orders. Since the Revolution, however, a current of thought has emerged which regards this hierarchy of obedience as another form of class oppression. $class_pop_soldiers$ are neither unthinking machines nor expendable pieces in another person's game. Had the $class_pop_soldiers$ of the old Republic not defied their orders, how could our Revolution ever have succeeded?§!"

  army_autonomy_ui_tt:0 "[army_autonomy_ui_tt_loc]"
  army_autonomy_ui_tt_loc_tt:0 "$FCF_army_autonomy$: [?FCF_army_autonomy|Y.1]\nMonthly Change: [?modifier@monthly_change_aauto|+=.1]\n[?billaac|+=.1] from advisers, social legislation or National Spirits$tooltip_dividing_line$\nDue to [?FCF_army_autonomy|Y.1] $FCF_army_autonomy$\n- $MODIFIER_STABILITY_FACTOR$: [?aa1_show|+=%.1]\n- $MODIFIER_WAR_SUPPORT_FACTOR$: [?aa2_show|+=%.1]"
  army_autonomy_ui_tt_delay:0 "§gShould an army be loyal to the state or to the Revolution? The Commune has debated this question since the day it was born. Greater autonomy allows our professional officers to construct an efficient and precise instrument of war without political interference. Yet it may also allow the ghosts of the old Republic to haunt the ranks—or even turn the people's sword against the people themselves. Excessive politicisation, by contrast, may smother military professionalism. Finding the proper balance upon this blade will test the wisdom of every leader.§!"

  army_willing_ui_tt:0 "[army_willing_ui_tt_loc]"
  army_willing_ui_tt_loc_tt:0 "$FCF_army_willing$: [?FCF_army_willing|Y.1]\nMonthly Change: [?modifier@monthly_change_awill|+=.1]\n\n[?awcfade|+=.1] from natural decay\n[?awcfws|+=.1] from §Y$WAR_SUPPORT$§! of [?has_war_support|%Y.0]\n[?awcfpopsa|+=.1] from $pop_satisfaction_army$ of [?pop_satisfaction_army|.1Y]\n[?billawc|+=.1] from advisers, social legislation or National Spirits$tooltip_dividing_line$\nDue to [?FCF_army_willing|Y.1] $FCF_army_willing$\n- $MODIFIER_LAND_REINFORCE_RATE$: [?aw1_show|+=%.1]"
  army_willing_ui_tt_delay:0 "§gWhat drives a Communard soldier forward through the shellfire? Is it the world without oppression promised by L'Internationale, the simple desire to defend the bread and wine of home, or the glorious future promised in a factional leader's speech? This measures the flame burning within our soldiers: their resolve to endure casualties, hold their ground and finally reduce the enemy's defences to ashes. This invisible force is far more resilient than steel.§!"

  army_training_ui_tt:0 "[army_training_ui_tt_loc]"
  army_training_ui_tt_loc_tt:0 "$FCF_army_training$: [?FCF_army_training|Y.1]\nMonthly Change: [?modifier@monthly_change_atrain|+=.1]\n\n[?atcfade|+=.1] from natural decay\n[?atcfcgsc|.1+=] from the [CGFF_attitude] §Y$CGFF$§!\n[?billatc|+=.1] from advisers, social legislation or National Spirits$tooltip_dividing_line$\nDue to [?FCF_army_training|Y.1] $FCF_army_training$\n- $MODIFIER_POCKET_PENALTY$: [?at1_show|-=%.1]"
  army_training_ui_tt_delay:0 "§gHow can comrades drawn from the fields and factories be transformed into capable soldiers? That depends upon how we mould them. Should we retain the rigid drill and discipline of the old army, or encourage flexible initiative among frontline squads? Should we emphasise the coordination of large formations, or master the infiltration techniques of small units? High-quality training can forge a rabble into battle-hardened troops. On a merciless battlefield, this means fewer casualties and a greater chance of victory.§!"

  army_equipment_ui_tt:0 "[army_equipment_ui_tt_loc]"
  army_equipment_ui_tt_loc_tt:0 "$FCF_army_equipment$: [?FCF_army_equipment|Y.1]\nMonthly Change: [?modifier@monthly_change_aequip|+=.1]\n\n[?aecfade|+=.1] from natural decay\n[?aecfeia|+=.1] from $economy_industry_arms$ of [?economy_industry_arms|.1Y]\n[?billaec|+=.1] from advisers, social legislation or National Spirits$tooltip_dividing_line$\nDue to [?FCF_army_equipment|Y.1] $FCF_army_equipment$\n[FCF_army_equipment_buff_infantry_equipment]"
  army_equipment_ui_tt_delay:0 "§gWar is, in some respects, also a contest between factories and laboratories. Should our army receive a small number of sophisticated, advanced weapons crafted like works of art, or should countless militiamen be issued simple, reliable rifles that can be mass-produced? This question reflects both the strength of our industrial system and our judgement regarding the character of future warfare. A technological gap can often decide a campaign at its critical moment.§!"

  army_passionate_ui_tt:0 "[army_passionate_ui_tt_loc]"
  army_passionate_ui_tt_loc_tt:0 "$FCF_army_passionate$: [?FCF_army_passionate|Y.1]\nMonthly Change: [?modifier@monthly_change_apassion|+=.1]\n\n[?apcfade|+=.1] from natural decay\n[?apcfws|+=.1] from §Y$WAR_SUPPORT$§! of [?has_war_support|%.0Y]\n[?apcfpops|+=.1] from $pop_satisfaction$ of [?pop_satisfaction|.1Y]\n[?billapc|+=.1] from advisers, social legislation or National Spirits$tooltip_dividing_line$\nDue to [?FCF_army_passionate|Y.1] $FCF_army_passionate$\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: [?ap1_show|+=%.1]\n- $MODIFIER_MOBILIZATION_SPEED$: [?ap2_show|+=%.1]"
  army_passionate_ui_tt_delay:0 "§gWhen the trumpet of war sounds, how many citizens will lay down their tools and ploughs to don a uniform? Such enthusiasm may spring from radio calls for revenge against Germany, from a determination to defend the gains of the Revolution, or from the stable livelihood and social honour conferred by military service. High enlistment enthusiasm provides a constant supply of manpower—the fundamental guarantee that the Commune can endure a prolonged war of attrition.§!"
# Doctrine
