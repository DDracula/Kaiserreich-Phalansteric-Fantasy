  gui_diplomacy_CAE_detail:0 "§g§!"

  gui_economy_CE:0 "Commissaire à l'Économie ([CE_attitude])\n§Y[CE_leader_loc]§!\n"
  gui_economy_CE_detail:0 "§gThe Commissaire à l'Économie largely represents the popular will in economic affairs. Economic reforms enjoying their support can be passed with relative ease, while defying their wishes may bring our efforts to a standstill. Each political faction also possesses influence over the economy. Although our reforms may weaken some of them, any faction with sufficient influence will not take such an affront lying down.§!"

  gui_society_CSI:0 "Commissaire à la Sûreté intérieure ([CSI_attitude])\n§Y[CSI_leader_loc]§!"
  gui_society_CSI_detail:0 "§gAs the highest official responsible for policing, public order and political security, the authority of the Commissaire à la Sûreté intérieure extends across the country. They are both the executor of republican law and the guardian of political loyalty. Although nominally subject to the collective supervision of the communes, control over the vast security apparatus grants this office nearly independent influence. With their support, social and security reforms can proceed unhindered; without it, delay and silence from the security services may be enough to leave us paralysed. In the worst case, a single secret order could place loyal Communard officials under surveillance while reformers are branded as threats to stability—and there would be little we could do about it.§!"

  gui_society_CC:0 "Commissaire à la Culture ([CC_attitude])\n§Y[CC_leader_loc]§!"
  gui_society_CC_detail:0 "§gThe Commissaire à la Culture stands at the centre of ideological policy, artistic review and the circulation of information. This office not only selects and preserves the heritage of an ancient civilisation, but also acts as a stern custodian of the boundaries of public thought. Although legally subordinate to the Commune's executive institutions, its control over publishing, education and mass media has transformed it into a form of soft-power hegemony transcending ordinary administrative authority. With its favour, even the most radical policy can be presented as the inevitable demand of the age. With its displeasure, an expanded list of forbidden terms and silence across the propaganda apparatus may suffice to erase a reformer's voice from public consciousness—or brand them overnight as a traitor to the nation's very spirit.§!"

  gui_army_CGFF:0 "Chef général des Forces fédérales ([CGFF_attitude])\n§Y[CGFF_leader_loc]§!"
  gui_army_CGFF_detail:0 "§gEven within the armed forces, attitudes towards Communard politics differ. The Chef général des Forces fédérales is an elected office, yet one that wields immense influence throughout the military establishment. We therefore cannot guarantee that the army will remain solely a force for defending the Revolution, untouched by the wider struggles of society. In the worst case, our programme of military reform could be rejected by the army itself.§!"

