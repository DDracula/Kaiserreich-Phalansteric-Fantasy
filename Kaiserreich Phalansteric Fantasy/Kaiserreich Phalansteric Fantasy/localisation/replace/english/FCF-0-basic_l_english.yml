  ev_detail:0 "§g$economy_values$, or economic vitality, represents the overall state of our economy. Better economic conditions provide greater benefits and make the population more supportive of our leadership.§!"
  evpchange_detail:0 "Our economy will fluctuate with the economic cycle. National focuses, events and decisions can alter the range and intensity of these cyclical changes.\n[evpchange_detail_loc]"
