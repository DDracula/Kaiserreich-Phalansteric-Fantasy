  # Army
  FRA_joseph_putz:0 "Joseph Putz"
  FRA_joseph_putz_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L24 April 1895; Brussels, Brabant, Kingdom of Belgium§!\n§YBackground:§! §LJoseph Putz's family came from Alsace. His biological father was German but refused to acknowledge him. After completing lower secondary school, Putz became a junior clerk at the municipal offices of Le Pré-Saint-Gervais. He enlisted in December 1914 and trained with the 89th Infantry Regiment. Promoted to corporal in April 1915, he transferred the following month to an assault detachment of the 168th Infantry Regiment. His conduct at the Battle of Bois-le-Prêtre earned him a regimental citation. In February 1916, while stationed between Reillon and Blémerey, Putz repeatedly volunteered to serve as a dispatch runner and received another regimental citation. He distinguished himself at Verdun in July and earned a brigade-level citation. In October, he became an officer cadet.\n\nPutz again volunteered as a runner in April 1917, earning a third regimental citation. He was promoted to sergeant in June and second lieutenant in October. On 24 March 1918, he was severely wounded in a gas attack at Vacqueville and sent to the rear to recover. Because of his poor health, he transferred to the 504th Tank Regiment in March 1919 and fought in the battles of Clermont and the Second Oise. He participated in the Soldiers' Committees and was elected as a soldiers' delegate. A recurrence of his injuries led to his indefinite suspension from duty that September, although he was promoted to lieutenant in October. During the Weltkrieg, he received the rank of Chevalier de la Légion d'honneur and the Croix de guerre with four bronze stars.\n\nIn January 1920, a medical board decided that severe damage to his lungs required his discharge. Joffre immediately issued a mobilisation order, however, sending the man who had been about to leave the service straight back into the army. Enraged, Putz ultimately joined the Paris uprising. He was promoted to captain and then appointed temporary major, a rank later made permanent. After the Revolution, he worked in the municipal administrations of Montrouge and Le Kremlin-Bicêtre, becoming head of a municipal department in Stains in 1930. Jean Chardavoine of the Parti Ouvrier Unifié was elected mayor of Stains in 1931. When municipal funds were stolen, Chardavoine accused Putz of embezzlement. Putz defended himself in Doriot's newspaper L'Émancipation. He resigned that October and returned to the army, entering an advanced staff course for reserve officers to study staff work and mobile-warfare theory. He graduated in 1933, was promoted to lieutenant-colonel and joined the Inspectorate of Tanks. In 1934, he helped form the 1st Light Mechanised Division and became a battalion commander.\n\nAn armoured officer, Putz supports armoured warfare.\n\nHe is a member of the Confédération Générale du Travail, president of the Stains branch of the Fédération sportive et gymnique du travail and a member of the Secours rouge international. He reads Marx and Lenin, books published by the Centre de diffusion du livre et de la presse and Doriot's L'Émancipation. He is interested in economics and urban planning. Although his political sympathies are complex, he supports the Parti Ouvrier Unifié.§!"

  FRA_henri_tanguy:0 "Henri Tanguy"
  FRA_henri_tanguy_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L12 June 1908; Morlaix, Finistère, French Republic§!\n§YBackground:§! §LGeorges René Henri Tanguy was the son of a naval petty officer and a laundress. He was born at Morlaix railway station and spent his early years in Brest and Toulon before returning to Brest in 1919. The following year, he accompanied his father during the sailors' uprising. After the war, the family moved to Paris, where Tanguy attended the Lycée technique Diderot. Upon graduating in 1925, he began working at the Renault factory in Boulogne-Billancourt and joined the youth organisation of the Parti Ouvrier Unifié.\n\nTanguy volunteered for military service in 1927 and joined the 151st Infantry Regiment. His strong performance earned him admission to the NCO training platoon. He was promoted first to corporal and then sergeant in 1928. Promoted to staff sergeant in 1929, he entered the Rennes class of the École spéciale militaire de Saint-Cyr. He graduated in 1931, was commissioned as a second lieutenant and volunteered for service in Patagonia, where he distinguished himself on several occasions. He was promoted to lieutenant in 1933 and captain in 1935.\n\nTanguy excels at mass political work, militia organisation and guerrilla warfare.\n\nModest and approachable, he enjoys cycling and military life. He is highly idealistic and possesses a strong sense of organisation and discipline. Politically, he supports the Parti Ouvrier Unifié.§!"

  FRA_georges_catroux:0 "Georges Catroux"
  FRA_georges_catroux_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_1$)\n§YBorn:§! §L29 January 1877; Limoges, Haute-Vienne, French Republic§!\n§YBackground:§! §LGeorges Albert Julien Catroux was the son of a colonel in the colonial army. Educated at the Prytanée national militaire de La Flèche, he entered the École spéciale militaire de Saint-Cyr in 1896. Upon graduating in 1898, he joined the 12th Bataillon de chasseurs alpins. During the Dreyfus Affair and the dispute over the separation of Church and state, he was regarded as an Opportunist Republican. In 1900, Catroux joined the Légion étrangère as a lieutenant and participated in operations to suppress resistance in Algeria. He went to Indochina in 1903 to assist Governor-General Paul Beau. In 1906, he met Hubert Lyautey, became a member of his personal staff and served on the staff of the Oran Division, receiving promotion to captain.\n\nCatroux was appointed a Chevalier de la Légion d'honneur in 1913. He subsequently joined the political staff of Algerian Governor-General Charles Lutaud, although the two men disagreed politically. Returning to France in 1915, he became a battalion commander in the 2nd Algerian Infantry Regiment and fought at Quennevières and in Champagne, receiving a regimental citation. He participated in the Battle of Verdun in 1916 and earned a divisional citation. In 1917, he fought at Hill 304 near Verdun and received another regimental citation.\n\nPromoted to major in 1918, Catroux displayed extraordinary endurance during the German spring offensive. Despite a wound to one leg, he led his men in holding off an entire German division for nearly twenty hours before finally being captured. His conduct brought an army-level citation and another distinction from the Légion d'honneur. He made several attempts to escape from captivity. His wartime decorations included the Croix de guerre with two bronze stars, one silver star and one palm, the rank of Officier de la Légion d'honneur and the Médaille des évadés.\n\nCatroux returned to France in November 1919. When Lutaud repeatedly delayed action over citizenship rights for soldiers, Catroux attempted to mediate. After Pétain's coup, he initially supported the military government. Negotiations over citizenship nevertheless failed, and the soldiers chose revolution; Catroux consequently left the army. Recalled in 1922, he assumed command of the 503rd Tank Regiment and was promoted to lieutenant-colonel. In 1924, he transferred to the regional section of the Executive Committee of the Third Internationale, where he handled diplomatic affairs concerning North Africa, the Levant and Indochina. He supported the Tunisian general strike in 1925.\n\nCatroux attended the Centre des hautes études militaires in 1927 and was promoted to colonel. Returning to military service in 1930, he became Chief of Staff of the 4th Military Region and was promoted to brigadier-general. In 1932, he assumed command of the 14th Infantry Division and received promotion to major-general. He became Deputy Chief of the General Staff with the rank of lieutenant-general in 1935.\n\nCatroux considers the General Staff rigid and conservative and believes that its older officers should yield their positions to a younger generation, although he lacks the influence necessary to compel such a change. In colonial affairs, he argues that the Third Internationale should assist colonised peoples in achieving independence but must not intervene recklessly. Once independence has been secured, he favours strong political, economic and cultural cooperation to promote modernisation.\n\nMild-mannered and inclined towards negotiation rather than force, Catroux is known as the 'Diplomat General'. He supports Neo-Socialism and believes that Planisme can foster unity and stability, but refuses to abandon democracy altogether.§!"

  FRA_rene_olry:0 "René Olry"
  FRA_rene_olry_character_desc:0 "§YBorn:§! §L28 June 1880; Lille, Nord, French Republic§!\n§YBackground:§! §LRené Henri Olry was the son of Albert Olry, a distinguished engineer. He accompanied his father during childhood and lived successively in Nancy and Paris. In 1900, he entered the École polytechnique. Upon graduating in 1902, he was commissioned as a second lieutenant and joined the 21st Artillery Regiment. He entered the École d'application de l'artillerie et du génie at Fontainebleau in 1903, returning to his regiment and receiving promotion to lieutenant the following year. Olry transferred to the 25th Artillery Regiment in 1912 and was promoted to captain in 1913.\n\nWhen the Weltkrieg began, Olry commanded the 9th Artillery Battery. He participated in the battles of the Ardennes and the First Marne, followed by the fighting at Les Éparges in 1915. He subsequently transferred to the staff of the Sixth Army and moved to the staff of the fortified region of Versailles that September. In March 1916, he joined the staff of the Second Army under Pétain and participated in the First Battle of Verdun. He transferred to the Centre d'études de l'artillerie in May. In 1917, Olry served on the staff of the Central Army Group and later joined the staff of the French expeditionary force in Italy under Émile Fayolle, participating in the First Battle of the Piave.\n\nIn February 1918, Olry transferred to the 283rd Heavy Artillery Regiment and fought in the Second Battle of Picardy and the Second Battle of the Marne. He joined the staff of the Reserve Army Group in July and was promoted to major in September. In 1919, he participated in the battles of Compiègne and the Second Oise. His wartime decorations included the rank of Chevalier de la Légion d'honneur, the Croix de guerre with two palms, one gilt star, one silver star and one bronze star, and the Médaille des blessés de guerre.\n\nAfter the war, Olry transferred to the Inspectorate-General of Artillery in Paris. He refused to participate in the coup of 1920 and remained in Paris after its liberation, joining the Revolutionary Army. In 1921, he entered the École supérieure de guerre. He joined the secretariat of the National Defence Council in 1923 and was promoted to lieutenant-colonel in 1926. In 1928, he became a colonel and assumed command of the 302nd Artillery Regiment. He attended the Centre des hautes études militaires in 1931. Promoted to brigadier-general in 1932, he took command of the 29th Infantry Division. In 1935, he was promoted to major-general and concurrently appointed commander of the 15th Military Region.\n\nOlry is skilled in artillery, organisation and defensive operations, and possesses particular expertise in mountain warfare.\n\nPragmatic, calm, discreet and deeply conscientious, Olry maintains strict political neutrality. His personal sympathies lie with the Ligue de la Jeune République.§!"

  FRA_diego_brosset:0 "Diego Brosset"
  FRA_diego_brosset_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L3 October 1898; Buenos Aires, Buenos Aires Province, Argentine Republic§!\n§YBackground:§! §LDiego Charles Joseph Brosset came from Lyon. His father worked as a stockbroker in Buenos Aires. Diego returned to France at the age of two and was educated at Jesuit schools in Lyon and Dole. A poor student who detested school discipline, he left at fifteen. Driven by a 'burning mysticism', he developed a fascination with war and the homeland.\n\nBrosset volunteered for military service in 1916, joining the 28th Bataillon de chasseurs alpins as a private before transferring to the 68th Battalion. He participated in the Battle of Malmaison in 1917. In 1918, he fought in the Second and Third Battles of Picardy and was promoted to corporal. He took part in the Third Battle of the Somme and Second Battle of the Lys in 1919 and was promoted to sergeant. Mutiny swept through the 68th Battalion that July. Although Brosset did not desire an armistice, he acknowledged that the slaughter had to end.\n\nBrosset became an officer cadet in December and prepared to attend the École militaire d'infanterie de Saint-Maixent. Before he could arrive, civil war erupted and he was mobilised into the government forces. Unwilling to fight his former comrades, Brosset deserted back to his old unit and ultimately joined the Revolution. He participated in the Marseille uprising and the battles of the Rhône Valley and Troyes. During the Weltkrieg, he received four citations and the Croix de guerre with two bronze and two silver stars.\n\nAfter the revolutionary victory, Brosset joined the Corps des soldats révolutionnaires and was sent to Haute-Savoie to confront the Swiss Army, where he met Marie-Pierre Kœnig. He resumed his studies at the infantry school in 1922. A diligent student and enthusiastic athlete, he won the 800- and 1,500-metre events at the French military games and also studied at the École normale de gymnastique et d'escrime de Joinville. Upon graduating in 1924, he was commissioned as a second lieutenant and selected for the regional section of the Third Internationale. Brosset volunteered for Africa.\n\nIn the southern Sahara, he investigated local conditions, established contact with anti-colonial forces and organised guerrillas. His command of Arabic and its dialects earned him a reputation as a specialist on the Sahara. He was successively promoted to lieutenant and captain. In 1929, he concurrently became head of the General Staff's African and Eastern Affairs Office and was promoted to major. He returned to France in 1931, enrolled at the École nationale des langues orientales vivantes in Paris and was promoted to lieutenant-colonel. In 1933, he received a degree in literary Arabic and entered the École supérieure de guerre. He condemned its closed social circle as 'soulless'. Upon graduating in 1935, he became commander of the 54th Infantry Brigade and was promoted to colonel.\n\nBrosset possesses extensive experience in unconventional warfare and rejects traditional military thinking. He stresses mission-oriented command and a politicised army, believing that only soldiers armed with powerful convictions can bring the human factor to its fullest expression.\n\nBrosset possesses nationalist and mystical inclinations and is deeply enamoured of Saharan culture, earning the nickname 'the Camel Man'. An enthusiastic writer, he is the author of the novel Sahara: A Man Far from the West. Fiery and impulsively daring, he has been known to drive a jeep straight up a flight of stairs.§!"

  FRA_marie_pierre_koenig:0 "Marie-Pierre Kœnig"
  FRA_marie_pierre_koenig_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L10 October 1898; Caen, Calvados, French Republic§!\n§YBackground:§! §LMarie Joseph Pierre François Kœnig came from an Alsatian family. His father was a celebrated organist who had been disabled in the Franco-Prussian War, while his mother was a florist. He attended the Lycée Malherbe and participated actively in the Catholic-sponsored Sillon youth club. Immediately after completing secondary school in 1917, Kœnig presented his diploma and enlisted, joining the 36th Infantry Regiment on 17 April. His strong performance secured him a place at the accelerated officer school in Issoudun at the end of that year.\n\nKœnig graduated as an officer cadet in February 1918 and participated in the Second Battle of the Marne and Third Battle of Picardy. He was promoted to second lieutenant, received an army-level citation and was awarded the Médaille militaire. In 1919, he fought at Compiègne and in the Second Battle of the Oise, earning a regimental citation. Kœnig opposed the armistice. His wartime decorations included the Médaille militaire and the Croix de guerre with bronze star and palm.\n\nAfter Pétain's coup, the 36th Regiment voted to support the mutiny, and Kœnig accepted the result. When civil war followed, the regiment rose in Caen. Kœnig participated in the Battle of Paris and the great pursuit into western France. He remained in the army after the Revolution. In 1920, he joined the 15th Bataillon de chasseurs alpins and confronted Swiss forces in Haute-Savoie. There he met Diego Brosset, joined the Corps des soldats révolutionnaires and was promoted to lieutenant.\n\nKœnig entered the École militaire d'infanterie de Saint-Maixent in 1922. Upon graduating in 1924, he was assigned to the military section of the Third Internationale as Georges Catroux's aide-de-camp and promoted to captain. He transferred to Patagonia in 1925 to assist in organising its armed forces and became a major in 1930. Returning to France in 1931, he joined the staff of the 40th Infantry Division. He transferred to the staff of the 43rd Infantry Division in 1933 and was promoted to lieutenant-colonel.\n\nLong service in Chile and Patagonia brought Kœnig into repeated mobile engagements against Argentine infiltration forces. This experience of unconventional warfare has led him to emphasise mobility and initiative.\n\nKœnig is strongly Catholic and equally committed to nationalism, placing the interests of France above all else. He believes that the feeble government in Algiers is incapable of recovering the lost homeland. Politically, he supports the Confédération Nationale-Syndicaliste and is notably friendly towards Jews.§!"

  FRA_francois_de_linares:0 "François de Linares"
  FRA_francois_de_linares_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L7 July 1897; Guéret, Haute-Vienne, French Republic§!\n§YBackground:§! §LFrançois Jean Marie Amédée Antoine Gonzalez de Linares was the son of a landowner and winegrower born in British India, whose family originated in Spain. His mother came from the Vendée. Orphaned at an early age, Linares spent his childhood in a monastery and was educated at the Jesuit-run Institution Sainte-Geneviève. For a time, he found himself torn between a religious vocation and military service.\n\nLinares obtained French citizenship in 1916 specifically so that he could enlist and immediately entered the Flag class of the École spéciale militaire de Saint-Cyr. An excellent student, he graduated as an officer cadet in July 1917 and joined the 370th Infantry Regiment, participating in the Battle of Malmaison. In November, he transferred to the 70th Chasseur Battalion and went to Italy to assist the Italian Army after its catastrophic defeat at Caporetto.\n\nReturning to France in April 1918, Linares joined the 26th Infantry Regiment and fought in the battles of Soissons and the Second Lys. He was wounded twice, promoted to second lieutenant and received citations at army, corps, regimental and divisional level. In 1919, he participated in the battles of Compiègne and the Second Oise, earning a divisional citation, the Médaille militaire and a distinction from the Légion d'honneur. He opposed the armistice. His wartime decorations included the Croix de guerre with bronze star, two silver stars, gilt star and palm, the Médaille militaire and the rank of Chevalier de la Légion d'honneur.\n\nAfter the armistice, Linares returned to Saint-Cyr to complete his studies. When civil war erupted, he refused to fight his compatriots and returned home. He resumed his education in 1921, graduated at the end of the year and was assigned to the military section of the Third Internationale. He was promoted to lieutenant in 1922 and joined the volunteers sent to assist Britain in 1924. In 1926, he became an instructor at Saint-Cyr and was promoted to captain. Linares entered the École supérieure de guerre in 1928 and graduated in 1930. He subsequently served with the 15th Bataillon de chasseurs alpins and was promoted to major. In 1934, he joined the staff of the 14th Military Region and received promotion to lieutenant-colonel.\n\nLinares emphasises mobility and takes a particular interest in paratroopers and air–ground cooperation.\n\nResolute and composed but inwardly sensitive, Linares loves life and remains deeply devout. He speaks English well and supports the Ligue de la Jeune République.§!"

  FRA_raoul_salan:0 "Raoul Salan"
  FRA_raoul_salan_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L10 June 1899; Roquemaure, Gard, French Republic§!\n§YBackground:§! §LRaoul Albin Louis Salan was the son of a tax-office director. Educated at the boys' lycée in Nîmes on a national scholarship, he volunteered for military service in August 1917 and entered the Sainte-Odile class of the École spéciale militaire de Saint-Cyr. He graduated as an officer cadet in July 1918 and joined the 5th Colonial Infantry Regiment. Salan participated in the Third Battle of Picardy and Second Battle of the Somme, receiving regimental and divisional citations.\n\nIn 1919, he fought in the Third Battle of the Somme, Second Battle of the Lys and Battle of Saint-Mihiel. He earned both an army-level citation and a distinction from the Légion d'honneur and was promoted to second lieutenant. He participated in a Soldiers' Committee and opposed the armistice. His wartime decorations included the Croix de guerre with bronze star, silver star and palm and the rank of Chevalier de la Légion d'honneur.\n\nSalan returned to Saint-Cyr that October. He did not support the Christmas Eve coup, although mobilisation orders forced him back into his regiment. He participated in the Battle of Paris in 1920 and joined his unit's uprising during the Battle of Le Mans. After the war, he entered the Corps des soldats révolutionnaires. Salan returned to Saint-Cyr in May 1921 and graduated in 1922 with promotion to lieutenant.\n\nVolunteering for the service of the Third Internationale, Salan was assigned to its regional section and sent to Indochina, where he studied local society and assisted revolutionary movements. He sympathised with ethnic minorities and opposed the Đại Việt chauvinism of the Vietnamese Nationalist Party. Promoted to captain in 1926, he concurrently became deputy head of the Eastern Affairs Office in the Second Bureau of the General Staff. Salan participated in the Yên Bái uprising in 1930 and was promoted to major. After its failure, disagreements with Vietnamese revolutionaries led to his transfer to China. In 1932, he participated in the Shanghai uprising before travelling to the revolutionary base in Fujian and Jiangxi. He returned to France in 1934, was promoted to lieutenant-colonel and became deputy commander of the 5th Infantry Regiment.\n\nHis long service in colonial territories has produced an unconventional military outlook. Drawing upon the revolutionary experience of Indochina and China, he understands guerrilla warfare and stresses initiative among officers and soldiers, military politicisation and mobility.\n\nReserved, quiet, contemplative and secular, Salan possesses an extraordinary passion for East Asian culture and is nicknamed 'the Mandarin'. He speaks Lao and understands the nationalities question in Indochina. He has an illegitimate child of partial Indochinese ancestry. His study of the Chinese Revolution includes the writings of Deng Yanda, Ye Ting and Mao Zedong, earning him the additional nickname 'the Chinaman'. His position on colonial questions sometimes draws accusations of great-power chauvinism, and he remains a committed nationalist. Although formally attached to the Corps des soldats révolutionnaires, he takes little interest in ordinary party politics and maintains his own distinctive views on colonial affairs.§!"

  FRA_henri_frenay:0 "Henri Frenay"
  FRA_henri_frenay_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L11 November 1905; Lyon, Rhône, French Republic§!\n§YBackground:§! §LHenri Auguste Antoine Frenay was the son of an army lieutenant-colonel who had fought in the Weltkrieg and received the rank of Officier de la Légion d'honneur and the Croix de guerre. His mother was a homemaker. Frenay grew up in a traditional, conservative and deeply Catholic household. He attended the Lycée Ampère and completed his preparatory studies at the Lycée du Parc in 1924 before entering the Colonel Rossel class of the École spéciale militaire de Saint-Cyr.\n\nGraduating in 1926, Frenay was commissioned as a second lieutenant and joined the 3rd Bataillon de chasseurs alpins. He received training as an aerial observer. Promoted to lieutenant in 1929, he transferred to the military section of the Third Internationale and served in Syria. Frenay returned to France in 1932 and entered the École supérieure de guerre. He graduated in 1934 and joined the Third Bureau on the staff of the 20th Military Region. He was promoted to captain in 1935.\n\nFrenay is skilled in organisational work and intelligence gathering.\n\nCourageous and charismatic, he possesses an forceful leadership style but is also stubborn, proud and intensely loyal to those close to him. Before meeting his wife, he inclined towards political neutrality. Under her influence, he gradually became a socialist, although he remains opposed to Marxism.§!"

  FRA_gaston_billotte:0 "Gaston Billotte"
  FRA_gaston_billotte_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L10 February 1875; Sommeval, Aube, French Republic§!\n§YBackground:§! §LGaston Henri Gustave Billotte was the son of a primary-school teacher. He attended the Lycée Chrétien-de-Troyes before entering the Alexandre III class of the École spéciale militaire de Saint-Cyr in 1894, where he studied under Paul-Frédéric Rollet. After graduating in 1896, he served in the Troupes de marine and was posted successively to Tonkin and China. Billotte was promoted to lieutenant in 1898 and captain in 1903. He returned to France in 1907 and attended the École supérieure de guerre.\n\nBillotte returned to Tonkin as a battalion commander in 1911 and was promoted to major. He went to Morocco in 1913 and was appointed a Chevalier de la Légion d'honneur the following year. Returning to France in 1915, he was promoted to lieutenant-colonel and appointed head of the Foreign Operations Section in the Third Bureau of the Grand Quartier Général. In 1916, he became a colonel and headed the Third Bureau on the staff of the Second Army, receiving an army-level citation.\n\nAt the end of 1917, Billotte briefly served as deputy commander of the 40th Infantry Division. In 1918, he became Chief of Staff of the 32nd Infantry Division. That April, he led the 15th Infantry Regiment during the First Battle of the Lys and suffered mustard-gas poisoning in the fighting at Mont Kemmel. He was evacuated to the rear and received another army-level citation. Returning to duty in February 1919, he led troops through the battles of Compiègne, Clermont and the Oise between March and May, earning another distinction from the Légion d'honneur. As mutiny spread, the 32nd Division became paralysed and remained so until the war ended.\n\nBillotte emerged from the war heavily decorated. He received the Croix de guerre with two palms, the rank of Officier de la Légion d'honneur and numerous foreign decorations. After Pétain's coup, he was selected for promotion to brigadier-general and summoned to serve at the Grand Quartier Général. Civil war broke out before the appointment could take effect, however, and the military government had no time to settle his position. Billotte had no desire to intervene in politics and remained at home until the war ended.\n\nThe Commune's shortage of experienced officers nevertheless led to his recall. In 1921, he assumed command of the 64th Infantry Brigade. He became Director of the First Bureau at army headquarters in 1923. In 1925, he concurrently served as a military adviser to the Third Internationale and assisted the Chinese Revolution. Billotte assumed command of the 10th Infantry Division with the rank of major-general in 1927. He became Chief of the Army General Staff and was promoted to lieutenant-general in 1929.\n\nBillotte adheres to defensive tactics and the primacy of firepower, stresses the necessity of mass mobilisation and regards armoured formations chiefly as mobile reserves. As Chief of Staff, he has made a major contribution to restoring order within the Communard army, although critics accuse his conservatism of obstructing military reform.\n\nBillotte's entry into the Communard army was largely accidental. Politically, he supports the established institutional order.§!"

  FRA_jean_edouard_verneau:0 "Jean-Édouard Verneau"
  FRA_jean_edouard_verneau_character_desc:0 "§YBorn:§! §L29 August 1890; Vignot, Meuse, French Republic§!\n§YBackground:§! §LJean-Édouard Verneau was the son of a civil servant. He attended the Lycée Henri-Poincaré in Nancy and entered the École polytechnique in 1911. Upon graduating in 1913, he continued his education at the École d'application du génie in Versailles. He graduated the following year, was commissioned as a second lieutenant and joined the 3rd Engineer Battalion.\n\nDuring the Weltkrieg, Verneau participated in the siege of Maubeuge, the First Battle of the Marne and the fighting in Flanders in 1914. In 1915, he fought in both the First and Second Battles of Champagne. He participated in the battles of Verdun and the Somme in 1916, was promoted to lieutenant and was wounded at the end of the year. While recovering in 1917, he served at the engineering school in Versailles. He returned to his unit in February 1918 and fought in the Second Battle of Picardy, the Second Battle of the Marne and the Third Battle of Picardy, receiving promotion to captain. In 1919, he participated in the battles of Compiègne and the Oise. His wartime decorations included the Croix de guerre with silver star and palm and the Médaille des blessés de guerre.\n\nVerneau supported the government forces during the civil war, but joined the Revolution after being captured at Troyes. From 1920 to 1922, he attended the École supérieure de guerre. After graduating, he joined the First Bureau of the Army General Staff and was promoted to major. In 1927, he transferred to the First Bureau of the General Staff and received promotion to lieutenant-colonel. He assumed command of the 19th Engineer Regiment with the rank of colonel in 1932.\n\nAn engineer officer and devoted patriot, Verneau places the national interest above party considerations and maintains political neutrality.§!"

  FRA_georges_revers:0 "Georges Revers"
  FRA_georges_revers_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_4$)\n§YBorn:§! §L30 July 1891; Saint-Malo, Ille-et-Vilaine, French Republic§!\n§YBackground:§! §LGeorges Marie Joseph Revers was the son of an inspector in the postal and telegraph administration. Educated at the Lycée de Saint-Malo, he entered the postal service as a clerk in 1907. He was conscripted into the 3rd Artillery Regiment in 1912, promoted to corporal in April 1913 and became a reserve officer cadet that October. In April 1914, Revers was commissioned as a reserve second lieutenant and transferred to the 10th Foot Artillery Regiment.\n\nMobilised in August, he joined the Montenegrin expeditionary artillery battery and participated in the fighting at Cattaro, earning a citation from the Montenegrin Army. He fought in the Second Battle of Champagne in 1915 and received a regimental citation. At Verdun in 1916, he earned a brigade-level citation and was promoted to reserve lieutenant. Revers participated in the Battle of the Chemin des Dames in 1917. He subsequently became commander of the floating artillery battery Marcel and fought at Malmaison, receiving a permanent commission as lieutenant.\n\nIn 1918, Revers transferred to the 70th Heavy Artillery Regiment while retaining the same duties. He fought in the Third Battle of the Aisne and at Soissons, received both a divisional citation and a distinction from the Légion d'honneur, and was promoted to regular captain. He participated in the Battle of the Oise in 1919. His decorations from the Weltkrieg included the rank of Chevalier de la Légion d'honneur, the Croix de guerre with two bronze and one silver star, the officer's cross of the Order of Prince Danilo I and the Montenegrin Medal for Bravery.\n\nRevers was seconded to the Third Bureau of the Ministry of War in August 1919. In October, he joined the War Minister's special staff, although he worked in practice for the Director of Artillery. He had little affection for Pétain and joined the Revolution during the final stages of the Battle of Paris. In October 1920, he transferred to the Inspectorate-General of Artillery. He joined the Paris Inspectorate of Forges in 1923 and was promoted to major. Revers participated in the volunteers sent to assist Britain in 1924, where he met Jacques Doriot. After returning home, he entered the École supérieure de guerre. He transferred to the 32nd Artillery Regiment in 1928. In 1931, he became Director of the Fourth Bureau of the Army General Staff and was promoted to lieutenant-colonel. He became Deputy Director of the Fourth Bureau of the General Staff in 1935.\n\nRevers is a commoner who rose through the officer corps and retains a degree of sympathy for socialism. He participates actively in politics and eagerly cultivates political allies. Through his friend Roger Peyré, he maintains connections with Jacques Doriot.§!"

  FRA_andre_boris:0 "André Boris"
  FRA_andre_boris_character_desc:0 "§YAffiliation:§! $party_PCOP$ ($PCOP_faction_2$)\n§YBorn:§! §L23 August 1878; Toul, Meurthe-et-Moselle, French Republic§!\n§YBackground:§! §LAndré Pierre Louis Boris was born into a Jewish family. His father was a magistrate and veteran of the Franco-Prussian War who was later committed to a psychiatric hospital, while his mother, Gabrielle Alexandre, came from a distinguished family. He was the brother of Georges Boris, who served on Léon Blum's staff. Boris excelled at the Lycée de Toul, where his teachers described him as “intelligent and eager to learn, exceptionally diligent and hardworking, making remarkable progress, and methodical in all that he does.” In 1895, he entered the École polytechnique in Paris to study artillery. During the Dreyfus Affair, although he personally believed Dreyfus innocent, he continued to place his trust in the judgment of the courts. He was promoted to lieutenant in 1906, then entered the École supérieure de guerre and was promoted to captain in 1910.\n\nAt the outbreak of the Weltkrieg, Boris served on the staff of the 70th Infantry Division. In 1914, he fought at Morhange, the Grand Couronné, and the First Battle of Artois. The following year, he participated in the Second and Third Battles of Artois. Praised for his “extensive knowledge and considered judgment” and for “frequently reconnoitring the most dangerous sectors of the front, thereby rendering invaluable assistance to the command,” he was made a Chevalier de la Légion d’honneur and mentioned in army dispatches on 4 August. In 1916, he joined the staff of the Third Army and took part in the fighting on the Chemin des Dames in 1917. He transferred to the Fourth Army staff in 1918, was promoted to major, and participated in the Second Battle of the Marne, the Battle of Soissons, and the Third Battle of Picardy. In 1919, he became deputy commander of the 20th Infantry Regiment and fought at Compiègne and on the Oise. Confronted with the Grande Répression, Boris sympathized with the grievances of the officers and men and sought a moderate resolution. During the Weltkrieg, he received the Croix de guerre with palm and was made a Chevalier de la Légion d’honneur.\n\nBoris opposed the coup. When civil war erupted, he led an uprising in Lyon at the unanimous request of his regiment. He participated in the Rhône Valley and Troyes campaigns and was promoted to lieutenant-colonel. In 1921, he assumed command of the 306th Artillery Regiment and was promoted to colonel. He became artillery commander of the 1st Military Region and a brigadier-general in 1923, commander of the 1st Military Region and a major-general in 1926, Inspector of Artillery on the General Staff and a lieutenant-general in 1928, and Inspector-General of the Army and a full general in 1930.\n\nAn artillery officer shaped by the lessons of the Weltkrieg, Boris regards firepower as paramount. He has exerted considerable influence over the development of the Commune's artillery arm.\n\nThe Boris family has been described as “patriotic, republican, and steadfastly secular,” and André has upheld its traditions. It was his devotion to republicanism that led him to reject Pétain. He supports the Parti communiste ouvrier et paysan but has little tolerance for centralism.§!"

  FRA_henri_adeline:0 "Henri Adeline"
  FRA_henri_adeline_character_desc:0 "§YBorn:§! §L8 May 1898; Verdun, Meuse, French Republic§!\n§YBackground:§! §LHenri Marie Charles Adeline was the son of an engineer who belonged to the Corps des ponts et chaussées. He attended the Lycée Chrétien-de-Troyes before entering the École spéciale militaire de Saint-Cyr in 1916 as a member of the Flag Class. Graduating in August 1917, he was commissioned as an officer cadet and assigned to the 278th Infantry Regiment, then stationed at Gournancourt and Flavillers-le-Meldeux in the Oise. In January 1918, he transferred to the 2nd Moroccan Rifles and fought in the Third Battle of Picardy and the Second Battle of the Somme. He was wounded, promoted to second lieutenant, and twice mentioned in divisional dispatches. He participated in the fighting on the Oise in 1919 and was promoted to lieutenant. During the Weltkrieg, he received the Croix de guerre with two silver stars and the Médaille des blessés de guerre.\n\nAfter the armistice, Adeline transferred to the signals service. When the service collapsed in the aftermath of Pétain's coup, he chose to return home. Following the liberation of Verdun, the insurgents forcibly conscripted him and placed him in charge of organizing their new army. He took part in the battles of Troyes and Paris and the subsequent Great Pursuit in the West. In 1921, he enrolled at an engineering school in Paris. He entered the École supérieure d’électricité in 1923 to study radio technology, graduating in 1924 before joining the 18th Engineer Regiment and being promoted to captain. He entered the École supérieure de guerre in 1927 and, upon graduating in 1929, joined the staff of the 20th Military Region with the rank of major. He was posted to the 6th Engineer Regiment in 1932 and promoted to lieutenant-colonel in 1934.\n\nAn engineer officer with a particular interest in radio, Adeline possesses formidable technical expertise and excels at organizing militia forces.\n\nAdeline is a patriot in the purest sense. He detests political infighting, maintains strict political neutrality, and insists upon the humane conduct of warfare.§!"

  FRA_raoul_magrin_vernerey:0 "Raoul Magrin-Vernerey"
  FRA_raoul_magrin_vernerey_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L7 February 1892; Budapest, Pest-Pilis-Solt-Kiskun County, Kingdom of Hungary, Austria-Hungary§!\n§YBackground:§! §LRaoul Charles Magrin-Vernerey was the illegitimate son of a Hungarian nobleman and a French teacher living in Vienna, and received his name from his maternal grandparents. Raised initially by a Hungarian aristocrat, he later returned to France and settled in Laviron in the Doubs. He attended the Lycée Victor-Hugo in Besançon and the Petit Séminaire catholique in Ornans. Determined from childhood to become a soldier, he even ran away from home to pursue his ambition. In 1913, he entered the École spéciale militaire de Saint-Cyr as a member of the Montmirail Class. He graduated as a second lieutenant in 1914 and joined the 60th Infantry Regiment. During the Battle of Mulhouse in early August, he was struck by two bullets and spent two weeks recovering. Returning to his regiment late that month, he was gravely wounded by shrapnel in three places during the First Battle of the Marne and evacuated to the rear. His conduct earned him a commendation in the order of the Légion d’honneur.\n\nMagrin-Vernerey returned to duty in July 1915, only to suffer another serious head wound in August. While recovering, he was promoted to lieutenant and attended an accelerated staff course at Belfort. He returned to the front in March 1916 and fought at Verdun. During the Battle of the Somme that July, he was promoted to captain, then wounded once again in August. He returned to his regiment in November. In 1917, he took part in the fighting on the Chemin des Dames and in the Second Battle of Verdun. In 1918, he fought in the First Battle of the Lys and the Second Battle of the Marne, where a gas attack injured his eyes. He went on to fight at Compiègne and in the Third Battle of the Lys in 1919, earning another commendation in the order of the Légion d’honneur. During the Weltkrieg, he received both the Chevalier and Officier grades of the Légion d’honneur, the Croix de guerre with seven bronze palms, one gold star, two silver stars, and one bronze star, as well as the Médaille des blessés de guerre with seven stars.\n\nAfter the armistice, he joined the General Staff of the Armée d’Orient as chief of its First Bureau and received training in aerial reconnaissance. Returning to France in April 1920, he participated in the battles of Nantes and Brest but was captured during the sailors' revolt. Released in 1921, he was assigned to the 16th Chasseur Battalion. He joined the volunteers sent to aid Britain in 1924. In 1926, he volunteered for the military section of the Third International and served in Patagonia, where he was promoted to major. He became a lieutenant-colonel in 1932 and returned to France in 1934 to join the 5th Demi-Brigade of Chasseurs Alpins.\n\nHis extensive overseas service has made him remarkably adaptable. He advocates tactical variety and highly flexible, mobile formations.\n\nMagrin-Vernerey is the very model of a soldier. He prefers to lead from the front, shares every hardship with his men, and takes a genuine interest in their welfare. Tough and tenacious, he is disinclined to compromise and frequently challenges his superiors. Nevertheless, he can always be entrusted with the most demanding assignments and will carry them through to completion. Politically, he supports the Union républicaine, socialiste et radicale-socialiste and abhors authoritarianism.§!"

  FRA_georges_blanchard:0 "Georges Blanchard"
  FRA_georges_blanchard_character_desc:0 "§YBorn:§! §L9 December 1877; Orléans, Loiret, French Republic§!\n§YBackground:§! §LGeorges Maurice Jean Blanchard was the son of an army captain, although his wider family was chiefly distinguished in the arts and included a recipient of the Prix de Rome. He entered the École polytechnique in August 1897 and proceeded to the École d’application de l’artillerie et du génie at Fontainebleau as an officer cadet in 1899. After graduating, he served successively with the 30th, 22nd, 5th, 29th, 10th, and 18th Artillery Regiments. He was promoted to captain in 1910 and entered the École supérieure de guerre in 1913.\n\nWhen war began in 1914, Blanchard was a captain in the 56th Artillery Regiment. He fought at Morhange, the Col de la Chipotte, Gerbéviller, Wavre, and in Flanders. In March 1915, he joined the staff of XVI Corps and participated in the First Battle of Champagne. That July, he transferred to the Fourth Army staff and helped coordinate its heavy artillery during the Second Battle of Champagne, earning a mention in army dispatches. He remained engaged against the Germans in Champagne throughout 1916 and was made a Chevalier de la Légion d’honneur. He participated in the Third Battle of Champagne, also known as the Battle of the Hills, in 1917. During the Second Battle of Picardy in March 1918, he was injured in a gas attack and hospitalized. Discharged in May, he joined Joffre's office and helped coordinate the forces of the Entente. Joffre observed that “the better one knows him, the more one admires the intellect and character of this outstanding officer.” Blanchard was promoted to major in March 1919. During the Weltkrieg, he received the Croix de guerre with palm and was made a Chevalier de la Légion d’honneur.\n\nAlthough Blanchard claimed to oppose the coup, he continued to perform certain technical duties as Joffre's aide. After Pétain seized power, Joffre appointed him deputy chief of the Third Bureau at Grand Quartier Général and secured his promotion to lieutenant-colonel. During the civil war, Blanchard worked successively at the Ministry of War and the Château de Versailles. When the White forces evacuated after the Battle of Paris, he chose to remain in France despite Joffre's attempts to persuade him otherwise. He underwent investigation from mid-1920 until early 1921. With the assistance of Gamelin and others, a special military tribunal acquitted him and allowed him to retain his rank. That same year, he became an instructor at the Centre des hautes études militaires. He was appointed deputy commander of the 181st Artillery Regiment in 1924 and became its commander with the rank of colonel in 1926. He became deputy chief of staff of the 2nd Military Region in 1927, its artillery commander in 1930, and was promoted to brigadier-general in 1931. In 1933, he assumed command of the 7th Military Region. He has also served as director of the Centre des hautes études militaires since 1927.\n\nAn artilleryman profoundly influenced by the Weltkrieg, Blanchard emphasizes firepower and defence. He believes victory depends upon crushing the enemy beneath overwhelming fire. His lengthy staff career has also made him an expert in logistics and the allocation of matériel.\n\nBlanchard is cultured and highly professional, though pessimistic by nature. He carries out the orders of his superiors with great competence but has little enthusiasm for the politics of the Commune.§!"

  FRA_clement_blanc:0 "Clément Blanc"
  FRA_clement_blanc_character_desc:0 "§YBorn:§! §L1 October 1897; Perpignan, Pyrénées-Orientales, French Republic§!!\n§YBackground:§! §LJean-Clément Blanc's family originated in the Tarn. His father was a warrant officer in the Gendarmerie who later found employment at a winery. Blanc attended the Lycée de Perpignan and was both a compatriot and fellow alumnus of Joffre. He volunteered for the 56th Artillery Regiment in 1915 before studying at the École d’application de l’artillerie et du génie in Fontainebleau. Graduating as an officer cadet in 1916, he was assigned to the 15th Artillery Regiment and fought at Verdun and on the Somme. He was mentioned in both regimental and brigade dispatches and promoted to second lieutenant. In 1917, he fought at Craonne during the Battle of the Chemin des Dames. The following year, he participated in the Battle of Dormans during the Second Battle of the Marne and in the Third Battle of Picardy, earning a mention in army dispatches. He subsequently fought at Compiègne and on the Oise in 1919. During the Weltkrieg, he received the Croix de guerre with two bronze stars and a palm. He was one of only two members of his class who went to war and survived.\n\nAfter the armistice, Blanc entered a special class at the École polytechnique, but Joffre's mobilization order soon recalled him to his former unit. When most of the 15th Regiment joined the uprising in Lille, Blanc withdrew with the Whites to Amiens. Unable to retreat in time during the Second Battle of Amiens, he was captured and, after weighing his options, joined the revolutionary army. He subsequently participated in the Battle of Troyes. After the war, he returned to the École polytechnique, graduating and joining its faculty in 1922 while being promoted to lieutenant. In 1925, he simultaneously assumed command of an artillery battery in the 1st Cavalry Division and was promoted to captain. He entered the École supérieure de guerre in 1928, graduating at the head of his class in 1930. Promoted to major, he was assigned to the Fourth Bureau of the Army Staff. He became a lieutenant-colonel in 1934 and chief of the bureau in 1935.\n\nAn artillery officer by training, Blanc stresses the importance of artillery. His long staff service has also made him an accomplished organizer of logistics. He supports the military unification of the Third International and places great importance upon military research, including the potential weaponization of atomic energy.\n\nBlanc is the archetypal technical officer: bold, humorous, industrious, and meticulous, with no fear of criticizing his superiors. He insists upon political neutrality and may best be described as a pragmatic nationalist.§!"

  FRA_paul_legentilhomme:0 "Paul Legentilhomme"
  FRA_paul_legentilhomme_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L26 March 1884; Valognes, Manche, French Republic§!\n§YBackground:§! §LPaul Louis Victor Marie Legentilhomme was the son of a tax official. He attended the public boys' lycée in Le Havre before entering the École spéciale militaire de Saint-Cyr in 1905. Graduating in 1907, he was commissioned as a second lieutenant in the colonial troops and assigned to the 3rd Tonkinese Rifles in Vietnam. He was promoted to lieutenant in 1909 and subsequently served with the 10th and 2nd Colonial Infantry Regiments. Returning to France in 1912, he transferred to the 23rd Colonial Infantry Regiment. During the Battle of Neufchâteau in 1914, his position was surrounded and he was taken prisoner, though his conduct earned him a mention in regimental dispatches. As Germany continued to detain its prisoners of war while France descended into civil war, Legentilhomme did not return home until May 1920, when he was promoted to captain. During the Weltkrieg, he received the Croix de guerre with a bronze star.\n\nLegentilhomme entered the École supérieure de guerre in 1921. Upon graduating in 1923, he was assigned to the military section of the Third International and helped direct revolutionary activities in Indochina. He was promoted to major in 1924 and lieutenant-colonel in 1928. He became chief of staff of the 40th Infantry Division in 1930, then assumed command of the 4th Infantry Regiment and was promoted to colonel in 1933. In 1935, he became deputy commandant of the École spéciale militaire de Saint-Cyr and enrolled at the Centre des hautes études militaires.\n\nHis long association with the colonies has given Legentilhomme considerable experience in irregular warfare. He emphasizes mobility, combined-arms cooperation, and the unity of military and political action. He also prefers to lead from the front.\n\nLegentilhomme is brave, energetic, and good-humoured, though capable of imposing strict discipline when circumstances require it. He possesses a strong humanitarian streak and leans toward the Union républicaine, socialiste et radicale-socialiste.§!"

  FRA_louis_buisson:0 "Louis Buisson"
  FRA_louis_buisson_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_2$)\n§YBorn:§! §L14 December 1889; Le Bourget-du-Lac, Savoie, French Republic§!\n§YBackground:§! §LLouis Léon Marie André Buisson was the son of a shoemaker who also served as a municipal councillor. An enthusiastic sportsman from childhood, he twice rescued people from drowning and received a medal for courage and devotion. He entered the École normale d’Albertville in 1906. After graduating in 1909, he volunteered for service with the 22nd Chasseur Battalion. He was promoted first to corporal and then to sergeant in 1910. In 1911, he attended a reserve-officer training course and was commissioned as a reserve second lieutenant. He transferred to the 13th Chasseur Battalion before leaving the army to become an assistant teacher at the primary school in Saint-Jean-d’Arves. The following year, he began teaching at the École primaire supérieure de Montmélian.\n\nWhen the Weltkrieg began, Buisson joined the 6th Cyclist Chasseur Group and fought at Morhange and in the First Battle of the Aisne. He was gravely wounded that September, hospitalized, and mentioned in divisional dispatches. While recuperating from 1915 to 1916, he trained new recruits and was promoted to lieutenant. He returned to his unit in 1917 and fought on the Chemin des Dames, receiving a temporary promotion to captain. In 1918, he participated in the Second Battle of Picardy and the First Battle of the Lys. He was wounded in a mustard-gas attack, returned swiftly to duty, and suffered another mustard-gas injury at Soissons, once again returning to his unit after only a brief absence. His rank of captain was made permanent. In 1919, he fought at Compiègne and on the Oise. After the armistice, he received a commendation in the order of the Légion d’honneur. During the Weltkrieg, he was awarded the Croix de guerre with a silver star and made a Chevalier de la Légion d’honneur.\n\nBuisson rejected Pétain's coup. During the civil war, he fought with government forces in the Battle of Paris and participated in a soldiers' council. In early April, he joined the uprising at Versailles and later took part in the Great Pursuit in the West. After the revolution, he retained command of the 6th Cyclist Chasseur Battalion. He entered the École supérieure de guerre in Paris in 1923 and, upon graduating in 1925, joined the staff of XIV Corps with the rank of major. He went to Denmark as an exchange officer in 1927 and assumed command of a battalion in the 99th Alpine Infantry Regiment in 1928. In 1931, he became chief of the Third Bureau of the Army Staff, where he supported Delestraint's proposal for armoured divisions, and was promoted to lieutenant-colonel. He became commander of the 503rd Armoured Regiment and was promoted to colonel in 1935.\n\nBuisson advocates concentrating armoured formations for aggressive operations intended to destroy the enemy outright.\n\nBuisson emerged from the ranks of the “Black Hussars of the Republic”—France's schoolteachers—and remains a committed republican. He supports the extreme left wing of the Union républicaine, socialiste et radicale-socialiste.§!"

  FRA_aubert_frere:0 "Aubert Frère"
  FRA_aubert_frere_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L21 August 1881; Grévillers, Pas-de-Calais, French Republic§!\n§YBackground:§! §LAubert Achille Jules Frère was the devoutly religious son of a farmer. He attended the Collège Saint-Bertin before entering the École spéciale militaire de Saint-Cyr in 1900 as a member of the Tchad Class. Graduating in 1902, he joined the Armée d’Afrique as a second lieutenant in the 2nd Algerian Rifles. There, he met Lyautey and became one of the officers in the latter's circle. He received the Médaille coloniale with the Sahara clasp in 1904. Frère participated in the Moroccan campaign in 1908 and was promoted to lieutenant. In 1910, the Ministry of Foreign Affairs assigned him to frontier-policing duties, for which he was made a Chevalier de la Légion d’honneur. Returning to France in 1912, he joined the 8th Chasseur Battalion and soon became an instructor for reservists. He transferred to the 1st Infantry Regiment and was promoted to captain in 1913.\n\nIn 1914, Frère was wounded at Charleroi and subsequently fought in the First Battle of Guise, the First Battle of the Marne, and the Race to the Sea, earning a mention in regimental dispatches. During the Second Battle of Champagne in 1915, he participated in the capture of the Fortin de Beauséjour and was mentioned in both corps and army dispatches. In 1916, he fought at Verdun in the engagements at Louvemont–Côte-du-Poivre, Fort Douaumont, and Fort Vaux. He later participated in the Battle of the Somme, including the fighting at Maurepas and Combles. His conduct earned him three further mentions in army dispatches and a commendation in the order of the Légion d’honneur. Frère fought on the Chemin des Dames in 1917 before transferring to the 6th Chasseurs Alpins. He was wounded at Malmaison, promoted to major, and mentioned in both corps and army dispatches. During the Second Battle of Picardy in 1918, he suffered a grave head wound and was evacuated to the rear. In November, he joined the staff of the Fourth Army and earned another mention in army dispatches and commendation in the order of the Légion d’honneur. In 1919, he assumed command of the 1st Infantry Regiment and fought at Compiègne, Clermont, and on the Oise. He was twice mentioned in divisional dispatches and promoted to lieutenant-colonel. During the Weltkrieg, he received the Commandeur grade of the Légion d’honneur, the Croix de guerre with one bronze star, two silver stars, two gold stars, and five palms, and the Médaille des blessés de guerre.\n\nFrère did not oppose the Christmas Eve Coup. During the civil war, he fought in the Third Battle of Amiens, the battles of Troyes and Paris, and the Great Pursuit on the Western Front. Captured at Brest in May 1920, he was eventually persuaded to remain in the revolutionary army and became an instructor at the École spéciale militaire de Saint-Cyr. He entered the École supérieure de guerre in 1921 and graduated in 1923, after which he became an instructor at the tank-training school in Versailles and formed an association with Delestraint. He became director of studies at the École de cavalerie et des chars de Saumur and was promoted to colonel in 1926. He became commandant of the school in 1930 and commandant of Saint-Cyr with the rank of brigadier-general in 1934.\n\nFrère supports mechanization and armoured warfare and was among the first officers to advocate an independent armoured arm. He also favours a professional standing army.\n\nBrave, enthusiastic, composed, devout, and patriotic, Frère once supported Pétain and consequently remains the subject of political suspicion. He no longer opposes the Commune, however.§!"

  FRA_victor_bourret:0 "Victor Bourret"
  FRA_victor_bourret_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L14 December 1889; Le Bourget-du-Lac, Savoie, French Republic§!\n§YBackground:§! §LLouis Victor Bourret's family originated in the Ardèche. His father was a former non-commissioned officer in the Gendarmerie who later became an employee of the state tobacco monopoly. Bourret attended the Prytanée national militaire at Les Andelys. He volunteered for service in the 115th Infantry Regiment in 1895 and was subsequently selected for its NCO training platoon, where he achieved excellent results. In 1896, he was promoted successively to corporal and sergeant. He became a quartermaster in March 1897, taking responsibility for company logistics, and was promoted to senior sergeant in August with responsibility for company administration. He spent more than six months serving in Tunisia.\n\nIn April 1900, Bourret sat the entrance examination for the École militaire d’infanterie de Saint-Maixent. Graduating fifty-ninth in his class in 1901, he was commissioned as a second lieutenant and assigned to the 12th Chasseurs Alpins. He was promoted to lieutenant in 1903 and transferred to the 32nd Infantry Regiment in 1904. In 1907, he attended the École normale de gymnastique et d’escrime de Joinville. His excellent performance earned him a ministerial commendation and an appointment as an instructor at the school. He transferred to the 43rd Infantry Regiment in December 1909 and entered the École supérieure de guerre in 1913.\n\nPromoted to captain in March 1914, Bourret returned to the 115th Infantry Regiment. In August, he joined the staff of the 139th Infantry Brigade, part of the 70th Infantry Division. He fought at Morhange and was seriously wounded at Dontailles, necessitating evacuation to the rear. In 1915, he distinguished himself in the Second Battle of Artois and received a commendation in the order of the Légion d’honneur. During the Third Battle of Artois, he was mentioned in regimental dispatches and later in army dispatches for rescuing a comrade. Bourret fought at Verdun in 1916 and transferred to the staff of the 19th Infantry Division during the battle. In April 1917, he took part in the Battle of the Hills in Champagne, followed by the Second Battle of Verdun that September. In 1918, he fought in the Third Battle of the Aisne, the Second Battle of the Marne, and the First Battle of the Oise, earning two mentions in divisional dispatches. He was promoted to major at the end of the year. Bourret participated in the Battle of Compiègne and the Second Battle of the Oise in 1919 and received another commendation in the order of the Légion d’honneur. He supported the armistice. During the Weltkrieg, he received the Chevalier and Officier grades of the Légion d’honneur and the Croix de guerre with one palm, two silver stars, and one bronze star.\n\nBourret opposed the coup. During the civil war, he was captured while participating in the Rennes uprising. Following the city's liberation, he was assigned to the 89th Infantry Regiment. He was promoted to lieutenant-colonel in 1924 and posted to the Directorate of Physical and Military Training under the Délégué à la Sûreté. Promoted to colonel in 1928, he assumed command of the 28th Infantry Regiment. He joined the secretariat of the National Defence Council in 1930. In 1932, he was promoted to brigadier-general, appointed commander of the 5th Infantry Division, and enrolled at the Centre des hautes études militaires. He became a major-general and chief of staff to the Délégué à la Sûreté in 1934, then was promoted to lieutenant-general in early 1936.\n\nBourret advocates defensive warfare and mass mobilization and holds comparatively conservative views on armoured forces.\n\nCheerful, enterprising, helpful, and thoroughly hands-on, Bourret is said to display “unmatched enthusiasm and courage at all times.” He supports the Union républicaine, socialiste et radicale-socialiste and remains a committed republican.§!"

  FRA_jules_dumont:0 "Jules Dumont"
  FRA_jules_dumont_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L1 January 1888; Roubaix, Nord, French Republic§!\n§YBackground:§! §LJules Joseph Dumont was the son of a textile worker. He received only a primary education and worked as a shoemaker before entering the army. Conscripted in 1909, he joined the 1st Zouave Regiment and served in Morocco and Algeria. He was promoted to corporal in 1910 and to sergeant in 1911, before leaving the service. Mobilized once more in 1914, Dumont joined the 84th Infantry Regiment and was commissioned as a reserve second lieutenant. He fought at Charleroi, in the First Battle of Guise, the First Battle of the Marne, and the First Battle of the Aisne. In 1915, he participated in the First Battle of Champagne, earning a mention in regimental dispatches, and in the First Battle of the Vardar. His unit subsequently joined the Armée d’Orient.\n\nFrom late 1915 until late 1916, Dumont fought successively at Gorno Chichevo, Petrovo, Polykastro, Lioumnitsa, and Fanos. He was also aboard the Rouen when the ship came under attack from a German submarine and survived its loss. In 1917, he received a temporary promotion to lieutenant and transferred to the Zouave element of the 1st African Marching Regiment, with which he fought for Hill 1248. Temporarily promoted to captain in 1918, he distinguished himself at Dobro Pole and was mentioned in army dispatches and commended in the order of the Légion d’honneur. In 1919, he became a regular lieutenant, organized soldiers' councils within the army, and participated in the great retreat from Salonika. During the Weltkrieg, he was made a Chevalier de la Légion d’honneur and received the Croix de guerre with one palm and one bronze star, as well as the Médaille commémorative du Maroc.\n\nDumont's propagation of anti-colonial ideas led to his conviction and imprisonment by a court-martial. He was transported back to France and incarcerated near Toulon. Escaping during the Toulon uprising of 1920, he joined the revolutionary army and participated in the Marseille uprising and the campaigns in the Rhône Valley and around Bordeaux, receiving promotion to major. In 1921, he returned to the 84th Infantry Regiment as a battalion commander. He entered the École supérieure de guerre in 1922 and, after graduating in 1924, joined the military section of the Third International. Operating in North Africa, he helped organize the anti-colonial movement. He supported the Tunisian general strike in 1925 and was promoted to lieutenant-colonel. Returning to France in 1928, he joined the staff of the 1st Military Region and was promoted to colonel. He became its chief of staff with the rank of brigadier-general in 1932, then commander of the region and a major-general in 1935.\n\nDumont remains committed to the lessons of the Weltkrieg and emphasizes firepower. Although he supports the regularization of the armed forces, he also recognizes the importance of militias in irregular warfare.\n\nUpright and tenacious, Dumont is a steadfast member of the Parti ouvrier unifié whose beliefs combine patriotism with communism. He values the lives of his soldiers and possesses a strong humanitarian conscience.§!"

  FRA_jacques_massu:0 "Jacques Massu"
  FRA_jules_dumont_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L1 January 1888; Roubaix, Nord, French Republic§!\n§YBackground:§! §LJacques Émile Massu was the son of an artillery lieutenant-colonel who was killed in action in 1917. His mother came from a prominent legal family, and his maternal grandfather had served as a judge of the Cour de cassation. Massu was also a great-grandnephew of Marshal Michel Ney. He attended the Lycée Saint-Louis-de-Gonzague, the Institution libre Saint-François-de-Sales, and the Prytanée national militaire de La Flèche. In 1928, he entered the École spéciale militaire de Saint-Cyr as a member of the Maréchal-Lefebvre Class. Graduating in 1930, he was commissioned as a second lieutenant in the 16th Infantry Regiment. He transferred to the 41st Infantry Regiment and was promoted to lieutenant in 1932. In 1935, he volunteered for the Centre d’expériences aériennes and began training in the newly emerging airborne arm. He was promoted to captain in early 1936.\n\nMassu has a particular interest in airborne warfare.\n\nForthright, resolute, and loyal, Massu loves the army. He is a pragmatist prepared to resort to any measure demanded by the national interest. Politically, he supports the Confédération nationale-syndicaliste.§!"

  FRA_pierre_billotte:0 "Pierre Billotte" 
  FRA_pierre_billotte_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_1$)\n§YBorn:§! §L8 March 1906; Paris, Seine, French Republic§!\n§YBackground:§! §LPierre Armand Gaston Billotte was the son of Lieutenant-General Gaston Billotte. His mother came from a family of rural notables and devoted herself to the household. Pierre attended the Collège Stanislas before entering the École spéciale militaire de Saint-Cyr in 1926 as a member of the Sous-Lieutenant-Pol-Lapeyre Class. Graduating in 1928, he was commissioned as a second lieutenant in the 46th Infantry Regiment. He was promoted to lieutenant in 1930 and entered the École supérieure de guerre in 1931. Upon graduating in 1933, he joined the First Bureau of the Army Staff. In 1935, he volunteered for service with the 41st Armoured Battalion and was promoted to captain.\n\nBillotte favours armoured warfare.\n\nAdventurous and loyal, Billotte is an independent thinker who places great value upon practical action. Politically, he supports Neosocialism and maintains contacts with Louis Vallon and others of similar views.§!"

  FRA_gabriel_fort:0 "Gabriel Fort"
  FRA_gabriel_fort_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L30 December 1898; Lyon, Rhône, French Republic§!"

  FRA_vital_gayman:0 "Vital Gayman"
  FRA_vital_gayman_character_desc:0 "§YAffiliation:§! $party_PCOP$ ($PCOP_faction_1$)\n§YBorn:§! §L4 February 1897; Conches-en-Ouche, Eure, French Republic§!"

  FRA_rene_cazala:0 "René Cazala"
  FRA_rene_cazala_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L8 March 1902; Algiers, Département d’Alger, French Republic§!"

  FRA_louis_leon_landsoght:0 "Louis Léon Landsoght"
  FRA_louis_leon_landsoght_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L18 November 1900; Saint-Ouen, Seine, French Republic§!"

  # Navy
  FRA_edouard_peisson:0 "Édouard Peisson"
  FRA_edouard_peisson_character_desc:0 "§YAffiliation:§! $party_PCOP$ ($PCOP_faction_1$)\n§YBorn:§! §L22 November 1877; Bastia, Corsica, French Republic§!\n§YBackground:§! §LÉdouard Peisson's father, Marius Peisson, was a journalist who wrote for Le Petit Marseillais under the pen name Audes Richemont and was also a member of the Félibrige. His mother was a peasant. Peisson attended the École Saint-Joseph and developed a passion for maritime novels. After completing his lower-secondary education, he became a sailor with the assistance of a family friend. He worked successively for the Compagnie Paquet and the Compagnie Générale Transatlantique.\n\nIn March 1914, Peisson became a sailor aboard the steamship Notre-Dame while preparing to enter the École d’hydrographie de Marseille. The outbreak of the Weltkrieg put an end to those plans, forcing him to remain aboard Notre-Dame on its Mediterranean route. He qualified as a wireless operator in April 1916 and transferred to the liner Sidi-Brahim. That July, he joined the cargo ship Argent on the White Sea route. In August 1917, he transferred to the cargo ship Rigel and worked the transatlantic route. He joined the Mediterranean liner Lamoricière in August 1918. Throughout the war, Peisson continued to educate himself independently. In September 1919, he obtained his ocean-going master's certificate and became captain of the sailing freighter Lunéville, operating in the Mediterranean.\n\nSympathetic to the Left, Peisson departed Algiers after the civil war began. Evading both the White Navy's blockade and a violent storm, he successfully reached Marseille and joined the revolution. Commissioned as a naval lieutenant, he became navigating officer aboard the destroyer Poignard. He was promoted to captain and appointed executive officer of the destroyer Bouclier in 1922. Peisson entered the École supérieure de guerre navale in 1923 and, after graduating in 1924, assumed command of the destroyer Bourrasque. He was promoted to lieutenant-commander in 1926 and became navigating officer of the cruiser Rennes. In 1928, he was appointed chief of staff of the Second Fleet's Training Detachment. He became a commander in 1930, captain of the cruiser Marseille in 1931, and captain of the battleship Commune de Paris with the rank of naval captain in 1934.\n\nHaving risen from the merchant marine, Peisson has no particularly pronounced views on naval doctrine.\n\nPeisson is unassuming, restrained, sensitive, and loyal, and takes a keen interest in the conditions endured by ordinary sailors. He is also a passionate writer and one of the foremost representatives of France's new generation of maritime authors. His works include Le Courrier de la mer Blanche, Hans le marin, and Parti de Liverpool. A committed realist, he has frequently clashed with the Surrealists. Politically, he supports the Parti communiste ouvrier et paysan.§!"

  FRA_francois_darlan:0 "François Darlan"
  FRA_francois_darlan_character_desc:0 "§YBorn:§! §L7 August 1881; Nérac, Lot-et-Garonne, French Republic§!\n§YBackground:§! §LJean Louis Xavier François Darlan came from a family of sailors whose ancestors had fought at Trafalgar. His father, Jean-Baptiste Darlan, took a different path, becoming a lawyer, a member of the Union progressiste, and Minister of Justice in the Méline government. François attended the Lycée Saint-Louis in Paris before entering the École navale at Brest in 1899. Graduating in 1901, he became an officer cadet aboard the training ship Duguay-Trouin. The following year, he joined the Far Eastern Squadron and served successively aboard the cruisers Bugeaud and Montcalm. He was promoted to ensign in 1904.\n\nDarlan entered the École de canonnage at Toulon in 1905 and achieved excellent results. After graduating in 1906, he returned to the Far Eastern Squadron aboard the cruiser D’Entrecasteaux. He travelled extensively along the Yangtze by sailboat and was promoted to lieutenant. Returning to France in 1908, he became an instructor aboard the training ship Antilope. He was appointed gunnery officer of the armoured cruiser Waldeck-Rousseau in 1911. Promoted in 1912, he transferred to the armoured cruiser Jeanne d’Arc as an instructor.\n\nIn 1914, Darlan joined the 1st Naval Artillery Regiment and fought in the Battle of the Frontiers and the Battle of Nancy. He was briefly attached to the Armée d’Orient in 1916 before returning to France to participate in the First Battle of Verdun and the First Battle of the Somme. In 1917, he took command of the First Army's naval artillery and fought on the Chemin des Dames and at Malmaison. He participated in the Second Battle of Picardy and the First Battle of the Oise in 1918, followed by the battles of Compiègne and the Second Oise in 1919. He was promoted to lieutenant-commander. During the Weltkrieg, Darlan was made a Chevalier de la Légion d’honneur and received the Croix de guerre with palm.\n\nAfter the war, Darlan assumed command of the Marne Flotilla. He joined the uprising in February 1920, fought at Troyes and Paris, and was promoted to commander. In 1921, he became chief of staff of the First Fleet's Third Division and was promoted to naval captain the following year. He entered the École supérieure de guerre navale in 1924. Upon graduating in 1925, he became director of the secretariat of the National Defence Council and was promoted to rear admiral. He assumed command of the First Division of the First Fleet in 1927. Promoted to vice admiral in 1930, Darlan became commander of the Second Fleet and was appointed Chief of the Naval Staff in 1933.\n\nFrance's shortage of resources and limited industrial capacity have led Darlan toward a guerre de course doctrine centred upon destroyers and submarines. At heart, however, he is a pragmatist: given sufficient resources, he would still seek a balanced fleet whose principal striking force consisted of battleships.\n\nDarlan possesses a powerful sense of honour, keen political instincts, and an abiding love of the navy. Suspicious of Britain, he seeks to preserve France's strategic independence at sea. Politically, he sympathizes with republicanism and secularism and has long inclined toward the Ligue républicaine radicale, though he maintains connections across party lines. Ultimately, his political allegiance depends heavily upon which party appears most capable of realizing his naval ambitions.§!"

  FRA_gabriel_auphan:0 "Gabriel Auphan"
  FRA_gabriel_auphan_admiral_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L4 November 1894; Alès, Gard, French Republic§!\n§YBackground:§! §LGabriel Adrien Joseph Paul Auphan was the son of the secretary-general of the Compagnie des houillères de Rochebelle, who also served as a municipal registrar. His mother's family possessed a strong military and political tradition, and Auphan was a great-grandson of Major-General Joachim de Roquebrune. His family also bore the title of “Lords of Salses and La Nouvelle.” He attended the Lycée Saint-Louis in Paris before entering the École navale at Brest in 1911.\n\nPromoted to ensign in October 1914, Auphan was assigned to the armoured cruiser Jeanne d’Arc. He participated in the Dardanelles Campaign in April 1915. That September, he transferred to the naval intelligence station on the island of Rouad in the Levant, where he established a network of informants. In August 1916, he became executive officer aboard the aviso Laborieux, gathering intelligence along the Ottoman coast, and was promoted to lieutenant. In September 1917, he was appointed executive officer of the submarine Le Verrier and operated in the Adriatic. During the Weltkrieg, he was made a Chevalier de la Légion d’honneur and received the Croix de guerre with two bronze stars.\n\nAuphan opposed the armistice. In August 1919, he was seconded to naval intelligence for operations in Italy and promoted to captain. Returning to France in January 1920, he assumed command of Le Verrier. He supported the Whites during the Toulon uprising and withdrew to Brest, only to be captured during the Battle of Nantes. Auphan joined the revolution in early 1922 and transferred to the Naval General Staff that June, where he contributed to the Requin-class submarine programme. He entered the École supérieure de guerre navale in 1923 and, after graduating in 1924, took command of the submarine Fulton. Promoted to lieutenant-commander in 1925, he joined the naval section of the National Defence Council and helped formulate the Commune's ten-year naval plan. In 1927, he was promoted to commander and appointed captain of the destroyer Louise Michel. He became commander of the Second Fleet's Training Detachment in 1930 and director of studies at the École navale in Brest in 1931. Promoted to naval captain in 1933, he assumed command of the cruiser Rennes. In 1935, he became commander of the Second Fleet's Third Division.\n\nAuphan places great importance upon submarines and advocates the attaque en meute: the saturation of enemy sea lanes through coordinated attacks by multiple submarines.\n\nDevout, strict, practical, and frugal, Auphan cares deeply for his sailors and remains unshakably committed to his convictions. Politically, he supports the Confédération nationale-syndicaliste and is also one of Darlan's friends.§!"

  FRA_philippe_auboyneau:0 "Philippe Auboyneau"
  FRA_philippe_auboyneau_character_desc:0 "§YBorn:§! §L9 November 1899; Constantinople, Vilayet of Constantinople, Ottoman Empire§!\n§YBackground:§! §LPhilippe Marie Joseph Raymond Auboyneau came from a financial family originally established in Charente-Inférieure. His father, Gaston Auboyneau, was governor of the Imperial Ottoman Bank. His mother, Germaine de La Motte-Ango de Flers, belonged to the Norman nobility. Philippe spent his childhood in Constantinople before attending the Lycée Carnot in Paris. He entered the École navale at Brest in mid-1917.\n\nGraduating early in 1918, Auboyneau was commissioned as an ensign and assigned to the torpedo boat Typhon, which patrolled the English Channel. He joined the Le Havre uprising in early 1920 and subsequently participated in the Cotentin campaign and the Brest uprising, receiving promotion to lieutenant. In 1922, he transferred to the training cruiser Jeanne d’Arc to study long-distance navigation. After completing the course in 1923, he was promoted to captain and became torpedo officer aboard the cruiser Dunois, while also undertaking advanced training in torpedo warfare.\n\nAuboyneau entered the École supérieure de guerre navale in 1925. Upon graduating in 1926, he was promoted to lieutenant-commander and assigned to the regional section of the Third International, operating in Vietnam and China. He returned to France in 1931, became chief of staff of the Second Fleet's Torpedo Detachment, and was promoted to commander. In 1935, he was promoted to naval captain and appointed deputy chief of staff of the Second Fleet.\n\nAuboyneau supports a balanced fleet.\n\nCalm, self-disciplined, modest, and pragmatic, Auboyneau is a skilled communicator who cares deeply for his sailors. He maintains strict political neutrality.§!"

  FRA_raoul_castex:0 "Raoul Castex"
  FRA_raoul_castex_character_desc:0 "§YBorn:§! §L27 October 1878; Saint-Omer, Pas-de-Calais, French Republic§!\n§YBackground:§! §LRaoul Victor Patrice Castex's family originated in Comminges. His father, Charles Castex, was a major-general in the army, while his mother was Flemish. Castex attended the École préparatoire de la Marine at Rochefort, where he achieved excellent results, before entering the École navale at Brest in 1896. Graduating in 1898, he became an officer cadet aboard the battleship Brennus. In 1900, he transferred to the transport Caravane and served in China. Promoted to ensign, he received the Médaille commémorative de l’expédition de Chine and earned a ministerial commendation for his conduct during a dangerous incident.\n\nCastex transferred to the battleship Saint-Louis in 1901 and served aboard the Bengali in 1902. He joined the Ministry of the Navy in 1904, serving simultaneously as an aide to the minister and an instructor at the École de pilotage, and was promoted to lieutenant. He relinquished his position as aide in 1905 but returned to the ministry in 1907 and was promoted to captain. In 1910, he became director of the École des mécaniciens-chauffeurs at Brest while also commanding the torpedo boat Corsaire. He entered the École de canonnage at Toulon in 1912 and was made a Chevalier de la Légion d’honneur. After graduating in 1913, he enrolled at the École supérieure de guerre navale.\n\nCastex was seconded to the Ministry of War in early 1914. After completing his studies, he served first aboard the battleship Danton and then aboard Condorcet. In 1915, he became liaison officer to the Armée d’Orient. He assumed command of the patrol vessel Sirius in 1916. Castex returned to the Ministry of the Navy and was promoted to lieutenant-commander in 1917. In 1918, he joined the aviation service of the Fifth Maritime District and was promoted to commander. During the Weltkrieg, he received the Croix de guerre with palm.\n\nAfter the armistice, Castex established the Naval Historical Service and became an instructor at both the École supérieure de guerre navale and the École supérieure de guerre in Paris. He was also made an Officier de la Légion d’honneur. Castex opposed the coup and continued teaching at the École supérieure de guerre navale from January until April 1920. At the end of April, he assumed command of the battleship Jean Bart and was promoted to naval captain. He sided with the revolution following the sailors' uprising in Brest. In 1922, he became chief of the Third Bureau of the Naval General Staff and commandant of the École supérieure de guerre navale. He was promoted to rear admiral in 1923 and vice admiral in 1926, when he became maritime prefect of Brest. Castex was appointed Chief of the Naval Staff in 1929. In 1933, he became Inspector-General of the Navy and was promoted to admiral.\n\nCastex is widely recognized as a master of grand strategy. Unlike Mahan, he has little enthusiasm for decisive fleet engagements or the fleet-in-being. Instead, he advocates relative command of the sea, secured through control of maritime communications and the coordinated use of political and economic power. He views war as a total undertaking in which the navy must serve the nation's wider strategy. Although he recognizes the importance of submarines, he does not subscribe blindly to guerre de course. He has also made a major contribution to the creation of an effective naval staff system.\n\nCastex is upright, rigorous, self-disciplined, and outspoken: a scholar in uniform. Deeply affected by his mother's early death, he has never married. He subscribes to the notion of the “Yellow Peril” and regards the rise of East Asian powers such as China and Japan with suspicion. Castex insists upon political neutrality and opposes partisan conflict within the navy.§!"

  FRA_andre_georges_lemmonier:0 "André-Georges Lemonnier"
  FRA_andre_georges_lemmonier_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L24 February 1896; Guingamp, Côtes-du-Nord, French Republic§!\n§YBackground:§! §LAndré-Georges Lemonnier was the son of an infantry officer and a landowning mother. He attended the Lycée de Cherbourg and the École Saint-Charles, completing a preparatory course for the merchant marine. In 1913, he placed first in the entrance examination for the École navale at Brest. The war forced his early graduation in 1914, after which he became an officer cadet aboard the armoured cruiser Gloire of the Third Fleet.\n\nIn March 1915, Lemonnier transferred to the armoured cruiser Jeanne d’Arc of the First Fleet and participated in the Dardanelles Campaign. He joined the battleship Patrie and was promoted to ensign in February 1916. He subsequently became commander of the 3rd Naval Artillery Company of the Armée d’Orient. In May 1917, his excellent conduct at the front earned him a mention in divisional dispatches. He later rescued sailors from the wreck of the Shansi, receiving another divisional mention and a commendation in the order of the Légion d’honneur, as well as promotion to lieutenant. He served successively as executive officer of the avisos Andromède and Ys before assuming command of the submarine Archimède in 1918. During the Weltkrieg, he was made a Chevalier de la Légion d’honneur and received the Croix de guerre with two silver stars, the Médaille commémorative d’Orient, and the Médaille commémorative des Dardanelles.\n\nLemonnier assumed command of the gunboat Dubourdieu and was promoted to captain in 1920. During the civil war, he supported the Whites and participated in the suppression of the Toulon and Marseille uprisings. Toward the end of the conflict, however, he joined the revolution after the entire crew of his ship refused to leave France. In 1922, he assumed command of the submarine Frimaire. Lemonnier entered the École supérieure de guerre navale in 1924 and once again graduated at the head of his class in 1925. Promoted to lieutenant-commander, he became executive officer of the destroyer Bourrasque. He was appointed executive officer of the cruiser Lyon in 1927. Promoted to commander in 1929, he joined the staff of the Second Maritime District. In 1932, he became executive officer of the battleship Commune de Paris. He assumed command of the aircraft carrier Eugène Pottier and was promoted to naval captain in 1935.\n\nHaving served aboard a wide variety of warships, Lemonnier stresses the importance of air defence, antisubmarine warfare, and aircraft carriers.\n\nLemonnier is calm, restrained, and an accomplished communicator. He supports the Confédération nationale-syndicaliste.§!"

  FRA_paul_ortoli:0 "Paul Ortoli"
  FRA_paul_ortoli_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_1$)\n§YBorn:§! §L19 September 1900; Bastia, Corsica, French Republic§!\n§YBackground:§! §LPaul Ange Philippe Ortoli was the son of a civil servant who served successively as subprefect of Corte and director of finance at Riom. Ortoli attended the Lycée de Riom before entering the École navale at Brest in 1919. He participated in the Brest sailors' uprising in 1920. The following year, he began his practical training aboard the cruiser Jeanne d’Arc. He became an officer cadet in 1922 and was assigned to the aviso Béthina. Promoted to ensign in 1923, he entered the École de canonnage at Toulon in 1924. After graduating in 1925, he transferred to the destroyer Orage as gunnery officer and was promoted to lieutenant.\n\nOrtoli assumed command of the submarine Galatée in 1927. He was promoted to captain and assigned to the military section of the Third International in 1928, serving in Indochina and forming an association with Salan. Returning to France in 1932, he became gunnery officer aboard the cruiser Marseille and was promoted to lieutenant-commander. He entered the École supérieure de guerre navale in 1934. Upon graduating in 1935, he became chief of staff of the First Fleet's Training Detachment and was promoted to commander.\n\nOrtoli supports a light fleet.\n\nMild-mannered, rigorous, decisive, and remarkably personable, Ortoli politically supports the Parti socialiste français.§!"

  FRA_louis_de_villefosse:0 "Louis de Villefosse"
  FRA_louis_de_villefosse_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L14 April 1900; Paris, Seine, French Republic§!\n§YBackground:§! §LLaurent Antoine Marie Louis Héron de Villefosse came from an aristocratic family. His father held a doctorate in law and served as deputy head of an office at the Ministry of Justice, while his mother also belonged to a prominent Parisian family. Louis attended the Lycée Saint-Louis before entering the École navale at Brest in 1918. He graduated in 1920 with a qualification in naval infantry and was commissioned as an officer cadet.\n\nVillefosse supported the Whites during the civil war and transferred to the 1st Naval Artillery Regiment. He participated in the suppression of the Rennes uprising and fought in the Battle of Paris before being captured at Argentan in late April. Released in 1921, he remained in the armed forces and became an assistant instructor at the École des fusiliers marins in Lorient. He was promoted to ensign in 1923 and became supply officer aboard the destroyer Enseigne Hébert. In 1924, he was appointed officer of the watch aboard the cruiser Montcalm. Promoted to lieutenant in 1925, he became the ship's senior watchkeeping officer. He was promoted to captain and entered the École supérieure de guerre navale in 1927. After graduating in 1928, he became senior watchkeeping officer aboard the battleship Normandie. He was promoted to lieutenant-commander in 1930, became executive officer of the cruiser Marseille in 1933, and assumed command of the vessel with the rank of commander in 1935.\n\nWith his background in the fusiliers marins, Villefosse studies amphibious warfare and joint operations between the armed services.\n\nErudite, sincere, resolute, and perpetually self-critical, Villefosse was influenced in his youth by his family and by Maurras and initially embraced royalism. After the civil war, he instead became a supporter of Sorelianism. His marriage in 1926 to the worker-party activist Janine Bouissounouse gradually drew him toward the Parti ouvrier unifié. Through his wife, he maintains connections with André Breton, Georges Malraux, and other members of the Surrealist milieu. Villefosse is also interested in history and has coauthored several historical works with his wife. He is a friend of Muselier as well.§!"

  FRA_raymond_moullec:0 "Raymond Moullec"
  FRA_raymond_moullec_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L21 March 1901; Brest, Finistère, French Republic§!\n§YBackground:§! §LRaymond Simon Joseph Marie Moullec was the son of a naval warrant officer and Chevalier de la Légion d’honneur. He attended the Lycée de Brest before entering the École navale there in 1919. Moullec supported the armistice and opposed the coup. In May 1920, he participated in the Brest uprising. He graduated in 1921 with a qualification as a gunnery officer and was assigned to a destroyer with the rank of ensign.\n\nIn 1923, Moullec transferred to the battleship Bretagne, where he formed an association with Muselier, and was promoted to lieutenant. He joined the military section of the Third International in 1925 and helped support the British Revolution. In 1926, he was concurrently attached to the staff of the Second Bureau of the Naval Staff, assigned to Italy, and promoted to captain. He became naval attaché in Spain in 1930. During the May Revolution of 1931, he helped a Norwegian diplomat return home and was consequently awarded the Order of St. Olav. Moullec then returned to France, entered the École supérieure de guerre navale, and was promoted to lieutenant-commander. Upon graduating in 1934, he became deputy chief of the Second Bureau. He was appointed its chief and promoted to commander in early 1936.\n\nAlthough a naval officer, Moullec has little enthusiasm for service at sea. His true interests lie in intelligence analysis, geopolitics, and foreign languages, and he is widely recognized as an expert intelligence officer.\n\nResolute, idealistic, daring, and adept at operating behind the scenes, Moullec supported the Radical Party in his youth but moved steadily leftward after the revolution and eventually joined the workers' party. He is close to André Marty and is also a friend of Muselier.§!"

  FRA_robert_jaujard:0 "Robert Jaujard"
  FRA_robert_jaujard_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L6 March 1896; Saint-Martin-de-Saint-Maixent, Deux-Sèvres, French Republic§!\n§YBackground:§! §LRobert Jaujard's family originated in Sainte-Foy-la-Grande in the Gironde. His father was a Calvinist military chaplain. The family moved to Brest in 1908, where Robert attended the Lycée de Brest. He enlisted in August 1914 as an ordinary sailor aboard the cruiser Duguay-Trouin and distinguished himself in service. In March 1915, he transferred to the armoured cruiser Jeanne d’Arc and was promoted to petty officer. He entered the École navale at Brest that September.\n\nGraduating on 1 April 1916, Jaujard became an officer cadet and was assigned to the First Fleet's torpedo boat Enseigne Hébert. He was promoted to ensign in January 1917 and transferred to the battleship Condorcet. In April 1918, he was promoted to lieutenant and assigned to the training ship Pothuau. He transferred to the battleship Lorraine in 1919. Early in 1920, Lorraine participated in the suppression of the Le Havre uprising and the Battle of Cherbourg. In early May, Jaujard refused orders to sail for Algeria and left the navy. Following the liberation of Brest, he joined the revolution.\n\nIn 1921, Jaujard became executive officer of the training ship Antilope and was promoted to captain. He joined the staff of the Third Maritime District in 1923 and was promoted to lieutenant-commander. In 1926, he became executive officer of the armoured cruiser Edgar Quinet and was promoted to commander. Jaujard assumed command of the destroyer Verdun in 1930, followed by the destroyer Marne in 1931. He became captain of the cruiser Toulon with the rank of naval captain in 1932. In 1935, he supervised the completion of the battleship Révolution d’Octobre and was promoted to rear admiral. In early 1936, he became both captain of Révolution d’Octobre and chief of staff of the First Fleet.\n\nHaving served aboard many different classes of warship, Jaujard supports the balanced-fleet doctrine.\n\nJaujard is rigorous, pragmatic, and cooperative. He supports the Ligue de la jeunesse républicaine.§!"

  FRA_marcel_gensoul:0 "Marcel Gensoul"
  FRA_marcel_gensoul_character_desc:0 "§YBorn:§! §L12 October 1880; Montpellier, Hérault, French Republic§!\n§YBackground:§! §LMarcel-Bruno Gensoul was the son of the local deputy public prosecutor. He attended the Lycée Janson-de-Sailly before entering the École navale at Brest in 1898. A classmate of Darlan, he excelled in physics, chemistry, and English. He graduated in 1900 and became an officer cadet aboard the training ship Duguay-Trouin. The following year, he was assigned to the cruiser Chasseloup-Laubat in the South China Sea and received the Médaille commémorative de l’expédition de Chine. In 1902, he served successively aboard the battleship Formidable and the gunboat Surprise.\n\nPromoted to ensign in October 1903, Gensoul entered the École des fusiliers marins at Lorient. In December 1905, he became executive officer of the submarine Algérien. He subsequently transferred to the battleship Carnot in the Mediterranean Fleet as assistant gunnery officer. Gensoul entered the École des officiers torpilleurs at Toulon in 1907. After graduating in August 1908, he joined the cruiser Galilée and participated in the Moroccan campaign. His distinguished conduct earned him promotion to lieutenant and the Médaille commémorative du Maroc with the Casablanca clasp. In November 1909, he became torpedo instructor aboard the battleship Marceau. Promoted in January 1911, he served as an instructor aboard the cruiser D’Entrecasteaux. In August 1913, he became aide to the commander of the Mediterranean Training Detachment.\n\nGensoul transferred to the battleship République in 1914 as chief torpedo and electrical officer and was made a Chevalier de la Légion d’honneur. He served in the Mediterranean and Adriatic theatres during the Weltkrieg and acquired extensive experience in fleet operations. After the war, he continued to rise through a succession of seagoing and staff appointments. He joined the staff of the First Fleet's Training Detachment in 1922 and became its chief of staff in 1923. Promoted to commander in 1924, he became deputy chief of staff of the Second Maritime District. He commanded the 6th Patrol Squadron in 1925 and became executive officer of the battleship Courbet in 1926. Gensoul entered the École supérieure de guerre navale in 1928. Upon graduating in 1929, he was promoted to naval captain and appointed chief of staff of the Third Fleet. He became a rear admiral and deputy chief of the Naval Staff in October 1932. In 1935, he was promoted to vice admiral and assumed command of the Second Fleet.\n\nAn accomplished technical specialist, Gensoul excels in electrical engineering, torpedo warfare, and ship handling.\n\nReserved, aloof, dutiful, and honourable, Gensoul enjoys Darlan's confidence. He maintains political neutrality and is sympathetic toward Britain.§!"

  FRA_emile_muselier:0 "Émile Muselier"
  FRA_emile_muselier_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L17 April 1882; Marseille, Bouches-du-Rhône, French Republic§!\n§YBackground:§! §LÉmile Henry Désiré Muselier was the son of a veteran of the Italian campaign—known in Italy as the Second War of Independence—who later became a postal inspector. His mother was a teacher. Muselier attended the Lycée de Marseille and the École Notre-Dame at Toulon before entering the École navale at Brest in 1899, where he met Darlan. Graduating in 1901, he became an officer cadet and began his practical training. He joined the Far Eastern Squadron in 1903 and served successively aboard Montcalm, Bengali, and Comète while participating in hydrographic surveys of Indochina. He was promoted to ensign in 1904.\n\nMuselier entered the École de canonnage at Toulon in 1906. He served aboard the battleship Saint-Louis in 1907 and aboard Pothuau in 1908, when he was promoted to lieutenant. He joined the battleship Carnot in 1909 and became an instructor at the École de canonnage in Toulon in 1911. Promoted in 1912, he became gunnery officer aboard the cruiser Edgar Quinet. He served in the Adriatic after the Weltkrieg began.\n\nIn May 1915, Muselier transferred to the 1st Fusiliers Marins and distinguished himself as a company commander at Nieuport. That December, he joined the naval artillery battalion and served in Lorraine, Champagne, and along the Yser. In August 1916, he became head of the naval section of the Secretariat of State for Scientific Research and participated in the development of various antisubmarine weapons. He also served aboard Sénégal-Gambie during antisubmarine operations. In April 1918, he assumed command of the dispatch vessel Scarpe. He was promoted to lieutenant-commander that July and operated in the Atlantic. During the Weltkrieg, he was made a Chevalier de la Légion d’honneur and received the Croix de guerre with palm.\n\nMuselier opposed the coup but initially supported the Whites during the civil war and attempted to persuade the sailors aboard his vessel to abandon their mutiny. His political views subsequently moved steadily leftward, and in May 1920 he joined the Brest sailors' uprising. He was promoted to commander and assumed command of the armoured cruiser Ernest Renan in 1922. In 1924, he took command of the battleship Bretagne. He was promoted to naval captain and entered the École supérieure de guerre navale in 1926. In 1927, he became chief of staff of the First Division of the Second Fleet. Promoted to rear admiral in 1930, he became chief of staff of the First Fleet. In 1933, he was promoted to vice admiral and assumed command of the First Fleet.\n\nMuselier emphasizes technological innovation, light naval forces, and surprise attacks.\n\nBold, forceful, pragmatic, and proud, Muselier supports the Union républicaine, socialiste et radicale-socialiste and maintains good relations with Pierre Mendès France. He uses opium. Once a friend of Darlan, he has grown increasingly distant from him as their political views have diverged.§!"

  FRA_charles_platon:0 "Charles Platon"
  FRA_charles_platon_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L19 September 1886; Pujols, Gironde, French Republic§!\n§YBackground:§! §LCharles Jean Guillaume Platon was the son of Georges Platon, a Protestant jurist and keeper of the law library at the University of Bordeaux. His mother was headmistress of the École normale d’institutrices de Bordeaux. Charles attended the Lycée de Bordeaux before entering the École navale at Brest in 1904. After graduating in 1906, he undertook his practical training. He became an officer cadet aboard the armoured cruiser Léon Gambetta of the Northern Squadron in 1907 and was promoted to ensign in 1909. He transferred to the armoured cruiser Victor Hugo in 1911.\n\nPlaton entered the École des officiers torpilleurs at Toulon in 1912. After graduating in 1913, he became executive officer of the submarine Germinal in the Channel Squadron and was promoted to lieutenant. Following the outbreak of the Weltkrieg, Germinal was stationed at Portsmouth in Britain. From 1915 onward, Platon patrolled the English Channel and the Bay of Biscay. While operating near the Île de Ré, the submarine struck a mine and suffered severe damage, but determined repair efforts by the entire crew allowed it to return safely to Rochefort. Platon was promoted to captain in March 1917. That October, he took command of the submarine Cugnot in the Aegean Squadron, based at Moudros. During the Weltkrieg, he was made a Chevalier de la Légion d’honneur and received the Croix de guerre with palm.\n\nPlaton remained noncommittal toward the coup. When the civil war began, Cugnot was undergoing repairs at Toulon. Platon left the navy following the Toulon uprising. Recalled to service in 1922, he entered the École supérieure de guerre navale. Upon graduating in 1923, he became chief of staff of the First Submarine Division of the Channel Squadron. Promoted to commander in 1926, he joined the staff of the Third Maritime District. In 1929, he became chief of the Third Bureau of the Naval Staff. Platon was promoted to naval captain and became director of studies at the École supérieure de guerre navale in 1931. In 1934, he was promoted to rear admiral and assumed command of the Third Fleet.\n\nHaving spent much of his career in the submarine service, Platon attaches particular importance to submarine warfare.\n\nCold, severe, and absolutist, Platon supports the Confédération nationale-syndicaliste but has little interest in parliamentary government. He favours an authoritarian society and emphasizes the importance of family and tradition.§!"

  # Air Force
  FRA_martial_henri_valin:0 "Martial Henri Valin"
  FRA_martial_henri_valin_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L14 March 1898; Limoges, Haute-Vienne, French Republic§!\n§YBackground:§! §LMartial Henri Valin was the son of a wholesaler. He attended the Lycée Gay-Lussac in Limoges. After the outbreak of the Weltkrieg, he attempted to volunteer for the army but was persuaded by his father to prepare for the entrance examination to the École spéciale militaire de Saint-Cyr instead. Valin was conscripted into the 4th Dragoon Regiment in April 1917, while simultaneously passing the examination for Saint-Cyr. He entered the academy that May as a member of the Sainte-Odile Class.\n\nValin graduated in February 1918, selected the cavalry branch, and became an officer cadet in the 3rd African Chasseurs. He fought in the Second Battle of Picardy, the First Battle of the Lys, and the Third Battle of the Aisne. During this period, he volunteered to serve as a dispatch rider and was mentioned in regimental dispatches. He was later attached to the 5th Cuirassiers and suffered gas poisoning, leaving him with persistent respiratory difficulties and an irregular heartbeat. In 1919, Valin participated in the battles of Compiègne, Clermont, and the Second Oise. He was again mentioned in regimental dispatches and promoted to second lieutenant. During the Weltkrieg, he received the Croix de guerre with two bronze stars.\n\nAfter the war, Valin transferred to the 16th Dragoon Regiment and resumed his studies at Saint-Cyr. He returned to his unit in January 1920, participated in the suppression of the Lyon uprising, and joined the revolt during the Battle of Troyes. Valin entered the École de cavalerie at Saumur in 1921. After graduating in 1922, he was assigned to the 4th Hussars and promoted to lieutenant. In 1924, he volunteered for the aviation service and entered the École d’aviation d’Avord. He qualified as both an aerial observer and military pilot in 1925 and was assigned to the 22nd Night Bomber Regiment. He became commander of its First Squadron and was promoted to captain in 1927. Valin entered the École supérieure de guerre aérienne in 1930. After graduating in 1931, he was promoted to major and joined the staff of the 12th Air Brigade. In 1935, he transferred to the training section of the Third Bureau of the Air Staff and was promoted to lieutenant-colonel.\n\nValin specializes in instrument flying and night bombing.\n\nUpright, pragmatic, self-disciplined, and exceptionally rigorous, Valin prefers to supervise matters personally and frequently accompanies his aircrews on operations. Politically, he supports the Confédération nationale-syndicaliste.§!"

  FRA_maryse_bastie:0 "Maryse Bastié"
  FRA_maryse_bastie_character_desc:0 "§YAffiliation:§! $party_PCOP$ ($PCOP_faction_2$)\n§YBorn:§! §L27 February 1898; Limoges, Haute-Vienne, French Republic§!\n§YBackground:§! §LMaryse Bastié was born Marie-Louise Bombec. Her father was an iron foundry worker and her mother a housewife. An excellent pupil with an early interest in machinery, Maryse lost her father at the age of eleven. She left school at thirteen and found employment stitching leather in a shoe factory. While studying the violin, she met the porcelain decorator Jean-Baptiste Gourinchas, whom she married after a brief courtship in 1915. They had one son but soon separated amid incompatible temperaments, financial hardship, and family tragedy.\n\nMaryse subsequently joined the marraines de guerre movement, which encouraged women on the home front to correspond with servicemen at the front. Through it, she met the fighter pilot Louis Bastié. In 1919, she became a secretary and typist for the Limoges electricity company. She divorced Gourinchas in late 1920. By then, Louis Bastié was regularly flying in and out of Limoges, and his influence inspired Maryse to develop a passion for aviation. The two fell in love and married in May 1922, subsequently operating a shoe shop in Cognac.\n\nWith her husband's assistance, Maryse obtained her pilot's licence at Bordeaux–Mérignac aerodrome in 1925. She caused a local sensation by flying beneath the cables of the Bordeaux transporter bridge and remained at the aerodrome as an instructor. Her husband was killed the following year. In 1927, she moved to Paris and supported herself through aerobatic exhibitions and passenger flights. With the assistance of the pilot Maurice Drouhin, she established a women's distance record of 1,058 kilometres in July 1928. In July 1929, she remained airborne for 26 hours, 47 minutes, and 30 seconds, setting the world record for women's solo endurance flight. The following year, she defeated her rival Léna Bernstein and defended the record with a flight lasting 37 hours and 55 minutes.\n\nIn 1931, Bastié flew from Le Bourget to Yurino in Russia, covering 2,976.31 kilometres in 30 hours and 30 minutes. This achievement established another world record and earned her the Harmon Trophy. Impressed by her accomplishments, Charles Tillon proposed that she enter the air force. Commissioned as a lieutenant, she became an instructor at Avord aerodrome. In 1933, she was promoted to captain and transferred to the Air Staff as head of the Aviation Health Section. She was promoted to major and appointed director of the Special Flight Service in 1935.\n\nBastié specializes in endurance and instrument flying.\n\nTenacious, austere, and exceptionally self-disciplined, Bastié is an ardent advocate of women's rights and female participation in aviation. She supports the creation of women's aviation units. Politically, she supports the Parti communiste ouvrier et paysan, though her principal concern remains women's rights.§!"

  FRA_jean_francois_jannekeyn:0 "Jean-François Jannekeyn"
  FRA_jean_francois_jannekeyn_character_desc:0 "§YBorn:§! §L16 November 1892; Cambrai, Nord, French Republic§!\n§YBackground:§! §LJean-François Jannekeyn was the son of a serving non-commissioned officer who was later promoted to an administrative commission. In 1911, Jannekeyn entered the École spéciale militaire de Saint-Cyr as a member of the Marie-Louise Class, where he achieved middling results. He spent a year serving with the 28th Dragoon Regiment before graduating in 1913. Commissioned as a second lieutenant, he was assigned to the 6th Dragoon Regiment and subsequently studied at the École de cavalerie in Saumur.\n\nJannekeyn returned to his regiment after the Weltkrieg began and became a platoon commander in its Second Half-Regiment. He participated in the Battle of Rossignol and the First Battle of Flanders and was promoted to lieutenant at the end of the year. In 1915, he operated around Montdidier, Artois, and Roclincourt. He served around Compiègne in early 1916 before transferring to the 4th Cuirassiers à pied that June and fighting at Quennevières and Puisaleine. In April 1917, he participated in the fighting on the Chemin des Dames.\n\nWeary of trench warfare, Jannekeyn volunteered for the aviation service in May and trained at the Le Crotoy air base. He qualified as a pilot in July and undertook further training at Avord and Clermont-Ferrand. In November, he joined Escadrille 132 and participated in bombing operations against Altkirch, Thann, Guebwiller, Arlarmont, Münster, and Rouffach. Jannekeyn became an squadron commander in May 1918 and operated around Amiens, Clermont-en-Beauvaisis, Saint-Just, Breteuil, and Ham. He subsequently participated in the Second Battle of the Marne, the Fourth Battle of Champagne, and the First Battle of the Oise and was promoted to captain.\n\nFlying with Eugène Weismann, Jannekeyn shot down his first enemy aircraft on 22 August. He destroyed four more on 14 September and became an ace. In 1919, he operated over the Oise during the Spring Offensive and the Second Battle of the Oise, then participated in the Battle of Saint-Mihiel that July. He shot down seven enemy aircraft over the course of the year. During the Weltkrieg, Jannekeyn achieved twelve confirmed victories and was made a Chevalier de la Légion d’honneur. He also received the Croix de guerre with six palms, one gold star, one silver star, and one bronze star.\n\nAfter the war, Jannekeyn joined the Fourth Bureau of the Directorate of Military Aviation. Although he opposed the coup, he nevertheless supported the Whites during the civil war. He left the armed forces after the liberation of Paris and supported himself by teaching fencing. Recalled in 1923, he returned to the Fourth Bureau and was promoted to major. He became a lieutenant-colonel and head of the bureau in 1925. In 1928, Jannekeyn assumed command of the 11th Bomber Regiment and was promoted to colonel. He became chief of staff of the Fourth Air Region in 1930. In 1931, he joined the Air Staff as an assistant chief of staff and Inspector of Bombers and was promoted to brigadier-general.\n\nConservative in outlook and committed to the traditions of the Weltkrieg, Jannekeyn attaches great importance to close air support. He has devoted particular attention to the aviation industry and air-force logistics and opposes the medium multirole aircraft programme.\n\nJannekeyn is discreet, pragmatic, principled, and honourable: a technical officer above all else. He maintains political neutrality and emphasizes unity within the air force.§!"

  FRA_alfred_heurtaux:0 "Alfred Heurtaux"
  FRA_alfred_heurtaux_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_2$)\n§YBorn:§! §L20 May 1893; Nantes, Loire-Inférieure, French Republic§!\n§YBackground:§! §LAlfred Marie Joseph Heurtaux was the son of an artillery major and graduate of the École polytechnique. His mother came from a wealthy medical family. He spent his early years in Rennes and Vannes and attended the Collège Saint-François-Xavier. He entered the École spéciale militaire de Saint-Cyr in 1912 as a member of the Montmirail Class and spent a year training with the 4th Hussars. Graduating in 1914, he was assigned to the 9th Hussars.\n\nAfter the Weltkrieg began, Heurtaux fought in the Vosges and in the First Battle of Flanders. He distinguished himself, was wounded, and received three commendations. He subsequently volunteered for the aviation service and entered the École d’aviation militaire at Pau on 6 December to study aerial reconnaissance, where he met Georges Guynemer. In early 1915, Heurtaux became an observer with Escadrille 26 and operated over Flanders. He obtained his pilot's qualification in April and was assigned to Escadrille 38, conducting reconnaissance during the Second Battle of Champagne and receiving promotion to lieutenant.\n\nIn June 1916, Heurtaux's first aerial victory went unconfirmed, leading to an increasingly acrimonious dispute with his superiors. He transferred to Escadrille 3 and fought over the Somme. Victories soon followed in rapid succession. He became an ace in August and shot down the German ace Kurt Wintgens on 25 September. In October, Heurtaux helped establish Groupe de combat 12, and in November he became a squadron commander. By the end of 1916, he had destroyed sixteen enemy aircraft.\n\nTemporarily promoted to captain in 1917, Heurtaux participated in the fighting on the Chemin des Dames in May and the Second Battle of Flanders in July. On 23 September, he crashed while testing a SPAD XIII fighter. His left thigh was gravely injured, permanently ending his ability to fly. By then, he had achieved twenty-one confirmed victories. After recovering, Heurtaux joined propaganda and inspection missions that visited Britain, Italy, and other allied countries. His rank of captain was made permanent on 19 April 1918. During the Weltkrieg, he was made an Officier de la Légion d’honneur and received the Croix de guerre with sixteen palms.\n\nIn August 1919, Heurtaux joined the office of the Secretary of State for Aviation. A supporter of Sorelianism, he joined the revolution after the civil war began, organized the Directorate of Aviation, helped establish the Red Air Force, and joined the Légion des soldats révolutionnaires. In 1921, he became deputy director of military aviation and was promoted to major. He was promoted to lieutenant-colonel and entered the École supérieure de guerre in 1924. After graduating in 1925, he became commandant of the École d’aviation de Châlons with responsibility for political and administrative affairs. He became a colonel and chief of staff of the Second Air Region in 1928. Promoted to brigadier-general in 1930, he assumed command of the Second Air Region. In 1932, he was promoted to major-general and became deputy chief of the Air Staff and Inspector of Bombers.\n\nHeurtaux's combat style is exceptionally aggressive and emphasizes closing to short range before crippling an opponent. He supports the coordinated employment of large formations and adamantly opposes the multirole aircraft programme.\n\nHot-tempered, indomitable, and honourable, Heurtaux possesses a natural gift for leadership. Politically, he supports the Parti socialiste français but dislikes parliamentarism.§!"

  FRA_georges_guynemer:0 "Georges Guynemer"
  FRA_georges_guynemer_character_desc:0 "§YAffiliation:§! $party_CNS$ ($CNS_faction_1$)\n§YBorn:§! §L24 December 1894; Paris, Seine, French Republic§!\n§YBackground:§! §LGeorges Marie Ludovic Jules Guynemer was the son of a retired army captain and a Norman noblewoman whose ancestry could be traced to Louis XIV. Born into considerable wealth, he spent his childhood at the family's estate in Le Thuit before moving to Compiègne. He attended the Collège Stanislas and achieved excellent academic results despite suffering from chronic ill health. Guynemer attempted to enter the École polytechnique, but his physical condition rendered him ineligible.\n\nAfter the Weltkrieg began, Guynemer attempted to enlist but was rejected. With his father's assistance, he entered the École d’aviation militaire at Pau as a student mechanic in November. He worked tirelessly and demonstrated exceptional natural ability, becoming acquainted with Alfred Heurtaux. On 21 January, he wore a black mourning band in memory of Louis XVI. This gesture won the sympathy of the school's commandant, who allowed him to transfer to pilot training. Guynemer graduated in May, was promoted to corporal, and joined Escadrille 3, operating over Artois and Champagne. He shot down his first enemy aircraft in July, received the Médaille militaire, and was promoted to sergeant. At the end of the year, he received a commendation in the order of the Légion d’honneur.\n\nGuynemer destroyed his fifth enemy aircraft in February 1916, becoming an ace and earning promotion to second lieutenant. He fought at Verdun in March and over the Somme in June and was promoted to lieutenant at the end of the year. By the end of January 1917, he had achieved thirty confirmed victories. He was promoted to captain in February and fought on the Chemin des Dames in April. In May, he destroyed four aircraft in a single day and passed forty confirmed victories. He helped develop the SPAD S.XII fighter in July and soon passed fifty victories before participating in the Second Battle of Flanders.\n\nGuynemer's mental health had long been unstable, while mounting combat fatigue and a diagnosis of tuberculosis steadily eroded his condition. Nevertheless, he refused to take leave. He was shot down on 11 September, survived against all expectations, and was placed on compulsory leave at the Château d’Angerville sanatorium. In May 1919, he escaped from the institution and returned to the front for the Second Battle of the Oise, only to be sent to Leysin in Switzerland for further treatment. During the Weltkrieg, Guynemer flew more than six hundred missions and destroyed over sixty enemy aircraft, making him France's second-highest-scoring ace. He was made an Officier de la Légion d’honneur and received the Médaille militaire and the Croix de guerre with twenty-seven palms.\n\nGuynemer underwent artificial pneumothorax treatment in 1922 and recuperated at home. He returned to military service in 1924 as head of the Training Section of the Directorate of Military Aviation and supervisor of Avord air base, receiving promotion to major. In 1926, he became commander of the 1st Fighter Group and was promoted to lieutenant-colonel. He assumed command of the 4th Air Brigade and was promoted to colonel in 1929. These appointments principally concerned the development of ground tactics. Guynemer became commander of the Third Air Region with the rank of brigadier-general in 1932 and Inspector of Fighters with the rank of major-general in 1935.\n\nGuynemer's combat style is extraordinarily aggressive, emphasizing relentless attack, close-range fire, and heavy-calibre armament. He supports a fast, compact, highly manoeuvrable, and thoroughly offensive air force.\n\nReserved, sincere, innocent, generous, responsible, and perfectionistic, Guynemer possesses a fanatical devotion to aerial combat and enjoys immense public popularity. He has previously suffered severe aviation neurosis. Politically, he is a royalist and supports the Confédération nationale-syndicaliste.§!"

  FRA_victor_leon_ernest_denain:0 "Victor Léon Ernest Denain"
  FRA_victor_leon_ernest_denain_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L6 November 1880; Dax, Landes, French Republic§!\n§YBackground:§! §LVictor Léon Ernest Denain's family originated in Paris. His father, Édouard Denain, was a military medical administrator who had entered the army in his youth. Despite his advanced age, Édouard returned to service in 1914 and was made a Commandeur de la Légion d’honneur in 1918, becoming the first administrative officer in France to receive that distinction. Victor's mother was a housewife.\n\nDenain placed 168th in the entrance examination for the École spéciale militaire de Saint-Cyr in 1901 and joined the Centenary of the Légion d’honneur Class. He graduated 227th in 1903, selected the cavalry branch, and became an officer cadet in the 6th Chasseurs à cheval. He was promoted to second lieutenant and became a platoon commander in 1904. In October 1905, Denain transferred to the 5th African Chasseurs and was promoted to lieutenant. He participated in the Moroccan campaigns from 1908 to 1912 before entering the École supérieure de guerre.\n\nDenain graduated in 1914 with both staff and aerial-observer qualifications. In August, he was assigned to the staff of the 36th Infantry Division and fought at Charleroi, in the First Battle of Guise, and in the First Battle of the Marne. He transferred to the staff of the Third Army in October but suffered a severe head wound at Flirey and was evacuated to the rear. Denain trained at the Étampes and Châlons air bases in June 1915 and qualified as an army pilot that August. In September, he became commander of the aviation forces of the Armée d’Orient and was promoted to captain. He received a temporary promotion to major in March 1916.\n\nBetween 1916 and 1919, Denain devoted himself to developing the Armée d’Orient's aviation. His work included long-range bombing, the establishment of an “Otranto logistics corridor,” the creation of an independent aircraft-assembly capability within the theatre, improvements to fighter aircraft, and assistance to the Balkan allies in establishing their own air forces. During the Weltkrieg, Denain was made an Officier de la Légion d’honneur and received the Croix de guerre with one star and three palms.\n\nDenain's rank of major was made permanent after the armistice. On the recommendation of Doumergue, he became an adviser to the prime minister. He escaped with Briand during the Christmas Eve Coup. White forces arrested him early in the civil war and imprisoned him in Bordeaux. Following the city's liberation, Denain joined the revolution. He became director of military aviation with the rank of lieutenant-colonel in 1921. In 1924, he entered the Centre des hautes études militaires and was promoted to colonel. After graduating in 1925, he became head of the aviation section of the National Defence Council with the rank of brigadier-general in 1926. Denain was promoted to major-general and appointed commander of the First Air Region in 1927. In 1929, he became Chief of the Air Staff and Inspector-General of the Air Force with the rank of lieutenant-general.\n\nA pragmatic adherent of Douhet, Denain recognizes the importance of strategic bombing. France's limited industrial strength nevertheless leads him to support a tactical air force intended principally for national defence. He seeks to establish a unified and efficient aviation industry and supports the multirole aircraft programme.\n\nCalm, pragmatic, and rational, Denain is a gifted organizer and collaborator. Although connected with several different parties, he principally supports the Ligue de la jeunesse républicaine.§!"

