# CGFF
  FRA_maurice_gamelin:0 "Maurice Gamelin"
  FRA_maurice_gamelin_character_desc:0 "§YAffiliation:§! $party_URSRS$ ($URSRS_faction_1$)\n§YBorn:§! §L20 September 1872; Paris, Seine, French Republic§!\n§YBackground:§! §LMaurice Gustave Gamelin was born into a military family. His father served as Inspector-General of the Army, while his mother was Alsatian. An outstanding student from childhood, Gamelin attended the Collège Stanislas before entering the École spéciale militaire de Saint-Cyr, from which he graduated with exceptional results in 1893. He first served with the 3rd Algerian Infantry Regiment, then worked for the army's cartographic service in Tunisia and served for a time as Joseph Joffre's secretary. In 1896, he transferred to the 102nd Infantry Regiment. The following year, he placed eighth in the entrance examination for the École supérieure de guerre, where he attracted the attention of Ferdinand Foch. During the Dreyfus Affair, Gamelin remained publicly neutral, although he was one of the few officers who believed Dreyfus to be innocent. He graduated in 1901 and was promoted to captain. In 1902, he joined the staff of the 15th Army Corps. In 1904, he became a company commander in the 15th Bataillon de chasseurs alpins. With Foch's assistance, he became Joffre's aide-de-camp in 1906. In 1908, he joined the staff of the 2nd Army Corps and was promoted to major. He followed Joffre to the Conseil supérieur de la guerre in 1910 and assumed command of the 11th Bataillon de chasseurs alpins in 1911. In 1913, he was appointed a Chevalier de la Légion d'honneur and transferred to the Third Bureau of the Army General Staff.\n\nWhen the Weltkrieg began, Gamelin accompanied Joffre to the French Grand Quartier Général and participated in planning the Battle of the Marne. He was promoted to lieutenant-colonel and received an army-level citation. In 1915, he took charge of the Third Bureau at the Grand Quartier Général. In 1916, he commanded the 2nd Chasseur Brigade during the battles of Linge and the Somme, receiving promotion to colonel and a corps-level citation. He volunteered to command the 9th Infantry Division in 1917 and fought in the Battle of the Chemin des Dames, receiving another distinction from the Légion d'honneur. In 1918, he led the division through the Second Battle of Picardy, the Second Battle of the Marne and the Third Battle of Picardy. He participated in the battles of Compiègne and the Oise in 1919, was promoted to brigadier-general and received a divisional citation. His distinguished wartime record and concern for the lives of his soldiers earned him the Croix de guerre with silver star, gilt star and palm, the rank of Officier de la Légion d'honneur and several foreign decorations.\n\nAlthough Gamelin owed much of his career to Joffre's patronage, he did not support the coup. Shortly before the Battle of Troyes, Gamelin revolted—allegedly after being carried along by his own officers and men—and contributed to the White Army's crushing defeat. In 1921, he became commander of the 20th Military Region and was promoted to major-general. He became Deputy Chief of the Army General Staff in 1922 and Chief of the Army General Staff in 1926, receiving promotion to lieutenant-general. In 1929, he became Chief of the General Staff of the Armed Forces, was promoted to full general and assumed responsibility for the military reforms of that year.\n\nGamelin does not oppose modern concepts such as mobile warfare, but places considerably greater emphasis upon defence. He regards mobile formations chiefly as fire brigades to be rushed wherever a gap appears—a highly controversial position.\n\nMild-mannered and personally uncharismatic, Gamelin is tactful, acutely sensitive to changes in the political climate and careful to avoid factional struggles. His acceptability to nearly every faction has carried him rapidly through the ranks. His personal sympathies nevertheless lie with the Union Républicaine des Socialistes et des Radicaux-Socialistes.§!"
  CGFF_maurice_gamelin_trait:0 "$CGFF$"
  FRA_maurice_gamelin_trait:0 "Proponent of Methodical Sequential Operations"

  FRA_ernest_petit:0 "Ernest Petit"
  FRA_ernest_petit_character_desc:0 "§YAffiliation:§! $party_POU$ ($POU_faction_1$)\n§YBorn:§! §L20 February 1888; Paimbœuf, Loire-Inférieure, French Republic§!\n§YBackground:§! §LErnest Émile Abel Petit was the son of a postmaster. Educated at the Lycée de Nantes, he entered the École spéciale militaire de Saint-Cyr in 1909, in the same class as Charles de Gaulle and Alphonse Juin. Upon graduating in 1911, he was commissioned as a second lieutenant in the 161st Infantry Regiment. He was promoted to lieutenant in 1913. When the Weltkrieg began, the regiment formed part of the 40th Infantry Division and fought with the Third Army in the battles of the Ardennes, Revigny and the Woëvre. In 1915, Petit fought in the Argonne Forest and the Second Battle of Champagne, earning a regimental citation. He participated in the Battle of Verdun in 1916 and moved to the Somme in October. The regiment distinguished itself in the fighting around Bouchavesnes-Bergen and became known as the 'Iron Gate Regiment'. Petit received a divisional citation and was promoted to captain.\n\nPetit participated in the Nivelle Offensive in 1917 and was captured in August. Imprisoned at Ingolstadt, he came under the influence of Russian communism and began questioning the purpose of the Weltkrieg. Three escape attempts failed before he finally succeeded in February 1919 and returned to his regiment, earning the Médaille des évadés. He fought in the Battle of the Oise, was appointed a Chevalier de la Légion d'honneur and received an army-level citation. He subsequently participated in the disastrous Battle of Saint-Mihiel, which provoked a mutiny. Petit organised a Soldiers' Committee, became a soldiers' delegate and joined forces with the workers in demanding an armistice. After Pétain's coup, left-wing and anti-war officers were purged from the army, and Petit was dismissed. With civil war already underway, he led the 161st Regiment into the Sedan uprising and later fought in the Battle of Troyes. His decorations from the Weltkrieg included the Croix de guerre with bronze star, silver star and palm, the rank of Chevalier de la Légion d'honneur and the Médaille des évadés.\n\nIn June 1920, Petit transferred to the 30th Bataillon de chasseurs alpins and was promoted to major. He entered the École supérieure de guerre in 1921. In 1923, he became Director of Studies at the École spéciale militaire de Saint-Cyr and was promoted to lieutenant-colonel. He became commandant of the École d'application des transmissions in 1926 and was promoted to colonel. In 1929, he became Chief of Staff of the 24th Infantry Division while attending the Centre des hautes études militaires. He was appointed Assistant Chief of the General Staff and promoted to brigadier-general in 1932. In 1934, he assumed command of the 2nd Military Region and was promoted to major-general.\n\nPetit stresses the importance of radio. By employing it on a wide scale, devolving authority over fire support and coordinating closely with aviation, he seeks to exploit firepower to its fullest extent. He supports the development of armoured forces, although he favours employing them defensively.\n\nPetit has been described as slow, quiet, wise and self-assured. A spontaneous Marxist, he supports the Parti Ouvrier Unifié. He is also one of the army's few committed pacifists and rejects revanchism. His concern for the welfare of officers and soldiers, his efforts to improve living conditions and his campaign to incorporate military benefits into the broader social-security system have made him greatly beloved by the rank and file.§!"
  CGFF_ernest_petit_trait:0 "$CGFF$"
  FRA_ernest_petit_trait:0 "Proponent of General Sustained Operations"

  FRA_henri_gerard:0 "Henri Gérard"
  FRA_henri_gerard_character_desc:0 "§YAffiliation:§! $party_PCOP$ ($PCOP_faction_2$)\n§YBorn:§! §L12 February 1889; Paris, Seine, French Third Republic§!\n§YBackground:§! §LHenri Émile Gérard was the son of a wholesaler and the grandson of a moneylender. He entered the École spéciale militaire de Saint-Cyr in October 1893 as a member of the Jeanne d'Arc class. Graduating twenty-fifth in 1896, he was commissioned as a second lieutenant in the 4th Zouave Regiment. In 1897, he joined the 1st Infantry Regiment of the Légion étrangère and transferred to the staff in the French Sudan at the end of that year. Wounded while displaying conspicuous bravery in 1898, he received the Médaille coloniale with Senegal and Sudan clasps and was promoted to lieutenant. He participated in a Saharan expedition in 1901 before returning to France at the end of the year and joining the 46th Infantry Regiment, stationed permanently in Paris. He married Michèle Worms de Romilly, a member of a prominent Parisian family.\n\nGérard transferred to the 26th Chasseur Battalion in 1902. After meeting Jean Jaurès in 1903, he became a socialist. He joined the 51st Infantry Regiment in 1907 and was promoted to captain. Under the pseudonym Major Rossel, he published articles in L'Humanité and assisted Jaurès in writing L'Armée nouvelle. He transferred to the 74th Infantry Regiment in 1909. After expressing sympathy for a strike, he quarrelled with his fellow officers, was imprisoned and conveniently 'diagnosed' with neurasthenia. Jaurès intervened to secure his release. Gérard joined the 102nd Infantry Regiment in 1910 and was appointed a Chevalier de la Légion d'honneur the following year.\n\nDuring the Weltkrieg, Gérard fought in the Battle of the Frontiers, the First Battle of the Marne and the Race to the Sea, receiving a regimental citation. In 1915, he participated in the First and Second Battles of Champagne and received a corps-level citation. He fought at Verdun in 1916, where he was severely wounded and evacuated to the rear. He was promoted to major and received both an army-level citation and a distinction from the Légion d'honneur. In 1917, Gérard transferred to the Ministry of Armaments, assisting Albert Thomas with the organisation of munitions production. Throughout the war, he supported the Union sacrée, sought to preserve the lives of his soldiers and opposed futile offensives, earning considerable affection among the ranks. His decorations included the rank of Officier de la Légion d'honneur, the Croix de guerre with bronze star, gilt star and palm, and the Médaille des blessés de guerre.\n\nAt the end of 1918, Gérard secretly joined the Association républicaine des anciens combattants. In 1919, he transferred to the Ministry of War, where he covertly organised a soldiers' movement and supported an armistice. He returned to the 102nd Infantry Regiment at Sedan in 1920 and led the Sedan uprising on 19 January. The Comité de salut public subsequently appointed him Commander-in-Chief of the Revolutionary Army. In that capacity, he directed the Battle of Troyes, the Battle of Paris and the great pursuit into western France. He was promoted to lieutenant-general in 1921 and became Chief of the General Staff in 1923. In 1929, he was appointed Inspector-General of the Armed Forces and Director of the Centre des hautes études militaires, receiving promotion to full general.\n\nGérard is the foremost representative of military socialisation. He advocates a militia system, a politicised army and initiative among officers and soldiers alike. Tactically, he emphasises firepower, while also supporting the development of armoured forces.\n\nHe regards Jaurès as a patriot and believes that, had he lived, Jaurès would have supported the Weltkrieg in defence of the homeland.§!"
  CGFF_henri_gerard_trait:0 "$CGFF$"
  FRA_henri_gerard_trait:0 "Proponent of Flexible Sequential Operations"

  FRA_nestor_makhno:0 "Nestor Makhno"
  FRA_nestor_makhno_character_desc:0 "§YAffiliation:§! $party_UA$ ($UA_faction_2$)\n§YBorn:§! §L7 November 1888; Huliaipole, Yekaterinoslav Governorate, Russian Empire§!\n§YBackground:§! §LNestor Ivanovych Makhno was born into poverty. His father, a peasant, died before Makhno reached his first birthday. He entered primary school in 1896 and proved an able pupil, but left in 1900 to work successively on a farm, in a paint shop and at a foundry. In 1906, he joined the anarchist organisation Union of Poor Peasants and participated in the coercion of merchants to obtain funds. Police arrested him in 1908 for the murder of an informer, despite his lack of involvement in the killing. A court sentenced him to life imprisonment in 1910.\n\nMakhno was confined in Moscow's Butyrka Prison from 1910 until 1917. Under the influence of fellow prisoner Peter Arshinov, he became a committed anarchist. Released after the February Revolution, he returned to Huliaipole in March, organised a Peasants' Association, distributed land and improved workers' conditions. Following the Treaty of Brest-Litovsk, German and Austrian forces occupied Ukraine and expelled him. When he returned home in disguise, he discovered that his mother's house had been burned and his brother executed for allegedly opposing Germany and the Hetmanate.\n\nMakhno responded by launching a peasant uprising that swept across southeastern Ukraine. His forces executed landlords, distributed their estates and established free communes, becoming known as the Black Army. It won a series of victories, most famously at Peregonovka, and captured Kharkiv in early 1919. The German- and Austrian-backed Hetmanate was forced to commit all available forces to suppressing the Black Army. Bitter fighting followed across the Donbas, Berdiansk and Mariupol. Hampered by shortages of weapons and poor organisation, the Black Army gradually lost the initiative and collapsed in November 1919.\n\nMakhno escaped to France just as the French Revolution was unfolding. He joined the Red Guerrillas of Lorraine, attacking White supply lines and contributing to victory at Troyes. His ferocious mobile tactics left a profound impression upon the Revolutionary Army. After liberation, he was sent to the École de cavalerie de Saumur and graduated in 1923. He subsequently entered the École supérieure de guerre, but political conflict and incompatibility with its military doctrines led him to leave without graduating in 1925. Makhno then volunteered for service in Patagonia, where he assisted in organising its armed forces and supported the Chilean Revolution.\n\nA self-taught master of mobile warfare, Makhno favours manoeuvre, decentralised command and—unusually for an anarchist—a professional army. Drawing upon the experience of the Ukrainian Revolution, he advocates Platformism. In his view, anarchism is a workers' revolution rooted in class struggle; it must oppose every strain of bourgeois philosophy and possess a necessary degree of organisation through theoretical unity, tactical unity and collective responsibility. His opponents accuse him of attempting to 'Bolshevise' anarchism.§!"
  CGFF_nestor_makhno_trait:0 "$CGFF$"
  FRA_nestor_makhno_trait:0 "Proponent of Mission-Oriented Guerre éclair"

  FRA_charles_delestraint:0 "Charles Delestraint"
  FRA_charles_delestraint_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L12 March 1879; Biache-Saint-Vaast, Pas-de-Calais, French Republic§!\n§YBackground:§! §LCharles Georges Antoine Delestraint was the son of an accountant who had served in the Franco-Prussian War. His mother was a war widow who later married Delestraint's father. Raised in modest circumstances, he aspired to military service from childhood. He received a Catholic education in Lille and excelled in his studies. In 1897, he entered the Bourbaki class of the École spéciale militaire de Saint-Cyr. Graduating in 1900, he was commissioned as a second lieutenant in the 16th Chasseur Battalion and joined the Franciscan Third Order at the end of the year. He was promoted to lieutenant in 1902 and captain in December 1913. In March 1914, he passed the entrance examination for the École supérieure de guerre.\n\nWhen the Weltkrieg began, Delestraint commanded the 9th Company of the 58th Chasseur Battalion. On 25 August 1914, he ambushed the German 134th Saxon Regiment at Ébly, prevented it from crossing the Meuse and protected the junction between the Fourth and Fifth Armies, helping them establish contact. He received a distinction from the Légion d'honneur and an army-level citation before covering the retreat of the 52nd Division. Overwhelmed at Chênois-Auboncourt on 30 August, he was captured and spent the remainder of the war in Germany, where he met Charles de Gaulle. His wartime decorations included the Croix de guerre with palm and the rank of Chevalier de la Légion d'honneur.\n\nBecause of the French Revolution, Delestraint did not return home until May 1920, by which time the military government had fled to Algiers. He had little choice but to accept the Revolution as an accomplished fact. He resumed his studies at the École supérieure de guerre in 1921, obtained his staff qualification the following year and was promoted to major. In 1923, he attended the tank school at Versailles, where he met the 'father of French tanks', Jean Estienne. Under Estienne's influence, Delestraint became an enthusiastic advocate of armoured warfare. He joined the 517th Tank Regiment as a battalion commander in 1924, became deeply popular with his officers and men and was promoted to lieutenant-colonel.\n\nIn 1926, Delestraint transferred to the technical section of the École de cavalerie et des blindés de Saumur, supporting Estienne's proposals for heavy-tank research and the formation of dedicated armoured units. He became commandant of the school the following year and was promoted to colonel. In 1930, he assumed command of the 505th Tank Regiment, where his unconventional and highly individual training methods provoked controversy. The support of the regiment and several superiors nevertheless preserved his command and brought promotion to brigadier-general. He became Inspector of Tanks with the rank of major-general in 1932. In 1935, he organised the 1st Light Mechanised Division, became its commander and was promoted to lieutenant-general.\n\nDelestraint firmly believes in the decisive value of tanks and demands the creation of several genuine armoured divisions. He favours an active offensive strategy and is the Commune's most energetic advocate of armoured mobile warfare.\n\n'Honour, duty, action, faith and selflessness' define his character. His support for professional armoured formations remains controversial within the army. Politically traditional, he supports the Ligue de la Jeune République.§!"
  CGFF_charles_delestraint_trait:0 "$CGFF$"
  FRA_charles_delestraint_trait:0 "Proponent of Integrated Guerre éclair"

  FRA_gabriel_bougrain:0 "Gabriel Bougrain"
  FRA_gabriel_bougrain_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L9 April 1882; Laval, Mayenne, French Republic§!\n§YBackground:§! §LGabriel Marie Joseph Bougrain was the son of the banker Auguste Bougrain-Dubourg, proprietor of the Banque Bougrain. His mother likewise came from a financial family. Under his father's strict supervision, he began learning horsemanship at an early age. He was educated at the Lycée d'Auch and supported the army during the Dreyfus Affair. In 1903, after his father's death left him the family's only son, he refused an exemption from military service and entered the La Tour d'Auvergne class of the École spéciale militaire de Saint-Cyr. Graduating in 1905, he was commissioned as a second lieutenant and continued his studies at the École de cavalerie de Saumur. After graduating in 1906, he joined the 25th Dragoon Regiment. The following year, he volunteered for service in Algeria and distinguished himself as an instructor in the 1st Chasseurs d'Afrique Regiment.\n\nBougrain returned to France and married in 1910. His wife, Yvonne O'Mahony, was descended from the nobility. He served with the 23rd Dragoon Regiment and was promoted to lieutenant in 1912. In July 1914, he became an assistant instructor at the École de cavalerie de Saumur and joined its Cadre Noir. Mobilised into the 24th Dragoon Regiment that August, he performed reconnaissance duties during the battles of the Ardennes, the Meuse, the First Marne and the First Champagne. He was promoted to captain and received an army-level citation. In December, he joined the staff of divisional commander Réveilhac. He participated in the Second Battle of Champagne in 1915 and received both an army-level citation and a distinction from the Légion d'honneur. He fought at Verdun from June to July 1916, earning a divisional citation, and voluntarily transferred to the Third Bureau of the Armée d'Orient in November. From the end of 1916 into early 1917, he participated in the battles of Hill 1248 and the Second Battle of the Crna Bend. He subsequently received flight training and carried out aerial reconnaissance.\n\nIn October 1918, Bougrain became Chief of the Third Bureau at Allied Headquarters in the east. He developed a close working relationship with Franchet d'Espèrey, participated in the Battle of Dobro Pole and received another army-level citation. He took part in the great withdrawal from Salonika in 1919 and was promoted to major. His wartime decorations included the Croix de guerre with silver star and four palms and the rank of Chevalier de la Légion d'honneur. Bougrain opposed the armistice. He participated in peace negotiations concerning the Near and Middle East and did not return home until April 1920, when the civil war was nearing its end. He left the army and became general manager of the Montlhéry racecourse, but proved unable to adjust to civilian life.\n\nBougrain returned to active service in 1923 and entered the École supérieure de guerre. Graduating the following year, he remained as a cavalry instructor and was promoted to lieutenant-colonel. In 1927, he took charge of the advanced course for reserve officers at Saumur and was promoted to colonel. He became Director of Studies in 1930. In 1931, he was promoted to brigadier-general, assumed command of an experimental mechanised brigade and attended the Centre des hautes études militaires. At the end of 1934, he participated in forming the 1st Light Mechanised Division and was promoted to major-general.\n\nBougrain strongly supports Delestraint's plans for the armoured forces, although he favours a more defensive conception of armoured warfare. He also supports greater initiative among officers and soldiers.\n\nProgressive in outlook and willing to adapt, Bougrain enthusiastically explores new technologies. He possesses a revanchist streak and supports the Ligue de la Jeune République.§!"
  CGFF_gabriel_bougrain_trait:0 "$CGFF$"
  FRA_gabriel_bougrain_trait:0 "Proponent of Coordinated Sustained Operations"

  FRA_antoine_bethouart:0 "Antoine Béthouart"
  FRA_antoine_bethouart_character_desc:0 "§YAffiliation:§! $party_LJR$ ($LJR_faction_2$)\n§YBorn:§! §L17 December 1889; Dole, Jura, French Republic§!\n§YBackground:§! §LMarie Émile Antoine Béthouart's family originated in the Marquenterre region of Picardy. His father was a registrar of mortgages, while his devoutly religious mother came from a family of civil servants. He attended the Jesuit-run Institution Sainte-Geneviève, where his classmates included Germain Foch and Jean de Lattre de Tassigny. In 1909, he entered the Fez class of the École spéciale militaire de Saint-Cyr alongside Charles de Gaulle, Alphonse Juin and Ernest Petit, spending one year attached to the 159th Alpine Infantry Regiment. Upon graduating in 1912, he was commissioned as a second lieutenant and became a platoon commander in the 152nd Infantry Regiment.\n\nBéthouart was promoted to lieutenant in 1914 and fought in Lorraine. In 1915, he transferred to the 7th Company of the 158th Infantry Regiment and participated in the First Battle of Artois. Severely wounded during the fighting at Notre-Dame-de-Lorette, he was evacuated to the rear. After recovering, he joined the staff of the 77th Brigade within the 39th Infantry Division. He was promoted to captain in 1916 and fought at Verdun in February and on the Somme in July. Transferred to the divisional staff in 1917, he participated in the Battle of the Chemin des Dames that April. He then volunteered to return to a frontline command, leading an assault company in the fighting along the Chevregny Ridge. When mutiny broke out, Béthouart brought it to an end through negotiation.\n\nHe participated in the Second Battle of Verdun in January 1918 and subsequently became a battalion commander in the 146th Regiment. Wounded at Mont Kemmel during the First Battle of the Lys in April, he returned to duty in late July and fought in the Second Battle of the Marne and First Battle of the Oise. In 1919, he participated in the battles of Compiègne, the Second Oise and Saint-Mihiel. He supported the armistice. His wartime decorations included the rank of Chevalier de la Légion d'honneur, the Croix de guerre with one palm and three stars, and the Médaille des blessés de guerre.\n\nAfter the war, Béthouart remained in Germany to oversee territorial transfers and the repatriation of prisoners of war. Returning home in May 1920, he chose to remain in the Commune and entered the École supérieure de guerre. After graduating in 1922, he joined the staff of the 12th Military Region and was promoted to major. He distinguished himself among the volunteers sent to assist Britain in 1924 and received promotion to lieutenant-colonel. In 1926, he assumed command of the 28th Bataillon de chasseurs alpins while serving as a professor at the Centre d'études militaires de montagne. He took command of the 5th Demi-Brigade de chasseurs alpins in 1928 and was promoted to colonel. In 1931, he became Assistant Chief of the General Staff with the rank of brigadier-general. He was promoted to major-general and appointed commander of the 12th Military Region in 1934.\n\nBéthouart has spent much of his career with mountain formations and is an expert in alpine warfare. He emphasises mobility, takes an interest in fast and flexible armoured formations, and advocates combined-arms operations and defence in depth.\n\nDeeply religious, Béthouart is upright, tolerant, humanitarian and exceptionally courageous. He is attentive to the rights of French citizens abroad, possesses keen political instincts and is an able diplomat. He supports the Ligue de la Jeune République.§!"
  CGFF_antoine_bethouart_trait:0 "$CGFF$"
  FRA_antoine_bethouart_trait:0 "Proponent of Coordinated Deep Operations"

  FRA_aime_doumenc:0 "Aimé Doumenc"
  FRA_aime_doumenc_character_desc:0 "§YAffiliation:§! $party_PSF$ ($PSF_faction_1$)\n§YBorn:§! §L16 November 1880; Grenoble, Isère, French Republic§!\n§YBackground:§! §LJoseph Édouard Aimé Doumenc was the son of a retired lieutenant-colonel who had served in the Franco-Prussian War. Educated at the Lycée de Grenoble, he entered the École polytechnique in 1898 on a school scholarship. Upon graduating in 1900, he continued his studies at the École d'application de l'artillerie et du génie in Fontainebleau. He graduated in 1902, was commissioned as a second lieutenant and joined the 2nd Mountain Artillery Regiment. He was promoted to lieutenant in 1905 and obtained a law degree from the Université de Grenoble during this period.\n\nDoumenc entered the École supérieure de guerre in 1907 and performed exceptionally well. In 1909, he remained at the school as an assistant instructor and joined Henri Mordacq's strategic-research group. After graduating in 1910, he completed a staff attachment with the 19th Army Corps, was promoted to captain and later served in Algeria. He transferred to the 60th Artillery Regiment in 1911 and was appointed a Chevalier de la Légion d'honneur in 1914.\n\nWhen the Weltkrieg began, Doumenc was seconded to the staff of the Sixth Army. His successful use of motor transport during a retreat earned him a regimental citation. He was hurriedly transferred to the Army Motor Transport Service as deputy director and organised the motor transport used during the First Battle of the Marne, receiving a brigade-level citation. He subsequently participated in the Race to the Sea and the major campaigns of 1915. In 1916, he organised the logistical transport supporting the Battle of Verdun and designed the Voie Sacrée, for which he received a distinction from the Légion d'honneur. That same year, he became technical adviser to Jean Estienne and assisted with tank design. Doumenc became Director of the Motor Transport Service in 1917, earned a doctorate in law and continued organising logistical support for operations throughout the war. He was promoted to lieutenant-colonel in 1919 and received another distinction from the Légion d'honneur. His wartime decorations included the Croix de guerre with two bronze stars and the rank of Commandeur de la Légion d'honneur.\n\nAlthough Doumenc expressed certain reservations after Pétain's coup, he continued organising logistics for the government forces until the end of the civil war. After the Revolution, he left the army to become general manager of the Société des forges et aciéries de la Seine in Paris. He was recalled to active service in 1924 and assigned to the Third Internationale's liaison office. In 1926, he additionally became artillery-coordination officer for the 1st Cavalry Division and was promoted to colonel. He became Director of the Fourth Bureau of the Army General Staff in 1929. In 1931, Doumenc was appointed Assistant Chief of the General Staff, promoted to brigadier-general and admitted to the Centre des hautes études militaires. He received promotion to major-general in 1935.\n\nDoumenc is an organisational genius and a master of logistics for large formations. He is also a pioneer of French combined-arms warfare, advocating battalion-sized formations integrating infantry, artillery and tanks. Strategically, he supports echeloned attacks in depth. His close relations with Russian officers have made him a leading representative of the French deep-operations school. Unlike Tukhachevsky, however, who emphasises initiative among field commanders, Doumenc remains committed to the methodical French tradition and insists upon centralised command.\n\nMild-mannered, dutiful and disinclined to quarrel, Doumenc enjoys mountaineering. He approves of the Parti Socialiste de France's methods of of government and supports Neo-Socialism, but rejects the politicisation of the armed forces.§!"
  CGFF_aime_doumenc_trait:0 "$CGFF$"
  FRA_aime_doumenc_trait:0 "Proponent of Deep Operations"

