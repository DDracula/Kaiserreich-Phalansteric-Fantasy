### Political Events
  fcf_politics_event.0.title.a:0 "The Comité général Passes the Bill"
  fcf_politics_event.0.title.b:0 "The Comité général Rejects the Bill"
  fcf_politics_event.0.desc.a:0 "After more than ten days of deliberation and several rounds of debate, the bill has finally secured the votes required for passage, despite encountering several obstacles along the way. Its supporters celebrate enthusiastically, hailing the legislation as another great victory on [FRA.GetNameDef]'s march toward socialism and justice. The opposition remains silent in protest, though they will doubtless spend the aftermath complaining to their colleagues or delivering speeches in some public square condemning the new law.\n\nWhatever the controversy, the proposal has passed by a simple majority. The Comité général de la Fédération will authorize its implementation, while the Comité de salut public will undertake the practical work. It is no longer a disposable sheet of paper that a delegate might cast aside at whim, but a solemn law protected by the constitution. Before long, it may transform society as a whole."
  fcf_politics_event.0.desc.b:0 "After more than ten days of deliberation and several rounds of debate, the proposal has failed to secure the votes required for passage. This controversial bill has therefore been rejected and cannot be introduced again until the prescribed waiting period has elapsed. Most of its supporters appear dejected. A few particularly fervent advocates mount the rostrum and demand a recount, but their efforts accomplish nothing. The opposition, by contrast, relaxes and begins chatting with colleagues about the ordinary affairs of home and family. This time, victory belongs to them.\n\nWhatever anyone may say, rejection remains rejection, and neither resentment nor denunciation can alter the result. Supporters maintain that society has squandered an opportunity for progress, while opponents insist that the proposal ran entirely contrary to society's needs. The argument continues long after the vote has concluded. One thing, however, appears certain: society may not yet be ready for such a law."
  fcf_politics_event.0.a:0 "Wonderful! What a glorious day!"
  fcf_politics_event.0.b:0 "Come now, stop looking so miserable and have a drink!"

  fcf_politics_event.1.title:0 "The Cartographer"
  fcf_politics_event.1.desc:0 "If one were to ask what had kept the young cartographer Haussmann tossing and turning for several nights, the answer would be neither an unverified place name nor a frontier he had failed to draw in time. It was the map he was shortly expected to deliver. The deadline was fast approaching. Mountains, rivers, cities, and railways had all found their places upon the page, yet the territory of the French Federation of Communes remained entirely uncoloured. Haussmann had raised his brush several times but could not decide which pigment it ought to bear.\n\nBlue had belonged both to the kingdom and to the Republic. Across countless maps, it had become inseparable from the outline of France. But if France remained blue, how could the map express the revolution that had transformed the country? How could a reader recognize at a glance that the old Republic had ceased to exist? Red was the colour of the workers' movement, the Commune, and the revolution. Yet if all of France were painted red, might it lose its own identity and become merely another indistinguishable block upon the map of world revolution?\n\nThis seemingly trivial question troubled him for a long while. Blue carried the history of France, while red proclaimed the ideals of the Federation. The former rooted the revolution in this particular country; the latter invested that country with a new meaning. Only at dawn on the first day of the new year, when the first rays of sunlight entered his studio and illuminated both the pigments upon his desk and the still-colourless country on the map, did Haussmann finally take up his brush again. Whether he chose blue or red, the land he depicted would remain France. The only question was by which colour the world should henceforth recognize it.\n\nIn the end, he chose..."
  fcf_politics_event.1.a:0 "Blue is the colour of France."
  fcf_politics_event.1.b:0 "Red is the colour of revolution."

  fcf_politics_event.2.title:0 "The Lyon Region Recalls Its Delegates"
  fcf_politics_event.2.desc:0 "The Lyon District Council has decided to recall its delegates to the Comité général de la Fédération, removing several representatives sympathetic to the establishment. According to rumours circulating throughout the region, their replacements are opponents of the establishment who resent both the CGT and the government's policy of compromise. The motion of no confidence against Du Maurier can consequently expect several more votes in its favour."
  fcf_politics_event.2.a:0 "It seems this government is doomed to fall."

  fcf_politics_event.3.title:0 "A Replacement Candidate"
  fcf_politics_event.3.desc:0 "Appointment as a departmental member of the Comité de salut public is undoubtedly among the greatest opportunities available to any citizen seeking to fulfil their political ambitions. Yet obtaining a seat upon the committee offers no guarantee of security. Quite the contrary: countless people covet such a position. If an officeholder fails to satisfy the public—or, more commonly, fails to satisfy the demands of the majority coalition in the Comité général de la Fédération—they may swiftly be replaced by another ambitious candidate."
  fcf_politics_event.3.a:0 "Begin the vote."
  fcf_politics_event.3.b:0 "Forget it."
  fcf_politics_event.3.c:0 "The decision has already been made."

  fcf_politics_event.4.title:0 "The PCOP Reaffirms Its Alliance with the UA"
  fcf_politics_event.4.desc:0 "If any political force can threaten the governing coalition in the approaching election, it is unquestionably the electoral alliance between the Parti communiste ouvrier et paysan and the Union anarchiste. Few imagined that the Guesdists could ever unite with the anarchists. Faced with a common enemy, however—and having already cooperated during the 1934 Affaire Martin against the CGT—the two organizations at opposite ends of the Commune's political spectrum have joined forces to challenge the governing position of the Parti ouvrier unifié and the Confédération générale du travail.\n\nMany naturally question how two organizations with such different objectives can devise a common electoral message, let alone reconcile their incompatible demands should they enter government. For the moment, they have concentrated upon denouncing the CGT's monopoly and bureaucratic tendencies. This strategy has indeed attracted considerable support among those dissatisfied with the incumbent government."
  fcf_politics_event.4.a:0 "Have the dragon-slayers become the dragon?"
  election_win_trigger_tt:0 "If their combined representation in the $CGF_name$ exceeds an absolute majority (325 seats) when the election concludes, they will be able to form a government"
  election_alliance_PCOP_UA:0 "During this election, $party_PCOP$ and $party_UA$ will form an electoral alliance\n$election_win_trigger_tt$"

  fcf_politics_event.5.title:0 "New Allies for the Parti socialiste français"
  fcf_politics_event.5.desc:0 "Jacques Doriot of the Parti socialiste français has announced that the Parti agraire et paysan français will stand alongside the Socialists in the forthcoming election. The close relationship between Doriot and the Agrarian leader Henri Dorgères is common knowledge, but whether their respective parties are equally compatible remains uncertain. Adrien Marquet has expressed his satisfaction in Bordeaux, where a parade celebrating the alliance between the Socialists and Agrarians has proceeded along the city's principal avenue. Supporters of the Agrarian party provided every flower required for the occasion.\n\nSince the Bordeaux economic miracle, the Parti socialiste français has escaped the shadow of its former existence within the Section française de l’Internationale ouvrière and re-established itself as a major force in French politics. A substantial group sympathetic to the Socialists has even emerged within the CGT, and rumours suggest that CGT chairman Léon Jouhaux himself has developed an interest in the party. Radical workerists, on the other hand, accuse the Socialists of attempting to restore the capitalism of the old Republic, while their former comrades in the PCOP also view them with considerable hostility. Nevertheless, the Parti socialiste français will unquestionably be another formidable contender in the approaching election."
  fcf_politics_event.5.a:0 "Doriot has certainly stolen the limelight."
  election_alliance_PSF_PAPF:0 "During this election, $party_PSF$ and $party_PAPF$ will form an electoral alliance\n$election_win_trigger_tt$"

  fcf_politics_event.6.title:0 "Thorez Emphasizes the Popular Front and Unity"
  fcf_politics_event.6.desc:0 "The Parti ouvrier unifié does not claim a “manifest destiny” to lead every French citizen merely because it made the greatest contribution to the revolution. It has attempted to transform itself from a revolutionary movement into a governing party. Radicals both within and beyond the party inevitably condemn this change, but revolution and government are two different undertakings. Public affairs cannot be administered through the methods of insurrection, and the party has already suffered for trying.\n\nYet its critics' accusations are not without foundation. The Affaire Martin has torn away the final veil concealing the relationship between the Parti ouvrier unifié and the CGT. Growing numbers now denounce the corruption and incompetence of the incumbent government, while party secretary Maurice Thorez can do little more than placate public anger as best he can. Since the Popular Front government was formed after the previous election, the Comité syndicaliste révolutionnaire has consistently accused him of excessive compromise. Although Thorez enjoys Jouhaux's support, Jouhaux himself may no longer be capable of containing the rise of the revolutionary syndicalists within the CGT.\n\nAll Thorez can do now is once again emphasize the virtues of unity and stability. These appeals offer nothing new to those who already support the Popular Front and carry no weight among opponents of the establishment. The Parti ouvrier unifié can only hope that politically uncommitted centrist voters recognize the benefits delivered by five years of Popular Front government and choose to support it once again. Otherwise, the party may soon lose its dominant position."
  fcf_politics_event.6.a:0 "A Popular Front must first have the people behind it."
  election_alliance_POU_CGT_URSRS_LJR:0 "During this election, $party_POU$, $party_CGT$, $party_URSRS$, and $party_LJR$ will form an electoral alliance\n$election_win_trigger_tt$"

  fcf_politics_event.7.title:0 "Monatte Announces the Election"
  fcf_politics_event.7.desc:0 "As the supreme institution of the French Federation of Communes, the Comité général de la Fédération is renewed through local communal elections held every five years. The local councils elected at the grassroots subsequently elect the district councils, which may determine for themselves who will represent them in the Comité général throughout the ensuing five-year term. Under the constitution, a district council may recall any of its delegates to the Comité général. Consequently, although the general election itself comes to an end, the membership of the Comité général may continue to change throughout the following five years. Any replacements must, of course, be selected from among the members of the relevant joint district council. The election to the Comité général is therefore better understood as a series of local council elections intended primarily to renew political life at the grassroots. The Comité général itself is ultimately only the institution in which those results become visible."
  fcf_politics_event.7.a:0 "Let the election begin!"

  fcf_politics_event.8.title:0 "A Socialist Landslide in Bordeaux"
  fcf_politics_event.8.desc:0 "Adrien Marquet has served as mayor of Bordeaux for several years, during which the city has achieved the fastest economic growth anywhere in France. Bordeaux's infrastructure and urban planning have likewise advanced far beyond those of the average French municipality. The economic miracle has drawn a large population into the suburbs, yet unlike Paris and other major cities, Bordeaux has not experienced a corresponding rise in crime or instability. On the contrary, it has long ranked among the safest communities in the Federation.\n\nOne important cause of Bordeaux's prosperity has undoubtedly been the uninterrupted administration of the Parti socialiste français. Unlike other French municipalities, Bordeaux has not been subjected to one economic reorganization after another. Following the restoration of diplomatic relations with the United States, it was also among the first communes to invite American enterprises to invest. This provided Bordeaux with far greater resources than most other communes, while also exposing it to persistent accusations of compromising with capitalism.\n\nThe Socialists have never attached much importance to abstract ideological questions, and the present result suggests that the people themselves may care little about the ideology of those who provide them with bread and liberty. The party already exercised a firm grip upon the local council, but this election has swept its remaining opponents from the chamber entirely. Such a comprehensive monopoly has naturally provoked criticism. Some allege that Doriot's Groupes d’assaut intimidated voters into withholding their support from non-Socialist candidates. Speculation, however, cannot alter the final composition of the Bordeaux council. The Socialists have secured complete control of one of France's great cities."
  fcf_politics_event.8.a:0 "They have earned it."
  fcf_politics_event.8.b:0 "Comrade Marquet played an indispensable role."

  fcf_politics_event.9.title:0 "A Speech at Les Invalides"
  fcf_politics_event.9.desc:0 "Since the end of the Weltkrieg and the civil war, Les Invalides has continued to shelter disabled veterans. The heroes who have lost the ability to support themselves may spend the latter half of their lives here in relative comfort. Yet for the much greater number of ordinary soldiers left disabled by the wars, avoiding admission to Les Invalides is almost a distinction in itself. Those enclosed within this great prison enjoy tranquillity, but forever lose the ability to continue transforming the world beyond its walls.\n\nNevertheless, some have never forgotten them. The flesh they sacrificed for France and the blood they shed for the revolution have not been left to haunt the grounds surrounding Les Invalides. Although the former Association républicaine des anciens combattants has divided, both the Association fédérale des anciens combattants and the Légion des soldats révolutionnaires continue to pursue the same objective: ensuring that the nameless are remembered. Political stars may rise and fall across the Federation, but these veterans recognize only one sun—Georges Gressent. His reputation as one of the men who launched the revolution would be imposing enough, yet as the direct inheritor of Georges Sorel's theories, Gressent has never intended to stop at the revolution's beginning.\n\nDuring the civil war, Gressent protected the Left's publishing network from the restrictions of martial law. After the revolutionary victory, his intact presses allowed the Légion des soldats révolutionnaires to transform rapidly into the principal voice of former servicemen. Unlike the Association fédérale des anciens combattants, which is closely associated with the Parti ouvrier unifié, Gressent has consistently maintained his distance from every political faction. His publishing network consequently accepts commissions from every party. The Imprimerie ouvrière cooperative has risen swiftly to become one of the brightest stars of the postwar French publishing industry. Beyond political newspapers, a broad range of nonpolitical material also depends upon Gressent's presses. If he so desired, he could direct public opinion wherever he wished.\n\nFor many years, however, Gressent remained outside electoral politics. The Confédération nationale-syndicaliste had existed for some time but did not enter the Comité général de la Fédération until 1931. What prompted his change of course remains uncertain, but since emerging from behind the scenes, he has presented himself unmistakably as a leader: dignified and solemn, as though he were an Augustus of ancient Rome.\n\nToday, Gressent has deliberately chosen Les Invalides—a place of unique significance to France's soldiers—as the site of his address. The surging crowd is composed not merely of veterans, but of vigorous young people, priests in formal dress, unshaven workers, and women carrying infants. All have been drawn here by Gressent, and he does not disappoint them. His speech continues for four hours and ends only as dusk settles over Paris."
  fcf_politics_event.9.a:0 "The Confédération nationale-syndicaliste offers another path."

  fcf_politics_event.10.title:0 "Echoes from Central France"
  fcf_politics_event.10.desc:0 "While the whole of France concentrated its reconstruction upon the north, central France was left to tend its wounds in silence. The region had not suffered direct physical destruction, but the wartime requisition of young labourers and draught animals had paralysed a countryside dependent upon human and animal strength. Women were forced to perform the work of men and even of livestock while continuing to care for their families. Shortages of fertilizer and labour reduced once-productive agricultural regions to little more than subsistence, while federal reforms intended to resolve France's broader food crisis subjected these farmers to still further disruption.\n\nThe peasantry has consequently remained among the incumbent government's most implacable opponents. It has little affection for the Parti ouvrier unifié or the CGT, both of which are seen as representing the urban worker. The dramatic rise of the Parti communiste ouvrier et paysan owes much to its loyal following as an established political party, but it has depended equally upon discontented rural farmers and the rapidly expanding population of former peasants driven into the towns by failed agricultural policies.\n\nMany farmers nevertheless prefer the Catholic Ligue de la jeunesse républicaine because of their own religious convictions. This is also partly a consequence of the Popular Front strategy, which has somewhat improved rural attitudes toward the government. More radical peasants instead support the Parti agraire et paysan français. Established only after the revolution, the party quickly secured a substantial presence in the Comité général de la Fédération. Its affiliated Comités de défense paysanne, popularly known as the Chemises vertes, remain controversial, though they have not yet appeared in any criminal proceedings. Freedom of association permits them to continue operating throughout the Federation, and this organizational model may be one of the principal reasons for the party's rapid expansion. Doriot frequently boasts that the Chemises vertes were inspired by his own example, although they have plainly not acquired anything resembling the notoriety of his Groupes d’assaut.\n\nThe political inclinations of the peasantry are therefore relatively predictable. They may support the anti-establishment PCOP, the Catholic Ligue de la jeunesse républicaine, or the explicitly agrarian Parti agraire et paysan français. As war widows or relatives of former servicemen, however, some may also be attracted to Gressent's Confédération nationale-syndicaliste."
  fcf_politics_event.10.a:0 "The PCOP may be the party most attentive to the peasantry."
  fcf_politics_event.10.b:0 "The Popular Front strategy was unquestionably correct."
  fcf_politics_event.10.c:0 "The peasants must stand together."
  fcf_politics_event.10.d:0 "Gressent will bring us comfort."

  fcf_politics_event.11.title:0 "A Renaissance in the Northwest"
  fcf_politics_event.11.desc:0 "The Breton national movement emerged in response to the old Republic's policy of forcibly assimilating Brittany. Following the revolution, we put federalist principles into practice, and most of Brittany obtained autonomy—though in constitutional terms, this autonomy is no different from that enjoyed by communes elsewhere. Once a people acquires sufficient freedom of expression, a long-suppressed culture will naturally reassert itself. Brittany is now experiencing what may be its greatest cultural flourishing in centuries, but this is no mere reenactment of ancient Celtic traditions. The Breton national movement has aligned itself naturally with the Left, embraced new artistic forms, and sought to overturn the traditional French image of Brittany as backward, savage, and artistically barren.\n\nVarious avant-garde movements have fused with Breton traditions, most importantly the Surrealist movement now sweeping across France. The Bretons rank among the most radical people in the country outside the universities—though in another sense they may also be among the most conservative. Brittany remains France's most devoutly Catholic region. Although its inhabitants offer little resistance to secular government, Catholicism has become inseparable from Breton culture.\n\nPeasants predominate throughout Brittany and have long resented federal policies perceived as favouring industrial workers. They consequently incline toward the Agrarian party, which openly champions their interests. Popular Front rule has somewhat softened Breton hostility toward the authorities, and some centrist voters still believe political stability must precede all other reforms. Yet growing numbers of Bretons have begun supporting their compatriot Marcel Cachin and his Parti communiste ouvrier et paysan. As the families of soldiers who bled and died in the Weltkrieg, they are likewise drawn toward Gressent—particularly since he, too, supports a privileged position for Catholicism."
  fcf_politics_event.11.a:0 "Agriculture is the foundation of Brittany."
  fcf_politics_event.11.b:0 "Comrade Cachin is our pride."
  fcf_politics_event.11.c:0 "Catholicism binds us together."
  fcf_politics_event.11.d:0 "The Popular Front will reap its reward."

  fcf_politics_event.12.title:0 "The New Workers"
  fcf_politics_event.12.desc:0 "The largest new political constituency to emerge since the revolution consists unquestionably of the former peasants driven into the towns by the failure of early agricultural policy. Their conflict with the established workers is readily apparent, particularly over the question of the CGT, and they consequently constitute the strongest force opposing the union confederation. Their lingering attachment to the countryside also fosters a natural aversion toward the great cities. Combined with resentment of the established workers, this feeling has driven them inevitably toward the anti-establishment camp. The new government's Popular Front strategy produced some improvement, but the subsequent Affaire Martin tore open the poorly concealed division between the new and established working classes.\n\nThe expression “labour aristocracy” is commonly used by the new workers to mock CGT members and metropolitan labourers. Both the Parti communiste ouvrier et paysan and the Union anarchiste have embraced the phrase as evidence that the revolution has degenerated or remains incomplete. Neither party uses it too openly, however, since many metropolitan labourers classified among the established workers can hardly be described as a labour aristocracy. Moreover, those same metropolitan workers remain an important source of support for both anti-establishment parties.\n\nThe conflict between the new and established workers is also a conflict between the emerging town-and-countryside communities and the great cities. The former consist of the new workers and the rural kinship networks to which they remain closely connected; the latter invariably appear in this narrative as the monstrous villain of a traditional struggle between friend and foe. Metropolitan politics is far more complicated than these new workers imagine, but they nevertheless regard the great cities as the direct source of their unequal circumstances—and in practice, not entirely without reason.\n\nCounterintuitively, these workers are not particularly sympathetic to federalism. The explanation is relatively straightforward: local autonomy allows prosperous communes to preserve their advantages while leaving communities without development opportunities neglected. A stronger federal government can instead use transfer payments to restrain regional inequality. This has also given the Parti socialiste français a measure of support among the new workers."
  fcf_politics_event.12.a:0 "Bring down the “labour aristocracy”!"
  fcf_politics_event.12.b:0 "Unequal development must be brought under control."
  fcf_politics_event.12.c:0 "We were soldiers once, and that identity will never leave us."

  fcf_politics_event.13.title:0 "A Chorus of La Marseillaise"
  fcf_politics_event.13.desc:0 "Since the revolution, there has been continuous debate over whether La Marseillaise or L’Internationale should serve as the anthem of the new regime. Radicals argued that continuing to use a song inherited from the old Republic appeared insufficiently revolutionary, but the moderates ultimately prevailed. La Marseillaise remains the French national anthem, while L’Internationale has become the Federation's “second anthem.” The lyrics of La Marseillaise have nevertheless been revised to resemble La Marseillaise de la Commune rather than simply retaining the version used by the old Republic.\n\nAlthough La Marseillaise was composed in Strasbourg, the people of Marseille display far greater enthusiasm for it. The song can be heard during every festival and even at ordinary public gatherings. Had it ceased to be France's national anthem, Marseille would undoubtedly have adopted it as the city's own. Fortunately, no such choice was required. The people of Marseille continue to sing the anthem—even, and perhaps especially, when travelling abroad.\n\nAfter the civil war, some of the soldiers who had departed from Marseille continued onward to assist the revolution in Italy. Once the Italian situation stabilized, the city became a gathering place for veterans and workers of Italian origin. Even before the war, Marseille's unions had maintained greater independence from the CGT than those elsewhere. When the conflict began, they opposed the war rather than embracing the Union sacrée. Since the revolution, Marseille has consequently occupied a relatively independent political position. Neither the Parti ouvrier unifié nor the CGT has established a dominant presence there. Since the Confédération nationale-syndicaliste entered electoral politics, the city has instead become one of its safest sources of seats in the Comité général.\n\nThe streets of Marseille were equally tumultuous during the demonstrations surrounding the Affaire Martin. This election has produced the city's most enthusiastic turnout since the revolution. Its citizens celebrate the collapse of their former illusions regarding the CGT and now seek salvation for their revolution in a movement embodying both the soldier and the revolutionary. This Mediterranean enthusiasm is not merely a product of temperament. The rivalry between Marseille and Paris extends far into the past. Even after the revolution, when Paris should theoretically have become a commune equal to Marseille, the concentration of federal institutions there guaranteed it a special position. The people of Marseille have never had patience for the games of the “gentlemen of Paris.” Such men may deceive the country bumpkins around them, but they will not deceive Marseille."
  fcf_politics_event.13.a:0 "Old soldiers never die, and neither does the revolution!"
  fcf_politics_event.13.b:0 "The CGT betrayed us during the Weltkrieg!"

  fcf_politics_event.14.title:0 "Across the Channel"
  fcf_politics_event.14.desc:0 "On clear days, the white cliffs of Dover can be seen from the coast of Calais. British newspapers, merchandise, and political rumours arrive continually with the ferries, while dockworkers, sailors, and railwaymen habitually compare wages, trade unions, and public administration on the two sides of the Channel. Since the British Revolution, these everyday exchanges have acquired a new political significance. Both shores now belong to the revolution, but each has followed a different path.\n\nCalais embraced Guesdism long before the Federation was established. The tightly organized workers' movements of its mining districts and port towns have consistently supported the creation of a unified workers' party capable of directing political action through strict discipline. Following the revolution, the Parti communiste ouvrier et paysan inherited this local tradition. Its demands for stronger federal coordination and political leadership by the party have consequently enjoyed reliable support throughout the region.\n\nYet Britain, lying just across the Channel, offers an alternative example. British trade unions participate more directly in national government and coordinate local and industrial affairs through nationwide organizations. As the election approaches, arguments are spreading through the taverns, workers' lodgings, and docks of Calais. Should the region remain faithful to its Guesdist political tradition, or should it learn from the British comrades and adopt another form of workers' politics?"
  fcf_politics_event.14.a:0 "We stand with Comrade Cachin."
  fcf_politics_event.14.b:0 "There are lessons to be learned from the British model."

  fcf_politics_event.15.title:0 "The Old Trenches of Verdun"
  fcf_politics_event.15.desc:0 "Nearly twenty years have passed since the end of the Weltkrieg, but around Verdun the war has never truly receded. Weeds cover the collapsed breastworks, rainwater fills the shell holes, and farmers still unearth rusting coils of barbed wire from the soil. The town has long since been rebuilt, yet its cemeteries, ruins, and bereaved families continue to remind everyone that France sacrificed an entire generation here—and after defeat, lost everything the promised victory was meant to secure.\n\nThe revolution transformed Verdun but could not erase its wounds. Abandoned barracks became housing and sanatoriums, military warehouses became local cooperatives, and restored railways brought workers and goods back into this frontier city. Commemorative ceremonies once presided over by generals and politicians are now organized by veterans, trade unions, and the local council. The bombastic inscriptions upon the monuments have gradually faded, but the names of the dead are still cleaned again and again.\n\nWith the federal election approaching, every party has come to these old trenches. Some point eastward and proclaim that only by avenging the humiliation of defeat can France honour those buried here. Others present Verdun as a warning to all Europe and argue that whichever side begins another war must be treated as an enemy by workers everywhere. Some insist that France cannot live forever in the shadow of the trenches and should devote its strength to building a future in which such fortifications are no longer required. To others, the sacrifice, poverty, and devastation reveal that the transformation of the old world remains incomplete.\n\nThe same ground bears different memories and leads toward different futures. Verdun has already made one sacrifice. Now it must make another choice."
  fcf_politics_event.15.a:0 "We shall avenge Verdun."
  fcf_politics_event.15.b:0 "Whoever destroys the peace is our enemy."
  fcf_politics_event.15.c:0 "Look to the past and gain nothing. Look to the future and lose nothing."
  fcf_politics_event.15.d:0 "Everything here cries out for change."

  fcf_politics_event.16.title:0 "Herriot's Municipal Socialism"
  fcf_politics_event.16.desc:0 "In Lyon, socialism has not always arrived to the sound of strike whistles beneath the banners of the trade unions. Long before the revolution, Édouard Herriot's Parti républicain, radical et radical-socialiste governed the municipality for many years. Herriot had no intention of surrendering the city government to the industrial unions, nor did he wish to await a complete social transformation. Instead, he used elections, public budgets, and municipal institutions to improve ordinary lives one practical measure at a time. This path, known as “municipal socialism,” may not have been particularly radical, but it left marks upon Lyon far more tangible than any political slogan.\n\nUnder Herriot, the municipality constructed schools, hospitals, public baths, and affordable housing, improved transport and urban sanitation, and treated culture and sport as indispensable elements of civic life. Libraries, theatres, and sporting facilities opened throughout the city, while Lyon's industrial prosperity was converted into comparatively comprehensive public services. The trade unions did not become the centre of municipal authority, but workers benefited nonetheless. Local enterprises retained room to operate, though they were required to comply with public standards imposed by the municipality. The revolution altered Lyon's political system without entirely changing how the city governed itself.\n\nEvery party now attempts to find evidence for its own programme in Lyon's accomplishments. The Radical Socialists declare them the product of practical cooperation among different currents of the Left in service of the people. The Socialists argue that public ownership, social welfare, and democratic municipal government were simply the local expression of their gradualist socialism. For those tired of the CGT intervening in everything, Lyon demonstrates something else: a city need not be surrendered to the unions in order to construct a public life belonging to its workers."
  fcf_politics_event.16.a:0 "This is what the Popular Front should be!"
  fcf_politics_event.16.b:0 "This proves the success of the Socialist model."
  fcf_politics_event.16.c:0 "This is what can be achieved without the CGT."

  fcf_politics_event.17.title:0 "Life on the Frontier"
  fcf_politics_event.17.desc:0 "From the foothills of the Pyrenees to the valleys of the Alps, frontier communities lead lives profoundly different from those of the cities upon the plains. Rugged mountain roads separate neighbouring villages, while a single snowstorm or flood can sever communications entirely. Schools, clinics, and cooperatives have been established, but insufficient funding and chronic personnel shortages frequently leave them unable to function. The federal frontier may lie just beyond the next ridge, yet to the local population Paris appears more distant than any foreign city.\n\nConditions also differ between the two mountain regions. Many villages in the Pyrenees continue to depend upon smallholdings, pastoralism, and forestry, while their young people steadily depart in search of employment elsewhere. Some Alpine valleys have prospered through hydroelectricity, mining, and tourism, but this development has only made communes with fewer resources more conscious of the inequalities separating them from their neighbours. By entrusting public services to the local authorities, the Federation allows wealthy regions to improve their own living conditions while leaving the poorer mountains trapped in a cycle of broken roads, limited industry, and depopulation.\n\nAs the election approaches, party representatives arrive in the mountains bearing different answers. Some promise to repair the roads and provide the clinics and schools with adequate resources, rebuilding local life through one practical measure after another. Others contend that the mountain regions merely reflect an imbalance afflicting France as a whole and cannot be rescued through piecemeal repairs. Still others propose hydroelectric development, railways, and new industries through which the valleys might escape isolation and poverty. The mountain communities have heard more than enough grandiose plans. What they wish to know is which road will actually reach their door."
  fcf_politics_event.17.a:0 "Empty promises solve nothing. Practical work will."
  fcf_politics_event.17.b:0 "The backward regions need change—and so does all France."
  fcf_politics_event.17.c:0 "The problems of development can only be solved through development."

  fcf_politics_event.18.title:0 "A Song of Paris"
  fcf_politics_event.18.desc:0 "An old Parisian theatre has recently staged a new production written by Vitrac and directed by Artaud. It possesses neither a coherent plot nor a fixed protagonist. A barricade rises slowly from the centre of the stage, only to transform without warning into the gears of a factory. A faceless crowd forces its way into the Métro before emerging in formation from the Seine. An enormous pendulum sweeps above the audience while the actors repeatedly sing the same wordless melody to the accompaniment of whistles, drums, and roaring machinery. In the final scene, shattered streets, chimneys, monuments, and crowds overlap one another to form a Paris that continues to breathe.\n\nWhen the performance ends, no one can say with certainty what they have witnessed. Some remember how the conflicting voices ultimately combined into a single chorus. Others see only the repeated collapse of everything upon the stage, as though the entire city were waiting to be remade. Some are captivated by the strange spectacle of trains, lights, and machines and believe they have glimpsed the approaching future. Others are overwhelmed by the Paris that rises from the ground in the final scene and hear the vast echo of a city extending from the age of the barricades into the present.\n\nThe audience pours into the streets carrying its many interpretations, while the wordless melody continues to reverberate in every ear."
  fcf_politics_event.18.a:0 "I heard unity."
  fcf_politics_event.18.b:0 "I heard change."
  fcf_politics_event.18.c:0 "I heard progress."
  fcf_politics_event.18.d:0 "I heard greatness."

  fcf_politics_event.19.title:0 "Two Different Days"
  fcf_politics_event.19.desc:0 "The morning whistles sound first in Lille and then across the frontier. Textile workers on either side enter similar mills and breathe the same choking coal smoke, yet their daily lives are not quite alike. In Belgium, workers remain subject to factory owners, landlords, and the Church. In Lille, schools, clinics, public baths, and affordable housing have gradually become public services administered by the commune. The two regions lie only a few dozen kilometres apart, but the revolution has drawn a clear boundary between their everyday lives.\n\nNevertheless, the transformation of Lille has been far less dramatic than that of Lyon. The destruction left by the Weltkrieg has not been completely repaired. Overcrowded workers' courtyards remain commonplace, while the decline of the textile industry has placed municipal finances under severe strain. Roger Salengro has attempted to improve housing, sanitation, and education through the communal council, but no local budget can independently resolve unemployment, industrial restructuring, and uneven regional development. In this city with deep Guesdist roots, municipal socialism has demonstrated that public authority can improve people's lives while also exposing the limits of local reform.\n\nSome continue to see this as a path distinct from trade-union politics: an incomplete reform is not therefore a worthless one. The Neosocialists offer another interpretation. If limited municipal intervention has already produced results, it should be expanded across France, with a powerful federal authority coordinating industry, employment, and public construction. Municipal socialism confined to individual towns and cities is merely an unfinished beginning."
  fcf_politics_event.19.a:0 "Salengro has demonstrated another possibility."
  fcf_politics_event.19.b:0 "The incomplete can never equal the whole."

  fcf_politics_event.20.title:0 "The “German's” Ballot"
  fcf_politics_event.20.desc:0 "In the Champagne countryside, everyone refers to the Vogt family as “the Germans.” Émile's parents came from Alsace on the opposite bank of the Rhine. They left their homeland before he was born and eventually established a small farm here. The family speaks French with a German accent, and a faded map of Alsace still hangs beside the hearth. Yet Émile himself knows only Champagne's vineyards, muddy country roads, and the neighbours' half-jesting nickname.\n\nÉmile happened to be born just before the age cut-off and has consequently received the franchise earlier than his friends born after the revolution. Although they cannot yet enter a polling station, his companions discuss politics with far greater enthusiasm than he does. One reminds him that the schools, clinics, and roads constructed by the Popular Front have genuinely transformed life on the farm. Another insists that the principles trusted by generations of villagers cannot be mistaken. A mechanically minded friend describes tractors, electric pumps, and modern harvesters, promising that technology will eventually free the peasantry from unending toil. Yet another points to the Vogt family's old map and asks whether Émile does not wish to see his parents' lost homeland returned to France.\n\nÉmile remains undecided on the night before the vote. His mother does not choose for him. After putting away the farm tools, she merely tells him that he may listen to the wishes of his neighbours, the arguments of his friends, and the memories of his parents. But since the ballot bears his own name, the final choice must follow his own conscience."
  fcf_politics_event.20.a:0 "The Popular Front truly has changed our lives."
  fcf_politics_event.20.b:0 "I should remain faithful to what my neighbours hold dear."
  fcf_politics_event.20.c:0 "Technological development could spare Mother some of her labour."
  fcf_politics_event.20.d:0 "I still remember the homeland I have never seen."

  fcf_politics_event.21.title:0 "The Reluctant Citizen"
  fcf_politics_event.21.desc:0 "Adèle Giraud's first ballot as an adult soon becomes the cause of a family quarrel. Her father is a veteran CGT worker in Lyon who participated in the revolution and has always regarded voting as a duty that every worker must fulfil. Adèle, however, has grown tired of hearing stories about his past. To her, every party offers the same fine words, and casting a ballot for one or another will not alter her life. Her father erupts in anger. He accuses her of enjoying the rights created by the revolution while refusing to accept the responsibilities of citizenship and orders her to return to her room and reconsider.\n\nAdèle locks herself inside. It is late at night before her mother gently opens the door. She speaks neither of the revolution nor of the CGT and class struggle. Instead, she reminds her daughter that the ballot is neither a debt owed to her parents nor a gift offered to any party. Her father is angry because he remembers a time when ordinary people possessed no choice. Yet possessing that choice does not oblige Adèle to follow his path forever. She may listen to her parents or doubt every established answer, but she must not mistake indifference for independence.\n\nAfter her mother leaves, Adèle seriously examines for the first time the pamphlets she had casually discarded upon her desk. Her father's generation overthrew the old world, while her mother has taught her how to exercise her own judgment within the new one. By the time the sky begins to brighten beyond her window, she finally knows where to place her ballot."
  fcf_politics_event.21.a:0 "Perhaps Father is right."
  fcf_politics_event.21.b:0 "Mother always has her own kind of wisdom."
  fcf_politics_event.21.c:0 "Our parents' revolution is over, but ours has yet to begin!"

  fcf_politics_event.22.title:0 "Schadenfreude"
  fcf_politics_event.22.desc:0 "Since Black Monday, the news arriving from beyond the Rhine has grown worse with every passing day. Stock exchanges have closed, crowds surround the banks, and factories cease production one after another. The mark, the government bonds, and the industrial trusts that once sustained German hegemony appear to have lost all credibility overnight. German newspapers desperately urge the population to remain calm, while almost no one in the streets of Paris conceals their delight. The empire that ruled Europe through war and capital has finally been crushed beneath the weight of its own prosperity.\n\nEvery party has swiftly carried Germany's disaster onto the platform. Some declare that the German workers' movement sealed its fate when it abandoned revolution and submitted to the imperial order, condemning itself to bear the present cost alongside the bourgeoisie. Others believe that unemployment and hunger will eventually drive the German workers back to the barricades, turning Black Monday into the beginning of a new world revolution. Still others blame the crisis upon Germany's one-sided pursuit of industrial expansion, overseas markets, and military hegemony, arguing that a mistaken path of development must inevitably generate one greater mistake after another. In the most impassioned speeches, bankers, Junkers, and industrial magnates are condemned together: German finance capital has finally been strangled by the chains of its own creation.\n\nNo one knows what Germany's disorder will ultimately produce. For the moment, however, the French prefer to regard it as long-delayed retribution. The speakers offer different explanations, but the laughter of their audiences sounds remarkably alike."
  fcf_politics_event.22.a:0 "This is the price of betraying the working class."
  fcf_politics_event.22.b:0 "The opportunity for world revolution has arrived."
  fcf_politics_event.22.c:0 "A mistaken course of development produces one mistake after another."
  fcf_politics_event.22.d:0 "German finance capital is reaping what it sowed."

  fcf_politics_event.23.title:0 "A Majority Government"
  fcf_politics_event.23.desc:0 "The results of the appointments made by the joint councils have arrived in Paris one after another, and the distribution of seats in the new Comité général de la Fédération has finally been settled. After several days of calculation, one electoral alliance has successfully crossed the threshold of an absolute majority. Its supporters pour into the streets to celebrate, while telegrams pass between party offices throughout the night. At least numerically, the Federation will not have to confront a fragmented chamber in which no one possesses the authority to lead.\n\nYet electoral victory has not itself produced a new Comité de salut public. The parties within the alliance must still agree upon a governing programme, coordinate their claims to the various offices, and decide how they will present themselves during the approaching votes. Their majority has given them the initiative without eliminating the differences among them. Every internal negotiation may now shape the politics of the Federation for years to come.\n\nSome believe that the voters have made an unambiguous choice and that the alliance should remain united, using its existing majority to implement its common programme. Others argue that victory provides an opportunity to approach friendly forces elsewhere in the chamber: since a majority has already been secured, the government might as well seek broader support for the future. The Comité général has been constituted, but the struggle over the Comité de salut public has only just begun."
  fcf_politics_event.23.a:0 "The beginning of another victory."
  fcf_politics_event.23.b:0 "We could still make more friends."

  fcf_politics_event.24.title:0 "A Government of Compromise"
  fcf_politics_event.24.desc:0 "The results of the appointments made by the joint councils have arrived in Paris one after another, but the distribution of seats in the new Comité général de la Fédération has produced no unambiguous victor. No electoral alliance has crossed the threshold of an absolute majority. The largest remains some distance from the required number, while the remaining seats are divided among parties of widely differing views. The voters have made their choice without entrusting control of the Federation to any single political force.\n\nNegotiations over the forthcoming votes begin almost immediately. The largest alliance still hopes to obtain support on the basis of its own programme, but any appointment or major bill will require concessions to other parties. The budget can be renegotiated, candidates for the committees can be selected in consultation with other groups, and the most controversial proposals may have to be postponed. No one wishes to assume formal responsibility for governing together, but someone can always be persuaded to exchange an abstention or a handful of affirmative votes for a promise concerning their own demands.\n\nThis arrangement will possess no stable majority. Every bill will require a fresh search for support, and every disagreement may render previous promises meaningless. Yet when the ballots have failed to produce a majority, the Federation can continue functioning only through one negotiation after another. Compromise is no one's victory; it is merely the outcome that everyone has temporarily accepted."
  fcf_politics_event.24.a:0 "It appears we have no other choice."
  fcf_politics_event.24.b:0 "But we have a majority government right here!"

  fcf_politics_event.25.title:0 "The Radicals Break with the CGT"
  fcf_politics_event.25.desc:0 "Although most members of the Comité syndicaliste révolutionnaire have long been active within the Parti ouvrier unifié, they have continued to give the CGT priority in the Comité général de la Fédération. They believe that a coherent political programme is important, but that the workers' movement must above all preserve its unity. So long as the CGT remains capable of accommodating competing revolutionary tendencies, it ought to represent the syndicalists collectively within federal politics before any individual political party.\n\nThat position has now become increasingly difficult to maintain. As new political partnerships take shape, the former boundaries between the CGT and the various parties are beginning to shift. To some, the CGT is being led along an unacceptably moderate path. To others, its protracted and repetitive internal disputes are no longer sufficient to address the radical political opportunity now before them. Whether motivated by resistance or ambition, members of the Comité syndicaliste révolutionnaire have begun to conclude that continuing to treat the CGT as their first political preference will merely constrain their own actions.\n\nFollowing an internal vote, the Comité syndicaliste révolutionnaire has revised the order of its political support within the Comité général: the Parti ouvrier unifié will replace the CGT as its members' first preference. The committee has not withdrawn from the CGT, and its members will continue to operate within trade-union organizations at every level. In the chamber of federal politics, however, they will henceforth act first according to the political line of the Parti ouvrier unifié. The organizational connection remains, but the bond sustaining a common political representation has been severed."
  fcf_politics_event.25.a:0 "Will this lead to yet another division within the CGT?"

  fcf_politics_event.26.title:0 "Appoint the $PCSP$"
  fcf_politics_event.26.desc:0 "The name “Comité de salut public” can be traced to the gravest years of the French Revolution. After the Communard Revolution began, new revolutionary governments emerged across the country, while the fronts, transport system, food supply, and public security all required unified coordination. The revolutionaries consequently revived this ancient name. The provisional institution was not dissolved when the war ended. Through successive institutional reforms, it gradually shed its character as an emergency body and became the permanent federal executive organ subordinate to the Comité général de la Fédération.\n\nThe modern Comité de salut public implements the laws and resolutions adopted by the Comité général and handles federal affairs that local authorities cannot resolve independently. It cannot legislate on its own initiative, nor may it supplant the autonomous authority of the communes, joint councils, and industrial trade unions. Each committee member independently administers the affairs assigned to their department rather than submitting every question to a collective vote of the entire committee.\n\nThe chairman of the Comité de salut public coordinates this vast administrative system. The chairman arranges the committee's work, coordinates the activities of its departments, and makes the final decision whenever their responsibilities overlap or their views conflict. The chairman cannot bypass another member and assume direct control of that member's department. Nor is the chairman the Federation's head of state or a leader standing above the Comité général. Yet whenever every thread of federal administration converges upon Paris, someone must decide in which direction they should extend."
  fcf_politics_event.26.a:0 "$FRA_maurice_thorez$."
  fcf_politics_event.26.b:0 "$FRA_pierre_semard$."
  fcf_politics_event.26.c:0 "$FRA_robert_bothereau$."
  fcf_politics_event.26.d:0 "$FRA_jean_zyromski$."
  fcf_politics_event.26.e:0 "$FRA_adrien_marquet$."
  fcf_politics_event.26.f:0 "$FRA_barthelemy_montagnon$."
  fcf_politics_event.26.g:0 "$FRA_edouard_berth$."

  fcf_politics_event.27.title:0 "A New $CAE$"
  fcf_politics_event.27.desc:0 "The Commissioner for Foreign Affairs directs the formal relations between the French Federation of Communes and the outside world. The department organizes foreign representations, diplomatic missions, international conferences, and negotiations between governments. Everything from trade disputes and the affairs of French citizens abroad to coordination among allies and crises approaching the frontier will eventually arrive upon the commissioner's desk.\n\nThe Commissioner for Foreign Affairs may negotiate but cannot determine the Federation's destiny alone. Important treaties must still be submitted to the Comité général de la Fédération for approval, while new international obligations cannot be created merely through a promise issued by the diplomatic department. The commissioner must seek compromises within the principles established by the Comité général and coordinate with the economic, military, and other departments over every decision that might affect the Federation's internal or external policies.\n\nEloquence alone is not sufficient for this office. The Commissioner for Foreign Affairs must convince allies that France will honour its commitments, ensure that neutral countries understand French intentions, and prevent enemies from misjudging France's limits. Different candidates may employ different language, but only one voice can ultimately speak from Paris."
  fcf_politics_event.27.a:0 "$FRA_drieu_la_rochelle$."
  fcf_politics_event.27.b:0 "$FRA_louis_deschizeaux$."
  fcf_politics_event.27.c:0 "$FRA_alfred_rosmer$."
  fcf_politics_event.27.d:0 "$FRA_jean_longuet$."
  fcf_politics_event.27.e:0 "$FRA_gaston_leval$."
  fcf_politics_event.27.f:0 "$FRA_joseph_paul_boncour$."
  fcf_politics_event.27.g:0 "$FRA_jean_baptiste_severac$."
  fcf_politics_event.27.h:0 "$FRA_pierre_laval$."
  fcf_politics_event.27.i:0 "$FRA_marc_sangnier$."

  fcf_politics_event.28.title:0 "A New $CE$"
  fcf_politics_event.28.desc:0 "The Commissioner for Economic Affairs is responsible for turning the economic legislation and budgetary authorizations of the Comité général de la Fédération into workable administrative programmes. The federal budget, interregional construction, federal factories, industrial coordination, and foreign economic affairs all require the economic department to compile information, allocate funds, and supervise implementation. Projects too large for individual localities or industries to undertake alone must also frequently pass through the commissioner's hands before receiving federal support.\n\nThe Commissioner for Economic Affairs does not, however, administer the whole French economy. Factory committees remain responsible for the daily operation of their enterprises, industrial trade unions retain their own coordinating functions, and local authorities possess the legal right to administer their own finances. The Federal Bank is directly responsible to the Comité général and does not answer to the economic commissioner. The commissioner may select projects only within the purposes, amounts, and time limits established by law and the budget and must publicly account for both the sources and use of the funds involved.\n\nThe authority attached to this office is consequently both immense and fragmented. The commissioner cannot order every machine in France to begin operating, but can determine which railways are extended, which federal factories receive investment, and which regions receive priority in the next budget. Numbers may appear silent, but behind each one stand people waiting for employment, equipment, and bread."
  fcf_politics_event.28.a:0 "$FRA_hubert_lagardelle$."
  fcf_politics_event.28.b:0 "$FRA_barthelemy_montagnon$."
  fcf_politics_event.28.c:0 "$FRA_louis_vallon$."
  fcf_politics_event.28.d:0 "$FRA_gaston_monmousseau$."
  fcf_politics_event.28.e:0 "$FRA_robert_bothereau$."
  fcf_politics_event.28.f:0 "$FRA_rene_belin$."
  fcf_politics_event.28.g:0 "$FRA_jean_baptiste_lebas$."
  fcf_politics_event.28.h:0 "$FRA_pierre_besnard$."
  fcf_politics_event.28.i:0 "$FRA_marcel_poimboeuf$."

  fcf_politics_event.29.title:0 "A New $CSI$"
  fcf_politics_event.29.desc:0 "Local police forces maintain everyday public order. The Commissioner for Internal Security is instead responsible for problems that cross local boundaries and threaten the Federation as a whole. Interregional crime, political violence, sabotage, and conspiracies against federal institutions are investigated by the security services under the commissioner's authority. When local authorities are unable to act, or when a case involves several regions, the federal police may lawfully intervene.\n\nThe Commissioner for Internal Security must maintain cooperation among local police forces, protect federal institutions and important facilities, and report immediately to the Comité de salut public whenever a crisis threatens to expand. The office does not control local government, however, and cannot convict anyone in place of the courts. Searches, arrests, and emergency measures remain subject to the law, while the actions of the security services must be supervised by both the Comité général de la Fédération and the judiciary.\n\nEvery political system requires someone to defend it. The question is where its defenders should stand. If they hesitate excessively, enemies may exploit the Federation's decentralization and tolerance. If they cross the boundary, those entrusted with defending the revolution may become its greatest threat. The Commissioner for Internal Security holds that boundary in their hands."
  fcf_politics_event.29.a:0 "$FRA_simon_sabiani$."
  fcf_politics_event.29.b:0 "$FRA_paul_ramadier$."
  fcf_politics_event.29.c:0 "$FRA_jacques_doriot$."
  fcf_politics_event.29.d:0 "$FRA_adrien_marquet$."
  fcf_politics_event.29.e:0 "$FRA_charles_tillon$."
  fcf_politics_event.29.f:0 "$FRA_roger_salengro$."
  fcf_politics_event.29.g:0 "$FRA_may_picqueray$."
  fcf_politics_event.29.h:0 "$FRA_eugene_frot$."

  fcf_politics_event.30.title:0 "A New $CC$"
  fcf_politics_event.30.desc:0 "The Commissioner for Culture is responsible for federal cultural affairs, educational coordination, and public cultural services. Federally administered museums, archives, broadcasting institutions, and cultural exchange programmes are managed by the commissioner's department. The public standards for education and culture adopted by the Comité général de la Fédération must likewise be implemented through negotiations between the commissioner and local authorities.\n\nFrance's schools, theatres, publishers, and artistic associations do not answer directly to the federal government. Each locality remains free to organize educational and cultural activities according to its own circumstances, while artistic creation cannot be prescribed in advance by an administrative office. The Commissioner for Culture can provide resources to poorer regions, maintain interregional public institutions, protect historical heritage, and ensure that inhabitants throughout the country have an opportunity to participate in the Federation's common cultural life.\n\nNo cultural policy, however, is truly neutral. Which past should be preserved, which forms of art encouraged, and which account of the revolution taught to the next generation will all shape how France understands itself in the future. The Commissioner for Culture cannot dictate how people must think, but can determine which voices are most easily heard throughout the Federation."
  fcf_politics_event.30.a:0 "$FRA_marcel_bucard$."
  fcf_politics_event.30.b:0 "$FRA_jean_perrin$."
  fcf_politics_event.30.c:0 "$FRA_ludovic_zoretti$."
  fcf_politics_event.30.d:0 "$FRA_marceau_pivert$."
  fcf_politics_event.30.e:0 "$FRA_leo_lagrange$."
  fcf_politics_event.30.f:0 "$FRA_andre_colomer$."
  fcf_politics_event.30.g:0 "$FRA_jean_zay$."
  fcf_politics_event.30.h:0 "$FRA_paul_vaillant_couturier$."
  fcf_politics_event.30.i:0 "$FRA_georges_bertier$."

  fcf_politics_event.31.title:0 "A New $CGFF$"
  fcf_politics_event.31.desc:0 "The Chief of the Federal General Staff is the highest coordinating authority within the staff systems of the army, navy, and air force. The chief formulates plans for defence and mobilization, coordinates training, deployment, supply, and operational readiness among the services, and reports the true condition of the federal armed forces to the Comité de salut public. When war arrives, forces dispersed among different services and theatres must be united into a single army through the General Staff.\n\nThe Chief of the Federal General Staff may offer military judgments but cannot make political decisions on behalf of the Federation. Authority to deploy the armed forces belongs to the Comité de salut public and must obtain the approval of the President of the Comité général de la Fédération in accordance with the federal system. The initiation of an offensive war or the expansion of international commitments is still less a matter that soldiers may determine for themselves. The chief's responsibility is to transform the lawful decisions of the political authorities into executable military operations.\n\nThis office therefore stands between the armed forces and political government. A weak chief may leave the federal services fighting separate wars, while an excessively powerful one may elevate military requirements above the institutions of the Federation. The Comité général must choose not merely an excellent officer, but someone who understands why the army fights and where its authority must end."
  fcf_politics_event.31.a:0 "$FRA_maurice_gamelin$."
  fcf_politics_event.31.b:0 "$FRA_ernest_petit$."
  fcf_politics_event.31.c:0 "$FRA_henri_gerard$."
  fcf_politics_event.31.d:0 "$FRA_nestor_makhno$."
  fcf_politics_event.31.e:0 "$FRA_charles_delestraint$."
  fcf_politics_event.31.f:0 "$FRA_antoine_bethouart$."
  fcf_politics_event.31.g:0 "$FRA_gabriel_bougrain$."
  fcf_politics_event.31.h:0 "$FRA_aime_doumenc$."

  fcf_politics_event.32.title:0 "Thorez Resigns"
  fcf_politics_event.32.desc:0 "The Parti ouvrier unifié has won the election, yet the celebrations at party headquarters are soon overshadowed by another dispute. The increase in seats is undeniable, but few are willing to credit the victory to Thorez or his Popular Front strategy. It was precisely as the campaign departed from that original strategy and the party opposition seized greater initiative that the Parti ouvrier unifié began to recover its supporters. The victory belongs to the party, but not necessarily to the man who leads it.\n\nThe Popular Front faction attempts to portray the result as the long-awaited fruit of years of coalition government, but a majority of the Central Committee no longer accepts this interpretation. To them, the election has not demonstrated the continued effectiveness of the Popular Front. It has shown that the Parti ouvrier unifié can win even after escaping the path prescribed for it by Thorez. As local organizations throughout the country demand a reconsideration of the party line, Thorez finds that although he has secured a majority in the chamber, he has lost his majority within the party.\n\nAt the ensuing meeting of the Central Committee, Thorez announces his resignation as general secretary. He declares that he will not allow an internal controversy to undermine the party's hard-won victory, but everyone understands that the Parti ouvrier unifié is no longer prepared to let the Popular Front faction determine its direction. The leadership will now pass to those who truly shaped the electoral triumph."
  fcf_politics_event.32.a:0 "Sémard will become the new party secretary."
  fcf_politics_event.32.b:0 "Rosmer will become the new party secretary."

  election_news_desc:0 "The French Federation of Communes—the heart of world socialism and syndicalism—has completed the reconstitution of its Comité général de la Fédération. As a revolutionary workers' state, its polling stations differ from those of capitalist democracies and are frequently established near factories, allowing members of the working class to vote on their way to work. Political enthusiasm during this election has nevertheless exceeded every government estimate, forcing the Federation to establish additional polling stations to accommodate the immense crowds.\n\n"
  fcf_politics_event.33.title:0 "The Popular Front Wins the French Election"
  fcf_politics_event.33.desc:0 "$election_news_desc$The result has largely conformed to expectations: the Popular Front has successfully defended its position in government. Much has happened during the past five years, but its reforms have genuinely benefited a broad section of centrist voters. Whether the Front will continue advancing reform steadily or reveal a more radical character remains unknown."
  fcf_politics_event.33.a:0 "Congratulations, comrades!"
  fcf_politics_event.33.b:0 "Another trick by the Reds."

  fcf_politics_event.34.title:0 "The Opposition Alliance Wins the French Election"
  fcf_politics_event.34.desc:0 "$election_news_desc$The result has largely conformed to expectations. The opposition alliance between the Parti communiste ouvrier et paysan and the Union anarchiste has defeated the Popular Front, ending the political dynasty of the Parti ouvrier unifié and the CGT. Many nevertheless fear that the differences between the Guesdists and anarchists are too profound for their governing coalition to survive for long."

  fcf_politics_event.35.title:0 "The Parti socialiste français Wins the French Election"
  fcf_politics_event.35.desc:0 "$election_news_desc$The result has largely conformed to expectations. The Parti socialiste français has used the Bordeaux economic miracle to win the confidence of a broad section of the French public. Many radicals regard its practical policies as a betrayal of socialism, but the party describes its members as “new socialists.” Whatever the ideological controversy, the people have carried them into government."

  fcf_politics_event.36.title:0 "The Confédération nationale-syndicaliste Wins the French Election"
  fcf_politics_event.36.desc:0 "$election_news_desc$The result has defied expectations. Neither the Popular Front nor the opposition alliance has emerged victorious. Instead, the nationalist and populist Confédération nationale-syndicaliste has secured a majority in the Comité général. Many attribute its success to Georges Gressent's immense media network, but whatever the explanation, it has become the new leader of the Federation."

