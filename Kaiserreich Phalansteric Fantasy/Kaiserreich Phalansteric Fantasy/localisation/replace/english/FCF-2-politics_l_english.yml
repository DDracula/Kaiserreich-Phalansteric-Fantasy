# Political Decisions
  FCF_politics_categories:0 "Politics of the Commune"
  FCF_politics_categories_desc:0 "Under the Constitution of 1921, the French Federation of Communes is a socialist-syndicalist federation composed of more than 36,000 communes. Its highest political authority is the §YComité général de la Fédération§!. The §YComité de salut public§! serves as the executive organ of the §YComité général§!: it is appointed by, accountable to, and subject to the supervision of the latter.\n"

  FCF_impeachment:0 "Impeach $FRA_georges_du_maurier$"
  FCF_impeachment_effect:0 "\n$if_bill_pass$\n$FRA_georges_du_maurier$ will be impeached"
  FCF_impeachment_desc:0 "Although Du Maurier's government successfully organized a congress of the Third International last May, it has faced mounting criticism for remaining silent while the German imperialists brutally suppressed trade-union activity at home. The opposition within the Comité général de la Fédération has now introduced a motion of no confidence against Du Maurier."

  FCF_election:0 "Election to the Comité général"
  FCF_election_desc:0 "Strictly speaking, this is less an election of the current members of the Comité général de la Fédération than an election of those eligible to serve upon it. Throughout the ensuing five years, the district councils may replace their delegates to the Comité général at any time. What the general election truly determines is who may ultimately rise to the highest positions of authority in the Federation of Communes: the local communes elect their representatives, and these representatives subsequently elect the delegates sent to the federal centre through their district councils.\n\nAlthough individual delegates may be replaced, the distribution of seats in the Comité général at the conclusion of the election will determine which parties govern during the next term. If no party or electoral alliance commands an absolute majority, it must either seek new allies or resign itself to governing as a crippled minority administration."
  FCF_election_tt:0 "§GThe election to the Comité général de la Fédération will continue for 30 days. Its final result will determine which political forces form the next government.§!"

  election_1936_CNS_cooperate_with_POU:0 "$party_CNS_short$ Approaches Monatte"
  CNS_cooperate_with_POU_tt:0 "If $party_CNS$ holds more seats than $party_CGT$, and the combined seats of $party_CNS$ and $party_POU$ are sufficient to prevent any rival electoral alliance from governing, $party_POU$ will join a governing coalition led by $party_CNS$"
  election_1936_CNS_cooperate_with_LJR:0 "$party_CNS_short$ Approaches the Catholics"
  CNS_cooperate_with_LJR_tt:0 "If $party_CNS$ holds more seats than $party_CGT$, and the combined seats of $party_CNS$ and $party_LJR$ are sufficient to prevent any rival electoral alliance from governing, $party_LJR$ will join a governing coalition led by $party_CNS$"

  election_1936_PSF_cooperate_with_CGT:0 "$party_PSF_short$ Approaches Jouhaux"
  PSF_cooperate_with_CGT_tt:0 "If $party_PSF$ holds more seats than $party_POU$, the combined seats of $party_PSF$ and $party_CGT$ are sufficient to prevent any rival electoral alliance from governing, and $CGT_faction_1$ dominates $party_CGT$, $party_CGT$ will join a governing coalition led by $party_PSF$"
  election_1936_PSF_cooperate_with_URSRS:0 "$party_PSF_short$ Approaches the Centre"
  PSF_cooperate_with_URSRS_tt:0 "If $party_PSF$ holds more seats than $party_POU$, and the combined seats of $party_PSF$ and $party_URSRS$ are sufficient to prevent any rival electoral alliance from governing, $party_URSRS$ will join a governing coalition led by $party_PSF$"

  election_1936_POU_faction_struggle:0 "$party_POU$ Denounces Thorez's Line"
  election_1936_CGT_faction_struggle:0 "$party_CGT$ Denounces Jouhaux's Line"

  party_attitude_will_reset:0 "§CParty attitudes within the Comité général de la Fédération will be reset§!"
  election_1936_winner_people_front:0 "$party_POU$, $party_CGT$, $party_URSRS$, and $party_LJR$ will form a new government"
  election_1936_winner_worker_peasant_alliance:0 "$party_PCOP$ and $party_UA$ will form a new government"
  election_1936_winner_french_revolution:0 "$party_PSF$ and $party_PAPF$ will form a new government"
  election_1936_winner_french_revolution_with_CGT:0 "$party_PSF$, $party_CGT$, and $party_PAPF$ will form a new government"
  election_1936_winner_french_revolution_with_URSRS:0 "$party_PSF$, $party_URSRS$, and $party_PAPF$ will form a new government"
  election_1936_winner_french_revolution_with_all:0 "$party_PSF$, $party_CGT$, $party_URSRS$, and $party_PAPF$ will form a new government"
  election_1936_winner_pure_syndicalism:0 "$party_CNS$ will form a government"
  election_1936_winner_pure_syndicalism_with_POU:0 "$party_CNS$ and $party_POU$ will form a new government"
