################
### Social Bills
################
#1
  bill_basic_speech_freedom:0 "Basic Freedom of Speech"
  bill_basic_speech_freedom_desc:0 "Freedom of speech is a fundamental human right. All citizens have therefore been granted the ability to express themselves within reasonable and lawful bounds."
#2
  bill_limited_womens_rights:0 "Limited Women's Rights"
  bill_limited_womens_rights_desc:0 "Although the old Republic proclaimed itself a “democracy,” women—one half of the population—were not even permitted to vote. Many arrogant intellectuals maintained that women were ignorant and susceptible to clerical influence, just as the peasants of the Second Republic had once cast their ballots for Louis-Napoléon Bonaparte. Conservatives went further still and refused to recognize women as independent human beings. Experience has demonstrated, however, that women vote no differently from men: their choices are shaped primarily by their social class. The revolution therefore granted women the franchise. Many conservative revolutionaries objected, but that is the nature of revolution—if nothing is to change, why have a revolution at all?\n\nYet a revolution at the level of the state cannot transform the outlook of every individual overnight. Women's rights remain inadequately protected. Certain professions continue to exclude women or subject them to blatant employment discrimination, and many such practices enjoy explicit legal sanction. Many women, particularly in less developed regions, have themselves internalized deeply rooted prejudices. Although entitled to vote, they remain “ashamed” to exercise that right. Meanwhile, women workers and intellectuals in the cities demand stronger protections for women's rights. Just as among men, class divisions have emerged among women as well."
#3
  bill_freedom_of_religion:0 "Freedom of Religion"
  bill_freedom_of_religion_desc:0 "France is a country of many religions. Alongside the traditional Christian denominations of Catholicism and Protestantism, it is home to Jews and even Muslims. Although many revolutionaries remain committed atheists, any reckless attempt to impose compulsory antireligious measures would inevitably provoke popular resistance. Broadly speaking, we have continued the old Republic's policy of religious liberty without making substantial alterations."
#4
  bill_free_immigration:0 "Free Immigration"
  bill_free_immigration_desc:0 "France has been a major destination for immigration since the Industrial Revolution. Our population includes migrant workers from Southern, Central, and Eastern Europe, as well as Muslim and Black immigrants from the former French colonies in Africa. Although many conservatives and lackeys of the old Republic fled to Africa after the revolution, most immigrants accepted the new socialist order—after all, most of them were workers themselves. As the world's first socialist country and the centre of the global revolution, France attracts leftists from many nations, together with ordinary labourers simply seeking a livelihood, all of whom hope to participate in the construction of our revolutionary society. We have no reason to reject the goodwill of these comrades. Nevertheless, the racism and nationalism inherited from the old Republic cannot be eradicated in little more than a decade. Many French citizens remain hostile toward ethnic-minority immigrants, particularly Jews."
  bill_free_immigration_tt:0 "§GThis will allow us to accept refugees when crises erupt elsewhere in the world§!\n§RHowever, it will anger domestic nationalists and nativists§!"
#5
  bill_eight_hour_workdays:0 "Eight-Hour Working Day"
  bill_eight_hour_workdays_desc:0 "“Eight hours for work, eight hours for recreation, and eight hours for rest” has always been a fundamental socialist demand. Any government incapable of enforcing the eight-hour working day can only disgrace the name of socialism. Fearful of workers launching revolutions of their own—as ours did—many capitalist countries have also introduced an eight-hour day. Yet the capitalists' eight-hour day is no genuine eight-hour day. Overtime, withheld wages, and interference in workers' private lives all demonstrate that capitalist governments merely appropriate the language of socialism while devising new ways to exploit the people.\n\nThe eight-hour day is not, as its opponents claim, an “excuse for idleness.” On the contrary, under the eight-hour system our workers have attained far greater productivity than they ever achieved under ten-hour days or even longer schedules. The eight-hour day also provides workers with sufficient leisure to pursue their interests and continue their education, thereby raising the cultural and intellectual standards of the entire population."
#6
  bill_seven_hour_workdays:0 "Seven-Hour Working Day"
  bill_seven_hour_workdays_desc:0 "After fierce debate, the seven-hour working day has become a reality throughout the French Federation of Communes. It represents not merely an enormous advance in workers' rights, but a resounding declaration of the superiority of the Commune's socialist system. Shorter working hours will give our comrades more time for self-improvement, cultural creation, and family life. Critics fear that the reform will weaken industrial production. Yet no amount of overtime can equal the long-term creativity and solidarity of a society composed of well-rested and intellectually free workers."
#7
  bill_freedom_of_religion_amendment:0 "Amendment on Religious Freedom"
  bill_freedom_of_religion_amendment_desc:0 "§LFrance is a country of many religions. Alongside the traditional Christian denominations of Catholicism and Protestantism, it is home to Jews and even Muslims. Although many revolutionaries remain committed atheists, any reckless attempt to impose compulsory antireligious measures would inevitably provoke popular resistance. To reassure the innocent people of faith among our population, we have redrafted the law on religion so that it conforms more closely to socialist principles while preserving the ordinary lives of believers who pose no threat to the revolution.§!"
