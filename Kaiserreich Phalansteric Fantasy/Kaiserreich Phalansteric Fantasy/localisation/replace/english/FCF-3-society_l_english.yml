# Society Decisions
  FCF_society_categories:0 "[FCF_society_categories_loc]"
  FCF_society_categories_desc:0 "[FCF_society_categories_desc_loc]"

  FCF_society_categories_main:0 "State of Society"
  FCF_society_categories_desc_main:0 "Overthrowing the reactionary rule of the haute bourgeoisie does not mean that our people will remain satisfied forever. Every social class continues to possess demands of its own, and those demands frequently conflict with the interests of other classes. Nevertheless, these disparate groups together constitute our country, and both their satisfaction and their discontent will be reflected throughout society—from the economy and military affairs to politics and culture.\n(§gThe influence of each class determines which matters it affects and the strength of those effects, while its satisfaction determines their precise value§!)"

  FCF_society_promote_revolutionary_films:0 "Promote Revolutionary Cinema"

# CGT
  FCF_reform_cgt_simplify_management:0 "Reduce the Administrative Staff"
  FCF_reform_cgt_simplify_management_tt:0 "Reducing the administrative staff can §Gsubstantially reduce corruption§!, but may §Yimpair coordination within the CGT§!. Moreover, if we subsequently undertake a §Ybureaucratic reform§!, we may encounter a §Rshortage of administrators§!"
  CGT_simplifed_mangement:0 "Reduce the CGT's Administrative Staff"
  FCF_reform_cgt_strengthen_management:0 "Train the Administrative Staff"
  FCF_reform_cgt_strengthen_management_tt:0 "Training administrators can §Gimprove their competence and political awareness§!, enabling them to employ §Gmore professional methods of management§!. §YIn theory§!, this can §Greduce corruption and inefficiency§!, though it will also provoke §Raccusations of bureaucratism from the radicals§!"
  CGT_strengthen_mangement:0 "Train the CGT's Administrative Staff"
  FCF_reform_cgt_criticize_decentralization:0 "Denounce the Decentralist Line"
  FCF_reform_cgt_criticize_centralization:0 "Denounce the Centralist Line"

  FCF_reform_cgt_encourage_workers_reporting:0 "Encourage Workers to Report Abuses"
  FCF_reform_cgt_encourage_workers_reporting_tt:0 "Encouraging workers to report abuses can §Gstrengthen oversight of bureaucratism§!, but may also §Rencourage personal vendettas and intensify factional infighting§!"
  FCF_reform_cgt_democratize_management:0 "Further Democratize the Administration"
  FCF_reform_cgt_democratize_management_tt:0 "Democratizing the administration can §Gstrengthen the influence of rank-and-file workers within the CGT§!, but may cause §Rtemporary disruption throughout its administrative system§!"
  FCF_reform_cgt_coordination_mechanism:0 "Establish a Coordination Mechanism"
  FCF_reform_cgt_coordination_mechanism_tt:0 "A coordination mechanism can §Greduce the intensity of internal factional conflict§!, but may also §Rmake radical reforms more difficult to implement§!"
  FCF_reform_cgt_connect_with_CNS:0 "Seek Cooperation with the CNS"
  FCF_reform_cgt_connect_with_CNS_tt:0 "If the Confédération nationale-syndicaliste supports our radical reform of the CGT, we can break with the moderate faction within the confederation and §Gadvance toward a purer form of revolutionary syndicalism§!"

  FCF_reform_cgt_professional_bureaucrats:0 "Establish a Professional Civil Service"
  FCF_reform_cgt_professional_bureaucrats_tt:0 "Professional administrators will §Gsubstantially improve the CGT's administrative efficiency§!, but will require §Rconsiderable resources and create the risk of formalism and estrangement from the masses§!"
  FCF_reform_cgt_unified_branch_standards:0 "Standardize Branch Regulations"
  FCF_reform_cgt_unified_branch_standards_tt:0 "Standardizing branch regulations will §Ggreatly improve consistency within the CGT§!, but may cause some §Rlocal unions to withdraw§!"
  FCF_reform_cgt_strengthen_internal_incentive:0 "Strengthen Internal Incentives"
  FCF_reform_cgt_strengthen_internal_incentive_tt:0 "Material incentives will §Gsubstantially increase the motivation of workers and administrators within the CGT§!, but may encourage §Rthe falsification of statistics and greater corruption§!"
  FCF_reform_cgt_connect_with_PSF:0 "Seek Cooperation with the Socialists"
  FCF_reform_cgt_connect_with_PSF_tt:0 "If the Parti socialiste français supports our bureaucratic reform of the CGT, we can break with the radical faction within the confederation and §Gadvance toward a more scientific and efficient form of syndicalist socialism§!"
  CGT_centralists_cooperate_with_PSF:0 "$party_PSF$ agrees to cooperate with $party_CGT$"

  FCF_against_cgt_investigation_committee:0 "Establish a Special Investigative Commission"
  FCF_against_cgt_investigation_committee_tt:0 "The special investigative commission will require time to examine the numerous problems within the CGT. §GThe more problems it uncovers, the more effective our accusations against the confederation will become§!\n§RThe public may not possess sufficient patience to await the conclusion of a lengthy investigation§!"
  FCF_against_cgt_independent_unions:0 "Support Independent Trade Unions"
  FCF_against_cgt_independent_unions_tt:0 "Supporting Catholic unions and autonomous trade-union federations will §Gsubstantially reduce the CGT's political leverage§!, but may expose us to §Raccusations that we are abusing public authority for partisan advantage§!"
  FCF_against_cgt_independent_delegate:0 "Appoint Independent Delegates"
  FCF_against_cgt_independent_delegate_tt:0 "Independent delegates can §Gexpand the government's authority over the trade unions§!, but may provoke §Rjoint opposition from the unions themselves§!"
  FCF_against_cgt_reversal_of_verdict:0 "Exonerate Lucien Martin"

  FCF_against_cgt_antitrust_law:0 "Introduce the Anti-Monopoly Act"
  FCF_against_cgt_investigate_leaders:0 "Investigate the CGT Leadership"
  FCF_against_cgt_investigate_leaders_tt:0 "We may uncover §Ga major scandal within the CGT§! and force the confederation to make concessions, but the investigation may also provoke §Ra fierce reaction from the CGT§!"
  FCF_against_cgt_encourage_grassroots_reporting:0 "Encourage Reports from the Rank and File"
  FCF_against_cgt_encourage_grassroots_reporting_tt:0 "Offering rewards for information from rank-and-file workers can §Gincrease pressure upon the CGT§!, but the initiative may §Rdevelop into a scandal of our own§!"

