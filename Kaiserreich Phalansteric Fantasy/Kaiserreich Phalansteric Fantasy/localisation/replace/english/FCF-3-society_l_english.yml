# Radical Groups
  FCF_society_categories_extreme:0 "Overly Radical Political Groups"
  FCF_society_categories_desc_extreme:0 "Revolution is no universal remedy, and the problems of the old Republic can emerge within the Commune as well. Far-right political groups such as the Camelots du Roi have long since disappeared from metropolitan France, but this has not prevented the emergence of new currents of political extremism. Most are dissatisfied with the Commune's existing political system or resentful of their own circumstances, although some merely hope to exploit the grey areas of Communard society for personal gain.\n\nWhatever their motives, even when these groups do not openly threaten or oppose the revolutionary character of the Commune, they exert a tangible influence upon the lives of its people. Factions with sufficient influence have even begun interfering in grassroots politics. Ignoring such developments would plainly contradict the very definition of a people's government. Of course, a faction that appears to some as an intolerable nuisance may look to others like a useful and pragmatic ally."

# Surrealist Movement
  FCF_society_categories_surrealism:0 "The Surrealist Movement"
  FCF_society_categories_desc_surrealism:0 "Trotsky's Literature and Revolution became the Russian revolutionary's final work in France. André Breton took up the standard of creating a new socialist culture, while Georges Bataille, fascinated by the martyrdom of this “prophet,” joined the Surrealist movement alongside him. Two leaders of profoundly different temperaments tore at Surrealism from opposite directions until René Crevel united its spirit with its flesh. This extraordinarily charismatic mediator forged Breton's Trotskyism and Bataille's base materialism into the sword and shield of Surrealism.\n\nThe French have always readily embraced emerging cultural movements, but this tradition has generally remained confined to the upper classes and intellectual elite. Within a socialist federation belonging to the common people, it remains uncertain whether the difficult and esoteric culture of Surrealism can descend into the everyday lives of the workers or whether it will become an isolated culture confined to an ivory tower."

# Events
  fcf_society_event.1.title:0 ""
  fcf_society_event.1.desc:0 ""
  fcf_society_event.1.a:0 ""

  fcf_society_event.2.title:0 "Women's Day Riots"
  fcf_society_event.2.desc:0 "Text outline: On 11 April 1938, celebrations of Women's Day are held at the Place de la République in Paris. The holiday commemorates the Union des femmes pour la défense de Paris et les soins aux blessés, founded on 11 April 1871. Radical feminists disrupt the federally organized procession and advance a series of more radical demands."
  fcf_society_event.2.a:0 "Another fine mess."
  FCF_womens_day_parade_desc:0 "Text outline: Women can no longer endure the restrictions placed upon their rights. If we still deserve to call ourselves a socialist country, we cannot disregard the demands of half the population."
  womens_day_parade_has_happened:0 "The Women's Day procession has occurred"

  fcf_society_event.3.title:0 "An Error in Policing"
  fcf_society_event.3.desc:0 "Text outline: While arresting an immigrant suspect of an as-yet-undetermined ethnicity, a police officer restrains the individual so violently that the suspect can no longer maintain basic vital functions. The suspect dies before being taken into custody."
  fcf_society_event.3.a:0 "A minor mistake, nothing more."

  fcf_society_event.4.title:0 "A Protest March"
  fcf_society_event.4.desc:0 "Text outline: An anarchist newspaper reports upon the fatal arrest and presents it as an example of official disregard for human rights. It argues that the coercive organs of the state used violence against a suspect before establishing whether any crime had been committed and ultimately killed that person, thereby violating the suspect's fundamental rights. The report angers immigrant communities and other citizens, who take to the streets in protest against police violence."
  fcf_society_event.4.a:0 "Another protest!?"
  FCF_police_enforcement_parade:0 "March against Police Violence"
  FCF_police_enforcement_parade_desc:0 "Text outline: The immigration question has finally erupted into open conflict, and both supporters and opponents are attempting to use the incident as proof of their own position. As immigrant communities expand, which should carry greater weight: the crime associated with that growth, or the vitality these communities contribute to the economy? Whichever course we choose, someone will inevitably be dissatisfied."