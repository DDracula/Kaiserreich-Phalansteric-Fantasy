## Events
  fcf_economy_event.1.title:0 ""
  fcf_economy_event.1.desc:0 ""
  fcf_economy_event.1.a:0 ""

  fcf_economy_event.2.title:0 "Anniversary March for the Affaire Martin"
  fcf_economy_event.2.desc:0 "It all began as an ordinary industrial accident at a machine works on the outskirts of Paris. During an overtime shift, the punch press operated by Lucien Martin suddenly went out of control, robbing him of both hands. The factory insisted that the machine was in working order and that the accident had been caused entirely by Martin's negligence. It offered him only enough compensation to cover the bare minimum of his medical expenses. The foreman, Jacques, sided with the owner. As far as he was concerned, Martin's persistent refusal to join the Confédération générale du travail meant that he had no right to seek the union's help after the accident.\n\nNo one had witnessed the precise moment of the accident, and the machine's maintenance records could not substantiate Martin's account. The local labour arbitration tribunal ultimately accepted the factory's defence and ruled that Martin himself was responsible for his disability. The lawyer Henri Torrès subsequently agreed to take his case without charge. Arguing that it concerned the fundamental workplace protections owed to workers outside the CGT, Torrès secured special leave to appeal and submitted Martin's petition directly to the Federal Supreme Court. Public sympathy, however, was no substitute for the evidence demanded by the court, and the Supreme Court upheld the original ruling.\n\nTwo successive defeats did not put the controversy to rest. Instead, they transformed what had begun as a routine workplace dispute into an increasingly prominent public scandal. Anarchists began to suspect that Martin's misfortune had not been an isolated accident. Several investigators bypassed the factory management and local authorities and began privately tracing the origins of the machinery and the factory owner's local connections. Just as their inquiry began to approach the secrets concealed behind the machine works, two of the investigators were killed in a hotel explosion.\n\nThe explosion instantly ignited all the resentment that had accumulated around the case. Protesters took to the streets demanding the truth about the investigators' deaths, newspapers asked what the local authorities were attempting to conceal, and the General Federal Council began to hold the government accountable for its prolonged failure of oversight. Monmousseau could not withstand the resulting political storm and was eventually forced from office. Dumoulin assumed control of the government amid the crisis created by the bombing—and inherited an old case that could no longer be set aside.\n\nThe new government immediately ordered a formal investigation, hoping that a comprehensive official report could reconstruct the course of events. The Union anarchiste, however, refused to surrender control over the revelation of the truth to the government. Before the official inquiry could conclude, it published the evidence already in its possession, forcing information previously dismissed as rumour into public view. Only then did the public learn that the punch press had indeed been old and poorly maintained. The factory owner had also operated several unregistered sweatshops elsewhere and had repeatedly evaded inspection through his personal connections in the local government and the CGT.\n\nThose involved were subsequently punished, the sweatshops were closed, and the longstanding collusion between Jacques and the factory owner was exposed. Yet these belated revelations did not automatically overturn the ruling against Martin. Relying on the new evidence, Torrès brought another action, naming the owner, the local government, and the CGT as co-defendants. He sought to demonstrate that the injustice inflicted upon Martin had not arisen solely from the actions of one foreman or one factory owner, but from an entire network capable of obstructing oversight and excluding non-members. The court ultimately ruled, however, that the owner's exploitation of personal relationships was insufficient to establish the legal liability of the CGT as a whole. Torrès's attempt to broaden the nature of the case also exceeded what the available evidence could support. Martin lost once again.\n\nThe case was therefore left with a particularly absurd conclusion. The sweatshops had unquestionably existed, the machinery had unquestionably been neglected, and the factory owner had unquestionably used acquaintances within the CGT to avoid inspection. Yet the man who had lost both hands as a result remained legally responsible for his own accident under the original judgment. The press began referring to the entire affair as the ‘case against the CGT.’ Supporters of the CGT maintained that an entire workers' organization could not be placed in the dock for the corruption of a handful of individuals. Its opponents asked whether the organization could truly dismiss everything as private misconduct when the CGT's name had served as protection for well-connected local figures, and when workers excluded for not being members still had nowhere to seek justice.\n\nOn the second anniversary of Martin's final defeat, crowds once again took to the streets of Paris. Some demanded that the original judgment against him be overturned. Others called for a comprehensive investigation into the local networks attached to the CGT. Still others simply hung an empty pair of work gloves around their necks and followed the procession in silence. By the time the march reached the General Federal Council, the question confronting the new government had long since ceased to concern only one workplace accident: did the equality promised to the workers by the revolution also belong to those who had never joined the CGT?"
  fcf_economy_event.2.a:0 "History will hold us to account in the end."
  FCF_anti_cgt_record:0 "The Affaire Martin March"
  FCF_anti_cgt_record_desc:0 "The repercussions of the wrongful judgment against Monsieur Martin two years ago continue to be felt today. Within the government, the question of reforming the CGT remains under discussion—or, more accurately, remains the subject of mutual political attacks. The people, however, have run out of patience. The previous government failed to resolve the issue, and now that a new government has been elected, the final judgment on the CGT has become one of the most difficult matters confronting it. On one side stands an opposition increasingly hostile toward the CGT; on the other are the many ordinary workers whose livelihoods depend upon it. Whatever course we choose, continued refusal to reform the organization will only allow its hidden dangers to multiply."
  FCF_anti_cgt_record_tt:0 "§RWe should reform the CGT as soon as possible.§!"
  FCF_anti_cgt_record_has_happened:0 "The Affaire Martin March has occurred"

  fcf_economy_event.3.title:0 "Seeds of Distrust"
  fcf_economy_event.3.desc:0 "Three months have passed since the anniversary march for the Affaire Martin. On that day, the government promised that history would ultimately hold it to account, yet never explained how it intended to answer that charge. The General Federal Council has received no legislation, while the Committee of Public Safety has proposed neither an investigation nor negotiations. Even a formal declaration sufficient to establish the government's position disappeared after being passed repeatedly between departments. Perhaps the government hoped that time would calm the anger in the streets, but to the public, its silence looks more like cowardice in the face of the CGT.\n\nMartin's supporters were not the only ones to lose patience. Opponents of the CGT concluded that the new government was merely waiting for the public to forget the old case. Reformers within the CGT were equally disappointed: they had expected the government to help the organization clear away its accumulated abuses, only to find themselves still facing colleagues who refused all change. Even those determined to defend the CGT began to suspect that the government was secretly preparing some sort of plan but lacked the courage to defend it in public. Our silence reassured no one; instead, every side saw its worst expectations reflected in it.\n\nThe discontent soon spread beyond newspapers and public meetings and entered the chambers of the district councils. Several districts reconsidered the lists of delegates they had sent to the General Federal Council. Some members who had previously supported the government were recalled and replaced by candidates who had explicitly promised to alter the status quo. They held no common position: some demanded that the CGT be weakened, others called for its internal reform, while still others merely insisted that the government immediately disclose its intentions. They were united only by their weariness with the present situation and by electorates that had lost patience with the government.\n\nOnly when the new lists of delegates arrived in Paris did the governing coalition truly realize that the march had not ended when the crowds dispersed. Several seats in the General Federal Council had already changed hands, and more district councils were preparing to debate the same question. We refused to make a choice concerning the CGT, so the people in the districts have begun choosing representatives capable of making one for us."
  fcf_economy_event.3.a:0 "A governing disaster!"

  fcf_economy_event.4.title:0 "Free Trade Unions"
  fcf_economy_event.4.desc:0 "The CGT has never been the only workers' organization in the Federation. Even after the revolution, a considerable number of workers remained outside its structures because of their faith, local traditions, or opposition to centralization. Catholic trade unions are most active in the northern industrial regions and in towns with strong religious traditions, providing mutual aid, relief, and family services alongside the defence of labour rights. The Fédération des syndicats autonomes, meanwhile, consists of local unions that refuse to accept unified national leadership. Their positions differ considerably, but all insist that grassroots organizations must be free to decide their own local affairs. Smaller independent unions are also scattered throughout the country, some confined to a single factory or trade. These organizations are collectively known as ‘free trade unions’—with ‘free’ meaning, above all, that they are not affiliated with the CGT.\n\nAlthough these unions are not prohibited by law, they find it extremely difficult to compete with the CGT on equal terms. The CGT possesses industrial organizations, meeting places, and professional staff across the country, and can offer its members industry-wide protection and assistance across regional boundaries. Free trade unions, by contrast, often struggle merely to maintain an office, print a publication, or retain a permanent representative. Even when they win the support of some workers in a factory, they can seldom bear the full cost of coordinating production with the industrial federation, organizing mutual assistance, and defending their members' interests. Formal freedom has not produced equality of power.\n\nIf the government wishes to break the CGT's domination of organized working life, simply declaring all unions equal will not be enough. Organizations outside the CGT must be provided with premises, funding, and organizational assistance, allowing them to nominate their own candidates for factory committees, establish independent mutual-aid systems, and offer a viable alternative to workers unwilling to join the CGT. Once the free trade unions have secured a stable position, the CGT will have to earn the workers' confidence anew instead of treating its leadership as a natural right bestowed upon it by the revolution.\n\nDeciding who should receive these resources, however, is anything but a politically neutral technical question. The Catholic unions maintain close relations with the Ligue de la jeune République, while the Fédération des syndicats autonomes enjoys considerable support from members of the Union anarchiste. If either party controls the government and concentrates public resources upon unions close to itself, its opponents could easily portray the entire policy as an attempt to expand partisan power through the machinery of the state. Alternatively, we could assist all free trade unions simultaneously and distribute aid according to open and uniform criteria. This would be more expensive and would challenge the CGT more directly, but at least we would not have to explain why the government had chosen to support only its own friends."
  fcf_economy_event.4.a:0 "Support the Catholic trade unions."
  fcf_economy_event.4.b:0 "Support the Fédération des syndicats autonomes."
  fcf_economy_event.4.c:0 "Support all free trade unions."

  fcf_economy_event.5.title:0 "Self-Serving Interests"
  fcf_economy_event.5.desc:0 "Barely a month after support for the free trade unions began, the initial praise was drowned out by a very different response. Opposition newspapers published lists of the first unions to receive funding, premises, and organizational assistance, then carefully identified each one's connections with the governing party. The result was not difficult to understand: the government had not distributed its resources evenly among organizations outside the CGT, but had concentrated them upon the union network most closely associated with itself.\n\nThe government can, of course, defend its decision. The CGT's dominant position will not disappear simply because we proclaim that all unions are equal, nor can limited resources be spread evenly among every organization. If we wish to create an alternative force capable of competing with the CGT as quickly as possible, we must select unions with a reasonably strong organizational foundation and the capacity to make effective use of the resources provided. The fact that their political views resemble those of the governing party does not prove that the entire policy serves nothing but partisan interests.\n\nTrade unions, however, have never been mere mutual-aid societies concerned only with wages and welfare in the Federation's political system. Receiving government-funded offices, publications, and permanent staff means that a union can nominate candidates in more factories, assist campaigns for factory committees, and seek to place sympathetic figures in their chairmanships. The expansion of a union's influence will eventually be transformed into additional political seats in factories, district councils, and even the General Federal Council. Opponents therefore ask: when a governing party uses public resources to strengthen its trade-union allies, how is that different from using the power of government to entrench its own political position?\n\nThe criticism soon moved from the newspapers into the General Federal Council. CGT representatives demanded the suspension of the grants, while free trade unions excluded from the programme began protesting against this supposed ‘selective equality.’ Even within the governing camp, some fear that a reform intended to challenge the CGT's monopoly is becoming another monopoly manufactured by the government itself. We can insist that every accusation is a malicious fabrication by the opposition and continue the policy as planned, or withdraw the support already granted and admit that our choice could never have been clearly separated from partisan interests."
  fcf_economy_event.5.a:0 "These accusations are utterly baseless!"
  fcf_economy_event.5.b:0 "Withdraw our support."

  fcf_economy_event.6.title:0 "Justice at Last"
  fcf_economy_event.6.desc:0 "When the news arrived, Lucien Martin was attending a workers' meeting organized by a local branch of the Parti ouvrier et paysan uni. He had attended many such gatherings over the past two years. Sometimes he sat upon the platform of an auditorium packed with listeners; sometimes he recounted his experiences at fundraising meetings for striking workers; on other occasions, he needed only to appear before a journalist from L'Humanité and shake hands with several local representatives. The organizers generally paid his travel expenses and provided a modest appearance fee—hardly generous, but enough to supplement the household income. Martin did not always understand precisely what those meetings were debating, but people were willing to hear him speak and no longer treated him as a cripple fit only to wait for charity. That alone was enough to satisfy him.\n\nThe man reading the announcement waited for the applause to subside before handing the document to Martin's wife. Following a review, the original workplace-injury judgment had formally been overturned. The punch press had indeed malfunctioned because of its age and poor maintenance, and the factory bore full responsibility for the accident. Martin would no longer be recorded as a worker who had lost both hands through his own negligence, and his compensation would be reassessed in accordance with the new determination of liability. The sweatshops had been closed years ago and the owner and his accomplices convicted, yet Martin himself had remained trapped within that erroneous case file. Now the last outstanding debt from the affair had finally been settled.\n\nThe ink on the judgment was scarcely dry before the struggle to claim it began. The Parti ouvrier et paysan uni declared that the decision was the result of its continuing support for Martin and its refusal to allow the case to fade from public memory. The Union anarchiste reminded the public that without the original investigation, the explosion that had claimed two lives, and the persistence of the people in the streets, the government would never have reopened the file. Opponents of the CGT presented the new ruling as proof that its de facto hegemony had been broken, while reformers inside the CGT argued that correcting an injustice demonstrated the ability of the workers' organization to purge its own abuses. Even those who had once tried desperately to distance themselves from the affair now wanted Martin to attend a ‘rally of reconciliation.’\n\nMartin's schedule was soon filled once again by secretaries, journalists, and representatives of every faction. Some invited him to receive flowers outside the General Federal Council. Others wanted him to retrace the route of the old march. Still others had already prepared speeches for him, needing only Martin to declare in their concluding lines that justice belonged to a particular party, union, or programme of reform. He did not resent most of these invitations. Appearing at such events brought in a little money and allowed him to meet those who had helped him when he had been most isolated. After spending years without anyone believing him, being surrounded by admirers was surely better than being forgotten.\n\nHis wife did not share his enthusiasm. She carefully placed the new judgment inside a drawer and pushed several of the invitations aside. As she saw it, those people had once needed a Martin who had suffered an injustice, and now needed a Martin who proved that they had been right. The ruling had changed what her husband represented in their speeches, but it had not persuaded them to treat him as an ordinary man again.\n\nThat evening, a journalist once again asked whether Martin intended to remain active in the movement against the CGT. He thought for a long time before asking his wife to answer on his behalf. He was glad that the official record had finally admitted that the machine had failed, she said, and he was willing to thank those who had helped him. As for deciding who truly deserved credit for the victory—that was a concern for people who still had hands with which to wave their flags."
  fcf_economy_event.6.a:0 "Justice may be delayed, but it will not be denied."

  fcf_economy_event.7.title:0 "CGT Investigation File A"
  fcf_economy_event.7.desc:0 "The first batch of documents delivered by the investigation team contained nothing sensational. The irregularities concerned a workers' convalescent home operated by the Saint-Étienne metalworkers' industrial federation. Three years ago, its local branch submitted several successive applications for mutual-aid funds to expand the dormitories, renovate the bathing facilities, and purchase medical equipment. The work was indeed completed, and the home has continued to admit injured workers without interruption. Judging from the premises alone, one could hardly claim that the money had been wasted.\n\nIt was the construction accounts that attracted the investigators' attention. The building cooperative responsible for the renovations had not submitted the lowest local bid, yet the budget was increased four times during construction, bringing the final expense to almost twice the original estimate. The beds, boilers, and rehabilitation equipment purchased for the home had also passed through the same cooperative and were generally priced above comparable purchases made by neighbouring communes. The local branch explained that the work could not be allowed to delay the admission of injured workers and that this particular cooperative was prepared to accept deferred-payment certificates issued by the CGT. Paying a little more, it argued, was therefore not unreasonable.\n\nThis explanation was not entirely without merit. Many workers' facilities had been constructed in similar haste after the revolution, and disorderly accounts were sometimes no more than the result of material shortages and local administrative habits. The investigation team subsequently discovered, however, that the cooperative's accountant had formerly served as the branch's financial secretary. The two committee members responsible for approving the additional funding had also entered the cooperative's paid employment after their retirement. There was no evidence that they had directly embezzled the mutual-aid funds, but a procurement process in which money circulated among a close circle of acquaintances could hardly be described as open and impartial.\n\nPublishing the available evidence would prove, at most, that a local branch had tolerated favouritism and inflated prices. The CGT could simply dismiss several officials and attribute the entire affair to inadequate supervision at the grassroots. Yet the documents contain one detail that remains unexplained: every budget increase was accompanied by supplementary funding from Paris, always recorded under the same rarely used accounting category. Perhaps this was merely an expedient adopted by central financial officers to cover local shortfalls. Perhaps this unremarkable convalescent home is merely one exposed corner of a far more widespread practice.\n\nContinuing the investigation would require setting the other files aside and tracing several apparently ordinary payment vouchers upwards through the organization. The investigators cannot guarantee that anything lies behind them, nor can they promise that several days of work will uncover anything more than an old and confused system of bookkeeping."
  fcf_economy_event.7.a:0 "Dig deeper."
  fcf_economy_event.7.b:0 "We should pursue another line of inquiry."

  fcf_economy_event.8.title:0 "CGT Investigation File A-2"
  fcf_economy_event.8.desc:0 "Following the payment vouchers back to Paris immediately produced the investigation team's first difficulty: the accounting category recorded in the files did not exist in the CGT's central financial office. The Saint-Étienne branch claimed that the money came from a ‘Temporary Workers' Facilities Grant,’ while Paris insisted that no such grant had ever appeared as a separate item in the annual budget. Examining the two sets of ledgers separately made it appear that the money had both been issued by the central office and never passed through it at all.\n\nThe investigators eventually found the answer among a batch of correspondence awaiting destruction. The so-called ‘Temporary Workers' Facilities Grant’ was not an official budget item, but an internal revolving arrangement established by the central financial office to meet urgent local expenses. Every year, the industrial federations transferred small portions of their sectoral mutual-aid funds into several cooperative accounts. Whenever a local branch required money that could not conveniently be included in the regular accounts, the financial office instructed one of these cooperatives to transfer it under the guise of a construction contract, equipment purchase, or advance payment for supplies. On paper, these appeared to be ordinary transactions between cooperatives; in reality, every payment carried an authorization number issued by the central financial staff.\n\nThe arrangement may initially have been intended merely to circumvent a sluggish budgetary process. A leaking roof at a convalescent home could not wait until the next congress to be repaired, nor could the hospital beds needed by injured workers be debated for months between successive committees. Once removed from public scrutiny, however, the temporary arrangement gradually developed rules of its own. A small circle familiar with the authorization numbers privately decided which branches would receive assistance, which cooperatives would obtain the contracts, and how much additional funding would be granted. The excess paid for the Saint-Étienne convalescent home did not enter any clearly identifiable private account. Part of it was instead returned by the cooperative to the revolving fund in Paris and then used to cover deficits left by other branches.\n\nThe investigation team still cannot prove that anyone embezzled the mutual-aid funds. The CGT can plausibly argue that all the money was ultimately spent upon workers' causes and that the only problem lay in irregular procedure. At the very least, however, the investigators have proved that the inflated prices in Saint-Étienne did not result solely from the local branch acting on its own initiative. Paris not only understood how the accounts operated, but actively maintained a financial channel beyond the supervision of either the congress or the ordinary membership.\n\nMore importantly, the investigators copied the complete correspondence between the authorization numbers, the initials of the officials involved, and the cooperative accounts. Publishing the evidence now would be enough to force the CGT to admit that its central financial system has long permitted off-the-books transfers, but might not produce a greater scandal. If these records remain in the file for the time being, those seemingly tedious numbers may yet appear elsewhere."
  fcf_economy_event.8.a:0 "Checkmate!"
  fcf_economy_event.8.b:0 "This is not enough. What else is there?"

  fcf_economy_event.9.title:0 "CGT Investigation File B"
  fcf_economy_event.9.desc:0 "The second batch of noteworthy documents came from the Roubaix textile industrial federation. During the previous spring, several local textile mills held factory-committee elections at the same time. The CGT printed leaflets, arranged speeches, and supplied organizers for its candidates. None of these activities violated any rule: every union was entitled to nominate candidates, and workers had the right to choose trusted representatives by secret ballot. The problem was that three factories ultimately elected independent candidates, after which they experienced a series of changes that could hardly be dismissed as coincidence.\n\nWithin two weeks of the elections, the three factories suffered successive reductions in their quotas of imported dyes, while equipment repairs that were supposed to be financed by the sectoral mutual-aid fund were postponed. The industrial federation also transferred several cooperative orders to neighbouring factories, explaining that the newly elected factory committees had ‘not yet demonstrated their willingness to observe industrial coordination.’ One of the factories elected a CGT-backed chairman six months later, whereupon its dyes, orders, and repair funds were immediately restored. The other two refused to hold new elections and remained classified in internal documents as ‘non-cooperating units.’\n\nThe industrial federation had prepared a comprehensive explanation. The Roubaix textile industry was experiencing a shortage of raw materials at the time, requiring all allocations to favour the more efficient factories capable of fulfilling their exchange agreements on schedule. After taking office, the new committees in the three factories had demanded the renegotiation of exchange ratios and refused to accept some elements of the common production arrangements. Assigning them a lower priority was therefore not political retaliation, but a normal response to the costs created by their ‘non-cooperation.’ As for the factory whose quotas were restored after returning to CGT leadership, its new committee had also withdrawn the objections raised by its predecessor.\n\nIn a pile of drafts left in the local office, however, investigators discovered an unusual classification table. The factories were not ranked according to output, costs, or fulfilment of agreements, but labelled ‘reliable,’ ‘wavering,’ or ‘contact lost.’ On the very day the election results were announced, the names of all three factories were moved from ‘reliable’ into the final category. An unsigned note in the margin read: ‘A material lesson will help the comrades vote more soberly next time.’\n\nThis sentence alone cannot prove that the industrial federation systematically used raw materials and mutual-aid funds to influence workers' votes. It may have been no more than an angry remark left by a local official, while the resource adjustments can indeed be justified on production grounds. Several former committee members nevertheless claim that CGT organizers privately promised that every quota problem would be resolved immediately if the factories elected ‘people capable of cooperation.’ No one is willing to provide a written statement, and no one can say whether these promises originated with the local branch or at a higher level.\n\nTo dig deeper, we would have to inspect the records of successive raw-material allocation meetings and locate the organizers who have since left their posts. If similar classification tables existed only in Roubaix, the affair would prove at most that one local institution had crossed the boundaries of legitimate union competition. If the same language was used to classify factories elsewhere, however, then behind every supposedly free election there may always have been a hand resting upon the raw-material valve."
  fcf_economy_event.9.a:0 "Dig deeper."
  fcf_economy_event.9.b:0 "We should pursue another line of inquiry."

  fcf_economy_event.10.title:0 "CGT Investigation File B-4"
  fcf_economy_event.10.desc:0 "The classification table used by the Roubaix office was not an isolated example. After examining the records of successive raw-material allocation meetings, the investigation team found almost identical tables in the textile archives of Lille, Troyes, and Rouen. The terminology varied slightly from place to place: some classified factories as ‘reliable,’ ‘under observation,’ or ‘outside coordination,’ while others used ‘active,’ ‘passive,’ and ‘hostile.’ In every case, however, changes in classification followed factory-committee elections rather than quarterly production reports or annual coordination meetings.\n\nIn principle, a factory's ‘reliability’ depended upon whether it fulfilled its industrial exchange agreements, submitted production data on time, and accepted common technical standards. Yet when investigators compared these records with actual production, they found that factories with stable output and no arrears in mutual-aid contributions were suddenly labelled ‘passive participants in coordination’ merely because their workers had elected committees supported by independents or free trade unions. Other factories that had consistently failed to meet production recommendations continued to enjoy priority access to raw materials and orders as long as their committee chairmen remained members of the CGT. At least on these lists, ‘reliability in coordination’ did not measure whether a factory observed industrial arrangements, but whether its workers had elected people trusted by the CGT.\n\nMore direct evidence came from an internal circular sent to the local offices by the organizational department of the national textile industrial federation. The circular did not instruct anyone to punish political opponents. It merely reminded local officials that, during periods of scarcity, priority should be given to factories ‘possessing stable organizational relations and capable of implementing collective resolutions over the long term,’ and recommended that factory-committee election results be considered during quota reviews. The wording of the main text was sufficiently cautious, but the accompanying review form recorded the union affiliation of the committee chairman, the proportion of votes cast against CGT candidates, and whether ‘autonomist tendencies’ existed within the factory. Production data occupied only the final few columns.\n\nThe investigators also identified the source of the phrase ‘a material lesson.’ It was not an angry remark casually written by a clerk in Roubaix, but a statement made by an organizer from the national textile industrial federation during an internal meeting. According to the minutes, he argued that workers naturally possessed the freedom to elect their committees, but that choosing ‘people unwilling to cooperate’ should also entail the material consequences of that decision. The meeting did not formally vote upon his statement, but subsequently adopted a new quota-review procedure. During the following months, at least nine factories that elected committees unaffiliated with the CGT were downgraded. Six recovered their former treatment after restoring CGT leadership.\n\nThe CGT can still argue that these factories were genuinely more inclined to resist common production arrangements and that the industrial federation was entitled to allocate limited resources to members more willing to cooperate. No ballots were falsified, and no one ordered the workers to choose a particular candidate. Yet when raw materials, repair funds, cooperative orders, and even sickness and injury benefits are used to remind workers of the cost of making the ‘wrong choice,’ the freedom preserved by the secret ballot becomes purely formal.\n\nThese documents do not prove that every industrial federation within the CGT employed the same methods, but they are sufficient to disprove the claim that the Roubaix office acted beyond its authority on its own initiative. If the file is published now, the textile industrial federation will have to answer whether it was coordinating production or using the mutual-aid network upon which the entire industry depended to preserve its electoral advantage. Alternatively, we can withhold the evidence for now and search for a case of greater weight and less room for dispute."
  fcf_economy_event.10.a:0 "Checkmate!"
  fcf_economy_event.10.b:0 "This is not enough. What else is there?"

  fcf_economy_event.11.title:0 "CGT Investigation File C"
  fcf_economy_event.11.desc:0 "The third file initially appeared to be nothing more than a wooden cabinet omitted from the transfer inventory. It stood in the innermost archive room of the organizational department of the national metalworkers' industrial federation. Its doors bore no identifying number, yet its drawers contained several thousand workers' cards arranged in meticulous order. The cards were not filed by membership number, but according to factory, workshop, and commune of residence. Nor did they merely record membership dues, occupation, and employment history. They listed the political meetings each worker had attended, whom they had supported in factory-committee elections, whether they regularly attended church, and which members of free trade unions or opposition activists they associated with.\n\nThe federation called them ‘organizational liaison records.’ According to the organizational department, the CGT needed to understand the real conditions inside each factory if it was to dispatch suitable organizers, mediate internal disputes, and prevent forces intent upon disrupting production from exploiting periods of weakness. Much of the information had been obtained from public meetings, membership records, and the routine reports of local representatives. No one had secretly opened correspondence or entered private homes. The occasional references to family relationships, religious habits, and personal disputes merely demonstrated that grassroots organizers had indiscriminately recorded too much detail, not that the CGT had deliberately set out to pry into workers' private lives.\n\nThe investigators soon discovered, however, that the cards were not used solely to organize union work. Some names bore a red stamp reading ‘employ with caution,’ while others were marked ‘unsuitable for transfer’ or ‘not to be assigned to sensitive posts.’ During the previous two years, dozens of workers had been rejected when applying for transfer to better-paying federal factories, technical training, or positions as warehouse supervisors. The personnel committees responsible gave a variety of explanations, yet almost every rejected applicant could be found in the wooden cabinet. Some had left the CGT, others had campaigned for independent candidates, and a few merely lived in the same apartment building as someone under observation.\n\nMore disturbing still, the metalworkers' industrial federation was not the only organization to use these files. Circulation records in the corners of the cards showed that railway, chemical, and dockworkers' organizations had repeatedly requested information about particular workers. Several circulars from the organizational department also reminded local branches to check the ‘organizational record’ of workers arriving from elsewhere before accepting them, lest someone already deemed unreliable in one region be reassigned to a sensitive position in another. A person could leave his factory or move to another city, but could scarcely escape a card whose existence had never been disclosed to him.\n\nThe available evidence is sufficient to show that the CGT maintained a clandestine system for screening workers outside the formal personnel process. To prove that these records genuinely determined access to employment, training, and promotion, however, the investigation team must compare the cards with personnel records from across the country and find committee members willing to admit that they consulted the files. This would expand the investigation from a small number of CGT officials to several thousand ordinary workers. Their political positions, family relationships, religious lives, and even private disputes would all be copied, classified, and verified anew by government investigators.\n\nWith this wooden cabinet alone, we have already uncovered something capable of shaking the entire country. Yet if we now turn to other files, the CGT may still dismiss the cards as poorly managed grassroots records that never actually influenced a single decision. To close off that defence, we must determine what happened after each of those stamps was applied."
  fcf_economy_event.11.a:0 "Dig deeper."
  fcf_economy_event.11.b:0 "We should pursue another line of inquiry."

  fcf_economy_event.12.title:0 "CGT Investigation File C-3"
  fcf_economy_event.12.desc:0 "The official personnel files were almost unassailable. Workers denied training, transfers, or promotions were invariably told that they lacked sufficient seniority or technical qualifications, or that the relevant position had been eliminated. Not one decision mentioned political views, and no committee member admitted to screening applicants according to trade-union affiliation. Judging by these records alone, the CGT could plausibly claim that the wooden cabinet had never influenced anyone's fate.\n\nOutside the official files, however, the investigation team discovered a collection of ‘organizational inquiries.’ Whenever a worker applied for a position in an important factory, warehouse, or technical department, the personnel committee might ask the industrial federation to verify his ‘organizational record’ under the pretence of confirming his employment history. The replies usually contained only a few words—‘trustworthy,’ ‘continued observation advised,’ or ‘unsuitable for transfer’—but corresponded precisely with the markings on the secret cards. Workers marked ‘employ with caution’ would frequently be rejected several days later for an apparently unrelated reason.\n\nSeveral former members of personnel committees admitted that they had never received formal orders to exclude dissenters, but that few people dared disregard the organizational department's opinion. Leaving the CGT, supporting an independent candidate, or merely associating with members of the opposition could prevent a worker from obtaining a position even after passing every examination. The industrial federation did not have to decide directly who would receive employment. It needed only to provide a few ambiguous remarks, and the personnel committee would find a regulation-compliant justification for rejection.\n\nThe evidence is now sufficient to prove that these secret cards were not merely internal notes indiscriminately collected by grassroots officials and then left unused. Through informal inquiries, they entered recruitment, training, and job transfers, establishing an invisible and unappealable system of political screening behind the public personnel process. Once the files are published, every worker who ever lost an opportunity without explanation will begin to wonder whether his own name was also hidden inside one of those drawers.\n\nThe investigation team still cannot determine how many people were affected. To establish the consequences of every card, investigators have begun obtaining household registers, residency records, and reports on local meetings to identify vague references such as ‘brother-in-law,’ ‘housemate,’ or ‘frequent associate.’ Some have proposed interviewing neighbours and inspecting private correspondence to reconstruct every relationship among those concerned.\n\nOne member of the investigating commission raised an awkward question: we began by investigating how the CGT had pried into the lives of citizens, but are now reproducing its files to prove that it did so. Our purpose may be entirely different, but that distinction may offer little comfort to ordinary people whose names, beliefs, and private associations now appear in two sets of dossiers. The evidence already in our possession can deal the CGT a devastating blow. If we insist upon discovering the whole truth, we must continue opening drawers that should never have been opened by the government at all."
  fcf_economy_event.12.a:0 "Checkmate!"
  fcf_economy_event.12.b:0 "We need to know the whole truth."
  fcf_economy_event.12.c:0 "This is not enough. What else is there?"

  fcf_economy_event.13.title:0 "The Investigation Is Halted"
  fcf_economy_event.13.desc:0 "A request for assistance sent by the investigation team to the commune councils eventually reached a Parisian newspaper. It instructed local authorities to verify the family relationships, changes of residence, and political activities of several hundred workers, and included a detailed questionnaire: whether they attended religious services, whether they associated with opposition members, whether workers from outside the locality lodged in their homes, and even how neighbours described their everyday conduct. The newspaper withheld the names, but printed the questionnaire in full upon its front page.\n\nPublic opinion changed direction almost immediately. Only days earlier, people had been asking what right the CGT possessed to record workers' private lives in secret. Now they discovered that, in attempting to demonstrate the harm caused by those records, the government had established a similar network of coordinated inquiries among the communes. The investigation team emphasized that all information would be used only to reconstruct the experiences of the victims and would play no role in recruitment or political screening, but the explanation failed to calm the resulting anger. For those whose names appeared in both sets of files, their families, beliefs, and private associations had become material for strangers to examine for a second time.\n\nThe CGT seized the opportunity to counterattack. It admitted that certain industrial federations had committed ‘serious administrative misconduct’ in maintaining their records, but accused the government of using the investigation as a pretext to collect information about citizens and subject union members—and even ordinary residents—to political surveillance. Several former personnel officials who had been preparing to testify withdrew their statements, while commune authorities began refusing to provide further registration records. The opposition in the General Federal Council promptly submitted an interpellation demanding that the Committee of Public Safety explain the scope of the investigation and identify every department that had handled the information.\n\nWe can, of course, argue that the purposes of the two systems were entirely different: the CGT used clandestine records to determine workers' futures, while the investigation team sought to expose that practice. Yet the inquiry can no longer continue without incurring an even greater political cost. The Committee of Public Safety has no choice but to terminate the coordinated investigation, seal the recently obtained private information, and issue a public apology to the citizens affected. The facts already uncovered by Investigation File C will not disappear, but few people are presently willing to listen to the government speak about them."
  fcf_economy_event.13.a:0 "A necessary evil..."

  fcf_economy_event.14.title:0 "CGT Investigation File D"
  fcf_economy_event.14.desc:0 "The fourth file concerned the CGT's three most recent national congresses. The investigation team initially intended only to verify several claims for delegates' travel expenses, but discovered a persistent discrepancy between the number of people actually present and the number of votes recorded in the minutes. Local unions unable to send someone to a congress would frequently delegate their voting rights to representatives of an industrial federation or a neighbouring branch. Consequently, a single delegate sitting in the hall might simultaneously hold mandates from more than a dozen local organizations. This did not violate the CGT's statutes, but it allowed a small number of people familiar with the delegation procedure to control far more votes than their physical numbers suggested.\n\nThe problem lay in a collection of mandates. Some documents had not been dated until after the congress opened, some bore only an obsolete stamp from the local branch, and others came from unions that had long ceased paying dues and had fewer than ten active members. Several delegates had even been registered as proxies for other branches without their knowledge, with the congress secretariat casting the votes recorded under their names. In recent years, several crucial ballots concerning the election of the central leadership and amendments to the statutes crossed the required threshold only because of these proxy votes.\n\nThe CGT leadership does not deny these facts. It explains that many small unions lack the funds to send delegates and that local secretaries are often unfamiliar with the proper procedures for issuing mandates. Strictly rejecting every incomplete document would exclude remote regions and weaker trades from the congress altogether. By correcting mandates and arranging proxies, the secretariat merely intended to ensure that every grassroots organization retained a voice. As for branches that had ceased paying dues, they continued to possess the representational rights guaranteed by the statutes so long as they had not formally dissolved.\n\nWhen the investigation team compared the mandates with the results of successive ballots, however, it discovered that this tolerance was not applied impartially. Late mandates supporting proposals from the central leadership were generally corrected without difficulty, while documents from opposition branches were rejected for unclear stamps or missing signatures. Several delegates who regularly collected proxies on behalf of the central leadership also contacted small unions that had never intended to attend before each congress and urged them ‘not to waste their voice.’ The irregularities discovered so far are sufficient to suggest that the CGT leadership used an ambiguous proxy system to preserve its majority within the congress.\n\nThe evidence nevertheless leaves considerable room for dispute. We cannot prove that the secretariat forged any mandate, nor determine whether local branches surrendered their votes under pressure or simply preferred to entrust complicated congress business to experienced delegates. If we could locate an independent representative involved in handling the mandates, we might reconstruct how these proxies were created. If no one is willing to testify, further investigation may prove nothing beyond the longstanding disorder of the CGT's congress procedures.\n\nThe existing file is already sufficient to cast doubt upon the fairness of several crucial ballots. We can publish it immediately, or continue tracing the suspicious mandates in search of the people who actually brought them into the congress hall."
  fcf_economy_event.14.a:0 "Dig deeper."
  fcf_economy_event.14.b:0 "Checkmate!"

  fcf_economy_event.15.title:0 "CGT Investigation File D-7"
  fcf_economy_event.15.desc:0 "The breakthrough came from an independent delegate who had been responsible for verifying mandates at the previous congress. After the congress ended, he discovered that seven local branches had been recorded as having delegated their votes to him, although four had never contacted him. When he questioned the secretariat, he was told only that ‘the local comrades were unfamiliar with the procedure, so the central office made the necessary arrangements.’ The relevant records soon disappeared from the official files. Fortunately, he had already copied the authorization numbers and preserved several documents the secretariat had instructed him to acknowledge on the branches' behalf.\n\nUsing those numbers, the investigation team discovered a ‘delegate strength estimate’ prepared before the congress opened. Rather than merely counting the known supporters of each faction, it listed every local branch that had not yet selected a proxy and recorded beside it the representative who should receive its delegated vote. Some of these arrangements predated the dispatch of mandates by the local branches. In other words, before the grassroots had decided who would represent them, the secretariat had already counted their votes as part of the central majority. The document also calculated the minimum number of votes required to amend the statutes and elect the central leadership. The final results differed from these estimates by only a handful of votes.\n\nThe independent delegate also provided correspondence between the secretariat and local organizers. The central office did not directly order any branch to support a particular proposal, but instructed the organizers to help ‘make suitable arrangements for the voting rights of comrades unable to attend.’ A single telegram was sufficient to complete a mandate for a politically reliable branch. Branches suspected of supporting the opposition, by contrast, were repeatedly ordered to provide minutes of their meetings, membership signatures, and the newly authorized stamp. Several mandates that were rejected were actually more complete than documents admitted to the congress. The only difference was the intended recipient of their votes.\n\nThe strongest evidence came from two local unions that had long ceased functioning. Their delegated votes appeared at three successive congresses, even though the secretary of one branch had died years ago and the remaining members of the other had merged into a neighbouring organization five years previously. The secretariat knew that the branches existed only on paper, yet preserved their representational rights on the grounds that their formal deregistration remained incomplete, allowing delegates trusted by the central office to vote on their behalf. Some of the grassroots voices recorded in the congress accounts had therefore come from meeting rooms that had long stood empty.\n\nThe CGT can still argue that remote branches genuinely require assistance from the central office to participate in national affairs, and that many defects in their mandates resulted from weak organizational capacity at the grassroots. The available evidence proves, however, that the secretariat was not passively correcting confusion. Before the congress opened, it calculated the votes, distributed the proxies, and applied different standards to determine which grassroots voices would enter the hall. It did not crudely fabricate a single ballot, but wove exceptions, corrections, and procedural conveniences into a stable majority.\n\nOnce these files are published, the controversy will concern not merely a handful of proposals, but the central leaderships and statutory resolutions produced by the last three congresses. The CGT has always claimed that its authority derives from successive mandates issued by workers at the grassroots. It must now explain why those votes ‘from the grassroots’ already knew where they were supposed to go before the grassroots had even met."
  fcf_economy_event.15.a:0 "Checkmate!"

  fcf_economy_event.16.title:0 "CGT Investigation File D-5"
  fcf_economy_event.16.desc:0 "The investigation team traced each of the suspicious mandates in the hope of finding someone who could explain how the proxy votes had been collected, completed, and distributed. After several weeks, however, most of the answers remained vague. Local secretaries claimed that they could no longer remember who had proposed delegating their votes, while the proxies insisted that every mandate had been verified by the secretariat. The congress secretariat admitted only that it had helped local organizations complete their paperwork and denied ever deciding how any branch's votes should be cast.\n\nSome of the irregularities also received explanations that were disreputable but nonetheless plausible. Many mandates dated only after the congress opened had previously been confirmed by telephone or telegram. Several delegates who initially claimed to know nothing about their proxy votes later admitted that they had vaguely agreed to ‘look after the votes of neighbouring branches,’ but had not realized that this would grant them so many ballots. Even several unions that had long ceased paying dues produced fragmentary minutes from local meetings, proving that they had not, at least nominally, ceased all activity.\n\nThe investigators certainly uncovered an abundance of disorder: unsigned mandates, obsolete stamps used for years, proxy arrangements never communicated to the delegates concerned, and verification records added to the files only after the congress ended. Yet disorder alone does not prove manipulation. The CGT can plausibly argue that this was merely a representative system kept functioning through customary practices. It may have favoured organizations familiar with the central leadership, but no document proves that the secretariat calculated its majority in advance or deliberately falsified the wishes of the grassroots.\n\nAs the investigation failed to produce a breakthrough, the CGT gained time to prepare its response. The central committee voluntarily published a collection of mandate records, admitted that the administration of previous congresses had been deficient, and announced that all future proxy arrangements would require a vote at a local meeting and advance registration. The secretariat would also be prohibited from selecting proxies on a branch's behalf. The opposition can still point out that these reforms themselves demonstrate the unfairness of the old system, but in the eyes of the public, the controversy has receded from ‘the central leadership manipulated the congress’ to ‘the CGT's procedures require reform.’\n\nThe original irregularities have not disappeared, and the fairness of several crucial votes will continue to be questioned. Yet we allowed the moment when the evidence possessed its greatest impact to pass without uncovering anything capable of closing off every defence. Continuing the investigation would merely send us in circles among the same collection of stamps, signatures, and meeting minutes. Ultimately, all Investigation File D can prove is that the CGT's democratic procedures are far less perfect than it claims."
  fcf_economy_event.16.a:0 "Let the matter rest."

  fcf_economy_event.17.title:0 "Legalized Bribery"
  fcf_economy_event.17.desc:0 "The investigation team's new target is an executive secretary of the national mechanical-engineering industrial federation. He has served in the CGT for almost twenty years, reviewing equipment-purchasing proposals submitted by factories across the country and helping distribute the federation's funds for technical modernization. During the past several months, he has participated in the approval of several substantial machine-tool orders, most of which were awarded to an engineering cooperative in Lyon.\n\nThere is no evident problem with the orders themselves. The cooperative did not submit the lowest bid, but promised to standardize component specifications, train factory technicians, and accept partial payment in labour vouchers. The federation's technical committee concluded that these conditions were sufficient to offset the difference in price. Every decision was approved collectively, and the secretary possessed no authority to select a successful bidder on his own. Judging solely by the minutes, this was an entirely ordinary industrial procurement process.\n\nThe cooperative subsequently paid him an ‘editorial fee’ equivalent to several months' wages. Officially, the payment purchased the rights to a machine-tool maintenance manual he had written years earlier and permitted the cooperative to distribute it among workers undergoing training. The contract was properly registered and the royalties declared. The industrial federation's statutes do not prohibit officials from receiving income from professional publications. In legal terms, the source of the money is clear and arguably more transparent than most private earnings.\n\nWhat arouses suspicion is the timing. The cooperative had already used the manual several years ago without ever proposing to purchase its rights. Only after the first orders were approved did the two parties suddenly conclude a contract. The fee declared by the secretary was also far higher than the customary payment for comparable technical publications in recent years. More conveniently still, the agreement established no minimum print run: even if the cooperative printed only a few hundred copies, it would still be required to pay the full sum at once.\n\nWe have examined his declarations and the relevant meeting records, but found no falsified accounts, secret correspondence, or evidence that he interfered in the vote. He can argue that the cooperative decided to purchase the manual formally only after expanding its training programme, and that the amount paid was a matter of voluntary agreement between the parties. So long as the procedure remained legal, the government cannot describe a payment as a bribe merely because its timing appears inappropriate.\n\nA legal contract can nevertheless provide a respectable disguise for an illegal transaction. Continued surveillance of his contacts and an examination of the cooperative's internal accounts may eventually uncover the true connection between the editorial fee and the equipment orders. Alternatively, we can admit that the existing evidence is insufficient to open a case and redirect the investigation towards a more vulnerable target."
  fcf_economy_event.17.a:0 "Sooner or later, he will show his true colours."
  fcf_economy_event.17.b:0 "Find another target."

  fcf_economy_event.18.title:0 "An Innocent Man Accused"
  fcf_economy_event.18.desc:0 "The investigation team never saw the executive secretary ‘show his true colours.’ Several days of surveillance recorded nothing more than his journeys between the federation office, the factory canteen, and his home, occasionally interrupted by an evening visit to several elderly industrial workers. The examination of the cooperative's accounts also uncovered no secret repayment. The editorial fee came from its publishing and training budget, appeared in full in its quarterly report, and was never transferred onwards to anyone involved in the equipment purchases.\n\nThe true explanation lay in a collection of much older correspondence. Factories across the country had reproduced the machine-tool maintenance manual for years. Only after assuming responsibility for a unified training programme did the Lyon cooperative discover that many of its technical drawings still belonged to the author. It initially asked the secretary to surrender his rights without payment, but he merely demanded that it cease producing inferior copies lest erroneous diagrams injure apprentices. The cooperative's workers' committee subsequently insisted upon paying him for several years of past use and purchasing the revised edition, illustrations, and future training materials outright. This was why the contract greatly exceeded the customary fee for an ordinary manuscript.\n\nAs for the machine-tool orders, the original assessment forms retained by the technical committee show that the secretary did not advocate on the cooperative's behalf. On the contrary, he twice demanded that the volume purchased be reduced because its prices were too high. The standardized specifications and training programme that ultimately secured the cooperative's selection had been proposed by technicians representing several factories. During the final vote to select the supplier, the secretary voluntarily left the chamber because negotiations over the manual's rights were still underway. These details were absent from the abbreviated minutes we had previously examined, making two events that happened close together appear exceptionally suspicious.\n\nStill more embarrassing facts soon followed. The executive secretary had donated most of the fee to the mutual-aid fund for disabled industrial workers, retaining only the amount required to redraw the diagrams. He had kept this private because he did not wish to turn a charitable contribution into an ornament for his personal reputation. Over many years, he had also regularly paid union dues on behalf of workers in hardship and helped them find employment. When news spread that the government was investigating him, many arrived at the CGT of their own accord carrying receipts and letters to testify on his behalf.\n\nThe CGT did not waste the opportunity. It published the contract, assessment forms, and the mutual-aid fund's receipt together, describing the investigation as ‘a demonstration of how the government manufactures evidence in its search for criminals.’ We arrested no one and filed no formal charge, but surveilling a respected veteran union official and examining his private correspondence has been enough to disgrace the entire inquiry. The once-suspicious fee has become proof of his innocence, while our suspicions have helped the CGT recover some of its lost credibility."
  fcf_economy_event.18.a:0 "Damn it."

  fcf_economy_event.19.title:0 "A Delegate's Discovery"
  fcf_economy_event.19.desc:0 "Our delegate to the CGT was originally responsible only for communicating federal economic policy and attending coordination meetings concerning public investment. He possessed no authority to demand that the CGT disclose its internal accounts, and few people discussed the organization's finances in his presence. Consequently, when the mechanical-engineering, transport, and construction industrial federations submitted their investment-allocation tables for the following quarter, the financial staff regarded him as no more than an observer routinely acknowledging receipt of the documents and did not bother removing several of the appendices.\n\nOn paper, every expenditure had a clear purpose: technical inspections, inter-industrial coordination, temporary warehousing, or revolving assistance for factories in difficulty. The delegate noticed, however, that several payments from mutual-aid funds belonging to different industries ultimately entered the same regional clearing house. The clearing house then transferred the money to several cooperatives and workers' mutual-aid societies under the heading of ‘advance payments.’ Shortly after receiving the funds, these organizations would make ‘voluntary contributions’ of similar value to CGT conference funds, propaganda funds, or officials' travel accounts.\n\nExamined individually, none of these transactions can easily be described as embezzlement. An industrial federation may authorize a local institution to settle payments on its behalf, while cooperatives genuinely possess an obligation to contribute towards the CGT's public activities. Yet after each group of funds completes its circuit, a small portion invariably disappears from the next financial statement. The amounts are generally modest, while the headings constantly change: processing fees, emergency reserves, organizational liaison expenses, or temporary loans for which receipts have yet to be submitted. No individual account suffers a sufficiently large loss to attract attention, but the same gaps have persisted for years.\n\nMore significantly, every one of these payments required the approval of a senior CGT official who enjoys considerable popularity among the workers. He regularly obtains assistance for factories in difficulty and willingly uses the funds under his control to support the families of strikers. Even if the investigation team published its current evidence, many beneficiaries would probably regard the irregularities as nothing more than an old comrade taking a practical shortcut around cumbersome procedures. If compared with the files and testimony obtained earlier, however, these scattered discrepancies may reveal a network far larger than any case of individual bribery.\n\nThe delegate can continue monitoring transactions through the clearing house and attempt to obtain original receipts that have not yet entered the archives. His position is already sensitive, however. If he begins requesting financial appendices too frequently, the CGT will quickly realize that the government has transformed an observer into an investigator. This newly opened crack may lead us into the heart of the corruption network—or close again before we can see the people concealed within it."
  fcf_economy_event.19.a:0 "Excellent. Keep a close watch."
  fcf_economy_event.19.b:0 "We had better not alert them."

# Economic Construction
  fcf_economy_event.20.title.eng:0 "Revive the Channel Tunnel Project?"
  fcf_economy_event.20.title.frat:0 "Britain Agrees"
  fcf_economy_event.20.title.fraf:0 "Britain Refuses"
  fcf_economy_event.20.desc.eng:0 "The Commune of France has approached us with a proposal to revive construction of the Channel Tunnel, finally establishing a direct link between our two countries."
  fcf_economy_event.20.desc.frat:0 "The British government has accepted our proposal to revive the Channel Tunnel project. Construction of this great link between our two revolutionary countries can now begin."
  fcf_economy_event.20.desc.fraf:0 "The British government has declined our proposal to revive the Channel Tunnel project, declaring that it cannot spare the resources required for construction."
  fcf_economy_event.20.engt:0 "Of course we accept."
  fcf_economy_event.20.engf:0 "We have no resources to spare."
  fcf_economy_event.20.frat:0 "A toast to our comrades!"
  fcf_economy_event.20.fraf:0 "What a pity."

# Economic Events
  fcf_economy_event.21.title:0 "Innovations in Power Engineering"
  fcf_economy_event.21.desc:0 "The Lyon Regional Industrial Federation has optimized its chassis production lines and used surplus materials to expand its assembly workshops."
  fcf_economy_event.21.a:0 "Excellent."

  fcf_economy_event.22.title:0 "Deep-Water Port Automation"
  fcf_economy_event.22.desc:0 "Marseille has introduced a new automated lifting system, greatly improving the port's handling efficiency and attracting additional shipbuilding orders."
  fcf_economy_event.22.a:0 "Excellent."

  fcf_economy_event.23.title:0 "Breakthrough in Deep-Seam Mining"
  fcf_economy_event.23.desc:0 "The Nancy Mining Administration Committee has discovered high-quality deposits deep beneath an old mining district. Targeted technical improvements have increased the region's resource output."
  fcf_economy_event.23.a:0 "Excellent."

  fcf_economy_event.24.title:0 "Precision-Manufacturing Cooperative"
  fcf_economy_event.24.desc:0 "The Saint-Étienne Regional Technical Cooperative has assembled a specialist team to develop precision machine tools, providing vital domestic technical support to heavy industry throughout the Federation."
  fcf_economy_event.24.a:0 "Excellent."

  fcf_economy_event.25.title:0 "Metropolitan Transport-Network Upgrade"
  fcf_economy_event.25.desc:0 "The Paris Commune has approved a plan integrating public transport with the intercity logistics system, reducing commuting costs and releasing the productive potential of the capital region."
  fcf_economy_event.25.a:0 "Excellent."

  fcf_economy_event.26.title:0 "Mechanization of Agricultural Production"
  fcf_economy_event.26.desc:0 "The agricultural administration in Tours has successfully introduced new agricultural machinery to local farms. The labour thereby released has been reassigned to the industrial sector according to plan."
  fcf_economy_event.26.a:0 "Excellent."

  fcf_economy_event.27.title:0 "Aeronautical Propulsion Integration Programme"
  fcf_economy_event.27.desc:0 "The aeronautical research institution in Toulouse has merged its operations with the local power-engineering department. This inter-industrial cooperation has enabled an experimental propulsion workshop to begin production immediately."
  fcf_economy_event.27.a:0 "Excellent."

  fcf_economy_event.28.title:0 "Deep-Sea Fishing Supply Chain"
  fcf_economy_event.28.desc:0 "The Lorient Fisheries Federation has expanded its modern refrigerated port facilities and established an armed self-defence force to secure the sea lanes along the Breton coast."
  fcf_economy_event.28.a:0 "Excellent."

  fcf_economy_event.29.title:0 "Reorganization of Heavy-Industrial Facilities"
  fcf_economy_event.29.desc:0 "Through an exchange of resources, the industrial administration in Lille has successfully converted a group of idle light-industrial premises into an efficient production centre for heavy machinery."
  fcf_economy_event.29.a:0 "Excellent."

  fcf_economy_event.30.title:0 "Regional Power Facilities Completed"
  fcf_economy_event.30.desc:0 "A major hydroelectric facility near Clermont-Ferrand has been completed ahead of schedule, providing the surrounding industrial districts with exceptionally cheap and reliable power."
  fcf_economy_event.30.a:0 "Excellent."

  fcf_economy_event.31.title:0 "Chemical-Industry Trade Agreement"
  fcf_economy_event.31.desc:0 "The chemical industry in Bordeaux has acquired a highly efficient refining process and exchanged it with overseas partners for a shipment of urgently needed strategic raw materials."
  fcf_economy_event.31.a:0 "Excellent."

  fcf_economy_event.32.title:0 "Industrial Application of Scientific Research"
  fcf_economy_event.32.desc:0 "Research into communications technology conducted by laboratories in Paris has rapidly been transformed into new industrial standards, greatly improving administrative coordination between the government and the factories."
  fcf_economy_event.32.a:0 "Excellent."

  fcf_economy_event.33.title:0 "Metal-Smelting Industrial Cluster"
  fcf_economy_event.33.desc:0 "Taking advantage of the abundant energy supply around Caen, the metalworking sector has established a highly integrated aluminium-refining complex in the region."
  fcf_economy_event.33.a:0 "Excellent."

  fcf_economy_event.34.title:0 "Construction of a New Workers' Community"
  fcf_economy_event.34.desc:0 "The completion of the standardized residential community in Saint-Denis has greatly improved local social stability and significantly stimulated economic activity throughout the region."
  fcf_economy_event.34.a:0 "Excellent."

  fcf_economy_event.35.title:0 "International Material-Exchange Exposition"
  fcf_economy_event.35.desc:0 "A flood of orders from our allies arrived during the Paris exposition, while international trade produced a substantial improvement in the country's overall economic position."
  fcf_economy_event.35.a:0 "Excellent."

  fcf_economy_event.36.title:0 "Port Fuel-Reserve Centre"
  fcf_economy_event.36.desc:0 "The port authorities in Le Havre have converted former fortifications into an enormous fuel depot and streamlined loading procedures to accommodate the port's steadily increasing volume of traffic."
  fcf_economy_event.36.a:0 "Excellent."

  fcf_economy_event.37.title:0 "Industrial Accident and Administrative Paralysis"
  fcf_economy_event.37.desc:0 "A severe explosion at a major factory in Saint-Denis has temporarily paralyzed the local administration and extensively damaged the data retained by its accounting system."
  fcf_economy_event.37.a:0 "This is bad."

  fcf_economy_event.38.title:0 "Mine Flooding and Loss of Supplies"
  fcf_economy_event.38.desc:0 "A severe flooding accident in Pas-de-Calais has not only interrupted mining operations, but also forced us to expend large quantities of emergency supplies upon rescue work and repairs."
  fcf_economy_event.38.a:0 "This is bad."

  fcf_economy_event.39.title:0 "Port-Supply Disaster"
  fcf_economy_event.39.desc:0 "A devastating fire in the Marseille docklands has destroyed large quantities of goods awaiting export, together with several pieces of essential shipbuilding equipment."
  fcf_economy_event.39.a:0 "This is bad."

  fcf_economy_event.40.title:0 "Distribution-System Parameter Failure"
  fcf_economy_event.40.desc:0 "A serious computational error by the Paris statistical department has disrupted the allocation of resources, interrupting the supply of several goods and provoking widespread public discontent."
  fcf_economy_event.40.a:0 "This is bad."

  fcf_economy_event.41.title:0 "Disruption of Industrial Coordination"
  fcf_economy_event.41.desc:0 "An internal administrative dispute at a major component supplier in Saint-Étienne has temporarily brought military-equipment production throughout the region to a halt."
  fcf_economy_event.41.a:0 "This is bad."

  fcf_economy_event.42.title:0 "Technical Equipment Looted"
  fcf_economy_event.42.desc:0 "Armed bands on the Savoyard frontier have looted a shipment of imported precision machine tools, obstructing regional modernization and damaging the government's prestige."
  fcf_economy_event.42.a:0 "This is bad."

  fcf_economy_event.43.title:0 "Industrial Pollutant Leak"
  fcf_economy_event.43.desc:0 "An industrial environmental disaster in Lyon has forced several nearby factories to suspend production for decontamination. The administration must now devote considerable resources to compensation and restoration."
  fcf_economy_event.43.a:0 "This is bad."

  fcf_economy_event.44.title:0 "Critical Power Hub Damaged"
  fcf_economy_event.44.desc:0 "A severe failure at a critical node in the Paris electrical grid has forced the shutdown of local factories and inadvertently destroyed part of our experimental research data."
  fcf_economy_event.44.a:0 "This is bad."

