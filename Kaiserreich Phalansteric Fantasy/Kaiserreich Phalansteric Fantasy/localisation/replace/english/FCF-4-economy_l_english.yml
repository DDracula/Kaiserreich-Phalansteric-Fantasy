## Events
  fcf_economy_events.1.title:0 ""
  fcf_economy_events.1.desc:0 ""
  fcf_economy_events.1.a:0 ""

  fcf_economy_events.2.title:0 "Anniversary March for the Affaire Martin"
  fcf_economy_events.2.desc:0 "It all began as an ordinary industrial accident at a machine works on the outskirts of Paris. During an overtime shift, the punch press operated by Lucien Martin suddenly went out of control, robbing him of both hands. The factory insisted that the machine was in working order and that the accident had been caused entirely by Martin's negligence. It offered him only enough compensation to cover the bare minimum of his medical expenses. The foreman, Jacques, sided with the owner. As far as he was concerned, Martin's persistent refusal to join the Confédération générale du travail meant that he had no right to seek the union's help after the accident.\n\nNo one had witnessed the precise moment of the accident, and the machine's maintenance records could not substantiate Martin's account. The local labour arbitration tribunal ultimately accepted the factory's defence and ruled that Martin himself was responsible for his disability. The lawyer Henri Torrès subsequently agreed to take his case without charge. Arguing that it concerned the fundamental workplace protections owed to workers outside the CGT, Torrès secured special leave to appeal and submitted Martin's petition directly to the Federal Supreme Court. Public sympathy, however, was no substitute for the evidence demanded by the court, and the Supreme Court upheld the original ruling.\n\nTwo successive defeats did not put the controversy to rest. Instead, they transformed what had begun as a routine workplace dispute into an increasingly prominent public scandal. Anarchists began to suspect that Martin's misfortune had not been an isolated accident. Several investigators bypassed the factory management and local authorities and began privately tracing the origins of the machinery and the factory owner's local connections. Just as their inquiry began to approach the secrets concealed behind the machine works, two of the investigators were killed in a hotel explosion.\n\nThe explosion instantly ignited all the resentment that had accumulated around the case. Protesters took to the streets demanding the truth about the investigators' deaths, newspapers asked what the local authorities were attempting to conceal, and the General Federal Council began to hold the government accountable for its prolonged failure of oversight. Monmousseau could not withstand the resulting political storm and was eventually forced from office. Dumoulin assumed control of the government amid the crisis created by the bombing—and inherited an old case that could no longer be set aside.\n\nThe new government immediately ordered a formal investigation, hoping that a comprehensive official report could reconstruct the course of events. The Union anarchiste, however, refused to surrender control over the revelation of the truth to the government. Before the official inquiry could conclude, it published the evidence already in its possession, forcing information previously dismissed as rumour into public view. Only then did the public learn that the punch press had indeed been old and poorly maintained. The factory owner had also operated several unregistered sweatshops elsewhere and had repeatedly evaded inspection through his personal connections in the local government and the CGT.\n\nThose involved were subsequently punished, the sweatshops were closed, and the longstanding collusion between Jacques and the factory owner was exposed. Yet these belated revelations did not automatically overturn the ruling against Martin. Relying on the new evidence, Torrès brought another action, naming the owner, the local government, and the CGT as co-defendants. He sought to demonstrate that the injustice inflicted upon Martin had not arisen solely from the actions of one foreman or one factory owner, but from an entire network capable of obstructing oversight and excluding non-members. The court ultimately ruled, however, that the owner's exploitation of personal relationships was insufficient to establish the legal liability of the CGT as a whole. Torrès's attempt to broaden the nature of the case also exceeded what the available evidence could support. Martin lost once again.\n\nThe case was therefore left with a particularly absurd conclusion. The sweatshops had unquestionably existed, the machinery had unquestionably been neglected, and the factory owner had unquestionably used acquaintances within the CGT to avoid inspection. Yet the man who had lost both hands as a result remained legally responsible for his own accident under the original judgment. The press began referring to the entire affair as the ‘case against the CGT.’ Supporters of the CGT maintained that an entire workers' organization could not be placed in the dock for the corruption of a handful of individuals. Its opponents asked whether the organization could truly dismiss everything as private misconduct when the CGT's name had served as protection for well-connected local figures, and when workers excluded for not being members still had nowhere to seek justice.\n\nOn the second anniversary of Martin's final defeat, crowds once again took to the streets of Paris. Some demanded that the original judgment against him be overturned. Others called for a comprehensive investigation into the local networks attached to the CGT. Still others simply hung an empty pair of work gloves around their necks and followed the procession in silence. By the time the march reached the General Federal Council, the question confronting the new government had long since ceased to concern only one workplace accident: did the equality promised to the workers by the revolution also belong to those who had never joined the CGT?"
  fcf_economy_events.2.a:0 "History will hold us to account in the end."
  FCF_economy_CGT_reform_protest:0 "The Affaire Martin March"
  FCF_economy_CGT_reform_protest_desc:0 "The repercussions of the wrongful judgment against Monsieur Martin two years ago continue to be felt today. Within the government, the question of reforming the CGT remains under discussion—or, more accurately, remains the subject of mutual political attacks. The people, however, have run out of patience. The previous government failed to resolve the issue, and now that a new government has been elected, the final judgment on the CGT has become one of the most difficult matters confronting it. On one side stands an opposition increasingly hostile toward the CGT; on the other are the many ordinary workers whose livelihoods depend upon it. Whatever course we choose, continued refusal to reform the organization will only allow its hidden dangers to multiply."
  FCF_economy_CGT_reform_protest_tt:0 "§RWe should reform the CGT as soon as possible.§!"
  FCF_economy_CGT_reform_protest_has_happened:0 "The Affaire Martin March has occurred"

