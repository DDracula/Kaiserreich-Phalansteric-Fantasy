  FCF_economy_calais_cross_harbor_tunnel_desc:0 "As early as the Napoleonic era, proposals were made for an undersea tunnel linking Calais and Dover, and thereby France and Britain. For various reasons, however, none of these proposals ever came to fruition. Following the British Revolution, the idea was once again placed on the agenda. We reached a preliminary agreement with Britain in 1926, but the construction project ultimately came to nothing in 1929. Nevertheless, voices in both our countries have continued to call for closer ties between the two fraternal revolutionary states. Perhaps the time has come to resume construction of the Channel Tunnel."
