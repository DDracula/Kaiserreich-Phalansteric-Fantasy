l_english:
# Economy Decisions
  FCF_economy_category:0 "Economy of the Commune"
  FCF_economy_category_desc:0 "Many problems cannot be solved merely by proclaiming the victory of the revolution, least of all those concerning the economy. Ruins and wreckage will not transform themselves into new factories. Faced with the old Republic devastated by the Great War, a bewildering array of economic schools now seeks to inscribe its own vision upon this freshly bleached parchment. The extensive autonomy enjoyed by the local communes, combined with the balance among the political factions, prevented our economic model from receiving a definitive answer during the revolutionary years. It is now time to settle the matter. Without a clearly established economic system, we cannot ensure that the political fruits of the revolution will remain beyond the reach of our enemies.\n"

