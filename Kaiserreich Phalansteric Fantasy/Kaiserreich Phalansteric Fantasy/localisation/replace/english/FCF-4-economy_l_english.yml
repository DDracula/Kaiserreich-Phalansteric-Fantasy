# Economic Construction
  fcf_economy_events.20.title.eng:0 "Revive the Channel Tunnel Project?"
  fcf_economy_events.20.title.frat:0 "Britain Agrees"
  fcf_economy_events.20.title.fraf:0 "Britain Refuses"
  fcf_economy_events.20.desc.eng:0 "The Commune of France has approached us with a proposal to revive construction of the Channel Tunnel, finally establishing a direct link between our two countries."
  fcf_economy_events.20.desc.frat:0 "The British government has accepted our proposal to revive the Channel Tunnel project. Construction of this great link between our two revolutionary countries can now begin."
  fcf_economy_events.20.desc.fraf:0 "The British government has declined our proposal to revive the Channel Tunnel project, declaring that it cannot spare the resources required for construction."
  fcf_economy_events.20.engt:0 "Of course we accept."
  fcf_economy_events.20.engf:0 "We have no resources to spare."
  fcf_economy_events.20.frat:0 "A toast to our comrades!"
  fcf_economy_events.20.fraf:0 "What a pity."

# Economic Events
  fcf_economy_events.21.title:0 "Innovations in Power Engineering"
  fcf_economy_events.21.desc:0 "The Lyon Regional Industrial Federation has optimized its chassis production lines and used surplus materials to expand its assembly workshops."
  fcf_economy_events.21.a:0 "Excellent."

  fcf_economy_events.22.title:0 "Deep-Water Port Automation"
  fcf_economy_events.22.desc:0 "Marseille has introduced a new automated lifting system, greatly improving the port's handling efficiency and attracting additional shipbuilding orders."
  fcf_economy_events.22.a:0 "Excellent."

  fcf_economy_events.23.title:0 "Breakthrough in Deep-Seam Mining"
  fcf_economy_events.23.desc:0 "The Nancy Mining Administration Committee has discovered high-quality deposits deep beneath an old mining district. Targeted technical improvements have increased the region's resource output."
  fcf_economy_events.23.a:0 "Excellent."

  fcf_economy_events.24.title:0 "Precision-Manufacturing Cooperative"
  fcf_economy_events.24.desc:0 "The Saint-Étienne Regional Technical Cooperative has assembled a specialist team to develop precision machine tools, providing vital domestic technical support to heavy industry throughout the Federation."
  fcf_economy_events.24.a:0 "Excellent."

  fcf_economy_events.25.title:0 "Metropolitan Transport-Network Upgrade"
  fcf_economy_events.25.desc:0 "The Paris Commune has approved a plan integrating public transport with the intercity logistics system, reducing commuting costs and releasing the productive potential of the capital region."
  fcf_economy_events.25.a:0 "Excellent."

  fcf_economy_events.26.title:0 "Mechanization of Agricultural Production"
  fcf_economy_events.26.desc:0 "The agricultural administration in Tours has successfully introduced new agricultural machinery to local farms. The labour thereby released has been reassigned to the industrial sector according to plan."
  fcf_economy_events.26.a:0 "Excellent."

  fcf_economy_events.27.title:0 "Aeronautical Propulsion Integration Programme"
  fcf_economy_events.27.desc:0 "The aeronautical research institution in Toulouse has merged its operations with the local power-engineering department. This inter-industrial cooperation has enabled an experimental propulsion workshop to begin production immediately."
  fcf_economy_events.27.a:0 "Excellent."

  fcf_economy_events.28.title:0 "Deep-Sea Fishing Supply Chain"
  fcf_economy_events.28.desc:0 "The Lorient Fisheries Federation has expanded its modern refrigerated port facilities and established an armed self-defence force to secure the sea lanes along the Breton coast."
  fcf_economy_events.28.a:0 "Excellent."

  fcf_economy_events.29.title:0 "Reorganization of Heavy-Industrial Facilities"
  fcf_economy_events.29.desc:0 "Through an exchange of resources, the industrial administration in Lille has successfully converted a group of idle light-industrial premises into an efficient production centre for heavy machinery."
  fcf_economy_events.29.a:0 "Excellent."

  fcf_economy_events.30.title:0 "Regional Power Facilities Completed"
  fcf_economy_events.30.desc:0 "A major hydroelectric facility near Clermont-Ferrand has been completed ahead of schedule, providing the surrounding industrial districts with exceptionally cheap and reliable power."
  fcf_economy_events.30.a:0 "Excellent."

  fcf_economy_events.31.title:0 "Chemical-Industry Trade Agreement"
  fcf_economy_events.31.desc:0 "The chemical industry in Bordeaux has acquired a highly efficient refining process and exchanged it with overseas partners for a shipment of urgently needed strategic raw materials."
  fcf_economy_events.31.a:0 "Excellent."

  fcf_economy_events.32.title:0 "Industrial Application of Scientific Research"
  fcf_economy_events.32.desc:0 "Research into communications technology conducted by laboratories in Paris has rapidly been transformed into new industrial standards, greatly improving administrative coordination between the government and the factories."
  fcf_economy_events.32.a:0 "Excellent."

  fcf_economy_events.33.title:0 "Metal-Smelting Industrial Cluster"
  fcf_economy_events.33.desc:0 "Taking advantage of the abundant energy supply around Caen, the metalworking sector has established a highly integrated aluminium-refining complex in the region."
  fcf_economy_events.33.a:0 "Excellent."

  fcf_economy_events.34.title:0 "Construction of a New Workers' Community"
  fcf_economy_events.34.desc:0 "The completion of the standardized residential community in Saint-Denis has greatly improved local social stability and significantly stimulated economic activity throughout the region."
  fcf_economy_events.34.a:0 "Excellent."

  fcf_economy_events.35.title:0 "International Material-Exchange Exposition"
  fcf_economy_events.35.desc:0 "A flood of orders from our allies arrived during the Paris exposition, while international trade produced a substantial improvement in the country's overall economic position."
  fcf_economy_events.35.a:0 "Excellent."

  fcf_economy_events.36.title:0 "Port Fuel-Reserve Centre"
  fcf_economy_events.36.desc:0 "The port authorities in Le Havre have converted former fortifications into an enormous fuel depot and streamlined loading procedures to accommodate the port's steadily increasing volume of traffic."
  fcf_economy_events.36.a:0 "Excellent."

  fcf_economy_events.37.title:0 "Industrial Accident and Administrative Paralysis"
  fcf_economy_events.37.desc:0 "A severe explosion at a major factory in Saint-Denis has temporarily paralyzed the local administration and extensively damaged the data retained by its accounting system."
  fcf_economy_events.37.a:0 "This is bad."

  fcf_economy_events.38.title:0 "Mine Flooding and Loss of Supplies"
  fcf_economy_events.38.desc:0 "A severe flooding accident in Pas-de-Calais has not only interrupted mining operations, but also forced us to expend large quantities of emergency supplies upon rescue work and repairs."
  fcf_economy_events.38.a:0 "This is bad."

  fcf_economy_events.39.title:0 "Port-Supply Disaster"
  fcf_economy_events.39.desc:0 "A devastating fire in the Marseille docklands has destroyed large quantities of goods awaiting export, together with several pieces of essential shipbuilding equipment."
  fcf_economy_events.39.a:0 "This is bad."

  fcf_economy_events.40.title:0 "Distribution-System Parameter Failure"
  fcf_economy_events.40.desc:0 "A serious computational error by the Paris statistical department has disrupted the allocation of resources, interrupting the supply of several goods and provoking widespread public discontent."
  fcf_economy_events.40.a:0 "This is bad."

  fcf_economy_events.41.title:0 "Disruption of Industrial Coordination"
  fcf_economy_events.41.desc:0 "An internal administrative dispute at a major component supplier in Saint-Étienne has temporarily brought military-equipment production throughout the region to a halt."
  fcf_economy_events.41.a:0 "This is bad."

  fcf_economy_events.42.title:0 "Technical Equipment Looted"
  fcf_economy_events.42.desc:0 "Armed bands on the Savoyard frontier have looted a shipment of imported precision machine tools, obstructing regional modernization and damaging the government's prestige."
  fcf_economy_events.42.a:0 "This is bad."

  fcf_economy_events.43.title:0 "Industrial Pollutant Leak"
  fcf_economy_events.43.desc:0 "An industrial environmental disaster in Lyon has forced several nearby factories to suspend production for decontamination. The administration must now devote considerable resources to compensation and restoration."
  fcf_economy_events.43.a:0 "This is bad."

  fcf_economy_events.44.title:0 "Critical Power Hub Damaged"
  fcf_economy_events.44.desc:0 "A severe failure at a critical node in the Paris electrical grid has forced the shutdown of local factories and inadvertently destroyed part of our experimental research data."
  fcf_economy_events.44.a:0 "This is bad."

  fcf_economy_events.45.title:0 "Hidden Event: Determine Economic Event"
  fcf_economy_events.45.desc:0 "This event is not displayed to the player."
  fcf_economy_events.45.a:0 "Error."

