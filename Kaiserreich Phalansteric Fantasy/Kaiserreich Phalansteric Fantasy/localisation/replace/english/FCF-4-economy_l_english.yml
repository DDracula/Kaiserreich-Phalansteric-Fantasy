  fcf_economy_event.45.desc:0 "This event is not displayed to the player."
  fcf_economy_event.45.a:0 "Error."

# Continued CGT Events
  fcf_economy_event.46.title:0 "The Corruption Network"
  fcf_economy_event.46.desc:0 "The original receipts obtained by our delegate have finally connected the previously disparate clues. By comparing the names in the secret files with expenditures from the industrial federations' mutual-aid funds and transactions through the regional clearing house, the investigation team discovered that the mechanical-engineering, transport, construction, and several other industries were all employing similar methods. Money was first allocated under the guise of temporary assistance or inter-industrial coordination, then transferred successively through cooperatives, mutual-aid societies, and local branches. Part of it ultimately entered activity funds whose actual purposes could not be verified.\n\nThis was not one enormous sum divided among a handful of people, but an extensive network of relationships. Some officials secured contracts for familiar cooperatives, some used industrial mutual-aid funds to cover the deficits of their local branches, and others obtained additional income through falsified travel expenses, duplicate reimbursements, and procurement kickbacks. The amount diverted by each participant was seldom extraordinary, and much of the money was indeed spent assisting factories in difficulty or supporting the families of strikers. Everyone involved nevertheless understood that their own privileges could continue only if they signed documents for others, supplied missing receipts, and remained silent during audits.\n\nAt the centre of the network stood no secret institution, but an understanding that had gradually developed among the upper ranks of the CGT. Officials in the industrial federations concealed deficits for the local branches, whose organizations repaid them with support at congresses and internal elections. After receiving preferential contracts, cooperatives would voluntarily assume expenses that should have been paid by the CGT. The accounts could always be made to balance on paper. What was actually being eroded were the industrial mutual-aid funds, the bargaining power of individual factories, and the position of grassroots organizations with no influential connections.\n\nThe available evidence is sufficient to place dozens of officials under investigation, including important figures responsible for allocating raw materials, organizing technical training, and administering inter-industrial settlements. If every suspect were dismissed and arrested at once, the ordinary coordination work of several industrial federations might immediately come to a halt. More troublingly, not everyone involved obtained private benefit. Some unquestionably enriched themselves, while others merely continued arrangements inherited from their predecessors so that money could bypass inflexible procedures and reach factories in time. Drawing a clear boundary within this network of mutual protection will prove far more difficult than uncovering it.\n\nWe can publicly punish several particularly notorious offenders against whom the evidence is indisputable, warning the remaining officials to abandon their practices. Alternatively, we can withhold the full evidence and use it to force concessions from the CGT leadership during the coming reforms. If we believe that corruption, however minor, must never be forgiven, then our only option is to arrest every person on the list and prepare for the resistance and disorder that will follow."
  fcf_economy_event.46.a:0 "Punishing a few will serve as a warning to the rest."
  fcf_economy_event.46.b:0 "We can use this to pressure them."
  fcf_economy_event.46.c:0 "Arrest every corrupt official!"

  fcf_economy_event.47.title:0 "A Political Persecution in the Making"
  fcf_economy_event.47.desc:0 "The operation encountered resistance almost as soon as the arrest lists reached the districts. A small number of officials against whom the evidence was indisputable were immediately taken into custody, but many others simply refused to surrender the keys to their offices or hand over their account books. Their colleagues gathered outside the industrial federations and demanded that the investigators explain every charge individually. Several factory committees announced that they would not recognize any provisional administrator until the government proved that the arrested officials had genuinely embezzled public money. An operation intended to last several days rapidly became a confrontation encompassing multiple industries.\n\nThe CGT leadership denounced the list as a ‘register of political purges.’ It placed particular emphasis upon the fact that many of those arrested had never placed a single franc in their own pockets. Some had transferred mutual-aid funds without authorization to factories on the verge of closure; others had retrospectively approved overdue assistance for the families of strikers; still others had done nothing more than sign an account on a superior's behalf. The government regards them as joint participants in a corruption network, while the CGT claims that they merely kept grassroots organizations functioning despite the rigidity of the existing system.\n\nThis defence deliberately obscures the falsified claims, procurement kickbacks, and private division of funds, but it is not entirely without foundation. In attempting to dismantle the entire network, the investigation team placed those who concealed information or irregularly signed documents on the same operational list as officials who directly embezzled public money. The local authorities carrying out the arrests had no time to verify each case separately and could only act upon the names supplied by the central government. Consequently, a financial secretary who had plundered mutual-aid funds for years might be arrested on the same day and under the same charge as a local official who had merely released an early payment to an injured worker.\n\nSeveral disturbances quickly worsened the situation. In Saint-Étienne, police sent to seal the account books became involved in a scuffle with miners guarding the office. Transport workers in Marseille refused to move files seized by the investigation team, claiming that they contained members' private information. Newspapers printed photographs of arrested officials' families waiting for permission to visit them, while the CGT continually publicized the most sympathetic cases and remained silent about those who had genuinely enriched themselves. Before the corruption network had even faced a public trial, claims that ‘the government is using anti-corruption measures to destroy the CGT’ had spread throughout the country.\n\nEven people who previously supported the investigation are now demanding that the government stop. They do not believe the CGT to be innocent, but doubt whether arrests on this scale remain grounded in specific criminal acts. If we continue the operation, we will have to deploy additional police to seize control of the industrial federations by force and bear the resulting factory stoppages, grassroots protests, and interpellations in the General Federal Council. The prosecutions might still succeed, but the political wounds they create will not automatically disappear when judgments are delivered.\n\nAlternatively, we can withdraw every arrest warrant that has not yet been executed and prosecute only those against whom direct evidence already exists. This may calm the immediate resistance, but will amount to an admission that the original list was excessively broad. The CGT will inevitably portray our retreat as proof that the investigation could not withstand scrutiny, while the exposed network will use the opportunity to sever its financial trails, coordinate its testimony, and reinvent itself as the victim of political persecution."
  fcf_economy_event.47.a:0 "Abandon the remaining arrests."
  fcf_economy_event.47.b:0 "Continue the arrests."

  fcf_economy_event.48.title:0 "Political Wisdom"
  fcf_economy_event.48.desc:0 "The investigation report was not immediately delivered to the newspapers, nor were arrest lists dispatched throughout the country. Instead, several of the most important account books were brought into a meeting room far from the General Federal Council. The invited participants were several representatives of the CGT leadership headed by Jouhaux. They had not been formally summoned, and the government retained no public record of the meeting. Officially, at least, this was merely an informal consultation concerning future economic legislation.\n\nNo one denied what the account books contained. The CGT representatives simply explained, one item at a time, how unauthorized transfers had rescued factories on the verge of closure, how falsified travel expenses had been used to subsidize local organizations, and how the additional costs assumed by cooperatives had sustained strike funds. They described the money that had genuinely entered private pockets as ‘the weakness of individual comrades’ and insisted that this could not justify destroying the reputation of the entire organization. The government representatives did not argue. They merely placed several letters implicating members of the central committee upon the table.\n\nThe negotiations quickly moved beyond the corruption case itself. The economic reforms being prepared by the Committee of Public Safety would redefine the role of the industrial federations in allocating investment, managing factories, and conducting public procurement. The CGT had originally intended to mobilize its local branches against these provisions, but if the investigative evidence were published now, it would struggle to organize resistance in the name of workers' interests. The government does not require the CGT to endorse the reforms publicly. It asks only that the central leadership exercise restraint and refrain from portraying every adjustment of authority as an attack upon the workers' organization.\n\nJouhaux made no written commitment. He merely stated that the CGT had never opposed ‘reforms genuinely beneficial to production and the workers’ and was prepared to restrain excessive action by its local organizations. In return, the government should confine the case to a small number of individuals against whom the evidence was incontrovertible and cease pursuing officials accused solely of irregular transfers and deficient accounting. Neither side need even acknowledge that an exchange had occurred. The government could declare that the investigation continued according to law, while the CGT could describe its subsequent silence as a contribution to federal unity.\n\nThe leverage in our possession could purchase still more. Several senior CGT figures have privately asked whether veteran comrades under investigation might still receive advisory positions in federal enterprises, whether industrial mutual-aid societies will continue to obtain public subsidies, and whether their own retirement benefits might be affected. With a few assurances, respectable appointments, and additional allowances, the common interests binding the CGT leadership together might begin to loosen from within. Their compliance would then arise not from the judgment of the organization, but from each individual's concern for his own future.\n\nThis would, of course, mean perpetuating through the anti-corruption investigation the very methods it uncovered: purchasing personal loyalty with public resources and describing the transaction as a politically necessary arrangement. The alternative is much simpler. We can refuse every private favour and make it clear that if the CGT obstructs reform, all the evidence will be made public. It may still resist, but it will first have to explain to the workers precisely what those accounts, proxies, and kickbacks were supposed to represent."
  fcf_economy_event.48.a:0 "The old comrades will be well provided for."
  fcf_economy_event.48.b:0 "What can they possibly do?"

  fcf_economy_event.49.title:0 "The Great Rat"
  fcf_economy_event.49.desc:0 "Our delegate failed to assemble the repeatedly rerouted payments into a corruption network encompassing the entire CGT, but unexpectedly identified one name far more conspicuous than the scattered discrepancies. A central secretary of the mechanical-engineering industrial federation had long been responsible for assisting factories in difficulty, administering workplace-injury relief, and arranging emergency procurement. Almost every large payment passing through the regional clearing house bore his signature. At first, the accounts merely appeared disorderly. Once the investigation team compared the original receipts with the official financial statements item by item, however, an enormous deficit could no longer be concealed among ‘processing fees’ and ‘revolving funds.’\n\nHis methods were unsophisticated but reliable. When the industrial federation allocated one hundred thousand francs, he instructed the local institution to record ninety-five thousand. Whenever a cooperative received an emergency loan, it would voluntarily retain several percentage points as a ‘liaison fee.’ The money passed through mutual-aid societies and purchasing offices controlled by his associates before being converted into cash, bonds, and several properties registered in the names of relatives. The amount confirmed so far alone exceeds what many ordinary workers will earn in their entire lives. In private, the investigators have given him an especially appropriate name—the ‘Great Rat.’\n\nYet the Great Rat's reputation among the workers is far cleaner than his accounts. He remembers the names of countless workers, whose wife has suffered a long illness, and whose son is seeking an apprenticeship. When workplace-injury benefits are delayed, he bypasses the local committee and authorizes payment directly. When a factory approaches closure, he can always extract emergency funds from some obscure budget item. During holidays, he often visits the mines and machine works in person, delivering food, coal vouchers, and relief payments to struggling families. Many workers have never seen another member of the CGT leadership, but all know that if they write to him, their problem may actually be resolved.\n\nThis generosity does not make him innocent. The investigation team discovered that only a small portion of the money he diverted was spent upon workers' relief; he kept most of the wealth for himself and his family. For those he genuinely helped, however, an abstract loss to the public means far less than a sack of coal, a paid medical bill, or a job saved from disappearance. They may understand that the old secretary's methods are not entirely proper, but prefer to regard them as an able man reclaiming something for the workers from an inflexible system.\n\nHis position rests upon precisely this exchange. Local officials complete his accounts and suppress questions; in return, he uses the assistance and orders under his control to reward loyal supporters. Favoured factories support him at congresses, while workers who benefited from his intervention transform their personal gratitude into support for an entire network of relationships. If the evidence is published, the Great Rat may be unable to explain the properties and bonds, but he may still portray the investigation as government persecution of ‘an old comrade willing to get things done for the workers.’\n\nThe existing evidence is already sufficient to press charges. The difficulty is that those attempting to arrest him may face not merely the CGT's lawyers, but hundreds or thousands of workers who sincerely believe that he helped them. We can take the risk and trust that publication of the accounts will eventually show them who truly paid for his generosity. Alternatively, we can temporarily abandon this dangerous target and prevent the investigation from ending in a confrontation with the workers."
  fcf_economy_event.49.a:0 "Once the truth is exposed, the workers will no longer admire him."
  fcf_economy_event.49.b:0 "We had better not take that risk."
  fcf_economy_event.49.c:0 "Ask the workers."

  fcf_economy_event.50.title:0 "The Rat's House"
  fcf_economy_event.50.desc:0 "When the arrest warrant reached the mechanical-engineering industrial federation, the Great Rat was not at home but sitting in the office where he regularly received visiting workers. The news had evidently arrived before the investigators. The corridors were crowded with workers from nearby factories, while several requisitioned lorries stood outside the courtyard gates. Some people had brought bread and hot soup; others sat upon the steps clutching blankets, prepared to remain there throughout the night. They carried no weapons and shouted no slogans against the government. They simply refused to allow those executing the warrant to pass through their ranks.\n\nThe investigation team had assumed that once the value of the properties, bonds, and secret accounts was revealed, the workers would understand what sort of man they were defending. Yet the people gathered outside did not deny the evidence. They merely asked who had saved several factories from closure, and who had advanced the money when workplace-injury benefits failed to arrive. One held up a worn letter of thanks, another brought a child who had recovered from illness, while a third openly admitted that he knew the old secretary did not always follow the rules but could not believe that investigators who had never entered a workshop cared more about workers' lives than he did.\n\nThe Great Rat made little effort to explain his property. He acknowledged that the accounts contained money he could not account for, but insisted that he had merely taken ‘money for which no one accepted responsibility’ and given it to ‘people who genuinely needed it.’ He casually described the houses and bonds registered to his relatives as the security deserved after many years of service, then asked the investigators a question of his own: if the government believed that he had stolen the workers' property, why were those same workers the ones preventing his arrest?\n\nHis argument naturally cannot withstand scrutiny. The investigation team has already proved that only a small proportion of the embezzled funds went towards relief and assistance; his supposed generosity amounted to purchasing personal loyalty with public property. That distinction, however, is difficult to explain at the courtyard gates. The workers remember a medical bill paid on time, a shipment of raw materials that reopened their factory, and a CGT official prepared to listen to their complaints. Those who received no assistance are not present, while the mutual-aid funds silently drained of their resources have no voice with which to defend themselves.\n\nAs the confrontation continues, CGT branches throughout the country have begun calling the office building ‘the Workers' House.’ More supporters are on their way, and newspapers have dispatched reporters. Enforcing the arrest would require us to push aside these unarmed workers and drag the Great Rat out from under their protection. The evidence would not disappear, nor would the charges become invalid, but what people first remember will probably not be the deficit in the accounts. They will remember how the police entered an industrial federation by force and clashed with workers who had come to protect an old comrade.\n\nWithdrawing the warrant now would have equally obvious consequences. The government has already made its accusation public, and the investigation team has confidently declared that the evidence is conclusive. Retreat would demonstrate only that the Great Rat's position is powerful enough to stop the law at the door. The CGT would portray the confrontation as a victory in which working-class solidarity defeated political persecution, while every grassroots official attempting to continue examining the accounts would understand that the government would offer them no protection.\n\nThe building does not truly belong to the Great Rat, nor are the workers outside his private army. Yet so long as they believe that they are defending someone willing to act on their behalf, this place remains the strongest of the rat's nests. We can break down the door and hope that anger will one day give way to understanding. Alternatively, we can admit that, at least today, the cost of arresting one criminal has exceeded what we are prepared to bear."
  fcf_economy_event.50.a:0 "The workers will come to understand our use of force."
  fcf_economy_event.50.b:0 "Drop the charges."

  fcf_economy_event.51.title:0 "The Cockroach and the Rat"
  fcf_economy_event.51.desc:0 "The investigators did not directly ask the workers whether the central secretary had embezzled money. They merely visited several factories that had previously received industrial assistance and asked the workers to explain how the funds had been distributed, who had handled them, and whether anyone had demanded an additional favour in return. Whenever the Great Rat was mentioned, the answers were almost identical: his accounts might not be entirely proper, but he never allowed anyone in genuine need to leave empty-handed. Some even asked who within the CGT would remain willing to accept responsibility for the grassroots if officials such as him were subjected to investigation.\n\nThe workers' attitude changed completely whenever the investigators mentioned another local secretary responsible for reviewing assistance applications. This man rarely visited factories in person, preferring to summon applicants to his office and deliberately leave them waiting outside for hours. He might return an entire application because of an insignificant error on one form, or publicly humiliate factory representatives who came to request support. Even when an application was eventually approved, he always reminded the recipients that the assistance was not something to which they were entitled, but a personal favour secured because he had ‘put in a good word for them with the central office.’\n\nThe workers privately call him the ‘Cockroach.’ The nickname refers not only to his repellent behaviour, but also to his apparent ability to disappear whenever an irregularity in the accounts attracted auditors. Once the danger had passed, he would re-emerge in another office, on another committee, or in another temporary position. Some workers claim that he accepted gifts from cooperatives, while others saw him demand that suppliers provide employment for his relatives, but these complaints never became formal accusations.\n\nIt is the Great Rat who protects him. Whenever a local branch calls for the secretary's removal, the Great Rat intervenes and explains that although the man possesses an unpleasant temperament, he is highly reliable in his work. Workers subjected to the Cockroach's obstruction are frequently consoled by the Great Rat in person once their assistance is finally approved. Many do not believe the Cockroach to be innocent, but are unwilling to quarrel with an old secretary who genuinely helped them over such a detestable minor figure. Over time, everyone came to regard his demands, arrogance, and obstruction as one more procedure that had to be endured before assistance could be obtained.\n\nThis protection also explains why the Great Rat's reputation remains so secure. He never has to reject an application in person and seldom comes into direct contact with the ugliest transactions. The Cockroach guards the purse, screens applicants, and absorbs their resentment, while the Great Rat need only overturn one or two harsh decisions at the appropriate moment to appear before the workers as a generous benefactor. We still cannot prove that the two men jointly embezzled the missing funds, but they are plainly more than two officials who happen to know one another.\n\nMoving directly against the Great Rat would cause the workers to rally around him. Action against the Cockroach would encounter no comparable resistance. He is greedy, arrogant, and long accustomed to someone else cleaning up his mistakes. If offered a sufficiently tempting opportunity, he may personally hand us the evidence we require. Even if we catch only a cockroach, the rat behind the wall will understand that we have discovered the crack through which they both travel."
  fcf_economy_event.51.a:0 "Then it is our turn to act."

  fcf_economy_event.52.title:0 "Caught Red-Handed"
  fcf_economy_event.52.desc:0 "The opportunity arrived sooner than expected. A cooperative supplying machine-tool components was applying to renew its procurement contract, but the Cockroach returned its documents three times on the grounds that the explanation of its prices remained incomplete. Its representative subsequently received a discreet suggestion: if the cooperative agreed to assume an additional expense for ‘local liaison work,’ the contract would not only pass its review, but the outstanding payments owed to it would also be settled.\n\nAt the investigators' direction, the cooperative representative agreed to attend the meeting. He entered the Cockroach's office carrying registered banknotes, placed an envelope upon the desk, and asked whether the amount included ‘the central office's share.’ The Cockroach did not deny it. He merely recalculated the money with visible impatience, complained that the amount was far too small this time, and reminded the representative that the Great Rat could settle the cooperative's problems with the auditors but would not do so without compensation.\n\nOnly after the envelope had been locked inside a drawer did the investigators enter. The banknotes, procurement contract, and a ledger recording previous ‘liaison fees’ were discovered together. The Cockroach initially claimed that the payments were voluntary organizational contributions from the cooperative, then attempted to shift responsibility onto the Great Rat by arguing that he had merely collected the money on behalf of the central office. Neither explanation could account for the absence of receipts or explain why the payments had never entered an official CGT account.\n\nAlmost no one defended him when the news reached the factories. Workers previously subjected to his obstruction voluntarily supplied additional testimony, while several cooperatives admitted that they had exchanged gifts, positions, and cash for his signature. Even workers who continued to support the Great Rat were no longer prepared to describe the Cockroach's demands as necessary expedients. The government had not destroyed an official who acted on behalf of the grassroots. It had merely caught a universally detested bribe-taker with the proceeds of his crime in hand.\n\nThe ledger is not enough to convict the Great Rat alongside him. Most names are recorded only by initials, and there is no complete account of where the money intended for the ‘central office’ eventually went. Yet the Great Rat plainly understood the meaning of the arrest. He made no public appeal on behalf of his old friend, but quickly instructed every industrial federation to bring its accounts into order and terminate all unregistered financial transfers. For the first time, the rat concealed behind the workers' admiration has realized that its white gloves cannot protect it from the filth forever."
  fcf_economy_event.52.a:0 "Make an example of him!"

  fcf_economy_event.53.title:0 "Divide and Conquer"
  fcf_economy_event.53.desc:0 "The investigation has once again reached an impasse. Scattered receipts, meeting records, and testimony from the grassroots are sufficient to prove that corruption exists within the CGT, but have consistently failed to reach the senior officials who truly control its finances and appointments. Whenever investigators trace a suspicious payment upwards, they eventually encounter a properly authorized funding resolution. Whenever a local official prepares to speak, someone completes his accounts, transfers him to another position, or reminds him not to damage the unity of the organization.\n\nIf the CGT cannot be prised open from the outside, perhaps we can exploit the divisions that already exist within it. The CGT has never been a perfectly united organization. The Comités syndicalistes révolutionnaires have long accused the central bureaucracy of abandoning the grassroots, while Jouhaux and his supporters fear that local factions are eroding the authority of the central leadership. The Nouvelle Orientation faction, close to the Parti socialiste français, is also searching for opportunities to expand its influence. For every faction, corruption is not merely an abuse that should be eliminated, but a ready-made weapon against its rivals.\n\nThe Comités syndicalistes révolutionnaires may be prepared to surrender officials who depend upon the central leadership and exploit their positions for personal gain in exchange for our assistance in entering additional industrial federations. Jouhaux may similarly sacrifice several powerful local figures who refuse to obey the central leadership, allowing him to argue that the problem lies with a handful of officials who violated organizational discipline rather than with the CGT itself. As for Nouvelle Orientation, its close relations with the socialists mean that it is unlikely to object strongly to such limited cooperation.\n\nAny list they provide will be anything but impartial. Every accusation may be true, but every name will also have been politically selected. We may indeed remove corrupt officials, but will simultaneously eliminate the rivals of one faction and transform the government's investigation into part of the CGT's internal struggle. Moreover, the faction we approach may simply refuse to cooperate and instead reveal our attempt to divide the workers' organization.\n\nIt is an undignified approach, but perhaps the only way to break through the protection enjoyed by the senior leadership. We can select a potential ally, or refuse to enter these factional struggles and continue relying upon the limited evidence already in our possession."
  fcf_economy_event.53.a:0 "The Comités syndicalistes révolutionnaires also desire an honest CGT."
  fcf_economy_event.53.b:0 "Comrade Jouhaux is surely a reasonable man."
  fcf_economy_event.53.c:0 "We have like-minded comrades within the CGT."
  fcf_economy_event.53.d:0 "We can rely only upon ourselves."

  fcf_economy_event.54.title:0 "The Enemy Within"
  fcf_economy_event.54.desc:0 "The Comités syndicalistes révolutionnaires accepted our approach, but sent no prominent figure to the meeting. Several representatives arrived separately at the location arranged by the government, each carrying only part of the evidence. Only after satisfying themselves that we genuinely intended to cooperate did they assemble the documents into a complete list. Most of the people named were central secretaries of the CGT, financial committee members in the industrial federations, or directors of regional clearing institutions. Some names had already appeared in accounts obtained by the investigation team; others had never previously aroused suspicion.\n\nThe list was accompanied by a large collection of internal documents: meeting records excluded from the official archives, original receipts preserved by local branches, private correspondence in which officials discussed how to conceal deficits, and copies of several audit reports hurriedly destroyed before congresses. These materials show that those named did not merely sign documents for their colleagues, but had long participated in fictitious procurement, duplicate reimbursements, and the diversion of mutual-aid funds. Some profited personally, while others used public money to sustain their local factions. Once verified individually by the investigators, the evidence would be sufficient to bypass the protection of the CGT leadership and prosecute a group of senior officials directly.\n\nThe Comités syndicalistes révolutionnaires make no attempt to conceal their objective. In their view, these people remained corrupt for years because the CGT leadership had developed into a bureaucratic group beyond the supervision of the grassroots. Every internal review was organized by the same officials, every disciplinary measure required their approval, while local representatives demanding open accounts were instead marginalized for ‘damaging organizational unity.’ If the government genuinely intends to eliminate corruption, it cannot punish only a handful of financial secretaries. It must also break their control over the central institutions and industrial federations.\n\nTheir proposed exchange is explicit. The government will open investigations on the basis of these documents, remove the officials implicated, and remain silent when the CGT orders its local branches to obey the central leadership. In return, the Comités syndicalistes révolutionnaires will mobilize grassroots delegates to occupy the vacant positions and demand early elections for the governing bodies of several industrial federations. If the central leadership attempts to prevent these elections through administrative measures, we must recognize the provisional committees elected by local congresses and continue coordinating economic affairs with them.\n\nThis is unquestionably an intervention in the CGT's internal struggle disguised as an anti-corruption campaign. Yet the evidence supplied by the Comités syndicalistes révolutionnaires is not forged, and the people named are genuinely entangled in corruption. The problem is that the list has been carefully selected. Almost every senior official capable of obstructing their rise to power appears upon it, while officials close to them are described merely as having been ‘implicated by the old system,’ even when their names appear in the same suspicious accounts.\n\nThe investigation team will therefore obtain the breakthrough it has long desired, while the Comités syndicalistes révolutionnaires will obtain the positions they desire inside the emptied offices. Whether this ultimately produces a more honest CGT or merely one with new masters who have learned to keep more convincing accounts can only be judged in the future."
  fcf_economy_event.54.a:0 "A pleasure doing business with you."

  fcf_economy_event.55.title:0 "Loyal to the CGT"
  fcf_economy_event.55.desc:0 "The Comités syndicalistes révolutionnaires did not immediately reject our approach. They listened to the investigators' assessment of corruption among the senior leadership and asked, one by one, which accounts the government possessed, whom it intended to prosecute, and what assistance it was prepared to offer potential collaborators. Only as the meeting approached its conclusion did they ask the government representatives to state the terms more clearly: if they supplied a list of implicated officials, would we recognize their supporters as the successors to the vacant posts and side with them if the CGT leadership attempted to intervene?\n\nThe government representatives answered in the affirmative. In their view, this was merely an unavoidable part of playing one faction against another. The Comités syndicalistes révolutionnaires had opposed the central bureaucracy for years, and those on the list were genuinely likely to be involved in corruption. We would remove their opponents, while they opened the doors of the CGT to us. Each side would obtain what it wanted. So long as the meeting remained secret, everything that followed could be presented as the natural consequence of a lawful investigation and democratic elections at the grassroots.\n\nThe following morning, CGT newspapers simultaneously published detailed records of the meeting. The Comités syndicalistes révolutionnaires not only disclosed the government's proposed exchange, but appended several lists of questions brought by the investigators and a note requesting continued secret contact. The headline left us little room for explanation: the Committee of Public Safety had attempted to purchase an internal faction of the CGT and use a corruption investigation as a weapon for intervening in the workers' organization.\n\nIn their declaration, the Comités syndicalistes révolutionnaires did not absolve the central leadership. They acknowledged that mutual-aid funds had been embezzled, procurement manipulated, and favoured associates protected within the CGT. They also reiterated that officials who had transformed the workers' organization into personal domains must be removed. Yet they insisted that these problems should be addressed by grassroots branches opening their accounts, convening congresses, and holding the guilty to account themselves—not by the government selecting one faction and promising it the positions of another as a reward for cooperation.\n\n‘We oppose the bureaucrats within the CGT; we do not oppose the CGT itself.’ This sentence from the declaration soon appeared upon factory noticeboards, at branch meetings, and in the newspapers of every faction. Even the central faction that had previously argued most bitterly with the Comités syndicalistes révolutionnaires seized the opportunity, declaring that the affair proved the government's corruption investigation had always been intended to divide the workers' organization. Even workers deeply dissatisfied with the implicated officials began to suspect that every arrest list might conceal another undisclosed political bargain.\n\nWorse still, we can hardly deny the records. The government did propose cooperation and did intend to use the investigation's results to alter the balance of power within the CGT. No explanation concerning ‘limited contacts’ or ‘the requirements of the investigation’ can answer the simplest question: if our sole purpose was to prosecute corruption, why did we discuss in advance who would inherit the emptied offices?\n\nThe Comités syndicalistes révolutionnaires gained no positions from the affair, but acquired unprecedented prestige within the CGT. They demonstrated that they could denounce the central leadership in the strongest terms without surrendering the organization to an external power. The CGT leadership, meanwhile, unexpectedly acquired a weapon capable of uniting every faction. Once forced onto the defensive, the CGT now demands that the General Federal Council investigate whether the government abused its authority. For the first time, our anti-corruption campaign must confront the question: who investigates the investigators?"
  fcf_economy_event.55.a:0 "Those bastards!"

  fcf_economy_event.56.title:0 "Central Authority"
  fcf_economy_event.56.desc:0 "Jouhaux accepted our approach, but arranged the meeting in an unremarkable archive room at the CGT's central headquarters. There was no formal agenda, no record of the proceedings, and not even a mutually accepted description of the meeting. The government representatives regarded it as a secret consultation within the anti-corruption investigation; Jouhaux insisted that the CGT leadership was merely explaining certain disciplinary problems involving local organizations to the Committee of Public Safety. Whatever its official description, the archive boxes placed upon the table made it clear that he had not come empty-handed.\n\nMost of the names in the files belonged to leaders of industrial federations and local CGT organizations. They had long controlled the collection of dues, mutual-aid funds, and procurement contracts, and possessed their own newspapers, officials, and blocs of delegates within their localities. Some had not submitted complete accounts to the central organization for years, while others openly refused to implement its auditing decisions. At every congress, they joined forces in the name of local autonomy and syndical freedom to oppose Jouhaux's proposals for greater discipline. The CGT leadership knew that these people were disobedient, but had never found an opportunity to remove them.\n\nThat opportunity can now be found in their account books. Some lent workers' mutual-aid funds to cooperatives operated by relatives; some inflated the prices of emergency purchases; others simultaneously received allowances from several committees and claimed reimbursement for meetings and inspections that had never occurred. The central disciplinary department had discovered some of these irregularities before, but the local organizations refused to surrender their original accounts, while the accused could mobilize enough delegates to obstruct further inquiries. If the government assumes responsibility, many matters previously described as ‘internal disputes’ can become criminal cases.\n\nJouhaux did not claim that the list included every corrupt figure within the CGT. On the contrary, he frankly admitted that some officials with good relations with the central leadership also maintained disorderly accounts, made unauthorized transfers, and favoured their associates. In his view, however, those errors could still be corrected through internal discipline. The people on the list had transformed local organizations into personal territories, not only stealing the workers' property but deliberately undermining the unity of the CGT. Corruption was merely one reason why they had to be removed; their refusal to accept central authority was the offence that made them irredeemable.\n\nThe terms of the exchange were equally explicit. The CGT leadership would open the relevant archives to the investigation team, instruct local institutions to cooperate with the collection of evidence, and refrain from calling upon workers to resist the arrests. In return, the government must acknowledge that these cases represented the corruption of individual local leaders rather than a systemic problem tolerated by the CGT leadership. If local branches rejected temporary officials appointed by the central organization on the grounds of political persecution, the Committee of Public Safety must continue coordinating economic affairs only with governing bodies recognized by Jouhaux.\n\nThis cooperation will not weaken the CGT. Every removal of a locally entrenched secretary will allow the central leadership to recover some authority over appointments, finance, and discipline. Every recognition of a new leadership elected under its supervision will further consolidate Jouhaux's position. We hoped to weaken the CGT by exploiting its internal divisions, but may instead help it accomplish a centralization that has eluded it for years. Nevertheless, a CGT constrained by its central leadership and prepared to cooperate with government reforms may be easier to handle than a collection of competing local powers that simultaneously use workers' autonomy as their shield.\n\nThe accusations on the list have not been fabricated, and the deficits in the files can withstand investigation. We will genuinely punish a group of corrupt officials. The people deciding who should be punished first, however, are not the investigators but Jouhaux. The government will clear away disobedient local powerbrokers for the CGT leadership, while the CGT leadership opens previously sealed accounts to the government. Whether this constitutes cooperation against corruption or a transaction for power disguised in judicial language is something neither side needs to state too clearly."
  fcf_economy_event.56.a:0 "A pleasure doing business with you."

  fcf_economy_event.57.title:0 "Contempt for Division"
  fcf_economy_event.57.desc:0 "Jouhaux listened to the government representatives' proposal without examining the list of suspects upon the table. He first asked why the investigators considered these officials worthy of suspicion, then demanded to know whom the Committee of Public Safety intended to recognize as the successors to those removed. Only when the government representatives mentioned that the CGT leadership could use the opportunity to recover some authority over appointments and auditing did he finally understand that the meeting concerned more than missing union dues.\n\n‘So you want the CGT leadership to select criminals for the government, and the government to punish the leadership's enemies in return.’\n\nThe government representatives rejected this description. Those listed were genuinely suspected of corruption, while local powerbrokers had long obstructed central audits. If both sides supplied evidence and assistance, the workers' property could be recovered and discipline restored within the CGT. Who filled the vacancies after the accused were removed would merely be an unavoidable political consequence of the investigation. We had no intention of selecting the CGT's leaders; we wished only to continue cooperating with those capable of maintaining order.\n\nThis explanation did nothing to diminish Jouhaux's contempt. In his view, disputes between the CGT leadership and its local organizations, however bitter, remained an internal affair of the workers' movement. Today, the government might help the leadership remove disobedient local secretaries; tomorrow, it could support local secretaries against the leadership. Once the Committee of Public Safety was permitted to connect investigative lists with factional interests, every disciplinary measure adopted by the CGT would be suspected of having been dictated by the government, while every corrupt official removed from office could portray himself as a martyr to syndical autonomy.\n\nHe did not deny that corruption existed within the upper ranks of the CGT. On the contrary, Jouhaux admitted that the accounts of certain industrial federations had long required reform and that the central organization had made too many concessions to powerful local figures to avoid open conflict. This did not mean that he would surrender them to the government, still less that he would treat the leadership of the CGT as something to be obtained through an exchange. If the central organization could not discipline its own affiliates through its own authority, then borrowed authority would merely prove that it no longer deserved to lead the workers.\n\nThe meeting ended there. Jouhaux took the government's list with him but promised to provide no files. Before leaving, he warned the investigators that internal documents obtained without formal authorization from the CGT would no longer be treated as part of a good-faith inquiry. Within days, the central institutions began registering access to their archives anew, while local financial reports were ordered to be placed under the unified custody of the disciplinary department. No one publicly accused the government, but the scattered clues previously obtainable from different offices suddenly disappeared at the same time.\n\nUnexpectedly, Jouhaux did not reveal the approach to the newspapers either. Unlike the Comités syndicalistes révolutionnaires, he had no interest in using the government's mistake to gain prestige, since publicizing the secret meeting would also reveal that corruption among the CGT leadership had become serious enough to invite external intervention. More importantly, he would not permit any faction to use the affair as a weapon for mobilizing workers against one another. The evidence that the government had attempted to divide the CGT remained inside the meeting room, sparing the organization another internal storm.\n\nThis restraint has preserved our dignity, but left no path for the investigation to continue. Jouhaux refused to become the hand that the government extended into the CGT and has warned every senior official to lock his drawers. We have escaped a public attack, but may never discover how many account books incapable of withstanding scrutiny are concealed within those drawers."
  fcf_economy_event.57.a:0 "The ungrateful fool."

  fcf_economy_event.58.title:0 "A New Direction, New Candidates"
  fcf_economy_event.58.desc:0 "The Nouvelle Orientation faction within the CGT made almost no attempt to conceal its enthusiasm for our approach. As soon as the government representatives explained their intentions, the faction produced a list it had already compiled. Most of those named occupied positions in procurement, finance, or personnel. Some used fictitious contracts to embezzle mutual-aid funds, some bought delegates for their factions, and others reserved well-paid positions and places in convalescent homes for relatives. The accompanying accounts, correspondence, and witness information are already sufficient for the investigators to open formal cases.\n\nNouvelle Orientation is willing to open its archives and mobilize local officials to cooperate with the investigation. In exchange, once those implicated have been removed, the government must recognize the governing bodies newly elected by local delegates and support candidates who advocate closer cooperation between the CGT and the Parti socialiste français and accept public oversight. If the CGT leadership attempts to appoint their successors directly, the Committee of Public Safety must refuse to recognize its decision.\n\nTheir objective is not merely to expand their own influence within the CGT. Compared with the other factions, Nouvelle Orientation is more willing to regard the government as a partner. In the future they envisage, the CGT will continue to represent the workers, but will no longer determine national economic policy by itself. Instead, it will pursue reform jointly with a socialist government.\n\nThe bargain is highly attractive. The government can eliminate a group of corrupt officials while cultivating a cooperative force inside the CGT. The list, however, has plainly been subjected to political selection. Nouvelle Orientation also contains officials who entered the CGT through connections with the Parti socialiste français, yet none of them appears among the accusations.\n\nIn the name of opposing nepotism, we will remove one group of veterans, then promote another group of newcomers in the name of reliability and ability. The CGT will indeed acquire a new direction. Whether this produces cleaner cooperation or merely a new relationship of dependence can only be judged in time."
  fcf_economy_event.58.a:0 "The CGT can be our ally as well."

  fcf_economy_event.59.title:0 "Small Fry"
  fcf_economy_event.59.desc:0 "After refusing to cooperate with any faction inside the CGT, the investigation team could continue only through published accounts, scattered denunciations, and testimony from peripheral figures. Several weeks have passed, and we have indeed uncovered numerous abuses. Some officials submitted fictitious travel claims, some took office supplies home, and one local accountant removed money from a mutual-aid fund to repay his gambling debts.\n\nThese acts are both crude and indisputable, and the people responsible possess almost no ability to conceal them. Prosecution on the existing evidence would quickly secure the arrest of several embezzlers and prove to the public that the investigation has not been entirely fruitless. Yet these people are no more than insignificant secretaries, accountants, and clerks. Removing every one of them would not touch the true centre of power within the CGT.\n\nThe accounts of senior officials are far cleaner than those of this ‘small fry.’ Money passes through several industrial federations and cooperatives, orders are never placed upon paper, and willing witnesses invariably change their testimony at the last moment. Continuing would require us to expand the inquiry into private correspondence, secret accounts, and even transactions between the government and the CGT over previous years.\n\nThis might expose a corruption network capable of dealing a devastating blow to the CGT, or merely turn our investigative methods into a scandal first. Worse still, those old accounts may implicate more than the CGT. Some comrades within the government also tolerated arrangements that could not withstand public scrutiny during the most difficult years of the revolution.\n\nWe have caught enough minor figures to produce an acceptable result. If we stop now, we can at least depart with a limited victory. Digging deeper means gambling upon whose name appears in the next account book."
  fcf_economy_event.59.a:0 "Let the matter rest."
  fcf_economy_event.59.b:0 "No, we cannot stop here!"

  fcf_economy_event.60.title:0 "The Gamble"
  fcf_economy_event.60.desc:0 "The investigation team did not stop after arresting the group of minor accountants and local secretaries. Since every payment in the senior leadership's accounts possessed a legitimate description, the investigators ceased asking only where the money had been spent and began tracing where these officials spent their own money. Hotel registers, long-distance telephone records, private promissory notes, and even betting records from racecourses were examined anew. Most of these leads ultimately revealed only extramarital affairs, excessive drinking, and embarrassing but non-criminal habits, while the investigation's budget dwindled day by day.\n\nThe genuine breakthrough came from a demand for payment issued by a casino. Its recipient was a senior official who had long overseen CGT procurement and mutual-aid funds. He had never possessed a reputation as a gambler, while his declared income was insufficient to cover the amount demanded. Stranger still, the letter did not concern a gambling debt, but an outstanding ‘chip-conversion fee.’ Investigators consequently discovered that he had frequently visited several casinos during the previous few years, yet rarely sat down at a gaming table.\n\nThe casinos' internal accounts revealed how the gamble worked. Whenever an industrial federation completed a major procurement contract, his agents arrived carrying bundles of cash and purchased gaming chips. Several nights later, those chips were exchanged back into money as supposed ‘gambling winnings.’ The casino collected a commission and provided him with documentation sufficient to explain the source of the funds. On paper, he was merely a man blessed with extraordinary luck. In reality, his gambling capital consisted of kickbacks returned by suppliers and money removed in successive portions from the CGT's mutual-aid funds.\n\nOnce a casino cashier agreed to testify, additional evidence emerged in rapid succession. Fictitious records of victories and defeats, chips paid for by suppliers, and redemption receipts registered in the names of mistresses and relatives all pointed towards the same man. Through complicated procurement contracts, he extracted money from the CGT's accounts and passed it across the gaming tables, allowing one fortunate victory after another to return it to his own hands. The corrupt senior official whom the investigators had sought for so long was finally more than a shadow concealed within rumours and testimony.\n\nThe cost of this achievement has been equally extraordinary. To find that demand for payment, we examined thousands of private records, placed dozens of officials under surveillance, and spent large sums pursuing several fruitless lines of inquiry. Many investigators have not returned home for weeks, while the government has been forced to transfer personnel from other departments to maintain an inquiry that appeared almost endless. Had we ultimately discovered nothing, it would have been difficult to explain to the General Federal Council why finding several missing union contributions required such enormous expenditure.\n\nNow, however, a thick case file rests upon the table. A genuine member of the CGT's senior leadership will be prosecuted for embezzlement, receiving kickbacks, and money laundering, while the network he operated will be exposed alongside him. Accusations previously dismissed as unfounded suspicions finally possess evidence that cannot easily be denied. Those who mocked the investigation team for catching only ‘small fry’ must concede that we have found a Great Rat concealed deep within the organization.\n\nWe gambled our time, money, and the government's reputation against the CGT's layers of concealed accounts. Fortunately, this time the dice fell in our favour."
  fcf_economy_event.60.a:0 "It seems we won the gamble."

  fcf_economy_event.61.title:0 "Too Far"
  fcf_economy_event.61.desc:0 "The investigation team did not stop after arresting the group of minor accountants and local secretaries. In search of corrupt figures hidden within the CGT's senior leadership, we began examining officials' private debts, hotel registers, telephone records, and family property, while ordering banks, cooperatives, and local authorities to provide any material that might reveal where the money had gone. An investigation originally directed at public accounts gradually expanded to encompass everyone who had ever associated with those implicated.\n\nThese methods were not entirely fruitless. Investigators found undeclared gifts, banquets paid for by industrial federations, and several suspicious loans made to officials' relatives. None of this evidence, however, was sufficient to prove embezzlement. The CGT's accounts may not be innocent, but searching through drawers and bedrooms revealed mostly extramarital affairs, private debts, and secrets unrelated to public business.\n\nThe CGT quickly seized upon the least defensible parts of the investigation. Several internal directives reached the newspapers, listing not only officials under surveillance but also their spouses, children, and friends. The CGT ceased treating the controversy as an anti-corruption question and instead demanded to know what authority permitted the Committee of Public Safety to record the correspondence, movements, and private relationships of ordinary citizens.\n\nThe accusation received an unexpectedly sympathetic response. Even those who distrust the CGT cannot accept the government investigating their lives merely because of a meeting, a loan, or an anonymous letter. Lawyers' associations have demanded that the General Federal Council review the investigation's powers, while local communes refuse to provide further information concerning their residents. People previously willing to testify are withdrawing their statements out of fear that their own names will appear in a secret file.\n\nThe investigation team insists that with a little more time, the layers protecting the financial network will eventually develop a crack. We can no longer bear the cost of continuing the search. Expanding the inquiry may subject the government to a formal interpellation for violating citizens' rights. Admitting that we have found nothing, however, will amount to confirming that the CGT's accusations of ‘political persecution’ were not entirely baseless.\n\nWe attempted to uncover the CGT's concealed accounts, but exposed our own investigative methods first. Those genuinely involved in corruption have already had time to destroy the evidence, while the government has obtained only a collection of private secrets that it cannot use publicly. Whether the corruption network truly exists or not, this investigation can go no further."
  fcf_economy_event.61.a:0 "We have fallen at the final hurdle."

  fcf_economy_event.62.title:0 "An Anonymous Denunciation"
  fcf_economy_event.62.desc:0 "The investigation team receives large numbers of anonymous letters every day. Some accuse local secretaries of reserving official vehicles for their families, others claim that mutual-aid funds have secretly been transported to Switzerland, and still others merely rewrite disputes from branch meetings while adding several unverifiable crimes to their opponents' records. Most require only a cursory glance before being filed away, but the letter delivered today has provoked a debate within the office.\n\nThe writer accuses the head of an industrial federation of receiving bribes from suppliers over an extended period and hiding part of the procurement funds inside a safe in his office. The letter lists the locations of several meetings, mentions a black motorcar frequently parked beside a side entrance, and correctly names two contractors. Some of these details correspond with accounts already held by the investigators—accounts whose contents have never been made public.\n\nThe letter's errors are equally conspicuous. At one point, the writer claims to have personally seen the official place banknotes inside the safe; elsewhere, he claims never to have entered the CGT building. One secret meeting supposedly occurred on a Sunday, although the restaurant in question is always closed on Sundays. Two different registration numbers are given for the black motorcar, while the letter contradicts itself about the street upon which the accused resides. Several passages abruptly change to a childish and hurried hand, as though the writer had forgotten the identity he had previously invented.\n\nSome believe that the letter may be bait deliberately released by the CGT. If the government publicly accuses someone on the strength of such an obviously defective letter, the organization can expose every error in turn and portray the entire anti-corruption investigation as a political persecution sustained by anonymous slander. The genuine details may have been included precisely to persuade us to trust everything else.\n\nOthers are unwilling to dismiss it so easily. Someone without inside information should not know the names of those two contractors, much less correctly identify problems in accounts that remain confidential. Perhaps the writer genuinely knows something but deliberately confused the dates and locations out of fear. Alternatively, several people may have passed the account between them, fragmenting the truth in the process.\n\nWe can throw the letter into the pile of worthless correspondence, or remove the contradictions and arrange what remains into an accusation that can be used. The safest course would be to avoid alerting the accused and attempt to identify the writer through the paper, postmark, and choice of words. Yet anonymous denunciations are generally anonymous precisely because their authors do not wish to be found by either side."
  fcf_economy_event.62.a:0 "Just one more worthless letter among thousands."
  fcf_economy_event.62.b:0 "A few details need correcting before it can serve as evidence."
  fcf_economy_event.62.c:0 "We should find the writer."

  fcf_economy_event.63.title:0 "A Clumsy Mistake"
  fcf_economy_event.63.desc:0 "The investigation team ultimately decided not to discard the anonymous letter. Its contradictory dates were attributed to the writer's faulty memory. The restaurant that never opened on Sundays was replaced with a nearby café that did. The incorrect registration number and address were similarly ‘corrected’ using information from the existing files. After several rounds of revision, the denunciation that had originally contained so many suspicious inconsistencies finally became internally coherent and sufficient to justify a continued investigation of the industrial federation's director.\n\nThose responsible for preparing the evidence described the changes as necessary corrections. Anonymous informants often confused details out of fear, and so long as the central accusation corresponded with the financial accounts, correcting several obvious errors did not appear to amount to fabrication. On this basis, the investigation team summoned the contractors, sealed the implicated office, and informed the General Federal Council that new evidence had confirmed its previous suspicions.\n\nThe CGT, however, appeared to have prepared for precisely this eventuality. Shortly after the investigation began, several syndicalist newspapers simultaneously published photographs of the denunciation. Every error in the original was marked and printed beside the version submitted by the investigation team. The two versions differed not only in their dates and locations, but even in parts of their handwriting and phrasing. The CGT consequently declared that the supposed anonymous denunciation was no evidence at all, but an accusation rewritten by the government to suit its own requirements.\n\nWe attempted to blame the discrepancies upon transcription errors, but soon found ourselves unable to sustain the explanation. The archival register proved that the version received by the investigation team was the one published by the newspapers, while several internal annotations clearly described how its contradictions should be ‘corrected.’ The people responsible had even retained several successive drafts, leaving a complete record of every addition and deletion. We intended only to repair a few clumsy mistakes made by an anonymous informant, but proved our own manipulation of evidence in an even clumsier fashion.\n\nWhether the accused genuinely received bribes is no longer important. The CGT has refused to cooperate, while the official concerned now presents himself as the victim of political persecution. Even members who originally supported action against corruption are demanding a review of every item of evidence previously submitted by the investigation team. We have not only lost this particular lead, but cast suspicion of fabrication upon everything we have already obtained.\n\nA dubious anonymous letter would ordinarily have disappeared into the archives. Instead, it has become irrefutable evidence that the government manipulated its investigation. We have indeed been too clever for our own good."
  fcf_economy_event.63.a:0 "We have only made matters worse."

  fcf_economy_event.64.title:0 "Out of the Mouths of Babes"
  fcf_economy_event.64.desc:0 "By tracing the paper, the investigators eventually found a public school on the outskirts of Paris. The anonymous letter had not been written upon ordinary stationery, but upon a sheet torn from a pupil's exercise book. Several passages written in an especially childish hand were almost identical to the schoolwork of a twelve-year-old pupil. What some had imagined to be a carefully prepared trap was merely a child attempting to imitate the way adults wrote letters of denunciation.\n\nThe child's father is employed by the industrial federation, where he transports and registers goods delivered to its offices. Investigators believe that he complained at home about discrepancies between the quantities purchased and those recorded in the accounts, and mentioned both the contractors and the motorcar that frequently entered through the side gate. The child understood nothing about kickbacks, fictitious contracts, or mutual-aid funds, but knew that the ‘bad men’ described by his father had taken money belonging to the workers. He therefore assembled the fragments he had overheard into a denunciation.\n\nThis explains the letter's many contradictions. The child had indeed never entered the CGT building, while the banknotes inside the safe were merely his invention. The restaurant, registration number, and address came from several unrelated conversations. The contractors' names and irregular accounts, however, were not imaginary. If his father is willing to explain what he actually witnessed, we may have found someone with direct knowledge of the procurement operation.\n\nThe problem is that the worker never attempted to report anything himself. Perhaps he merely brought his workplace suspicions home, or perhaps fear had already persuaded him to remain silent. If the government suddenly appears at his door, it will not only expose him to the suspicions of the industrial federation's director, but inform everyone that we can trace an anonymous letter back to its author's family. How many people will remain willing to send evidence to the investigators after this is impossible to predict.\n\nThe affair could nevertheless become an opportunity to damage the CGT's credibility. Even a child could detect corruption in his father's complaints, while the CGT leadership and the industrial federation's director continued to insist that nothing was wrong with the accounts. If the family agrees to testify publicly, the defective denunciation will cease to be a farce and instead demonstrate that an ordinary worker had to speak the truth through the hand of his child.\n\nThe investigators now know which door to visit. All that remains is to decide whether we possess the right to knock upon it."
  fcf_economy_event.64.a:0 "We should leave him alone."
  fcf_economy_event.64.b:0 "We must seize every opportunity."

  fcf_economy_event.65.title:0 "Distrust and Hesitation"
  fcf_economy_event.65.desc:0 "The investigators eventually knocked upon the door. The child's father opened it, glanced once at their identification, immediately sent the child back to his room, and positioned himself across the entrance. Before the investigators could explain themselves, he had already guessed why they had come. After the letter disappeared, he noticed that several pages were missing from the exercise book, but had never imagined that the government would trace it all the way back to his home.\n\nHe admitted that he had complained at the dinner table about the industrial federation's procurement. The quantity of goods entered upon the registration forms was frequently greater than the amount actually delivered, while the supplies brought by several contractors were worth far less than the prices listed in their contracts. He had also seen the motorcar entering through the side gate several times. Yet whenever the investigators asked him to record these statements as testimony, he immediately retreated and insisted that he had merely been grumbling without ever witnessing anyone accept a bribe.\n\nHis hesitation arises from more than fear of retaliation by his superiors. He has worked within organizations affiliated with the CGT for years. His family received mutual aid during an illness, while assistance from his fellow workers allowed them to survive without wages during a strike. In his eyes, the CGT undoubtedly possesses many infuriating faults, but remains the most reliable institution available to an ordinary worker. Now that the government is in conflict with the CGT, he cannot believe that the investigators are interested only in clarifying several account books, and refuses to become a witness for a government attack upon the entire organization.\n\nThe child's letter made matters still more difficult. The father believes that since we now know the writer was only a child, we should dismiss it as a foolish prank. Yet rather than destroying the letter, the investigators followed the paper, handwriting, and school records until they arrived at this house. To him, this already demonstrates that the government cares nothing for what may happen to his family and is concerned only with extracting an accusation it can use.\n\nThe conversation soon reached an impasse. The investigators repeatedly promised that his testimony could remain confidential, but he merely asked coldly: if anonymity truly worked, why were they standing outside his home? When someone mentioned witness protection, he actually laughed. The government might guard the house for several months, but it could not find his next job for him or compel the fellow workers he saw every day to continue trusting him.\n\nWe are not entirely without means of persuading him. Sufficiently generous compensation could offset the danger of losing his employment. The irregularities he has already admitted in conversation could also allow the investigation team to threaten him with responsibility for concealing them. Whichever course we choose, whether money or pressure, the testimony he subsequently provides will no longer be entirely voluntary.\n\nThe investigators remain outside the door, while the child listens through it as the adults argue in lowered voices. We traced the anonymous letter in the hope of finding someone willing to tell the truth. Instead, we found only a worker who neither trusts the government nor dares place complete faith in the organization to which he belongs."
  fcf_economy_event.65.a:0 "Bribe him."
  fcf_economy_event.65.b:0 "Threaten him."
  fcf_economy_event.65.c:0 "Forget it."

  fcf_economy_event.66.title:0 "An Investigation Sustained by Corruption"
  fcf_economy_event.66.desc:0 "The arrangement should have been simple: give the worker enough money to compensate for the risk of unemployment in exchange for his testimony concerning the industrial federation's corrupt procurement. No one intended to record this transaction in the investigation report. The money was divided among relocation assistance, living allowances, and payment for temporary work. So long as the accounts appeared sufficiently ordinary, the CGT would find it difficult to prove that the government was purchasing testimony.\n\nThe problem is that we did not approach this worker alone. In attempting to explain the fictitious delivery receipts, the investigation team found several warehouse employees, local branch accountants, and employees of the contractors. Some feared losing their employment, some demanded that the government repay their debts, and others stated plainly that without sufficiently respectable compensation they would remember nothing whatsoever. Eager to expand the breakthrough, the investigators accepted these demands again and again.\n\nNews soon spread within the industrial federation. Anyone who knew the value of an old delivery form or remembered the day upon which a particular motorcar appeared might obtain a ‘resettlement payment’ from the government. Some people with genuine inside knowledge consequently began to speak; others invented increasingly sensational stories. The number of denunciations grew alongside the prices demanded for them. The investigation team had to devote more time to determining who was selling the truth and who merely sold lies tailored to our needs.\n\nThe CGT initially did no more than accuse the government of buying workers. It then supplied several payment records to the newspapers. The documents did not explicitly describe the money as payment for testimony, but the recipients' names and the dates upon which they obtained assistance corresponded almost perfectly with the sequence in which their statements appeared in the investigation report. CGT newspapers printed the two side by side and listed the investigation team's recently expanded secret expenditure. The more the government denied the accusation, the more people wondered how many other witnesses had received money.\n\nWe can, of course, argue that officials in the CGT have long used positions, mutual aid, and personal favours to conceal scandals. If they can employ these methods to make workers remain silent, why should the government not use compensation to make workers speak? Moreover, the falsified accounts revealed by the testimony do not cease to exist merely because the witnesses received protection. Money can purchase the truth, just as someone who receives no payment can still lie.\n\nThis defence has not improved the situation. The anti-corruption investigation originally won support because the government claimed that it would destroy the CGT's network of corruption sustained through material interests. Now the investigation team has established a competing network of interests, exchanging public money for testimony and then using that testimony to confirm its own conclusions. We exposed the CGT's use of payments and protection to maintain silence; the CGT points to the investigators' payment records and declares that the government can advance its inquiry only through the same methods.\n\nSeveral days ago, we were asking where the industrial federation's money had gone. The public is now asking where the investigation team's money has gone. The embezzlement we uncovered has not become innocent, but the CGT no longer needs to prove its innocence. It needs only to demonstrate that its investigators are equally corrupt to recover the advantage in public opinion.\n\nWe intended to break open the corruption network by using methods familiar to the corrupt. Instead, we made the entire anti-corruption investigation appear capable of operating only through corruption itself."
  fcf_economy_event.66.a:0 "Why should we not use the same methods?"

  fcf_economy_event.67.title:0 "A Thuggish Government"
  fcf_economy_event.67.desc:0 "The worker's child did not fully understand why his father had suddenly fallen silent, nor what the investigators who visited their home were demanding. He remembered only that before leaving, one of them said that if his father continued refusing to cooperate, the government could hold him responsible for concealing corruption and assisting in the falsification of accounts. At school the following day, the child repeated this statement word for word to his classmates and said that the men had threatened to take his father away.\n\nThe children's retelling quickly transformed the story. By the time it reached their parents, the investigation team intended not only to arrest the worker but evict the entire family from its home. By the time it appeared in a local newspaper, the government had sent men to force their way into a worker's house over an anonymous letter written by a child and compel the father to accuse the CGT according to a statement prepared in advance. The details grew ever more exaggerated, but the investigators had indeed visited the home and had indeed threatened prosecution, preventing us from dismissing the affair as a mere rumour.\n\nThe CGT promptly sent representatives to contact the family. The worker initially remained unwilling to appear publicly. Under pressure, he had already told the investigation team about irregularities in the procurement accounts and knew that his superiors had genuinely stolen property belonging to the workers. Yet the government's threat did not silence him forever. Instead, it made him understand that whether he continued to refuse or provided the requested testimony, his family's life had already been drawn into the conflict.\n\nSeveral days later, accompanied by fellow workers, he appeared before the press. He did not deny the irregularities in the industrial federation's accounts and offered no defence of its directors. He simply described from the beginning how the investigators traced his child's exercise book, arrived at his door, and, after meeting resistance, implied that he might be prosecuted for concealing information. He admitted that he eventually told them what he knew, but insisted that his statement had not been voluntary. It was a compromise made between his family's security and government pressure.\n\nThis statement placed the investigation team in an impossible position. If we accuse him of lying, the testimony we have just obtained will lose its value along with him. If we acknowledge that his account is true, we admit that the government threatened an ordinary worker with punishment to force him to make an accusation. We can prove that the industrial federation falsified delivery forms, but cannot explain why proving it required a twelve-year-old child to fear that his father would be taken away.\n\nThe anger soon spread beyond the CGT's existing supporters. Even people who favour investigating corruption find it difficult to accept that the government traced an anonymous letter to the child who wrote it and then threatened his father with criminal penalties. Street leaflets no longer discuss missing goods or mysterious wooden crates. Instead, they depict investigators blocking the entrance to a worker's home. The caption consists of only two words—‘Thuggish Government.’\n\nThe CGT has seized the opportunity to compare the director hiding behind the union's accounts with investigators hiding behind the power of the government. The former may be called an embezzler, but what should the latter be called? If those exercising public authority can use prosecution, unemployment, and a family's safety to coerce witnesses, is this investigation genuinely punishing corruption, or merely seeking a statement useful to the government from anyone who can be made to provide one?\n\nAn apology cannot now undo the pressure inflicted upon the worker or make the child withdraw what he told his classmates. If we cannot offer even that apology, however, we will be accepting the name the public has given us."
  fcf_economy_event.67.a:0 "Apologize at once!"

  fcf_economy_event.68.title:0 "Tainted Evidence"
  fcf_economy_event.68.desc:0 "The worker eventually spoke. The investigators' methods were hardly honourable, but money and pressure gradually weakened his former determination, and he began describing the irregularities he had witnessed in the industrial federation's warehouse. What began as several vague complaints soon acquired specific dates, names, and delivery-form numbers.\n\nThe industrial federation had purchased supplies from several regular contractors at prices far above the market rate, while the quantity arriving at the warehouse was invariably smaller than the amount entered in the accounts. The missing goods were personally signed off by the director as having been delivered to local branches or temporary relief stations. Yet the worker had helped unload the shipments, and some of these supposed recipients had sent no one to collect them. Others had ceased operating altogether.\n\nHe also admitted that, acting under instructions from his superiors, he had carried several unregistered wooden crates into the office. They arrived in a contractor's motorcar, possessed no receipts, and could not be opened by the warehouse staff. The director's secretary would remove them through the side entrance the following day. Many details in the anonymous letter had been products of the child's imagination, but the incidents that genuinely aroused his suspicions were precisely those his father repeatedly mentioned at home.\n\nUsing this testimony, the investigation team quickly found several altered warehouse forms and fictitious acknowledgements of receipt. These do not yet prove what the wooden crates contained, but are sufficient to demonstrate that the industrial federation's procurement accounts were systematically falsified. We have finally obtained another item of evidence capable of supporting a public accusation against the CGT's leadership.\n\nThe evidence itself nevertheless bears a stain that will be difficult to remove. The worker did not come forward voluntarily, but changed his position only after we made it clear that we would not accept his silence. Once the CGT discovers how the statement was obtained, it can accuse the government of buying witnesses and coercing workers, portraying the entire investigation as a political trial whose conclusion had been written in advance.\n\nEach side now possesses material with which to attack the other. We know that the industrial federation falsified its accounts; the CGT may discover the methods by which we obtained the testimony. So long as the latter remains concealed, the former will be sufficient to open a new line of investigation. For the moment, no one wishes to ask why the truth could be spoken only in this manner."
  fcf_economy_event.68.a:0 "They were in the wrong first."

  fcf_economy_event.69.title:0 "Good Faith"
  fcf_economy_event.69.desc:0 "The investigators ultimately neither offered the prepared compensation nor threatened the worker with prosecution for concealing evidence. They put away their documents, promised not to reveal the child's identity, and undertook to make no further inquiries into the family's private life. Before leaving, the leader handed him only a piece of paper bearing an address. If he ever decided to tell them what he knew, he could deliver the evidence himself. If he did not, the conversation would end there.\n\nTwo days later, the worker appeared alone outside the investigation team's office. He had not brought the child or informed any colleague. Only after confirming that no journalists were present did he remove a repeatedly folded envelope from inside his coat. It contained copies of several warehouse forms, notes left by contractors after making deliveries, and a series of dates written down from memory.\n\nHe admitted that after the investigators departed, he could not put the matter out of his mind. The government's reopening of the Affaire Martin had at least demonstrated that some judgments already rendered could still be corrected. On this occasion, moreover, we had genuinely refrained from forcing him to make a statement after he refused. It was precisely this restraint that persuaded him that the investigation might not be merely an attempt to manufacture accusations against the CGT.\n\nThe irregularities were far more specific than he had admitted at the door. Several shipments recorded as machine parts or workers' relief supplies never reached the warehouse in full, yet certificates signed by the industrial federation's director acknowledged receipt of the missing goods. Several supposed recipients had long ceased operating, but the associated payments continued to be settled each month. As for the wooden crates carried into the office through the side entrance, he had personally seen one fall open. It contained neither documents nor supplies, but bundles of unopened banknotes.\n\nTo avoid being held responsible for missing goods later, he had secretly retained several delivery forms he was instructed to rewrite and recorded the dates of every suspicious delivery. The investigation team compared these documents with the existing accounts and quickly identified the same contractors, signatures, and fictitious branches. The corruption network previously assembled only through inference finally possessed an eyewitness and a body of mutually corroborating written evidence.\n\nHe still refuses to describe his actions as a betrayal of the CGT. In his view, the mutual-aid funds and dues belonged to every worker who contributed to them; those who stole the money were the true traitors. He is prepared to identify the officials responsible and testify before the General Federal Council, but demands that the government not use his evidence to describe every CGT official as a thief. The investigators accepted this condition. After all, voluntary testimony containing certain reservations is far more credible than an unqualified accusation obtained through money or threats.\n\nWithout paying a single franc or uttering a single threat, we have obtained a witness from inside the CGT. The accusation that its officials will find most difficult to refute is not something written by the government in an investigation report, but the testimony of an ordinary worker who spent years carrying their goods and maintaining their records before finally deciding to describe what he had seen."
  fcf_economy_event.69.a:0 "And it cost us nothing."

  fcf_economy_event.70.title:0 "United in Opposition"
  fcf_economy_event.70.desc:0 "The petitions initially delivered to the General Federal Council differed completely from one another. The CGT accused the new law of denying its special position in the revolution and post-war reconstruction and attempting to reduce an organization built collectively by millions of workers to the status of an ordinary trade union. The Catholic unions and the Fédération des syndicats autonomes, by contrast, argued that the law recognized equality among trade unions in name alone without genuinely challenging the CGT's networks for collecting dues, mutual-aid institutions, and industrial federations. The two sides attacked the law for entirely opposite reasons, but reached precisely the same conclusion: it could not be allowed to remain in force.\n\nThe government originally believed that the hostility among these organizations would prevent any united action. The CGT would surely refuse to stand beside the free trade unions it denounced as splitters, while those unions could hardly forget the exclusion they had endured for years. Yet the law provided them with a reason to set their old grievances aside temporarily. The CGT wished to preserve its position, while the other unions hoped to force the government to draft legislation that would genuinely weaken the CGT's advantages. They did not have to trust one another; they needed only to make the present law impossible to implement.\n\nWithin days, the previously scattered petitions developed into a nationwide protest. Delegations in Paris marched along the commune's avenues, while trade unions in Lyon, Lille, and Marseille chartered trains to carry their members to the capital. The red flags of the CGT, the banners of the autonomous unions, and the placards of the Catholic unions appeared within the same procession for the first time. The organizers claim that tens of thousands have already signed the petitions, and reports from the local communes indicate that the number continues to rise.\n\nThe protesters have neither attacked government institutions nor declared a strike. They simply maintain a rotating presence outside the General Federal Council, carrying box after box of signatures to its entrance and demanding that its members see for themselves how many people oppose the law. This restraint makes the government's position more difficult. We cannot denounce them as rioters disrupting production, nor disperse a petition that has remained peaceful under the pretext of maintaining public order.\n\nThe previous investigation of the CGT should have weakened its ability to mobilize, but the evidence in our possession was insufficient to force it to retreat. At the same time, the limited support provided to other unions failed to secure their backing for the law. In the CGT's view, the government is depriving it of the position it deserves. In the eyes of the free trade unions, the government has used them as a counterweight against the CGT without granting them a genuinely equal opportunity. We neither overwhelmed our strongest opponent nor retained those who might have become our allies.\n\nIf we insist upon enforcing the law, this temporary coalition is likely to develop into a joint boycott. The unions need only refuse to provide membership registers and withdraw from negotiations, and the new system will be reduced to several lines in the official journal of the General Federal Council. Worse still, once they discover that united pressure is effective, the alliance originally formed over a single law may not immediately dissolve when the controversy ends.\n\nRepealing the law has now become the only way to calm the situation. The CGT will recover its former special position, while the other unions will depart separately, angered at having been used. We intended to redefine the relations among the trade unions, but ultimately proved only one thing: a compromise that offends everyone does not thereby become just."
  fcf_economy_event.70.a:0 "Pathetic."
  FCF_syndicats_protest:0 "Trade-Union Protests"

  fcf_economy_event.71.title:0 "The Power of the CGT"
  fcf_economy_event.71.desc:0 "When the new law was first promulgated, the CGT leadership neither called an immediate strike nor openly refused to comply, as some opponents had expected. It merely issued a cautiously worded notice to the industrial federations and local organizations, instructing officials at every level to ‘defend the rights of the membership in strict accordance with the existing statutes’ and, until the government provided further clarification, offer no voluntary assistance with institutional changes involving membership registers, organizational property, or the credentials of representatives.\n\nThe real pressure began quietly. The industrial federations continued drafting production plans, but no longer adjusted raw-material quotas to accommodate temporary government requests. Statistical departments continued submitting reports, but always waited until the final deadline permitted by their statutes. Local organizations did not refuse to participate in consultations, but invariably sent representatives without the authority to make commitments. No individual action could be described as unlawful, but together they submerged federal economic coordination in viscous mud, making every step forward take several times longer than before.\n\nThis passive resistance soon spread beyond the union institutions. CGT members on factory committees repeatedly demanded reconsideration of arrangements connected with the new law, while industrial representatives on district councils returned previously routine proposals for further debate one by one. The CGT did not need to issue them orders. It had only to remind its members that the government was undermining an organization built by the workers themselves, and the resulting resistance would spread independently through relationships that already existed.\n\nOnly now have we realized that our previous calculations considered merely how many friends the CGT possessed in the General Federal Council. We never counted how many factories relied upon it each day to coordinate raw materials, how many workers received mutual aid through its institutions, or how many local representatives depended upon its organizational network to perform their duties. The CGT does not directly exercise administrative authority, but has long been embedded in every crevice of the Federation's operation. A law may diminish its position in a vote, but cannot order millions of members to continue cooperating as though nothing had happened.\n\nThe accusations intended to force the CGT into retreat have also failed to produce the expected effect. Our evidence is insufficient to convince ordinary members that the entire organization has become rotten. Instead, it has allowed the CGT to portray the new law as government retaliation following the failure of its investigation. Several officials genuinely suspected of embezzlement have disappeared behind the protesters, and every new question concerning them is answered as another insult directed against the whole membership.\n\nThe Committee of Public Safety has received estimates of the losses from every department. If the government insists upon enforcing the law, the CGT may never begin an open confrontation sufficiently direct to be suppressed, but can maintain this non-cooperation for months. Production will not suddenly cease, nor will the Federation become paralyzed overnight. Yet delays, disputes, and additional expenses will gradually consume the government's credibility until the cost of the law far exceeds any benefit it might produce.\n\nThe alternative is to admit defeat and repeal the newly adopted law. This would at least restore the CGT's cooperation, but would also demonstrate that if it mobilizes enough of its organizational strength, even a law adopted by the General Federal Council can be forced into withdrawal. What we underestimated was not merely the membership of one trade union, but an enormous network that has been intertwined with the Federation's economic and political life for more than a decade.\n\nThe CGT has occupied no government building and torn up no law. It has merely ceased helping us keep everything functioning normally—and that alone has been enough to force the government to reconsider its choice."
  fcf_economy_event.71.a:0 "Hold firm against the pressure!"
  fcf_economy_event.71.b:0 "We have no choice. We must abandon the law."

  fcf_economy_event.72.title:0 "CGT Protests"
  fcf_economy_event.72.desc:0 "Soon after the new law was adopted, the CGT leadership issued a declaration accusing the General Federal Council of using ‘trade-union equality’ as a pretext to deny the organization's contribution to the revolution and deprive the workers' movement of the institutional achievements it had built over more than a decade. The declaration did not instruct members to disobey the law, but stated explicitly that the CGT would offer no voluntary assistance to any reform that damaged its interests.\n\nWhat followed was not a spectacular general strike, but countless minor acts of non-cooperation. Industrial federations delayed the submission of information, local branches refused to surrender membership registers, and CGT representatives repeatedly disputed the implementing regulations at consultation meetings. Most factories continued operating normally, but every matter requiring coordination by the CGT became subject to far longer arguments than before.\n\nThis is hardly surprising. The CGT remains the Federation's largest and best-organized trade union, while the new law directly weakens the special position it has long enjoyed. Even after exposing corruption among several senior officials, we cannot expect millions of members to accept the suppression of their organization in silence. In their eyes, the crimes of several officials and the rights of the CGT itself remain two different matters.\n\nThis time, however, the CGT does not possess sufficient strength to force the government to repeal the law. The evidence of corruption makes it difficult for the organization to present itself as an entirely innocent victim, while the other trade unions will certainly not join a protest intended to restore its privileges. The CGT can delay reform and create disorder, but can no longer demand our surrender in the name of the entire workers' movement as it once did.\n\nEvery department must allocate additional time and personnel to this period of disorder, establish alternative channels of communication wherever the CGT refuses to cooperate, and prevent each dispute from becoming another political confrontation. These measures cannot end the protests, but will be sufficient to keep the Federation operating. If the new system can genuinely be implemented, the CGT will eventually have to learn how to defend its interests within it.\n\nThe protests will continue for some time, and the discontent will not disappear after one government explanation. Yet the law has been adopted and new relationships are already taking shape. We need only endure the CGT's final period of resistance until it gradually accepts reality."
  fcf_economy_event.72.a:0 "Time will resolve everything."

  fcf_economy_event.73.title:0 "Discontent with the New Law"
  fcf_economy_event.73.desc:0 "Discontent within the CGT did not immediately subside when implementation of the new law began across the country. The central committee received a succession of protests from local branches. Some demanded that the new credentials for trade-union representatives be rejected, others advocated withdrawal from every consultation convened by the government, while still others proposed a national strike to force the General Federal Council to repeal the law.\n\nMost of these militant proposals ultimately remained on paper. The CGT had just endured a succession of investigations, and the suspicious accounts left behind by several officials continued to appear in the newspapers. Even if many members believed that the government was exploiting the affair, few were willing to stop production merely to preserve old privileges. Local branches could denounce the law, but found it difficult to explain why workers should sacrifice their wages over several seats and institutional powers belonging to the central organization.\n\nThe CGT leadership therefore adopted a more restrained form of resistance. It instructed branches to hang protest slogans in their meeting halls, retain the old titles of office, and append an almost identically worded declaration of opposition to every official letter submitted to the government. Some representatives read the declaration before meetings began and only then sat down to discuss practical matters under the new system. The law continued to be implemented, but every procedure acquired an additional ritual dispute.\n\nWhat gradually forced the CGT to compromise was that the new rules it had initially dismissed as unworkable began developing into an ordinary system. Other trade unions sent their own representatives, local committees redistributed seats in consultations, and workers previously able to communicate their demands only through the CGT discovered alternative channels. If the CGT continued refusing to participate, the vacancies would not wait for it forever, but would rapidly be occupied by organizations more willing to cooperate.\n\nThe declarations of opposition continued to be printed, but the slogans began disappearing from meeting rooms. The central institutions still proclaimed that they would never accept the new order imposed by the government, while local branches began asking how to register representatives, apply for funding, and participate in the next round of consultations. A concession initially described as intolerable became a temporary measure after several weeks and was written into the branches' own administrative rules several months later.\n\nThis does not mean that the CGT has forgiven the government. Many veteran members continue to regard the law as a betrayal of their revolutionary achievements, while the new system has not eliminated competition between the CGT and the other unions. Yet anger cannot substitute for ordinary work forever. Once the new lists of representatives are in use and consultations convene according to the new procedures, even the most determined opponent must admit that the old position will not restore itself merely because the CGT refuses to accept reality.\n\nWe neither defeated the CGT completely nor won its willing submission. We merely kept the new law in existence long enough for opposition to become routine and the law itself to become part of the established order."
  fcf_economy_event.73.a:0 "One mess finally resolved."

  fcf_economy_event.74.title:0 "The Missing Intermediaries"
  fcf_economy_event.74.desc:0 "The initial effort to streamline the administration proceeded smoothly. At the direction of the central office, the industrial federations reviewed their personnel registers and abolished positions whose responsibilities were unclear and whose holders had long ceased participating in actual production while continuing to receive allowances and control funds and allocations. When several officials already notorious for nepotism were expelled from their offices, grassroots branches even held celebrations. At least initially, it appeared that we had finally begun removing the enormous parasitic group embedded within the CGT.\n\nAs more positions disappeared, however, problems gradually emerged from the suddenly empty offices. Metallurgical factories in the north continued reporting steel output on schedule, but no one compiled the data for the mechanical-engineering industrial federation. Chemical quotas in Lyon were redistributed, but the local branch failed to notify the textile factories dependent upon those materials. The forms were still completed and signed, but stopped somewhere between one desk and the next.\n\nOnly then did people discover that not every apparently superfluous middle manager merely repeated instructions from above. Some compared production data among several local branches. Others understood the administrative habits of different factory committees, knew who should receive a proposal first, and could persuade mutually hostile representatives to sit around the same table. They rarely decided production directly and possessed no prestigious authority worthy of inclusion in the statutes, yet these intermediaries were precisely what sustained the industrial federations' enormous network of consultations, customs, and personal relationships.\n\nThe problem is that we never properly evaluated the function of each position. The CGT's administration was not constructed according to a predetermined organizational chart, but accumulated layer by layer over more than a decade of production coordination. The same title might denote a sinecure responsible only for maintaining files in one branch, but carry responsibility for coordinating the raw materials of an entire region in another. If the central office examines every position individually, the streamlining programme may be overwhelmed by a lengthy investigation. If we eliminate posts solely according to title, allowance, or administrative rank, we can do no more than hope that we have not removed too many genuinely useful people.\n\nThe grassroots workers are equally divided. Some insist that the current disorder is merely a mess deliberately left by the bureaucrats, with the former administrators using inconveniences of their own creation to prove that they are indispensable. Others argue that the dismissals were supposed to constitute a responsible organizational reform, but increasingly resemble a purge conducted to satisfy grassroots resentment. Removing an unpopular official is easy; after his departure, statistical forms will not compile themselves, nor will local branches suddenly learn how to coordinate with one another.\n\nMore troublingly, the disorder has begun to damage the CGT itself. Several factory committees have bypassed their industrial federations to obtain raw materials and transport privately, while some local branches have transferred unresolved affairs to other trade unions. If this continues, we may obtain a CGT with an exceptionally lean administration only to discover that it can no longer sustain its former nationwide coordination network.\n\nThe reform has now reached its first genuine crossroads. We can admit that the dismissals proceeded too hastily and halt a campaign that is becoming an act of self-destruction. Alternatively, grassroots workers can elect new coordinators to fill the vacancies with authority from below. We may instead recognize that administration itself requires experience and knowledge and reconstruct these intermediary positions according to explicit professional standards.\n\nSome of the old intermediaries have already been removed. The question is no longer whether they were unpopular, but what we intend to place in their stead."
  fcf_economy_event.74.a:0 "We must stop this self-destructive campaign."
  stop_simpifed_magement:0 "§YWe will stop dismissing administrative personnel§!"
  fcf_economy_event.74.b:0 "Let the grassroots workers elect their own administrators."
  fcf_economy_event.74.c:0 "Professionalizing the administration is the proper solution."

  fcf_economy_event.75.title:0 "A Heavy Burden"
  fcf_economy_event.75.desc:0 "New administrators were quickly elected from factories and branches throughout the country. Most were experienced workers familiar with production and trusted by their colleagues. They possessed neither separate offices nor additional allowances and continued working alongside their former teams. Many believed this arrangement could fill the gaps in the administration without recreating another class of bureaucrats detached from the grassroots.\n\nBeing elected, however, does not create additional hours in the day. Lathe operators must still complete their shifts and dockers must still work with their teams, leaving administrative duties to be squeezed into lunch breaks, evenings, and the spaces between shifts. Reports are taken home to be checked, branch meetings frequently continue deep into the night, and correspondence from distant regions often remains unanswered for days.\n\nWorse still, administering an industrial federation is far more complicated than many had imagined. Numerous successful candidates understand their own workshops but not how to reconcile the statistical methods used by different factories, nor how to mediate between branches competing for raw materials. Some have resigned under the burden, others can give documents only cursory approval, while still others work through successive nights until they can no longer complete their original production duties.\n\nTo maintain ordinary operations, several local branches have quietly recalled former employees to help organize their accounts. Although the people expelled from the offices have not formally recovered their positions, their familiarity with the procedures and archives has again given them control over the actual work. We intended to place administration in the hands of the grassroots, but may merely have allowed the former administrators to return in a less visible form.\n\nPersonal enthusiasm can no longer resolve the problem. Allowing the elected administrators to reduce their frontline labour would enable them to concentrate upon administration, but would also recreate a group within the CGT for whom management is a profession. If we insist that administrators remain fully involved in production, their connection with ordinary workers will indeed be preserved, but the accumulated work will not disappear.\n\nSome have proposed teaching basic accounting, statistics, and production coordination to ordinary workers so that administration ceases to be the specialty of a small group. This may ultimately transform the situation at its foundations, but will require long-term investment and cannot immediately lighten the burden carried by the present administrators.\n\nAn election can determine who assumes responsibility, but cannot create the time and experience required to fulfil it. The CGT must decide whether administration itself is work, or whether workers should continue to be expected to perform two occupations through enthusiasm alone."
  fcf_economy_event.75.a:0 "Administrators should concentrate upon administrative work."
  fcf_economy_event.75.b:0 "They must never become detached from productive labour."
  fcf_economy_event.75.c:0 "Workers should receive a basic education in administration."

  fcf_economy_event.76.title:0 "Returning to Their Posts"
  fcf_economy_event.76.desc:0 "Following the professionalization of administrative positions, the industrial federations organized a new series of qualification reviews. Candidates had to understand statistics, accounting, and production coordination and be capable of handling complicated correspondence among branches. The examinations indeed removed some administrators who had occupied their positions through seniority alone and could not explain their own accounts. They also enabled several capable workers long overlooked in the workshops to enter the offices.\n\nMost of those who passed, however, remained members of the former administrative personnel. Their long familiarity with reports, meetings, and the procedures and terminology used inside the CGT naturally made them more capable of meeting the supposed ‘professional standards’ than ordinary workers. Many administrators previously dismissed quickly returned to their positions, while ordinary workers often encountered the knowledge determining whether they could participate in administration for the first time only when they received the examination paper.\n\nThe efficiency produced by the new system is undeniable. Accumulated files were rapidly processed, communication among the industrial federations returned to normal, and affairs previously handled through personal relationships and ambiguous customs began to acquire explicit procedures. Incapable members of the former administration returned to the production line, while those genuinely competent in administrative work obtained a more secure position.\n\nFrom the perspective of the grassroots, however, the results appear less impressive. The personnel occupying the offices may have changed, but the distance between administrators and workers has become more distinct. At least the former bureaucrats explained decisions in the language of ‘old comrades.’ The new administrators prefer to cite output, working hours, and quotas, treating every worker as another figure to be moved around upon a production table.\n\nWe hoped that professional standards would break the former administration's monopoly over its positions, but instead transformed administrative knowledge itself into a new barrier. The CGT may have become more efficient, but it has also become more bureaucratic. The complaint of the grassroots is no longer merely that the administrators are incompetent, but that those most proficient in administration seem increasingly free from any need to understand the people they administer.\n\nProfessionalization has not been without achievement, but if efficiency means that workers can only obey as components within a production machine, the reform remains incomplete. We can trust that increasingly professional administration will ultimately prove its value, or require administrators to look beyond figures and regulations and learn once again to listen to ordinary workers."
  fcf_economy_event.76.a:0 "We are unquestionably following the correct path."
  fcf_economy_event.76.b:0 "Administrators must retain a human touch."

  fcf_economy_event.77.title:0 "Uneven Results"
  fcf_economy_event.77.desc:0 "Efforts to spread administrative knowledge have begun throughout the country, but the CGT has never established a unified training system. Courses are organized independently by the local branches, which must also find their own instructors, funding, and teaching materials. The reform has undoubtedly begun changing the composition of the administration, but the rate of change differs enormously from one region to another.\n\nIn well-organized branches in Paris, Lyon, and elsewhere, workers can study accounting, statistics, and production coordination in evening schools and acquire practical experience alongside current administrators. The first group to complete the training has already assumed some responsibilities. They remain inexperienced, but can at least understand the reports and know how to direct demands from the grassroots towards the correct department.\n\nOther branches cannot even provide a permanent classroom, much less find someone willing to teach over an extended period. Training in such places often consists only of former administrators explaining several forms after a meeting and is abandoned after a few weeks. With no qualified replacements available, the former administrative personnel continue operating these branches, while the reform exists only in notices upon the wall and plans retained in the archives.\n\nAt first, this appeared to be merely a difference in local progress. Once the old and new methods of administration began interacting, however, the problems quickly became apparent. A metallurgical branch operating under the new procedures submitted its requirements according to production category, while the coal branch receiving its documents continued allocating fuel according to the old regional numbers. Several trainloads were consequently sent to the wrong factories. Similar errors occur repeatedly, but responsibility is difficult to assign because both sides follow the systems with which they are familiar.\n\nThe present CGT resembles a collection of institutions belonging to different periods assembled into one organization. Some branches have already trained a group of newcomers, while others continue depending upon the experience and personal connections of the former administrators. A document treated as standard in one region may have to be completed again in another. Improvements in each locality deserve recognition, but improvements that cannot coordinate with one another may not produce a better-functioning whole.\n\nTo end the disorder quickly, the CGT leadership can assign newly trained administrators directly to the less advanced local branches and instruct them to standardize their working methods. This would rapidly fill the vacancies, but would also require local workers to accept administrators appointed from above who may possess little understanding of local conditions.\n\nAlternatively, we can provide additional funding to struggling branches and allow them to organize their own courses and train their own candidates. This accords more closely with local autonomy and will ensure that the new administrators genuinely possess the confidence of local workers. Money cannot immediately become instructors and experience, however, and the CGT will have to tolerate these uneven conditions until the regions gradually catch up."
  fcf_economy_event.77.a:0 "Appoint the newcomers directly to the local branches."
  fcf_economy_event.77.b:0 "Provide the local branches with additional funding."

  fcf_economy_event.78.title:0 "A Subjective Accusation"
  fcf_economy_event.78.desc:0 "Following the reform, rotating inspection teams composed of ordinary members seconded by different branches began receiving denunciations. The Comités syndicalistes révolutionnaires hoped this would end the old practice of administrators protecting one another. Those under investigation would no longer need to explain themselves only to familiar branch committees. Workers from other regions would be entitled to examine accounts, question those involved, and submit their findings to membership representatives for review.\n\nBefore long, a worker approached the inspectors currently rotating through his locality. He brought no account books, correspondence, or colleagues prepared to testify, but repeatedly insisted that the branch official known locally as the ‘Great Rat’ accepted gifts, transferred supplies in secret, and transformed the mutual-aid fund into a private treasury under his own control.\n\nWhen the inspectors asked him to be more specific, he could cite only the Great Rat's recent acquisition of new clothes, merchants who regularly visited the branch, and several unexplained relief payments. He knew neither where the money came from nor who had provided the supposed gifts, and could prove none of his allegations. Every charge rested upon his own observations and suspicions.\n\nMore significantly, there appears to be a personal grievance between him and the Great Rat. The two had previously quarrelled over the reassignment of a workstation, while the informant admitted that the branch had recently rejected his application for assistance. Opening an investigation solely upon such an accusation might transform inter-branch supervision into an instrument for taking revenge upon colleagues.\n\nCorruption, however, seldom provides complete evidence voluntarily. Ordinary workers have no access to procurement documents or mutual-aid accounts. If they are required to establish every fact before filing a report, supervision will ultimately remain the exclusive responsibility of administrators who control the records. The Great Rat has operated locally for years, and the first person willing to speak may inevitably possess no more than scattered suspicions.\n\nThe rotating inspection teams draw their personnel from branches across the country. Every new inquiry requires those members to leave their ordinary employment temporarily. We must now decide whether this unverified accusation merits the use of collective investigative resources. It may be nothing more than an act of personal revenge—or the first loose thread of a concealed secret."
  fcf_economy_event.78.a:0 "He has no evidence, yet still expects us to investigate?"
  fcf_economy_event.78.b:0 "If he has reported it, we should respond."

  fcf_economy_event.79.title:0 "An Unmanageable Accumulation"
  fcf_economy_event.79.desc:0 "Once the threshold for workers to request an investigation was lowered, the number of denunciations submitted to the inspection teams rapidly increased. Initially, this was regarded as proof that reform had genuinely reached the grassroots. Problems once discussed only in workshops and taverns could finally be formally registered and examined by members with no direct connection to those accused.\n\nThe rotating members responsible for organizing the reports were soon buried beneath letters. Many repeated the same accusations, some contained only descriptions such as ‘I heard somewhere’ or ‘everyone knows,’ while others consisted entirely of abuse directed at an official without explaining what had supposedly occurred. The inspectors were forced to search through an enormous volume of emotional denunciations for a small number of verifiable leads.\n\nNor could these letters simply be set aside. The new system promised every member the right to receive a response, and prolonged inaction would reduce supervision to an empty promise once again. Yet if inspectors were dispatched to investigate every letter, the rotating personnel seconded by the branches would quickly expend all their time upon complaints that offered no possible starting point.\n\nSome advocate establishing basic standards for complaints, requiring each report to identify at least the people, place, and specific matter involved. Informants would not have to obtain the accounts themselves or prove that a crime had occurred, but would need to tell the inspection team where it should begin. This would filter out pure abuse and allow genuine leads to be examined more rapidly.\n\nOthers fear that procedural knowledge will eventually monopolize the system. Workers with limited education may struggle to transform everyday suspicions into a formally acceptable written accusation, while administrators could exploit defects in format to demand that inspectors reject their complaints. They argue that more branches should provide rotating members to conduct preliminary oral interviews and verification for every report.\n\nThis would require still more workers to leave their workshops temporarily and impose additional inspection duties upon every branch. We believed that allowing workers to denounce abuses freely would deprive bureaucracy of every hiding place. Instead, we have discovered that even listening to every voice requires a commonly accepted order."
  fcf_economy_event.79.a:0 "Establish standards for complaints."
  fcf_economy_event.79.b:0 "Expand the department responsible for processing them."

  fcf_economy_event.80.title:0 "A Mass of Suspicions"
  fcf_economy_event.80.desc:0 "Acting upon the informant's verbal account, rotating inspectors from several outside branches began examining the local accounts and invited ordinary members to observe the questioning. The accusation's original lack of evidence did not cause it to disappear. Instead, the inquiry uncovered additional irregularities: unregistered transfers of supplies, gifts received in a personal capacity, and several payments whose purposes no one could explain clearly.\n\nThe matter is not as simple as ordinary embezzlement, however. The Great Rat accepted wine from coal merchants and envelopes discreetly offered by factory directors, yet whenever a worker's family fell into hardship, he somehow delivered food and relief payments in time. When the branch's mutual-aid fund ran short, he was also frequently the person who covered the deficit. In the eyes of many local members, these dealings were merely the personal favours required to keep the branch operating.\n\nThe accounts have consequently become increasingly difficult to interpret. Was a gift an expression of gratitude for past assistance or payment for future favours? Did an unauthorized expenditure enter someone's pocket, or was it used to resolve a problem neglected by the formal procedure? Almost every suspicious entry has an apparently reasonable explanation.\n\nThe presence of the inspection team has also made local workers increasingly wary. People initially prepared to answer questions have fallen silent. Some claim to have forgotten events from years ago, while others ask why representatives from elsewhere insist upon interpreting the personal relationships within their branch as crimes. Further examination of private correspondence and household finances will only intensify this resistance.\n\nThe attitude of the local members cannot simply be dismissed as obstruction. The purpose of inter-branch supervision was to allow workers to hold one another accountable, not to give outsiders authority above the local membership congress. Yet the suddenly missing records and remarkably consistent testimony make it difficult not to suspect that someone is using local autonomy to protect a closed network of personal relationships.\n\nWe can respect the judgment of the local membership and end the investigation. Alternatively, we can avoid the internal affairs of the branch for the time being and seek evidence from other factories and cooperatives that conduct business with it. If we believe that the resistance itself proves the inquiry has touched something important, our only option is to request additional inspectors from other branches and intensify the effort to clarify these ambiguous transactions."
  fcf_economy_event.80.a:0 "The Great Rat is a good comrade. End the investigation."
  fcf_economy_event.80.b:0 "Seek evidence elsewhere."
  fcf_economy_event.80.c:0 "Their refusal to cooperate only makes them more suspicious. Intensify the investigation."

  fcf_economy_event.81.title:0 "The White Gloves"
  fcf_economy_event.81.desc:0 "After bypassing the local branch that had fallen silent, the investigation finally achieved a breakthrough. Several transport cooperatives and federal factories that had maintained longstanding relations with it opened their well-preserved accounts. Cross-checking these records with inspectors, membership representatives from the institutions discovered that several apparently unrelated transfers of supplies led back to the same group of people.\n\nThe people who actually accepted gifts, altered documents, and arranged transactions were never the Great Rat himself, but several inconspicuous junior officials around him. They controlled the warehouses, procurement, and mutual-aid funds. Their positions were modest, but placed them at crucial junctions in the movement of resources. They accepted merchants' expressions of gratitude in a personal capacity, then repaid them by falsifying losses or giving priority to particular orders.\n\nSome of the benefits remained in their own hands. The rest passed through several intermediaries before entering accounts controlled by the Great Rat that had never been submitted to the membership congress for review. Even if the account books were discovered, his signature appeared nowhere upon them. If one of the junior officials were questioned, he would admit only to having violated proper procedure and make no mention of the person who arranged everything behind the scenes.\n\nThis explains why direct evidence had previously remained elusive. The Great Rat needed only to suggest during a meeting that a particular factory ‘deserved consideration,’ and someone else would complete the remaining arrangements. Every person was responsible for only a small section of the network, making it difficult for the exposure of any one link to implicate the man at its centre.\n\nAt the same time, he used part of the proceeds to assist struggling workers, cover branch expenditure, and resolve problems that the common procedures had failed to address. Local workers saw coal arriving in times of need, relief payments suddenly being approved, and an old comrade who could always accomplish something on their behalf. They had no means of knowing who ultimately paid for these favours and seldom thought to ask.\n\nThe evidence has revealed how the network operated, but we must still decide how to respond. We can publish and formally transfer all the materials and demand the Great Rat's arrest. We could instead proceed first against the white gloves who directly accepted the money and altered the accounts. Alternatively, we can summon him before the inspection committee and membership representatives to explain these transactions in person."
  fcf_economy_event.81.a:0 "The corrupt have no right to defy us. Arrest him!"
  fcf_economy_event.81.b:0 "Making an example of the white gloves is the safest choice."
  fcf_economy_event.81.c:0 "Let the Great Rat explain himself."

  fcf_economy_event.82.title:0 "A Mass Movement on the Other Side"
  fcf_economy_event.82.desc:0 "After inspectors representing several branches jointly confirmed the accusations against the Great Rat and formally transferred the case, the local workers quickly mobilized in response. Before those responsible for executing the arrest could enter the branch office, several hundred members had gathered outside. They blocked the entrance and raised placards bearing the Great Rat's name. Several nearby factories even suspended work temporarily, while more supporters were already leaving their workshops to join them.\n\nIn their view, the Great Rat may not always have observed the common statutes, but had never betrayed the local workers. The relief received by the unemployed, coal delivered to homes during winter, and supplies obtained whenever factories ran short of materials were more persuasive than the accounts displayed by inspectors from elsewhere. Payments described as bribes were explained as practical expedients that the branch had been forced to adopt.\n\nWhen the inspection representatives attempted to read the evidence aloud, they were met with jeers. Some accused the outsiders of seeing only several unregistered expenditures without ever experiencing the days when the local branch lacked resources. Others asked why the workers here were invariably the beneficiaries if the Great Rat had genuinely been interested only in enriching himself.\n\nOn the other side, the branches that participated in the investigation have convened membership congresses of their own. Workers who discovered that their branches' supplies had been transferred cheaply and that the interests of their cooperatives had been privately traded away are demanding complete disclosure of the accounts and punishment of those responsible. They refuse to accept that other branches should remain silent merely because part of the proceeds of corruption remained in the locality that obtained them.\n\nBoth mobilizations claim to defend workers' autonomy. One side argues that external inspectors possess no right to remove an official trusted by the majority of local members. The other insists that no branch may invoke autonomy to transform common property into an instrument with which a small group cultivates its own reputation. We have always regarded mass movements as a force directed against bureaucracy. Now workers have taken opposing sides beneath the same banner.\n\nThose responsible for the arrest continue waiting for the road to be cleared, while the inspection representatives repeatedly demand that the local branch comply with supervisory statutes adopted jointly by the branches. The obstruction before us comes not from an elevated bureaucratic institution, but from the very workers who were supposed to form the foundation of reform. Yet the number of people in the street does not make the evidence placed before the branches disappear."
  fcf_economy_event.82.a:0 "Stand firm against the pressure."

  fcf_economy_event.83.title:0 "The Confrontation"
  fcf_economy_event.83.desc:0 "The meeting was arranged in an unmarked room inside the CGT's national headquarters, which merely provided a venue belonging to none of the branches involved in the case. Seated opposite the Great Rat were the rotating inspectors who had participated in the investigation and several membership representatives elected by their branches. Upon the table lay the account books, correspondence, and testimony of the white gloves.\n\nThe Great Rat examined the documents page by page without displaying much alarm. He understood perfectly well that although the inspection committee had uncovered the problem, it could not speak on behalf of the local membership congress, nor order other branches to bear the local branch's difficulties without question. So long as the workers who supported him refused to accept the inquiry's findings, any action against him would provoke a prolonged dispute.\n\nHe did not deny the transactions, but described them differently. The local branch had suffered a chronic shortage of funds, its mutual-aid payments exceeded its income, and many factories depended upon personal relationships to obtain raw materials in time. A considerable proportion of what the accounts described as bribes had ultimately been used to cover these deficits. Without his relationships and informal transfers, he argued, the branch would have ceased functioning long ago.\n\nThe branch's accounts do indeed reveal chronic deficits, while other regions had rarely shown concern for its difficulties. Yet the Great Rat also accumulated wealth, power, and personal prestige through these dealings. Even if every statement he made were true, it would not explain why the resources had never been placed under the open administration of the membership, but had to pass through a private network controlled by him and several close associates.\n\nHe then proposed an agreement. The inspection committee could punish the white gloves who directly accepted money and altered the accounts. He would not obstruct this and would personally persuade local workers to accept the investigation's conclusions. In return, the Comités syndicalistes révolutionnaires must persuade other branches to provide additional money and supplies to cover the deficits left by the disappearance of the former channels, while all proceedings against him personally would end.\n\nAn argument quickly began among the membership representatives. Some believed that he was merely using the livelihoods of local workers to purchase his own safety. Others pointed out that the network had arisen not only from individual greed, but also from a longstanding imbalance in the distribution of resources among the branches. Whatever the truth, he has placed the fate of the white gloves, the local branch, and himself upon the negotiating table and now awaits our answer."
  fcf_economy_event.83.a:0 "We have a deal."
  fcf_economy_event.83.b:0 "He invented this story merely to escape arrest. Take him away."

  fcf_economy_event.84.title:0 "The Branch Revolts"
  fcf_economy_event.84.desc:0 "The Great Rat was ultimately removed from the local branch. Although the workers who obstructed his arrest did not immediately accept the findings of the investigation, they ceased blockading the building. Several implicated officials were suspended in succession, the private accounts that had never undergone membership review were sealed, and the network entrenched within the branch for years finally appeared to have disappeared.\n\nAlong with that network, however, disappeared the coal, raw materials, and relief funds that had always been obtainable at short notice. Other branches sent some supplies following votes on mutual assistance, but every allocation required public debate and could not cover every deficit. The local mutual-aid fund was soon exhausted, ordinary allowances began falling into arrears, and several factories reduced production because of shortages of raw materials.\n\nIncreasing numbers of workers are leaving the CGT and joining other unions capable of providing immediate relief or employment guarantees. They do not necessarily believe the Great Rat to have been innocent. They merely argue that if outside inspectors insist upon dismantling the old methods, they should know what new methods will replace them instead of returning to their own branches once the investigation ends.\n\nThe members who remain within the branch are equally resentful. In their view, those who conducted the investigation cared only whether the common statutes were observed and never attempted to understand how the locality had survived one shortage after another. The evidence in the accounts has not been disproved, but is no longer the issue that most concerns the membership congress.\n\nThe branch congress soon adopted a bitterly worded resolution. It did not declare withdrawal from the CGT, but accused inter-branch inspection of becoming interference by an external majority against a local minority and demanded the abolition of the rotating investigative system promoted by the Comités syndicalistes révolutionnaires. Speakers repeatedly cited the Great Rat's former achievements and presented the present hardship as proof that the reform was detached from reality.\n\nTo oppose a reform that claimed to defend grassroots autonomy, these members have begun openly supporting factions within the CGT hostile to the Comités syndicalistes révolutionnaires. They have given their delegate seats and applause at meetings to people they once regarded as bureaucrats, declaring that only in this way can they prevent other branches from again deciding how they should live."
  fcf_economy_event.84.a:0 "Absurd."

  fcf_economy_event.85.title:0 "Alerting the Quarry"
  fcf_economy_event.85.desc:0 "After the request for assistance was accepted, more branches seconded members to intensify surveillance of the Great Rat. They took turns observing the vicinity of the office, recording every visitor, and secretly cross-checking recent transfers of supplies and funds. Yet apart from several ordinary meetings and entirely regulation-compliant expenditures, we found nothing.\n\nThe merchants and cooperative directors who once visited the branch frequently have suddenly ceased appearing, while several junior administrators closely associated with the Great Rat have become exceptionally cautious. Every document has been disclosed according to the rules, every batch of goods in the warehouse possesses a clearly recorded destination, and even the mutual-aid accounts most frequently affected by irregularities in the past are now so orderly that nothing can be criticized.\n\nThis may mean that the original suspicions were unfounded, but the inspectors prefer another explanation: the Great Rat has realized that he is under surveillance. He knows every corner of the local branch and recognizes many of the members seconded from neighbouring regions. A single unnecessary question or a letter delivered to the wrong place would be sufficient to alert him to the danger.\n\nIf this judgment is correct, continuing with the same methods is unlikely to produce results. So long as rotating inspectors remain in the locality, the Great Rat will not readily expose his network. Yet these members are supposed to return periodically to their original workshops, while their branches have begun demanding the recall of representatives absent for an extended period.\n\nSome of those responsible for the case therefore recommend ending the operation while we still can. Inter-branch supervision depends upon members voluntarily accepting a common responsibility and cannot indefinitely consume the personnel of other branches for a case that produces no progress. Continued surveillance would not only require new rotations, but make the inspection system increasingly resemble a permanent local police institution.\n\nOthers refuse to abandon the inquiry. The Great Rat cannot remain vigilant forever. The branch must continue operating, and its former relationships cannot disappear completely. If the inspectors remain in place, someone will eventually become careless and some transaction will leave a trace. The only question is how many branches remain prepared to send members to wait him out."
  fcf_economy_event.85.a:0 "Let him have this victory."
  fcf_economy_event.85.b:0 "We have all the time required to wait him out."

  fcf_economy_event.86.title:0 "All for Nothing"
  fcf_economy_event.86.desc:0 "Several more weeks have passed, and the surveillance has still produced no result. The Great Rat arrives at the branch punctually each day, attends public meetings, handles matters approved by the membership, and departs under the gaze of everyone present. Those who once maintained close relations with him have never reappeared, as though the network that aroused so much suspicion had never existed.\n\nTo maintain the surveillance, the branches must continually replace their rotating members. Just as an inspector becomes familiar with local conditions, he must return to his former workshop, leaving his replacement to identify the branch's personnel and relationships from the beginning. Some remained for more than ten days and recorded only several ordinary visits. Others reviewed months of accounts and discovered nothing beyond a handful of insignificant registration errors.\n\nThis expenditure of effort has begun affecting other investigations. Several more specific denunciations have been delayed, while members previously assigned to examine accounts elsewhere must remain here and continue waiting. The branches supplying the rotating inspectors have also begun to complain. They are willing to accept responsibility for common supervision, but cannot expend their personnel indefinitely upon surveillance with no end in sight.\n\nThe Great Rat, meanwhile, has recovered his former composure. He need not oppose the inspection system openly or prove every accusation false. He need only continue observing the statutes and allow one group of representatives from other branches after another to depart empty-handed. As time passes, the suspicions that originally appeared so disturbing increasingly resemble excuses invented by reformers unwilling to admit their mistake.\n\nThe membership is also losing patience. At the beginning of the reform, workers were told that inter-branch supervision would break the administrators' mutual protection and prevent any network from escaping the inquiries of ordinary workers. Instead, they see large numbers of members removed from their proper work, other cases left unexamined, and a suspect remaining comfortably in his original position.\n\nSome have begun to wonder whether the problem is not insufficient persistence by the inspectors, but the inability of the CGT to reform itself through its own resources. So long as those controlling relationships and supplies temporarily restrain themselves, rotating representatives can do nothing but wait fruitlessly during their limited time. We intended to prove that workers could supervise their own organization, but succeeded only in exposing the weakness of the system."
  fcf_economy_event.86.a:0 "We have shot ourselves in the foot."

  fcf_economy_event.87.title:0 "Chaos upon Chaos"
  fcf_economy_event.87.desc:0 "The democratization of the administration continues, but elections in the local branches have not followed a common path. Some rapidly replaced almost every official, others opened only a small number of administrative posts to election, while still others remain under their former personnel after repeatedly debating the proper electoral procedure. The reform gave members the power to remove administrators, but could not guarantee that every branch would immediately find suitable successors.\n\nIn places where resentment had accumulated most deeply, the former administration was almost completely swept away. Several influential members who had regularly denounced bureaucracy at membership congresses and advocated improved conditions for the workers entered branch committees with overwhelming support. They understood the workers' grievances and were genuinely prepared to listen to the workshops, but once seated behind the desks, they discovered that administration was far more complicated than speeches at a meeting.\n\nProcurement plans, mutual-aid accounts, interregional allocations, and supply agreements among factories do not complete themselves merely because an administrator is popular. Some newly elected officials cannot understand even the most basic accounting formats and remain dependent upon the former clerks they removed. Others return every problem to the membership congress for a vote, delaying for days matters that once required only several letters. Still others insist upon fulfilling their campaign promises first, raising local benefits and retaining supplies intended for transfer elsewhere without coordination, catching neighbouring branches completely unprepared.\n\nElsewhere, elections have produced not change but the further consolidation of the former administrators' positions. Officials skilled at assisting local members and maintaining longstanding personal relationships have easily won re-election, using the public vote to demonstrate that they possess the workers' mandate. Some privately compare them to Napoleon III: the ballot has not diminished personal authority, but dressed it in democratic clothing. Those who once criticized them for holding office indefinitely must now confront an inconvenient fact—they genuinely received the support of a majority of members.\n\nConsidered separately, every branch appears to have its own reasons. Workers possess the right to elect people they trust and to administer local affairs through new methods. Yet the CGT is not an archipelago of isolated autonomous islands. Raw materials must be transferred between regions, cooperatives must reconcile deliveries, and mutual-aid funds frequently depend upon contributions from several branches. If one branch delays registering a shipment, a factory elsewhere may receive no materials. If one administrator does not understand a previous agreement, the production arrangements of several regions may be disrupted simultaneously.\n\nThe disorder has rapidly spread through this network. Documents are returned for completion, goods remain inside warehouses awaiting confirmation, and agreements already concluded are resubmitted by new administrators for membership review. No one has ordered cooperation to cease, and no branch openly refuses its common obligations. Yet mismatches in ability, procedure, and pace of work have been sufficient to make the whole network malfunction. The reform was intended to make administration answerable to the workers, but is now beginning to affect the workers' own production and daily lives.\n\nSome comrades consequently demand that anyone seeking administrative office first demonstrate the necessary knowledge. The members would retain their electoral rights, but democratic choice could not substitute for the ability to administer accounts, coordinate production, and honour agreements. Other comrades argue that such qualifications would return the newly opened offices to the former administrators. The new system will undoubtedly elect incompetent people, but the workers will witness their failures and remove them in the next vote. Democracy can truly learn to administer only through a continuing process of making and correcting mistakes."
  fcf_economy_event.87.a:0 "An administrator must know how to administer!"
  fcf_economy_event.87.b:0 "These are merely the growing pains of reform. The system will correct itself."

  fcf_economy_event.88.title:0 "Self-Correction"
  fcf_economy_event.88.desc:0 "The initial disorder did not end immediately. Delayed raw materials remained piled at railway stations, incorrectly completed accounts continued to be returned, and some newly elected administrators still interpreted every criticism as a counterattack by the old order. Once these problems began directly affecting wages, production, and mutual-aid funds, however, the atmosphere within membership congresses started to change. People no longer debated only who had most courageously denounced the former administration, but asked who could make the present system function.\n\nThe first to lose support were precisely those who had entered office through militant rhetoric. They had promised to abolish every cumbersome procedure, but discovered after assuming responsibility that not every form, record, or coordinating arrangement had been invented by bureaucrats to torment the workers. Delayed coal would not deliver itself to the factories after a passionate speech, nor would a miscalculated mutual-aid fund replenish itself because its administrator came from the grassroots.\n\nSome attempted to blame the former clerks, while others asked the members to grant them more time. When the same mistakes continued, their previous popularity could no longer conceal their incompetence. Branch congresses began requiring administrators to explain every delay publicly, while workshop representatives brought production problems into the meetings one by one. Several officials who refused to admit their errors were quickly removed, and others resigned voluntarily and returned to work they understood better.\n\nTheir successors were not all former administrators. During the weeks of disorder, several previously inconspicuous workers distinguished themselves. Some voluntarily helped reconcile the accounts, some understood supply relationships among different factories, and others could transform opinions expressed at membership congresses into arrangements that could actually be implemented. They were not necessarily the most impressive speakers, but had demonstrated their abilities through practical work. When new elections were held, their names appeared frequently upon candidate lists throughout the branches.\n\nEven the former administrators who successfully retained their positions could no longer behave as they had before. Their offices no longer rested upon seniority or personal relationships, but were continually subjected to questions and votes by the membership. Several officials accustomed to keeping decisions inside their offices began voluntarily publishing accounts and no longer dared ignore the opinions of the workshops. Elections did not remove every veteran, but forced some of them to continue working under the workers' observation.\n\nAs the new round of replacements was completed, cooperation among the branches gradually recovered. Accumulated documents were processed, disordered allocations of materials realigned, and new contacts were established between industries and regions. More importantly, questioning and transfers of responsibility exposed many affairs previously understood only by a small number of administrators to a broader membership. Profiting from ambiguous records and personal connections became more difficult, while the CGT's national network finally resumed operation.\n\nNot every problem has disappeared. People familiar with accounting and coordination remain more likely to be elected than ordinary workers, while some popular administrators have begun winning repeated terms. Elections can eliminate obvious incompetence without necessarily preventing new monopolies over office. Yet this time the members did not wait for some institution to correct their mistakes. After personally bearing their consequences, they made a new choice themselves.\n\nDemocratization of the administration was neither as smooth as its advocates initially imagined nor as destructive as its opponents predicted. After an expensive and disorderly period of adjustment, workers have begun learning both how to elect administrators and how to remove those who prove incapable. The system has not spontaneously created perfect people, but has finally demonstrated that it can correct its own errors."
  fcf_economy_event.88.a:0 "Some good news at last."

  fcf_economy_event.89.title:0 "Old Wine in New Bottles"
  fcf_economy_event.89.desc:0 "To end the disorder following the branch elections, we established basic knowledge requirements for administrative positions. Anyone seeking to join a branch committee, administer accounts, or participate in interregional coordination must at least understand financial records, material-allocation procedures, and the common agreements among the CGT's constituent organizations. The members retain the right to decide who will administer them, but candidates must first demonstrate that they understand how to perform the work.\n\nThe regulation quickly stabilized conditions throughout the country. Candidates unable to reconcile even basic accounts and inclined to return every question to the membership congress disappeared from the lists. Branches no longer had to fear that a newly elected official would have to relearn everything after taking office. On the surface, at least, we appeared to have found a balance between workers' democracy and administrative efficiency.\n\nYet the lists submitted after the new elections looked strangely familiar. Procurement remained in the hands of those who had previously administered procurement; mutual-aid funds remained under their former administrators; and several officials who had long represented their branches in negotiations elsewhere were comfortably re-elected. The few newcomers entering the committees were generally assistants to former administrators, accountants, or employees with long experience in clerical work.\n\nThis was not because the membership opposed change. Many workers genuinely wished to nominate trusted colleagues from their workshops, but discovered that those colleagues did not understand the complicated accounts or interregional allocation procedures. Giving them immediate responsibility might reproduce the previous disorder. By comparison, the familiar names of the former administrators might offer little inspiration, but at least meant that documents would be sent on time and supplies would not remain in warehouses because of procedural errors.\n\nAdministrative knowledge has therefore become an invisible barrier. Every worker can nominally become an administrator, but the only people genuinely qualified to appear upon the ballot remain the small number who have long been detached from frontline work and already possess specialized knowledge. We intended to transform administration into a verifiable technical skill so that positions would no longer be monopolized through seniority and personal relationships, only to discover that those possessing the skill are largely the same people who controlled the offices before.\n\nMore troublingly, elections have not diminished their position, but granted it new legitimacy. In the past, members could accuse an official of occupying his post indefinitely through appointment or seniority. Now he can display the result of a public vote and declare that he not only possesses administrative ability, but enjoys the confidence of a majority of workers. Criticism of him can easily be presented as disrespect for the membership's decision.\n\nThis result cannot simply be described as deception. The votes were genuine, and the members knew whom they selected. Many former administrators may remain attached to old habits, but understand the operation of their branches far better than hastily nominated newcomers. Their ability to prevail in an open election may demonstrate that the problem was not their continued service as administrators, but our assumption that every former administrator was a bureaucrat who had to be removed.\n\nOther comrades argue that elections cannot offer a genuine choice while only a few people possess administrative knowledge. If ordinary workers can never understand the accounts or coordination procedures, they can vote only among the same veterans already familiar with administration. Breaking this pattern requires bringing knowledge previously confined to the offices into the workshops, enabling more workers to become candidates—even if the CGT must invest still more time and resources.\n\nWe have adopted ballots and a new system, yet the people sitting in the administrative offices remain largely familiar faces. Does this prove that the former administrators are indispensable, or merely that our democracy still lacks a genuine choice?"
  fcf_economy_event.89.a:0 "If they can win an election, they deserve the position."
  fcf_economy_event.89.b:0 "Ordinary workers must also learn how to administer."

  fcf_economy_event.90.title:0 "Overburdened"
  fcf_economy_event.90.desc:0 "Local branches throughout the country have established administrative courses to prevent positions from remaining the preserve of the few people familiar with the accounts and procedures. Every member may enrol. The curriculum ranges from financial records and material allocation to interregional agreements and the procedures of membership congresses. Knowledge once confined to the offices has been assembled into instructional materials and delivered to factories, mines, and transport depots.\n\nInitial enrolment was enthusiastic. Many workers wanted to know what administrators wrote upon their papers each day and why several complicated terms were always sufficient to dismiss demands from the workshops. The first classes were frequently filled beyond capacity, with some people standing outside the windows to listen throughout the evening. Reformers consequently believed that once knowledge was no longer restricted, ordinary workers would quickly replace the former administrators.\n\nThe enthusiasm did not last. Classes could be held only after shifts ended, when many pupils had already completed eight hours of labour. As instructors explained inventory depreciation and the balancing of mutual-aid funds upon the blackboard, people repeatedly fell asleep at their desks. Night-shift workers struggled to attend on time, while those responsible for their families frequently had to leave early. After several weeks, classrooms once filled to overflowing often contained only a handful of pupils.\n\nThose who remained also began asking questions. Completing every course would not guarantee victory in the next election, while election would bring only more accounts, meetings, and disputes. Continuing in one's existing work at least provided a predictable wage and time for rest. Administrative knowledge offered not a reliable right, but a qualification that might never be used.\n\nWhen withdrawing from the course, one machine-tool worker performed a simple calculation. He had spent six evenings learning how to check the branch's accounts and consequently lost six evenings with his family. The next election remained months away, and even if nominated, he would struggle to compete with former administrators possessing years of experience. He did not oppose workers administering the CGT; he simply did not understand why he alone had to bear the cost of reform after completing his working day.\n\nGradually, only a few kinds of people remained in the courses: employees already engaged in clerical work, activists explicitly seeking administrative positions, and a small number of members possessing ample leisure time. We have opened the door of education to every worker, but not everyone possesses the strength to enter. Former administrators no longer formally monopolize administrative knowledge, but access to it is being redistributed according to time, energy, and personal circumstances.\n\nIf the present arrangements continue, workers with genuine interest will at least retain an opportunity to learn. The courses may remain small, but will gradually produce new candidates. If we desire widespread participation by ordinary workers, however, we cannot treat administrative education as a personal hobby consuming their rest. Some propose reducing the working hours of pupils and treating the courses as part of their official labour. Opponents point out that branches would then have to pay not only for instruction, but also arrange replacements for the time pupils spend away from their jobs.\n\nOthers argue that we were mistaken from the beginning in assuming that every worker should prepare for administrative office. Anyone who genuinely desires the responsibility will naturally seek books, consult clerks, and find a way to demonstrate his ability. The CGT need not expend enormous resources forcing knowledge upon a majority that does not require it. Yet if education again becomes a barrier that individuals must overcome alone, those with the most time and connections will probably remain the first to appear upon the ballot.\n\nKnowledge has left the locked offices without automatically entering every worker's mind. In attempting to lower the barrier to administrative office, we have placed an additional burden upon the labour and private lives of ordinary workers. We must now decide whether to let limited interest produce gradual results, or make the organization as a whole bear the time and cost required to learn administration."
  fcf_economy_event.90.a:0 "Continue teaching the workers who are interested."
  fcf_economy_event.90.b:0 "Then treat education as part of their work!"
  fcf_economy_event.90.c:0 "Those who truly wish to become administrators do not need our assistance."

  fcf_economy_event.91.title:0 "A New Face"
  fcf_economy_event.91.desc:0 "After administrative positions were opened to election by the entire membership for the first time, local branches began submitting lists of their newly elected personnel. Mechanics from the workshops, tally clerks from warehouses, membership representatives who had long calculated their colleagues' wages, and ordinary workers who attended administrative courses began appearing upon branch committees and in other administrative positions. They possessed no history of spending years inside an office, but could understand accounts, organize allocations, and knew which procedures were required to transform a resolution into practical production.\n\nBefore the elections began, many feared that even if members could nominate trusted colleagues, they would ultimately be able to choose only among the former administrators. Those responsible for procurement, mutual-aid funds, and interregional coordination required extensive specialist knowledge, which had previously remained almost entirely confined to the offices. If positions were handed directly to unprepared workers, democratizing administration might first produce disordered accounts and halted production.\n\nThe earlier administrative courses changed this situation. By the time the elections actually began, their pupils formed an alternative body of candidates outside the former administration. They could explain to members how they intended to reconcile the accounts, arrange procurement, and fulfil agreements among branches, rather than winning applause solely through denunciations of bureaucracy. For the first time, the workers could choose candidates who came from the workshops and possessed basic administrative competence.\n\nThe results did not remove every former administrator. Officials who performed their duties reliably and accepted supervision by the membership continued to receive majority support and retained their positions. Others who had long held office through seniority and personal connections were defeated by ordinary members who had completed the training.\n\nThe transfer of responsibility was hardly easy. Former administrators left behind piles of documents, recording methods unchanged for years, and countless working habits transmitted only by word of mouth. The newly elected officials had to consult the former clerks while rechecking figures whose origins no one could explain. Some meetings continued deep into the night, while several shipments were delayed by incorrect signatures. Yet the previous instruction at least showed the newcomers where to begin and prevented branches from becoming paralyzed after the change of personnel.\n\nThe more important change occurred not in the account books, but in the relationship between the offices and the workshops. Many new administrators had worked beside ordinary workers on the same production lines until the elections. They knew which machine always failed during the night shift, that raw materials recorded as ‘still in reserve’ had actually become unusable, and how an apparently trivial change in shifts would disrupt the lives of workers with children.\n\nShortly after assuming office, one new procurement official discovered that a component long purchased by his branch was inexpensive and never recorded as being in short supply, yet suffered actual losses far above those reported. Former administrators invariably attributed the discrepancy to ‘worker error.’ Having worked beside those components for years, he knew that the true problem was the supplier's poor quality. When the contract was reviewed, a chain of vested interests that had persisted for years was also exposed. Similar discoveries are being made across the country: fictitious, concealed, and purely paper accomplishments can no longer easily deceive people familiar with the actual workplace.\n\nCorruption has not disappeared, but has lost many of its hiding places. The new administrators live beside the membership and can be questioned by their own colleagues at any congress. They cannot easily declare that a warehouse is empty while asking everyone who walks past its doors each day to believe the report. Nor can they present figures plainly incompatible with production as achievements to a committee with no practical experience. The data have become less impressive and more mundane, but correspond more closely with what the factories can genuinely produce.\n\nFriction among the branches has also emerged. Administrators rooted in their localities understand their members' demands better than their predecessors and are frequently more inclined to prioritize local needs. Some branches refuse to transfer scarce raw materials elsewhere, while certain administrators prefer to retain additional stocks for nearby factories rather than fulfil allocation arrangements requested by distant units. The old bureaucracy is retreating, but local protectionism may acquire new strength through the members' mandate.\n\nFor now, however, the benefits of the change greatly exceed these disputes. Production plans are no longer designed solely around attractive reports, problems genuinely affecting the workshops receive faster attention, and branch accounts have become more transparent and credible. Administration no longer resembles a privilege isolated from labour, but is beginning to become a public responsibility that workers can learn, assume, or entrust to others through elections. The new administrators will still make mistakes and remain subject to local and factional influences, but at least understand that they are administering not figures upon a report, but people beside whom they once worked."
  fcf_economy_event.91.a:0 "Now those are workers!"

  fcf_economy_event.92.title:0 "Old Friends"
  fcf_economy_event.92.desc:0 "When Monatte arrived at the printers' union office, Georges Gressent had already been waiting for some time. There was no formal agenda or secretary to record the proceedings, only two cups of cooling coffee and several newly printed trade-union newspapers. It had been a long time since they had met privately, yet neither needed to spend time renewing the other's acquaintance. Before the revolution, they had debated the general strike, workers' autonomy, and the future of syndicalism at the same meetings. The paths they subsequently chose had gradually transformed ‘old friend’ into an ironic form of address.\n\nJouhaux has brought them back to the same table. The moderate CGT faction controls the central institutions, interregional coordination networks, and numerous local branches and invokes the maintenance of production and organizational unity to restrict further democratization at the grassroots. The radicals led by Monatte can win applause at membership congresses, but have consistently struggled to dislodge officials entrenched over many years. If the Coalition nationale syndicaliste applies pressure from outside, the moderates will have to confront two fronts simultaneously.\n\nGressent was not surprised by the proposal. The Coalition nationale syndicaliste likewise opposes Jouhaux's transformation of the CGT into a bureaucratic machine concerned only with stable operation, while Gressent himself has never concealed his contempt for the moderates. A common enemy, however, is not sufficient to create an alliance. He reminded Monatte that many people had remembered the Coalition nationale syndicaliste when their internal struggles reached an impasse, only to distance themselves hurriedly from those ‘inconvenient radicals’ once the danger had passed.\n\n‘Do you actually require allies,’ Gressent asked, ‘or merely people to attack Jouhaux on your behalf and be forgotten afterwards?’\n\nMonatte did not deny the differences between them. The Coalition nationale syndicaliste's positions upon the nation, war, and revolutionary discipline remained difficult for many CGT radicals to accept, while Gressent could never place his organization under Monatte's leadership. They agreed upon at least one principle: the direction of the CGT should not be determined by people who spent their days reconciling reports and disputes, nor should an organization inherited from the revolution become an instrument for preserving the status quo. They could leave their old arguments unresolved and first prevent Jouhaux from consolidating his position further.\n\nGressent did not answer immediately. What he truly wished to know was how far Monatte's faction intended to carry the struggle. If it sought only several concessions from the moderates, the Coalition nationale syndicaliste had no reason to assume the risk. If it genuinely intended to change the distribution of power inside the CGT, cooperation itself might be sufficient compensation. Monatte could, of course, offer a more concrete demonstration of good faith.\n\nThe Coalition nationale syndicaliste has long campaigned for employment and organizational opportunities for veterans, while the printers' union is an important base from which Gressent disseminates his ideas and maintains his supporters. CGT assistance in returning veterans to employment or greater influence for the Coalition nationale syndicaliste within the printers' union would demonstrate that the invitation was more than a temporary slogan. The price is that any public promise will provoke doubts inside Monatte's own camp and make the future alliance more difficult to reverse.\n\nThe machinery continued operating beyond the windows, and the latest newspapers would soon be dispatched across the country. Gressent raised his now-cold coffee and waited for his old friend to state his terms."
  fcf_economy_event.92.a:0 "Cooperation is its own reward."
  fcf_economy_event.92.b:0 "We should actively assist veterans in returning to employment."
  fcf_economy_event.92.c:0 "The Coalition nationale syndicaliste will receive greater influence within the printers' union."

  fcf_economy_event.93.title:0 "A Revolutionary Alliance"
  fcf_economy_event.93.desc:0 "Gressent did not keep Monatte waiting long. Several days later, a short letter written without the official stationery of the Coalition nationale syndicaliste reached the office of the CGT radicals. It contained neither an enthusiastic declaration nor a lengthy statement of common ideals, but merely listed several points where information could be exchanged, several local officials prepared to coordinate action, and one brief answer: the Coalition nationale syndicaliste would join the struggle.\n\nThe agreements already reached will be fulfilled separately by the two organizations, but their cooperation will not be announced as a formal alliance. Newspapers affiliated with the Coalition nationale syndicaliste will begin investigating nepotism, concealed accounts, and monopolization of office within the CGT's central institutions. Monatte's faction will introduce the resulting materials at membership congresses and the General Labour Council. If the moderates attempt to discipline a local branch that opposes them, both sides will mobilize their supporters simultaneously to prevent the affair from being suppressed in silence.\n\nGressent has not accepted Monatte's leadership. The Coalition nationale syndicaliste will retain its organization, programme, and propaganda network and will continue criticizing the CGT radicals' positions upon the nation, war, and revolutionary discipline. Monatte has likewise reminded his comrades that this is political cooperation against Jouhaux's faction, not an endorsement of national syndicalism. None of their old arguments has been resolved; they have merely been moved temporarily to the other side of the table.\n\nFor Jouhaux, however, even this limited alliance is dangerous. The moderates could previously dismiss opponents within the CGT as a noisy minority without organizational competence and denounce attacks from the Coalition nationale syndicaliste as agitation by outsiders. Now the two forces are beginning to provide one another with precisely what each previously lacked. Monatte possesses representatives, branches, and procedural experience inside the CGT; Gressent commands an extensive publishing network and a loyal body of supporters beyond the control of the central institutions.\n\nThe effects of cooperation soon became visible. Disputes previously confined to a handful of branches were printed as pamphlets and distributed throughout the country, while local representatives suppressed by the central leadership began receiving support from the press of the Coalition nationale syndicaliste. At the same time, Monatte's faction ceased relying upon abstract calls for democratization and produced specific accounts, appointments, and meeting records demonstrating precisely what the moderates protected in the name of ‘maintaining order.’\n\nThere is opposition within the Coalition nationale syndicaliste. Some do not trust the CGT radicals to honour their promises, while others believe that Gressent is fighting Monatte's battle for control of an institution irrelevant to their own movement. Gressent has suppressed these objections. He does not require his comrades to trust Monatte, only to recognize the opportunity before them: any fracture in the order established by Jouhaux will benefit those who seek to make the CGT a revolutionary organization once again.\n\nTwenty years ago, they stood within the same movement and believed that workers' organizations could bypass parliaments and bureaucracies to shape a new society themselves. Everything that followed sent them along different paths and transformed former companions into mutually suspicious opponents. They have not become comrades again, but have once more directed their weapons against the same enemy.\n\nThis may not become a lasting friendship. Until Jouhaux falls, however, the revolutionaries of an earlier age stand together once again."
  fcf_economy_event.93.a:0 "Just as they did twenty years ago."

  fcf_economy_event.94.title:0 "A Lack of Sincerity"
  fcf_economy_event.94.desc:0 "Gressent's reply arrived three days later. It did not use the official stationery of the Coalition nationale syndicaliste and was considerably shorter than Monatte had expected. Beyond the necessary greetings, the letter contained only several brief paragraphs, while its most important sentence was enough to terminate the negotiation: the Coalition nationale syndicaliste would not join the CGT radicals' campaign against Jouhaux.\n\nMonatte's proposed terms were not insignificant. Assistance in returning veterans to employment or greater freedom for the Coalition nationale syndicaliste to operate inside the printers' union would provide tangible benefits to Gressent's organization. Even without these additional promises, their shared hostility towards the bureaucratization of the CGT was genuine. Gressent never doubted that Monatte opposed Jouhaux. He doubted how far Monatte was prepared to carry that opposition.\n\nIn Gressent's view, the CGT radicals continued to treat the struggle as an internal disagreement over direction. They demanded the opening of administrative posts, expanded supervision by the membership, and the weakening of networks of office cultivated by the moderates over many years, but had never demonstrated a determination to break the existing order completely. Monatte needed the Coalition nationale syndicaliste because he temporarily lacked the strength to overwhelm Jouhaux. Once the moderates offered several concessions, the supposed common struggle could end at any moment.\n\nNor did the concrete terms change his judgment. Employment for veterans should not become payment for a temporary alliance, while influence within the printers' union should not be obtained through a secret transaction. If Monatte genuinely supported these demands, he should incorporate them publicly into his own proposals for reform rather than place them upon the negotiating table only when he required the Coalition nationale syndicaliste's assistance. Gressent would not exchange his organization's support for promises that could be withdrawn whenever political circumstances changed.\n\nThe letter contained no bitter accusations or threat to end all future contact. Gressent continued to acknowledge that they possessed a common enemy and stated that the Coalition nationale syndicaliste would continue exposing the corruption and bureaucracy of the moderates through its own methods. It would not, however, accept Monatte's coordination, provide the CGT radicals with its publishing network and local organizations, or require its supporters to bear the risks of another faction's internal struggle.\n\nThe atmosphere in the radicals' office was sombre after the message arrived. Some accused Gressent of arrogance and vanity, claiming that he preferred to preserve the independent posture of the Coalition nationale syndicaliste rather than seize an opportunity to weaken Jouhaux. Others had to admit that his suspicions were not entirely unfounded. Monatte wanted an ally, but consistently avoided explaining how far he intended to carry reform after the moderates had fallen.\n\nThe approach has not been entirely fruitless. Both sides now understand that old friendships and a common enemy cannot conceal their differences. From now on, however, the CGT radicals must confront Jouhaux's power throughout the central institutions and local branches without external assistance. Gressent has not sided with the moderates, but neither will he win Monatte's war for him."
  fcf_economy_event.94.a:0 "We can succeed on our own."

  fcf_economy_event.95.title:0 "Where Are the People?"
  fcf_economy_event.95.desc:0 "After the professional civil-service system began operating, local branches submitted lists of personnel who satisfied the requirements for office. The first reports were relatively encouraging. Paris, Lyon, Marseille, and other major cities possessed numerous employees familiar with statistics, accounting, and production scheduling, while some large industrial branches could even choose among several qualified candidates. As the lists from remote regions and smaller branches arrived, however, the number of empty spaces upon the forms steadily increased.\n\nSome branches could find only one barely qualified accountant and no one capable of administering interregional allocations. Others nominated several experienced veteran employees who subsequently failed the new qualification review. Still others lacked the resources to provide complete training courses and could only distribute instructional materials received from the central office for members to study independently. Almost half of the positions expected to be filled rapidly remain under temporary personnel.\n\nThe problem is not merely that several offices lack employees. The CGT's interregional cooperation depends upon every branch jointly completing registration, accounting, and confirmation. The coal branch must know how much fuel the steelworks genuinely require; the transport branch must verify the quantity and destination of the goods; and those responsible for settlement must ensure that both sides use the same records. If even one part of this chain lacks a qualified administrator, no one will verify the figures arriving from the preceding office, while the goods waiting behind it cannot be released.\n\nThe most obvious delay concerned a transfer of machine tools. The branch providing the equipment had already loaded the shipment, while the recipient had cleared the factory space in advance. Yet the position responsible for verifying the agreement remained vacant. The temporary administrator refused to sign documents involving such a large sum and sent them to a neighbouring branch for review. Its professional official was already responsible for four transfers and left the documents untouched for an entire week. By the time the machine tools finally arrived, their components remained stranded in another warehouse, forcing the entire production line to remain idle.\n\nSimilar disorder is recurring throughout the country. We established unified standards to prevent incompetent people from re-entering the administration. Yet if the standards are so demanding that most branches possess no one capable of satisfying them, the system can demonstrate only which work no one is able to perform. Even branches with compact and highly competent administrative teams cannot compensate for vacancies throughout the network. Interregional cooperation depends not upon what its best-staffed branch can accomplish, but upon the capacity of its weakest link.\n\nThe central office has three possible solutions. We can temporarily disregard the CGT's organizational boundaries and recruit accountants, engineers, and administrative employees from society at large, filling the vacancies as quickly as possible. Alternatively, the more abundant personnel of large-city and major industrial branches can be transferred to understaffed regions, allowing professional officials to circulate among different branches. If we are unwilling to expand external recruitment or compel branches to surrender people they trained themselves, the existing staff must temporarily hold several positions simultaneously while we await the next round of local training.\n\nThe number of vacant positions continues to increase, while the accumulated documents will not wait for us to train additional personnel. The professional civil-service system has defined the kind of people qualified to administer the CGT. We must now answer a more practical question:\n\nWhere are they?"
  fcf_economy_event.95.a:0 "Recruit directly from society at large."
  fcf_economy_event.95.b:0 "The well-staffed branches must share personnel with those in need."
  fcf_economy_event.95.c:0 "Let the existing officials hold several positions for the time being."

  fcf_economy_event.96.title:0 "Refusing to Become a Cog"
  fcf_economy_event.96.desc:0 "After the first transferred personnel arrived at understaffed branches, accumulated work was rapidly processed. The accountants, statisticians, and production coordinators dispatched from larger branches understood the CGT's procedures and knew how to incorporate local accounts into the interregional cooperation network. Transfers previously requiring several rounds of correspondence could now be confirmed through a single properly formatted report. Raw materials accumulated in warehouses began moving again, while stalled production plans resumed.\n\nJudging from the figures compiled by the central office, the reform has unquestionably succeeded. The CGT's total output is rising, waste of raw materials and duplicate stockpiles have declined significantly, and the value produced by each worker exceeds its pre-reform level. Those who feared that understaffed branches would hold back the entire network can now point to one rising report after another as proof that professional administration and interregional transfers have genuinely increased efficiency.\n\nThe reports do not record how the workers regard these changes.\n\nExternal administrators generally remain in one locality for only several months before being transferred to the next understaffed branch. They are unfamiliar with the lives of local workers and possess little patience for disputes unrelated to production. To them, keeping an additional stock of coal in a warehouse means unnecessary duplication; preserving an obsolete workshop by reducing output means wasting equipment; and prioritizing deliveries to nearby factories represents a violation of the CGT's allocation plan. So long as the general accounts balance, where goods are sent and which factory consequently ceases operating appear to be no more than figures moving between columns.\n\nThe first open dispute erupted in one branch where local workers wanted to use accumulated materials to repair a boiler. The external administrator believed that a production line in another region required them more urgently and approved the transfer without consulting the membership congress. His decision spared the CGT a loss of output, but forced local workers to continue labouring beside leaking pipes. When questioned, the administrator produced a report demonstrating that the benefit to the entire industry greatly exceeded the loss borne by the locality.\n\nNo one could identify an error in his calculations. That was precisely why the answer appeared so cold.\n\nSimilar grievances soon appeared in other branches. Workers complain that external administrators are more inclined to transfer equipment and materials to regions favoured by the central organization. Some suspect that particular officials always prioritize the branches in which they formerly served. Even when allocations are based entirely upon efficiency, the local membership feels it is being treated as a collection of components that can be removed and replaced within a larger machine. The value they create is incorporated into the CGT's rising totals, but repairs, assistance, and working conditions in their own lives have not improved with equal speed.\n\nNot every protester opposes interregional cooperation. They acknowledge that resources cannot remain forever where they were produced and understand that some sacrifices genuinely help the CGT function more effectively as a whole. They demand only that administrators treat the lives of local workers as one of the purposes of their decisions rather than merely another cost to be calculated while maximizing output.\n\nWe can prioritize people familiar with local language, customs, and industrial relations when assigning administrators, ensuring that branches are no longer governed entirely by strangers. We may instead invest additional resources in training local personnel so that external officials genuinely become a temporary measure. Yet if every allocation must accommodate regional identity and every branch insists that local requirements come first, the newly established system of cooperation may once again be torn apart by local protectionism.\n\nThe figures tell us that reform has succeeded; the workers say they have gained nothing from its success. When everything can be counted and compared, the things that cannot enter a report become their final proof that they are not merely cogs."
  fcf_economy_event.96.a:0 "Regional identity should be considered when assigning personnel."
  fcf_economy_event.96.b:0 "We should begin training local administrators."
  fcf_economy_event.96.c:0 "What do they want—local protectionism?"

  fcf_economy_event.97.title:0 "Death from Overwork"
  fcf_economy_event.97.desc:0 "The morning duty officer discovered him inside one of the CGT's regional coordination offices. When the others departed the previous evening, the employee responsible for allocating supplies remained at his desk checking freight documents. When the door opened the following morning, they found only a lamp still burning, papers scattered across the floor, and a cup of coffee that had long since gone cold. By the time a doctor arrived, nothing could be done except send the body for examination.\n\nThe precise cause of death has not yet been announced. Whether he suffered from an earlier illness and whether exhaustion directly caused his death must await the doctor's judgment. Once the news spread, however, almost no one was willing to regard it as an accident unrelated to his employment. The deceased had simultaneously reviewed the accounts of three branches and travelled by train every week to resolve allocation disputes in a neighbouring region. During the final ten days of his life, he rested for only one afternoon.\n\nThe phrase ‘death from overwork’ soon appeared in trade-union newspaper headlines. The first accusations came not from the CGT's enemies, but from employees who had worked beside him. They published the office duty schedules. Some personnel had worked late into the night for several consecutive weeks; some maintained several entirely different sets of accounts simultaneously; others attended branch meetings during the day and spent their nights reviewing accumulated documents from another region. What was described as a temporary combination of duties had long since become an ordinary arrangement with no end in sight.\n\nWe can hardly avoid responsibility. The decision to make professional officials hold several positions simultaneously was intended to overcome the shortage of personnel. As soon as the next group of trainees passed the qualification review, the existing employees would gradually resume normal work. Training took longer than expected, however, while the documents arriving from understaffed branches never decreased. To prevent the allocation network from stalling again, the central office continually assigned new responsibilities to those who had already demonstrated their competence.\n\nThey rarely refused openly. The professional system transformed ability into an obligation: the more familiar someone was with the work, the more positions he was required to assume; the more rapidly he processed accumulated matters, the sooner another pile of documents appeared upon his desk. Some employees feared that refusing a task would be interpreted as unwillingness to assist struggling branches. Others believed that they needed to endure for only several more weeks. Everyone understood that this was a temporary expedient, but no one could say when the ‘temporary’ period would end.\n\nPublic opinion demands immediate action by the CGT. Additional dedicated funding could increase allowances, improve office conditions, and provide medical protection for extended travel and night work, ensuring that employees are no longer expected to bear additional burdens through responsibility alone. We could also allow trainee officials who have not yet passed the full qualification review to organize documents, perform preliminary checks of accounts, and transmit correspondence, freeing professional personnel from large quantities of basic work. This would, however, open a gap in the standards we have only recently established.\n\nThe most direct solution would establish maximum workloads and immediately end combinations of duties beyond what one person can bear. This would finally allow many employees to rest, at the cost of accumulated documents for which no one is available. Some allocations would be delayed, while branches lacking administrators might have to withdraw temporarily from certain forms of interregional cooperation. We can reduce the burden upon each person, but cannot increase the number of qualified personnel by decree.\n\nThe examination report has not yet arrived, but workers and employees have already covered the entrance to the office with flowers. Even if the doctor does not record ‘exhaustion’ upon the death certificate, the duty schedules, unused leave, and several positions entrusted to one person will not disappear. We must answer not merely why this employee died, but how many others we expect to endure in the same manner until the reform is complete."
  fcf_economy_event.97.a:0 "Provide the officials with additional financial support."
  fcf_economy_event.97.b:0 "Trainee officials should assist with the work."
  fcf_economy_event.97.c:0 "Reduce the officials' workloads."

  fcf_economy_event.98.title:0 "Mortise and Tenon"
  fcf_economy_event.98.desc:0 "When the local branches submitted their lists of professional officials, the central office had prepared itself for numerous vacancies. The new qualification standards were considerably stricter than their predecessors, and people capable of reconciling complicated accounts, arranging interregional allocations, and understanding the production processes of their own industries were hardly abundant anywhere. Yet when the lists were compiled, the expected shortage of personnel did not appear.\n\nThe funding previously provided to local branches has finally demonstrated its value. Some branches established regular administrative courses and employed retired personnel to teach accounting and statistics. Others sent young workers to train at large factories in neighbouring areas before allowing the local membership to elect them to administrative office. Regions with limited funding could purchase teaching materials, organize their old archives, and compensate workers for time lost while undergoing instruction. Training once sustained only by individual enthusiasm has gradually become an enduring institution.\n\nProfessionalization has therefore not forced the regions to select their personnel once again from a small group of former administrators. Many ordinary workers already acquired basic knowledge through training and require only a further review before formally assuming office. Veteran personnel retain an advantage in experience, but no longer monopolize methods once circulated only inside the offices. Members can choose among several candidates who genuinely understand administrative work instead of accepting an unsatisfactory choice between ‘bureaucrats who do not understand production’ and ‘workers who do not understand administration.’\n\nAn interregional equipment transfer demonstrated the value of this system. A metallurgical branch urgently needed to replace components in a rolling mill. Its local administrators confirmed the specifications, available stock, and transport requirements on the same day. The mechanical-engineering branch manufacturing the components reviewed the request using a standardized format, while the transport branch adjusted its services according to the production schedules of both regions. No document was returned at any stage, and the goods and installation personnel arrived on the same day. The period of interrupted production was ultimately half the original estimate.\n\nNo emergency order from the central office was required. Every branch remained under people familiar with its local factories and retained its own elections and supervisory procedures. When work crossed the boundaries between branches, however, their administrators could understand one another's records, observe common agreements, and accurately judge how their decisions would affect the next link in the chain. Each component possesses a different shape, yet fits perfectly at the joint—like a series of interlocking mortise-and-tenon pieces.\n\nThe change is also reflected in the workers' lives. With smoother allocations, factories no longer repeatedly suspend production because raw materials arrive late, while mutual-aid payments are seldom delayed by unclear accounts. Money saved by local branches has been used to repair equipment, improve canteens, and supplement collective benefits. The efficiency created by professional officials is no longer merely a set of rising figures in consolidated reports, but an improvement workers can experience directly in their workshops and homes.\n\nThe distance between administrators and ordinary members must naturally remain under scrutiny. Specialist knowledge may again become a barrier protecting officeholders, while smoothly functioning procedures may cause people to forget to question whether the decisions themselves are reasonable. For now, however, professionalization has not restored the former bureaucracy's monopoly over affairs. Trained administrators remain elected by the membership, their accounts remain subject to branch supervision, and the ability they possess is necessary to fulfil a public responsibility rather than a privilege placing them above the workers.\n\nWe once feared that raising the standards for office would leave local branches without qualified personnel. Experience has shown that the decisive question was not the standards themselves, but whether ordinary workers possessed the opportunity to meet them. The funds previously invested did not select administrators for the branches, but enabled them to train administrators of their own. Professionalization has not weakened branch autonomy, but allowed autonomy to operate without the price of disorder and inefficiency.\n\nThe machinery is operating, the goods are moving, and for the first time the accounts and plans of every region fit together with such ease. Every branch remains an independent piece of timber, but each now knows how to join with the others."
  fcf_economy_event.98.a:0 "Now that is efficiency."

  fcf_economy_event.99.title:0 "The Power to Define"
  fcf_economy_event.99.desc:0 "Unifying administrative standards among the local branches was originally regarded as a purely technical undertaking. Once the regional regulations were assembled in Paris, however, the reform commission discovered that far more than forms and archives required standardization. The same raw material might be assigned to different grades, the same occupation subjected to entirely different qualification requirements, and even equipment depreciation and labour allowances calculated according to incompatible methods.\n\nNot every difference resulted from disorder. Industrial structures, equipment, and production practices genuinely differed by region, while many regulations had developed gradually through the branches' long experience. Yet as interregional procurement, material allocation, and industrial cooperation become increasingly common, one branch no longer produces records solely for its own use. If product grades, technical qualifications, and accounting formats continue to differ everywhere, every joint undertaking will require the most basic concepts to be explained anew.\n\nUnification is therefore unavoidable. The question is who will determine its contents. Once standards define which products are acceptable, which forms of labour qualify for compensation, and which people may enter the administration, they cease to be mere conveniences and begin directly affecting resource allocation and local institutions. Whoever possesses the power of definition can alter the practical interests of the branches in the name of technical standards.\n\nSupporters of the central organization argue that common standards can genuinely apply throughout the country only if the CGT leadership possesses the final authority. Otherwise, every locality will invoke its exceptional circumstances to reject reform, reducing supposed unification to an empty phrase once again.\n\nThe local branches maintain that the central organization should establish minimum requirements only, while specific methods of calculation, supplementary grades, and local allowances remain subject to regional adjustment. A system designed for major industrial regions cannot be imposed unchanged upon every locality.\n\nOthers propose that since the standards bind every branch, they should be negotiated and adopted jointly by the central organization, localities, and industries concerned. Such a procedure would be slower and might transform every technical question into a political dispute, but would at least prevent unification from being regarded as coercion by one side against another.\n\nEveryone agrees that the old differences are obstructing continued cooperation within the CGT. We need only decide whose language will become the language of everyone once the common standards are finally written upon paper."
  fcf_economy_event.99.a:0 "Standards should be established uniformly by the central organization."
  fcf_economy_event.99.b:0 "Central standards are only a minimum. Branches may adjust them independently."
  fcf_economy_event.99.c:0 "Definitions must be negotiated and adopted democratically."

  fcf_economy_event.100.title:0 "By What Right?"
  fcf_economy_event.100.desc:0 "After the unified standards were published, the central organization quickly received protests from branches throughout the country. The opponents do not deny that common standards facilitate interregional cooperation. They ask instead: by what right does the central organization require every branch to abandon systems it has used for years?\n\nThe strongest discontent comes precisely from branches that already operate successfully. They use local dues and industrial income to maintain their training, mutual-aid, and administrative systems and rarely request assistance from the central organization. From their perspective, they bore the cost of their own development but must now obey regulations designed primarily to reorganize less advanced regions. Products previously judged acceptable may be downgraded, local allowances cease to receive recognition, and elected administrators lose office because of the new qualification requirements.\n\nThe radical branches have carried the dispute towards a more fundamental question. The CGT is a community created by the voluntary association of local workers' organizations. The authority of the central organization derives from the branches, not the reverse. By deciding without local consent which systems qualify as ‘proper,’ the central organization is transforming a coordinating institution into an administrator placed above its branches.\n\nSome protesters have begun discussing withdrawal. Supporters of unification fear that retreat now will allow local resistance to obstruct every future common reform. Yet if the central organization refuses every compromise, the CGT may again face division over its pursuit of common standards.\n\nSome advocate granting the regions additional financial autonomy, allowing branches at least to determine how their own money is used and thereby compensating them for concessions over administrative standards. Others believe that localities should be permitted to adjust particular standards so long as they do not violate the fundamental rules. The most determined centralists are not prepared to retain every opponent: joining the CGT is voluntary, and therefore so is leaving it.\n\nUnification will genuinely improve the operation of the CGT as a whole, but those being required to change are still waiting for an answer:\n\nBy what right?"
  fcf_economy_event.100.a:0 "Win them back with greater financial autonomy."
  fcf_economy_event.100.b:0 "Local branches may adjust the standards to a limited extent."
  fcf_economy_event.100.c:0 "Trade unions are naturally free to join or leave."

  fcf_economy_event.101.title:0 "Branches Withdraw"
  fcf_economy_event.101.desc:0 "During the third week after implementation of the unified standards, several of the most vehemently opposed local branches formally announced their withdrawal from the CGT. They refuse to accept the administrative regulations established by the central organization and declare that only by leaving this increasingly centralized system can they preserve the autonomous institutions built by the workers themselves.\n\nInitially, some feared that these declarations would provoke a new wave of divisions. The anticipated exodus did not occur. Although many additional branches resented the central organization, they could no longer leave the CGT easily. Their procurement of raw materials, exchange of products, technical information, and mutual-aid funds all depended upon interregional connections. Withdrawal would also sever relationships built over many years through the organization as a whole.\n\nThe first branches to withdraw soon experienced the cost. Scheduled material deliveries were suspended, while other regions refused to continue exchanging products with them under internal terms. The forms, standards, and review procedures previously denounced as central interference became barriers preventing them from accessing the cooperative network. Departure from the CGT did not make local production freer, but forced the branches to bear independently costs previously shared across the entire system.\n\nThe CGT suffered some losses from their departure, but its overall operation was not shaken. The reduction in verification and coordination costs produced by unified standards soon exceeded the gaps created by the withdrawals. Once the remaining branches witnessed the result, they gradually abandoned their threats to leave.\n\nThey possessed the right to depart and genuine reasons for opposing the central organization's seizure of local powers of definition. Yet although an organization can leave the CGT, it cannot take the entire network upon which it has long depended along with it."
  fcf_economy_event.101.a:0 "We understand their position."

  fcf_economy_event.102.title:0 "Forging Ahead"
  fcf_economy_event.102.desc:0 "The first reports following the introduction of material incentives have reached the central organization. Almost every pilot branch has increased output, while losses of raw materials and equipment failures have declined. Workers can now be found more rapidly for night shifts, emergency allocations, and technical improvements that no one previously wished to undertake. Administrators have also begun clearing accumulated files proactively to obtain the additional rewards offered for completing coordination plans.\n\nThe most evident changes are not confined to the reports. New production processes proposed by workers are no longer dismissed as part of their ordinary duties. Once an idea is proven to save raw materials or increase output, its author receives public recognition and material compensation. People who have long performed complicated work while receiving the same treatment as everyone else feel for the first time that their additional efforts have been acknowledged.\n\nCriticism has not disappeared. Some fear that the revolution was intended to place production at the service of common needs, but workers and administrators are now calculating the personal benefit they can derive from every task. If individual compensation becomes the sole motivation, the spirit of the common good may gradually fade among columns of bonus payments.\n\nSupporters ask in response whether rewarding people who create greater value for the community truly constitutes a betrayal of the common good. Material incentives have not transferred factory profits into private hands or allowed administrators to acquire privileges through their positions. Additional compensation comes from higher output, reduced waste, and smoother cooperation. Every personal reward rests upon a genuine increase in what the collective as a whole has obtained.\n\nFor the present, workers' incomes are rising and production plans are being exceeded. Machinery operates day and night, trains travel across the country fully laden, and figures previously trapped in stagnation continue to climb. Whatever the critics may fear, the reform has already demonstrated its effectiveness in the most direct manner."
  fcf_economy_event.102.a:0 "This is recognition of hard work."
  fcf_economy_event.102.b:0 "We need still more material incentives."

  fcf_economy_event.103.title:0 "Falsification Runs Rampant"
  fcf_economy_event.103.desc:0 "The production miracle created by material incentives lasted only a few months. When the opposition investigated several of the best-performing branches, it discovered that the growth recorded in their reports did not come entirely from actual production: unfinished goods had been counted toward output ahead of schedule, reworked products had been registered repeatedly as new achievements, while equipment wear and defective goods were deliberately omitted. As long as the final figures looked impressive enough, managers and workers alike could earn additional rewards.\n\nSimilar problems were soon uncovered elsewhere. Some branches separately claimed credit for technical improvements that should have been shared among several factories, while others sent substandard products into storage and quietly reworked them once the inspection was over. Even the audit teams responsible for verifying the figures could not entirely prevent fraud: their members were local workers too, and were reluctant to deprive an entire branch of its rewards over a few suspicious entries.\n\nThis does not mean that all the previous growth was fictitious. Material incentives really did raise enthusiasm and ensured that many long-neglected contributions were finally rewarded. Yet the more generous the rewards became, the greater the benefit of manipulating the figures. When income, honors, and resource allocations all depend on reports, people will strive not only to improve production, but also to make the reports look better.\n\nThe most direct solution would be to reduce the material rewards, which have clearly become excessive, so that fraud is no longer worth the risk. We could also retain the existing system while requiring the industrial federations to conduct more spot checks and cross-verification, though stricter scrutiny would inevitably create a great deal of paperwork and might force ordinary production into an endless cycle of proving its own legitimacy.\n\nOthers advocate establishing a specialized anti-corruption department capable of bypassing local networks to investigate false reporting and collusion. This may offer the best chance of thoroughly addressing the problem, but it would also create a new institution within the CGT permanently tasked with monitoring its branches. If it lacks sufficient authority, it will merely add another layer of bureaucracy; if its powers are strong enough, it may become an inspector feared by everyone.\n\nThe figures once proved that the reforms had succeeded. Now those same figures have made it impossible to know how much of that success was ever real."
  fcf_economy_event.103.a:0 "Material incentives have indeed gone too far."
  fcf_economy_event.103.b:0 "We need a stricter auditing system."
  fcf_economy_event.103.c:0 "Establish a dedicated anti-corruption department."

  fcf_economy_event.104.title:0 "Another Record High"
  fcf_economy_event.104.desc:0 "The second round of statistics following the introduction of material incentives has once again surpassed even the most optimistic expectations. Output continues to grow, raw-material waste and equipment downtime have fallen still further, and workers' real incomes have risen accordingly. Many technical improvements that had previously advanced at a sluggish pace have now spread among several branches.\n\nThe critics remain unconvinced. They argue that linking income to reported results will inevitably encourage falsification, and that the present prosperity may merely mean that the problems have not yet come to light. In response, several industrial unions organized cross-inspections, examining warehouses, accounts, and production records while rechecking rewards that had already been distributed.\n\nThe inspections did uncover some false reporting: certain workers had exaggerated raw-material savings, while some branches registered unfinished goods ahead of schedule. Yet such practices had existed before the reforms and were hardly uncommon among branches that had not adopted material incentives. The available evidence is insufficient to prove that the incentive system has expanded the scope of corruption.\n\nIts benefits, by contrast, are unmistakable. Vacancies in understaffed positions are easier to fill, technical personnel are voluntarily improving production processes, and interregional transfers are faster than before. Workers outside the CGT system have begun to envy the wages, allowances, and rewards enjoyed by its members, while some factories previously indifferent to joining the CGT have approached it of their own accord to inquire about the terms.\n\nNo system can eliminate deception and self-interest altogether. The real question is whether these problems outweigh the achievements produced by the reforms. For the moment, at least, the answer is no.\n\nThe latest figures have arrived, and this time they withstand scrutiny."
  fcf_economy_event.104.a:0 "This truly is our achievement."

  fcf_economy_event.105.title:0 "New Friends"
  fcf_economy_event.105.desc:0 "The meeting between Jouhaux and Déat was arranged in an office far from CGT headquarters. Neither side made the talks public, but their purpose was clear: the CGT moderates needed a political ally capable of counterbalancing the radicals, while the Parti socialiste français was seeking a new avenue into the federal economy.\n\nJouhaux described the radicals as the CGT's internal 'federalists.' In his view, they regarded branch autonomy as an inviolable principle, opposed uniform management standards and the expansion of professional personnel, and refused to grant the central organization greater authority over resource allocation. As long as they could continue using membership assemblies and local branches to obstruct reform, the CGT could never become a genuinely unified national organization.\n\nDéat was familiar with such problems. The PSF likewise resented local institutions that refused to implement central decisions in the name of autonomy, and welcomed the prospect of the CGT shedding its old character as a loose alliance. If the industrial federations could be made to follow a unified plan and the local branches accept a clear administrative hierarchy, the CGT's vast production and distribution network could become the core of the entire federal economy.\n\nSimilar objectives, however, were not enough to produce immediate cooperation. Déat was uncertain whether Jouhaux truly possessed the ability to reshape the CGT, and he was unwilling to bear the cost of an open rupture with the radicals merely to consolidate the moderates' position. Some within the PSF also believed that the CGT would ultimately remain an independent organization too difficult to control; rather than helping Jouhaux construct a stronger center, they preferred to expand the Committee of Public Safety's direct control over economic affairs.\n\nThe price for Jouhaux would be no less considerable. The Parti ouvrier uni had long cooperated with the CGT, yet there was almost no room for reconciliation between it and the PSF. If the moderates accepted Déat's support, the POU would inevitably suspect that the CGT was abandoning its former ally and becoming an instrument for the PSF's transformation of the Federation. The CGT radicals would likewise regard the meeting as a declaration of war, leaving little room for internal compromise.\n\nJouhaux therefore had to offer terms capable of winning Déat over. Perhaps their shared campaign against the federalists would itself constitute a sufficient reward; perhaps they should support an expansion of the Committee of Public Safety's authority, allowing the PSF to participate in economic management through the state apparatus; or perhaps the CGT should adopt Taylorism more extensively, demonstrating through clearer divisions of labor, performance assessments, and chains of command that it was truly prepared to leave its old, decentralized management behind.\n\nA new friend was already seated across the table. It was now Jouhaux's turn to explain what this friendship could offer him."
  fcf_economy_event.105.a:0 "Cooperation is its own reward."
  fcf_economy_event.105.b:0 "The Committee of Public Safety's authority should be expanded."
  fcf_economy_event.105.c:0 "Our management system should be reformed along Taylorist lines."

  fcf_economy_event.106.title:0 "A New Chapter for Socialism"
  fcf_economy_event.106.desc:0 "Déat ultimately accepted Jouhaux's proposal. A few days later, representatives of both men returned to the negotiating table and reached a preliminary agreement to jointly support reform of the CGT. The PSF would publicly endorse the moderates' efforts to strengthen central coordination and unify management practices, while Jouhaux promised that the CGT would no longer invoke branch autonomy as a reason to resist economic integration at the federal level.\n\nTheir shared hostility toward the 'federalists' was not the only force behind this partnership. The successive reforms of the past few months had shown that Jouhaux was at least capable of turning his proposals into reality. Professional personnel were entering institutions at every level, branches across the country were beginning to adopt common standards, and the central organization was gradually acquiring the means to allocate resources and oversee administration. The CGT was still far from being a machine obedient to a single will, but neither was it any longer the loose alliance that could function only through improvised negotiations.\n\nThis was precisely the assurance Déat required. He had no intention of winning an internal struggle on behalf of a weak faction, nor would he stake the PSF's reputation on empty slogans about centralization. Jouhaux now possessed an organizational foundation strong enough to restrain the local branches; with additional political support from outside, the moderates might decisively defeat the radicals and transform the CGT into a stable and effective pillar of the federal economy.\n\nAfter the agreement was announced, both sides portrayed their rapprochement as a reunification of socialist forces. Moderate newspapers declared that trade-union organization and political power could finally cast aside their old suspicions and cooperate in economic development, while the PSF presented it as proof that professional management and unified purpose had triumphed over localism.\n\nNot everyone, however, was willing to turn the page on this 'new chapter.' The CGT radicals were already preparing their response, and the Parti ouvrier uni would not stand idle while its long-standing partner moved toward Déat. To them, this was no reunification of socialist forces, but an attempt by Jouhaux to use the PSF's power to alter the very nature of the CGT.\n\nFor the moment, these disputes could not prevent the agreement from taking effect. Jouhaux had gained an ally capable of breaking the internal balance of power, while Déat had found his first reliable partner within the CGT's immense organizational network. Two forces that had once operated independently had now chosen to advance in the same direction."
  fcf_economy_event.106.a:0 "The future is coming."

  fcf_economy_event.107.title:0 "A Lack of Conviction"
  fcf_economy_event.107.desc:0 "Déat ultimately rejected Jouhaux's proposal. He acknowledged that they held broadly similar views of the CGT's internal 'federalists' and agreed with the aim of standardizing management and strengthening central coordination, but similar positions were not enough to establish a partnership. What the PSF needed was not a friend willing to discuss centralization, but an ally genuinely capable of achieving it.\n\nIn his subsequent reply, Déat listed his concerns without restraint. Although the CGT's central organization had expanded its professional staff and begun attempting to standardize administration across the country, it still could not guarantee that local branches would obey its decisions. Many reforms had been altered beyond recognition through repeated debate in membership assemblies; some branches accepted only the provisions that benefited them, while others returned to their old practices as soon as the central officials departed. Jouhaux could issue directives, but he could not necessarily ensure their implementation.\n\nThis led Déat to suspect that their supposed joint struggle against the 'federalists' would ultimately amount to the PSF resolving the moderates' internal difficulties for them. Jouhaux hoped to use external political support to overcome the radicals, yet had not demonstrated that he could restrain the branches after victory. If the PSF publicly endorsed him now, it would bear the entire cost of disrupting internal unity within the CGT and provoking the Parti ouvrier uni and the trade-union left, without necessarily gaining a CGT genuinely obedient to unified planning.\n\nWhat disappointed Déat even more was Jouhaux's continued insistence on treating many fundamental questions as differences that could be reconciled. He wanted to weaken local autonomy without entirely denying the branches' right to decide their own affairs; he wanted professional managers to enjoy secure positions, yet dared not openly restrict the membership assemblies' power to dismiss them. Whenever reform encountered fierce resistance, the moderates returned to talking about unity, tradition, and gradual change. To Déat, this was not prudence, but a lack of conviction—the absence of the passion required to carry one's will through to the end.\n\nThe PSF representatives consequently terminated further discussions. They did not publicly attack Jouhaux or rule out future cooperation, but stated that the CGT first had to prove that it could become a unified organization. Once the center truly controlled the branches, its orders no longer required individual bargaining, and the moderates ceased retreating at the first flurry of protest letters, there might be reason for the two sides to meet again.\n\nJouhaux had hoped to gain a new friend by appealing to their shared objectives. Instead, he received a verdict on his own weakness. Déat did not oppose what he intended to do; he simply did not believe Jouhaux possessed the resolve to see it through."
  fcf_economy_event.107.a:0 "How disappointing."

  fcf_economy_event.108.title:0 "Interim Results of the Reforms"
  fcf_economy_event.108.desc:0 "The CGT Reform Commission has finally completed its first interim report. For months, debate over organizational structure and management practices has scarcely ceased, while each approved reform has gradually been implemented across different regions. These measures may not have resolved every problem originally identified, but they have already changed the CGT in clearly visible ways.\n\nSupporters of the reforms can find much to celebrate in the report. Some long-neglected matters have finally been addressed, and several old precedents that no one had previously dared challenge have been overturned. Problems once regarded as inherent flaws of the CGT are at least no longer taboo subjects that can only be grumbled about in private and never discussed openly.\n\nYet the report also concedes that temporary resolutions can alter individual institutions without redefining how the entire organization operates. Whenever a reform touches upon the relationship between the branches, industrial organizations, and central bodies, each side must reopen the debate over its rights and obligations. The same decision may receive entirely different interpretations in different places, leaving the Reform Commission able only to negotiate each dispute individually rather than appeal to a universally recognized set of rules.\n\nThe experience of recent months has shown that continuing to advance reform through isolated resolutions will merely pile new institutions atop old practices. The further the reforms progress, the more matters will require improvised interpretation; unless these achievements are consolidated in time, approved measures may conflict with one another or be easily overturned during the next internal dispute.\n\nThe Reform Commission has therefore recommended ending the present stage of piecemeal experimentation, consolidating the decisions already made, and using them as the basis for drafting a new CGT Act. How much authority the act will ultimately grant the center, how much autonomy it will preserve for the branches, and how it will regulate management, oversight, and organizational discipline must still be determined during formal deliberations. The interim report can provide experience, but it cannot write the answers to the coming political struggle in advance.\n\nThe original reforms were intended merely to address a handful of urgent problems. Now those problems have brought the CGT to the threshold of comprehensive reorganization. The choices made over the past few months will not simply disappear; they will determine the starting point of this act and what kind of organization the new CGT will ultimately become."
  fcf_economy_event.108.a:0 "The CGT will be transformed."
  CGT_stage_reform_results:0 "The reform of the CGT has achieved interim results."

