# Conscription Laws
  law_dual_track_conscription:0 "Dual-Track Compulsory Service"
  law_dual_track_conscription_desc:0 "Every citizen who has reached the statutory age and is fit for service is liable for military duty and must select a category of service upon enlistment. The first is regular service in the Federal Army, involving complete military training and liability under federal orders for combat, garrison, and other military duties throughout the Federation and overseas. The second is local territorial service, in which recruits are assigned to defence forces within their commune of residence or its associated communal federation, receive training primarily for local defence, and undertake security patrols, the protection of strategic sites, mobilization preparations, and wartime support. As a rule, members of the local territorial forces serve only within their own communal federation. Without their written consent, they may neither be transferred to another communal federation or overseas nor reassigned to regular service in the Federal Army."

  law_federal_conscription:0 "Federal Compulsory Service"
  law_federal_conscription_desc:0 "Every young person who has reached the statutory age and is fit for service must complete a fixed term of regular service in the Federal Army, receive standardized military training, and remain subject to federal deployment. Upon completing regular service, personnel enter the local reserve in their place of residence. They periodically attend refresher training and mobilization exercises, undertake preparations for local defence in peacetime, and return to active service upon orders in wartime until reaching the statutory retirement age."

  law_production_conscription:0 "National-Defence Production Service"
  law_production_conscription_desc:0 "Workers of military age employed in defence industries and other strategically important sectors may be conscripted for national-defence production service. Those enlisted retain their existing production posts and are organized by factory and industry into national-defence production corps. While carrying out armaments production and maintenance, they receive basic military training and are incorporated into the Federal Army's mobilization system. In wartime, entire national-defence production formations may be assigned to factory security, engineering, ordnance, and logistical-support duties according to military requirements."

# Military Events
  fcf_military_event.1.title:0 "A Sudden Thought"
  fcf_military_event.1.desc:0 "Since the military publicly encouraged soldiers to report beatings, extortion, and humiliation inside the barracks, units throughout the country have received a succession of testimonies. Several bolder soldiers have nevertheless reminded us that those willing to come forward may represent only a small minority. Many victims do not refuse to reveal the truth, but fear that once the present campaign ends, they will still have to return to their old companies and face the veterans, NCOs, or even immediate superiors whom they denounced. Orders can prohibit bullying, but cannot guarantee that retaliation will not disguise itself as additional duties, disciplinary punishment, or ostracism by one's comrades.\n\nThis is plainly not a problem that can be resolved through a single concentrated campaign. So long as appeals must pass through the existing chain of command, soldiers will find it difficult to believe that their testimony will be handled impartially. Some have therefore proposed establishing a permanent and independent appeals system, allowing soldiers to submit sealed complaints without passing through their immediate superiors, while inviting representatives of the communes, trade unions, veterans' organizations, and legal professions to supervise investigations. The military may resent outsiders interfering in its internal affairs, but if every case continues to be investigated by the army itself, even the strictest prohibition may become a dead letter once public attention subsides."
  fcf_military_event.1.a:0 "Add this reform to the agenda."

  fcf_military_event.2.title:0 "The Limits of Training"
  fcf_military_event.2.desc:0 "The soldiers' right of appeal was originally established to end the humiliation, bullying, and arbitrary punishment that had long persisted inside the barracks, ensuring that no citizen serving the Federation would be required to endure injustice in the name of discipline. The reform, however, rapidly provoked widespread concern among the NCOs. Many of those responsible for daily training point out that military exercises necessarily involve exhaustion, pressure, and danger. If soldiers can easily appeal on the grounds of ‘excessive training,’ then every rigorous order may be called into question, while a minority may even use the right of appeal to avoid exercises and evade responsibility. In time, NCOs may become afraid to demand high standards from their subordinates, weakening both the quality of training and military discipline.\n\nThese concerns are not entirely unfounded, but the essential question is not whether soldiers should possess the right of appeal. It is how necessary training and reasonable punishment are to be distinguished from violations of a soldier's dignity and physical safety. Some advocate creating coordination committees in every unit, composed jointly of soldiers' representatives, NCOs, and officers. These would define acceptable training intensity, disciplinary methods, and appeals procedures, allowing soldiers to supervise whether orders have crossed the line while protecting NCOs from groundless accusations for the proper performance of their duties. Others maintain that an army cannot turn every order into a matter for repeated negotiation. Rather than creating another coordinating institution, they would directly limit the scope of appeals and punish malicious complaints or attempts to escape training. Soldiers' rights must be protected, but an army cannot lose its ability to endure arduous training."
  fcf_military_event.2.a:0 "Establish coordination committees."
  fcf_military_event.2.b:0 "The right of appeal must not be abused."

  fcf_military_event.3.title:0 "Veteran Bullies"
  fcf_military_event.3.desc:0 "The rough treatment of soldiers by NCOs at least leaves a trail. Who issued an order and who authorized a punishment can ordinarily be discovered in the duty records. Bullying among the soldiers themselves is far more difficult to observe. Certain veterans use their seniority, personal connections, and familiarity with barracks life to force chores and night duties upon recruits, extort cigarettes and drinking money, and disguise humiliation and beatings as ‘company tradition.’ Victims are generally isolated and defenceless, while bystanders are seldom willing to testify on behalf of a stranger who has only just entered the barracks.\n\nThe concept of soldiers' committees has consequently returned to our attention. Most units possess such committees in name, but many have long since become empty shells that meet only occasionally and merely transmit decisions from above. Granting them the authority to inspect duty rosters, hear testimony from soldiers, and demand investigations might ensure that recruits no longer have to confront these ‘highly respected’ veterans alone. Yet the committees themselves may also fall under the control of longer-serving soldiers, clothing the barracks' informal hierarchy in the appearance of democracy.\n\nAnother solution would separate recruits from the environment in which bullying first takes root. Recruits would complete their initial adaptation and basic training in independent formations, joining the veterans only after they had become familiar with military regulations, learned how to submit appeals, and established relationships among their own comrades. This would protect recruits, but some fear that it would delay their integration with experienced soldiers and make it more difficult for them to learn from the veterans.\n\nOther officers insist that maintaining order in the barracks is already the responsibility of the NCOs. If they are explicitly required to stop bullying and held accountable for tolerating it, there is no need to establish additional institutions. Opponents warn, however, that junior NCOs are already responsible for training, internal administration, and discipline. If every undiscovered case of bullying threatens them with punishment, they may not become more diligent in resolving the problem, but merely more diligent in concealing it—or impose equally severe restrictions upon recruits and veterans alike to protect themselves from responsibility."
  fcf_military_event.3.a:0 "Grant the soldiers' committees supervisory authority."
  fcf_military_event.3.b:0 "Recruits should be given time to adapt."
  fcf_military_event.3.c:0 "NCOs should bear greater responsibility."

  fcf_military_event.4.title:0 "Recruit Bullies"
  fcf_military_event.4.desc:0 "During the first few weeks after the recruit barracks were established, everything appeared to be improving. Veterans no longer pulled newly enlisted youths from their beds in the middle of the night to give them ‘additional instruction.’ Duty rosters were arranged uniformly by the NCOs, and no one was automatically required to polish the entire section's boots merely because he had enlisted six months later than the others. An inspecting officer even reported that recruits were more energetic than before and more willing to remain after training to discuss the exercises.\n\nThe other side of the matter emerged only after one young soldier broke his wrist during obstacle training. He had not fallen because of a mistake, but because the comrade climbing behind him deliberately stepped upon his hand as he crossed a high wall. The attacker had enlisted on the same day, yet was already universally recognized as the ‘model recruit’ of the platoon: he ran fastest, shot most accurately, and shouted his orders loudest. Whenever the NCOs were absent, he generally led the others in cleaning their quarters and conducting additional exercises. Even the order in which they washed after dinner had gradually become his decision.\n\nInvestigators subsequently discovered that he was not the only such ‘recruit leader.’ They possessed no formal rank, but used their physical strength, training results, education, or close relationship with the NCOs to establish their own order among recruits of equal seniority. Slower soldiers were forced to perform their chores; youths from distant regions with conspicuous accents became objects of ridicule; and those unwilling to submit received particularly enthusiastic ‘attention’ during sparring exercises. Everything occurred among soldiers of equal seniority, and many NCOs consequently never regarded it as bullying, but merely as the natural authority acquired by the most capable recruits.\n\nIn the past, these troublemakers had at least feared the true veterans. Now that the recruits have been separated from the old soldiers, they themselves have become the most senior and outspoken group inside the barracks. The absence of veterans does not mean the absence of hierarchy. Once several youths are selected to assist in managing the others, a new order may form even faster than the old. Some advocate regularly rotating these temporary section leaders so that no one has time to transform responsibility into privilege. Others argue that an army must ultimately identify leaders from among its soldiers. The problem is not that these men received authority, but that no one ever taught them how authority ought to be exercised."
  fcf_military_event.4.a:0 "Junior positions should be rotated."
  fcf_military_event.4.b:0 "We should improve the education of junior leaders."

  fcf_military_event.5.title:0 "Overcorrection"
  fcf_military_event.5.desc:0 "When the inspection team arrived at the encampment, it was greeted by almost perfect silence. The beds appeared to have been arranged with rulers, no soldiers could be seen chatting in the corridors, and not a sound followed lights-out. During the past month, the battalion had received no complaints of bullying and recorded no unreported conflicts. Its commander proudly announced that they had demonstrated how barracks customs supposedly rooted beyond correction could disappear within weeks, provided that NCOs genuinely accepted responsibility.\n\nThe inspectors soon discovered, however, that the soldiers here had also almost ceased interacting with one another. Recruits and veterans ate, washed, and rested at different times. Sitting together to talk in the quarters was prohibited, while card games and singing after training had likewise been abolished. Soldiers wishing to help a comrade organize his equipment privately first had to report to the duty NCO. If two men raised their voices even slightly, each would be questioned separately about whether an argument had occurred. One veteran was even warned for ‘unauthorized contact with a recruit’ after voluntarily correcting the way the younger soldier fastened his puttees.\n\nThe NCOs do not believe they have done anything wrong. The previous order made them responsible for bullying under their authority, but no one explained how they could prove that they had done everything possible to prevent it. If a single concealed dispute could destroy their prospects for promotion, the safest course was naturally to eliminate every opportunity for disputes to arise. They no longer need to judge which interactions are normal and which behaviour is dangerous. By prohibiting every form of contact they cannot completely control, they can present spotless records at every inspection.\n\nReported cases of bullying have genuinely declined, but something less visible is growing inside the barracks. Veterans no longer willingly instruct recruits, fearing that a stern criticism might later become evidence against them. Recruits do not know which comrades they can trust, because every relationship has been confined to commands and formations. An army may be able to preserve order through silence, but it can hardly build the trust required upon the battlefield through silence.\n\nThe question ultimately returns to the order itself. Should NCOs be held responsible for every instance of bullying that occurs under their authority, or only for cases they knowingly conceal, deliberately tolerate, or fail to handle properly? Unless we are willing to redraw this boundary, such suffocating ‘model barracks’ may soon appear throughout the army."
  fcf_military_event.5.a:0 "The army is hardly a place for amusement."
  fcf_military_event.5.b:0 "This is itself another form of bullying."
  fcf_military_event.5.c:0 "Judge whether NCOs fulfilled their duty to intervene."

  fcf_military_event.6.title:0 "The Seniority Committee"
  fcf_military_event.6.desc:0 "The complaint did not pass through the company's ordinary channels, but was concealed inside a stack of training reports sent to divisional headquarters. Its authors plainly feared revealing their identities and left only a dozen uneven fingerprints at the end. They claimed to have reported three times to the soldiers' committee that veterans were forcing recruits to assume their duties, extorting cigarettes, and imposing humiliating punishments. The committee rejected them on all three occasions. The first time, it said the evidence was insufficient; the second, that the conduct was merely a joke; and the third, that ‘everyone went through the same thing.’\n\nThe investigators initially expected to discover a straightforward case of negligence, but the committee's records were complete, and every rejection had been adopted by a formal vote. The true problem surrounded the table itself. Six of the seven committee members had already served for more than three years. The remaining member was a recent recruit, but had been nominated jointly by several veterans. Neither officers nor NCOs interfered with the meeting. Almost everyone involved—from those defining the problem to those judging it—simply accepted the same set of barracks customs.\n\nWhen questioned, the committee members appeared genuinely aggrieved. They admitted that veterans required recruits to perform additional chores and that certain ‘supplementary exercises’ never appeared in the official training programme, but insisted that these practices preserved the order necessary for communal life. If a young man could not endure having his bedding thrown upon the floor and being awakened during the night to arrange it again, how could he remain composed under artillery fire? One elderly committee member even removed his tunic and pointed to a scar upon his shoulder left by a belt years earlier. He too had endured such treatment, he said, and had never resented his predecessors for it.\n\nThe recruits told an entirely different story in another room. One had stood night watch for veterans for two consecutive weeks. Another was ostracized by his entire section after refusing to crawl across a floor covered in filthy water. A third had been ordered to hold his rifle aloft until he lost all feeling in his arms. Yet when the investigators attempted to classify each case, the boundary again became indistinct. At what point do strict standards of internal discipline become humiliation? When does additional exercise intended to improve physical fitness become punishment? An army cannot regard every discomfort as an injury, but neither can it call an abuse a tradition merely because it has persisted for years.\n\nThe soldiers' committee was created to allow ordinary soldiers to supervise authority within the barracks. It may now be guarding the entrance to another form of authority. If the veterans' experience is to be respected, the committee's existing judgment should be accepted. If recruits must be assured a voice, its composition must change. If we suspect that every guaranteed seat will merely create another faction, perhaps complaints supported by only a small minority should be permitted to bypass the committee and initiate an external investigation."
  fcf_military_event.6.a:0 "If they cannot endure even this, how can they fight a war?"
  fcf_military_event.6.b:0 "Reserve seats for recruits upon soldiers' committees."
  fcf_military_event.6.c:0 "Lower the threshold required to initiate an investigation."

  fcf_military_event.7.title:0 "The Beloved Abuser"
  fcf_military_event.7.desc:0 "The first report was submitted by three soldiers who had recently completed recruit training. They accused a veteran of whipping slower men with a belt, repeatedly forcing a recruit afraid of heights to climb the roof of a warehouse without protection, and holding another soldier's head beneath the water in a storage tank after he answered back, releasing him only when he ceased struggling. Medical records and further testimony quickly established that these events had genuinely occurred. Under the existing military code, there should have been little uncertainty about the case.\n\nYet when the military police arrived to take the accused away, almost half the company assembled outside the barracks.\n\nThe veteran had fought in several of the bloodiest battles at the end of the civil war. During one retreat, he carried his wounded platoon commander across two kilometres of mud. On another occasion, after a position had been lost, he led seven soldiers in recapturing a machine gun seized by the enemy. He divided his allowance among the families of fallen comrades and had never abandoned his post during enemy bombardment. In the eyes of many soldiers, he was no thug exploiting his seniority to oppress others, but the most trustworthy man in the entire company. A petition soon reached regimental headquarters, signed by veterans and by many recruits whom he had previously helped.\n\nThe accused denied none of the allegations. He denied only that his conduct constituted abuse. He had seen too many untested youths panic during their first bombardment and had personally buried entire sections killed because one man lost his nerve. ‘The water tank will not drown them; enemy gas will. The roof will not kill them; the barbed wire they cannot cross will.’ During questioning, he repeatedly insisted that he had never punished recruits for amusement. Everything he had done was intended to help them survive the next war.\n\nThis defence moved many people, but did not change the victims' memories. The recruit afraid of heights still trembles during climbing exercises, while the soldier held beneath the water refuses to remain in his former company. They do not deny that their persecutor was once a hero. They merely fail to understand why saving one's comrades should grant anyone the right to injure others freely during peacetime.\n\nPunishing him severely would demonstrate throughout the army that military distinction cannot place anyone beyond military law, but may convince many veterans that the Federation has forgotten everything the war taught them. A lenient punishment would preserve this hero's reputation, but tell his victims that some men's injuries weigh less than other men's medals. A public apology might repair the divisions within the company, yet could become little more than a ceremony that terminates accountability in the name of reconciliation.\n\nThe crowd outside the barracks has not dispersed. Everyone is waiting for us to decide whether a hero can also be an abuser."
  fcf_military_event.7.a:0 "All are equal before the law."
  fcf_military_event.7.b:0 "A stern lesson will suffice."
  fcf_military_event.7.c:0 "A public apology would be the best solution."

  fcf_military_event.8.title:0 "Let Bygones Be Bygones"
  fcf_military_event.8.desc:0 "It began with a single letter published in a local newspaper. Its author had left the army five years earlier and now worked as a fitter in a locomotive factory. He recalled that during his service, after refusing to wash a veteran's clothes, he had been locked inside a storeroom and beaten throughout the night. The next morning, a military doctor treated the wound above his eyebrow, while the duty NCO recorded that he had ‘fallen accidentally during training.’ The writer said that he had always regarded the incident as a humiliation he simply had to forget. Only when the Federation began addressing bullying within the army did he realize that perhaps he was not the one who should feel ashamed.\n\nAfter the letter was published, old cases began emerging throughout the country. Some former soldiers brought faded medical certificates to local committees, while others could remember only the number of their old company and their attacker's nickname. Certain witnesses had long since died; others insisted that they had seen nothing. Some of the accused had left the army, others had been transferred elsewhere, and several had become NCOs because of their experience in training and administration. Men who once used seniority to dominate recruits are now responsible for educating the next generation.\n\nUnease quickly spread within the military. If every shove, insult, and additional duty from ten years ago were investigated according to present standards, hardly any veteran company would remain entirely untouched. Punishing serving personnel solely upon memories recounted many years later, in the absence of records and physical evidence, might also create new injustices. Some commanders advocate investigating only serious cases involving severe injury, suicide, or lasting harm, concentrating limited resources upon conduct that permits no conceivable defence. Others warn that the severity of each incident was originally recorded by the same people responsible for concealing it. Using incomplete archives to select cases for investigation would merely reward those who successfully destroyed the evidence.\n\nThe dispute soon extended beyond the army. Veterans' organizations began collecting testimony, trade-union newspapers published survivors' accounts in successive editions, and several local councillors even arrived at barracks gates with journalists and demanded personal access to duty rosters and medical records. They maintain that the military has no right to investigate itself, much less decide which old injuries deserve examination. The army refuses to admit unscreened personnel into its bases: soldiers' private correspondence is kept in their quarters, while the archives contain training plans and troop movements. An unrestricted public investigation might expose the entire military establishment to newspapers and political struggle.\n\nRefusing outside participation would cast suspicion upon every finding of innocence, yet permitting social organizations to conduct unrestricted investigations might deprive the army of both secrecy and discipline. A joint commission composed of military and civilian representatives could provide mutual restraint, but would create further disputes over who should select its members, which materials may be published, and whose judgment should prevail when the two sides disagree.\n\nOld cases will not disappear simply because we refuse to look back. They have already returned with discharged soldiers to factories, schools, and local committees, transforming private memories into a social reckoning with the army as a whole. We must now decide how many years of archives we are prepared to open—and how widely we are prepared to open the barracks gates to those outside."
  fcf_military_event.8.a:0 "Investigate every old case that can be substantiated."
  fcf_military_event.8.b:0 "Investigate only the most serious cases."
  fcf_military_event.8.c:0 "Establish a joint civilian–military commission."
  fcf_military_event.8.d:0 "Allow civilian organizations to participate fully in the investigations."

