# Military Decisions
  FCF_military_categories:0 "Military Reform"
  FCF_military_categories_desc:0 "The Federal Army played a vital role in defending the revolution, yet in this age of upheaval, the various currents within its ranks are once again stirring. Since the end of the Weltkrieg, public enthusiasm for war has steadily diminished, while most of those entering the army to replenish its ranks have been ignorant and untrained men with few other prospects. These recruits are plainly incapable of bearing the burden of defending the Commune, and military reform has therefore become unavoidable. Yet any reform of the army will inevitably affect society as a whole. Different groups hold widely divergent views of the military, while some even regard it as a ‘remnant of oppression’ that should be abolished altogether, leaving the country's security to fragile militia formations.\n\nWhether the army belongs to the country or to a particular political faction cannot be determined by a sentence written into the constitution. An army removed from politics might help preserve the stability of our regime, yet as the instrument through which the country's will is expressed, the military is also the institution least capable of remaining outside politics. Should our revolution fall into crisis from within, the army will be the force upon which we must rely."

