  # Irish Countermeasures
  FCF_international_intervention_countermeasures_category_IRE:0 "Revolutionary Undercurrents upon the Emerald Isle"
  FCF_international_intervention_countermeasures_category_desc_IRE:0 "The new regime has many matters to address following the coup. Although the Citizen Army has been suppressed to some extent, its power has merely been weakened rather than eliminated, and it still possesses an opportunity to strike back. The coup exposed one fundamental truth: Ireland is not stable. If one coup can take place, why should another be impossible? Should the Citizen Army attempt another coup—or even a revolution—the government must consider how much better prepared it will be than it was the first time.\n\nStrength of the Irish Citizen Army: [?IRE.ii_ire_revolution_army|.0Y]\nPublic Sympathy: [?IRE.ii_ire_revolution_compassion|.1Y%]\nSocial Stability: [?IRE.stability|.1%Y]"
  ii_ire_revolution_army_change:0 "Strength of the Irish Citizen Army $RIGHT|-=.0$"
  ii_ire_revolution_army_more_than_5:0 "The strength of the Irish Citizen Army is greater than §Y5§!"
  ii_countermeasure_ENG_IRE_transport_weapons:0 "Supply the Irish Citizen Army"
  ii_countermeasure_ENG_IRE_start_revolution:0 "Launch the Revolution in [IRE.GetName]"
  ii_countermeasure_IRE_crack_down_revolution:0 "Suppress the Citizen Army"
  ireland_revolution_control_weaken:0 "The local control of the Irish Citizen Army is §Gweakened§!"
  ireland_revolution_control_strengthen:0 "The local control of the Irish Citizen Army is §Rstrengthened§!"
  ii_countermeasure_IRE_contend_for_state:0 "Contest [FROM.GetName]"
  ii_countermeasure_IRE_revolution_take_over_state:0 "The Irish Citizen Army Is Taking Action"

