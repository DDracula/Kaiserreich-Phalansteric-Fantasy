# International Intervention
  FCF_international_intervention_countermeasures_category_GENERAL:0 "Combating Socialism"
  FCF_international_intervention_countermeasures_category_desc_GENERAL:0 "[FRA.GetName] is attempting to incite our decent citizens to join the ranks of syndicalist thugs. To allow this to continue unchecked would be a betrayal of our people, our society, and our country. We must return those lost souls who have embraced the red faith to the proper path, strengthen national stability, and, where necessary, make limited concessions in pursuit of our longer-term objectives. Whatever happens, we will never surrender our country to syndicalist bandits!"

