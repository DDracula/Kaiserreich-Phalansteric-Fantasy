# Events


  fcf_international_events.1.title:0 "[FRA.GetName] Claims Its Lost Territories"
  fcf_international_events.1.desc.a:0 "During the Weltkrieg, the French lost [29.GetName] and the overwhelming majority of their colonies. In the civil war that followed, they also lost [943.GetName], while [1.GetName] fell under the control of the Algiers government.\n\nFor more than a decade, those thugs remained preoccupied with their internal struggles and displayed little interest in recovering the lost territories. Recently, however, the new Chairman of the Commune declared that they had never forgotten the people living in those lands—and even promised to ‘liberate’ us, the victors, along with them.\n\nThis is plainly an overt territorial threat, although they do not presently appear prepared to act upon it, and our advisers have treated the declaration with little concern. Yet reports from the administrations of the territories claimed by France reveal that sabotage and violence have become increasingly common since the ‘Declaration of the Lost Territories.’ Our police have somehow failed to apprehend the syndicalist bandits who appear and vanish without a trace. This is no ordinary unrest. The French must be supporting it covertly, but we will not allow them to succeed."
  fcf_international_events.1.desc.nfa:0 "Since the Weltkrieg, we have lost extensive territories, and countless sons and daughters of France have awaited the recovery of their homeland and the cleansing of our wartime humiliation. Yet following the ‘revolt,’ shameless syndicalist bandits stole the soil of France, profaned the honour of the tricolour, and became absorbed in their parliamentary games while forgetting the people crying out in the occupied territories.\n\nNow they have dared to declare their intention ‘to liberate the lands occupied by enemies and traitors from imperialism and capitalism.’ What shamelessness! They chose to submit to Germany and now accuse us of treason? Yet the worst offenders are not the syndicalist thugs, but the traitors within our own territory. The administration in Corsica reports that sabotage and violence have increased steadily since the Reds issued their so-called ‘Declaration of the Lost Territories.’ Even our police have been unable to subdue the thugs. This must be another syndicalist conspiracy, and we will never allow it to succeed."
  fcf_international_events.1.a:0 "The police will deal with it."
  fcf_international_events.1.nfa:0 "Long live France!"
  FCF_international_state_FRA_riot_modifier:0 "Unrest in the Lost Territories"

  fcf_international_events.5.title.SPA:0 "Chaos in Barcelona"
  fcf_international_events.5.title.SWF:0 "Assistance from Our French Comrades"
  fcf_international_events.5.desc.SPA:0 "According to the Barcelona administration, an organized uprising inflicted serious losses upon the local police and military forces. Weapons and equipment were seized, and for a time we even lost control of the region. Through our efforts, the disorder has at least temporarily been suppressed. Yet before we could finish assessing the losses, we found ourselves confronted by a workers' strike. These actions are unquestionably connected, and both point towards the centre of evil to our north—[FRA.GetName]. They are undoubtedly responsible for our present difficulties.\n\nAs our domestic problems continue to worsen, however, we have little time to condemn them. Once we have dealt with the syndicalist thugs at home, we can turn our attention towards their masters."
  fcf_international_events.5.desc.SWF:0 "A telegram has raised our spirits! Paris supported us even before the civil war, and once the fighting began, our French comrades dispatched assistance: military advisers, weapons, equipment, and volunteers. Our strength has increased once again, and the reactionaries will inevitably fall before the working class!"
  fcf_international_events.5.SPA:0 "Barcelona's troubles continue…"
  fcf_international_events.5.SWF:0 "Long live internationalism!"

  fcf_international_events.6.title.a:0 "Foreign Interference"
  fcf_international_events.6.title.b:0 "Crimson Undercurrents"
  fcf_international_events.6.desc.a:0 "The Labour Progressive Party has organized an enormous rally intended to spread its sinister syndicalist ideas among the surrounding working-class electorate. Ordinarily, a marginal faction so lacking in political allies and funds should have been incapable of arranging such a formidable gathering. Perhaps Black Monday has polarized the electorate—or perhaps a foreign power has been fanning the flames.\n\n[ENG.GetName] was our first suspect, given the Labour Progressive Party's established contacts with them. Yet every indication suggests that this extensive campaign was organized by another member of the Third International: [FRA.GetName]. Although unexpected, such conduct is entirely consistent with the logic of these Red bandits. Most concerning of all, dark currents appear to be moving beneath the surface of what is supposedly an electoral rally. More than one police officer has reported suspicious individuals carrying illegal weapons around the gathering. We would be wise to remain vigilant…"
  fcf_international_events.6.desc.b:0 "Since the election ended, our security services have repeatedly warned that some organization appears to be operating beyond our sight. Judging from its activities, it is probably connected with the pro-British faction and the syndicalists. Several breaches of public order have been attributed to these groups, yet we have been unable to identify those responsible or discover the slightest trace of the people who carried them out. We can be certain only that they are acting in an organized manner and towards a deliberate objective.\n\nMeanwhile, the habitually underfunded Syndicalist Party and $IRE_totalist_party_short$ have begun conducting conspicuous campaigns of their own. They are recruiting not only workers, but also intellectuals opposed to the government, members of the petty bourgeoisie, and peasants, continually spreading their sinister syndicalist ideas throughout our society. Although we have imposed limited restrictions, their influence is expanding much more rapidly than anticipated. They plainly could not have achieved this alone. The British—or perhaps even the French—may be the true players directing events from the shadows, although we have yet to discover proof."
  fcf_international_events.6.a:0 "They had better behave themselves."
  fcf_international_events.6.b:0 "Let us hope there will be no further trouble."

  fcf_international_events.7.title.SRI:0 "Assistance from Our French Comrades"
  fcf_international_events.7.title.SRD:0 "Defeatism Spreads"
  fcf_international_events.7.desc.SRI:0 "Ever since the Italian Revolution, [FRA.GetName] has assisted us as a steadfast ally and our firmest support against reaction and imperialism. Our comrades in Paris have now brought further good news: the Commune is prepared to support our mission wholeheartedly—the transformation of Italy into a socialist republic—and has granted us still more assistance. We have no reason to reject the enthusiasm of our comrades, and we will transform Italy into a socialist, popular, revolutionary, and great republic!"
  fcf_international_events.7.desc.SRD:0 "We once believed that the socialist bandits who drove us from the Italian mainland would prove a passing phenomenon and collapse before long. Reality has struck us brutally. They not only survived, but defeated the other regimes upon the peninsula. Now they have turned their attention towards us, regarding our territory as the last fragment dividing the Italian fatherland. The damned traitors even dare accuse us of separatism!\n\nThe warships and artillery of the syndicalist bandits bombard us without pause. Although our soldiers remain courageous, the thugs rely upon [FRA.GetName]—the lair of Red iniquity—to spread their sinister doctrines among our people and even attempt to incite mutiny within our army. We ultimately suppressed the disturbances they provoked, but must acknowledge that the socialist unification of the mainland and the internal propaganda campaign have allowed defeatism to settle over us…"
  fcf_international_events.7.SRI:0 "For Italy and for socialism!"
  fcf_international_events.7.SRD:0 "Is this truly how it ends…?"

  fcf_international_events.8.title.a:0 "France Supports the Revolution"
  fcf_international_events.8.title.b:0 "A Telegram from Paris"
  fcf_international_events.8.desc.a:0 "While we fought the reactionaries at the front, momentous news arrived from the rear: [FRA.GetName], the steadfast friend of our revolution, has sent us military assistance. The shipment includes not only desperately needed weapons and ammunition, but also a contingent of military advisers. Moreover, with the assistance of the Chinese Syndicalist Party, we have begun establishing a measure of control over the towns we recently captured. The party's right wing has expressed concern, but until the revolution achieves victory, every available source of strength is worth securing."
  fcf_international_events.8.desc.b:0 "Excellent news! Our comrades in Paris have contacted us. Not only do they recognize us as the sole legitimate government of China, but they have also promised to assist our revolution! Chinese comrades formerly exiled in France are gradually returning home with the help of Paris, while the French have promised to dispatch personnel to assist with the reconstruction of our national economy. Although some within the party regard this French enthusiasm with concern or even outright opposition, the leadership of the Chinese Syndicalist Party may allow Sino-French cooperation to advance further."
  fcf_international_events.8.a:0 "Our thanks, comrades."

  fcf_international_events.9.title:0 "[FRA.GetName] Proposes an Oil Agreement"
  fcf_international_events.9.desc:0 "Lacking domestic petroleum resources, [FRA.GetName] has approached us in the hope that we can provide the oil it requires. In addition to payment for the oil, it has promised to assist our domestic development. This is unquestionably an opportunity to improve our economy. Since [FRA.GetName] is a socialist country, the workers it employs generally receive better treatment than ordinary labourers here. This would indirectly spare us some expenditure upon public welfare—since we would not be the ones paying for it. The only difficulty is that [FRA.GetName] may use the arrangement to encourage socialist sentiment within our country, but this does not appear especially serious at present."
  fcf_international_events.9.a:0 "Our friends are naturally welcome."
  fcf_international_events.9.b:0 "Tell the socialists to keep well away."
  FCF_international_trade_partnership:0 "Trade with Red France"
  FCF_international_trade_partnership_desc:0 "Since [FRA.GetName] lacks access to petroleum, it wishes to conclude an oil agreement with us. Unlike the imperialists of the past, [FRA.GetName] claims that it will assist our domestic development and improve workers' welfare—without requiring us to spend a penny!"

  fcf_international_events.10.title:0 "[FRA.GetName] Approaches Us"
  fcf_international_events.10.desc:0 "Southeast Asia once belonged to France and Britain, which greedily extracted its wealth. After the Weltkrieg, they disappeared and the Germans took their place, while Britain and France transformed themselves into so-called ‘socialist states.’ They speak continually of ‘liberation,’ but to us it has always appeared little more than the disorderly conduct of a mob.\n\nYet [FRA.GetName]—the centre of world syndicalism—has recently extended an olive branch. It claims neither to seek the overthrow of our government nor our exploitation, but a relationship of mutual benefit. Since the colonial administrations of [GEA.GetName] and [DEI.GetName] monopolize Southeast Asia's resources, [FRA.GetName] hopes to obtain them through us—especially rubber. Dealing with syndicalists will certainly anger domestic conservatives and embolden our socialists. Trade with [FRA.GetName], however, would unquestionably produce considerable economic growth and could provide a valuable stimulus to both our economy and employment."
  fcf_international_events.10.a:0 "Good relations bring prosperity."
  fcf_international_events.10.b:0 "We will not allow the French to lay their hands upon us a second time."

  fcf_international_events.11.title:0 "Unusual Trade"
  fcf_international_events.11.desc:0 "Something peculiar has recently occurred in our capital. The workers continue to labour diligently, yet the products of their work are nowhere to be seen in our markets. Several clues point towards an unexpected culprit: [FRA.GetName]. This centre of Red power may have established secret smuggling sites in our capital, using syndicalist heresies to persuade unfortunate workers to steal goods from their factories and trade them to the French. This is unquestionably a severe blow to our economy. Yet the country's instability prevents us from eradicating these Red parasites. We can only hope that the police will contain the traitors."
  fcf_international_events.11.a:0 "Deploy additional police."
  fcf_international_events.11.b:0 "Crack down upon Red propaganda."
  fcf_international_events.11.c:0 "There is nothing we can do."

  fcf_international_events.12.a:0 "Damn it!"
  fcf_international_events.12.b:0 "Where are the police!?"
  fcf_international_events.12.c:0 "Dear God…"
  fcf_international_events.12.d:0 "Excellent."

  fcf_international_events.13.title:0 "Unrest along the Border"
  fcf_international_events.13.desc:0 "Reports from the Alsatian frontier are becoming increasingly disturbing. Smuggling across the Communard border is no one-sided intrusion, but a continuous siphon drawing valuable resources out of the Empire and westwards.\n\nAt first, only small quantities of agricultural produce and tools disappeared. Now entire consignments of coal and high-quality steel components are crossing the frontier, accompanied even by skilled workers carrying technical drawings. Everything passes across the border winding through the forests and mountains of Alsace and enters [FRA.GetName]. Paris is plainly encouraging this loss of resources through its local subversive networks, offering exceptionally attractive prices or political protection.\n\nThis ‘reverse smuggling’ not only deprives us of desperately needed materials, but sends a dangerous message to the inhabitants of the western provinces: life and opportunity may be better upon the Communard side. Local garrisons report that NCOs and gendarmes attempting to arrest smugglers frequently encounter obstruction from the local population. We must take decisive measures to close this enormous breach upon the Empire's Alsatian flank."
  fcf_international_events.13.a:0 "Our economy should not be suffering like this!"

  fcf_international_events.14.title:0 "Allies from the Continent"
  fcf_international_events.14.desc:0 "The flame of our revolution has only just been lit, yet the remnants of the old world—the Entente—are already attempting to extinguish it with bayonets and artillery. Ammunition expenditure and equipment losses at the front have been staggering. With every minute of delay, comrades pay with their lives for the absence of adequate equipment.\n\nAt the moment when foreign assistance was most desperately required, a message from [FRA.GetName] reached Canberra. Defying the danger of interception by the enemy fleet, a merchant vessel flying the red flag has finally entered our harbour.\n\nFrom its holds came the steel and fire our revolution requires most urgently: entire consignments of rifles and artillery. This is genuine military assistance. The heart of world syndicalism has seen the flame we lit in the Pacific and resolved to support us at any cost."
  fcf_international_events.14.a:0 "Long live internationalism!"

  fcf_international_events.15.title:0 "The Spectre of Syndicalist Revolution"
  fcf_international_events.15.desc:0 "Since our brethren upon the British mainland were overwhelmed by the Red tide, Australasia has remained the Empire's strongest bastion in the South Pacific. Over recent weeks, however, that sense of security has given way to disturbing whispers.\n\nMilitary intelligence reports have arrived in torrents, warning that underground syndicalists and radical workers are becoming increasingly audacious. Dockworkers in New South Wales have refused to unload goods arriving from India. In the mining districts of Queensland, minor strikes rapidly developed into clashes with the local police. Illegal propaganda bearing three arrows or burning flames has appeared even upon the outskirts of Canberra.\n\nThese actions appear scattered and lack unified direction, yet all possess the same character: opposition to the King and the Empire, accompanied by calls to establish a worker-ruled ‘Commonwealth.’ Intelligence officers fear that broadcasts and funds from the Commune of France and the Union of Britain are entering through underground channels, while local dissatisfaction with the existing order provides fuel for revolution. We can no longer ignore the unrest stirring within the shadows."
  fcf_international_events.15.a:0 "God save the King…"

  fcf_international_events.16.title:0 "A United Iberia?"
  fcf_international_events.16.desc:0 "Our common struggle against the reactionary forces of the old world has created a profound friendship between us and our revolutionary comrades upon the peninsula. Yet the two neighbouring regimes continue to display significant differences in both their revolutionary development and their systems of government.\n\nA diplomatic mission from [FRA.GetName] has now advanced a bold and potentially historic proposal: the unification of the revolutionary forces throughout the Iberian Peninsula into a powerful ‘Iberian Socialist Federation.’ The French argue that a unified political entity could secure complete control over the Strait of Gibraltar, exercise greater influence within the international community, and resist threats emerging from Africa and the Mediterranean more effectively.\n\nThe proposal has provoked fierce debate within the Supreme Council. Acceptance would provide enormous strategic advantages, but might also require us to sacrifice some of our revolutionary principles in the name of ‘the efficiency of unification.’ Can we accept an Iberia that surrenders a measure of autonomy in exchange for the strength of the whole?"
  fcf_international_events.16.a:0 "Workers of Iberia, unite!"
  if_socialist_iberia_accept_swf:0 "§CIf §Y[POR.GetName]§! accepts:§!"
  if_socialist_iberia_accept_por:0 "§CIf §Y[SWF.GetName]§! accepts:§!"
  fcf_international_events.16.b:0 "There is a reason Spain and Portugal are separate countries."

  fcf_international_events.17.title:0 "Revolutionary Sentiment Spreads"
  fcf_international_events.17.desc:0 "Across the other side of the Iberian Peninsula, the artillery and red flags of the Spanish Revolution have planted fear deep within the hearts of Lisbon's elites. To the workers in our factories, mines, and dockyards, however, they have sounded an inspiring call. Every report from Madrid—whether truthful or exaggerated—has become a powerful spiritual poison.\n\nThe situation has deteriorated rapidly over recent weeks. Textile workers in Porto and shipyard workers in Lisbon are organizing unauthorized strikes upon an unprecedented scale. Intelligence from the border regions indicates that Spanish anarcho-syndicalists and radicals are crossing the frontier, distributing inflammatory leaflets and providing ‘guidance’ to underground organizations within our country.\n\nOur secret police report that many workers' associations have ceased discussing wages and working hours and now debate ‘a workers' republic’ and ‘the power of the councils’ openly. This sentiment has spread beyond the working class into the impoverished peasantry and the lower ranks of the military. It is no longer merely social discontent, but an open challenge to our entire social order—the spectre of revolution haunting the banks of the Tagus."
  fcf_international_events.17.a:0 "We must respond."
  fcf_international_events.17.b:0 "They are nothing more than a rabble."

  fcf_international_events.18.title.a:0 "The Iberian Vision Realized!"
  fcf_international_events.18.title.b:0 "The Iberian Status Quo Preserved"
  fcf_international_events.18.desc.a:0 "Our comrades in [SWF.GetName] and [POR.GetName] have accepted our proposal and formally united their countries. After centuries of division, Iberia has become whole. This is unquestionably another great expansion of the power of the world proletariat! From this day forward, there will be neither Spaniards nor Portuguese—only Iberians!"
  fcf_international_events.18.desc.b:0 "For various practical reasons, [SWF.GetName] and [POR.GetName] ultimately failed to reach an agreement, and the plan for a united Iberia has once again been set aside. In accordance with the principle of respecting every country, we can do nothing more than express our regret and support whatever choices they have made."
  fcf_international_events.18.a:0 "The workers have no country!"

  fcf_international_events.19.title:0 "Our Neighbour"
  fcf_international_events.19.desc:0 "Twenty years ago, the French bourgeoisie entered an imperialist civil war with the German Empire in pursuit of its own interests, while our courageous workers and comrades rejected that senseless conflict. Our revolution ultimately achieved victory, but it was a mutilated victory. To ensure the survival of the revolutionary regime, we were forced to compromise with the German Empire. Although we lost territory, we secured the people. Yet we will never forget the humiliation of the Weltkrieg, abandon the French compatriots living beneath German rule, or forsake the German workers who remain exploited by capitalism and monarchy. Socialist liberation will ultimately be achieved in France and Germany alike.\n\nOur regime, however, was itself founded through opposition to the war. Even if we understand that a general conflict between the Commune and the German Empire is inevitable, our people still hope that we will not be the ones to initiate it. We could certainly adopt a more aggressive policy towards Germany, but this would encourage militarism and nationalism within our own country—developments entirely harmful to the construction of socialism.\n\nThe General Federal Council remains divided over Germany. The advocates of war demand a more offensive posture, while the advocates of peace maintain that war is a catastrophe for everyone and that our true responsibility is to ensure that Germany cannot invade us, rather than provoking the conflict ourselves.\n\nThe veterans of the Sorelian faction hope to avenge their wartime humiliation in a new conflict. The nationalists wish to recover the French homeland lost during the Weltkrieg, while patriots refuse to abandon an opportunity for vengeance. At the opposite end of the spectrum stands the unexpected alliance between the anarchists and the neo-socialists. Both oppose war, although the anarchists proclaim the coming second revolution of the German workers, while the neo-socialists merely oppose all activity beyond our domestic affairs in a mechanical fashion. Whatever our decision, the direction of our policy towards Germany must be settled."
  fcf_international_events.19.a:0 "We will avenge the Weltkrieg."
  fcf_international_events.19.b:0 "There is no quarrel between proletarians."

  fcf_international_events.20.title:0 "An Unexpected Approach"
  fcf_international_events.20.desc:0 "To our astonishment, [FRA.GetName]—the lair of revolutionary thought—has approached us directly. Claiming that we are fellow victims of the Weltkrieg and expressing sympathy for the loss of our homeland, they seek cooperation in any future war against [BUL.GetName]. Their supposed cooperation would in practice consist of providing us unilaterally with an officer mission, weapons, and equipment. In exchange, however, they demand economic privileges within our country: favourable trading terms and even permission to invest domestically.\n\nThe proposal has naturally provoked opposition from conservatives and anti-syndicalists, who regard it as a bargain with the Devil—the exchange of our nation's soul for material advantage. Centrists and the left, however, argue that it would strengthen us against our enemies and alleviate our domestic economic crisis. [FRA.GetName] may never be destined to become our friend, but even enemies can fight beside one another when confronted by a common foe."
  fcf_international_events.20.a:0 "Tell Paris that we are prepared to cooperate."
  fcf_international_events.20.b:0 "We will never cooperate with the Devil."
  FCF_international_balkan_cooperation:0 "Communard–Balkan Cooperation"

  fcf_international_events.21.title:0 "The Revolutionary Storm"
  fcf_international_events.21.desc:0 "The desks of the Imperial Ministry of the Interior are nearly submerged. Police reports from Prague, Kraków, Budapest, and Zagreb have accumulated in mountains, every document carrying the scent of ink and panic. Informants' messages, intercepted correspondence, analyses of ‘deliberate obstruction’ in the factories—every piece of intelligence points towards the same disturbing conclusion.\n\nThe air within the Empire is growing thin. A familiar and suffocating silence has descended upon the non-German quarters, resembling the moment when everything holds its breath before a storm. This is not the despair of 1918, but the expectation of 1848.\n\nMagyar nationalists are meeting Czech radicals in secret. Croatian intellectuals exchange encrypted telegrams with Polish underground organizations. They are unearthing the spectre of nearly a century ago and attempting to breathe new and furious life into it. Crude leaflets bearing Kossuth's portrait appear upon walls during the night, only to be torn down hurriedly by patrolmen before dawn. Workers who should be complaining about their wages in taverns now whisper about ‘national self-determination.’\n\nAncient scars are being torn open once again, and this time their bearers appear to have discovered a common language: hatred of Vienna. These are no longer isolated protests. A storm is gathering."
  fcf_international_events.21.a:0 "The revolution has returned…"
  fcf_international_events.21.b:0 "The end of the Habsburgs has come!"
  anti_habsburg_front:0 "Anti-Habsburg National Liberation Front"

  fcf_international_events.22.title:0 "The End of the Habsburgs"
  fcf_international_events.22.desc:0 "Vienna has fallen.\n\nAfter the final artillery reports echoed through the narrow streets of the Innere Stadt, the city descended into deathly silence. Columns of smoke rise from the Hofburg and the Parliament. The banner of the double-headed eagle has been torn down and replaced by the Magyar tricolour, followed by the flags of the Czechs, the Croats, and even Galicia. Those who were once their subjects have now become their conquerors.\n\nRepresentatives of the ‘Anti-Habsburg National Liberation Front’ have assembled inside the Hall of Mirrors at Schönbrunn Palace. A Hungarian officer—plainly their leader—rests his military boot upon an exquisite Rococo chair. Before him stand the trembling Imperial Chancellor and several surviving ministers.\n\nA document is thrown upon the table. Its title appears in heavy type: The Vienna Declaration.\n\n‘Read it,’ the Hungarian orders in heavily accented German. ‘The epitaph of an empire.’\n\nIts contents are concise and merciless. The House of Habsburg-Lorraine must immediately renounce all claims to Austria, Hungary, Bohemia, and every other Crownland. The Austrian Empire—the multinational ‘prison’ that endured for centuries—must be dissolved without delay. The declaration requires the Austrian government to recognize unconditionally the complete independence and sovereignty of Hungary, Czechia, Croatia, and every other ‘oppressed nation.’\n\nAn era has ended amid the thunder of artillery and the cold permanence of ink."
  fcf_international_events.22.a:0 "We have no choice…"

  fcf_international_events.23.title:0 "The Empire's Final Days"
  fcf_international_events.23.desc:0 "The Empire is rotting from within.\n\nWhether nationalists in Budapest and Prague have already set the frontiers alight, or whether the double-headed eagle has been forced to sign a humiliating treaty, the result is the same: Vienna's authority has vanished.\n\nThe true danger no longer comes solely from distant provinces; it has penetrated the heart of the Empire. Rebellion fills the air. From the working-class district of Favoriten, syndicalists march towards the Innere Stadt beneath red flags, singing prohibited songs. Along the Ringstrasse, students, members of the middle class, and even disaffected merchants wave simple red-white-red tricolours—the flag of a republic, stripped of the imperial arms.\n\nRadicals who once regarded one another as mortal enemies are now united behind a common slogan: ‘Down with the Habsburgs!’—Nieder mit Habsburg!\n\nThe police either shelter behind their barricades or tear the insignia from their caps and join the crowds. Reports regarding the loyalty of the army contradict one another, but their conclusion is unmistakable: it cannot be trusted. The Hofburg has become an island. A dynasty that endured for a thousand years is now reduced to several terrified ministers pacing through ornate chambers. The uproar beyond the gates announces that the final moment is approaching."
  fcf_international_events.23.a:0 "The Habsburgs must go!"
  fcf_international_events.23.b:0 "We shall return to Germany."

  fcf_international_events.24.title:0 "Our Wretched Brothers"
  fcf_international_events.24.desc:0 "An urgent telegram has been slammed upon a desk in Berlin's Wilhelmstrasse. Its contents are shocking, yet hardly unexpected.\n\nThe House of Habsburg, the ancient dynasty that ruled Central Europe for centuries, has lost control of Vienna.\n\nThe telegram may have come from our panic-stricken ambassador, vividly describing republican and even syndicalist mobs marching along the Ringstrasse while the Hofburg descends into chaos. Or—more pathetically still—it may have come from the remnants of the Austrian imperial family, every line containing a servile plea for their ‘German brothers’ to intervene.\n\nWhatever its origin, the truth is clear. The ‘Austrian Question’—which Chancellor Bismarck believed he had settled permanently in 1866—has once again confronted the German Empire in its most acute form.\n\nA disintegrating Austria descending into anarchy represents a direct threat to the Empire's security. A syndicalist regime in Vienna would be an utterly intolerable nightmare, opening our vulnerable southern frontier completely. The generals of the Imperial General Staff have already prepared contingency plans. This is a risk, but some voices whisper that it is also an historic opportunity to ‘complete Germany.’"
  fcf_international_events.24.a:0 "A united Germany—as it should always have been."
  fcf_international_events.24.b:0 "We cannot tolerate a republic upon the Empire's southern frontier."
  fcf_international_events.24.c:0 "This may provoke Russian and French intervention. The risk is too great."

  fcf_international_events.25.title:0 "The Red Front"
  fcf_international_events.25.desc.a:0 "An encrypted telegram from Paris carries tremendous significance. Bypassing every traditional diplomatic channel, the Commune of France has appealed directly to our revolutionary committee.\n\nThe comrades in Paris praise our initial victories in Northern Europe, but quickly direct our attention elsewhere upon the map. Beyond our frontiers, most of the Scandinavian Peninsula remains firmly under the control of reactionary monarchs, bourgeois parliaments, and the armies of the old world.\n\nThe Commune's proposal is direct: it wishes us to become the ‘Red Front of Northern Europe.’ It promises ‘fraternal assistance’—advisers, supplies, and more direct forms of support. Its objective is to use our country as the springboard from which the flames of revolution will spread throughout Scandinavia and revolutionary banners will line the coasts of the Baltic Sea and Danish straits. The prospect is tempting, but will almost certainly place us upon the front line of a direct confrontation with Berlin and its northern allies."
  fcf_international_events.25.desc.b:0 "The latest reports from the security services are disturbing. Over recent months, an undercurrent has begun moving through our factories and ports. Workers no longer complain solely about working hours and the price of bread. They whisper of ‘syndicalism,’ ‘general strikes,’ and ‘the comrades in Paris.’\n\nThis is no coincidence. Our intelligence indicates that the Commune of France intends to make Scandinavia the next target of its campaign to ‘export revolution.’ Agitators from Paris, disguised as sailors and merchants, are spreading radical ideas within our trade unions. Illegal leaflets and pamphlets—professionally printed and plainly produced abroad—circulate secretly among the workers.\n\nThe objective of the Commune of France is clear: it seeks to ignite a socialist revolution in Northern Europe, and we have unfortunately become one of its targets. Many of our workers have already fallen under the influence of these dangerous ideas. Unless we act rapidly, the undercurrents of this ‘Red Front’ may develop into a storm capable of overturning the foundations of our society."
  fcf_international_events.25.a:0 "Workers of Scandinavia, unite!"
  fcf_international_events.25.b:0 "A pack of thugs."

  fcf_international_events.26.title:0 "Red Atlanticism"
  fcf_international_events.26.a:0 "Together, we shall turn the Atlantic red!"

  fcf_international_events.27.title:0 "The Commune Seeks to Invest"
  fcf_international_events.27.a:0 "This will benefit our economy."
  fcf_international_events.27.b:0 "We must overcome our underdeveloped agricultural economy."

  fcf_international_events.28.title.a:0 "Partners from the Old World"
  fcf_international_events.28.title.b:0 "A Syndicalist Conspiracy"
  fcf_international_events.28.a:0 "The flame of revolution burns brightly!"
  fcf_international_events.28.b:0 "Is this the end?"

  fcf_international_events.29.title:0 "The Central American Ideal"
  fcf_international_events.29.a:0 "The ideal has been realized."

  fcf_international_events.30.title:0 "A United America"
  fcf_international_events.30.a:0 "The working class has no country!"
  fcf_international_events.30.b:0 "We need more time to manage our own affairs."

  fcf_international_events.31.title.a:0 "The Latin Union of the Americas"
  fcf_international_events.31.title.b:0 "Going Our Separate Ways"
  fcf_international_events.31.a:0 "A strong and united America!"
  fcf_international_events.31.b:0 "They are simply not ready yet."

  fcf_international_events.32.title.a:0 "A Conspiracy from the Red Lair"
  fcf_international_events.32.title.b:0 "Comrades across the Ocean"
  fcf_international_events.32.a:0 "Damn the Old World!"
  wca_will_take_over_nee:0 "§RUnexpected forces appear to be lurking within §YNew England§!…§!"
  fcf_international_events.32.b:0 "Unite!"

  fcf_international_events.33.title:0 "The Day We Emerge"
  fcf_international_events.33.a:0 "Break the chains!"

  fcf_international_events.34.title:0 "The Quebec General Strike"
  fcf_international_events.34.a:0 "God save the King…"

  fcf_international_events.35.title:0 "Pacify the Interior before Resisting Abroad?"
  fcf_international_events.35.a:0 "We must prevent the worst outcome."
  fcf_international_events.35.b:0 "We will not bow and scrape."

  fcf_international_events.36.title:0 "The Trap"
  fcf_international_events.36.a:0 "The Weltkrieg repeated once again…"

  fcf_international_events.37.title:0 "A Chaotic Defence"
  fcf_international_events.37.a:0 "Give me back my legions!"

  fcf_international_events.38.title:0 "Baring Their Fangs"
  fcf_international_events.38.a:0 "Damn the French!"

  fcf_international_events.39.title:0 "Where Popular Loyalty Lies"
  fcf_international_events.39.a:0 "Now it is their turn to buy our allegiance?"

  fcf_international_events.40.title.swi:0 "Entering the War?"
  fcf_international_events.40.a:0 "The wheels of history roll onwards…"
  fcf_international_events.40.b:0 "Switzerland must remain neutral!"
  fcf_international_events.40.title.fra1:0 "[SWI.GetName] Accepts the Proposal"
  fcf_international_events.40.title.fra2:0 "[SWI.GetName] Rejects the Proposal"
  fcf_international_events.40.fra1:0 "At least they are sensible."
  fcf_international_events.40.fra2:0 "Utter fools."

  fcf_international_events.41.title:0 "An Olive Branch from the West"
  fcf_international_events.41.a:0 "Begin the negotiations."
  fcf_international_events.41.b:0 "We have nothing to say to syndicalist thugs."

  fcf_international_events.42.title:0 "Economic Cooperation?"
  fcf_international_events.42.a:0 "This serves our common interests."
  fcf_international_events.42.b:0 "No. Next."
  fcf_international_events.42.c:0 "This has gone far enough."

  fcf_international_events.43.title:0 "Military Cooperation?"
  fcf_international_events.43.a:0 "This serves our common interests."
  fcf_international_events.43.b:0 "No. Next."
  fcf_international_events.43.c:0 "This has gone far enough."

  fcf_international_events.44.title:0 "Political Cooperation?"
  fcf_international_events.44.a:0 "This serves our common interests."
  fcf_international_events.44.b:0 "This has gone far enough."

  fcf_international_events.45.title.a:0 "The Final Result"
  fcf_international_events.45.title.b:0 "Russia Rejects Cooperation"
  fcf_international_events.45.a:0 "The enemy of our enemy is a temporary friend."
  russia_accept_cooperation:0 "[RUS.GetName] Accepts Cooperation"
  fcf_international_events.45.b:0 "We part upon bitter terms."

  fcf_international_events.46.title:0 "Gunfire in Dunkirk"
  fcf_international_events.46.desc.a:0 "Formerly part of France, Dunkirk possesses one of the largest ports upon the English Channel and is now regarded as one of the Reichspakt's most successful centres of overseas trade. [29.owner.GetName], an ugly country stitched together through artificial means, holds the territory as the glove upon [GER.GetName]'s hand. Yet both the Germans and their lackeys know to whom this land truly belongs—and France has not forgotten her children.\n\nNo one knows where the first shot came from. When dawn arrived, several police officers lying in pools of blood thoroughly alarmed the local inhabitants. The confrontation occurred during the night upon the outskirts of the port, and no suspect was ever apprehended. Nor has anyone determined a motive.\n\nCertain excitable nationalists may claim that the patriotic—French, naturally—inhabitants of Dunkirk have finally exhausted their patience. Others will attribute the incident to the economic crisis following Black Monday, which has supposedly allowed the deceived French population to recognize the righteousness of syndicalism and [FRA.GetName] and begin struggling for its own destiny. Whatever the explanation, a shooting in such a sensitive region has attracted the attention of the [29.owner.GetName] authorities. At this particular moment, they are hardly eager for an incident that might offend their German masters.\n\nThe role we might assume in this affair hardly requires explanation. If it allows us to recover Dunkirk, so much the better. Weakening [29.owner.GetName], that evil and grotesque lackey of imperialism, would itself be entirely advantageous. We need only decide how to intervene. Expressing sympathy for or openly supporting the perpetrators may be excessively aggressive, since we cannot be certain that the shooting was connected with the local resistance. Our intelligence network in the region reported no such operation. Increasing our support for the Dunkirk underground would appear more prudent. By exploiting the economic crisis and social disorder, we can expand our local influence and pursue the territory's recovery methodically."
  fcf_international_events.46.desc.b:0 "As the economy has deteriorated, separatists within our country appear to have become increasingly audacious. Several nights ago, a shooting occurred in Dunkirk—the territory we recovered from France—and left several police officers lying in pools of blood. Since the confrontation took place during the night upon the outskirts of the port, we were unable to apprehend the perpetrator or determine the motive.\n\nOur police suspect that the incident is connected with French infiltration, but we presently possess no evidence of such a relationship. Provoking France recklessly would be most unwise, and the Germans have no desire to see us do so. For now, all we can do is preserve order in Dunkirk and prevent an even greater disaster."
  fcf_international_events.46.a:0 "Make our position clear to [29.owner.GetName]."
  fcf_international_events.46.b:0 "They require only a little assistance."
  fcf_international_events.46.c:0 "Let us hope matters do not worsen."

  fcf_international_events.47.title:0 "[FRA.GetName] Supports Regional Separatism"
  fcf_international_events.47.desc:0 "The investigation into the recent shootings in Dunkirk remains underway, yet [FRA.GetName] has already lost patience and expressed direct support for this tragedy upon our soil. They are unquestionably responsible. There is no reason to waste further resources investigating an affair whose mastermind has openly stepped forward. A direct campaign against the anti-government forces in Dunkirk would appear the best solution. Yet given the dangers planted locally by [FRA.GetName] and the relative weakness of our own country, we would be wise to avoid excessive publicity."
  fcf_international_events.47.a:0 "We must respond forcefully."
  fcf_international_events.47.b:0 "Under German protection, they will not dare act. Elite forces will suffice."
  fcf_international_events.47.c:0 "Wait—the truth of the case has not yet emerged!"

  fcf_international_events.48.title:0 "The Truth"
  fcf_international_events.48.desc:0 "Before expanding our support for the resistance, we should first determine precisely what occurred. If this was genuinely an act of violence inspired by patriotic fervour, then the moment for recovering Dunkirk is almost certainly approaching. If the attack was merely an accident, however, our operations may encounter serious difficulties. We could still present the incident as an act of patriotism, but if anyone exposes the deception, it would become difficult for us to proceed further."
  fcf_international_events.48.a:0 "Have the local underground investigate."
  fcf_international_events.48.b:0 "Dispatch our own intelligence personnel."

  fcf_international_events.49.title:0 "The [29.owner.GetName] Authorities Intervene in Dunkirk"
  fcf_international_events.49.desc:0 "[29.owner.GetName] has finally bared its fangs. According to our local informants, its police and military have begun a campaign against the underground resistance. We ought to assist our comrades now under enemy attack, but the question remains how we should intervene. Dunkirk is part of our homeland, but is presently under the effective control of [29.owner.GetName]. Direct military intervention would therefore constitute a violation of another country's territory and differ little from a declaration of war. We know that we must eventually confront [GER.GetName] and its lackeys in a decisive struggle—but not now."
  fcf_international_events.49.a:0 "Dispatch several special-forces detachments."
  fcf_international_events.49.b:0 "Bluff along the frontier. They will surely fear an attack."
  fcf_international_events.49.c:0 "Provide additional equipment."

  fcf_international_events.50.title:0 "Urban Guerrilla Warfare"
  fcf_international_events.50.desc:0 "Fortunately, our assistance prevented the complete destruction of the underground organizations. The intervention of the [29.owner.GetName] military has instead provided them with additional opportunities to act against the authorities. With the support of the local French-speaking community, the underground can operate beneath the noses of the military and police. Meanwhile, the prolonged security presence in Dunkirk will steadily provoke resentment among the inhabitants. In time, the authorities will drown beneath the population's complaints, providing us with sufficient popular support to confront them. For now, we need only wait for the proper opportunity."
  fcf_international_events.50.a:0 "What sort of opportunity?"

  fcf_international_events.51.title.a:0 "Refugees from Dunkirk"
  fcf_international_events.51.title.b:0 "The Traitors Flee"
  fcf_international_events.51.desc.a:0 "Despite every effort to assist the underground organizations in Dunkirk, the military and police of [29.owner.GetName] succeeded in destroying most of them. Several smaller groups remain, but are unlikely to cause much further trouble. With our assistance, the survivors of the destroyed organizations and their families have crossed the frontier and returned to their homeland—although hardly in the manner we had hoped."
  fcf_international_events.51.desc.b:0 "Our policy has succeeded. Our soldiers and police have eliminated the rebel organizations in Dunkirk, while their surviving remnants have fled towards the French frontier. For the moment, at least, Dunkirk can return to its former tranquillity."
  fcf_international_events.51.a:0 "We shall recover it upon the battlefield."
  fcf_international_events.51.b:0 "The best possible result."

  fcf_international_events.52.title:0 "French Movements along the Frontier"
  fcf_international_events.52.desc:0 "Our operations in Dunkirk appear to have angered [FRA.GetName]. Border posts have observed large-scale movements of the [FRA.GetName] army towards the region. It seems that they intend to intervene militarily, which would unquestionably mean war. Although [GER.GetName] is our ally, we cannot be certain that it will continue assisting us while struggling to protect itself. After a brief conference, our army command reached only one conclusion: we possess no conceivable chance of defeating [FRA.GetName]. If we maintain our present activities in Dunkirk, we may face a war that destroys our country."
  fcf_international_events.52.a:0 "We must defuse the situation. Withdraw our forces from Dunkirk."
  fcf_international_events.52.b:0 "The French are bluffing. We must preserve the unity of the fatherland."

  fcf_international_events.53.title:0 "A Misunderstanding"
  fcf_international_events.53.desc:0 "The investigation into the shooting has concluded, and every indication suggests that it had no connection whatsoever with the movement for Dunkirk's return to France. The police officer killed was himself French. As for the perpetrator, every clue points towards a confused and intoxicated German sailor who is now travelling somewhere upon the distant Atlantic.\n\nThe incident appears to have unfolded as follows. Late at night, the drunken sailor wandered towards the outskirts of the port, where a patrolling French police officer noticed his suspicious behaviour. As the officer approached to ask what he was doing, the sailor suddenly lunged at him in a drunken rage. Startled, the officer drew his pistol and attempted to stop the attack. The darkness and poor visibility caused several shots to miss, enraging the sailor, who drew a pistol of his own and returned fire. The final result was that a police officer was killed by a drunken fool. As for why the sailor possessed a pistol, perhaps the answer lies with the captain who recently reported his own weapon missing.\n\nThe truth has now emerged, and every reckless action will carry its proper cost."
  fcf_international_events.53.a:0 "The truth seldom conforms to what people hope to find."

  fcf_international_events.54.title:0 "[29.owner.GetName] Withdraws from Dunkirk"
  fcf_international_events.54.desc.a:0 "Under domestic pressure, [29.owner.GetName] has finally withdrawn its armed forces from Dunkirk. The local population has now witnessed the true nature of [29.owner.GetName], greatly strengthening our underground movement. We can begin preparing the next stage of our plan—and perhaps stages extending still further."
  fcf_international_events.54.desc.b:0 "Our military movements have frightened [29.owner.GetName] into retreat. They plainly understand whom they are opposing. Marching directly into Dunkirk now, however, would make us appear excessively aggressive. Their withdrawal must be intended to defuse the situation, and a reckless advance might provoke German intervention. Although our movements were a feint, the deployments also exposed several previously unnoticed weaknesses in our frontier defences. Hasty action would only produce further mistakes, and this is far enough for now. At least the underground organizations have gained greater freedom to act."
  fcf_international_events.54.a:0 "It is time to organize an uprising."

  fcf_international_events.55.title:0 "Protest Marches in [29.owner.GetName]"
  fcf_international_events.55.desc:0 "Once the truth emerged, our underground organizations acted rapidly. Newspapers throughout [29.owner.GetName] were delighted to publish the facts behind such a prominent case—and alongside them, accounts of the atrocities committed by [29.owner.GetName] in Dunkirk. Even the most fervent nationalists of [29.owner.GetName] must admit that their government's response was recklessly premature. It imposed emergency controls upon Dunkirk before discovering the cause of the incident, provoking intense resentment not only among the local population, but also throughout other regions of the country. Naturally, certain minor efforts of ours have helped. The decent people of [29.owner.GetName] have entered the streets to express their opposition to the authorities' conduct in Dunkirk."
  fcf_international_events.55.a:0 "The demonstrators will demand the withdrawal of the military and police from Dunkirk."
  fcf_international_events.55.b:0 "Our underground organizations will exploit the opportunity to expand."
  fcf_international_events.55.c:0 "We can continue agitating to enlarge the demonstrations."

  fcf_international_events.56.title:0 "Demonstrations over Dunkirk"
  fcf_international_events.56.desc.a:0 "Once the truth emerged, our people expressed their anger at our reckless imposition of controls upon Dunkirk, leaving the cabinet unprepared for the sudden demonstrations. No one knows how the newspapers obtained the information or found the audacity to place it upon their front pages. Now the entire population understands that we turned one mistake into a still greater error.\n\nThe crowds demand that our armed forces withdraw from Dunkirk. Such weakness would unquestionably encourage the separatist movement and render every sacrifice we made in the region worthless. Indeed, withdrawal would differ little from surrendering Dunkirk outright. Yet the reality is that we appear to possess no alternative."
  fcf_international_events.56.desc.b:0 "Once the truth emerged, our people expressed their anger at our reckless imposition of controls upon Dunkirk, leaving the cabinet unprepared for the sudden demonstrations. No one knows how the newspapers obtained the information or found the audacity to place it upon their front pages. Now the entire population understands that we turned one mistake into a still greater error.\n\nThe demonstrations continue to grow and may escape our control unless addressed. Economic difficulties have led the crowds to demand not only withdrawal from Dunkirk, but comprehensive reform. Our intelligence personnel even report the presence of syndicalists among the demonstrators. A syndicalist revolution? We cannot imagine what may happen if this is allowed to continue. We must respond immediately!"
  fcf_international_events.56.a:0 "We will withdraw from Dunkirk—calm the crowds!"
  fcf_international_events.56.b:0 "We will show the rebels no mercy!"
  fcf_international_events.56.c:0 "What did you say—a syndicalist revolution? This is no longer a demonstration! Send in the army!"

  fcf_international_events.57.title:0 "The Dunkirk Militia Uprising"
  fcf_international_events.57.desc:0 "While [29.owner.GetName] remains trapped in the mire of the demonstrations, our underground organizations have hardly remained idle. They have carried out repeated attacks upon the armed forces of [29.owner.GetName] with considerable success. Combined with the weapons and ammunition we supplied, this has allowed them to assemble a substantial militia. With the addition of the small contingent of regular troops we dispatched, almost every condition for an uprising has been satisfied. The only remaining question is where it should begin.\n\nThe most widely supported plan calls for an uprising at the port. Workers are numerous there, and our forces could provide limited assistance by sea. Yet the harbour is itself one of Dunkirk's most important installations, and the enemy presence there will be difficult to eliminate completely. The alternative is to surround the municipal offices and seize local officials as hostages, forcing the armed forces of [29.owner.GetName] to withdraw. This, however, may lead to a confrontation fought across street barricades."
  fcf_international_events.57.a:0 "Attack the port."
  fcf_international_events.57.b:0 "Besiege the municipal offices."

  fcf_international_events.58.title:0 "[29.owner.GetName] Openly Suppresses the Demonstrations"
  fcf_international_events.58.desc:0 "To our astonishment, [29.owner.GetName] has torn away its disguise completely and turned its weapons upon its own people. We do not know how many innocent and decent citizens have died beneath the authorities' brutal repression. Still harsher controls have now been imposed upon Dunkirk. We sympathize with their people, but in the face of such merciless repression, our underground organizations can do nothing."
  fcf_international_events.58.a:0 "One tragedy follows another."

  fcf_international_events.59.title:0 "The Uprising Triumphs!"
  fcf_international_events.59.desc:0 "Through the combined efforts of the insurgent militia and our volunteers, Dunkirk has come almost entirely under militia control. Aside from several remaining forces that continue their hopeless resistance, we can declare that Dunkirk has achieved its liberation! We must now decide whether to proclaim its immediate return to France or allow it first to establish an independent regime, secure recognition from [29.owner.GetName], and join us afterwards. Whatever we decide, we have taken a firm step towards erasing our humiliation."
  fcf_international_events.59.a:0 "Annex Dunkirk directly. [29.owner.GetName] will not dare respond."
  fcf_international_events.59.b:0 "We would be wise to proceed cautiously."

  fcf_international_events.60.title:0 "The Uprising Fails"
  fcf_international_events.60.desc:0 "Although our insurgents fought with every ounce of their strength, the uprising was ultimately suppressed—perhaps because of a mistaken plan, or simply because of the disparity between the opposing forces. The military and police of [29.owner.GetName] have resumed their campaign against the underground organizations. The small formations we dispatched successfully returned to our territory, but the members of the local underground were not so fortunate."
  fcf_international_events.60.a:0 "Their sacrifice will not have been in vain."

  fcf_international_events.61.title:0 "Dunkirk Declares Independence"
  fcf_international_events.61.desc:0 "Difficult though it is to believe, the rebels in Dunkirk have secured complete control over the local situation, while we remain trapped by mass demonstrations. Unless we deploy the army immediately and recover Dunkirk, [FRA.GetName] will probably annex it outright. Yet if we send troops, the demonstrators will become still more hostile, and we may face a nationwide uprising.\n\nIt appears that we have no choice…"
  fcf_international_events.61.a:0 "We shall recognize the independence of Dunkirk…"
  fcf_international_events.61.b:0 "Everything is over…"

  fcf_international_events.62.title:0 "The Flemish Government Recognizes Dunkirk's Independence"
  fcf_international_events.62.desc:0 "The Flemish government has formally recognized the independence of Dunkirk, allowing it to join us without obstruction! At last, we are gradually healing the wounds France suffered during the Weltkrieg—something those bourgeois governments could never have achieved!"
  fcf_international_events.62.a:0 "Long live France!"

  fcf_international_events.63.title.a:0 "[GER.GetName] Occupies the Low Countries"
  fcf_international_events.63.title.b:0 "The Government of the Low Countries Collapses"
  fcf_international_events.63.desc.a:0 "The Dunkirk uprising and nationwide disorder have brought down the Flemish government, prompting its German masters to occupy the region directly and restore order. Rioters have been suppressed and dissidents arrested—the usual methods of [GER.GetName]. Fortunately, however, [GER.GetName] has not responded to our entry into Dunkirk. Our control over the territory now appears to be an established fact."
  fcf_international_events.63.desc.b:0 "The Dunkirk uprising and nationwide disorder have brought down the Flemish government. If this continues, a revolution may erupt within our client state, transforming the buffer between us and [FRA.GetName] into a front line aimed directly at our vital industrial regions. Fortunately, the revolt has not yet become too severe. Deploying troops into the rebellious regions and establishing a new puppet government may be the only means of preventing revolution."
  fcf_international_events.63.a:0 "The weakness of the bourgeoisie."
  fcf_international_events.63.b:0 "Leave them to their fate."
  fcf_international_events.63.c:0 "Why are affairs in our client states always such a disaster?"

  fcf_international_events.64.title:0 "[FRA.GetName] Occupies Dunkirk"
  fcf_international_events.64.desc:0 "Before the Weltkrieg, Dunkirk was an important part of French territory. Yet the republican government's failures during the conflict allowed the region to fall within the German Empire's sphere of influence. Now [FRA.GetName], built upon the ruins of the Republic, has demonstrated its superiority over the former regime. French separatists in Dunkirk launched an uprising to return to [FRA.GetName] and achieved their objective, overthrowing the local rule of the German puppet government. The forces of [FRA.GetName] have now entered this former lost territory, and Dunkirk's return appears to be an accomplished fact."
  fcf_international_events.64.a:0 "The lost territory returns."
  fcf_international_events.64.b:0 "Another face of socialist treachery."
  fcf_international_events.64.c:0 "At least they still consider themselves French."

  fcf_international_events.65.title.a:0 "Our Reckless Intervention"
  fcf_international_events.65.title.b:0 "The Reward for Restraint"
  fcf_international_events.65.desc.a:0 "Only after the truth emerged did we recognize how reckless our actions had been, particularly when contrasted with the restraint of [29.owner.GetName]. We have now become the object of universal criticism and must suspend our intervention in Dunkirk."
  fcf_international_events.65.desc.b:0 "Once the truth emerged, our restraint earned the public's confidence, while the recklessness of [FRA.GetName] produced the opposite result. Our people have begun to regard the French as dangerous monsters and deceitful spreaders of rumours. The underground organizations rooted in Dunkirk will not dare emerge again for some time."
  fcf_international_events.65.a:0 "Then we shall meet again upon the battlefield."
  fcf_international_events.65.b:0 "Justice may be delayed, but it will arrive."

  fcf_international_events.66.title:0 "Drawing Up a New Plan"
  fcf_international_events.66.desc:0 "This accidental incident plainly cannot justify our intervention, and our underground organizations must remain concealed until another opportunity arises. This does not mean that we will simply remain idle. We shall establish still more active contacts with the separatist organizations of Dunkirk. Although the present affair has failed to provide a rapid means of recovering the territory, time has always stood upon our side."
  fcf_international_events.66.a:0 "We have never feared the passage of time."

  fcf_international_events.67.title:0 "[FRA.GetName] Proposes Our Unification"
  fcf_international_events.67.desc:0 "Most of our people speak French—but does speaking French make one French? This question has always occupied a central place within our national narrative. Before we could find the time to resolve it, [FRA.GetName] extended an ‘olive branch.’ Because of our French language, they regard us as fellow Frenchmen—or perhaps as ‘socialist comrades.’ To strict socialists, the national question is hardly a question at all, yet this proposed union involves the transfer of sovereignty. Should we join the French Socialist Federation?\n\nSocialists and syndicalists within our country strongly support the proposal, while conservatives oppose it. After several rounds of debate, the integrationists have gradually secured the advantage. The benefits of joining [FRA.GetName] are plain: a weak country would become part of a world power and enjoy the advantages offered by the leading socialist state. From the national perspective, both peoples are native French speakers with few barriers between them, allowing our integration to proceed easily. Perhaps we have always been French! This argument naturally provoked immediate conservative opposition, although they could identify no advantage beyond preserving an insubstantial independence. Even if we remain sovereign, we must depend upon [FRA.GetName]. If that is the case, why should we not simply become part of the French Socialist Federation?"
  fcf_international_events.67.a:0 "I have always been French!"
  fcf_international_events.67.b:0 "The Walloons are Walloons!"

  fcf_international_events.68.title.a:0 "Wallonia Accepts Unification!"
  fcf_international_events.68.title.b:0 "Wallonia Preserves Its Independence"
  fcf_international_events.68.desc.a:0 "Our socialist comrades and French-speaking compatriots have plainly chosen the correct path. For socialism and for France, they have agreed to join our Federation!"
  fcf_international_events.68.desc.b:0 "The people of Wallonia wish to preserve their independence and have rejected our invitation. In accordance with the principle of national self-determination, we have expressed our regret to the Walloon government. They have missed an opportunity to strengthen the unity of the socialist forces."
  fcf_international_events.68.a:0 "For France! For socialism!"
  fcf_international_events.68.b:0 "They are simply not ready yet."

  fcf_international_events.69.title:0 "Pro-French Syndicalists"
  fcf_international_events.69.desc:0 "Pro-French syndicalists have always existed within our country. Although the more radical factions may have lost the space to survive beneath the government's campaigns of suppression, we must still acknowledge that syndicalism retains a substantial following among our people. Since [FRA.GetName] recovered Dunkirk, the French have plainly begun developing designs upon us.\n\nWe have collected increasing quantities of intelligence concerning underground activity among the workers. Although we have yet to discover decisive evidence, the general conclusion is that [FRA.GetName] has launched an ideological offensive against us."
  fcf_international_events.69.a:0 "Perhaps this is a misunderstanding."
  fcf_international_events.69.b:0 "We must treat this seriously."
  fcf_international_events.69.c:0 "Let us reach an understanding with [FRA.GetName]."

  fcf_international_events.70.title.a:0 "Wallonia Ignores Our Activities"
  fcf_international_events.70.title.b:0 "Wallonia Responds to Our Activities"
  fcf_international_events.70.title.c:0 "Secret Negotiations with Wallonia"
  fcf_international_events.70.desc.a:0 "Our activities have escaped the attention of the Walloon government, which is unquestionably encouraging news. The population resents German domination and the reactionary government, and a substantial number of Walloons have already joined our underground organizations. At the present rate of expansion, we will soon be capable of launching another Walloon Revolution."
  fcf_international_events.70.desc.b:0 "The Walloon government has plainly noticed our underground activities, but its response is inevitably futile and far too late. Enough people have already joined the syndicalist cause. If the reactionary government desires a revolution, then we shall give it one! Perhaps because of the previous revolution, however, the Walloon authorities have responded with comparative restraint, allowing us to continue our plans largely undisturbed."
  fcf_international_events.70.desc.c:0 "To our surprise, the Walloon authorities have tacitly tolerated our activities. More astonishing still, several officials established secret contact with us and revealed that the Walloon government likewise hopes to transform the country into a syndicalist state. Our interests are therefore fundamentally aligned. We seek to achieve the objective through violent revolution, while they favour peaceful reform. Given our intervention, however, they have asked us to follow their plan for securing Walloon independence and transforming the country into a pro-French syndicalist state."
  fcf_international_events.70.a:0 "Speed is the essence of war."
  fcf_international_events.70.b:0 "Advance methodically."
  fcf_international_events.70.c:0 "We are naturally prepared to cooperate."

  fcf_international_events.71.title:0 "Operation Rebirth"
  fcf_international_events.71.desc:0 "When the Walloon authorities failed to respond to the Commune of France's syndicalist propaganda within their country, syndicalists inside the government conceived an idea: they could use the Commune to remove Wallonia from the German sphere and transform it into a syndicalist state. The plan is extremely dangerous and will unquestionably anger Germany, yet it is equally enticing, for such an opportunity may never appear again. Syndicalists and anti-German elements alike have begun referring to the operation as ‘Wallonia's rebirth.’\n\nOperation Rebirth amounts to dancing upon Germany's exposed nerves. Both the Commune of France and Wallonia must trust that Germany, preoccupied by its domestic affairs, cannot spare the strength to intervene in this unfortunate Low Country. Although both sides have confirmed their participation, the precise operation still requires careful consideration. Wallonia must first enter a state of national emergency to remove interference from the parliamentary opposition. France, meanwhile, must appear to threaten Wallonia, convincing the opposition to approve emergency government and persuading Germany to grant Wallonia greater autonomy."
  fcf_international_events.71.a:0 "Only a convincing threat will make the Germans believe the deception."
  fcf_international_events.71.b:0 "Cautious action will offer the greatest chance of success."
  fcf_international_events.71.c:0 "Let us hope the French handle everything properly."

  fcf_international_events.72.title:0 "French Intimidation of Wallonia"
  fcf_international_events.72.desc:0 "Since seizing Dunkirk, [FRA.GetName] has become increasingly audacious, particularly towards the newly established Walloon state. Our intelligence reports limited military movements along the Franco-Walloon frontier. Do the French intend to invade our ally directly? How dare they!\n\nOur Walloon allies have likewise recognized the threat. They have asked us to grant them greater autonomy and authorize a state of national emergency so that they can resist the growing danger from France."
  fcf_international_events.72.a:0 "Naturally. We cannot allow the French to succeed."
  fcf_international_events.72.b:0 "They will be safer beneath German protection."

  fcf_international_events.73.title:0 "Germany Grants Us Greater Autonomy"
  fcf_international_events.73.desc:0 "The actions of [FRA.GetName] have succeeded. The Germans believed our performance and granted us greater autonomy. More importantly, we can now declare a state of national emergency! Once emergency rule begins, we can purge the parliamentary opposition under the pretext of eliminating French spies. We need not fear that they will turn the accusation against us. The French infiltration network has already organized a substantial popular movement that will assist our operations."
  fcf_international_events.73.a:0 "A necessary evil for the revolution."

  fcf_international_events.74.title:0 "The Germans Occupy Wallonia"
  fcf_international_events.74.desc:0 "The Germans have plainly overreacted to [FRA.GetName] and now intend to occupy our territory and defend us against a French attack themselves. Our plan has failed. We cannot possibly launch our transformation while German troops are assembling throughout our country.\n\nNevertheless, we should not abandon the possibility of revolution. For now, however, we can only wait until Germany enters a crisis of its own."
  fcf_international_events.74.a:0 "Tell the French that they have failed."

  fcf_international_events.75.title:0 "The Plan Succeeds"
  fcf_international_events.75.desc:0 "The Germans believed our feigned military movements and granted Wallonia greater authority. The Walloons have now ‘legally’ established a national emergency government. We need only wait patiently for good news from Wallonia."
  fcf_international_events.75.a:0 "We can already see success approaching."
  fcf_international_events.75.b:0 "Remain vigilant. Mobilize our Walloon organizations to assist them."

  fcf_international_events.76.title:0 "A Walloon Lament"
  fcf_international_events.76.desc:0 "Our actions plainly went too far and convinced the Germans so thoroughly that only the deployment of their own army into Wallonia could reassure them. Our plan has consequently failed, and the Walloon authorities have contacted us to express their regret. This is not the end, however. When [GER.GetName] enters a crisis, Wallonia will seize the opportunity to defect to our side."
  fcf_international_events.76.a:0 "Then we shall wait."
  wal_will_revo_in_ww2:0 "§G§Y[WAl.GetName]§! will launch an uprising during a possible future general war§!"

  fcf_international_events.77.title:0 "The Time Has Come!"
  fcf_international_events.77.desc:0 "Germany has entered the world war. This is our opportunity to launch the revolution. We need no longer endure German tyranny. Long live the revolution!"
  fcf_international_events.77.a:0 "Wallonia shall stand!"

  fcf_international_events.78.title:0 "Risking Everything"
  fcf_international_events.78.desc:0 "We have secured absolute control over Wallonia. The time has come to liberate ourselves from German imperialism and comprador capitalism once and for all. We could again petition the Germans to grant us independence voluntarily and subsequently join the Third International, although success is unlikely. Alternatively, we could adopt a more radical course and pressure Germany through a national referendum. The outcome would be uncertain, since we cannot guarantee that the population will endorse our conduct under emergency rule. If the French mobilize their Red network, however, that difficulty will disappear."
  fcf_international_events.78.a:0 "Request independence from Germany."
  fcf_international_events.78.b:0 "Hold a referendum to pressure Germany."

  fcf_international_events.79.title:0 "Wallonia Requests Independence"
  fcf_international_events.79.desc:0 "French intimidation has evidently made this unfortunate country still more insecure. The Walloons claim that France has demanded their independence and will otherwise invade. Our decision-makers regard this possibility with considerable scepticism. Walloon independence would unquestionably weaken our control, but may nevertheless be acceptable if it provides a path towards peace. German companies retain extensive influence in Wallonia, and its independence would therefore cause only limited harm to our interests."
  fcf_international_events.79.a:0 "Grant them independence."
  fcf_international_events.79.b:0 "The French will demand still more. Concessions cannot purchase peace."

  fcf_international_events.80.title.a:0 "Victory in the Referendum"
  fcf_international_events.80.title.b:0 "Defeat in the Referendum"
  fcf_international_events.80.desc.a:0 "Our people have made their choice through a national referendum. Leaving the German Empire and joining the Commune of France is the only way forward! If we desire peace, we must do this. If we desire security, we must do this. If we desire justice, we must do this! The people have spoken, and the world will hear the voice of Wallonia!"
  fcf_international_events.80.desc.b:0 "Our people plainly failed to understand everything we have done. Their blindness has cost us the finest opportunity. The Germans have recovered from their confusion and deployed troops into our territory once again. Our efforts have been wasted. We can now do nothing but await a crisis sufficiently severe to weaken Germany and launch our revolution then."
  fcf_international_events.80.a:0 "Drive the Germans out!"
  fcf_international_events.80.b:0 "Tell the French that we have failed."

  fcf_international_events.81.title.a:0 "Germany Accepts Our Independence"
  fcf_international_events.81.title.b:0 "Germany Refuses Our Independence"
  fcf_international_events.81.desc.a:0 "Domestic pressure and a vain hope for peace have forced the Germans to accept our request. Our plan advances step by step towards success! Once the last German has withdrawn from our territory, we can join the Third International as a sovereign country!"
  fcf_international_events.81.desc.b:0 "The Germans possess no mercy. Losing all patience with our request, they dispatched troops into our territory to ‘protect’ us. Our plan has plainly failed. We can only wait until Germany enters a crisis before striking again."
  fcf_international_events.81.a:0 "Tell the Germans to hurry!"
  fcf_international_events.81.b:0 "Tell the French that we have failed."

  fcf_international_events.82.title.a:0 "Wallonia Reborn!"
  fcf_international_events.82.title.b:0 "Wallonia Achieves Independence"
  fcf_international_events.82.desc.a:0 "The German army has withdrawn completely from our territory, and we are now an independent political entity. Our purpose remains unchanged: to overthrow imperialism and the comprador class, join the Third International, and transform Wallonia into a syndicalist state."
  fcf_international_events.82.desc.b:0 "The German army has withdrawn completely from Walloon territory, leaving Wallonia an independent political entity. According to the plan, it will now join the Third International and transform itself into a syndicalist state!"
  fcf_international_events.82.a:0 "Farewell, Germania!"
  fcf_international_events.82.b:0 "The French nation unites beneath syndicalism!"

  fcf_international_events.83.title:0 "Wallonia Demands Independence by Referendum"
  fcf_international_events.83.desc:0 "French military threats have produced political unrest within our Walloon ally, prompting its government to demand a referendum upon the country's future. Its action is entirely legitimate, and as the world's leading power, we must preserve our reputation. Reckless interference in Walloon politics would undoubtedly damage our standing among the neutral countries. Walloon independence would weaken our control, but may remain acceptable if it offers a path towards peace. After all, our companies continue to exercise enormous influence in Wallonia, and independence would cause only limited harm to our interests."
  fcf_international_events.83.a:0 "Grant them independence."
  fcf_international_events.83.b:0 "Remind them who their master is."

  fcf_international_events.84.title:0 "The Red March through Wallonia"
  fcf_international_events.84.desc:0 "The Walloon authorities' misguided neglect has dealt them a fatal blow. We have successfully established a powerful Red underground movement. By cooperating with the syndicalists who survived the earlier repression, we have assembled an enormous force that should be capable of launching a revolution before long. This will naturally provoke German intervention—but so what? If Germany dares intervene against the Walloon Revolution, it will experience our fury!"
  fcf_international_events.84.a:0 "Begin the operation!"

  fcf_international_events.85.title.a:0 "Reckless Action"
  fcf_international_events.85.title.b:0 "Eliminating the Bandits"
  fcf_international_events.85.desc.a:0 "Our excessively aggressive conduct allowed the accursed bourgeoisie and the lackeys of imperialism to turn the iron boots of the military against the people and bring their blades down upon them. Although we fought these demons fiercely, their army outnumbered us several times over and possessed equipment vastly superior to that of our militia. They slaughtered our organizations almost completely. We have lost the ability to operate within the region, but will never abandon the struggle!"
  fcf_international_events.85.desc.b:0 "Our army has successfully suppressed the militia of the syndicalist thugs. Many people died, but at least the incessant noise of syndicalism has finally disappeared. The greatest threat to Wallonia has been eliminated. If the French attempt any further trickery, they will encounter nothing but our iron boot."
  fcf_international_events.85.a:0 "We shall meet upon the battlefield."
  fcf_international_events.85.b:0 "A necessary sacrifice."

  fcf_international_events.86.title:0 "Scandal within the Walloon Administration"
  fcf_international_events.86.desc:0 "While establishing our underground network, we discovered several scandals within the Walloon administration that ‘the public must never learn.’ Most concern secret agreements between the authorities and German companies. Even Walloons accustomed to living beneath a German puppet regime would find these arrangements intolerable, while the German public would likewise oppose them if they became known. We can exploit this opportunity to advance our plan.\n\nRevealing the information to the Walloon population would provide our operations with unimaginable support. Revealing it to the German people might instead force Germany to loosen its control over Wallonia beneath public pressure, which would likewise benefit us."
  fcf_international_events.86.a:0 "Publicizing them in Wallonia will suffice."
  fcf_international_events.86.b:0 "Show the Germans the ugliness of their own conduct."

  fcf_international_events.87.title:0 "Syndicalist Revolution!"
  fcf_international_events.87.desc:0 "Our failure to contain the infiltration of [FRA.GetName] has allowed the French to organize a powerful underground Red movement within our territory. Syndicalist bandits have poured into the streets and begun attacking our police and military. More infuriating still, they have started plundering German property without restraint. Former gentlemen and dignitaries are seized by the hair and thrown to the ground, where a single bullet ends their lives. Growing numbers of ordinary people are joining this vast revolt, and chaos fills every street and alley.\n\nA syndicalist militiaman bursts into a government office and points his weapon at a mild-mannered civil servant. His face covered in wrinkles and plainly exhausted, the clerk opens his arms towards the insurgent, understanding that there is no escape. Staring at the young man before him, he cries out furiously: ‘Go on, shoot! You traitor! When you have become slaves of syndicalism, remember that you chose this evil path yourselves! This revolt will achieve nothing! The French will abandon you, and all that awaits you is the German iron heel!’\n\nThe young man smiles, draws a deep breath, and pulls the trigger."
  fcf_international_events.87.a:0 "‘Sir, this is not a revolt. It is a revolution.’"

  fcf_international_events.88.title:0 "Someone Exposes the Scandal"
  fcf_international_events.88.desc:0 "Some unknown bastard has exposed our secret relationship with German companies, and the accursed scandals are now discussed in every street and alley. Our citizens may have accepted our subordination to Germany as an established fact, but these revelations exceed the limits of their tolerance. Growing numbers are entering the streets spontaneously to protest against our rule and German manipulation."
  fcf_international_events.88.a:0 "Deploy the army to suppress them."
  fcf_international_events.88.b:0 "Contact the Germans."

  fcf_international_events.89.title:0 "The Walloon Scandal"
  fcf_international_events.89.desc.a:0 "The secret agreements between our companies and the Walloon government have been exposed and widely circulated among our citizens. This will unquestionably damage both our relationship with Wallonia and the interests of our companies. Yet people misled by this ‘false public opinion’ have already entered the streets and begun demonstrating. They demand ‘justice’ for Wallonia, greater Walloon autonomy, and a thorough investigation of the companies involved. We cannot accept such demands. These companies exercise considerable influence upon our economy. The foolish demonstrators have been deceived by lies, yet we cannot simply ignore them. Some have suggested granting Wallonia a measure of autonomy, if only to silence these tiresome crowds."
  fcf_international_events.89.desc.b:0 "The secret dealings between our government and German companies have been exposed. Not only our people, but the Germans themselves have learned of these disreputable arrangements. Germans and Walloons alike have entered the streets beneath banners demanding the same thing: an investigation of the German companies. This is not a decision we can make, however. The Germans will determine the outcome."
  fcf_international_events.89.a:0 "What harm can there be in granting it?"
  fcf_international_events.89.b:0 "Suppress the affair!"
  fcf_international_events.89.c:0 "All we can do is wait."

  fcf_international_events.90.title:0 "Popular Resistance"
  fcf_international_events.90.desc:0 "The situation has plainly exceeded our expectations. The ordinarily unarmed population has somehow acquired weapons, including a number of firearms. Fighting immediately erupted around the barricades. Our police and military, facing a militia several times their own size, possessed no corresponding advantage in experience and were rapidly defeated. Our only remaining hope is that the German army will assist us. Otherwise, we may be confronted by a revolution!"
  fcf_international_events.90.a:0 "The revolution is irresistible!"
  fcf_international_events.90.b:0 "The Germans arrived in time."

  fcf_international_events.91.title:0 "The Situation in Wallonia Escapes Control"
  fcf_international_events.91.desc:0 "The population of Wallonia has turned against the local authorities over the scandal involving our companies, while demonstrators are now preventing the government from functioning normally. According to the Walloon reports, syndicalists may be directing the unrest. [FRA.GetName] was probably responsible for exposing the scandals, but we possess no definite evidence."
  fcf_international_events.91.a:0 "This remains a Walloon affair."
  fcf_international_events.91.b:0 "But the interests of our companies must not suffer."

  fcf_international_events.92.title:0 "Germany Grants Greater Autonomy"
  fcf_international_events.92.desc:0 "Confronted by domestic demonstrations, the Germans have ultimately adopted a compromise and granted us greater autonomy to calm the unrest within their own country. For us, however, this is almost catastrophic. German troops are withdrawing from our territory. Germany has effectively abandoned us. If the population adopts still more radical methods, we may be incapable of responding effectively!"
  fcf_international_events.92.a:0 "Germany has delivered us to the syndicalists."

  fcf_international_events.93.title:0 "Germany Strikes with an Iron Fist"
  fcf_international_events.93.desc:0 "The Germans are plainly no friends of disorder. They have shown little mercy towards the troublesome crowds, for they require stability—especially when these disturbances were created by syndicalist thugs. Once the Germans have resolved matters within their own country, the great German army will sweep away the bandits within our territory as well. Justice has triumphed over evil once again!"
  fcf_international_events.93.a:0 "Let us hope the people forget those scandals."

  fcf_international_events.94.title:0 "The Walloon Independence Movement Revives"
  fcf_international_events.94.desc:0 "We have continually suppressed the pro-French Walloon syndicalist movement since the Belgian Crisis. Yet our officials recently reported the discovery of Walloon syndicalist organizations that should have disappeared. This is deeply alarming. Has the French seizure of Dunkirk stirred rebellious sentiment among the Walloons inside our country? Whatever the explanation, we cannot possibly tolerate such activity!"
  fcf_international_events.94.a:0 "This must be another French conspiracy!"
  fcf_international_events.94.b:0 "We have more important matters to consider."

  fcf_international_events.95.title:0 "[34.owner.GetName] Takes Action"
  fcf_international_events.95.desc:0 "Since the Belgian Crisis, we have reorganized the suppressed Walloon syndicalists, while Walloon separatists who previously rejected syndicalism have gradually joined us after experiencing the bourgeois iron heel. Our work initially proceeded smoothly. With the assistance of the Walloon separatists, the syndicalist underground has almost completely recovered. Recently, however, the local police have begun pursuing our organizations. Such repression occurred before, but has become increasingly frequent. Informants within the government report that the authorities of [34.owner.GetName] have begun treating the Walloon independence movement seriously and intend to expand political surveillance throughout the region."
  fcf_international_events.95.a:0 "Direct confrontation will increase our influence considerably."
  fcf_international_events.95.b:0 "We would be wise to play the long game."

  fcf_international_events.96.title:0 "Anti-Government Attacks in Wallonia"
  fcf_international_events.96.desc:0 "Separatism in Wallonia has become steadily more serious. At first, the separatists merely threw stones at our police when they were not looking. Later, they attempted to help imprisoned comrades escape. Now they have dared launch an open attack upon our municipal offices!\n\nWhen the attackers departed the following morning, our reinforcements found only devastation. We do not yet know who organized the assault or what its precise objective may have been. Whatever the answer, the attack represents an unmistakable challenge to the authority of our government."
  fcf_international_events.96.a:0 "Increase the severity of the repression."
  fcf_international_events.96.b:0 "The thugs will strike again. Let us prepare an ambush."

  fcf_international_events.97.title:0 "Mounting Tension in Wallonia"
  fcf_international_events.97.desc:0 "Our attack upon the municipal offices has plainly enraged the reactionary ruling class of [34.owner.GetName], which is gradually deploying additional police and military forces into Wallonia. Although popular support has allowed our organizations to fight back, the disparity in strength cannot be overcome through the goodwill of the population alone. Several advisers believe we should increase our assistance—not merely by supplying weapons, but by sending personnel as well."
  fcf_international_events.97.a:0 "Weapons will suffice."
  fcf_international_events.97.b:0 "The International Columns are more than an empty slogan."

  fcf_international_events.98.title:0 "The Conflict Escalates"
  fcf_international_events.98.desc:0 "Walloon separatism has developed from scattered anti-government activity into a full security war. Our police and military have become trapped by attacks from syndicalist bandits who appear and vanish without warning. Over the past several days, the former guerrilla conflict has even developed into fighting across street barricades. We have effectively lost several areas, and our forces can no longer penetrate them.\n\nOur military staff recommends abandoning most of the region temporarily and concentrating upon several key enemy strongholds. Although the development of barricade fighting is dangerous, the bandits have also lost their mobility and can now do little more than defend their safe areas. We could concentrate our superior forces and eliminate them in a single operation. The local chief of police, however, rejects any strategy involving the surrender of territory and instead favours a gradual advance. The immobilized bandits will find it difficult to obtain supplies. If we remain patient, we will eventually prevail."
  fcf_international_events.98.a:0 "Storm their principal strongholds."
  fcf_international_events.98.b:0 "Hold firm and a solution will emerge."

  fcf_international_events.99.title:0 "A Fatal Mistake"
  fcf_international_events.99.desc.a:0 "We gravely underestimated the strength of the syndicalist thugs. Somehow, they have developed a fighting capacity comparable to that of our regular police and military. Our assault upon the rebel concentrations consequently became a trap for our own forces. Large numbers of soldiers and police entered the occupied districts only to be subdued immediately, further weakening our suppression force. This humiliating defeat has emboldened the rebels. Since we abandoned other areas to concentrate upon their strongholds, the bandits have exploited the gaps and expanded elsewhere. Aside from several military bases, the entire Walloon region has effectively fallen."
  fcf_international_events.99.desc.b:0 "We seriously underestimated the rebels' mobility. Although they established several permanent strongholds, this did not mean that they had abandoned the remainder of the region. By dispersing our forces throughout Wallonia, we allowed the enemy to concentrate superior strength against individual positions and gradually expand its bases. The weakness of our police and military provided the syndicalist traitors with an opportunity to isolate, encircle, and completely destroy or capture our formations. Aside from several military bases, the entire Walloon region has effectively fallen."
  fcf_international_events.99.a:0 "What are we supposed to do now!?"

  fcf_international_events.100.title:0 "Wallonia Declares Independence"
  fcf_international_events.100.desc:0 "Since the failure of the 1936 independence crisis, Walloon separatists have become increasingly sympathetic to syndicalism. Although Germany and the [34.owner,GetName] authorities both suppressed the syndicalists, covert French assistance allowed the underground organizations of syndicalist Wallonia to survive and steadily expand their influence among the separatists. Recently, the Walloon syndicalist organizations announced that Wallonia would secede from [34.owner,GetName] and establish an independent syndicalist political entity.\n\nAlthough [34.owner.GetName] has attempted desperately to deny the report, the Walloon separatists have already secured effective control of the region and established a complete independent administration. Walloon independence has become an accomplished fact."
  fcf_international_events.100.a:0 "Damn the syndicalist bastards!"
  fcf_international_events.100.b:0 "Long live our Walloon comrades!"

  fcf_international_events.101.title:0 "The Plan Succeeds"
  fcf_international_events.101.desc.a:0 "Our concentrated assault has achieved complete success, and the syndicalist traitors are retreating everywhere. Since they remain little more than an untrained militia, our concentrated forces rapidly cleared the improvised defensive positions they had constructed. After recovering the occupied districts, we immediately began a comprehensive purge throughout Wallonia. For some time, at least, the syndicalist thugs will be unable to cause further trouble."
  fcf_international_events.101.desc.b:0 "Our defensive strategy has proven successful. Deprived of the broad regions that supported them, the rebels were forced to launch repeated attacks upon our positions, while our superior forces waited for them in prepared defences. Whenever they left their strongholds to conduct operations elsewhere, our police and military immediately destroyed the abandoned bases. After recovering the occupied districts, we began a comprehensive purge throughout Wallonia. For some time, at least, the syndicalist thugs will be unable to cause further trouble."
  fcf_international_events.101.a:0 "The vermin are finally dead."

  fcf_international_events.102.title:0 "Trapped in the Quagmire"
  fcf_international_events.102.desc:0 "Our security operations in Wallonia have produced the opposite of their intended effect. The absence of proper regulations has caused many innocent Walloons to suffer, driving growing numbers who previously held no opposition to the government into the ranks of the syndicalist rebels. The cost of preserving order has increased enormously, while attacks upon government institutions have risen from one per day to more than anyone can count. Our officials have asked whether we should withdraw strategically from Wallonia to placate the population. Continuing this oppressive rule will merely accelerate the development of Walloon separatism."
  fcf_international_events.102.a:0 "Evidently, we have not killed enough of them!"
  fcf_international_events.102.b:0 "We have already lost the people of Wallonia."

  fcf_international_events.103.title:0 "The Great Walloon Uprising"
  fcf_international_events.103.desc:0 "Our massacre of syndicalists in Wallonia has finally ignited resistance throughout the region. The Walloons are arming themselves with improvised weapons and confronting us openly. Our superior equipment means little when faced with the fury of the entire Walloon people. Underground syndicalist organizations have likewise emerged into the open and publicly denounced our slaughter.\n\nAlmost every Walloon has sided with the syndicalist thugs. Even the Walloons serving within our police and military have mutinied. The entire region has descended into a frenzy of anti-government resistance, and there is nothing we can do."
  fcf_international_events.103.a:0 "How could this happen!?"

  fcf_international_events.104.title:0 "Waiting for the Prey"
  fcf_international_events.104.desc:0 "Our plan has proceeded perfectly. The reckless syndicalist thugs have entered the trap we prepared for them. Our police and military rapidly eliminated the scattered syndicalist rebels and imposed martial law throughout Wallonia. The speed and precision of the operation prevented the Walloons from developing any significant hostility towards us. We have successfully defended the region against syndicalist infiltration."
  fcf_international_events.104.a:0 "Perfect."

  fcf_international_events.105.title:0 "A Protracted Struggle"
  fcf_international_events.105.desc:0 "The restrained response of the [34.owner.GetName] authorities may not be entirely disadvantageous. Although their failure to exercise open tyranny prevents us from winning the population rapidly, it also allows us to address the Walloon question through a conflict of limited intensity."
  fcf_international_events.105.a:0 "Advance methodically."

  fcf_international_events.106.title:0 "Purging the Infiltrators?"
  fcf_international_events.106.desc:0 "Our struggle against the Walloon separatists has gradually become permanent, forcing us to deploy still more armed forces into the region. At the same time, we have continually promoted loyal Walloons to serve as informants and monitor every movement of the rebels. Yet this policy has provided the syndicalist thugs with opportunities of their own. Their personnel have infiltrated our forces and begun sabotaging our operations. Although we have apprehended several infiltrators, our intelligence indicates that many Walloon agents remain within our armed formations.\n\nOur German advisers recommend dismissing every Walloon member of the police and military to prevent further infiltration. Our own officials believe that stricter screening will suffice. Removing the Walloon personnel would both weaken the forces available for maintaining order and reduce the willingness of the local population to cooperate, making Walloons still more likely to join the rebels."
  fcf_international_events.106.a:0 "We require a force without Walloons."
  fcf_international_events.106.b:0 "Expanding the purge of infiltrators will suffice."

  fcf_international_events.107.title:0 "Victory over the Thugs"
  fcf_international_events.107.desc:0 "After tightening our screening for infiltrators, we also began recruiting collaborators within Wallonia. Through our sustained efforts, the syndicalist forces were ultimately compressed into a small area. With the assistance of the German army, we launched a general encirclement and suppression campaign. We suffered considerable losses of our own, but syndicalism has effectively lost its vitality in Wallonia."
  fcf_international_events.107.a:0 "The troublemakers have disappeared."

  fcf_international_events.108.title:0 "Confusion"
  fcf_international_events.108.desc:0 "To our surprise, the authorities of [34.owner.GetName] have chosen to ignore the increasingly powerful Walloon syndicalist movement reorganized after the Belgian Crisis. Walloon separatists who once sympathized with independence but rejected syndicalism have gradually joined the revolutionary camp after experiencing the iron heel of the reactionary bourgeoisie. Yet the succession of sabotage operations we recently organized in Wallonia has provoked no government response, leaving us deeply confused. Some consider this proof of the government's weakness and demand more aggressive action from the Walloon syndicalist organizations. Others believe that it may be a government conspiracy—that this apparent inaction is intended to lure us into the open, and that an impulsive operation would carry us directly into their trap.\n\nOur informants inside the government have yet to determine its official intentions. Are the authorities acting with great cunning, or have they simply been careless? Only time can answer. For now, we can do nothing but gamble upon which interpretation is correct. If the government is genuinely doing nothing, our hesitation will cost us a valuable opportunity. If it has prepared a conspiracy, our impatience may produce a far greater disaster."
  fcf_international_events.108.a:0 "The government is overwhelmed. We must seize the opportunity."

  fcf_international_events.109.title:0 "Burying One's Head in the Sand"
  fcf_international_events.109.desc:0 "Our decision to tolerate the Walloon syndicalists has plainly not persuaded them to lay down their weapons and return to peaceful life. Instead, they have redoubled their efforts to obstruct our rule in Wallonia. Within only a few days, syndicalist thugs attacked municipal offices, police stations, courts, and even the camps of the local garrison. Their movements are so unpredictable that we cannot determine when or where defences should be prepared. Maintaining continuous protection would be unrealistic and impose a substantial additional burden upon our finances. Preserving the existing arrangements is equally impossible, since repairing the destruction caused by the thugs likewise consumes public funds.\n\nEvery available choice will plainly place still more pressure upon our already fragile economy. The military naturally welcomes additional security funding, while the civil administration favours a more peaceful solution: negotiations. This is ultimately a historical problem, and endless repression will produce only greater resistance. If we wish to resolve the Walloon question permanently, perhaps we must negotiate with the rebel leaders.\n\nBut is such a thing possible? The military dismisses the proposal with contempt. Negotiations with syndicalist thugs can end only in betrayal. There is one and only one proper way to deal with such deranged people: send them to meet God. Yet as the civil administration warns, armed repression of the Walloons will most probably destroy every remnant of local support for our government and drive loyal Walloons needlessly into the arms of the revolutionaries."
  fcf_international_events.109.a:0 "Increase security funding in Wallonia."
  fcf_international_events.109.b:0 "Strike the syndicalist thugs with an iron fist."
  fcf_international_events.109.c:0 "Let us negotiate. It is the only road to peace."

  fcf_international_events.110.title:0 "Better Late than Never"
  fcf_international_events.110.desc:0 "The government of [34.owner.GetName] has finally responded—so late that even we, the supposed ‘anti-government forces,’ can hardly believe its delay. Had the authorities acted earlier, the sudden arrival of additional hostile forces might genuinely have thrown us into confusion. Yet the government moved far too slowly. Our organizational network already extends throughout Wallonia, and any attempt to eliminate us in a single operation will accomplish nothing.\n\nSome comrades within the Walloon syndicalist organizations have begun mocking the government's incompetence. Others remain comparatively restrained, recognizing that an increase in enemy strength is never cause for celebration. They favour preserving the existing plan and advancing the Walloon Revolution gradually. This is what the present stage requires. Another group, filled with revolutionary optimism, demands that we expand our achievements still further, progressing from harassment to outright occupation. If the government forces have finally become serious, perhaps the time has come for us to emerge from the shadows."
  fcf_international_events.110.a:0 "Assemble openly!"
  fcf_international_events.110.b:0 "History has already recorded the consequences of reckless advance."

  fcf_international_events.111.title:0 "Routed"
  fcf_international_events.111.desc:0 "Incredibly, our police and military have been thrown into confusion by the Walloon insurgents. Our unwillingness to invest adequate resources in maintaining order has become a nightmare. Wallonia has descended into civil war. Unless we deploy the army, revolution may be the only outcome awaiting us."
  fcf_international_events.111.a:0 "Send in the army."
  fcf_international_events.111.b:0 "Spend more upon maintaining order."

  fcf_international_events.112.title:0 "Unexpected Negotiations"
  fcf_international_events.112.desc:0 "To our astonishment, the government of [34.owner.GetName] has extended an olive branch. They actually wish to negotiate with us? Our movement has divided into two camps. One considers the offer nothing more than bourgeois hypocrisy, while the other regards it as an opportunity to achieve independence peacefully. Comrades who once addressed one another as brothers have begun trading accusations of treason, compromise, weakness, madness, and immorality. If the objective of the [34.owner.GetName] government was to divide the Walloon syndicalists, it nearly succeeded.\n\nWith the assistance of our mediators, we ultimately agreed to settle the matter through a secret ballot. Since every side refuses to yield, the minority must accept the decision of the majority. Our objective remains the same; only our methods differ. Which method will prove more effective cannot possibly be determined through speculation inside a meeting room. Acting upon an incorrect decision is more consistent with our revolutionary principles than remaining indoors and accomplishing nothing while arguing endlessly over which theory possesses greater validity.\n\nOnce every leading figure within the Walloon syndicalist organizations had cast a ballot, the tellers began announcing the result…"
  fcf_international_events.112.a:0 "…The weakness of the bourgeoisie will become the rope upon which they hang."

  fcf_international_events.113.title:0 "Wishful Thinking"
  fcf_international_events.113.desc:0 "The syndicalist thugs—just as our officers predicted—have shamelessly rejected our gesture of goodwill. We alone have been left humiliated. Those useless civil servants never understood the true nature of the enemy. These are demons intent upon devouring us, yet the bureaucrats still entertained illusions about reasoning with such madmen.\n\nWhat can we do now? The syndicalist thugs are seizing territory throughout Wallonia while we pretend not to see them. Growing numbers of people have been deceived into opposing us, yet we cannot even deploy the army into the region. This is no longer a rebellion, but an outright civil war. Our troops are straining at the leash. The time has come for the traitors to experience the iron fist!"
  fcf_international_events.113.a:0 "I will send every last one of them to heaven!"

  fcf_international_events.114.title:0 "A Glimmer of Hope?"
  fcf_international_events.114.desc:0 "To our delight, the syndicalists have agreed to negotiate with the government. We selected a location inside Wallonia—their stronghold—both to demonstrate our sincerity and because they refused to negotiate elsewhere. After repeated deliberation, we ultimately took this step because such a valuable opportunity could not be wasted. We have extended sufficient goodwill, and the people of Wallonia have witnessed it. If the syndicalists attempt any treachery during the talks, it will be their reputation that suffers rather than ours.\n\nAlthough we prepared our negotiating position in advance, their demand for independence still shocked us. And what would follow independence? The establishment of a syndicalist state and its entry into the Third International? Accepting such terms would amount to digging our own grave. If negotiations are to continue, we cannot concede their original demand. Yet what alternative can we offer?"
  fcf_international_events.114.a:0 "Grant them extensive autonomy."
  fcf_international_events.114.b:0 "Offer economic compensation."
  fcf_international_events.114.c:0 "Enough negotiations. Thugs will always remain thugs!"

  fcf_international_events.115.title:0 "An Ugly Spectacle"
  fcf_international_events.115.desc.a:0 "[34.owner.GetName] has finally revealed its true nature. We have been deceived once again. The supposed negotiations were merely a device intended to distract us. The government has ignored every demand of the Walloon people, so there is nothing further to discuss. If the authorities betray the Walloons, they cannot complain when the Walloons side with syndicalism."
  fcf_international_events.115.desc.b:0 "What are we doing? First we entered negotiations, and now we have abandoned them ourselves. Wallonia has already fallen in practice. What remains within our power? The end will arrive however long we delay it. What can anyone do at such a moment?\n\nThe Walloon people have abandoned us and entered the arms of the syndicalists. How should we feel? As fellow puppets of Germany, should we envy those prepared to sacrifice everything for freedom? Or perhaps…"
  fcf_international_events.115.a:0 "The revolution has arrived!"
  fcf_international_events.115.b:0 "Perhaps we too must change."

  fcf_international_events.116.title.a:0 "Buying Us Off"
  fcf_international_events.116.title.b:0 "Deceiving Ourselves"
  fcf_international_events.116.desc.a:0 "Economic compensation? The government of [34.owner.GetName] appears to have descended into madness. We entered negotiations over independence, and they respond by discussing financial compensation? There is no reason to continue these talks. The [34.owner.GetName] government seeks only to delay the advance of our revolution. We have nothing to discuss with these parasites, nor is any discussion possible!"
  fcf_international_events.116.desc.b:0 "The syndicalist thugs have rejected our proposal, and what can we do? During the negotiations, Wallonia effectively fell into their hands. Independence is now merely a question of whether they choose to proclaim it. The Flemish government has long since lost every means of controlling Wallonia. Everything we have done amounts to little more than a performance intended to deceive ourselves."
  fcf_international_events.116.a:0 "The revolution should have arrived long ago."

  fcf_international_events.117.title:0 "Autonomy"
  fcf_international_events.117.desc:0 "Independent elections, an independent government, and an independent army—how does this differ from independence? Wallonia would recognize the Flemish government's nominal sovereignty and remain within the Reichspakt, while simultaneously possessing a pro-French syndicalist government of its own. Have they lost their minds?"
  fcf_international_events.117.a:0 "Why are we negotiating with a pack of fools?"

  fcf_international_events.118.title:0 "Subsidized Minorities"
  fcf_international_events.118.desc:0 "The dissatisfaction of the minorities within our territory towards Kostantiniyye has long been common knowledge. The shadows of the Weltkrieg and the Arab Revolt still hang over the Empire, while our limited post-war concessions have failed to satisfy their treacherous ambitions. Reliable reports now indicate that they have dared establish contact with the Reds of Western Europe. Leaflets proclaiming ‘national liberation’ circulate alongside pamphlets advocating ‘syndicalist revolution’ in regions beyond the reach of Kostantiniyye. From our perspective, if even our earlier secularizing reforms provoked local resistance, how could godless and fatherless Red doctrines possibly gain widespread support?\n\nYet we must acknowledge that growing evidence points towards the weakening of our authority in the remote regions. Supplies from Paris travel through underground black markets beyond our control and reach traitors seeking to divide the Empire. Worse still, these thugs have begun attacking our rule directly. Police units in remote districts have been assaulted, and even local arsenals have been looted. We cannot determine whether these incidents formed part of an organized conspiracy or represented only a momentary outburst. We can be certain, however, that those inclined towards rebellion have acquired greater means to oppose us."
  fcf_international_events.118.a:0 "Damn the French!"
  ott_decrease_syr_int:0 "Reduce §YIntegration in the Syrian Vilayets§! by $RIGHT|R0%%$"
  ott_decrease_kur_int:0 "Reduce §YIntegration in the Kurdish Vilayets§! by $RIGHT|R0%%$"

  fcf_international_events.119.title:0 "Another Assassination!"
  fcf_international_events.119.desc:0 "During a recent inspection, our great Shah was struck by a bomb planted by the accursed socialists and now lies between life and death. The royal physicians are doing everything possible to save His Majesty, but the thugs have no intention of allowing the situation to calm. Their objective is not merely the Shah's life, but the destruction of the entire monarchy. With no one firmly in command, unrest has begun spreading through the army, while fear of revolution consumes the government. Everyone is planning an escape route before the revolution even begins, although whether it will occur remains uncertain. If the Shah survives, everything will be well!"
  fcf_international_events.119.a:0 "All we can do is pray for the Shah…"

  fcf_international_events.120.title:0 "Revolution!"
  fcf_international_events.120.desc:0 "As soon as news of the Shah's death spread, everyone understood the gravity of the situation. Members of the royal family fled in every direction along routes prepared in advance, while the legislators began fearing the reckoning that the approaching revolution might bring upon them. Every Iranian appeared convinced that revolution was inevitable—and so it proved.\n\nThe revolution proceeded so rapidly that no civil war occurred. The army accepted its arrival, while the monarchists scattered amid a wave of defeatism. The Justice Party proclaimed a socialist republic, and the overwhelming majority of Iranians accepted the outcome they had long anticipated."
  fcf_international_events.120.a:0 "Long live the revolution!"

  fcf_international_events.121.title:0 "The Shah Lives!"
  fcf_international_events.121.desc:0 "Inspiring news has arrived from the royal physicians. Although His Majesty the Shah was struck directly by the bomb, he has miraculously survived—albeit with severe injuries. Hope has returned, and the dreaded revolution has not arrived after all. This was merely another malicious attempt upon the Shah's life."
  fcf_international_events.121.a:0 "An unpleasant interruption."

  fcf_international_events.122.title:0 "The Socialists Demand Power"
  fcf_international_events.122.desc:0 "Although our opposition to the Shah once allowed us to cooperate with the socialists, the socialist Justice Party has continually attempted to expand its influence since the republican revolution. Its support among peasants and workers vastly exceeds our own. If our democracy genuinely operated according to the principle of one person, one vote, the Justice Party would plainly defeat us in a free election.\n\nEvents have demonstrated that they possess no such patience. Our advisers have informed the President that unless we accept the Justice Party's demand for a transfer of power, another revolution may follow—this time directed against us."
  fcf_international_events.122.a:0 "We have no choice."
  fcf_international_events.122.b:0 "We will not yield an inch."

  fcf_international_events.123.title:0 "The Second Revolution"
  fcf_international_events.123.desc:0 "Just as our advisers predicted, the socialists launched an armed coup once they learned that the present government refused to yield. Tragically, not a single person was willing to defend this short-lived democratic regime. After several hours of fighting, the President announced his surrender, and the Republic came to an end."
  fcf_international_events.123.a:0 "But a socialist republic has arisen!"

  fcf_international_events.124.title:0 "Democracy Survives"
  fcf_international_events.124.desc:0 "To our surprise, the revolutionaries displayed considerable restraint. Whether because they wished to avoid another civil war or because of some other political calculation, the socialist revolution ultimately did not occur. Our negotiating skill has allowed the Republic to survive the greatest threat it has faced since its establishment. The socialists may continue their activities upon the soil of the fatherland, while we preserve the political life of the Republic."
  fcf_international_events.124.a:0 "Long live the Republic!"

  fcf_international_events.125.title:0 "Our Attitude towards Egypt"
  fcf_international_events.125.desc:0 "Although [EGY.GetName] is not a socialist comrade—and is, indeed, a monarchy still more reactionary than bourgeois democracy—it has stood upon the front line of resistance against Ottoman hegemony in the Middle East since the 1925 Revolution. Whatever its reasons for supporting national liberation movements within the Ottoman Empire, we stand beside Egypt in its opposition to imperialist colonialism.\n\nGerman investment has created the danger that Egypt may enter Berlin's orbit. Yet Germany, devastated by the economic crisis, can no longer maintain its overseas business operations there, while Egypt itself is searching for foreign investment to escape the same crisis. This is unquestionably the finest opportunity to expand our economic influence within this great Middle Eastern power. At the same time, the newly enthroned [EGY.GetLeader] has introduced many uncertainties into Egyptian politics. We might go still further and persuade this young monarch to reform Egypt into a more progressive country."
  fcf_international_events.125.a:0 "It is time to take the Germans' place."
  egypt_coop_economy:0 "We will attempt to conclude a series of economic cooperation agreements with §Y[EGY.GetName]§!."
  FCF_international_EGY_economic_cooperation:0 "Franco-Egyptian Cooperation Agreement"
  fcf_international_events.125.b:0 "The lives of the Egyptian people matter more."
  egypt_coop_politics:0 "We will attempt to influence political reform in §Y[EGY.GetName]§! through economic investment."
  fcf_international_events.125.c:0 "Seriously, why are they still a monarchy?"
  egypt_coop_revolution:0 "We will attempt to use economic investment to spread revolutionary ideas secretly among the population of §Y[EGY.GetName]§!.\n§RThis may, however, anger [EGY.GetName].§!"
  egypt_accept_cooperation:0 "[EGY.GetName] Accepts Cooperation"

  fcf_international_events.126.title:0 "A Different Kind of Frenchman"
  fcf_international_events.126.desc.a:0 "The French have always represented imperialism and colonialism in our eyes, and we will never forget their conduct in Africa and the Middle East. During the Weltkrieg, however, the French overthrew their government, while those we knew as colonialists were exiled to Algiers. They have continually proclaimed their support for national liberation and decolonization, but we cannot know whether their declarations are sincere or merely the result of losing every overseas colony. Europeans are notoriously capricious.\n\nOfficials from [FRA.GetName] have nevertheless approached us recently and proposed cooperation. They claim sympathy for our position upon the front line against Ottoman imperialism and admiration for our efforts against colonialism. Any perceptive observer can see that they are searching for a base from which to expand their influence in the Middle East. German investment in our country plainly alarmed them, while the destruction of the German economy by Black Monday has provided an opportunity to intervene. We must now consider the offer carefully. Our economy likewise needs to recover from Black Monday, and if French capital can replace the missing German investment, it would provide an unquestionable stimulus."
  fcf_international_events.126.desc.b:0 "The French have always represented imperialism and colonialism in our eyes, and we will never forget their conduct in Africa and the Middle East. During the Weltkrieg, however, the French overthrew their government, while those we knew as colonialists were exiled to Algiers. They have continually proclaimed their support for national liberation and decolonization, but we cannot know whether their declarations are sincere or merely the result of losing every overseas colony. Europeans are notoriously capricious.\n\nOfficials from [FRA.GetName] have nevertheless approached us recently and proposed cooperation. They claim sympathy for our position upon the front line against Ottoman imperialism and admiration for our efforts against colonialism. Any perceptive observer can see that they are searching for a base from which to expand their influence in the Middle East. More importantly, these Reds have taken an interest in our young king. They believe that he could carry out a series of reforms making our country more compatible with their ideology—even while we remain a monarchy.\n\nGerman investment has disappeared following Black Monday, and French capital would provide desperately needed relief to our economy. The only question is whether we should accept their expectations regarding political reform. These demands, made while we urgently require economic assistance, may provoke a backlash from the domestic opposition. We must decide cautiously."
  fcf_international_events.126.desc.c:0 "The French have always represented imperialism and colonialism in our eyes, and we will never forget their conduct in Africa and the Middle East. During the Weltkrieg, however, the French overthrew their government, while those we knew as colonialists were exiled to Algiers. They have continually proclaimed their support for national liberation and decolonization, but we cannot know whether their declarations are sincere or merely the result of losing every overseas colony. Europeans are notoriously capricious.\n\nOfficials from [FRA.GetName] have nevertheless approached us recently and proposed cooperation. They claim sympathy for our position upon the front line against Ottoman imperialism and admiration for our efforts against colonialism. Any perceptive observer can see that they are searching for a base from which to expand their influence in the Middle East. A monarchy is unquestionably their least desirable partner—but what other country in the Middle East can rival us?\n\nThe French conditions for investment are extremely severe, and even our officials have begun wondering whether these Reds harbour malicious intentions. Many conservatives suspect that the French seek infiltration beneath the guise of investment, intending to spread dangerous ideas among our people—even ideas hostile to the monarchy! Yet the disappearance of German investment after Black Monday has left our economy desperately in need of stimulation. If French investment can replace the German presence, our economy may discover new life."
  fcf_international_events.126.a:0 "We will cooperate with the French."
  fcf_international_events.126.b:0 "We do not require the favour of colonialists."

  fcf_international_events.127.title:0 "Rebellion among the Minorities"
  fcf_international_events.127.desc:0 ""
  fcf_international_events.127.a:0 "How did matters come to this!?"

  fcf_international_events.128.title:0 "The Commune of France Seeks to Dispatch an Officer Mission"
  fcf_international_events.128.desc:0 ""
  fcf_international_events.128.a:0 "Modernizing the army is the nation's foremost priority."
  fcf_international_events.128.b:0 "The socialist element is indeed concerning."

  fcf_international_events.129.title:0 "Pan-Arab Fervour"
  fcf_international_events.129.desc:0 ""
  fcf_international_events.129.a:0 "The people have awakened."

  fcf_international_events.130.title:0 "The Frenchmen's Vietnam"
  fcf_international_events.130.desc:0 "As a former French colony, Indochina retains a profound French imprint. Although we have ruled the region for decades, we continue to employ French-speaking intellectual elites and former officials of French Indochina. We never imagined that these colonial Frenchmen could feel any sympathy for that Red lair, yet the evidence suggests that they are opposing us beneath our very eyes.\n\nWe must acknowledge that colonial rule in Vietnam appears to have caused both the Vietnamese and the French to become dissatisfied with our administration. The local population wishes to eliminate the influence of colonialism, while the European colonists appear to retain grievances over France's defeat in the Weltkrieg. Some have even begun embracing the evil doctrines of the Reds.\n\nOne report claims that a local Frenchman, evidently drunk, declared: ‘If Germany recognizes the Red regime in Paris as the legitimate government of France, then [FRA.GetName] is my homeland, whether it is socialist or monarchical.’ The speaker had never once visited metropolitan France, yet we must remain vigilant towards these increasingly restless Frenchmen. Such concerns were once dismissed as a joke, but a recent report suggests that the French may be concealing something. Numerous local rebellions in Vietnam have been obscured behind vague declarations that they were ‘already pacified.’ Yet the continual movement of police and military formations indicates that Indochina has entered a crisis.\n\nThe concealment itself is not the worst development. Rumours suggest that local French officials have established contact with members of the Viet Minh. During one recent operation against the guerrillas, weapons and equipment ordinarily found only among the police and military were recovered—and they were entirely new. The possibility that the guerrillas raided or stole from our stockpiles cannot be excluded, but so many coincidences together have forced us to question the loyalty of the local French population."
  fcf_international_events.130.a:0 "Arrest these dangerous elements."
  fcf_international_events.130.b:0 "Their influence is insignificant."

  fcf_international_events.131.title.a:0 "File a Diplomatic Protest?"
  fcf_international_events.131.title.b:0 "[FRA.GetName] Condemns Us"
  fcf_international_events.131.title.c:0 "The Diplomatic Predicament of [GEA.GetName]"
  fcf_international_events.131.desc.a:0 "[GEA.GetName] has subjected the French population of Indochina to inhuman persecution. How dare they arrest the sons and daughters of France arbitrarily? They may be colonial officials and may once have served the old Republic, but they remain part of France. We cannot tolerate the persecution of Frenchmen by the German colonial administration! Naturally, we must also oppose its colonial rule over the Vietnamese population.\n\nSeveral minor complications remain. Although we maintain contact with some of the local French population, strictly speaking, they are not citizens of France. They remain French nonetheless, and that point cannot be disputed! We must immediately draft a diplomatic protest against the shameless and repulsive conduct of [GEA.GetName]. Most importantly, the population of Indochina must see that we stand upon its side—whether they are Frenchmen living far from home or colonized local inhabitants!"
  fcf_international_events.131.desc.b:0 "While punishing several French colonial officials who secretly colluded with the Viet Minh in the interests of colonial security, the lair of the Red bandits has bared its fangs. They have actually condemned us for persecuting Frenchmen, although we are merely preserving social stability! [FRA.GetName] demands that we release these ‘innocent’ Frenchmen immediately and grant the local Vietnamese greater autonomy to ‘atone’ for the errors of colonial rule. We plainly cannot accept such demands, yet ignoring the diplomatic protest entirely is likewise impossible. The proper response would be to request instructions from Germany. This minor affair may, however, disappear beneath the Empire's enormous accumulation of work. Perhaps we should decide for ourselves."
  fcf_international_events.131.desc.c:0 "Our East Asian colony has plainly encountered several minor difficulties. [FRA.GetName] has condemned [GEA.GetName] for violating the personal freedom of Frenchmen and now demands the release of those arrested. We can barely spare enough time to address the mountain of domestic problems before us, and minor colonial affairs hardly deserve prolonged consideration. They are only a handful of Frenchmen. What harm could there be in ordering the colonial administration to release them?"
  fcf_international_events.131.a:0 "Naturally!"
  fcf_international_events.131.b:0 "Request instructions from Germany."
  fcf_international_events.131.c:0 "A limited gesture will be enough to placate France."
  fcf_international_events.131.d:0 "The colony's purpose is to provide wealth, not problems."

  fcf_international_events.132.title:0 "Germany's Reply"
  fcf_international_events.132.desc:0 "Berlin has replied to our request for instructions concerning the diplomatic protest from [FRA.GetName], proving our earlier suspicions correct. Berlin has no interest whatsoever in the condition of the colonies and has merely instructed us to release the prisoners to satisfy the French demand. Our request for instructions was entirely unnecessary."
  fcf_international_events.132.a:0 "Why are affairs in Vietnam always such a disaster?"

  fcf_international_events.133.title.a:0 "The Final Battle against the Colonial Government"
  fcf_international_events.133.title.b:0 "The Collapse of Our Rule in Vietnam"
  fcf_international_events.133.desc.a:0 ""
  fcf_international_events.133.desc.b:0 ""
  fcf_international_events.133.a:0 "Vietnam! Vietnam!"
  fcf_international_events.133.b:0 "We have failed."

  fcf_international_events.134.title:0 "The Guerrilla Uprising in Northern Vietnam"
  fcf_international_events.134.desc:0 ""
  fcf_international_events.134.a:0 "Why are affairs in Vietnam always such a disaster!?"

  fcf_international_events.135.title:0 "Rural Guerrillas"
  fcf_international_events.135.desc:0 ""
  fcf_international_events.135.a:0 "Why are the Reds everywhere!?"

  fcf_international_events.136.title:0 "The Direction of the Revolutionary War?"
  fcf_international_events.136.desc:0 ""
  fcf_international_events.136.a:0 "Westwards—shatter the Entente's ambitions."
  fcf_international_events.136.b:0 "Southwards—strike the weaker enemy first."

  fcf_international_events.137.title:0 "The Form of the Revolutionary War?"
  fcf_international_events.137.desc:0 ""
  fcf_international_events.137.a:0 "That rabble is unworthy of being called an enemy."
  fcf_international_events.137.b:0 "The boundless ocean of people's war will engulf the enemy."
  fcf_international_events.137.c:0 "War is a prolonged struggle of attrition."

  fcf_international_events.138.title:0 "France Provides Military Guidance"
  fcf_international_events.138.desc:0 ""
  fcf_international_events.138.a:0 "The dawn of victory has appeared."

  fcf_international_events.139.title:0 "A Flourishing Independence Movement"
  fcf_international_events.139.desc:0 ""
  fcf_international_events.139.a:0 "Damn it!"

  fcf_international_events.140.title:0 "Socialist Assistance"
  fcf_international_events.140.desc:0 ""
  fcf_international_events.140.a:0 "National liberation and socialism are one and the same."
  fcf_international_events.140.b:0 "Remain wary of them."

  fcf_international_events.141.a:0 "Welcome!"

  fcf_international_events.142.a:0 "Welcome the comrades from Paris!"

  fcf_international_events.143.a:0 "History cannot be forgotten."

  fcf_international_events.144.title:0 "A Rally of Algerian Nationalists"
  fcf_international_events.144.desc:0 "[?all_gone_times]"
  fcf_international_events.144.a:0 "Disperse them!"
  fcf_international_events.144.b:0 "We cannot spare the forces!"
  nfa_lost_alg_core:0 "§RThis may cause us to lose our cores upon Algeria!§!"

  fcf_international_events.145.title:0 "Defiance in North Africa"
  fcf_international_events.145.desc:0 ""
  fcf_international_events.145.a:0 "If they want a civil war, let them have one!"
  nfa_alg_war_warning:0 "§RThis will result in Algerian independence! If we fail to suppress the independence movement rapidly, our remaining colonies will follow the same path!§!"
  FCF_international_NFA_collapse:0 "The Edifice Is Crumbling"
  FCF_international_ALG_north_african_star:0 "The North African Star"
  FCF_international_NFA_collapse_tt:0 "§RTo restore public confidence, we must raise stability above 0 and ensure that the country is at peace§!"
  fcf_international_events.145.b:0 "Autonomy will resolve our differences."

  fcf_international_events.146.title:0 "A Fleeting Dream"
  fcf_international_events.146.desc:0 ""
  fcf_international_events.146.a:0 "Mother, do not weep for me."

  fcf_international_events.147.title:0 "Africa Sinks beneath the Waves"
  fcf_international_events.147.desc:0 ""
  fcf_international_events.147.a:0 "To Corsica!"

  fcf_international_events.148.title.a:0 "Home at Last"
  fcf_international_events.148.title.b:0 "Come Home!"
  fcf_international_events.148.desc.a:0 ""
  fcf_international_events.148.desc.b:0 ""
  fcf_international_events.148.a:0 "France is more complete."
  fcf_international_events.148.b:0 "The wanderers return home. (Game Over)"

  fcf_international_events.149.title:0 "Chaos in the Congo"
  fcf_international_events.149.desc:0 ""
  fcf_international_events.149.a:0 "Events are taking an unfavourable turn."
  congo_riot_tt:0 "§R$mittelafrika_territory_295$ has descended into unrest§!"
  FCF_international_state_african_colonial_riot_modifier:0 "Colonial Disorder"
  FCF_international_state_african_colonial_riot_modifier_tt:0 "§RThis will weaken our control over the region§!"

  fcf_international_events.150.title:0 "The Black Man's Voice of Freedom"
  fcf_international_events.150.desc:0 ""
  fcf_international_events.150.a:0 "Liberty—how many crimes are committed in thy name?"

  fcf_international_events.151.title:0 "Cooperation with China"
  fcf_international_events.151.desc:0 "The Chinese Kuomintang has consolidated its rule over China. We welcome the prospect of gaining an ally in the East, as well as another force opposing colonialism and imperialism. Although China remains divided, the National Government's advance towards unification has become apparent. The only remaining danger is [JAP.GetName], which watches China hungrily.\n\nWhatever the future may hold, our Commissioner for Foreign Affairs has begun consulting the Commissioner for Economic Affairs regarding cooperation with the National Government. The only question is what form that cooperation should take. China possesses an enormous population, but most of it remains illiterate, while industry is still in its infancy. Workers in several regions have developed class consciousness, but in many others no working class exists at all. Political struggles within the Kuomintang also raise doubts about whether it will remain upon the socialist path. Our advisers therefore favour investing in China itself rather than in the Chinese Kuomintang.\n\nFor the present, however, the Kuomintang remains our partner, and we must negotiate these questions with its representatives. They likewise desire our assistance. The people living upon Chinese soil are innocent and deserve better lives, something no political position can change."
  fcf_international_events.151.a:0 "We will respect their wishes."
  the_way_with_china_themselves:0 "China will determine its own requirements."
  fcf_international_events.151.b:0 "Economic cooperation will benefit both sides."
  the_way_with_china_economy:0 "We will pursue economic cooperation with China. Our partnership will deepen over time and provide substantial benefits to our own economy."
  FCF_international_CHI_economic_cooperation:0 "Franco-Chinese Cooperation"
  fcf_international_events.151.c:0 "Establishing a socialist bastion in the East is most important."
  the_way_with_china_politics:0 "We will deepen our influence in China, using economic construction to cultivate a working class loyal to the socialist cause and ensure that the future China does not depart from the socialist path."
  fcf_international_events.151.d:0 "Military development will preserve the flame of revolution."
  the_way_with_china_military:0 "We will strengthen China's military development. Arms factories will become the firm foundation of Chinese military power, while our military instructors will assist the modernization of the Chinese armed forces."

  fcf_international_events.152.title:0 "Assistance from Paris"
  fcf_international_events.152.desc:0 ""
  fcf_international_events.152.a:0 "Economic construction is our foremost objective."
  fcf_international_events.152.b:0 "Educating the masses is an investment in our future."
  fcf_international_events.152.c:0 "We must concentrate upon the military."

  fcf_international_events.153.title:0 "Investment from Our French Comrades"
  fcf_international_events.153.desc.a:0 ""
  fcf_international_events.153.desc.b:0 ""
  fcf_international_events.153.desc.c:0 ""
  fcf_international_events.153.a:0 "Our thanks, comrades!"

  fcf_international_events.154.title:0 "The Needs of China"
  fcf_international_events.154.desc.a:0 ""
  fcf_international_events.154.desc.b:0 ""
  fcf_international_events.154.desc.c:0 ""
  fcf_international_events.154.a:0 "Assistance in our hour of need."

  fcf_international_events.155.title:0 "Anti-Japanese Sentiment in the Colonies"
  fcf_international_events.155.desc:0 ""
  fcf_international_events.155.a:0 "Deploy additional police and military forces."
  fcf_international_events.155.b:0 "These ungrateful wretches!"

  fcf_international_events.156.title:0 "The Land of the Sun"
  fcf_international_events.156.desc:0 ""
  fcf_international_events.156.a:0 "We shall achieve final victory."

  fcf_international_events.157.a:0 "The reactionary government has lost the people. We should have acted openly long ago."

  fcf_international_events.158.a:0 "For democracy and for the Republic!"
  fcf_international_events.158.b:0 "We will not associate with Red bandits."

  fcf_international_events.159.a:0 "A pleasure doing business!"
  fcf_international_events.159.b:0 "What a pity."

  fcf_international_events.160.title:0 "Regicide"
  fcf_international_events.160.desc.a:0 ""
  fcf_international_events.160.desc.b:0 ""
  fcf_international_events.160.a:0 "God save [THIS.GetLeader]!"
  fcf_international_events.160.b:0 "Dear God…"
  POR_survived_an_assassination:0 "Killed by an Assassin"

  fcf_international_events.161.title:0 "Active Workers' Organizations"
  fcf_international_events.161.desc:0 ""
  fcf_international_events.161.a:0 "Let us hope they are not Reds."

  fcf_international_events.162.title:0 "An Organized Strike"
  fcf_international_events.162.desc:0 ""
  fcf_international_events.162.a:0 "Can they not remain quiet for once?"
  FCF_international_intervention_organized_strike:0 "Strike!"

  fcf_international_events.163.title:0 "The Revolution Arrives"
  fcf_international_events.163.desc:0 ""
  fcf_international_events.163.a:0 "This means civil war!"

  fcf_international_events.164.title.a:0 "A Republican Coup!"
  fcf_international_events.164.title.b:0 "A Democratic Coup!"
  fcf_international_events.164.desc.a:0 ""
  fcf_international_events.164.desc.b:0 ""
  fcf_international_events.164.a:0 "Long live the Republic! Long live the revolution!"
  fcf_international_events.164.b:0 "Long live democracy! Long live the revolution!"

  fcf_international_events.165.title:0 "A Socialist Coup!"
  fcf_international_events.165.desc:0 ""
  fcf_international_events.165.a:0 "Long live socialism!"

  fcf_international_events.166.title:0 "The Revolution Is Defeated"
  fcf_international_events.166.desc:0 ""
  fcf_international_events.166.a:0 "At least everyone is still alive."

  fcf_international_events.167.title:0 "Total Civil War!"
  fcf_international_events.167.desc:0 ""
  fcf_international_events.167.a:0 "Let us begin!"
  ii_civil_war_tt:0 "§RThe revolutionaries will occupy half of the country's core territory at random§!"
  civil_war_threat_tt:0 "Civil War"
  FCF_international_new_republic_country:0 "The New Republic"
  FCF_international_new_democrat_country:0 "The New Democratic Regime"
  FCF_international_new_socialist_country:0 "The New Socialist State"

  fcf_international_events.168.title:0 "The Capital Is Occupied"
  fcf_international_events.168.desc:0 ""
  fcf_international_events.168.a:0 "The revolutionaries have seized the capital."
  fcf_international_events.168.b:0 "The government has held the capital."

  fcf_international_events.169.title:0 "One Final Attempt"
  fcf_international_events.169.desc:0 ""
  fcf_international_events.169.a:0 "The situation is hopeless."
  fcf_international_events.169.b:0 "Deploy the army!"
  lead_to_civil_war_tt:0 "§RThis will lead to total civil war§!"

  fcf_international_events.170.title:0 "The Counterattack"
  fcf_international_events.170.desc:0 ""
  fcf_international_events.170.a:0 "The revolutionaries are already a spent force."
  fcf_international_events.170.b:0 "Deploy the army!"

  fcf_international_events.171.title:0 "Revolution Erupts in Portugal"
  fcf_international_events.171.desc:0 ""
  fcf_international_events.171.a:0 "Strike at their vulnerable point!"

  fcf_international_events.172.title:0 "Revolution Erupts in Portugal"
  fcf_international_events.172.desc:0 ""
  fcf_international_events.172.a:0 "The people have awakened!"
  fcf_international_events.172.b:0 "Let us hope it does not happen here."

  fcf_international_events.173.title:0 "Unrest in Catalonia"
  fcf_international_events.173.desc:0 ""
  fcf_international_events.173.a:0 "Another pack of syndicalist thugs."

  fcf_international_events.174.title:0 "Sabotage behind Enemy Lines"
  fcf_international_events.174.desc:0 ""
  fcf_international_events.174.a:0 "Damn it."

  fcf_international_events.175.title:0 "An Infiltrated Front"
  fcf_international_events.175.desc:0 ""
  fcf_international_events.175.a:0 "What is happening?"

  fcf_international_events.176.title:0 "Leaflets in the Streets"
  fcf_international_events.176.desc.a:0 ""
  fcf_international_events.176.desc.b:0 ""
  fcf_international_events.176.a:0 "Is this infiltration?"
  fcf_international_events.176.b:0 "A pleasure doing business."

  fcf_international_events.177.title:0 "The Crowd at the End of the Alley"
  fcf_international_events.177.desc.a:0 ""
  fcf_international_events.177.desc.b:0 ""
  fcf_international_events.177.a:0 "What will they do next—launch a revolution?"
  fcf_international_events.177.b:0 "Raise the red flag!"

  fcf_international_events.178.title:0 "Across the Channel"
  fcf_international_events.178.desc.a:0 ""
  fcf_international_events.178.desc.b:0 ""
  fcf_international_events.178.a:0 "Another one?"
  fcf_international_events.178.b:0 "The French want a part in this as well."

  fcf_international_events.179.title:0 "Danger in the Air"
  fcf_international_events.179.desc.a:0 ""
  fcf_international_events.179.desc.b:0 ""
  fcf_international_events.179.a:0 "There is only one possible outcome: defeat!"
  fcf_international_events.179.b:0 "There is only one possible outcome: revolution!"

  fcf_international_events.180.title:0 "The Emerald Isle, Verdant and Green"
  fcf_international_events.180.desc.a:0 ""
  fcf_international_events.180.desc.b:0 ""
  fcf_international_events.180.a:0 "Long live Ireland!"
  fcf_international_events.180.b:0 "A pity."

  fcf_international_events.181.title:0 "Arms Smuggling"
  fcf_international_events.181.desc:0 ""
  fcf_international_events.181.a:0 "What are they planning?"

  fcf_international_events.182.title:0 "Propaganda Pamphlets"
  fcf_international_events.182.desc:0 ""
  fcf_international_events.182.a:0 "Do not be deceived!"

  fcf_international_events.183.title:0 "A Wave of Strikes"
  fcf_international_events.183.desc:0 ""
  fcf_international_events.183.a:0 "Can anyone make them return to work?"

  fcf_international_events.184.title:0 "Organized Atrocities"
  fcf_international_events.184.desc:0 ""
  fcf_international_events.184.a:0 "The crisis has begun."

  fcf_international_events.185.title:0 "Free Ireland Launches the Revolution"
  fcf_international_events.185.desc:0 ""
  fcf_international_events.185.a:0 "Ireland shall be free!"

  fcf_international_events.186.title:0 "The March upon Dublin"
  fcf_international_events.186.desc:0 ""
  fcf_international_events.186.a:0 "The Citizen Army is sweeping all before it!"
  fcf_international_events.186.b:0 "We will not surrender Dublin without a fight."

  fcf_international_events.187.title:0 "The Emerald Isle, Red as Iron"
  fcf_international_events.187.desc:0 ""
  fcf_international_events.187.a:0 "Stoke the furnace until it burns red!"

  fcf_international_events.188.title:0 "The Second Irish Revolution"
  fcf_international_events.188.desc:0 ""
  fcf_international_events.188.a:0 "The Irish will be remembered—they too were among the first revolutionaries!"
  fcf_international_events.188.b:0 "Another country has fallen to the Reds."

  fcf_international_events.189.title:0 "The Great Counteroffensive"
  fcf_international_events.189.desc:0 ""
  fcf_international_events.189.a:0 "We cannot allow ourselves to be attacked from both sides."
  fcf_international_events.189.b:0 "Let us defeat the traitors in open battle."

  fcf_international_events.190.title:0 "The End of the Road"
  fcf_international_events.190.desc:0 ""
  fcf_international_events.190.a:0 "What will become of Ireland?"

  fcf_international_events.191.title:0 "An Overwhelming Disparity"
  fcf_international_events.191.desc:0 ""
  fcf_international_events.191.a:0 "We have held Ireland!"

  fcf_international_events.192.title:0 "Open Rebellion"
  fcf_international_events.192.desc:0 ""
  fcf_international_events.192.a:0 "Two Irelands upon a single island!?"
  ireland_revolution_control_tt:0 "§RIf the Irish Citizen Army possesses at least medium control in more than two states, the government will be overthrown§!"
  FCF_international_state_ireland_revolution_modifier:0 "Irish Citizen Army Control: [state_ireland_revolution_loc]"
  state_ireland_revolution_high:0 "§RHigh§!"
  state_ireland_revolution_middle:0 "§YMedium§!"
  state_ireland_revolution_low:0 "§GLow§!"

  fcf_international_events.193.title:0 "Open Mobilization"
  fcf_international_events.193.desc:0 ""
  fcf_international_events.193.a:0 "The Irish Revolution is now irresistible."

  fcf_international_events.194.title:0 "A Socialist Alliance"
  fcf_international_events.194.desc:0 ""
  fcf_international_events.194.a:0 "For the Republic and for socialism!"
  fcf_international_events.194.b:0 "Democracy must not be defiled."

  fcf_international_events.195.title:0 "The Dutch Response"
  fcf_international_events.195.desc.a:0 ""
  fcf_international_events.195.desc.b:0 ""
  fcf_international_events.195.a:0 "Very well."

  fcf_international_events.196.title:0 "Additional Ballots"
  fcf_international_events.196.desc:0 ""
  fcf_international_events.196.a:0 "The Left-Wing List is the true victor!"
  fcf_international_events.196.b:0 "This is electoral fraud!"

  fcf_international_events.197.title:0 "The Revolutionary Socialist Workers' Party's Promise"
  fcf_international_events.197.desc:0 ""
  fcf_international_events.197.a:0 "We could not have won without them."
  fcf_international_events.197.b:0 "Did we not achieve all of this ourselves?"

  fcf_international_events.198.title:0 "Drive Wilhelmina Out"
  fcf_international_events.198.desc:0 ""
  fcf_international_events.198.a:0 "Long live the Republic!"

  fcf_international_events.199.title:0 "Overthrow the System"
  fcf_international_events.199.desc:0 ""
  fcf_international_events.199.a:0 "Socialism and the Republic!"

  fcf_international_events.200.title:0 "The Left Launches a Revolution"
  fcf_international_events.200.desc:0 ""
  fcf_international_events.200.a:0 "Everyone holds their breath…"

  fcf_international_events.201.title:0 "The New Republic"
  fcf_international_events.201.desc:0 ""
  fcf_international_events.201.a:0 "Liberty and democracy have always been our objectives."
  fcf_international_events.201.b:0 "It is time to take another step towards the left."

  fcf_international_events.202.title:0 "The Devil's Call"
  fcf_international_events.202.desc:0 ""
  fcf_international_events.202.a:0 "Our common blood binds us together."
  fcf_international_events.202.b:0 "The Red Devil will not prevail."

  fcf_international_events.203.title:0 "The Walloon Rebellion"
  fcf_international_events.203.desc:0 ""
  fcf_international_events.203.a:0 "Deploy the army!"
  fcf_international_events.203.b:0 "We cannot spare the forces."

  fcf_international_events.204.title:0 "Peace beneath the Iron Heel"
  fcf_international_events.204.desc:0 ""
  fcf_international_events.204.a:0 "At last, peace and quiet."

  fcf_international_events.205.title:0 "Government Forces Repulsed"
  fcf_international_events.205.desc:0 ""
  fcf_international_events.205.a:0 "How is this possible?"

  fcf_international_events.206.title:0 "The Western Wall Incident"
  fcf_international_events.206.desc:0 ""
  fcf_international_events.206.a:0 "They must take care of themselves."
  fcf_international_events.206.b:0 "Can they not take care of themselves?"

  fcf_international_events.207.title:0 "The German Iron Heel"
  fcf_international_events.207.desc:0 ""
  fcf_international_events.207.a:0 "It is finally over."

  fcf_international_events.208.title:0 "Every Plan Exhausted"
  fcf_international_events.208.desc:0 ""
  fcf_international_events.208.a:0 "We are finished."

  fcf_international_events.209.title:0 "A French Olive Branch"
  fcf_international_events.209.desc:0 ""
  fcf_international_events.209.a:0 "We shall become a republic."
  fcf_international_events.209.b:0 "The risk is too great."

  fcf_international_events.210.title.a:0 "Cooperation Accepted"
  fcf_international_events.210.title.b:0 "Cooperation Rejected"
  fcf_international_events.210.desc.a:0 ""
  fcf_international_events.210.desc.b:0 ""
  fcf_international_events.210.a:0 "A pleasure doing business."
  fcf_international_events.210.b:0 "Regrettable."

  fcf_international_events.211.title:0 "Arms Trading across the Border"
  fcf_international_events.211.desc:0 ""
  fcf_international_events.211.a:0 "What does this mean?"

  fcf_international_events.212.title:0 "Concerning Paramilitary Activity"
  fcf_international_events.212.desc:0 ""
  fcf_international_events.212.a:0 "Is this another French conspiracy?"

  fcf_international_events.213.title:0 "A Socialist Republic"
  fcf_international_events.213.desc:0 ""
  fcf_international_events.213.a:0 "The Walloons are prepared to preserve Belgium."

  fcf_international_events.214.title.a:0 "The Walloons Accept"
  fcf_international_events.214.title.b:0 "The Walloons Refuse"
  fcf_international_events.214.desc.a:0 ""
  fcf_international_events.214.desc.b:0 ""
  fcf_international_events.214.a:0 "Everything is proceeding according to plan."
  fcf_international_events.214.b:0 "Most regrettable."

  fcf_international_events.215.title:0 "An Unusual Visitor to the Police Station"
  fcf_international_events.215.desc:0 ""
  fcf_international_events.215.a:0 "For a free Belgium!"
  fcf_international_events.215.b:0 "We cannot defy order itself."

  fcf_international_events.216.title.a:0 "The Police Accept Cooperation"
  fcf_international_events.216.title.b:0 "The Police Reject Cooperation"
  fcf_international_events.216.desc.a:0 ""
  fcf_international_events.216.desc.b:0 ""
  fcf_international_events.216.a:0 "Everything is proceeding according to plan."
  fcf_international_events.216.b:0 "Most regrettable."

  fcf_international_events.217.title:0 "The Voice of Freedom"
  fcf_international_events.217.desc:0 ""
  fcf_international_events.217.a:0 "Germany will not be pleased."

  fcf_international_events.218.title:0 "The Grand Plan"
  fcf_international_events.218.desc:0 ""
  fcf_international_events.218.a:0 "Let us begin!"

  fcf_international_events.219.title:0 "Anti-German Demonstrations"
  fcf_international_events.219.desc:0 ""
  fcf_international_events.219.a:0 "The police played their part in the performance perfectly."
  fcf_international_events.219.b:0 "The police dispersed the crowds."

  fcf_international_events.220.title:0 "The Walloons Rise Once Again"
  fcf_international_events.220.desc:0 ""
  fcf_international_events.220.a:0 "They demand freedom for Belgium."
  fcf_international_events.220.b:0 "They demand independence for Wallonia."

  fcf_international_events.221.title:0 "Persuading the King to Abdicate"
  fcf_international_events.221.desc:0 ""
  fcf_international_events.221.a:0 "Threatened by the republicans, the puppet king abdicates."
  fcf_international_events.221.b:0 "The King withstands the pressure and refuses to abdicate."

  fcf_international_events.222.title:0 "The Great Referendum"
  fcf_international_events.222.desc:0 ""
  fcf_international_events.222.a:0 "Let us await the result."

  fcf_international_events.223.title:0 "The Plan Fails"
  fcf_international_events.223.desc:0 ""
  fcf_international_events.223.a:0 "We have failed!"

  fcf_international_events.224.title:0 "Victory in the Referendum"
  fcf_international_events.224.desc:0 ""
  fcf_international_events.224.a:0 "Everything is proceeding according to plan. Approach the Germans!"

  fcf_international_events.225.title:0 "[BEL.GetName] Demands Independence"
  fcf_international_events.225.desc:0 ""
  fcf_international_events.225.a:0 "Can we do anything but follow the current?"
  fcf_international_events.225.b:0 "They can forget it."

  fcf_international_events.226.title:0 "Germany Accepts Belgian Independence"
  fcf_international_events.226.desc:0 ""
  fcf_international_events.226.a:0 "That was far easier than expected."

  fcf_international_events.227.title:0 "Everything Proceeds according to Plan"
  fcf_international_events.227.desc:0 ""
  fcf_international_events.227.a:0 "Long live socialism and the Republic!"
  fcf_international_events.227.b:0 "A free republic accepts no restraints!"

  fcf_international_events.228.title:0 "Germany Rejects Belgian Independence"
  fcf_international_events.228.desc:0 ""
  fcf_international_events.228.a:0 "Approach the French. The plan must continue."

  fcf_international_events.229.title:0 "The Next Step"
  fcf_international_events.229.desc:0 ""
  fcf_international_events.229.a:0 "Deploy additional forces near Belgium."
  fcf_international_events.229.b:0 "Advance directly into Dunkirk."

  fcf_international_events.230.title:0 "Military Movements along the Frontier"
  fcf_international_events.230.desc:0 ""
  fcf_international_events.230.a:0 "Let us stage a performance and then approach the Germans!"

  fcf_international_events.231.title:0 "A Moment of Crisis"
  fcf_international_events.231.desc:0 ""
  fcf_international_events.231.a:0 "The situation must not escalate further. Grant them independence."
  fcf_international_events.231.b:0 "What game are they playing?"

  fcf_international_events.232.title:0 "Germany Again Refuses Independence"
  fcf_international_events.232.desc:0 ""
  fcf_international_events.232.a:0 "Our deception failed."
  belgium_revolution_in_ww2_tt:0 "§RBelgium will launch an uprising when war erupts in Western Europe§!"

  fcf_international_events.233.title:0 "The Plan Fails"
  fcf_international_events.233.desc:0 ""
  fcf_international_events.233.a:0 "Most regrettable."

  fcf_international_events.234.title:0 "The Siege of Dunkirk"
  fcf_international_events.234.desc:0 ""
  fcf_international_events.234.a:0 "This is a necessary sacrifice."
  lead_to_bel_independent_plan_failed:0 "§RThis will cause the plan to fail immediately§!"

  fcf_international_events.235.title:0 "The Dunkirk Garrison Counterattacks"
  fcf_international_events.235.desc:0 ""
  fcf_international_events.235.a:0 "This is not what we agreed!"
  bel_independent_plan_failed:0 "§RThe Belgian Independence Plan has failed§!"

  fcf_international_events.236.title:0 "Strategy for the March upon Rome"
  fcf_international_events.236.desc:0 ""
  fcf_international_events.236.a:0 "The best approach is to strike without warning."
  fcf_international_events.236.b:0 "Only a methodical advance can succeed."

  fcf_international_events.237.title:0 "Planning the March upon Rome"
  fcf_international_events.237.a:0 "Let us begin."

  fcf_international_events.238.title:0 "Dark Clouds over Rome"
  fcf_international_events.238.desc:0 ""
  fcf_international_events.238.a:0 "They will not succeed."

  fcf_international_events.239.title:0 "Suspicious Activity"
  fcf_international_events.239.desc:0 ""
  fcf_international_events.239.a:0 "Watch them closely."

  fcf_international_events.240.title:0 "Increasingly Rampant Guerrillas"
  fcf_international_events.240.desc:0 ""
  fcf_international_events.240.a:0 "Where are they obtaining these supplies?"

  fcf_international_events.241.title:0 "The General Strike"
  fcf_international_events.241.desc:0 ""
  fcf_international_events.241.a:0 "Are they attempting a rebellion?"

  fcf_international_events.242.title:0 "The Guerrilla Uprising"
  fcf_international_events.242.desc:0 ""
  fcf_international_events.242.a:0 "Matters are growing worse!"

  fcf_international_events.243.title:0 "Retreat into Rome"
  fcf_international_events.243.desc:0 ""
  fcf_international_events.243.a:0 "Those petty villains will pay!"

  fcf_international_events.244.title:0 "Rome Falls"
  fcf_international_events.244.desc:0 ""
  fcf_international_events.244.a:0 "Lord, protect us…"

  fcf_international_events.245.title:0 "The March upon Rome"
  fcf_international_events.245.desc.a:0 ""
  fcf_international_events.245.desc.b:0 ""
  fcf_international_events.245.a:0 "Long live socialist Italy!"
  fcf_international_events.245.b:0 "Damn the syndicalist thugs!"

  fcf_international_events.246.title:0 "The Traitors Defeated"
  fcf_international_events.246.desc:0 ""
  fcf_international_events.246.a:0 "God be praised!"

  fcf_international_events.247.title:0 "Order Reigns in Rome"
  fcf_international_events.247.desc:0 ""
  fcf_international_events.247.a:0 "Damn it."

  fcf_international_events.248.title:0 "Open Unrest in [943.GetName]"
  fcf_international_events.248.desc:0 ""
  fcf_international_events.248.a:0 "What do they want—a revolution!?"

  fcf_international_events.249.title:0 "Stability Returns to [943.GetName]"
  fcf_international_events.249.desc:0 ""
  fcf_international_events.249.a:0 "Peace!"

  fcf_international_events.250.title:0 "Expanding Left-Wing Influence"
  fcf_international_events.250.desc:0 ""
  fcf_international_events.250.a:0 "We will never surrender!"

  fcf_international_events.251.title:0 "Storming the Federal Assembly"
  fcf_international_events.251.desc:0 ""
  fcf_international_events.251.a:0 "This is rebellion!"
  fcf_international_events.251.b:0 "We cannot handle this alone!"

  fcf_international_events.252.title:0 "Switzerland Requests Our Assistance"
  fcf_international_events.252.desc:0 ""
  fcf_international_events.252.a:0 "Can they not handle it themselves?"
  fcf_international_events.252.b:0 "We must contain the spread of socialism!"

  fcf_international_events.253.title:0 "[FROM.GetName] Promises Assistance"
  fcf_international_events.253.desc:0 ""
  fcf_international_events.253.a:0 "We are saved! Are we?"

  fcf_international_events.254.title:0 "[FROM.GetName] Refuses Assistance"
  fcf_international_events.254.desc:0 ""
  fcf_international_events.254.a:0 "They are delivering us to the Reds!"

  fcf_international_events.255.title:0 "The Revolution Is Defeated"
  fcf_international_events.255.desc:0 ""
  fcf_international_events.255.a:0 "Switzerland still exists!"
  fcf_international_events.255.b:0 "Damn it."

  fcf_international_events.256.title:0 "Revolutionaries Occupy the Federal Assembly"
  fcf_international_events.256.desc:0 ""
  fcf_international_events.256.a:0 "Switzerland shall be reborn."
  fcf_international_events.256.b:0 "We must seek foreign assistance."

  fcf_international_events.257.title:0 "The Swiss Revolution"
  fcf_international_events.257.desc:0 ""
  fcf_international_events.257.a:0 "We must prevent this possibility!"
  fcf_international_events.257.b:0 "What value does a small mountain country possess?"

  fcf_international_events.258.title:0 "Isolated and Abandoned"
  fcf_international_events.258.desc:0 ""
  fcf_international_events.258.a:0 "The revolution cannot be prevented."

  fcf_international_events.259.title:0 "A Necessary Sacrifice"
  fcf_international_events.259.desc:0 ""
  fcf_international_events.259.a:0 "This is necessary to resist the Reds."

  fcf_international_events.260.title:0 "The Voice of the Parisian Workers"
  fcf_international_events.260.desc:0 ""
  fcf_international_events.260.a:0 "Let us hope our people are not deceived."

  fcf_international_events.261.title:0 "Refugees from the Economic Crisis"
  fcf_international_events.261.desc.a:0 ""
  fcf_international_events.261.desc.b:0 ""
  fcf_international_events.261.a:0 "Show them the superiority of socialism!"
  fcf_international_events.261.b:0 "They have been seduced by the Devil!"
  economic_crisis_immigration:0 "§GDuring capitalist economic crises, we will receive a continuous stream of economic refugees§!"

  fcf_international_events.262.title:0 "French Emigration Propaganda"
  fcf_international_events.262.desc:0 ""
  fcf_international_events.262.a:0 "Could the workers truly be deceived by such lies!?"

  fcf_international_events.263.title:0 "Unemployed Workers Choose the Commune"
  fcf_international_events.263.desc:0 ""
  fcf_international_events.263.a:0 "They have chosen enslavement!"
  fcf_international_events.263.b:0 "If they have no love for their country, let them leave!"
  FCF_international_economic_crisis_disable_immigration_news_tt:0 "We will no longer receive reports concerning worker emigration, but until we resolve our economic problems, a continuous stream of unemployed workers will depart for [FRA.GetName]."

  fcf_international_events.264.title:0 "Workers from the Capitalist World"
  fcf_international_events.264.desc:0 ""
  fcf_international_events.264.a:0 "Welcome to the workers' country!"
  fcf_international_events.264.b:0 "This will always be a paradise for workers!"
  FCF_international_economic_crisis_disable_immigration_news_to_FRA_tt:0 "We will no longer receive reports concerning worker immigration, but until the capitalist countries resolve their economic problems, a continuous stream of unemployed workers will arrive in [FRA.GetName]."
  fcf_international_events.264.c:0 "Excessive immigration is a burden. Every entrant must be screened rigorously."
  economic_crisis_immigration_not_accept:0 "§RWe will cease accepting economic migrants§!"

  fcf_international_events.265.title:0 "The Call of National Self-Determination"
  fcf_international_events.265.desc:0 ""
  fcf_international_events.265.a:0 "Sometimes the left does make a certain amount of sense."

