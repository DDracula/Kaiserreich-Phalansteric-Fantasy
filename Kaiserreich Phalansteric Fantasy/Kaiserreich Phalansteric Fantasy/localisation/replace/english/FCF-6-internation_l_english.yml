  fcf_diplomacy_events.1.title:0 "[FRA.GetName]Seeking a trade agreement"
  fcf_diplomacy_events.1.desc:0 "Since the revolution, France has lost its colonies, and as a result, it has had to rely on foreign imports for many resources. Now they hope to sign an agreement with us—a country that has the resources they need—to alleviate their resource problems. But the question is, why should we do this?\n\nTheir foreign affairs committee and economic committee indicated that if we intend to make contact, then a negotiation about exchanges will begin, focusing on what we give and what we get."
  fcf_diplomacy_events.1.a:0 "Let's see their sincerity."
  fcf_diplomacy_events.1.b:0 "We will not negotiate with the Red bandits."
  fcf_diplomacy_events.2.title:0 "[FROM.GetName]Refuse to negotiate"
  fcf_diplomacy_events.2.desc:0 "The Foreign Affairs Committee informed us that we previously approached[FROM.GetName]The olive branch we extended has been rejected by them; they have not seen the enormous potential in trading with us and have instead imprisoned themselves in an ideological cage opposing socialism."
  fcf_diplomacy_events.2.a:0 "It's really unfortunate."
  fcf_diplomacy_events.3.title:0 "[FROM.GetName]Accept negotiation"
  fcf_diplomacy_events.3.desc:0 "The foreign affairs committee told us that we previously approached[FROM.GetName]The olive branch we offered has been accepted by them, and it's time for us to start preparing for negotiations with them. Clearly, the proactive side is the one that possesses the resources we need.[FROM.GetName], but we cannot compromise with them at the expense of our interests.\n\nNo matter what country it is, direct economic transfers are the simplest and most straightforward bargaining chip, but this may further deteriorate our already unhealthy finances. Another option is to open our market to the other party, which is also very attractive, but domestic enterprises might have considerable objections. Alternatively, we could use the local labor movements to force them to accept our conditions; however, this could lead to many unforeseen events, and the far-left would also argue that we are exploiting the international labor movement for national profit.\n\nOf course, the most important thing is whether the other party will agree; otherwise, no matter how many chips we put on the table, it will be of no use."
  fcf_diplomacy_events.3.a:0 "Money is made to be spent."
  fcf_diplomacy_events.3.b:0 "Reduce our tariffs on it."
  fcf_diplomacy_events.3.c:0 "Take advantage of the country's labor movement."
  fcf_diplomacy_events.3.d:0 "Let them make the conditions."
  trade_agreement_result_tooltip:0 "The final trade agreement will result in:"
  ease_supply_chain_issues:0 "§Gmay possibly alleviate ours§Y$FCF_economy_supply_chain_modifier$§!§!"
  fcf_diplomacy_events.4.title:0 "[FRA.GetName]Seek our terms"
  fcf_diplomacy_events.4.desc:0 "After we agreed with[FRA.GetName]After the negotiations, they adopted a humble attitude and asked what we wanted to gain from it. We did not harbor unrealistic expectations or hostility toward them because of their socialist ideology. From a purely economic perspective, trading with a major power like France is bound to have many benefits. If we take advantage of our resource advantage and push too far, it would instead put us in a passive position.\n\nThe most direct and blunt plan is to demand economic transfers, which can provide some compensation for the profit we lose in resources, but for the other government, it is bound to be a considerable expense. Alternatively, we could ask for a reduction in tariffs on our goods to make it easier for our products to enter the markets of France and even Falunstein. Additionally, there is another option: since Paris, the socialist stronghold, has reached an agreement with us, this could also force domestic socialists to lay low for a while. Going further, we could demand that Paris manage these socialists properly and not cause us any trouble."
  fcf_diplomacy_events.4.a:0 "Demand economic delivery."
  fcf_diplomacy_events.4.b:0 "Request a tariff reduction."
  fcf_diplomacy_events.4.c:0 "Require controlling workers' movements."
  fcf_diplomacy_events.5.title:0 "[FROM.GetName]conditions"
  fcf_diplomacy_events.5.desc.a:0 "[FROM.GetName]They have given their conditions: they require economic transportation. This is very practical; they want to use this to make up for the profit they lost in the resource agreement. The question now is, can our finances support this possibility?"
  fcf_diplomacy_events.5.desc.b:0 "[FROM.GetName]They have set out their conditions: lowering tariffs and opening up markets. This is what we expected and is also the most common form of benefit exchange in trade agreements. This will not have a direct impact on us, but over time, our workers and businesses may express dissatisfaction with it."
  fcf_diplomacy_events.5.desc.c:0 "[FROM.GetName]They laid out their conditions: to control the local workers' movement and keep them from opposing the government. This was truly unexpected for us; they wanted to use our position as socialist leaders to uphold the rule of their bourgeois government. Of course, this is not based on the suppression of the working class. We can superficially agree to their requests while secretly continuing to support our worker comrades. However, at least for the near future, we may need comrades to lay low."
  fcf_diplomacy_events.5.a:0 "Acceptance of conditions."
  fcf_diplomacy_events.5.b:0 "Refusal conditions."
  fcf_diplomacy_events.6.title:0 "and[FROM.GetName]Reach an agreement"
  fcf_diplomacy_events.6.desc:0 "After negotiations, a trade agreement based on resource trade and exchange of benefits has been reached. May the friendship between our two countries last forever!"
  fcf_diplomacy_events.6.a:0 "That's great."
  fcf_diplomacy_events.7.title:0 "and[FROM.GetName]the breakdown of negotiations"
  fcf_diplomacy_events.7.desc:0 "After negotiations, our two countries did not reach an agreement on resource trade and the exchange of interests, which led to the final collapse of the agreement."
  fcf_diplomacy_events.7.a:0 "What a pity."
  fcf_diplomacy_events.8.title:0 "[FRA.GetName]sincerity"
  fcf_diplomacy_events.8.desc.a:0 "[FRA.GetName]They have given their conditions: economic transfer. This is very practical, and we can use it to compensate for the profits lost in the resource agreement. The question now is, can we be bribed with this?"
  fcf_diplomacy_events.8.desc.b:0 "[FRA.GetName]They have given their conditions: reduce tariffs and open up the market. This is what we expected and is also the most common exchange of benefits in trade agreements. This would make it easier for our goods to enter the French market and even the market in Falunstein."
  fcf_diplomacy_events.8.desc.c:0 "[FRA.GetName]They gave their conditions: control the local labor movement and prevent them from opposing the government. This was truly unexpected for us; we didn't anticipate that, as socialist leaders, they would actively uphold the rule of our bourgeois government. Of course, this cannot be built on the repression of the working class—they could just as easily superficially agree while secretly continuing to support our country's labor movement. However, at least for the recent period, our country's labor movement may be somewhat low-key."
  fcf_diplomacy_events.8.a:0 "Acceptance of conditions."
  fcf_diplomacy_events.8.b:0 "Refusal conditions."
  fcf_diplomacy_events.9.title:0 "and[FROM.GetName]The agreement is invalid"
  fcf_diplomacy_events.9.desc:0 "We previously with[FROM.GetName]The signed agreement has become invalid for various reasons, and we no longer gain any benefits from it."
  fcf_diplomacy_events.9.a:0 "What a pity."
  fcf_diplomacy_events.11.title:0 "[FRA.GetName]olive branch"
  fcf_diplomacy_events.11.desc:0 "Surprisingly, our neighbor, the enemy in the great war, the old nest of the revolution——[FRA.GetName]Recently, an invitation was extended to our foreign affairs department: not to mock our predicament in the economic crisis, but 'for the peace and stability of Europe.' They want to restore trade between Germany and France, and even go a step further, seeking cooperation in all areas, especially in resources.\n\nObviously, they seem to want to profit from the blow the economic crisis has dealt us, but it is hard to determine whether that is their only aim. However, the most immediate consequence of this action is that we may be able to ease the pressure of the economic crisis, and perhaps even silence domestic socialists, while of course simultaneously facing accusations from the right of 'compromising with the Red bandits.'\n\nBefore the negotiation begins, everything is unknown, but the question is, who should we negotiate with[FRA.GetName]Are we going to negotiate restarting economic exchanges?"
  fcf_diplomacy_events.11.a:0 "Practical politics will not yield to ideology."
  fcf_diplomacy_events.11.b:0 "We will never negotiate with the Red Bandits."
  fcf_international_events.2.title:0 "Red flyer"
  fcf_international_events.2.a:0 "We will not let the Red bandits pass."
  fcf_international_events.3.title:0 "Colonized sentiment"
  fcf_international_events.3.a:0 "But we brought them civilization!"
  fcf_international_events.4.title:0 "The backbone of the revolution"
  fcf_international_events.4.a:0 "Do they want to start a revolution here?"
  fcf_international_events.18.b:0 "What a pity."
  fcf_international_events.22.b:0 "Ah, sweet freedom!"
  fcf_international_events.112.b:0 "...there is no need for unnecessary sacrifices anymore."
  fcf_international_events.116.b:0 "We have known for a long time."
