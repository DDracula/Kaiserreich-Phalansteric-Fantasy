  FCF_international_intervention_countermeasures_category_BEL_wal:0 "The Walloon Crisis"
  FCF_international_intervention_countermeasures_category_BEL_desc_wal:0 "[FRA.GetName] has established contact with the Walloons in our southern territories. These separatists seek to tear Wallonia away from our country and establish a syndicalist state. Nor are they alone: some Flemings regard the crisis as an opportunity to achieve independence of their own. Whatever happens, may our country survive this crisis."
  ii_countermeasure_BEL_WAL_mission:0 "The Walloon Affair"
  ii_countermeasure_BEL_WAL_crack_down_separatism:0 "Suppress Separatism"

  FCF_international_intervention_countermeasures_category_BEL_soc:0 "The Plan for an Independent Republic"
  FCF_international_intervention_countermeasures_category_desc_BEL_soc:0 "The Belgian Labour Party has accepted the French proposal to transform Belgium into a socialist republic and escape the German shadow in a single stroke. This will inevitably be difficult: a single mistake could plunge Western Europe into another world war. We therefore intend to commit a series of carefully arranged ‘mistakes’ that will leave the Germans with no alternative but to grant us independence. We shall then become a free republic.\n\n[bel_independent_plan_republic]\n[bel_independent_plan_wallonia]\n[bel_independent_plan_police]"
