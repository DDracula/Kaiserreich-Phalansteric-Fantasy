  ii_euw_HOL_influence_socdem:0 "Influence the Social Democratic Workers' Party"
  ii_euw_hol_influence_socdem_tt:0 "§CIf the election has not yet taken place:§! We will assist the §Y‘Left-Wing List’§! in the election and, following its victory, attempt to persuade the §SSocial Democratic Workers' Party§! and the §RRevolutionary Socialist Workers' Party§! to cooperate in establishing a §Rsocialist republic§!.\n§CIf the §Y‘Left-Wing List’§! has already won:§! We will attempt to unite the §RRevolutionary Socialist Workers' Party§! and the §SSocial Democratic Workers' Party§! and overthrow the §Pmonarchy§!."
  ii_euw_HOL_revolution:0 "§RLaunch the Revolution in [FROM.GetName]§!"

  FCF_international_intervention_countermeasures_category_HOL:0 "Revolutionary Infiltration"
  FCF_international_intervention_countermeasures_category_desc_HOL:0 "Since the revolutions in [FRA.GetName] and [ENG.GetName], radical left-wing ideas have become increasingly active within our country, their immediate neighbour. Our informants have recently reported that both our labour movement and legal left-wing organizations maintain secret contacts with [FRA.GetName]. They have accepted payments from Paris and are attempting to bring socialism—or even revolution—to the Netherlands. We cannot surrender our citizens to these petty conspirators who defile democracy. If they intend to destroy everything we have built, let them try!"

