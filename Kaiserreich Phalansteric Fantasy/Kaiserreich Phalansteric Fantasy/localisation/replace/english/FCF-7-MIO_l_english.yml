l_english:
# Industrial Concerns
  l_aluminium_francais:0 "L’Aluminium français"
  l_aluminium_francais_desc:0 "Established in 1911, L’Aluminium français began as a sales and technical coordination body jointly created by several domestic aluminium companies. Although the former shareholders disappeared after the revolution, its network of smelters, laboratories, and sales offices across the foothills of the Alps and Pyrenees survived intact and was incorporated into the metallurgical industrial federation. Today, it coordinates bauxite imports, hydroelectricity allocations, production quotas, and processing standards among its constituent plants while promoting the use of aluminium in aviation, electrical engineering, and transport. For the Federation, L’Aluminium français is no longer a cartel pursuing monopoly profits, but a vital link connecting raw materials and energy to advanced industry."

  airliquide:0 "Air Liquide"
  airliquide_desc:0 "Air Liquide was founded in 1902 and gradually established a production network spanning Europe, the Americas, and Asia through Georges Claude's improved air-liquefaction process. Following the revolution, its French factories were taken over by workers' committees, while its overseas subsidiaries continued to operate under local institutions and maintained their ties with Paris through patent licensing, equipment deliveries, and exchanges of technical personnel. The organization now coordinates the production of oxygen, nitrogen, and acetylene within the chemical industrial federation while supplying metallurgical welding, chemical synthesis, mining operations, and hospital oxygen services. It is also one of the few industrial organizations in the Federation still capable of maintaining a global technological network."

  association_francaise_des_metaux:0 "Association française des métaux"
  association_francaise_des_metaux_desc:0 "The Association française des métaux was reorganized from the factories formerly belonging to the Compagnie française des métaux and principally handles the processing and supply of copper, lead, zinc, and their alloys. The plants at Saint-Denis, Sérifontaine, Castelsarrasin, and elsewhere remain under the management of their respective factory committees. Within the metallurgical industrial federation, the Association coordinates imported raw materials, production orders, and processing standards while facilitating the exchange of techniques for rolling, wire drawing, and seamless tubing among its constituent plants. France's electrical grid, railways, machine-building sector, and armaments production all depend upon these inconspicuous non-ferrous products, making the Association one of the least replaceable elements of the heavy-industrial system."

  societe_de_transports_d_energie_des_alpes:0 "Société de transports d’énergie des Alpes"
  societe_de_transports_d_energie_des_alpes_desc:0 "Established in 1920, the Société de transports d’énergie des Alpes was among the Federation's first organizations created specifically to provide interregional electrical interconnection. It links the hydroelectric stations of the Savoyard mountains with the industrial centres of Lyon, Saint-Étienne, and the Rhône–Jura region, allowing formerly isolated generating and distribution authorities to exchange surplus power. The transmission lines belong to the district councils through whose territory they pass, while the Société undertakes unified dispatching, equipment maintenance, and the settlement of transmission fees. Through this high-voltage network crossing the mountains, the “white coal” of the Alps flows continuously to the factories of Lyon and the electric furnaces of Ugine, while electricity from other grids can be supplied in the opposite direction during the dry season."

  compagnie_generale_de_la_telegraphie_sans_fil:0 "Compagnie générale de la télégraphie sans fil"
  compagnie_generale_de_la_telegraphie_sans_fil_desc:0 "The Compagnie générale de la télégraphie sans fil was established in 1918 by the Société française radio-électrique and a group of communications enterprises. The revolution abolished the former holding relationships, but preserved the company name as the common organization of its specialized factories, laboratories, and communications engineering teams. It principally develops long-range transmitters, shipborne and airborne radio sets, direction-finding equipment, and specialized vacuum tubes, while constructing international radiocommunication facilities for the Federation. Its concentrated research capabilities and extensive overseas technical connections have kept the Compagnie générale at the forefront of the French radio industry."

  ducretet_thomson:0 "Ducretet-Thomson"
  ducretet_thomson_desc:0 "The Ducretet workshops originally became famous for scientific instruments and experimental apparatus. After entering into cooperation with the French Thomson organization in 1930, they increasingly turned toward the mass production of radio receivers and gramophones. The factory on rue de Vouillé in Paris is managed by its factory committee, while engineers oversee product design and the relevant industrial federation coordinates supplies of vacuum tubes, loudspeakers, and metal components. Unlike the Compagnie générale de la télégraphie sans fil, which specializes in professional equipment, Ducretet-Thomson has brought radio into the homes of ordinary people. Its La Voix du Monde receiver has become one of the Federation's most readily recognizable electronic products."

