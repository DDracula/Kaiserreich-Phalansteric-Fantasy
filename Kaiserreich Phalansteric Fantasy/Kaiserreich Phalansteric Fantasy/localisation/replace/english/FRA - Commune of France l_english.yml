  FRA_communard_spirit:0 "The Communard Spirit"
  FRA_communard_spirit_desc:0 "We are the heirs of the Paris Commune, the first socialist government ever established, which was brutally suppressed by the forces of the reactionary Republic. In 1920, the working class finally avenged itself upon the bourgeoisie and overthrew the military dictatorship of the Parti de l’Ordre. We, the children of the Communards, must defend both our government and our spirit. Never again shall tyrants oppress us!"

  FRA_renseignements_generaux_lar:0 "Renseignements généraux"
  FRA_renseignements_generaux_lar_desc:0 "The Renseignements généraux are the eyes and ears of the Commune, collecting intelligence at home and abroad concerning every threat to our proletarian dream. Their responsibilities extend beyond security work: they also promote the values and principles of our socialist revolution both within France and overseas. Through the collection and analysis of intelligence, they help formulate our foreign policy and serve in the vanguard of our struggle to break the chains of global capital.\n\nIn every factory still controlled by the bourgeoisie, there are sympathizers loyal to our cause. Our network is unstoppable."

  FRA_bhartiya_support:0 "French Military Assistance"
  FRA_bhartiya_support_desc:0 "We have received military assistance from our French allies. This selfless support has proved indispensable to defeating the reactionary Princely Federation and the imperialist Dominion of India. We hope that one day we will be able to repay the French for their aid, but for now we must concentrate upon the task at hand."

  FRA_support_bharatiya:0 "Has agreed to dispatch military advisers to the Bharatiya Commune."
  FRA_created_phalanstere:0 "§Y[FRA.GetNameDef]§!: $has_completed_focus$$FRA_found_the_phalanstere_international$§!"

  phalanstere_research_name:0 "Internationale du Phalanstère"
  phalanstere_research_desc:0 "During the congress of the Third International, the participating powers approved a plan to unite the socialist countries of the world in the exchange of scientific research and technological achievements. Ambitious from the moment of its conception, the Internationale du Phalanstère is intended to assist socialist movements and governments throughout the world."

  FRA_KR_gathering_storm_desc:0 "The Christmas Eve Coup of 1919 doomed the Third Republic. Military rule triggered a general strike and the Paris uprising, while outside troops defected to the revolution. Victory at Troyes broke the stalemate, liberated Paris, and secured all of France. A socialist-syndicalist state was born, entering reconstruction. Despite internal disagreements, unity held under the red banner. Now that reconstruction is complete, where does France's destiny lie?"

  FRA_country_intro_background:0 "GFX_FRA_intro"
  FRA_country_intro_header:0 "The French Federation of Communes: Civil War"
  FRA_country_intro_content:0 "In the spring of 1919, the French Third Republic entered a profound crisis during the final months of the Weltkrieg. The German Empire launched its Kaiserschlacht, French morale collapsed, and Compiègne fell. Although Philippe Pétain restored some of his reputation through a tank-led counterattack at Clermont, the Entente's subsequent May Offensive ground to a halt when the infantry refused to advance, setting off mass mutinies along the front.\n\nDomestic politics descended into turmoil. On 22 May, Paris was paralysed by a general strike against Georges Clemenceau. Fernand Loriot and Boris Souvarine broke from the Section française de l’Internationale ouvrière and established the Parti révolutionnaire ouvrier, which advocated the armed seizure of political power. In June, Radical leader Gaston Doumergue became prime minister. His determination to continue the war and the disastrous defeat at Saint-Mihiel provoked the largest mutiny in the history of the French Army.\n\nIn July, Aristide Briand, leader of the Parti républicain-socialiste, formed a new government and attempted to placate CGT leader Léon Jouhaux through the Accords de Matignon. The Comité syndicaliste révolutionnaire led by Pierre Monatte resisted the settlement. On 6 November, Briand was forced to sign the Treaty of Versailles, surrendering territory and accepting reparations. France erupted in outrage as the military Right and the revolutionary Left simultaneously assailed a republican government approaching complete collapse.\n\nOn 17 December, a group of senior officers led by Pétain and Ferdinand Foch conspired at the Ministry of War and fabricated a supposed “plan for revolutionary insurrection” to deceive the government. That same day, Raymond Lefebvre, a leading member of the Association républicaine des anciens combattants, met the leadership of the Parti révolutionnaire ouvrier and secretly established a network of Amicales de soldats throughout the garrisons.\n\nOn 24 December, Pétain launched the Christmas Eve Coup. Briand fled to Bordeaux, leaving behind a political vacuum. Under the threat of military force, the National Assembly granted full powers to Marshal Joseph Joffre. The Third Republic ceased to exist in all but name. The military government closed L’Humanité and began arresting Loriot, Souvarine, and other leaders of the Left. The railway unions and the Association républicaine des anciens combattants used their communications networks to spread news of the coup, bringing moderate and radical trade unions into a provisional alliance.\n\nOn 1 January 1920, the New Year General Strike plunged Paris into darkness. Soldiers opened fire upon civilians, provoking a mass uprising. A bloody confrontation erupted on the Boulevard Saint-Germain on 5 January and inflicted severe casualties upon both sides. The workers withdrew toward the Right Bank, erected barricades, and organized armed resistance through the Red Guards of the veterans' association.\n\nFrom 5 to 12 January, Paris hosted the First National Congress of the Bourses du travail and Soldiers' Councils. On 12 January, the revolutionary crowds captured the Hôtel de Ville and raised the red flag. Late that night, the instability of the front-line garrisons forced Pétain to contract his defensive perimeter around the 7th arrondissement.\n\nOn the evening of 12 January, Victor Griffuelhes proclaimed the Comité de salut public de la Commune de France. Raymond Lefebvre was killed while organizing the defection of the Vincennes garrison, but the uprisings at Vincennes and Saint-Denis irreparably undermined the foundations of military rule. Meanwhile, the Section française de l’Internationale ouvrière divided at the Tours Congress, where the majority led by Jean Longuet and Marcel Cachin declared its support for the revolutionary government.\n\nOn 13 January, civil war erupted throughout France. Lille, Lyon, Marseille, and other cities rose in succession. A nationwide railway strike severed the supply lines of the White Army. Between February and March, the Red Army destroyed the principal White forces during the Rhône Valley Campaign. Bordeaux was liberated on 8 March. From 9 March until 6 April, the Red Army annihilated Pétain's only remaining mobile force in northeastern France at Troyes. After this victory, the forces of the centre-left declared their support for the revolution. The siege of Paris was lifted on 11 April. The remnants of the White Army disintegrated while attempting to escape to Algeria. On 15 May, the Brest sailors rose in revolt and the last White troops evacuated metropolitan France, bringing the civil war to a complete revolutionary victory."

