   france_events.1.t:0 "A New Flag for the Federation?"
  france_events.1.desc:0 "Disagreement over the federal flag has persisted since the revolution. The red flag has always been the banner of the proletariat, of the martyrs of revolution, and of the fighting barricades. Many therefore maintain that revolutionaries should raise no other standard, proudly proclaiming their struggle against the bourgeoisie—for the proletariat has no country. For decades, the tricolour ceased to symbolize revolutionary fervour and declined into the emblem of a bankers' republic and the Versaillais of 1871. Even so, many remain reluctant to abandon it. Some socialists, particularly former members of the Section française de l’Internationale ouvrière, have always sought to reclaim the flag from the bourgeoisie and restore its revolutionary spirit, recalling the days when the people stood proudly at Valmy against the monarchies of Europe and emerged victorious. Others may simply fear that abandoning the blue, white, and red would constitute a grave provocation to foreign countries and alienate compatriots who have not yet become our comrades.\n\nThe factions consequently reached the same compromise they had adopted during the revolution. The tricolour was retained but charged with symbols of proletarian struggle, labour, and resistance, and it has always flown beside the red flag. Our recent electoral victory has placed the final decision in our hands. Should we preserve the compromise of 1920 and retain the broken tricolour? Should we preserve the principle of compromise while creating a new and redder flag? Or should only the red flag fly above France from this day forward?"
  france_events.1.a:0 "Forge a new alliance and march toward a revolutionary future!"
  france_events.1.b:0 "The red flag! The workers ask for nothing else, and nothing else will do."
  france_events.1.c:0 "Too many have died for the tricolour. There is no reason to replace it."
  france_events.1.d:0 "The technocratic ideal deserves its place upon our national flag."
  france_events.1.e:0 "The blood-red sun banner better embodies our revolutionary resolve."

  france_events.5.t:0 "Motion of No Confidence: Impeach Georges Dumoulin"
  france_events.5.desc:0 "Georges Dumoulin returned to the chairmanship of the Comité de salut public amid the controversy surrounding the Affaire Martin, replacing Gaston Monmousseau after the latter was removed by a motion of no confidence. It would be difficult to claim that Dumoulin completely resolved the affair, but he at least restored a measure of stability to public opinion. His principal undertaking in office has been to continue the reforms he initiated in 1926, although his greater purpose has been to reverse Monmousseau's federalist reforms.\n\nThat same issue had previously allowed Monmousseau to defeat him. At the time, Dumoulin's principal opponents were the radical workerists within the governing movement. Today, the opposition comes primarily from parties outside the government—though this certainly does not mean that the radical workerists have ceased opposing him. Since the Affaire Martin, the opposition Parti communiste ouvrier et paysan and the federalist Association des fédéralistes anarchistes have sought to remove the Parti ouvrier unifié and the CGT from government. Every mistake committed by Dumoulin's administration has consequently been magnified without limit.\n\nAlthough the government successfully hosted a congress of the Socialist and Syndicalist International last year, its refusal to speak while the German imperialists brutally suppressed domestic trade-union activity exposed it to ferocious attacks from the opposition—more ferocious, at least, than those it had already endured. The ultimate result was a motion of no confidence against Dumoulin. Elections to the Comité général de la Fédération are approaching, after which Dumoulin would have left office in any event. The opposition nevertheless hopes to use his removal to gather momentum for its electoral campaign. The Parti ouvrier unifié, unwilling to associate its own reputation with Dumoulin's conciliatory policy, also supported the motion. Dumoulin has therefore genuinely been impeached and removed from office. Whether this will help anyone in the coming election remains unknown."
  france_events.5.a:0 "Farewell, Comrade Dumoulin."

  france_events.22.t:0 "Comrade Blum Calls for Spanish Unity"
  france_events.22.desc:0 "As civil war engulfs the Iberian Peninsula, rumours of a gathering White Terror have crossed the Pyrenees and reached our people. Throughout the Federation, citizens have spontaneously organized public meetings to collect money and resources for our Spanish comrades and to demonstrate the unwavering support of the French people for the CNT-FAI.\n\nAt one such gathering, orthodox socialist representative Léon Blum delivered an inspiring speech urging the government to expand its support for Spain's workers and peasants and unite them within an internationalist Popular Front against counterrevolution and monarchism. This “Popular Front” address has been widely praised for both its eloquence and its steadfast socialist convictions, further increasing Blum's popularity as a public speaker."
  france_events.22.a:0 "A most persuasive speech, comrade."

  france_events.25.t:0 "The Damocles Project?"
  france_events.25.desc:0 "Encouraged by the Cambridge Conference held during the Tenth Congress of the Third International in May 1937, another secret meeting convened at the University of Cambridge two weeks ago.\n\nUnder the leadership of the scientists Norman Feather, Frédéric Joliot-Curie, and Francis Perrin, a group of British and French theoretical physicists has been discussing radioactivity, the nature of nuclear fission, and their possible applications—from electricity generation and medicine to a strategic weapon of unprecedented power. The participants have requested the establishment of a body known as the “Damocles Project,” a joint Anglo-French committee for nuclear research."
  france_events.25.a:0 "Establish the Damocles Project!"
  france_events.25.b:0 "We should not waste money on such absurdities!"

  france_events.26.t:0 "The Damocles Project Is Established"
  france_events.26.desc:0 "[FROM.GetNameDefCap] has accepted our proposal to establish the bilateral Damocles Project. This vital undertaking will ensure that we can spread syndicalism throughout the world!"
  france_events.26.a:0 "Excellent!"

  france_events.27.t:0 "Britain Refuses to Cooperate!"
  france_events.27.desc:0 "The Union of Britain has rejected our proposal to establish the bilateral Damocles Project. We will have to pursue this research alone."
  france_events.27.a:0 "Damn them!"

  france_events.28.t:0 "The Socialist and Syndicalist International"
  france_events.28.desc:0 "The Socialist and Syndicalist International was established in 1921 following the victory of the revolution. Seeking to rebuild the foundations of the world proletarian movement after years of devastating warfare, its founders adopted a pluralistic, big-tent approach. Anarchists, communists, socialists, syndicalists, pacifists, and anticolonialists all gathered within the organization, together with even a number of social democrats. Its congresses were initially held annually and later every few years, providing a forum in which to discuss and guide the future course of socialism. We are proud to announce that the Ninth Congress will soon convene in Paris and the surrounding region. It will be more than an ordinary conference: it will be a great celebration of proletarian liberation!"
  france_events.28.a:0 "The congress will begin one week after May Day!"

  france_events.29.t:0 "The Ninth Congress of the Third International"
  france_events.29.desc:0 "The time has come to invite the leaders of every socialist and syndicalist country in the world to attend the Ninth Congress of the Third International."
  france_events.29.a:0 "Send the invitations!"

  france_events.30.t:0 "The Third International"
  france_events.30.desc:0 "France is preparing to host the Ninth Congress of the Third International as planned. Unsurprisingly, the French have invited us to participate. Sending a delegation would be a prudent decision."
  france_events.30.a:0 "We had better pack immediately!"

  france_events.41.t:0 "Every Delegation Has Arrived"
  france_events.41.desc:0 "After months of enthusiastic preparations, the Ninth Congress of the Third International has convened at Versailles. People from across the world have been invited to advise upon the development of the socialist movement. Parties affiliated with the Third International, together with socialist sympathizers and observers, have all received invitations and dispatched representatives. Many of them have endured considerable hardship during their journeys merely to approach the heart of the proletarian revolution. Although the Third International is theoretically independent of the British and French governments, the delegations from these two leading socialist countries will inevitably enjoy a privileged position as elder brothers in the struggle for the liberation of the world's working class."
  france_events.41.a:0 "A warm welcome to every comrade!"

  france_events.42.t:0 "The Congress Opens"
  france_events.42.desc:0 "The first session of the Ninth Congress of the Third International opens at the Château de Versailles. Deep-red banners bearing socialist symbols and slogans hang throughout the hall. George Lansbury, the father of the British Revolution, delivers the opening remarks. He observes the profound irony of convening a proletarian congress in what was once the heart of monarchical absolutism, but argues that the setting also demonstrates the irresistible advance of revolution.\n\nLansbury proceeds with a major address thanking the delegates for attending, reviewing the revolutionary achievements of recent years, and urging them to carry their momentum into the struggles ahead. At the conclusion of his speech, he invites the delegates to join him in a minute of prayer. A French representative immediately shouts, “As if we would!” provoking a commotion throughout the chamber. Nevertheless, the elderly statesman receives prolonged applause. The delegates then disperse into their various discussion groups and committees to continue the congress."
  france_events.42.a:0 "The Ninth Congress of the Third International is formally opened!"

  france_events.421.t:0 "The Third International Reveals Its True Face"
  france_events.421.desc:0 "The Reds have finally torn away their last pretence of restraint! Just as they proclaimed at the latest congress of the Third International, they intend to spread their disease across the entire world! We must prepare ourselves for anything...!"
  france_events.421.a:0 "We must be prepared..."

  france_events.43.t:0 "Syndicalism in Spain"
  france_events.43.desc:0 "Joaquín Ascaso Budría takes the rostrum to explain the position and role of the CNT-FAI within the Spanish crisis. The CNT-FAI is Spain's largest syndicalist political organization and encompasses anarcho-syndicalists, moderate syndicalists, and trade unionists. The Spanish revolutionaries have witnessed at first hand the White Terror—a campaign of violent counterrevolution directed against the working class. They have come before the congress to request assistance for their cause when the appropriate moment arrives. As cries of “¡Viva la Revolución!” echo through the halls of Versailles, a resolution supporting the Spanish proletariat passes unanimously."
  france_events.43.a:0 "Our Iberian comrades may rely upon us!"

  france_events.45.t:0 "The White Terror"
  france_events.45.desc:0 "Joaquín Ascaso Budría has informed us of the White Terror now spreading through Madrid and Barcelona. Kurt Eisner, the Bavarian socialist, has requested permission to discuss the subject in greater depth, and we have granted him the floor. After hearing further accounts of White Terror in Germany, Austria, Hungary, Russia, and Finland, the assembled delegates are ready to reach their decision."
  france_events.45.a:0 "Another reason why we must end the capitalism that feeds upon human flesh!"

  france_events.47.t:0 "Even in the Heart of Capital"
  france_events.47.desc:0 "The American delegate John “Jack” Reed delivers an impassioned address. A professional journalist and one of the first Americans to report upon the Russian and French revolutions, Reed subsequently entered politics and has become a widely respected figure within the movement. He has announced his candidacy for the 1936 presidential election on behalf of the Socialist Party of America. Critics at home and abroad fear that electoral politics will lead him toward reformism, but for many delegates the prospect of seeing a committed socialist enter the White House is sufficient to allay their concerns. Reed consequently receives an enthusiastic welcome from the congress.\n\nIn his speech, Reed describes the present situation in the United States. Years of depression have reduced American workers and farmers to misery, fostering a dramatic expansion of radical politics, while the German stock-market crash has accelerated the process still further. The labour movement is growing more powerful, and the influence of the Socialist Party within government institutions is expanding rapidly. The proletariat has become strong enough to confront both police repression and the reactionary militias of Longism. The opportunity for revolution is gradually emerging."
  france_events.47.a:0 "The red flag will fly over Wall Street!"
  france_events.47.b:0 "Provide support to Reed and his comrades."
  france_events.47.c:0 "We cannot yet risk antagonizing the United States."

  france_events.50.t:0 "Hope for Latin America"
  france_events.50.desc:0 "The next session is a joint meeting of our Latin American comrades. In recent years, South and Central America have stood at the front line of the socialist movement. Victimized by American interests, continuously plundered by international capital, and oppressed by puppet dictators serving one “Yankee” clique after another, the peoples of the Americas have finally reached the limit of their endurance. Growing numbers of workers are joining the struggle against imperialism. We have faith in our comrades and believe that the liberation of the Latin American continent is no longer distant.\n\nThe audience listens eagerly to accounts of the exploits of the Patagonian revolutionaries, the latest developments in Nicaragua, and the experiences of veterans of the Mexican Revolution. These stories have inspired movements across Latin America. Delegates from other countries, including Brazil and Cuba, also provide detailed accounts of the proletarian struggles within their homelands. Many leave the session confident about the prospects for the coming years."
  france_events.50.a:0 "Begin cultivating syndicalism throughout Latin America."
  france_events.50.b:0 "Syndicalism must be built elsewhere. Other regions deserve priority."

  france_events.51.t:0 "The Role of Women in the World Revolution"
  france_events.51.desc.FRA:0 "Today, the British feminist Comrade Helen Crawfurd takes the rostrum to discuss the role of women in the world revolution. She emphasizes that neither industry nor the armed forces can defeat the many enemies of the proletariat without the participation of women. Acting upon her appeal, however, may provoke a backlash from the more “conservative” elements of our society."
  france_events.51.desc.other:0 "Today, the British feminist Comrade Helen Crawfurd takes the rostrum to discuss the role of women in the world revolution. She emphasizes that neither industry nor the armed forces can defeat the many enemies of the proletariat without the participation of women. Although our delegation fully agrees with her position, some fear that the time is not yet right to promote women's emancipation. An official endorsement of her address might create unnecessary conflict within the family."
  france_events.51.a:0 "Women entering the professions is essential to the world revolution."
  france_events.51.b:0 "She is a remarkable woman, but we shall not respond."

  france_events.52.t:0 "The Role of Women in the World Revolution"
  france_events.52.desc:0 "Yesterday, Comrade Helen Crawfurd took the rostrum to discuss the role of women in the world revolution. She emphasized that no struggle can defeat the many enemies of the proletariat without the full participation of women. Inspiring though the proposal may be, the political situation in Britain prevents us from reaching an immediate decision. We must wait until the Trades Union Congress concludes this autumn."
  france_events.52.a:0 "So be it."

  france_events.53.t:0 "Support the Reunification Campaign"
  france_events.53.desc:0 "The present congress of the Third International offers our delegation an excellent opportunity to request international assistance for our campaign of reunification. Given the possibility of Austrian intervention upon the peninsula, the foreign minister is confident that French support would contribute greatly to its success."
  france_events.53.a:0 "Seek support for reunification!"
  france_events.53.b:0 "We have more pressing concerns."

  france_events.54.t:0 "Policy toward the Italian Peninsula"
  france_events.54.desc:0 "The delegation of the Socialist Republic of Italy has attended the congress of the Third International and requested support for its effort to reunify the Italian Peninsula. It currently confronts Austrian lackeys beyond the Po, the monarchists of the Kingdom of the Two Sicilies, and their puppet pope in Rome. Intervention in Italian affairs could greatly advance the revolution, but might also draw us into conflict with one of Europe's greatest reactionary powers, the Austrian Empire, which continues to protect the Italian puppet government in Milan."
  france_events.54.a:0 "Protect our friends in Turin and assist them when the moment arrives."

  france_events.55.t:0 "The Global Economic Crisis and the Third International"
  france_events.55.desc:0 "Text outline: The history of the Internationale du Phalanstère and the opportunities now before it."
  france_events.55.a:0 "An important opportunity!"

  france_events.56.t:0 "A Socialist State in India"
  france_events.56.desc:0 "As the congress approaches its conclusion, the young Jawaharlal Nehru takes the central platform and explains the recent instability confronting our revolutionary government. He urgently appeals for international assistance in constructing a people's army capable of defeating our reactionary enemies in Lahore and Hyderabad."
  france_events.56.a:0 "We need international assistance to build our army!"
  france_events.56.b:0 "No, we are managing well enough."

  france_events.57.t:0 "The Comrades of the Bharatiya Commune Seek Support"
  france_events.57.desc:0 "The Bharatiya Commune has requested our assistance in its struggle against its neighbours: the imperialists in Delhi and the counterrevolutionary Princely Federation. It wishes us to dispatch military advisers to train its officers and soldiers."
  france_events.57.a:0 "Send military advisers to train their forces!"
  france_events.57.b:0 "We cannot spare the resources."

  france_events.58.t:0 "Comrade Saïl Mohamed Requests the Floor"
  france_events.58.desc:0 "Comrade Saïl Mohamed, a prominent Algerian socialist, has been granted permission to address the delegates before the session begins. He delivers a stirring account of present conditions in Morocco and French Africa, where Arab workers are exploited for the benefit of the wealthy and the colonists. Saïl urges the congress to act immediately. He proposes the establishment of a socialist anticolonial committee to support the underground struggle of socialist anticolonialists throughout North Africa."
  france_events.58.a:0 "We shall gladly support the establishment of such a committee."

  france_events.59.t:0 "The Ninth Congress of the Third International Concludes"
  france_events.59.desc:0 "The Ninth Congress of the Third International has finally drawn to a close. The sessions were eventful and the sentiments expressed sincere. The international socialist movement has emerged more united, and its future course has been established. By every measure, the congress has been a resounding success. The delegates hold one final vote to determine the host of the next congress. Among the numerous proposals, London—the capital of another great socialist country—emerges victorious. Many delegates subsequently take the platform to offer their final remarks and thank their comrades.\n\nFew events since the revolution have possessed comparable importance. Upon returning home, the delegates must seize the moment, make decisive choices, and devote themselves completely to their implementation. First, however, a proper farewell celebration is required. A grand exhibition opens to the public at Montmartre, the birthplace of the Paris Commune in 1871. It displays the finest works of French art, distinctive regional clothing and customs, achievements in sport, and scientific and technological innovations. The hosts then provide the delegates with a magnificent banquet composed of dishes from every region of the Commune, and the celebrations continue late into the night. Naturally, this festival of socialist unity concludes with the guests singing L’Internationale, offering the congress its own distinctive tribute."
  france_events.59.a:0 "The Internationale shall unite the human race!"

  france_events.61.t:0 "The Syndicalists' First Move"
  france_events.61.desc:0 "The leaders of the Red menace are gathering to coordinate their activities, which are plainly directed against the new European order established by our victory in the Weltkrieg. We must watch them closely and subject the results of their congress to careful analysis!"
  france_events.61.a:0 "Keep a close watch upon them!"

  france_events.62.t:0 "Assistance from the French Red Army"
  france_events.62.desc:0 "Following our delegation's request for military assistance at the Ninth Congress of the Third International, the Union of Britain and the French Federation of Communes have agreed to dispatch senior officers and technical specialists to help organize India's revolutionary army and educate our elite officer corps. We hope this cooperation will produce excellent results upon the battlefield!"
  france_events.62.a:0 "The Red Army will put these comrades' talents to good use!"

  france_events.63.t:0 "The Rise of the Comité socialiste anticolonial"
  france_events.63.desc.NFA:0 "Our counterintelligence agents have detected a recent surge in syndicalist activity within our territory. We already knew that the French Federation of Communes and the Union of Britain had established an organization called the Comité socialiste anticolonial within the Third International, but until recently it had remained largely inactive. With the assistance of the Algerian traitor Saïl Mohamed Ameriane ben Amezaïene, the committee is now coordinating syndicalist influence and encouraging anticolonial sentiment throughout French Africa.\n\nThe syndicalists have supplied native insurgents with considerable quantities of weapons and other resources. They have also established several training camps in their southern territories. Our politicians, who never appear to learn from experience, dismiss the development as harmless. Our generals offer a very different warning."
  france_events.63.desc.GER:0 "News has arrived that the French Federation of Communes and other members of the Third International have established the Comité socialiste anticolonial. Its objective is to assist Arabs and Africans in liberating their homelands from the clutches of the colonial powers, particularly the remnants of the French Republic.\n\nThe organization will coordinate syndicalist activities across North and West Africa. Our intelligence indicates that a small number of Egyptian left-wing radicals seeking to fight for the revolution are also entering the territory of the French Republic. Although we are not presently at war with the French Federation of Communes or any other syndicalist country, we should remain vigilant."
  france_events.63.desc.OTT:0 "German agents within the French Federation of Communes have delivered troubling news. The Commune and other members of the Third International have established the Comité socialiste anticolonial, whose objective is to assist Arabs and Africans in liberating their homelands from the colonial powers, particularly the remnants of the French Republic.\n\nThe organization will coordinate syndicalist activities across North and West Africa. Although we have little sympathy for French colonial rule over our former North African territories, the Commune's actions remain a source of concern. It is likely to cultivate both revolutionaries and nationalist sympathizers of syndicalism. Its activities also complement Egypt's attempts to promote Arab nationalism in the Middle East and North Africa, potentially strengthening our future enemies. Even if we are not its principal target, these considerations oblige us to proceed cautiously."
  france_events.63.desc.SPA:0 "News has reached Spain that the French Federation of Communes and other members of the Third International have established the Comité socialiste anticolonial. Its objective is to assist Arabs and Africans in liberating their homelands from the clutches of the colonial powers, particularly the remnants of the French Republic.\n\nThe organization will coordinate syndicalist activities across North and West Africa. Let us pray that we do not become one of its targets—we already have far more important matters to address."
  france_events.63.a:0 "A troubling development."

  france_events.64.t:0 "The Comité socialiste anticolonial Is Established"
  france_events.64.desc:0 "Our French comrades have recently established the Comité socialiste anticolonial. With the assistance of the Algerian revolutionary Saïl Mohamed, the committee intends to support nationalist and syndicalist revolutionaries throughout Africa and destroy every colonial government. Even without an official acknowledgement, it is plainly directed first and foremost against the reactionary “French” government in Algiers, which already faces considerable difficulty administering its colonies.\n\nThe French have invited us to join the committee and contribute equipment, weapons, and propaganda, and we have gladly accepted. Unity makes us strong, and soon we shall liberate every African worker from imperialism!"
  france_events.64.a:0 "Solidarity forever!"

  france_events.65.t:0 "What Should the Committee Target?"
  france_events.65.desc.default:0 "The Comité socialiste anticolonial has convened in Paris today. Around the conference table sit delegates from France, Britain, Algeria, Senegal, and even Tunisia to discuss the present situation. The committee has already agreed to conduct a major operation against the “French” government in Algiers to weaken its control over Africa. The remaining question is how best to injure it.\n\nWe could organize a wave of sabotage and strikes throughout its industrial regions, damaging its productive capacity. Alternatively, we could provide extensive support to insurgents in a particular region. Finally, we could construct a vast propaganda network and foment unrest more broadly across Africa. What should we do?"
  france_events.65.desc.collapse:0 "The Comité socialiste anticolonial has convened in Paris today. Around the conference table sit delegates from France, Britain, Algeria, Senegal, and even Tunisia to discuss the present situation. The committee has already agreed to conduct a major operation against the remnants of the “French” government in Algiers to weaken its control over Africa. The delegates have ultimately concluded that the only sensible course is to organize a wave of sabotage and strikes throughout its industrial regions and damage its productive capacity."
  france_events.65.a:0 "Undermine their industrial capacity."
  france_events.65.b:0 "Support the insurgent organizations."
  france_events.65.c:0 "Foment unrest throughout French Africa."

  france_events.66.t:0 "A Wave of Sabotage"
  france_events.66.desc:0 "Without any prior warning, several of our industrial centres have been struck by a wave of violent strikes. These incidents bear little resemblance to the industrial disputes with which we are familiar. Only small groups of workers participate, and they appear to possess no coherent motive. Factory owners across the country awaken to discover their premises occupied and much of their equipment smashed. In other factories, the workers do not occupy the premises, but large quantities of machinery have nevertheless been destroyed.\n\nSuppressing the strikes and arresting the participants will not be difficult. Even so, we appear to have fallen victim to a carefully prepared conspiracy, as these incidents were plainly organized by a foreign power..."
  france_events.66.a:0 "Those Red bastards!"

  france_events.67.t:0 "The Reds Incite Rebellion"
  france_events.67.desc:0 "The colonial authorities and the Deuxième Bureau report an unusual influx of weapons into our colonies over the past several weeks. Everything plainly originated in the French Federation of Communes, which has smuggled arms into our territory under cover of darkness to undermine stability and foment rebellion. We have taken far too long to uncover the conspiracy. The revolutionaries now possess enough weapons to resist us openly and with confidence. We can only pray that we weather the approaching storm."
  france_events.67.a:0 "Traitors everywhere!"

  france_events.68.t:0 "A Propaganda Offensive"
  france_events.68.desc:0 "Over the past several weeks, we have observed a marked increase in propaganda activities by nationalist and syndicalist agitators. They have suddenly acquired tens of thousands of leaflets and prepared radio addresses denouncing the supposed crimes of our government throughout Africa. Such propaganda is difficult to suppress, particularly when it enjoys the support of the French Federation of Communes. We cannot confiscate every leaflet circulating through our colonies.\n\nThe struggle is not necessarily lost, however, for we can concentrate our efforts upon one particular region. Our agents will close radio stations and confiscate every suspicious document. By doing so, we can at least reduce the effect of the Communard propaganda offensive in one or two selected territories..."
  france_events.68.a:0 "Concentrate upon Tunisia."
  france_events.68.b:0 "Concentrate upon Mauritania and southern Algeria."
  france_events.68.c:0 "Concentrate upon Senegal and Guinea."
  france_events.68.e:0 "Concentrate upon Sudan and Upper Volta."
  france_events.68.f:0 "Concentrate upon Chad and Niger."

  france_events.71.t:0 "The Tenth Congress of the Third International"
  france_events.71.desc:0 "The Second American Civil War is raging, while numerous conflicts elsewhere in the world stand poised to erupt. The Third International recognizes that the world revolution is approaching. After France hosted the previous congress, many activists have suggested that the Union of Britain should host the tenth."
  france_events.71.a:0 "It will be an honour to host the congress."

  france_events.72.t:0 "The Tenth Congress of the Third International"
  france_events.72.desc:0 "Our British comrades have reminded us that they are prepared to host the Tenth Congress of the Third International in London. We must now confirm whether [ROOT.GetNameDef] will participate."
  france_events.72.a:0 "We shall attend."

  france_events.86.t:0 "The Tenth Congress of the Third International Opens"
  france_events.86.desc:0 "With the delegations assembled in London, the Tenth Congress of the Third International formally opens with an address by Comrade Eric Blair. In what has already become known as the “Sword and Shield Speech,” he emphasizes that the International must redouble its efforts to forge “Damocles”—a weapon capable of annihilating the reactionaries of the entire world."
  france_events.86.a:0 "Perfectly said, Comrade Blair!"

  france_events.87.t:0 "Day Two: The American Question"
  france_events.87.desc:0 "On the second day of the congress, the delegates turn to the most urgent matter before them: the development of the American Civil War. Since both Huey Long and the federal government have forced our comrades in the Combined Syndicates of America onto the defensive, the congress resolves to provide Reed and his supporters with additional assistance."
  france_events.87.a:0 "Provide resources, industrial machinery, and weapons."
  france_events.87.b:0 "Send a squadron of fighter aircraft."
  france_events.87.c:0 "Organize a volunteer legion."
  france_events.87.f:0 "There is nothing we can do."

  france_events.90.t:0 "French Assistance Arrives"
  france_events.90.desc:0 "Our French comrades have agreed to provide us with additional assistance. Despite constant threats from the air, the supplies have reached us through Mexico. Industrial equipment, advanced mechanical components, and a group of industrial advisers have now arrived in Chicago."
  france_events.90.a:0 "Thank you, comrades!"

  france_events.91.t:0 "British Assistance Arrives"
  france_events.91.desc:0 "Our British comrades have agreed to provide us with additional assistance. Despite constant threats from the air, the aid has reached us through Mexico. A fighter squadron crewed by British pilots has now arrived in Chicago."
  france_events.91.a:0 "Thank you, comrades!"

  france_events.94.t:0 "Mexican Assistance Arrives"
  france_events.94.desc:0 "Our Mexican comrades have agreed to provide us with additional assistance. Despite the constant threat from the air, the supplies were smuggled overland. Crates filled with weapons have now arrived in Illinois."
  france_events.94.a:0 "Thank you, comrades!"

  france_events.97.t:0 "Day Three: Hemingway's Speech"
  france_events.97.desc:0 "Although the American agenda has formally concluded, Ernest Hemingway, the Combined Syndicates' delegate to the congress, is granted an opportunity to address the chamber. He thanks everyone who has supported the Combined Syndicates of America and calls upon every socialist country in the world to join its struggle against reaction. His address receives an enthusiastic response, particularly from the French delegation."
  france_events.97.a:0 "Yes, we can!"
  france_events.97.b:0 "Yes, we can!"
  france_events.97.c:0 "A magnificent speech."

  france_events.98.t:0 "Day Three: Hemingway's Speech"
  france_events.98.desc:0 "The socialist representative Ernest Hemingway has delivered a speech before the congress of the Third International condemning our operations against the Combined Syndicates of America and calling upon the delegates to support those Reds in their war against us. We must redouble our efforts and destroy Reed before he receives still more foreign assistance!"
  france_events.98.a:0 "Forward!"

  france_events.99.t:0 "The Cambridge Conference"
  france_events.99.desc:0 "While the politicians exchange pleasantries in London, British and French scientists have assembled at the ancient University of Cambridge for a special conference. The delegates have resolved that the socialist countries should combine their scientific efforts to develop a secret weapon capable of defending the revolution against the growing threat of imperialism."
  france_events.99.a:0 "Knowledge is power."

  france_events.100.t:0 "Day Five: Appeal for Aid to Chile"
  france_events.100.desc:0 "The socialist government in Santiago is surrounded by reactionaries, most notably those in Argentina. The best means of keeping the red flag flying above the revolutionary government may be to request assistance from the Third International during its present congress."
  france_events.100.a:0 "We are never alone."

  france_events.101.t:0 "Day Five: Chile Requests Assistance"
  france_events.101.desc:0 "The Chileans have requested our assistance in reforming their armed forces so that they can resist imperialist reactionaries hostile to the revolution, particularly Argentina. Chile is almost completely surrounded by enemies, and without our assistance its position will only deteriorate. Moreover, Chile is invaluable to the defence of the revolution in the New World."
  france_events.101.a:0 "We must not allow Chile to fall to the counterrevolution!"
  france_events.101.b:0 "We cannot be everywhere at once!"

  france_events.102.t:0 "[FROM.GetAdjective] Assistance Refused!"
  france_events.102.desc:0 "Our appeal for assistance has failed to move [FROM.GetNameDef]. They insist that Chile is fully capable of defending itself while continuing to advance the revolution throughout South America."
  france_events.102.a:0 "We shall have to tighten our belts."

  france_events.103.t:0 "[FROM.GetAdjective] Assistance Approved!"
  france_events.103.desc:0 "[FROM.GetNameDefCap] has agreed to extend a helping hand. Once its preparations are complete, the first shipment of assistance should arrive within a few days."
  france_events.103.a:0 "Excellent!"

  france_events.104.t:0 "[FROM.GetAdjective] Assistance Arrives"
  france_events.104.desc:0 "The assistance promised by [FROM.GetNameDef] has arrived. It consists of an entire shipload of rifles. Although they are neither the newest nor the most effective models available, they can still serve us well."
  france_events.104.a:0 "This assistance is sorely needed."

  france_events.110.t:0 "The Final Declaration of the Tenth Congress"
  france_events.110.desc:0 "Almost every important resolution was finalized during the first week, after which the congress turned to less pressing matters. Following ten days of negotiation, discussion, and consultation, the delegates have assembled to formulate one final declaration—a programmatic statement affirming the eternal brotherhood of the proletariat and its common resistance to imperialism wherever and whenever it appears."
  france_events.110.a:0 "[FRA_workers_of_the_world_unite]"

  FRA_workers_of_the_world_unite_ENG:0 "Workers of the world, unite!"
  FRA_workers_of_the_world_unite_FRA:0 "Prolétaires de tous les pays, unissez-vous !"
  FRA_workers_of_the_world_unite_SPA:0 "¡Proletarios del mundo, uníos!"
  FRA_workers_of_the_world_unite_ITA:0 "Proletari di tutti i paesi, unitevi!"
  FRA_workers_of_the_world_unite_POR:0 "Proletários de todos os países, uni-vos!"
  FRA_workers_of_the_world_unite_RUS:0 "Proletarii vsekh stran, soyedinyaytes’!"
  FRA_workers_of_the_world_unite_IRE:0 "A lucht oibre an domhain, aontaígí!"

  france_events.124.t:0 "French Assistance Arrives!"
  france_events.124.desc:0 "Our French comrades have learned of the plight of the Spanish workers and sent us an immense quantity of supplies! Numerous volunteers have accompanied the shipment, ready to sacrifice their lives for the solidarity of the world proletariat!"
  france_events.124.a:0 "Wonderful!"

  france_events.125.t:0 "French Assistance Arrives!"
  france_events.125.desc:0 "The assistance promised by our French comrades has arrived at Santiago Airport. Several tonnes of equipment, machinery, and construction materials are now at our disposal. How should we employ them?"
  france_events.125.a:0 "Use them to improve our armed forces."
  france_events.125.b:0 "Use them to strengthen our industry."
  france_events.125.c:0 "Use them to fortify the Argentine frontier."

  france_events.127.t:0 "Organisation internationale de recherche du Phalanstère"
  france_events.127.desc:0 "Time passes swiftly, and it has become clear that the world revolution requires more than the complete personal devotion of individuals. Since France and Britain are the world's most highly developed socialist countries, almost everyone agrees that they should initiate a long-term programme of research assistance for the benefit of other nations. The resulting institution is known as the Organisation internationale de recherche du Phalanstère. Its associated Internationale du Phalanstère projects are intended to provide technical assistance to socialist countries throughout the world. The only remaining question is whether we should join."
  france_events.127.a:0 "Participation does sound worthwhile."

  france_events.128.t:0 "The Internationale du Phalanstère Industrial Programme"
  france_events.128.desc:0 "Many recognize that the highly developed syndicalist members of the Third International have an obligation to provide industrial assistance to their less developed partners whose industries cannot yet meet their domestic needs. We must now decide whether to join our French brothers in establishing a vast worldwide programme of industrial assistance for our working-class comrades across the globe."
  france_events.128.a:0 "That sounds like an excellent idea!"

  france_events.129.t:0 "Assistance from the Phalanstère"
  france_events.129.desc:0 "As part of the Internationale du Phalanstère programme, our comrades in Paris and London have supplied us with a considerable quantity of desperately needed assistance. Industrial machinery, mining equipment, weapons, ammunition, and countless other materials have arrived at our ports and airfields and now await distribution throughout the country."
  france_events.129.a:0 "Excellent!"
  france_events.129.b:0 "We do not want their assistance."

  france_events.159.t:0 "Paris Has Fallen!"
  france_events.159.desc:0 "Paris—the City of Light, the cradle of revolution, and the capital of France—has fallen to the enemy! The invaders are already encountering resistance from the popular self-defence forces. We must organize a counterattack immediately and retake the city."
  france_events.159.a:0 "Arise, ye prisoners of starvation!"

  france_events.160.t:0 "The Liberation of Alsace-Lorraine"
  france_events.160.desc:0 "We have triumphed across the former French provinces of Alsace-Lorraine and secured the entire region. The Germans are no longer capable of resisting our advance, and these lands have finally returned to the embrace of France!"
  france_events.160.a:0 "...This is the final struggle; let us unite, and tomorrow..."

  france_events.161.t:0 "Celebrations of the Fourteenth of July"
  france_events.161.desc:0 "On this day in 1789, the French people stormed the Bastille and inaugurated the French Revolution. Every year, magnificent celebrations are held throughout the country, from the capital to the smallest rural communities. Although France is now a socialist country, the Fourteenth of July retains its importance. Military parades, period costumes, exhibitions, speeches, popular entertainments, and street banquets are all expected.\n\nThe public generally believes that such festivities can help unite the country as war draws steadily closer. Whatever disagreements divide the political factions, every true Frenchman recognizes the storming of the Bastille as the common origin of revolutionary politics."
  france_events.161.a:0 "The martyrs of revolution shall live forever!"

  france_events.163.t:0 "International Workers' Day"
  france_events.163.desc:0 "In 1889, the delegates of the Second International voted to designate 1 May as an annual day of collective action. The date was selected upon the proposal of the pioneering French Marxist Jules Guesde to commemorate the workers who died at the Haymarket Affair in Chicago in 1886 while struggling for the eight-hour working day. Every year, the proletarian masses organized enthusiastic demonstrations, though these frequently produced further street fighting and bloodshed. On International Workers' Day, the proletariat refused to work and marched to demand its rights. The demonstrators waved red flags, sang L’Internationale, and wore red eglantines upon their coats or carried lilies of the valley wrapped in scarlet cloth in memory of the massacre. This commemorative and confrontational festival—a day of freedom wrested from the claws of capitalism—naturally terrified the bourgeoisie.\n\nFollowing the revolution, 1 May became a statutory holiday and a great official festival marked by celebrations, memorial ceremonies, demonstrations, popular festivities, and dances. At home, the people celebrate the victory of the revolution and the liberation of the workers. Abroad, workers continue their struggle in the hope that the free wind of revolution will one day reach every corner of the world. Our people rejoice while remembering the arduous road already travelled. The revolution was once merely a dream grasped tightly inside the factories; now it is vigorous and flourishing. The heart of the revolution beats proudly in France, inspiring every comrade who remains oppressed."
  france_events.163.a:0 "The struggle will end in victory!"

  france_events.164.t:0 "The First Bourges International Arts Festival"
  france_events.164.desc:0 "The first Bourges International Arts Festival has opened today. Only the combined syndicalist efforts of France and Britain have made this international festival of avant-garde art possible. The exhibition includes numerous celebrated realist paintings commissioned by the French Federation of Communes, works from Britain, Russia, and the United States, and a mural by the renowned artist Diego Rivera. The festival will continue for two weeks beneath the gaze of the entire world. It is time to admire the masterpieces beneath the spotlights."
  france_events.164.a:0 "This will be the first of many festivals, and our government will ensure that they continue forever!"

  france_events.165.t:0 "France Promotes the International Avant-Garde"
  france_events.165.desc:0 "The efforts of the French government have given birth to an international avant-garde devoted to creating new artistic styles, unconventional forms of expression, and works unlike anything seen before.\n\nThe French government believes that this art will provide an excellent means of spreading syndicalism without violence. It has now invited us to participate."
  france_events.165.a:0 "Count us in!"

  france_events.170.t:0 "An Alliance with the Third International?"
  france_events.170.desc:0 "The Third International, the military alliance of the world's great socialist powers, has discreetly approached us with an invitation to join. Such an alliance could offer considerable benefits to our country while advancing the struggle for the liberation of the global proletariat. We would undoubtedly receive extensive assistance in combating our enemies and achieving our military objectives. Protection is naturally indispensable, but assistance could also develop our armed forces and even improve our economy through the Phalanstère programmes.\n\nMembership could nevertheless impose intimidating obligations upon us and lead inevitably toward war against the Kaiser and his allies. How should we respond?"
  france_events.170.a:0 "Unity makes us strong!"
  france_events.170.b:0 "On second thought, perhaps not..."

  france_events.171.t:0 "[From.GetNameDefCap] Accepts!"
  france_events.171.desc:0 "Celebrate! [From.GetNameDefCap] has accepted our invitation and joined our military alliance, exactly as we had hoped. Having made this decision, they will receive our unstinting support as allies in the struggle to liberate the global working class, while we have gained a powerful partner against our undeniable enemies. Before long, still more voices will sing: “The Internationale shall unite the human race!”"
  france_events.171.a:0 "Excellent!"

  france_events.172.t:0 "[From.GetNameDefCap] Refuses!"
  france_events.172.desc:0 "Regrettably, [From.GetNameDef] has refused to join our military alliance. Perhaps the undeniable strength of our enemies has frightened them, or perhaps their commitment to proletarian liberation is insufficiently sincere. Whatever the explanation, this is an unfortunate result for our diplomacy. Nevertheless, many others will join our struggle: “The Internationale shall unite the human race!”"
  france_events.172.a:0 "It is their loss."

  france_events.200.t:0 "The Damocles Project"
  france_events.200.desc:0 "German agents have obtained a document concerning a research programme financed by members of the Third International. Known as the “Damocles Project,” this multinational undertaking seeks to harness the destructive power of nuclear reactions and create “the most devastating bomb in human history.” The renowned German physicist Albert Einstein has warned that a successful “nuclear bomb” might reduce an entire city to ashes.\n\nGerman intelligence has shared this information with Germany's closest allies, and almost the entire world is now aware of the project. Some dismiss it as childish fantasy, but many experts fear that the research may produce tangible results."
  france_events.200.a:0 "If they succeed..."

  france_events.301.t:0 "The End of the Third International"
  france_events.301.desc:0 "The war has not unfolded as we hoped. Our courageous soldiers and fearless proletarian governments have expended their last measure of blood and labour, but the forces of reaction have proved too powerful for the international proletariat. After years of war, the armies of Britain and France have been steadily weakened by their enemies, and the balance has shifted inexorably against us. We continued to hope for a worldwide uprising of the workers, but the situation has now become so grave that neither Britain nor France can resist the hostile powers any longer. None of the remaining members of the Third International can escape the consequences. Any alliance depends upon strength and prestige. We now possess neither, and the International is collapsing.\n\nThe consequences will be immense. The former determination to stand unyieldingly against reaction has rapidly given way to defeatism. Resistance movements and allied governments throughout the world increasingly regard the cause of the Third International as a thing of the past and have begun considering disarmament, surrender, or a negotiated peace. Subsidiary institutions such as the Internationale du Phalanstère have effectively ceased to exist. Unless the war undergoes a miraculous reversal, former members not yet fully engaged in the fighting will soon withdraw, while those already under invasion will either be forced into unconditional surrender or destroyed completely.\n\nThe torch of revolution has grown dim. The working class has fallen into despair and now looks desperately in every direction for something that might preserve its existence."
  france_events.301.a:0 "Damn it all..."

  INT_collapse_base:0 "Born from the ashes of the Weltkrieg more than twenty years ago, the Third International became both the world's greatest hope and its greatest fear—the first intergovernmental alliance of socialist states, united from beginning to end by the dream of global workers' revolution."

  france_events.302.t:0 "The Collapse of the Third International"
  france_events.302.desc.germany:0 "$INT_collapse_base$\n\nYet the German global order has proved overwhelmingly powerful. After a succession of bitter struggles, Germany and its allies now control most of Britain and France. The Third International and its associated institutions have been destroyed and can no longer regroup. For decades, the world revolution appeared to be an historical tide drawing ever closer to reality. It has now become impossible for decades to come, perhaps even longer. Let us hope it has not been extinguished forever."
  france_events.302.desc.entente:0 "$INT_collapse_base$\n\nYet the governments in exile have proved extraordinarily tenacious. After making immense sacrifices during the war, the Entente has recovered most of Britain and France. The Third International and its associated institutions have been destroyed and can no longer regroup. For decades, the world revolution appeared to be an historical tide drawing ever closer to reality. It has now become impossible for decades to come, perhaps even longer. Let us hope it has not been extinguished forever."
  france_events.302.desc.germany_entente:0 "$INT_collapse_base$\n\nYet the old order has proved overwhelmingly powerful. Surrounded on every side, Britain and France have been defeated by the combined attacks of Germany and the Entente. The Third International and its associated institutions have been destroyed and can no longer regroup. For decades, the world revolution appeared to be an historical tide drawing ever closer to reality. It has now become impossible for decades to come, perhaps even longer. Let us hope it has not been extinguished forever."
  france_events.302.desc.russia:0 "$INT_collapse_base$\nYet although the Third International succeeded in defeating Germany, subsequent events overturned the situation once again. Another world war destroyed almost everything, and the alliance finally collapsed beneath the weight of its confrontation with Russia. The Third International and its associated institutions have been destroyed and can no longer regroup. Nevertheless, its victory over Germany has permanently transformed the world as we know it. The world revolution may be halted for decades or longer, but its legacy is a new world profoundly different from the old order."
  france_events.302.desc.generic:0 "$INT_collapse_base$\n\nThe enemies of the International have simply proved too numerous and too powerful. The socialist governments of Britain and France have been decisively defeated, leaving no power strong enough to sustain the alliance. The subsidiary institutions of the Third International have likewise ceased to operate. For decades, the world revolution appeared to be an historical tide drawing ever closer to reality. It has now become impossible for decades to come, perhaps even longer. Let us hope it has not been extinguished forever."
  france_events.302.a:0 "Those years now seem like a dream..."
  france_events.302.b:0 "There is no longer any reason to fear revolution."
  france_events.302.c:0 "Everything has returned to its proper order."
  france_events.302.d:0 "Give it back! This is outrageous! Those occupied territories belong to us!"
  france_events.302.e:0 "The expected result, though they might have resisted a little longer..."
  france_events.302.f:0 "With this final victory, no one can deny the historic magnitude of our achievement."
  france_events.302.g:0 "Destroyed in this manner... hardly satisfactory."
  france_events.302.h:0 "There could be no better outcome."
  france_events.302.i:0 "Everything that begins must end."

  france_events.999.t:0 "The Capitalist Economy Collapses!"
  france_events.999.intro:0 "Over the past several days, bankers, capitalists, and tyrants have fought among themselves over the profits stolen from the labour of the workers, exposing their ugliness before the workers and peasants of the entire world. They call it a terrible catastrophe. They call it Black Monday! They claim that the collapse came without warning and that no economist could have predicted it! But the workers are not fools. The people can see through their lies.\n\nAs the great philosopher Karl Marx foretold, this collapse is the inevitable result of capitalism. When the capitalists seize and misuse the wealth created by the workers, they begin devouring one another like rabid dogs. They fight to seize the final morsels of fat for themselves while continuing to ride upon the workers' backs, leaving ordinary people to struggle and starve beside the road."
  france_events.999.desc:0 "$france_events.999.intro$\n\nFor now, we can only watch as the capitalist masters consume the countries of the world alive. Yet this is also a great awakening for workers and peasants everywhere. Before long, the workers of those countries will begin organizing against their oppressors. We must prepare ourselves and provide the workers of the world with a true example!"
  france_events.999.a:0 "Workers of the world, unite!"

  france_events.1037.t:0 "The Ninth Congress of the Third International"
  france_events.1037.desc:0 "Socialist delegates from throughout the world have gathered in Paris and the surrounding region for a new congress of the socialist movement. After the French Revolution of 1920, French socialists established the Third International and began assisting and guiding labour movements across the world. Although dominated by syndicalists, the International is a broad-tent organization welcoming many different kinds of socialist state and political movement. For the congress, the Château de Versailles has become a sea of red, where France welcomes the delegates with parades and speeches.\n\nThe principal items upon the agenda are the export of revolution, with particular attention to Asia and North America; the conflict in Spain; anticolonial policy; and requests from several countries to join the military alliance of the Third International."
  france_events.1037.a:0 "An interesting development."

  france_events.1038.t:0 "The Tenth Congress of the Third International"
  france_events.1038.desc:0 "The Ninth Congress of the Third International in Paris discussed the export of revolution, support for socialist movements, and stronger relations among the existing socialist states. Following the success of that congress, the tenth has convened in London.\n\nBritain has welcomed delegates from across the world with ceremonial gun salutes, Scottish bagpipes, and enthusiastic receptions. Europe is drawing ever closer to war, and military and economic cooperation among the socialist countries is expected to dominate the agenda. Britain and France will determine the policy of the Third International during the congress."
  france_events.1038.a:0 "Interesting."

  france_events.1039.t:0 "The International Avant-Garde Arts Programme"
  france_events.1039.desc:0 "The French Federation of Communes and the Union of Britain jointly inaugurated the International Avant-Garde Arts Programme several days ago. It seeks to create new artistic styles, genres, and literary techniques, with works emphasizing socialist, unorthodox, antitraditional, and antireligious themes.\n\nReports indicate that painters, writers, and musicians from across the world—from the United States and South Africa to Japan—will participate. The first Avant-Garde Arts Festival will be held in Cannes within two years to exhibit the project's achievements. Will this mark the beginning of a new syndicalist literature and art?"
  france_events.1039.a:0 "Solidarity forever!"

  FRA_internationale_category:0 "Affairs of the Third International"
  FRA_internationale_category_desc:0 "The alliance uniting the world's socialist countries is diverse indeed. Together, we shall work to make the world fit for everyone."

  FRA_phalanstere_category:0 "Internationale du Phalanstère"
  FRA_phalanstere_category_desc:0 "During the Tenth Congress of the Third International, we resolved to establish an ambitious programme of industrial and economic development that would provide assistance to every socialist developing country that requested it. Together we shall advance and create a better future for humanity."

  FRA_join_phalanstere:0 "Join the Internationale du Phalanstère"
  FRA_join_phalanstere_desc:0 "The scientific organization known as the Internationale du Phalanstère was established to unite the talents of scientists from across the Third International. We should join it and contribute our knowledge and expertise."


