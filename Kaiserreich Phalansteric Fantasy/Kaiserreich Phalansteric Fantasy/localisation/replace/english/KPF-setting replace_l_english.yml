  RULE_OPTION_RUS_FORPOL_INT_DESC: "In an act of socialist unity and fraternity, Russia joins the Third Internationale's military alliance.$RUS_FORPOL_REQUIREMENTS$\n\nIf any §CPSR-Left (Spiridonovist)§! in §Y$RUS_PATH$§!, then the French Federation of Communes must choose §CAnarchistes§! in §Y$FRA_PATH$§!\n§CNote: If the French Federation of Communes is no longer the leader of the Third Internationale, the new faction leader must have a $radical_socialist_coloured$ government§!\n\nIf §CRDP - Sulimov§! or any §CVST-Centre§! in §Y$RUS_PATH$§!, then the French Federation of Communes must §Rnot§! choose any §CParti socialiste français§! or §CCoalition nationale syndicaliste§! in\n§Y$FRA_PATH$§!\n§CNote: If the French Federation of Communes is no longer the leader of the Third Internationale, the new faction leader must also §Rnot§! have a $totalist_coloured$ government§!\n\n§RNot§! §CPSR-Left (Maximalist) - Ustinov§! in §Y$RUS_PATH$§!"
  RULE_OPTION_RUS_FORPOL_RUS_DESC: "Believing that they must guide the socialist world and owing to their unique geopolitical position, Russia creates its own military alliance.$RUS_FORPOL_REQUIREMENTS$\n\nIf §CRDP - Sulimov§! or any §CVST-Centre§! in §Y$RUS_PATH$§!, then the French Federation of Communes must choose any §CParti socialiste français§! or §CCoalition nationale syndicaliste§! in\n§Y$FRA_PATH$§!\n§CNote: If the French Federation of Communes is no longer the leader of the Third Internationale, the new faction leader must have a $totalist_coloured$ government§!"

  RULE_OPTION_OTT_PATH_NATPOP_DESC: "$RULE_OPTION_OTT_PATH_FEVZI_START_DESC$ $RULE_OPTION_OTT_PATH_ENCEVOUR_START_DESC$ Endeavour Front.\nInspired by the \"Kadro\" paper, and of developments elsewhere, OHF extremists from within the Front take control of the party, and transform the Ottoman Empire into a totalitarian one-party-state led by the Kadroist faction of the §nOsmanlı Halk Fırkası§!, or Ottoman People's Party.\nThis is not without its consequences...\n\n§RRequires:§!\nAny §CParti socialiste français§! or §CCoalition nationale syndicaliste§! in §Y$FRA_PATH$§!\nAny §CMaximists§! in §Y$ENG_PATH$§!\n§CDictatorship§! in §Y$RUS_AFTERMATH$§!"
  TUR_PATH_KADRO_REQUIREMENTS: "Any §CParti socialiste français§! or §CCoalition nationale syndicaliste§! in §Y$FRA_PATH$§!\nor any §CMaximists§! in §Y$ENG_PATH$§!\nor any §CSZRS§! or §CPSR-Left (Maximalist)§! or §CVST-Left - Zinovyev§! in §Y$RUS_PATH$§!"

  ALB_enver_hoxha_leader_desc: "§YBorn:§! §LOctober 16th, 1908, in Gjirokastër, Vilayet of Yanya, Ottoman Empire§!\n§YBackground:§! §LComing from a Bektashi background, Hoxha studied in France and became affiliated with the Marxist-Leninist group there. Upon returning to Albania, the young Hoxha joined his idol, Ali Kemendi's, revolutionary movement, but eventually became disillusioned with the movement and the man himself. Calling upon his contacts in the French Federation of Communes, Hoxha then founded a small 'vanguardist' organisation, and thanks to foreign intervention, he and his group now stand astride all of Albania.§!"

  indochina_events.2.d: "Among all the revolutionaries and patriots in the Viet Minh, four factions stand out:\n\nAfter the crackdown in 1926, Ho Chi Minh's Revolutionary Youth League suffered from internal split. The Indochinese Revolutionary League is its direct successor. Adhering to orthodox anarcho-syndicalism, the current leader Ta Thu Thau, recently returned from France, succeeded in organising trade unions in Saigon and some other cities.\n\nInfluenced by the French Marxist-Leninist groups, some hard-liners broke away from the League in the 1931 Paris Conference and formed New Viet Revolutionary Party, or Tan Viet. The Tan Viet believes in the virtue of iron discipline and secret movement. As a result, they proved to be effective in infiltrating the colonial police force and garrison.\n\nThe VNQDD, or the Vietnamese Nationalist Party, is modelled after the Chinese Nationalist Party or KMT. This party is popular among the petit bourgeoisie and wealthy farmers, especially in northern Vietnam. The failed Yen-Bai mutiny cut down many of the party's members, but also won them heroic reputation.\n\nIn 1928, Nguyen An Ninh, a prominent anarchist revolutionary in Indochina, founded the Aspiration Youth. Convinced that syndicalism cannot win the revolution, he modelled his movement on traditional secret societies to agitate the revolutionary spontaneity of peasants. While its anarchist ideals attracted many intellectuals, their connections to the rural area played a key role in the revolution and ensured their dominance in the Viet Minh.\n\nWhile the initial euphoria of revolution unites all factions, only time can tell whether this unity will endure the forthcoming challenges."
  indochina_events.41.d: "Pham Van Dong, despite all his merits, has a personality of administrator and intellectual rather than a real leader. He is considered too soft-willed and amicable to the enemy by the hardliners in the party. In the politburo meeting, Head of the Organisation Department Le Duc Tho led an attack against Pham Van Dong. Le Duc Tho, with his authority brought by close connections to the French Marxist-Leninist groups, claimed that Pham Van Dong does not really understand the ideology of Leninism. It would be better for Dong to work as the prime minister."
  indochina_events.156.d: "Today a meeting is held in Paris by the 'French Friends of Indochina' association. In this very rare case, both the Revolutionary Workers' Party veteran Marcel Cachin and the PSF member Jacques Doriot attended the meeting and spoke for a closer relationship with Indochina, a newly independent socialist country in Asia. They argued that the Commune has done a lot to help the Indochinese people to win their independence, but that the responsibility of France for her former colony does not end. We can and we should offer to the people there a special relationship, as it passes through the present period of transition on its way to a new era - an era of pride and independence, and era of enlightenment and socialism - an era which, when contrasted with the bleak past of colonial oppression, will truly represent the ideal of socialist revolution."
  INC_pham_van_dong_leader_desc: "§YBorn:§! §LMarch 1st, 1906, in Quang Ngai Province, Protectorate of Annam, Indochinese Union§!\n§YBackground:§! §LIn 1924, Pham Van Dong travelled to southern China. There, he met Ho Chi Minh, and quickly became one of his most trusted confidants and leaders of men. He witnessed the tragic end of Vietnamese syndicalist movement and fled to France. In exile, he developed an interest in the Revolutionary Workers' Party led by Souvarine and its theory of vanguard partyism. The idea of a vanguard group of disciplined intellectuals leading the revolution captured him. After the split of the League in 1931, he founded Tan Viet party and started infiltrating the colony. Most of his colleagues find him forever diligent and energetic, a reliable and loveable person as well as an ideal organiser and administrator. On the other hand, his enemy fear his ability to run the party and state machine.§!"

  TUR_guide: "§MOttoman People's Party§! ($authoritarian_democrat_coloured$)\n£white_dot Pass the 3 starting reforms.\n£white_dot After you reform the Ministry of the Interior, wait 200 days.\n£white_dot When you get told of a conspiracy against Kemal have the \"rats flushed out\".\n\n£white_dot To not fail as Mustafa Kemal:\n£white_dot Ensure the Alīye-i Emniyet Hizmeti is reformed.\n\n§MFreedom and Accord Party§! / §MDemocratic Party§! ($market_liberal_coloured$ / $social_liberal_coloured$)\n£white_dot Block 2 of the first 3 OHF reforms.\n£white_dot When Kemal meets with the Sultan on the replacement of a Senator have him remain silent.\n£white_dot the §mHİF§! will win early elections after the §aOHF§! §lsplits§!.\n\n£white_dot To go $social_liberal_coloured$, take Multi-Level Democracy and then ensure the §lDF§! are more popular than the §mHİF§! on the ideology wheel.\n\n£white_dot To not fail as Sabahaddin:\n£white_dot Keep §cConservatives§! representative support above 0.\n\n§MMilitary Government§! ($paternal_autocrat_coloured$)\n£white_dot Pass the 3 starting reforms.\n£white_dot After you reform the Ministry of the Interior, wait 200 days.\n£white_dot Delay the Maintenance of Order Law by avoiding the Balkan War and the Assyrian Revolt.\n£white_dot DO NOT flush out the rats when told of a conspiracy against Kemal.\n£white_dot Have Kemal assassinated.\n£white_dot As the §aOHF§! falls apart have Fevzi's bid for leadership succeed.\n\n*These are just 1 of the many ways these factions can rise to power.\n\n§MEndeavour Front§! ($authoritarian_democrat_coloured$ / $market_liberal_coloured$)\n£white_dot Follow the same steps as the §MMilitary Government§! path and lift the state of emergency.\n£white_dot Complete the focus \"Centralise State Authority\" to remain with the §aOHF§! wing of the front or complete the focus \"Break up State Monopolies\" to turn to the §mDF§! wing.\n\n§MOttoman People's Party (Kadroist)§! ($national_populist_coloured$)\n£white_dot Follow the same steps to get the §MEndeavour Front§!, but the following should have happened:\n£white_dot The §oMaximists§! should be in power in the §MUnion of Britain§!.\n£white_dot The §oCoalition nationale syndicaliste§! or §oParti socialiste français§! should be in power in the §MFrench Federation of Communes§!.\n£white_dot §nSavinkov§! should remain in power in §MRussia§!.\n §CUse the game rules to guarantee all of these happens.§!\n£white_dot If all of this is fulfilled, the focus \"Incorporate the Kadroist Movement\" should appear, complete the focus \"Establish the Committee of Inquest\" for the §nOttoman People's Party§! to take power."
  TUR_guide_1: "The Fallen Empire\n\n§MOttoman Salvation Party§! - §MConservative§! / §MLiberal§! ($paternal_autocrat_coloured$ / $social_conservative_coloured$ / $social_liberal_coloured$)\n£white_dot After falling as the §aOHF§!, Refet Bele will take over, forming the §POttoman Salvation Party§!.\n£white_dot Three months after restoring the Meclis-I Mebusân, elections will play out between the §cconservative§! and §lliberal§! wings of the party, with both installing Ömer I as the new Sultan down the line.\n\n§MTurkish People's Party (Kemalist)§! ($authoritarian_democrat_coloured$)\n£white_dot After falling as the §mHİF§! or §lDF§!, Mustafa Kemal will coup the government and take over with the §aOHF§!.\n£white_dot After his death, Fahrettin Türkkan will attemp a coup, have Ismet Reşit and the OHF leaders stage a counter-coup.\n£white_dot A republic will be declared later on.\n\n§MTurkish People's Party (Kadroist)§! ($national_populist_coloured$) / §MTurkish People's Party (Revolutionary)§! ($totalist_coloured$)\n£white_dot Follow the same steps as §MTurkish People's Party (Kemalist)§!, but the following should have happened:\n£white_dot The §oMaximists§! should be in power in the §MUnion of Britain§!.\n£white_dot The §oCoalition nationale syndicaliste§! or §oParti socialiste français§! should be in power in the §MFrench Federation of Communes§!.\n£white_dot §nSavinkov§! should remain in power in §MRussia§!, otherwise either §oUstinov§! or §oZinovyev§! should have taken power after the socialist revolution.\n£white_dot After completing the focus \"Nationalisation Dilemma\", choose a total nationalisation.\n£white_dot When we have 80% or more traditional resistance with the \"Total Nationalisation\" idea, the §nKadro§! wing of the §aTHF§! will take power.\n£white_dot After completing the focus \"Permament Revolution\", we will be able to remain §nTHF§! or have the §oMAF§! take over.\n\n§MTurkish People's Party (Militarist)§! ($paternal_autocrat_coloured$)\n£white_dot After falling as the §mHİF§! or §lDF§! and with Mustafa Kemal dead, Fevzi Çakmak will take over.\n£white_dot Or, follow the same steps as §MTurkish People's Party (Kemalist)§!, but have Fahrettin's coup be successful, and do not call troops from the east.\n£white_dot Fevzi Çakmak will seize power, and later on, establish a republic.\n\n*These are just one of the many ways these factions can rise to power."