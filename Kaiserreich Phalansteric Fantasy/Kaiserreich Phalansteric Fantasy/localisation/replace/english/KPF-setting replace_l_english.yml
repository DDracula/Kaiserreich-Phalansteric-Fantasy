  #POR
  POR_totalist_party: "PRTP (Rates)"
  POR_totalist_party_long: "Partido Revolucionário dos Trabalhadores Portugueses (Rates)\n§LFollowing his expulsion in 1926, following a refusal to collaborate with the Syndicalist-dominated CGT, former General Secretary José Carlos Rates has created his own splinter organisation still standing firm on an opposition of anarchist collaboration. Still holding influence over an older contingent of Revolutionary Workers' Party members, Rates has grown inspired by the revisionist, nationalistic Totalist school of thought during his time in France. If he were to take back control of the Party, Rates would likely take his revenge against the ascendant left-wing that ousted him and implement a technocratic, socialist system to safeguard the revolution from within and without.§!\n"
  POR_syndicalist_party_long: "Comité de Unidade de Frente Única\n§LFormed with José de Sousa's alliance between the Revolutionary Workers' Party and Trade Unions, the United Front Committee of Unions currently exists as a grouping of socialists, imprisoned and exiled in Paris following the failed 1930 General Strike. The General Confederation of Labour and the Portuguese Anarchist Federation are two interlinked factions, making up the Syndicalist bulwark of the United Front. The CGT is nominally led by founder Manuel Joaquim de Sousa from prison, who is represented by José da Silva Santos Arranha in Paris. The CGT is considered to be the most militant revolutionary group within Portugal, and has subsequently faced the most repression from Lisbon. The Portuguese Anarchist Federation is a wing of the Iberian Anarchist Federation, forming another political front for the CGT. Though de Sousa is a supporter of Pan-Iberian Unity, many within the CGT are at best sceptical, or at worst outwardly hostile to this position.§!\n"
  POR_radical_socialist_party_long: "Comité de Unidade de Frente Única\n§LFormed with José de Sousa's alliance between the Revolutionary Workers' Party and Trade Unions, the United Front Committee of Unions currently exists as a grouping of socialists, imprisoned and exiled in Paris following the failed 1930 General Strike. The Portuguese Revolutionary Workers' Party has struggled since the Restoration. Under the leadership of Bento António Gonçalves, they've operated on a policy of cooperation with the Anarchists and Syndicalists, a departure from the hostitly towards them under José Carlos Rates. By following a line of pragmatism towards the revolution, the Revolutionary Workers' Party hopes that the United Front strategy will bare fruit in time. The Federação Socialista das Associações de Trabalhadores (Socialist Federation of Workers' Associations) represents the moderate socialist trade unionists under the United Front, who maintain a presense within Portugal due to the lack of radical actions undertaken by them. Their small size has relegated them to an intermediary role between the CGT and the PCP.§!\n"

  #PRF
  PRF_radical_socialist_party_alternative: "RWPI"
  PRF_radical_socialist_party_alternative_long: "Revolutionary Workers' Party of India"
  princely_federation_events.348.d: "To say that the Nizam is unpopular in the Federation at the moment would be like saying that the Russians were somewhat perturbed by Brest-Litovsk. His repeated vetoes of core government policy, a government backed and elected by most of the nation's voters, has seen his carefully promoted image as the nation's saviour eroded away faster than land around the Teesta.\n\nAs a result of this growing unpopularity, socialist remnants have reorganised themselves around the rump Revolutionary Workers' Party of India, creating a sizable force aimed at toppling the Nizam and bringing in the reforms he has spent so much time blocking. While normally this group wouldn't have much sway, and would simply just be crushed along with other dissidents, rumours have begun to spread of cooperation between the AIM and these rebels over their mutual anger against the Nizam.\n\nWith fears that Rao himself may soon throw his lot behind this potential insurgency, Razvi and his Razakars have offered to attempt to arrest Rao and eliminate these socialists, as soon as the order is given. Whether the Nizam wishes to go that far is still up in the air..."
  princely_federation_events.349.d: "While Rao may have privately expressed his anger at the Nizam's overreach, until news was leaked to him of his ordered arrest he had not even begun to consider insurrection. Almost immediately however, the Nizam's actions drove him directly into the arms of the rebels, with mutual contacts between the AIM and the RWPI quickly instigating a rebellion with the backing of the government. With Osman's now abysmal popularity, few were willing to come to his aid, with much of the army siding with the government against him. The Razakars themselves were quickly shattered, although Razvi himself has yet to be accounted for.\n\nSeeing the writing on the wall, the Nizam and his family have reported fled via plane, although no one seems to yet know or agree exactly where. Meanwhile at home, Rao and his new allies were quick to seize upon this momentum to declare a republic, with Rao being sworn in as president and RWPI leader P. Krishna Pillai as the new Diwan. The Council of Princes itself has also been dissolved, although negotiations between the Princes and the government have allowed the continued existence of their states as federal constituents, although with somewhat reduced authority than before.\n\nWhile things may have seemingly quickly stabilised with the fall of the Nizam, few can really say what the future holds for the new republic, and many of the princes still fear that their days are numbered if the Revolutionary Workers' Party gains enough leverage. For now though, most people are simply happy to be rid of the tyrant, rather than be distracted by future worries."

  #PUE
  PUE_totalist_party: "Partido Revolucionario de los Trabajadores"
  PUE_totalist_party_long: "Partido Revolucionario de los Trabajadores de Puerto Rico (Revolutionary Workers' Party of Puerto Rico)"
  puerto_rico_events.206.d: "Frustrated over the new, 'class traitor' regime of the PS, many members of the much smaller, more left-wing side of the party have abandoned us, instead moving to form their own organisations or to already existing ones, such as Revolutionary Workers' Party. Bolívar Pagán Lucca has decried the radicals abandoning the party, and in retaliation has founded the Federación Puertorriqueña del Trabajo, a new Trade Union Federation to compete with the CGT and the FLT in the island, with Government sponsorship. With it, we have saved ourselves from the worse as trade unions loyal to the PS and the government have quickly switched sides to the new FPT, but we have still lost a noticeable portion of our support."
  PUE_cesar_andreu_iglesias_leader_desc: "§YBorn:§! §LJuly 31st, 1915, in Ponce, Territory of Porto Rico, United States of America§!\n§YBackground:§! §LCesar Iglesias Andreu started his political career after graduating with a degree in Social Sciences from the University of Puerto Rico, when he began writing articles for the newspaper 'Verdad'('Truth'), which was owned by the Revolutionary Workers' Party of Puerto Rico. By this stage, Cesar had already been a member for years, but as his writings began to become popular, so to did his popularity over the seemingly faceless leadership of the Party. With foreign occupiers taking over Puerto Rico with the intention of giving power to a special type of socialist regime, Cesar was instantly recommended due to his anti-Imperialist and equality-at-all-costs rhetoric, and relative political expertise as a good provisional president. Time will tell whether the decision to place such a young writer will transform Puerto Rico for the better or only have it submit further to foreign interests.§!"

  #RUS
  RUS_totalist_party: "RRRP(b)"
  RUS_totalist_party_long: "Rossiyskaya Revolyutsionnaya Rabotnicheskaya Partiya (bolshevikov) (Russian Revolutionary Workers' Party (of Bolsheviks))\n§LInitially propelled into great national prominence under Vladimir Lenin's fiery leadership, the Bolsheviks drew support from the most desperate and desolate. But their fall from grace has been grand: they turned against their socialist allies in the Soviets, became synonymous with the Red Terror, and lost many, including Lenin himself, in the revolutionary struggle.\n\nThe battered remains of the Bolsheviks who managed to flee White vengeance established themselves in Paris under the leadership of Yakov Sverdlov, and have since taken part in many revolutions around the world. Under Sverdlov, the party has adhered strictly to the writings of Lenin, and remains critical in its support of the Western revolutions. Despite splits and factionalism, the party core remains dedicated, if diminished and vilified within Russia itself.§!\n"
  RUS_syndicalist_party_long: "Vserossiysky Tsentralny Sovet Professionalnykh Soyuzov (All-Russian Central Assembly of Trade Unions)\n§LAfter the Revolutionary Workers' Party was all but wiped out of Russian political life, those Mensheviks who did not wish to join the RDP or Bolsheviks who had fallen out of contact with the central committee ended up operating through radical labour unions. Constantly at odds with the law, a kernel of the Russian Revolution was kept alive by the grassroots labour movement. As the republic's instability grew, the socialists in the unions grew bolder, eventually being able to gain a majority in the central organisation of Russian labour unions.§!\n"
  RUS_totalist5_party_long: "$RUS_totalist5_party_long_tt$\n§LFollowing Zinovyev's revolutionary vanguardist faction's triumphant takeover of the All-Russian Union of Labour, he successfully managed to convince the Russian Revolutionary Workers' Party (Bolsheviks) to abandon their rivalry and join forces in their quest for World Revolution. Despite attempts by Yakov Sverdlov to prevent this, he was ousted, and the new leader of the formerly exiled Bolsheviks, Mikhail Frunze, organised the merger. With the VST's absorption of the émigré RRRP(b) and revolutionary vanguardist consolidation into a single organisation, the decades-long split is over and the followers of Lenin are united once more.§!\n"
  RUS_bolshevik_gamble_event_tt: "We will use all the influence §oGrigory Zinovyev§! has to attempt a takeover of the §oRussian Revolutionary Workers' Party (of Bolsheviks)§!."
  russia_events.127.d: "A mass operation against Russian labour union activists, led by MVD troops and assisted by volunteer Svobodnik and local police officers, has begun across multiple Russian cities. Under the Law on Protection of the State, the authorities have extraordinary powers to investigate, arrest, and punish Bolsheviks and potential Bolshevik accomplices.\n\nThe largest-scale operation was against the All-Russian Central Assembly of Trade Unions present in Petrograd, many of whom have now fled into hiding. While the VTsSPS's central organs have already been banned, it has been well known by the law enforcement that it is merely led from the underground - something that will end today. To justify mass persecution, a virulent press campaign has been launched as 'The one last charge against Bolshevism'.\n\nThe worst clash happened at the Putilov Factory, which resulted in the hospitalisation of at least twenty people, after the workers there tried to resist the arrests. Dozens have been shot and hundreds hospitalised or arrested as the labour leaders have been hunted. There have been solidarity protests and strikes across Russia, but it is clear that under such persecution, legal labour unions are largely being exterminated.\n\nAt this point, many people are simply trying to get by, as long as the violence does not touch them. Given how many members of the VTsSPS are former Reds, their imprisonment now is being argued by the SZRS press as long-delayed justice for the crimes of the Civil War, which they had escaped through the leniency of the past Kadet-SR governments."
  russia_events.263.d: "Streamlining the internal security agencies under the control of a single party organisation has been a long-time goal. Under former governments, law enforcement was lax, and Bolsheviks were allowed to operate at ease. With the new presidential decree, the State Guard - Gosstrazha (Gosudarstvennaya Strazha) - will be expanded into a general security body, and everything from border guard service to law enforcement and the secret police will be incorporated under it. Likewise, the Gosstrazha's duties will involve the protection of the president and the party leadership, and they will be picked only from the most loyal Russians, swearing their oath of service to the Vozhd himself. Savinkov has appointed Flegont Klepikov as the Director of the Gosstrazha from his earlier position as the Director of Okhrana. Director Klepikov immediately began personnel transfers to ensure the efficiency and loyalty of the organisation.\n\nThe question of the actual extent of the Gosstrazha's powers has worried the military in particular. It has been suggested to transfer special military areas, such as the North Caucasus and future 'liberated' territories, under the Gosstrazha's authority. This way, the military could focus purely on external enemies, while the actual administration of areas behind the frontline would be done by Gosstrazha units under political leadership. However, it would essentially expand the organisation from an extensive security agency into a full 'shadow army' controlled by the Vozhd's men directly, which has made the army leadership worried over inefficient use of manpower and resources - and though it is not said openly, worried for their lives."
  russia_democratic_events.47.d: "Bolsheviks in the Kremlin! The headlines of the right wing press quickly started to spread panic over the new cabinet, and it spread into the Duma soon after. The new Chairman-Minister, [GetSecondInCommand], already came under fire over his inexperience in political matters, but two of his ministers were even harder for the Duma to swallow: former Menshevik and current Socialist-Revolutionary, Minister of Education Aleksandr Elyashevich - and even worse, socialist and trade unionist, Daniil Sulimov, as the Minister of Industry and Trade.\n\nThe ministerial posts had been required to gain support of the PLSR and RDP for Rikhter's government, the president had argued - and both men had proven to be ardent supporters of Russian democracy, something that could not be said of everyone from the right. The government survived its first vote of no confidence narrowly, as a number of more right-wing SRs abstained from the vote."
  russia_democratic_events.53.d: "The Congress of the All-Russian Central Assembly of Trade Unions has published their 13 demands and declared strike actions by all member unions until the government proves it is a true 'workers' government' and accepts the VTsSPS programme. The Minister of Labour, Boris Berlatsky, has been willing to negotiate, though actually accepting the demands as they stand would be a capitulation to the revolutionary vanguardists.\n\nThe 13 demands include a number of reasonable points on wages and working conditions but also call for pardons to still-imprisoned or exiled Bolsheviks and full legalisation of revolutionary vanguardist political activities. In support of their demands, the Metalworkers' Union, the Dockworkers' Union, and a number of other less important groups have gone on strike across Russia.\n\nTitov himself insisted that accepting the VTsSPS' demands would only mean more demands, and that they hardly represent 'all Russian workers', unlike the RDP's electoral mandate."
  russia_democratic_events.54.d: "Blood on the streets! The Minister of Interior, Pitirim Sorokin of the Socialist-Revolutionaries, has sought to navigate a course between allowing strikes but keeping the peace - and it has ensured peace in many parts of Russia until now. This morning, what started as a clash between revolutionary vanguardist strikers and social democratic non-striking workers at the Admiralty Shipyard in Petrograd became a clash with the police as the revolutionary vanguardists tried to force the other workers out of the dockyards. A fight broke out, seriously wounding seven and killing two.\n\nLater, the Petrograd courts judged that the police's use of force in stopping violence was perfectly legal, and that the deaths were unfortunate incidents and not deliberate killings. However, 14 revolutionary vanguardists and 5 social democrats received sentences for assault, battery, and refusal to obey authorities.\n\nThis 'Murder at the Admiralty' has only served to increase the tensions. VTsSPS-affiliated newspapers have started trashing Titov's government, and especially Sorokin's handling of the police, denouncing this 'fake socialist' government as servants of capital and reaction."
  russia_monarchist_events.13.d: "After much lobbying by the government, the Supreme Court has declared support for the view that the Union for the Revival of the Republic (SVR) can be classified as a 'revolutionary vanguardist-aligned' organisation and has been shut down by the court. They cite the presence of revolutionary vanguardists such as Sergey Medvedev and Aleksandr Shlyapnikov holding high positions in the SVR, and the SVR's inability or unwillingness to expel these people.\n\nA series of coordinated raids were conducted by the police, which led to the confiscation of the SVR membership records, printing presses, and funds. Much of the leadership was arrested, though no real charges could be made against many of them. An attempt to prosecute their leadership for 'conspiracy to overthrow the constitution' only passed through the courts in cases where actual revolutionary vanguardist connections were found, which meant that a majority of the SVR leaders could walk free.\n\nStill, the destruction of the SVR as an organisation and the arrest of its most left-wing members should give us breathing room, even if the republican opposition is likely even more bitter now."
  russia_socialist_events.4.d: "After a long period of being outlawed and persecuted, Russia's socialists are finally free to politically organise. While the majority of socialists have gone to Levitsky's VST, or have remained loyal to the Socialist-Revolutionary cause, there are numerous minor parties being founded.\n\nThe only 'old republic' party that still remains a power is Zeller's Socialist-Democratic Union (SDS), which was created out of the greatly diminished RDP after the radicals left. On the other hand, they have received some new members from the right, from those who believe they can push a more conservative or moderate agenda through the SDS.\n\nAnother new old party is the resurgent Revolutionary Workers' Party - RRRP(b), whose central committee has returned from exile under Sverdlov, greatly diminished from their glory days. They were further weakened as Tomsky and other Bolsheviks who had made their home in the Russian trade unionist movement refused to bend the knee, and instead joined the VST for greater influence. The Bolsheviks are not particularly well-liked, and among other parties, an unofficial agreement has been formed to keep them away from important positions of power.\n\nFinally, there are dozens of smaller parties formed around influential leftist figures or more marginal ideological strains, like anarchism or women's rights. These minor parties and independents also include a large number of not-so-committed socialists, who are mostly socialist for appearance's sake. Individually, these minor parties don't have much influence, but they do form a relatively large minor bloc in the Congress."
  russia_socialist_events.31.t: "The Russian Revolutionary Workers' Party"
  russia_socialist_events.31.d: "The Old Bolsheviks have established themselves as a political party in Russia under the direction of Yakov Sverdlov and Mikhail Frunze. Their electoral prospects remain to be seen, but Frunze's rally in Petrograd was met with great interest. There, he hailed the Russian people 'in this sacred city of the Revolution' and showed absolutely no remorse nor regret about past events. He talked at length about what he and his comrades had learned of the nature of revolutionary vanguardism in their travels: in phalanstères of the new France, in the fierce battles of Red Birmingham, in the steppes of Patagonia.\n\nAll this had inspired the new political programme of the Russian Revolutionary Workers' Party of Bolsheviks, titled 'What is to be done?'. It paints a picture of a false revolution, one where liberals and capitalists still remained at large, wearing double-faces in so-called 'workers' delegations'. The champagne socialists in the Duma and in their literary clubs, who have spent the past twenty years hiding like rats inside a social-democratic party, are estranged from true socialism. And Spiridonova? Her party has fought, yes, but the Petrograders should not for a second think that she cares about them more than about her precious peasantry. Only Lenin cared for you then, and only his followers care for you still!"
  russia_socialist_events.35.d: "The defendant: former members of the Russian Revolutionary Workers' Party (Bolsheviks)\nCharge: --------\n\nComrade Sverdlov was calm. Frunze had thrown a drunken fit of rage. Few had resisted arrests, and had escaped or died.\n\nThose left of the civil war-era Bolshevik leadership have been dragged before the People's Tribunal and were accused of various crimes, including the murders of hundreds of Left-Esers in suppression of the SR protests - many of these orders given by Sverdlov. Likewise, the Bolshevik leadership was accused of terror against the people, authorising the indiscriminate killing, torture and imprisonment of Russian working people and other socialists on shoddy grounds. The trial was absolute chaos, as there were too many accusations and too many defendants, but it proceeded anyhow, largely due to the insistence of the SRs and the right wing of the VST.\n\nThe majority pleaded innocent, and some were acquitted - but the leadership, especially Sverdlov, was vigorously hunted down by the people's prosecutors. In a month-long marathon trial, the prosecutors built up the case to prove that Lenin's inner circle had knowingly ordered the deaths of thousands, and while their goals may have been noble, their means were horrifying. There was no lack of witnesses, though it was obvious how muddy the waters were, considering how chaotic the times had been.\n\nIt was no surprise that the jury deemed the majority of the defendants guilty, and long labour sentences were passed. Most of the Bolshevik leadership would spend the next dozen years, at least, in work penitentiaries washing away their crimes in mining and wood-cutting. Some sympathy protests were organised outside the courthouse as the defendants were marched out of the building."
  russia_socialist_events.39.d: "The small Bashkirian village of Nizhny Avzyan became the focal point of all news this week. The People's Militia of Beloretsk was informed of the disappearance - and later it was found out the murder - of 19-year-old VST activist and engineering student, Ivan Sergeyevich Zhurenko, a native of Moscow who had enthusiastically volunteered as a People's Instructor to the rural Urals.\n\nWhat happened is still a matter of investigation, but it seems that Zhurenko's attempts to organise the workers of the region and found a Marxist reading circle were met with hostility. After a small group of armed peasants broke up the meeting of the reading circle, Zhurenko refused to leave, and some days later was found on the roadside, murdered with an axe. Three days later the murderer turned himself in - a 52-year-old farmer and veteran, Igor Igorevich Belov. During his arrest, he made a scene and repeatedly shouted that 'you Bolsheviks should have been all shot'.\n\nThe actual tragedy has been overshadowed by the way major socialist newspapers have covered the case. They paint Comrade Belov as the archetypal peasant, ignorant and brutish, and protests showing Comrade Zhurenko's images have been demanding a harsh sentence for the 'child-killer'. A Duma faction has organised around the hardline Marxist Ivan Gronsky to call for harsher measures to pacify the countryside, and that in the future, in addition to instructors, loyal militiamen be sent to accompany them."
  russia_socialist_events.183.d: "It was only a matter of time before official Russian support for the Borotbysts would be consequential for Russo-Ukrainian relations. This past week, a strike by steelworkers at the Kharkiv Tractor Plant turned into chaos when the police were called in to quell the protests.\n\nThe revolutionaries quickly sprang into action, as the Borotbysts and Ukapists armed the steelworkers and braced for the incoming attack. Realising the gravity of the situation, the Ukrainian government decided to send in the military; but the chief organisers of the defence managed to escape across the border into Belgorod.\n\nA number of key events transpired. The Borotbyst movement was quickly declared illegal, on the justification that it was a terrorist group funded by foreign powers that sought to overthrow the government. [202.GetName] attempted to summon the Russian ambassador, demanding that the revolutionary vanguardist criminals be extradited and face trial for their actions.\n\nUltimately, they received no reply, as we have nothing to discuss with those who seek to oppress the working class. In response, they chose to sever all diplomatic relations with Russia. Such actions were to be expected from [202.GetName], but they no doubt highlight that tension in Europe is spiralling out of control, and that few are willing to save the continent from its inevitable destruction."
  russia_socialist_events.404.d: "Comrade Grigory Zinovyev, passionate internationalist, was an obvious choice to represent Russia before all of the International. His connections within the global socialist movement allowed the VST to be accepted as the sole Russian representation. In its most recent session the topic of the signatories of the Totalist Charter became a hotly discussed issue, questioning their compatibility with international socialism. Zinovyev took to the stage for an address. He reminded the delegates of the Bolshevik call for a strict organisational, theoretical and programmatic unity so that the international could be more than a propaganda association, but rather a single revolutionary workers' party having branches in different countries. The new International had failed to safeguard itself against revisionist, social-patriotic and petty-bourgeois influences. While there was little doubt who this referred to, Zinovyev explicitly condemned 'left-republican' and 'Mosleyite' tendencies, causing an uproar from many of the delegates that took time to calm. He made clear where the blame for this was to be placed - a laxity in discipline, a hysterical respect for democratic forms even against the interests of the proletariat, and an attitude far too tolerant to parties whose practice and tactics are in flagrant opposition to those of the revolutionary proletariat.\n\nThe International's plenum was greatly stirred by Zinovyev's speech, and intense conversations broke out among the delegates as soon as it ended. Some among the syndicalist and revolutionary vanguardist left saw sense in his words. Many of the left and centrist factions were shocked and confused, feeling themselves implicated, while others rebuked the harsh anti-democratic tones, calling it \"Totalism against Totalism.\" The Totalist Charter signatories responded harshly, denouncing Zinovyev as an ultra-left madman hell bent on curbing national autonomy. Most agitated, however, were the other VST delegates, who were furious that Zinovyev had made such a bold statement without consultation. Soon after, telegrams were sent to Moscow, condemning Zinovyev and waiting on [ROOT.GetLeader]'s response."
  russia_flavour_events.55.d.szrs: "After the civil war, Russia had to come to terms with the bloody events. What could ever explain the levels of atrocities we committed against each other? Unsurprisingly, the Bolsheviks became vilified, and suddenly even most of the socialists were competing over who had opposed the Bolsheviks first, in an attempt to prove they were on the right side of history. Those preaching for leniency and national healing, like Vasily Maklakov and Viktor Chernov, were left a minority in the early 1920s, and the vindictive purge of anything revolutionary vanguardist left a dark stain on the Russian Republic's claim of legality and liberty.\n\nAfter many high-level members of the Revolutionary Workers' Party such as Aleksey Rykov had served their sentences going into the 1930s, they joined with the Radical-Democratic Party. Despite President Maklakov's attempts to de-escalate the situation, the gulf between the left and right kept widening. SZRS Combat Squads assassinated Revolutionary Workers' Party members in broad daylight, while underground socialist radicals tried to fight back. It was against the backdrop of this violence that the ascension of the SZRS would happen, culminating in Savinkov coming to power in 1934.\n\nHistory textbooks were amended to reflect 'White history' - that the Bolshevik uprising was not just an ordinary uprising. It was an international conspiracy, one which sought to destroy holy Russia and make sure it never rises again, responsible for funding the Bolshevik Party and supplying their uprising across central Russia, and were it not stopped by force of arms, it would have left Russia broken, destroyed and shattered. These textbooks make sure to note the fact that Vladimir Lenin had been sent to Petrograd by the Germans, and that many of the leading members of the Bolshevik Party were not Russian - but Caucasians, Balts, Poles, and especially Jews."
  russia_flavour_events.55.d.lib: "After the civil war, Russia had to come to terms with the bloody events. What could ever explain the levels of atrocities we committed against each other? Unsurprisingly, the Bolsheviks became vilified, and suddenly even most of the socialists were competing over who had opposed the Bolsheviks first, in an attempt to prove they were on the right side of history. Those preaching for leniency and national healing, like Vasily Maklakov and Viktor Chernov, were left a minority in the early 1920s, and the vindictive purge of anything revolutionary vanguardist left a dark stain on the Russian Republic's claim of legality and liberty.\n\nAfter many high-level members of the Revolutionary Workers' Party such as Aleksey Rykov had served their sentences going into the 1930s, they joined with the Radical-Democratic Party. Despite President Maklakov's attempts to de-escalate the situation, the gulf between the left and right kept widening. SZRS Combat Squads assassinated Revolutionary Workers' Party members in broad daylight, while underground socialist radicals tried to fight back. It was against the backdrop of this violence that the ascension of the SZRS would happen, culminating in Savinkov coming to power in 1934.\n\nUnder Savinkov's regime, history textbooks were amended to reflect 'White history', which emphasises how Bolshevism was part of an international conspiracy orchestrated by Jews, Germans, and national minorities, with the goal of destroying Russia. These conspiracies were quickly scrubbed after a more sane regime returned to power, but a massive gulf remains between our views on the civil war. We must teach our history impartially - but always include a warning against revolutionary vanguardism there, to remind the Russian people to never repeat the bloodshed and tragedy of the revolution."
  russia_flavour_events.95.c: "You know what they say, it doesn't pay to be a Bolshevik in this country."
  RUS_yakov_sverdlov_leader_desc: "§YBorn:§! §LJune 3rd, 1885, in Nizhny Novgorod, Nizhny Novgorod Governorate, Russian Empire§!\n§YBackground:§! §LYakov Mikhaylovich Sverdlov was born to a Jewish family in Nizhny Novgorod, with his father storing arms for the revolutionary underground and supporting his children's revolutionary views. It is therefore not surprising that Sverdlov would join the RSDRP in 1902 and support Lenin's Bolsheviks during the party split.\n\nSverdlov took part in the 1905 Revolution and ended up imprisoned in Yekaterinburg. In fact, he would spend most of the next decade imprisoned or exiled, reading the works of Lenin, Marx, or Kautsky, among others. The February Revolution became his chance to return to Petrograd, where he emerged as part of the Bolshevik inner circle. Playing a key role in the October Revolution and subsequent civil war, he oversaw the Tsar's execution and the broader revolutionary terror, earning nickname 'Black Devil'.\n\nHe emerged as a leading figure in a troika of Bolshevik leaders after Lenin's assassination and ultimately emerged as the leader of the remnants of the Russian Revolutionary Workers' Party (of Bolsheviks) in Paris. Sverdlov, an unapologetic Leninist, famously argued that the French socialist state is in the process of degeneration into 'bureaucratic sectarianism', as different parties and unions vie for power with no revolutionary unity. His party has hardly been united.\n\nBoth Mikhail Frunze and Grigory Zinovyev sought to contest his leadership, which culminated in a split in 1931 as Zinovyev led a splinter party. In restored socialist Russia, Sverdlov has positioned his party as the true revolutionaries, those who oppose Levitsky's 'diluted revolutionary vanguardism'. Personally, Sverdlov is an organiser rather than a demagogue and understands that the strengths of the Old Bolsheviks lie in their connections and military experience - and their purpose is, more than anything, to keep the flame of Lenin alive.§!"
  RUS_grigory_zinovyev_leader_desc: "§YBorn:§! §LSeptember 23rd, 1883, in Yelizavetgrad, Kherson Governorate, Russian Empire§!\n§YBackground:§! §LGrigory Yevseyevich Zinovyev burns with the passion of a man who has much to prove and rectify. A high-ranking Bolshevik with a profound knowledge of Marxism, Zinovyev was a close ally of Lenin since the split in the RSDRP. Ostensibly quiet and delicate, he quickly proved capable of surprising people as a competent agitator and orator. However, whether influenced by the cautious nature of Kamenev, or whether his subtle political instinct simply saw what lay ahead for an armed uprising, Zinovyev positioned himself against the organisation of the October Insurrection. His opposition was not a product of any principled respect for abstract democracy, though; Zinovyev was committed to the power of the proletariat by any means - he had simply believed that the revolution was fated to be crushed, and that the Bolsheviks would have done better to have bided their time, growing their strength and winning over the sympathy of potential allies. While he remained loyal to Lenin during the Civil War, the failure of the Bolshevik adventure seemed to vindicate him, and he was driven into exile with Sverdlov.\n\nArriving in Paris, they quickly entered into bitter disagreements over the question of tactics. A firebrand to the end, Sverdlov opposed Zinovyev's caution and defended the brash insurrection of 1917. Splitting in 1931, he left for England, where he became associated with Dutt's Vanguardists and the Pankhurstites. Emboldened, he soon returned to Russia. Forming a small Revolutionary Workers' Party that fused with the VST, Zinovyev now finds himself at the head of the organisation. Embracing the lessons of Lenin and Plekhanov, his ambitions lie beyond the fetish for 'democracy'. He knows that everything depends on the circumstances, on the place and the hour. The interests of the revolution - this is the supreme law. Besides anything else, the hegemony of the proletariat must be assured.§!"
  RUS_sergey_syrtsov_advisor_desc: "§YBorn:§! §LJuly 17th, 1893, in Slavgorod, Yekaterinoslav Governorate, Russian Empire§!\n§YBackground:§! §LSergey Ivanovich Syrtsov was the son of a shop clerk from Rostov-on-Don, and his studies in economics were interrupted when Syrtsov joined the RSDRP while studying in St. Petersburg. Syrtsov was key to the Bolsheviks in the Don Host region, and largely thanks to him, local Bolsheviks, Mensheviks, and Esers managed to cooperate in the form of the 'Military Revolutionary Committee of United Democracy'. He served as a military commissar and an organiser of de-Cossackification, though he only saw it as a matter of economic reorganisation, rather than a principle.\n\nSyrtsov managed to flee Russia in 1920 and was part of the exiled Revolutionary Workers' Party. He completed higher education in France, studying political economy and especially agricultural mechanisation in the Western model. Syrtsov has remained on the outer rim of politics, uninterested in overtly radical options, and is the epitome of a socialist technocrat - organiser and administrator, not an agitator.§!"
  RUS_vasily_chuykov_commander_desc: "§YBorn:§! §LFebruary 12th, 1900, in Serebryanye Prudy, Tula Governorate, Russian Empire§!\n§YBackground:§! §LVasily Ivanovich Chuykov was born into a Russian peasant family and attended church school. At the age of twelve, he moved to Petrograd to work and became a shoemaker's apprentice.\n\nVolunteering to join the Red Army in 1918, he was sent to the first military courses in Moscow, where he would take part in crushing the Left-SR uprising. Joining the RRRP(b) in 1919, he replaced the commander of the 43rd Regiment of the 5th Rifle Division and was sent to the Eastern Front, where he would receive several injuries and was subsequently captured by Kolchak's army.\n\nAfter his stay in the hospital, he returned to his village, where he would find his wife, Valentina. But the war had changed his life a lot, and he would make the decision to return to the Russian Army in 1923.\n\nHe was sent to the Suvorov Military School, and, upon his graduation in 1926, he was assigned to the 82nd Siberian Infantry Division stationed in the Russian Far East.\n\nHis regiment's performance in the Chinese Eastern Railway Conflict, heavily affected by matters outside of his control, would lead him to be demoted to the rank of subporuchik and barred from climbing the ranks further.\n\nNevertheless, it didn't stop Chuykov from performing his duties, and he earned a reputation as an honest, straightforward, talented, if sometimes rude officer, respected by his soldiers.\n\nHolding socialist sympathies going back to his youth, Chuykov was a prime candidate for promotion, finally giving him a chance to prove his skill in the service of his motherland.§!"
  RUS_mikhail_frunze_army_chief_desc: "§YBorn:§! §LFebruary 2nd, 1885, in Pishpek, Semirechye Oblast, Russian Empire§!\n§YBackground:§! §LMikhail Vasilyevich Frunze is one of the most prominent Russian revolutionaries of the 20th century. First introduced to revolutionary ideas in the gymnasium in Verny, he would later join the RSDRP. During the Revolution of 1905, he participated in party activities in Moscow and surrounding areas, organising strikes, assassination attempts, and armed rebellions, later taking part in the 4th Congress of the RSDRP, where he met Vladimir Lenin. His actions nearly led to his execution, but he was saved by public pressure and was instead exiled to Siberia, serving his time in multiple penal colonies. After escaping to Chita, he would use another fake identity to move to Minsk, where he would become the city's head of police, marking the creation of the first Belarusian police.\n\nAt the start of the October Revolution, he took part in fighting in Moscow and was later given the position of military commissar of the Yaroslavl military district. While commanding multiple armies on the Eastern Front during the Russian Civil War, he would often offer security guarantees to anyone who surrendered without a fight, and had a pivotal role in organising the Bolshevik fighting retreat after the fall of Moscow.\n\nOnce in France, despite his ailing health, he founded the International Brigade of Bolsheviks (IBB) together with other exiles. Generally seen as a middleman between the French government and exiled Bolshevik commanders, he ensured the IBB's involvement in the British Revolution and Patagonia Rebellion. He has been integral in maintaining military capacity of the Red Émigrés and, at the same time, holds a leading position in the Revolutionary Workers' Party.§!"
  russia_flavour_events.184.d: "With the Red Flag flying across the former Pale of Settlement following the triumph of the Great Revolutionary War, a new dawn has begun for the Jews of Eastern Europe, free at last from the predations of Capital and bourgeois Nationalism. With the majority of the Jewish nation (although the usage of that word is, of course, under constant debate) under the socialist banner, the political discourse within the community has reached a fever pitch. With the seeming inevitability of the World Revolution, the emancipated Jewish workers have already begun striving to create the new society that generations of struggle have brought about.\n\nA veteran Bolshevik who followed Zinovyev and Kamenev into the VST, Semyon Dimanshteyn was one of the few among the RSDLP to have been religious and not an atheist. After careful conversations with Lenin and Yaakov Sverdlov in 1918, the latter of whom, despite being Jewish himself, was stridently against any sort of 'Jewish section' within the party, Dimanshteyn was tasked with organising the 'Yevsektsiya', or Jewish Section of the Revolutionary Workers' Party. Although the subsequent defeat in the civil war meant that Dimanshteyn was never able to implement Lenin's policies, his current work in the USLR's Commissariat of Nationalities has seen the invitation of crucial cultural figures to the government, including famous names like the actor Solomon Mikhoels, the writer Ilya Ehrenburg, and even the current chief Rabbi of Moscow Shlomo Shleifer.\n\nWhile in practice affiliation in the Yevsektsiya is similar to forms of National Personal Autonomy championed by the other socialist parties, the VST-Left has also pushed for a comprehensive programme of Korenizatsiya (or 'nativisation'), pushing for the local usage of the Yiddish language and its protection as well as the implementation of strong affirmative action programs. The Socialist-Zionist parties, particularly HaShomer HaTzair and Poale Zion Left, have been allowed to operate relatively freely thanks to the Yevsektsiya's guidance, although the Central Committee's increasing scepticism towards Palestine as a destination of migration has led to the question of an alternate place for the voluntary territorial gathering of the Jewish workers. The first suggestion, in Siberia, was eventually dismissed over fears that the inhospitable terrain would require chauvinist coercion, with some among the party also suggesting Crimea as a suitable location, although this has opened up an entirely different can of worms with the peninsula's local groups - but with the development of a socialist Jewish culture under the guidance of the collective Prophet that is the Party, the workers are hopeful for a Red Zion."

  #SER
  SER_radical_socialist_breakaway_party: "RRPS"
  SER_radical_socialist_breakaway_party_long: "Revolucionarna radnička partija Srbije (Revolutionary Workers' Party of Serbia)\n§LThe Socialist Workers' Party is a Serbian Marxist and Yugoslavist political party walking a fine line between reformism and revolutionary aspirations. Founded in 1919 during the twilight of radical movements from France to Russia, merging Montenegrin revolutionaries and the remains of the Serbian Social Democratic Party (Srpska socijaldemokratska partija) after the expulsion of the moderate and chauvinistic faction organised around Živko Topalović. The party was quickly declared illegal by Aleksandar II's Royal dictatorship, but fortunes soon turned to their favour as the monarchy was overthrown by a popular revolution in 1926.\n\nAll of the party's efforts seem to have come to naught in the wake of their failed, short-lived governance of the Serbian state. More radical members of the Socialist Workers' Party who believed the revolution had been betrayed have coalesced in the RRPS, and seek the achievement of revolution by any means necessary.§!\n"
  SER_syndicalist_breakaway_party: "RRPS (Vahabiti)"
  SER_totalist_breakaway_party: "RRPS (Pelagićevci)"
  SER_pardon_communist_revolutionaries_desc: "The Revolutionary Workers' Party was one of the few who waged an active armed resistance against King Aleksandar II's regime, especially in Montenegro, where Vukašin Marković's guerrillas terrorised the mountains before retreating to Albania. As suspicious as they may be, with the advice of the Socialist coalition partners, we should finally extend pardons to them."
  SER_dragomir_vasic_leader_desc: "§YBorn:§! §LOctober 2nd, 1885, in Gornji Milanovac, Morava District, Kingdom of Serbia§!\n§YBackground:§! §LDragomir \"Dragiša\" Vasić is the second President of the Serbian Republic, elected with the initiative of the Republican Party in 1931. Vasić unfortunately happened to belong to the generation of Serbian men and women sent to die in the trenches of the Balkan Wars and the Weltkrieg. It was there, during the Second Balkan War, that Vasić the revolutionary began to develop — and Vasić the writer. His first real attempt, a short story titled \"Pačko\", depicts a Serbian soldier in the Battle of Bregalnica. Pitying a felled Bulgarian officer, he tries to give him a proper burial in no man's land, only to be shot by the enemy while erecting a wooden cross. This revolutionary fervour slowly lead to disillusion with the Karađorđević dynasty — especially after the Salonika Trial, as one of the members of the Black Hand executed was his cousin Ljubomir Vulović.\n\nAfter the war, Vasić returned to Serbia along the remaining exiles, pursued a legal career, and founded the newspaper \"Progress\". However, it was soon shut down and his lawyer's licence suspended by the Royal Dictatorship for defending Revolutionary Workers' Party members. In reaction, he joined the Republican Party and became a member of its main board, a crucial member of the underground organisation - not only thanks to his literary skill, but also his numerous contacts within the Serbian Army. When the Revolution came, Vasić joined it, was elected to the Skupština, and accepted his role as the Ambassador to the French Federation of Communes. While visiting Paris and seeing its achievements did not convert him to a Syndicalist, it nevertheless fascinated him.\n\nThe Konspiracija, suspicious of President Jaša Prodanović's anti-militarist stance, forced him out of power in 1931. Discreetly inviting Vasić to succeed him in the next election, they expected him to be easier to control thanks to his past in the Black Hand. Reluctantly, Vasić agreed, and stands today as a leader torn between his progressive outlook and his debt to the conspirators. To him, the fight against Bulgaria is not just a matter of irredentism - it is a matter of liberty. Time and time again the Serbs have proven to be its beacon in the Balkans while the Bulgarians dabble in dim absolutism. But can Serbia really claim to be a harbinger of liberty in this state?§!"

  #SIA
  SIA_totalist_party: "Pak Khon-ngan Patiwat Siam"
  SIA_totalist_party_long: "Pak Khon-ngan Patiwat Siam (Revolutionary Workers' Party of Siam)"
  SIA_totalist_party_TH: "Pak Khon-ngan Patiwat Thai"
  SIA_totalist_party_TH_long: "Pak Khon-ngan Patiwat Thai (Revolutionary Workers' Party of Thailand)"

  #SRI
  socialist_italy_events.46.d: "While Mussolini certainly did not care about the blowback from the Rosselli Affair, he found it most useful for the flak it gave to his supposed closest ally, Alceste de Ambris.\n\nThe two have worked together for decades by now, but de Ambris was always seen as too independent for Mussolini's tastes. This was great before the Leggi Fascistissime, as it allowed for a continued nominal separation between Presidency and Government to placate the opposition. By now, he's another roadblock on Mussolini's way.\n\nAs such, de Ambris has been made to resign in relation to his failures while dealing with the Rosselli Affair, and has been replaced by an even closer ally in the person of Palmiro Togliatti, a personal friend of Mussolini since the early days of the Revolution. Though he is ideologically even more distant from the President (having led the Revolutionary Workers' Party of Italy until it was effectively merged into the FAR in 1932), he is politically far weaker, which is the only thing that matters by now. Of course, the Blackshirts (who appreciated de Ambris' national syndicalism) don't appreciate the change."
  socialist_italy_events.48.d: "Following Mussolini's assassination, Togliatti ascended to the presidency; this was completely unexpected and threw a wrench in the Fascist revolution. It appears Mussolini's legacy in the movement will be the disastrous effects of his personalist project, which appears to have seriously endangered Fascism as a whole; indeed, Togliatti has already begun building bridges with the old leninist movements and even what remains of the unions, and has appointed his friend, the known anti-fascist Luigi Longo as Prime Minister.\n\nThe FAR has immediately descended into chaos; with the old Revolutionary Workers' Party of Italy following Togliatti, much of the movement has instead coalesced around former Prime Minister de Ambris. Right now, the Blackshirts are marching on Rome to restore the course of the Fascist Revolution; whether they will make it into the city depends on the loyalties of the Army."
  SRI_palmiro_togliatti_leader_desc: "§YBorn:§! §LMarch 26th, 1893, in Genoa, Kingdom of Italy§!\n§YBackground:§! §LBorn into a middle-class family, Palmiro Togliatti's early life was spent moving around due to his father's job as a schoolteacher - first to Novara, then Turin, then Sondrio, then Sassari. His father's tragic death in 1911 forced him to move back to Turin, where he received a scholarship to study law, although he would have preferred philosophy.\n\nTogliatti joined the socialist party (PSI) in 1914, just before the Weltkrieg, where he favoured Italian entry on the side of the Entente. He finally graduated in late 1915 and despite wanting to pursue a degree in philosophy, he joined the Red Cross due to his myopia, later fighting in the front lines. When the ICW began he joined the republican front and later the 'red' faction that emerged.\n\nUnlike many other syndicalists, he strongly promoted militarism to reunite Italy under a syndicalist flag as soon as possible. This, combined with his opposition to the chaotic syndicalist system and desire for a more centralised government, led him to sympathise with the growing fascist movement. These sympathies became a formal alliance after 1927, when the Italian Federation collapsed but the SRI failed to pounce. Pressured by Mussolini, he eventually adopted the fascist manifesto as the PRLd'I's party programme and was rewarded with the position of Mussolini's second in command.\n\nWhen Mussolini was murdered, Togliatti saw the chance of creating a new direction for the movement and took it. Rebuilding bridges with the trade unions while forcing them to accept increased central control and simutaneously denouncing blackshirt excesses, his rule appears to be a radical shift from Mussolini's. But the question remains - will the blackshirts accept him as their leader?§!"
  SRI_guide: "§RPdA - $SRI_carlo_rosselli$§!\n£white_dot Have the Radical Socialists be in power at the time of the first post-war elections, by staying in the middle of the BoP.\n£white_dot Take the §Y$SRI_break_enemies_of_democracy$§! focus before the §Y$SRI_constitutional_restoration$§! focus.\n\n§RPdA - $SRI_emilio_lussu$§!\n£white_dot Have the Radical Socialists be in power at the time of the first post-war elections, by staying in the middle of the BoP.\n£white_dot Take the §Y$SRI_constitutional_restoration$§! focus before the §Y$SRI_break_enemies_of_democracy$§! focus.\n\n§rCGdL-USI (IOS)§!\n£white_dot Have the Syndicalists be in power at the time of the first post-war elections, by staying to the left side of the BoP.\n\n§oFAR§!\n£white_dot Have the Totalists be in power at the time of the first post-war elections, by staying to the right side of the BoP.\n\n§oFAR - $SRI_alceste_de_ambris$§!\n£white_dot Have the Totalists be in power at the time of the first post-war elections, by staying to the right side of the BoP.\n£white_dot Take the §Y$SRI_reform_the_party$§! focus, have Mussolini be shot and have the Blackshirts restore the path of the Fascist revolution.\n\n§oPRLd'I§!\n£white_dot Have the Totalists be in power at the time of the first post-war elections, by staying to the right side of the BoP.\n£white_dot Take the §Y$SRI_reform_the_party$§! focus, have Mussolini be shot and have the Army stick with Togliatti."
  SRI_totalist_pcdi_party_long: "Partito Rivoluzionario dei Lavoratori d'Italia"
  SRI_totalist_pcdi_party: "PRLd'I"

  #SWE
  SWE_nils_flyg_leader_desc: "§YBorn:§! §LJune 9th, 1891, in Södermalm, Stockholm, Södermanland Province, Kingdom of Sweden§!\n§YBackground:§! §LThe figurehead of Swedish totalism, Nils 'Nisse' Flyg, is considered by many to be a colourful character. Born in the Stockholm working-class neighbourhood of Södermalm, Flyg has been active in the Swedish radical left since a young age. In 1917, he split off from the SAP with Zeth Höglund and Karl Kilbom to form the Swedish Revolutionary Workers' Party, a brief experiment that soon failed when the Russian Revolution was crushed. Nonetheless, the young Flyg would prove to be a force to be reckoned within the Swedish left.\n\nIn more recent years, Flyg distanced himself from his less radical comrades and took on the doctrine of total commitment to the Revolution propagated by the Sorelians in the French Federation of Communes and Oswald Mosley in the Union of Britain, though adding his own unique values to it as well: Flyg is known to oppose notions of an indigenous socialist revolution in America and, ironic to his previous positions, Russia, believing that the revolution has to originate in Europe as it would otherwise take the shape of anti-European imperialism, noting on the side that neither Russia nor America harbours an orthodox totalist movement.§!"

  #SYR
  syrian_republic_events.3.d: "Both of these groups however hail from an older generation, a generation whose only purpose has been to maintain the old social system and strive for autonomy from Kostantiniye. Through the education efforts of the OHF and with massive changes on the European continent, a new generation of Syrians has arrived on the scene who don't hold the same opinion as their elders. Inspired by socialist movements in Europe, the Socialist and Revolutionary Workers' parties of Syria are utilising the poverty and crisis caused by the economic depression and the Levantine War to strengthen their parties, with support of the Left in Europe. On the other end of the spectrum, the SSNP has taken inspiration from the Italian and Russian movements and has created a secular, militarist organisation with revolutionary ideas for the Syrian region.\n\nThe biggest threat to the National Bloc however may come in the shape of the League of National Action. Created by highly educated, second generation Arab nationalists, this group forms the moderate centre supporting both the secular ambitions of the extremists and believing in the power of the ballot. Newspapers, radio broadcasts, scouts and militias form big parts of their organisation and their service during the Levantine War may prove a deciding factor.\n\nTime will tell which of these movements will achieve the highest office and which will be forever lost to the sands of time..."

  #UKR
  UKR_totalist_party: "URRP"
  UKR_totalist_party_long: "Ukrainska Revoliutsiina Robitnycha Partiia (Ukrainian Revolutionary Workers' Party)\n§LPicking up the pieces in the aftermath of the destruction of Bolsheviks active in Ukraine, the URRP really had its work cut out for them. Forming at an émigré conference in Paris, the delegates at the Ukrainian Revolutionary Workers' Party's Constituent Assembly were primarily former Bolsheviks who operated in Ukraine, as well as a few Radical Ukrainian revolutionary vanguardists who, for one reason or another, decided to forgo activities within either the Borotbyst Movement or the Council-Revolutionary Bloc. In spite of taking much from the old Bolshevik political platform, there was a key difference nonetheless: A reassessment of the importance of the Ukrainian National Question. Although the URRP agreed to solidify this \"nationally-minded\" course through a comfortable majority, there was still the question of the URRP's overall goal. Should it seek to join Ukrainian Revolutionary Structures and forgo any ties to the possible Revolution in Russia or continue to try and fraternise with the Russian Revolutionary Movement, naturally weakening the ties to the Ukrainian one? As such, multiple fractions emerged. In the end, the overall leadership of the party went to Vlas Chubar, who represented a tenuous internal compromise and was seen as a leader capable of starting a new chapter in the history of the revolutionary movement. Nevertheless, so far, any and all attempts by the URRP to establish a political foothold have mostly failed.§!\n"
  UKR_bakhmut_meeting_agree_to_ukapist: "§RURRP members may be useful allies, but should we trust these old Bolsheviks?§!"
  UKR_bakhmut_meeting_no_agreement: "§RURRP members may taint our ideology, but can we manage without them?§!"
  UKR_borotbyst_popularity_mechanic_tt: "§OWe will get a bonus based on§! $syndicalist_coloured$ §Opopularity and if we allied§! §othe URRP.§!"
  ukraine_borotbyst_events.14.d: "The Red Guards have continued to be an anomaly for the Borotbysts. Indeed, despite being the foremost revolutionary party organising protests and peasant self-help groups, they were not involved in the formation of the Red Guard. After a lengthy investigation from the revolutionary leadership, they have come to discover that the Red Guard and other affiliated groups have been led from \"beyond\" by many of the higher-ups in the Ukrainian Revolutionary Workers' Party, such as Mykola Skrypnyk, Vasyl Shakhrai and Serhii Mazlakh. Although there is clear mutual benefit for both sides to support and carry out a successful revolution and topple the republic, there is great distrust between the two. Despite not being opposed in principle, the Borotbysts mostly has its ranks in the countryside, whereas the URRP has a greater amount of representation in the urban areas. There is a real concern that either party will attempt to marginalise the influence of the other, as well as their preferred base of support.\n\nNonetheless, as the republic continues to deteriorate, with strikes and clashes becoming a common occurrence, the potential for a revolution is greater than ever. Top ranking representatives of the Borotbysts and URRP have agreed to negotiate over joint action against the republic. Presiding over the negotiations is middle-man Anatolii Pisotskyi, one of the farthest left Council-Revolutionary Bloc members and one of its main leaders. The URRP and R-RB have offered to cooperate with the Borotbysts should they increase representation for the urban workers, especially miners. Some of the delegates in the Central Revolutionary Committee would thus be aligned to the URRP and R-RB. The negotiations have borne some fruit but the fact remains that the Borotbysts remain the most powerful revolutionary organisation in the country and could carry out a revolution themselves if needed; at the same time, the support of the URRP and R-RB may be invaluable."
  ukraine_borotbyst_events.60.d: "Vlas Chubar, chairman of the Ukrainian Revolutionary Workers' Party, has suggested an alliance between the URRP and the Borotbysts. The Revolutionary Workers' Party is a small, but a well disciplined organisation. Their direct influence over the Ukrainian working masses may be limited, but those followers they have are loyal and committed beyond reproach. The alliance might prove useful, but we must be cautious. The URRP, given a chance, will without a doubt attempt to deeply infiltrate both local councils and trade-union organisations. Should we show any signs of weakness or disunity, URRP members would move immediately, aiming to ruthlessly expand their influence at the expense of our own."
  ukraine_borotbyst_events.60.b: "URRP members are too unpredictable."
  ukraine_republican_events.6.d: "Elections to the Labour Congress are about to be held. Differing from past elections, only those who promise to uphold the revolution and to operate in the interests of the working class are allowed to participate in it.\n\nNow that the revolution has succeeded and counterrevolutionary forces have been dealt with, the fate of the Workers' Democratic Union became clear: its two components, the R-RB and UPS-R, have agreed to peacefully dissolve the RDS, and run in the Labour Congress elections separately. In general, control over the Labour Congress is contested by the R-RB and the UPS-R, the former supporting Volodymyr Vynnychenko's bid for Chairman, and the latter supporting Nykyfir Hryhoriiv's.\n\nBut it is not only these who will be participating in the Labour Congress. The Borotbysts have turned around to embrace our successes, and intend to participate in the elections to the Congress. While their popularity has considerably fallen over the years, they may find themselves an influential factor if they are to reconcile with the party they split from originally, the UPS-R. The Ukrainian Revolutionary Workers' Party (URRP) has also stated that they will participate in the congress. Roughly, the URRP shares many ideological similarities with the R-RB, in particular with Pisotskyi's wing of the party. While many have expected Pisotskyi to be sidelined, he shares many sympathisers in the R-RB, who believe that Vynnychenko's moderate course is no longer necessary as the revolution has solidified itself.\n\nWhile there were some fears that the USDRP would become irrelevant after the revolution, some of their more independent members continue to align themselves with the moderate wing of the UPS-R, believing that Kovalevskyi's influence may force Hryhoriiv to compromise. Finally, there is the question of Vynnychenko himself. The R-RB likely will not have a majority in the Labour Congress, just as they were outnumbered by the UPS-R when the National Zbory was around. But none can deny that Vynnychenko is quite popular, likely due to his compromising yet skillful leadership. It remains to be seen whether Vynnychenko can muster the support to push forward his \"collectocratic\" agenda, or if he will capitulate to the more radical elements of his party. In the end, the results of the first elections to the Labour Congress are..."
  ukraine_republican_events.37.d: "The support of the trade unions will be invaluable in the coming election. The trade unions have traditionally been aligned with the Borotbysts and the URRP, following orthodox syndicalist lines; but times are different now. The Hetman's brutal actions, repressing socialists of any kind, had radicalised many into far-left, revolutionary positions. Now that the people's republic has been restored and these same revolutionaries are no longer being targeted, other parties have sought to gain a foothold on the trade unions. Independent unions have sprung up greatly after the revolution and there is significant potential to turn these to their side. However, the people's republic is still young and has yet to prove if it can provide an efficient administration, which has made some apprehensive about declaring their allegiance to a new political party.\n\nFor the USDRP, the question is of how we should, if at all, try to draw away the membership of these more radical trade unions. It may be wise to emphasise the USDRP's rather radical history; the more anti-reformist trade unions may be willing to embrace us if they see as the foremost fighters of workplace democracy and against Hetmanist tyranny. Still, some in the party see it as somewhat of a fruitless endeavour. Now that unions are able to freely organise themselves, there is no doubt that the USDRP will be a big player."
  ukraine_events.92.d: "Stories of the miraculous and holy abound across the Ukrainian steppe. In the province of Luhanske, one can find a woods preacher in every town, extolling the virtues of natural living. These men usually retire in the winter, leaving streets quiet on the Holy Week. But this holy week is different.\n\nOn a bitter night, in -45c weather, a group of men and women are outside Luhansk. Reports from the police are called out to arrest them. What they find when they are pulled indoors is a shock. Men and women, mostly topless, without shoes. Their leader, a squat man with a long white beard.\n\nThe first report, that the police had captured Father Christmas, was dismissed as a holiday prank. However, the local authorities are asking us how to pay for their holding after the new year. These are real people, and they claim to be followers of Porfiry Ivanov. They are not Christians nor are they Old Believers. Their leader has a history of registry with the Revolutionary Workers' Party of Russia, and yet he is a preacher. These members apparently believe, erroneously, that the subzero weather outside will cure them of all ailments.\n\nObviously mad, but maybe there is an alternative theory? These madmen, by their continued existence, actually help the finances of the Ukrainian government. They refuse all welfare, refuse medical care, refuse meat and all charity. If this group is allowed to propagate in our country, they could save the government thousands in welfare. Obviously this would result in the deaths of many followers, for their healthcare is a fiction and their heterodoxy is barely tolerated by the city of Luhanske."
  ukraine_republican_events.144.d: "It is finally finished. The vow made by the Workers' Democratic Union - to complete the revolution that started with the fall of the Hetmanate - has been fulfilled. After years of struggle, Ukraine is no longer bound to the German empire, and can now concern itself solely with the march towards socialism.\n\nMuch has changed in those years. Peasants' and workers' councils have had certain state responsibilities devolved to them, and ultimately determine the makeup of the Labour Congress. However, the Council-Revolutionaries have gone to great lengths to ensure that they have as much presence and influence within the councils as possible, and therefore a position of dominance inside and outside the Congress. As such, the party exerts a hegemony over Ukrainian politics, between its own strength and that of their supportive partners in the Revolutionary Workers' Party. The R-RB itself has gone through drastic changes: Chairman Vynnychenko has been sidelined, and a Presidium elected by party members has been installed as the party's highest governing body. It makes decisions on the highest issues, which then become the basis of party policies that all members are expected to uphold without exception. It is not dissimilar to what the Bolsheviks called democratic centralism.\n\nAll this being said, the People's Republic cannot truly be called a party-state yet. The R-RB does not enjoy total control of the Labour Congress or the councils, and other factions still act as counterweights. The Socialist-Revolutionaries, though weakened, still persist alongside smaller groups that have found footing through success in the councils. While these outer factions are encouraged to cooperate, the R-RB cannot force them to, and their party committees have not yet supplanted the Republic's executive branch in the practical execution of policy. For his part, the architect of the R-RB's ascension does not care to force the issue. Anatolii Pisotskyi - First People's Minister of the Republic, First Secretary of the Presidium of the R-RB, and the true leader of the party - believes that it is predetermined that this situation shall pass. In time, the need for various parties will disappear, and all truly progressive forces will naturally unite into one body. Trying to force its creation will only create a reactionary opposition - in due time, the material conditions will provide.\n\nTime will tell whether he is right."
  ukraine_republican_events.145.d: "It is finally finished. The vow made by the Workers' Democratic Union - to complete the revolution that started with the fall of the Hetmanate - has been fulfilled. After years of struggle, Ukraine is no longer bound to the German empire, and can now concern itself solely with the march towards socialism.\n\nMuch has changed in those years. Over time, power has been slowly decentralised to peasants' and workers' councils across the country, a process expected to accelerate as wartime measures hopefully become unnecessary in the near future. The reality of Ukraine's demographics means that the peasants' councils are significantly more numerous and important than the workers' ones, and without special measures will remain so - a situation that perfectly suits the powers that be. These councils have some say in the makeup of the Labour Congress, a power designed to maintain its proletarian character. But otherwise, the Congress has remained surprisingly close to the Zbory it replaced: the centre of a system bearing some resemblance to traditional parliamentarianism. As such, even the Radical Democrats have been able to claw out a presence alongside the USDRP in the Congress, albeit a very marginalised one.\n\nThe Socialist-Revolutionaries, led by their radical components, have shaped these developments and now sit at the centre of the new revolutionary order. The title of Chairman has passed from Volodymyr Vynnychenko to the S-Rs' man, Nykyfir Hryhoriiv. The government is now helmed by First People's Minister Pavlo Khrystiuk, the man most responsible for the party's ascent. Under his direction, the Borotbysts have been brought into the revolutionary fold, and their agrarian wing actively cooperates with the highly peasant-minded government. The R-RB has been largely supplanted by its former partners, but still competes with the Revolutionary Workers' Party for industrial constituencies, where it takes the role of constructive opposition to the government compared to the latter's dedicated opposition. The difference between their electorates is mainly whether a voter believes in cooperation with the countryside, or that they have been left behind by it.\n\nThe S-Rs do not see it that way. The peasants felt the brunt of the Hetmanist yoke, and in the fields of Ukraine laid the seeds for revolution - who's to say that they should not be the ones to reap it?"
  ukraine_republican_events.146.d: "It is finally finished. The vow made by the Workers' Democratic Union - to complete the revolution that started with the fall of the Hetmanate - has been fulfilled. After years of struggle, Ukraine is no longer bound to the German empire, and can now concern itself solely with the march towards socialism.\n\nMuch has changed in those years...and yet, some would say that little truly has. Peasants' and workers' councils have been slowly received powers from the central government, and will likely gain more when wartime measures disappear. These councils have some say in the makeup of the Labour Congress to help maintain its proletarian character - but those who were expecting a more thoroughly revolutionary replacement to the Zbory have been largely disappointed. The Congress is still governed by fairly traditional parliamentarianism, and the government's relative disinterest in persecuting the bourgeois and “revisionist” left has meant that the USDRP still finds a considerable place there alongside the leftists, and Radical Democrats can sometimes enter through seats designated for the “labour intelligentsia”. Even among the peasants' councils - which substantially outnumber the workers' ones - one can occasionally find a surprisingly conservative independent being sent to the Congress, to much shock and horror.\n\nDespite some teeth-clenched dynamics, many of these progressive forces have actually been able to form a working, if sometimes shaky relationship with each other. Vynnychenko has ultimately been replaced as Chairman by the UPS-R's Nykyfir Hryhoriiv, but the real orchestrator of this harmony has been the First People's Minister, Mykola Kovalevskyi. Leading the moderate Socialist-Revolutionaries, he has maintained a balance between the forces of revolution and evolution and forged a peace between the factions, all while manoeuvring the S-Rs into a leading position within the Congress. Together with the Social Democrats, the S-Rs now preside over a popular front of themselves and the Council-Revolutionaries, while Revolutionary Workers' Party members have emerged as the main antagonists of the system.\n\nWhether this state of affairs can last is anyone's guess. Some predict that the front cannot hold; that the Congress will eventually be captured by more revolutionary elements - or infiltrated by reactionary ones and subverted from within. But that is the future: for now, the revolutionary honeymoon goes on."
  ukraine_republican_events.37.d2: "The support of the trade unions will be invaluable in the coming election. The trade unions have traditionally been aligned with the Borotbysts and the URRP, following orthodox syndicalist lines; but times are different now. The Hetman's brutal actions, repressing socialists of any kind, had radicalised many into far-left, revolutionary positions. Now that the people's republic has been restored and these same revolutionaries are no longer being targeted, other parties have sought to gain a foothold on the trade unions. Independent unions have sprung up greatly after the revolution and there is significant potential to turn these to their side. However, the people's republic is still young and has yet to prove if it can provide an efficient administration, which has made some apprehensive about declaring their allegiance to a new political party.\n\nNaturally, the RDS is a worker's alliance, and our standing is quite strong here. Still, the Borotbyst and URRP dominance over the trade unions poses a difficult question for us. Perhaps it would be best to make an agreement with the Borotbysts; in exchange for not trying to contest them where they have made local election gains, they will lend us their support in parliamentary elections. Such an agreement would be rather problematic for the UPS-R, given that they tend to contest the Borotbyst vote in local elections. But it would be equally problematic for the R-RB not to come to an agreement, as it will undermine the amount of votes they will receive from urban workers."
  ukraine_republican_events.52.d: "A right to strike is one of the basic rights guaranteed by the People's Republic's constitution, and, it seems, some are ready to exercise it to the fullest. The Independent Union of Miners is a new organisation, not tied to the established trade union structures and created after the lift of the restrictions on labour associations imposed by the Hetmanate. It enjoys quite a lot of support from the miners of the Donbas region and is responsible for the numerous strikes now gripping the mining industry. Strikes are to be expected, with the economy only recently starting recovering from the shock of the Black Monday crisis, but these ones have a streak of militancy and radicalism more reminiscent of the heady days of 1936.\n\nIt is obvious that while the workers have justified grievances, the URRP and Borotbysts, without a doubt standing behind this Independent Union, are using the situation to further their own political goals: to disrupt public order and discredit our newly established government. Our partners in the USDRP managed to achieve an understanding of sorts with the leading figures of the Union and presented to us a road map, designed to alleviate labour tensions in the long run.\nTwo main points of the agenda: bringing mining enterprises under state supervision and continuous state support for organised labour. A pledge to these causes might win the trust of the Union leadership and calm the present hectic situation.\n\nThis proposition immediately raised suspicion among the party. Some argue that the USDRP is merely using the ongoing crisis to push for its own narrow goals. There are no guarantees, and even in the case of success, the USDRP will simply take credit for it, building its own political capital at our expense. Strikes, after all, can be waited out, while the People's Militia ensures that they cause no disruption of public order. Still, inaction and hesitancy may put our administration in a bad light, so perhaps going with the USDRP's plan is the right thing to do."
  ukraine_republican_events.150.d: "The far left have played a very important role in the struggle against the Hetmanate. By keeping the flame of resistance alive and by raising the banner of rebellion among the downtrodden, the revolutionary vanguardists have helped us greatly. That doesn't mean, however, that we don't have a fair share of disagreements between us. While some, like the majority of the RDS, decided to properly integrate themselves in the new political system, others chose a more ambiguous or even openly hostile stance towards the People's Republic.\n\nSuch developments can't be ignored. Political disagreements aside, those who refuse to recognise our Republic's right to exist should be fought regardless of past merits. For now, our security services, supported by their German counterparts, have two main aims: to closely monitor the internal organising measures undertaken by certain radical groups and to investigate their potential foreign contacts.\n\nRegarding the first task, the name of Mykhailo Poloz immediately came to attention. A talented coordinator of underground activities during Hetman's reign, he once again seems to be involved in the revolutionary plotting. With another prominent Borotbyst, Levko Kovaliv, leading an influential left faction in the local Poltava council, Poloz has a comfortable base of operations in this region.\n\nWhen it comes to potential foreign meddling, the focus should be directed towards the URRP and the radicals in the RDS. The 'internationalist' wing of the first, led by Stanislav Kosior and Lazar Kahanovych, is under suspicion of keeping close contacts with Russian socialists.\nMeanwhile, certain elements of the RDS, centred mainly around Anatolii Pisotskyi and Pavlo Khrystiuk, are rumoured to retain extensive connections with Paris. Given our country's precarious position and the importance of Germany's security guarantees, it's of utmost importance to pay close attention to such activities."

