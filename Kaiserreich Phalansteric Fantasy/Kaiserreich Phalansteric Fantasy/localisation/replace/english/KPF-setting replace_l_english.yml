  #LAT
  LAT_totalist_party: "LRSP"
  LAT_totalist_party_long: "Latvijas Revolucionārā strādnieku partija (Revolutionary Workers' Party of Latvia)\n§LThe Revolutionary Workers' Party of Latvia is led by the same Bolsheviks who were previously vanquished by the German army.\n\nIn the face of undeniable French ideological influence, the reorganised Latvian Revolutionary Workers' Party is split between those who would embrace a more syndicalist identity and those who would not.§!\n"
  LAT_radical_socialist_party: "LRSP"
