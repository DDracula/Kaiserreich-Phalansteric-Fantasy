  #BAT
  BAT_totalist_Riga: "LRSP"
  BAT_totalist_Riga_long: "Latvijas Revolucionārā strādnieku partija (Revolutionary Workers' Party of Latvia)\n§LThe Riga branch of the LRSP works tirelessly to reunite newly-liberated Latvia with its historical capital, attempting to stoke insurrection via strike actions and sabotage. Despite this, Riga's security forces and the lack of radicalism amongst the population mean that their mission is unlikely to succeed without a large-scale armed confrontation.§!\n"
  BAT_radical_socialist_Riga: "LRSP"
  BAT_radical_socialist_Riga_long: "Latvijas Revolucionārā strādnieku partija (Revolutionary Workers' Party of Latvia)\n§LThe Riga branch of the LRSP works tirelessly to reunite newly-liberated Latvia with its historical capital, attempting to stoke insurrection via strike actions and sabotage. Despite this, Riga's security forces and the lack of radicalism amongst the population mean that their mission is unlikely to succeed without a large-scale armed confrontation.§!\n"
  BAT_totalist_union: "RWPBT"
  BAT_totalist_union_long: "Revolutionary Workers' Party of the Baltic Territories\n§LRadical elements of the revolutionary left within the Baltic states view the developments that led to the forging of a new Baltic Union as not going far enough, seeking the establishment of a proletarian dictatorship for the betterment of the industrial worker. They stand in opposition even to their fellow revolutionary socialists, viewing themselves as the \"true\" vanguard party, meant to guide the Baltics towards true revolution.§!\n"
  BAT_radical_socialist_union: "LRWP-RALET"
  BAT_radical_socialist_union_long: "Revolutionary Workers' Party of Lithuania - Revolutionary Alliance of Latvian and Estonian Territories\n§LWith the total collapse of the United Baltic Duchy and the establishment of a new Baltic state, ostensibly under native rule, the RALET continues its mission, which has now fulfilled its national component. Associating with their counterparts in the Lithuanian Revolutionary Workers' Party, they remain a strong proponent of revolutionary socialism and of the Baltic proletariat.§!\n"

