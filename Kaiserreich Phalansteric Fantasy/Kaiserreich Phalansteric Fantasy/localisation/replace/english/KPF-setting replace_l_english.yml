  #INS
  INS_munawar_musso_leader_desc: "§YBorn:§! §LAugust 12th, 1897, in Pagu, East Java, Dutch East Indies§!\n§YBackground:§! §LMusso was one of the leaders of the revolutionaries in 1925, a revolution inspired by the British one which was swiftly crushed by the colonial authorities and eventually resulted in the destruction of the PBRI, forcing Musso to flee to the People's Republic of Bengal, from where he got into touch with Totalist thinkers from Europe. Convinced by the revolutionary ideas of this new movement, Musso hosted a reading and translation of the Totalist Charter among Indonesian exiles in Calcutta, subsequently forming the Partai Totalis Indonesia (PTI) that was to be the successor of the PBRI. This definitively alienated Tan Malaka and his followers as the PTI rejected collaboration with Muslims towards independence, setting the stage for a permanent split in Indonesian socialism.§!"

