  #ARM
  ARM_totalist_party: "Heghapokhakan"
  ARM_totalist_party_long: "Heghapokhakan Banvorakan Kusaktsutyun (Revolutionary Workers' Party)"
  ARM_first_popular_assembly_desc: "With the revolution being achieved, it is now the time to decide the future course of the country. Two main factions have formed: the Revolutionary Workers' Party and the Hunchaks, both aiming to carry the torch of the revolution. We shall organise the First Popular Assembly, which shall decide who should lead our people into their glorious and prosperous future."
  ARM_communist_victory: "Victory of the Revolutionary Workers' Party"
  ARM_communist_victory_desc: "The Popular Assembly has concluded - and chosen the Revolutionary Workers' Party to carry on the revolution! This more radical faction has promised to completely reform the economy with an emphasis on a Marxist base and to take action against social inequality. Let's hope that they can achieve their goals and turn our state into the paradise Marx dreamed of!"
  armenia_events.12.d: "The revolutionary coalition, consisting of the Hunchaks and the Revolutionary Workers' Party, has won the first Armenian elections and thus paved the way for a true revolution and a better life for the Armenian people. However, now that power sits firmly in their hands, the Hunchaks and the Revolutionary Workers' Party have fully become aware of their vastly different opinions on many subjects, such as our economic and foreign policies. Still, the two parties stayed true to the revolutionary spirit and didn't let these differences drive a wedge between themselves. After some short debate, they managed to find a solution that could satisfy both of them: an Armenian Popular Assembly.\n\nThis assembly is to be held in Yerevan, where it shall decide which of the two factions should take the leading role in the revolutionary coalition and determine our nation's future politics. Representatives from all over Armenia have been invited and are currently pouring into our capital. While some of them are die-hard defenders of the Hunchak or Revolutionary Workers' Party cause, many are still on the fence. This makes the outcome of the assembly rather uncertain and has encouraged political discussions and speculations in newspapers and cafes. It almost seems as if the entire population of Armenia is currently awaiting the first decisions of the assembly with bated breath. Soon, the revolutionaries will give their first speeches, the first major debates will be held, and the future of our nation will be decided."
  armenia_events.13.d: "The time has come! Today, the representatives of the revolutionary coalition shall come together and vote on what exactly the main political goal of the new government should be.\n\nThe more moderate Hunchaks argue that the backbone of Armenia, and every other country in the world, is the average worker. When he suffers, the nation suffers as well. Seeing how poorly our most hard-working citizens have been treated by the Ottoman administration and the first provisional Armenian governments, the Hunchaks deem it necessary to enshrine workers' rights in our constitution and thus improve the standard of living across our nation. After all, it is unacceptable for a modern and revolutionary nation to let its citizens work under the poorest conditions while receiving nothing but breadline wages.\n\nWhile members of the Revolutionary Workers' Party agree with most of what the Hunchaks say, they want to go a step further and totally transform our country. According to them, capitalism has failed the Armenian people and should be heavily restricted. They advocate a more Marxist approach, one that can finally bring the Armenian citizens the equality and autonomy they have always strived for. Even though this may sound nice on paper, some Hunchak politicians have been openly questioning the effectiveness and necessity of such a radical approach, arguing that it would likely do more harm than good.\n\nBoth sides have spent the last few days vigorously defending their point of view, trying to persuade as many representatives as possible. Today, we shall see which of the two factions was more convincing."
  armenia_events.14.d: "The next issue that the assembly should address is the question of our economic policy. Whilst the Hunchaks and members of the Revolutionary Workers' Party agree that our current economic system is not in a very good state and in need of some major changes, it is still open to debate what exactly these changes should look like.\n\nAs was to be expected, the Hunchaks are in favour of a more moderate solution. They argue that we can not only improve our economy, but also the standard of living across Armenia, if we manage to find the right balance between social and economic reforms. For example, affordable healthcare and a decent minimum wage could make the life of our citizens much easier, while progressive taxes and a redistribution of wealth and income could help achieve our goal of a classless society, in which the economy doesn't solely serve the upper class. Furthermore, these reforms would be rather easy to implement, and would only require a few new laws to be passed.\n\nMeanwhile, the Revolutionary Workers' Party advocates a radical approach. In order to achieve true equality and a society in which egoism is an alien concept, they deem it necessary to collectivise and nationalise major companies and businesses. An economy controlled by the state could better meet the needs of the Armenian people and would ensure that wealth is spread equally amongst them, would however also strip entrepreneurs of their freedoms - a trade-off which members of the Revolutionary Workers' Party are more than willing to take."
  armenia_events.15.d: "The last point on the agenda of the assembly is the foreign policy of our nation. It is no coincidence that this issue was saved for last, as it is the subject on which the opinions of the Revolutionary Workers' Party and the Hunchaks differ the most.\n\nThe Hunchaks think that it is necessary for Armenia to reorganise its armed forces into a revolutionary army, one that can defend our nation even against superior foes and will do whatever it takes to guarantee the survival of the Armenian state. To further emphasise the importance of the military for our freedom, the leader of the Hunchak party, Gregory Yeghikian, gave a patriotic speech in front of the assembly, honouring our brave soldiers and highlighting the fact that Turks, Russians and Persians will soon seek to subjugate our nation once more - something we can only prevent by building an army worthy of Armenia and her people.\n\nHowever, members of the Revolutionary Workers' Party argue that this goes too far. The creation of a revolutionary army would make our society militant and could be used by our neighbours to justify a preemptive strike against our nation. They think that we should just focus on our own affairs and try to keep a low profile. This could give us a chance to develop our nation without foreign intervention and to prosper and flourish peacefully and quietly, would however also put us in a rather vulnerable position."
  armenia_events.16.t: "The Revolutionary Workers' Party Takes Power"
  armenia_events.16.d: "The First Armenian Popular Assembly has concluded, and the representatives are slowly starting their journey back home. After all the different issues had been voted on and the votes had been counted, a clear winner was determined: the Revolutionary Workers' Party under Anastas Mikoyan. Their political goals and measures seem to have been well-received by the representatives and the people, as shown by the clear majority the party has managed to achieve. Shortly after this news had spread throughout the country, Mikoyan gave a speech on the radio. In it, he thanked the people for putting their trust in him and his party, and promised that his policies would bring Armenia the peace and prosperity it deserves.\n\nAlthough some expected the Hunchaks to be bitter about their loss, considering that they were the ones who brought the revolutionary ideas to Armenia in the first place and thus probably hoped to defend them in the future, the Hunchak politicians nevertheless seem relatively content with their new position in the coalition. Gregory Yeghikian even congratulated Mikoyan on the victory of his faction, promising to support him in his endeavour to revolutionise the nation. Both parties appear to be as close as ever, and more than eager to bring about an Armenian revolution."
  armenia_events.17.d: "The First Armenian Popular Assembly has concluded, and the representatives are slowly starting their journey back home. After all the different issues had been voted on and the votes had been counted, a clear winner was determined: the Hunchaks under Gregory Yeghikian. As it seems, the representatives, and thus the people, do not want radical changes, but rather strive for moderate reforms capable of improving their living situation. In an address he gave to the press this morning, Minassian gave himself relatively unsurprised, saying that he had not once doubted that the assembly would choose the Hunchak party to lead the nation. Still, he thanked the people for their support and promised to bring them equality and liberty.\n\nWith the moderates now setting the agenda, the more radical members of the Revolutionary Workers' Party seem to be a tad bit disappointed. Though they still think that the Hunchak reforms won't be enough to truly change the Armenian nation for the better, they refrained from openly questioning the decision of the assembly and promised the Hunchaks their continued support. With the Hunchak-led coalition now guiding our way, peace and prosperity have become imminent!"
  armenia_events.31.d: "Elections are drawing ever closer, and the two contesting coalitions have now begun to use their resources for election advertising. In order to convince the people of their political goals and agendas, both camps are now sending their most prominent politicians to radio stations and newspapers. With the help of these modern media outlets, they can appeal to the entire nation with ease.\n\nThe democratic coalition, consisting of the liberal Ramgavar and the social democratic Dashnaks, has a relatively wide base of supporters, containing entrepreneurs, intellectuals, and to a lesser extent also the common workers. Since the democrats are certain that the middle and upper classes rather dislike the thought of a revolution, they take the support of this part of the population for granted. Hence, they decided to focus their advertisement efforts on the lower classes of Armenian society, promising that the mild reforms advocated by the Dashnak party will bring the people prosperity, whilst also claiming that the promises of the revolutionaries will do more harm than good.\n\nMeanwhile, the revolutionary coalition, which is made up of the Hunchaks and the Revolutionary Workers' Party, is also trying to convince the lower classes of their policies. They denounce the democrats as hypocrites, and argue that the liberals only seek to represent the interests of the capitalist upper class, not the hard-working men of Armenia. In a radio speech he held this morning, Anastas Mikoyan, the leader of the Revolutionary Workers' Party, emphasised the necessity of a total revolution, one which will cause a complete social upheaval and bring the workers of our country the rights and riches they desire.\n\nWith both factions fighting over the votes of one class, the workers and farmers of our country now essentially find themselves in the position of kingmaker. Soon we shall know which side was more convincing in the eyes of the common folk."
  ARM_guide: "£white_dot Note: To unlock §YArmenia's§! political paths, the §rWar of Independence§! against the §YOttoman Empire§! must first be won.\n\n§MProclaim Tseghakronism§! ($national_populist_coloured$)\n£white_dot Have over 50% support for the §PPaternal Autocrats§! when a ceasefire with the §YOttoman Empire§! is signed.\n£white_dot §YRussia§! must be led by §nBoris Savinkov§! at the time of the ceasefire.\n£white_dot In the event §YThe Democrats Return§!, choose the second option to cement the rule of the §nTseghakronutyun§!.\n\n§MThe Survival Party§! ($paternal_autocrat_coloured$)\n£white_dot Have over 50% support for the §PPaternal Autocrats§! when a ceasefire with the §YOttoman Empire§! is signed.\n£white_dot §YRussia§! §rmust not§! be led by §nBoris Savinkov§! at the time of the ceasefire.\n\n§MThe True Saviour of Armenia§! ($authoritarian_democrat_coloured$)\n£white_dot Follow the first two steps of the §nTseghakronist§! guide.\n£white_dot In the event §YThe Democrats Return§!, instead choose the first option to topple the rule of the §nTseghakronutyun§!.\n\n§MDemocratic Coalition§! ($market_liberal_coloured$ / $social_conservative_coloured$ / $social_democrat_coloured$ / $social_liberal_coloured$)\n£white_dot Have less than 50% support for the §PPaternal Autocrats§! when a ceasefire with the §YOttoman Empire§! is signed.\n£white_dot Complete the focus §YThe First Armenian Elections§!.\n£white_dot In the resulting event, have the §SDemocratic Coalition§! stand victorious.\n£white_dot In the event \"§Y$armenia_events.33.t$§!\", you can elect either §SRuben Ter Minassian's Dashnak Party§! or §mMihran Damadian's Ramgavars§!.\n£white_dot To elect the §cArmenian Populist Party§! or the §lSocialist-Revolutionary Party§!, wait two years for the §SDemocratic Coalition§! to break up and a second election to be organised.\n\n§MRevolutionaries§! ($radical_socialist_coloured$ / $totalist_coloured$)\n£white_dot Follow the first two steps of the §SDemocratic§! guide.\n£white_dot In the election event, have the §rRevolutionaries§! achieve a landslide victory.\n£white_dot Complete the focus §YThe First Popular Assembly§!.\n£white_dot For the §RHunchaks§! to take power, select the first option of at least two events during the resulting event chain.\n£white_dot For the §oHeghapokhakan§! to take power, select the second option at least two times."
