  #NOR
  norway_events.6.t: "End of the NRWP"
  norway_events.6.d: "Today the NRWP, the Norwegian Revolutionary Workers' Party, disbanded itself. Having failed to capitalise on the current economic crisis, the party decided to disband itself and have its members join the newly created Norwegian National-Syndicalist Party. Based upon the new teaching of politicians such as Benito Mussolini and Oswald Mosley, popularly known as \"Totalism\", the party hopes to aspire to greater things than revolutionary vanguardism ever proved capable of."
  NOR_country_intro_content: "Norway is standing at a crossroad in history. While the nation is relatively prosperous, civil society is plagued by political infighting and stagnation.\n\nThe left is divided as a result of schisms within the once dominant Labour party. In 1921 the moderate faction broke away and formed the Social Democratic Labour Party, while the radical syndicalist wing broke away to form the Norwegian Syndicalist Federation in 1923. In addition, the Norwegian Revolutionary Workers' Party is struggling and there are rumours about forming a new vanguard party of the far left, based upon the principles of National-Syndicalism.\n\nOn the opposite end of the political spectrum, several nationalist organisations are jockeying for power and influence. While they are somewhat united in their opposition to socialism, their means and goals differ.\n\nWhile the political infighting has not resulted in violence, the ruling Liberal party is mostly powerless to handle pressing issues due to its minority government. As dark clouds are gathering once more over Europe, the people are anxiously awaiting the election in October 1936."

