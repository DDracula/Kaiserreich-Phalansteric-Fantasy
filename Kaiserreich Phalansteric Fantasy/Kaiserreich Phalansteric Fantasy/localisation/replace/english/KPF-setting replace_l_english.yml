  #BUL
  BUL_communist_party: "BRRP"
  BUL_communist_party_long: "Bŭlgarska Revolyutsionna Rabotnicheska Partiya (Bulgarian Revolutionary Workers' Party)\n§LThe Narrow Socialists have prevailed over their agrarian counterparts in \"Vlasovden\", and now seek the establishment of their \"dictatorship of the proletariat\", heavily inspired by the proposed Bolshevik approach to governance before their downfall during the Russian Civil War. Ostensibly for the betterment of the industrial worker, they seek an aggressive industrialisation and modernisation of the Bulgarian state, and are likely to turn to increasingly radical methods to achieve this goal.§!\n"
  bulgaria_events.63.d: "Now that the Agrarian National Union has been purged and driven underground, there are two political tendencies left inside the Fatherland Front. While both of them declare themselves to be socialist and seek to create a socialist republic, they differ in their goals and ideology — an extraordinary congress of the Front has been called to elect new leadership of the organisation and decide on its direction hereforth.\n\nThe Narrow Socialists, colloquially called the \"Revolutionary Workers' Party\", were the instigators of the Front and are led by Georgi Dimitrov. Though having spent most of his career in exile in France, Dimitrov has grown critical of the political system of the Commune, stating that is system is only effective in industrialised Western states and a socialist state in a country as backwards as Bulgaria must first focus on modernisation before it can implement orthodox socialist theory. Such a modernisation drive must be led by an educated, professional vanguard - Dimitrov points to the failed, yet famous revolution in Russia as an example of how a socialist revolution may be waged.\n\nThe Vlasovden Agricultural Confederation, meanwhile, is a trade union council seeking to unite the agricultural workers of Bulgaria. Led by Manol Vasev, it is clearly inspired by anarchist and Syndicalist theory - however, it seeks to implement these principles among the peasantry. Their vision for Bulgaria is that of a decentralised state divided into rural communes, with the supremacy of a trade union congress at the top, managing Bulgaria according to the interests of the organised agricultural workers.\n\nWhile the Narrow Socialists technically lead the Front, they are held back by their leadership only now returning from exile, while their Syndicalist peers had continued the fight back home and gained the respect of the people."

  #FER
  russia_far_east_events.103.d: "A wave of terror has been unleashed by the security services under the tight grip of Supreme Voyevoda Diterikhs. Colonel Konstantin Kromiadi - a former Savinkovite who defected to the Circle of St. George - has led an organisation of paramilitaries nicknamed the 'Oprichniks', after Ivan the Terrible's proto-security service. The purpose of these 'Guard Brigades' is to hunt down the enemies of the state - not only separatists but also Bolsheviks and various other criminals. With extralegal powers, these squads have been conducting public executions - ensuring that everyone in the village is perfectly aware of them.\n\nThese brutal methods have eradicated most public protests for now, forcing the resistance underground. Socialist terrorist cells continue to operate and strike against the Tsarist officials, but we will prevail.\n\nIn Tsar Nikita's address to the nation, he explained the need for drastic measures to ensure lasting peace and stability. Loyal and faithful Russians will have nothing to fear, but given how deep the socialist and collaborationist rot has spread in Russian society, there are many traitors and enemies of the people among the common people. To prove their loyalty, men are encouraged to join the Monarchic Union and its various side organisations - and help in restoring the old Russia, before all the schism, unrest and trouble."

  #FOP
  FOP_the_communist_supremacy_desc: "Despite having suffered a major setback when the October Revolution failed in Russia, the Argentinian Revolutionary Workers' Party has managed to reach power regardless, and now holds the majority of the seats in the Congress. While their shared dream with the Bolsheviks of a new world order under a revolutionary vanguardist banner may still be far away, this victory has certainly brought them one step closer."
  patagonia_events.106.d: "Tragedy has struck today as a battalion of our frontline troops clashed with another one of our own. While the gunfight was rather short because they were able to quickly realise they were all fighting on the same side when noticing their ragged uniforms and outdated rifles, the small skirmish left 5 dead soldiers and about a dozen wounded. Unsurprisingly, one of the battalions is led by an officer affiliated with the Revolutionary Workers' Party, and the other by a well known anarchist. While an investigation by both sides is being carried out to figure out which is the guilty party for such a mishap, it's clear that both sides are pointing fingers at each other, and an attempt at an objective investigation is becoming harder by the day. With the families of the dead asking for justice to be delivered, the Chairman will need to take a decision on the matter."
  patagonia_events.110.d: "After a few episodes of small-scale desertions, the Revolutionary Vanguardist faction has proposed to introduce political commissars to the frontlines for all units. These officers, elected amongst a list of party officials for each battalion, will be in charge of making sure no soldiers are harbouring hidden sympathies for the reactionaries. While members of the Revolutionary Workers' Party have been using these methods since before the war even began, this has caused friction with the other factions. With tensions running high, some believe this is a way for the revolutionary vanguardists to start purging the opposition before taking over. Then again, with desertion of conscripted locals becoming ever more normal, maybe this proposal would be handy to ensure the loyalty of our troops."
  patagonia_events.111.d: "Terrible news has arrived from the front today, as apparently a full battalion made up of residents from the Department of Futaleufú has deserted after a skirmish with the Argentine army on the frontline. With our efforts to conscript as much manpower as possible from whichever source we could find, proper screening of the political allegiance of recruits has been clearly undercut to facilitate recruitment and this should probably come as no surprise to us. To add insult to injury, members of the Revolutionary Workers' Party have been fast to point out that the column had a clear lack of commissars, further challenging our government's decision to refuse their implementation and polarising the situation even further."
  patagonia_events.203.d: "The defeat of Bolshevism and the rise of Syndicalism severely weakened the Argentinian Revolutionary Workers' Party during the infancy of the revolution, but its many advocates managed to keep their ideals alive for long enough to form their own trade union, the Comité de Unidad Sindical Clasista. However, the party started to gain a lot of traction during the revolution as a direct reaction to anarchists, as many in Argentina see them as dangerous and see the revolutionary vanguardists as a way to combat them while still being able to fit into the new revolutionary society. Despite largely being the underdogs for the Congress, their newly found strength has allowed them to be able to have a significant chance at winning the Congress, and as such, the CUSC has opted to not try and split the votes and has unanimously appointed Rodolfo Ghioldi as their leading delegate in the Congress. Only time will tell if Ghioldi's approach to our ideals will be enough for us to come out on top..."
  patagonia_events.336.d: "With the collapse of Andesia, Liborio Justo has lost almost all political clout in the CUSC and the Revolutionary Workers' Party. In a shocking yet not unexpected fashion, the CUSC proposed a vote of No Confidence in the Congress today, which was nearly unanimously successful. Disgraced, Justo decided to resign, and the CUSC set out to decide on the new Chairman. With little opposition, Ghioldi stood up once more as the popular candidate, and has now been sworn in as the new Chairman. With a more moderate approach, it is expected that Ghioldi will look inwards, and try to fix the damage Justo made, while trying to dial back some of the harsher policies that he implemented."
  patagonia_events.340.d: "With the help of the Russian Community in Entre Rios, a monument to the martyrs of the October Revolution has been inaugurated by chairman Justo today. The monument, boasting a statue of Lenin leading a group of bronze workers, has received plenty of media coverage during its construction the last few months, and the chairman has taken the chance to speak to the people. However, while the occasion would've normally helped boost the Revolutionary Workers' Party's popularity, one of Justo's speeches outright accused the October Revolution of failing not because of outside factors like the German intervention, but as a result of subterfuge from within the revolutionary movement. This speech has been twisted by sensationalist media as a statement against the Third Internationale, and now the inauguration of the monument has become a subject of controversy not just in Argentina, but seemingly abroad as well..."
  FOP_totalist_party_long: "Comité de Unión Sindical Clasista\n§LThe CUSC is dominated by Bolsheviks, revolutionary vanguardists and other right-leaning socialists, many of whom hail from Russia. Chairman of the party is Victorio Codovilla, former leader of the old Buenos Aires-based Revolutionary Workers' Party of Argentina, but the true power within the CUSC lays in the hands of Rodolfo Ghioldi; Young, charismatic and radical, he is seen as superior to Codovilla by many of his party colleagues. The latter however has good relations to the Bolshevik émigré community in the French Federation of Communes and therefore to the Syndicalist International as a whole, making his position fairly entrenched as of now. The infamous bandit Alfredo Fonte, while largely irrelevant in politics, also has ties to the CUSC leadership, along with the infamous 'politician' Liborio Justo.\n\nFounded: §Y1929§!\nIdeology:\n- Revolutionary Vanguardism§!\n"
  FOP_rodolfo_ghioldi_leader_desc: "§YBorn:§! §LJanuary 21st, 1897, in Buenos Aires, Buenos Aires Province, Argentine Republic§!\n§YBackground:§! §LRodolfo Jose Ghioldi began his career in the Argentinian Revolutionary Workers' Party right as it formed in 1917, being elected as the vice-president Federación de Juventudes Socialistas. He worked as a teacher the following years as the revolution in Russia waned, and once the events of the Semana Tragica and the Patagonia Rebelde occurred, he was laid off from his work during the following red scare due to his political views. Seeing little purpose in staying in his home city of Buenos Aires, Ghioldi pulled strings in the Revolutionary Workers' Party to be sent to Patagonia with his brothers Americó and Orestes. After his arrival, factional disputes between the Party and the Anarchists led the leader of the party, Luis Emilio Recabarren, to eventually commit suicide. With the help of Moisés Isaakovich Kantor, Ghioldi was quickly able to campaign and become the leader of the Revolutionary Workers' Party, leading it from 1924 onwards with the help of his brother Orestes. The compromising nature of Ghioldi was able to help defuse the tensions between Anarchists and members of the Revolutionary Workers' Party in Patagonia, helping both coordinate their efforts against their common enemy in Argentina, but while this has made him a respectable figure among moderate circles and the opposition, the radicals within the Party have been quick to accuse Ghioldi of favouring other parties' interests above theirs.§!"
  FOP_liborio_justo_leader_desc: "§YBorn:§! §LFebruary 6th, 1902, in Buenos Aires, Buenos Aires Province, Argentine Republic§!\n§YBackground:§! §LThe son of the Argentine General Agustin P. Justo, 'Quebracho' was raised within a military background as his father worked as headmaster of the El Palomar Military Academy, allowing Justo to spend time with whom, ironically, he'd end up fighting against during the revolution. While generally shielded by his father from the anti socialist regimes that kept appearing in Argentina, Liborio decided to embark on a personal crusade southwards, first touring through the vast expanses of Patagonia to mingle with the rural peasantry, and later to fully join the revolutionary movement as an asset, having prepared for it bringing as many books as he could muster from his father's collection in El Palomar. Quickly, he became one of the most important assets for the Revolutionary Workers' Party militias trying to face off the Argentine Army, and while far from being as skilful as his father, he proved to be a decent field commander. This, paired with his firebrand advocacy for South American revolution and the overall overthrow of Capitalism, quickly allowed him to rise in relevance in the Revolutionary Workers' Party, and while he originally lacked the political clout to beat Ghioldi, Liborio eventually got his chance to shine in the coup against the government. Now standing as chairman, Liborio has even publicly stated that he sees himself as a 'Messiah of the Latin American Revolution', and that the Argentine revolution is just the first step towards a bigger plan..."
  FOP_jose_fernando_penelon_advisor_desc: "§YBorn:§! §LSeptember 8th, 1890, in Buenos Aires, Buenos Aires Province, Argentine Republic§!\n§YBackground:§! §LNot much is known about him until the year 1906, where he became a union leader during a graphic workers' strike led by Luis Bernard. He joined the Socialist Party of Argentina that same year and collaborated in the formation of the first trade union. In 1908 he intervened in the foundation of the Socialist Youth, laid the foundations and outlined the orientation of the Trade Union Propaganda Committee which managed to organise 18 unions. He later joined the Buenos Aires Graphic Federation, a guild, in 1910, and in 1912, as the Buenos Aires Graphic Federation managed to be recognised for the first time by the employers as representative of the workers of the sector, reformism began to be designed. He also intervened in the founding of the 'Carlos Marx' centre of studies When the Socialist Word newspaper made its first publish, Penelón criticised this reformism. In 1915, he was elected as the director of the Graphic Worker newspaper, and he later founded the Argentine Committee of the International Red Union. He also ran for national deputy in 1916, but lost. He was expulsed in 1917 from the Socialist Party of Argentina due to his criticism of reformism, and he went on to found the International Socialist Party of Argentina, later the Argentine Revolutionary Workers' Party.\n\nIn March 1st of 1919, a little under two months after Semana Trágica occurred, Penelón manifested in behalf of 'The International' with a writing condemning heavily the actions done by the government and mentioning the horrors that peaceful citizens and defenceless ones suffered during that event. Penelón's house, alongside other syndicalist leaders, was raided, which led to FORA requesting guarantees for Penelón not to be persecuted. Later in the summer of 1920, strikes broke out in Patagonia which led to a general strike and then an all-out rebellion (called the Patagonian Rebellion), which ended up seceding Patagonia with the rest of Argentina, and Penelón fled south to build a new future in Patagonia. Here, Penelón was resposible for diplomatic contacts with other socialist contries, desperately securing international support for the fledgeling state.§!"
  FOP_victorio_codovilla_advisor_desc: "§YBorn:§! §LFebruary 8th, 1894, in Ottobiano, Pavia, Kingdom of Italy§!\n§YBackground:§! §LHe was born in 1894 to a middle class family, being the youngest of seven sons from Venancio Codovilla and Juana Ferrandi. Victorio attended secondary school in a commercial school in Mortara and there he met Egisto Cagnoni, a socialist leader through whom he joined the Italian socialist youth. When he had to leave his studies for economic reasons, he joined a telegraph company in 1910 and the following year he joined the Italian Socialist Party (PSI), where he aligned himself with the internationalist current.\n\nOn December 12, 1912 he arrived in Buenos Aires after being sent by the PSI, and joined the Argentine Socialist Youth, spelling his original name 'Vittorio' as 'Victorio', but he soon left the moderate socialist groups and joined the socialist supporters of the Soviet Russia, now refugees due to their defeat in the Russian Civil War, which would later become the Argentine Revolutionary Workers' Party, where he quickly rose to leadership positions. Due to the Patagonian Rebellion, Victorio, alongside other syndicalist and socialist figures, were sent on fishing vessels to Puerto Madryn, where they remained. Victorio later became chairman of the Comité de Unidad Sindical Clasista (CUSC), a totalist faction actually led by Rodolfo Ghioldi, who many see as superior to Victorio. This faction is considered one of the most important in Patagonia alongside USA and FORA.§!"

  #GEO
  GEO_totalist_party: "SRMP"
  GEO_totalist_party_long: "Sakartvelos Revolutsiuri Mushata Partia (Revolutionary Workers' Party of Georgia)\n§LThe Georgian Revolutionary Workers' Party was founded towards the tail end of the Russian Civil War by Bolshevik aligned Georgian nationalists and a handful of the Russian Revolutionary Workers' Party's own agents within the country. It failed to gain any meaningful traction and saw heavy political repression in the aftermath of Georgia joining Germany's sphere of influence. It is a tiny, illegal organisation that mostly meets in secret, and has begun to broaden their views to form more esoteric combinations of revolutionary vanguardism and Georgian nationalism, noticeably adopting several elements of Western European Totalism. Some members of the party maintain ties with the Sotsialuri Revolutsionerebi, in hopes of influencing the only legal far-left party in Georgia to adopt more revolutionary vanguardist and Totalist oriented beliefs.§!\n"
  GEO_sasha_gegechkori_leader_desc: "§YBorn:§! §LDecember 5th, 1887, in Naoghalevi, Kutais Governorate, Russian Empire§!\n§YBackground:§! §LAleksi \"Sasha\" Gegechkori was born in 1887 in a small village near Martvili, to an impoverished noble family. He became involved in the revolutionary movement in 1902, where he worked for the Bolshevik faction of the RSDLP in various cities across not only the Caucasus, but all of Russia, most notably Chelyabinsk. He was arrested multiple times and ultimately exiled to Astrakhan, where he stayed until the February Revolution of 1917, after which he returned to the Caucasus, where he was appointed head of the Western Transcaucasian Revolutionary Committee and was tasked with initiating uprisings in his home region of Samegrelo. However, he was arrested by the Menshevik government on March 7, 1918 and was imprisoned for inciting rebellion, being released from prison only after the Russian Civil War. After his release he would rejoin the shattered remnants of the underground Georgian Revolutionary Workers' Party. When its leader Philipe Makharadze retired from revolutionary activities Gegechkori took on the mantle of leadership and has worked since then to rebuild the part to a semblance of its former relevance, finally succeeding with the help of outside powers.§!"

  #GER
  germany_swr_events.39.d: "Another day, another issue with the Reactionary faction of the DVLP — this time, the problematic actor is one of Hugenberg's top lieutenants, Paul Bang, who has come to the fore with a series of scathingly anti-socialist articles. Ever since the Ruhrkampf, the right's worries about syndicalist sabotage and interference in German politics has been at a record high and Bang has fanned the flames. \"The enemy\", as he declared, \"is on the left\"! And \"the left\" does not merely refer to the small and powerless Bolshevik parties filled with French spies and puppets - the SPD, according to Bang, is complicit in forming the right conditions for syndicalist influence to be channeled among German workers and intellectuals. Perhaps even willingly...\n\nNeedless to say, the SPD, which has had to fight off such accusations for decades, disagrees - but support for Bang's hardline anti-socialist stance is found among the far right, and he has been endorsed by figures such as Magnus von Levetzow. Ruhr industrial magnates and Alfred Hugenberg, who can't want to crush trade unions and worker activism in order to increase productivity, are on the same side as the reactionary members of the Fatherland Party as well. Hassell's wing leading the DVLP, on the other hand, would prefer a more measured and careful approach - of course, the destruction of Social Democracy is the goal of everyone in the black-white-red coalition, but should they really be so hasty?"

  #GUA
  GUA_totalist_party_long: "Partido Revolucionario de los Trabajadores de Guatemala (Revolutionary Workers' Party of Guatemala)"
  GUA_totalist_party: "PRTG"
  GUA_radical_socialist_party_long: "Partido Revolucionario de los Trabajadores de Guatemala (Revolutionary Workers' Party of Guatemala)"
  GUA_radical_socialist_party: "PRTG"
  GUA_guide: "§MLiberal Federalistas§! ($authoritarian_democrat_coloured$) / §MLiberal Progresistas§! ($paternal_autocrat_coloured$)\n£white_dot Do not prepare for elections in the Letter of the 311 event to keep Orellana and the §aPartido Liberal Federalista§! in power.\n£white_dot Or, prepare for elections to have Ubico coup the government with the §PPartido Liberal Progresista§!.\n£white_dot Focus on rooting out the opposition in the Opening Strategies event.\n£white_dot Advance onward to Quetzaltenango in the Choosing a Target event.\n£white_dot We will win the civil war and secure our rule.\n\n§MTrabajadores Revolucionarios§! ($radical_socialist_coloured$) / §MUnionistas§! ($social_conservative_coloured$) / §MPartido Renovación Nacional§! ($social_democrat_coloured$)\n£white_dot Secure the temporary borders in the Opening Strategies event.\n£white_dot Advance onward to Quetzaltenango in the Choosing a Target event.\n£white_dot The §SPartido Renovación Nacional§! will win the civil war.\n£white_dot Choose the desired party when elections are held.\n\n§MUFC Counter-Revolution§! ($paternal_autocrat_coloured$)\n£white_dot Secure the temporary borders in the Opening Strategies event.\n£white_dot Advance onward to Quetzaltenango in the Choosing a Target event.\n£white_dot The §SPartido Renovación Nacional§! will win the civil war.\n£white_dot In the elections, choose either the §RPartido Revolucionario de los Trabajadores de Guatemala§! or the §SPartido Renovación Nacional§!.\n£white_dot Have Ubico defeat the government in the Counter-Revolution."
  RULE_OPTION_GUA_PATH_RADSOC: "£KR_game_rule_flag_GUA_soc  Trabajadores Revolucionarios"
  RULE_OPTION_GUA_PATH_RADSOC_DESC: "$RULE_OPTION_GUA_PATH_DEM_DESC$ §RPartido Revolucionario de los Trabajadores de Guatemala§!, or Revolutionary Workers' Party of Guatemala, takes power."

  #GXC
  GXC.earlygame.310.d: "While much of the socialist movement in China has been influenced by Russian-style bolshevism, Kropotkin's anarchism, and French syndicalism, Zhang Dongsun found himself drawn to English guild socialism. Initially drawn to mass democracy, Zhang promoted these ideas in the new republic. However, Yuan centralisation of power and dictatorial tendencies pushed Zhang to instead look for a backbone for the republic so that it could foster a strong modern state. Zhang became interested in state socialism derived from the Fabian society, which refuted capitalism based on the living conditions of the working class and advocated collectivism through state ownership and social legislation.\n\nWhat drew Zhang particularly to Fabianism was its political elitism, which would stay with him for the rest of his political career. The chaos of the early republic led him, Liang Qichao, and Zhang Junmai to believe in political reformation led by modern intellectuals like themselves. Zhang finally took the plunge into guild socialism when Bertrand Russell came to China in 1920 on the invitation of Liang and Zhang. Writing that the socialist state could slip into tyranny should it amass too much power, Russell criticised the Bolshevik Revolution in Russia as a dictatorship only of the Revolutionary Workers' Party and not of the proletariat.\n\nAlso a critic of the Russian Revolution, Zhang Dongsun praised the moderate socialism which Russell preached, and applauded the balance between industrial unions and the state to ensure the greatest amount of freedoms to labourers and encourage their political participation whilst also putting necessary constraints on them. Russell ended up abandoning his hopes of achieving guild socialism in China, leading Zhang to regard him as not properly understanding China. Emancipated from following orthodox Western thought, Zhang began formulating his own theories on guild socialism to prove its feasibility in China."
  GXC.lategame.567.d: "In order to set his tone with the left and refine his rhetoric, Hu Hanmin has decided to make a speech to the KMT in Guangzhou, with Nanjing as an intended audience as well. Hu began, \"When your brother Hu Hanmin was in France, I met members of socialist parties from all over the world, I was able to answer all the questions they asked to their satisfaction, and I wrote more than a hundred thousand words which were all published in newspapers of all major cities in France. However, when I once talked with Sen Katayama, one of the leaders of the Revolutionary Workers' Party of Japan, he asked me a question that I could not answer.\n\nHe asked 'Why does the KMT have to be divided into leftists and rightists? When you have two people together, you have to be divided into left and right, and when there is only one person left, you still have to be divided into left and right hands; do you mean that the left and right hands have to fight each other and that you have to divide left and right even with one person?' When I heard that, I felt like crying and could not answer him. Armed comrades, did we divide the KMT into leftists and rightists ourselves? or did the Syndicalists?\n\nOur party is revolutionary, and so are our party members, our revolutionary army is particularly revolutionary, and we are the entirety of the revolutionary force. The reason why we cannot allow others to divide us is just like why we cannot let others step in and step out freely of our bellies.\"\n\nDespite his reconciliatory and seemingly regretful tone, many recognise this speech as Hu indirectly criticising both Wang Jingwei's divisive leadership of the Kuomintang as well as anarchist and syndicalist intrigue. Others felt riled up regarding their feelings towards the Chinese Syndicalist League. Hu left the stage very pleased with himself, having both refined his rhetoric, and set his tone with Nanjing."

