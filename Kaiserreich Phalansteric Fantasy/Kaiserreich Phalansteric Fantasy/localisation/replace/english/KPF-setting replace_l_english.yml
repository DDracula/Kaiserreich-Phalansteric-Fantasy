  LAT_SOV_totalist_party: "VRRP (b) - Oppozitsiya"
  LAT_SOV_totalist_party_long: "Vsesoyuznaya Revolyutsionnaya Rabotnicheskaya Partiya (Bol'shevikov) (All-Union Revolutionary Workers' Party (Bolsheviks)) - Levaya Oppozitsiya (Left Opposition)"
  LAT_SOV_party_supremacy_desc: "The Revolutionary Workers' Party is the only driving force of socialism in the Union. Trade unions, communes, the army, law enforcement and all other institutions must be under the complete control of Party officials, to ensure their loyalty to Marxism-Leninism from beginning to end."
  LAT_guide: "§MLTS(p)A - Executive Authority Constrained§! ($authoritarian_democrat_coloured$) / §MLTS(p)A - Strong Executive§! ($paternal_autocrat_coloured$)\n£white_dot Don't trust the socialist to handle the Manteuffel's insurgency.\n£white_dot Complete the focus §YConvene The Assembly§! for a series of event to appear.\n£white_dot To §aconstrain the executive§!: choose to not water down the legislature, recognize the situation and have the Saeima meet in Liepāja, have Kurelis only remain president until the crisis passes, have the Saeima be required to approve government's foreign policy decisions and don't let the executive have power over the Saeima.\n£white_dot To §Pempower the executive§!: choose to give the president unrestricted veto powers, insist in that the only place the Saeima can meet is Riga, modify and write that Kurelis is president for life in the constitution, have the Generälis remain in control of foreign policy and let the president be able to dissolve the Saeima.\n\n§MLRSP - Bolshevik Renewal§! ($radical_socialist_coloured$) / §MLRSP - Adoption of Syndicalism§! ($totalist_coloured$)\n£white_dot Reach to Peterss and the reds for help against Manteuffel's insurgency.\n£white_dot Quietly arrest Peterss when the convention convenes and don't leave Liepāja until capturing him when he escapes.\n£white_dot To go $totalist_coloured$: choose to implement a syndicalist model in the \"A Fork in the Road\" event.\n£white_dot To go $radical_socialist_coloured$: choose to hold fast to the ideals of the Bolsheviks in the \"A Fork in the Road\" event.\n§CNote: To restore the Soviet Union, go the §MBolshevik Renewal§! path, have Russia not exist and the decision to do it will appear, own and control the state of Moscow to be able to complete the decision§!."
  LAT_jekabs_peterss_totalist_leader_desc: "§YBorn:§! §LDecember 3rd, 1886, in Briņķi, Courland Governorate, Russian Empire§!\n§YBackground:§! §L$LAT_jekabs_peterss_desc_body$ To that end, in order to facilitate integration with the nations of the Third Internationale and secure the Latvian people their place in the world, Peterss has promulgated the ideological harmonisation of revolutionary syndicalism and Bolshevism in the Latvian Revolutionary Workers' Party.§!"
  RULE_OPTION_LAT_PATH_RADSOC: "£KR_game_rule_flag_LAT_soc  LRSP - Bolshevik Renewal"
  RULE_OPTION_LAT_PATH_RADSOC_DESC: "$RULE_OPTION_LAT_PATH_SOC_DESC$\nThey succeed where Russia failed, and the §RLatvijas Revolucionārā strādnieku partija§!, or Revolutionary Workers' Party of Latvia, stay true to their Bolshevik roots.$EST_PATH_REQUIREMENTS$"
  RULE_OPTION_LAT_PATH_TOTALIST: "£KR_game_rule_flag_LAT_soc  LRSP - Adoption of Syndicalism"
  RULE_OPTION_LAT_PATH_TOTALIST_DESC: "$RULE_OPTION_LAT_PATH_SOC_DESC$\nSeeing the failure of Bolshevism in Russia, it is clear that the §oLatvijas Revolucionārā strādnieku partija§!, or Revolutionary Workers' Party of Latvia, see French-inspired revolutionary syndicalism as the way forward.$EST_PATH_REQUIREMENTS$"

  #MON
  MON_roman_ungern_sternberg_desc_body: "Roman Fyodorovich Ungern-Sternberg, the \"Mad Baron\", had a troubled upbringing with constant moving, compounded by his family estate in Estonia being burned down in 1905. Joining the Pavel Military School in Saint Petersburg, he would become interested in Buddhism. After graduation he was transferred to Siberia, serving in Renenkampf's Cossack Army. In 1913, he moved to Khovd in Outer Mongolia as an officer in the detachment at the Russian consulate, after being restricted from fighting for Mongolian independence.\n\nIn the Great War, Ungern fought first in Galicia where he was wounded five times, and yet kept returning to the frontline with unhealed wounds. Being awarded a series of medals for his repeated bravery, he would then fight in the Caucasus under Baron Wrangel with his friend Grigory Semyonov. After the breakout of the Russian Civil War, he fought with Semyonov and the Whites in Siberia, acting relatively independently against the Bolsheviks.\n\nHaving been involved in Pan-Mongol affairs as early as 1918, Ungern would seize the opportunity to involve himself in the Mongolian struggle against the Chinese. Invading with his famous Asiatic Cavalry Division in 1920, Ungern would drive out the occupiers, and put down the successive MAN rebellions of 1921 and 1924. Austere and with great reverence for the traditions of Mongolia, he would assume the title of regent, awaiting the day that the 9th Jebtsundamba Khutughtu comes of age. He has vast experience, favouring aggressive, fierce, and planned out cavalry tactics learned in his service with the Don Cossacks and perfected with his Asiatic Division."

