  FCF_military_modifier:0 "联邦军队"
  FCF_military_modifier_desc:0 "虽然联邦军队和公社民兵都被视为公社军队的一部分，但联邦军队作为更加正规的部队无疑是我们真正能仰仗的革命力量。在革命带来的政治冲击下，军队也开始变得政治化。各个派别希望在军队里获得影响力，而同时，军队也希望巴黎政府可以定夺军队内部喋喋不休的关于军事改革方向的争论。"
  FCF_military_modifier_tt:0 "根据[FCF_army_theory]学说的[?FCF_army_theory_implementation|Y.1%%]落实度\n[FCF_army_theory_buff]\n由于[?FCF_army_autonomy|Y.1]的$FCF_army_autonomy$\n- $MODIFIER_STABILITY_FACTOR$：[?aa1_show|+=%.1]\n- $MODIFIER_WAR_SUPPORT_FACTOR$：[?aa2_show|+=%.1]$army_autonomy_extra$\n\n由于[?FCF_army_willing|Y.1]的$FCF_army_willing$\n- $MODIFIER_LAND_REINFORCE_RATE$：[?aw1_show|+=%.1]$army_willing_extra$\n\n由于[?FCF_army_training|Y.1]的$FCF_army_training$\n- $MODIFIER_POCKET_PENALTY$：[?at1_show|-=%.1]$army_training_extra$\n\n由于[?FCF_army_equipment|Y.1]的$FCF_army_equipment$\n[FCF_army_equipment_buff_infantry_equipment]$army_equipment_extra$\n\n由于[?FCF_army_passionate|Y.1]的$FCF_army_passionate$\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$：[?ap1_show|+=%.1]\n- $MODIFIER_MOBILIZATION_SPEED$：[?ap2_show|+=%.1]$army_passionate_extra$\n\n以及其他改革\n§R（详见军事改革决议栏，数值不计入此处）§!\n最终我们获得："

