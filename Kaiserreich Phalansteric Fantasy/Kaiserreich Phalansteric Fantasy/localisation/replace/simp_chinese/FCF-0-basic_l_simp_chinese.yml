  FCF_destroy_algerian_government:0 "摧毁阿尔及尔政府"
  FCF_destroy_algerian_government_desc:0 "阿尔及尔政府是旧殖民势力在北非的残余。摧毁阿尔及尔政府意味着支持阿尔及利亚的独立运动、切断阿尔及尔政府的国际支持、最终使阿尔及利亚摆脱殖民统治。这一目标的实现需要军事、经济与外交手段的综合运用。"

  FCF_break_racial_segregation:0 "打破种族隔离"
  FCF_break_racial_segregation_desc:0 "文本大意：支持南非革命"

  FCF_liberate_equatorial_africa:0 "解放赤道诸国"
  FCF_liberate_equatorial_africa_desc:0 "文本大意：破坏德属中非"

  FCF_against_ottomans:0 "对抗奥斯曼"
  FCF_against_ottomans_desc:0 "奥斯曼帝国控制着中东与东地中海的大片领土。对抗奥斯曼意味着支持奥斯曼帝国境内的民族独立运动、削弱奥斯曼在地中海东部的势力、保护联邦在地中海的航运利益。奥斯曼帝国的解体是联邦地缘战略的目标之一。"

  FCF_invest_in_desert_warfare:0 "投资沙漠战争"
  FCF_invest_in_desert_warfare_desc:0 "文本大意：支持埃及和伊朗，将奥斯曼帝国拉入战争的泥潭"

  FCF_indian_revolutionary_plan:0 "印度革命方案"
  FCF_indian_revolutionary_plan_desc:0 "印度的革命运动正在持续发展。印度革命方案意味着支持社会主义印度的事业、加强三国贸易圈中与印度的合作、帮助印度巩固其革命成果。印度的稳定与繁荣对联邦的经济安全至关重要。"

  FCF_chinese_gambling:0 "中国博弈"
  FCF_chinese_gambling_desc:0 "中国是亚洲的重要力量。中国博弈意味着联邦在中国事务中采取审慎而积极的态度——支持中国的进步力量、反对帝国主义在中国的控制、在贸易与政治之间寻找平衡。中国的发展将影响亚洲乃至世界的格局。"

  FCF_only_one_sun:0 "二日争辉"
  FCF_only_one_sun_desc:0 "文本大意：支持中国抗日"

  FCF_archipelagic_dreams:0 "群岛之梦"
  FCF_archipelagic_dreams_desc:0 "文本大意：支持印度尼西亚的独立运动"

  FCF_indochinese_revolution:0 "印支革命暗涌"
  FCF_indochinese_revolution_desc:0 "印度支那的革命运动正在酝酿。印支革命暗涌意味着联邦关注印度支那地区的动态、支持当地的独立运动、为未来的革命创造有利条件。印度支那的独立将改变东南亚的格局。"

  FCF_philippine_freedom_fighters:0 "菲律宾的自由人民"
