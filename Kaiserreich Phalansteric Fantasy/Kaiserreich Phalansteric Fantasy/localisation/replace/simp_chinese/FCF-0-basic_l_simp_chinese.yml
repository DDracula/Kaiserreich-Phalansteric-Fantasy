#动态修正
  FCF_economy_modifier:0 "联邦经济"
  FCF_economy_modifier_desc:0 "联邦经济在经历了重建与发展后大致呈现出了稳定增长的态势，虽然各地之间的差异很大，但就各公社的发展情况而言，还算是成功。即使我们不再使用资本主义的经济计算方式，但我们依然可以根据某些经济活动的数值来量化我们的经济状况。而描述经济模式则是一个困难的任务，我们所能做的就是尽可能找到各个现实经济活动中的共相并试图归纳到某一类经济模式中去。因此，我们的经济方向更大程度上还是靠具体的经济活动而不是抽象的模式描述。"
