  FCF_phalanstere:0 "法伦施泰尔成员国"
  FCF_phalanstere_desc:0 "[INT_internationale_industry_system][mio_phalanstere_industry_investment_loc]一个属于夏尔·傅里叶的旧日梦想，一个关于和谐社区的乌托邦——法伦施泰尔。在革命的烈火中，这个梦想被重新锻造。它不再是纸面上的空想，而是由法兰西公社牵头，旨在联合全世界所有社会主义同志的伟大事业。\n\n作为这个红色堡垒的一员，我们不再是孤军奋战。我们是这个反抗帝国主义与资本主义的全球阵线的一部分，是新世界秩序的奠基者。我们共享着最先进的技术，协调着我们的生产，我们的命运已与所有被压迫者紧密相连。法伦施泰尔属于全人类，它的荣光，亦是我们的荣光。"
  FCF_phalanstere_tt:0 "由于[?global.phalanstere_unity|Y.1%%]的$phalanstere_unity$：[INT_targeted_modifier_tt]"
