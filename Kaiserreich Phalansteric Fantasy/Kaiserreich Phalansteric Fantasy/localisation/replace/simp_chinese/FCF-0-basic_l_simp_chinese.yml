  FCF_la_revolution_est_comme_le_vent:0 "革命如风，席卷大地"
  FCF_la_revolution_est_comme_le_vent_desc:0 "文本大意：是时候主动出击了，革命从来都不是蜷曲在某处的自娱自乐，速度将成为战斗的主导因素，任何胆敢挑战的敌人都将拜倒在革命的战车之下"

