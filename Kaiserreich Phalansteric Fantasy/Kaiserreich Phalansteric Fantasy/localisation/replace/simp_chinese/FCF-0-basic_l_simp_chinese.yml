  FCF_revolutionary_support_committee:0 "革命支援委员会"
  FCF_revolutionary_support_committee_desc:0 "革命支援委员会是联邦支持各国革命运动的专门机构。委员会的职能包括：评估各国革命运动的前景、提供物资与技术支持、协调各国革命运动之间的合作。革命支援委员会的工作是联邦国际主义承诺的制度化体现。"

