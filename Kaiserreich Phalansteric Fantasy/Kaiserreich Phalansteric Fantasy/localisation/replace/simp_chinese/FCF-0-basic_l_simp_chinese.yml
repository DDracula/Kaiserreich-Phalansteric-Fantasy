#激进派系
  FCF_extreme_political_group:0 "过于激进的政治团体"
  FCF_extreme_political_group_desc:0 "革命并不是解决一切问题的良药，旧共和国的问题同样会在公社出现。“国王的报贩”等极右翼政治团体虽然在本土早已偃旗息鼓，但并不妨碍新的政治极端派系出现。他们大多对公社现有的政治不满，亦或是对于自己的处境感到愤懑，当然也存在单纯希望通过公社的灰色地带来谋取利益的。\n\n但总而言之，即使这些群体并没有在明面上威胁或反对公社的革命性质，但却实打实地影响到了公社人民的生活。甚至有足购影响力的派系已经开始了对基层政治的干预，对这种事态的坐视不管显然有违于人民政府的定义。当然，这些派系在一些人眼里看起来是眼中钉，但在另一部分人眼里，可能就是务实的盟友了。"
  FCF_extreme_political_group_tt:0 "目前活跃的极端派系：[vertes_information][commando_information][mafia_information][red_guard_information]\n§G打击这些极端派将有利于我们国家的稳定§!"
