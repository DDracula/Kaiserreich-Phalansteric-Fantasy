  phalanstere_ideology_1_tt:0 "§Y革命工人主义§!\n革命工人主义是法国工团主义与俄法两国具体革命实践的一种综合，其核心在于职业革命组织与革命工会之间亲密而平等的合作，兼收并蓄了马克思、佩卢蒂埃、德莱昂、索雷尔、列宁等人的理论。支持者认为，它完美地平衡了革命所需的组织性与自发性，法国革命的成功与俄国革命早期的活力，正是这一论断的最佳证明；与之相对，列宁逝世后布尔什维克的集权化措施则被认为是俄国革命最终失败的关键原因。正因如此，这一思想在国际革命社会主义运动中成为了绝对主流，其追随者通常将政党命名为“工人党”，或者更直接地，称为“工团党”。"
  phalanstere_ideology_2_tt:0 "§Y革命社会民主主义§!\n革命社会民主主义继承并发展了第二国际的正统马克思主义。它坚持政党活动高于一切，始终警惕工团主义思潮中的盲动倾向。该思想鼓励议会斗争，但最终目标仍是夺取政权，并不认为对资产阶级国家机器进行改良就能实现社会主义。持这一主张的政党通常具有深厚的马克思主义理论传统，以马克思、恩格斯、盖德、饶勒斯、普列汉诺夫等革命先辈为荣，也为考茨基这一关键传承者最终背叛革命而惋惜。至于列宁与布尔什维克，他们被视为背离正统的异端——尤其是解散立宪会议以及与孟什维克的决裂，至今仍被广泛认为是俄国革命失败的关键原因。"
  phalanstere_ideology_3_tt:0 "§Y激进改良主义§!\n激进改良主义，顾名思义，是一种政治承诺更为激进的改良主义社会主义——不过这种激进，更多只是顺应社会主义革命浪潮的无奈之举。它对夺取政权兴致缺缺，更关心通过点滴的社会改革提升劳苦大众的福祉，因此在切实受益的群众中赢得了相当热情的支持。它缺乏统一的理论核心，少数或许确实受到费边社或伯恩施坦的影响，但大部分支持者更多是出于对本国人民真实苦难的同情与朴素的博爱之心。近年来，受比利时工党理论家亨利·德·曼“计划主义”的影响，已有个别激进改良主义政党变得更具威权主义色彩。"
  phalanstere_ideology_4_tt:0 "§Y无政府工团主义§!\n无政府工团主义主要源自国际工团主义运动中坚决与任何形式的职业革命组织保持距离的那些派别，他们从蒲鲁东与巴枯宁等无政府主义先辈那里继承了对社会主义政党的一贯厌恶。随着工业化与工人运动的发展，无政府主义在实践中已经基本上与无政府工团主义密不可分，互为表里。同时由于革命工人主义的广泛流行，无政府工团主义仅在个别国家或地区才能取得相对主导性的影响力，例如西班牙的CNT-FAI和阿根廷的工团联盟"
  phalanstere_ideology_5_tt:0 "§Y国家工团主义§!\n国家工团主义可以追溯至美好年代晚期《社会主义运动》杂志社中盛行的“新学派”，也即索雷尔的沙龙团体。除却索雷尔本人外，其主要理论家还包括于贝尔·拉加代尔，爱德华·贝尔特以及奥古斯蒂诺·兰奇诺。早期的工团主义本身缺乏明确的系统性阐释，但它显然受到了伯恩斯坦理论，蒲鲁东的美德意识，柏格森主义以及勒庞集体心理学的影响。索雷尔同时也认同马克思主义的经济价值，但提出任何理论都必须服从于现实的经验与需求，而在经历了格雷森等人的阐释后，这种修正主义最终演变为了对政治斗争，尤其是政治动员的狂热推崇。不论索雷尔是否愿意，如今公社盛行的国家工团主义理想都被诠释为试图通过一场以民族为载体的无产阶级革命来清扫官僚，食利者，国际金融集团乃至于企业游说集团的寄生行径，从而建立足以捍卫人民整体利益的，战士专政的无产阶级国家。"
  phalanstere_ideology_6_tt:0 "§Y法西斯主义§!\n法西斯主义可以追溯到19世纪末西西里岛的农民法西斯运动，在意大利语中，这个古老的词汇意为“联合，联盟”。上一次大战期间，意大利议会中亦出现了以“国防法西斯”为名的建制派党团。在意大利内战爆发后，由于奥地利的武装干预，左翼干预主义者，革命工团主义者和温和的社会主义者发现彼此都站在了意大利爱国主义的共同战线上。在此后很长一段时间，法西斯主义都是意大利“第二次复兴运动”的狂热拥趸，他们的政治热情更多地聚焦于意大利的再统一之上。\n\n但随着于贝尔·拉加代尔等人的引介，公社内部也逐渐出现了带有法西斯色彩的政治思潮。公社的法西斯主义团体同样推崇“Faiseau”的名讳，但不同于他们的意大利同志，法国的法西斯主义活动家则将自己的矛头指向了低效的联邦体制和“绝对议会专制”。法西斯主义者是马丁案中起诉工会的坚定支持者之一，他们指责公社并未摆脱官僚主义和代议制的囚笼，并主张通过全民公投，强化行政权力，合并中央机构，提高政党组织门槛等方式重燃公社民众的政治热情，使公社真正地成为一个革命的普罗大众之国。法国的法西斯主义者坚信，唯有真正“公意”的担保下，法兰西民族才能拥有自己的领袖，革命也才能拥有正确的方向。"
  phalanstere_ideology_7_tt:0 "§Y革命先锋主义§!\n革命先锋主义源于列宁在《怎么办？》中阐述的组织原则，强调政治高压环境下职业革命组织的秘密性与集中性。列宁逝世、俄国革命失败后，围绕如何继承列宁遗产，季诺维也夫的妥协派与斯维尔德洛夫的强硬派产生严重分歧：前者倾向于修正理论以靠拢国际革命主流，同时与进行合法斗争的孟什维克和解；后者则坚决维护理论纯净性与组织独立性，实际却落入了反向的极端。最终强硬派胜出，彻底拒绝工团主义思潮与议会政治的侵蚀，走上纯粹武装起义道路，主张高度集中化的组织并敌视自发性活动。尽管目前在国际社会主义运动中仍属少数，但世界各地仍然广泛分布着其坚定追随者。"
  phalanstere_ideology_8_tt:0 "§Y左翼民族主义§!\n左翼民族主义的特色在于其独有的问题意识——其核心诉求是反对帝国主义与殖民主义，同时致力于将社会主义与本土传统相结合。这一思潮内部堪称包罗万象：既有常见的单一民族主义，也包含复兴主义、泛非主义等泛民族主义思潮；而在行动方式上，则从温和改良到暴力革命，不一而足。"

