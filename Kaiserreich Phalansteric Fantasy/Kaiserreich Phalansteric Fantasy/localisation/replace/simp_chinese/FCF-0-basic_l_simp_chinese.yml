  csp_ui_text:0 "§Y公共安全委员会（CSP）§!\n§Y$PCSP$§!\n[PCSP_leader_loc]\n\n§Y$CAE$§!\n[CAE_leader_loc]\n§Y$CE$§!\n[CE_leader_loc]\n§Y$CSI$§!\n[CSI_leader_loc]\n§Y$CC$§!\n[CC_leader_loc]\n§Y$CGFF$§!\n[CGFF_leader_loc]"

  gui_diplomacy_CAE:0 "外交委员（[CAE_attitude]）\n§Y[CAE_leader_loc]§!"
  gui_diplomacy_CAE_detail:0 "§g§!"

  gui_economy_CE:0 "经济委员（[CE_attitude]）\n§Y[CE_leader_loc]§!\n"
  gui_economy_CE_detail:0 "§g经济委员很大程度上代表了人民意志在经济事物上的态度，其所支持的经济改革政策我们很容易通过，但若是违背经济委员的意志，我们的改革就很有可能受挫。各个派系对于经济也拥有自己的影响力，虽然我们的经济改革政策能削弱其中的一些派系，但要是惹到了影响力大的派系，他们绝对不会善罢甘休。§!"

  gui_society_CSI:0 "国内安全委员（[CSI_attitude]）\n§Y[CSI_leader_loc]§!"
  gui_society_CSI_detail:0 "§g作为统筹公安、治安与政治保卫事务的最高职员，国内安全委员的权限覆盖全国，其既是共和国法律的执行者，也是政治忠诚的守门人。尽管此职位名义上接受公社的集体监督，实际上却因掌控庞大的公安网络而拥有近乎独立的影响力。倘若我们的政策能获得其支持，社会整顿与安全改革将推进无阻；但若其持异见，来自公安系统的迟滞与缄默便足以使我们陷入困境。在最坏的情形下，一纸密令足以令忠于公社的干部遭受监控，改革者反被贴上“破坏稳定”的标签——而我们对此却无能为力。§!"

  gui_society_CC:0 "文化委员（[CC_attitude]）\n§Y[CC_leader_loc]§!"
  gui_society_CC_detail:0 "§g文化委员是统筹意识形态、艺术审评与信息流向的最高枢纽，其不仅负责古老文明遗产的拣选与保护，更充当着社会认知疆界的严苛筑墙者。尽管该职位在法理上隶属于公社的行政体系，但由于其紧握出版、教育与大众传媒的“生杀大权”，实际上已演变为一种超越行政指令的软实力霸权：若其施予青睐，任何激进的政策都能被包装为顺应时代的天命；若其心生芥蒂，仅仅通过对敏感词的扩充与宣传阵地的静默，便足以让改革者的声音在社会共识中彻底蒸发，甚至使其在转瞬之间被定性为“精神层面的叛国者”而陷入万劫不复的境地。§!"

  gui_army_CGFF:0 "联邦军总参谋长（[CGFF_attitude]）\n§Y[CGFF_leader_loc]§!"
  gui_army_CGFF_detail:0 "§g即使在军队内部，对于公社政治也有不同的态度。鉴于联邦军总参谋长是作为一个职位而被选举出来的同时，其对于整个军队体系有着极强的影响力，我们也难以确保军队能单单作为一支保卫革命的力量而不参与到我们社会的其他角落。在最不幸的情况下，我们的军事改革计划甚至会被军队自己否决§!"

