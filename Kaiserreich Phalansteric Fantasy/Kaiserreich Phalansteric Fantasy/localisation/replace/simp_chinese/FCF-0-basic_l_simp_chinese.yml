  pop_total_text_tt:0 "[pop_total_text_loc]"
  pop_total_text:0 "社会平均满意度：[?pop_satisfaction|Y.1%%]\n社会阶层影响力：\n$class_pop_workers$：[?pop_workers|Y.1%%]\n$class_pop_peasants$：[?pop_peasants|Y.1%%]\n$class_pop_merchants$：[?pop_merchants|Y.1%%]\n$class_pop_scholars$：[?pop_scholars|Y.1%%]\n$class_pop_bureaucrats$：[?pop_bureaucrats|Y.1%%]\n$class_pop_army$：[?pop_army|Y.1%%]$tooltip_dividing_line$\n由于[?pop_satisfaction|Y.1%%]的社会平均满意度\n- $MODIFIER_STABILITY_FACTOR$：[?t1_show|.2%+=]"
  pop_total_text_delayed:0 "§g各个阶层的影响力与对派系的支持度会影响对应派系的政治实力，同时对应阶层的影响力和满意度也会导致相关的经济改革、军事改革的数值变化。而国策、事件或决议有可能导致一个阶层的影响力与满意度影响新的事物。当某一个阶层的影响力大于35%，他们的满意度还将影响一个效果。当某一个阶层的影响力大于10%且满意度低于30%，就意味着一个有足购势力的阶层被惹怒了，这将带来可怖的后果§!"

  pop_worker_ui_text_tt:0 "[pop_worker_ui_text_loc]"
  pop_worker_ui_text:0 "$class_pop_workers$：[?pop_workers|Y.1%%]\n满意度：[?pop_satisfaction_workers|Y.1%%]\n每月变化：[?modifier@monthly_change_popsw|+=.1%%]\n\n[?popswfade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopswc|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popsw|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_workers|Y.1%%]影响力的[?pop_satisfaction_workers|Y.1%%]满意度\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$：[?w1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：[?w2_show|.2%+=][FCF_pop_modifier_w]$pop_workers_impact_extra$"
  popw_text:0 "§g£pop_worker_texticon §O工人§!是公社体制下最大的收益群体，并且展现出对政治的浓厚兴趣，虽然大多数£pop_worker_texticon §O工人§!都会拥护§Y总工会§!的统治，但也有一部分工人，特别是在其他派系执政地区的工人，则会表现出明显的地域主义倾向。不过，在§Y“诉CGT案”§!后，£pop_worker_texticon §O工人§!群体也产生了一部分分化，尤其是不是§Y总工会§!成员的£pop_worker_texticon §O工人§!，开始转向其他的解决方案§!"

  pop_peasant_ui_text_tt:0 "[pop_peasant_ui_text_loc]"
  pop_peasant_ui_text:0 "$class_pop_peasants$：[?pop_peasants|Y.1%%]\n满意度：[?pop_satisfaction_peasants|Y.1%%]\n每月变化：[?modifier@monthly_change_popsp|+=.1%%]\n\n[?popspfade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopspc|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popsp|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_peasants|Y.1%%]影响力的[?pop_satisfaction_peasants|Y.1%%]满意度\n- $MODIFIER_LOCAL_RESOURCES_FACTOR$：[?p1_show|.2%+=]\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$：[?p2_show|.0%+=]$pop_peasants_impact_extra$[FCF_pop_modifier_p]"
  popp_text:0 "§g很多£pop_peasant_texticon §7农民§!对当前的公社政权并没有太多的好感，由于十分明显的对于£pop_worker_texticon §O工人§!的偏袒，£pop_peasant_texticon §7农民§!在革命中并没有得到太多的“解放”。加上法国农村基督教势力的根生蒂固，这使得部分£pop_peasant_texticon §7农民§!群体有着很浓的宗教情结与对威权的崇拜。尽管法兰西是一个工业大国，£pop_peasant_texticon §7农民§!仍占据着人口的多数地位，广阔土地上的乡村厌倦了巴黎的蔑视，这使得大多数的£pop_peasant_texticon §7农民§!都选择支持£faction_oppo_texticon §R工农派§!§!"

  pop_merchant_ui_text_tt:0 "[pop_merchant_ui_text_loc]"
  pop_merchant_ui_text:0 "$class_pop_merchants$：[?pop_merchants|Y.1%%]\n满意度：[?pop_satisfaction_merchants|Y.1%%]\n每月变化：[?modifier@monthly_change_popsm|+=.1%%]\n\n[?popsmfade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopsmc|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popsm|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_merchants|Y.1%%]影响力的[?pop_satisfaction_merchants|Y.1%%]满意度\n- $modifier_production_speed_industrial_complex_factor$：[?m1_show|.2%+=]\n- $modifier_production_speed_infrastructure_factor$：[?m2_show|.2%+=][FCF_pop_modifier_m]"
  popm_text:0 "§g在一些人眼里，£pop_merchant_texticon §m小资产阶级§!是需要被“清除”的存在，不过事实是，革命前一些进步的£pop_merchant_texticon §m小资产阶级§!与革命后一部分富足的£pop_worker_texticon §O工人§!共同组成了这个公社中略微显得不那么“正确”的群体。这一群体的范围是很广泛的，从某个工厂的管理者到只不过是农村集市上的小商贩都被划入到了£pop_merchant_texticon §m小资产阶级§!。因此，这个群体的内部差异很大，不过总的来说，他们当然会更加支持能让他们生活过的更好的派系§!"

  pop_scholar_ui_text_tt:0 "[pop_scholar_ui_text_loc]"
  pop_scholar_ui_text:0 "$class_pop_scholars$：[?pop_scholars|Y.1%%]\n满意度：[?pop_satisfaction_scholars|Y.1%%]\n每月变化：[?modifier@monthly_change_popss|+=.1%%]\n\n[?popssfade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopssc|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popss|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_scholars|Y.1%%]影响力的[?pop_satisfaction_scholars|Y.1%%]满意度\n- $MODIFIER_RESEARCH_SPEED_FACTOR$：[?s1_show|.2%+=]\n- $MODIFIER_COMPLIANCE_GAIN_ADD$：[?s2_show|.2%+=][FCF_pop_modifier_s]"
  pops_text:0 "§g法兰西的£pop_scholar_texticon §0知识分子§!一直是世界思想界的瑰宝，在革命后更是如此。推翻反动的大资产阶级的统治后，我们的£pop_scholar_texticon §0知识分子§!终于可以直抒胸臆了，虽然在某些情况会不符合我们的意愿。£pop_scholar_texticon §0知识分子§!由教授、学生与文艺工作者组成，他们是我们国家的未来，很大程度上引领着我们国家的方向。他们对于政治有一套自己的看法，但总归是希望变革的。沉闷的旧空气注定会让£pop_scholar_texticon §0知识分子§!用纸和笔进行反叛§!"

  pop_bureaucrat_ui_text_tt:0 "[pop_bureaucrat_ui_text_loc]"
  pop_bureaucrat_ui_text:0 "$class_pop_bureaucrats$：[?pop_bureaucrats|Y.1%%]\n满意度：[?pop_satisfaction_bureaucrats|Y.1%%]\n每月变化：[?modifier@monthly_change_popsb|+=.1%%]\n\n[?popsbfade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopsbc|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popsb|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_bureaucrats|Y.1%%]影响力的[?pop_satisfaction_bureaucrats|Y.1%%]满意度\n- $MODIFIER_POLITICAL_POWER_FACTOR$：[?b1_show|.0%+=]\n- $economy_power_factor$：[?b2_show|.0%+=][FCF_pop_modifier_b]$pop_bureaucrats_impact_extra$"
  popb_text:0 "§g£pop_bureaucrat_texticon §3官僚§!是维护整个国家正常运行的中流砥柱，如果没有他们，我们几乎就不可能进行任何变革。不过，£pop_bureaucrat_texticon §3官僚§!体系的固有弊病即使在我们的革命下也无法撼动太多。腐败、权钱交易以及那些资产阶级国家会出现的种种，我们的£pop_bureaucrat_texticon §3官僚§!也大抵无法避免。£pop_bureaucrat_texticon §3官僚§!虽然只是我们最高意志的执行者，但他们归根结底依旧是人，他们同样有自己的思想，处于不同位置的人或许会想着不同的事情，但是对于£pop_bureaucrat_texticon §3官僚§!来说，有一件事基本是共识的：扩大£pop_bureaucrat_texticon §3官僚§!们的权力§!"

  pop_army_ui_text_tt:0 "[pop_army_ui_text_loc]"
  pop_army_ui_text:0 "$class_pop_army$：[?pop_army|Y.1%%]\n满意度：[?pop_satisfaction_army|Y.1%%]\n每月变化：[?modifier@monthly_change_popsa|+=.1%%]\n\n[?popsafade|+=.1%%] 源于自然衰退\n[?popsfdis|+=.1%%] 源于[CSI_attitude]的§Y$CSI$§!\n[?popsfev|.1%%+=] 源于$economy_values$：[?economy_values|.1+=]\n[?popsfeq|.1%%+=] 源于$economy_equal$：[?economy_equal|.1Y]\n[?billpopsac|+=.1%%] 源于顾问、社会法案或民族精神\n[?state_strategy_monthly_change_popsa|+=.1%%] 源于地方政策$tooltip_dividing_line$\n由于[?pop_army|Y.1%%]影响力的[?pop_satisfaction_army|Y.1%%]满意度\n由于[?pop_army_officers|Y.1%%]的$class_pop_officers$\n- $MODIFIER_MAX_PLANNING$：[?ao1_show|.1%+=]\n由于[?pop_army_ncos|Y.1%%]的$class_pop_ncos$\n- $MODIFIER_ARMY_ORG_FACTOR$：[?an1_show|.1%+=]\n由于[?pop_army_soldiers|Y.1%%]的$class_pop_soldiers$\n- $MODIFIER_ORG_LOSS_WHEN_MOVING$：[?as1_show|.1%-=][FCF_pop_modifier_a]"
  popa_text:0 "§g£pop_army_texticon §N军队§!是一个体系化的地方，虽然军人以服从命令为天职，但若不是当年我们反对了资产阶级的命令，我们又怎么能建立起一个革命政权呢？£pop_army_texticon §N军队§!内部同样有着£pop_officer_texticon §P军官§!、£pop_nco_texticon §z士官§!和£pop_soldier_texticon §a士兵§!的阶级划分，甚至比起外面的社会更加严酷，但整个£pop_army_texticon §N军队§!还是坚信公社是值得他们每一个人抛头颅洒热血的地方，除非他们不得已要挽救自己的祖国§!"
#动态修正
  FCF_pop_modifier:0 "社会状况"
  FCF_pop_modifier_desc:0 "公社受到来自社会各界人士的影响，但最根本的动力来自于普罗大众的诉求。不同阶层的存在使得我们的政治、经济、军事和社会各方面都在发生变化。尽管能让所有人满意是理想状态，但在现实的政治中，往往得在各方之间做出取舍。我们始终面临着那个无法逃离的终极之问：是否应该为了一部分的人的利益而牺牲另一部分人的利益？这个难题贯穿于所有决策之中，即使我们装作视而不见，它也最终会以现实的名号打到我们的脸上。"
  FCF_pop_modifier_tt:0 "根据[?pop_satisfaction|Y.1%%]的社会平均满意度\n- $MODIFIER_STABILITY_FACTOR$：[?t1_show|.2%+=]\n\n根据[?pop_workers|Y.1%%]影响力的$class_pop_workers$的[?pop_satisfaction_workers|Y.1%%]满意度\n- $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$：[?w1_show|.2%+=]\n- $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$：[?w2_show|.2%+=][FCF_pop_modifier_w]$pop_workers_impact_extra$\n\n根据[?pop_peasants|Y.1%%]影响力的$class_pop_peasants$的[?pop_satisfaction_peasants|Y.1%%]满意度\n- $MODIFIER_LOCAL_RESOURCES_FACTOR$：[?p1_show|.2%+=]\n- $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$：[?p2_show|.0%+=]$pop_peasants_impact_extra$[FCF_pop_modifier_p]\n\n根据[?pop_merchants|Y.1%%]影响力的$class_pop_merchants$的[?pop_satisfaction_merchants|Y.1%%]满意度\n- $modifier_production_speed_industrial_complex_factor$：[?m1_show|.2%+=]\n- $modifier_production_speed_infrastructure_factor$：[?m2_show|.2%+=][FCF_pop_modifier_m]\n\n根据[?pop_scholars|Y.1%%]影响力的$class_pop_scholars$的[?pop_satisfaction_scholars|Y.1%%]满意度\n- $MODIFIER_RESEARCH_SPEED_FACTOR$：[?s1_show|.2%+=]\n- $MODIFIER_COMPLIANCE_GAIN_ADD$：[?s2_show|.2%+=][FCF_pop_modifier_s]\n\n根据[?pop_bureaucrats|Y.1%%]影响力的$class_pop_bureaucrats$的[?pop_satisfaction_bureaucrats|Y.1%%]满意度\n- $MODIFIER_POLITICAL_POWER_FACTOR$：[?b1_show|.0%+=]\n- $economy_power_factor$：[?b2_show|.0%+=][FCF_pop_modifier_b]$pop_bureaucrats_impact_extra$\n\n根据[?pop_army|Y.1%%]影响力的$class_pop_army$的[?pop_satisfaction_army|Y.1%%]满意度\n由于[?pop_army_officers|Y.1%%]的$class_pop_officers$\n- $MODIFIER_MAX_PLANNING$：[?ao1_show|.1%+=]$pop_army_officers_impact_extra$\n由于[?pop_army_ncos|Y.1%%]的$class_pop_ncos$\n- $MODIFIER_ARMY_ORG_FACTOR$：[?an1_show|.1%+=]$pop_army_ncos_impact_extra$\n由于[?pop_army_soldiers|Y.1%%]的$class_pop_soldiers$\n- $MODIFIER_ORG_LOSS_WHEN_MOVING$：[?as1_show|.1%-=]$pop_army_soldiers_impact_extra$[FCF_pop_modifier_a]\n\n最终我们将获得："

  FCF_pop_modifier_w_t:0 "\n由于$class_pop_workers$的影响力大于30%\n- $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$：[?w3_show|.2%+=]"
