  FCF_weak_central_government:0 "孱弱的中央职权"
  FCF_weak_central_government_desc:0 "在革命前，地方公社联合体的设想通常被认为最有可能的革命范式。而在革命后，或许是出于对理想诺言的兑现，又或者是单纯没有能力统合整个国家，地方分权被确立了：中央政府很难对地方的决策做出反制，而地方却可以靠着地方代表在中央展现影响力。虽然地方也在施行相互制衡的议会与委员会双轨制，但这种制衡只存在于理论上，地方的政治地头蛇几乎垄断了地方立法与行政的权力。虽然中央政府的公共安全委员会在理论上可以对地方的委员会发号施令，但在层层的不配合与明里暗里地抵制后，落到地方上就几乎是“不存在”来自中央的命令。\n\n虽然有不少无政府主义者或地方主义者支持这种模式，但就国家的角度而言，这对于跨地区的资源调配是一个大问题。地方之间的差异自旧共和国时期就存在，如果丧失了中央政府这个可以跨区域调配资源的手段，那么法兰西的地区发展差异将更加不平衡与畸形。无论哪个主义，只要其还坚持着社会主义的意识形态，就不应该坐视这种情况的发展。"

  FCF_CGT_special_statues:0 "总工会的特殊地位"
  FCF_CGT_special_statues_desc:0 "总工会（Confédération Générale du Travail）在革命前就是法兰西最大的工会组织，并成为了革命的主心骨。革命胜利后，它也理所当然地成为了参与立法事务的最大组织。凭借强大的组织能力与政治影响力，总工会为自身争取到了诸多法律上的庇护。尽管公社宣称对所有工会一视同仁，但在“平等”的法律条文背后，却总有“某些工会更平等”的情况存在。\n\n总工会不仅是强大的经济指导组织，更是强而有力的政治团体。由于公社中央政府权力受限，总工会反而凭借其在地方的广泛影响力，逐渐演变为一个“影子政府”。"

  FCF_CGT_contested:0 "受争议的总工会"
  FCF_CGT_contested_desc:0 "总工会（Confédération Générale du Travail）在革命前就是法兰西最大的工会组织，在革命到来时，总工会更是担任了革命中枢的位置。在革命后，总工会不再局限于一个劳工工会组织，而是直接参与到经济决策与政治事物中——这本来是符合工团主义的诉求的——直到1934年的“诉CGT案”爆发，团结政策再也不能堵住那些因为总工会的垄断而遭到利益侵害的人们的嘴。对于总工会在革命后地位的争论再一次被大规模提及，无论总工会的未来是什么，它都不可能维持现在这副面貌了。"
  FCF_CGT_contested_tt:0 "§R我们需要在问题激化之前慎重处理总工会问题§!"
  
##########
###国策###
##########
  commune_of_france_focus:0 "法兰西公社联邦国策树"
#经济
  FCF_focus_on_northern_industry:0 "注重北部工业"
  FCF_focus_on_northern_industry_desc:0 "北法兰西的煤烟从未消散。从加来到里尔，从瓦朗谢讷到莫伯日，这片土地上的矿井、高炉和纺织车间构成了联邦工业的骨架。然而，设备老化、运输瓶颈和能源短缺正在侵蚀这份遗产。我们需要将投资引向北部，让北法兰西成为全欧洲最重要的工业重镇。"

  FCF_city_of_shining_universally:0 "普照之城"
  FCF_city_of_shining_universally_desc:0 "巴黎不仅是联邦的政治心脏，更是社会主义思想的灯塔。但巴黎的影响力不应囿于城墙之内——巴黎的光辉应当普照联邦的每一个角落。"
  
  FCF_invest_in_rhone_valley:0 "投资罗讷河谷"
  FCF_invest_in_rhone_valley_desc:0 "罗讷河谷是联邦的另一条工业命脉。里昂的军工厂远离北部边境，在战时具有无可替代的战略价值。我们需要在这里建设新的工厂、新的铁路、新的电厂，让罗讷河谷的工业实力将直接转化为联邦的军事能力。" 

  FCF_continue_miracle_of_bordeaux:0 "延续波尔多奇迹"
  FCF_continue_miracle_of_bordeaux_desc:0 "波尔多的奇迹是革命以来最耀眼的经济成就。这座港口城市在失去殖民地贸易后没有衰落，而是依托葡萄酒、造船和新兴的工业完成了转型。我们应当将波尔多的经验整理成可复制的方案，推广到其他面临转型困境的地区。"

  FCF_leading_port_in_the_mediterranean:0 "地中海第一港"
  FCF_leading_port_in_the_mediterranean_desc:0 "马赛是联邦通往地中海的咽喉。来自东方的资源都必须经过马赛港。马赛的吞吐能力决定了我们能够接收多少。扩建马赛的集装箱码头、升级仓储设施、建立修船工业基地——让马赛成为地中海最繁忙、最高效的港口。"

  FCF_revival_of_brittany:0 "复兴布列塔尼"
  FCF_revival_of_brittany_desc:0 "布列塔尼的大西洋海岸线漫长而荒凉，渔业传统深厚但工业几乎空白。这里的青年要么离开，要么在渔船上度过一生。我们需要改变这一切——在布雷斯特建设新的港口设施、在雷恩建立食品加工技术中心、在洛里昂发展海洋相关产业。复兴布列塔尼不仅是为了经济，更是为了兑现联邦对每一个地区的承诺：革命的果实属于所有人。"

  FCF_land_without_night:0 "无夜之国"
  FCF_land_without_night_desc:0 "当太阳落山，法兰西不应陷入黑暗。电力的普及是工业化程度的标志，也是工人生活质量的保障。我们需要建设新的水电站、推广风电技术、扩建输电网，使每一座工厂、每一个村庄都能在夜间获得充足的电力。无夜之国——这不仅是技术目标，更是对劳动者时间的尊重：生产应当由人的意志主导，而非受制于自然的节奏。"

  FCF_federal_railway:0 "联邦铁路"
  FCF_federal_railway_desc:0 "铁路是联邦的动脉。巴黎到里昂的干线需要电气化，通往东部边境的支线需要加固，连接北部工业区和罗讷河谷的新线路需要铺设。我们应当建立统一的调度系统、统一轨距标准、统一信号制式。联邦铁路不仅是运输工具，更是战时动员的关键——每一公里的铁轨都在为联邦的安全服务。"

  FCF_block_model:0 "区块模式"
  FCF_block_model_desc:0 "法兰西不是一个单一的经济体，而是一组各具禀赋的区域。北部的煤铁、罗讷河谷的水电、西南的农业和葡萄酒、布列塔尼的渔业——每个区块都有其独特的比较优势。政策不应一刀切，而应当因地制宜。由各区委员会与产业联合会共同制定本区块的发展规划，让决策尽可能贴近实际情况。"

  FCF_complementary_economy:0 "互补经济"
  FCF_complementary_economy_desc:0 "文本大意：各区块之间的产业相互扶持"

  FCF_economic_reform_issues:0 "经济改革问题"
  FCF_economic_reform_issues_desc:0 "革命后的经济体制是在战火和动荡中仓促建立的，许多安排依靠的是非正式惯例和即兴协商。十多年过去了，这套体制的效率与公平都已经积累了足够的问题——各工会的协调成本过高、地方财政的税基过窄、法郎的贬值侵蚀着工人的储蓄。改革不是否定过去，而是从过去的经验中学习。"
  
  FCF_federal_leadership:0 "联邦主导"
  FCF_federal_leadership_desc:0 "有些经济事务只能由联邦层面来统筹。关税政策、贸易的谈判、跨区域基础设施的投资分配、战略性新兴产业的培育——这些涉及联邦的整体利益，任何单个区都不具备独立决策的资格和资源。联邦主导不是否定地方自治，而是在联邦主义框架内保持必要的统一协调能力。"

  FCF_local_leadership:0 "地方主导"
  FCF_local_leadership_desc:0 "经济决策应当在尽可能低的层级做出。各区委员会和基层委员会更了解本地的资源禀赋、产业状况和居民需求，由它们主导本地经济发展、公共服务和土地使用规划是合理的。地方主导意味着政策更加灵活、更加多样——各公社可以走不同的发展道路，这正是联邦主义的优势所在。"

  FCF_standardized_management:0 "规范化管理"
  FCF_standardized_management_desc:0 "产业联合会协调机制长期依赖个人关系和不成文的惯例，这在效率足够高时或许可行，但现在已经到了瓶颈期。我们需要建立统一的统计标准、透明的交换比例调整程序、公开的联合会决策记录。规范化不是官僚化——它使协调机制更加可靠、更可预期，从而减少摩擦、提高效率。"

  FCF_democratic_progress:0 "民主带来进步"
  FCF_democratic_progress_desc:0 "民主机制不是装饰，而是经济效率的保障。工人参与生产计划的制定，他们就会更有动力去执行这些计划；各区代表参与联邦决策，政策就会更贴合实际。民主不是效率的敌人，恰恰相反，没有民主的参与，任何计划都只是纸上谈兵。"

  FCF_integrate_small_industry:0 "整合小工业"
  FCF_integrate_small_industry_desc:0 "法兰西的工业版图上存在着大量小作坊和家庭工场。它们游离于工会体系之外，既享受不到工会的原材料配额和技术情报，也不受行业协调的约束。整合这些小工业意味着为它们提供加入联邦经济的通道——提供技术援助、开放市场信息。整合不是吞并，而是让每一份生产能力都找到自己的位置。"

  FCF_new_production_plan:0 "新生产计划"
  FCF_new_production_plan_desc:0 "年度生产计划是产业联合会协调工作的核心，但现有的编制方式已经跟不上经济环境的变化速度。我们需要在保持年度框架的同时，引入季度调整和应急修订机制。新生产计划应当基于实时生产数据，而非滞后的统计报告。各产业联合会在总的计划框架内应当拥有弹性调整的空间。"

  FCF_from_where:0 "从哪来"
  FCF_from_where_desc:0 "联邦的经济资源不是凭空产生的。它们来自工人的劳动、来自产业联合会的协调效率、来自各区与联邦的税收、来自贸易的互通有无。回答“从哪来”不仅是一个核算问题，更是一个政治合法性问题。我们越清楚地说明财富的来源，就越能在分配资源时获得工人的理解和支持。"

  FCF_red_economic_circle:0 "红色经济圈"
  FCF_red_economic_circle_desc:0 "红色贸易圈是一个独立于资本主义世界市场的经济网络。在这个网络中，我们不依赖金本位，不向美国或德国举债，尽可能使用劳动券和国际结算券进行贸易。红色经济圈的边界不是在筑墙，而是在关键领域建立自主可控的能力。圈内的协作越紧密，圈外的威胁就越无力。"

  FCF_invest_in_worker_enterprises:0 "投资工人企业"
  FCF_invest_in_worker_enterprises_desc:0 "文本大意：投资资本主义国家的工人企业，和他们做交易"

  FCF_pragmatic_foreign_trade:0 "务实外贸"
  FCF_pragmatic_foreign_trade_desc:0 "意识形态不能成为贸易的障碍。联邦需要出口工业品换取必需的原材料和设备，只要不损害我们的核心利益，与资本主义国家的贸易往来是可以接受的。务实外贸意味着保持原则的同时充分利用国际市场的机会。我们不做任何一方的附庸，也不拒绝任何一方的合作。"

  FCF_contact_progress_capital:0 "接触进步资本"
  FCF_contact_progress_capital_desc:0 "并非所有资本都是反动的。某些资本主义企业——尤其是那些面临工人运动压力、愿意进行技术合作或提供就业机会的企业——可以被视为进步资本。联邦的产业联合会可以在严格监管的前提下与这类资本进行有限度的合作。但这种合作必须遵守明确的规则，以防止外部资本通过经济合作获取对我们经济决策的控制权。"

  FCF_barter_system:0 "以物易物"
  FCF_barter_system_desc:0 "法郎的持续贬值使以物易物成为一种务实的选择。联邦与社会主义印度之间的大宗贸易已经采用这种方式——我们的农机和化肥换回印度的黄麻与棉花。以物易物能够规避汇率风险、减少对法郎的依赖。我们需要建立统一的商品估值标准和结算机制，确保以物易物的公平和效率。"

  FCF_where_to_go:0 "到哪去"
  FCF_where_to_go_desc:0 "经济活动的最终目的不是生产本身，而是满足人的需求。我们的经济成果应当流向工人的口袋、流向工厂的更新改造、流向公共服务的改善、流向国防的巩固。回答“到哪去”是预算分配的核心问题。联邦的财富不能被少数人垄断，也不能被官僚机构吞噬，它应当惠及每一个劳动者。"

  FCF_peoples_needs:0 "民生所需"
  FCF_peoples_needs_desc:0 "面包、住房、教育、医疗——这些不是经济活动的副产品，而是经济活动的目的。联邦的经济计划应当以民生需求为出发点，而非以抽象的产量指标为归宿。任何偏离这一目标的经济政策，无论其技术多么精妙，最终都会被证明是失败的。"

  FCF_prosperous_life_for_citizens:0 "优渥公民生活"
  FCF_prosperous_life_for_citizens_desc:0 "联邦的公民应当享有优渥的生活。这是对劳动者创造财富的合理回报，不是施舍。优渥的生活意味着足够的营养、舒适的住房、优质的教育、可靠的医疗保障和有尊严的养老。我们的经济政策应当致力于缩小地区之间、行业之间、城乡之间的生活水平差距。"

  FCF_people_centered_economy:0 "民生主导型经济"
  FCF_people_centered_economy_desc:0 "联邦的经济应当以民生为导向。投资决策、生产计划、贸易政策的制定，都应当首先考虑其对普通公民生活的影响。民生主导不是反对工业化和技术进步，而是确保工业化的成果惠及所有人。一个以民生为导向的经济，才是可持续的、有韧性的经济。"

  FCF_future_needs:0 "未来所需"
  FCF_future_needs_desc:0 "今天的决策必须为明天负责。人口结构的变化、技术的进步、资源的消耗、国际格局的演变——这些长期趋势需要在我们当下的政策中得到充分的考量。为未来所需而投资，意味着在教育、科研、基础设施和环境保护等领域保持持续的投入。我们今天的选择，决定了明天的可能。"

  FCF_basic_human_security:0 "基础人类保障"
  FCF_basic_human_security_desc:0 "每一个联邦公民都有权享有基础人类保障：食物、住所、医疗、教育、工作。这不是慈善，而是权利。基础人类保障由公社委员会和产业联合会共同负责——前者提供地域性的公共服务，后者提供与工作相关的社会保障。这两套系统的衔接是联邦社会政策的核心课题。"

  FCF_military_industrial_complex:0 "军工带动民生"
  FCF_military_industrial_complex_desc:0 "军工产业不仅是国防的需要，也可以成为民生经济的引擎。军工技术的民用转化、军工工厂的冗余产能用于民用生产、军工研发带动材料科学与工程技术的进步——这些都是军工带动民生的具体路径。我们不应将军工与民生对立起来，而应当探索两者的协同发展。"

  FCF_technology_driven_economy:0 "科技主导型经济"
  FCF_technology_driven_economy_desc:0 "联邦的未来取决于科技。化工、冶金、机械、航空、无线电——这些领域的突破将决定我们的经济竞争力。科技主导型经济意味着增加研发投入、加强技术教育、促进产业联合会与科研机构的合作。我们不能只满足于追赶，我们必须在某些领域争取领先。"

  FCF_crisis_needs:0 "危机所需"
  FCF_crisis_needs_desc:0 "联邦必须为危机做好准备。战争、自然灾害、经济封锁——这些危机可能在任何时候到来。危机所需的准备包括：战略物资储备、关键工业产能的冗余设计、紧急状态下的生产转换机制。平时的经济规划必须考虑危机时的应对能力。"

  FCF_military_civilian_facilities:0 "军民两用工厂"
  FCF_military_civilian_facilities_desc:0 "工厂不应只生产民用产品或只生产军用产品。军民两用工厂能够在和平时期生产满足民生需求的商品，在战时迅速转换为军工生产。这种弹性设计是联邦国防经济的重要原则。投资军民两用工厂意味着在和平时期就为战争做好准备。"

  FCF_military_driven_economy:0 "军事主导型经济"
  FCF_military_driven_economy_desc:0 "在面临外部威胁时，联邦可能需要转向军事主导型经济。这意味着资源优先配置给国防工业、生产计划以军事需求为导向、劳动力向军工部门集中。军事主导型经济不是常态，但在危机时刻是必要的选择。联邦需要具备在和平经济与战时经济之间快速切换的能力。"

  FCF_new_and_old:0 "新与旧"
  FCF_new_and_old_desc:0 "文本大意：都会与市镇的矛盾"

  FCF_urban_leadership:0 "都会导向"
  FCF_urban_leadership_desc:0 "大都会是经济活动的中心。巴黎、里昂、马赛、波尔多——这些城市集中了联邦最先进的生产能力、最密集的人才资源和最完善的基础设施。优先投资大都会的工业与基础设施可以充分发挥规模效应与集聚效应。大都会的繁荣应当通过辐射效应带动周边地区的发展。"

  FCF_rural_leadership:0 "市镇导向"
  FCF_rural_leadership_desc:0 "法兰西拥有数千个基层公社，它们是小规模生产与地方服务的承载者。市镇导向意味着支持小工厂、小作坊、地方合作社的发展，保障市镇的公共服务能力，防止人口与资源过度向大城市集中。市镇的活力是联邦社会稳定的基础。"

  FCF_plan_of_ideal_city:0 "理想城计划"
  FCF_plan_of_ideal_city_desc:0 "每一座城市都应当是有尊严的居住地。理想城计划致力于为所有城市居民提供足够的绿地、便捷的公共交通、优质的学校与医院、文化设施与体育场馆。这不是乌托邦，而是通过系统的规划与投资可以逐步实现的目标。理想城计划由区委员会主导，产业联合会与公社委员会共同参与。"

  FCF_plan_of_new_frontiers:0 "新边疆计划"
  FCF_plan_of_new_frontiers_desc:0 "联邦的领土缩小了，但发展的空间仍然广阔。新边疆计划旨在开发那些被忽视的地区——中央高原的林业与畜牧业、阿尔卑斯山区的旅游业与水电资源、大西洋沿岸的渔业与海洋产业。新边疆不是地理的扩张，而是经济潜力的释放。"

  FCF_support_industral_commune:0 "支持工业市镇"
  FCF_support_industral_commune_desc:0 "工业市镇往往依赖单一产业，经济结构脆弱。当某个行业陷入衰退时，这些市镇首当其冲。支持工业市镇意味着提供转型援助、多元化投资、就业培训与基础设施改善。这些市镇不应被抛弃，它们应当获得渡过难关的支持。"

  FCF_focus_on_specialized_industries:0 "专注特色产业"
  FCF_focus_on_specialized_industries_desc:0 "每个地区都有其特色产业。波尔多的葡萄酒、里昂的丝绸、格勒诺布尔的机械、布列塔尼的渔业——这些特色产业是地方经济的支柱。政策应当支持各地区专注其特色产业，提供技术升级、市场开拓与品牌建设的支持，而不是强迫各地区追求同质化的产业结构。"

  FCF_complete_development:0 "全面发展"
  FCF_complete_development_desc:0 "全面发展不是要求每个地区都拥有所有产业，而是要求每个地区都能获得与其资源禀赋相适应的发展机会。全面发展意味着消除极端贫困、保障基本公共服务、缩小地区间的发展差距。每一个公社、每一个区都应当感受到进步的成果。"

  FCF_optimize_agricultural_structure:0 "优化农业结构"
  FCF_optimize_agricultural_structure_desc:0 "农业是联邦经济的基础，但小农经济的脆弱性日益显现。优化农业结构意味着推动农业合作化、提供农业技术推广服务、改善农村基础设施。优化的目标不是消灭小农，而是提升农业的生产效率与农民的生活水平。"

  FCF_agrarian_industrialization:0 "农业工业化"
  FCF_agrarian_industrialization_desc:0 "农业不应当停留在传统的手工劳动阶段。农业工业化意味着推广农机、化肥与良种，发展农产品加工业，建立农业与工业之间的稳定交换关系。农业工业化不是要消灭农村的生活方式，而是要提高农业劳动生产率，释放农村劳动力用于工业生产。"

  FCF_strengthen_commodity_economy:0 "强化商品化"
  FCF_strengthen_commodity_economy_desc:0 "农民不应仅仅生产自给自足的农产品，而应当参与市场经济。强化商品化意味着改善农村与城市之间的流通渠道、建立稳定的农产品收购价格、提供市场信息服务。商品化的农业能够为城市提供充足的食品供应，也能够为农民提供稳定的现金收入。"

  FCF_visionary_urban_planning:0 "有远见的城市规划"
  FCF_visionary_urban_planning_desc:0 "城市规划不应只考虑当下的需求。有远见的城市规划意味着合理布局工业区与居住区、预留交通走廊与绿地、考虑人口增长与产业变迁的趋势。规划的权力在区委员会，但规划的标准与原则应当在联邦层面进行协调。"

  FCF_cgt_issues:0 "总工会问题"
  FCF_cgt_issues_desc:0 "全国总工会是联邦经济体制的核心——它掌握着行业协调、原料配额与技术情报分配的关键权力。但权力与责任之间的张力正在显现。联合会的决策是否真正反映了基层工厂的意愿？联合会的干部是否还保持着与普通工人的联系？总工会的问题是，如何在保持协调效率的同时防止权力的集中与异化。"

  FCF_reform_cgt:0 "改革总工会"
  FCF_reform_cgt_desc:0 "改革不是要削弱总工会，而是使其更有效率、更负责任。改革的方向包括：增加基层工厂委员会在联合会决策中的参与、提高联合会决策的透明度、建立联合会干部的定期轮换与考核制度。改革是一个持续的过程，而非一劳永逸的任务。"

  FCF_self_supervised_syndicats:0 "自监督的工会"
  FCF_self_supervised_syndicats_desc:0 "外部的稽核是必要的，但还不够。总工会需要建立内部的自我监督机制——在联合会内部设立独立的监察委员会、建立会员申诉渠道、定期进行自我评估与公开报告。自监督是对工会自治原则的深化，而不是否定。"

  FCF_professional_governance:0 "走向专业治理"
  FCF_professional_governance_desc:0 "工会的干部应当具备专业能力。走向专业治理意味着加强工会干部的技术培训、管理能力培训与政策研究能力。工会不应只是抗议的组织，更应是治理的组织——它需要有能力制定生产计划、评估技术方案、协调行业利益。"

  FCF_against_cgt:0 "对抗总工会"
  FCF_against_cgt_desc:0 "联邦内部存在对总工会权力的不满。一些人认为总工会过于集权、过于官僚化，主张削弱其权力、增加地方与工厂的自主权。这股力量来自无政府主义工会、天主教会工会以及部分区委员会。他们的对抗不一定是破坏性的——它可能是推动总工会改革的动力。"

  FCF_antitrust_investigation:0 "反垄断调查"
  FCF_antitrust_investigation_desc:0 "总工会对行业协调的垄断地位是否需要受到限制？反垄断调查旨在评估总工会的权力是否被滥用、是否存在排斥竞争、是否损害了小工厂与消费者的利益。调查的结果不一定是拆分总工会，但可能要求它调整某些做法。"

  FCF_economic_administration:0 "经济上的行政权"
  FCF_economic_administration_desc:0 "联邦是否需要拥有经济上的行政权？目前，经济决策分散在产业联合会、区委员会与总联邦委员会之间。一些人主张赋予公共安全委员会更多的经济行政权，以便在危机时迅速行动。另一些人担心这会侵蚀工团主义的基本原则。这个问题至今没有定论。"

  FCF_federal_supervisory_committee:0 "联邦监督委员会"
  FCF_federal_supervisory_committee_desc:0 "联邦监督委员会是总联邦委员会下属的监督机构，负责监督产业联合会、投资委员会与公共安全委员会的经济决策。委员会成员由总联邦委员会选举产生，不得兼任其他经济管理职务。它的职能是审查重大经济决策的合规性，并向总联邦委员会提交报告。"

  FCF_new_cgt:0 "崭新的总工会"
  FCF_new_cgt_desc:0 "文本大意：总工会在改革之后新生了"

  FCF_diverse_syndicats_strategies:0 "多元工会策略"
  FCF_diverse_syndicats_strategies_desc:0 "联邦不应只依赖全国总工会一家组织。天主教会工会、无政府主义工会以及其他小型工会的存在，为工人提供了多样化的选择。多元工会策略意味着承认不同工会的合法性、建立工会之间的协调机制、防止任何一家工会形成垄断。"

  FCF_focus_on_work_syndicats:0 "专注工作的工会"
  FCF_focus_on_work_syndicats_desc:0 "工会的核心职能是组织生产与保障工人权益。工会不应被政治斗争所绑架，也不应成为意识形态的战场。专注工作的工会意味着将精力集中在生产计划、技术改进、劳动条件改善与工人福利提升上。工会的政治影响力应当通过其在经济领域的实际成就来获得。"
#社会
  FCF_new_direction:0 "新气向"
  FCF_new_direction_desc:0 "旧制度的等级、特权与压迫已经被废除，取而代之的是工人自治、地方自治与行业协调的新秩序。新气象不仅是制度的变革，更是人心的变化——劳动者第一次感受到自己是国家的主人。巩固新气象，是联邦社会政策的首要目标。"

  FCF_what_we_lack:0 "匮乏之物"
  FCF_what_we_lack_desc:0 "文本大意：联邦所缺少的"

  FCF_unemployment_benefits:0 "失业救济补助"
  FCF_unemployment_benefits_desc:0 "当工人因行业性衰退而失去工作时，他应当有尊严地等待复苏。失业救济补助由产业联合会的失业保险基金提供，金额为原工资的一定比例，领取期限最长为一年。失业期间，工人需接受联合会的转岗培训安排。"

  FCF_employment_training_platform:0 "就业培训平台"
  FCF_employment_training_platform_desc:0 "技术变革与产业结构调整使许多工人面临技能过时的风险。就业培训平台由产业联合会与区委员会共同运营，提供面向不同行业、不同技能水平的培训课程。培训不仅是获得新技能的机会，也是工人重新进入生产过程的桥梁。"

  FCF_talent_education_fund:0 "人才教育基金"
  FCF_talent_education_fund_desc:0 "联邦需要持续投资于人才培养。人才教育基金由总联邦委员会拨款、各产业联合会配套出资，用于资助有潜力的工人接受高等教育或专业技术培训。基金的申请不设年龄上限，不要求政治背景，只考察申请人的能力与志向。"

  FCF_ensure_basic_education:0 "确保基础教育"
  FCF_ensure_basic_education_desc:0 "每一个联邦公民都应当接受基础教育。初等教育是强制性的，由各区委员会负责组织。确保基础教育意味着提供足够的学校、合格的教师与免费的教学材料。基础教育的质量直接影响联邦未来的生产力与社会凝聚力。"

  FCF_examine_womens_issues:0 "审视妇女问题"
  FCF_examine_womens_issues_desc:0 "妇女在革命中发挥了重要作用，但革命后的经济体制中，她们的地位仍然不平等。审视妇女问题意味着调查妇女在就业、工资、晋升与工会参与方面的实际情况，识别歧视性做法，并提出改进方案。妇女的解放不是革命的副产品，而是革命的目标之一。"

  FCF_support_female_workers:0 "扶助女性劳工"
  FCF_support_female_workers_desc:0 "女性劳工在工厂中往往从事最低薪、最不稳定的工作。扶助女性劳工意味着确保同工同酬、提供产假与育儿支持、增加女性在工厂委员会与工会领导层中的代表比例。排斥一半人口的劳动力是巨大的浪费，女性的劳动权利也是经济效率问题。"

  FCF_support_housewives:0 "支持家庭主妇"
  FCF_support_housewives_desc:0 "家庭主妇承担着家务劳动与育儿责任，这些劳动虽然不产生工资，但同样是社会再生产的重要组成部分。支持家庭主妇意味着承认家务劳动的社会价值、提供育儿补贴与公共服务以减轻家务负担。这不是鼓励妇女退出劳动市场，而是尊重妇女的选择。"

  FCF_what_we_have:0 "旧有之物"
  FCF_what_we_have_desc:0 "文本大意：联邦沿袭旧共和国的政策"

  FCF_state_of_all_workers:0 "全工人的国家"
  FCF_state_of_all_workers_desc:0 "文本大意：接受全世界的工人移民"

  FCF_beware_of_political_infiltration:0 "警惕政治渗透"
  FCF_beware_of_political_infiltration_desc:0 "文本大意：收紧移民，防止政治渗透"

  FCF_state_atheism:0 "国家无神论"
  FCF_state_atheism_desc:0 "文本大意：抛弃宗教，接纳彻底的国家无神论"

  FCF_reaffirm_religious_freedom:0 "重申宗教自由"
  FCF_reaffirm_religious_freedom_desc:0 "文本大意：延续宗教自由政策"

  FCF_special_status_of_catholicism:0 "天主教的特殊地位"
  FCF_special_status_of_catholicism_desc:0 "文本大意：授予天主教更大的权利"

  FCF_what_we_guard:0 "守护之物"
  FCF_what_we_guard_desc:0 "文本大一：关系社会稳定的"

  FCF_complete_freedom_of_speech:0 "彻底的言论自由"
  FCF_complete_freedom_of_speech_desc:0 "文本大意：彻底的言论自由"

  FCF_repress_heretical_speech:0 "遏制危险言论"
  FCF_repress_heretical_speech_desc:0 "文本大意：有限制的言论自由"

  FCF_antirevolutionary_speech_control:0 "反革命言论管制"
  FCF_antirevolutionary_speech_control_desc:0 "文本大意：受审查的言论自由"

  FCF_free_assembly:0 "自由集会"
  FCF_free_assembly_desc:0 "文本大意：自由集会"

  FCF_assembly_registration:0 "集会申报制度"
  FCF_assembly_registration_desc:0 "文本大意：集会需要申报"

  FCF_militia_policeization:0 "民兵警察化"
  FCF_militia_policeization_desc:0 "革命时期的民兵是工人自卫的组织。和平时期，民兵需要向专业化警察力量转型。民兵警察化意味着建立统一的训练标准、纪律规范与指挥体系，同时保留民兵的基层属性——警察力量应当来自社区、服务于社区。"

  FCF_autonomous_police_system:0 "自治警务系统"
  FCF_autonomous_police_system_desc:0 "警务应当由地方自治。各区委员会与公社委员会负责本辖区的警务工作。自治警务系统使警务工作更贴近社区的实际需求，也符合联邦主义的原则。"

  FCF_federal_security_police:0 "联邦安全警察"
  FCF_federal_security_police_desc:0 "联邦安全警察是总联邦委员会下属的全国性警察力量，负责处理跨区犯罪、政治犯罪与国家安全事务。"

  FCF_what_we_should:0 "将来之物"
  FCF_what_we_should_desc:0 "七小时工作制、年假制度、养老金制度——这些不是奢侈品，而是劳动者应得的权利。将来之物不是遥远的乌托邦，而是可以通过今天的政策逐步实现的现实。它们的实现需要经济的持续增长与社会的持续进步。"

  FCF_seven_hour_work_day:0 "七小时工作制"
  FCF_seven_hour_work_day_desc:0 "七小时工作制是联邦劳动政策的核心目标。缩短工作时间能够提高工人的生活质量，也在保持总就业水平的同时创造更多的工作岗位。七小时工作制的实施需要与产业联合会的生产计划协调，以确保生产效率不受影响。"

  FCF_annual_leave:0 "年假制度"
  FCF_annual_leave_desc:0 "每一个工人都有权享受带薪年假。年假不仅是休息的权利，也是工人参与文化生活、与家人团聚的机会。年假的天数由产业联合会与工厂委员会协商确定，但不得低于联邦规定的最低标准。"

  FCF_pension_system:0 "养老金制度"
  FCF_pension_system_desc:0 "养老金是工人晚年生活的保障。联邦的养老金制度由产业联合会的行业养老金与公社委员会的地方养老保障共同组成。养老金的标准根据工作年限与平均工资计算，确保退休工人能够维持体面的生活。"

  FCF_enhanced_soldier_benefits:0 "强化士兵福利"
  FCF_enhanced_soldier_benefits_desc:0 "士兵为联邦的安全付出了牺牲。强化士兵福利意味着提高军人待遇、改善军营条件、提供退役后的就业培训与生活保障。士兵的福利不仅是道义问题，也是军队士气与战斗力的保障。"

  FCF_what_we_rule:0 "至高之物"
  FCF_what_we_rule_desc:0 "文本大意：联邦的最高权力机关"

  FCF_reform_cgf:0 "改革总联邦委员会"
  FCF_reform_cgf_desc:0 "总联邦委员会是联邦的最高立法机构，但它的运作方式是否需要改革？改革意味着调整席位分配规则、优化议事程序、增强委员会对公共安全委员会的监督能力。改革的方案需要各区的协商与总联邦委员会的批准。"

  FCF_expand_CGF_authority:0 "加强总委员会权威"
  FCF_expand_CGF_authority_desc:0 "文本大意：扩大CGF的职权，使得其更好服务人民" 
 
  FCF_reform_election:0 "选举机制改革"
  FCF_reform_election_desc:0 "文本大意：对CGF的选举机制进行改革"

  FCF_reform_csp:0 "改革公共安全委员会"
  FCF_reform_csp_desc:0 "公共安全委员会是联邦的执行机关，其权力与责任需要明确界定。改革意味着调整其组成方式、明确其职权范围、增强总联邦委员会对其的监督。公共安全委员会不应成为一个不受制约的权力中心。"

  FCF_expand_chairman_power:0 "扩张主席职权"
  FCF_expand_chairman_power_desc:0 "公共安全委员会主席的职权是否需要扩张？支持者认为更强的行政领导权有助于提高决策效率、应对危机；反对者担心扩张主席职权会侵蚀集体决策的原则。这个问题在联邦内部存在深刻分歧。"
  
  FCF_strengthen_administrative_supervision:0 "加强行政监督"
  FCF_strengthen_administrative_supervision_desc:0 "无论公共安全委员会的职权如何界定，监督都是必要的。加强行政监督意味着建立更严格的报告制度、审计制度与问责机制。监督的权力在总联邦委员会，但监督的执行可以委托给专门的委员会。"

  FCF_advancing_federalism_reform:0 "推进联邦主义改革"
  FCF_advancing_federalism_reform_desc:0 "联邦主义是联邦的基本原则。推进联邦主义改革意味着进一步下放权力给各区与公社、增强地方自治的能力、减少联邦层面对地方事务的干预。联邦主义改革不是削弱联邦，而是使联邦建立在更坚实的基础之上。"

  FCF_advancing_centralized_reform:0 "推进集权化改革"
  FCF_advancing_centralized_reform_desc:0 "文本大意：强化联邦权力"

  FCF_what_we_enjoy:0 "欢愉之物"
  FCF_what_we_enjoy_desc:0 "文本大意：公民的娱乐"

  FRA_point_du_jour_studios:0 "发展电影工业"
  FRA_point_du_jour_studios_desc:0 "电影是大众艺术，也是意识形态的载体。发展电影工业意味着支持电影制作、建设电影院、培养电影人才。联邦的电影应当讲述工人的故事、反映革命的历程、展现法兰西的文化与风景。电影工业的发展需要资金的支持与创作的自由。"

  FCF_support_worker_clubs:0 "支持工人俱乐部"
  FCF_support_worker_clubs_desc:0 "工人俱乐部是工人业余生活的重要场所。俱乐部提供阅读、讨论、娱乐、体育等活动，是工人自我教育与自我组织的空间。支持工人俱乐部意味着提供场地、资金与活动指导，但俱乐部的管理应当由工人自己负责。"

  FCF_encourage_public_sports:0 "鼓励全民体育"
  FCF_encourage_public_sports_desc:0 "体育是健康的生活方式，也是集体精神的培养途径。鼓励全民体育意味着建设体育设施、组织群众性体育活动、支持体育俱乐部的成立。体育不是精英的专利，而是每一个公民的权利。"

  FCF_modernize_traditional_arts:0 "传统文艺现代化"
  FCF_modernize_traditional_arts_desc:0 "法兰西拥有丰富的传统文艺资源——文学、戏剧、音乐、绘画、建筑。传统文艺现代化意味着将这些传统资源与当代的审美与技术相结合，创造出既继承传统又面向未来的新文艺形式。"

  FCF_expand_printing_industry:0 "扩张印刷业"
  FCF_expand_printing_industry_desc:0 "印刷业是知识传播的基础。扩张印刷业意味着增加印刷设备的投入、培养印刷技术人才、降低出版成本。书籍、报纸、期刊的普及是公民教育的前提，也是公共讨论的基础。"

  FCF_people_live_on_rice:0 "人是铁饭是钢"
  FCF_people_live_on_rice_desc:0 "劳动者的体魄是社会生产力的基础。重视劳动者的营养与健康——提供充足的食物、改善工作环境、推广健康的生活方式。劳动者的健康不是个人问题，而是社会问题。"

  FCF_la_la_land:0 "爱乐之邦"
  FCF_la_la_land_desc:0 "音乐是超越语言的情感表达。支持音乐教育、建设音乐厅、资助乐团与合唱团。音乐不仅是娱乐，也是社会凝聚力的来源。音乐应当成为每一个公民生活中不可或缺的部分。"
#外交
  FCF_international_congress:0 "第三国际大会"
  FCF_international_congress_desc:0 "文本大意：第三国际的新一届大会"

