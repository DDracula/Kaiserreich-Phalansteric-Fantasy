  FRA_paul_carbone:0 "保罗·卡尔博内"
  FRA_paul_carbone_character_desc:0 "§Y生于：§!§L1894年2月14日；法兰西共和国、科西嘉省普罗普里亚诺§!"

  #陆军
  FRA_joseph_putz:0 "约瑟夫·普茨"
  FRA_joseph_putz_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1895年4月24日；比利时王国、布拉班特省布鲁塞尔§!\n§Y背景：§!§L约瑟夫·普茨，祖籍阿尔萨斯，生父是德国人，但拒绝承认普茨。初中毕业进入勒普雷圣热尔韦市政厅任写作助理。1914年12月入伍，在第八十九步兵团完成训练。1915年4月晋升下士，同年5月调往第一六八步兵团突击队。布瓦勒普雷特战役中表现出色，获得团级嘉奖。1916年2月随部队驻扎于雷永和布莱梅雷之间，普茨多次自愿充当传令兵，又获团级嘉奖。1916年7月参加凡尔登战役，表现出色，获旅级嘉奖。10月成为见习军官。1917年4月再次自愿充当传令兵，再获团级嘉奖。6月晋升中士，10月晋升少尉。1918年3月24日，在瓦克维尔遭毒气袭击，身负重伤，回后方修养。由于身体不佳，1919年3月被调往第五〇四坦克团，参加克莱蒙战役、第二次瓦兹河战役。参加士兵委员会，选为士兵代表。9月因伤势复发而无限期停职。10月晋升中尉。大战中共获荣誉军团骑士勋章和战争十字勋章（饰四枚铜星）。1920年1月由于肺部损伤严重，医疗委员会决定普茨退伍。但霞飞随即发布动员令，即将退伍的普茨又被赶回了军队。愤怒的普茨最终参加巴黎起义，晋升上尉，后任临时少校（后转正）。革命后，普茨先后在蒙鲁日、勒克雷姆兰-比塞特尔市政厅任职，1930年担任斯坦市镇政府部门主管。1931年，联合工人党的让·沙达沃因当选为斯坦市长。此时市政公款被盗，让·沙达沃因指控普茨贪污。普茨在多里奥的《解放报》上辩护。同年10月，普茨辞职并再度入伍，考入总参谋部预役军官进修学校，学习参谋技术与机动作战理论。1933年毕业并晋升中校，进入坦克监察局服役。1934年参与组建第一轻机械化师，担任营长。\n\n装甲兵军官，支持装甲作战。\n\n是总工会成员，也是劳工体育体操联合会的斯坦分会长和国际赤色济难会成员。阅读马克思和列宁的著作，以及图书和新闻传播中心出版的书籍，也阅读多里奥派的《解放报》。他对经济和城市规划感兴趣。虽然政治倾向复杂，但支持联合工人党。§!"

  FRA_henri_tanguy:0 "亨利·唐吉"
  FRA_henri_tanguy_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1908年6月12日；法兰西共和国、菲尼斯泰尔省莫尔莱§!\n§Y背景：§!§L乔治·勒内·亨利·唐吉，父亲是海军士官，母亲是洗衣工。生于莫尔莱火车站。早年生活于布雷斯特和土伦，1919年返回布雷斯特。次年随父亲参加水兵起义。战后全家移至巴黎，就读于狄德罗公立技术中学。1925年毕业，进入布洛涅-比扬古的雷诺工厂工作，加入联合工人党青年团。1927年志愿入伍，加入第一五一步兵团，表现出色，进入士官教导排。1928年晋升下士和中士。1929年晋升上士，考入圣西尔军校，属雷恩班。1931年毕业，晋升少尉，志愿前往巴塔哥尼亚服役，多次立功。1933年晋升中尉。1935年晋升上尉。\n\n擅长群众工作与组织民兵，擅长游击战。\n\n为人谦逊亲和，热爱自行车运动、热爱军旅，富有理想主义精神，组织纪律强。支持联合工人党。§!"

  FRA_georges_catroux:0 "乔治·卡特鲁"
  FRA_georges_catroux_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_1$）\n§Y生于：§!§L1877年1月29日；法兰西共和国、上维埃纳省利摩日§!\n§Y背景：§!§L乔治·阿尔贝·朱利安·卡特鲁，父亲是殖民军上校。早年就读拉弗莱什国立军事高中，1896年考入圣西尔军校。1898年毕业，进入第十二高山猎兵营。在德雷福斯案和政教分离问题中被认为是机会主义共和党人。1900年加入外籍军团，任中尉，参与阿尔及利亚平叛。1903年前往印度支那协助总督鲍渥（保罗·博）。1906年结识于贝尔·利奥泰，任利奥泰幕僚兼奥兰师参谋，升上尉。1913年获荣誉军团骑士勋章。任阿尔及利亚总督夏尔·卢托的政治幕僚，两人政见不合。1915年回国，任阿尔及利亚第二步兵团营长，参加奎内维耶尔战役、香槟战役，获团级嘉奖。1916年参加凡尔登战役，获师级嘉奖。1917年参加三〇四号高地战斗（凡尔登），获团级嘉奖。1918年升任少校。春季攻势期间，单腿受伤的卡特鲁率部抵挡一个德军师近二十小时，最终被俘，后获集团军级嘉奖与荣誉军团嘉奖。被俘后多次越狱。战争期间获战争十字勋章（饰两枚铜星、一枚银星与棕榈叶）、荣誉军团军官勋章与逃脱者勋章。1919年11月回国。卢托对士兵公民权问题百般拖延，卡特鲁从中调解。贝当政变以后，卡特鲁支持军政府，但公民权问题协商未果，士兵们选择革命，卡特鲁离开军队。1922年被征召，担任第五〇三装甲团团长，晋升中校。1924年调去第三国际执委会地区处，负责与北非、黎凡特和印度支那的外交事务。1925年支持突尼斯大罢工。1927年就读于高级军事研究中心，晋升上校。1930年回归部队，担任第四军区参谋长，晋升准将。1932年担任第十四步兵师师长，晋升少将。1935年任副总参谋长，晋升中将。\n\n卡特鲁认为总参谋部保守僵化，认为应把位置让给年轻人，但影响力不足。认为第三国际只能辅助被殖民民族独立，不能贸然干涉。待其独立，再与之强有力的政治、经济、文化联合以促进其现代化。卡特鲁为人温和，喜欢协商而非武力解决问题，人称“外交将军”。他支持新社会主义派，认为计划主义有助于团结与稳定，但不能完全放弃民主。§!"

  FRA_rene_olry:0 "勒内·奥尔里"
  FRA_rene_olry_character_desc:0 "§Y生于：§!§L1880年6月28日；法兰西共和国、北部省里尔§!\n§Y背景：§!§L勒内·亨利·奥尔里，父亲是阿尔伯特·奥尔里，著名工程师。童年随父亲活动，先后住在南锡和巴黎。1900年考入巴黎综合理工学院。1902年毕业，晋升少尉，加入第二十一炮兵团。1903年进入枫丹白露炮兵与工程应用学校学习。1904年返回原部队，晋升中尉。1912年调往第二十五炮兵团。1913年晋升上尉。1914年作为第九炮兵连连长参战，参加阿登战役、第一次马恩河战役。1915年参加莱塞帕尔日战役。随后调往第六集团军参谋部。9月调往凡尔赛要塞区参谋部。1916年3月进入第二集团军参谋部，受贝当调遣，参加第一次凡尔登战役。1916年5月调往炮兵研究中心。1917年进入中央集团军群参谋部，后进入埃米尔·法约勒领导的驻意法军参谋部，参加第一次皮亚韦河战役。1918年2月调往第二八三重型炮兵团，参加第二次皮卡第战役、第二次马恩河战役。7月调往预备役集团军参谋部，9月晋升少校。1919年参加贡比涅战役与第二次瓦兹河战役。大战期间，获荣誉军团骑士勋章、战争十字勋章（饰两枚棕榈叶、一枚金星、一枚银星、一枚铜星）与战争伤残勋章。战后调往巴黎炮兵总监察局。1920年拒绝参与政变。巴黎解放后，留在巴黎，参加革命军。1921年进入陆军高级指挥学校学习。1923年进入国防委员会秘书处。1926年晋升中校。1928年晋升上校，指挥第三〇二炮兵团。1931年就读高级军事研究中心。1932年晋升准将，指挥第二十九步兵师。1935年晋升少将，兼任第十五军区司令。\n\n擅长炮兵、组织与防御，擅长山地战。\n\n为人务实、冷静、低调、敬职敬责。坚持政治中立，个人支持共和青年联盟。§!"

  FRA_diego_brosset:0 "迪戈·布罗塞"
  FRA_diego_brosset_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1898年10月3日；阿根廷共和国、布宜诺斯艾利斯省布宜诺斯艾利斯§!\n§Y背景：§!§L迭戈·夏尔·约瑟夫·布罗塞，里昂人，其父是布宜诺斯艾利斯的股票经纪人。迪戈两岁回国，早年在里昂和多勒的耶稣会学校学习，成绩不佳且厌恶校规，十五岁辍学。他受“炽热的神秘主义”驱动，对战争和祖国感兴趣。1916年志愿入伍，成为第二十八高山猎兵营的列兵，后进入第六十八高山猎兵营。1917年参加马尔迈松战役。 1918年参加第二次皮卡第战役和第三次皮卡第战役，晋升下士。1919年参加第三次索姆河战役与第二次利斯河战役，晋升中士。七月兵变席卷第六十八营。迪戈不想停战，但承认屠杀应该停止。12月成为见习军官，准备就读圣迈克桑步兵军官学校。还未到校，内战爆发，迪戈被动员至政府军。面对自己的战友，迪戈拒绝开战，逃回老部队，最终参加革命，参与马赛起义、罗讷河谷战役与特鲁瓦战役。大战期间，迪戈共有四次嘉奖，获战争十字勋章（饰两枚铜星和两枚银星）。革命胜利后，参加革命士兵军团，前往上萨瓦与瑞军对峙，结识柯尼希。1922年返回步兵学校学习。在校勤奋且乐于运动，曾获全法军人运动会八百米和一千五百米冠军，并在乔因维尔体操与击剑学院学习。1924年毕业，晋升少尉，被选入第三国际地区处，迪戈自告奋勇前往非洲。他在南撒哈拉活动，负责调查当地情况、联系反殖民势力、组织游击队等，精通阿拉伯语及其方言，是“撒哈拉通”。期间升任中尉和上尉。1929年兼总参谋部非洲与东方事务处处长，晋升少校。1931年回国，考入巴黎东方语言文化学院，晋升中校。1933年获文学阿拉伯语本科文凭，同年考入陆军高级指挥学校，锐评其圈子封闭，“没有灵魂”。1935年毕业，成为第五十四步兵旅旅长，晋升上校。\n\n迪戈非常规作战经验丰富，军事思想反传统：强调任务型指挥与政治化军队。以强大思想武装起来，才能将“人”的因素发挥到极致。\n\n迪戈有民族主义与神秘主义倾向，相当热爱撒哈拉文化，绰号：“骆驼人”。热爱写作，著有小说《撒哈拉，远离西方的人》。热情似火，常有大胆的举动，如把吉普车开到楼梯上。§!"

  FRA_marie_pierre_koenig:0 "马里-皮埃尔·柯尼希"
  FRA_marie_pierre_koenig_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1898年10月10日；法兰西共和国、卡尔瓦多斯省卡昂§!\n§Y背景：§!§L马里·约瑟夫·皮埃尔·弗朗索瓦·柯尼希，祖籍阿尔萨斯，父亲是著名管风琴师，曾参加普法战争并致残；母亲是花商。早年在马莱伯中学求学，积极参与先锋青年俱乐部活动（天主教会赞助）。1917年刚高中毕业便手持毕业证参军，4月17日编入第三十六步兵团。因表现出色，年末进入伊苏丹军官速成学校。1918年2月毕业，成为见习军官，参加第二次马恩河战役与第三次皮卡第战役，晋升少尉，获集团军级嘉奖和军事勋章。1919年参加贡比涅战役与第二次瓦兹河战役，获团级嘉奖。柯尼希反对停战。大战期间，柯尼希获军事勋章和战争十字勋章（饰铜星和棕榈叶）。贝当政变后，第三十六团投票决定支持兵变，柯尼希默认投票结果。随着内战爆发，三十六团于卡昂起义，柯尼希参加巴黎战役与西线大追歼。革命后继续服役。1920年加入第十五高山猎兵营，在上萨瓦地区与瑞军对峙，结识布罗塞，参加革命士兵军团，晋升中尉。1922年进入圣迈克桑步兵军官学校学习。1924年毕业，分配至第三国际军事部，任卡特鲁的副官，晋升上尉。1925年调往巴塔哥尼亚，指导军队建设，1930年晋升少校。1931年回国，调往第四十步兵师参谋部。1933年调往第四十三步兵师参谋部，晋升中校。\n\n长期在智利和巴塔哥尼亚服役，与阿根廷渗透军打运动战。这种非正规战争模式使他更强调部队机动性与主动性。\n\n具有浓厚的天主教色彩，也是坚定的民族主义者，以法兰西利益为先，认为孱弱的阿尔及尔政府无法光复故土。政治上支持国家工团主义联盟，对犹太人非常友好。§!"

  FRA_francois_de_linares:0 "弗朗索瓦·德利纳雷斯"
  FRA_francois_de_linares_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1897年7月7日；法兰西共和国、上维埃纳省盖雷§!\n§Y背景：§!§L弗朗索瓦·让·马里·阿梅代·安托万·冈萨雷斯·德利纳雷斯，父亲是庄园主，经营葡萄园，生于英属印度，家族源于西班牙；母亲是旺代人，父母早亡，童年在修道院渡过。早年就读圣热纳维耶夫私立中学（耶稣会管理）。曾在宗教与从军之间两难。1916年为参军入籍法国，随即考入圣西尔军校，属校旗班。在校成绩优异。1917年7月毕业，成为见习军官，加入第三七〇步兵团，参加马尔迈松战役。11月调往第七十猎兵营，前往意大利，支援因卡波雷托战役大败的意军。1918年4月回国，调任第二十六步兵团，参加苏瓦松战役与第二次利斯河战役，两次负伤，获集团军级嘉奖、军级嘉奖、团级嘉奖与师级嘉奖，晋升少尉。1919年参加贡比涅战役与第二次瓦兹河战役，获师级嘉奖、军事嘉奖与荣誉军团嘉奖。反对停战。大战期间获战争十字勋章（饰铜星、两枚银星、金星与棕榈叶）、军事勋章、荣誉军团骑士勋章。停战后返回圣西尔军校学习。内战爆发后，拒绝与同胞开战，选择回家。1921年返校学习，年末毕业，调往第三国际军事处。1922年晋升中尉。1924年参加援英志愿军。1926年任圣西尔军校教官，晋升上尉。1928年考入陆军高级指挥学校。1930年毕业。任职于第十五高山猎兵营，晋升少校。1934年调往第十四军区参谋部，晋升中校。\n\n德利纳雷斯强调部队机动性，对伞兵及空地协同战斗很感兴趣。\n\n为人坚毅沉稳、内心敏感、热爱生活、信仰虔诚，擅长英语，支持共和青年联盟。§!"

  FRA_raoul_salan:0 "拉乌尔·萨兰"
  FRA_raoul_salan_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1899年6月10日；法兰西共和国、加尔省罗克莫尔§!\n§Y背景：§!§L拉乌尔·阿尔班·路易·萨兰，父亲是税务局局长。早年就读尼姆男子高中，获国家奖学金。1917年8月志愿入伍，考入圣西尔军校，属圣奥黛丽班。1918年7月毕业，晋升见习军官，加入第五殖民地步兵团，参加第三次皮卡第战役、第二次索姆河战役，获团级嘉奖、师级嘉奖。1919年参加第三次索姆河战役、第二次利斯河战役与圣米耶勒战役，获集团军级嘉奖与荣誉军团嘉奖，晋升少尉。参加士兵委员会。反对停战。大战期间获战争十字勋章（饰铜星、银星与棕榈叶）和荣誉军团骑士勋章。10月返回圣西尔军校学习。不支持平安夜政变。因动员令返回原部队。1920年参加巴黎战役。勒芒战役期间随部队起义。战后参加革命士兵军团。1921年5月返回圣西尔军校。1922年毕业，晋升中尉，自告奋勇前往第三国际服役，分配至地区处，前往印度支那，负责调查民风民情、指导当地革命。同情当地少数民族，反对越南国民党的大京族主义。1926年晋升上尉，兼任总参谋部第二局东方事务处副处长。1930年参与安沛起义，晋升少校。起义失败后，与越南革命者意见不和，调往中国。1932年参与上海起义，随后前往闽赣根据地。1934年回国，晋升中校，任第五步兵团副团长。\n\n长期服役于殖民地，军事思想不同寻常，基于印度支那与中国革命的经验，熟悉游击战，强调官兵主动性、政治化军队与机动性。\n\n为人含蓄、安静、喜欢沉思、世俗主义，异常热爱东方文化，绰号“士大夫”。熟悉老挝语、熟悉印度支那的民族问题。有一半印度支那血统的私生子。常常研究中国革命，阅读邓演达、叶挺、毛泽东等人的著作，又有绰号“中国人”。在殖民地问题上，常被怀疑大国主义倾向，是坚定的民族主义者。尽管隶属革命士兵军团，但参政不积极。对于殖民地有自己的看法。§!"

  FRA_henri_frenay:0 "亨利·弗勒奈"
  FRA_henri_frenay_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1905年11月11日；法兰西共和国、罗讷省里昂§!\n§Y背景：§!§L亨利·奥古斯特·安托万·弗勒奈，父亲是陆军中校，曾参加大战，获荣誉军团军官勋章与战争十字勋章；母亲是家庭主妇。家庭氛围传统、保守，天主教气息浓厚。早年就读安培中学。1924年在帕克中学完成预科，考入圣西尔军校，属罗塞尔上校班。1926年毕业，晋升少尉，进入第三高山猎兵营。接受空中侦查员训练。1929年晋升中尉，调入第三国际军事处，在叙利亚活动。1932年回国考入陆军高级指挥学校。1934年毕业，任第二十军区司令部第三局参谋。1935年晋升上尉。\n\n擅长组织工作与情报收集。\n\n勇气十足而富有魅力，领导风格强硬、为人固执且骄傲，重情义。遇见妻子前，他倾向于政治中立。受其影响，逐渐成为社会主义者，但反对马克思主义。§!"

  FRA_gaston_billotte:0 "加斯东·比约特"
  FRA_gaston_billotte_character_desc:0 "§Y生于：§!§L1875年2月10日；法兰西共和国、奥布省索梅瓦尔§!\n§Y背景：§!§L加斯东·亨利·古斯塔夫·比约特，父亲是小学教师。早年就读克雷蒂安·德·特鲁瓦中学。1894年进入圣西尔军校的亚历山大三世班学习，师从保罗-弗雷德里克·罗莱。1896年毕业后在海军步兵服役。随后派往东京（越南）和中国。1898年晋升中尉。1903年晋升上尉。1907年回到法国，就读于陆军高级指挥学校。1911年以营长身份再赴东京（越南），晋升少校。1913年赴摩洛哥，次年获荣誉军团骑士勋章。1915年回国，晋升中校，派往总司令部第三局任对外作战处长。1916年晋升上校，任第二集团军参谋部第三局局长，获集团军级嘉奖。1917年末短暂担任第四十步兵师副师长。1918年任第三十二步兵师参谋长，4月率第十五步兵团参加第一次利斯河战役，在凯梅尔山战斗中遭芥子气袭击，回后方疗养，再获集团军级嘉奖。1919年2月归队，3月到5月间率部队先后参加贡比涅战役、克莱蒙战役与瓦兹河战役，获荣誉军团嘉奖。随着兵变爆发，三十二师陷入瘫痪，直至战争结束。比约特获勋颇多，他共获战争十字勋章（饰两枚棕榈叶）、荣誉军团军官勋章及大量外国勋章。贝当政变后，提拔比约特为准将，召集他赴总司令部任职。但任命未到，内战爆发，军政府无暇顾及比约特的任职问题。比约特也无意干涉政局，赋闲在家直至内战结束。革命后，缺乏军官的公社军亦召集比约特。1921年比约特指挥第六十四步兵旅。1923年任总司令部第一局局长。1925年兼任第三国际军事顾问，指导中国革命。1927年任第十步兵师师长，晋升少将。1929年成为陆军参谋长，晋升中将。\n\n坚持防御战术与火力作用，强调大规模动员的必要性，视装甲部队为机动预备队。作为参谋长，在整顿公社陆军方面贡献很大，但有人批评他思想保守，阻碍法军改革。\n\n比约特进入公社军具有意外成分，支持建制派。§!"

  FRA_jean_edouard_verneau:0 "让-爱德华·韦尔诺"
  FRA_jean_edouard_verneau_character_desc:0 "§Y生于：§!§L1890年8月29日；法兰西共和国、默兹省维尼奥§!\n§Y背景：§!§L让-爱德华·韦尔诺，父亲是公务员。早年就读南锡的亨利·庞加莱中学。1911年考入巴黎综合理工学院。1913年毕业并进入凡尔赛军事工程应用学校学习。次年毕业，调往第三工兵营，晋升少尉。1914年参加莫伯日围城战、第一次马恩河战役、弗兰德斯战役。1915年参加第一次香槟战役和第二次香槟战役。1916年参加凡尔登战役和索姆河战役，晋升中尉，年末负伤。1917年恢复期间任职于凡尔赛工程学校。1918年2月回原部队，参加第二次皮卡第战役、第二次马恩河战役与第三次皮卡第战役。晋升上尉。1919年参加贡比涅战役与瓦兹河战役。大战期间获战争十字勋章（饰银星和棕榈叶）、战争伤残勋章。内战期间支持政府军，特鲁瓦战役被俘后参加革命。1920年至1922年在陆军高级指挥学校学习。毕业后调往陆军参谋部第一局，晋升少校。1927年调往总参谋部第一局，晋升中校。1932年接管第十九工兵团，晋升上校。\n\n工程军官，热爱祖国，视民族利益高于政党利益，中立派。§!"

  FRA_georges_revers:0 "乔治·勒韦尔"
  FRA_georges_revers_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_4$）\n§Y生于：§!§L1891年7月30日；法兰西共和国、伊勒-维莱讷省圣马洛§!\n§Y背景：§!§L乔治·马里·约瑟夫·勒韦尔，父亲是邮电总局稽查员。早年就读圣马洛中学。1907年考入邮电局，任办事员。1912年应征入伍，加入第三炮兵团。1913年4月晋升下士，10月成为预备见习军官。1914年4月晋升预备少尉，调往第十步行炮兵团。8月被动员，进入黑山行进炮兵连，参加卡塔罗战斗，获黑山军队的嘉奖。1915年参加第二次香槟战役，获团级嘉奖。1916年参加凡尔登战役，获旅级嘉奖，晋升预备中尉。1917年参加贵妇小径战役。后转任“马塞尔”浮动炮台艇长，参加马尔迈松战役，转为职业中尉。1918年调任第七十重型炮兵团（岗位不变），参加第三次埃纳河战役、苏瓦松战役，获师级嘉奖与荣誉军团嘉奖，晋升职业上尉。1919年参加瓦兹河战役。大战期间获荣誉军团骑士勋章、战争十字勋章（饰两枚铜星与一枚银星）、达尼洛一世亲王军官勋章与黑山英勇勋章。1919年8月被借调至战争部第三局。10月调往战争部长特设参谋处，实际在炮兵局局长办公室工作。对贝当并无好感，巴黎战役后期参加革命。1920年10月调往炮兵总监察署。1923年调往巴黎锻造监察署，晋升少校。1924年参加援英志愿军，结识多里奥。回国后考入陆军高级指挥学校。1928年调往第三十二炮兵团。1931年任陆军参谋部第四局局长，晋升中校。1935年任总参谋部第四局副局长。\n\n勒韦尔是平民军官，对社会主义有一定好感。积极涉政，热衷结交政治盟友，通过朋友罗杰·佩雷与多里奥有联系。§!"

  FRA_andre_boris:0 "安德烈·鲍里斯"
  FRA_andre_boris_character_desc:0 "§Y隶属：§!$party_PCOP$（$PCOP_faction_2$）\n§Y生于：§!§L1878年8月23日；法兰西共和国、默尔特-摩泽尔省图勒§!\n§Y背景：§!§L安德烈·皮埃尔·路易·鲍里斯，犹太人，其父是治安官，曾参加普法战争，后进入精神病院；其母加布里埃尔·亚历山大家世显赫。他是乔治·鲍里斯的兄弟——乔治·鲍里斯是莱昂·布鲁姆的幕僚。在图勒中学成绩优异。老师评价其“聪明好学、极其勤奋努力、进步显著、做事有条不紊” 。1895年考入巴黎综合理工学院，学习火炮技术。德雷福斯事件期间，尽管他认为德雷福斯是无辜的，但仍相信司法系统的判决。1906年晋升中尉。1910年进入高级指挥学校，晋升上尉。大战爆发时，在第七十步兵师参谋部任职。1914年，参加莫尔昂日战役、格朗库罗内战役、第一次阿图瓦战役。1915年参加第二次阿图瓦战役和第三次阿图瓦战役。因其“知识广博、深思熟虑”，“频繁侦察前线最危险的地点，为指挥部提供了宝贵的协助”，8月4日获荣誉军团骑士勋章和集团军级嘉奖。1916年进入第三集团军参谋部。1917年参加贵妇小径战役。1918年进入第四集团军参谋部，晋升少校，参加第二次马恩河战役、苏瓦松战役与第三次皮卡第战役。1919年调任第二十步兵团团副，参加贡比涅战役、瓦兹河战役。面对大镇压，鲍里斯理解官兵的苦衷，寻求温和手段解决问题。大战期间获战争十字勋章（饰棕榈叶）和荣誉军团骑士勋章。鲍里斯反对政变。内战爆发后，在全团官兵要求下于里昂起义，参与罗讷河谷战役和特鲁瓦战役，晋升中校。1921年接管第三〇六炮兵团，晋升上校。1923年任第一军区炮兵指挥官，晋升准将。1926年担任第一军区司令，晋升少将。1928年任总参谋部炮兵监察长，晋升中将。1930年担任陆军监察长，晋升上将。\n\n炮兵军官，坚持大战经验，强调火力至上。对公社炮兵的发展有很大影响。\n\n鲍里斯家族被评价为“爱国者、共和主义者，并且坚定地信奉世俗主义” ，他本人也秉持了家族的传统。对于共和主义的坚持是他拒绝贝当的原因。支持工农共产党，反感集权主义。§!"

  FRA_henri_adeline:0 "亨利·阿德林"
  FRA_henri_adeline_character_desc:0 "§Y生于：§!§L1898年5月8日；法兰西共和国、默兹省凡尔登§!\n§Y背景：§!§L亨利·马里·夏尔·阿德林，父亲是工程师，路桥工程军团成员。早年就读克雷蒂安·德·特鲁瓦中学。1916年考入圣西尔军校，属校旗班。1917年8月毕业，晋升见习军官，加入第278步兵团，随部队驻守于戈朗库尔和弗拉维勒梅尔德（瓦兹省）。1918年1月调往第二摩洛哥步枪团，参加第三次皮卡第战役与第二次索姆河战役，负伤，晋升少尉，获两次师级嘉奖。1919年参加瓦兹河战役，晋升中尉。大战期间，获战争十字勋章（饰两枚银星）与战争伤残勋章。停战后调往信号部队。贝当政变后，信号部队陷入瘫痪，阿德林选择回家。随着凡尔登解放，起义军强制征召阿德林，负责组织新军。参加特鲁瓦战役、巴黎战役与西部大追歼。1921年进入巴黎工程学校学习。1923年进入巴黎高等电力学院学习无线电。1924年毕业，进入第十八工兵团服役，晋升上尉。1927年考入陆军高级指挥学校。1929年毕业，进入第二十军区参谋部，晋升少校。1932年任职于第六工兵团。1934年晋升中校。\n\n工兵军官，对无线电很感兴趣。工程技术过硬。擅长组织民兵。\n\n纯粹的爱国主义者，反感政治内斗，坚持政治中立，坚持战争人道主义。§!"

  FRA_raoul_magrin_vernerey:0 "拉乌尔·马格林-韦尔内雷"
  FRA_raoul_magrin_vernerey_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1892年2月7日；奥匈帝国、匈牙利王国佩斯-皮利什-绍尔特-基什孔县布达佩斯§!\n§Y背景：§!§L拉乌尔·夏尔·马格林-韦尔内雷，父亲是匈牙利贵族，母亲是住在维也纳的法语教师，他是私生子，名字源于外祖父母。早年由一位匈牙利贵族抚养，回国后居住于杜省的拉维龙。早年就读贝桑松的维克多·雨果中学和奥尔南天主教小修院。从小立志参军，不惜离家出走。1913年考入圣西尔军校，属蒙米拉伊班。1914年毕业，晋升少尉，进入第六十步兵团，8月初参加米卢斯战役，两次中弹负伤，治疗两周。8月底归队，参加第一次马恩河战役，三次遭弹片袭击致重伤，回后方疗养。获荣誉军团嘉奖。1915年7月归队，8月又头部受重伤，回后方疗养，晋升中尉，期间参加贝尔福参谋速成班。1916年3月归队，参加凡尔登战役。7月参加索姆河战役，晋升上尉，8月再度负伤。11月归队。1917年参加贵妇小径战役和第二次凡尔登战役。1918年参加第一次利斯河战役、第二次马恩河战役，遭毒气袭击，眼睛受伤。1919年参加贡比涅战役、第三次利斯河战役，再获荣誉军团嘉奖。大战期间，获荣誉军团骑士勋章及军官勋章、战争十字勋章（饰七枚铜棕榈叶、一枚金星、两枚银星与一枚铜星）与战争伤残勋章（饰七枚星）。停战后，调往东方集团军总参谋部，任第一局局长。接受空中侦查训练。1920年4月回国，参加南特战役与布雷斯特战役，因水兵起义被俘。1921年获释。调往第十六猎兵营。1924年参加援英志愿军。1926年志愿加入第三国际军事处，前往巴塔哥尼亚服役，晋升少校。1932年晋升中校。1934年回国，调往第五高山猎兵半旅。\n\n常在海外活动，环境适应能力强，提倡战术多样、灵活机动的部队。\n\n军人楷模。喜欢亲临前线、与士兵同甘共苦、关怀士兵。为人坚韧顽强、不善妥协、时常顶撞上级。始终委以重任并坚决完成任务。政治上支持共和社会主义-激进社会主义联盟，反感专制主义。§!"

  FRA_georges_blanchard:0 "乔治·布朗夏尔"
  FRA_georges_blanchard_character_desc:0 "§Y生于：§!§L1877年12月9日；法兰西共和国、卢瓦雷省奥尔良§!\n§Y背景：§!§L乔治·莫里斯·让·布朗夏尔，父亲是上尉，但家族却是艺术世家，祖先曾获罗马大奖。1897年8月考入巴黎综合理工学院，1899年就读于枫丹白露炮兵与工程应用学校，担任见习军官。毕业先后在第三十、二十二、五、二十九、十和第十八炮兵团服役。1910年晋升上尉。1913年进入陆军高级指挥学校。1914年开战时，在第五十六炮兵团任上尉，参加莫尔昂日战役、沙姆山口战役、热贝维莱战役、瓦夫尔战役与弗兰德斯战役。1915年3月，进入第十六军参谋部，参加第一次香槟战役。同年7月转任第四集团军的参谋部，参加第二次香槟战役，负责组织协同重型炮兵，获集团军级嘉奖。1916年继续在香槟地区与德军拉锯，获荣誉军团骑士勋章。1917年参与第三次香槟战役（香槟山战役）。1918年3月第二次皮卡第战役期间遭毒气袭击，受伤住院。5月出院并转入霞飞办公室，协调协约国军队。霞飞评价：“越了解他，就越敬佩这位杰出军官的智识与品格。” 1919年3月晋升少校。大战期间获战争十字勋章（饰棕榈叶）和荣誉军团骑士勋章。尽管布朗夏尔自称反对政变，但作为霞飞副官负责部分技术性工作。贝当政变后，霞飞任布朗夏尔为总司令部第三局副局长，晋升中校。内战爆发后，布朗夏尔先后在战争部和凡尔赛宫工作。巴黎战役后，白军大撤退，尽管有霞飞劝说，但布朗夏尔坚持留在法国。1920年中至1921年初，布朗夏尔接受审查，在甘末林等人的帮助下，特别军事法庭判其无罪并保留原军衔。同年成为高级军事研究中心教授。1924年任第一八一炮兵团团副。1926年任团长，晋升上校。1927年任第二军区副参谋长。1930年任第二军区炮兵司令。1931年晋升准将。1933年任第七军区司令。自1927年起任高级军事研究中心主任。\n\n布朗夏尔是炮兵出身，又受大战的影响，更强调火力与防御。认为运用强大的火力压倒敌人才是胜利的关键。他长期从事参谋工作，擅长物资调配。\n\n布朗夏尔很有素养、性格悲观，但专业素质过硬，能很好地完成上级的任务。对公社政治并不热衷。§!"

  FRA_clement_blanc:0 "克莱芒·勃朗"
  FRA_clement_blanc_character_desc:0 "§Y生于：§!§L1897年10月1日；法兰西共和国、东比利牛斯省佩皮尼昂§!!\n§Y背景：§!§L让-克莱芒·勃朗，祖籍塔恩省，父亲是宪兵准尉，后在酒厂工作。早年就读佩皮尼昂中学，是霞飞的同乡兼校友。1915年志愿加入第五十六炮兵团。随后进入枫丹白露炮兵与工程应用学校学习。1916年毕业并成为见习军官，调往第十五炮兵团，参加凡尔登战役、索姆河战役，获团级嘉奖和旅级嘉奖，晋升少尉。1917年参加克拉翁讷战役（贵妇小径战役）。1918年参加多尔芒战役（第二次马恩河战役）与第三次皮卡第战役，获集团军级嘉奖。1919年参加贡比涅战役与瓦兹河战役。大战期间获战争十字勋章（饰两枚铜星与棕榈叶）。他是同班参战同学中唯二的幸存者。停战后考入巴黎综合理工学院特别班。不久因霞飞动员令调回原部队。里尔起义后，第十五团大部分官兵响应，勃朗随白军撤至亚眠。第二次亚眠战役期间，勃朗撤退不及被俘。权衡之下加入革命军，参加特鲁瓦战役。战后返回巴黎理工学院，1922年毕业并留校任教，晋升中尉。1925年兼任第一骑兵师炮兵连连长，晋升上尉。1928年考入陆军高级指挥学校。1930年以第一名毕业，晋升少校，进入陆军参谋部第四局工作。1934年晋升中校。1935年任局长。\n\n炮兵军官出身，强调炮兵作用。长期在参谋部任职，擅长后勤组织。他支持第三国际的军事统一；重视军事科研，如原子能武器化。\n\n典型的技术军人。为人大胆幽默、敢于批评上级，做事勤奋认真，强调政治中立，是务实的民族主义者。§!"

  FRA_paul_legentilhomme:0 "保罗·勒让蒂奥姆"
  FRA_paul_legentilhomme_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1884年3月26日；法兰西共和国、芒什省瓦洛涅§!\n§Y背景：§!§L保罗·路易斯·维克托·马里·勒让蒂奥姆，父亲是税务员。早年就读于勒阿弗尔公立男子中学。1905年考入圣西尔军校。1907年毕业，加入殖民军第三东京步枪团（越南），晋升少尉。1909年晋升中尉，又先后在第十及第二殖民地步兵团服役。1912年回国调往第二十三殖民地步兵团。1914年讷沙托战役中遭敌人包围，被俘，后获团级嘉奖。由于德国拘留战俘且法国陷入内战，勒让蒂奥姆直至1920年5月回国，晋升上尉。大战期间，勒让蒂奥姆获战争十字勋章（饰铜星）。1921年考入陆军高级指挥学校，1923年毕业，调往第三国际军事部，指导印度支那革命。1924年晋升少校。1928年晋升中校。1930年任第四十步兵师参谋长。1933年指挥第四步兵团，晋升上校。1935年任圣西尔军校副校长，并就读于高级军事研究中心。\n\n勒让蒂奥姆常年与殖民地打交道，具有一定的非正规战斗经验。强调部队的机动性与多兵种协同并坚持政治和军事的统一。喜欢身先士卒。\n\n为人勇敢而充满活力，幽默风趣，必要时严厉要求，有人道主义精神。倾向于共和社会主义-激进社会主义联盟。§!"

  FRA_louis_buisson:0 "路易·比松"
  FRA_louis_buisson_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_2$）\n§Y生于：§!§L1889年12月14日；法兰西共和国、萨瓦省滨湖勒布尔歇§!\n§Y背景：§!§L路易·莱昂·马里·安德烈·比松，父亲是鞋匠兼市议员。从小喜爱运动，曾两次施救溺水者，获见义勇为荣誉勋章。1906年考入阿尔贝维尔中等师范学校。1909年毕业，志愿进入第二十二猎兵营服役。1910年晋升下士和中士。1911年参加预备军官训练班，晋升预备少尉。调往第十三猎兵营，随后退役，任圣让达尔韦小学助理教师。次年在蒙梅利安高等小学任教。大战爆发后，前往第六自行车猎兵大队服役，参加莫尔昂日战役、第一次埃纳河战役。9月重伤住院，获师级嘉奖。1915年至1916年恢复期间任新兵教官，晋升中尉。1917年返回原部队，参加贵妇小径战役，晋升临时上尉。1918年参加第二次皮卡第战役与第一次利斯河战役。期间遭芥子气袭击负伤。苏瓦松战役再遭芥子气袭击负伤，均迅速归队。晋升职业上尉。1919年参加贡比涅战役与瓦兹河战役。停战后，获荣誉军团嘉奖。大战期间获战争十字勋章（饰银星）与荣誉军团骑士勋章。比松不认同贝当政变。内战期间随政府军参加巴黎战役，期间参加士兵委员会。4月初于凡尔赛起义，后参加西部大追歼。革命后继续指挥第六自行车猎兵营。1923年考入巴黎陆军高级指挥学校。1925年毕业，进入第十四军参谋部服役，晋升少校。1927年赴丹麦交流。1928年任第99高山步兵团营长。1931年调任陆军参谋部第三局局长，支持德莱斯特兰的装甲师计划，晋升中校。1935年任第五〇三装甲团团长，晋升上校。\n\n强调集中运用坦克部队，主动出击，歼灭敌人。\n\n比松出自“共和国的黑色轻骑兵”，即教师，坚信共和主义。支持共和社会主义-激进社会主义联盟的最左翼§!"

  FRA_aubert_frere:0 "奥贝尔·弗雷尔"
  FRA_aubert_frere_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1881年8月21日；法兰西共和国、加莱海峡省格雷维耶§!\n§Y背景：§!§L奥贝尔·阿希尔·朱尔·弗雷尔，父亲是农民，信仰虔诚。早年就读于圣贝尔坦学院。1900年考入圣西尔军校，属乍得班。1902年毕业，进入非洲军，服役于阿尔及利亚第二步枪团，晋升少尉，结识利奥泰，成为利奥泰军官团的一员。1904年获殖民地勋章（饰撒哈拉结）。1908年参与摩洛哥战争，晋升中尉。1910年经外交部调遣，负责边境警务工作，获荣誉军团骑士勋章。1912年回国，加入第八猎兵营，不久任预备役教官。1913年调往第一步兵团，晋升上尉。1914年参加沙勒罗瓦战役并负伤，第一次吉斯战役、第一次马恩河战役、奔向大海战役，获团级嘉奖。1915年参加第二次香槟战役，攻占博塞茹尔堡垒，获军级嘉奖与集团军级嘉奖。1916年参加凡尔登战役，有卢沃蒙-科特迪普瓦夫尔战役、杜欧蒙堡战役与沃堡战役。参与索姆河战役，有莫尔帕战役与孔布勒战役。获三次集团军级嘉奖与荣誉军团嘉奖。1917年参加贵妇小径战役，随后调往第六高山猎兵营，参加马尔迈松战役并负伤，晋升少校，获军级嘉奖与集团军级嘉奖。1918年参加第二次皮卡第战役，头部重伤，回后方疗养。11月进入第四集团军参谋部。获集团军级嘉奖与荣誉军团嘉奖。1919年任第一步兵团团长，参加贡比涅战役、克莱蒙战役与瓦兹河战役，获两次师级嘉奖，晋升中校。大战期间，获荣誉军团指挥官级勋章、战争十字勋章（饰铜星、两枚银星，两枚金星与五枚棕榈叶）与战争伤残勋章。弗雷尔不反对平安夜政变。内战期间参加第三次亚眠战役、特鲁瓦战役、巴黎战役与西线大追歼。1920年5月在布雷斯特被俘，经劝说留在革命军，任圣西尔军校教官。1921年考入陆军高级指挥学校。1923年毕业，任凡尔赛坦克训练学校教官，结识德莱斯特兰。1926年任索米尔装甲骑兵学校教务长，晋升上校。1930年任校长。1934年任圣西尔军校校长，晋升准将。\n\n弗雷尔支持机动化与装甲化，是最早呼吁装甲兵独立的人之一，坚持职业军队。\n\n为人勇敢、热情、冷静、虔诚、爱国。曾支持贝当，政治忠诚受质疑，但已不再反对公社。§!"

  FRA_victor_bourret:0 "维克多·布雷"
  FRA_victor_bourret_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1889年12月14日；法兰西共和国、萨瓦省滨湖勒布尔歇§!\n§Y背景：§!§L路易·维克多·布雷，祖籍阿尔代什省，父亲是前宪兵士官，后为烟草专卖员。早年就读于莱桑德利国立军事高中。1895年志愿入伍，加入第一一五步兵团。随后选入士官教导排，成绩优异，1896年先后晋升下士和中士。1897年3月成为军需官，负责连队后勤。8月晋升上士，负责连队行政工作。在突尼斯服役大半年。1900年4月报考圣迈克桑步兵军官学校。1901年以第五十九名毕业，晋升少尉，分配至第十二高山猎兵营服役。1903年晋升中尉。1904年调任第三十二步兵团。1907年前往乔因维尔体操与击剑学院学习，成绩优异，获部长嘉奖，后留校任教。1909年12月调往第四十三步兵团。1913年前往陆军高级指挥学校学习。1914年3月晋升上尉，调回第一一五步兵团。8月调往第一三九步兵旅参谋部（属第七十步兵师），参加莫尔昂日战役，栋塔伊战斗中重伤，回后方疗养。1915年参加第二次阿图瓦战役，表现出色，获荣誉军团嘉奖。第三次阿图瓦战役中获团级嘉奖，因营救战友获集团军级嘉奖。1916年参加凡尔登战役，期间调往第十九步兵师参谋部。1917年4月参加香槟山战役。9月参加第二次凡尔登战役。1918年参加第三次埃纳河战役、第二次马恩河战役、第一次瓦兹河战役，获两次师级嘉奖。年末晋升少校。1919年参加贡比涅战役与第二次瓦兹河战役，再获荣誉军团嘉奖。支持停战。大战期间，获荣誉军团骑士勋章及军官勋章、战争十字勋章（饰棕榈叶、两枚银星、一枚铜星）。不支持政变。内战期间参加雷恩起义被俘。解放后调往第八十九步兵团。1924年晋升中校，调往安全代表下属的体育与军事训练处。1928年晋升上校，任第二十八步兵团团长。1930年调往国防委员会秘书处。1932年晋升准将，任第五步兵师师长，就读高等军事研究中心。1934年晋升少将，任安全代表参谋长。1936年初晋升中将。\n\n支持防御战术与大规模动员，对装甲兵的看法比较保守。\n\n性格开朗、积极进取、热于助人，喜欢亲力亲为，“始终具有无与伦比的热情与勇气”。支持共和社会主义-激进社会主义联盟，坚持共和主义。§!"

  FRA_jules_dumont:0 "朱尔·迪蒙"
  FRA_jules_dumont_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1888年1月1日，法兰西共和国、北部省鲁贝§!\n§Y背景：§!§L朱尔·约瑟夫·迪蒙，父亲是纺织工人。小学学历，入伍前是鞋匠。1909年应征入伍，参加第一祖阿夫步兵团，在摩洛哥和阿尔及利亚服役。1910年晋升下士。1911年晋升中士并退伍。1914年再度入伍，加入第八十四步兵团，晋升预备少尉，参加沙勒罗瓦战役、第一次吉斯战役、第一次马恩河战役、第一次埃纳河战役。1915年参加第一次香槟战役，获团级嘉奖；参加第一次沃尔夫河战役。后随队加入东方集团军。1915年末至1916年末先后在戈尔诺奇切沃、彼得罗沃、波利卡斯特罗、利乌姆尼察、法诺斯作战。是“鲁昂城”号的乘客，遭德军潜艇袭击，幸免于难。1917年晋升临时中尉，调任第一非洲行进团的祖阿夫部队，参加一二四八高地战役。1918年晋升临时上尉，参加多布罗波列战役，表现出色，获集团军级嘉奖与荣誉军团嘉奖。1919年转为职业中尉，在军中组织士兵委员会，参加塞洛尼卡大撤退。大战期间，获荣誉军团骑士勋章、战争十字勋章（饰铜棕榈叶、铜星）与摩洛哥纪念章。由于宣传反殖民思想，被军事法庭判处监禁，押送回国，被关于土伦。1920年土伦起义期间越狱，加入革命军，参加马赛起义、罗讷河谷战役与波尔多战役，晋升少校。1921年调回第八十四步兵团，任营长。1922年进入陆军高级指挥学校学习。1924年毕业，进入第三国际军事处，在北非活动，组织反殖民运动。1925年支持突尼斯大罢工，晋升中校。1928年回国，调往第一军区参谋部，晋升上校。1932年晋升准将，任军区参谋长。1935年晋升少将，任第一军区司令。\n\n支持大战经验，强调火力。支持军事正规化，也强调民兵在非正规战的作用。\n\n为人刚正、坚韧。坚定的联合工人党人，思想上融合了爱国主义与共产主义，珍惜士兵生命，有人道主义精神。§!"

  FRA_jacques_massu:0 "雅克·马絮"
  FRA_jules_dumont_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1888年1月1日，法兰西共和国、北部省鲁贝§!\n§Y背景：§!§L雅克·埃米尔·马絮，父亲是炮兵中校，1917年殉国；母亲出自司法世家，外祖父曾任最高法院法官。他是米歇尔·内伊元帅的曾侄孙。早年先后就读圣路易·德贡扎格中学、圣弗朗索瓦-德萨勒自由学院与拉弗莱什国立军事高中。1928年考入圣西尔军校，属列斐伏尔班。1930年毕业，晋升少尉，进入第十六步兵团服役。1932年调往第四十一步兵团，晋升中尉。1935年报名参加空降兵试验中心，接受新兴的空降兵训练。1936年初晋升上尉。\n\n对空降兵感兴趣。\n\n为人坦率、坚毅、忠诚。热爱军队。实用主义，为了国家利益可以不择手段。支持国家工团主义联盟。§!"

  FRA_pierre_billotte:0 "皮埃尔·比约特" 
  FRA_pierre_billotte_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_1$）\n§Y生于：§!§L1906年3月8日，法兰西共和国、塞纳省巴黎§!\n§Y背景：§!§L皮埃尔·阿尔芒·加斯东·比约特，父亲即陆军中将加斯东·比约特；母亲出自乡绅家庭，是家庭主妇。早年就读斯坦尼斯拉斯中学。1926年考入圣西尔军校，属德莱克吕兹班。1928年毕业，晋升少尉，进入第四十六步兵团。1930年晋升中尉。1931年考入陆军高级指挥学校。1933年毕业，进入陆军参谋部第一局工作。1935年自愿前往第四十一装甲营服役，晋升上尉。\n\n偏爱装甲作战。\n\n富有冒险精神，忠诚，敢于独立思考，强调实干。政治上支持新社会主义，与路易·瓦隆等人有往来。§!"

  FRA_gabriel_fort:0 "加布里埃尔·福尔"
  FRA_gabriel_fort_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1898年12月30日，法兰西共和国，罗讷省里昂§!"

  FRA_vital_gayman:0 "维塔尔·盖曼"
  FRA_vital_gayman_character_desc:0 "§Y隶属：§!$party_PCOP$（$PCOP_faction_1$）\n§Y生于：§!§L1897年2月4日，法兰西共和国，厄尔省乌什地区孔什§!"

  FRA_rene_cazala:0 "勒内·卡扎拉"
  FRA_rene_cazala_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1902年3月8日，法兰西共和国，阿尔及尔省阿尔及尔§!"

  FRA_louis_leon_landsoght:0 "路易·莱昂·朗德索格"
  FRA_louis_leon_landsoght_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1900年11月18日，法兰西共和国，塞纳省圣旺§!"

  #海军
  FRA_edouard_peisson:0 "爱德华·佩松"
  FRA_edouard_peisson_character_desc:0 "§Y隶属：§!$party_PCOP$（$PCOP_faction_1$）\n§Y生于：§!§L1877年11月22日，法兰西共和国、科西嘉省巴斯蒂亚§!\n§Y背景：§!§L爱德华·佩松，父亲是马里于斯·佩松：记者，笔名奥德斯·里奇蒙，为《小马赛人报》撰稿，还是奥克语协会成员。母亲是农民。早年就读圣约瑟夫学校，热衷海洋小说。初中毕业后，经朋友帮助成为海员。先后为帕特航运公司与跨大西洋航运公司工作。1914年3月成为“圣母号”汽船水手并准备考入马赛水文学校，因大战爆发作废，不得已继续任职“圣母号”，工作于地中海航线。1916年4月考取无线电报务员资格证，调任“西迪·布拉欣号”邮轮报务员。7月调往“白银号”货船，工作于白海航线。1917年8月调往“参宿七号”货船，工作于跨大西洋航线。1918年8月调往“拉莫里西埃号”邮轮，工作于地中海航线。大战期间一直自学。1919年9月考取远洋船长资格证，成为“吕内维尔号”风帆货船船长，航行于地中海航线。同情左翼。内战爆发后，从阿尔及尔出发，突破白海军围剿与暴风雨阻击，成功抵达马赛，加入革命，转为海军中尉，任“短剑号”驱逐舰航海长。1922年晋升上尉，任“盾牌号”驱逐舰副舰长。1923年考入海军高级指挥学校，1924年毕业，任“暴风雪号”驱逐舰舰长。1926年晋升少校，任“雷恩号”巡洋舰航海长。1928年调任第二舰队训练支队参谋长。1930年，晋升中校。1931年任“马赛号”巡洋舰舰长。1934年任“巴黎公社号”战列舰舰长，晋升上校。\n\n商船队出身，没有明显的军事倾向。\n\n为人朴实、克制、敏感、忠诚，关心底层官兵待遇。热爱写作，是法国新一代海洋作家的代表，著作有《白海信使》《水手汉斯》《从利物浦起航》。坚持现实主义，与超现实主义者有矛盾。政治上支持工农共产党。§!"

  FRA_francois_darlan:0 "弗朗索瓦·达尔朗"
  FRA_francois_darlan_character_desc:0 "§Y生于：§!§L1881年8月7日；法兰西共和国、洛特-加龙省内拉克§!\n§Y背景：§!§L让·路易·格扎维尔·弗朗索瓦·达尔朗，航海世家，祖先曾参加特拉法加战役，但父亲让-巴蒂斯特是律师，进步联盟党员，曾任梅林内阁司法部长。早年就读巴黎圣路易高中。1899年考入布雷斯特海军学校。1901年毕业，成为见习军官，在“迪盖-特鲁安号”训练舰实习。次年前往远东舰队，先后在“比若号”与“蒙卡尔姆号”巡洋舰服役。1904年晋升少尉。1905年进入土伦炮术学校学习，成绩优异。1906年毕业，再赴远东舰队，服役于“当特勒卡斯托号”巡洋舰。曾乘帆船游遍长江，晋升中尉。1908年回国，任“羚羊号”训练舰教官。1911年任“瓦尔德克-卢梭号”装甲巡洋舰炮术长。1912年晋升上尉，调往“圣女贞德号”装甲巡洋舰任教官。1914年任职于第一海军炮兵团，参加边境战役与南锡战役。1916年短暂调往东方集团军，回国后参加第一次凡尔登战役与第一次索姆河战役。1917年负责管理第一集团军的海军炮兵；参加贵妇小径战役和马尔迈松战役。1918年参加第二次皮卡第战役与第一次瓦兹河战役。1919年参加贡比涅战役与第二次瓦兹河战役，晋升少校。大战期间，获荣誉军团骑士勋章与战争十字勋章（饰铜棕榈叶）。战后指挥马恩河舰队。1920年2月起义，参加特鲁瓦战役与巴黎战役，晋升中校。1921年任第一舰队第三支队参谋长，次年晋升上校。1924就读海军高级指挥学校，1925年毕业，任国防委员会秘书处主任，晋升少将。1927年任第一舰队第一支队司令。1930年晋升中将，任第二舰队司令。1933年任海军参谋长。\n\n由于法国的资源紧缺与工业能力不足，他倾向于绿水学派，强调驱逐舰与潜艇。但本质是实用主义，如果允许，他仍追求一支以战列舰为主力的均衡舰队。\n\n为人富有荣誉感、善于审时度势、热爱海军，有反英倾向，追求海军战略自主。政治上亲近共和主义与世俗主义，长期倾向于激进共和联盟，但也与其他党派有联系。他的政治忠诚与党派能否实现其海军愿景相关。§!"

  FRA_gabriel_auphan:0 "加布里埃尔·奥方"
  FRA_gabriel_auphan_admiral_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1894年11月4日；法兰西共和国、加尔省阿莱斯§!\n§Y背景：§!§L加布里埃尔·阿德里安·约瑟夫·保罗·奥方，父亲是罗什贝勒煤矿公司秘书长与市镇户籍官，母亲一家军政背景浓厚，他是若阿基姆·德罗克布吕讷少将的曾外孙。此外，他家有“萨尔兹与拉努韦尔领主”头衔。早年就读巴黎圣路易高中。1911年考入布雷斯特海军学校，1914年10月晋升少尉，分配至“圣女贞德号”装甲巡洋舰。1915年4月参加达达尼尔海峡战役。9月调往鲁阿德岛（黎凡特）的海军情报站，负责建立线人网络。1916年8月任“劳工号”通报舰副舰长，侦察奥斯曼沿海情报，晋升中尉。1917年9月调任“勒威耶号”潜艇副舰长，活动于亚得里亚海。大战中获荣誉军团骑士勋章与战争十字勋章（饰两枚铜星）。反对停战。1919年8月借调至海军情报局，在意大利活动，晋升上尉。1920年1月回国，任“勒威耶号”潜艇舰长，在土伦起义中，支持白军，撤往布雷斯特。南特战役中被俘。1922年初加入革命，6月调往海军总参谋部，参与鲨鱼级潜艇建造计划。1923年进入海军高级指挥学校学习。1924年毕业后任“富尔顿号”潜艇舰长。1925年晋升少校，调入国防委员会海军处，参与设计公社海军十年规划。1927年晋升中校，任“路易·米歇尔号”驱逐舰舰长。1930年任第二舰队训练支队司令。1931年任布雷斯特海军学校教务长。1933年晋升上校，任“雷恩号”巡洋舰舰长。1935年任第二舰队第三支队司令。\n\n重视潜艇，提倡“群化突击”：以多艘潜艇对敌海上交通线饱和式打击。\n\n为人虔诚、严格、务实、生活俭朴、爱兵如子，对于信念坚定不移。政治上支持国家工团主义联盟，也是达尔朗的朋友之一。§!"

  FRA_philippe_auboyneau:0 "菲利普·奥布瓦诺"
  FRA_philippe_auboyneau_character_desc:0 "§Y生于：§!§L1899年11月9日；奥斯曼帝国、科斯坦丁尼耶维拉耶君士坦丁堡§!\n§Y背景：§!§L菲利普·马里·约瑟夫·雷蒙德·奥布瓦诺，祖籍下夏朗德省；出自金融世家，父亲是加斯东·奥布瓦诺，奥斯曼帝国银行行长。母亲是热尔梅娜·德拉莫特-安戈·德弗莱尔，诺曼底贵族。童年生活于君士坦丁堡，早年就读巴黎卡诺中学。1917年中考入布雷斯特海军学校。1918年初毕业，晋升少尉，分配至“台风号”鱼雷艇，在拉芒什海峡巡逻。1920年初参加勒阿弗尔起义，随后参加科唐坦战役与布雷斯特起义，晋升中尉。1922年调往“圣女贞德号”训练舰，学习远洋航行。1923年毕业，晋升上尉，任“杜诺瓦号”巡洋舰鱼雷长。期间进修鱼雷课程。1925年进入海军高级指挥学校学习。1926年毕业，晋升少校。调入第三国际地区处，在越南和中国活动。1931年回国，任第二舰队鱼雷支队参谋长，晋升中校。1935年晋升上校，任第二舰队副参谋长。\n\n支持均衡舰队。\n\n为人冷静、克己、谦虚、务实，擅长沟通、爱兵如子。坚持政治中立。§!"

  FRA_raoul_castex:0 "拉乌尔·卡斯泰"
  FRA_raoul_castex_character_desc:0 "§Y生于：§!§L1878年10月27日；法兰西共和国、加莱海峡省圣奥梅尔§!§Y背景：§!§L拉乌尔·维克托·帕特里斯·卡斯泰，祖籍科曼日。父亲是陆军少将夏尔·卡斯泰。母亲是弗拉芒人。早年就读罗什福尔海军中学，成绩优异。1896年考入布雷斯特海军学校，1898年毕业，成为见习军官，任职于“布伦努斯号”战列舰。1900年调往“大篷车号”运输船，于中国服役，晋升少尉，获中国远征纪念章。遭遇险情表现出色，获部长嘉奖。1901年调往“圣路易号”战列舰。1902年在“孟加拉人号”服役。1904年调往海军部，任部长副官兼领航学校教官，晋升中尉。1905年卸任副官。1907年调回海军部，晋升上尉。1910年任布雷斯特锅炉学校校长并指挥“海盗号”鱼雷艇。1912年进入土伦炮术学校学习，获荣誉军团骑士勋章。1913年毕业，就读海军高级指挥学校。1914年初借调至战争部；毕业。调往“丹东号”战列舰服役，很快调往“孔多塞号”战列舰服役。1915年任东方集团军联络官。1916年指挥“天狼星号”护卫舰。1917年调回海军部，晋升少校。1918年调往第五海区航空处，晋升中校。大战期间，获战争十字勋章（饰铜棕榈叶）。停战后，组建海军历史处，任海军高级指挥学校与巴黎高级指挥学校的教官，获荣誉军团军官勋章。不支持政变。1920年1月至4月在海军高级指挥学校工作，4月末出任“让·巴尔号”战列舰长，晋升上校。布雷斯特水兵起义后支持革命。1922年任海军总参谋部第三局局长与海军高级指挥学校校长。1923年晋升少将。1926年晋升中将，任布雷斯特海区司令。1929年任海军参谋长。1933年任海军监察长，晋升上将。\n\n公认的大战略家，不同于马汉，卡斯泰并不热衷于战略决战与存在舰队理论。提倡相对海权，借由控制海上交通线与政治经济的联合实现制海权。强调总体战，海军服务于国家整体战略。重视潜艇作用，但并不盲信绿水学派。为建立海军参谋体制有很大贡献。\n\n为人正直、严谨、自律、直言不讳，是学者型军官。受母亲早逝影响，至今未婚。支持黄祸论，警惕东亚国家的崛起，如中国和日本。坚持政治中立，反对海军内部的党派斗争。§!"

  FRA_andre_georges_lemmonier:0 "安德烈-乔治·勒莫尼耶"
  FRA_andre_georges_lemmonier_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1896年2月24日；法兰西共和国、北滨海省甘冈§!\n§Y背景：§!§L安德烈-乔治·勒莫尼耶，父亲是步兵军官，母亲是地主。早年就读瑟堡中学与圣夏尔学校，完成商船船员预科。1913年以第一名考入布雷斯特海军学校。1914年紧急毕业，成为见习军官，分配至第三舰队的“光荣号”装甲巡洋舰。1915年3月调至第一舰队的“圣女贞德号”装甲巡洋舰，参加达达尼尔海峡战役。1916年2月调往“祖国号”战列舰，晋升少尉。后调往东方集团军第三海军陆战炮兵连，任连长。1917年5月，先在前线表现出色获师级嘉奖；后在“山西号”船难中营救落水船员，再获师级嘉奖与荣誉军团嘉奖，晋升中尉。先后任“仙女座号”通报舰、“伊斯号”通报舰副舰长。1918年任“阿基米德号”潜艇舰长。大战期间获荣誉军团骑士勋章、战争十字勋章（饰两枚银星）、东方纪念章、达达尼尔海峡纪念章。1920年任“杜布尔迪厄号”炮艇艇长，晋升上尉。内战期间支持白军，先后参与镇压土伦起义与马赛起义。内战末期，因全舰官兵拒绝离法而加入革命。1922年任“霜月号”潜艇舰长。1924年进入海军高级指挥学校学习。1925年又以第一名毕业，晋升少校，任“暴风雪号”驱逐舰副舰长。1927年调任“里昂号”巡洋舰副舰长。1929年晋升中校，调往第二海区参谋部。1932年任“巴黎公社号”副舰长。1935年任“鲍狄埃号”航空母舰舰长，晋升上校。\n\n曾在多种战舰服役，强调防空、反潜与航空母舰的重要性。\n\n为人冷静、克制、擅长沟通。支持国家工团主义联盟。§!"

  FRA_paul_ortoli:0 "保罗·奥尔托利"
  FRA_paul_ortoli_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_1$）\n§Y生于：§!§L1900年9月19日；法兰西共和国、科西嘉省巴斯蒂亚§!\n§Y背景：§!§L保罗·安热·菲利普·奥尔托利，父亲是公务员，历任科特区长、里永财政局局长等。早年就读里永中学。1919年考入布雷斯特海军学校。1920年参加布雷斯特水兵起义。1921年登上“圣女贞德号”巡洋舰实习。1922年成为见习军官，分配至“贝蒂纳号”通报舰。1923年晋升少尉。1924年前往土伦炮术学校学习。1925年毕业，调往“风暴号”驱逐舰，晋升中尉，任炮术长。1927年调任“伽拉忒亚号”潜艇舰长。1928年晋升上尉，调往第三国际军事处，前往印度支那活动，结识萨兰。1932年回国，任“马赛号”巡洋舰炮术长，晋升少校。1934年进入海军高级指挥学校学习。1935年毕业，任第一舰队训练支队参谋长，晋升中校。\n\n支持轻型舰队。\n\n为人温和、严谨、果断，极富亲和力。政治上支持法国社会党。§!"

  FRA_louis_de_villefosse:0 "路易·德·维尔福斯"
  FRA_louis_de_villefosse_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1900年4月14日；法兰西共和国、塞纳省巴黎§!\n§Y背景：§!§L洛朗·安托万·马里·路易·埃龙·德·维尔福斯，出自贵族世家，父亲是法学博士，司法部办公室副主任。母亲也是巴黎名门。早年就读圣路易中学。1918年考入布雷斯特海军学校。1920年毕业，获海军陆战证书，成为见习军官。内战期间支持白军，调入第一海军陆战炮兵团，参与镇压雷恩起义、巴黎战役，4月末在阿让唐被俘。1921年获释，留在军队，调往洛里昂海军陆战学校任助教。1923年晋升少尉，调任“埃尔贝准尉号”驱逐舰军需值星官。1924年调任“蒙卡尔姆号”巡洋舰纠察值星官。1925年晋升中尉，任纠察长。1927年晋升上尉，考入海军高级指挥学校。1928年毕业，调任“诺曼底号”战列舰纠察长。1930年晋升少校。1933年任“马赛号”巡洋舰副舰长。1935年晋升中校，任舰长。\n\n海军陆战队出身，研究两栖作战与多军种联合行动。\n\n为人博学、真诚、坚定、始终自我反思。早年受家庭与莫拉斯影响，是保皇主义者。内战后又支持索雷尔主义。1926年与工人党员雅尼娜·布伊苏努斯结婚，受其影响，又逐渐支持联合工人党。通过其妻子，与安德烈·布勒东、乔治·马尔罗等超现实主义圈子有联系。他也对历史感兴趣，与妻子著有一些历史著作。此外，也是米瑟利耶的朋友。§!"

  FRA_raymond_moullec:0 "雷蒙·穆莱克"
  FRA_raymond_moullec_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1901年3月21日；法兰西共和国、菲尼斯泰尔省布雷斯特§!\n§Y背景：§!§L雷蒙·西蒙·约瑟夫·马里·穆莱克，父亲是海军准尉，获荣誉军团骑士勋章。早年就读布雷斯特中学。1919年考入布雷斯特海军学校。支持停战，反对政变。1920年5月参加布雷斯特起义。1921年毕业，获炮兵军官资质。调往驱逐舰服役，晋升少尉。1923年调往“布列塔尼号”战列舰服役，结识米瑟利耶，晋升中尉。1925年调往第三国际军事处，支援英国革命。1926年兼任海军参谋部第二局参谋科员，调往意大利，晋升上尉。1930年调往西班牙任武官。1931年五月革命期间曾帮助挪威外交官回国，获挪威圣奥拉夫勋章。随后回国就读海军高级指挥学校，晋升少校。1934年毕业，任第二局副局长。1936年初转正，晋升中校。\n\n虽是海军军官，但不喜欢海上执勤，对情报分析、地缘政治与外国语言感兴趣，是公认的情报专家。\n\n为人坚定、忠于理想、敢于冒险、擅长幕后操作。早年支持激进党，革命以后逐渐左倾，最终支持工人党，与安德烈·马蒂交好，也是米瑟利耶的朋友。§!"

  FRA_robert_jaujard:0 "罗贝特·若雅尔"
  FRA_robert_jaujard_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1896年3月6日；法兰西共和国、德塞夫勒省圣马丁-德圣迈克桑§!\n§Y背景：§!§L罗伯特·若雅尔，祖籍吉伦特省大圣富瓦，父亲是随军牧师，信仰加尔文宗。1908年随家搬往布雷斯特。早年就读布雷斯特高中。1914年8月入伍，为“迪盖-特鲁安号”巡洋舰列兵，表现出色。1915年3月转任“圣女贞德号”装甲巡洋舰，晋升下士。9月进入布雷斯特海军学校学习。1916年4月1日毕业，成为见习军官，调往第一舰队的“埃尔贝准尉号”鱼雷舰。1917年1月晋升少尉，调往“孔多塞号”战列舰。1918年4月晋升中尉，调往“波蒂奥号”训练舰。1919年调往“洛林号”战列舰。1920年初随“洛林号”镇压勒阿弗尔起义、参加瑟堡战役。1920年5月初，拒绝前往阿尔及利亚，脱离军队，布雷斯特解放后参加革命。1921年调往“羚羊号”训练舰副舰长，晋升上尉。1923年调往第三海区参谋部，晋升少校。1926年调任“埃德加·基内号”装甲巡洋舰副舰长，晋升中校。1930年任“凡尔登”驱逐舰舰长。1931年，任“马恩河号”驱逐舰舰长。1932年任“土伦号”巡洋舰舰长，晋升上校。1935年监督“十月革命号”战列舰完工，晋升少将。1936年初任“十月革命号”战列舰舰长兼第一舰队参谋长。\n\n服役于多种舰船，支持均衡舰队理论。\n\n为人严谨、务实、擅长合作。支持共和青年同盟。§!"

  FRA_marcel_gensoul:0 "马塞尔·让苏尔"
  FRA_marcel_gensoul_character_desc:0 "§Y生于：§!§L1880年10月12日；法兰西共和国、埃罗省蒙彼利埃§!\n§Y背景：§!§L马赛尔·布律诺·让苏尔，父亲是当地副检察官。早年就读让松·德萨伊中学。1898年考入布雷斯特海军学校，物化英成绩优异，与达尔朗同期。1900年毕业，成为见习军官，在“迪盖-特鲁安号”号实习。次年分配至南海的“沙瑟卢-洛巴号”巡洋舰。获中国远征纪念章。1902年调入“可畏号”战列舰与“惊喜号”炮艇。1903年10月晋升少尉，进入洛里昂海军陆战步兵学校学习。1905年12月任“阿尔及利亚人号”潜艇的副舰长。之后调入地中海舰队的“卡诺号”战列舰，任炮术长助理。1907年进入土伦鱼雷军官学校学习。1908年8月毕业，进入“伽利略号”巡洋舰，参加摩洛哥战役，获摩洛哥战役纪念章（饰卡萨布兰卡扣），表现出色，晋升中尉。1909年11月任“马尔索号”战列舰的鱼雷教官。1911年1月晋升上尉。任“当特勒卡斯托号”巡洋舰教官。1913年8月任地中海训练支队司令副官。1914年调往“共和国号”战列舰，担任鱼雷及电气长，获荣誉军团骑士勋章。8月参加安提瓦里海战。1915年起在希腊服役，参与战列舰维护。1917年5月指挥“号角号”鱼雷艇，在黎凡特作战。1919年6月晋升少校，任地中海训练支队司令副官。对政变不置可否，但支持白军。土伦起义期间，临时担任“让·巴尔号”副舰长，掩护地中海海区司令部撤离。参加罗讷河谷战役、波尔多战役，布雷斯特起义期间投降，随后加入革命。1922年成为地中海舰队训练支队参谋长。1924年晋升中校，任第二海区司令部副参谋长。1925年指挥第六巡逻中队。1926年任“孤拔号”战列舰副舰长。1928年进入海军高级指挥学校学习。1929年毕业，晋升上校，任第三舰队参谋长。1932年10月晋升少将，任海军参谋部副参谋长。1935年晋升中将，任第二舰队司令。\n\n擅长电气、鱼雷和操舰，是优秀的技术专家。\n\n为人矜持、冷淡、尽职尽责、富有荣誉感。受达尔朗器重。坚持政治中立，亲近英国。§!"

  FRA_emile_muselier:0 "埃米尔·米瑟利耶"
  FRA_emile_muselier_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1882年4月17日；法兰西共和国、罗讷河口省马赛§!\n§Y背景：§!§L埃米尔·亨利·德西雷·米瑟利耶，父亲是退伍军人，参加过意大利战役（意称第二次独立战争），后为邮政督察；母亲是教师。早年就读马赛高中和土伦圣母会学校。1899年考入布雷斯特海军学校，结识达尔朗。1901年毕业，成为见习军官，参加实习。1903年前往远东舰队，先后在“蒙卡尔姆号”“孟加拉人号”和“彗星号”服役，参加印度支那水文测量任务。1904年晋升少尉。1906年进入土伦炮术学院学习。1907年服役于“圣路易号”战列舰。1908年服役于“波蒂奥号”，晋升中尉。1909年服役于“卡诺号”战列舰。1911年任土伦炮术学校教官。1912年晋升上尉，任“埃德加·基内号”炮术长。大战爆发后，在亚得里亚海服役。1915年5月调往第一海军陆战步枪团，任连长，尼乌波尔特战役中表现出色。12月调往海军炮兵营，在洛林、香槟和伊泽尔河地区服役。1916年8月调任国家科研秘书处海军科科长，参与研制各类反潜武器，并随“塞内冈比亚号”进行反潜战。1918年4月任“斯卡尔普号”通讯舰舰长。7月晋升少校，在大西洋活动。大战期间，获荣誉军团骑士勋章和战争十字勋章（饰铜棕榈叶）。不支持政变。内战初支持白军，曾劝说舰上水兵停止起义。此后思想逐渐左倾。1920年5月参加布雷斯特水兵起义。1922年晋升中校，指挥装甲巡洋舰“欧内斯特·勒南号”。1924年指挥“布列塔尼号”战列舰。1926年晋升上校，就读海军高级指挥学校。1927年调任第二舰队第一支队参谋长。1930年晋升少将，调任第一舰队参谋长。1933年调任第一舰队司令，晋升中将。\n\n重视技术创新与轻型舰队，强调奇袭。\n\n为人大胆、强硬、务实且骄傲。支持共和社会主义-激进社会主义联盟，与皮埃尔·孟戴斯-弗朗斯关系良好。吸食鸦片。曾是达尔朗的朋友，但因政见不合而日渐疏远。§!"

  FRA_charles_platon:0 "夏尔·普拉东"
  FRA_charles_platon_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1886年9月19日；法兰西共和国、吉伦特省皮若勒§!\n§Y背景：§!§L夏尔·让·纪尧姆·普拉东，父亲是法学家乔治·普拉东，新教徒、波尔多大学法律图书馆管理员。母亲是波尔多女子师范学校校长。早年就读波尔多中学。1904年考入布雷斯特海军学校。1906年毕业，参加实习。1907年成为见习军官，任职于北方舰队的“莱昂-甘必大号”装甲巡洋舰。1909年晋升少尉。1911年调任“维克多·雨果号”装甲巡洋舰。1912年，在土伦鱼雷军官学校学习。1913年毕业，任“芽月号”潜艇副舰长，隶属海峡舰队，晋升中尉。大战爆发后，随潜艇驻扎于英国朴茨茅次。1915年后在拉芒什海峡与比斯开湾巡逻。在雷岛巡逻时遭水雷袭击，船体严重损伤，但在全舰官兵积极抢修下，安全返回罗什福尔。1917年3月晋升上尉，10月调任“闪山云号”潜艇舰长，隶属爱琴海舰队，驻于穆兹罗斯。大战期间，获荣誉军团骑士勋章与战争十字勋章（饰铜棕榈叶）。对政变不置可否。内战爆发时，正在土伦检修“闪山云号”，土伦起义后离开军队。1922年被征召，就读海军高级指挥学校。1923年毕业，任海峡舰队第一潜艇支队参谋长。1926年晋升中校，调任第三海区参谋部。1929年任海军参谋部第三处处长。1931年晋升上校，任海军高级指挥学校教务长。1934年晋升少将，任第三舰队司令。\n\n长期服役于潜艇部队，重视潜艇。\n\n为人冷淡、严格、追求绝对性。支持国家工团主义联盟，但对议会制不感兴趣。支持威权社会、强调家庭、传统的重要性。§!"



  #空军
  FRA_martial_henri_valin:0 "马夏尔·亨利·瓦兰"
  FRA_martial_henri_valin_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1898年3月14日；法兰西共和国、上维埃纳省利摩日§!\n§Y背景：§!§L马夏尔·亨利·瓦兰，父亲是批发商。早年就读利摩日的盖－吕萨克中学。大战爆发后曾志愿入伍，经父亲劝说，转而备考圣西尔军校。1917年4月被征召至第四龙骑兵团，同时又通过圣西尔军校考试。5月入校学习，属圣奥黛丽班。1918年2月毕业，选择骑兵专业，成为见习军官，分配至第三非洲猎骑兵团，参加第二次皮卡第战役、第一次利斯河战役、第三次埃纳河战役。期间自愿充当传令兵，获团级嘉奖；被借调至第五胸甲骑兵团；因毒气负伤，留下呼吸不畅与心脏紊乱的后遗症。1919年参加贡比涅战役、克莱蒙战役、第二次瓦兹河战役，再获团级嘉奖，晋升少尉。大战期间，获战争十字勋章（饰两枚铜星）。战后调往第十六龙骑兵团，返回圣西尔军校学习。1920年1月返回原部队，参与镇压里昂起义、特鲁瓦战役期间起义。1921年前往索米尔骑兵学校学习。1922年毕业，分配至第四骠骑兵团，晋升中尉。1924年志愿加入航空兵，进入阿沃尔航空学校学习。1925年获空中侦察员与军事飞行员资质，分配至第二十二夜间轰炸联队。1927年任第一中队长，晋升上尉。1930年就读空军高级指挥学校。1931年毕业，晋升少校，调往第十二航空旅参谋部。1935年调往空军参谋部第三处教学科，晋升中校。\n\n擅长盲飞，专职夜间轰炸。\n\n为人正直、务实、克己、极其严谨，喜欢亲力亲为，常随机组出航。政治上支持国家工团主义联盟。§!"

  FRA_maryse_bastie:0 "玛丽斯·巴斯蒂埃"
  FRA_maryse_bastie_character_desc:0 "§Y隶属：§!$party_PCOP$（$PCOP_faction_2$）\n§Y生于：§!§L1898年2月27日；法兰西共和国、上维埃纳省利摩日§!\n§Y背景：§!§L玛丽斯·巴斯蒂埃，本名玛丽-路易斯·邦贝克。父亲是铸铁工，母亲是家庭主妇。玛丽斯成绩优秀，从小对机械感兴趣。11岁时父亲去世，13岁辍学，在鞋厂任皮革缝纫工。因学习小提琴而结识瓷器装饰工让-巴斯蒂特·古兰沙，双方于1915年迅速结婚。育有一子。但因性格不合、经济困难和家庭变故，很快分居。随后参与“战争教母运动”（鼓励后方女性同前线官兵的书信联系），结识歼击机飞行员路易·巴斯蒂埃。1919年任利摩日电力公司秘书兼打字员。1920年末与古兰沙离婚。此时路易·巴斯蒂埃经常起降于利摩日，受其影响，玛丽斯热衷于飞行并与之相爱，双方于1922年5月结婚。随后于干邑经营鞋店。在丈夫帮助下，1925年于波尔多-梅里尼亚克机场获飞行员资质。驾驶飞机穿过波尔多转运桥的空中缆绳，轰动地方，留校任教官。次年丈夫遇难。1927年移居巴黎，从事特技飞行与空中体验。1928年7月，在飞行员莫里斯·德鲁安帮助下，创造1058公里的女性飞行记录。1929年7月飞行26小时47分30秒，创造女性单人耐力飞行世界纪录。次年以37小时55分的时间击败对手莱娜·伯恩施坦，捍卫世界纪录。1931年由勒布尔热飞往俄国尤里诺，飞行距离2976.31公里，飞行时长30小时30分钟，再次创造世界纪录，获哈蒙奖杯。因其出色表现，受夏尔·蒂永提议，进入空军服役，晋升中尉，任阿沃尔机场教官。1933年晋升上尉，调往空军参谋部，任航空卫生科科长。1935年晋升少校，任特种飞行处处长。\n\n擅长耐力飞行与盲飞。\n\n为人坚韧顽强、冷峻且极度自律。热衷于妇女权利与女性航空事业，支持组建女性航空队。政治上支持工农共产党，但主要集中于女性权利。§!"

  FRA_jean_francois_jannekeyn:0 "让-弗朗索瓦·雅内肯"
  FRA_jean_francois_jannekeyn_character_desc:0 "§Y生于：§!§L1892年11月16日；法兰西共和国、北部省康布雷§!\n§Y背景：§!§L让-弗朗索瓦·雅内肯，父亲是现役士官，后晋升为行政军官。1911年考入圣西尔军校，属玛丽·路易丝新兵班，成绩中游。在第二十八龙骑兵团服役一年。1913年毕业，晋升少尉，分配至第六龙骑兵团。随后前往索米尔骑兵学校学习。大战爆发后归队，任第二半团的排长。参加罗西尼奥尔战役与第一次弗兰德斯战役，年末晋升中尉。1915年在蒙迪迪埃、阿图瓦和罗克兰库尔活动。1916年初在贡比涅活动。6月调往第四步行胸甲骑兵团，在奎内维耶尔和皮伊萨莱讷战斗。1917年4月参加贵妇小径战役。厌倦堑壕战，5月志愿加入航空兵，在勒克罗图瓦航空基地学习，7月获飞行资质。随后在阿沃尔航空基地、克莱蒙费朗航空基地学习，11月调往第一三二中队，参与对阿尔特基什、坦恩、盖布维莱尔、阿拉尔蒙、明斯特、鲁法赫和鲁法赫等地的轰炸行动。1918年5月成为中队长，在亚眠、克莱蒙圣茹斯特、布勒特伊和哈姆地区活动。随后参与了第二次马恩河战役、第四次香槟战役、第一次瓦兹河战役，晋升上尉。同欧仁·魏斯曼一起，于8月22日击落第一架敌机，随后于9月14日击落四架敌机，成为王牌飞行员。1919年在瓦兹河地区活动，参与春季攻势和第二次瓦兹河战役，7月参与圣米耶勒战役，全年击落七架敌机。大战期间，共击落十二架敌机，获荣誉军团骑士勋章与战争十字勋章（饰六枚铜棕榈叶、金星、银星和铜星）。战后调入陆军航空局第四处。反对政变，但内战期间仍支持白军，巴黎解放后离开军队，靠教授击剑糊口。1923年被征召，调回航空局第四处，晋升少校。1925年晋升中校，任处长。1928年调任第十一轰炸航空团团长，晋升上校。1930年调往第四航空区任参谋长。1931年调往空军参谋部，任助理参谋长兼轰炸机监察长，晋升准将，\n\n思想保守，坚持一战传统，重视对地支援。深耕航空工业与空军后勤，反对中型多用途战机计划。\n\n为人低调、务实、有原则、富有荣誉感，是技术型军官。坚持政治中立，强调空军内部的团结。§!"

  FRA_alfred_heurtaux:0 "阿尔弗雷德·赫尔托"
  FRA_alfred_heurtaux_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_2$）\n§Y生于：§!§L1893年5月20日；法兰西共和国、下卢瓦尔省南特§!\n§Y背景：§!§L阿尔弗雷德·马里·约瑟夫·赫尔托，父亲是炮兵少校，毕业于巴黎综合理工学院。母亲出自医生世家，财产丰厚。早年生活于雷恩和瓦讷，就读圣弗朗索瓦-沙维尔中学。1912年考入圣西尔军校，属蒙米拉伊班，在第四骠骑兵团实习一年。1914年毕业，分配至第九骠骑兵团。大战爆发后，参加孚日山脉战役与第一次弗兰德斯战役，表现出色，获三次嘉奖，负伤。后志愿转为航空兵，12月6日前往波城军事航空兵学校学习空中侦察，结识乔治·吉内梅。1915年初任第二十六中队侦察员，活动于弗兰德斯。4月获飞行员资质，分配至第三十八中队，参加第二次香槟战役，进行侦察工作，晋升中尉。1916年6月因首次战果未获确认，与上级矛盾激化，调往第三中队，参加索姆河战役。此后战果频出，8月成为王牌飞行员，9月25日击落德军王牌飞行员库尔特·温特根斯，10月主持组建第十二战斗机大队，11月成为中队长，至年末已击落十六架敌机。1917年晋升临时上尉，5月参加贵妇小径战役、7月参加第二次弗兰德斯战役。9月23日试飞SPAD XIII歼击机时坠机，左大腿重伤，失去驾驶能力，回后方疗养。至此已击落二十一架敌机。康复后，进入宣传与考察使团，访问英国、意大利等。1918年4月19日转为正式上尉。大战期间，获荣誉军团军官勋章与战争十字勋章（饰十六枚铜棕榈叶）。1919年8月，调往航空国务秘书办公室工作。支持索雷尔主义，内战爆发后参加革命，组建航空局，建立红色空军，加入革命士兵军团。1921年任陆军航空局副局长，晋升少校。1924年晋升中校，就读陆军高级指挥学校。1925年毕业，任沙隆飞行学校校长，主管政治与行政。1928年晋升上校，任第二航空区参谋长。1930年晋升准将，任第二航空区司令。1932年晋升少将，任空军参谋部副参谋长兼轰炸机监察长。\n\n战斗风格激进，喜欢近距离击伤敌机。强调大编制协同作战。极其反对多用途战机计划。\n\n为人脾气火爆、坚韧不拔、道德高尚、具有天生的领导力。政治上支持社会党，反感议会制。§!"

  FRA_georges_guynemer:0 "乔治·吉内梅"
  FRA_georges_guynemer_character_desc:0 "§Y隶属：§!$party_CNS$（$CNS_faction_1$）\n§Y生于：§!§L1894年12月24日；法兰西共和国、塞纳省巴黎§!\n§Y背景：§!§L乔治·马里·卢多维克·朱尔·吉内梅，父亲是退役上尉，母亲是诺曼底贵族，祖上是路易十四。家境优渥，童年生活于勒蒂伊的家族庄园中，后迁居贡比涅。早年就读斯坦尼斯拉斯学院，成绩优异。多病。曾报考巴黎综合理工学院，因身体原因作废。大战爆发后参军遭拒。在父亲帮助下，11月以机械学员身份进入波城军事航空学校。刻苦学习，天赋极佳。结识厄尔托。1月21日，因戴黑纱悼念路易十六，获校长同情，同意其转为飞行员。5月毕业，晋升下士，分配至第三中队，活动于阿图瓦和香槟。7月首次击落敌机，获军事勋章，晋升中士。年末获荣誉军团嘉奖。1916年2月击落第五架战机，成为王牌飞行员，晋升少尉。3月参加凡尔登战役，6月参加索姆河战役。年末晋升中尉。至1917年1月末已击落三十架敌机。2月晋升上尉。4月参加贵妇小径战役，1917年5月创造一日击落四架敌机的成绩，突破四十大关。7月参与研制SPAD S.XII型歼击机并突破五十大关。随后参加第二次弗兰德斯战役。长期精神状态不佳，飞行疲劳日益严重并确诊肺结核，但拒绝休假。9月11日被击落，奇迹生还并强制休假，送往昂热维尔城堡疗养院疗养。1919年5月逃回前线，参加第二次瓦兹河战役，后送至瑞士莱森疗养。大战期间，共执行六百余次任务，击落六十余架敌机，获荣誉军团军官级勋章、军事勋章与战争十字勋章（饰二十七枚铜棕榈叶），是全法第二王牌飞行员。1922年接受人工气胸疗法，在家静养。1924年重返军队，任陆军航空局训练处处长兼管阿沃尔飞行基地，晋升少校。1926年任第一歼击机大队队长，晋升中校。1929年任第四航空旅旅长，晋升上校。均主管地面战术。1932年任第三航空区司令，晋升准将。1935年任歼击机监察长，晋升少将。\n\n战斗风格极其激进，强调进攻至上、近距离开火与大口径武器。支持一支高速度、小巧灵活的进攻型空军。\n\n为人内敛、真诚、纯真、慷慨、有担当、完美主义。对战斗极其狂热。极受欢迎。曾深陷航空神经症。政治上是保皇派，支持国家工团主义联盟。§!"

  FRA_victor_leon_ernest_denain:0 "维克托·莱昂·埃内斯特·德南"
  FRA_victor_leon_ernest_denain_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1880年11月6日；法兰西共和国、朗德省达克斯§!\n§Y背景：§!§L维克托·莱昂·埃内斯特·德南，祖籍巴黎。父亲是爱德华·德南，军医行政官，早年参军，1914年不顾高龄复役，1918年获荣誉军团指挥官勋章，是法国第一位获该嘉奖的行政军官。母亲是家庭主妇。1901年以第一六八名考入圣西尔军校，属百年荣誉军团班。1903年以第二二七名毕业，选择骑兵专业，成为见习军官，分配至第六猎骑兵团。1904年晋升少尉，任排长。1905年10月调往第五非洲猎骑兵团，晋升中尉。1908年至1912年参加摩洛哥战役。1912年考入陆军高级指挥学校。1914年毕业，获参谋资质与空中侦察员资质。8月分配至第三十六步兵师参谋部，参加沙勒罗瓦战役、第一次吉斯战役与第一次马恩河战役。10月调往第三集团军参谋部，在弗利雷战役中头部重伤，回后方疗养。1915年6月在埃唐普飞行基地与沙隆飞行基地学习。8月成为陆军飞行员。9月调任东方集团军航空兵总指挥，晋升上尉。1916年3月晋升临时少校。1916年至1919年间着力发展东方集团军的航空兵，如远程轰炸、建立“奥特朗托后勤通道”及战区自主组装能力、改良战斗机、帮助巴尔干盟国自建空军等。大战期间，获荣誉军团军官勋章、战争十字勋章（饰一枚星与三枚铜棕榈叶）。停战后转为正式少校，受杜梅尔格引荐，任总理顾问。平安夜政变时随白里安出逃。内战初期被白军逮捕，押于波尔多。波尔多解放后参加革命。1921年任陆军航空局局长，晋升中校。1924年就读高级军事研究中心，晋升上校。1925年毕业。1926年晋升准将兼任国防委员会航空处处长。1927年晋升少将兼任第一航空区司令。1929年晋升中将，任空军参谋长与空军监察长。\n\n务实的杜黑主义者，认同战略轰炸的意义。但受限于法国的工业实力，仍支持以国土防御为目的的战术空军，致力于建立统一而高效的航空工业体系。也支持多用途战机计划。\n\n为人沉稳、务实、理性，擅长组织与合作。与多个党派有交集，主要支持共和青年同盟。§!"

