# CGFF
  FRA_maurice_gamelin:0 "莫里斯·甘末林"
  FRA_maurice_gamelin_character_desc:0 "§Y隶属：§!$party_URSRS$（$URSRS_faction_1$）\n§Y生于：§!§L1872年9月20日；法兰西共和国、塞纳省巴黎§!\n§Y背景：§!§L莫里斯·居斯塔夫·甘末林出自军人世家，其父为陆军总监察长；其母是阿尔萨斯人。甘末林从小成绩优异，早年就读于斯坦尼斯拉斯学院，后考入圣西尔军校，成绩绝佳，1893年毕业。毕业后先在阿尔及利亚第三步兵团服役，后在突尼斯军制图部门工作，曾任霞飞秘书。1896年调入第一〇二步兵团。次年以第八名考入陆军高级指挥学校并获福煦赏识。在德雷福斯事件中，他保持中立，却是极少数相信德雷福斯清白的军官。1901年毕业并晋升上尉。1902年进入第十五军参谋部。1904年转任第十五高山猎兵营连长。1906年经福煦帮助成为霞飞副官。1908年进入第二军参谋部，晋升少校。1910年随霞飞进入最高战争委员会。1911年任第十一高山猎兵营营长。1913年获荣誉军团骑士勋章，调入陆军总参谋部第三局。大战爆发后，随霞飞加入法军总司令部，参与马恩河战役的规划，晋升中校，获集团军级嘉奖。1915年领导总司令部第三局。1916年指挥第二猎兵旅，参加林格战役与索姆河战役，晋升上校，获军级嘉奖。1917年自告奋勇指挥第九步兵师，参加贵妇小径战役，获荣誉军团勋章。1918年率部参加第二次皮卡第战役、第二次马恩河战役与第三次皮卡第战役。1919年参加贡比涅战役与瓦兹河战役，晋升准将，获师级嘉奖。战争期间表现出色且重视士兵生命，获战争十字勋章（饰银星、金星与棕榈叶）、荣誉军团军官勋章及一些外国勋章。尽管霞飞对甘末林有知遇之恩，但甘末林并不赞成政变。特鲁瓦战役前夕甘末林起义（据传被官兵裹挟），促使白军大败。1921年任第二十军区司令，晋升少将。1922年任陆军总参谋部副参谋长。1926年成为陆军总参谋长，晋升中将。1929年成为全军总参谋长，晋升上将，负责1929年军事改革。\n\n不反对机动作战等新式军事思想；但更强调防御：视机动部队为填补空缺的救火队员。颇受争议。\n\n为人温和，缺乏个人魅力，处事圆滑，政治风向敏锐，不参与政治斗争，是各派都接受的人选，故平步青云。但个人倾向于共和社会主义-激进社会主义联盟。§!"
  CGFF_maurice_gamelin_trait:0 "$CGFF$"
  FRA_maurice_gamelin_trait:0 "有条不絮作战倡导者"

  FRA_ernest_petit:0 "埃内斯特·珀蒂"
  FRA_ernest_petit_character_desc:0 "§Y隶属：§!$party_POU$（$POU_faction_1$）\n§Y生于：§!§L1888年2月20日；法兰西共和国、下卢瓦尔省潘伯夫§!\n§Y背景：§!§L埃内斯特·埃米尔·阿贝尔·珀蒂，其父是邮政局长。早年就读南特中学。1909年考入圣西尔军校，与戴高乐、朱安同届。1911年毕业，进入第一六一步兵团，晋升少尉。1913年晋升中尉。大战爆发后，该团隶属第四十步兵师，随第三集团军参加阿登战役、雷维尼战役、沃尔夫河战役。1915年，参加阿尔贡森林战役、第二次香槟战役，获团级嘉奖。1916年参加凡尔登战役，10月参加索姆河战役。该团在布沙韦讷-卑尔根战斗中表现出色，得名“铁门团”。珀蒂再获师级嘉奖，晋升上尉。1917年参加尼韦尔攻势，8月被俘，被囚于因戈尔施塔特。在狱中受俄国共产主义影响，质疑大战的意义。珀蒂三次越狱未遂，终在1919年2月成功并返回原部队，获逃脱者勋章。参加瓦兹河战役，获荣誉军团骑士勋章和集团军级嘉奖。随后参加灾难性的圣米耶勒战役，引发兵变。珀蒂组织士兵委员会，成为士兵代表，与工人汇成一处，要求停战。贝当政变后，清洗具有左翼倾向与反战倾向的军官，珀蒂被革职。正时内战爆发，珀蒂遂率一六一团参加色当起义，随后参与特鲁瓦战役。大战期间获战争十字勋章（饰铜星、银星、棕榈叶）、荣誉军团骑士勋章、逃脱者勋章。1920年6月转任第三十高山猎兵营，晋升少校。1921年进入陆军高级指挥学校学习。1923年任圣西尔军校教务长，晋升中校。1926年任应用通信学校校长，晋升上校。1929年担任第二十四步兵师参谋长，同时就读高等军事研究中心。1932年担任总参谋部助理参谋长，晋升准将。1934年，担任第二军区司令，晋升少将。\n\n珀蒂强调无线电的重要性，通过大范围使用无线电与下放火力支援权限，辅以航空兵支援，把火力的作用发挥到极致。支持装甲兵发展，提倡防御性的装甲部队。\n\n人们评价珀蒂：迟缓、沉静、睿智且自信。他是自发的马克思主义者，支持联合工人党。也是军中少有的和平主义者，反对复仇主义。关心官兵的福祉，致力改善士兵生活条件，并促进士兵福利融入社会保障体系，深受士兵爱戴。§!"
  CGFF_ernest_petit_trait:0 "$CGFF$"
  FRA_ernest_petit_trait:0 "总体持续作战倡导者"

  FRA_henri_gerard:0 "亨利·热拉尔"
  FRA_henri_gerard_character_desc:0 "§Y隶属：§!$party_PCOP$（$PCOP_faction_2$）\n§Y生于：§!§L1889年2月12日；法兰西第三共和国、塞纳省巴黎§!\n§Y背景：§!§L亨利·埃米尔·热拉尔，父亲是批发商，祖父是放贷人。1893年10月考入圣西尔军校，属圣女贞德班。1896年以第二十五名毕业，进入第四祖阿夫团，晋升少尉。1897年进入外籍军团第一步兵团。年底调入苏丹参谋部。1898年英勇负伤，获殖民地勋章（饰塞纳加尔扣与苏丹扣），晋升中尉。1901年参加撒哈拉远征。年底回国，调入第四十六步兵团，常驻巴黎，迎娶米谢勒·沃姆斯·德罗米伊（巴黎名门）。1902年调往第二十六猎兵营。1903年结识让·饶勒斯，转变为社会主义者。1907年调往第五十一步兵团，晋升上尉。同时以罗塞尔少校为笔名，在《人道报》发表文章并帮助饶勒斯撰写《新军队》。1909年调往第七十四步兵团。因同情罢工，与同事发生冲突，被监禁并“确诊”神经衰弱，经饶勒斯帮助获释。1910年调往第一〇二步兵团。1911年获荣誉军团骑士勋章。1914年参加边境战役、第一次马恩河战役、奔向大海战役，获团级嘉奖。1915年参加第一次香槟战役与第二次香槟战役，获军级嘉奖。1916年参加凡尔登战役；重伤，回后方修养；晋升少校，获集团军级嘉奖、荣誉军团嘉奖。1917年调入军备部，协助阿尔伯特·托马斯组织军械生产，晋升少校。大战期间支持神圣联盟；重视士兵生命，反对无效进攻，深受士兵爱戴；获荣誉军团军官勋章与战争十字勋章（饰铜星、金星、棕榈叶）、战争伤残勋章。1918年末秘密加入共和退伍军人协会。1919年调往战争部工作，暗地里组织士兵运动，支持停战。1920年调回第一〇二步兵团，驻守色当。1月19日领导色当起义。随后被公共安全委员会任命为革命军总司令，参加特鲁瓦战役、巴黎战役与西部大追歼。1921年晋升中将。1923年改任总参谋长。1929年任全军总监察长与高等军事研究中心总监，晋升上将。\n\n军事社会主义化的代表，强调民兵制、政治化军队与官兵的主动性。战术上强调火力为主。同时也支持装甲兵发展。\n\n认为饶勒斯是爱国主义者，如果在世，会支持大战以保卫祖国。§!"
  CGFF_henri_gerard_trait:0 "$CGFF$"
  FRA_henri_gerard_trait:0 "弹性递进作战倡导者"

  FRA_nestor_makhno:0 "涅斯托尔·马赫诺"
  FRA_nestor_makhno_character_desc:0 "§Y隶属：§!$party_UA$（$UA_faction_2$）\n§Y生于：§!§L1888年11月7日，俄罗斯帝国、叶卡捷琳诺斯拉夫省胡里艾伯勒§!\n§Y背景：§!§L涅斯托尔·伊万诺维奇·马赫诺，家境贫穷，父亲是农民，在马赫诺未满岁时便去世。1896年进入小学，成绩优秀。1900年辍学，先后在农场、油漆坊和铸造厂工作。1906年加入无政府主义组织“贫苦农民联盟”。曾胁迫商人以筹措费用。1908年警察以谋杀密探为由逮捕马赫诺——尽管其与之无关。1910年法庭判处马赫诺终身监禁。1910年至1917年关押于莫斯科布蒂尔监狱 ，受狱友彼得·阿尔希诺夫影响，马赫诺成为坚定的无政府主义者。二月革命后获释。3月，马赫诺返回胡里艾伯勒，创建农民协会，分配土地和提升工人待遇。《布列斯特和约》签订后，德奥联军占领乌克兰，驱逐马赫诺。待他乔装回家时，发现母亲的家被烧毁，哥哥被认为反对德国和盖特曼而遭枪决。马赫诺随即发动农民起义，席卷乌克兰东南部，处决地主、分配土地、成立自由公社，人称“黑军”。黑军连战连捷，尤以佩列戈诺夫卡战役最为知名。1919年初，黑军攻占哈尔科夫。德奥支持的盖特曼政府不得不倾尽全力镇压黑军，双方陷入死斗，先后在顿巴斯、别尔江斯克、马里乌波尔等地作战。由于缺乏武器、组织混乱，黑军落入下风。1919年11月，黑军崩溃。马赫诺逃至法国。正值法国革命，马赫诺参加洛林红色游击队，袭扰白军补给线，为特鲁瓦战役的胜利做出贡献。其彪悍的运动战术给革命军深刻印象。解放后，马赫诺被送至索米尔骑兵学校学习，1923年毕业。随后前往陆军高级指挥学校学习。由于政治冲突与军事理念不合，1925年因故肄业。马赫诺自愿前往巴塔哥尼亚，指导军队建设与智利革命。\n\n马赫诺是自发成才的运动战大师，支持机动作战，强调分散式指挥，并罕见地支持职业军队。马赫诺基于乌克兰革命的经验，提倡“纲领主义”，认为无政府主义是基于阶级斗争的工人革命，必须反对一切资产阶级倾向的思想哲学，并需要一定的组织性：理论一致、战术一致、集体责任。反对派称其将无政府主义“布尔什维克化”。§!"
  CGFF_nestor_makhno_trait:0 "$CGFF$"
  FRA_nestor_makhno_trait:0 "任务型闪电战倡导者" 

  FRA_charles_delestraint:0 "夏尔·德莱斯特兰"
  FRA_charles_delestraint_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1879年3月12日；法兰西共和国、加莱海峡省比亚切圣瓦斯特§!\n§Y背景：§!§L夏尔·乔治·安托万·德莱斯特兰，父亲是会计师，曾参加普法战争；其母亲是战争遗孀，后与德莱斯特兰父亲再婚。家境普通。从小立志从军。在里尔接受圣母会中学教育，成绩优异。1897年进入圣西尔军校布尔巴基班，1900年毕业，晋升少尉，进入第十六猎兵营服役，年末加入方济各第三会。1902年晋升中尉。1913年12月晋升为上尉。1914年3月考入陆军高级指挥学校。大战爆发后，指挥第五十八猎兵营第九连。1914年8月25日，在艾布突袭德军萨克森第一三四团，阻止其渡过默兹河，保护第四集团军和第五集团军的结合部，并促使两军会师。获荣誉军团勋章与集团军级嘉奖。随后掩护第五十二师撤退。1914年8月30日在谢努瓦-欧邦库尔战斗中寡不敌众被俘。被囚于德国，期间结识戴高乐。大战期间，获战争十字勋章（饰棕榈叶）与荣誉军团骑士勋章。由于法国革命的影响，德莱斯特兰直到1920年5月才回国，此时军政府已逃往阿尔及尔。德莱斯特兰不得不接受法国革命的事实。1921年重回高级指挥学校，次年获得参谋军官证书，晋升少校。1923年前往凡尔赛坦克训练学校学习，结识“法国坦克之父”让·埃斯蒂安，受其影响，德莱斯特兰成为装甲作战的拥趸。1924年调入第五一七坦克团任营长，深受官兵爱戴，晋升中校。1926年调入索米尔装甲骑兵学校技术科，支持埃斯蒂安研究重型坦克和组建特别坦克部队的提议。次年成为校长，晋升上校。1930年，接管第五〇五坦克团，强调新颖的“个性化”方法训练该团，引发争议。但在全团官兵和部分上级的支持下，他保住团长一职并晋升准将。1932年，晋升少将，任坦克监察长。1935年，组建第一轻机械化师并成为师长，晋升中将。\n\n坚信坦克的作用，坚持组建数个真正的装甲师。倾向于积极的进攻战略。他是公社装甲机动作战最积极的支持者。\n\n“荣誉、责任、行动、信仰和无私”。由于职业性的装甲部队在军中争议颇多。政治上比较传统，支持共和青年联盟。§!"
  CGFF_charles_delestraint_trait:0 "$CGFF$"
  FRA_charles_delestraint_trait:0 "集成式闪电战倡导者"

  FRA_gabriel_bougrain:0 "加布里埃尔·布格兰"
  FRA_gabriel_bougrain_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1882年4月9日；法兰西共和国、马耶讷省拉瓦勒§!\n§Y背景：§!§L加布里埃尔·马里·约瑟夫·布格兰，父亲是银行家奥古斯特·布格兰-迪堡，掌有布格兰银行。母亲也出自金融世家。在父亲管教下，自幼学习马术。早年就读奥什中学。德雷福斯案期间支持军队。1903年拒绝兵役豁免（父亲去世，他是家中独子），考入圣西尔军校，属拉图尔·多韦涅班。1905年毕业，晋升少尉，前往索米尔骑兵学校学习。1906年毕业，任职于第二十五龙骑兵团。次年主动前往阿尔及利亚服役，任非洲第一猎骑兵团教官，表现出色。1910年回国结婚，妻子是伊冯娜·奥马翁尼，贵族后裔。任职第二十三龙骑兵团。1912年晋升中尉。1914年7月调任索米尔骑兵学校助理教官兼黑骑士马术团成员。8月被动员至第二十四龙骑兵团，负责侦察。参加阿登战役、默兹河战役、第一次马恩河战役、第一次香槟战役，晋升上尉，获集团军级嘉奖。12月任师长雷韦亚克的幕僚。1915年参加第二次香槟战役，获集团军级嘉奖与荣誉军团嘉奖。1916年6月至7月参加凡尔登战役，获师级嘉奖。11月主动调往东方集团军第三局。年末至1917年初参加一二四八高地战役、第二次黑河湾战役。随后接受飞行训练，负责空中侦察。1918年10月调任东方盟军司令部第三局局长，与弗朗谢·德斯佩雷关系融洽，参加多布罗波列战役、获集团军级嘉奖。1919年参加萨洛尼卡大撤退，晋升少校。大战期间获战争十字勋章（饰银星与四枚棕榈叶）与荣誉军团骑士勋章。反对停战。停战后参与近东及中东地区的和谈工作，1920年4月才回国，此时内战即将结束，布格兰退出军队，担任蒙莱里赛马场总经理。又不适应平民生活。1923年返役考入陆军高级指挥学校。1924年毕业，留校任骑兵教官，晋升中校。1927年管理索米尔预备役高级军官训练班，晋升上校。1930年任教务长。1931年晋升准将，指挥实验机械化旅，就读高等军事研究中心。1934年末，参与组建第一轻机械化师，晋升少将。\n\n大力支持德莱斯特兰的装甲兵计划。但更崇尚防守型的装甲作战，也支持官兵主动性。\n\n思想进步，敢于变通，热衷探索新技术。有复仇主义倾向，支持共和青年联盟。§!"
  CGFF_gabriel_bougrain_trait:0 "$CGFF$"
  FRA_gabriel_bougrain_trait:0 "协同持续作战倡导者"

  FRA_antoine_bethouart:0 "安托万·贝图阿尔"
  FRA_antoine_bethouart_character_desc:0 "§Y隶属：§!$party_LJR$（$LJR_faction_2$）\n§Y生于：§!§L1889年12月17日；法兰西共和国、汝拉省多勒§!\n§Y背景：§!§L马里·埃米尔·安托万·贝图阿尔，祖籍是皮卡第的马尔康泰尔。父亲是抵押物登记员；母亲出自官僚世家，信仰虔诚。早年就读圣热内维耶夫私立中学，同学有日耳曼·福煦与塔西尼。1909年考入圣西尔军校菲斯班，与戴高乐、朱安、珀蒂同届。在第一五九高山步兵团服役一年。1912年毕业，晋升少尉，任第一五二步兵团的排长。1914年晋升中尉，参加洛林战役。1915年调任第一五八步兵团第七连，参加第一次阿图瓦战役，洛雷特山战斗中重伤，回后方疗养。康复后调往第七十七旅参谋部（属第三十九步兵师）。1916年晋升上尉，2月参加凡尔登战役，7月参加索姆河战役。1917年调往师参谋部，4月参加贵妇小径战役，自告奋勇返回基层，指挥突击连参加谢夫雷尼山脊战斗。通过谈判平息兵变。1918年1月参加第二次凡尔登战役，随后成为第一四六团的营长。4月参加第一次利斯河战役，在凯默尔山战斗中负伤。7月下旬归队，参加第二次马恩河战役、第一次瓦兹河战役。1919年参加贡比涅战役、第二次瓦兹河战役与圣米耶勒战役。支持停战。大战期间获荣誉军团骑士勋章、战争十字勋章（饰一枚棕榈叶和三枚星）与战争伤残勋章。战后留在德国负责领土交接、战俘归国等。1920年5月回国。选择留在公社，考入陆军高级指挥学校。1922年毕业，调入第十二军区参谋部，晋升少校。1924年参加援英志愿军，表现出色，晋升中校。1926年指挥第二十八高山猎兵营，兼任山地军事研究中心教授。1928年指挥第五高山猎兵半旅，晋升上校。1931年晋升准将，任总参谋部助理参谋长。1934年晋升少将，任第十二军区司令。\n\n贝阿图尔长期在山地部队服役，精于山地战。强调部队机动性，对机动灵活的装甲部队感兴趣。提倡诸兵种合成作战与纵深防御。\n\n宗教色彩浓厚。为人正直、宽容，富有人道主义、勇气十足。关心海外法国人权益，政治嗅觉灵敏，擅长外交，支持共和青年联盟。§!"
  CGFF_antoine_bethouart_trait:0 "$CGFF$"
  FRA_antoine_bethouart_trait:0 "协同纵深作战倡导者"

  FRA_aime_doumenc:0 "艾梅·杜芒"
  FRA_aime_doumenc_character_desc:0 "§Y隶属：§!$party_PSF$（$PSF_faction_1$）\n§Y生于：§!§L1880年11月16日；法兰西共和国、伊泽尔省格勒诺布尔§!\n§Y背景：§!§L约瑟夫·爱德华·艾梅·杜芒，父亲是退役中校，曾参加普法战争。早年就读格勒诺布尔公立高中。1898年考入巴黎综合理工学院，获校奖学金。1900年毕业，进入枫丹白露炮兵与工兵应用学校学习。1902年毕业，服役于第二山地炮兵团，晋升少尉。1905年晋升中尉。期间获格勒诺布尔大学法学学士学位。1907年考入陆军高级指挥学校，成绩斐然，1909年留校任助理教官，进入亨利·莫尔达克的战略研究项目组。1910年毕业，在第十九军参谋部见习，晋升上尉，后在阿尔及利亚服役。1911年调至第六十炮兵团。1914年获荣誉军团骑士勋章。大战爆发后，借调至第六集团军参谋部。因成功运用汽车撤退，获团级嘉奖。急调至陆军汽车勤务部任副主任，组织第一次马恩河战役的汽车运输，获旅级嘉奖。随后参与奔向大海战役与1915年的各大战役。1916年负责凡尔登战役的后勤运输，是“圣路”的设计师，获荣誉军团嘉奖。同年任让·埃斯蒂安的技术顾问，协助坦克设计。1917年任汽车部主任，获法学博士学位。参与各大战役的后勤运输。1919年晋升中校，再获荣誉军团嘉奖。大战期间，获战争十字勋章（饰两枚铜星）和荣誉军团指挥官勋章。贝当政变后，尽管略有微词，仍负责政府军的后勤运输，直至内战结束。革命后，杜芒离开军队，任巴黎塞纳钢铁锻造公司总经理。1924年被召回现役，调入第三国际联络处。1926年兼任第一骑兵师炮兵协调官，晋升上校。1929年任陆军参谋部第四局局长。1931年任总参谋部助理参谋长，晋升准将，就读高等军事研究中心。1935年晋升少将。\n\n杜芒堪称组织天才，擅长大兵团后勤运输。也是法军合成作战的先锋：提倡步兵、炮兵与坦克的营级合成单位。战略上则提倡纵深梯形突击。与俄国军官团交好，是法国纵深学派代表人物。但与重视指挥员主动性的图哈切夫斯基不同，杜芒坚持法军方法战传统，强调集中指挥。\n\n为人温和、不爱争辩、尽职尽责，热爱爬山。认同社会党的治理手段，支持新社会主义，但不支持军事政治化。§!"
  CGFF_aime_doumenc_trait:0 "$CGFF$"
  FRA_aime_doumenc_trait:0 "大纵深作战倡导者"

