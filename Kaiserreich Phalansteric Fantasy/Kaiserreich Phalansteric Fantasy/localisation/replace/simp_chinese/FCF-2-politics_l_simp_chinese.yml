  FCF_politics_categories:0 "公社政治"
  FCF_politics_categories_desc:0 "1921年宪法规定。法兰西公社联邦是由36000多个公社组成的社会主义-工团主义联邦。其最高的政治机关是§Y总联邦委员会(Comité Général de la Fédération)§!。而§Y公共安全委员会(Comité de Salut Public)§!是§Y总联委§!的执行机关，由其产生，对其负责，受其监督。\n" 

  FCF_impeachment:0 "弹劾$FRA_georges_du_maurier$"
  FCF_impeachment_effect:0 "\n$if_bill_pass$\n$FRA_georges_du_maurier$将被弹劾"
  FCF_impeachment_desc:0 "尽管在去年5月时成功组织了一场第三国际代表大会，但是杜穆兰的政府班子却因面对德意志帝国主义者残酷镇压国内工会活动时三缄其口而饱受批评。总联邦委员会内部的反对派已经对杜穆兰发起了一项不信任案。"

  FCF_election:0 "总联邦委员会选举"
  FCF_election_desc:0 "与其说是总联邦委员会委员的选举，不如说是总联邦委员会潜在委员的选举。在五年时间里，区委员会随时可以撤换其在总联邦委员会中的委员，而锚定可以登上全公社联邦最高权力位置的存在，才是大选所真正选举的：地方公社将重新选举他们的代表委员，而这些代表委员又将在区委员会中选出前往中央的委员。\n\n虽然委员的人选可以变更，但大选结束时刻的总联邦委员会的委员分布将决定我们下一届政府究竟由哪个党派统治。倘若没有任何一个党派联盟超过半数席位，那要么就去寻求新的盟友，要么就只能成为一个跛脚的少数派政府。"
  FCF_election_tt:0 "§G总联邦委员会的选举将持续30天，最终的结果将决定下一届政府的执政党派。§!"

  election_1936_CNS_cooperate_with_POU:0 "$party_CNS_short$ 联系莫纳特"
