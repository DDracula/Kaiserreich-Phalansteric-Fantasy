#1
  bill_basic_speech_freedom:0 "基本言论自由"
  bill_basic_speech_freedom_desc:0 "言论自由是人的基本权力，我们赋予了所有公民合理合法的发声能力。"
#2
  bill_limited_womens_rights:0 "受限的妇女权益"
  bill_limited_womens_rights_desc:0 "旧共和国时期，尽管他们自称为“民主”，然而，占据人民一半的女性们却连投票都做不到。很多傲慢知识分子都认为女人愚昧无知，会被教权主义影响，就像第二共和国时期农民投给路易·波拿巴一样。而那些保守派，甚至都不将女性作为一个独立的人类。但事实证明，女性投票的方式和男人并无不同，无非是根据相应的社会阶层做出相应的选择。自然，在革命后，我们给予了女性选举权，虽然这一举动引起了很多保守的革命者的反对，但革命就是这样——如果什么都没有改变，那我们为什么要革命？\n\n当然，在国家层面上的革命并不能一瞬间改变全社会个体的认识。实际情况是，女性的权益并没有得到完善的保障，依旧有些行业不对女性开放或者直接对女性进行赤裸裸的就业歧视——并且其中许多行为都得到了法律背书。而很多妇女们，尤其是在落后地区的女性，她们同样有着浓重的思想刻印，尽管我们给予了她们选举权，但她们却“耻于”投票。与此同时，城市里的女性工人以及女性知识分子却在呼吁完善对女性权益的保护——就像男人一样，女人之间也会出现阶层分化。"
#3
  bill_freedom_of_religion:0 "宗教自由"
  bill_freedom_of_religion_desc:0 "法国是一个多宗教的国家，除了传统的基督教体系的天主教和新教各宗派，还有犹太教甚至伊斯兰教。虽然很多革命者都坚持无神论的观点，但冒然施行强制的反宗教措施注定会导致人民的反对。总的来说，我们依旧在延续的旧共和国的宗教自由政策，并没有做出太大的修改。"
#4
  bill_free_immigration:0 "自由移民"
  bill_free_immigration_desc:0 "法兰西自工业革命以来便是一个移民大国，我们的国内有来自南欧、中欧和东欧的劳工移民，也有前法属非洲殖民地的穆斯林与黑人移民。而在革命后，虽然很多保守派和旧共和国的走狗逃往了非洲，但大多数移民也都接受了社会主义革命的现状——毕竟他们大多数同样是劳工。依靠着我们作为第一个社会主义国家与世界革命中心的地位，很多国家的左翼人士或者是单纯讨生活的劳工都希望参与到我们的革命建设中，我们当然没有理由拒绝这些同志的善意。不过，旧共和国一直存在的种族主义与民族主义也无法在短短十几年内削除，不少法国人都对这些少数族裔移民——特别是犹太人——心存不满。"
  bill_free_immigration_tt:0 "§G这将允许我们在世界其他地方爆发危机时接受难民§!\n§R然而，这将导致国内民族主义者与本土主义者的不满§!"
#5
  bill_eight_hour_workdays:0 "八小时工作制"
  bill_eight_hour_workdays_desc:0 "“八小时劳动，八小时娱乐，八小时休息”一直是社会主义的基本要求，如果一个政权连八小时工作制都无法落实，那它只能愧对于社会主义的名号。很多资本主义国家因为害怕工人的革命——就像我国一样——也施行了八小时工作制。但资本家们所说的八小时工作制不是真正的八小时工作制，加班、拖欠工资、对工作外生活的干涉都在说明，资本主义国家所实施的八小时工作制不过是假借社会主义的名号换种方式对人民进行盘剥。\n\n八小时工作制并不像那些反对者所说的是“懒惰的借口”，恰恰相反，我们的工人在八小时工作制下爆发了远比十小时工作制或者其他时间更久的工作制所拥有的生产力更盛的劳动效率。不仅如此，八小时工作制给了工人充分的业余时间，他们可以发展自己的兴趣与学习更多的事物，而这带来的是全体人民素质的上升。"
#6
  bill_seven_hour_workdays:0 "七小时工作制"
  bill_seven_hour_workdays_desc:0 "在经过激烈的辩论后，“七小时工作制”正式在法兰西公社的土地上成为现实。这不仅是劳动者权益的一次巨大飞跃，更是公社对自身社会主义制度优越性的一次响亮宣告。缩短的工作时间，意味着我们的同志将拥有更多的时间用于自我提升、文化创造和家庭生活。批评者担忧这会削弱我们的工业产出。但事实却是，一个由得到充分休息、精神自由的劳动者组成的社会，其所能爆发出的长远创造力和凝聚力，将是任何加班加点都无法比拟的。"
#7
  bill_freedom_of_religion_amendment:0 "宗教自由修正案"
  bill_freedom_of_religion_amendment_desc:0 "§L法国是一个多宗教的国家，除了传统的基督教体系的天主教和新教各宗派，还有犹太教甚至伊斯兰教。虽然很多革命者都坚持无神论的观点，但冒然施行强制的反宗教措施注定会导致人民的反对。为了安抚一部分善良的人民，我们重新起草了一份宗教法案，更加符合社会主义的意识形态的同时并确保那些不危害革命的宗教徒的正常生活。§!"
