###政治相关事件
  fcf_politics_event.0.title.a:0 "总联委通过议案"
  fcf_politics_event.0.title.b:0 "总联委否决议案"
  fcf_politics_event.0.desc.a:0 "经过十数天的审议以及多轮辩论，虽然途中出现了些许挫折，但法案最终到达了通过标准。现场的支持者欢欣鼓舞，认定这份法案是带领[FRA.GetName]走向社会主义与正义的又一次伟大胜利；而反对派则沉默以表示抗议，想必他们在表决后又要和自己的同事发牢骚，或者说到哪个广场发表谴责这项法案的演讲。\n\n但总而言之，这份议案依靠简单多数原则表决通过，并将由总联邦委员会授权，由公共安全委员会进行具体工作。也就是说，这份议案已经不在是议员手头上可以随手丢弃的废纸，而是得到宪法保护的神圣法律。或许用不了多久，这份法案就将改变整个社会。"
  fcf_politics_event.0.desc.b:0 "经过十数天的审议以及多轮辩论，议案并没有争取到需要的通过票，这也就意味着，这项充满争议的议案将被否决，并在一个冷却周期内无法被再次递交。现场的支持者们大多垂头丧气，有几个激进的支持者上到台上重新计票，但大多都是无功而返。反对者们则显得轻松，和身边的同僚开始拉扯家长里短，这一次是他们的胜利。\n\n无论如何，没有通过就是没有通过，再抱怨与仇恨也无法改变这个事实。议案的支持者宣称社会失去了一次进步的机会，而反对者则认为这份议案完全是与社会的需求背道而驰。即使在表决之后，两边依然对此争论不休，不过可以肯定的是，这样的社会可能还没有做好这份议案到来的准备。"
  fcf_politics_event.0.a:0 "好！今天最高兴了！"
  fcf_politics_event.0.b:0 "别愁眉苦脸了，来喝一杯吧！"

  fcf_politics_event.1.title:0 "制图师"
  fcf_politics_event.1.desc:0 "若要问是什么让年轻的制图师奥斯曼连续几夜辗转难眠，那答案既不是尚未核对的地名，也不是来不及描绘的国境线，而是那张即将交付的地图。截稿日期迫在眉睫，山川、城市与铁路都已一一落在纸上，唯独法兰西公社联邦的底色仍是一片空白。奥斯曼已经数次提起画笔，却始终无法决定应当蘸取哪一种颜料。\n\n蓝色曾属于王国，也属于共和国。在无数地图上，它早已与法兰西的轮廓融为一体；可若仍旧沿用蓝色，又该如何表现这片土地上已经发生的革命，如何让人一眼看出旧共和国已经不复存在？红色是工人运动的旗帜，是公社与革命的象征；可若将整个法兰西染成红色，它又会不会因此失去自身的面貌，变成世界革命版图上一个与其他国家无甚区别的色块？\n\n这个看似微不足道的问题困扰了他许久。蓝色承载着法兰西的历史，红色则昭示着联邦的理想；前者让革命扎根于这片土地，后者又使这片土地获得了新的意义。直到新年第一天的清晨，当第一缕阳光照进工作室，映亮桌上的颜料与那片尚未着色的国土时，奥斯曼终于重新拿起了画笔。无论选择蓝色还是红色，它所描绘的都仍是法兰西——只是人们必须决定，今后应当用什么颜色来认识它。\n\n而他最后选择的是……"
  fcf_politics_event.1.a:0 "蓝色便是法兰西。"
  fcf_politics_event.1.b:0 "红色才是革命。"

  fcf_politics_event.2.title:0 "里昂大区撤换代表"
  fcf_politics_event.2.desc:0 "里昂区委员会决定撤换在总联邦委员会中的代表，这意味着几个亲建制的代表将被撤下。而根据坊间传闻，换上的代表分别代表了对总工会不满的、对妥协政策感到愤怒的反建制代表。这也意味着在对杜穆兰的不信任案又将得到几票赞成票。"
  fcf_politics_event.2.a:0 "看来这届政府注定要下台了。"

  fcf_politics_event.3.title:0 "替换人选"
  fcf_politics_event.3.desc:0 "当上公共安全委员会的部门委员无疑是一个公民最能实现其政治抱负的方法，但这并不意味着只要当上委员就可以高枕无忧了。事实恰恰相反，无数人觊觎这个位置，只要你在这个岗位上没有做出大众满意的举动（当然，更多情况下是没有做出符合总联邦委员会多数席位联盟诉求），你就有可能被替换成另一个野心勃勃的候选人。"
  fcf_politics_event.3.a:0 "开始表决。"
  fcf_politics_event.3.b:0 "算了。"
  fcf_politics_event.3.c:0 "已经决定了。"      

  fcf_politics_event.4.title:0 "工农共重申与安联盟的联盟"
  fcf_politics_event.4.desc:0 "如果说谁最能在即将到来的大选中对执政联盟造成威胁，无疑是工农共产党和无政府主义联盟的选举联盟。尽管所有人都认为盖得派不可能和无政府主义者联合起来，但面对共同的敌人，特别是在1934年的“诉CGT案”中的配合，使得这两个位于公社政治光谱两侧的组织联合起来对抗联合工人党与总工会的执政地位。\n\n当然，很多人都会怀疑这两个诉求各异的组织如何在大选中选择自己的宣讲策略，以及在未来的执政中如何兼顾双方截然相反的诉求。目前看来，他们更着重于批判总工会的垄断和官僚化倾向。而这一举措也的确收获了广大对现政府不满的民众。"
  fcf_politics_event.4.a:0 "屠龙者终成恶龙吗？"
  election_win_trigger_tt:0 "在选举结束时，只要他们在$CGF_name$中的席位总和超过半数（325），他们就可以组建政府"
  election_alliance_PCOP_UA:0 "在这次大选中，$party_PCOP$将和$party_UA$组成选举联盟\n$election_win_trigger_tt$"

  fcf_politics_event.5.title:0 "法国社会党的新盟友"
  fcf_politics_event.5.desc:0 "法国社会党内的雅克·多里奥近日宣布，法国农业与农民党将和社会党将在下次大选中站在同一战线。尽管农民党领袖亨利·多尔热和多里奥的亲密关系人尽皆知，但社会党和农民党的相性是否如同这两位一样亲密还未可知。社会党内的阿德里安·马凯在波尔多表达了自己对此的满意之情：一场专门为社会党和农民党结盟庆祝的游行在波尔多的主街上进行，游行所需要的花卉皆有农民党的支持者提供。\n\n自波尔多经济奇迹以来，社会党就摆脱了曾经工人国际法国支部的阴影，重新成为了法兰西政治生态中极其重要的一环。在总工会内部，也涌现出一批亲社会党的成员，甚至据传闻，总工会主席莱昂·儒奥也对社会党颇感兴趣。但在另一边，激进的工人主义者们却指责社会党是在复辟旧共和国的资本主义，而其曾经的老东家工农共产党也对他们意见颇多。但毫无疑问的是，社会党同样是下一次大选中另一个极具吸引力的竞争者。"
  fcf_politics_event.5.a:0 "多里奥这次赚足了风头。"
  election_alliance_PSF_PAPF:0 "在这次大选中，$party_PSF$将和$party_PAPF$组成选举联盟\n$election_win_trigger_tt$"

  fcf_politics_event.6.title:0 "多列士强调人民阵线与团结"
  fcf_politics_event.6.desc:0 "联合工人党不会因为自己是革命的最大功臣就认定自己有带领全体法国公民的“昭昭天命”，他们尝试从一个革命者转变为一个建设者。这显然会引来激进分子的批判，无论是党外的反对者还是党内的左翼派系。但事实是，治理和革命是两码事，他们不能依赖革命时的方法来处理各种公务——他们已经吃过亏了。\n\n可另一方面，那些反对者的意见并不是空中楼阁，“诉总工会案”已经把联合工人党与总工会最后一块遮羞布扯了下来。越来越多人开始批判现任政府的腐败与无能，而党书记莫里斯·多列士能做的也只有尽可能安抚多数人的情绪。自从上一次大选组建人民阵线政府以来，他就一直被革命工团委员会认为过于妥协，尽管他有着儒奥的支持，但儒奥自身也未必能遏制住总工会内部革命工团委员会的崛起。\n\n至于多列士现在能做的，也就只有再次强调团结与稳定的作用。对于那些本身支持人民阵线的人，这些说辞没有什么作用，而对于那些反对建制派的人来说，这些说辞同样也没有什么作用。联合工人党只能寄希望于那些没有政治倾向的中间选民能感受到这五年里人民阵线执政带给他们的好处从而再一次支持他们，否则，他们的主导位置很可能就要被拉下马了。"
  fcf_politics_event.6.a:0 "人民阵线首先需要人民。"
  election_alliance_POU_CGT_URSRS_LJR:0 "在这次大选中，$party_POU$、$party_CGT$、$party_URSRS$和$party_LJR$将组成选举联盟\n$election_win_trigger_tt$"

  fcf_politics_event.7.title:0 "莫纳特宣布大选"
  fcf_politics_event.7.desc:0 "总联邦委员会作为法兰西公社联邦的最高机关，每五年进行一次基层公社的地方委员会选举。再由基层的地方委员会再进行选举产生区委员会，而区委员会在五年时间里可以自行决定在总联邦委员会中担任委员的人选。根据宪法规定，区委员会对总联邦委员会的委员有罢免权，也就是说，虽然大选已经结束，但总联邦委员会的委员人选却是可以在五年间随意变换。当然，变换人选的名单是被区联合委员会的委员名单所限定的。总联邦委员会的选举毋宁说是地方委员会的选举，其核心目的是更新基层的政治生态，而总联邦委员会充其量只不过是呈现这一结果的场所。"
  fcf_politics_event.7.a:0 "让选举开始吧！"

  fcf_politics_event.8.title:0 "社会党大胜波尔多"
  fcf_politics_event.8.desc:0 "阿德里安·马凯作为波尔多市长已经数年，而在他的治理之下，波尔多成为了全法兰西经济增速最快的地区。不仅如此，波尔多的基础设施建设与城市规划也远超一般的法国市镇。由于波尔多的经济奇迹，大量人口进入郊区，但这并没有像巴黎或者其他都会一样导致波尔多的犯罪率与不稳定度上升，与之相反的是，波尔多的治安排名长期居于全联邦前列。毫无疑问，波尔多经济腾飞的重要原因之一就是法国社会党在此地的长期执政，这使得波尔多并没有像其他法国市镇一样经历反复的经济体制变革。当然，在恢复与美国的外交关系后，波尔多也是第一批邀请美国企业投资的公社，这一方面使得波尔多有远多于其他公社的资源，另一方面其也被长期指控为向资本主义妥协。\n\n社会党从始至终并不看重虚无缥缈的意识形态问题，而现在的选举结果表明，其实人民也不并不在乎给予他们面包和自由的人究竟是什么意识形态。虽然在过往社会党就在此地牢牢把握地方委员会，但这一次的选举则彻底将非社会党的势力从地方委员会中驱逐出去。当然，这种垄断级别的选举也遭到了许多人的非议，一些人认为这其实是多里奥的突击队在胁迫民众不去投那些非社会党的候选人才导致的。但猜想并不会改变波尔多委员会的最终结果，社会党的确彻底拿下了一个大都会。"
  fcf_politics_event.8.a:0 "他们应得的。"
  fcf_politics_event.8.b:0 "马凯同志发挥了至关重要的作用。"

  fcf_politics_event.9.title:0 "荣军院演讲"
  fcf_politics_event.9.desc:0 "自大战和内战结束以来，荣军院就一直作为伤残士兵的庇护所。在这里，那些丧失了生存能力的英雄们得以度过一个还算安稳的人生后半程。但对于更多参与到战争中留下残疾的普通士兵来说，不进入到荣军院中，反而是一种嘉奖。被这座大牢所困住的人得以安宁，但却永远丧失了继续变革这个世界的能力。\n\n但始终有人记着他们，他们为法兰西付出的血肉，为革命流下的鲜血，并不会仅仅徘徊在荣军院的周围。尽管曾经的共和退伍军人协会已经分裂，但联邦退伍军人协会和革命士兵军团都在为着同一个目的奋斗：让世人铭记无名之人。无论联邦的政治明星如何变换，这些老兵心中只有一个太阳：乔治·格雷森。虽然掀起革命之人的名号已经足够响亮，但作为乔治·索雷尔理论的直接继承人，格雷森显然并不止步于革命之始。\n\n在内战中，格雷森就已经从戒严令中保护了左翼的出版网络，而待到革命胜利后，其所拥有的完整出版网络使得革命士兵军团迅速转型成为退役士兵发声的主阵地。与依附于联合工人党的联邦退伍军人协会不同，格雷森始终保持着对于任何政治派系的距离，这也使得在格雷森的出版网络得以接受所有党派的出版诉求。这使得劳工印刷合作社迅速崛起成为战后法兰西出版行业的新星，除去政治报纸外，非政治的内容也广泛依赖格雷森的出版网络，可以说，只要格雷森愿意，他就可以让舆论朝着他想要的方向前进。\n\n但格雷森在长久的时间里并没有参与政治，国家工团主义联盟虽然早就存在，但直到1931年才第一次进入总联邦委员会。促使格雷森转变的原因尚未可知，但自他从幕后走到台前以来就一直以一副领袖的形象示人。威严、庄重，仿佛他就如同古罗马的奥古斯都一般。而今天，格雷森特意选择到荣军院这个对于士兵们有着特殊意义的地方进行演讲，汹涌的人潮中并不仅仅由士兵们构成，这里面还有着朝气蓬勃的年轻人、身着正装的神父、胡子拉碴的工人、抱着婴儿的妇女。他们都被格雷森吸引而来，而格雷森也没有让他们失望。演讲整整持续了四个小时，直到傍晚黄昏才结束。"
  fcf_politics_event.9.a:0 "国家工团主义联盟展现了另一种可能。"

  fcf_politics_event.10.title:0 "中部回响"
  fcf_politics_event.10.desc:0 "在整个法兰西都将重建的目光聚焦于北部的时候，中法兰西只能默默舔舐她的伤口。虽然这里没有直接遭到战争的破坏，但青壮年劳动力与牲畜在大战中的征召使得中法兰西这片依赖于人力与畜力的土地陷入了无声的沉默。妇女们不得不在照顾家庭的同时担任起男人的、甚至是牲畜的职责。稀少的肥料与劳动力使得这些原本可以输出农产品的地区倒退回了勉强自给自足的状况，而联邦政府为了解决全法兰西粮食问题的改革又让这些农户不得不遭受新一轮冲击。\n\n也正因如此，农民一直是最反对当前政府的群体。他们始终对于代表城市工人的联合工人党与总工会没有什么好脸色，而工农共产党之所以能异军突起，除去作为一个老政党有着诸多忠实的支持者外，很大程度上都依赖于反对当前状况的乡村农民与迅速壮大的因为农业政策破产而前往市镇务工的农民工群体。不过，许多农民可能因为自身的天主教信仰而更加偏好共和青年联盟这种天主教党派。当然，这在一定程度上也是因为“人民阵线”策略的生效，使得农民开始对政府有所改观。但更加激进的一批农民则会去支持法国农业与农民党。作为一个在革命后新建立的政党，他们迅速在总联邦委员会中取得了不少的席位。尽管其附属的组织农民防御委员会（俗称“绿衫军”）时常遭受争议，但在犯罪卷宗上还并没有看到他们的身影。结社自由的原则使得他们得以继续在联邦行动，这种组织形式或许是法国农业与农民党迅速扩张的一大重要原因。当然，多里奥时常吹嘘绿衫军是出自他的手笔，但显然绿衫军并没有像突击队那般“臭名昭著”。\n\n总体而言，农民群体的支持方向显然相对固定，要么是支持反建制的工农共产党，要么去支持天主教的共和青年同盟，又或者支持法国农业与农民党。当然，作为战争遗孀或是退役士兵的家人，他们也有可能支持国家工团主义联盟。"
  fcf_politics_event.10.a:0 "工农共产党或许最关注农民的党派。"
  fcf_politics_event.10.b:0 "人民阵线的策略无疑是正确的。"
  fcf_politics_event.10.c:0 "农民和农民应该携手并进。"
  fcf_politics_event.10.d:0 "格雷森将抚慰我们的心灵。"

  fcf_politics_event.11.title:0 "西北角的文艺复兴"
  fcf_politics_event.11.desc:0 "布列塔尼民族运动源于旧共和国对布列塔尼地区的强制同化政策，而在革命之后，我们实践了联邦主义的理念，布列塔尼的大多数地区都得到了自治权（当然这其实和其他地方公社没有区别）。而当一个民族得到了足够的表达空间，被压抑的文化就会自然而然地展现出来：布列塔尼地区迎来了可能说几个世纪以来文化最繁荣的时期，但这种文化并非是对于古老的凯尔特民族文化的重演。布列塔尼民族运动天然站在了左翼这一边，他们接纳新的艺术形式，他们试图颠覆传统法国人心目中落后、野蛮、不懂得艺术的布列塔尼形象。\n\n各种先锋主义运动都与布列塔尼的传统文化结合起来，但最重要的或许是在法兰西如火如荼的超现实主义运动。布列塔尼人是全法兰西除去大学生以外最激进的一批人，当然也可以说是最保守的一批人。布列塔尼依旧是对天主教最虔诚的地区，尽管他们对于世俗化并无抵触，但天主教已经成为了布列塔尼文化的一部分。\n\n布列塔尼的农民占据这里的主导地位，他们长期对于联邦倾向工人的举措有所不满，这使得他们更多倾向于农民党这种旗帜鲜明地支持农民利益的党派。当然，人民阵线的执政稍稍改善了布列塔尼人对于当局的抵触情绪，一些中间派选民依旧认为稳定的政治局面是其他工作开展的前提，但越来越多的布列塔尼人开始支持他们的老乡——马塞尔·加香领导的工农共产党。除此之外，作为大战中流血牺牲的士兵的眷属，他们同样被格雷森所吸引，更不要说他们同样支持天主教的特殊地位了。"
  fcf_politics_event.11.a:0 "农业是布列塔尼的根基。"
  fcf_politics_event.11.b:0 "加香同志是我们荣耀。"
  fcf_politics_event.11.c:0 "天主教联系着我们。"
  fcf_politics_event.11.d:0 "人民阵线将收获回报。"

  fcf_politics_event.12.title:0 "新工人"
  fcf_politics_event.12.desc:0 "革命后崛起的最大的政治群体，无疑是由于早期农业政策破产而进如市镇务工的农民工群体。他们与“旧工人”群体的矛盾是显而易见的，尤其是在总工会的问题上，这也使得他们成为了反对总工会的最大主力。但除此之外，他们对于乡村的留念情结也使得他们对于大都市有着一股天然的抵触情绪，这种情绪与对旧工人群体的怨恨结合起来，使得他们必然地走到了反建制的一段。尽管新政府的人民阵线策略起到了一些作用，但随后的“诉总工会案”彻底撕开了裱糊旧工人与新工人之间的矛盾。\n\n“工人贵族”是新工人群体针对总工会的工人或者都会工人的戏谑性表达，但工农共产党和无政府主义联盟都对这个词心有独钟，将其视作革命堕落或不彻底的证据。当然，他们并不会大张旗鼓地去使用这个词，因为许多被视作旧工人的都会工人本身也实在说不上“工人贵族”这个词。况且，他们也作为这两个反建制党派的主要支持者来源。\n\n伴随着新工人和旧工人之间矛盾的，其实也就是新兴市镇-乡村与大都市之间的矛盾，前者由新工人群体以及与其紧密的乡村血缘共同体构成，而后者在这种叙事中始终扮演着传统敌我叙事中十恶不赦的大魔王形象。即使大都会的政治生态要远比这些新工人群体想象的要复杂得多，但他们也更倾向将其视作自身境遇不平等的直接来源（当然在事实上也的确是如此的）。不过比较反直觉的是，他们其实并不怎么支持联邦主义。当然这其实相当好解释，地方自治会导致拥有优势的公社继续保持优势，而缺少发展机遇的公社则无人在意。较强的中央政府则可以相对来说可以通过转移支付的方式来遏制这种地区发展的不平衡，这也使得他们在一定程度上支持法国社会党。"
  fcf_politics_event.12.a:0 "把“工人贵族”拉下马！"
  fcf_politics_event.12.b:0 "必须遏制不平等的发展。"
  fcf_politics_event.12.c:0 "我们曾是士兵，而这个身份绝不会褪去。"

  fcf_politics_event.13.title:0 "齐奏马赛曲"
  fcf_politics_event.13.desc:0 "革命后，关于马赛曲与国际歌之间究竟谁应该视作新政权的国歌，一直争论不休。激进者认为继续使用旧共和国的歌曲总显得“并不革命”，但最终温和派还是占据了上风。马赛曲依旧是法兰西的国歌，而国际歌则成为了联邦的“第二国歌”。当然，马赛曲的歌词被改动到和“公社马赛曲”更加相似，而非完全沿用旧共和国的马赛曲歌词。\n\n虽然马赛曲实际诞生于斯特拉斯堡，但马赛人对该歌曲的热情显然更甚一筹。各种节日，乃至只是日常的集会，都可以听到有人在唱马赛曲。即使马赛曲不作为法兰西的国歌，马赛必然也会将这首歌当作自己的市歌。好在，这种事情并没有发生，马赛市民依然在高唱国歌，即使是到国外去，他们也要如此高唱。\n\n在内战结束后，一部分士气高涨的士兵继续从马赛出发前往意大利支援革命。在意大利局势稳定下来后，马赛成为了老兵和意大利裔工人的聚集地。在战前，马赛的工会就相较于总工会更加独立，在战争爆发的时候，马赛的工会始终站在了反战而非“神圣联合”的一边。这使得马赛自革命结束以来都站在一个相对独立的位置，联合工人党与总工会并没有在此占据优势。相反，自国家工团主义联盟参与政治之后，马赛就固定成为了提供总联邦委员会席位的铁票仓。\n\n在当初“诉总工会案”游行示威的时候，马赛街头也是如此喧闹。这次大选无疑是马赛革命以来最热情的一次投票，他们对于总工会美好幻想的破灭欢欣鼓舞，并意图让一个士兵与革命的化身拯救他们的革命。这种地中海式的热情在很大程度上并不是天性使然，马赛与巴黎的矛盾由来已久，即使在革命后，巴黎在理论上应当是和马赛平起平坐的公社，但联邦的行政机构选址注定了巴黎的特殊地位。马赛人从来都看不惯“巴黎绅士”的游戏，他们或许可以骗骗周边的乡巴佬，但肯定骗不到他们。"
  fcf_politics_event.13.a:0 "老兵不死，革命不死！"
  fcf_politics_event.13.b:0 "总工会在大战时就背叛了我们！"

  fcf_politics_event.14.title:0 "海峡两岸"
  fcf_politics_event.14.desc:0 "在天气晴朗的日子里，从加来的海岸便能望见多佛的白色峭壁。英国的报纸、货物与政治传闻总是随着渡船抵达港口，码头工人、水手和铁路职员也习惯于比较海峡两岸的工资、工会与公共管理。英国革命以后，这些日常往来又获得了新的政治意义：海峡两岸都已属于革命，却走上了并不相同的道路。\n\n加来对盖得主义的认同远早于联邦的建立。矿区与港口城镇中组织严密的工人运动，使这里长期支持建立统一的工人政党，以严明纪律组织政治行动。革命以后，工农共产党继承了这份地方传统，其加强联邦协调与政党领导的主张，也始终能够在当地获得稳定的响应。\n\n然而，近在海峡彼岸的英国又提供了另一种参照。英国的工会更直接地承担国家治理职能，并通过全国性组织协调地方与产业事务。随着选举临近，加来的酒馆、工棚与码头之间也逐渐出现了争论：这里应当继续坚持盖得派的政治传统，还是从英国同志那里学习另一种工人政治？"
  fcf_politics_event.14.a:0 "我们支持加香同志。"
  fcf_politics_event.14.b:0 "英国模式有值得学习的地方。"

  fcf_politics_event.15.title:0 "凡尔登的旧战壕"
  fcf_politics_event.15.desc:0 "大战已经结束近二十年，但在凡尔登郊外，战争从未真正远去。荒草掩盖了坍塌的胸墙，雨水灌满了弹坑，锈蚀的铁丝网仍不时被农民从泥土中翻出。城镇虽然早已重建，墓园、残垣与失去亲人的家庭却依旧提醒着人们：法兰西曾在这里投入整整一代青年，又在失败后失去了胜利者许诺的一切。\n\n革命改变了凡尔登，却无法抹去它的伤痕。废弃军营被改作住宅和疗养院，军需仓库成为地方合作社，重新铺设的铁路也将工人与商品带回了这座边境城市。过去由将军和政客主持的纪念仪式，如今交给了退伍军人、工会与地方委员会；纪念碑上的豪言壮语逐渐褪色，死者的姓名却仍被一遍遍擦拭干净。\n\n联邦选举临近，各党派也不约而同地来到这片旧战壕。有人指向东方，宣称只有洗雪战败的耻辱，才能告慰埋葬于此的亡灵；有人把凡尔登视为对整个欧洲的警告，主张无论哪一方再次挑起战争，都应被全体劳动者视作敌人。还有人认为，法兰西不能永远生活在战壕的阴影下，应当把力量用于建设一个不再需要这些工事的未来；而在另一些人眼中，牺牲、贫困与废墟所揭示的，正是旧世界仍未完成的变革。\n\n同一片土地承载着不同的记忆，也通向不同的明日。凡尔登已经作出过一次牺牲，如今，它还要作出一次选择。"
  fcf_politics_event.15.a:0 "我们将为凡尔登报仇。"
  fcf_politics_event.15.b:0 "谁破坏和平，谁就是我们的敌人。"
  fcf_politics_event.15.c:0 "着眼过去，一无所得。着眼未来，一无所失。"
  fcf_politics_event.15.d:0 "这一切都渴望着变革。"

  fcf_politics_event.16.title:0 "赫里欧的市政社会主义"
  fcf_politics_event.16.desc:0 "在里昂，社会主义并不总是伴随着罢工的号角和工会的旗帜。早在革命以前，爱德华·赫里欧领导的激进社会主义党便长期执掌市政。他既不打算把市政府交给产业工会，也无意等待一场彻底的社会改造，而是试图依靠选举、公共预算与市政机关，一点点改善普通人的生活。这种被称为“市政社会主义”的道路虽不够激进，却在里昂留下了远比政治口号更加具体的痕迹。\n\n在赫里欧任内，市政府兴建学校、医院、公共浴室与廉价住宅，改善交通和城市卫生，并将文化与体育视为市民生活不可或缺的一部分。图书馆、剧院和体育设施相继开放，城市的工业繁荣也被转化为较为完善的公共服务。工会并未因此成为市政权力的核心，但工人确实从中受益；地方企业仍保有经营空间，却必须接受市政府制定的公共规范。革命改变了里昂的政治制度，却没有完全改变这座城市治理自身的方式。\n\n如今，各党派都试图从里昂的成就中找到对自己有利的证明。激进社会主义者宣称，这正是不同左翼力量彼此合作、以务实改革服务人民的结果；社会党人则认为，公共所有、社会福利与民主市政本就是其渐进社会主义的地方实践。至于那些厌倦总工会干预一切的人，里昂更说明了一件事：即使不把城市交给工会，也一样能够建设出属于劳动者的公共生活。"
  fcf_politics_event.16.a:0 "人民阵线就该是这样！"
  fcf_politics_event.16.b:0 "这恰恰证明了社会党模式的成功。"
  fcf_politics_event.16.c:0 "这就是没有总工会的好处。"

  fcf_politics_event.17.title:0 "边境生活"
  fcf_politics_event.17.desc:0 "从比利牛斯山麓到阿尔卑斯河谷，边境居民过着与平原城市截然不同的生活。崎岖的山路把相邻的村镇分隔开来，一场大雪或山洪便足以中断交通；学校、诊所与合作社虽然已经建立，却常因经费不足、人员短缺而难以维持。对当地人而言，联邦的边界或许就在山岭另一侧，但巴黎却似乎比任何外国城市都更加遥远。\n\n两片山区的境况也并不完全相同。比利牛斯的许多村庄仍依靠小农经营、放牧和林业维生，年轻人不断前往山外寻找工作；阿尔卑斯部分河谷则因水电、矿业和旅游业获得了发展，却也让资源较少的公社更加清楚地看见彼此之间的差距。联邦将公共服务交由地方筹办，使富裕地区得以自行改善生活，却让贫困山区始终困在道路失修、产业匮乏与人口外流的循环之中。\n\n选举临近，各党派的代表带着不同的答案来到山间。有人许诺先修好道路、补足诊所和学校，以一件件具体工作重建地方生活；有人认为山区的困境只是整个法兰西制度失衡的缩影，不能依靠零散修补解决；还有人主张引入水电、铁路与新兴产业，让山谷通过经济发展摆脱封闭和贫困。山民已经听过太多宏伟蓝图，如今他们更关心的是：哪一条道路，真正能够通到自己的家门前？"
  fcf_politics_event.17.a:0 "画大饼解决不了问题，实干才能。"
  fcf_politics_event.17.b:0 "落后地区需要改变，全法兰西都需要。"
  fcf_politics_event.17.c:0 "发展的问题只能用发展来解决。"

  fcf_politics_event.18.title:0 "巴黎一曲"
  fcf_politics_event.18.desc:0 "巴黎的一座旧剧院近来上演了一出由维特拉克执笔、阿尔托导演的新戏。它没有完整的情节，也没有固定的主角：街垒从舞台中央缓缓升起，却在转眼间变成工厂的齿轮；无面的人群挤入地铁，又从塞纳河中列队走出；巨大的钟摆扫过观众席，演员们则伴着汽笛、鼓点与机器的轰鸣，反复唱起同一段没有歌词的旋律。到了终幕，破碎的街道、烟囱、纪念碑与人群彼此重叠，共同组成了一座仍在呼吸的巴黎。\n\n演出结束后，没有人能说清自己究竟看到了什么。有人记住了那些彼此冲突的声音如何最终汇成合唱；有人只看见舞台上的一切不断崩塌，仿佛整座城市都在等待重新塑造。有人沉醉于列车、灯光和机械组成的奇异景象，相信未来正从中显现；也有人被终幕中拔地而起的巴黎所震撼，听见了这座城市从街垒时代延续至今的宏大回声。\n\n观众带着各自的解释涌上街头，而那段没有歌词的旋律，仍在他们耳边回荡。"
  fcf_politics_event.18.a:0 "我听到了团结。"
  fcf_politics_event.18.b:0 "我听到了变革。"
  fcf_politics_event.18.c:0 "我听到了进步。"
  fcf_politics_event.18.d:0 "我听到了伟大。"

  fcf_politics_event.19.title:0 "两种日子"
  fcf_politics_event.19.desc:0 "清晨的汽笛在里尔与边境另一侧先后响起。两边的纺织工人走进相似的厂房，呼吸着同样呛人的煤烟，却过着不尽相同的日子。在比利时，工人的生活依旧受制于厂主、房东与教会；在里尔，学校、诊所、公共浴室和廉价住宅已逐渐成为公社负责的公共事业。两地相隔不过几十公里，革命却在日常生活之间划出了一条清晰的界线。\n\n然而，里尔的改变远不如里昂那般显著。大战留下的破坏尚未完全修复，拥挤的工人院落仍随处可见，纺织业的衰退也使市政财政捉襟见肘。萨朗格罗试图通过公社委员会改善住房、卫生与教育，却无法仅凭地方预算解决失业、产业调整和区域发展的难题。在这座盖得主义根基深厚的城市里，市政社会主义证明了公共权力能够改善生活，也暴露了地方改革所能抵达的边界。\n\n一些人仍从中看到了一条不同于工会政治的道路：改革未能尽善尽美，并不意味着它毫无价值。但新社会主义者给出了另一种解释——既然市政府的有限干预已经有所成效，就更应把它扩展到整个法兰西，以强有力的联邦权力统筹工业、就业与公共建设。局限于一城一地的市政社会主义，只是尚未完成的开端。"
  fcf_politics_event.19.a:0 "萨朗格罗证明了另一种可能。"
  fcf_politics_event.19.b:0 "残缺的永远比不上完整的。"

  fcf_politics_event.20.title:0 "“德国人”的选票"
  fcf_politics_event.20.desc:0 "香槟乡间的人们总把福格特一家称作“德国人”。埃米尔的父母来自莱茵河另一侧的阿尔萨斯，在他出生前便离开故乡，辗转来到这里经营一座小农庄。家里说着带有德语腔调的法语，壁炉旁还挂着一幅早已褪色的阿尔萨斯地图；但对埃米尔而言，真正熟悉的只有香槟的葡萄架、泥泞的乡道，以及邻居们半带玩笑的称呼。\n\n埃米尔恰好赶在年龄界限以前出生，因而比身边那些革命后出生的伙伴更早获得了投票权。朋友们虽然还不能走进投票站，谈起政治却比他热心得多。有人提醒他，人民阵线修建的学校、诊所和道路确实改变了农庄的生活；有人认为，村里人世代信赖的主张总不会错。学过机械的朋友向他描绘拖拉机、电泵与新式收割机，声称技术终会让农民摆脱无休止的劳作；还有人指着福格特家的旧地图，问他难道不想让父母失去的故乡重新回到法兰西吗？\n\n直到投票前夜，埃米尔仍没有拿定主意。母亲没有替他选择，只是在收拾完农具后告诉他：邻居的愿望、朋友的道理和父辈的记忆都可以听，但选票既然写着他的名字，最后就该遵循自己的内心。"
  fcf_politics_event.20.a:0 "人民阵线的确改变了我们的生活。"
  fcf_politics_event.20.b:0 "乡亲们热爱的才是我应该坚守的。"
  fcf_politics_event.20.c:0 "技术的发展可以让母亲少劳作一些。"
  fcf_politics_event.20.d:0 "我还记得那我未曾谋面的故乡。"

  fcf_politics_event.21.title:0 "不情愿的公民"
  fcf_politics_event.21.desc:0 "阿黛尔·吉罗成年后的第一张选票，很快便成了家中争吵的缘由。她的父亲是里昂总工会的一名老工人，参加过革命，也始终把投票视为劳动者必须履行的责任。然而，阿黛尔对他的往事早已听得厌烦。在她看来，各党派都说着相似的漂亮话，选票投给谁并不会改变自己的生活。父亲听后勃然大怒，斥责她只享受革命带来的权利，却不愿承担公民的责任，要她回房好好想清楚。\n\n阿黛尔把自己锁在房间里，直到夜深，母亲才轻轻推门进来。她没有像父亲那样谈论革命、总工会和阶级，只是提醒女儿，这张选票既不是欠父辈的债，也不是交给某个党派的礼物。父亲之所以愤怒，是因为他亲眼见过普通人没有选择的日子；但有了选择以后，阿黛尔也不必永远照着父亲的道路前进。她可以听取父母的意见，也可以怀疑所有现成的答案，只是不能把冷漠误认为独立。\n\n母亲离开后，阿黛尔第一次认真翻开了那些被她随手丢在桌上的传单。父亲那一代人推翻了旧世界，母亲则教会她如何在新世界中作出自己的判断。直到窗外渐渐泛白，她终于知道该把那张选票投给谁了。"
  fcf_politics_event.21.a:0 "父亲说的或许是对的。"
  fcf_politics_event.21.b:0 "母亲总有她的一套道理。"
  fcf_politics_event.21.c:0 "父辈的革命已经结束，但我们的革命还没开始！"

  fcf_politics_event.22.title:0 "幸灾乐祸"
  fcf_politics_event.22.desc:0 "黑色星期一过后，从莱茵河彼岸传来的消息一天比一天糟糕。证券交易所闭门停业，银行门前挤满人群，工厂接连停产，曾经支撑德意志霸权的马克、债券与工业托拉斯仿佛在一夜之间失去了信用。德国报纸竭力呼吁国民保持镇定，巴黎街头却几乎无人掩饰自己的快意：那个凭借战争与资本统治欧洲的帝国，如今终于被自己的繁荣压垮了。\n\n各党派很快便将德国的灾难搬上讲台。有人宣称，德国工人运动放弃革命、屈从帝国秩序之时，便已注定要同资产阶级一道承担今日的代价；有人相信，失业与饥饿终将把德国工人重新推向街垒，使黑色星期一成为世界革命的新起点。另一些人则把危机归咎于德国片面追求工业扩张、海外市场与军事霸权，认为错误的发展道路必然产生一连串更大的错误；而在最激烈的演说中，银行家、容克与工业巨头被一并钉上耻辱柱——日耳曼金融资本终于被自己制造的锁链勒住了脖子。\n\n没有人知道德国的混乱最终会带来什么，但在今天的法兰西，人们更愿意把它当作一场迟来的报应。讲台上的说法各不相同，台下的笑声却出奇一致。"
  fcf_politics_event.22.a:0 "背叛工人阶级的代价显现了。"
  fcf_politics_event.22.b:0 "世界革命的契机到了。"
  fcf_politics_event.22.c:0 "错误的发展就会导致一系列错误。"
  fcf_politics_event.22.d:0 "日耳曼金融资本自食恶果。"

  fcf_politics_event.23.title:0 "多数政府"
  fcf_politics_event.23.desc:0 "各地联合委员会的委派结果陆续送抵巴黎，新一届总联邦委员会的席位分布终于尘埃落定。经过数日核算，一个选举联盟成功越过了半数门槛。支持者涌上街头庆祝，各党部的电报往来彻夜未停；至少在数字上，联邦已经不必面对一个四分五裂、无人能够主导的议场。\n\n然而，选举的胜利还没有产生一个新的公共安全委员会。联盟内部仍需统一施政纲领，协调对各项职务的主张，并决定将以怎样的面貌面对接下来的表决。过半多数让他们掌握了主动，却没有消除党派之间的分歧；如今每一次内部协商，都可能影响未来数年的联邦政治。\n\n一些人认为，选民已经作出了明确选择，联盟应当保持团结，凭借现有多数兑现共同纲领。另一些人则主张趁胜向议场中的友好力量伸出手：既然胜利已经到手，便不妨为未来争取更广泛的支持。总联邦委员会已经产生，但围绕公共安全委员会的较量才刚刚开始。"
  fcf_politics_event.23.a:0 "另一场胜利的开始。"
  fcf_politics_event.23.b:0 "我们还可以有更多朋友。"

  fcf_politics_event.24.title:0 "妥协政府"
  fcf_politics_event.24.desc:0 "各地联合委员会的委派结果陆续送抵巴黎，新一届总联邦委员会的席位分布却没有给出一个明确的胜利者。没有任何选举联盟越过半数门槛，最大的联盟距离多数仍有一段距离，其余席位则分散在立场各异的党派手中。选民作出了选择，却没有把联邦的主导权单独交给任何一方。\n\n围绕接下来一系列表决的协商很快开始。最大的联盟仍希望以自身纲领为基础争取支持，但若想推动任何人事安排或重要议案，就必须向其他党派作出让步。预算可以重新商议，委员人选可以听取各方意见，一些最具争议的主张也只能暂时搁置。没有人愿意正式承担共同执政的责任，却总会有人愿意以一次弃权或几张赞成票，换取对自己诉求的承诺。\n\n这不会是一个拥有稳定多数的政治安排。每项议案都需要重新寻找支持，每次分歧都可能使此前的承诺失去效力。但在选票没有产生明确多数的情况下，联邦只能依靠一次又一次的协商继续运转。妥协并非任何人的胜利，只是所有人暂时接受的结果。"
  fcf_politics_event.24.a:0 "看来我们只能如此了。"
  fcf_politics_event.24.b:0 "但我们这里有一个多数政府！"

  fcf_politics_event.25.title:0 "激进派脱离总工会"
  fcf_politics_event.25.desc:0 "长期以来，革命工团委员会的成员虽然大多同时活跃于联合工人党，却仍在总联邦委员会中优先支持总工会。他们相信，明确的政治纲领固然重要，但工人运动首先应当维持统一；只要总工会仍能容纳彼此竞争的革命路线，它便应当先于任何政党成为工团主义者在联邦政治中的共同代表。\n\n如今，这种立场已经难以维持。随着新的政治合作逐渐成形，总工会与各党之间原有的界线正在发生变化。对一些人而言，总工会正被带向一条难以接受的温和道路；对另一些人而言，总工会内部漫长而反复的争论，已经不足以回应眼前出现的激进政治契机。无论出于抵制还是进取，革命工团委员会都开始认为，继续把总工会列为第一选择，只会束缚自身的政治行动。\n\n经过内部表决，革命工团委员会决定调整其在总联邦委员会中的支持次序：联合工人党将取代总工会，成为其成员的第一选择。革命工团委员会并未退出总工会，其成员仍将留在各级工会组织中活动；然而在联邦政治的议场上，他们今后将首先以联合工人党的政治路线采取行动。组织上的联系依然存在，维系共同政治代表的纽带却已经断裂。"
  fcf_politics_event.25.a:0 "这将会是总工会的再一次分裂吗？"

  fcf_politics_event.26.title:0 "任命$PCSP$"
  fcf_politics_event.26.desc:0 "“公共安全委员会”这个名字，可以追溯到法兰西革命史上最严峻的年代。公社革命爆发后，各地政权初立，前线、运输、粮食和治安亟须统一协调，革命者再次启用了这个古老的名称。战争结束后，临时机构并未被撤销，而是在历次制度改革中逐渐摆脱紧急机关的性质，成为总联邦委员会之下常设的联邦执行机关。\n\n如今的公共安全委员会负责执行总联邦委员会通过的法律与决议，并处理地方机关无法单独解决的联邦事务。它无权自行立法，也不能取代各公社、联合委员会与行业工会的自治权力；各委员则依照部门分工独立处理具体事务，而非事事交由委员会集体表决。\n\n公共安全委员会主席是这个庞大行政体系的协调者。主席安排委员会工作，统筹各部门行动，并在职责重叠或意见冲突时作出最终裁决，却不得越过委员直接接管其部门。主席既不是联邦的国家元首，也不是凌驾于总联邦委员会之上的领袖，但当所有行政线索汇聚到巴黎时，总要有人决定它们应当朝哪个方向延伸。"
  fcf_politics_event.26.a:0 "$FRA_maurice_thorez$。"
  fcf_politics_event.26.b:0 "$FRA_pierre_semard$。"
  fcf_politics_event.26.c:0 "$FRA_robert_bothereau$。"
  fcf_politics_event.26.d:0 "$FRA_jean_zyromski$。"
  fcf_politics_event.26.e:0 "$FRA_adrien_marquet$。"
  fcf_politics_event.26.f:0 "$FRA_barthelemy_montagnon$。"
  fcf_politics_event.26.g:0 "$FRA_edouard_berth$。"

  fcf_politics_event.27.title:0 "新任$CAE$"
  fcf_politics_event.27.desc:0 "外交委员掌管法兰西公社联邦与外部世界之间的正式联系。驻外代表、外交使团、国际会议与政府间谈判都由其部门组织；从贸易争端和侨民事务，到盟国之间的协调与迫近边境的危机，最终都会送上外交委员的办公桌。\n\n然而，外交委员能够谈判，却不能独自决定联邦的命运。重要条约仍须交由总联邦委员会批准，新的国际义务也不能仅凭外交部门的一纸承诺成立。外交委员必须在总联邦委员会确定的原则下寻找妥协，并与经济、军事等部门协调每一项可能影响联邦内外政策的决定。\n\n这个职位需要的并不只是雄辩。外交委员必须让盟友相信法兰西的承诺，让中立者理解法兰西的意图，也让敌人无法误判法兰西的底线。不同候选人或许会使用不同的语言，但最终能够传出巴黎的，只能有一个声音。"
  fcf_politics_event.27.a:0 "$FRA_drieu_la_rochelle$。"
  fcf_politics_event.27.b:0 "$FRA_louis_deschizeaux$。"
  fcf_politics_event.27.c:0 "$FRA_alfred_rosmer$。"
  fcf_politics_event.27.d:0 "$FRA_jean_longuet$。"
  fcf_politics_event.27.e:0 "$FRA_gaston_leval$。"
  fcf_politics_event.27.f:0 "$FRA_joseph_paul_boncour$。"
  fcf_politics_event.27.g:0 "$FRA_jean_baptiste_severac$。"
  fcf_politics_event.27.h:0 "$FRA_pierre_laval$。"
  fcf_politics_event.27.i:0 "$FRA_marc_sangnier$。"

  fcf_politics_event.28.title:0 "新任$CE$"
  fcf_politics_event.28.desc:0 "经济委员负责将总联邦委员会的经济立法与预算授权变成能够执行的行政方案。联邦预算草案、跨区域建设、联邦工厂、产业协调和对外经济事务，都需要经济部门整理数据、分配经费并监督执行。地方与行业无法独力承担的项目，也往往要经过经济委员之手才能获得联邦支持。\n\n但经济委员并不是整个法兰西经济的总管。工厂委员会仍负责工厂的日常经营，行业工会保留自身的协调职能，各地也拥有依法支配地方财政的权力；联邦银行则直接向总联邦委员会负责，不受经济委员指挥。经济委员只能在法律和预算规定的用途、额度与期限内选择项目，并公开说明资金来源与执行结果。\n\n正因如此，这个职位的权力既庞大又零碎。经济委员无法命令每一台机器开动，却能决定哪些铁路得到延伸、哪些联邦工厂获得投资，以及哪些地区将在下一份预算中被优先照顾。数字看似沉默，但每一个数字背后，都站着等待工作、设备和面包的人。"
  fcf_politics_event.28.a:0 "$FRA_hubert_lagardelle$。"
  fcf_politics_event.28.b:0 "$FRA_barthelemy_montagnon$。"
  fcf_politics_event.28.c:0 "$FRA_louis_vallon$。"
  fcf_politics_event.28.d:0 "$FRA_gaston_monmousseau$。"
  fcf_politics_event.28.e:0 "$FRA_robert_bothereau$。"
  fcf_politics_event.28.f:0 "$FRA_rene_belin$。"
  fcf_politics_event.28.g:0 "$FRA_jean_baptiste_lebas$。"
  fcf_politics_event.28.h:0 "$FRA_pierre_besnard$。"
  fcf_politics_event.28.i:0 "$FRA_marcel_poimboeuf$。"

  fcf_politics_event.29.title:0 "新任$CSI$"
  fcf_politics_event.29.desc:0 "地方警察负责日常秩序，国内安全委员面对的则是那些越过地方边界、足以威胁整个联邦的问题。跨地区犯罪、政治暴力、破坏活动与针对联邦机关的阴谋，都由其领导的安全部门调查；当地方机关无力处理，或案件牵涉多个地区时，联邦警察也可以依法介入。\n\n国内安全委员必须维持各地警察之间的协作，保护联邦机关和重要设施，并及时向公共安全委员会报告可能扩大的危机。但这个职位并不支配地方行政，更不能代替法院定罪。搜查、拘捕与紧急措施仍须受到法律约束，安全部门的行动也必须接受总联邦委员会和司法机关的监督。\n\n任何制度都需要有人守卫，问题在于守卫者应当站在哪里。过于迟疑，敌人便可能利用联邦的分散与宽容；越过界限，负责保卫革命的人又可能成为革命最危险的威胁。国内安全委员掌握的，正是这条界线。"
  fcf_politics_event.29.a:0 "$FRA_simon_sabiani$。"
  fcf_politics_event.29.b:0 "$FRA_paul_ramadier$。"
  fcf_politics_event.29.c:0 "$FRA_jacques_doriot$。"
  fcf_politics_event.29.d:0 "$FRA_adrien_marquet$。"
  fcf_politics_event.29.e:0 "$FRA_charles_tillon$。"
  fcf_politics_event.29.f:0 "$FRA_roger_salengro$。"
  fcf_politics_event.29.g:0 "$FRA_may_picqueray$。"
  fcf_politics_event.29.h:0 "$FRA_eugene_frot$。"

  fcf_politics_event.30.title:0 "新任$CC$"
  fcf_politics_event.30.desc:0 "文化委员负责联邦层面的文化、教育协调与公共文化事业。联邦所属的博物馆、档案馆、广播机构和文化交流项目由其部门管理；总联邦委员会制定的公共教育与文化标准，也需要文化委员同各地机关协商落实。\n\n法兰西的学校、剧院、出版社和艺术团体并不直接听命于联邦。各地仍可按照自身情况安排教育与文化活动，艺术创作也不是行政机关可以预先规定的事务。文化委员所能做的，是向贫困地区提供资源，维持跨地区的公共机构，保护历史遗产，并让各地居民都有机会接触联邦共同的文化生活。\n\n然而，没有一种文化政策真正中立。该保存怎样的过去、鼓励怎样的艺术，又应当向下一代讲述怎样的革命，都会影响法兰西未来对自身的理解。文化委员没有权力规定人们必须如何思考，却能决定哪些声音更容易被整个联邦听见。"
  fcf_politics_event.30.a:0 "$FRA_marcel_bucard$。"
  fcf_politics_event.30.b:0 "$FRA_jean_perrin$。"
  fcf_politics_event.30.c:0 "$FRA_ludovic_zoretti$。"
  fcf_politics_event.30.d:0 "$FRA_marceau_pivert$。"
  fcf_politics_event.30.e:0 "$FRA_leo_lagrange$。"
  fcf_politics_event.30.f:0 "$FRA_andre_colomer$。"
  fcf_politics_event.30.g:0 "$FRA_jean_zay$。"
  fcf_politics_event.30.h:0 "$FRA_paul_vaillant_couturier$。"
  fcf_politics_event.30.i:0 "$FRA_georges_bertier$。"

  fcf_politics_event.31.title:0 "新任$CGFF$"
  fcf_politics_event.31.desc:0 "联邦军总参谋长是海陆空各军种参谋体系的最高协调者。总参谋长负责制定防御与动员计划，统筹各军种的训练、部署、补给和作战准备，并向公共安全委员会报告联邦军的真实状况。战争一旦来临，分散在不同军种与战区的力量必须通过总参谋部组成一支军队。\n\n总参谋长可以提出军事判断，却不能替联邦作出政治决定。调动军队的权力属于公共安全委员会，并须依照联邦制度取得总联邦委员会主席的批准；主动发动战争或扩大国际义务，更不属于军人能够自行决定的事务。总参谋长的职责，是把政治机关作出的合法决定转化为可以执行的军事行动。\n\n这个职位因此处在军队与政治之间。一个软弱的总参谋长可能使联邦军各自为战，一个过于强势的总参谋长却可能把军事需要凌驾于联邦制度之上。总联邦委员会将要选出的，不只是一位优秀的军官，也是一位知道军队为何而战、又应当止步于何处的人。"
  fcf_politics_event.31.a:0 "$FRA_maurice_gamelin$。"
  fcf_politics_event.31.b:0 "$FRA_ernest_petit$。"
  fcf_politics_event.31.c:0 "$FRA_henri_gerard$。"
  fcf_politics_event.31.d:0 "$FRA_nestor_makhno$。"
  fcf_politics_event.31.e:0 "$FRA_charles_delestraint$。"
  fcf_politics_event.31.f:0 "$FRA_antoine_bethouart$。"
  fcf_politics_event.31.g:0 "$FRA_gabriel_bougrain$。"
  fcf_politics_event.31.h:0 "$FRA_aime_doumenc$。"

  fcf_politics_event.32.title:0 "多列士辞职"
  fcf_politics_event.32.desc:0 "联合工人党赢得了选举，然而党部中的庆祝气氛很快便被另一场争论冲淡。席位的增长无可置疑，但很少有人愿意将这场胜利归功于多列士及其人民阵线路线。恰恰是在竞选逐渐偏离原有策略、党内反对派取得更多主动之后，联合工人党才重新聚拢了支持者。胜利属于党，却未必属于领导它的人。\n\n人民阵线派试图把结果解释为多年联合政策终于结出的果实，但中央委员会中的多数已不再接受这种说法。在他们看来，选举证明的不是人民阵线仍然有效，而是联合工人党即使摆脱多列士为它规定的道路，也完全能够取得胜利。随着各地组织相继要求重新检讨党的路线，多列士虽然赢得了议场中的多数，却失去了党内的多数。\n\n在随后召开的中央委员会会议上，多列士宣布辞去总书记职务。他声称自己不愿让党内争论损害来之不易的胜利，但所有人都清楚，联合工人党已经不准备再由人民阵线派决定前进的方向。现在，党的领导权将交给那些真正塑造了这场胜利的人。"
  fcf_politics_event.32.a:0 "赛马尔将成为新的党书记。"
  fcf_politics_event.32.b:0 "罗斯默将成为新的党书记。"

  election_news_desc:0 "世界社会主义和工团主义的心脏——法兰西公社联邦，在近日完成了新一届总联邦委员会的重组。作为一个革命工人国家，与资本主义民主国家不同，选举的投票站点往往设置在工厂的附近，工人阶级得以在上班的途中就完成投票。但本届选举中，民众的政治热情则远超政府的设想，联邦不得不额外设立投票站点以容纳数量庞大的人群。\n\n"
  fcf_politics_event.33.title:0 "人民阵线赢得法国大选"
  fcf_politics_event.33.desc:0 "$election_news_desc$而选举的结果也在意料之内，人民阵线守住了他们的执政地位。过去五年里虽然发生了诸多事情，但是他们的改革的确惠及了广大的中间选民。至于他们会继续稳步推进改革，还是展现出激进的真面目，还尚未可知。"
  fcf_politics_event.33.a:0 "恭喜同志们！"
  fcf_politics_event.33.b:0 "赤匪的把戏。"

  fcf_politics_event.34.title:0 "反对派联盟赢得法国大选"
  fcf_politics_event.34.desc:0 "$election_news_desc$而选举的结果也在意料之内，工农共产党和无政府主义联盟的反对派联盟击败了人民阵线，成功终结了联合工人党和总工会的政治王朝。但许多人担心，盖得主义者和无政府主义者的差异过大，执政联盟将持续不了多久。"

  fcf_politics_event.35.title:0 "法国社会党赢得法国大选"
  fcf_politics_event.35.desc:0 "$election_news_desc$而选举的结果也在意料之内，法国社会党凭借着波尔多经济奇迹成功吸引到了广大的法国公民。他们的务实举措虽然在很多激进派看来是背离了社会主义，但他们自称为“崭新的社会主义者”。而事实就是，他们成功被群众抬进了执政的宝座。"

  fcf_politics_event.36.title:0 "国家工团主义联盟赢得法国大选"
  fcf_politics_event.36.desc:0 "$election_news_desc$但选举的结果出乎人的意料，人民阵线与反对派联盟都没有拔得头筹，而强调民族主义和民粹主义的国家工团主义联盟取得了委员会多数。许多人将此归因于乔治·格雷森庞大的舆论网络，但事实就是，他们已经成为了联邦的新领导者。"

