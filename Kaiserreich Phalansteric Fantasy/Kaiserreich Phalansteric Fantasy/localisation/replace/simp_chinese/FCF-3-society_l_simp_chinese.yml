#激进团体
  FCF_society_categories_extreme:0 "过于激进的政治团体"
  FCF_society_categories_desc_extreme:0 "革命并不是解决一切问题的良药，旧共和国的问题同样会在公社出现。“国王的报贩”等极右翼政治团体虽然在本土早已偃旗息鼓，但并不妨碍新的政治激进派系出现。他们大多对公社现有的政治不满，亦或是对于自己的处境感到愤懑，当然也存在单纯希望通过公社的灰色地带来谋取利益的。\n\n但总而言之，即使这些群体并没有在明面上威胁或反对公社的革命性质，但却实打实地影响到了公社人民的生活。甚至有足购影响力的派系已经开始了对基层政治的干预，对这种事态的坐视不管显然有违于人民政府的定义。当然，这些派系在一些人眼里看起来是眼中钉，但在另一部分人眼里，可能就是务实的盟友了。"

#超现实运动
  FCF_society_categories_surrealism:0 "超现实主义运动"
  FCF_society_categories_desc_surrealism:0 "托洛斯基的《文学与革命》成为了这位俄国革命者在法兰西的遗作，安德烈·布勒东接过了孕育社会主义新文化的大旗，而乔治·巴塔耶深深着迷于这位“先知”的殉道，一同加入到了超现实主义运动之中。两位性格迥异的领袖撕咬着超现实主义，勒内·克雷韦尔将它的灵与肉统合起来：这位魅力超群的调和者将布勒东的托洛斯基主义和巴塔耶的低贱唯物主义铸造成了超现实主义的矛与盾。\n\n法国人一向乐于接纳新兴的文化，但这种传统更多流行于上层和精英之中，在一个普罗大众的社会主义联邦之中，超现实主义这种晦涩难懂的文化是否下沉到工人们的生活中去，还是沦为一种象牙塔中的闭塞文化，还尚未可知。"
