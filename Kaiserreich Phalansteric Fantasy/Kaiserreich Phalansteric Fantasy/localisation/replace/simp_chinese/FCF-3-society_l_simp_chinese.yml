  FCF_society_pop_workers_mission_available_trigger:0 "至少对§Y$FCF_city_zone$§!进行[?workers_mission_target_investment_count|.0Y]次投资（目前[?workers_mission_investment_count|.0Y]）"

  FCF_society_activate_pop_peasants_mission:0 "$FCF_society_pop_peasants_mission$"
  FCF_society_pop_peasants_mission:0 "$FCF_society_pop_peasants_name$ 发展欠发达地区"
  FCF_society_pop_peasants_mission_need:0 "我们需要在[?180|Y.0]天内至少对§Y$FCF_rural_zone$§!进行[?peasants_mission_target_investment_count|.0Y]次投资"
  FCF_society_pop_peasants_mission_available_trigger:0 "至少对§Y$FCF_rural_zone$§!进行[?peasants_mission_target_investment_count|.0Y]次投资（目前[?peasants_mission_investment_count|.0Y]）"

  FCF_society_activate_pop_merchants_mission:0 "$FCF_society_pop_merchants_mission$"
  FCF_society_pop_merchants_mission:0 "$FCF_society_pop_merchants_name$ 保持稳健财政"
  FCF_society_pop_merchants_mission_need:0 "我们需要在[?180|Y.0]天内确保$economy_power$保持在至少[?merchants_mission_target_economy_power|.0Y]以上"
