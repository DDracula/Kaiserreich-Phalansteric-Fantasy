#社会决议栏
  FCF_society_category:0 "[FCF_society_category_loc]"
  FCF_society_category_desc:0 "[FCF_society_category_desc_loc]"

  FCF_society_category_main:0 "社会状况"
  FCF_society_category_desc_main:0 "即使我们推翻了反动的大资产阶级的统治，也不意味着我们的人民就一劳永逸地满意了，社会各阶层的人们依旧有着自己的诉求，甚至往往会和其他的阶层的诉求产生冲突。但无论如何，是这些诉求各异的群体组建成了我们的国家，他们的满意与不满都会投射在我们社会的方方面面，从经济到军事，从政治到文化。\n（§g阶层的影响力决定了他们影响的事物与倍率，而满意度决定了他们影响的具体数值§!）"
#通用阶层
  FCF_pop_mission_general_tt:0 "\n我们每次完成任务都将提高§Y要求§!和§G奖励§!，如果在规定期间未完成目标，则将任务要求和奖励设置为§Y初始状态§!"

  FCF_society_activate_pop_workers_mission:0 "$FCF_society_pop_workers_mission$"
  FCF_society_pop_workers_mission:0 "$FCF_society_pop_workers_name$ 扩大工业生产"
