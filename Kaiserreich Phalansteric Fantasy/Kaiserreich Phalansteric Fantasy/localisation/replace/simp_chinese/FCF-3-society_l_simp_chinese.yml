#激进团体
  FCF_society_category_extreme:0 "过于激进的政治团体"
  FCF_society_category_desc_extreme:0 "革命并不是解决一切问题的良药，旧共和国的问题同样会在公社出现。“国王的报贩”等极右翼政治团体虽然在本土早已偃旗息鼓，但并不妨碍新的政治激进团体出现。他们大多对公社现有的政治不满，亦或是对于自己的处境感到愤懑，当然也存在单纯希望通过公社的灰色地带来谋取利益的。\n\n但总而言之，即使这些群体并没有在明面上威胁或反对公社的革命性质，但却实打实地影响到了公社人民的生活。甚至有足购影响力的派系已经开始了对基层政治的干预，对这种事态的坐视不管显然有违于人民政府的定义。当然，这些派系在一些人眼里看起来是眼中钉，但在另一部分人眼里，可能就是务实的盟友了。"

#超现实运动
  FCF_society_category_surrealism:0 "超现实主义运动"
  FCF_society_category_desc_surrealism:0 "托洛斯基的《文学与革命》成为了这位俄国革命者在法兰西的遗作，安德烈·布勒东接过了孕育社会主义新文化的大旗，而乔治·巴塔耶深深着迷于这位“先知”的殉道，一同加入到了超现实主义运动之中。两位性格迥异的领袖撕咬着超现实主义，勒内·克雷韦尔将它的灵与肉统合起来：这位魅力超群的调和者将布勒东的托洛斯基主义和巴塔耶的低贱唯物主义铸造成了超现实主义的矛与盾。\n\n法国人一向乐于接纳新兴的文化，但这种传统更多流行于上层和精英之中，在一个普罗大众的社会主义联邦之中，超现实主义这种晦涩难懂的文化是否下沉到工人们的生活中去，还是沦为一种象牙塔中的闭塞文化，还尚未可知。"


#事件
  fcf_society_events.1.title:0 "马丁案周年游行"
  fcf_society_events.1.desc:0 "一切最初只是巴黎近郊一家机械厂里的工伤事故。一次加班期间，吕西安·马丁所操作的冲床突然失控，夺去了他的双手。厂方坚称机器并无故障，事故完全源于马丁操作不当，只愿支付一笔勉强足以应付医疗费用的补偿。工头雅克也站在厂主一边；在他看来，马丁既然始终不肯加入总工会，便没有资格在出事以后寻求工会的帮助。\n\n没有人亲眼目睹事故发生的一刻，机器的维护记录也无法证明马丁的说法。地方劳动仲裁最终采信了厂方的辩解，认定他应当为自己的残疾负责。律师亨利·托雷斯随后无偿接下此案，并以案件涉及非总工会工人的基本劳动保障为由，取得特别上诉许可，将马丁的申诉直接递交联邦最高法院。然而，公众的同情无法代替法庭所需要的证据，最高法院仍然维持了原有裁决。\n\n连续两次败诉并未平息争议，反而让这场原本寻常的工伤纠纷迅速扩散。无政府主义者开始怀疑，马丁的不幸并非一次孤立的意外，几名调查者遂绕过厂方与地方机构，私下追查事故设备的来源及厂主在当地的关系。就在调查逐渐接近机械厂背后的秘密时，两名调查者却在一场旅店爆炸中丧生。\n\n爆炸案顷刻间引燃了此前积压的一切不满。街头要求查明死者遇害的真相，报刊追问地方当局究竟在掩盖什么，总联邦委员会内部也开始追究政府长期失察的责任。蒙穆索未能承受住这场政治风暴，最终被迫下台；杜穆兰正是在爆炸案引发的危机中接掌政府，也继承了这桩再也无法搁置的旧案。\n\n新政府随即下令展开正式调查，试图以一份完整的官方报告还原事件经过。然而，无政府主义联盟不愿把揭露真相的主动权交给政府。他们抢在调查结束之前公布了手中掌握的材料，迫使那些原本还能被斥为传闻的线索暴露在公众面前。直到此时，人们才知道那台冲床确实早已年久失修；厂主还在别处经营着数家未经登记的黑工厂，并凭借自己在地方政府和总工会中的私人关系屡次逃过检查。\n\n涉案人员随后受到惩处，黑工厂遭到查封，雅克与厂主维持多年的勾连也被公之于众。然而，这些迟来的真相并没有自动推翻马丁身上的旧裁决。托雷斯依据新证据提起诉讼，将厂主、地方政府与总工会一并列为被告，试图证明马丁所遭受的不公并非只来自某个工头或某个厂主，而是来自一张足以干扰监督、排斥非会员的关系网。法庭最终却认为，厂主对私人关系的利用不足以证明总工会作为一个整体应当承担法律责任；托雷斯对案件性质的扩张，也超出了现有证据所能支持的范围。马丁又一次败诉了。\n\n于是，这桩案件留下了一个格外荒诞的结局：黑工厂确实存在，机器确实疏于维护，厂主也确实曾借助总工会中的熟人逃避监督，可那个因此失去双手的人，仍被旧裁决认定为事故的责任者。“马丁案”由此成了报刊赋予整场风波的名字。支持总工会的人坚持认为，不能因为少数人的营私舞弊便让整个工人组织坐上被告席；反对者则追问，如果总工会的名义能够成为地方关系户的护身符，如果非会员在工厂里受到排斥以后仍无处讨回公道，那么组织是否真的可以把这一切都归结为私人行为？\n\n最后一次败诉两周年之际，人群再次走上巴黎街头。有人要求撤销马丁身上的旧裁决，有人要求彻查依附于总工会的地方关系网，也有人只是在胸前挂起一双空荡荡的工作手套，沉默地跟随队伍前进。当游行抵达总联邦委员会门前时，新政府所要回答的早已不再只是一桩工伤案：革命许诺给工人的平等，是否同样属于那些没有加入总工会的人？"
  fcf_society_events.1.a:0 "我们终会为历史负责。"
  FCF_economy_CGT_reform_protest:0 "马丁案游行"
  FCF_economy_CGT_reform_protest_desc:0 "马丁案留下的错误判决及其政治余波一直延续到了今天。政府内部仍在讨论总工会改革——或者说相互攻击，但人民已经没有耐心再等下去。上一届政府未能彻底解决问题，新政府既已产生，便必须对总工会的经济地位、会员特权以及非会员劳动者的基本权利作出回答。一边是要求打破总工会事实性优势的反对者，一边是依靠其产业协作、互助和组织网络生活的大量普通工人。无论选择何种改革，如果政府继续沉默，积累的矛盾只会越来越多。"
  FCF_economy_CGT_reform_protest_tt:0 "§R我们应该尽快对总工会做出改革§!"
  FCF_economy_CGT_reform_protest_has_happened:0 "马丁案游行已经发生"

  fcf_society_events.2.title:0 "妇女节骚乱"
  fcf_society_events.2.desc:0 "文本大意：1938年4月11日，为纪念在1871年4月11日成立的“保卫巴黎和救护伤员妇女联盟”而设立的妇女节的庆祝活动于巴黎共和国广场进行。激进女权主义者出来打乱了这次联邦组织的游行，并提出了更加激进的要求。"
  fcf_society_events.2.a:0 "又一个烂摊子。"
  FCF_society_womens_day_parade:0 "妇女节抗议"
  FCF_society_womens_day_parade_desc:0 "文本大意：女性对于自己权利的桎梏已经无法忍耐，倘若我们还算是一个社会主义国家，就不应该漠视人民之半的诉求。"
  womens_day_parade_has_happened:0 "妇女节游行已发生"

  fcf_society_events.3.title:0 "执法失误"
  fcf_society_events.3.desc:0 "文本大意：一名警官在逮捕一位移民（族裔待定）嫌犯的时候，粗暴地将其控制，使得嫌犯无法维持基本生命体征，在缉拿归案前，该嫌犯就以逝世。"
  fcf_society_events.3.a:0 "一次小小的过失罢了。"

  fcf_society_events.4.title:0 "抗议游行"
  fcf_society_events.4.desc:0 "文本大意：无政府报纸报道了这次执法失误，并将其视作对于人权的漠视。认为暴力机关在没有确认犯罪事实的情况下就对嫌疑人实施暴力行为，甚至将其致死，是在侵犯公民人权。这一报道使得许多移民与公民群体不满，并走上街头抗议这次执法。"
  fcf_society_events.4.a:0 "又一次游行！？"
  FCF_society_police_enforcement_parade:0 "反暴力执法游行"
  FCF_society_police_enforcement_parade_desc:0 "文本大意：移民问题终于爆发，支持者和反对者都试图借此来证明自己的观点正确，移民社区的日益壮大带来的犯罪问题与其为经济注入的火力想比，究竟谁才是应该被取舍的哪一个？当然，无论选择哪一个，总会有人不满意。"

  fcf_society_events.5.title:0 "服务队与邦诺帮"
  fcf_society_events.5.desc:0 "文本大意：介绍一下随时准备服务队和邦诺帮的信息。"
  fcf_society_events.5.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.6.title:0 "卫队与绿衫军"
  fcf_society_events.6.desc:0 "文本大意：介绍一下社会正义卫队和农民防御委员会的信息。"
  fcf_society_events.6.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.7.title:0 "军团和方阵"
  fcf_society_events.7.desc:0 "文本大意：介绍一下军团和无产者方阵的信息。"
  fcf_society_events.7.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.8.title:0 "统一政权下黑手党"
  fcf_society_events.8.desc:0 "文本大意：科西嘉回归以后，黑手党活跃的上天了"
  fcf_society_events.8.a:0 "但愿是好事。"