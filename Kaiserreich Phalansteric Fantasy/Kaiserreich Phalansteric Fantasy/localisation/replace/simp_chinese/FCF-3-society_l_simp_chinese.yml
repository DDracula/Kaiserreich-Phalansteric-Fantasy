  fcf_society_event.2.title:0 "妇女节骚乱"
  fcf_society_event.2.desc:0 "文本大意：1938年4月11日，为纪念在1871年4月11日成立的“保卫巴黎和救护伤员妇女联盟”而设立的妇女节的庆祝活动于巴黎共和国广场进行。激进女权主义者出来打乱了这次联邦组织的游行，并提出了更加激进的要求。"
  fcf_society_event.2.a:0 "又一个烂摊子。"
  FCF_womens_day_parade:0 "妇女节抗议"
  FCF_womens_day_parade_desc:0 "文本大意：女性对于自己权利的桎梏已经无法忍耐，倘若我们还算是一个社会主义国家，就不应该漠视人民之半的诉求。"
  womens_day_parade_has_happened:0 "妇女节游行已发生"

  fcf_society_event.3.title:0 "执法失误"
  fcf_society_event.3.desc:0 "文本大意：一名警官在逮捕一位移民（族裔待定）嫌犯的时候，粗暴地将其控制，使得嫌犯无法维持基本生命体征，在缉拿归案前，该嫌犯就以逝世。"
  fcf_society_event.3.a:0 "一次小小的过失罢了。"

  fcf_society_event.4.title:0 "抗议游行"
  fcf_society_event.4.desc:0 "文本大意：无政府报纸报道了这次执法失误，并将其视作对于人权的漠视。认为暴力机关在没有确认犯罪事实的情况下就对嫌疑人实施暴力行为，甚至将其致死，是在侵犯公民人权。这一报道使得许多移民与公民群体不满，并走上街头抗议这次执法。"
  fcf_society_event.4.a:0 "又一次游行！？"
  FCF_police_enforcement_parade:0 "反暴力执法游行"
  FCF_police_enforcement_parade_desc:0 "文本大意：移民问题终于爆发，支持者和反对者都试图借此来证明自己的观点正确，移民社区的日益壮大带来的犯罪问题与其为经济注入的火力想比，究竟谁才是应该被取舍的哪一个？当然，无论选择哪一个，总会有人不满意。"