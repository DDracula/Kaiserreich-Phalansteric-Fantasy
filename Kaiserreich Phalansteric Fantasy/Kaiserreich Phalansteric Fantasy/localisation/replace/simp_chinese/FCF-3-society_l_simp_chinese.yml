  FCF_society_activate_pop_army_mission:0 "$FCF_society_pop_army_mission$"
  FCF_society_pop_army_mission:0 "$FCF_society_pop_army_name$ 发展军事工业"
  FCF_society_pop_army_mission_need:0 "我们需要在[?180|Y.0]天内至少进行[?army_mission_target_arms_investment_count|.0Y]次$state_investment_situation_mil_tt$"
