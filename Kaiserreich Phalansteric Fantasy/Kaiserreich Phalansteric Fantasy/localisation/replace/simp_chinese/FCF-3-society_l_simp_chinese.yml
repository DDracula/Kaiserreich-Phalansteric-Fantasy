#总工会
  FCF_society_CGT_reform_simplify_management:0 "清理重叠常设机关"
  FCF_society_CGT_reform_simplify_management_tt:0 "合并职责重叠的书记处和专业部门可以§G压缩行政开支并减少责任推诿§!，但也会在改革期间§R削弱跨地区协调与共同服务能力§!；如果随后转向专业治理，还可能遭遇§R合格干部不足§!。"
  CGT_simplified_management:0 "清理总工会的重叠常设机关"
  FCF_society_CGT_reform_strengthen_management:0 "培养专业干部"
  FCF_society_CGT_reform_strengthen_management_tt:0 "加强会计、保险、统计、法律和组织工作的专业训练，可以§G改善总工会的共同服务与行政连续性§!，但需要§R持续投入资源§!，也会增强专业机关在联盟内部的影响。"
  CGT_strengthened_management:0 "培养总工会的专业干部"
  FCF_society_CGT_reform_criticize_decentralization:0 "检讨1930年分权"
  FCF_society_CGT_reform_criticize_centralization:0 "反对重新集权"

  FCF_society_CGT_reform_encourage_workers_reporting:0 "健全基层申诉制度"
  FCF_society_CGT_reform_encourage_workers_reporting_tt:0 "允许会员和工厂委员会越过常设干部提交申诉，并公开处理结果，可以§G加强基层对各级机关的监督§!，但也可能§R增加内部争讼并激化派系冲突§!。"
  FCF_society_CGT_reform_democratize_management:0 "扩大基层代表监督"
  FCF_society_CGT_reform_democratize_management_tt:0 "扩大基层代表对常设干部的选举、质询与撤换权，可以§G巩固工会自治和会员控制§!，但会在权责重新划分期间§R造成暂时的组织混乱§!。"
  FCF_society_CGT_reform_coordination_mechanism:0 "建立产业—地域协调程序"
  FCF_society_CGT_reform_coordination_mechanism_tt:0 "在产业联合会、地方工联和工厂委员会之间规定协商与仲裁程序，可以§G减少权责冲突并维持跨地区协作§!，但也会§R限制把全部权力继续下放给基层的改革幅度§!。"
  FCF_society_CGT_reform_connect_with_CNS:0 "缔结国工联改革协定"
  FCF_society_CGT_reform_connect_with_CNS_tt:0 "联合工人党与国家工团主义联盟将共同支持以基层代表、工会自治和公开监督整顿总工会，使§G自我监督路线获得稳定的执政多数§!，同时削弱主张恢复全国机关支配权的力量。"

  FCF_society_CGT_reform_professional_bureaucrats:0 "扩充专业服务机关"
  FCF_society_CGT_reform_professional_bureaucrats_tt:0 "扩充会计、保险、统计、法律与经济研究部门，可以§G提高共同服务和计划研究能力§!，并同时得到中央派与新浪潮派的支持；但这需要§R长期供养专业干部§!，也可能使基层认为全国机关正在重新膨胀。"
  FCF_society_CGT_reform_unified_branch_standards:0 "确立全国共同工作标准"
  FCF_society_CGT_reform_unified_branch_standards_tt:0 "为账目、债务登记、事故记录、统计和共同服务确立最低标准，可以§G提高全国资料的一致性与跨地区协调能力§!，但会§R增加地方组织的执行成本并压缩其自行处置空间§!。"
  FCF_society_CGT_reform_strengthen_internal_incentive:0 "试行物质奖励制度"
  FCF_society_CGT_reform_strengthen_internal_incentive_tt:0 "把部分报酬同节约、履责和工作成果联系起来，可以§G提高工人与常设干部的积极性§!；但新浪潮派和革命工团主义者都担心这种办法会诱发§R数据造假、内部竞争和新的腐败§!。"
  FCF_society_CGT_reform_connect_with_PSF:0 "缔结社会党—总工会改革协定"
  FCF_society_CGT_reform_connect_with_PSF_tt:0 "法国社会党与总工会将在联合政府内确认共同改革纲领，以全国工作标准、专业服务和计划研究重建协调能力，使§G专业治理路线获得稳定的政治支持§!，同时压缩革命工团委员会反对改革的空间。"
  CGT_centralists_cooperate_with_PSF:0 "$party_PSF$同意与$party_CGT$合作"

  FCF_society_CGT_opposition_investigation_committee:0 "组建特别调查委员会"
  FCF_society_CGT_opposition_investigation_committee_tt:0 "委员会将调查非CGT工人的待遇、公共服务准入、账目责任和工会机关滥用职权的指控。充分证据可以§G增强废除CGT特殊地位的正当性§!，但漫长调查也可能§R消耗政府的政治主动并给CGT留下动员时间§!。"
  FCF_society_CGT_opposition_independent_unions:0 "保障非CGT工会平等待遇"
  FCF_society_CGT_opposition_independent_unions_tt:0 "向天主教工会、自治工会和其他合法组织开放公共设施与协商渠道，可以§G削弱CGT的排他代表权§!；但选择性拨款或行政扶植也可能使政府§R受到培植附庸工会的指控§!。"
  FCF_society_CGT_opposition_independent_delegate:0 "向工会事务派驻联邦监察员"
  FCF_society_CGT_opposition_independent_delegate_tt:0 "联邦监察员可以§G调查法律执行并保护非CGT工人的申诉权§!，却会被CGT视为公共安全委员会侵入工会自治的先例，可能引发§R各派工会共同抵制行政接管§!。"
  FCF_society_CGT_opposition_reversal_of_verdict:0 "重审吕西安·马丁案"

  FCF_society_CGT_opposition_antitrust_law:0 ""提交工会平等审查法案"
  FCF_society_CGT_opposition_investigate_leaders:0 "调查总工会全国机关"
  FCF_society_CGT_opposition_investigate_leaders_tt:0 "调查全国委员会、书记处和专业部门的账目与决策记录，可能§G取得足以迫使CGT让步的证据§!，也可能因缺乏实据而§R被视为针对工运领导层的政治审判§!。"
  FCF_society_CGT_opposition_encourage_grassroots_reporting:0 "征集基层证词"
  FCF_society_CGT_opposition_encourage_grassroots_reporting_tt:0 "向基层会员、非会员工人和地方组织征集证词，可以§G揭示CGT制度特权造成的具体问题§!；若政府以悬赏诱导指控或公开未经核实的材料，则可能§R制造反对派自己的丑闻§!。"
#妇女运动
#激进团体
  FCF_society_category_extreme:0 "过于激进的政治团体"
  FCF_society_category_desc_extreme:0 "革命并不是解决一切问题的良药，旧共和国的问题同样会在公社出现。“国王的报贩”等极右翼政治团体虽然在本土早已偃旗息鼓，但并不妨碍新的政治激进派系出现。他们大多对公社现有的政治不满，亦或是对于自己的处境感到愤懑，当然也存在单纯希望通过公社的灰色地带来谋取利益的。\n\n但总而言之，即使这些群体并没有在明面上威胁或反对公社的革命性质，但却实打实地影响到了公社人民的生活。甚至有足购影响力的派系已经开始了对基层政治的干预，对这种事态的坐视不管显然有违于人民政府的定义。当然，这些派系在一些人眼里看起来是眼中钉，但在另一部分人眼里，可能就是务实的盟友了。"

#超现实运动
  FCF_society_category_surrealism:0 "超现实主义运动"
  FCF_society_category_desc_surrealism:0 "托洛斯基的《文学与革命》成为了这位俄国革命者在法兰西的遗作，安德烈·布勒东接过了孕育社会主义新文化的大旗，而乔治·巴塔耶深深着迷于这位“先知”的殉道，一同加入到了超现实主义运动之中。两位性格迥异的领袖撕咬着超现实主义，勒内·克雷韦尔将它的灵与肉统合起来：这位魅力超群的调和者将布勒东的托洛斯基主义和巴塔耶的低贱唯物主义铸造成了超现实主义的矛与盾。\n\n法国人一向乐于接纳新兴的文化，但这种传统更多流行于上层和精英之中，在一个普罗大众的社会主义联邦之中，超现实主义这种晦涩难懂的文化是否下沉到工人们的生活中去，还是沦为一种象牙塔中的闭塞文化，还尚未可知。"
#事件
  fcf_society_events.1.title:0 ""
  fcf_society_events.1.desc:0 ""
  fcf_society_events.1.a:0 ""
  fcf_society_events.1.b:0 ""

  fcf_society_events.2.title:0 "妇女节骚乱"
  fcf_society_events.2.desc:0 "文本大意：1938年4月11日，为纪念在1871年4月11日成立的“保卫巴黎和救护伤员妇女联盟”而设立的妇女节的庆祝活动于巴黎共和国广场进行。激进女权主义者出来打乱了这次联邦组织的游行，并提出了更加激进的要求。"
  fcf_society_events.2.a:0 "又一个烂摊子。"
  FCF_society_womens_day_parade:0 "妇女节抗议"
  FCF_society_womens_day_parade_desc:0 "文本大意：女性对于自己权利的桎梏已经无法忍耐，倘若我们还算是一个社会主义国家，就不应该漠视人民之半的诉求。"
  womens_day_parade_has_happened:0 "妇女节游行已发生"

  fcf_society_events.3.title:0 "执法失误"
  fcf_society_events.3.desc:0 "文本大意：一名警官在逮捕一位移民（族裔待定）嫌犯的时候，粗暴地将其控制，使得嫌犯无法维持基本生命体征，在缉拿归案前，该嫌犯就以逝世。"
  fcf_society_events.3.a:0 "一次小小的过失罢了。"

  fcf_society_events.4.title:0 "抗议游行"
  fcf_society_events.4.desc:0 "文本大意：无政府报纸报道了这次执法失误，并将其视作对于人权的漠视。认为暴力机关在没有确认犯罪事实的情况下就对嫌疑人实施暴力行为，甚至将其致死，是在侵犯公民人权。这一报道使得许多移民与公民群体不满，并走上街头抗议这次执法。"
  fcf_society_events.4.a:0 "又一次游行！？"
  FCF_society_police_enforcement_parade:0 "反暴力执法游行"
  FCF_society_police_enforcement_parade_desc:0 "文本大意：移民问题终于爆发，支持者和反对者都试图借此来证明自己的观点正确，移民社区的日益壮大带来的犯罪问题与其为经济注入的火力想比，究竟谁才是应该被取舍的哪一个？当然，无论选择哪一个，总会有人不满意。"

  fcf_society_events.5.title:0 "服务队与邦诺帮"
  fcf_society_events.5.desc:0 "文本大意：介绍一下随时准备服务队和邦诺帮的信息。"
  fcf_society_events.5.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.6.title:0 "卫队与绿衫军"
  fcf_society_events.6.desc:0 "文本大意：介绍一下社会正义卫队和农民防御委员会的信息。"
  fcf_society_events.6.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.7.title:0 "军团和方阵"
  fcf_society_events.7.desc:0 "文本大意：介绍一下军团和无产者方阵的信息。"
  fcf_society_events.7.a:0 "现在他们应该站在政府一边了。"

  fcf_society_events.8.title:0 "统一政权下黑手党"
  fcf_society_events.8.desc:0 "文本大意：科西嘉回归以后，黑手党活跃的上天了"
  fcf_society_events.8.a:0 "但愿是好事。"