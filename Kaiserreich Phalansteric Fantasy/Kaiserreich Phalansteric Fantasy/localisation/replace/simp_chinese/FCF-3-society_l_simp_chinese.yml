  FCF_society_categories_main:0 "社会状况"
  FCF_society_categories_desc_main:0 "即使我们推翻了反动的大资产阶级的统治，也不意味着我们的人民就一劳永逸地满意了，社会各阶层的人们依旧有着自己的诉求，甚至往往会和其他的阶层的诉求产生冲突。但无论如何，是这些诉求各异的群体组建成了我们的国家，他们的满意与不满都会投射在我们社会的方方面面，从经济到军事，从政治到文化。\n（§g阶层的影响力决定了他们影响的事物与倍率，而满意度决定了他们影响的具体数值§!）"

  FCF_society_promote_revolutionary_films:0 "宣传革命电影"
#总工会
  FCF_reform_cgt_simplify_management:0 "裁撤管理层"
  FCF_reform_cgt_simplify_management_tt:0 "裁撤管理层可以§G有效减少腐败§!，但这可能§Y对总工会的协作效率造成影响§!，与此同时，这意味着如果我们进行§Y科层化改革§!，那么就可能遭到§R管理层短缺的问题§!"
  CGT_simplifed_mangement:0 "裁撤总工会的管理层"
  FCF_reform_cgt_strengthen_management:0 "训练管理层"
  FCF_reform_cgt_strengthen_management_tt:0 "训练管理层可以§G提高管理层的能力与意识§!，使得他们能够使用§G更加专业的管理手段§!，§Y在理论上§!可以§G减少腐败和低效§!，当然，这也会受到§R激进派的官僚主义指控§!"
  CGT_strengthen_mangement:0 "训练总工会的管理层"
  FCF_reform_cgt_criticize_decentralization:0 "批判分权路线"
  FCF_reform_cgt_criticize_centralization:0 "批判集权路线"

  FCF_reform_cgt_encourage_workers_reporting:0 "鼓励工人检举"
  FCF_reform_cgt_encourage_workers_reporting_tt:0 "鼓励工人检举可以§G加强对于官僚主义的监督§!，但也有可能导致§R公报私仇和加剧派系内斗§!"
  FCF_reform_cgt_democratize_management:0 "进一步民主化管理层"
  FCF_reform_cgt_democratize_management_tt:0 "管理层的民主化可以§G加强基层工人在总工会的势力§!，但这可能导致§R总工会行政体系的暂时混乱§!"
  FCF_reform_cgt_coordination_mechanism:0 "设立协调机制"
  FCF_reform_cgt_coordination_mechanism_tt:0 "协调机制可以§G缓和内部派系斗争的烈度§!，但也可能§R使得激进的改革难以实施§!"
  FCF_reform_cgt_connect_with_CNS:0 "寻求国工联合作"
  FCF_reform_cgt_connect_with_CNS_tt:0 "如果国家工团主义联盟支持我们对于总工会的激进改革，那么我们就可以和总工会内部的温和派决裂，§G迈向更加纯正的革命工团主义§!"

  FCF_reform_cgt_professional_bureaucrats:0 "设置专业官僚"
  FCF_reform_cgt_professional_bureaucrats_tt:0 "专业官僚将§G有效提高总工会的管理效率§!，但这意味着§R大量的资源供养以及潜在的形式主义与脱离群众的风险§!"
  FCF_reform_cgt_unified_branch_standards:0 "统一支部标准"
  FCF_reform_cgt_unified_branch_standards_tt:0 "支部标准的统一将§G大幅提高总工会内部的一致性§!，但这可能导致一些§R地方工会的脱离§!"
  FCF_reform_cgt_strengthen_internal_incentive:0 "加强内部激励机制"
  FCF_reform_cgt_strengthen_internal_incentive_tt:0 "物质刺激将§G有效提高总工会内部工人和管理层的积极性§!，但可能导致§R数据造假和腐败加重§!"
  FCF_reform_cgt_connect_with_PSF:0 "寻求社会党合作"
  FCF_reform_cgt_connect_with_PSF_tt:0 "如果法国社会党支持我们对于总工会的科层制改革，那么我们就可以和总工会内部的激进派决裂，§G迈向更加科学高效的工团主义-社会主义§!"
  CGT_centralists_cooperate_with_PSF:0 "$party_PSF$同意与$party_CGT$合作"


  FCF_against_cgt_investigation_committee:0 "组建特别调查委员会"
  FCF_against_cgt_investigation_committee_tt:0 "特别调查委员会将花费时间去调查总工会内部的种种问题，§G发现的问题越多，我们对于总工会的指控越有效§!\n§R但民众未必有足够的耐心等待漫长的调查结束§!"
  FCF_against_cgt_independent_unions:0 "扶助自由工会"
  FCF_against_cgt_independent_unions_tt:0 "扶持天主教工会或自治工会联合会将有效地§G减少总工会的政治筹码§!，但我们有可能§R被指控以权谋私§!"
  FCF_against_cgt_independent_delegate:0 "设置独立委派员"
  FCF_against_cgt_independent_delegate_tt:0 "独立委派员可以§G增加政府对于工会的权力§!，但可能遭到§R各工会的联合反对§!"
  FCF_against_cgt_reversal_of_verdict:0 "给吕西安·马丁翻案"

  FCF_against_cgt_antitrust_law:0 "递交反垄断法"
  FCF_against_cgt_investigate_leaders:0 "调查总工会高层"
  FCF_against_cgt_investigate_leaders_tt:0 "我们有可能得到§G总工会的重大丑闻§!，迫使其主动做出让步，但也可能导致§R总工会的强烈反弹§!"
  FCF_against_cgt_encourage_grassroots_reporting:0 "鼓励基层举报"
  FCF_against_cgt_encourage_grassroots_reporting_tt:0 "悬赏基层工人的举报可以§G加大总工会的压力§!，但可能§R酝酿成我们的丑闻§!"
