  FCF_society_pop_scholars_mission_need:0 "我们需要在[?180|Y.0]天内至少消耗共计[?scholars_mission_target_spending|Y.0]的£pol_power 政治点数或$economy_power$"
  FCF_society_pop_scholars_mission_available_trigger:0 "至少消耗共计[?scholars_mission_target_spending|Y.0]的£pol_power 政治点数或$economy_power$（目前[?scholars_mission_spent_resources|.0Y]）\n[?economy_power_change] [?political_power_daily] [?scholars_mission_starting_resource_total]"

  FCF_society_activate_pop_bureaucrats_mission:0 "$FCF_society_pop_bureaucrats_mission$"
