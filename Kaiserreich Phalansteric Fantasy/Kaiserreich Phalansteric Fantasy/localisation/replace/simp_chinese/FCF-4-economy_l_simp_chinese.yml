#续总工会事件
  fcf_economy_events.46.title:0 "培养专业官僚：老同志们的抗议"
  fcf_economy_events.46.desc:0 "一批新任人员的名单贴出来后，几位老支部干部联名要求暂缓交接。来信附着一份尚未办结的事故卷宗。厂里、诊所和互助会各有一份记录，三处写的停工日期都不一样。负责这件事的老书记在信上说，他知道该去找当晚值班的医生，也已经约了工人的家属来核对。名单上将接手他职务的人有会计资格，却刚到当地，连诊所的门朝哪边开都还不知道。\n\n起草任用办法的人也带来了一份材料。那是一名在地方做过多年账务的年轻工人的申请，他已经两次因为资历不足，连参加考核的机会都没有。支持新办法的代表问，若每次交接都得等到原任干部手上的事情办完，空缺究竟何时才会出现。也有人要求重新听取老干部的意见，他们多年间联系的工厂、诊所和互助会，平日有事都是凭一个熟悉的名字便能找到人。那份联名信传到开会的桌上时，末尾又多了几行签字。"
  fcf_economy_events.46.a:0 "老同志们的人脉是组织的血脉。"
  fcf_economy_events.46.b:0 "岗位向所有有能力的人开放，无论资历。"

  fcf_economy_events.47.title:0 "培养专业官僚：优化管理的方法"
  fcf_economy_events.47.desc:0 "为了弄清几份领料单为何总是迟到，负责拟订办事规程的同志跟着一张单子走了半天。车间开好单据后，先送支部登记，再由会计核对库存，最后等经办干部签字。会计说，前两个月已经有两回把同一批料发给了不同的班，领料单集中审核以后，这类差错少了许多。车间代表却指出，维修班有时领的只是一件临时替换的零件，送去签字的人回来时，原本半小时就能修好的机器已经停了一个上午。\n\n专职干部提出统一送件和审批的时段，谁经手、在哪一步耽搁，都可以从登记簿上查清。车间代表想先让几个班把最常耽误生产的手续列出来，照他们实际领料和检修的次序重排。管文书的同志则问，能不能让接件的人先核齐凭据、分清缓急，送到签字人手上的只留真正需要裁定的事项。几份意见都附在那张领料单后面，库房下回接到同样的单子，该让送件的人往哪里走，仍要由总工会定下来。"
  fcf_economy_events.47.a:0 "采取干部的意见。"
  fcf_economy_events.47.b:0 "一线工人更知道管理需要改进的地方。"
  fcf_economy_events.47.c:0 "秘书将在新管理模式下发挥更大的作用。"

  fcf_economy_events.48.title:0 "培养专业官僚：过度劳累"
  fcf_economy_events.48.desc:0 "总工会把几处支部的疑难账目交给同一批专职干部处理，起初确实办结了一批拖延已久的案子。到了第二周，一位经办互助金的会计在下班前签错了两张汇款单，直到第二天拆阅回函才发现。她这几天一直留到邮差来收末班信，白天核对账册，入夜后还要把同一笔收支分别抄进地方支部、产业联合会和全国机关的报表。她请了一天假，三个支部的卷宗便一起搁在了桌上。\n\n几位干部要求提高专职人员的薪资。他们原先只领一个岗位的薪水，如今连星期日也得轮流来开办公室。有人翻出了那三份报表，指出其中有些数字抄了三遍，却从来没人拿来核对，索性可以裁去。也有会计事务所表示愿意承接凭据整理和初步核算，最后仍由总工会的人复核签字。各地这个月的账册已经陆续寄到，收发室只好把还未拆封的包裹堆到了窗台上。"
  fcf_economy_events.48.a:0 "提高干部的工资。"
  fcf_economy_events.48.b:0 "减少多余的文书工作。"
  fcf_economy_events.48.c:0 "把一些工作外包出去。"

  fcf_economy_events.49.title:0 "培养专业官僚：学习还是生产"
  fcf_economy_events.49.desc:0 "工人高等学院排出了第一期课程，几家推荐学员的工厂却迟迟交不上出勤表。一名入选的青年钳工负责试装新到的一批设备，车间里能顶他班的人还在赶另一项工程。厂方愿意让他去学，只问能否等设备开动再放人。学院的教员说，几项练习得由同一组学员从查库存一直做到编排生产，中途少了人，剩下的几项也难讲下去，因此希望各厂把学员一次送齐，集中脱产学习。\n\n几个支部提议把学员分批送来，每人轮到上课时照领原有工资，余下的日子仍回厂上班。这样，车间总能留下一批熟手，学员也用不着为了几天课少领工资。学院为此得把同一套课多开几遍，有些合做的练习也要重新安排。负责排班的同志把学员名单带回厂里，用铅笔一个个圈出了不能同时离岗的人。"
  fcf_economy_events.49.a:0 "集中起来脱产培训。"
  fcf_economy_events.49.b:0 "保证薪资的情况下轮班培训。"

  fcf_economy_events.50.title:0 "培养专业官僚：地方人手不足"
  fcf_economy_events.50.desc:0 "几处小镇的支部接连来信，询问前些日子申请的会计何时能到。一处支部由书记兼管账目，他每周还要去邻镇主持两次调解，互助会便只能在他回来的那天办结手续。另一处曾经招到一名合适的人，可支部凑得出的只是半份薪水。那人等了几天，最后接了大厂的聘书。两处寄来的申请写法各异，所求倒是一样，都想有个人能常来，把每月的账按时结清。\n\n全国机关有人建议组织一支流动工作组，沿铁路逐站派员，先把最急的积案办完。地方代表更希望多拨一笔经费，让缺人的支部自行聘任，免得每次碰上月底都要等人来。还有几个相邻的支部提出共用一处事务办，把零散的账务和互助手续集中办理。它们已经看中劳动交易所里一间空屋，只是尚未说定，里面的人该由谁聘，桌上的卷宗又该由谁签字。"
  fcf_economy_events.50.a:0 "设置全国流动工作组。"
  fcf_economy_events.50.b:0 "向资源匮乏的地方提高资助。"
  fcf_economy_events.50.c:0 "在地方设置事物办。"

  fcf_economy_events.51.title:0 "培养专业官僚：新的考核机制"
  fcf_economy_events.51.desc:0 "总工会试拟了一份任职考核表，请几名现任干部照样填报。一位管互助事务的书记按期结清了全年的账，账目也没有差错，考核表上的成绩很好。到了支部会上，却有工人问，为什么申请补助的人总得在开工时间来找他，有时为补一枚印章还要再请半天假。书记把办公室的值班簿拿了出来。按现行规程，他每周只需接待两次，哪两次由支部自己定。\n\n起草考核办法的人希望所有在任干部都按新标准评一遍，把岗位上的职责和实际办成的事情对起来。几位地方代表则建议从新聘人员开始，先让各支部看一看新表到底能考出什么，再谈现任干部的去留。参加讨论的工人代表提出，应把经常来办事的人对干部的评价列入考核，像接待时间和补助拖延这样的事，也该写进最后的评语。书记员把值班簿带回了会场。那份试填的考核表上，还没有一栏可以记下这些意见。"
  fcf_economy_events.51.a:0 "所有职务都应当按照新标准重新考核。"
  fcf_economy_events.51.b:0 "新机制当然面向新人。"
  fcf_economy_events.51.c:0 "工人的评价应当也被纳入考核标准。"

  fcf_economy_events.52.title:0 "重整经济协调体系：CET与DGEN"
  fcf_economy_events.52.desc:0 "一份增拨钢材的请示在劳动经济委员会(Conseil Économique du Travail)和国民经济总指导处(Direction Générale de l’Économie Nationale)之间走了两趟。委员会同意优先供给铁路修造厂，总指导处也查到了可以拨用的库存，钢材却还留在原处。掌管库存的产业联合会来信问，已经答应给别家的那一批该由谁补上。委员会的决议没有写这件事，总指导处的调拨单也还等着联合会签字。铁路方面最后派人跑了三家厂，才凑齐开工所需的钢材。\n\n几位产业代表提出，让劳动经济委员会在议定优先顺序时一并裁决各业的供货责任，免得会上一致赞成的事，会后又得逐家商量。总指导处的干部则希望得到常设的调度权限，由他们按库存、运力和交期处置日常变动，重大事项再交委员会决定。还有人把联邦的公共工程订单摆到了桌上。铁路、港口和各地公社都是大宗订户，只在总工会内部排好先后，遇到两边同时催货还是要重算一遍。他们提议让联邦机关与总工会共同核对需求，定期商议供货安排。"
  fcf_economy_events.52.a:0 "CET将成为CGT的CGF。"
  fcf_economy_events.52.b:0 "DGEN将成为CGT的CSP。"
  fcf_economy_events.52.c:0 "CGT必须同联邦联系起来。"

  fcf_economy_events.53.title:0 "重整经济协调体系：产业链的协作"
  fcf_economy_events.53.desc:0 "联邦公共工程部门要给几处水闸更换闸门，原打算按各工地分别订货。总指导处收到清单后，拿钢厂的库存簿和机械厂的排产表对了一遍，发现几处工地要的钢板规格相同，只是收货日期不同。钢厂可以合在一炉做，机械厂也能接着加工，铁路方面只须按各处工期分批配车。公共工程部门把原先分发的订单收回来重开，其中两处缺少仓储场地的工地也排进了发运表，货到便可安装。\n\n负责采购的同志随后把水闸工程余下几个月的用料计划也送了过来。以前，这类单子要等工程开到下一段才交给各厂，厂里知道要多少，却来不及给它留出炉次。这一回，钢厂看完清单，先在生产簿上给下一批货留了位置，又把开炉日期抄送给加工厂。工地何时停水、厂里何时开炉、铁路哪天派车，三处第一次能拿着同一张表排定日程。"
  fcf_economy_events.53.a:0 "总工会的经济就是联邦的经济。"

  fcf_economy_events.54.title:0 "重整经济协调体系：行业内外的差异"
  fcf_economy_events.54.desc:0 "联邦公共工程部门报来一批水闸工程所需的钢材，总指导处按各厂填报的余量列出了供货名单。请各厂确认时，一家钢厂说，它把下个月才能轧出的钢板也列在了余量里，眼下只能发出一半。另一家厂账上确有那么多钢材，却按仓库里的原料重量填表，切成工地要的尺寸还要去掉不少边料。钢铁业的代表把两份表递回去，各自都知道该从哪一栏扣。接洽工程的同志这才明白，自己照着那一栏安排的车皮，已经多订了两节。\n\n有人要求尽快定下各业共同的填报口径，今后每一笔供货都须写清能发多少、何时能发。也有同志提出，先把这次落空的数目逐项追回去，看看各联合会的库存表在转交总指导处时究竟省略了什么。工程部门已经同工地约了停水日期，眼下还得重新确认哪几处能如期开工。至于那两节车皮，铁路方面希望当天就收到答复。"
  fcf_economy_events.54.a:0 "总工会必须统一标准。"
  fcf_economy_events.54.b:0 "这足以审视我们内部的不足。"

  fcf_economy_events.55.title:0 "重整经济协调体系：计划的力度"
  fcf_economy_events.55.desc:0 "劳动经济委员会审议冬季的燃料安排时，桌上已经摆着各地的煤炭需求、铁路运力和储备明细。前几次调拨的回单也找齐了，哪一批煤改送了别处、由谁签字，翻开卷宗便能查到。代表们同意先保铁路和市镇供暖。争论出在决议的最后一页，上面列出了各区每旬可以领到的吨数。总指导处的经办人问，若北方的一条支线因积雪停运，他们能否从邻区先调一批煤过去，事后再报委员会核查。\n\n有代表主张由委员会定下优先顺序和储备底线，具体从哪座矿发煤、运往哪一站，交给总指导处随时处置。另一些代表要求把数量和期限一并写进决议。各地正是看过这些数字才同意让出一部分配额，临时改动也应该由委员会批准。他们愿意随时回来开会，只希望总指导处在改发车皮之前先把理由报上来。"
  fcf_economy_events.55.a:0 "CET只会给DGEN提供大致的方向。"
  fcf_economy_events.55.b:0 "DGEN只是执行CET意志的工具。"

  fcf_economy_events.56.title:0 "重整经济协调体系：讨论的依据"
  fcf_economy_events.56.desc:0 "国民经济总指导处送来一份压缩铁路货运的草案。按现有报表，几家铸造厂都备有两个星期的焦炭，可以把车皮先让给缺煤的市镇。产业代表翻到其中一页，指出有家厂把月底才会到货的一批焦炭也写进了库存。技术人员请他出示运单，对方只带来了支部会议的记录，上面写着供货方已口头答应按期发车。会场上又有人问，既然好几家的数字都还得等回函，委员会究竟该拿哪一份表开始讨论？\n\n总指导处的同志希望先以能核实的库存和运力拟定草案，等凭据送到再逐项修正。劳动经济委员会的代表则要求，把各地已经提出的停工风险、供暖请求和交货承诺一并列入议程。有些事来不及记进月报，可等到下一份表送来，厂里也许已经熄了炉。主席把会议推迟到下午，请双方各交一份当天必须议决的事项。两份清单送到秘书手里，排在第一项的，已经是两桩不同的事。"
  fcf_economy_events.56.a:0 "DGEN只依靠于技术的草案。"
  fcf_economy_events.56.b:0 "CET代表们的议程也必须被考虑。"

  fcf_economy_events.57.title:0 "重整经济协调体系：整齐划一的立场"
  fcf_economy_events.57.desc:0 "劳动经济委员会表决下一季的用煤次序时，原本要求保留全部配额的冶金业代表也举了手。总指导处把各矿的产量和铁路修造厂的用煤量逐项列了出来，几家钢厂只须把检修提前一周，便能在铁路最缺煤的几天匀出一批燃料。委员会又请铁路工会当场确认，腾出的煤会先送往两处修造厂，钢厂恢复生产时，原定供给也能接上。表决结束后，矿工代表留在席上，把发运日期逐一抄给了各矿。\n\n会后，有代表说，钢厂肯提前检修，是因为谁先用煤、谁后用煤，都由各业代表当面议定。总指导处的同志则说，若事先没有算清停炉和复产的日子，席上的人就算都举手，也没人敢回去改班表。书记员把这两段发言都记了下来。委员会同意的供煤安排只有一份，至于下回再碰到这种争执，究竟应当把哪一种办法定为常例，会上还可以接着谈。"
  fcf_economy_events.57.a:0 "CET的伟大源于民主的授权。"
  fcf_economy_events.57.b:0 "CET的强大来自专业的治理。"
  fcf_economy_events.57.c:0 "这是CET重要性的体现。"

  fcf_economy_events.58.title:0 "重整经济协调体系：过度干预的指控"
  fcf_economy_events.58.desc:0 "一家机器厂接到通知，要把原定供给几处地方修造所的钢材转给一项跨区工程。支部代表带着三份已经签好的供货单赶来，问总工会打算让那些修造所等到什么时候。其中一家已经拆开两台抽水机，就等这批钢材加工新轴。负责调拨的同志也带来了一封催函。跨区工程的施工队已经到场，同一批钢材若不能按期运到，几处工地都得停下来等。两边都拿得出交期，会场上便有人追问，当初是谁答应可以动用这批已有去处的钢材。\n\n有人要求重新核对几项争议工程的用料，先听完受影响支部的意见。也有人坚持，应当照现有授权办理，临到装车再把决定交还各厂，今后谁也无法按调拨单安排工期。还有代表问，既然总工会的决定会牵动地方修造所和联邦工程，能否让两边共同核定哪一批货可以改拨，并把补供日期一并签下来。支部代表听完，只问了一句，假如谁也答不上那两台抽水机何时能修好，这张调拨单是否本来就该退回去。"
  fcf_economy_events.58.a:0 "争议的项目将被重新审视。"
  fcf_economy_events.58.b:0 "既有授权不会撤回。"
  fcf_economy_events.58.c:0 "CGT有必要对联邦负有更多的责任。"
  fcf_economy_events.58.d:0 "似乎的确如此。"

  fcf_economy_events.59.title:0 "重整经济协调体系：写入章程"
  fcf_economy_events.59.desc:0 "关于经济协调的几份议案终于合成了一稿。起草人把原先散在会议记录里的条款一一移入章程，写清谁受理跨区供货的请求，谁能签发调拨单，地方工会接到异议后该向哪里呈报。几位常年替支部跑手续的代表要求尽快公开一份改革大纲。过去，一笔供货出了问题，各地往往要给几个机关同时写信。他们希望下一批订单发出之前，经手的人至少已经知道第一封信该寄往哪里。\n\n仍有代表要求把少数意见附在章程后面。会上争议最大的几条涉及临时调拨和地方的复议权，有些修正案虽未获通过，提出它们的支部仍希望日后复审时能查到当初的理由。书记员已经誊好了大纲，也收齐了各方要求保留的文字。印刷所来问页数时，附录上的几个名字还等着本人签字。"
  fcf_economy_events.59.a:0 "公开改革大纲。"
  fcf_economy_events.59.b:0 "允许少数意见附录。"

  fcf_economy_events.60.title:0 "结束投资乱象：烂尾项目"
  fcf_economy_events.60.desc:0 "一座停工的轧钢车间头一回有了一份完整的账。负责汇总的人把地方支部的工程表、产业基金的拨款单和合作银行的借据放在一起，才看出三家都把接通电力的费用列在了别人名下。主机已经运到，装卸队也拿了工钱，变电设备却始终没人订购。再查其他工地，有的只消补上最后一道工序便能投产，有的连原定接收产品的工厂都已经另作安排。\n\n出资各方请总工会中央出面，重新商定债务和余下的工程款，至少把还有销路的项目做完。也有代表主张由原先批准开工的支部自行处置，欠款和续建都由它们同债权人谈。至于那些即使完工也无人接货的车间，设备商已经来问过，愿不愿意把尚未拆箱的机器转给别处。轧钢车间的看守把钥匙送回了支部。他下月就要换岗，临走前想知道，还要不要托人给主机上油。"
  fcf_economy_events.60.a:0 "中央将协商投资重组。"
  fcf_economy_events.60.b:0 "支部需要对这些项目自行负责。"
  fcf_economy_events.60.c:0 "清除无价值的项目。"

  fcf_economy_events.61.title:0 "结束投资乱象：支部的项目"
  fcf_economy_events.61.desc:0 "工会投资基金的筹备消息传到地方，几处支部立刻寄来了工程合同。一家修造厂已经把新机床的底座砌好，设备商却说，收到尾款才肯发货。支部原指望从本季的收入里补齐这笔钱，如今银行要先看总工会的答复，才肯续办借款。另一处支部送来的只是一份订金收据，厂房还没动工，也请求按已经开办的项目处理。两份信都说，停下来，先前付的钱就未必拿得回来了。\n\n有人要求给已经投入资金的项目补足尾款，免得快能开工的车间也一起停下。地方代表提出留出一段过渡期，让支部先按原有合同履约，到期再把未结的项目报上来。也有会计认为，至少应当先查清钱究竟花在了哪里，机器已经交货和只付过一笔订金，两种情形总得有个分别。修造厂把原定装机的日子抄在回函上。设备商给它留的发运日期，只能再保留一个星期。"
  fcf_economy_events.61.a:0 "为已投资项目提供尾款。"
  fcf_economy_events.61.b:0 "设置项目过渡期限。"
  fcf_economy_events.61.c:0 "对这些项目进行审查。"

  fcf_economy_events.62.title:0 "结束投资乱象：资金流向"
  fcf_economy_events.62.desc:0 "几家工厂打算合买一台大型锻锤，商议了一个月，还差最后一家签字。它的支部愿意出钱，合作银行却查出，支部准备用来出资的那笔收入，早已押给了另一项扩建工程。总工会在商议投资基金的章程时拿到了这份借据。有人问，若中央只看向基金申报的项目，下次再有人拿同一笔收入作两次担保，中央仍得等银行来信才会知道。\n\n几位代表据此要求把各级工会的投资一律报中央审议，连担保也登记在同一套账上。地方代表则愿意为跨厂、跨区工程预留一笔共同投资额度，日常添置设备仍由各厂自行安排。也有人提议为共同工程另设公共融资办法，由工会基金、合作银行和有关公共机关依照项目进度分担出资。锻锤的订购单还压在银行桌上。前三家厂已经签了字，第四家能拿什么作保，正是新章程要回答的问题。"
  fcf_economy_events.62.a:0 "所有投资都需要经过中央审议。"
  fcf_economy_events.62.b:0 "预留共同投资额度。"
  fcf_economy_events.62.c:0 "建立配套的公共融资机制。"

  fcf_economy_events.63.title:0 "结束投资乱象：联邦指标"
  fcf_economy_events.63.desc:0 "联邦送来两套可供列入投资计划的项目。排在第一套前面的是一座特种钢试验炉。几家机床厂和军工厂一直受制于合格钢材的供给，试验成功后，它们便有望按自己的需要订制料号。负责试验的工程师已把改造旧炉和另建新炉的账都算了一遍。他说，眼下还可以挤出一座旧炉做小批试验，真要让各厂用得上，必须给这项工程留出连续几年的经费。\n\n另一套项目来自各地的农机合作社和消费合作社。几处产粮区想合建修造所和仓库，先把收获季节修不好机器、粮食运不到市镇的问题解决。代表们带来的材料里还有两座小城的粮价表。同样一袋面粉，产地和市镇的价差足够抵掉农机修造所一年的开支。联邦请总工会先定下第一批拨款的次序。两边都已报出能动工的日期，争议在于，哪一类收益应当最先写进投资计划。"
  fcf_economy_events.63.a:0 "优先战略产业和技术突破。"
  fcf_economy_events.63.b:0 "优先考虑人民生活水平。"

  fcf_economy_events.64.title:0 "结束投资乱象：共同资金的意图"
  fcf_economy_events.64.desc:0 "讨论工会投资基金的首批用途时，一位来自山区的代表问，小厂和穷地方也缴钱，为什么交上来的项目总得等别人挑剩了再议。他所在的几个支部合用一间修理铺，坏掉的电动机要送到百里以外，往返一趟能耽搁半个月。几家出资较多的产业联合会也有自己的账要算。它们愿意拿出一部分积累共同投资，希望头一批工程就能替所属工厂减少停工、降低采购成本，让各支部有理由继续缴款。\n\n还有人铺开了一张铁路和电网的图，指出几座厂各自添置设备，仍要等同一条支线运货，也仍受同一座电站限制。他们提议先把各地的工程排进一份全国计划，按线路、电力和原料供应的次序逐年拨款。这样一来，有些眼看就能开工的项目也得往后排。山区代表看了看图，问修理铺离最近的一处拟建变电站究竟有多远。负责绘图的人拿起尺子，沿着那条尚未修通的支线量了起来。"
  fcf_economy_events.64.a:0 "注重薄弱产业和落后地区。"
  fcf_economy_events.64.b:0 "投资的首要任务是确保工会的利益。"
  fcf_economy_events.64.c:0 "全国计划将带来更长远的收益。"

  fcf_economy_events.65.title:0 "重组会员互助业务: 互助基金的形式"
  fcf_economy_events.65.desc:0 "一名锅炉工因伤停工，地方工会先从急难金里垫了两周的生活费。医生后来认定他短期内无法复工，产业联合会便接手核算长期给付。到月底，两边都把第一笔钱记成了自己的支出，也都等着对方寄来结算单。总工会请几处支部把同类案卷送来，才发现有的地方早已将急难救济和长期给付分账，有的地方连异地就医的车费也从同一本账里支。\n\n各地愿意把账目说清楚，至于账册该留在哪里，意见便分开了。有人主张同各基金逐一议定，哪些业务应当合办，哪些仍归原处，并留一段时间处理旧案。几位地方代表愿意接受共同的给付和报账规则，但希望基金仍由熟悉当地情形的人经办。全国机关的会计则提议把账册和未结案卷一并报到中央，由中央确定归属和审理办法。那名锅炉工下个月还要领钱。照新办法，第一张收据究竟该交给谁，仍待议定。"
  fcf_economy_events.65.a:0 "通过协商进行分类并设置改革缓冲期。"
  fcf_economy_events.65.b:0 "仅设立共同规则，形式仍以地方基金为主。"
  fcf_economy_events.65.c:0 "全部由中央分类并审理。"

  fcf_economy_events.66.title:0 "重组会员互助业务：混乱的权责关系"
  fcf_economy_events.66.desc:0 "一所由工会企业经营的疗养所退回了三张转介单。地方工会原先答应为三名伤病工人留床，产业联合会也已核准费用，疗养所的经办人却把床位另作安排。地方代表赶去查问，才知道企业的账上只收到一笔笼统的拨款，没有写明预留床位的数目。负责收治的人说自己只管空床，批准拨款的人说自己只管付款。三名工人的入所日期都已经写在通知上，到头来谁也说不清，那份通知是凭谁的承诺发出去的。\n\n总工会有人要求调整涉事企业的经办人员，把接收转介、安排床位和通知申请人交给明确的负责人。疗养所的职工则要求先把值班簿、收款记录和床位名单拿到职工会上核对。他们说，床位原先留给了谁、后来又是谁叫人改了名单，值班的人知道得最清楚。地方工会已经派人给三名工人送去延期通知，唯独负责解释延期缘由的那一栏，还空在那里。"
  fcf_economy_events.66.a:0 "对涉事的工会企业进行人事调整。"
  fcf_economy_events.66.b:0 "工人会自行揪出组织中的蛀虫。"

  fcf_economy_events.67.title:0 "重组会员互助业务：烂账与坏账"
  fcf_economy_events.67.desc:0 "中央把各地送来的互助账册逐笔对过，发现有些账上的钱早已取不出来。一个支部把互助金借给本地的工会企业周转，展期两次，仍照借据上的原数列作储备。企业停业以后，那一栏也没有改过。另一处的账倒是平的，可几笔已列作付清的补助只有汇款存根，查不到收款人的签字。负责核对的人把月底应付的款项加起来，手头的现款连第一批都不够。\n\n有代表主张由中央先补上差额，免得领补助的人等到旧账查清才拿到钱。另一些人要求把这些年批准借款、准许展期和签字销账的文件全部找齐，追查每一笔损失该由谁负责。还有人提出，往后应由中央派人常驻经办机构，大额支出和对外借款都要经过复核。几位地方会计愿意交出原始凭据，只请中央尽早回话。照往常的日子，领取补助的人过几天就会来排队。"
  fcf_economy_events.67.a:0 "中央将填补差额。"
  fcf_economy_events.67.b:0 "进行全面调查并对涉事人员进行追责。"
  fcf_economy_events.67.c:0 "必须设置中央的委派员进行财务监督。"

  fcf_economy_events.68.title:0 "重组会员互助业务：非会员的权益"
  fcf_economy_events.68.desc:0 "一家工会企业的两名装卸工在同一场事故里伤了腿。法定赔偿照例申报，复诊的路费却要另想办法。两人住在同一个镇，要搭同一趟早车去医院。其中一人凭会员证领到了车费补助，另一人的申请被退了回来。办事员翻出互助会章程给他看，里面只写了缴过互助费的会员可以申领。那名工人问，既然厂里每年也给互助会拨钱，他能否凭雇佣证明再申报一次。办事员找遍了抽屉，手上没有可供他填写的表。\n\n一些代表认为，会员按期缴费，互助会应先把答应给会员的待遇办妥。也有人提出，工会企业雇用的非会员至少可以享受几项与工作直接相关的服务，费用由企业和互助机构另行结算。地方代表则希望由各支部看自己的账来定。大厂附近有几处可以接收转介的诊所，有些地方连给会员报销车费都得等到月底。医院已经约好了下次复诊的日期，两名工人还会一起去赶那班车。"
  fcf_economy_events.68.a:0 "如果不缴纳费用，自然无法享受到相同的服务。"
  fcf_economy_events.68.b:0 "被工会企业雇佣的非会员也可以享受到部分服务。"
  fcf_economy_events.68.c:0 "各支部可以对此自行决断。"

  fcf_economy_events.69.title:0 "重组会员互助业务：提供服务的困境"
  fcf_economy_events.69.desc:0 "河谷几处工厂共用一所诊所。近来诊所的护士请了长假，医生每周只来两个下午，工人做完一次检查，往往要隔十天才能回来换药。互助会答应报销去邻镇诊所的车费，后来才发现，晚班工人下班时，最后一趟公共汽车早已开走。地方经办人把诊所的值班表寄给总工会，顺手在背面算了笔账。即便车费全能报销，有些人来回一趟仍得少上半个班。\n\n地方代表要求为诊所添置设备、补聘人员。几位工人则愿意抽时间学包扎、护理和登记，让各厂有人能先处理小伤，也能在诊所忙不过来时搭手。邻镇的诊所表示可以接收一部分转介，只要总工会肯按期结算。负责预算的人另拟了一份缩减方案，准备先保留最急的服务，其余改为隔周办理。那张值班表又传回了河谷，几家厂正等着据此安排下个月的班次。"
  fcf_economy_events.69.a:0 "这显然是需要投资的地方。"
  fcf_economy_events.69.b:0 "工人们应当学习相关的技能，以备不时之需。"
  fcf_economy_events.69.c:0 "一部分服务可以外包出去，中央将提供资金。"
  fcf_economy_events.69.d:0 "在资源不足的地区缩减服务质量和范围。"

  fcf_economy_events.70.title:0 "重组会员互助业务：虚假报告"
  fcf_economy_events.70.desc:0 "一处地方互助会报称，上月替二十多名非会员支付了异地就医的车费。核账的人照着名册给接诊的医院写信，医院回说，其中几个人根本没有来过。再去查支出的凭据，才发现所谓车费是按开出的转介单估算的。真正领到钱的只有七人，其余款项已经转去垫付工会企业的工资。地方经办人说，企业只借用几天，等货款一到就能补回去。问到为什么把钱记成已经发放的补助，他又说，那张月报照往例由自己签发，无须再给别人过目。\n\n同一叠凭据里，有两张转介单已经过期。持单的工人原本在等车费，后来自己借了钱去医院。地方支部请求宽限几日，等企业把款项归还，再补办两人的手续。全国机关的会计把这封信夹在月报后面。按月报上的数目，这笔钱早已发完，下月的拨款也已经照它核定。至于拿到转介单的人最后有没有看上病，整份报告上一个字也没有。"
  fcf_economy_events.70.a:0 "我们有必要收回地方的财政权！"

  fcf_economy_events.71.title:0 "重组会员互助业务：熟人工会"
  fcf_economy_events.71.desc:0 "镇上的互助会开始接收非会员的申请后，一名季节工先后去了三次。第一回，办事员让他找一位本地工友作保。第二回，他带来雇主的证明，对方又说还得等委员开会。等他第三次去，才知道和他同一天递申请的一名工人已经领了补助。那人也没有会员证，只是常年在镇上做工，几个委员都认识他，散会前就替他把手续办了。\n\n几位本地工人听说此事，陪季节工到支部问了个明白。委员们说，基金的钱有限，遇上急事，总得先救济那些他们知道底细的人。一名陪同的工人当场问，既然雇主的证明和诊所的单据都在，他们还想知道什么底细？会后，有人请支部把受理条件贴到门口。办事员找出了原先的告示，上面只写着非会员也可以提出申请，至于还要认识谁，一个名字也没有。"
  fcf_economy_events.71.a:0 "他们这完全是辜负我们的信任。"

  fcf_economy_events.72.title:0 "重组会员互助业务：对马丁案的反思"
  fcf_economy_events.72.desc:0 "1934年的马丁案把一个问题摆到了总工会面前。城里有人能凭一张转介单进工会的诊所，乡下有人拿着公社开具的救济证明，却找不到肯接诊的地方。公社未必雇得起医生，附近的工会诊所有时又恰好空着床位。讨论互助章程时，一位医生带来了一张欠费单。他已经给病人做完了治疗。公社说经费得等下月拨付，互助会则问，这笔钱该记在谁的账上。\n\n有代表建议让工会机构先收治，等病人安顿下来，再向应当负担费用的机构追偿。也有人主张从互助资金中划出一部分，拨给公社的诊所和救济机构，让居民可以直接在当地得到服务。几位互助会的经办人另拟了一份收费表，建议把疗养、康复等补充服务向非会员开放，另定收费，所得用来维持床位和人手。医生听完，把欠费单留在了桌上。他下周还要接诊，想知道再有人带着公社的证明来时，柜台该怎么给人办手续。"
  fcf_economy_events.72.a:0 "总工会将先提供服务再进行追偿。"
  fcf_economy_events.72.b:0 "总工会可以把一部分资金注入到社会公共服务中。"
  fcf_economy_events.72.c:0 "非会员可以通过特殊的价格获取会员的服务。"

  fcf_economy_events.73.title:0 "重构工会企业关系：实质的经理"
  fcf_economy_events.73.desc:0 "一家机器厂的工厂委员会开会审议亏损，出面解释的却是厂里的生产书记。去年起，原料由他订购，各车间的班次由他安排，外厂催货也直接来找他。委员会每月听一次汇报，平时只在涉及大额支出时表决。有人问起那批赔钱的订单是谁签下的，生产书记从公文包里取出了合同。上面盖的是委员会的章，签字却只有他一个人的。\n\n几位代表主张把实际主持经营的人正式任为经理，将他可以签什么、出了亏损要向谁交代，一并写进任命书。也有人认为，许多工厂靠现有办法运转得好好的，应当先在经营不善的企业试行。车间代表更关心委员会还能过问多少。他们愿意让一个人管日常经营，但要求委员会有权随时查账、审议重大合同，并在必要时撤换经理。那份亏损合同最后留在了会议桌上。下个月续不续签，委员会这次打算亲自问一问。"
  fcf_economy_events.73.a:0 "如果一个职务干的都是经理的事情，那这就是经理。"
  fcf_economy_events.73.b:0 "先在经营状况不好的企业改革经理制。"
  fcf_economy_events.73.c:0 "要求工厂委员会保有对经理的足额监督权。"

  fcf_economy_events.74.title:0 "重构工会企业关系：工会优先还是企业优先？"
  fcf_economy_events.74.desc:0 "一家钢管厂收到了产业联合会的来函，请它腾出一条生产线，给几处缺料的工厂赶制一批管材。厂里的会计把来函同现有订单对了一遍。临时换产得推迟一笔已经签下的交货，连夜加班又要多付工资。联合会列出了几家等料的工厂，其中两家再过几天就得停工，却没有说明赶工的费用由谁承担。厂里的工人听说要改班，先到会计那里问，这笔账月底会不会从本厂的收入里扣。\n\n产业代表说，钢管厂平日能按期拿到原料，也有赖于其他工厂肯在紧要的时候让出一批货。厂方则认为，企业既要自己承担亏损，就应当有权拒绝做不下来的订单。还有人算了一笔整个行业的账，提出让受益的工厂分担换产和加班的费用，由联合会从中落实供货承诺。照这个办法，等料的厂能继续开工，钢管厂也有钱补上赶工的开支。联合会原先那封信只问能不能供货，现在厂里还想请它把余下几项也答复了。"
  fcf_economy_events.74.a:0 "企业应当为所在行业的共同利益服务。"
  fcf_economy_events.74.b:0 "企业的首要任务是确保自身的盈利。"
  fcf_economy_events.74.c:0 "企业和行业是互惠共赢的关系。"

  fcf_economy_events.75.title:0 "重构工会企业关系：合同制改革"
  fcf_economy_events.75.desc:0 "一家工厂停用了产业联合会代管的仓库。到月底，联合会照例寄来一张仓储费账单，厂里却说，早年议定的是各厂共同分摊仓库开支，库房不用了，费用自然也该停。仓库的职工找来当年的会议记录，里面确有共同分摊一条，下一页又写着各厂按占用的货位付费。那几年从来没有哪家退出，两句话便一直留在同一份记录上。总工会收集各地的旧协议时，还遇到了同样说不清的运输、采购和设备检修费用。\n\n有人建议依照各地实际沿用的办法，把共同负担、委托经办和按次付费分别写入合同。另一些代表要求各方重新签约。像那间仓库，前后几次会议留下的承诺已经互相抵牾，按哪一份旧记录归类，都有人拿得出另一份来反驳。也有代表希望把这些争议集中交给劳动经济委员会处理，让遇到同类问题的厂有个可以援引的裁定。仓库问得更直接。下个月它还得发工资，到底应当把账单寄给几家？"
  fcf_economy_events.75.a:0 "以过去的服务关系为基础进行分类。"
  fcf_economy_events.75.b:0 "不追认过去的服务关系，重新签订合同。"
  fcf_economy_events.75.c:0 "通过CET集中处理争议的服务关系。"

  fcf_economy_events.76.title:0 "重构工会企业关系：暧昧的管理关系"
  fcf_economy_events.76.desc:0 "一家轴承厂准备淘汰几台耗电过多的旧机床，产业联合会却请它暂缓。联合会刚同几家修造厂商定下一年的备件供给，其中有一种旧规格的轴承，附近只剩这几台机器做得出来。厂里愿意把库存留给修造厂，反问联合会，若还要再开一年，电费和修理费该由谁出。联合会的回函说，这件事涉及全行业的设备安排，请工厂在更新计划获准以前维持原样。厂里的委员把此前签过的协议找了出来，上面只写着工厂有义务提前报送计划。\n\n几位工厂代表要求把设备选型和更新日期交给企业决定，联合会若还要旧规格的货，可以另谈合同。行业工会的代表则希望保留对长期计划的指导权，免得几家厂同时停掉一条生产线，到需要备件时才发现整个地区都做不出来。也有技术人员提议先盘点各厂的设备，让几处车间试做替代品，再依据实际生产和维修的结果划定双方的权限。厂里的工人已经把最旧的一台机床拆开，正等消息，看还要不要给它订一副新齿轮。"
  fcf_economy_events.76.a:0 "让企业拥有更多的自主权。"
  fcf_economy_events.76.b:0 "行业工会有理由在企业的长期规划上进行指导。"
  fcf_economy_events.76.c:0 "技术人员可以在管理实践中总结出最好的模式。"

  fcf_economy_events.77.title:0 "重构工会企业关系：企业投资的存在"
  fcf_economy_events.77.desc:0 "工会投资基金开始受理企业的申请，最早送来的几份都在问同一件事。一家电机厂想添置绕线机，现有积累足以付订金，余款得靠下一年的收入。附近一家规模小得多的修理厂只想添一座试验台，却连第一笔钱也拿不出来。电机厂问，既然设备带来的收入归厂里，能否让它自行筹款，等签妥合同再向联合会备案。修理厂的代表则说，它替周围几家厂修电机，试验台早一天装好，受益的也有那几家，基金应当准许它为这项工程单独申请拨款。\n\n还有人建议给各厂预留一笔基本投资预算，平时的小规模更新可以按额度安排，省得每换一台旧设备都得重写一份申请。这笔钱若要年年留出来，基金能集中投向大项目的款项就会少一些。负责登记的同志把两张申请表放在一起看了看。电机厂可以附上几年的订单作凭据，修理厂只带来一摞维修记录，记着去年有多少台电机因为厂里无法试验，修好以后还得送到外地验收。"
  fcf_economy_events.77.a:0 "企业应当自行筹备投资资金。"
  fcf_economy_events.77.b:0 "企业可以申请专项投资资金。"
  fcf_economy_events.77.c:0 "所有企业都能获得一定的投资预算。"

  fcf_economy_events.78.title:0 "重构工会企业关系：随之变化的行会"
  fcf_economy_events.78.desc:0 "几家机械厂开始各自安排设备更新，产业联合会这才发现，沿用了多年的行业协议还把几道工序固定在原来的厂里。一家厂新装的车床已经能做过去要送到邻厂的活，便打算收回那批订单。邻厂原以为这笔活还能做一年，已经按协议招了学徒。厂方代表来开会时带着一张排班表，上面有六个人专做这道工序。眼下他们还有活干，过了月底就难说了。\n\n有人要求趁各厂都在调整生产，把行业协议里的分工和供货义务重新议一遍。几家企业希望以后由厂方定期向产业联合会报送更新计划，也能在会上提出调整全行业分工的议案。工人代表却先问，那六个人若改做别的活，谁来安排培训，换岗期间的工资又由谁负担。两家厂的代表原以为这次只须来谈一张订单，散会时，邻厂请他们下回把负责用工的人也带来。"
  fcf_economy_events.78.a:0 "行业协议有必要随之更新。"
  fcf_economy_events.78.b:0 "企业将通过产业联合会对所在行业产生影响。"
  fcf_economy_events.78.c:0 "首要任务应当是保障受影响的工人群体。"

  fcf_economy_events.79.title:0 "重构工会企业关系：辛迪加与托拉斯"
  fcf_economy_events.79.desc:0 "煤矿、焦炉和钢厂的代表在一张桌上谈了两天，才排定下一季的供货。轮到签字时，矿方又收到一张外地订单，对方愿意提前结款。钢厂代表问，既然三家厂的生产已经排到同一张表上，其中一家是否还能单独改变交货次序。矿方也有话说。焦炉检修推迟时，积在矿场的煤一直由矿上自己照管，仓储费从未算进共同开支。如今有人提议干脆把整条产业链的采购、生产和交货合在一起办，三家于是又把各自的账翻了出来。\n\n总工会中央的一些同志主张把跨行业供货和争议裁决一并纳入全国调度，地方遇到纠纷便有一个可以作最后决定的机关。几位产业代表更倾向于把相互依存的厂矿编进同一个经营体系，让订单与成本一起核算。也有工程师建议保留各厂的经营权限，由受过训练的人共同编排检修、运输和库存。矿方代表则希望产业联合会只负责召集各厂谈协议，哪家肯担什么责任，仍由各家签字确认。会场上没有人反对把供货表做得更准。真正难定的是，下次有一批煤要改发，谁有权在那张表上划掉原先的去处。"
  fcf_economy_events.79.a:0 "总工会是时候承担更大的责任了。"
  fcf_economy_events.79.b:0 "统一的产业链将带来更多收益。"
  fcf_economy_events.79.c:0 "管理的优越未必和权力的统合绑定。"
  fcf_economy_events.79.d:0 "产业联合会只是企业之间的桥梁，而非国王。"

  fcf_economy_events.80.title:0 "重构工会企业关系：高效的新治理"
  fcf_economy_events.80.desc:0 "一家电机厂交完本月最后一批货，工厂委员会才发现，这是几个月来头一次没有派人去车站催车。正式接任经理的生产书记把订料、排班和发运交给了固定的经办人，遇到小额补货，当天便能作出决定。月会上，委员问起为什么这批货比上月少花了两天工，负责核算的工人翻到工时表，指出上月有两个班在等同一种零件。仓库的同志随即找出这次的进货日期，几个人就把差别说清楚了。散会以后，隔壁厂的代表还留在桌边，想抄一份这家厂平日用的订料单。"
  fcf_economy_events.80.a:0 "我们早该这么做了！"

  fcf_economy_events.81.title:0 "重构工会企业关系：习惯的逆流"
  fcf_economy_events.81.desc:0 "新经理签发的调班通知贴出去以后，两个车间仍照旧表开工。负责领班的人说，从前碰到这种变动，总由委员会的值班委员到场交代，他没等到那个人，便以为通知还只是草案。经理去找值班委员，才知道采购员同样拿着一张急件在等委员会签字。那笔钱已经在经理的权限之内，但过去厂里有一笔账付重了，从那以后，出纳只认委员会的签章。新的任命书挂在办公室里，领料簿、付款单和每天来找签字的人还都按原来的规矩走。\n\n几名工人提出，既然遇到急事仍要请委员出面，索性让委员会重新管起这些事。经理也把过去几周收到的单据拿了出来，有些事务甚至是同一批人照旧处理一遍，事后再请他补签。委员会答应在下一次会上重议任命。那位值班委员听完，先把原先的轮值表从墙上取了下来，问下周还有谁能回来当班。"
  fcf_economy_events.81.a:0 "如果他们觉得经理制不好，那可以改回去。"

  fcf_economy_events.82.title:0 "重构工会企业关系：多米诺效应"
  fcf_economy_events.82.desc:0 "最先换用经理制的一家泵厂，原先连例行的原料采购也要等委员会开会。新任经理上任后，把常用铸件按月订齐，又同供货厂约定，缺了哪一项可由两边的经办人直接补单。几周后，泵厂第一次在结算日前发完当月的订单。收到货的修造厂本来只是派人来问，下月能否也按这个日子交货。那名代表在厂里待了半天，回去时还带上了一份经理的授权书和一张月底交给委员会的报表。\n\n此后，来问的厂多了起来。几家经营一直平稳的工厂也派代表来旁听，尤其想知道出了纰漏该由谁负责。泵厂的委员把当初那份任命书拿给他们看，指着里面允许经理自行订货的数额说，这一条是本厂按平日的用量定的，换一家厂还得自己算。当天回程的车上，已经有两名代表在各自的笔记本上起草本厂的条文。"
  fcf_economy_events.82.a:0 "大多数企业都可以认识到经理制的好处。"

  fcf_economy_events.83.title:0 "重构工会企业关系：经理之间的差异"
  fcf_economy_events.83.desc:0 "两家经营不善的工厂先后换了经理，月底送来的报告却相去甚远。一家铸造厂原来把零星订单夹在大批货里做，炉子一天要停好几次。经理重新排了炉次，同订货方约定每周集中交货，没过多久便清掉了积单。另一家厂主要替矿区修造旧机器，送来的活件件不同。新经理也照批量排工，把几件尚能等候的活凑在一起做，却把一根急用的泵轴也排了进去。矿上等了三天，最后自己派人来把旧轴领走了。\n\n复查的人到了修造厂，问经理当时是否知道那根轴急用。经理拿出派工单，上面只写着收件日期。过去这类活由工厂委员会的值班委员直接交给熟悉矿上情况的师傅，碰到要紧的单子，还会跟着去看一眼。如今两家厂的任命书用的是同一个样本，里头列出的权力也大致相同。修造厂的代表把那张派工单带回了会上，问这次究竟该换一个经理，还是该把急件的安排交回原来经手的人。"
  fcf_economy_events.83.a:0 "并不是所有企业都适合经理制。"

  fcf_economy_events.84.title:0 "重构工会企业关系：有效监督的经理制"
  fcf_economy_events.84.desc:0 "一家工厂的经理打算签一份长约，以较低的单价购入一年的原料。工厂委员会审议时，一名来自仓库的委员问，若供货方照合同所写每月送来一整批货，厂里能往哪儿放？账房把仓储表拿来一对，才发现厂里的用量在淡季只有合同约定的一半。多出来的原料得另租场地存放，省下的货款有一部分又要花出去。经理把草案带回去重新议价，几天后谈妥了分批交货，单价比最初略高，全年算下来，厂里仍能省下一笔开支。\n\n委员会因此推迟了一次表决，也让采购员多跑了两趟。月底公布账目时，几名委员把前后两份合同放在一起，给工人们算了一遍。过去，委员会多半在货到以后才听说仓库腾不出地方。这一回，连原料在哪一天到、到了该腾出哪排货位，都在签字以前问过了。"
  fcf_economy_events.84.a:0 "只有懂得相关事物的人才能有效地实施监督权。"

  fcf_economy_events.85.title:0 "重构工会企业关系：双重领导的低效"
  fcf_economy_events.85.desc:0 "一家机械厂有批急件要赶在周末发出，经理签了调班单，将两名熟练车工从别处调来。工厂委员会的值班委员接到另一处车间的申诉，又叫两人留在原岗，说等次日开会再议。两名工人在两个车间之间来回跑了一趟，最后都回了原来的机床。到了第二天，委员会查问急件为何还没开工，经理才知道自己的调班单已经被扣在工时簿里。原定随货出发的车皮当天就走，厂里只能另付一笔运费。\n\n经理把任命时通过的授权书带到了会上。调班列在日常经营一栏，委员们当初也投过赞成票。几位委员却说，调走熟手会耽误另一份已经承诺的交货，委员会既然要向全厂交代，就得有权叫停。工人代表请书记员把两道命令一并记入会议记录，随后问了一句，下回再遇到同样的事，车间该等委员开会，还是照经理已经签发的班表开工？"
  fcf_economy_events.85.a:0 "当经理得到民主的授权，其他的质疑都不值一提。"

