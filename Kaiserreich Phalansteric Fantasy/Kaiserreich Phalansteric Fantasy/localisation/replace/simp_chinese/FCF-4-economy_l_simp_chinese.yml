  fcf_economy_event.37.desc:0 "圣但尼核心工厂发生严重爆炸事故，导致当地管理机构陷入短期瘫痪，核算系统数据大面积受损。"
  fcf_economy_event.37.a:0 "坏了。"

  fcf_economy_event.38.title:0 "矿井透水与物资损耗"
  fcf_economy_event.38.desc:0 "加来海峡省发生的严重透水事故不仅中断了开采，还被迫消耗了大量应急救援物资进行抢修。"
  fcf_economy_event.38.a:0 "坏了。"

  fcf_economy_event.39.title:0 "港口物资安全事故"
  fcf_economy_event.39.desc:0 "马赛码头区域发生的破坏性火灾导致大量预备出口的物资和部分关键造船设备被焚毁。"
  fcf_economy_event.39.a:0 "坏了。"

  fcf_economy_event.40.title:0 "分配系统参数故障"
  fcf_economy_event.40.desc:0 "巴黎统计部门对资源的调拨出现了严重的算法失误，导致部分物资供应中断，引发了社会面不满。"
  fcf_economy_event.40.a:0 "坏了。"

