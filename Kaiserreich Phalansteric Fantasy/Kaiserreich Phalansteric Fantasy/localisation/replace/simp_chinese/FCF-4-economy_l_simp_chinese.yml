#经济决议栏
  FCF_economy_categories:0 "公社经济"
  FCF_economy_categories_desc:0 "很多事情不是一句革命胜利就能解决的，经济尤其如此，废墟和残骸不会自己变出崭新的工厂。面对被大战摧残的旧共和国，五花八门的经济流派都想将这片漂白后的羊皮纸染上自己的颜色，高度自治的地方公社以及政治派别的势均力敌使得我们的经济模式并没有在过去的革命岁月里得到一个确定的答案。不过，是时候该给这件问题画上句号了，没有经济体系的确定，就无法确保我们的政治果实不被敌人夺取。\n"
