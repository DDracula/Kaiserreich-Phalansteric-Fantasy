#经济决议栏
  FCF_economy_category:0 "公社经济"
  FCF_economy_category_desc:0 "很多事情不是一句革命胜利就能解决的，经济尤其如此，废墟和残骸不会自己变成崭新的工厂。面对被大战摧残的旧共和国，五花八门的经济流派都想将这片漂白后的羊皮纸染上自己的颜色。高度自治的地方公社以及政治派别间的势均力敌，使我们的经济模式在过去的革命岁月里始终没有得到一个确定的答案。不过，是时候给这个问题画上句号了；没有稳定的经济制度，我们便无法确保革命的政治成果不被敌人夺走。\n"
