  FCF_economy_calais_cross_harbor_tunnel:0 "重启海底隧道计划"
  FCF_economy_calais_cross_harbor_tunnel_desc:0 "早在拿破仑时期，就有人提出了建设一条从加莱到多佛尔的链接法英的海底隧道，但因为种种原因都没有实施。在英国革命后，这项设想再一次被放上了台面。在1926年，我们就与英国初步达成了协议，但因为种种原因，海底隧道的建设最终在1929年不了了之。不过，我们与英国内部一直有着呼吁将两个革命兄弟国家联系的更加紧密的呼声，或许是时候重新开展海底隧道的建设了。"
