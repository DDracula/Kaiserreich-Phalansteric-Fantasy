  fcf_economy_event.44.desc:0 "巴黎电力系统的核心节点发生严重故障，强行断电不仅导致工厂停机，还意外损毁了部分实验数据。"
  fcf_economy_event.44.a:0 "坏了。"

  fcf_economy_event.45.title:0 "隐藏事件：判断经济事件"
  fcf_economy_event.45.desc:0 "不展现给玩家。"
  fcf_economy_event.45.a:0 "错误。"
#续总工会事件
  fcf_economy_event.46.title:0 "腐败网络"
  fcf_economy_event.46.desc:0 "委派员送出的原始收据，终于使先前那些互不相干的线索连成了一体。调查组将秘密档案中的人名、产业联合会的互助金支出以及地区结算所的往来逐一对照，发现机械、运输、建筑等多个行业都在使用相似的手法：先以临时援助或跨行业协调为名拨出款项，再通过合作社、互助会和地方支部层层转手，最终将其中一部分转入无法核验用途的活动经费。\n\n这并不是一笔由少数人瓜分的巨款，而是一张覆盖甚广的关系网。有人替相熟的合作社争取订单，有人用行业互助金填补本地支部的亏空，也有人通过虚报差旅、重复报销和采购回扣，为自己换取额外收入。每个人截留的数额都不算惊人，许多款项甚至确实被用于帮助困难工厂和罢工者家庭；但所有参与者都明白，只有替别人签字、补齐收据并在稽核时保持沉默，自己的那一份便利才能继续存在。\n\n网络的核心并非某个秘密机构，而是总工会高层之间长期形成的默契。产业联合会的干部替地方支部掩盖缺口，地方组织则在代表大会和内部选举中回报支持；合作社取得优先订单后，会主动承担某些本应由总工会支付的费用。账目表面上始终能够平衡，真正被侵蚀的却是行业互助金、工厂的议价权，以及那些没有关系可寻的基层组织。\n\n现有材料足以让数十名干部接受调查，其中不乏掌握原料分配、技术培训和跨行业结算的关键人物。若将所有涉案者一并撤职逮捕，数个产业联合会的日常协调可能立即陷入停顿。更棘手的是，并非每个人都从中谋取了私人利益：有人确实中饱私囊，也有人只是沿用前任留下的办法，让资金能够绕过僵硬的手续及时抵达工厂。要在这张彼此担保的网络中划出清楚的界线，远比发现它更加困难。\n\n我们可以挑选几个证据确凿、声名狼藉的人公开惩处，以警告其余干部收手；也可以暂不公布全部材料，用它迫使总工会高层在接下来的改革中作出让步。若认为腐败无论大小都不应得到宽恕，那么便只有把名单上的人全部带走，并准备承受由此引发的反抗与混乱。"
  fcf_economy_event.46.a:0 "杀鸡儆猴就可以了。"
  fcf_economy_event.46.b:0 "我们可以借此威胁他们。"
  fcf_economy_event.46.c:0 "把所有腐败分子抓起来！"

  fcf_economy_event.47.title:0 "渲染出的政治迫害"
  fcf_economy_event.47.desc:0 "逮捕名单送达各地之后，行动很快遇到了阻力。少数证据确凿的干部当场便被带走，但更多人只是拒绝交出办公室钥匙和账簿。他们的同事聚集在产业联合会门前，要求调查人员逐项说明罪名；一些工厂委员会则宣布，在政府证明被捕者确曾侵吞公款以前，不会承认任何临时接管者。原本计划数日完成的行动，转眼变成了一场遍及多个行业的对峙。\n\n总工会中央将这份名单称为“政治清洗的名册”。它尤其强调，许多被捕者从未把一分钱装进自己的口袋：有人未经批准将互助金挪给濒临停产的工厂，有人替罢工者家属补签已经逾期的援助申请，还有人不过是在账目上替上级签过字。政府认定他们共同维系了腐败网络，总工会却宣称，这些人只是为了让基层组织在僵硬的制度中继续运转。\n\n这种说法刻意掩盖了虚假报销、采购回扣和私人分赃，却并非全无依据。调查组为了拆散整张关系网，将知情不报、违规签字与直接侵吞公款者一并列入行动名单；负责执行逮捕的地方机关又没有时间逐案核实，只能按照中央送来的姓名采取行动。于是，一名侵吞互助金多年的财务书记可能与一名替伤残工人提前拨款的地方干部，在同一天以同样的罪名被带走。\n\n几起混乱更使局势迅速恶化。在圣艾蒂安，前来封存账目的警员同守在办公室外的矿工发生推搡；马赛的运输工人则拒绝装运调查组扣押的档案，声称其中包含会员的私人资料。报纸刊出了被捕干部家属等候探视的照片，而总工会不断公布那些最容易获得同情的个案，却对真正中饱私囊者只字不提。腐败网络尚未接受公开审判，“政府借反腐摧毁总工会”的说法便已经传遍各地。\n\n即使此前支持调查的人也开始要求政府停手。他们并不认为总工会清白，只是怀疑如此大规模的逮捕是否仍以具体罪行为依据。倘若我们继续行动，就必须调动更多警力强行接管产业联合会，并承受工厂停工、基层抗议和总联邦委员会质询所带来的代价；案件或许仍能办下去，但它造成的政治创伤不会随着判决自动消失。\n\n我们也可以撤回尚未执行的逮捕令，只起诉那些已经掌握直接证据的人。这样能够平息眼前的抵制，却等于承认原有名单过于宽泛。总工会必然把政府的退让解释为调查经不起审视，那张已经暴露的关系网也会趁机切断账目、统一证词，并将自己重新装扮成政治迫害的受害者。"
  fcf_economy_event.47.a:0 "放弃逮捕。"
  fcf_economy_event.47.b:0 "坚持逮捕。"

  fcf_economy_event.48.title:0 "政治智慧"
  fcf_economy_event.48.desc:0 "调查报告没有立即送交报社，逮捕名单也没有发往各地。相反，几份最关键的账册被带进了一间远离总联邦委员会的会议室。应邀到场的是以儒奥为首的几名总工会中央代表；他们没有被正式传唤，政府也没有留下这次会面的公开记录。至少在名义上，这只是一场讨论未来经济法案的非正式磋商。\n\n没有人否认账册中的内容。总工会代表只是逐项解释，那些未经批准的调拨如何挽救了濒临停产的工厂，虚列的差旅费如何被用于补贴地方组织，合作社承担的额外支出又如何维持了罢工基金。至于真正落入私人腰包的款项，他们称之为“个别同志的软弱”，坚持不能因此毁掉整个组织的声誉。政府代表也没有反驳，只是把几封涉及中央委员的通信放在了桌上。\n\n谈判很快绕开了腐败案本身。公共安全委员会正在准备的经济改革，将重新规定产业联合会参与投资分配、工厂管理与公共采购的方式。总工会原本打算发动地方支部反对这些条款，但如果调查材料此时公布，它便很难再以工人利益的名义号召抵制。政府不需要总工会公开支持改革，只要求中央保持克制，不要将每一次权限调整都解释为对工人组织的进攻。\n\n儒奥没有作出书面承诺。他只表示，总工会从不反对“真正有利于生产与劳动者的改革”，也愿意约束地方组织采取过激行动。作为交换，政府应当把案件限制在少数证据确凿的个人身上，不再追查那些只涉及违规调度和账目疏漏的干部。双方甚至不必承认存在交换：政府可以宣称调查仍在依法进行，总工会则可以把随后的沉默解释为对联邦团结的维护。\n\n然而，我们手里的筹码还可以换来更多。几名总工会高层已经私下询问，受到调查的老同志是否仍能获得联邦企业的顾问职位，产业互助会能否继续领取公共补助，他们本人退休后的待遇又是否会受到影响。只要给出一点保证，再提供若干体面的职务和津贴，总工会中央原本紧密的利益共同体便可能从内部松动。届时，他们的顺从将不再出于组织判断，而是出于各自对前途的考虑。\n\n这当然意味着，我们将以反腐败调查发现的办法延续腐败：用公共资源购买个人忠诚，再把它称为政治上的必要安排。另一种做法则简单得多——拒绝一切私下照顾，明确告诉总工会，若它阻挠改革，全部材料便会公之于众。它仍然可以反抗，但必须先向工人解释那些账目、委托和回扣究竟算是什么。"
  fcf_economy_event.48.a:0 "老同志们将不会被亏待。"
  fcf_economy_event.48.b:0 "他们还能做什么？"

  fcf_economy_event.49.title:0 "大老鼠"
  fcf_economy_event.49.desc:0 "委派员没能从那些反复绕行的款项中拼出一张覆盖整个总工会的腐败网络，却意外锁定了一个远比零星缺口醒目的名字。机械产业联合会的一名中央书记长期负责困难工厂援助、工伤救济与临时采购，几乎所有流经地区结算所的大额款项都曾由他签字。账目起初只是显得混乱；待调查组将原始收据同正式报表逐项对照，一笔数目惊人的亏空便再也无法藏在“手续费”与“周转金”之间。\n\n他的手法并不高明，却十分稳妥。产业联合会拨出十万法郎，他便让地方机构按九万五千法郎入账；合作社收到一笔紧急贷款，也会主动留下几个百分点作为“联络费用”。这些钱经过亲信控制的互助会和采购处转手，最后被兑换成现金、债券与几处登记在亲属名下的房产。仅目前能够确认的金额，就超过许多普通工人一生所得。调查员私下给他取了一个再合适不过的称呼——“大老鼠”。\n\n然而，“大老鼠”在工人中享有的名声，远比他的账目干净。他记得许多工人的姓名，也记得谁的妻子久病、谁的儿子正在找学徒岗位。工伤补助遭到拖延时，他会越过地方委员会直接批款；工厂濒临停产时，他又总能从某个无人留意的科目中挤出救急资金。逢年过节，他常亲自前往矿区和机器厂，把食品、煤票与慰问金送到困难家庭手中。许多工人从未见过总工会中央的其他领导，却都知道只要写信给他，事情便有可能得到解决。\n\n这种慷慨并没有使他变得清白。调查组发现，他拿去救济工人的钱只占被截留款项的一小部分；更多财富被他留给了自己和家人。可对于那些确实受过帮助的人而言，抽象的公共损失远不如一袋煤、一笔医药费或一个保住的岗位来得真切。他们或许知道这位老书记办事不完全合乎规矩，却宁愿把那看作一个有能力的人从僵硬制度中替工人夺回的东西。\n\n他的地位也正建立在这种交换之上。地方干部替他补齐账目、压下质疑，他则用手中的援助和订单照顾忠诚者；受惠的工厂在代表大会上支持他，受惠的工人又把对个人的感激变成对一整套关系的维护。若将证据公开，“大老鼠”未必能够解释那些房产与债券，却完全可能把调查说成政府对一名“肯为工人办事的老同志”的迫害。\n\n现有证据已经足以提出指控。问题只在于，执行逮捕的人面对的恐怕不只是总工会的律师，还会有成百上千名真心相信他曾帮助过自己的工人。我们可以赌一把，相信账目公开后，他们终究会看清他的慷慨究竟由谁买单；也可以暂时放弃这个危险的目标，避免调查在一场群众对峙中收场。"
  fcf_economy_event.49.a:0 "当问题曝光后，工人们就不会爱戴他了。"
  fcf_economy_event.49.b:0 "我们最好还是不要冒这个风险。"
  fcf_economy_event.49.c:0 "去问问工人们。"

  fcf_economy_event.50.title:0 "老鼠之家"
  fcf_economy_event.50.desc:0 "逮捕令送到机械产业联合会时，“大老鼠”并不在自己的住所，而是坐在那间经常接待工人的办公室里。消息显然比调查人员来得更早：楼道里挤满了从附近工厂赶来的工人，院门外也停着几辆临时征用的卡车。有人带来了面包和热汤，有人干脆抱着毯子坐在台阶上，准备在这里守上一整夜。他们没有携带武器，也没有高呼反政府的口号，只是拒绝让执行逮捕的人从自己中间通过。\n\n调查组原以为，只要公布房产、债券和秘密账目的数额，工人们便会意识到自己所拥护的究竟是怎样一个人。然而，围在门前的人并不否认这些证据。他们只问，那几家免于停产的工厂是谁救下来的，工伤补助迟迟发不下来时又是谁先垫了钱。有人举起一封已经磨损的感谢信，有人带来了病愈的孩子，还有人当众承认，自己明知那位老书记办事不合规矩，却不相信那些从未踏进车间的调查员比他更关心工人的生活。\n\n“大老鼠”也没有为自己的财产作出多少辩解。他承认账目中存在无法说明的款项，却坚持自己只是把“无人负责的钱”交给了“真正需要的人”。至于登记在亲属名下的房屋和债券，他轻描淡写地称其为多年工作应得的保障，又反问调查人员：倘若政府认为他盗窃了工人的财产，为何站出来阻止逮捕的恰恰是这些工人？\n\n这番说辞当然经不起审查。调查组已经证明，他用于救济和援助的款项只占被侵吞资金的一小部分，所谓慷慨不过是用公共财产换取个人忠诚。但这种区别很难在院门前讲清楚。工人记得的是一笔及时送到的医药费、一批使工厂重新开工的原料，以及一个愿意听他们抱怨的总工会干部；至于那些没有得到援助的人和被悄然掏空的互助金，并不在这里，也没有能够替自己发言。\n\n随着僵持持续，各地总工会支部开始把这座办公楼称为“工人的家”。更多声援者正在赶来，报纸也派出了记者。若我们强行执行逮捕，就必须推开这些手无寸铁的工人，把“大老鼠”从他们的保护中拖出来。证据不会因此消失，指控也不会因此失效，但人们首先记住的恐怕不会是账簿里的亏空，而是警员如何闯进产业联合会，又如何同前来保护一名老同志的工人发生冲突。\n\n可若在此时撤回逮捕令，后果同样清楚。政府已经公开作出指控，调查组也信誓旦旦地宣称证据确凿；现在退让，只会证明“大老鼠”的地位足以使法律停在门外。总工会将把这场对峙描绘成工人团结击退政治迫害的胜利，而所有试图继续追查账目的基层干部，都会明白自己将得不到政府的保护。\n\n这间楼房并不真正属于“大老鼠”，门前的工人也不是他的私兵。但只要他们还相信自己是在保卫一个肯替他们办事的人，这里便是老鼠最坚固的巢穴。我们可以破门而入，并期待愤怒终有一日让位于理解；也可以承认，至少在今天，逮捕一名罪犯的代价已经超过了我们愿意承担的限度。"
  fcf_economy_event.50.a:0 "工人们会理解我们的粗暴的。"
  fcf_economy_event.50.b:0 "放弃指控吧。"

  fcf_economy_event.51.title:0 "蟑螂与老鼠"
  fcf_economy_event.51.desc:0 "调查人员没有直接询问工人那名中央书记是否贪污。他们只是走访几家曾经接受过产业援助的工厂，请工人说明款项如何发放、由谁经手，又有哪些人借此索取过额外的回报。谈到“大老鼠”时，得到的回答几乎完全一致：他的账目或许不够规矩，却从未让真正需要帮助的人空手而归。有人甚至反问，倘若连这样的干部也要受到调查，总工会里还有谁愿意替基层承担责任？\n\n然而，每当调查人员提到另一名负责审核援助申请的地方书记，工人们的态度便截然不同。这个人很少亲自到工厂，却喜欢把求助者叫进自己的办公室，故意让他们在门外等上几个小时。他会因为申请表上一个无关紧要的错误退回整份材料，也会在公开场合羞辱前来争取补助的工厂代表。即使款项最终获得批准，他也总要提醒对方，这不是应得的援助，而是自己“替他们在中央说了好话”。\n\n工人们私下把他称作“蟑螂”。这个绰号不仅来自他令人厌恶的举止，也因为无论哪笔账目出了问题，他似乎总能在稽核人员到来以前消失；待风声过去，又会从另一间办公室、另一个委员会或者另一项临时职务中重新出现。有人声称他收过合作社送来的礼物，也有人见过他要求供应商替亲属安排工作，但这些抱怨从未形成正式检举。\n\n保护他的正是“大老鼠”。每当地方支部要求撤换这名书记，“大老鼠”都会出面解释，说他虽然脾气恶劣，办事却十分可靠；那些受到刁难的工人，也往往会在补助获批后得到“大老鼠”的亲自安抚。许多人并不相信“蟑螂”清白，只是不愿因为一个讨厌的小人物同真正帮助过自己的老书记发生冲突。久而久之，大家便把他的索取、傲慢与刁难当成了获得援助以前必须忍受的一道手续。\n\n这种庇护也解释了为何“大老鼠”的名望如此牢固。他不必亲自拒绝任何请求，也很少直接接触那些最难看的交易；“蟑螂”替他守住钱袋、筛选求助者并承受怨恨，而他只需在适当的时候推翻一两项苛刻决定，便能以慷慨的面貌出现在工人面前。我们仍不能证明两人共同侵吞了那些失踪的款项，但他们显然不是偶然相识的两名干部。\n\n直接向“大老鼠”发难会使工人站到他的身边，对“蟑螂”采取行动却不会遇到同样的阻力。这个人贪婪、傲慢，又早已习惯有人替自己收拾残局；只要给他一个足够诱人的机会，他很可能亲手交出我们需要的证据。即使抓住的只是一只蟑螂，躲在墙后的老鼠也会因此明白，我们已经找到了它们共同出入的缝隙。"
  fcf_economy_event.51.a:0 "那就轮到我们出手了。"

  fcf_economy_event.52.title:0 "人赃俱获"
  fcf_economy_event.52.desc:0 "机会来得比预想中更快。一家负责供应机床零件的合作社正在申请续签采购合同，“蟑螂”却以报价说明不够完整为由，连续三次将材料退回。合作社代表随后收到暗示：只要愿意为“地方联络工作”承担一笔额外费用，合同不仅能够通过审核，拖欠的货款也会一并结清。\n\n在调查人员的安排下，合作社代表同意赴约。他带着编号登记过的钞票走进“蟑螂”的办公室，将信封放在桌上，并询问其中是否还包含“交给中央的那一份”。“蟑螂”没有否认，只是不耐烦地重新计算了金额，抱怨这次少得太多，又提醒对方，大老鼠能够替合作社摆平审查，但不会白白帮忙。\n\n等到信封被锁进抽屉，调查人员才推门而入。钞票、采购合同与一册记录历次“联络费用”的账簿同时被搜出。“蟑螂”起初声称这只是合作社自愿承担的组织经费，随后又试图把责任推给“大老鼠”，辩称自己不过是替中央收取款项。可无论采用哪一种说法，都无法解释为何这些钱没有收据，也从未进入总工会的正式账户。\n\n消息传到工厂后，几乎没有人为他辩护。过去受过刁难的工人主动补充证词，几家合作社也承认曾以礼物、职位和现金换取他的签字。即使那些仍然拥护“大老鼠”的工人，也不愿再把“蟑螂”的索取视作必要的变通。政府没有摧毁一个替基层办事的干部，只是抓住了一个人人都厌恶、如今又已人赃俱获的受贿者。\n\n账簿还不足以将“大老鼠”一并定罪。其中的人名多以缩写代替，交给“中央”的款项究竟去了哪里，也缺少完整记录。但“大老鼠”显然听懂了这次逮捕的含义。他没有公开替老朋友求情，反而迅速要求各产业联合会补齐账目、停止一切未经登记的资金往来。躲在工人爱戴背后的那只老鼠，第一次意识到自己的白手套并不能永远替它隔绝污泥。"
  fcf_economy_event.52.a:0 "杀鸡儆猴！"

  fcf_economy_event.53.title:0 "拉一派打一派"
  fcf_economy_event.53.desc:0 "调查再次停滞下来。零散的收据、会议记录和基层证词足以证明总工会内部存在腐败，却始终无法触及真正掌握资金与人事的高层。每当调查人员沿着一笔可疑款项向上追查，最后见到的总是一份手续齐全的拨款决议；每当某名地方干部准备开口，又总会有人替他补齐账目、调换职务，或者提醒他不要损害组织的团结。\n\n既然无法从外部撬开总工会，或许可以利用它内部既有的裂缝。总工会从来不是一个团结无间的整体。革命工团委员会长期指责中央官僚背离基层，儒奥及其支持者则担忧地方派系侵蚀中央权威；亲近法国社会党的“新方向”派也在寻找机会扩大影响。对任何一派而言，腐败都不仅是一项应当清除的弊病，也是打击对手的现成武器。\n\n革命工团委员会可能愿意交出那些依附中央、借职务牟利的干部，换取我们帮助他们进入更多产业联合会；儒奥也可能牺牲几名不服从中央的地方实力人物，以证明问题出在少数败坏纪律者，而非总工会本身。至于“新方向”派，他们与社会党人往来密切，对这种有限合作恐怕不会有太多顾虑。\n\n但他们提供的名单绝不会公正。每一项指控都可能是真的，每一个名字却也必然经过政治筛选。我们清除的或许确是腐败者，却也会替某一派扫除竞争对手，并将政府的调查变成总工会内部斗争的一部分。更何况，对方完全可能拒绝合作，反过来揭露我们试图分裂工人组织的行径。\n\n这是一次并不体面的尝试，却可能是突破高层庇护的唯一办法。我们可以选择一个潜在盟友，也可以拒绝介入这些派系争斗，继续依靠自己手中那点有限的线索。"
  fcf_economy_event.53.a:0 "革命工团委员会同样渴望一个廉洁的总工会。"
  fcf_economy_event.53.b:0 "儒奥同志显然通情达理。"
  fcf_economy_event.53.c:0 "总工会中有我们志同道合的同志。"
  fcf_economy_event.53.d:0 "我们还是只能靠自己。"

  fcf_economy_event.54.title:0 "内部敌人"
  fcf_economy_event.54.desc:0 "革命工团委员会接受了我们的接触，但并未派出任何知名人物参加会面。几名代表分批来到政府安排的地点，各自只携带一部分材料，直到确认我们确有合作诚意后，才将它们拼成一份完整的名单。名单上的人大多担任总工会中央书记、产业联合会财务委员或地区结算机构负责人，其中一些名字早已出现在调查组掌握的账目中，另一些则从未受到过怀疑。\n\n随名单送来的还有大量内部文件：未列入正式档案的会议记录、由地方支部保存的原始收据、干部之间讨论如何补齐亏空的私人通信，以及几份在代表大会前临时销毁的审计报告副本。这些材料表明，名单上的人并非仅仅替同僚签过字，而是长期参与虚假采购、重复报销和互助金截留；有人从中谋取私利，也有人利用公共款项维持自己的地方派系。只要调查人员逐项核验，便足以绕过总工会中央的庇护，直接追究一批高层干部。\n\n革命工团委员会并不掩饰自己的目的。在他们看来，这些人之所以能够腐败多年，正是因为总工会中央已经形成了一个脱离基层监督的官僚集团。每一次内部审查都由同一批人组织，每一项处分都要经过他们批准，而那些要求公开账目的地方代表，反倒会以“破坏组织团结”为由被排挤出去。政府若真想清除腐败，就不能只惩办几个财务书记，还必须打破他们对中央机关和产业联合会的控制。\n\n他们提出的交换十分明确。政府将依据这批材料展开调查，撤换涉案人员，并在总工会要求地方支部服从中央决定时保持沉默；革命工团委员会则会发动基层代表接管空缺职位，要求提前改选部分产业联合会的领导机关。若中央试图以行政手段阻止改选，我们还应当承认那些由地方代表大会推举出的临时委员会，并继续同它们进行经济协调。\n\n这无疑是在借反腐败之名干预总工会内部的权力斗争。然而，革命工团委员会交出的证据并非伪造，名单上的人也确实深陷腐败。问题只在于，名单经过了精心挑选：凡是可能阻碍他们掌权的高层几乎都被列入其中，而与他们关系密切的干部，即使同样出现在可疑账目里，也只被轻描淡写地称作“受到旧制度牵连”。\n\n调查组将因此取得梦寐以求的突破口，革命工团委员会也会在被清空的办公室里得到自己想要的席位。至于最终诞生的是一个更加廉洁的总工会，还是一个仅仅更换了主人、并学会把账目做得更漂亮的总工会，那就只能留待以后判断了。"
  fcf_economy_event.54.a:0 "合作愉快。"

  fcf_economy_event.55.title:0 "忠诚于总工会"
  fcf_economy_event.55.desc:0 "革命工团委员会没有立即拒绝我们的接触。他们听完了调查人员对高层腐败的判断，也逐一询问政府究竟掌握了哪些账目、准备追究哪些人，以及愿意为合作者提供怎样的帮助。直到会谈接近尾声，他们才要求政府代表把条件说得更明确一些：倘若他们交出一份涉案干部的名单，我们是否会承认由其支持者接管空缺职位，并在总工会中央试图干预时站到他们一边？\n\n政府代表给出了肯定的答复。在他们看来，这不过是拉一派打一派中不可避免的一环。革命工团委员会多年反对中央官僚，名单上的人又确实可能参与腐败；我们替他们清除对手，他们替我们打开总工会的大门，双方各取所需。只要会谈内容不为外界所知，随后发生的一切都可以被解释为依法调查与基层改选的自然结果。\n\n第二天清晨，总工会所属的报纸却同时刊出了这次会谈的详细记录。革命工团委员会不仅公开了政府提出的交换条件，还附上了调查人员带来的几份问题清单和一封要求继续秘密接触的便函。标题没有替我们留下多少解释的余地：公共安全委员会试图收买总工会内部派系，以腐败调查为武器干预工人组织。\n\n革命工团委员会在声明中并未替中央高层洗脱嫌疑。他们承认总工会内部存在侵吞互助金、操纵采购和庇护亲信的现象，也重申必须撤换那些把工人组织变成个人领地的干部。但他们坚持，这些问题应由基层支部公开账目、召集代表大会并自行追究，而不是由政府挑选一个派系，许诺将另一派的职位作为合作报酬。\n\n“我们反对总工会中的官僚，不等于反对总工会。”声明中的这句话很快出现在工厂布告栏、支部会议和各派报纸上。过去同革命工团委员会争论最激烈的中央派也抓住了机会，宣称事实已经证明，政府调查腐败只是为了分裂工人组织。即使对涉案干部深感不满的工人，也开始怀疑每一份逮捕名单背后是否都藏着另一场未经公开的政治交易。\n\n更糟的是，我们很难否认那些记录。政府确实提出过合作，也确实准备利用调查结果改变总工会内部的力量对比。任何关于“有限接触”与“调查需要”的解释，都无法回答最简单的问题：如果我们的目的只是追究腐败，为何还要事先讨论由谁接管那些空出来的办公室？\n\n革命工团委员会未能借此夺取任何职位，却在总工会内部赢得了前所未有的声望。它证明自己可以猛烈抨击中央，又不会把组织交给外部力量处置；总工会中央则意外得到了一件足以团结各派的武器。原本陷于守势的总工会如今反过来要求总联邦委员会调查政府是否滥用职权，而我们的反腐行动，也第一次不得不面对“谁在调查调查者”的质问。"
  fcf_economy_event.55.a:0 "这帮家伙！"

  fcf_economy_event.56.title:0 "中央权威"
  fcf_economy_event.56.desc:0 "儒奥同意了我们的接触，但把会面安排在总工会中央一间寻常的档案室里。没有正式议程，没有会议记录，甚至没有双方都认可的称呼：政府代表将其视作反腐败调查中的秘密磋商，儒奥则坚持这只是总工会中央向公共安全委员会说明若干地方组织的纪律问题。无论名义如何，摆上桌面的几只档案箱已经表明，他并非空手而来。\n\n档案中的名字大多属于各产业联合会和地方总工会的负责人。他们长期控制会费征收、互助基金与采购合同，在本地拥有自己的报纸、干部和代表集团。有些人已经多年不再向中央提交完整账目，有些人则公然拒绝执行中央的审计决定；每逢代表大会，他们便以地方自主和工团自由为名联合起来，反对儒奥提出的整顿方案。总工会中央知道这些人不服从，却一直缺少将他们撤换的机会。\n\n如今，机会就在他们的账本里。有人把工人互助金借给亲属经营的合作社，有人利用紧急采购抬高报价，也有人同时从数个委员会领取津贴，把不存在的会议和考察写进报销单。中央纪律部门并非没有发现这些问题，只是地方组织拒绝交出原始账册，而涉案者又能动员代表阻止进一步调查。若由政府接手，许多过去被称为“内部争议”的问题便可以成为刑事案件。\n\n儒奥并没有声称这份名单囊括了总工会内所有的腐败者。相反，他坦率地承认，还有一些同中央关系良好的干部也存在账目混乱、违规调拨乃至照顾亲信的问题。但在他看来，那些错误尚可通过内部纪律纠正；名单上的人则已经把地方组织变成了自己的领地，不仅侵吞工人的财产，也在有意破坏总工会的统一。腐败只是他们必须受到清除的理由之一，拒绝中央权威才是使他们无可挽回的罪过。\n\n交换条件同样明确。总工会中央将向调查组开放相关档案，要求地方机构配合取证，也不会在涉案人员被逮捕时号召工人抵制。作为回报，政府必须承认这些案件属于个别地方领导的腐化，而非总工会中央纵容的系统性问题；当地方支部以政治迫害为由拒绝接受中央派出的临时负责人时，公共安全委员会也应继续只同儒奥认可的领导机关进行经济协调。\n\n这份合作不会使总工会变得更加弱小。每清除一名盘踞地方的书记，中央便能收回一部分人事、财务与纪律权；每承认一届由中央主持产生的新领导层，儒奥的地位也会更加稳固。我们原本希望借内部矛盾削弱总工会，却可能帮助它完成多年未能完成的集中化。不过，一个由中央约束、愿意配合政府改革的总工会，或许总比一群各自为政、同时又以工人自治为盾牌的地方势力更容易应付。\n\n名单上的指控并非捏造，档案中的亏空也足以经受调查。我们确实会惩办一批腐败者，只是决定谁应当首先受到惩办的人并非调查组，而是儒奥。政府替总工会中央扫清不服从的地方实力派，总工会中央则替政府打开此前紧闭的账房；至于这究竟是一场反腐败合作，还是一场披着司法外衣的权力交易，双方都没有必要说得太明白。"
  fcf_economy_event.56.a:0 "合作愉快"

  fcf_economy_event.57.title:0 "鄙夷分裂"
  fcf_economy_event.57.desc:0 "儒奥听完了政府代表的提议，却没有去翻摆在桌上的问题名单。他先询问调查组为何认定这些干部值得怀疑，又追问一旦他们遭到撤换，公共安全委员会准备承认谁来接管地方组织。直到政府代表提及总工会中央可以借此收回部分人事与审计权，他才终于明白，这场会面的目的并不只是寻找失踪的会费。\n\n“所以，你们希望总工会中央替政府挑选犯人，再由政府替中央惩罚敌人。”\n\n政府代表并不接受这种说法。名单上的人确有腐败嫌疑，地方势力也确实长期阻挠中央审计；倘若双方各自提供证据和协助，既能追回工人的财产，也能恢复总工会内部的纪律。至于涉案者倒台后由谁填补空缺，不过是调查不可避免的政治后果。我们无意决定总工会的领导人，只愿意同那些能够维持秩序的人继续合作。\n\n这种解释没有减轻儒奥的鄙夷。在他看来，总工会中央同地方组织之间的争执，无论多么激烈，终究属于工人运动内部的问题。今天政府可以帮助中央清除不服从的地方书记，明天也可以扶植地方书记反对中央；一旦允许公共安全委员会把调查名单同派系利益联系起来，总工会的每一次纪律处分都将被怀疑出自政府授意，而每一名被撤换的腐败者都能把自己装扮成工团自治的殉道者。\n\n他并没有否认总工会高层存在腐败。相反，儒奥承认某些产业联合会的账目早已到了必须整顿的地步，也承认中央过去为了避免公开冲突，对一些地方实力人物作出了过多让步。但这并不意味着他愿意把他们交给政府，更不意味着他会以总工会的领导地位作为交换条件。倘若中央无法依靠自身纪律约束所属组织，那么借来的权威也只会证明它已经失去了领导工人的资格。\n\n会面就此结束。儒奥收走了政府带来的名单，却没有承诺提供任何档案；临行前，他只提醒调查人员，那些未经总工会正式授权获得的内部材料，今后不会再被视作善意的询问。几天之内，中央机关开始重新登记档案借阅，地方财务报告也被要求统一交由纪律部门保管。没有人公开指责政府，但此前尚能从不同办公室中得到的零散线索，忽然同时断绝了。\n\n出乎意料的是，儒奥也没有把这场接触透露给报纸。他没有兴趣像革命工团委员会那样借政府的失误赢得声望，因为公开秘密会谈同样会暴露总工会高层腐败已经严重到足以引来外部干预。更重要的是，他不愿让任何派系把这件事当作动员工人相互攻讦的武器。政府试图分裂总工会的证据被留在了那间会议室里，总工会也因此避免了一场新的内部风暴。\n\n这份克制替我们保存了颜面，却没有留下继续调查的道路。儒奥拒绝成为政府伸进总工会的那只手，也已经提醒所有高层干部关紧自己的抽屉。我们没有遭到公开围攻，却可能再也无法弄清，那些抽屉里究竟藏着多少本经不起审查的账簿。"
  fcf_economy_event.57.a:0 "真是不识好歹。"

  fcf_economy_event.58.title:0 "新方向，新人选"
  fcf_economy_event.58.desc:0 "总工会中的“新方向”派几乎没有掩饰对这次接触的欢迎。政府代表刚刚说明来意，他们便交出了一份早已整理好的名单。名单上的人大多占据采购、财务与人事职位，有人利用虚假合同侵吞互助基金，有人替派系收买代表，也有人把待遇优厚的职务与疗养名额留给亲属。随名单送来的账册、通信和证人资料，已经足以使调查组正式立案。\n\n“新方向”派愿意开放档案，也愿意动员地方干部配合调查。作为交换，涉案人员被撤换后，政府应当承认由地方代表重新选出的领导机关，并支持那些主张加强总工会与法国社会党合作、接受公共监督的候选人。若总工会中央试图直接任命继任者，公共安全委员会则不应承认其决定。\n\n他们的目的并不只是扩大自身在总工会中的影响。与其他派系相比，“新方向”派更愿意把政府视为合作者。在他们设想的未来中，总工会依旧代表工人，却不再独自决定国家的经济政策，而会同社会党政府共同推动改革。\n\n这项交易对我们颇具吸引力。政府既能清除一批腐败干部，也能在总工会内部扶植一支愿意配合的力量。然而，名单显然经过了政治筛选：“新方向”派同样拥有依靠社会党关系进入总工会的干部，只是他们没有出现在任何指控之中。\n\n我们将以反对裙带关系为名撤换一批旧人，再以可靠而有能力为名扶植一批新人。总工会确实会迎来一个新的方向，至于这究竟意味着更廉洁的合作，还是一种新的依附关系，只能留待以后判断。"
  fcf_economy_event.58.a:0 "总工会也可以是我们的盟友。"

  fcf_economy_event.59.title:0 "虾兵蟹将"
  fcf_economy_event.59.desc:0 "拒绝同总工会内部任何派系合作后，调查组只能依靠公开账目、零散检举和外围证词继续追查。数周过去，我们的确发现了不少问题：有人虚报差旅，有人把办公用品带回家中，还有地方会计从互助金里挪走一笔钱，替自己偿还赌债。\n\n这些行为既拙劣又确凿，涉案者几乎没有能力掩饰。只要按现有证据起诉，我们很快便能抓获一批贪污者，向公众证明调查并非毫无成果。然而，他们不过是些无关紧要的书记、会计与办事员；即使全部撤换，也触及不到总工会真正的权力核心。\n\n高层干部的账目远比这些“虾兵蟹将”干净。资金经过数个产业联合会和合作社辗转，命令从不落在纸面，愿意作证的人也总会在最后一刻改口。若要继续，就必须扩大调查范围，追查私人往来、秘密账户乃至政府同总工会之间历年的交易。\n\n这或许能掀开一张足以重创总工会的腐败网络，也可能只会使我们的调查手段先成为丑闻。更糟的是，那些旧账未必只牵涉总工会；政府中的某些同志，也曾在革命最艰难的年代默认过许多不能见光的安排。\n\n我们已经抓到了足以交差的小人物。现在收手，至少可以带着一场有限的胜利离开；继续深挖，则是在赌下一本账簿里写着谁的名字。"
  fcf_economy_event.59.a:0 "到此为止吧。"
  fcf_economy_event.59.b:0 "不，我们不能就此作罢！"

  fcf_economy_event.60.title:0 "赌博"
  fcf_economy_event.60.desc:0 "调查组没有在抓获那批小会计和地方书记后收手。既然高层账目中的每一笔款项都有正当名目，他们便不再只查钱从何处支出，而是转而追查这些人将钱花在了哪里。旅馆登记、长途电话、私人借据乃至赛马场的投注记录都被重新翻了出来。大多数线索最终只通向婚外情、酗酒和一些不便公开却算不上犯罪的嗜好，调查经费却在一天天消耗。\n\n真正的突破来自一张赌场寄出的催款单。收信人是一名长期负责总工会采购和互助基金的高层干部，他过去从未以嗜赌闻名，申报的收入也不足以承担账单上的数额。更奇怪的是，这封信所催缴的并非赌债，而是一笔尚未结清的“筹码兑换手续费”。调查人员由此发现，他在过去几年里频繁出入数家赌场，却很少真正坐上赌桌。\n\n赌场的内部账目揭开了这场赌博的玩法。每逢产业联合会完成一笔大型采购，他的代理人便会带着成捆现金购买筹码；几个夜晚之后，这些筹码又会以“赌局所得”的名义兑换回来。赌场从中收取佣金，并替他开具足以解释资金来源的证明。账面上，他只是运气好得惊人；实际上，所谓赌资正是供应商返还的回扣，以及从总工会互助基金中分批挪出的款项。\n\n随着一名赌场出纳同意作证，更多证据接连出现。虚构的输赢记录、由供应商代付的筹码、登记在情妇与亲属名下的兑奖凭据，最终都指向同一个人。他曾经依靠复杂的采购合同把钱从总工会账簿中取出，再让它经过赌桌，以一场又一场幸运的胜利回到自己手中。调查组苦苦寻找的高层腐败者，终于不再只是藏在证词和传言里的影子。\n\n这项成果的代价同样惊人。为了找到那张催款单，我们检查了数千份私人记录，派人跟踪了几十名干部，还在数个毫无结果的方向上耗费了大笔经费。许多调查人员几周没有回家，政府也不得不从其他部门抽调人手，维持这场几乎看不到尽头的追查。倘若最后什么也没有发现，我们很难向总联邦委员会解释，为什么寻找几笔失踪的会费需要付出如此高昂的成本。\n\n但现在，厚厚的案卷已经摆上桌面。一名真正位居总工会高层的干部将因贪污、收受回扣和洗钱受到起诉，他所经营的关系网也会随之暴露。此前那些被视作捕风捉影的指控，终于获得了无法轻易否认的证据；那些嘲笑调查组只会捉拿“虾兵蟹将”的人，也不得不承认我们确实抓住了一只藏得足够深的大老鼠。\n\n我们押上了时间、经费和政府的声誉，赌桌另一端则是总工会层层遮掩的账簿。所幸这一次，骰子落在了我们这一边。"
  fcf_economy_event.60.a:0 "看来我们赌赢了。"

  fcf_economy_event.61.title:0 "过火"
  fcf_economy_event.61.desc:0 "调查组没有在抓获那批小会计和地方书记后收手。为了寻找隐藏在总工会高层中的腐败者，我们开始追查干部们的私人借据、旅馆登记、电话记录和家庭财产，并要求银行、合作社与地方机关提供一切可能说明资金去向的材料。原本针对公共账目的调查，逐渐延伸到了每一个同涉案者有过往来的人身上。\n\n这些手段并非毫无收获。调查人员发现了没有申报的礼物、由产业联合会代付的宴席，以及几笔流向干部亲属的可疑贷款。然而，没有一项证据足以证明其中存在贪污。总工会的账目或许并不清白，但我们翻遍抽屉与卧室找到的，大多只是婚外情、私人债务和一些与公共事务无关的秘密。\n\n总工会很快抓住了调查中最难以辩护的部分。几份内部指令被送到报社，其中不仅列有接受监视的干部，还包括他们的配偶、子女和朋友。总工会没有再把争议局限于反腐问题，而是质问公共安全委员会究竟凭什么记录普通公民的通信、行踪与私人关系。\n\n这种指责得到了意料之外的响应。即使并不信任总工会的人，也无法接受政府仅凭一次会面、一笔借款或一封匿名信便调查自己的生活。律师团体要求总联邦委员会审查调查权限，地方公社则拒绝继续提供居民资料。原本愿意作证的人开始收回口供，唯恐自己也会被写进某份秘密档案。\n\n调查组坚持认为，只要再给他们一些时间，层层掩护的资金网络终究会露出破绽。但我们已经无法承受继续寻找的代价。若扩大调查，政府可能因侵犯公民权利而面临正式质询；若在此时承认一无所获，则等于亲口证明总工会关于“政治迫害”的指控并非毫无根据。\n\n我们试图揭开总工会隐藏的账簿，却先暴露了自己的调查手段。那些真正可能参与腐败的人已经有了销毁证据的时间，而政府能够得到的，只剩下一批无法公开使用的私人秘密。无论那条腐败网络是否真实存在，这场调查都只能到此为止了。"
  fcf_economy_event.61.a:0 "功亏一篑。"

  fcf_economy_event.62.title:0 "匿名举报信"
  fcf_economy_event.62.desc:0 "调查组每天都会收到大量匿名信。有人揭发地方书记把公车留给家人使用，有人声称互助基金被秘密运往瑞士，也有人只是把自己在支部会议上的争执重新写了一遍，再给对手添上几项无法查证的罪名。大多数信件只需粗略浏览便可归档，但今天送来的这一封却在办公室里引起了争论。\n\n写信人指控一名产业联合会负责人长期收受供应商贿赂，并将部分采购款藏在办公室的铁柜中。信中列出了几次会面的地点，提到一辆经常停在侧门的黑色轿车，还准确写出了两家承包商的名字。其中一些细节恰好能与调查组已经掌握的账目对应，而那些账目从未向外界公开。\n\n可这封信的错误同样明显。写信人一会儿声称亲眼看见那名负责人把钞票塞进铁柜，一会儿又说自己从未进入过总工会大楼；其中一次秘密会面被写在星期日，但那家餐馆逢星期日从不营业；黑色轿车的牌照前后出现了两个版本，连涉案者究竟住在哪条街上也说法不一。几段话还突然换了一种幼稚而急促的笔迹，像是写信人中途忘记了自己先前编造的身份。\n\n有人认为，这很可能是总工会故意放出的诱饵。只要政府依据这封漏洞百出的信件展开公开指控，对方便能逐一揭穿其中的错误，把整个反腐调查描述成依靠匿名诬告运作的政治迫害。信中那些真实细节，或许正是为了诱使我们相信其余内容。\n\n但也有人不愿轻易放弃。一个毫无内部消息的人，不该知道那两家承包商，更不可能猜中尚未公开的账目问题。也许写信人确实掌握着什么，只是出于恐惧故意混淆了时间与地点；又或许，这封信经过了几个人转述，真相在传递中变得支离破碎。\n\n我们可以把它扔进无效邮件堆，也可以删去相互矛盾的部分，将剩下的内容整理成一份足以使用的指控。最稳妥的办法，则是暂不惊动被举报者，从信纸、邮戳和用词入手寻找发信人。只是匿名举报之所以匿名，往往正因为写信人并不愿意被任何一方找到。"
  fcf_economy_event.62.a:0 "茫茫多的无效邮件之一。"
  fcf_economy_event.62.b:0 "只需要修改一些细节就可以当成证据。"
  fcf_economy_event.62.c:0 "我们应该找到这个发信人。"

  fcf_economy_event.63.title:0 "蹩脚的错误"
  fcf_economy_event.63.desc:0 "调查组最终没有丢弃那封匿名信。日期前后矛盾，被解释为写信人记忆有误；从不在星期日营业的餐馆，被换成了附近另一家仍在营业的咖啡馆；写错的车牌与住址，也按照现有档案一一“校正”。经过几番修改，这封原本疑点重重的举报信终于变得前后一致，足以支持我们继续调查那名产业联合会负责人。\n\n负责整理材料的人将这些改动称为必要的勘误。匿名举报者出于恐惧混淆细节并不罕见，只要核心指控能够与账目相互印证，纠正几个显而易见的错误似乎算不上伪造。调查组据此传唤了承包商，查封了涉案办公室，并向总联邦委员会宣称新的证据已经证实了先前的怀疑。\n\n然而，总工会似乎早有准备。调查开始后不久，几家工团报纸同时刊出了举报信的照片，原件中的错误被逐一标出，并同调查组提交的版本并列排版。两个版本不仅在日期和地点上不同，甚至连部分笔迹和措辞也发生了变化。总工会由此断言，所谓的匿名举报根本不是什么证据，只是政府按照自身需要改写出来的一份指控。\n\n我们试图把问题归咎于抄录错误，却很快发现无法自圆其说。档案登记表证明调查组收到的正是报纸公开的版本，而几份内部批注又清楚写着应当如何“修正”其中的矛盾。负责此事的人员甚至保留了数份修改稿，使每一次添删都留下了完整记录。我们原想替匿名举报者弥补几个蹩脚的错误，最后却用更加蹩脚的方式证明了自己篡改证据。\n\n至于被举报者是否真的收受贿赂，此时已经不再重要。总工会拒绝配合调查，涉案者则把自己塑造成政治迫害的受害人；就连原本支持整顿腐败的委员，也开始要求审查调查组此前提交的全部材料。我们不仅失去了这条线索，还让每一项已经取得的证据都蒙上了造假的嫌疑。\n\n一封真假难辨的匿名信，本来只会被埋进档案室。现在，它却成了政府操纵调查的铁证。聪明反被聪明误，确实再贴切不过。"
  fcf_economy_event.63.a:0 "赔了夫人又折兵。"

  fcf_economy_event.64.title:0 "童言无忌"
  fcf_economy_event.64.desc:0 "调查人员从信纸入手，最终找到了一所位于巴黎郊区的公立学校。那封匿名信并非写在普通便笺上，而是从学生练习簿中撕下来的；信中几段格外幼稚的笔迹，也与一名十二岁学生的作业几乎完全相同。所谓刻意布置的诱饵，原来只是一个孩子努力模仿成年人书写举报信的结果。\n\n孩子的父亲受雇于那家产业联合会，负责搬运和登记送入机关的货物。调查人员推测，他曾在家中抱怨采购数量与账目不符，也曾提起那几家承包商和经常出入侧门的轿车。孩子不明白回扣、虚假合同和互助基金意味着什么，却知道父亲口中的“坏人”拿走了属于工人的钱，于是把听来的只言片语拼成了一封举报信。\n\n这也解释了信中的种种矛盾。孩子确实没有进入过总工会大楼，铁柜里的钞票只是他的想象；餐馆、车牌和住址，则来自几段互不相干的谈话。可承包商的名字与异常账目并非凭空编造。只要他的父亲愿意说明自己究竟看见了什么，我们或许便能找到一名真正接触过采购内幕的证人。\n\n问题在于，那名工人从未主动举报。他或许只是把工作中的疑虑带回了家，也可能早已因为恐惧而决定沉默。政府若突然登门，不仅会使他受到产业联合会负责人的怀疑，也等于告诉所有人，我们能够从一封匿名信追查到寄信人的家庭。今后还有多少人敢把材料寄给调查组，恐怕很难预料。\n\n但这件事同样可以成为打击总工会信誉的机会。一个孩子都能从父亲的抱怨中察觉腐败，而总工会中央与产业联合会的负责人却始终声称账目没有任何问题。若这家人愿意公开作证，那封漏洞百出的举报信便不再是一场闹剧，而会成为普通工人连说出真相都要借孩子之手的证明。\n\n调查人员已经知道那扇门在哪里。现在需要决定的，只是我们是否有权敲响它。"
  fcf_economy_event.64.a:0 "还是不要打扰他了。"
  fcf_economy_event.64.b:0 "我们必须抓住每一个机会。"

  fcf_economy_event.65.title:0 "不信任与犹豫"
  fcf_economy_event.65.desc:0 "调查人员最终还是敲响了那扇门。开门的是孩子的父亲，他只看了一眼来访者出示的证件，便立刻把孩子叫回房间，又侧身挡在门口。调查人员尚未来得及解释，他便已经猜到他们为何而来——那封信失踪以后，他早就发现练习簿少了几页，只是不知道政府竟会一路追查到自己的家中。\n\n他承认自己曾在饭桌上抱怨过产业联合会的采购。登记表上的货物数量常常多于实际入库的数量，几家承包商送来的东西也远不值合同上的价钱；至于那辆从侧门出入的轿车，他的确见过几次。但每当调查人员要求他把这些话写成证词，他便立即改口，声称自己不过是随口发牢骚，从未亲眼看见任何人收受贿赂。\n\n这种犹豫并不只是出于对上级报复的恐惧。他在总工会所属的组织中工作多年，家人生病时领过互助金，罢工期间也靠工友接济才熬过断薪的日子。对他而言，总工会当然有许多令人恼火的地方，却仍是普通工人最可靠的依靠。如今政府正在同总工会发生冲突，他无法相信调查人员只是为了查清几本账簿，更不愿成为政府攻击整个组织的证人。\n\n孩子的信反而令事情更加难办。父亲认为，我们既然已经知道写信人只是一个孩子，就应当把它当作一场不懂事的胡闹；可调查人员不仅没有销毁信件，还沿着信纸、笔迹和学校一路找到了这里。在他看来，这已经足以证明政府根本不在意这家人会因此遭遇什么，只在意能否从他们口中得到一项可以利用的指控。\n\n会谈很快陷入僵局。调查人员反复保证证词可以保密，他却只冷冷地追问：如果匿名真的有用，我们又怎么会站在他的家门前？当有人提到保护证人时，他甚至笑了出来——政府或许能在几个月里派人守住这栋房子，却不可能替他寻找下一份工作，更不可能强迫朝夕相处的工友继续信任他。\n\n我们并非没有办法使他开口。一笔足够丰厚的补偿，可以弥补失去工作的风险；而那些已经被他亲口承认的异常，也足以让调查组反过来追究其隐瞒不报的责任。只是无论选择金钱还是压力，他接下来提供的证词都将不再完全出于自愿。\n\n调查人员仍站在门外，孩子则隔着房门听着大人们压低声音争论。我们追查匿名信，本是为了找到一个愿意说出真相的人；如今找到的，却只是一个既不信任政府，又不敢完全相信自己所属组织的工人。"
  fcf_economy_event.65.a:0 "贿赂他。"
  fcf_economy_event.65.b:0 "威胁他。"
  fcf_economy_event.65.c:0 "算了吧。"

  fcf_economy_event.66.title:0 "靠腐败运行"
  fcf_economy_event.66.desc:0 "事情原本应当很简单：给那名工人一笔足以抵偿失业风险的钱，换取他对产业联合会采购黑幕的证词。没有人打算把这笔交易写进调查报告，款项也被拆分成了搬迁补助、生活津贴与临时工作报酬。只要账目看上去足够平常，总工会便很难证明政府是在花钱购买证言。\n\n问题在于，我们并不只接触了这一个人。为了查清那些虚构的签收记录，调查组又找到几名仓库职员、地方支部会计和承包商雇员。有人担心丢掉工作，有人要求政府偿还拖欠的债务，还有人干脆表示，没有一笔足够体面的补偿，他便什么也记不起来。调查人员急于扩大突破口，便一次又一次答应了这些条件。\n\n消息很快在产业联合会内部传开。谁知道一张旧货单值多少钱，谁记得某辆轿车曾在哪天出现，谁便可能从政府那里得到一笔“安置费用”。一些确实掌握内幕的人因此开了口，另一些人则开始编造更惊人的故事。举报信越来越多，索要的价码也越来越高；调查组不得不花费更多时间，分辨哪些人在出售真相，哪些人只是在出售一段迎合我们需要的谎言。\n\n总工会起初只是指责政府收买工人，随后便将几份付款凭证交给了报纸。那些凭证没有直接写明“购买证词”，可收款人的姓名、领取补助的日期与调查报告中证言出现的顺序几乎完全对应。总工会的报刊把两者并排刊出，又列出了调查组近来陡然增加的秘密开支。政府越是否认，人们便越想知道还有多少证人拿过钱。\n\n我们当然可以辩称，总工会的负责人早已习惯用职位、互助金和人情掩盖丑闻。若他们能够靠这些手段使工人沉默，政府为什么不能用补偿使工人开口？况且，证词揭露的账目造假并不会因为证人得到保护而凭空消失。钱买来的也可能是真话，正如一个没有收钱的人同样可能撒谎。\n\n然而，这番辩解没能使局面好转。反腐调查之所以能够获得支持，正因为政府声称自己要清除总工会内部以利益维系的腐败网络；如今调查组却建立起了另一套利益网络，用公共资金换取证言，再把这些证言用于证明自身判断。我们揭露了总工会靠收买与庇护维持沉默，总工会则指着调查组的付款记录，宣称政府也只能靠同样的办法推动调查。\n\n几日前，我们还在追问产业联合会的钱究竟去了哪里。现在，公众开始追问调查组的钱又去了哪里。那些被揭露的贪污并未因此变得清白，但总工会已经不必再证明自己无罪，只需要证明调查它的人同样不干净，便足以重新占据舆论上的优势。\n\n我们原想用腐败者熟悉的手段撬开腐败网络，最后却让这场反腐调查看上去也只能靠腐败运行。"
  fcf_economy_event.66.a:0 "相同的招数，为什么我们不能用？"

  fcf_economy_event.67.title:0 "流氓政府"
  fcf_economy_event.67.desc:0 "那名工人的孩子并不完全明白父亲为什么忽然变得沉默，也不明白那些登门的调查人员究竟在索要什么。他只记得，其中一人在离开前说，如果父亲继续拒绝配合，政府便可以追究他隐瞒腐败、协助伪造账目的责任。第二天在学校里，他把这句话原原本本地讲给了同学，又说那些人威胁要把父亲抓走。\n\n孩子们的转述很快使事情变了模样。到了家长口中，调查组不仅要逮捕那名工人，还要将一家人赶出住宅；传到地方报纸时，政府则已经因为一封孩子写下的匿名信，派人闯入工人家中，逼迫父亲按照预先准备好的内容指控总工会。细节愈发夸张，可调查人员确实登过门，也确实以追究责任相威胁，这使我们无法把整件事简单斥为谣言。\n\n总工会随即派代表接触了那家人。那名工人最初仍不愿公开露面，因为他已经在压力下向调查组交代了采购账目的异常，也知道上级确实侵吞了本应属于工人的财物。但政府的威胁并没有让他永远保持沉默，反而使他意识到，无论自己继续拒绝还是按照要求作证，一家人的生活都已经被卷入这场斗争。\n\n数日后，他在工友陪同下出现在记者面前。他没有否认产业联合会的账目存在问题，也没有替那些负责人辩护；他只是从头讲述调查人员如何追查孩子的练习簿，如何来到家门前，又如何在遭到拒绝后暗示他可能因隐瞒不报而受到追究。他承认自己最终说出了知道的事情，却坚持那并不是自愿证词，而是在家人的安全与政府的压力之间作出的妥协。\n\n这番陈述令调查组陷入了最难堪的处境。若指责他撒谎，我们刚刚获得的证词便会一并失去价值；若承认他说的是事实，就等于承认政府确实以惩罚相威胁，迫使一名普通工人提供指控。我们可以证明产业联合会伪造了货单，却无法解释为什么查明这些货单，需要先让一个十二岁的孩子担心父亲会被带走。\n\n愤怒很快越过了总工会原有的支持者。即便是赞成调查腐败的人，也难以接受政府循着匿名信找到写信儿童，再以刑罚威胁其父亲。街头传单不再讨论那些失踪的货物和来路不明的木箱，而是画着调查人员堵在工人家门前的漫画。标题只有四个字——“流氓政府”。\n\n总工会则抓住机会，把那名负责人藏在工会账目后的行为，与调查人员躲在政府权力后的行为相提并论。前者可以被称作贪污犯，后者又该叫什么？如果掌握公权力的人可以用起诉、失业和家庭安危逼迫证人，那么这场调查究竟是在惩治腐败，还是只想从任何人口中得到一份有利于政府的证词？\n\n现在，道歉已经无法挽回那名工人受到的压力，也无法让孩子收回在学校里说过的话。但若连一句道歉都没有，我们便等于默认了公众给予我们的称呼。"
  fcf_economy_event.67.a:0 "赶紧道歉啊！"

  fcf_economy_event.68.title:0 "污点证据"
  fcf_economy_event.68.desc:0 "那名工人最终还是开了口。调查人员采取的办法并不光彩，但在金钱与压力面前，他原本坚决的态度逐渐松动，开始讲述自己在产业联合会仓库中见到的异常。起初只是几句含糊的抱怨，随后便有了具体的日期、姓名和货单编号。\n\n产业联合会曾以远高于市价的价格向几家固定承包商采购物资，送抵仓库的货物却总是少于账面数量。缺失的部分会由负责人亲自签字，注明已经送往地方支部或临时救济站；可那名工人曾负责装卸，其中一些所谓的接收单位根本没有派人前来，另一些甚至早已停止活动。\n\n他还承认，自己曾按照上级命令把几只没有登记的木箱搬进办公室。那些箱子由承包商的轿车送来，没有收据，也不准仓库人员开箱检查。第二天，负责人的秘书又会从侧门将它们运走。那封匿名信中的许多细节虽然出自孩子的想象，但真正引起孩子怀疑的，正是父亲在家中反复提起的这些事情。\n\n顺着这份证词，调查组很快找到了几张被修改过的入库单和几处虚构的签收记录。它们尚不足以证明那些木箱里装着什么，却足以表明产业联合会的采购账目经过了系统性的伪造。我们终于又得到了一项能够公开指控总工会领导层的证据。\n\n只是这份证据本身也留下了难以洗去的污点。那名工人并非自愿站出来，而是在我们明确表示不会接受沉默之后才改变了态度。总工会一旦查明证词产生的经过，完全可以指控政府收买证人、胁迫工人，并将整场调查描绘成一场预先写好结论的政治审判。\n\n现在，双方各自掌握了一项可以攻击对方的材料：我们知道产业联合会的账目存在造假，总工会则可能发现我们取得证词的手段。只要后者仍被隐藏，前者便足以为调查打开新的突破口。至于真相为什么要通过这种方式才能被说出来，暂时没有人愿意追问。"
  fcf_economy_event.68.a:0 "毕竟是他们有错在先。"

  fcf_economy_event.69.title:0 "真诚"
  fcf_economy_event.69.desc:0 "调查人员最终没有拿出准备好的补偿，也没有用隐瞒证据的罪名逼迫那名工人。他们收起文件，承诺不会公开孩子的身份，更不会再追查这家人的私人生活。临走前，领队只留下一张写有地址的纸条：如果他有一天愿意说出自己知道的事情，可以亲自把材料送来；如果不愿意，这次谈话便到此为止。\n\n两天后，那名工人独自出现在调查组门前。他没有带孩子，也没有通知任何同事，只在确认房间里没有记者后，从外套内侧取出了一只被反复折叠的信封。里面装着几份入库单的抄件、承包商送货时留下的便条，以及他凭记忆写下的一串日期。\n\n他承认，调查人员离开后，自己始终无法安心。政府过去对马丁案的重新审理，至少证明有些已经作出的判断仍然可以被纠正；而这一次，我们在遭到拒绝后确实没有强迫他留下证词。正是这种克制使他开始相信，调查或许并不只是为了给总工会罗织罪名。\n\n那些异常也远比他在家门口承认的更加具体。数批登记为机器零件和工人救济品的货物从未完整送抵仓库，缺失部分却都有产业联合会负责人签署的接收证明；几家名义上的收货单位早已停止活动，相关款项仍然按月结算。至于从侧门搬入办公室的木箱，他曾亲眼看见其中一只摔开，露出的不是文件或物资，而是一捆捆尚未拆封的钞票。\n\n为了避免日后承担账目缺失的责任，他暗中保留了几张被要求重新誊写的货单，也记下了每次异常送货的时间。调查组将这些材料与既有账目逐项比对，很快找到了相同的承包商、签名和虚构支部。此前只能依靠推测拼合起来的腐败网络，终于有了一名亲历者和一套能够相互印证的书面材料。\n\n他仍然拒绝把自己的行为称作背叛总工会。在他看来，互助金和会费来自每一个缴纳份额的工人，侵吞这些钱的人才是背叛者。他愿意指认涉案负责人，也愿意在总联邦委员会面前作证，但要求政府不得借此把所有总工会干部一概说成窃贼。调查人员接受了这个条件——毕竟一份有所保留的自愿证词，远比在金钱或威胁下得到的全盘指控更加可信。\n\n我们没有支付一笔钱，也没有发出一句威胁，便得到了一名来自总工会内部的证人。那些负责人最难反驳的，并不是政府写在调查报告里的指控，而是一个长期为他们搬运货物、整理账目的普通工人，终于决定亲口讲出自己所见的一切。"
  fcf_economy_event.69.a:0 "得来全不费工夫。"

  fcf_economy_event.70.title:0 "联合反对"
  fcf_economy_event.70.desc:0 "最初送到总联邦委员会的请愿书彼此截然不同。总工会指责新法案否认其在革命与战后重建中的特殊地位，企图把一个由数百万工人共同建立的组织降格为普通工会；天主教工会与自治工会联合会则认为，法案只是在名义上承认工会平等，却没有真正触动总工会掌握的会费网络、互助机构与产业联合会。双方攻击法律的理由完全相反，最终得出的结论却完全一致：它不能继续存在。\n\n政府原本以为这些组织之间的敌意足以阻止任何联合行动。总工会不会愿意同那些被自己称作分裂者的自由工会并肩而立，自由工会也不可能忘记多年来遭受的排斥。然而，法案恰好给了它们一个暂时搁置旧怨的理由。总工会要保住自己的地位，其他工会则要迫使政府重新制定一部真正削弱总工会优势的法律；它们不需要彼此信任，只需要共同使现行法案无法实施。\n\n数日之内，原本零散的请愿迅速汇成了一场全国性的抗议。巴黎的代表团沿着公社大道行进，里昂、里尔与马赛的工会也包下列车，将成员送往首都。总工会的红旗、自治工会的旗帜与天主教工会的标语第一次同时出现在一支队伍里。组织者宣称已有数万人在请愿书上署名，而地方公社送来的消息表明，这个数字仍在不断增加。\n\n抗议者并未冲击机关，也没有宣布罢工。他们只是轮流守在总联邦委员会外，把一箱又一箱签名表搬到入口处，要求委员们亲眼看看反对者究竟有多少。正是这种克制使政府更加难以应对：我们无法把他们称作破坏生产的暴徒，也不能用维持秩序为由驱散一场始终保持和平的请愿。\n\n此前针对总工会的调查本应削弱它的号召力，但我们掌握的材料不足以迫使其退让；与此同时，对其他工会所作的有限扶持，也没有换来它们对法案的支持。在总工会看来，政府正在剥夺它应有的地位；在自由工会看来，政府既利用它们牵制总工会，又不肯真正给予它们平等的机会。我们既没有压倒最强大的对手，也失去了本来可能成为盟友的人。\n\n若坚持实施法律，这场临时联合很可能演变成共同抵制。届时，各工会只需拒绝提供名册、停止参与协商，新的制度便会只剩下总联邦委员会公报上的几行文字。更糟的是，一旦它们发现联合施压确实有效，这个原本因一项法案而形成的联盟，未必会随着争议结束而立刻解散。\n\n如今，撤销法律已经成为平息局势的唯一办法。总工会将重新取得原有的特殊地位，其他工会则会带着被利用后的愤怒各自离去。我们本想重新规定工会之间的关系，最后却只证明了一件事：一项同时得罪所有人的妥协，并不会因此变得公正。"
  fcf_economy_event.70.a:0 "可悲。"
  FCF_syndicats_protest:0 "工会抗议"

  fcf_economy_event.71.title:0 "总工会的威能"
  fcf_economy_event.71.desc:0 "新法律公布之初，总工会中央并没有立即号召罢工，也没有像其他反对者所预想的那样公开拒绝服从。它只是向各产业联合会和地方组织发出一份措辞克制的通知，要求各级负责人“严格依照现有章程维护会员权益”，并在政府作出进一步解释以前，不主动协助任何涉及会员名册、组织财产和代表资格的制度调整。\n\n真正的压力由此悄无声息地开始了。产业联合会仍在编制生产计划，却不再为政府临时提出的需要调整原料配额；统计部门仍会提交报告，却总要等到章程规定的最后期限；地方组织并未拒绝参加协商，只是每次都派来没有授权作出承诺的代表。没有哪一项行为足以被称作违法，但积攒在一起，联邦的经济协调便像陷入黏稠的泥浆，每向前一步都要耗费过去数倍的时间。\n\n这种消极抵制很快越过了工会机关。工厂委员会中的总工会成员不断要求重新审议与新法有关的安排，区委员会里的产业代表则将原本例行通过的议案一项项送回讨论。总工会不必向他们下达命令；它只需要提醒所有会员，政府正在动摇一个由工人亲手建立的组织，余下的抵抗便会沿着早已存在的联系自行蔓延。\n\n我们这才发现，自己此前计算的只是总工会在总联邦委员会中拥有多少朋友，却没有计算它每天替多少工厂协调原料、向多少工人提供互助、又有多少地方代表依靠它的组织网络履行职务。总工会并不直接行使行政权力，却早已嵌入联邦运转的每一道缝隙。法律可以在表决中削弱它的地位，却不能命令数百万会员继续像什么也没有发生过一样合作。\n\n原本用于迫使总工会退让的那些指控，也没有发挥预期中的作用。我们掌握的材料不足以使普通会员相信整个组织已经腐烂，反而让总工会得以把新法律描述成政府在调查受挫以后发动的报复。几名确实涉嫌贪污的负责人藏进了抗议者身后，而每一次针对他们的追问，都会被回答为对全体会员的又一次侮辱。\n\n公共安全委员会已经收到各部门送来的损失估计。倘若政府坚持推行法律，总工会未必会发动一场足以被镇压的公开对抗，却完全能够让这种不合作持续数月。生产不会骤然停顿，联邦也不会在一夜之间陷入瘫痪；但延误、争执和额外开支将一点点消耗政府的威信，直到我们为这部法律付出的代价远远超过它可能带来的成果。\n\n另一条道路是承认失败，撤销刚刚通过的法律。这样至少可以使总工会恢复合作，却也等于向所有人证明，只要它充分调动自己的组织体量，总联邦委员会通过的法律同样可以被迫收回。我们低估的从来不只是一个工会的会员人数，而是一个已经同联邦经济与政治生活纠缠十余年的庞大网络。\n\n总工会没有攻占任何机关，也没有撕毁任何法律。它只是停止替我们维持一切如常，而这已经足够迫使政府重新考虑自己的选择。"
  fcf_economy_event.71.a:0 "顶住压力！"
  fcf_economy_event.71.b:0 "我们别无选择。只能放弃"

  fcf_economy_event.72.title:0 "总工会抗议"
  fcf_economy_event.72.desc:0 "新法律通过以后，总工会中央很快发表声明，指责总联邦委员会借“工会平等”之名否定它在革命中的贡献，并试图以一纸法令夺走工人运动十余年来形成的组织成果。声明没有要求会员拒绝法律，却明确表示，总工会不会主动协助任何损害自身权益的改革。\n\n随之而来的并不是一场声势浩大的总罢工，而是无数细小的不合作。产业联合会拖延提交资料，地方支部拒绝交出会员名册，总工会代表在协商会议上反复质疑执行细则。许多工厂仍在正常生产，但凡是需要总工会协调的事务，都要经过比以往更漫长的争论。\n\n这并不令人意外。总工会依旧是联邦规模最大、组织最严密的工会，新法律削弱的也正是它长期享有的特殊地位。即便我们已经揭露了若干高层的腐败，也不能指望数百万会员因此默默接受自己的组织受到打压。对他们而言，几个干部的罪行与总工会本身的权利终究不是一回事。\n\n不过，总工会这一次也没有足够的力量迫使政府撤回法律。那些腐败证据使其难以把自己完全描绘成无辜的受害者，其他工会更不会为了恢复总工会的特权而加入抗议。它能够拖延改革、制造混乱，却无法像过去那样以整个工人运动的名义要求我们退让。\n\n各部门只能为这段混乱预留更多时间和人手，在总工会拒绝配合的地方另寻沟通渠道，并尽量避免每一次争执都演变成新的政治冲突。这些措施无法消除抗议，却足以使联邦继续运转。只要新制度确实能够实施，总工会迟早也要学会在其中维护自己的利益。\n\n抗议还会持续一段时间，不满也不会因政府的一次解释而消失。但法律已经通过，新的关系也正在形成。我们现在所要做的，不过是在总工会逐渐接受现实以前，忍受它最后一段时间的抵抗。"
  fcf_economy_event.72.a:0 "时间会解决一切。"

  fcf_economy_event.73.title:0 "对新法律的不满"
  fcf_economy_event.73.desc:0 "新法律在各地开始执行后，总工会内部的不满并未立即平息。中央委员会接连收到地方支部送来的抗议信，有的要求拒绝承认新的工会代表资格，有的主张退出一切由政府召集的协商会议，还有人干脆提议发动全国罢工，迫使总联邦委员会收回法案。\n\n然而，这些激烈的主张最终大多停留在纸面上。总工会刚刚经历了一连串调查，几名负责人留下的可疑账目仍在报纸上反复出现。即便许多会员相信政府借题发挥，也很少有人愿意为了维护旧有特权而停止生产。地方支部可以谴责法律，却很难向工人解释，他们为什么应当为几个中央机关的代表席位和组织权限牺牲工资。\n\n总工会中央因此选择了较为克制的抵抗。它要求各支部在会场悬挂抗议标语，保留原有职务称谓，并把一份措辞几乎完全相同的反对声明附在每封递交给政府的公函之后。一些代表还会在会议开始前宣读声明，随后才坐下来讨论新制度下的实际事务。法律没有因此停止执行，只是每一道程序都多出了一场仪式性的争执。\n\n真正迫使总工会逐渐让步的，是那些最初被它视作无法运作的新规则竟然开始形成日常秩序。其他工会派出了自己的代表，地方委员会重新分配了协商席位，原本只能通过总工会转达诉求的工人也找到了新的渠道。总工会若继续拒绝参与，空出来的位置并不会永远等待它，而会被更愿意合作的组织迅速占据。\n\n于是，反对声明仍在印刷，抗议标语却开始从会议室中消失；中央机关依旧宣称不会接受政府强加的新秩序，地方支部却已经询问如何登记代表、申请经费和参加下一轮协商。最初被称作不可容忍的让步，几周后成了临时措施，几个月后又被写进了支部自己的办事章程。\n\n这并不意味着总工会已经原谅政府。许多老会员仍将这项法律视为对革命功绩的背叛，新制度也没有消除它与其他工会之间的竞争。但愤怒终究不能代替日常工作。当新的代表名单开始使用，新的协商程序按期召开，就连最坚定的反对者也不得不承认：旧有地位不会因为拒绝接受现实便自行恢复。\n\n我们没有彻底击败总工会，也没有使它心悦诚服。我们只是让新法律存在得足够久，久到抗议逐渐成为惯例，而法律本身成为了秩序。"
  fcf_economy_event.73.a:0 "终于解决了一个烂摊子。"

  fcf_economy_event.74.title:0 "缺失的中转站"
  fcf_economy_event.74.desc:0 "精简管理层的工作起初进行得十分顺利。各产业联合会按照总部的要求重新审查人员名册，撤销那些职责含糊、长期不参与实际生产，却依旧领取津贴、掌握经费与分配权限的职位。几名早已因裙带关系而声名狼藉的负责人被赶出办公室后，基层支部甚至举行了庆祝会。至少在最初看来，我们终于开始清理这个寄生于总工会内部的庞大群体。\n\n然而，随着被裁撤的职位越来越多，问题也逐渐从那些骤然空出的办公室里显露出来。北方的冶金工厂仍按期报送了钢材产量，却迟迟没有人将数据汇总给机械产业联合会；里昂的化学品配额已经重新分配，地方支部却没有及时把变化通知依赖这些原料的纺织厂。许多文件仍然有人填写，也有人签字，只是在从一张办公桌送往另一张办公桌的途中停了下来。\n\n直到此时，人们才发现，那些看似可有可无的中间管理者并不都只是在重复上级的命令。有些人负责在几个地方支部之间核对生产数据，有些人熟悉不同工厂委员会的办事习惯，知道一项建议应当先交给谁，又该如何说服彼此敌视的代表坐到同一张桌前。他们很少直接决定生产，也没有值得写进章程的显赫职权，可产业联合会那套依靠协商、惯例与私人联系运转的庞大网络，恰恰需要这些中转站维持。\n\n问题在于，我们从未真正评估过每一个职位承担的作用。总工会的管理体系并非按照一张事先设计好的组织图建立起来，而是在十余年的生产协调中层层增生：同样的职称在某个支部可能只是照看档案的闲职，到了另一个支部却承担着整个地区的原料联络。若要求总部逐一分辨，精简工作很可能先被漫长的调查拖垮；若只按照职称、津贴或管理层级裁撤，我们便只能寄希望于没有误伤太多真正有用的人。\n\n基层工人对此同样产生了分歧。有人坚持，眼下的混乱不过是官僚们故意留下的烂摊子，旧管理层正在用自己造成的不便证明自身不可替代；也有人指出，裁撤本应是一场负责任的组织改革，如今却越来越像是为了迎合基层怨气而进行的清算。赶走一个不得人心的负责人很容易，但在他离开以后，统计表不会自行汇总，地方支部也不会因此突然学会彼此协调。\n\n更加令人不安的是，混乱已经开始损害总工会本身。几家工厂委员会绕过产业联合会，私下寻找原料与运输渠道；一些地方支部则将迟迟得不到处理的事务交给其他工会代办。继续这样下去，我们或许能够得到一个管理层极其精简的总工会，却也可能发现，这个总工会已经无力维持过去遍布全国的协调网络。\n\n现在，改革走到了第一个真正的岔路口。我们可以承认裁撤进行得过于草率，停止这场正在演变为自毁的运动；也可以让基层工人选举出新的协调者，用来自下方的授权填补空缺；还可以承认管理本身是一种需要经验与知识的工作，以明确的专业标准重新建立这些中间岗位。\n\n旧的中转站已经被拆除了一部分。问题不再是它们是否令人厌恶，而是我们准备让什么来取代它们。"
  fcf_economy_event.74.a:0 "必须停止这样的自毁行为。"
  stop_simpifed_magement:0 "§Y我们将停止裁撤管理层§!"
  fcf_economy_event.74.b:0 "让基层工人选举出自己的管理者。"
  fcf_economy_event.74.c:0 "正确的解决办法是让管理层技术化。"  

  fcf_economy_event.75.title:0 "重负"
  fcf_economy_event.75.desc:0 "新的管理者很快从各地工厂与支部中选出。他们大多是熟悉生产、受到工友信任的老工人，既没有独立办公室，也没有额外津贴，仍与原来的班组一同劳动。许多人相信，这种安排既能填补管理层留下的空缺，又能避免重新养出一批脱离基层的官僚。\n\n然而，被选举出来并不会使一天凭空多出几个小时。车床工仍须完成工时，装卸工仍要跟随班组劳动，管理事务只能挤进午休、夜晚和轮班之间。报表被带回家中核对，支部会议往往拖到深夜，外地送来的函件则常常积压数日。\n\n更麻烦的是，产业联合会的管理远比想象中复杂。许多当选者熟悉自己的车间，却不懂如何核对不同工厂的统计口径，也不擅长在争夺原料的支部之间调解。有人因不堪重负而辞职，有人只能草草批复文件，还有人连续熬夜工作，最终连原本的生产任务也无法完成。\n\n为了维持日常运转，一些地方支部不得不私下请回旧职员协助整理账目。那些被赶出办公室的人虽然没有恢复职务，却再次凭借对流程和档案的熟悉掌握了实际工作。我们本想让基层接管管理，结果却可能使旧管理层以更加隐蔽的方式重新回来。\n\n问题已经无法继续依靠个人热情解决。若允许当选者减少一线劳动，他们便能专心处理事务，但总工会内部也会再次出现一批以管理为职业的人；若坚持管理者不得脱离生产，他们与普通工人的联系固然得以保留，积压的工作却不会因此消失。\n\n还有人建议向普通工人普及会计、统计和生产协调知识，使管理不再成为少数人的专长。这或许能够从根本上改变局面，却需要长期投入，也无法立即减轻现任管理者肩上的重负。\n\n选举可以决定由谁承担责任，却不能替他们创造时间和经验。总工会必须决定，究竟是承认管理本身也是一项工作，还是继续要求工人仅凭热情同时承担两种职责。"
  fcf_economy_event.75.a:0 "管理者应该更专心于管理工作。"
  fcf_economy_event.75.b:0 "绝不能出现脱离劳动的情况。"
  fcf_economy_event.75.c:0 "应当向工人普及基本的管理学知识。"

  fcf_economy_event.76.title:0 "重返岗位"
  fcf_economy_event.76.desc:0 "管理岗位技术化以后，各产业联合会陆续组织了新的资格审查。候选人需要熟悉统计、会计与生产协调，还要能够处理支部之间复杂的往来文件。考核确实淘汰了一批只凭资历占据职位、却连账目都说不清楚的管理者，也使少数长期被埋没在车间里的能干工人得以进入办公室。\n\n然而，最终通过审查的仍大多是原有管理人员。他们长期接触报表和会议，熟悉总工会内部的程序与术语，天然比普通工人更符合所谓“技术标准”。许多此前被裁撤的管理者很快重返岗位，普通工人则往往在拿到试卷时，才第一次见到那些决定自己能否参与管理的知识。\n\n新制度带来的效率无可否认。积压的文件被迅速清理，产业联合会之间的联络重新顺畅，过去依靠私人关系和模糊惯例处理的事务也开始形成明确规程。那些缺乏能力的旧管理者被送回一线，真正胜任管理工作的人则获得了更稳定的地位。\n\n可在基层看来，改革的成果却没有如此鲜明。办公室里的人换了一批，管理者与工人之间的距离反而更加清晰。过去的官僚至少会用“老同志”的口吻解释决定，如今的新管理者更喜欢援引产量、工时和配额，把每名工人都当作生产表格中可以调动的一项数字。\n\n我们原本希望用技术标准打破旧管理层对职位的垄断，结果却使管理知识本身成为一道新的门槛。总工会或许变得更加高效，却也更加官僚化；基层抱怨的已不再只是管理者无能，而是那些精通管理的人似乎越来越不必理解被管理者。\n\n技术化并非毫无成果，但若效率意味着工人只能作为生产机器上的零件服从安排，那么这场改革仍算不上完成。我们可以相信更加专业的管理终将证明自身价值，也可以要求管理者在数字和规程之外，重新学会倾听普通工人的声音。"
  fcf_economy_event.76.a:0 "我们实在是走在正确的道路上。"
  fcf_economy_event.76.b:0 "管理者必须有温情。"

  fcf_economy_event.77.title:0 "良莠不齐"
  fcf_economy_event.77.desc:0 "管理知识的普及工作已经在各地展开，但总工会从未建立一套统一的培训体系。课程由地方支部自行组织，教师、经费与教材也只能各自设法筹措。改革确实开始改变管理岗位的面貌，只是这种改变在不同地区呈现出了截然不同的速度。\n\n在巴黎、里昂等组织完善的支部，工人可以在夜校中学习会计、统计和生产协调，并跟随现任管理者处理实际事务。第一批完成培训的新人已经接手部分工作，他们虽然经验尚浅，却至少能够看懂报表，也知道如何把基层诉求送往正确的部门。\n\n另一些支部却连固定教室都无法提供，更找不到愿意长期授课的人。所谓培训往往只是旧管理者在会议结束后讲解几份表格，几周后便不了了之。由于没有合格的替代者，这些地方仍由原来的管理班子维持运转，改革只停留在墙上的通知和档案里的计划。\n\n起初，这似乎只是地方进度不同。然而，当新旧两套管理方式开始相互对接，问题便迅速暴露出来。一家采用新规程的冶金支部按照生产类别申报需求，接收文件的煤炭支部却仍按旧有地区编号分配燃料，结果几列车皮被送往错误的工厂。类似的差错不断出现，却很难追究某一方的责任，因为双方都遵守着自己熟悉的制度。\n\n现在的总工会就像由处于不同时代的机构拼接而成。有些支部已经培养出一批新人，有些支部仍依靠旧管理者的经验与私人联系；一地视为正常的文件，到了另一地可能需要重新填写。每个地方的改善都值得肯定，彼此无法协调的改善却未必能够带来一个运转得更好的整体。\n\n若要尽快结束混乱，总工会中央可以把已经完成培训的新人直接派往落后的地方支部，由他们统一工作方法。这会迅速填补空缺，却也意味着地方工人必须接受一名由上级指定、未必了解当地情况的管理者。\n\n另一种办法是向困难支部提供更多资金，让它们自行开办课程、培养人选。如此更符合地方自治的原则，也能使新管理者真正得到本地工人的信任；但金钱无法立刻变成教师和经验，在各地逐渐赶上以前，总工会仍要忍受这种良莠不齐的局面。"
  fcf_economy_event.77.a:0 "直接任命新人到地方支部。"
  fcf_economy_event.77.b:0 "向地方支部支援更多资金。"

  fcf_economy_event.78.title:0 "主观认定"
  fcf_economy_event.78.desc:0 "改革通过以后，由各支部抽调普通会员组成的轮值监察队伍开始受理检举。革命工团委员会希望借此打破管理者彼此包庇的旧习：被调查者不再只需向自己熟悉的支部委员会解释，来自其他地区的工人也有权查阅账目、询问当事人，并将发现交给会员代表审议。\n\n不久，一名工人找到了正在当地轮值的监察员。他没有携带账簿、信件或者能够作证的同伴，只是反复声称支部里那位被人称作“大老鼠”的负责人收受礼品、私下调拨物资，还把互助金变成了供自己支配的小金库。\n\n监察员要求他说得更具体一些，他却只能列举“大老鼠”突然添置的新衣、经常出入支部的商人，以及几次没有公开说明来历的救济。至于钱从哪里来、礼物是谁送的，他既不知道，也无法证明。所有指控都建立在他的观察和猜测之上。\n\n更值得注意的是，他与“大老鼠”之间似乎还有私人恩怨。两人曾因工位调整发生争执，举报者也承认，自己的救济申请不久前刚被支部驳回。若仅凭这样的指控便启动调查，我们很可能只是把跨支部监督变成某些人报复同事的工具。\n\n可是，腐败本就很少会主动留下完整的证据。普通工人无法接触采购单据和互助金账目，若要求他们在检举前便查清一切，那么监督最终仍只能由掌握文件的管理人员来进行。“大老鼠”在当地经营多年，愿意首先站出来说话的人难免只有零散的怀疑。\n\n轮值监察队伍的人手来自各个支部，每启动一项调查，都意味着这些会员要暂时离开原本的工作。现在，我们必须决定这份未经证实的举报是否值得投入共同的调查资源。它可能只是一场私人报复，也可能是揭开某些秘密的第一根线头。"
  fcf_economy_event.78.a:0 "没有证据还来举报？"
  fcf_economy_event.78.b:0 "既然他来举报了，我们就应当进行回应。"

  fcf_economy_event.79.title:0 "无效的堆积"
  fcf_economy_event.79.desc:0 "工人监督的门槛降低以后，各地送交监察队伍的举报迅速增加。最初，这被视为改革真正深入基层的证明：过去只能在车间和酒馆里私下议论的问题，如今终于能够被正式登记，并交由与当事人没有直接关系的会员查问。\n\n然而，负责整理材料的轮值会员很快便被信件淹没。其中不少只是对同一件事情的重复举报，有些只有“大概听说”“大家都知道”之类的描述，还有一些通篇都在咒骂某位负责人，却没有写明究竟发生了什么。监察员不得不从大量情绪宣泄中寻找少数可以核实的线索。\n\n这些信件又不能被轻易丢在一旁。新制度既然承诺每一名会员都有权要求回应，长期搁置便会使监督重新沦为空话；可若每封信都派人前往调查，各支部抽调的轮值人员很快便会全部耗在毫无头绪的投诉上。\n\n有人主张制定基本的投诉标准，要求举报至少写明涉及的人物、地点和具体事项。举报者不必自行取得账目或证明犯罪，但必须让监察队伍知道应当从何处查起。这样既能筛去纯粹的辱骂，也能使真正的线索得到更快处理。\n\n另一些人担心，这些标准最终会被懂得程序的人垄断。文化程度不高的工人很难把日常怀疑整理成一份合格的书面指控，而管理者却可以利用格式上的缺陷要求监察队伍拒绝受理。他们认为，应当由更多支部派出轮值会员，对每一份举报进行口头询问和初步核实。\n\n但这意味着更多工人必须暂时离开车间，也意味着各支部需要承担更多监察任务。我们原以为，只要让工人能够自由检举，官僚主义便会失去藏身之处；如今却发现，就连倾听所有人的声音，也需要一套共同认可的秩序。"
  fcf_economy_event.79.a:0 "设立投诉标准。"
  fcf_economy_event.79.b:0 "扩大处理部门。"

  fcf_economy_event.80.title:0 "疑点重重"
  fcf_economy_event.80.desc:0 "来自几个异地支部的轮值监察员根据举报者的口述，开始查阅当地账目，并邀请普通会员旁听询问。原本缺乏证据的指控并未就此消散，反而牵出了更多可疑之处：未经完整登记的物资调拨、以私人名义收取的礼品，以及几笔始终说不清用途的款项。\n\n然而，事情又不像普通的侵吞那样简单。“大老鼠”收下过煤商送来的酒，也接受过工厂负责人私下塞来的信封，可每逢工人家庭陷入困难，他又总能及时送去粮食和救济金；支部互助金捉襟见肘时，也常由他出面填补缺口。在许多当地会员眼中，这些往来不过是维持支部运转所需的人情。\n\n账目因此变得愈发难以分辨。一份礼物究竟是对过去帮助的答谢，还是为日后行方便而支付的报酬？一笔未经表决的支出究竟流进了谁的口袋，还是被用来处理正式程序未能解决的困难？几乎每一处疑点，都能找到一个看似合情合理的解释。\n\n监察队伍的到来也逐渐引起了当地工人的戒备。原本愿意接受询问的人开始闭口不谈，有人声称记不清多年前的事情，还有人反问外地代表，为何要把他们支部内部的人情往来解释成犯罪。继续翻查私人信件和家庭收支，只会使这种抵触更加强烈。\n\n当地会员的态度不能被简单视作妨碍调查。跨支部监督的目的本就是让工人相互约束，而不是让一群外来者取得凌驾于本地会员大会之上的权力。但那些突然消失的记录和异常一致的证词，也很难不让人怀疑，有人正在借地方自治之名保护一套封闭的关系网。\n\n我们可以尊重当地会员的判断，就此结束调查；也可以暂时避开支部内部，从与其往来的其他工厂和合作社寻找线索；若认为眼前的抵触恰好说明调查触及了关键，则只能请求更多支部派出监察员，继续查清那些含混不明的往来。"
  fcf_economy_event.80.a:0 "“大老鼠”是个好同志，不要继续调查了。"
  fcf_economy_event.80.b:0 "从其他地方寻找线索。"
  fcf_economy_event.80.c:0 "越不配合说明越有鬼，加大力度。"

  fcf_economy_event.81.title:0 "白手套"
  fcf_economy_event.81.desc:0 "绕开已经陷入沉默的当地支部以后，调查终于取得了突破。几家与其长期往来的运输合作社和联邦工厂公开了保存完整的账目。来自这些单位的会员代表同监察员交叉核对后发现，一些看似毫无关联的物资调拨都指向了同一批人。\n\n真正出面收取礼物、修改单据和安排交易的，从来不是“大老鼠”本人，而是他身边几个不起眼的小负责人。这些人掌管仓库、采购和互助金，职位不高，却恰好处在各种资源流动的关节上。他们以个人名义接受商人的酬谢，再通过虚报损耗、优先安排订单等方式予以回报。\n\n所得好处一部分留在他们自己手中，另一部分则经过几次转手，流入由“大老鼠”支配却从未交给会员大会审查的账目。即使账簿被发现，他也没有在上面留下签名；即使某名负责人受到追问，也只会承认自己办事不合规，而不会提及背后是谁作出的安排。\n\n这也解释了为何此前始终找不到直接证据。“大老鼠”只需在会议上暗示某家工厂“应当得到照顾”，便会有人替他完成余下的事情。每个人都只负责关系网中的一小段，即使其中一环暴露，也很难直接牵连到处在中心的那个人。\n\n与此同时，他又把部分所得用于接济困难工人、填补支部开支，或者解决共同程序迟迟未能处理的问题。当地工人看到的是雪中送来的煤炭、突然获批的救济金，以及一个总能替他们办成事情的老同志；至于这些恩惠究竟由谁承担代价，他们既无从知晓，也很少追问。\n\n证据已经揭开了这套关系网的运转方式，但如何处置仍需作出决定。我们可以将全部材料公开移交，要求依法逮捕“大老鼠”；也可以先处理那些直接收钱和改动账目的白手套；或者让他来到监察委员会与会员代表面前，亲自解释这些往来。"
  fcf_economy_event.81.a:0 "腐败分子嚣张什么？逮捕！"
  fcf_economy_event.81.b:0 "杀鸡儆猴是最稳妥的选择。"
  fcf_economy_event.81.c:0 "让“大老鼠”亲自解释吧。"

  fcf_economy_event.82.title:0 "另一侧的群众运动"
  fcf_economy_event.82.desc:0 "对“大老鼠”的指控经数个支部的监察代表共同确认，并被正式移交以后，当地工人也迅速行动起来。负责执行逮捕的人员尚未走进支部办公室，大楼前便聚集起数百名会员。他们封住入口，高举写有“大老鼠”姓名的标语，附近几家工厂甚至临时停工，更多人正从车间赶来声援。\n\n在他们看来，“大老鼠”或许不总是按共同章程办事，却从未背叛过当地工人。失业者领到的救济、冬季送进住宅的煤炭、工厂断料时及时调来的物资，都比外地监察员展示的账目更有说服力。那些被称作贿赂的款项，也被解释为支部不得不采取的变通办法。\n\n当监察代表试图宣读证据时，回应他们的却是一阵嘘声。有人指责外地人只看见几笔没有登记的开支，却从未经历过当地支部缺少资源的日子；也有人反问，若“大老鼠”当真只为自己敛财，为何受到帮助的总是这里的工人？\n\n但在另一边，参与调查的支部同样召开了会员大会。那些发现本支部物资被低价调走、合作社利益被私下交换的工人，也要求公开全部账目并追究责任。他们拒绝接受这样的说法：只要贪腐所得的一部分留在当地，受损的其他支部便应当保持沉默。\n\n两种动员都声称自己正在捍卫工人自治。一边认为，外来监察无权推翻当地多数会员信任的负责人；另一边则认为，任何支部都无权以自治为名，把共同财产变成少数人经营声望的工具。过去，我们总把群众运动视为对抗官僚的力量，如今，工人却在同一面旗帜下站到了彼此的对面。\n\n执行逮捕的人员仍在等待道路被让开，监察代表也不断要求当地支部履行各支部共同通过的监督章程。眼前的阻拦并非来自某个高高在上的官僚机关，而是来自本应成为改革基础的工人自身。可摆在各支部面前的证据，并没有因为街上的人数而消失。"
  fcf_economy_event.82.a:0 "顶住压力。"

  fcf_economy_event.83.title:0 "对峙"
  fcf_economy_event.83.desc:0 "会谈被安排在总工会全国机关一间没有挂牌的小会议室里。这里仅仅提供了一个不属于任何涉案支部的场所。坐在“大老鼠”对面的，是参与调查的轮值监察员和几个支部推选的会员代表；桌上则摆着账册、往来信件以及白手套们的证词。\n\n“大老鼠”逐页翻看材料，脸上却没有多少慌乱。他很清楚，监察委员会虽然查明了问题，却不能替当地会员大会发言，更不能命令其他支部无条件承担当地的困难。只要支持他的工人仍然拒绝承认调查结果，任何处置都会伴随着一场漫长的争执。\n\n他没有否认那些交易，只是换了一种说法。当地支部长期缺少经费，互助金入不敷出，许多工厂又必须依靠私人关系才能及时取得原料。账面上被称作贿赂的钱，有相当一部分最终填进了这些窟窿。若他不利用自己的关系周转，支部早已无法维持。\n\n支部的账目确实存在长期缺口，其他地区过去也很少过问这些困难。但“大老鼠”同样从往来中积累了财富、权力和个人声望。即使他说的每一句话都是真的，也无法解释为何这些资源从未交给会员公开管理，而必须经过他和几个亲信的私人关系网。\n\n随后，他提出了一项交易。监察委员会可以处置那些直接收钱和修改账目的白手套，他不会阻拦，也愿意出面劝说当地工人接受调查结论。作为交换，革命工团委员会必须说服其他支部提供更多资金和物资，填补旧有渠道消失后留下的缺口；对他本人的追究则到此为止。\n\n会员代表中很快出现了争论。有人认为，他不过是想用当地工人的生计换取自己的安全；也有人指出，造成这套关系网的不只是个人贪欲，还有支部之间长期失衡的资源分配。无论如何，他已经把白手套、当地支部和自己的命运一同摆上了谈判桌，现在只等我们表态。"
  fcf_economy_event.83.a:0 "成交。"
  fcf_economy_event.83.b:0 "为了不被逮捕而编造出这种谎言，逮捕他。"

  fcf_economy_event.84.title:0 "支部反叛"
  fcf_economy_event.84.desc:0 "“大老鼠”最终被带离了当地支部。阻拦逮捕的工人虽然没有立刻接受调查结论，却也没有继续封锁大楼。几名涉案负责人相继停职，未经会员审查的私人账目被查封，盘踞多年的关系网似乎终于从支部中消失了。\n\n然而，随着这套关系网一同消失的，还有过去总能临时调来的煤炭、原料和救济款。其他支部通过互助表决送来了一些物资，但每一笔援助都需要公开讨论，也不可能填补所有缺口。当地互助金很快见底，日常津贴开始拖欠，部分工厂也因原料不足而缩减生产。\n\n越来越多的工人选择退出总工会，转而加入能够立即提供救济或工作保障的其他工会。他们未必相信“大老鼠”清白，只是认为外来的监察代表既然坚持拆除旧有办法，就应当知道新的办法在哪里，而不是在调查结束后回到各自的支部。\n\n留在支部中的会员同样怨气日盛。在他们看来，参与调查的那些人只关心共同章程是否得到遵守，却不曾真正理解当地是如何熬过一次次短缺的。账目中的证据没有被推翻，但它们已经不再是会员大会最关心的问题。\n\n支部大会很快通过了一份措辞激烈的决议。决议没有宣布退出总工会，却指责跨支部监察正在演变成外地多数对地方少数的干涉，并要求废除革命工团委员会所推动的轮值调查制度。会场上不断有人重提“大老鼠”过去的功劳，把眼前的困难视作这场改革脱离实际的证明。\n\n为了反对一项自称捍卫基层自治的改革，这些会员开始公开支持总工会中与革命工团委员会敌对的派系。他们把代表席位和会场上的掌声交给那些曾被自己视作官僚主义者的人，并宣称只有这样，才能阻止其他支部再次决定他们应当怎样生活。"
  fcf_economy_event.84.a:0 "荒谬。"

  fcf_economy_event.85.title:0 "打草惊蛇"
  fcf_economy_event.85.desc:0 "接受请求、加派调查力量以后，更多支部抽调会员加入了对“大老鼠”的监视。他们轮流守在办公室附近，记录每一名登门拜访者，又暗中核对近期的物资调拨和资金往来。然而，除了几场普通会议和几笔完全合乎章程的开支，我们什么也没有发现。\n\n那些曾经频繁出入支部的商人和合作社负责人突然不再露面，几个与“大老鼠”关系密切的小管理者也变得格外谨慎。所有文件都按照规定公开，仓库里的每一批物资都有明确去向，就连过去最常出现问题的互助金账目，如今也整齐得挑不出毛病。\n\n这或许说明此前的怀疑并无根据，但监察员更倾向于另一种解释：“大老鼠”已经意识到自己正受到监视。他熟悉当地支部的每一个角落，也认识许多从周边地区抽调来的会员。只要有人多问一句，或者一封信被送错地方，他便足以察觉危险。\n\n如果判断无误，继续采取相同手段恐怕很难有所收获。只要轮值监察员仍然留在当地，“大老鼠”就不会轻易暴露自己的关系网；可这些会员本应定期返回原来的车间，他们所在的支部也已经开始要求召回长期外出的代表。\n\n负责此案的部分人员因此建议及时停止。跨支部监督依赖的是各地会员自愿承担共同责任，不能为了一个始终没有进展的案件，无限期占用其他支部的人手。继续监视不但需要新的轮换者，也会使监察制度看起来越来越像一支常驻地方的专门机关。\n\n但另一些人拒绝就此罢休。“大老鼠”不可能永远保持警惕，支部仍然需要运转，旧有的往来关系也不可能彻底断绝。只要监察员继续守着，总会有人松懈，也总会有一笔交易留下痕迹。问题只在于，还有多少支部愿意继续派人陪他耗下去。"
  fcf_economy_event.85.a:0 "算他赢了。"
  fcf_economy_event.85.b:0 "我们有的是时间和他耗。"

  fcf_economy_event.86.title:0 "白费功夫"
  fcf_economy_event.86.desc:0 "又过了几个星期，监视仍旧没有带来任何结果。“大老鼠”每天准时来到支部，参加公开会议，处理经过会员表决的事务，随后在众目睽睽之下离开。那些曾与他往来密切的人也始终没有出现，仿佛那套备受怀疑的关系网从来不曾存在。\n\n为了维持监视，各支部不得不不断更换轮值会员。刚刚熟悉当地情况的人很快便要返回原来的车间，接替者又得从头辨认支部中的人员与往来。有人守了十几天，只记下几次普通拜访；有人翻完数月账目，发现的也不过是几处无关紧要的登记错误。\n\n这种消耗已经波及其他调查。几份内容更加具体的举报被迫延后，原本准备前往别处核查账目的会员只能留在这里继续等待。派出轮值者的支部同样开始抱怨：他们愿意为共同监督承担责任，却不能无限期地把人手耗在一场看不到尽头的监视上。\n\n“大老鼠”则恢复了往日的从容。他不必公开反对监察制度，也不必证明所有指控都是谎言，只需继续照章办事，让异地代表一批接一批地空手而归。随着时间推移，最初那些令人不安的疑点，反倒越来越像改革派不肯承认错误的借口。\n\n会员们也逐渐失去了耐心。改革开始时，人们被告知，跨支部监督能够打破管理者之间的包庇，让任何关系网都无法躲过普通工人的查问。如今，他们看到的却是大量会员被抽离本职工作、其他案件无人处理，以及一个受到怀疑的人仍安稳地坐在原来的位置上。\n\n有人开始怀疑，问题或许不在于监察员还不够坚持，而在于总工会根本无法依靠自身完成改革。只要掌握人脉和资源的人愿意暂时收敛，轮值代表便只能在有限的时间里徒劳等待。我们原想证明工人能够监督自己的组织，最后却只让所有人看见了这套制度的无力。"
  fcf_economy_event.86.a:0 "搬起石头砸自己的脚。"

  fcf_economy_event.87.title:0 "接踵而至的混乱"
  fcf_economy_event.87.desc:0 "管理层的民主化仍在继续，但各地支部的改选并没有沿着同一条轨道前进。有些地方迅速改选了几乎全部负责人，有些地方只开放了少数管理岗位，还有一些支部在反复讨论选举办法以后，至今仍由原来的人员暂代职务。改革赋予了会员撤换管理者的权力，却没有保证每一个支部都能立刻找到合适的继任者。\n\n在那些积怨最深的地方，旧管理层几乎全军覆没。几名过去经常在会员大会上抨击官僚主义、替工人出面争取待遇的意见领袖，凭借压倒性的支持进入了支部委员会。他们熟悉工人的不满，也确实愿意听取车间的声音，可当真正坐到办公桌前时，事情却远比在会场上复杂。\n\n采购计划、互助金账目、跨地区调拨和工厂间的供货协议，不会因为管理者深受欢迎便自行完成。一些新当选者连最基本的账目格式都看不明白，只能继续依赖被他们赶下台的旧职员；另一些人则把所有问题都带回会员大会表决，使一批原本只需几封信便能解决的事务拖延数日。还有人坚持首先兑现竞选时作出的承诺，未经协调便提高本地补助、扣留原定外调的物资，结果让邻近支部措手不及。\n\n可在另一些地方，选举带来的却不是更替，而是旧管理者地位的进一步巩固。那些善于照顾本地会员、长期经营人际关系的负责人轻易赢得连任，甚至借公开投票证明自己得到了工人的授权。有人私下把他们比作拿破仑三世：选票并没有削弱个人权威，反而为它披上了民主的外衣。过去还能以长期占据职务质疑他们的人，如今也不得不面对一个难以回避的事实——他们确实获得了多数会员的支持。\n\n单独来看，每个支部似乎都有自己的理由。工人有权选出信任的人，也有权用新的办法处理本地事务。但总工会并不是彼此隔绝的自治小岛。原料需要在不同地区间调拨，合作社需要核对供货，互助金也常常依靠多个支部共同承担。一处支部延误登记，另一处工厂便可能收不到材料；一名管理者不熟悉旧有约定，数个地区的生产安排便会同时被打乱。\n\n混乱很快沿着这张网络蔓延开来。文件被退回重填，货物停在仓库里等待确认，已经达成的协议又被新管理者要求重新交由会员审议。没有谁下令停止协作，也没有哪个支部公开拒绝履行共同义务，但由能力、程序和工作节奏造成的错位，已经足以让整个网络运转失灵。改革原本要让管理重新服从工人，如今却开始影响工人自己的生产与生活。\n\n部分同志因此要求规定，任何希望担任管理职务的人都必须首先掌握相应的管理知识。选举权仍属于会员，但民主选择不能代替处理账目、协调生产和履行协议的能力。另一些同志则认为，这种资格限制只会把刚刚被打开的大门重新交还给旧管理者。新制度当然会选出不称职的人，可工人也会亲眼看见他们的失败，并在下一次表决中把他们撤换；民主只有在不断犯错和纠正错误的过程中，才能真正学会管理。"
  fcf_economy_event.87.a:0 "管理者必须得会管理！"
  fcf_economy_event.87.b:0 "这只是改革的阵痛，体制会自动修复这一切。"

  fcf_economy_event.88.title:0 "自我修复"
  fcf_economy_event.88.desc:0 "最初的混乱并没有立即结束。迟到的原料仍然堆在车站，填错的账目仍被往来单位反复退回，一些新当选的管理者也依旧把每一次质疑解释成旧势力的反扑。但随着这些问题真正落到工资、生产和互助金上，会员大会上的气氛开始发生变化。人们不再只争论谁最敢批评过去的管理层，而是追问谁能把眼前的事情办好。\n\n最先失去支持的，正是那些靠着激烈言辞进入管理岗位的人。他们曾经许诺打破一切繁文缛节，却在真正接手事务以后发现，那些表格、记录和协调程序并不全是官僚为了折磨工人而发明的东西。被延误的煤炭不会因为一场慷慨激昂的演说自行送到工厂，算错的互助金也不会因为管理者出身基层便凭空补足。\n\n一些人试图把责任推给旧职员，另一些人则要求会员给他们更多时间。但当同样的错误接连发生，过去的声望便再也无法替他们遮掩无能。支部大会开始要求管理者公开说明每一项延误，车间代表也把生产中出现的问题逐条带到会议上。几名拒绝承认错误的人很快遭到撤换，还有一些人主动辞去职务，回到了自己更为熟悉的工作岗位。\n\n接替他们的并不都是过去的管理者。在数周的混乱中，一批原本不起眼的工人逐渐显露出来：有人主动帮助核对账目，有人熟悉不同工厂之间的供货关系，也有人能够把会员大会上的意见整理成真正可以执行的安排。他们未必最善于在会场上讲话，却已经用实际工作证明了自己的能力。再次举行选举时，这些人的名字频繁出现在各支部的候选名单上。\n\n那些成功连任的旧管理者也不得不像从前那样行事。如今，他们的职位不再来自资历或私人关系，而要不断经受会员的质询与表决。几名曾经习惯把决定留在办公室里的人开始主动公开账目，也不再敢轻易忽视来自车间的意见。选举没有让所有旧人离开，却迫使其中一部分人学会在工人的注视下继续工作。\n\n随着新一轮更替完成，各支部之间的协作逐渐恢复。积压的文件得到清理，混乱的物资调拨重新对齐，产业与地区之间的往来也找到了新的联系人。更重要的是，许多过去只能由少数管理者掌握的事务，如今已经在质询和交接中被更多会员了解。依靠含混记录与私人关系牟利变得更加困难，总工会的全国网络也终于重新运转起来。\n\n当然，问题并没有全部消失。熟悉账目和协调程序的人依旧比普通工人更容易当选，一些深受欢迎的管理者也开始连续获得连任。选举能够淘汰显而易见的无能，却未必能够阻止新的职位垄断。但至少这一次，会员没有等待某个机关替他们纠正错误，而是在亲自承担错误的代价以后，重新作出了选择。\n\n管理层民主化并未像它的拥护者最初设想的那样顺利，却也没有像反对者预言的那样摧毁总工会。经过一段混乱而昂贵的磨合，工人们开始学会如何选出管理者，也学会了如何把不称职的人赶下台。这套制度没有自行创造出完美的人，却终于证明了自己拥有纠正错误的能力。"
  fcf_economy_event.88.a:0 "终于有好消息了。"

  fcf_economy_event.89.title:0 "新瓶旧酒"
  fcf_economy_event.89.desc:0 "为了结束各支部改选后出现的混乱，我们为管理岗位规定了基本的知识要求。希望进入支部委员会、负责账目或参与跨地区协调的人，至少应当能够看懂收支记录、掌握物资调拨程序，并熟悉总工会各单位之间的共同约定。会员仍有权决定由谁管理自己，但候选人首先必须证明，他们确实知道该如何完成这份工作。\n\n这项规定很快稳定了各地的秩序。那些连账目都无法核对、只会把所有问题推回会员大会的人不再出现在候选名单上，支部也不必担心新任负责人上台以后重新学习一切。至少从表面看来，我们终于在工人民主与管理效率之间找到了平衡。\n\n然而，当新一轮选举结束以后，各支部送来的名单却令人感到似曾相识。负责采购的仍是过去负责采购的人，掌管互助金的仍是过去掌管互助金的人，几个长期代表支部与外地协商的负责人也顺利获得连任。偶尔有新人进入委员会，也大多是原有管理者的助手、账目员或长期参与文书工作的职员。\n\n这并不是因为会员拒绝改变。许多工人确实想要推举自己信任的车间同伴，却发现他们不熟悉复杂的账目，也不了解跨地区调拨的程序。要让这些人立刻接手管理事务，很可能再次造成此前那种混乱。相比之下，旧管理者的名字虽然乏善可陈，却至少意味着文件能够按时送出，物资不会因为手续错误停在仓库里。\n\n于是，管理知识逐渐变成了一道看不见的门槛。任何工人名义上都可以成为管理者，但真正有资格站到选票上的，仍然只是少数长期脱离一线事务、已经掌握专门知识的人。我们原本希望把管理变成一种可以检验的技术，以免职位继续被资历和关系垄断；结果却发现，掌握这种技术的恰好还是原来那批人。\n\n更棘手的是，选举并没有削弱他们的地位，反而为其增添了新的合法性。过去，会员还能指责某位负责人只是依靠任命或资历长期占据职位；如今，他却可以拿出公开表决的结果，宣称自己不但懂得管理，而且得到了多数工人的信任。对他的质疑也很容易被解释成对会员选择的不尊重。\n\n但这种结果同样不能被简单说成欺骗。投票是真实的，会员也确实知道自己选择了谁。许多旧管理者虽然习惯于原有作风，却远比临时推举的新人更了解支部如何运转。如果他们能够在公开竞争中胜出，或许恰恰说明，问题不在于这些人继续担任管理职务，而在于我们曾把一切旧管理者都当成了必须清除的官僚。\n\n另一些同志却认为，只有少数人掌握管理知识时，选举就不可能提供真正的选择。若普通工人永远看不懂账目、不了解协调程序，他们便只能在熟悉管理的旧人之间投票。要打破这种局面，就必须把原本封闭在办公室里的知识带到车间，让更多工人有能力成为候选人——即使这意味着总工会还要付出新的时间与资源。\n\n我们确实换上了选票，也换上了新的制度；可坐在管理岗位上的，仍然大多是那些熟悉的面孔。问题在于，这究竟证明旧管理者无可替代，还是证明我们的民主仍缺少真正的选择？"
  fcf_economy_event.89.a:0 "如果他们能选上，说明他们值得。"
  fcf_economy_event.89.b:0 "我们应当让普通工人也学习管理知识。"

  fcf_economy_event.90.title:0 "过载"
  fcf_economy_event.90.desc:0 "为了让管理岗位不再被少数熟悉账目与程序的人垄断，各地支部陆续开设了管理课程。任何会员都可以报名，课程内容从收支记录、物资调拨一直讲到跨地区协议与会员大会的组织程序。过去只在办公室里流传的知识，如今被整理成讲义，送进了工厂、矿区和运输站。\n\n最初的报名十分踊跃。许多工人都想知道，那些管理者每天究竟在纸张上写些什么，又为何总能用几个复杂的名词挡回车间提出的要求。第一堂课的会场常常挤得水泄不通，有人甚至站在窗外听完了整晚的讲解。改革派因此相信，只要知识不再受到封锁，普通工人很快便能取代旧管理者。\n\n然而，这种热情没有维持多久。课程只能安排在轮班结束以后，许多学员来到教室时已经连续工作了八个小时。讲师在黑板上解释库存折损与互助金平衡，台下却不断有人打起瞌睡。晚班工人很难按时参加，负责照料家庭的人也常常中途离开。几周以后，原本坐满的教室里往往只剩下寥寥数人。\n\n留下来的人同样开始提出疑问。即使通过全部课程，他们也未必能够在下一次选举中胜出；即使当选，等待他们的也只是更多账目、会议和争执。相比之下，继续做好本职工作至少能得到确定的工资和休息。掌握管理知识带来的不是一项可靠的权利，而是一种可能永远派不上用场的资格。\n\n一名机床工人在退课时算了一笔简单的账。他已经用六个晚上学习如何核对支部账目，却因此少陪了家人六个晚上。下次改选还有数月，即使到时候有人提名他，也很难与那些已经处理多年事务的旧管理者竞争。他并不反对工人管理总工会，只是不明白为什么这项改革的代价必须由他在下班以后独自承担。\n\n渐渐地，培训班里只剩下几类人：本就参与文书工作的职员、明确希望成为管理者的积极分子，以及少数拥有充足闲暇的会员。我们确实向所有工人敞开了学习的大门，可并不是每个人都有余力走进去。管理知识不再受到旧管理层的正式垄断，却开始按照时间、精力和个人处境重新分配。\n\n如果继续维持现状，那些真正感兴趣的人至少仍能得到学习机会。课程规模或许不大，却总能逐渐培养出一批新的候选人。但若我们希望普通工人广泛参与，就不能把学习管理当作一种占用休息时间的个人爱好。有人主张缩短学员的劳动时间，把课程视作正式工作的一部分；反对者则提醒，这意味着各支部不仅要支付培训成本，还得安排其他人填补他们离开岗位造成的空缺。\n\n还有人认为，我们从一开始就错误地假定所有工人都应当为管理岗位作准备。真正希望承担这份责任的人，自然会寻找书籍、请教职员并设法证明自己的能力；总工会没有必要耗费大量资源，把多数人并不需要的知识塞给每一名会员。可若学习再次成为个人必须独自跨过的门槛，那些最有时间和门路的人，恐怕仍会最先站到选票上。\n\n知识已经离开了上锁的办公室，却没有因此自动进入每名工人的头脑。我们想减轻管理岗位的门槛，最后却给普通工人的劳动与生活又添上了一层负担。现在必须决定的，是让有限的兴趣慢慢结出成果，还是由整个组织共同承担学习管理的时间与成本。"
  fcf_economy_event.90.a:0 "继续向那些感兴趣的工人提供教学。"
  fcf_economy_event.90.b:0 "那就把这个当成工作来对待！"
  fcf_economy_event.90.c:0 "真正想成为管理者的人不需要我们。"

  fcf_economy_event.91.title:0 "新风貌"
  fcf_economy_event.91.desc:0 "管理岗位第一次向全体会员开放选举后，各地支部陆续送来了新任管理人员的名单。车间里的机修工、仓库中的清点员、长期替同伴核算工资的会员代表，以及参加过管理课程的普通工人，开始出现在支部委员会和各类管理岗位上。他们没有长期坐在办公室里的履历，却已经能够看懂账目、处理调拨，也知道一项决议需要经过哪些程序才能真正落到生产中。\n\n在选举开始以前，许多人曾担心，会员即使有权推举自己信任的同伴，最终也只能在旧管理人员之间作出选择。毕竟，负责采购、互助金和跨地区协调的人需要掌握大量专门知识，而这些知识过去几乎都封闭在办公室里。若将职位直接交给毫无准备的工人，管理层民主化很可能首先带来账目混乱与生产停顿。\n\n此前开设的管理课程改变了这种局面。当选举真正开始时，这些人已经足以构成旧管理层之外的另一批候选人。他们能够向会员说明自己准备如何核对账目、安排采购和履行支部之间的协议，而不只是依靠对官僚主义的抨击赢得掌声。工人第一次拥有了既来自车间、又具备基本管理能力的选择。\n\n选举结果并没有把旧管理者全部赶走。一些办事可靠、愿意接受会员监督的负责人仍然获得了多数支持，继续留在原来的岗位上。但另一些长期依靠资历和人际关系占据职位的人，则败给了那些受过培训的普通会员。\n\n交接过程仍称不上轻松。旧管理者留下了成摞的文件、数年未曾改变的记录方式，以及许多只靠口头传递的工作习惯。新当选者不得不一边请教原有职员，一边重新核对那些无人说得清来历的数字。有些会议因此拖到深夜，也有几批货物因为签字错误耽误了出库，但此前的教学至少让他们知道应当从何处着手，而没有让整个支部在职位更替后陷入瘫痪。\n\n更重要的变化并不在账册上，而在办公室与车间之间。许多新管理者直到选举前仍和其他工人站在同一条生产线上。他们知道哪台机器总在夜班发生故障，知道仓库里登记为“尚有余量”的原料其实早已无法使用，也知道一项看似微不足道的排班调整，会给有孩子的工人带来怎样的麻烦。\n\n一名新任采购负责人上任后，很快发现本支部长期购入的某种零件价格低廉，报表上也从未出现短缺，但实际损耗却远高于记录。过去的管理者总能用“工人操作不当”解释差额，而他曾亲自在那批零件旁工作多年，清楚问题出在供货质量。合同被重新审查以后，一条维持数年的利益链也随之暴露。类似的事情开始在各地出现：虚报的、被掩盖以及只在账面上的东西，都很难继续欺骗那些真正熟悉现场的人。\n\n腐败并没有因此绝迹，但它失去了许多藏身之处。新管理者与会员共同生活，也随时可能在会员大会上被自己的工友质询。他们很难一面声称仓库已经清空，一面要求每天经过仓库门口的人相信自己的报表；也很难把明显不合生产实际的数字当作成绩，交给一个对此毫无经验的委员会轻易通过。数据开始变得朴素，甚至没有从前那样耀眼，却更接近工厂真正能够生产的东西。\n\n各支部之间的摩擦也随之显现。扎根本地的新管理者比旧人更了解会员的诉求，也往往更愿意优先满足本地需要。有些支部拒绝外调紧缺原料，有些管理者宁可让附近工厂多留一批库存，也不愿遵守远方单位提出的调拨安排。旧有的官僚主义正在退却，地方保护主义却可能随着会员授权获得新的力量。\n\n但至少目前，变化带来的收益远大于这些争执。生产安排不再只围绕漂亮的报表制定，真正影响车间运转的问题得到了更快处理，支部账目也变得更加公开可信。管理不再像一种与劳动相隔绝的特权，而开始成为工人可以学习、承担，也可以通过选举交给他人的公共职责。新的管理者仍然会犯错，仍然会受到地域与派系的牵引，但他们至少知道自己管理的不是报表上的数字，而是曾与自己并肩劳动的人。"
  fcf_economy_event.91.a:0 "这才叫工人！"

  fcf_economy_event.92.title:0 "老友"
  fcf_economy_event.92.desc:0 "莫纳特到达印刷工会的办公室时，格雷森已经在那里等候多时。桌上没有正式议程，也没有负责记录的秘书，只有两杯逐渐冷却的咖啡和几份刚刚印出的工会报刊。两人已经许久没有这样单独见面，却也无须花费时间重新认识彼此。早在革命以前，他们便曾在同一场场会议中争论总罢工、工人自治与工团主义的未来；只是此后各自选择的道路，使“老友”逐渐变成了一个带有讽刺意味的称呼。\n\n这次将他们重新带到一张桌前的是儒奥。总工会温和派掌握着中央机构、跨地区协调网络和大量地方支部，并试图以维持生产与组织团结为由，限制进一步的基层民主化。莫纳特领导的激进派虽然能够在会员大会上赢得掌声，却始终难以撼动那些经营多年的职位。若国工联愿意从外部施压，温和派便不得不同时应付两条战线。\n\n格雷森对此并不意外。国工联同样反对儒奥把总工会变成一套只求稳定运转的官僚机器，而格雷森本人也从未掩饰过对温和派的不屑。然而，共同的敌人并不足以构成同盟。他提醒莫纳特，过去也有不少人在党内斗争陷入困境时想起国工联，一旦渡过难关，便又急忙与这群“不合时宜的激进分子”划清界限。\n\n“你需要的究竟是同盟者，”格雷森问道，“还是一群替你冲击儒奥、事后便可以被遗忘的人？”\n\n莫纳特没有否认双方之间的分歧。国工联对民族、战争与革命纪律的看法，始终令总工会激进派中的许多人难以接受；格雷森也不可能让自己的组织接受莫纳特的领导。但他们至少相信同一件事：总工会不应由一群终日核对报表、调和争议的人决定方向，更不能把革命留下的组织变成维持现状的工具。双方可以不解决旧日争论，先阻止儒奥继续巩固自己的位置。\n\n格雷森听完后没有立即作答。他真正想知道的，是莫纳特一派究竟准备把这场斗争推进到什么程度。如果他们只想迫使温和派作出几项妥协，国工联没有必要为此承担风险；若他们确实准备改变总工会的权力结构，合作本身或许便已足够。当然，莫纳特也可以拿出更具体的诚意。\n\n国工联长期替退役士兵争取工作与组织空间，而印刷工会又是格雷森传播主张、维系支持者的重要阵地。无论是由总工会协助退役士兵重新就业，还是让国工联在印刷工会中获得更多话语权，都足以证明这份邀请不只是一句临时的口号。代价在于，任何公开承诺都会引起莫纳特阵营内部的疑虑，也会让未来的同盟更加难以收回。\n\n窗外的机器仍在转动，新一期报纸很快便会送往各地。格雷森端起已经凉透的咖啡，等待老友报出自己的条件。"
  fcf_economy_event.92.a:0 "合作本身就是回报。"
  fcf_economy_event.92.b:0 "应当积极协助退役士兵的再就业。"
  fcf_economy_event.92.c:0 "国工联将在印刷工会拥有更多话语权。"

  fcf_economy_event.93.title:0 "革命同盟"
  fcf_economy_event.93.desc:0 "格雷森没有让莫纳特等待太久。几天后，一封没有使用国工联正式信笺的短函送到了总工会激进派的办公室。信中没有热情洋溢的宣言，也没有关于共同理想的长篇陈述，只列出了几处可以交换消息的联络点、几名愿意出面协调的地方负责人，以及一句简短的答复：国工联愿意加入这场斗争。\n\n双方已经达成的约定将由各自的组织分别履行，但合作不会以公开结盟的形式宣布。国工联的报刊将开始追查总工会中央机构中的任人唯亲、账目遮掩与职位垄断，莫纳特一派则会把这些材料带进会员大会和劳工总议会。若温和派试图处分某个反对他们的地方支部，双方也会同时发动自己的支持者，使问题不至于被悄无声息地压下去。\n\n格雷森并没有因此接受莫纳特的领导。国工联仍将保留自己的组织、纲领和宣传网络，也不会停止批评总工会激进派在民族、战争与革命纪律等问题上的立场。莫纳特同样提醒自己的同志，这是一项针对儒奥派的政治协作，而不是对国家工团主义的认可。那些横亘在双方之间的旧争论一个也没有得到解决，只是暂时被放到了桌子的另一边。\n\n然而，对儒奥而言，这种有限的联合已经足够危险。过去，温和派可以把总工会内部的反对者说成缺乏组织能力的喧闹少数，也可以把国工联的攻击斥为局外人的煽动；现在，两股力量开始互相提供对方过去欠缺的东西。莫纳特拥有总工会内部的代表、支部与程序经验，格雷森则拥有覆盖广泛的出版网络，以及一批不受中央机构约束的忠实支持者。\n\n合作的效果很快显现。原本只在少数支部流传的争议被印成小册子送往各地，遭到中央压制的地方代表也开始得到国工联报刊的声援。与此同时，莫纳特一派不再只是提出抽象的民主化口号，而能够拿出一份份具体的账目、任命和会议记录，证明温和派所谓的“维持秩序”究竟保护了什么。\n\n国工联内部并非无人反对。一些人不相信总工会激进派会履行承诺，另一些人则认为格雷森正在替莫纳特争夺一个与自己无关的机构。但格雷森压下了这些质疑。他并不要求自己的同志相信莫纳特，只要求他们看清眼前的机会：只要儒奥建立的秩序出现裂缝，任何试图让总工会重新成为革命组织的人，都将从中受益。\n\n二十年前，他们曾站在同一场运动中，相信工人组织能够越过议会与官僚，自行塑造一个新的社会。此后发生的一切使他们走向了不同道路，也让昔日的同伴变成了彼此警惕的对手。如今，他们没有重新成为同志，却再次把矛头指向了同一个敌人。\n\n这未必是一段长久的友谊。但至少在儒奥倒下以前，旧日的革命者又一次站到了一起。"
  fcf_economy_event.93.a:0 "亦如二十年前。"

  fcf_economy_event.94.title:0 "缺少诚意"
  fcf_economy_event.94.desc:0 "格雷森的答复是在三天后送到的。信件没有使用国工联的正式信笺，内容也比莫纳特预想中简短得多。除去必要的问候，整封信只有寥寥数段，而其中最重要的一句话已经足以终止这场谈判：国工联不会加入总工会激进派对抗儒奥的行动。\n\n莫纳特提出的条件并非毫无分量。无论是协助退役士兵重新就业，还是让国工联在印刷工会中获得更大的活动空间，都能给格雷森的组织带来实际利益。即使没有这些额外承诺，双方对总工会官僚化的共同反感也是真实的。问题在于，格雷森从未怀疑莫纳特反对儒奥；他怀疑的是，莫纳特究竟准备反对到什么程度。\n\n在格雷森看来，总工会激进派仍然把这场斗争视作内部路线之争。他们要求开放管理岗位、扩大会员监督，也愿意削弱温和派经营多年的职位网络，却始终没有表现出彻底打破现有秩序的决心。莫纳特需要国工联，是因为自己暂时缺乏足以压倒儒奥的力量；一旦温和派同意作出让步，这场所谓的共同斗争便可能随时结束。\n\n那些具体条件也没有改变他的判断。退役士兵的工作不应成为一场临时结盟的报酬，印刷工会中的话语权更不该依靠秘密交易获得。若莫纳特真正认同这些要求，便应当公开把它们写进自己的改革主张，而不是只在需要国工联帮助时摆上谈判桌。格雷森不愿意用组织的支持，换取几项随政治形势变化便可能被收回的承诺。\n\n信中没有激烈的指责，也没有彻底断绝往来的威胁。格雷森仍然承认双方拥有共同的敌人，也表示国工联会按照自己的方式继续揭露温和派的腐败与官僚主义。但他们不会接受莫纳特的协调，不会向总工会激进派提供出版网络和地方组织，更不会让自己的支持者替另一派在内部斗争中承担风险。\n\n消息传回后，激进派办公室里的气氛一度十分沉闷。有人指责格雷森傲慢自负，宁可维护国工联的独立姿态，也不愿抓住削弱儒奥的机会；也有人不得不承认，他的怀疑并非全无根据。莫纳特希望得到一个盟友，却又始终避免说明，等温和派倒下以后，他究竟准备把改革推进到哪里。\n\n这场接触并非毫无收获。至少双方已经知道，彼此的分歧并不能仅靠旧日交情和共同敌人掩盖。只是从今以后，总工会激进派必须独自面对儒奥遍布中央机构与地方支部的势力。格雷森没有站到温和派一边，却也不会替莫纳特打赢这场战争。"
  fcf_economy_event.94.a:0 "靠我们自己也可以。"

  fcf_economy_event.95.title:0 "人在哪？"
  fcf_economy_event.95.desc:0 "专业官僚制度开始实施以后，各地支部陆续提交了符合任职标准的人员名单。最初几份报告还算乐观：巴黎、里昂、马赛等地拥有不少熟悉统计、会计和生产调度的职员，一些大型产业支部甚至能够在多个候选人之间进行挑选。可随着偏远地区和小型支部的名单逐一送达，表格上的空白也越来越多。\n\n有些支部只能找到一名勉强合格的会计，却找不到能够负责跨地区调拨的人；有些支部虽然推举了几位经验丰富的老职员，他们却没有通过新设立的资格审查；还有一些地方根本无力开设完整的培训课程，只能把总部发下来的教材交给会员自行研读。原本预计能够迅速填满的岗位，如今仍有近半数由临时人员代理。\n\n问题并不只在于几个办公室缺少职员。总工会的跨区域协作依赖每个支部共同完成登记、核算和确认：煤炭支部要知道钢铁厂真正需要多少燃料，运输支部必须核对货物的数量与去向，负责结算的人员又要确认双方使用的是同一套记录。只要其中一处没有合格的管理者，前面送来的数字便无人查验，后面等待的货物也无法放行。\n\n最明显的一次延误发生在一批机床的调拨中。提供设备的支部已经完成装运，接收方也早已清理出厂房，但负责核对协议的职位始终无人担任。临时代理人不敢在数额庞大的文件上签字，只能将材料送往邻近支部审查；对方的专业官僚同时负责四项调拨，又把文件压了整整一周。等到机床终于抵达时，配套零件仍滞留在另一处仓库，整条生产线只得继续停工。\n\n类似的混乱正在各地重复出现。我们设立统一标准，原本是为了避免不称职者再次进入管理层；可若标准高到大多数支部无人符合，制度便只能证明哪些工作没人能够完成。即便部分支部已经拥有一套精干的管理班子，也无法弥补整个网络中的空缺。跨区域协作并不取决于人员最充足的地方能做多少，而取决于最薄弱的一环能够承担多少。\n\n总部面前摆着三种办法。我们可以暂时打破总工会内部的界限，向全社会招募会计、工程师和行政职员，以最快速度填补空缺；也可以把大城市和大型支部中较为充足的人手调往缺员地区，让专业官僚在不同支部之间流动。若不愿扩大外部招聘，也不愿强迫支部交出自己培养的人才，就只能让现有人员暂时身兼数职，等待各地完成下一轮培训。\n\n空着的岗位仍在增加，堆积的文件却不会等待我们培养出更多人才。专业官僚制度已经规定了什么样的人才有资格管理总工会，现在，我们还得先回答一个更加实际的问题：\n\n人在哪？"
  fcf_economy_event.95.a:0 "直接向全社会招募。"
  fcf_economy_event.95.b:0 "让人才充沛的支部分一些到缺少的地方去。"
  fcf_economy_event.95.c:0 "先让官僚们身兼数职一段时间。"

  fcf_economy_event.96.title:0 "不愿成为零件"
  fcf_economy_event.96.desc:0 "第一批调派人员抵达缺员支部后，积压的工作很快得到清理。那些从大型支部派来的会计、统计员和生产协调员熟悉总工会的办事程序，也知道应当怎样把地方账目接入跨地区协作网络。过去需要往返数次才能确认的调拨，如今只需一份格式规范的报告；堆在仓库里的原料重新开始流动，停滞的生产计划也得以继续执行。\n\n从总部汇总的数据来看，这项改革无疑取得了成功。总工会的整体产量正在上升，原料浪费和重复库存显著减少，每名工人创造的产值也超过了改革以前。那些曾经担心缺员支部会拖累整个协作网络的人，如今终于可以用一张张不断增长的报表证明，专业管理与跨地区调派确实提高了效率。\n\n然而，报表没有记录工人们如何看待这些变化。\n\n外来的管理人员通常只在一地任职数月，完成任务后便会被调往下一个缺员支部。他们不熟悉当地工人的生活，也没有耐心参与那些与生产无关的争论。对他们而言，仓库里多留一批煤炭意味着重复库存，降低产量保住一座老旧车间意味着浪费设备，优先向附近工厂供货则是对总工会调拨计划的破坏。只要总账能够平衡，货物被送往哪里、哪座工厂因此停工，似乎都只是数字在不同栏目之间的移动。\n\n一处支部的争议最先公开爆发。当地工人原本希望用积存的材料维修锅炉，外来的管理者却认为另一地区的生产线更需要这批物资，未经会员大会同意便批准了调拨。这个决定使总工会少损失了一批产量，却让本地工人不得不继续在漏气的管道旁工作。面对质询，管理者拿出报表解释，全行业因此获得的收益远高于本地承担的损失。\n\n没有人能够指出他的计算有什么错误。也正因如此，回答才显得格外冷酷。\n\n类似的不满很快在其他支部出现。工人们抱怨，外来管理者更愿意把设备和原料调往中央重视的地区，也有人怀疑，一些人总会优先照顾自己原先任职的支部。即使调拨完全出于效率考虑，当地会员仍然觉得，自己正在被视作整架机器上随时可以拆卸和替换的零件。他们贡献的产值被计入总工会不断增长的数字，生活中的维修、补助和工作条件却没有得到同样迅速的改善。\n\n抗议者并不都反对跨地区协作。他们承认，资源不能永远留在生产它们的地方，也知道某些牺牲确实能够让整个总工会运转得更好。但他们要求，管理者在作出决定时必须把本地工人的生活当作目的之一，而不是只把它视为提高产量时需要计算的成本。\n\n如今，我们可以在调派人员时优先选择熟悉当地语言、习惯和产业关系的人，至少让支部不再完全由陌生人管理。也可以投入更多资源培养本地人才，使外来官僚的任职真正成为一种过渡。可若每一项调拨都必须迁就地域认同，每一个支部都要求本地需要优先，总工会刚刚建立起来的协作秩序也可能重新被地方保护主义撕碎。\n\n数字告诉我们，改革是成功的；工人却说，自己没有从成功中得到什么。当一切都能够被统计和比较时，那些无法被写进报表的东西，反而成了他们证明自己并非零件的最后依据。"
  fcf_economy_event.96.a:0 "在分配人员的时候应当考虑优先地域认同。"
  fcf_economy_event.96.b:0 "应当开始培养当地的管理人才。"
  fcf_economy_event.96.c:0 "那他们想要什么，地方保护主义吗？"

  fcf_economy_event.97.title:0 "过劳死"
  fcf_economy_event.97.desc:0 "清晨的值班员是在总工会一处地区协调办公室里发现他的。前一晚离开时，那名负责物资调拨的雇员还坐在桌前核对运单；第二天，人们推开房门，只看见尚未熄灭的台灯、散落在地上的文件，以及一杯早已冷透的咖啡。医生赶到时已经无能为力，只能将遗体送去检验。\n\n确切死因尚未公布。他过去是否患有疾病、死亡是否直接由劳累引起，都需要等待医生作出判断。然而，消息传开以后，几乎没有人愿意把它当作一场与工作无关的意外。死者同时替三个支部审查账目，每周还要乘火车前往邻近地区处理调拨争议。在生命的最后十余天里，他只休息过一个下午。\n\n“过劳死”这个词很快出现在工会报刊的标题上。最先提出指控的并非总工会的敌人，而是与死者共事的职员。他们公开了办公室的值班表：有人连续数周工作到深夜，有人同时保管几套互不相同的账册，还有人白天参加支部会议，夜间再替另一地区核对积压的文件。所谓临时兼任，早已变成了没有期限的日常安排。\n\n我们很难推卸责任。当初决定让专业官僚身兼数职，是为了渡过人才不足的困难。只要下一批受训人员完成资格审查，现有职员便能逐渐恢复正常工作。可培训所需的时间比预计更长，缺员支部送来的文件却一天也没有减少。为了不让调拨网络再次停顿，总部不断把新的任务交给那些已经证明自己能够胜任的人。\n\n他们也很少公开拒绝。专业官僚制度把能力变成了一种责任：越是熟悉业务的人，越会被要求承担更多岗位；越能及时处理积压事务，桌上便越快出现下一摞文件。一些职员担心拒绝任务会被视为不愿帮助困难支部，另一些人则相信自己只需再坚持几个星期。所有人都知道这是一项缓兵之计，却没有人能够说清这段“暂时”究竟何时结束。\n\n舆论要求总工会立即采取行动。增加专项资金可以提高津贴、改善办公条件，并为长期出差和夜间工作提供医疗保障，至少不再要求职员仅凭责任感承受额外负担。我们也可以允许尚未通过完整资格审查的准官僚承担资料整理、账目初核和文书传递，把专业人员从大量基础事务中解放出来；但这意味着刚刚建立的任职标准必须留出一道缺口。\n\n最直接的办法则是规定工作上限，立即取消超出承受范围的兼任。如此一来，许多职员终于能够休息，代价却是无人接手的文件将重新堆积。部分调拨会被推迟，缺少管理人员的支部也只能暂时退出某些跨地区协作。我们可以减轻每个人的负担，却无法凭一道命令增加合格人员的数量。\n\n检验报告还没有送达，但办公室外已经摆满了工人和职员留下的鲜花。即使医生最终没有在死亡证明上写下“过度劳累”，那些值班表、未休的假期和同时由一个人承担的数项职务，也不会因此消失。现在需要回答的已不只是这名雇员因何而死，而是我们还准备让多少人以同样的方式坚持到改革完成。"
  fcf_economy_event.97.a:0 "向官僚们提供更多的资金支持。"
  fcf_economy_event.97.b:0 "有必要让准官僚辅助工作。"
  fcf_economy_event.97.c:0 "减少官僚们的工作量吧。"

  fcf_economy_event.98.title:0 "卯榫"
  fcf_economy_event.98.desc:0 "各地支部提交专业官僚名单时，总部原本已经做好了面对大量空缺的准备。新的资格标准毕竟比过去严格得多，能够核对复杂账目、安排跨地区调拨，又熟悉本行业生产流程的人，在任何地方都不算充裕。可当名单陆续汇总以后，人们发现，预想中的人才短缺并没有出现。\n\n此前向地方支部提供的资金终于显出了成效。有些支部开办了定期的管理课程，请退休职员讲授会计和统计；有些支部把年轻工人送到邻近的大型工厂实习，再由本地会员选举他们担任管理职务。资金较少的地区也得以购买教材、整理旧档案，并为参加培训的工人补偿误工损失。过去只能依靠个人热情维持的教学，逐渐变成了一项能够长期运行的制度。\n\n因此，专业化并没有迫使各地从少数旧管理者中重新挑选人员。许多普通工人早已在培训中掌握了基本知识，只需通过进一步审查便能正式任职。旧职员仍然占有经验上的优势，却不再垄断那些曾经只在办公室内部流传的办法。会员可以在几名真正了解管理工作的候选人之间作出选择，而不是在“不懂生产的官僚”和“不懂管理的工人”之间勉强取舍。\n\n一次跨地区的设备调拨证明了这套制度的价值。一处冶金支部临时需要更换轧机部件，本地管理人员当天便确认了型号、库存和运输条件；负责制造零件的机械支部按照统一格式复核需求，运输支部则根据两地生产安排调整了车次。文件没有在任何一处被退回，货物与安装人员也在同一天抵达。停工时间最终比原先估计缩短了一半。\n\n整个过程并没有依赖来自总部的紧急命令。每个支部都由熟悉当地工厂的人负责，也仍然保留着自己的选举和监督程序；但当工作需要跨越支部边界时，他们又能够理解彼此的记录，遵守共同的约定，并准确判断自己的决定会给下一环带来什么影响。各个部分形状不同，却能在接合之处严丝合缝，正如一组彼此咬合的卯榫。\n\n这种变化也反映在工人的生活中。调拨更加顺畅以后，工厂不再频繁因为原料迟到而停工，互助金的拨付也很少再因账目不清被拖延。地方支部节省下来的资金被用于维修设备、改善食堂和补充集体福利。专业官僚带来的效率不再只是汇总报告里不断上升的数字，而成为工人能够在车间和家中直接感受到的改善。\n\n当然，管理者与普通会员之间的距离仍然需要警惕。专业知识可能再次变成维护职位的壁垒，顺畅的程序也可能让人忘记质疑一项决定本身是否合理。但至少目前，专业化没有恢复旧式官僚对事务的垄断。受过训练的管理者仍由会员选出，其账目仍受支部监督，他们拥有的是完成公共职责所需的能力，而不是凌驾于工人之上的特权。\n\n我们曾经担心，提高任职标准会让地方支部陷入无人可用的困境。事实证明，真正决定改革成败的并非标准本身，而是普通工人是否拥有达到标准的机会。此前投入的资金没有替支部选出管理者，却使它们能够培养自己的管理者；专业化也没有削弱支部自治，反而让自治不再以混乱和低效为代价。\n\n机器正在运转，货物正在流动，各地的账目与计划也第一次如此顺畅地衔接起来。每个支部仍是独立的一块木料，但它们已经知道应当如何与彼此相接。"
  fcf_economy_event.98.a:0 "这才叫效率。"

  fcf_economy_event.99.title:0 "定义权"
  fcf_economy_event.99.desc:0 "统一各地支部的管理标准，原本被视为一项单纯的技术工作。然而，当各地规章汇集到巴黎以后，改革委员会才发现，需要统一的远不只是表格与档案。同一种原料可能被划入不同等级，同一种工种也可能采用完全不同的资格要求，就连设备损耗与劳动补贴的计算方式也各不相同。\n\n这些差异并非全都源于混乱。各地产业结构、设备条件与生产习惯本就不同，许多规则也是支部在长期运作中逐渐形成的。但随着跨地区采购、物资调拨和行业协作日益频繁，一处支部的记录已经不再只供自己使用。若产品等级、技术资格和账目格式继续各行其是，每一次合作都要重新解释最基本的概念。\n\n统一因此不可避免，问题却在于由谁决定统一的内容。标准一旦规定何种产品合格、何种劳动能够获得补贴、何种人员有资格进入管理层，它便不再只是方便工作的工具，而会直接影响资源分配与地方制度。谁拥有定义权，谁就能以技术标准的名义改变各支部的实际利益。\n\n中央的支持者认为，只有总工会中央拥有最终决定权，共同标准才能真正通行全国。否则，各地总能以情况特殊为由拒绝改革，使所谓统一再次沦为空谈。\n\n地方支部则主张，中央只能规定最低要求，具体的核算方式、附加等级和地方津贴仍应允许自行调整。一套适用于大型工业区的制度，不可能原封不动地套用在所有地区。\n\n还有人提出，既然标准约束所有支部，就应由中央、地方与相关行业共同协商表决。这样的程序更加缓慢，也可能把每项技术问题都变成政治争论，但至少不会让统一被视作一方对另一方的强制。\n\n所有人都承认，旧有差异已经妨碍总工会继续协作。现在需要决定的，只是当共同标准最终写在纸上时，谁的语言会成为所有人的语言。"
  fcf_economy_event.99.a:0 "标准理应由中央统一规定。"
  fcf_economy_event.99.b:0 "中央的标准只是底线，支部可以自行调整。"
  fcf_economy_event.99.c:0 "定义应当通过协商与民主表决。"

  fcf_economy_event.100.title:0 "凭什么？"
  fcf_economy_event.100.desc:0 "统一标准公布后，中央很快收到了各地支部的抗议信。反对者并不否认共同标准有利于跨地区协作，他们质疑的是：中央凭什么要求所有支部放弃自己沿用多年的制度？\n\n不满最强烈的，恰恰是那些经营状况良好的支部。它们依靠本地会费和产业收入维持培训、互助与管理体系，很少向中央请求援助。在这些支部看来，自己承担了发展的成本，如今却要服从一套主要为整顿落后地区而制定的规则。原本合格的产品可能被重新降级，地方津贴可能不再得到承认，已经选出的管理者也可能因为新的资格标准失去职位。\n\n激进派支部则把争议推向了更根本的问题。总工会是各地工人组织自愿联合而成的共同体，中央的权力来自支部，而非相反。如今中央未经地方同意便决定何种制度才算“规范”，无异于把协调机关变成凌驾于支部之上的管理者。\n\n一些抗议者已经开始讨论退出。支持统一的人担心，若此时退让，任何共同改革都可能被地方抵制；可若中央寸步不让，总工会也可能为了统一标准而再次走向分裂。\n\n有人主张给予地方更多财政自主权，使支部至少能够自行决定资金的用途，以此补偿它们在管理标准上的让步。也有人认为，应当允许地方在不违背基本规则的前提下调整具体标准。至于最坚定的中央派，他们并不准备挽留所有反对者：加入总工会本就是自愿的，退出自然也一样。\n\n统一确实能让整个总工会运转得更好，但那些被要求改变的人仍在等待一个答案：\n\n凭什么？"
  fcf_economy_event.100.a:0 "用更多的财政自主权挽回。"
  fcf_economy_event.100.b:0 "地方支部的标准可以做出一定程度的调整。"
  fcf_economy_event.100.c:0 "工会的加入和退出是自然的。"

  fcf_economy_event.101.title:0 "支部退出"
  fcf_economy_event.101.desc:0 "统一标准实施后的第三周，几家反对最为激烈的地方支部正式宣布退出总工会。它们拒绝继续接受中央制定的管理规则，并宣称只有脱离这套日益集中的体系，才能保住工人亲手建立的自治制度。\n\n最初还有人担心，这些声明会引发新一轮分裂。然而，预想中的退出潮并未出现。更多支部虽然同样不满中央，却早已无法轻易离开总工会。它们的原料采购、产品交换、技术信息与互助金都依赖跨地区联络；一旦退出，过去借助整个组织建立起来的关系也将随之中断。\n\n率先退出的支部很快感受到了代价。原定运来的材料被暂缓调拨，其他地区也不愿再按照内部条件与它们交换产品。那些过去被视为中央干涉的表格、标准和审核程序，此刻反而成了它们无法继续进入协作网络的门槛。脱离总工会并没有让地方生产变得更加自由，只是让它们不得不独自承担此前由整个体系分担的成本。\n\n至于总工会本身，几处支部的离开确实造成了一些损失，却没有动摇整体运转。统一标准减少的核对与协调成本，很快便超过了退出带来的缺口。其余支部看见这一结果后，也逐渐放弃了以退出相威胁。\n\n他们有权离开，也确实有理由反对中央夺走地方的定义权。只是一个组织可以脱离总工会，却无法把长期依赖的整个网络一同带走。"
  fcf_economy_event.101.a:0 "理解他们的立场。"

  fcf_economy_event.102.title:0 "高歌猛进"
  fcf_economy_event.102.desc:0 "物质奖励制度推行后的第一批报告已经送达中央。几乎所有试点支部都提高了产量，原料损耗与设备故障也有所下降。过去无人愿意承担的夜班、紧急调拨和技术改进，如今都能更快找到负责者；管理人员也开始主动压缩积压的文件，以争取完成协作计划后的额外奖励。\n\n变化最明显的并不只是报表。工人提出的新工序不再被当作分内之事草草带过，一旦证明能够节省原料或提高产量，提出者便会得到公开表彰和实际报酬。那些长期承担复杂工作、却与其他人领取相同待遇的人，也第一次觉得自己的付出得到了承认。\n\n批评并未因此消失。有人担心，革命原本要让生产服务于公共需要，如今工人和管理者却开始计算每项工作能为自己换来多少好处。若个人报酬成为唯一动力，公共主义或许会在一张张奖金表中逐渐褪色。\n\n支持者则反问：奖励为公共创造更多价值的人，难道就等于背叛公共主义吗？物质刺激并未把工厂利润交给私人，也没有让管理者凭职位获得特权。额外报酬来自更高的产量、更少的浪费和更顺畅的协作；个人所得的每一份奖励，都建立在整个集体确实获得更多成果的基础上。\n\n至少眼下，工人收入正在增加，生产计划也在超额完成。机器昼夜运转，列车满载货物驶向各地，过去停滞不前的数字正一路攀升。无论批评者如何忧虑，这项改革都已经用最直观的方式证明了自己的成效。"
  fcf_economy_event.102.a:0 "这是对努力工作的认可。"
  fcf_economy_event.102.b:0 "我们需要更多的物质刺激。"

  fcf_economy_event.103.title:0 "造假成风"
  fcf_economy_event.103.desc:0 "物质奖励制度带来的生产奇迹，只维持了几个月。反对派在调查几家表现最突出的支部时发现，报表上的增长并不完全来自真实生产：尚未完工的产品被提前计入产量，返工品被当作新增成果重复登记，设备损耗和废品数量则被故意隐去。只要最终数字足够漂亮，管理者与工人便都能获得额外奖励。\n\n类似问题很快在更多地方被发现。有些支部把本应由数家工厂共同分享的技术改进分别申报，另一些支部则将质量不合格的产品送入仓库，等审查结束后再悄悄返工。原本负责核验数据的稽核小组也未能完全阻止造假：它们同样来自本地工人，不愿因为几笔可疑账目让整个支部失去奖励。\n\n这并不意味着此前的全部增长都是虚假的。物质刺激确实提高了积极性，也让许多长期被忽视的贡献得到回报。但奖励越丰厚，改变数据带来的收益也越大。当收入、荣誉与资源配额都取决于报表时，人们不仅会努力提高生产，也会努力让报表显得更好。\n\n最直接的办法，是削减已经明显过度的物质奖励，让造假的收益不再值得冒险。我们也可以保留现有制度，同时要求产业联合会加强抽查与交叉核对，只是更严格的审查必然增加大量手续，并可能让正常生产也陷入反复证明之中。\n\n还有人主张设立专门的反腐败部门，绕过地方关系网调查虚报与串通。这或许最有希望彻底清理问题，却也意味着总工会内部将出现一个长期监视各支部的新机构。若它拥有的权力不足，便只会多出一层官僚；若权力足够强大，又可能成为所有人畏惧的审查者。\n\n数字曾经证明改革取得了成功。如今，同样是这些数字，使我们再也无法确定成功究竟有多少是真的。"
  fcf_economy_event.103.a:0 "物质刺激确实有点过头了。"
  fcf_economy_event.103.b:0 "应当设置更严格的审查机制。"
  fcf_economy_event.103.c:0 "设置专门反腐败部门"

  fcf_economy_event.104.title:0 "再创新高"
  fcf_economy_event.104.desc:0 "物质奖励推行后的第二轮统计，再次超过了最乐观的预期。产量继续增长，原料损耗和设备闲置时间进一步下降，工人的实际收入也随之提高。许多原本进展缓慢的技术改进，如今已经在数个支部之间推广。\n\n反对者并未因此放心。他们认为，收入与报表挂钩迟早会诱发造假，眼下的繁荣或许只是问题尚未暴露。为回应质疑，数个行业工会组织了交叉审查，抽查仓库、账目和生产记录，并重新核对已经发放的奖励。\n\n审查确实发现了一些虚报：有人夸大节省的原料，也有支部提前登记尚未完工的产品。但类似行为在改革前便已存在，在未采用物质奖励的支部中也并不少见。现有证据不足以证明，奖励制度扩大了腐败的范围。\n\n相比之下，它带来的收益却十分明确。紧缺岗位更容易招到工人，技术人员愿意主动改进流程，跨地区调拨也比过去迅速。总工会体系之外的工人开始羡慕会员所能获得的工资、津贴与奖励，一些原本对加入总工会并不热心的工厂，也主动前来询问条件。\n\n任何制度都无法让欺骗和谋私彻底消失。真正需要衡量的，是这些问题是否已经超过改革创造的成果。至少目前，答案是否定的。\n\n新的数字已经送到，而这一次，它们经得起核查。"
  fcf_economy_event.104.a:0 "这确实是我们的成就。"

  fcf_economy_event.105.title:0 "新朋"
  fcf_economy_event.105.desc:0 "儒奥与戴亚的会面被安排在一间远离总工会总部的办公室里。双方都没有对外公布消息，但会谈的目的十分明确：总工会温和派需要一个足以制衡激进派的政治盟友，而法国社会党也在寻找介入联邦经济的新途径。\n\n儒奥将激进派称为总工会内部的“联邦主义者”。在他看来，这些人把支部自治视为不可侵犯的原则，反对统一管理标准、扩充专业人员，也拒绝让中央取得更多调配资源的权力。只要他们仍能借助会员大会和地方支部阻挠改革，总工会便不可能成为一个真正统一的全国组织。\n\n戴亚对此并不陌生。社会党同样反感地方机构以自治为名拒绝执行中央决策，也乐于看到总工会摆脱松散联盟的旧貌。倘若各产业联合会能够服从统一规划，地方支部能够接受明确的行政层级，总工会庞大的生产与流通网络便可以成为整个联邦经济的核心。\n\n然而，相似的目标并不足以立即促成合作。戴亚并不确定儒奥是否真有能力改造总工会，更不愿仅仅为了巩固温和派的地位，便替他们承担与激进派公开决裂的代价。社会党内部也有人认为，总工会终究是一个难以约束的独立组织；与其帮助儒奥建立更强大的中央，不如直接扩大公共安全委员会对经济事务的控制。\n\n儒奥需要承担的代价同样不小。联合工人党长期与总工会保持合作，而它与社会党之间却几乎没有任何和解的余地。一旦温和派接受戴亚的支持，联合工人党必然会怀疑总工会正在抛弃原有盟友，转而成为PSF改造联邦的工具。总工会激进派也会把这次会面视为公开宣战，内部妥协的余地将所剩无几。\n\n因此，儒奥必须拿出足以打动戴亚的条件。或许双方共同对抗联邦主义者，本身就是一份足够丰厚的回报；或许应当支持扩大公共安全委员会的职权，使PSF能够通过国家机关参与经济管理；又或者，总工会可以进一步采用泰勒制，以更明确的分工、考核与指挥体系证明自己确实准备告别旧日的松散管理。\n\n新朋友已经坐在桌子的另一边。现在轮到儒奥说明，这段友谊究竟能为他带来什么。"
  fcf_economy_event.105.a:0 "合作就是最大的奖励。"
  fcf_economy_event.105.b:0 "公共安全委员会的职权应当被扩大。"
  fcf_economy_event.105.c:0 "管理模式应当向泰勒制改革。"

  fcf_economy_event.106.title:0 "社会主义新篇章"
  fcf_economy_event.106.desc:0 "戴亚最终接受了儒奥的提议。几天后，两人的代表重新坐到谈判桌前，就共同支持总工会改革达成了初步约定。社会党将公开肯定温和派强化中央协调、统一管理制度的努力，而儒奥则承诺，总工会不会再以支部自治为由拒绝联邦层面的经济整合。\n\n促成这项合作的并不只是双方对“联邦主义者”的共同敌意。过去几个月里接连推行的改革已经证明，儒奥至少能够将自己的主张变成现实。专业人员正在进入各级机构，各地支部开始采用统一标准，中央也逐渐掌握了调拨资源和监督管理的手段。总工会仍远非一架服从单一意志的机器，却已经不再是那个只能依靠临时协商维持运转的松散联盟。\n\n这正是戴亚所需要的保证。他无意替一个虚弱的派系赢得内部斗争，也不愿把PSF的声望押在几句空洞的集权口号上。如今，儒奥已经拥有足以约束地方的组织基础；只要再获得外部政治支持，温和派便可能彻底压倒激进派，把总工会改造成联邦经济中稳定而有效的支柱。\n\n消息公布后，双方都把这次接近描述为社会主义力量之间的重新联合。温和派报刊宣称，工会组织与政治权力终于能够摆脱旧日猜忌，共同推进经济建设；社会党则把它视为专业管理和统一意志战胜地方主义的证明。\n\n但并非所有人都愿意翻开这个“新篇章”。总工会激进派已经开始准备反击，联合工人党也不会坐视自己的长期合作伙伴转向戴亚。对他们而言，这不是社会主义力量的联合，而是儒奥借助社会党的力量改变总工会的性质。\n\n这些争论暂时无法阻止协议生效。儒奥得到了足以打破内部均势的盟友，戴亚则第一次在总工会庞大的组织网络中找到了可靠的合作者。两股原本彼此独立的力量，如今决定朝着同一个方向前进。"
  fcf_economy_event.106.a:0 "未来将至。"

  fcf_economy_event.107.title:0 "缺乏激情"
  fcf_economy_event.107.desc:0 "戴亚最终拒绝了儒奥的提议。他承认双方对总工会内部“联邦主义者”的看法颇为相似，也赞同统一管理标准、强化中央协调的改革方向，但相似的主张并不足以构成合作。PSF需要的不是一位愿意谈论集中化的朋友，而是一位真正有能力实现集中化的盟友。\n\n在随后送来的答复中，戴亚毫不客气地列举了自己的疑虑。总工会中央虽然扩大了专业人员队伍，也开始尝试统一各地的管理制度，却仍然无法保证地方支部服从决定。许多改革经过会员大会的反复讨论后已被改得面目全非；一些支部只接受对自己有利的部分，另一些则在中央人员离开以后继续沿用旧办法。儒奥能够发出指示，却未必能够让指示得到执行。\n\n这使戴亚怀疑，所谓共同对抗“联邦主义者”，最终只会变成PSF替温和派处理总工会内部的麻烦。儒奥希望借助外部政治支持压倒激进派，却没有证明自己能够在胜利后约束各地支部。倘若社会党此时公开支持他，便要承担破坏总工会内部团结、激怒联合工人党和工会左翼的全部代价，却未必能够换来一个真正服从统一规划的总工会。\n\n更令戴亚失望的，是儒奥仍然把许多根本问题视为可以调和的分歧。他既想削弱地方自治，又不愿彻底否定支部自行决定事务的权力；既希望专业管理者拥有稳定地位，又不敢公开限制会员大会对他们的撤换。每当改革遭到强烈抵制，温和派便重新谈起团结、传统和渐进改变。在戴亚看来，这不是谨慎，而是缺少把意志贯彻到底的激情。\n\n社会党的代表因此终止了进一步磋商。他们没有公开攻击儒奥，也没有否认未来合作的可能，只是表示总工会必须先证明自己能够成为一个统一的组织。等中央真正掌握地方，命令不再需要逐一讨价还价，温和派也不再因为几封抗议信便停下脚步，双方或许才有重新坐到一起的必要。\n\n儒奥原本希望以共同目标换取一位新朋友，得到的却是一份对自身软弱的判决。戴亚并不反对他想做的事情，只是不相信他有决心把事情做完。"
  fcf_economy_event.107.a:0 "真令人失望。"

  fcf_economy_event.108.title:0 "阶段性改革成果"
  fcf_economy_event.108.desc:0 "总工会改革委员会终于完成了第一份阶段报告。几个月来，围绕组织结构与管理方式展开的争论几乎从未停歇，各项获得通过的改革也已陆续在不同地区付诸实施。它们未必解决了最初提出的所有问题，却已经使总工会发生了足够明显的变化。\n\n改革的支持者可以从报告中找到不少值得庆祝的成果。部分长期积压的事务得到处理，一些过去无人愿意触碰的旧例也被打破。那些曾被视作总工会固有缺陷的问题，如今至少不再是只能私下抱怨、无法公开讨论的禁区。\n\n但报告同样承认，临时决议能够改变一项制度，却难以重新规定整个组织的运行方式。每当改革触及支部、产业组织与中央机构之间的关系，人们便不得不重新争论各自拥有何种权利，又应承担何种义务。同一项决定在不同地方可能得到截然不同的解释，改革委员会也只能逐次协调，而无法援引一套得到普遍承认的规则。\n\n几个月来的实践已经表明，继续依靠个别决议推动改革，只会让新制度与旧惯例层层叠加。改革走得越远，需要临时解释的地方便越多；若不及时整理这些成果，已经通过的措施可能彼此冲突，也可能在下一次内部争论中被轻易推翻。\n\n因此，改革委员会建议结束目前逐项试行的阶段，将已经作出的决定加以整理，并以此为基础起草一部新的总工会法案。至于法案最终将赋予中央多少权力、为地方保留多少自主空间，又将如何规定管理、监督与组织纪律，仍需在正式审议中决定。阶段报告能够提供经验，却不能替即将到来的政治斗争预先写下答案。\n\n最初的改革只是为了处理几个迫在眉睫的问题，如今，这些问题已经把总工会带到了一次全面改组的门前。过去几个月所作出的选择不会就此消失；它们将决定这部法案从何处出发，也将决定新的总工会究竟会成为什么样的组织。"
  fcf_economy_event.108.a:0 "总工会将焕然一新。"
  CGT_stage_reform_results:0 "对于总工会的改革已取得阶段性成果"

