##事件
  fcf_economy_events.1.title:0 ""
  fcf_economy_events.1.desc:0 ""
  fcf_economy_events.1.a:0 ""

  fcf_economy_events.2.title:0 "诉CGT案周年游行"
  fcf_economy_events.2.desc:0 "一切最初只是巴黎近郊一家机械厂里的工伤事故。一次加班期间，吕西安·马丁所操作的冲床突然失控，夺去了他的双手。厂方坚称机器并无故障，事故完全源于马丁操作不当，只愿支付一笔勉强足以应付医疗费用的补偿。工头雅克也站在厂主一边；在他看来，马丁既然始终不肯加入总工会，便没有资格在出事以后寻求工会的帮助。\n\n没有人亲眼目睹事故发生的一刻，机器的维护记录也无法证明马丁的说法。地方劳动仲裁最终采信了厂方的辩解，认定他应当为自己的残疾负责。律师亨利·托雷斯随后无偿接下此案，并以案件涉及非总工会工人的基本劳动保障为由，取得特别上诉许可，将马丁的申诉直接递交联邦最高法院。然而，公众的同情无法代替法庭所需要的证据，最高法院仍然维持了原有裁决。\n\n连续两次败诉并未平息争议，反而让这场原本寻常的工伤纠纷迅速扩散。无政府主义者开始怀疑，马丁的不幸并非一次孤立的意外，几名调查者遂绕过厂方与地方机构，私下追查事故设备的来源及厂主在当地的关系。就在调查逐渐接近机械厂背后的秘密时，两名调查者却在一场旅店爆炸中丧生。\n\n爆炸案顷刻间引燃了此前积压的一切不满。街头要求查明死者遇害的真相，报刊追问地方当局究竟在掩盖什么，总联邦委员会内部也开始追究政府长期失察的责任。蒙穆索未能承受住这场政治风暴，最终被迫下台；杜穆兰正是在爆炸案引发的危机中接掌政府，也继承了这桩再也无法搁置的旧案。\n\n新政府随即下令展开正式调查，试图以一份完整的官方报告还原事件经过。然而，无政府主义联盟不愿把揭露真相的主动权交给政府。他们抢在调查结束之前公布了手中掌握的材料，迫使那些原本还能被斥为传闻的线索暴露在公众面前。直到此时，人们才知道那台冲床确实早已年久失修；厂主还在别处经营着数家未经登记的黑工厂，并凭借自己在地方政府和总工会中的私人关系屡次逃过检查。\n\n涉案人员随后受到惩处，黑工厂遭到查封，雅克与厂主维持多年的勾连也被公之于众。然而，这些迟来的真相并没有自动推翻马丁身上的旧裁决。托雷斯依据新证据提起诉讼，将厂主、地方政府与总工会一并列为被告，试图证明马丁所遭受的不公并非只来自某个工头或某个厂主，而是来自一张足以干扰监督、排斥非会员的关系网。法庭最终却认为，厂主对私人关系的利用不足以证明总工会作为一个整体应当承担法律责任；托雷斯对案件性质的扩张，也超出了现有证据所能支持的范围。马丁又一次败诉了。\n\n于是，这桩案件留下了一个格外荒诞的结局：黑工厂确实存在，机器确实疏于维护，厂主也确实曾借助总工会中的熟人逃避监督，可那个因此失去双手的人，仍被旧裁决认定为事故的责任者。“诉总工会案”由此成了报刊赋予整场风波的名字。支持总工会的人坚持认为，不能因为少数人的营私舞弊便让整个工人组织坐上被告席；反对者则追问，如果总工会的名义能够成为地方关系户的护身符，如果非会员在工厂里受到排斥以后仍无处讨回公道，那么组织是否真的可以把这一切都归结为私人行为？\n\n最后一次败诉两周年之际，人群再次走上巴黎街头。有人要求撤销马丁身上的旧裁决，有人要求彻查依附于总工会的地方关系网，也有人只是在胸前挂起一双空荡荡的工作手套，沉默地跟随队伍前进。当游行抵达总联邦委员会门前时，新政府所要回答的早已不再只是一桩工伤案：革命许诺给工人的平等，是否同样属于那些没有加入总工会的人？"
  fcf_economy_events.2.a:0 "我们终会为历史负责。"
  FCF_economy_CGT_reform_protest:0 "“诉CGT案”游行"
  FCF_economy_CGT_reform_protest_desc:0 "马丁案留下的错误判决及其政治余波一直延续到了今天。政府内部仍在讨论总工会改革——或者说相互攻击，但人民已经没有耐心再等下去。上一届政府未能彻底解决问题，新政府既已产生，便必须对总工会的经济地位、会员特权以及非会员劳动者的基本权利作出回答。一边是要求打破总工会事实性优势的反对者，一边是依靠其产业协作、互助和组织网络生活的大量普通工人。无论选择何种改革，如果政府继续沉默，积累的矛盾只会越来越多。"
  FCF_economy_CGT_reform_protest_tt:0 "§R我们应该尽快对总工会做出改革§!"
  FCF_economy_CGT_reform_protest_has_happened:0 "“诉CGT案”游行已经发生"

  fcf_economy_events.3.title:0 "不信任的种子"
  fcf_economy_events.3.desc:0 "“诉总工会案”周年游行已经过去了三个月。政府承诺终将为历史负责，却始终没有说明准备怎样负责。总联邦委员会没有收到法案，公共安全委员会也没有提出调查或协商方案；就连一份足以表明立场的正式声明，也在各部门之间反复传阅后没了下文。\n\n这种不满很快越过报纸与集会，进入各公社联合体代表大会。若干联合体重新审议了本地委派的政治代表，一些原本支持政府的委员被撤回，取而代之的是明确承诺改变现状的人。他们彼此之间并无统一立场：有人要求削弱总工会的事实性特权，有人主张通过其内部机关完成整顿，也有人只是要求政府立即公开打算。\n\n当新的委派名单送抵巴黎时，执政联盟才真正意识到，游行并未随着人群散去而结束。总联邦委员会里的几张座椅已经换了主人，更多公社联合体也准备讨论同样的问题。政府没有对总工会作出选择，于是地方选民开始改派那些愿意替他们作出选择的人。"
  fcf_economy_events.3.a:0 "执政灾难！"

  fcf_economy_events.4.title:0 "自由工会"
  fcf_economy_events.4.desc:0 "总工会从来不是联邦境内唯一的工人组织。革命之后，仍有相当一部分工人因为信仰、地方传统或对集中化的不满，选择留在总工会体系之外。天主教工会主要活跃于北部工业区和宗教传统深厚的城镇，在劳工权利之外也经营互助、救济与家庭服务；自治工会联合会则由一批拒绝接受全国统一领导的地方工会组成，它们彼此立场不尽相同，却都强调基层组织应当自行决定本地事务。除此之外，各地还散布着规模更小的独立工会，其中一些甚至只存在于一座工厂或一个行业之中。人们习惯将这些组织统称为“自由工会”——所谓自由，首先只是指它们不隶属于总工会。\n\n这些工会在法律上并未受到禁止，却很难与总工会真正平等竞争。总工会拥有遍布全国的产业组织、活动场所和专业人员，还能为会员提供行业保障与跨地区援助；自由工会则时常连维持一间办公室、印制一份刊物或派出一名常驻代表都捉襟见肘。即使它们在某座工厂赢得了部分工人的支持，也很难独自承担此后与产业联合会协调生产、组织互助和维护会员权益的全部成本。形式上的自由，并没有带来力量上的平等。\n\n如果政府希望打破总工会对工人组织生活的支配，仅仅宣布各工会地位平等远远不够。我们必须向总工会以外的组织提供场所、经费与组织便利，使它们能够推举自己的工厂委员会候选人，建立独立的互助体系，并让那些不愿加入总工会的工人拥有一个真正可行的去处。只要自由工会能够站稳脚跟，总工会便不得不重新争取工人的信任，而不能继续把自己的领导地位视为革命天然赋予的权利。\n\n然而，资源究竟交给谁，绝不是一个无关政治的技术问题。天主教工会与共和青年联盟关系密切，自治工会联合会背后则不乏无政府主义联盟的支持者。若由其中一党执掌政府，再把公共资源集中投入与自己亲近的工会，反对者很容易把整项政策描绘成一次借国家之手扩张党派势力的行动。我们也可以同时扶持所有自由工会，以公开统一的标准分配援助；这样耗费更大，也会对总工会造成更直接的冲击，却至少不必回答政府为何唯独选中了自己的朋友。"
  fcf_economy_events.4.a:0 "支持天主教工会。"
  fcf_economy_events.4.b:0 "支持自治工会联合会。"
  fcf_economy_events.4.c:0 "支持所有自由工会。"

  fcf_economy_events.5.title:0 "自私自利"
  fcf_economy_events.5.desc:0 "对自由工会的扶持才推行了一个多月，最初的赞许便被另一种声音压了过去。反对派报刊列出了首批获得经费、活动场所与组织便利的工会名单，又逐一标明它们同执政党之间的联系。统计结果并不难看懂：政府没有把资源平均交给所有总工会之外的组织，而是集中扶持了与自身关系最密切的那一套工会体系。\n\n政府当然可以为此辩解。总工会的支配地位并不会因为一句“各工会一律平等”便自行消失，有限的资源也不可能在所有组织之间均匀摊薄。若要尽快建立一个足以同总工会竞争的替代力量，就必须选择组织基础较好、能够真正承接这些资源的工会。执政党与它们拥有相近的政治立场，也不能证明整项政策只是为了党派私利。\n\n然而，工会在联邦政治中从来不只是维护工资与福利的互助组织。获得政府提供的办公室、刊物和专职人员，便意味着它们可以在更多工厂推举候选人，协助竞选工厂委员会，并争取让与自身关系密切的人担任委员会主席。一个工会势力的扩张，最终会转化为工厂、区委员会乃至总联邦委员会中新的政治席位。反对者因而质问：当执政党动用公共资源壮大自己的工会盟友时，这同利用政府权力巩固自身地位究竟有什么区别？\n\n质疑很快从报纸进入了总联邦委员会。总工会的代表要求暂停拨款，未获扶持的自由工会也开始抗议所谓的“选择性平等”，就连执政阵营内部也有人担心，这项政策正在把反对总工会垄断的改革，变成另一场由政府亲手制造的垄断。我们可以坚持所有指控都是反对派的恶意拼凑，继续执行原定政策；也可以撤回已经作出的支持，以承认这项选择从一开始便很难同党派利益划清界限。"
  fcf_economy_events.5.a:0 "完全是子虚乌有！"
  fcf_economy_events.5.b:0 "撤回我们的支持。"

  fcf_economy_events.6.title:0 "沉冤得雪"
  fcf_economy_events.6.desc:0 "消息传来时，吕西安·马丁正在参加一场由工农共产党地方支部举办的工人聚会。这样的场合，他这两年已经出席过许多次：有时是在挤满听众的会堂里坐上主席台，有时是在罢工工人的募捐会上讲述自己的遭遇，有时只需在《人道报》记者面前露面，同几名地方代表握手。主办者通常会替他承担路费，再支付一笔不算丰厚、却足以补贴家用的出席费用。马丁并不总能分清那些会议究竟在争论什么，但人们愿意听他说话，也不再把他当成一个只能等待救济的残废，这已经足以让他感到满意。\n\n宣读消息的人等到掌声停下，才把文件递到马丁妻子手中。经过重新审查，原有工伤裁决已经正式撤销。那台冲床确因年久失修而失控，厂方对事故负有全部责任；马丁不再被认定为一个因操作疏忽而失去双手的工人，赔偿也将依照新的责任认定重新核定。几年以来，黑工厂早已遭到查封，厂主及其同谋也已经获罪，唯独马丁本人仍被留在那份错误的卷宗里。如今，最后这笔未清的旧账终于有了结果。\n\n然而，裁决墨迹未干，围绕它的争夺便已经开始。工农共产党宣称，这是他们持续声援马丁、拒绝让案件沉寂的成果；无政府主义联盟提醒公众，如果没有最初的调查、那场夺去两人生命的爆炸以及街头上的坚持，政府根本不会重新打开卷宗。反对总工会的人把新裁决视为CGT事实霸权遭到击破的证明，总工会中的改革派则强调，纠正一项错误恰恰说明工人组织拥有清理自身积弊的能力。就连曾经竭力同案件划清界限的人，如今也希望马丁能够出席一场“和解集会”。\n\n马丁的日程很快又被秘书、记者和各派代表塞满。有人请他站在总联邦委员会门前接受献花，有人希望他重走当年游行经过的街道，还有人已经替他准备好了演讲稿，只等他在结尾宣布正义属于某个政党、某个工会或者某一条改革路线。他对其中大多数邀请并不反感。参加活动可以挣得一些钱，也能见到那些在他最孤立时曾经帮助过他的人；何况在经历多年无人相信之后，被人簇拥总比被人遗忘好得多。\n\n他的妻子却没有表现出同样的喜悦。她把新的裁决仔细收进抽屉，又把送来的几封邀请推到一旁。在她看来，那些人过去需要一个蒙受不公的马丁，如今又需要一个证明自己正确的马丁；裁决改变了丈夫在他们口中的意义，却没有让他们重新把他当作一个普通人。\n\n当晚，记者再次询问马丁是否准备继续投身反对总工会的运动。他想了很久，最后只是让妻子替自己回答：他很高兴那份卷宗终于承认机器出了问题，也愿意向曾经帮助过自己的人道谢。至于这场胜利究竟属于谁，那是仍有双手可以挥舞旗帜的人才关心的事情。"
  fcf_economy_events.6.a:0 "卷宗终于承认了错误。"

  fcf_economy_events.7.title:0 "总工会调查档案 A"
  fcf_economy_events.7.desc:0 "调查组送来的第一批档案并不惊人。问题出在圣艾蒂安金属工会参与经营的一处工人休养所。三年前，该工会以扩建宿舍、修缮浴室和购置医疗器材为由，连续从会员互助账户和产业设施基金中申请了数笔经费。工程确实完工了，休养所也一直正常接待缴费会员及其家属；如果只看现场，甚至很难说这笔钱遭到了浪费。\n\n真正引起调查员注意的是工程账目。负责修缮的建筑合作社并非当地报价最低的一家，施工期间却连续四次追加预算，最终费用几乎比最初估价高出一倍。合作社的会计曾担任该工会的财务秘书，负责审批追加预算的两名委员退休后又先后进入合作社领取报酬。\n\n若将现有材料公布出去，我们至多能够证明一个基层工会纵容了任人唯亲和价格虚高。可档案里还有一个尚未得到解释的细节：每次追加预算都附有来自巴黎的补充拨款，而且使用了同一个极少出现的会计科目。也许那只是联盟财务人员为填补地方缺口所作的权宜处理；也许这间不起眼的休养所，只是某种更普遍做法留下的一角。"
  fcf_economy_events.7.a:0 "继续深挖。"
  fcf_economy_events.7.b:0 "我们应该换一个方向。"

  fcf_economy_events.8.title:0 "总工会调查档案 A-2"
  fcf_economy_events.8.desc:0 "沿着那几张来自巴黎的拨款凭证追查下去，调查组很快遇到了第一个麻烦：联盟中央基金的正式账簿里根本没有档案所写的会计科目。圣艾蒂安方面声称拨款来自“工人设施临时补助”，巴黎方面却表示这类补助从未单独列入年度预算。若只看双方保存的账簿，这笔钱仿佛既由中央拨出，又从未经过中央。\n\n调查员最终在一批准备销毁的往来函件中找到了答案。所谓“临时补助”并不是正式预算，而是一套违反账户分立原则的账外周转办法。少数产业基金和中央共同储备中的款项先被转入合作社账户；当某个组织需要一笔不便列入正常账目的经费时，经手人便要求合作社以承包工程、采购器材或垫付货款的名义将钱转出。会员互助金、产业协作资金和行政经费本应分别核算，却在这套秘密渠道里被有意混用。\n\n这套办法起初或许只是为了绕过迟缓的审批程序，却逐渐脱离了代表机关和缴费会员的监督。哪些组织能够取得补助、哪家合作社可以承接工程，以及追加多少预算，都由少数掌握批准编号的人私下决定。\n\n调查组仍然无法证明有人直接侵吞了款项，却已经证明圣艾蒂安的价格虚高并非基层组织自行其是：巴黎的财务人员不仅知道这些账目如何运作，还维持着一条违反现行财务制度的账外资金通道。"
  fcf_economy_events.8.a:0 "把这些编号收进案卷。"
  fcf_economy_events.8.b:0 "这还不够，还有什么？"

  fcf_economy_events.9.title:0 "总工会调查档案 B"
  fcf_economy_events.9.desc:0 "第二批引起注意的材料来自鲁贝纺织产业联合会。去年春季，当地数座纺织厂同时改选工厂委员会。总工会为自己的候选人印制传单、安排演说并提供组织人员，这些活动本身并不违反规定；问题在于，其中三座工厂最终选出了独立候选人，而它们此后在产业协作网络中的待遇随即发生了变化。\n\n改选结束不到两周，三座工厂在联合采购中的进口染料供应次序便相继下降，原定由产业设备基金承担的维修也被推迟。产业联合会还建议合作社将数笔订单交给邻近工厂，理由是新任工厂委员会“尚未证明能够履行既有协作协议”。其中一座工厂后来重新选出总工会支持的主席，并重新确认原有协议，染料、订单和维修经费随即恢复。\n\n产业联合会辩称，参与协作的工厂既然要求重新谈判交换比例、拒绝部分技术标准，便不能继续享有原有的内部保证。这种解释在形式上成立：产业联合会并未以公共权力没收任何配额，也不能命令工厂委员会接受合同。\n\n然而，调查员找到的内部分类表并未按照产量、成本或履约情况排列工厂，而是将它们标作“可靠”“动摇”与“失去联系”。三座工厂都在投票结果公布当天被移入最后一栏。表格边缘还有一句没有署名的批注：“物质上的教训，会让同志们在下次投票时更加清醒。”\n\n如果产业联合会利用自愿协作网络中的供应、担保和订单，迫使全厂选出的委员会接受总工会候选人，那么合同形式上的自愿便已经被组织优势掏空。"
  fcf_economy_events.9.a:0 "继续深挖。"
  fcf_economy_events.9.b:0 "我们应该换一个方向"

  fcf_economy_events.10.title:0 "总工会调查档案 B-4"
  fcf_economy_events.10.desc:0 "鲁贝办事处使用的分类表并非孤例。调查组在里尔、特鲁瓦和鲁昂的纺织业档案中找到了几乎相同的表格。各地名称略有差异，但分类发生变化的时间都紧跟在工厂委员会改选之后，而非季度产量核对或协作合同复审之后。\n\n一些产量稳定、从未拖欠协作款项的工厂，仅仅因为选出了独立派或自由工会支持的委员会，便被列为“消极协调者”；另一些长期无法完成生产建议的工厂，只要委员会主席仍由总工会会员担任，便能保留产业网络内的原料担保和订单优先权。\n\n更直接的证据来自全国纺织产业联合会组织处的一份通报。通报建议地方办事处在资源紧张时优先保障“组织关系稳定”的工厂，并把委员会主席的工会归属、反对总工会候选人的得票比例以及厂内是否存在自治主义倾向列入审查样表。生产和履约数据反而只占最后几栏。\n\n产业联合会仍可辩称，它只能把内部资源和信用担保交给愿意合作的签约单位。然而，当工厂是否继续获得协作网络的便利取决于全厂选举产生了什么人时，产业协调便已经成了干预工厂自治的工具。"
  fcf_economy_events.10.a:0 "这已经不是地方上的偶然。"
  fcf_economy_events.10.b:0 "这还不够，还有什么？"

  fcf_economy_events.11.title:0 "总工会调查档案 C"
  fcf_economy_events.11.desc:0 "第三份档案起初只是一只没有列入移交清单的木柜。它被放在全国金属产业联合会组织处最里面的档案室中，抽屉里整齐排列着数千张工人卡片。卡片记录的不只是会员缴费、工种与工作经历，还包括每个人参加过哪些政治集会、在工厂委员会选举中支持谁、是否经常出入教堂，以及同哪些自由工会成员来往。\n\n产业联合会辩称，这些只是用于会员联络和工会组织工作的内部资料。然而，部分姓名旁盖有“不宜推荐”或“不得接触关键岗位”的印章。过去两年里，至少有数十名工人在申请进入待遇更好的社会化工厂、参加技术培训或担任仓库管理员时遭到拒绝；正式作出决定的虽然是各厂人员委员会，遭拒者的姓名却几乎都能在木柜中找到。\n\n转阅记录表明，铁路、化工和港口产业组织曾多次核对这些人的情况。工厂中的总工会组织员和部分人事委员，也会在正式审议前收到有关申请者“组织履历”的秘密意见。\n\n总工会并不能依法决定谁能取得一份工作，却可能依靠自己的组织网络影响本应由工厂委员会独立作出的人事决定。要证明这种影响究竟造成了多少拒绝，调查组仍须把秘密卡片同各厂人员委员会的档案逐一比对。"
  fcf_economy_events.11.a:0 "继续深挖。"
  fcf_economy_events.11.b:0 "我们应该换一个方向。"

  fcf_economy_events.12.title:0 "总工会调查档案 C-3"
  fcf_economy_events.12.desc:0 "正式的人事档案几乎无懈可击。工人在申请培训、调动或晋升时遭到拒绝，得到的理由总是工龄不足、技术不合格或岗位缩减；没有哪份决定承认自己曾根据工会归属筛选申请者。\n\n调查组随后在正式卷宗之外找到了一批“组织征询函”。部分工厂人员委员会在审查重要岗位时，会以核实工作经历为名向产业联合会询问申请者的“组织履历”。回函通常只有“可以信任”“建议继续观察”或“不宜调动”等寥寥数语，却与秘密卡片上的标记一一对应。\n\n几名已经离任的人事委员承认，产业联合会从未正式命令他们排斥异见者，却很少有人愿意忽视这些意见。产业联合会不必亲自决定谁能获得工作，只需留下几句含糊的评语，工厂人员委员会自然会为拒绝找到一个合乎程序的理由。\n\n现有材料已经能够证明，工会内部档案通过非正式征询渗入了本应独立的人事程序，并形成一套当事人无法知晓、也无法申诉的政治审查。若继续追查全部个案，政府却必须重新搜集有关普通工人的信仰、家庭和私人交往，复制自己试图揭露的监视制度。"
  fcf_economy_events.12.a:0 "现有证据已经足够。"
  fcf_economy_events.12.b:0 "我们需要知道全部真相。"
  fcf_economy_events.12.c:0 "这还不够，还有什么？"

  fcf_economy_events.13.title:0 "调查被迫中止"
  fcf_economy_events.13.desc:0 "调查组发往各公社委员会的一份协查通知，最终落到了一家巴黎报社手中。通知要求地方机关核对数百名工人的家庭关系、居住变动和政治活动，并附有一张详细的调查表：是否参加宗教仪式，是否与反对派成员来往，家中是否寄住外地工人，甚至邻居如何评价其日常言行。报纸没有公布名单，却将调查表完整地印在了头版。\n\n消息传开后，舆论几乎立即改变了方向。几天前，人们还在追问总工会凭什么秘密记录工人的生活；如今，他们发现政府为了证明这些档案造成了何种伤害，又在各公社之间建立起一套内容近似的协查网络。调查组强调，所有资料都只用于还原受害者经历，不会参与招工和政治审查，但这番解释并没有平息不满。对那些同时出现在两套档案里的人而言，他们的家庭、信仰和私人交往已经第二次成为旁人翻阅的材料。\n\n总工会抓住机会发动反击。它承认部分产业联合会在档案管理上“严重失当”，却反过来指责政府借调查之名搜集公民资料，企图把工会会员乃至普通居民纳入政治监视。原本准备出面作证的几名前人事委员撤回了证词，各地公社也开始拒绝继续提供登记材料。总联邦委员会中的反对派随即提出质询，要求公共安全委员会说明调查范围，并公布所有经手这些资料的部门。\n\n我们当然可以辩称，两者的目的并不相同：总工会用秘密记录决定工人的前途，调查组则试图揭露这种做法。但调查已经无法在不造成更大政治代价的情况下继续。公共安全委员会只能宣布中止协查，封存新近取得的私人资料，并向受到牵连的公民公开道歉。调查报告 C 已经揭开的事实不会因此消失，只是眼下再也没有多少人愿意听政府谈论它了。"
  fcf_economy_events.13.a:0 "必要之恶……"

  fcf_economy_events.14.title:0 "总工会调查档案 D"
  fcf_economy_events.14.desc:0 "第四份档案来自总工会近三届全国代表大会。调查组发现，实际到场人数与会议记录中的表决票数始终相差甚远。许多不能派员赴会的基层工会会将表决权委托给其他代表，因此一名代表可能同时持有多个组织的特别授权。\n\n问题并不在委托本身，而在授权核验程序。有些文件直到大会开幕后才补填日期，有些沿用失效印章，另一些则来自已经停止缴费或停止活动的基层工会。几名代表甚至在不知情的情况下被登记为受托人，其名下票数由秘书处工作人员代为处理。\n\n按照章程，授权有效性本应由独立的代表资格审查机关决定，联盟局和大会秘书处都无权自行增减代表票数。然而，调查组发现，部分秘书处人员、地方组织员和资格审查委员长期以非正式方式相互配合：支持既定提案的迟交授权往往得到补正，反对者的文件却更容易因细微瑕疵遭到拒绝。\n\n现有材料已经足以质疑几次关键表决的公正性，却还不能证明联盟局正式命令资格审查机关操纵结果。我们可以立即公布档案，也可以继续追查那些来源可疑的授权书。"
  fcf_economy_events.14.a:0 "继续深挖。"
  fcf_economy_events.14.b:0 "先公布眼前的材料。"

  fcf_economy_events.15.title:0 "总工会调查档案 D-7"
  fcf_economy_events.15.desc:0 "突破来自一名曾在上届代表大会中参与核验授权书的独立代表。大会结束后，他察觉自己名下被记入了七个基层工会的委托票，其中四个从未与他取得联系。向资格审查人员提出质疑后，他得到的答复只是“地方同志不熟悉手续，由秘书处统一协助”。\n\n沿着他保存的编号，调查组找到了一份大会召开前编制的“代表力量估算表”。表格逐一列出尚未确定受托人的基层工会，并预先注明应把委托交给哪名代表。部分安排甚至早于基层会议作出授权；在会员决定由谁代表自己以前，他们的票数便已经被计入某一多数。\n\n通信进一步证明，少数大会秘书、组织员和资格审查委员实行了不同的补正标准。态度可靠的基层组织凭一封电报便可补办授权，可能支持反对派的组织却被要求补齐会议记录、会员签名和新式印章。\n\n这并不意味着CGT全国机关能够依法任意制造代表。恰恰相反，这套多数只能依靠绕过正式机关、滥用程序例外的秘密合作维持。受到质疑的不再只是某几项提案，而是近三届大会的代表资格核验及由此产生的决议。"
  fcf_economy_events.15.a:0 "现在必须公开真相。"

  fcf_economy_events.16.title:0 "总工会调查档案 D-5"
  fcf_economy_events.16.desc:0 "调查组沿着来源可疑的授权书逐一追查，却始终没有找到能够证明联盟局下令操纵表决的文件。部分异常也得到了并不光彩、但尚可成立的解释：有些授权确实通过电报确认，一些受托人也曾笼统答应替邻近组织照看票数。\n\n调查能够证明的，是大会秘书处与代表资格审查程序长期依靠模糊惯例运行，并在实践中偏袒熟悉全国机关的组织；它却无法证明某个中央机关直接伪造了基层授权。\n\n全国联盟委员会随后要求公布授权登记办法，明确所有委托必须经过基层会员会议表决、提前登记，并由代表资格审查委员会独立核验。争议由“中央操纵代表大会”退回到了“总工会程序严重失范”。\n\n最初发现的异常并未消失，只是我们已经错过了材料最具冲击力的时刻。继续追查，只会在同一堆印章、签名与会议记录之间反复兜圈。"
  fcf_economy_events.16.a:0 "到此为止吧。"

  fcf_economy_events.17.title:0 "合法受贿"
  fcf_economy_events.17.desc:0 "调查组的新目标，是全国机械产业联合会的一名执行书记。此人在总工会中任职近二十年，负责审查各地工厂提交的设备采购方案，并参与分配产业联合会的技术改造资金。过去几个月里，他经手批准了数笔数额可观的机床订单，其中大半都交给了里昂的一家工程合作社。\n\n订单本身没有明显问题。那家合作社报价并非最低，却承诺统一零件规格、培训工厂技师，并以劳动券接受部分结算；联合会的技术委员会也认定，这些条件足以抵消价格上的差额。所有决定都经过集体表决，书记本人没有单独决定中标者的权力。若只看会议记录，这不过是一次再正常不过的行业采购。\n\n然而，合作社随后向他支付了一笔相当于数月工资的“编纂酬金”。名义上，这笔钱用于购买他多年前写成的一部机床维护手册，并允许合作社将其印发给接受培训的工人。合同经过登记，版税也已申报；产业联合会的章程并不禁止干部凭借专业著作取得报酬。从法律上说，这笔钱来路清楚，甚至称得上比大多数私人收入更加透明。\n\n真正引起怀疑的是时间。合作社早在数年前便使用过这部手册，却一直没有提出购买版权；直到第一批订单获得批准，双方才突然签订合同。书记申报的酬金数额，也远高于近年来同类技术读物的通常稿费。更巧的是，合同并未规定最低印数，合作社即使只印几百册，也必须一次付清全部款项。\n\n我们已经查阅了他的申报材料和相关会议记录，却没有发现伪造账目、私下通信或干预表决的证据。他可以声称，合作社只是因培训规模扩大才决定正式购买手册，而稿酬高低属于双方自愿商定。只要程序合法，政府便不能因为一笔收入看起来“不合时宜”，就把它称作贿赂。\n\n但合法的合同同样可以替不合法的交易披上一件体面的外衣。若继续监视他的往来、追查合作社内部账目，或许迟早能找到那笔稿酬与设备订单之间真正的联系。我们也可以承认现有材料不足以立案，把调查力量转向一个更容易突破的目标。"
  fcf_economy_events.17.a:0 "他迟早露出狐狸尾巴。"
  fcf_economy_events.17.b:0 "换个目标吧。"

  fcf_economy_events.18.title:0 "冤枉好人"
  fcf_economy_events.18.desc:0 "调查组没有等到那名执行书记“露出狐狸尾巴”。连续数日的监视只记录下他往返于联合会办公室、工厂食堂和住所之间，偶尔在下班后探望几名年老的产业工人。对合作社账目的审查也没有发现秘密回款：那笔编纂酬金由出版与培训经费支出，完整列入了合作社的季度报告，没有再流向任何与设备采购有关的人。\n\n真正的解释藏在一叠更早的往来信件中。那部机床维护手册多年来一直被各地工厂自行翻印，里昂合作社承接统一培训后，才发现其中大量图纸仍属于作者本人。合作社曾请书记无偿转让使用权，他却只要求它停止粗劣翻印，以免错误图示伤及学徒。后来，合作社的工人委员会坚持补付过去数年的使用费用，并一次买断修订本、插图和后续培训材料，才使合同金额远高于普通稿酬。\n\n至于那几笔机床订单，技术委员会保存的原始评议表证明，书记不仅没有替合作社说话，反而因为对方报价偏高，连续两次要求压低采购数量。最终使合作社胜出的统一规格与培训方案，也是几家工厂的技师代表提出的。在决定交付对象的最后一次表决中，他因双方正在商议手册版权，主动离席回避。此前那份简略会议记录没有写下这些细节，才让时间相近的两件事显得格外可疑。\n\n更难堪的事实接踵而至。执行书记将大半稿酬交给了产业伤残工人互助基金，只留下重新绘制图纸所需的费用；他之所以没有公开此事，只是不愿把捐助变成个人声誉的装饰。过去多年里，他还经常替生活困难的工人垫付会费、寻找岗位，以至于不少人听说政府正在调查他后，主动带着收据和信件来到总工会作证。\n\n总工会没有放过这个机会。它将合同、评议表与互助基金的收款证明一并公布，并把这场调查称为“政府为了寻找罪人而制造罪证的示范”。我们没有逮捕任何人，也没有提出正式指控，但监视一名声誉良好的老工会干部、翻查他的私人往来，已经足以使整个调查工作蒙羞。原本可疑的稿酬如今成了他清白的证明，而我们的怀疑，反倒替总工会赢回了几分信誉。"
  fcf_economy_events.18.a:0 "该死。"

  fcf_economy_events.19.title:0 "委任接触"
  fcf_economy_events.19.desc:0 "我们派驻总工会的委派员原本只负责传达联邦经济政策，并列席涉及公共投资的协调会议。他无权要求总工会公开内部账目，也很少有人会在他面前谈论组织财务。正因如此，当机械、运输与建筑产业联合会提交下一季度的投资分摊表时，财务人员只把他当作一名例行签收文件的旁观者，没有特意抽走其中几张附表。\n\n表面上，那些款项都有明确用途：技术考察、跨行业协调、临时仓储以及对困难工厂的周转援助。但委派员发现，数笔来自不同行业互助金的支出，最终都汇入了同一家地区结算所。结算所随后又以“先行垫付”的名义，把钱转给几家合作社和工人互助会；这些机构取得款项后不久，又会向总工会名下的会议基金、宣传基金或干部差旅账户交纳数额相近的“自愿分摊”。\n\n单独看待其中任何一笔交易，都很难称之为贪污。产业联合会可以委托地方机构代为结算，合作社也确实有义务分担总工会的公共活动费用。然而，几组资金绕行一圈后，总会有一小部分不再出现在下一张报表中。数额通常不大，名目则不断变化：手续费、紧急预备金、组织联络费，或尚待补交收据的临时借款。没有哪个账户蒙受了足以引起警觉的损失，但同样的缺口已经持续了数年。\n\n更值得注意的是，这些款项都要经过一名颇受工人爱戴的总工会高层批准。他经常为经营困难的工厂争取援助，也乐于从自己掌握的基金中补贴罢工者家属；即使调查组公开现有材料，许多受惠者恐怕也只会认为，这不过是老同志为了绕开繁琐手续而作出的变通。可若把先前取得的档案和证词一并对照，这些零散缺口背后或许隐藏着一张远比个人受贿更庞大的关系网。\n\n委派员可以继续留意结算所的往来，并设法取得尚未归档的原始收据。但他的位置本就敏感：一旦频繁索要财务附件，总工会很快便会意识到政府已经把观察者变成了调查员。这条刚刚打开的缝隙，可能由此通向整个腐败网络，也可能在我们看清里面的人以前便重新合拢。"
  fcf_economy_events.19.a:0 "太好了，密切关注。"
  fcf_economy_events.19.b:0 "最好还是不要打草惊蛇。"
