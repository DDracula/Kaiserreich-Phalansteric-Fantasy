  fcf_economy_event.41.desc:0 "圣艾蒂安核心零部件供应商内部发生管理争端，导致整个地区的军事装备生产线陷入了短暂停滞。"
  fcf_economy_event.41.a:0 "坏了。"

  fcf_economy_event.42.title:0 "技术设备遭劫掠案"
  fcf_economy_event.42.desc:0 "萨伏伊边境武装团伙洗劫了当地一批进口的精密机床，导致区域现代化进程受阻，政府威望受挫。"
  fcf_economy_event.42.a:0 "坏了。"

  fcf_economy_event.43.title:0 "工业污染物泄漏"
  fcf_economy_event.43.desc:0 "里昂发生的工业环境事故迫使周边多个工厂停产清理，管理部门必须动用大量资源进行赔付与修复。"
  fcf_economy_event.43.a:0 "坏了。"

