##事件
  fcf_economy_event.1.title:0 ""
  fcf_economy_event.1.desc:0 ""
  fcf_economy_event.1.a:0 ""

  fcf_economy_event.2.title:0 "诉CGT案周年游行"
  fcf_economy_event.2.desc:0 "一切最初只是巴黎近郊一家机械厂里的工伤事故。一次加班期间，吕西安·马丁所操作的冲床突然失控，夺去了他的双手。厂方坚称机器并无故障，事故完全源于马丁操作不当，只愿支付一笔勉强足以应付医疗费用的补偿。工头雅克也站在厂主一边；在他看来，马丁既然始终不肯加入总工会，便没有资格在出事以后寻求工会的帮助。\n\n没有人亲眼目睹事故发生的一刻，机器的维护记录也无法证明马丁的说法。地方劳动仲裁最终采信了厂方的辩解，认定他应当为自己的残疾负责。律师亨利·托雷斯随后无偿接下此案，并以案件涉及非总工会工人的基本劳动保障为由，取得特别上诉许可，将马丁的申诉直接递交联邦最高法院。然而，公众的同情无法代替法庭所需要的证据，最高法院仍然维持了原有裁决。\n\n连续两次败诉并未平息争议，反而让这场原本寻常的工伤纠纷迅速扩散。无政府主义者开始怀疑，马丁的不幸并非一次孤立的意外，几名调查者遂绕过厂方与地方机构，私下追查事故设备的来源及厂主在当地的关系。就在调查逐渐接近机械厂背后的秘密时，两名调查者却在一场旅店爆炸中丧生。\n\n爆炸案顷刻间引燃了此前积压的一切不满。街头要求查明死者遇害的真相，报刊追问地方当局究竟在掩盖什么，总联邦委员会内部也开始追究政府长期失察的责任。蒙穆索未能承受住这场政治风暴，最终被迫下台；杜穆兰正是在爆炸案引发的危机中接掌政府，也继承了这桩再也无法搁置的旧案。\n\n新政府随即下令展开正式调查，试图以一份完整的官方报告还原事件经过。然而，无政府主义联盟不愿把揭露真相的主动权交给政府。他们抢在调查结束之前公布了手中掌握的材料，迫使那些原本还能被斥为传闻的线索暴露在公众面前。直到此时，人们才知道那台冲床确实早已年久失修；厂主还在别处经营着数家未经登记的黑工厂，并凭借自己在地方政府和总工会中的私人关系屡次逃过检查。\n\n涉案人员随后受到惩处，黑工厂遭到查封，雅克与厂主维持多年的勾连也被公之于众。然而，这些迟来的真相并没有自动推翻马丁身上的旧裁决。托雷斯依据新证据提起诉讼，将厂主、地方政府与总工会一并列为被告，试图证明马丁所遭受的不公并非只来自某个工头或某个厂主，而是来自一张足以干扰监督、排斥非会员的关系网。法庭最终却认为，厂主对私人关系的利用不足以证明总工会作为一个整体应当承担法律责任；托雷斯对案件性质的扩张，也超出了现有证据所能支持的范围。马丁又一次败诉了。\n\n于是，这桩案件留下了一个格外荒诞的结局：黑工厂确实存在，机器确实疏于维护，厂主也确实曾借助总工会中的熟人逃避监督，可那个因此失去双手的人，仍被旧裁决认定为事故的责任者。“诉总工会案”由此成了报刊赋予整场风波的名字。支持总工会的人坚持认为，不能因为少数人的营私舞弊便让整个工人组织坐上被告席；反对者则追问，如果总工会的名义能够成为地方关系户的护身符，如果非会员在工厂里受到排斥以后仍无处讨回公道，那么组织是否真的可以把这一切都归结为私人行为？\n\n最后一次败诉两周年之际，人群再次走上巴黎街头。有人要求撤销马丁身上的旧裁决，有人要求彻查依附于总工会的地方关系网，也有人只是在胸前挂起一双空荡荡的工作手套，沉默地跟随队伍前进。当游行抵达总联邦委员会门前时，新政府所要回答的早已不再只是一桩工伤案：革命许诺给工人的平等，是否同样属于那些没有加入总工会的人？"
  fcf_economy_event.2.a:0 "我们终会为历史负责。"
  FCF_anti_cgt_record:0 "“诉CGT案”游行"
  FCF_anti_cgt_record_desc:0 "两年前对于马丁先生的错误判决导致的涟漪一直持续到了今天。政府内部对于总工会改革的问题依旧在讨论——或者说相互攻击，但人民已经没有耐心在等下去了。既然上一届政府没有解决这个问题，而新任的政府又已经被选出来，那么关于总工会的最终宣判就成为了这届政府必须处理的棘手事物。一方面是对总工会不满的反对派，一方面又是大量依靠着总工会生活的普通工人。但无论如何，如果我们再不进行改革，隐患只会原来越多。"
  FCF_anti_cgt_record_tt:0 "§R我们应该尽快对总工会做出改革§!"
  FCF_anti_cgt_record_has_happened:0 "“诉CGT案”游行已经发生"

  fcf_economy_event.3.title:0 "不信任的种子"
  fcf_economy_event.3.desc:0 "“诉总工会案”周年游行已经过去了三个月。那一天，政府承诺终将为历史负责，却始终没有说明准备怎样负责。总联邦委员会没有收到法案，公共安全委员会也没有提出调查或协商方案；就连一份足以表明立场的正式声明，也在各部门之间反复传阅后没了下文。政府原本或许指望时间能够平息街头的怒火，但在人们看来，这种沉默更像是不敢触碰总工会的怯懦。\n\n最先失去耐心的并不只是马丁的支持者。反对总工会的人认定，新政府不过是在等待公众遗忘旧案；总工会内部主张改革的人同样感到失望，他们原本期待政府能够帮助组织清理积弊，如今却发现自己仍要独自面对那些拒绝改变的同僚。至于坚持维护总工会的人，也开始怀疑政府是否正暗中酝酿某种方案，只是不愿承担公开辩护的责任。我们的沉默没有安抚任何一方，反而让每一方都从中看出了最坏的可能。\n\n这种不满很快越过报纸与集会，进入了各区委员会的会场。数个区重新审议了本区派往总联邦委员会的名单，一些原本支持政府的委员被撤回，取而代之的则是那些明确承诺改变现状的人。他们彼此之间并无统一立场：有人要求削弱总工会，有人主张从内部整顿总工会，也有人只是要求政府立即公开自己的打算。将他们团结起来的，只有对现状的厌倦，以及对政府已经失去耐心的共同选民。\n\n当新的委派名单送抵巴黎时，执政联盟才真正意识到，游行并未随着人群散去而结束。总联邦委员会里的几张座椅已经换了主人，而更多区委员会正准备讨论同样的问题。我们没有对总工会作出选择，于是地方上的人们开始替我们选择能够作出选择的人。"
  fcf_economy_event.3.a:0 "执政灾难！"

  fcf_economy_event.4.title:0 "自由工会"
  fcf_economy_event.4.desc:0 "总工会从来不是联邦境内唯一的工人组织。革命之后，仍有相当一部分工人因为信仰、地方传统或对集中化的不满，选择留在总工会体系之外。天主教工会主要活跃于北部工业区和宗教传统深厚的城镇，在劳工权利之外也经营互助、救济与家庭服务；自治工会联合会则由一批拒绝接受全国统一领导的地方工会组成，它们彼此立场不尽相同，却都强调基层组织应当自行决定本地事务。除此之外，各地还散布着规模更小的独立工会，其中一些甚至只存在于一座工厂或一个行业之中。人们习惯将这些组织统称为“自由工会”——所谓自由，首先只是指它们不隶属于总工会。\n\n这些工会在法律上并未受到禁止，却很难与总工会真正平等竞争。总工会拥有遍布全国的产业组织、活动场所和专业人员，还能为会员提供行业保障与跨地区援助；自由工会则时常连维持一间办公室、印制一份刊物或派出一名常驻代表都捉襟见肘。即使它们在某座工厂赢得了部分工人的支持，也很难独自承担此后与产业联合会协调生产、组织互助和维护会员权益的全部成本。形式上的自由，并没有带来力量上的平等。\n\n如果政府希望打破总工会对工人组织生活的支配，仅仅宣布各工会地位平等远远不够。我们必须向总工会以外的组织提供场所、经费与组织便利，使它们能够推举自己的工厂委员会候选人，建立独立的互助体系，并让那些不愿加入总工会的工人拥有一个真正可行的去处。只要自由工会能够站稳脚跟，总工会便不得不重新争取工人的信任，而不能继续把自己的领导地位视为革命天然赋予的权利。\n\n然而，资源究竟交给谁，绝不是一个无关政治的技术问题。天主教工会与共和青年联盟关系密切，自治工会联合会背后则不乏无政府主义联盟的支持者。若由其中一党执掌政府，再把公共资源集中投入与自己亲近的工会，反对者很容易把整项政策描绘成一次借国家之手扩张党派势力的行动。我们也可以同时扶持所有自由工会，以公开统一的标准分配援助；这样耗费更大，也会对总工会造成更直接的冲击，却至少不必回答政府为何唯独选中了自己的朋友。"
  fcf_economy_event.4.a:0 "支持天主教工会。"
  fcf_economy_event.4.b:0 "支持自治工会联合会。"
  fcf_economy_event.4.c:0 "支持所有自由工会。"

  fcf_economy_event.5.title:0 "自私自利"
  fcf_economy_event.5.desc:0 "对自由工会的扶持才推行了一个多月，最初的赞许便被另一种声音压了过去。反对派报刊列出了首批获得经费、活动场所与组织便利的工会名单，又逐一标明它们同执政党之间的联系。统计结果并不难看懂：政府没有把资源平均交给所有总工会之外的组织，而是集中扶持了与自身关系最密切的那一套工会体系。\n\n政府当然可以为此辩解。总工会的支配地位并不会因为一句“各工会一律平等”便自行消失，有限的资源也不可能在所有组织之间均匀摊薄。若要尽快建立一个足以同总工会竞争的替代力量，就必须选择组织基础较好、能够真正承接这些资源的工会。执政党与它们拥有相近的政治立场，也不能证明整项政策只是为了党派私利。\n\n然而，工会在联邦政治中从来不只是维护工资与福利的互助组织。获得政府提供的办公室、刊物和专职人员，便意味着它们可以在更多工厂推举候选人，协助竞选工厂委员会，并争取让与自身关系密切的人担任委员会主席。一个工会势力的扩张，最终会转化为工厂、区委员会乃至总联邦委员会中新的政治席位。反对者因而质问：当执政党动用公共资源壮大自己的工会盟友时，这同利用政府权力巩固自身地位究竟有什么区别？\n\n质疑很快从报纸进入了总联邦委员会。总工会的代表要求暂停拨款，未获扶持的自由工会也开始抗议所谓的“选择性平等”，就连执政阵营内部也有人担心，这项政策正在把反对总工会垄断的改革，变成另一场由政府亲手制造的垄断。我们可以坚持所有指控都是反对派的恶意拼凑，继续执行原定政策；也可以撤回已经作出的支持，以承认这项选择从一开始便很难同党派利益划清界限。"
  fcf_economy_event.5.a:0 "完全是子虚乌有！"
  fcf_economy_event.5.b:0 "撤回我们的支持。"

  fcf_economy_event.6.title:0 "沉冤得雪"
  fcf_economy_event.6.desc:0 "消息传来时，吕西安·马丁正在参加一场由工农共产党地方支部举办的工人聚会。这样的场合，他这两年已经出席过许多次：有时是在挤满听众的会堂里坐上主席台，有时是在罢工工人的募捐会上讲述自己的遭遇，有时只需在《人道报》记者面前露面，同几名地方代表握手。主办者通常会替他承担路费，再支付一笔不算丰厚、却足以补贴家用的出席费用。马丁并不总能分清那些会议究竟在争论什么，但人们愿意听他说话，也不再把他当成一个只能等待救济的残废，这已经足以让他感到满意。\n\n宣读消息的人等到掌声停下，才把文件递到马丁妻子手中。经过重新审查，原有工伤裁决已经正式撤销。那台冲床确因年久失修而失控，厂方对事故负有全部责任；马丁不再被认定为一个因操作疏忽而失去双手的工人，赔偿也将依照新的责任认定重新核定。几年以来，黑工厂早已遭到查封，厂主及其同谋也已经获罪，唯独马丁本人仍被留在那份错误的卷宗里。如今，最后这笔未清的旧账终于有了结果。\n\n然而，裁决墨迹未干，围绕它的争夺便已经开始。工农共产党宣称，这是他们持续声援马丁、拒绝让案件沉寂的成果；无政府主义联盟提醒公众，如果没有最初的调查、那场夺去两人生命的爆炸以及街头上的坚持，政府根本不会重新打开卷宗。反对总工会的人把新裁决视为CGT事实霸权遭到击破的证明，总工会中的改革派则强调，纠正一项错误恰恰说明工人组织拥有清理自身积弊的能力。就连曾经竭力同案件划清界限的人，如今也希望马丁能够出席一场“和解集会”。\n\n马丁的日程很快又被秘书、记者和各派代表塞满。有人请他站在总联邦委员会门前接受献花，有人希望他重走当年游行经过的街道，还有人已经替他准备好了演讲稿，只等他在结尾宣布正义属于某个政党、某个工会或者某一条改革路线。他对其中大多数邀请并不反感。参加活动可以挣得一些钱，也能见到那些在他最孤立时曾经帮助过他的人；何况在经历多年无人相信之后，被人簇拥总比被人遗忘好得多。\n\n他的妻子却没有表现出同样的喜悦。她把新的裁决仔细收进抽屉，又把送来的几封邀请推到一旁。在她看来，那些人过去需要一个蒙受不公的马丁，如今又需要一个证明自己正确的马丁；裁决改变了丈夫在他们口中的意义，却没有让他们重新把他当作一个普通人。\n\n当晚，记者再次询问马丁是否准备继续投身反对总工会的运动。他想了很久，最后只是让妻子替自己回答：他很高兴那份卷宗终于承认机器出了问题，也愿意向曾经帮助过自己的人道谢。至于这场胜利究竟属于谁，那是仍有双手可以挥舞旗帜的人才关心的事情。"
  fcf_economy_event.6.a:0 "正义不会缺席。"

  fcf_economy_event.7.title:0 "总工会调查档案 A"
  fcf_economy_event.7.desc:0 "调查组送来的第一批档案并不惊人。问题出在圣艾蒂安金属产业联合会的一处工人休养所。三年前，地方支部以扩建宿舍、修缮浴室和购置医疗器材为由，连续申请了数笔互助经费。工程确实完工了，休养所也一直正常接待受伤工人；如果只看现场，甚至很难说这笔钱遭到了浪费。\n\n真正引起调查员注意的是工程账目。负责修缮的建筑合作社并非当地报价最低的一家，施工期间却连续四次追加预算，最终费用几乎比最初估价高出一倍。休养所采购的床架、锅炉和康复器材，也都通过同一家合作社转手，价格普遍高于周边公社的同类采购。地方支部对此给出的解释是，工程不能耽误伤员入住，而这家合作社愿意接受总工会开具的延期支付凭证，因此多付一些费用并不算不合理。\n\n这种说法并非全无根据。革命后的许多工人设施都是在类似情况下匆忙建成的，账目混乱有时只是物资短缺与地方办事习惯的结果。然而，调查组随后发现，合作社的会计曾担任该支部财务秘书，而负责审批追加预算的两名委员，退休后又先后进入合作社领取报酬。没有证据表明他们直接侵吞了互助金，但经费在一群彼此熟识的人之间流转，也很难被称作一次公开而公正的采购。\n\n若将现有材料公布出去，我们至多能够证明某个地方支部纵容了任人唯亲和价格虚高。总工会完全可以撤换几名负责人，再把整件事归结为基层监管不严。可档案里还有一个尚未得到解释的细节：每次追加预算都附有来自巴黎的补充拨款，而且使用了同一个极少出现的会计科目。也许那只是中央财务人员为填补地方缺口所作的权宜处理；也许这间不起眼的休养所，只是某种更普遍做法留下的一角。\n\n继续追查意味着暂时放下其他档案，沿着几张看似普通的拨款凭证向上核对。调查员无法保证那里一定藏着什么，也无法保证花费数日后得到的不会只是一套陈旧而混乱的报账习惯。"
  fcf_economy_event.7.a:0 "继续深挖。"
  fcf_economy_event.7.b:0 "我们应该换一个方向。"

  fcf_economy_event.8.title:0 "总工会调查档案 A-2"
  fcf_economy_event.8.desc:0 "沿着那几张来自巴黎的拨款凭证追查下去，调查组很快遇到了第一个麻烦：总工会中央财务处根本没有档案中所写的那个会计科目。圣艾蒂安支部声称拨款来自“工人设施临时补助”，巴黎方面却表示这类补助从未单独列入年度预算。若只看双方各自保存的账簿，这笔钱仿佛既由中央拨出，又从未经过中央。\n\n调查员最终在一批已经准备销毁的往来函件中找到了答案。所谓“工人设施临时补助”，并不是正式的预算项目，而是中央财务处为处理地方紧急开支而设立的一套内部周转办法。各产业联合会每年都会把少量行业互助金汇入几个合作社账户；当某个地方支部需要一笔不便列入正常账目的经费时，财务处便要求合作社以承包工程、采购器材或垫付货款的名义将钱转出。账面上，这是合作社之间的普通交易；实际上，每一笔款项都附有中央财务人员的批准编号。\n\n这套办法起初或许只是为了绕过迟缓的预算程序。休养所漏水的屋顶不能等到下一届代表大会再修，受伤工人所需的病床也不能在各级委员会之间反复讨论几个月。然而，临时办法一旦脱离公开审议，便逐渐有了自己的规则。哪些支部能够取得补助、哪家合作社可以承接工程，以及追加多少预算，都由少数熟悉批准编号的人私下决定。圣艾蒂安休养所多付的费用并未落入某个可以明确指认的私人账户，却有一部分被合作社转入了巴黎的周转金，又被用于填补其他支部留下的亏空。\n\n调查组仍然无法证明有人从中侵吞了互助金。总工会完全可以辩称，所有款项最终仍被用于工人事业，问题只在于手续不够规范。但他们至少已经证明，圣艾蒂安的价格虚高并非地方支部自行其是：巴黎不仅知道这套账目如何运作，还亲手维持着一条不受代表大会和普通会员监督的资金通道。\n\n更重要的是，调查员抄下了整套批准编号、经手人缩写及合作社账户之间的对应关系。现在将材料公开，足以迫使总工会承认中央财务体系长期容许账外调拨，却未必能够掀起更大的风暴；若暂时把它收进档案，这些看似枯燥的编号或许还能在别处再次出现。"
  fcf_economy_event.8.a:0 "哈，将军！"
  fcf_economy_event.8.b:0 "这还不够，还有什么？"

  fcf_economy_event.9.title:0 "总工会调查档案 B"
  fcf_economy_event.9.desc:0 "第二批引起注意的材料来自鲁贝纺织产业联合会。去年春季，当地数座纺织厂同时改选工厂委员会。总工会为自己的候选人印制传单、安排演说并提供组织人员，这些活动本身并不违反任何规定；各工会本就可以推举候选人，工人也有权在秘密投票中选择自己信任的代表。问题在于，其中三座工厂最终选出了独立候选人，而它们此后遭遇的一连串变化，似乎很难只用巧合解释。\n\n改选结束不到两周，三座工厂获得的进口染料配额便相继遭到削减，原定由行业互助金承担的设备维修也被推迟。产业联合会还将数笔合作社订单转交给邻近工厂，理由是新任工厂委员会“尚未证明自己能够遵守行业协调”。其中一座工厂在半年后重新选出总工会支持的主席，染料、订单和维修经费随即恢复；另外两座拒绝改选的工厂，则一直被列在内部文件所谓的“非合作单位”之中。\n\n产业联合会对此准备了完整的解释。鲁贝纺织业当时正面临原料紧缺，所有调配都必须优先照顾效率较高、能够按时履行交换协议的工厂。三座工厂的新委员会上任后曾要求重新谈判交换比例，也拒绝接受部分统一生产安排，将它们置于较低优先级并非政治报复，而是对“不合作”所造成成本的正常回应。至于那座恢复总工会领导后重新取得配额的工厂，不过是因为新的委员会同时撤回了前任的异议。\n\n然而，调查员在地方办事处留下的一叠草稿中找到了一份不同寻常的分类表。各工厂并未按照产量、成本或履约情况排序，而是被标注为“可靠”“动摇”与“失去联系”；三座改选工厂的名称，都在投票结果公布当天从“可靠”移入了最后一栏。表格边缘还有一句没有署名的批注：“物质上的教训，会让同志们在下次投票时更加清醒。”\n\n仅凭这句话，还无法证明产业联合会有计划地利用原料与互助金左右工人投票。它可能只是某名地方职员愤怒之下留下的牢骚，那些资源调整也确实能够从生产安排中找到理由。但几名前委员会委员声称，总工会组织人员曾私下许诺，只要工厂重新选出“能够合作的人”，所有配额问题都可以立即解决。没有人愿意留下书面证词，也没有人能够说清这种许诺究竟来自地方支部，还是来自更高层级。\n\n若要继续深挖，我们就必须查阅历次原料调配会议的记录，并找到那些已经离开岗位的组织人员。倘若类似的分类表只存在于鲁贝，此事最多证明一个地方机构越过了工会竞争的界限；倘若别处也在用相同的词语标记工厂，那么所谓自由选举背后，或许始终放着一只按住原料阀门的手。"
  fcf_economy_event.9.a:0 "继续深挖。"
  fcf_economy_event.9.b:0 "我们应该换一个方向"

  fcf_economy_event.10.title:0 "总工会调查档案 B-4"
  fcf_economy_event.10.desc:0 "鲁贝办事处使用的那份分类表并非孤例。调查组查阅历次原料调配会议的记录后，在里尔、特鲁瓦和鲁昂的纺织业档案中找到了几乎相同的表格。各地采用的名称略有差异，有的把工厂分为“可靠”“待观察”和“脱离协调”，有的则写成“积极”“消极”与“敌对”；但分类发生变化的时间，都紧跟在工厂委员会改选之后，而非季度产量统计或年度协调会议之后。\n\n一座工厂是否“可靠”，表面上取决于它是否履行行业交换协议、按时提交生产数据并接受统一技术标准。可调查员将这些记录同实际生产情况逐一对照后发现，一些产量稳定、从未拖欠互助金的工厂，仅仅因为选出了独立派或自由工会支持的委员会，便突然被列为“消极协调者”；另一些长期无法完成生产建议的工厂，只要委员会主席仍由总工会会员担任，就始终能够保留原料与订单上的优先地位。所谓“协调可靠性”，至少在这些名单上，衡量的并不是工厂是否服从行业安排，而是工人是否选出了总工会信任的人。\n\n更直接的证据来自全国纺织产业联合会组织处发给各地方办事处的一份内部通报。通报没有要求任何人惩罚政治对手，只是提醒地方负责人，在资源紧张时应当优先保障“组织关系稳定、能够长期贯彻集体决议”的工厂，并建议把工厂委员会改选结果纳入配额审查。正文的措辞足够谨慎，附带的审查样表却列出了委员会主席的工会归属、反对总工会候选人的得票比例，以及厂内是否存在“自治主义倾向”。生产数据反而只占表格最后几栏。\n\n调查组还找到了那句“物质上的教训”的出处。它并非某名鲁贝职员一时愤怒写下的牢骚，而是全国纺织产业联合会一名组织员在内部会议上的发言。根据会议记录，他认为工人当然拥有选择委员会的自由，但选择“不愿合作的人”也应当承担由此产生的物质后果；与会者没有就这句话正式表决，却在随后通过了新的配额审查办法。此后数月里，至少九座改选出非总工会委员会的工厂遭到降级，其中六座在恢复总工会领导后重新取得了原有待遇。\n\n总工会仍然可以辩称，这些工厂确实更容易反对统一的生产安排，而产业联合会有权把有限资源交给更愿意合作的成员。没有人伪造选票，也没有人命令工人必须选择哪位候选人。可当原料、维修经费、合作社订单乃至伤病互助都被用来提醒工人“错误选择”的代价时，秘密投票所留下的自由便只剩下了形式。\n\n这批材料不足以证明总工会所有产业联合会都采用了相同做法，却已经能够推翻“鲁贝地方机构自行越权”的解释。现在公布档案，纺织产业联合会便不得不回答：它究竟是在协调生产，还是在用整个行业赖以运转的互助网络维持自己的选举优势。我们也可以暂时收起材料，继续寻找一宗分量更重、争辩余地更小的案件。"
  fcf_economy_event.10.a:0 "哈，将军！"
  fcf_economy_event.10.b:0 "这还不够，还有什么？"

  fcf_economy_event.11.title:0 "总工会调查档案 C"
  fcf_economy_event.11.desc:0 "第三份档案起初只是一只没有列入移交清单的木柜。它被放在全国金属产业联合会组织处最里面的档案室中，柜门上没有编号，抽屉里却整齐排列着数千张工人卡片。卡片并不按照会员编号归档，而是以工厂、车间和居住公社分类；其中记录的也不只是会费缴纳、工种与工作经历，还包括每个人参加过哪些政治集会、在工厂委员会选举中支持谁、是否经常出入教堂，以及同哪些自由工会成员或反对派活动者来往。\n\n联合会把它们称为“组织联络档案”。按照组织处的解释，总工会必须了解各工厂的实际情况，才能派遣合适的组织员、调解内部争议并防止破坏生产的势力乘虚而入。许多资料本就来自公开会议、会员登记与地方代表的日常报告，并没有人秘密拆阅信件或闯入住宅。至于卡片上偶尔出现的家庭关系、宗教习惯和私人纠纷，不过是基层组织员不加分辨地记下了过多细节，不能证明总工会有意窥探工人的生活。\n\n然而，调查员很快发现，这些卡片并不仅用于安排组织工作。部分姓名旁盖有红色的“慎重使用”印章，另一些则被标为“不宜调动”或“不得接触关键岗位”。过去两年里，至少有数十名工人在申请转入待遇更好的联邦工厂、参加技术培训或担任仓库管理员时遭到拒绝；负责审查的人事委员会给出的理由各不相同，但被拒者的姓名几乎都能在木柜中找到。他们有些退出过总工会，有些曾替独立候选人助选，还有些只是与受到监视的人住在同一栋公寓。\n\n更令人不安的是，金属产业联合会并非唯一使用这类档案的组织。卡片角落的转阅记录表明，铁路、化工和港口产业组织曾多次要求核对某些工人的情况；几份组织处通报还提醒地方支部，在接收外地工人之前，应先查询其“组织履历”，以免把一个地方已经证明不可靠的人重新安置到另一处关键岗位。一个人可以离开原来的工厂，也可以搬到另一座城市，却很难摆脱那张从未有人告知他存在的卡片。\n\n现有材料已经足以表明，总工会在正式的人事程序之外维持着一套秘密的工人审查制度。但若要证明这些档案确实决定了谁能取得工作、培训与晋升机会，调查组还必须把卡片同各地的人事记录逐一比对，并找到愿意承认自己曾经查阅档案的委员会成员。这意味着调查范围将从少数总工会干部扩展到数以千计的普通工人：他们的政治立场、家庭关系、宗教生活乃至私人纠纷，都将被政府调查员重新抄录、分类和核实。\n\n仅凭眼前这只木柜，我们已经摸到了某种足以引发全国震动的东西。可如果现在转向其他档案，这些卡片仍可能被总工会解释成一批管理失当、从未真正影响任何决定的基层材料。要堵住这种辩解，就必须知道每一枚印章之后究竟发生了什么。"
  fcf_economy_event.11.a:0 "继续深挖。"
  fcf_economy_event.11.b:0 "我们应该换一个方向。"

  fcf_economy_event.12.title:0 "总工会调查档案 C-3"
  fcf_economy_event.12.desc:0 "正式的人事档案几乎无懈可击。工人在申请培训、调动或晋升时遭到拒绝，得到的理由总是工龄不足、技术不合格或者岗位缩减，没有一份决定提及政治立场，也没有哪名委员承认自己曾经根据工会归属筛选申请者。仅凭这些卷宗，总工会完全可以声称，那只木柜从未真正影响任何人的命运。\n\n调查组随后在正式卷宗之外找到了一批“组织征询函”。每当工人申请进入重要工厂、仓库或技术岗位，人事委员会便可能以核实工作经历为名，向产业联合会询问他的“组织履历”。回函通常只有“可以信任”“建议继续观察”或“不宜调动”等寥寥数语，却与秘密卡片上的标记一一对应。凡是被标为“慎重使用”的工人，往往会在几天后因为某个看似无关的理由遭到拒绝。\n\n几名已经离职的人事委员承认，他们从未收到过要求排斥异见者的正式命令，但也很少有人敢于忽视组织处的意见。退出总工会、支持独立候选人，甚至仅仅同反对派成员来往，都可能使一名工人在通过考核后仍被挡在门外。产业联合会不必亲自决定谁能获得工作，只需留下几句含糊的评语，人事委员会自然会为拒绝找到一个合乎规定的理由。\n\n现有证据已经足以证明，那些秘密卡片并非基层人员随意收集、从未使用的内部材料。它们通过非正式征询进入了招工、培训与岗位调动，并在公开的人事程序背后形成了一套无法知晓、也无法申诉的政治审查。只要公布档案，每个曾经莫名失去机会的工人都会开始追问，自己的名字是否也曾被收进某只抽屉。\n\n但调查组仍无法确定这套制度究竟牵涉多少人。为了查清每张卡片造成的后果，他们已经开始调取家庭登记、住所名册和地方集会记录，以确认卡片上那些只有“妻弟”“同住者”或“常来往者”的模糊指代。有人进一步主张询问邻居、核对私人通信，把所有相关人员之间的关系彻底还原出来。\n\n一名调查委员提出了令人难堪的问题：我们原本是在调查总工会如何窥探公民，如今却正在复制它的档案，以证明它曾经这样做过。目的或许截然不同，但对那些姓名、信仰和私人交往同时出现在两套卷宗中的普通人而言，这种区别未必足够清楚。现有材料已经能够重创总工会；若仍坚持查明全部真相，我们就必须继续打开那些本不该由政府打开的抽屉。"
  fcf_economy_event.12.a:0 "哈，将军！"
  fcf_economy_event.12.b:0 "我们需要知道全部真相。"
  fcf_economy_event.12.c:0 "这还不够，还有什么？"

  fcf_economy_event.13.title:0 "调查被迫中止"
  fcf_economy_event.13.desc:0 "调查组发往各公社委员会的一份协查通知，最终落到了一家巴黎报社手中。通知要求地方机关核对数百名工人的家庭关系、居住变动和政治活动，并附有一张详细的调查表：是否参加宗教仪式，是否与反对派成员来往，家中是否寄住外地工人，甚至邻居如何评价其日常言行。报纸没有公布名单，却将调查表完整地印在了头版。\n\n消息传开后，舆论几乎立即改变了方向。几天前，人们还在追问总工会凭什么秘密记录工人的生活；如今，他们发现政府为了证明这些档案造成了何种伤害，又在各公社之间建立起一套内容近似的协查网络。调查组强调，所有资料都只用于还原受害者经历，不会参与招工和政治审查，但这番解释并没有平息不满。对那些同时出现在两套档案里的人而言，他们的家庭、信仰和私人交往已经第二次成为旁人翻阅的材料。\n\n总工会抓住机会发动反击。它承认部分产业联合会在档案管理上“严重失当”，却反过来指责政府借调查之名搜集公民资料，企图把工会会员乃至普通居民纳入政治监视。原本准备出面作证的几名前人事委员撤回了证词，各地公社也开始拒绝继续提供登记材料。总联邦委员会中的反对派随即提出质询，要求公共安全委员会说明调查范围，并公布所有经手这些资料的部门。\n\n我们当然可以辩称，两者的目的并不相同：总工会用秘密记录决定工人的前途，调查组则试图揭露这种做法。但调查已经无法在不造成更大政治代价的情况下继续。公共安全委员会只能宣布中止协查，封存新近取得的私人资料，并向受到牵连的公民公开道歉。调查报告 C 已经揭开的事实不会因此消失，只是眼下再也没有多少人愿意听政府谈论它了。"
  fcf_economy_event.13.a:0 "必要之恶……"

  fcf_economy_event.14.title:0 "总工会调查档案 D"
  fcf_economy_event.14.desc:0 "第四份档案来自总工会近三届全国代表大会。调查组原本只想核对几笔代表差旅费，却发现实际到场人数与会议记录中的表决票数始终相差甚远。许多未能派人赴会的地方工会，会将自己的表决权委托给产业联合会或邻近支部的代表；因此，一名坐在会场里的代表可能同时握有十几个地方组织的授权。这种做法并不违背总工会章程，却使少数熟悉委托程序的人得以支配远超其人数的票数。\n\n问题出在一批授权书上。有些文件直到大会开幕后才补填日期，有些只盖有地方支部的旧印章，另一些则来自早已停止缴纳会费、实际人数不足十人的工会。几名代表甚至在不知情的情况下被登记为其他支部的受托人，其名下票数由大会秘书处统一代为投出。近几年几次涉及中央领导改选和章程修订的关键表决，正是依靠这些委托票才勉强越过通过门槛。\n\n总工会中央对此并不否认。它解释说，许多小型工会没有经费派遣代表，地方书记也不熟悉授权手续；如果严格拒绝所有填写不全的文件，真正被排除在代表大会之外的反而是偏远地区和弱小行业。秘书处代为补正授权、安排受托人，本意只是保证每个基层组织都能发出声音。至于已经停缴会费的支部，只要尚未正式解散，便仍然保留章程规定的代表权。\n\n然而，调查组将授权书与历次表决结果对照后发现，这种宽容似乎并非一视同仁。支持中央提案的迟交授权往往能够顺利补正，反对派支部的文件却常因印章不清、签名缺失而被拒绝；几名长期替中央收集委托票的代表，还会在大会前主动联系那些从未准备参会的小型工会，请它们“不要浪费自己的声音”。目前发现的异常已经足以使人怀疑，总工会领导层正借一套模糊的委托制度维持代表大会中的多数。\n\n但这些材料仍留下了关键的争辩余地。我们无法证明秘书处伪造了任何授权，也无法判断地方支部究竟是在压力下交出票权，还是仅仅乐于把繁琐事务交给熟悉大会的人处理。若能找到当时经手授权的独立代表，或许可以还原这些委托如何产生；倘若无人愿意作证，进一步追查也可能只会证明总工会的会务一贯混乱。\n\n眼前的档案已经足以质疑几次关键表决的公正性。我们可以立即公布它，也可以继续沿着那些来源可疑的授权书，寻找真正把它们送进会场的人。"
  fcf_economy_event.14.a:0 "继续深挖。"
  fcf_economy_event.14.b:0 "哈，将军！"

  fcf_economy_event.15.title:0 "总工会调查档案 D-7"
  fcf_economy_event.15.desc:0 "突破来自一名曾在上届代表大会中负责核验授权书的独立代表。大会结束后，他察觉自己名下被记入了七个地方支部的委托票，其中四个支部从未与他取得联系。向秘书处提出质疑后，他得到的答复只是“地方同志不熟悉手续，由中央统一安排”，相关记录也很快从正式卷宗中消失。所幸，他此前已经抄下了授权编号，并保存了几份秘书处要求他代为签收的文件。\n\n沿着这些编号，调查组找到了大会召开前编制的“代表力量估算表”。这份表格没有简单统计各派支持者，而是逐一列出尚未确定受托人的地方支部，并在其后注明应当把委托票交给哪名代表。部分安排甚至早于地方支部寄出授权书；换言之，在基层决定由谁代表自己以前，秘书处已经把它们的票数计入中央多数。表格末尾还分别计算了章程修正案与中央改选所需的最低票数，最终表决结果同这些预估只相差寥寥数票。\n\n那名独立代表还交出了几封秘书处与地方组织员之间的通信。中央并未直接命令地方支部支持某项提案，而是要求组织员协助“妥善安置无法到场的同志之表决权”。对于态度可靠的支部，只需一封电报便可补办授权；对于可能支持反对派的支部，秘书处则反复要求补齐会议记录、会员签名和新式印章。几份被拒绝的授权实际上比获准入场的文件更加完整，区别只在于它们原本准备交给谁。\n\n最有力的证据来自两个早已停止活动的地方工会。它们的委托票连续三届出现在代表大会上，其中一个支部的书记早已去世，另一个则在五年前便将所剩会员并入邻近组织。秘书处明知这些支部已经名存实亡，却始终以“尚未完成正式注销”为由保留其代表权，并由中央信任的代表代为投票。大会账面上的基层声音，有一部分实际上来自早已空无一人的会议室。\n\n总工会仍可辩称，偏远支部确实需要中央帮助才能参与全国事务，许多授权瑕疵也源于基层组织能力不足。但现有材料证明，秘书处并非被动补救混乱，而是在大会召开以前便计算票数、分配委托，并以不同标准决定哪些基层声音能够进入会场。它没有粗暴地伪造一次表决，而是把例外、补正与程序便利编织成了一套稳定的多数。\n\n这些档案一经公布，受到质疑的便不再只是某几项提案，而是近三届代表大会所产生的中央领导与章程决议。总工会一向宣称自己的权威来自基层工人的逐级委托；如今它必须解释，为何那些“来自基层”的票，在基层开会以前就已经知道自己应当投向何处。"
  fcf_economy_event.15.a:0 "哈，将军！"

  fcf_economy_event.16.title:0 "总工会调查档案 D-5"
  fcf_economy_event.16.desc:0 "调查组沿着那些来源可疑的授权书逐一追查，希望找到一名能够说明委托票如何被收集、补填和分配的经手人。然而，几周过去，收到的答复却大多含混不清。地方书记声称自己早已记不得由谁提出委托，受托代表则坚持授权手续全由秘书处核验；至于大会秘书处，它只承认曾帮助地方组织补全文件，却否认替任何支部决定票应当投向何处。\n\n部分异常也找到了并不光彩、但尚且合理的解释。那些在大会开幕后补填日期的授权书，确有不少是在此前通过电话或电报确认；几名自称不知情的受托人，后来也承认曾笼统答应“照看邻近支部的票”，只是没有想到自己会因此获得如此多的表决权。就连几个长期停缴会费的工会，地方委员会也拿出了零散的会议记录，证明它们至少在名义上仍未完全停止活动。\n\n调查员当然发现了大量混乱：缺少签名的授权、沿用多年的旧印章、从未通知受托人的委托，以及大会结束后才补入卷宗的核验记录。但混乱本身不能证明操纵。总工会完全可以辩称，这不过是一套依靠惯例勉强运转的代表制度；它或许偏袒熟悉中央的组织，却没有哪份文件能够表明秘书处曾预先计算多数，或故意伪造基层的意愿。\n\n随着调查迟迟没有取得突破，总工会也获得了准备回应的时间。中央委员会主动公布了一批授权记录，承认历届大会的会务存在疏漏，并宣布今后所有委托必须经过地方会议表决、提前登记，同时不得由秘书处代为指定受托人。反对派仍然可以指出，这些改革恰恰证明旧制度并不公正；但在公众眼中，争议已经从“中央操纵代表大会”退回到“总工会的程序需要整顿”。\n\n最初发现的异常并未消失，几次关键表决的公正性仍会受到质疑。只是我们已经错过了材料最具冲击力的时刻，又没能找到足以堵住所有辩解的新证据。继续追查，只会在同一堆印章、签名与会议记录之间反复兜圈。档案 D 最终能够证明的，不过是总工会的民主程序远没有它宣称的那样完善。"
  fcf_economy_event.16.a:0 "到此为止吧。"

  fcf_economy_event.17.title:0 "合法受贿"
  fcf_economy_event.17.desc:0 "调查组的新目标，是全国机械产业联合会的一名执行书记。此人在总工会中任职近二十年，负责审查各地工厂提交的设备采购方案，并参与分配产业联合会的技术改造资金。过去几个月里，他经手批准了数笔数额可观的机床订单，其中大半都交给了里昂的一家工程合作社。\n\n订单本身没有明显问题。那家合作社报价并非最低，却承诺统一零件规格、培训工厂技师，并以劳动券接受部分结算；联合会的技术委员会也认定，这些条件足以抵消价格上的差额。所有决定都经过集体表决，书记本人没有单独决定中标者的权力。若只看会议记录，这不过是一次再正常不过的行业采购。\n\n然而，合作社随后向他支付了一笔相当于数月工资的“编纂酬金”。名义上，这笔钱用于购买他多年前写成的一部机床维护手册，并允许合作社将其印发给接受培训的工人。合同经过登记，版税也已申报；产业联合会的章程并不禁止干部凭借专业著作取得报酬。从法律上说，这笔钱来路清楚，甚至称得上比大多数私人收入更加透明。\n\n真正引起怀疑的是时间。合作社早在数年前便使用过这部手册，却一直没有提出购买版权；直到第一批订单获得批准，双方才突然签订合同。书记申报的酬金数额，也远高于近年来同类技术读物的通常稿费。更巧的是，合同并未规定最低印数，合作社即使只印几百册，也必须一次付清全部款项。\n\n我们已经查阅了他的申报材料和相关会议记录，却没有发现伪造账目、私下通信或干预表决的证据。他可以声称，合作社只是因培训规模扩大才决定正式购买手册，而稿酬高低属于双方自愿商定。只要程序合法，政府便不能因为一笔收入看起来“不合时宜”，就把它称作贿赂。\n\n但合法的合同同样可以替不合法的交易披上一件体面的外衣。若继续监视他的往来、追查合作社内部账目，或许迟早能找到那笔稿酬与设备订单之间真正的联系。我们也可以承认现有材料不足以立案，把调查力量转向一个更容易突破的目标。"
  fcf_economy_event.17.a:0 "他迟早露出狐狸尾巴。"
  fcf_economy_event.17.b:0 "换个目标吧。"

  fcf_economy_event.18.title:0 "冤枉好人"
  fcf_economy_event.18.desc:0 "调查组没有等到那名执行书记“露出狐狸尾巴”。连续数日的监视只记录下他往返于联合会办公室、工厂食堂和住所之间，偶尔在下班后探望几名年老的产业工人。对合作社账目的审查也没有发现秘密回款：那笔编纂酬金由出版与培训经费支出，完整列入了合作社的季度报告，没有再流向任何与设备采购有关的人。\n\n真正的解释藏在一叠更早的往来信件中。那部机床维护手册多年来一直被各地工厂自行翻印，里昂合作社承接统一培训后，才发现其中大量图纸仍属于作者本人。合作社曾请书记无偿转让使用权，他却只要求它停止粗劣翻印，以免错误图示伤及学徒。后来，合作社的工人委员会坚持补付过去数年的使用费用，并一次买断修订本、插图和后续培训材料，才使合同金额远高于普通稿酬。\n\n至于那几笔机床订单，技术委员会保存的原始评议表证明，书记不仅没有替合作社说话，反而因为对方报价偏高，连续两次要求压低采购数量。最终使合作社胜出的统一规格与培训方案，也是几家工厂的技师代表提出的。在决定交付对象的最后一次表决中，他因双方正在商议手册版权，主动离席回避。此前那份简略会议记录没有写下这些细节，才让时间相近的两件事显得格外可疑。\n\n更难堪的事实接踵而至。执行书记将大半稿酬交给了产业伤残工人互助基金，只留下重新绘制图纸所需的费用；他之所以没有公开此事，只是不愿把捐助变成个人声誉的装饰。过去多年里，他还经常替生活困难的工人垫付会费、寻找岗位，以至于不少人听说政府正在调查他后，主动带着收据和信件来到总工会作证。\n\n总工会没有放过这个机会。它将合同、评议表与互助基金的收款证明一并公布，并把这场调查称为“政府为了寻找罪人而制造罪证的示范”。我们没有逮捕任何人，也没有提出正式指控，但监视一名声誉良好的老工会干部、翻查他的私人往来，已经足以使整个调查工作蒙羞。原本可疑的稿酬如今成了他清白的证明，而我们的怀疑，反倒替总工会赢回了几分信誉。"
  fcf_economy_event.18.a:0 "该死。"

  fcf_economy_event.19.title:0 "委任接触"
  fcf_economy_event.19.desc:0 "我们派驻总工会的委派员原本只负责传达联邦经济政策，并列席涉及公共投资的协调会议。他无权要求总工会公开内部账目，也很少有人会在他面前谈论组织财务。正因如此，当机械、运输与建筑产业联合会提交下一季度的投资分摊表时，财务人员只把他当作一名例行签收文件的旁观者，没有特意抽走其中几张附表。\n\n表面上，那些款项都有明确用途：技术考察、跨行业协调、临时仓储以及对困难工厂的周转援助。但委派员发现，数笔来自不同行业互助金的支出，最终都汇入了同一家地区结算所。结算所随后又以“先行垫付”的名义，把钱转给几家合作社和工人互助会；这些机构取得款项后不久，又会向总工会名下的会议基金、宣传基金或干部差旅账户交纳数额相近的“自愿分摊”。\n\n单独看待其中任何一笔交易，都很难称之为贪污。产业联合会可以委托地方机构代为结算，合作社也确实有义务分担总工会的公共活动费用。然而，几组资金绕行一圈后，总会有一小部分不再出现在下一张报表中。数额通常不大，名目则不断变化：手续费、紧急预备金、组织联络费，或尚待补交收据的临时借款。没有哪个账户蒙受了足以引起警觉的损失，但同样的缺口已经持续了数年。\n\n更值得注意的是，这些款项都要经过一名颇受工人爱戴的总工会高层批准。他经常为经营困难的工厂争取援助，也乐于从自己掌握的基金中补贴罢工者家属；即使调查组公开现有材料，许多受惠者恐怕也只会认为，这不过是老同志为了绕开繁琐手续而作出的变通。可若把先前取得的档案和证词一并对照，这些零散缺口背后或许隐藏着一张远比个人受贿更庞大的关系网。\n\n委派员可以继续留意结算所的往来，并设法取得尚未归档的原始收据。但他的位置本就敏感：一旦频繁索要财务附件，总工会很快便会意识到政府已经把观察者变成了调查员。这条刚刚打开的缝隙，可能由此通向整个腐败网络，也可能在我们看清里面的人以前便重新合拢。"
  fcf_economy_event.19.a:0 "太好了，密切关注。"
  fcf_economy_event.19.b:0 "最好还是不要打草惊蛇。"
