##事件
  fcf_economy_events.1.title:0 "扩大工人教育：教育的目的"
  fcf_economy_events.1.desc:0 "一位从外地来参加总工会会议的车工，随身带来了一本成本簿。他刚被选进工厂委员会，厂里负责核算的老会计又恰好病倒，几张订货单便一直压在他手上。厂里有的是熟悉车床的人，可要算清一笔订单做下来还有多少余款，能拿来修机器还是得留着买原料，他只好趁开会的机会到处请教。工人高等学院的教员听说此事，提出在现有夜校之外增设一批进修班，选送有车间经验的工人，专门学习核算、采购和生产组织。\n\n也有代表希望把新增的课程开给普通工人。一家工厂曾在月底会上公布一笔设备更新款，直到旧机器被拆走，车间里才有人弄清这笔钱还包括整条生产线的改造。当地支部提出，夜校应先教工人读懂预算和会议记录，知道遇到疑问该找谁索取凭据。总工会能开出的第一批班次有限。厂里等着有人接手账本，车间里也有人等着看懂它。"
  fcf_economy_events.1.a:0 "培养经济骨干。"
  fcf_economy_events.1.b:0 "培养基层监督意识。"

  fcf_economy_events.2.title:0 "扩大工人教育：教育的资源"
  fcf_economy_events.2.desc:0 "劳动交易所已经开始登记愿意开班的地方，教材却还没有定下来。工人高等学院的教师愿意把现有的成本会计和生产组织课程改编成函授讲义，连同习题一道寄出。几处缺教员的小城尤其赞成。只要当地有人收发作业，学员就能从一张简单的工时表学起，最后自己编出一份生产预算。学院已经问过印刷所，第一批讲义只要定下印数，很快就能付印。\n\n几处开办过工人夜校的支部送来了一叠用过的单据。里头有一份被退回三次的采购申请，三次退回的理由都写在背面。支部希望多收集些这样的材料，请当事人把账上的数字同车间里发生的事情对起来讲。要把这些案例送到外地，还得有人整理凭据、写清来龙去脉，再请各厂给参与备课的工人腾出时间。教育部门眼下只能先拨出一笔编印费，两份书稿都在等着这笔钱。"
  fcf_economy_events.2.a:0 "技术课程优先。"
  fcf_economy_events.2.b:0 "工厂案例优先。"

  fcf_economy_events.3.title:0 "强化财务审计：审计的方式"
  fcf_economy_events.3.desc:0 "总工会的财务人员收到三份关于同一笔修缮款的答复。地方支部说钱由产业联合会拨付，联合会出示了转给承办单位的收据，承办单位则说工程中途换了施工队，最后一批发票还在地方。三家的账目各自都能结清。等到有人来问修缮款还剩多少，原先经手的几个人又已调往别处，财务人员只得从头查起。\n\n几位会计提议设立常任核查委员会，由专职人员定期对照各级账簿，保留前次核查的底稿，免得每回都从第一张汇款单查起。地方代表则希望遇到具体案件时，由财务人员和基层代表共同组成专项核查委员会。以这笔修缮款为例，当初是谁通知施工队停工、剩下的材料又被运去了哪里，几位车间代表当天就能问清楚。双方都愿意调出原始凭据，争议在于今后这类案件应当交给谁查。"
  fcf_economy_events.3.a:0 "设置常任专业核查委员会。"
  fcf_economy_events.3.b:0 "设置混合专项核查委员会。"

  fcf_economy_events.4.title:0 "强化财务审计：审计的目的"
  fcf_economy_events.4.desc:0 "总工会征集应当优先查办的事项，收到的头几份材料里，有一笔由产业联合会出面担保的设备贷款，也有十几张迟迟未能兑现的互助金凭据。设备买回来半年，仍堆在库房里。几家工厂都曾在采购计划上签字，可到了偿还第一期贷款的时候，谁也说不清当初约定由哪几家分担。负责产业协作的同志要求从这类账目查起，把作出决定、签署担保和承担损失的人逐一查明。另有几笔类似的采购正在等候批准。\n\n互助金的申领人已经往劳动交易所跑了几趟。一位伤了手的工人拿着支部开出的欠付证明，到了拨款的办事处，却被告知那笔钱早已由人签收。地方代表希望审计先核对这些签字和收据，把拖欠的款项发下去，查明有无冒领和截留。他们还提出，应当让申领人知道一笔补助卡在哪个环节，省得每次都在同几个窗口之间来回奔走。两份案卷都送到了总工会，随卷附来的催办信也都写着同一句话，盼早日答复。"
  fcf_economy_events.4.a:0 "优先追查经济责任。"
  fcf_economy_events.4.b:0 "专注于服务与反腐败工作。"

  fcf_economy_events.5.title:0 "统一标准规范：确定标准定义"
  fcf_economy_events.5.desc:0 "两家机械厂为同一批零件报了几乎一样的价，账上的成本却差了一截。总工会派人去问，才知道一家把维修工时分摊进了每批零件，另一家把它记在公用设备账上。两本账在各自厂里都说得通。可产业联合会想据此给三家工厂分配下一季的订单，翻遍了附表，也算不出多做一批究竟要多用多少工时、多少钢材。类似的麻烦在各地都有人遇到，几份旧账簿被带到巴黎，摊在了同一张桌上。\n\n全国机关的会计和工程师愿意根据这些账簿拟一套规程，把报表的栏目、核算的办法和交货时应附的凭据一并定下来。地方代表则想把有争议的条款发回各支部，让平日填表的人逐项商议。一位老会计听了半天，提议先规定报表上必须写清哪些数字、货到时必须带齐哪些单据。至于一座工厂怎样分摊修理费，眼下只要它能让别家看懂，何必动它用了多年的账簿？"
  fcf_economy_events.5.a:0 "邀请专家确定。"
  fcf_economy_events.5.b:0 "各支部协商决定。"
  fcf_economy_events.5.c:0 "只设定最低标准。"

  fcf_economy_events.6.title:0 "统一标准规范：支部抗议标准过高"
  fcf_economy_events.6.desc:0 "新规发到地方后，一位支部书记把样表贴到了库房门口，请各班领料的人照填。到了傍晚，他收回来十几张单子，半数缺了复核人的签字。新规要求每班结清原料领用、退料和废料，夜班却向来只有一名库管员。几家工厂把排班表附在联名信里，请总工会看看，白班临时调一个人过来尚且办得到，夜里又该由谁接手？\n\n也有几处支部把样表原封退了回来，连库房的人都没见过。全国机关里有人要求调换这些支部的干部，派肯着手落实的人过去。另一些代表建议按各厂的条件分期施行，能办到的先照章执行，需要增补人手的另定日期。联名的支部则请求暂时减少复核次数，让各班先学会当天记清领料和退料，再逐步恢复原定要求。几家厂已经把下月的班表送去印了，库房的人还不知道该留出多少工时做这笔账。"
  fcf_economy_events.6.a:0 "调换地方干部。"
  fcf_economy_events.6.b:0 "设置分级缓冲机制。"
  fcf_economy_events.6.c:0 "临时性降低标准，等待支部适应。"

  fcf_economy_events.7.title:0 "统一标准规范：支部预算不足"
  fcf_economy_events.7.desc:0 "地方支部把新规抄送给了负责填表的人，几天后，会计们把所需的开支送了上来。一家铸造厂的磅秤已经两年没有校准，送去修校时还得向邻厂借一台备用。另一家厂用旧秤就能照章办事，缺的是替两个班抄录和核对单据的人手。两家支部都在回函上写明，账上还能动用的钱原本是留给冬季修缮的，屋顶的漏雨已经拖过了一年。\n\n地方代表希望增加支部预算，由各地自行安排。负责汇总账目的会计却从几份预算里找出了仍在列支的旧项目，其中一处仓库已经退租，租金还照去年的数目留着。他建议先逐笔清理这些开支。也有人将校秤、印制账册和培训分别列了出来，提出按核实的缺口拨专款。各支部报上来的价目表已经摆满桌子，有些款项当天便能核准，有些连谁来负责都还没定。"
  fcf_economy_events.7.a:0 "增加支部预算。"
  fcf_economy_events.7.b:0 "裁撤不必要支出。"
  fcf_economy_events.7.c:0 "按照专项追加经费。"

  fcf_economy_events.8.title:0 "统一标准规范：建立标准共识"
  fcf_economy_events.8.desc:0 "温和派在一次内部会议上摊开了几封地方来信。几家机械厂的支部愿意一同更换验收单，条件是彼此承认同一批货的检验记录。它们长期给对方供应零件，近来有一批轴承在两家厂各验了一遍，最后还是因为单据上的批号对不上，被扣在仓库里。写信的代表说，这件事用不着等一份全国章程，只要常打交道的几家工厂肯坐下来，月底就能把表换了。\n\n也有温和派代表愿意先去同中央交涉。地方来信里的工厂彼此熟悉，换到别的产业，验收员未必认得那几张单据。中央若肯召集各产业联合会，地方代表至少能在定稿前当面问清，哪些记录会被承认，遇上争议又该到哪里申诉。会议开到天黑，几位地方代表还没走。他们已经答应回去给各厂一个准信，是先约定换表的日期，还是等中央开会。"
  fcf_economy_events.8.a:0 "在温和派主导的工会率先统一标准。"
  fcf_economy_events.8.b:0 "试图说服中央进行统一。"

  fcf_economy_events.9.title:0 "统一标准规范：供应链的传导"
  fcf_economy_events.9.desc:0 "几家工会约定启用共同的验收单后，一家齿轮厂在同一周里收到了三份更改交货手续的通知。厂里的检验员平日就量齿轮，只在出厂单上写个“合格”。现在订货厂要看每批的实测尺寸，好在货到前分配给各条装配线。库房起初想照老办法给其余客户开单，可几家订货厂经常从同一批存货里提货。今天给甲厂留的两箱，明天可能就得改发乙厂。库房试着做了几天两套单据，终于请检验员把所有批次都按新表登记。\n\n这家齿轮厂随即给供应毛坯的铸造厂打了电话，请它从下批货起按炉次装箱，随货注明批号。铸造厂问能不能仍像从前那样，把同一规格的毛坯装在一起。齿轮厂的库管员翻了翻发运簿，说下周几家订货厂还要合用一趟车，若毛坯的批号在进厂时就混了，成品再补多少张单子也对不回去。铸造厂的代表放下电话，赶在装车前去找了值班工长。"
  fcf_economy_events.9.a:0 "他们不得不遵守规范。"

  fcf_economy_events.10.title:0 "统一标准规范：行业的壁垒"
  fcf_economy_events.10.desc:0 "几家机械厂换用共同的验收单后，想请供货的铸造厂也按炉次交货。铸造厂的代表看过来函，问他们每月究竟订多少毛坯。机械厂报出了数目，对方翻了翻订货簿，发现加起来还抵不过本地农机修造厂的一笔订单。农机厂常年按规格从库里提货，临到农忙还要随时补货。为了几笔外地订单另行分堆、编号，铸造厂得腾出一间库房，再多派一个人管账。支部开了次会，决定仍按原来的规程发货。\n\n机械厂只好在收货时另验一遍。有一家嫌耽误工夫，临时改向别处订货，运费比原先贵了不少。装配车间的代表把两张运单带到会上，问能否再找几家厂一起订货。负责采购的同志算了算，各厂要货的日子相差近半个月，谁也腾不出地方替别人存着。会散了，下一批毛坯还是照老样子装上了车。"
  fcf_economy_events.10.a:0 "他们迟早会明白统一的重要性。"

  fcf_economy_events.11.title:0 "统一标准规范：同中央进行谈判"
  fcf_economy_events.11.desc:0 "总工会中央同意听取温和派的提案。会议刚开始，一位地方联合会的代表便拿起草案，问起附录里的一条规定：凡涉及跨区交货的争议，须把原始账册送交产业联合会复核。对方说，他所在的支部只有这一本账，寄出去，月底的领料和结算便都得停下来。他愿意承认共同的交货凭据，但希望凭据由谁保管、出了争议在哪里查，仍由各地商定。会场上有好几个人附议。\n\n温和派的代表请求休会片刻，到走廊里交换意见。有人愿意把原件留存的办法交给地方，只保留几项各厂都得遵守的交接手续。也有人指出，过去最难办的恰恰是拿不到凭据，连复核的权力也让出去，这份章程就很难解决积年的纠纷。主席请他们在复会时交上一份可以表决的稿子。几名代表回到桌边，原来的那一条还空着，旁边已经写满了意见。"
  fcf_economy_events.11.a:0 "与社会党合作意味着更多谈判的筹码。"
  fcf_economy_events.11.b:0 "在标准设定上进行妥协。"
  fcf_economy_events.11.c:0 "保持强硬态度。"

  fcf_economy_events.12.title:0 "统一标准规范：中央赞成统一"
  fcf_economy_events.12.desc:0 "总工会中央的复函送到时，几位地方代表还在巴黎等消息。中央同意制定共同规范，并请各产业联合会派熟悉账务和交货手续的人参加起草。函件末尾还附了一项具体安排：各地遇到说不清的账目或交货争议，可以把双方使用的单据一并送来，供起草时参照。一位原本打算当天返乡的代表读完复函，转身请人给支部发电报，叫他们把那几张退过两次的验收单寄来。那些单子在他的公文包里放了半个月，如今总算有地方可交了。"
  fcf_economy_events.12.a:0 "他们还算是有脑子。"

  fcf_economy_events.13.title:0 "统一标准规范：中央保持怀疑"
  fcf_economy_events.13.desc:0 "总工会中央回了一封很短的信。信里说，交货与账目的纠纷确有商议的必要，但各产业联合会送来的意见还不齐，中央暂且无法同意按现稿推行。至于何时重议，信里没有写日期。几位反对把复核权交给全国机关的代表当天便把复函抄给了各自的支部，请它们趁此机会另拟条文。原先愿意在会后署名的几个支部也来信询问，既然中央还要征求意见，它们能否把自己的答复留到下一次会议。温和派的秘书把这几封信放在一起，发现那场原本只差敲定日期的联席会，眼下得重新发邀请了。"
  fcf_economy_events.13.a:0 "他们总是举棋不定。"

  fcf_economy_events.14.title:0 "统一标准规范：行之有效的标准"
  fcf_economy_events.14.desc:0 "一批机件在装配时出了毛病。验收员按单据上的批号查到来料记录，当天就找到了同批送到另一家厂的两箱货。那家厂赶在上机前把货扣了下来，其余机件照常领用。照过去的办法，库房往往得把同一规格的货全扣住，等供货方派人来认。几份回报陆续送到总工会，除了少退了多少货，还写着哪些账目可以直接核对、哪些纠纷在地方就能办结。\n\n负责起草的几位技术人员主张趁势把规程再往前推一步。既然出厂后的货物已经查得到批次，也可以把记录做到几道关键工序，出了差错便能知道该查哪台机器。车间代表说，现行的单据刚填熟，再添几栏，仍得从班里抽人。他们希望先把已经用顺的条款定下来，让刚换用新表的支部有时间跟上。那份拦下两箱机件的验收单被传阅了一圈，背面已经有人试画了几栏新的记录。"
  fcf_economy_events.14.a:0 "应当对标准进一步细化。"
  fcf_economy_events.14.b:0 "保障目前的改革成果。"

  fcf_economy_events.15.title:0 "统一标准规范：脱离实际的指标"
  fcf_economy_events.15.desc:0 "试行报表收上来后，负责汇总的同志发现，两家厂的交货成绩差得出奇。一家每周都能把同样的零件装满几节车皮，照表填报从未出过问题。另一家常替附近的工厂修造旧机件，一张订单有时只要两件，还得等旧件送到手上才能照样加工。新表从接单之日算起，限期一到，货未发出就得记作逾期。那家厂照约定交了货，账上却添了一串红字。\n\n起草人中有人提出把定期供货和零星修造分开计算，也有人想把几份最难填的表送回车间，问问接单、领料和发货的工人，究竟从哪一天算起才合适。还有几位代表主张先把现行办法再用一阵，等各厂熟悉了登记手续，再看哪些数字确实需要改。那家修造厂已经把下个月的空白报表领回去了，负责填表的人随函问了一句，等旧件送来的那几天，这回还算不算在他的账上？"
  fcf_economy_events.15.a:0 "重新调整标准。"
  fcf_economy_events.15.b:0 "向工人寻求建议。"
  fcf_economy_events.15.c:0 "让支部慢慢适应。"

  fcf_economy_events.16.title:0 "统一标准规范：确定最后章程"
  fcf_economy_events.16.desc:0 "总工会把章程的最后一稿发给了各地代表，争议集中在一条附则上。负责统筹跨区采购的同志希望把全国通用的条文一次定准，此后各地照同一文本办理。过去一到交货旺季，就有支部临时换用自己的验收口径，收货方发现单据对不上时，货车往往已经到了。几位代表因此坚持，既然要颁行一份全国章程，就应当给订货方一套可以长期援引的规定。\n\n也有人主张由全国机关定期复审。原料供应紧张时，有些厂得改用平日少见的料号，订单从大批转为零星时，抽验的办法也得跟着变。地方代表则要求允许支部按当地条件修订细则，改了什么，在签订合同时告诉对方。书记员把三份附则分别夹进了同一份章程。印刷所明早来取稿，各地等着发给库房和车间的，也正是这一页。"
  fcf_economy_events.16.a:0 "设置不可变动的中央标准。"
  fcf_economy_events.16.b:0 "标准应当随着市场的变化而变化。"
  fcf_economy_events.16.c:0 "支部可以根据当地的情况做出灵活的变动。"

  fcf_economy_events.17.title:0 "培养专业官僚：储备人才"
  fcf_economy_events.17.desc:0 "总工会请各地报送准备设立的专职岗位，收到的第一批回函里，缺得最多的是会计和事故调查员。一名地方书记在自己的名字旁一连填了两个职务。他干了十几年工会工作，知道每家厂出了事故该找谁，可一碰到伤残补助的核算，仍得把材料寄给全国机关。信末，他问能否把账先交给别人照管，自己去上几个月课。管培训的同志找到了几位和他一样愿意进修的干部，眼下就能编成一班。\n\n还有人从合作银行和技术学校找来了愿意到工会任职的人。这些人熟悉业务，到了地方就能接手积压的案卷。几位工厂代表却带来了另一份名单，上面是车间里做过事故记录、替同事办过互助手续的年轻工人。让他们去学，需要车间先找人接班，短期内也指望不上他们独立办案。代表们仍希望给这批人留些名额，免得等到老书记干不动了，支部里还找不出一个既懂车间又会算账的人。"
  fcf_economy_events.17.a:0 "邀请非工会专家担任职务。"
  fcf_economy_events.17.b:0 "让现有干部参与培训。"
  fcf_economy_events.17.c:0 "培养有潜力的年轻工人。"

  fcf_economy_events.18.title:0 "培养专业官僚：缺乏专业干部"
  fcf_economy_events.18.desc:0 "一位会计原定星期三到里昂核对互助金的账，临出门又接到两处支部的电报，都是请他去处理逾期的报表。他把车票改了两次，最后只好请里昂把账册寄过来。总工会把各地报来的姓名重新抄了一遍，才发现几张名单上反复出现的是同一批人。他们有的已兼管几个支部，平日光是拆信、找凭据和催回函，就得占去半天。\n\n有人提议把招募启事登在报上，凡有会计、统计或保险业务经验的人都可以报名。几位专职干部希望先给他们配秘书，把收发文件和整理凭据的事接过去，自己便能多办几件积压的案子。另有代表认为，眼下最缺的是能签字办结的人，可以先让有经验的干部多管几个支部，准许他们直接处理当地报来的疑难事项。那位会计当天又收到一封催函。他的火车票已经改好了，可手边三处支部的账都等他签字。"
  fcf_economy_events.18.a:0 "向全社会招募。"
  fcf_economy_events.18.b:0 "设置分担任务的干部秘书。"
  fcf_economy_events.18.c:0 "让专业的干部承担更多的责任。"

  fcf_economy_events.19.title:0 "培养专业官僚：一代新人换旧人"
  fcf_economy_events.19.desc:0 "新到任的会计在一叠待付的补助凭据里找出了两笔重报的钱。原来同一名工人在两个工地都登记过，旧簿又按工地分开记账，月底汇总时便抄了两次。负责交接的老书记看过新会计的登记簿，索性把近几个月的旧卷也搬了出来，两个人查到散会才走。隔天，会计跟着老书记去了一趟车间，这才弄清有些姓名为什么总出现在两张名册上：附近几家厂赶工时常互借人手，账上看着像调了职，人却还归原来的支部管。\n\n几处支部看过这次交接的记录，建议让原任干部多留一段时间，跟新到任的人员一道办理日常事务，学会新的核算方法。也有地方希望早点分清职责，让新任人员独立管账，请熟悉各厂情况的老同志去做劳动调解、走访伤病工人。那位老书记已经交出了账柜的钥匙。至于下星期他该回办公室，还是照原先约好的日子到车间去，还有待支部决定。"
  fcf_economy_events.19.a:0 "老同志们可以从中学习到很多。"
  fcf_economy_events.19.b:0 "老同志们可以在其他领域发光发热。"
