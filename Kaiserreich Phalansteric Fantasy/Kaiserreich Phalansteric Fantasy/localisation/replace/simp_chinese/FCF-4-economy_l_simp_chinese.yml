  FCF_economy_calais_cross_harbor_tunnel:0 "重启海底隧道计划"
  FCF_economy_calais_cross_harbor_tunnel_desc:0 "早在拿破仑时期，就有人提出修建一条从加莱通往多佛尔、连接英法两国的海底隧道，但这项构想始终未能实施。英国革命后，它再次被提上议程。1926年，我们曾与英国初步达成协议，工程却因种种原因在1929年不了了之。不过，英法两国一直有人呼吁让两个革命兄弟国家联系得更加紧密；或许，现在正是重启海底隧道工程的时候。"
