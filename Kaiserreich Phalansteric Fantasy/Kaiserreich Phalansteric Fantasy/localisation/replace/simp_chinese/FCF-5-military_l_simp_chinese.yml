#军事决议栏
  FCF_military_categories:0 "军事改革"
  FCF_military_categories_desc:0 "联邦陆军在保卫革命中发挥了至关重要的作用，但在变革的时代，军队内部的各种思潮也蠢蠢欲动。自大战后，人民对于战争的热情就与日俱减，而为了补充军队的新鲜血液，来入伍的大多都是一些不学无术的“再就业人员”。毫无疑问，这些人并不能扛起公社陆军的大旗，对于军事的改革势在必行。然而，对于军事的改革注定会影响我们的社会，各种人员对于军队的看法不一，甚至还有一部分群体将我们的军队视为“压迫的残留物”，要让我们彻底解散军队，将国家的安危交予那些脆弱的民兵队伍。\n\n军队究竟是国家军队还是某个政治派系的军队，这绝不是通过一句写在宪法里的话能决定的。一个远离政治的军队或许可以保证我们政权的稳定，但作为国家意志体现的力量，军队又恰恰是最无法离开政治的。如果我们的革命从内部陷入危机，军队就是我们必须依靠的力量"

