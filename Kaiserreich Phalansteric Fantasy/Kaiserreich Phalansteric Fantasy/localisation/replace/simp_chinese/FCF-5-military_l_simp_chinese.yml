#征兵法案
  law_dual_track_conscription:0 "双轨制义务兵役"
  law_dual_track_conscription_desc:0 "所有达到法定年龄且符合服役条件的公民均负有兵役义务，并须在入役时选择服役类别：其一，加入联邦军正规役，接受完整的正规军事训练，并依联邦军令承担联邦境内各地及海外的作战、驻防与其他军事任务；其二，加入地方守备役，编入常住公社或所属联合公社辖区内的守备部队，主要接受地方防卫训练，并承担辖区警戒、要地守卫、动员准备及战时支援任务。地方守备役原则上仅在所属联合公社范围内服役；未经本人书面同意，不得被调往其他联合公社、派往海外，亦不得被转入联邦军正规役。"

  law_federal_conscription:0 "联邦义务兵役"
  law_federal_conscription_desc:0 "所有达到法定年龄且符合服役条件的青年，均须编入联邦军履行一定期限的正规役，接受统一军事训练并服从联邦军调遣。正规役期满后，退役人员转入常住地的地方预备役，定期参加复训与动员演习，平时承担地方防卫准备，战时依令重新入伍，直至达到法定退役年龄。"

  law_production_conscription:0 "国防生产兵役"
  law_production_conscription_desc:0 "国防工业及其他重要战备部门中的适龄工人，可被征集履行国防生产兵役。入役者保留原有生产岗位，依所在工厂和行业编入国防生产兵团，在承担军备生产与维护任务的同时接受基础军事训练，列入联邦军动员序列。战时根据军事需要，国防生产兵团可整建制承担工厂守备、工程、军械及后勤保障任务。"

#军事事件
  fcf_military_event.1.title:0 "临时起意"
  fcf_military_event.1.desc:0 "自从军方公开鼓励士兵检举营房中的殴打、勒索与侮辱行为以来，各部队陆续收到了一批证词。几名较为大胆的士兵却提醒我们，真正站出来的人或许只是少数：许多受害者并非不愿揭露事实，而是担心眼下的整顿结束以后，自己仍要回到原来的连队，继续面对被检举的老兵、士官乃至直属长官。命令可以禁止霸凌，却无法保证报复不会披上加派勤务、纪律处分或同袍排斥的外衣。\n\n这显然不是一次集中整顿便能解决的问题。只要申诉仍须经过原有的指挥链，士兵便很难相信自己的证词会得到公正处理。有人因此提议建立常设而独立的申诉制度，允许士兵绕过直属长官提交密封控告，并邀请公社代表、工会、退伍军人组织及法律工作者参与监督调查。军队或许会反感外人介入内部事务，但若一切仍由军队自行查办，再严厉的禁令也可能在风头过去以后沦为一纸空文。"
  fcf_military_event.1.a:0 "把这项改革加上日程。"

  fcf_military_event.2.title:0 "训练的界限"
  fcf_military_event.2.desc:0 "士兵申诉权的设立，原本是为了制止军营中长期存在的侮辱、霸凌与任意惩戒，使每一名为联邦服役的公民都不必在纪律的名义下忍受不公。然而，这项改革很快便在士官群体中引起了广泛忧虑。许多承担日常训练任务的士官指出，军事训练本就伴随着疲劳、压力与危险，若士兵能够轻易以“训练过度”为由提出申诉，那么任何严厉的命令都可能受到质疑，少数人甚至可能将申诉权当作逃避操练和推卸责任的手段。久而久之，士官将不敢严格要求部下，军队的训练质量与纪律也可能因此遭到削弱。\n\n这些担忧并非毫无根据，但问题的关键并不在于士兵是否应当拥有申诉权，而在于如何区分必要的训练、合理的惩戒与对士兵人格和身体的侵害。有人主张在各部队组建由士兵代表、士官与军官共同参与的协调委员会，明确训练强度、惩戒方式与申诉程序，使士兵能够监督命令是否越过界限，也让士官不必因正常履行职责而受到无端追究。另一些人则认为，军队不能把每一道命令都变成可以反复商议的问题；与其增设新的协调机构，不如直接限制申诉的适用范围，并对恶意申诉和借机逃避训练者予以处分。士兵的权利必须得到保障，但一支军队同样不能失去承受艰苦训练的能力。"
  fcf_military_event.2.a:0 "组建协调委员会。"
  fcf_military_event.2.b:0 "申诉权不能被滥用。"

  fcf_military_event.3.title:0 "流氓老兵"
  fcf_military_event.3.desc:0 "士官对士兵的粗暴管教尚且有迹可循：命令由谁下达、处分由谁签署，总能在值勤簿上留下记录。士兵之间的欺凌却隐蔽得多。部分老兵凭借资历、关系和对兵营规则的熟悉，把杂役与夜勤推给新兵，索取香烟和酒钱，并以所谓“连队传统”掩饰侮辱与殴打。受害者往往孤立无援，旁观者也很少愿意为一个刚刚入营的陌生人作证。\n\n士兵委员会的概念因此重新回到了我们面前。各部队名义上大多设有委员会，但其中不少早已沦为偶尔召开会议、传达决议的空壳。若赋予其查阅勤务安排、听取士兵证词和要求展开调查的权力，或许能让新兵不必独自面对那些“德高望重”的老兵。然而，委员会本身也可能被服役较久者把持，使兵营里的非正式等级披上一层民主外衣。\n\n另一种办法是从根源上隔开霸凌发生的环境：让新兵在独立编组中完成最初的适应与基础训练，待其熟悉军规、掌握申诉渠道并建立同袍关系后，再与老兵共同服役。这能够保护新兵，却也有人担心，它会延缓新旧士兵之间的磨合，并使新兵更难从有经验者身上学习。\n\n还有一些军官坚持，维持兵营秩序本就是士官的职责。只要明确要求士官制止欺凌，并追究纵容者的责任，便不必另设更多机构。但反对者警告说，基层士官已经承担了训练、内务与纪律工作；若任何未被发现的霸凌都可能令其受罚，他们或许不会更认真地解决问题，只会更认真地隐瞒问题，或者为了避免担责而对新兵和老兵采取同样严苛的管束。"
  fcf_military_event.3.a:0 "授予士兵委员会监督权。"
  fcf_military_event.3.b:0 "应当让新兵的适应一段时间。"
  fcf_military_event.3.c:0 "士官应当担任更大的职责。"

  fcf_military_event.4.title:0 "流氓新兵"
  fcf_military_event.4.desc:0 "新兵营设立后的头几周，一切似乎都在向好的方向发展。再也没有老兵半夜掀开被褥，把刚刚入伍的青年拖到走廊上“补课”；值勤表也由士官统一安排，不再有人因为晚来半年便理所当然地替全班刷靴子。负责巡视的军官甚至在报告中写道，新兵们比过去更加活跃，也更愿意在训练结束后留下来讨论动作。\n\n直到一名青年在障碍训练中摔断手腕，事情才露出了另一面。他并非因为动作失误而跌落，而是在攀越高墙时被身后的同伴故意踩住了手。动手者和他同一天入伍，却已经是全排公认的“优秀新兵”：跑得最快，枪打得最准，口令也喊得最响。士官不在的时候，通常由他带领其他人整理内务、进行额外操练，连晚饭后谁能先去洗漱，也渐渐成了由他说了算的事情。\n\n调查人员随后发现，类似的“新兵头目”并不只有一个。他们未必拥有正式军衔，却凭借体格、成绩、文化程度或与士官的亲近，在同批新兵中建立起了自己的秩序。动作迟缓者要替他们承担杂务，来自外地、口音浓重的青年被当作笑料，那些不愿服从的人则会在对抗训练中遭到格外卖力的“照顾”。一切都发生在同资历者之间，以至于不少士官从未把它当作霸凌，只认为这是能力出众者自然获得的威信。\n\n过去，这些刺头至少还要畏惧真正的老兵。如今新兵与老兵受到分隔，他们反倒成了营房里资格最老、声音最大的一群人。没有老兵并不意味着没有等级；当一批青年被挑选出来协助管理其余人时，新秩序甚至比旧秩序形成得更快。有人主张不断轮换这些临时负责人，使任何人都来不及把职务变成特权；也有人认为，军队终究需要从士兵中发现骨干，问题不在于他们得到权力，而在于从未有人教过他们应当怎样使用权力。"
  fcf_military_event.4.a:0 "基层干部应当实施轮换制。"
  fcf_military_event.4.b:0 "应当加强对于基层干部的教育。"

  fcf_military_event.5.title:0 "矫枉过正"
  fcf_military_event.5.desc:0 "督察组抵达营地时，迎接他们的是一片近乎完美的安静。床铺整齐得像是用尺子量过，走廊上看不见闲谈的士兵，熄灯后更没有半点声响。过去一个月，这个营没有收到一封霸凌申诉，也没有发生一次未经上报的冲突。营长颇为自豪地宣布，他们已经证明，只要士官真正负起责任，所谓积重难返的兵营恶习完全可以在几周内消失。\n\n可督察人员很快发现，这里的士兵也几乎不再彼此交往。新兵和老兵被安排在不同的时间用餐、洗漱与休息；寝室里禁止围坐闲谈，训练结束后的纸牌和合唱也被一并取消。士兵若想私下帮助同伴整理装备，必须先向值班士官报告；两个人声音稍大一些，便会被分别叫去询问是否发生了争执。就连一名老兵主动纠正新兵的绑腿方法，也因为“未经许可接触新兵”而受到警告。\n\n士官们并不认为自己做错了什么。此前的命令要求他们为辖下发生的霸凌承担责任，却没有人告诉他们，怎样才能证明自己已经尽力阻止。既然一次隐瞒的争执便可能毁掉晋升前途，最安全的做法自然是让士兵之间根本没有发生争执的机会。他们不再判断哪些接触正常、哪些行为危险，只需要禁止一切无法完全控制的接触，便可以在每次检查时交出一份干净的记录。\n\n霸凌案件的数字确实下降了，但某种更无形的东西也在营房里滋长。老兵不再愿意指导新人，害怕一句严厉的批评日后成为证词；新兵也不知道哪些同伴值得信赖，因为所有关系都被限制在口令与队列之中。一支军队或许可以依靠沉默维持秩序，却很难依靠沉默建立战场上的信任。\n\n问题最终回到了那道命令本身：士官究竟应当为每一起发生在辖下的霸凌负责，还是只应当为自己明知不报、处置不当和蓄意纵容的行为负责？如果我们不愿重新划出这条界线，那么这种令人窒息的“模范营房”，恐怕很快就会出现在更多地方。"
  fcf_military_event.5.a:0 "军队本身就不是用来嬉戏的地方。"
  fcf_military_event.5.b:0 "这本身也是一种霸凌行为。"
  fcf_military_event.5.c:0 "改为考察士官是否尽到处置义务。"

  fcf_military_event.6.title:0 "资历委员会"
  fcf_military_event.6.desc:0 "那封申诉信没有经过连队的正常渠道，而是被人藏在一摞送往师部的训练报表中。写信者显然担心暴露身份，只在末尾留下了十几个歪斜的指印。他们声称，自己已经三次向士兵委员会反映老兵强迫新兵代值勤、索取香烟和施加侮辱性惩罚的问题，却三次遭到拒绝。委员会第一次说证据不足，第二次说只是玩笑，第三次则告诉他们：“每个人都是这样过来的。”\n\n派去调查的人员原本以为这是一次简单的失职，但委员会保存的记录十分完整，每次驳回也都经过了正式表决。真正的问题藏在那张表决桌的周围：七名委员中有六人已经服役三年以上，剩下的一人虽然入伍不久，却是几名老兵共同推荐的候选人。会议并没有受到军官或士官干涉，只是从提出问题的人到裁定问题的人，几乎都认同同一套兵营规矩。\n\n面对质询，委员会成员显得相当委屈。他们承认老兵会让新人多做些杂务，也承认某些“额外训练”不会被写进正式课程，但坚称这些做法维持了集体生活所必需的秩序。一个年轻人若连被褥遭人扔到地上、半夜被叫起来重新叠好都无法忍受，又怎么能在炮火下保持镇定？一名老委员甚至脱下军服，指着肩上当年被皮带抽出的疤痕说，他也经历过这些，而且从未因此怨恨自己的前辈。\n\n新兵们却在另一间屋子里讲述了完全不同的故事。有人连续两周替老兵站夜岗，有人因为拒绝爬过沾满污水的地板而遭到全班排斥，还有人被命令举着步枪站到双臂失去知觉。可当调查人员试图逐项分类时，界线又变得模糊起来：严格的内务要求从何处变成羞辱？增强体能的额外操练又在什么时候成为惩罚？军队不能把所有不适都视作伤害，却也不能因为某项恶习流传已久，就把它称为传统。\n\n士兵委员会原本是为了让普通士兵能够监督军营中的权力，如今它却可能正在替另一种权力守门。如果尊重老兵经验，委员会现有的判断便应得到承认；如果确保新兵能够发出声音，就必须改变委员会的构成；而若我们怀疑任何固定席位都会制造新的派别，或许只能让少数人的申诉也足以绕过委员会、启动外部调查。"
  fcf_military_event.6.a:0 "如果这点苦都吃不了，还谈什么打仗？"
  fcf_military_event.6.b:0 "让新兵们在士兵委员会中保有固定席位。"
  fcf_military_event.6.c:0 "减少启动调查所需要的比例。"

  fcf_military_event.7.title:0 "受爱戴的施暴者"
  fcf_military_event.7.desc:0 "最先递交举报的是三名刚刚结束新兵训练的士兵。他们指控一位老兵用皮带抽打动作迟缓者，强迫恐高的新兵在没有保护的情况下反复攀爬仓库屋顶，还曾把一名顶嘴者按进蓄水槽，直到对方停止挣扎。医务记录和其他证词很快证明，这些事情确实发生过。照现行军纪处理，案件本不应有什么悬念。\n\n然而，当宪兵前来带走被指控者时，几乎半个连的士兵都站到了营房外。\n\n那名老兵参加过内战末期最惨烈的几场战斗。一次撤退中，他背着受伤的排长走过两公里泥地；另一次阵地失守时，又带领七名士兵夺回了被敌人占据的机枪。他把自己的津贴分给阵亡同袍的家属，也从未在敌人炮击时离开过岗位。在许多士兵眼中，他不是依靠资历欺压旁人的恶棍，而是整个连队最值得信赖的人。联名信很快送到团部，上面既有老兵的姓名，也有不少曾受他照顾的新兵。\n\n他本人没有否认任何指控，只是否认这些行为属于施暴。他说自己见过太多未经磨炼的青年在第一次炮击中惊慌失措，也亲手掩埋过因为一个人胆怯而死去的整班士兵。“水槽不会淹死他们，敌人的毒气会；屋顶不会杀死他们，越不过去的铁丝网会。”在接受讯问时，他反复强调，自己从未因为取乐而惩罚新兵，所做的一切都是为了让他们能够活着离开下一场战争。\n\n这番辩解打动了许多人，却没有改变那些受害者的记忆。那名恐高的新兵至今仍会在登高训练中发抖，被按进水槽的士兵也拒绝继续留在原连队。他们并不否认对方曾是英雄，只是不明白为什么拯救过同袍的功绩，能够赋予一个人在和平时期随意伤害他们的权力。\n\n严惩他，意味着向全军表明功勋不能成为军纪之外的护身符，却也可能令许多老兵觉得联邦已经忘记他们在战争中学到的一切；从轻处置可以保全这位英雄的名誉，却会让受害者明白某些人的伤痛比另一些人的勋章更轻；公开道歉或许能够修补连队内部的裂痕，但也可能只是一场以和解之名结束追究的仪式。\n\n营房外的人群仍然没有散去。所有人都在等待我们决定，英雄是否也可能是施暴者。"
  fcf_military_event.7.a:0 "法律面前人人平等。"
  fcf_military_event.7.b:0 "给他点教训就可以了。"
  fcf_military_event.7.c:0 "最好的方法是让他公开道歉。"

  fcf_military_event.8.title:0 "既往不咎"
  fcf_military_event.8.desc:0 "最初只是一封刊登在地方报纸上的来信。写信人已经退役五年，如今在一座机车工厂担任钳工。他回忆自己服役时曾因拒绝替老兵清洗衣物，被关进储物间殴打了一整夜。第二天，军医替他处理了裂开的眉角，值班士官却在记录上写下“训练中意外跌倒”。写信人说，他过去一直以为那只是自己必须忘掉的耻辱，直到联邦开始整顿军中霸凌，他才意识到，也许真正应当感到羞耻的并不是自己。\n\n来信发表后，更多旧事从各地涌来。有人带着已经褪色的伤情证明来到地方委员会，有人只能记得当年的连队番号和施暴者绰号；一些证人早已去世，另一些人则坚称自己什么都没看见。遭到指控者之中，有人已经退役，有人调往别处，还有几人因为熟悉训练、善于管理而晋升为士官。那些曾经依靠资历约束新兵的人，如今正在负责教育下一批青年。\n\n军方内部很快出现了不安。若按照今天的标准追查十年前的每一次推搡、辱骂和额外值勤，几乎没有哪个老连队能够完全置身事外；而在缺乏档案和物证的情况下，仅凭多年后的回忆处分现役人员，也可能制造新的冤屈。一些长官主张只追查造成重伤、自杀或长期伤害的严重案件，把有限的人力集中在最不容辩解的行为上。另一些人则警告，所谓情节轻重本就由当年负责掩盖案件的人记录，以残缺档案筛选旧案，无异于让成功毁掉证据者获得奖赏。\n\n争论很快不再局限于军队。退伍军人组织开始收集证词，工会报纸连续刊登幸存者的讲述，几位地方委员甚至带着记者来到营门前，要求亲自查阅值勤表和医务记录。他们认为军队无权调查自己，更无权决定哪些旧伤值得追究。军方则拒绝让未经审查的人员进入营区：寝室里存放着士兵的私人信件，档案中涉及训练计划与部队调动，一场无限制的社会调查很可能把整个军营暴露在报纸和政治斗争之下。\n\n拒绝外部介入会使每一次无罪结论都受到怀疑，允许社会组织全面调查又可能让部队失去保密和纪律。军方与社会共同组成调查组或许能够彼此制约，但双方究竟由谁选择、哪些材料可以公开、意见不一致时听从哪一方，又会引出新的争执。\n\n旧案不会因为我们拒绝回头便自行消失。它们已经随着退役士兵回到工厂、学校和地方委员会，并从个人记忆变成了整个社会对军队的追问。现在必须决定，我们准备打开多少年前的档案，又准备把营门向外面的人打开多大。"
  fcf_military_event.8.a:0 "调查所有能确定的旧案。"
  fcf_military_event.8.b:0 "只调查情结严重的。"
  fcf_military_event.8.c:0 "让社会和军方组建一个联合调查组。"
  fcf_military_event.8.d:0 "允许社会组织全面参与调查。"

