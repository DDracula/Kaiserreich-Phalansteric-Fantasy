  #爱尔兰
  ii_information_IRE_gateway:0 "\n§Y大西洋门户§!\n@GER §g[GER.GetName]§!目前有§Y[?GER.IRE_gateway_influence]§!点数。\n@ENG §R[ENG.GetName]§!目前有§Y[?ENG.IRE_gateway_influence]§!点数\n§G若英国的点数大于德国的点数30点以上，我们就可以确保我们的英国盟友取得胜利§!"
  ii_information_IRE_revolution:0 "\n§Y爱尔兰革命§!\n爱尔兰公民军的实力：[?IRE.ii_ire_revolution_army|.0Y]\n公众同情：[?IRE.ii_ire_revolution_compassion|.1Y%]\n社会稳定：[?IRE.stability|.1%Y]\n\n在政变之后，新生的政权有需多的事情需要处理，虽然对公民军进行了一定程度的打压，但也不过是削弱而非消灭了公民军的势力，公民军依然有着反扑的机会。政变揭露了一个事实：爱尔兰并不稳定，如果一个政变可以发生，那么为什么另一个不可以？倘若公民军想要再发动一次政变，甚至说是革命，那么政府就要考虑，他们相较于第一次的时候能有多少准备。"

  ii_euw_IRE_strengthen_influence:0 "$ii_can_repeat$ 协助英国增强对[IRE.GetName]的影响"
  if_ire_gateway_start:0 "§C如果§Y大西洋门户§!机制已经启动：§!"
  ii_euw_IRE_violent_revolution:0 "$ii_cant_repeat$ 准备[IRE.GetName]暴力革命"
  ireland_violend_revolution_tt:0 "§R这将有可能导致爱尔兰内战！§!"
  ii_euw_IRE_revolution_transport_weapons:0 "$ii_can_repeat$ 向爱尔兰公民军输送物资"
  ii_euw_IRE_revolution_start:0 "$ii_cant_repeat$ 发动[IRE.GetName]革命"

  FCF_international_intervention_countermeasures_category_IRE:0 "翡翠之岛革命暗涌"
  FCF_international_intervention_countermeasures_category_desc_IRE:0 "在政变之后，新生的政权有需多的事情需要处理，虽然对公民军进行了一定程度的打压，但也不过是削弱而非消灭了公民军的势力，公民军依然有着反扑的机会。政变揭露了一个事实：爱尔兰并不稳定，如果一个政变可以发生，那么为什么另一个不可以？倘若公民军想要再发动一次政变，甚至说是革命，那么政府就要考虑，他们相较于第一次的时候能有多少准备。\n\n爱尔兰公民军的实力：[?IRE.ii_ire_revolution_army|.0Y]\n公众同情：[?IRE.ii_ire_revolution_compassion|.1Y%]\n社会稳定：[?IRE.stability|.1%Y]"
