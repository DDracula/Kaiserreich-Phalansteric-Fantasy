  FCF_international_intervention_countermeasures_category_BEL_wal:0 "瓦隆危机"
  FCF_international_intervention_countermeasures_category_BEL_desc_wal:0 "[FRA.GetName]和我们南部的瓦隆人接触，这些分离主义者试图将瓦隆地区从我们国家分离出去，并建立一个工团主义的国家。不仅仅是瓦隆人，一些佛兰德人也将这视为独立的机会。无论如何，愿我们的国家可以度过这次危机。"
