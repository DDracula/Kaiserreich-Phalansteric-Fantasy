  SWI_special_relationship_with_france_open_borders_desc:0 ""
  SWI_special_relationship_with_france_war_desc:0 ""
  fcf_diplomacy_events.15.a:0 "我们将接受。"
  fcf_diplomacy_events.15.b:0 "这是不可能的。"

  fcf_diplomacy_events.16.title:0 "[SWI.GetName]的回应"
  fcf_diplomacy_events.16.desc.accept:0 ""
  fcf_diplomacy_events.16.desc.reject:0 ""
  fcf_diplomacy_events.16.a:0 "法瑞友谊万岁！"
  fcf_diplomacy_events.16.b:0 "真遗憾。"
###国际干涉事件
  fcf_international_events.1.title:0 "[FRA.GetName]宣称失地"
  fcf_international_events.1.desc.a:0 "在那场大战中，法国人失去了[29.GetName]以及绝大多数的殖民地。在随后的内战里，他们又失去了[943.GetName]，而[1.GetName]则被阿尔及尔政府掌控着。\n\n虽然过去的十几年，那些暴徒一直忙于内斗，对夺回失地没什么兴趣；但不久前，新任的公社主席宣称，他们从未忘记失地的人民，甚至要连带着我们这些胜利者一同“解放”。\n\n毫无疑问，这是赤裸裸的领土威胁，但就目前来看，他们并不敢做出什么行动，我们的顾问也不以为意。不过，根据法国人所宣称的“失地”当地的政府报告，自“失地宣言”以来，越来越多的破坏和暴力行为出现。我们的警察居然无法抓捕到那些来去无踪的工团匪徒。这已经不是一般的暴动了，一定是法国人在暗中支持，但我们不会让他们得逞的。"
  fcf_international_events.1.desc.nfa:0 "自大战后，我们就失去了许多领土，无数的法兰西儿女都在等待着收复那些故土，血洗大战的耻辱。然而，自从那场“叛乱”后，无耻的工团匪徒窃取了法兰西的土地，亵渎了三色旗的荣誉，沉迷于议会里的过家家，却忘记那些在失地哀嚎的人民。\n\n直到不久前，他们居然宣称“要将敌人和叛徒强占的土地从帝国主义和资本主义中解放出来”，简直是无耻！他们选择屈服于德国人，现在反倒指责我们是叛徒？但最可恶的不是工团暴徒，而是我们内部的叛徒。特别是科西嘉的政府传来，自红色暴徒发表所谓的“失地宣言”后，当地的破坏与暴力行为与日俱增。甚至连我们的警察都无法制服那些暴徒，这一定是工团匪徒的计谋，我们绝不会让他们得逞。"
  fcf_international_events.1.a:0 "警察会处理好的。"
  fcf_international_events.1.nfa:0 "法兰西万岁！"
  FCF_international_state_FRA_riot_modifier:0 "失地骚乱"

  fcf_international_events.2.title:0 "红色传单"
  fcf_international_events.2.desc:0 ""
  fcf_international_events.2.a:0 "我们不会让赤匪通过。"

  fcf_international_events.3.title:0 "被殖民情绪"
  fcf_international_events.3.desc:0 ""
  fcf_international_events.3.a:0 "可我们给他们带来了文明！"

  fcf_international_events.4.title:0 "革命主心骨"
  fcf_international_events.4.desc.local:0 ""
  fcf_international_events.4.desc.int:0 ""
  fcf_international_events.4.a:0 "他们想在这里发动革命？"

  fcf_international_events.5.title.SPA:0 "巴塞罗那混乱"
  fcf_international_events.5.title.SWF:0 "法国同志的支援"
  fcf_international_events.5.desc.SPA:0 "根据巴塞罗那政府的报告，一次有组织的暴乱重创了当地的军警队伍，我们损失了武器与装备，甚至还一度丢失了对地区的控制权。但在我们的努力下，暴乱最终还是暂且平息了下来。但我们还来不及清点损失，又要面对工人的罢工。毫无疑问，这些行动是有关联的，并且共同指向了我们北边的邪恶中心——[FRA.GetName]——他们绝对是这些问题的罪魁祸首。\n\n但随着国内的问题日益严重，我们也无暇对他们做出谴责，等到我们解决了国内的工团暴徒，再来解决他们。"
  fcf_international_events.5.desc.SWF:0 "一封电报振奋了我们的士气！巴黎自内战前就一直支持我们，而当内战爆发，我们的法国同志也向我们派出了支援。军事顾问团、武器装备以及志愿军……我们的实力进一步增强，而那些反动派必将在工人阶级的面前倒下！"
  fcf_international_events.5.SPA:0 "巴塞罗那的问题仍在继续……"
  fcf_international_events.5.SWF:0 "国际主义万岁！"

  fcf_international_events.6.title.a:0 "境外势力"
  fcf_international_events.6.title.b:0 "血色暗涌"
  fcf_international_events.6.desc.a:0 "进步工党组织起了一场声势浩大的集会，试图向周边的工人选民传输他们邪祟的工团主义思想。原本，像他们这种缺少政治盟友和资金的边缘派系不应该举办起什么有势头的集会，但或许是黑色星期一让国内的选民出现了政治极化，又或者是——有境外势力在煽风点火。\n\n[ENG.GetName]是第一嫌疑人，毕竟进步工党一直和他们有所接触。但种种迹象表明，这一次盛大的造势活动是出自第三国际的另一个成员——[FRA.GetName]的手笔；虽然出乎我们的意料，但是也符合这些赤匪的逻辑。但最令人担忧是，这场所谓的为了竞选的集会似乎暗流涌动。不止一个警察向我们报告，看到了携带非法器械的可疑人员在会场周围走动，我们最好还是提高警惕……"
  fcf_international_events.6.desc.b:0 "自选举结束以来，我们一直就收到了来自安全部门的警告，似乎有什么组织在我们看不见的地方进行活动。但就行动来分析，他们大概率和亲英派与工团主义者有关。有几件治安事件被指控与这些团体有关，然而，我们却找不到罪魁祸首，甚至连作案的成员都寻不到蛛丝马迹。唯一我们可以肯定的是，他们绝对是有组织、有目的地进行行动的。\n\n除此之外，一直以来缺乏资源的工团党和$IRE_totalist_party_short$也在进行大张旗鼓的活动。他们不仅拉拢工人，甚至还联系到一些反对政府的知识分子，小资产阶级和农民。不断地在我们的社会里传播邪祟的工团主义思想。尽管我们进行了一定限度的压制，但是他们的传播速度还是要比我们想象地快得多。毫无疑问，这不是仅仅靠他们自己就能做到的，英国人甚至是法国人都有可能是暗中推动的真正棋手——但我们现在还没有找到证据。"
  fcf_international_events.6.a:0 "他们最好老实点。"
  fcf_international_events.6.b:0 "希望问题不会更多了。"

  fcf_international_events.7.title.SRI:0 "来自法国同志的协助"
  fcf_international_events.7.title.SRD:0 "失败主义情绪蔓延"
  fcf_international_events.7.desc.SRI:0 "[FRA.GetName]，自意大利革命以来就协助我们，一直是我们的坚实的盟友，也是我们对抗反动主义和帝国主义最坚实的靠背。现在，来自巴黎的同志告诉了我们一个好消息：公社愿意全心全意地支持我们的任务——将意大利变为一个社会主义共和国，并且给予了我们更多的协助。我们没有理由拒绝来自同志们的热情，而我们也必将把意大利塑造成一个社会主义的、人民的、革命的、伟大的共和国！"
  fcf_international_events.7.desc.SRD:0 "我们本以为，将我们从意大利本土赶出去的社会主义匪徒只不过是昙花一现，过不了多久就会自行崩溃。然而，事实狠狠给了我们一拳，他们不仅存续了下来，还击败了本土其他的政权。现在，他们将目光放向我们，将我们视作分裂意大利祖国的最后一块土地——可恶的叛徒，竟敢反过来指认我们是分裂主义者！\n\n工团匪徒的坚船利炮不断轰击着我们，虽然我们的士兵依旧英勇，但可恶的暴徒依靠着[FRA.GetName]——红色罪恶的老巢——不断地向我们的人民传递邪祟的学说，甚至，还试图哗变我们的军队。虽然我们最终镇压了那些被煽动起来的暴乱，但必须承认的是，本土被社会主义统一和内部的宣传攻势使得一种失败主义萦绕在我们上空……"
  fcf_international_events.7.SRI:0 "为了意大利，为了社会主义！"
  fcf_international_events.7.SRD:0 "这难道就是结局了吗……"

  fcf_international_events.8.title.a:0 "法国支援革命"
  fcf_international_events.8.title.b:0 "来自巴黎的电报"
  fcf_international_events.8.desc.a:0 "在我们前线抗击反动派的时候，后方传来了一个天大的好消息：我们革命的挚友，[FRA.GetName]向我们送来了军事援助。不仅有我们急需的武器弹药，还有一批军事顾问团队。不仅如此，在中国工团党的帮助下，我们对刚刚攻占下来的城镇也开始有了一定的掌控力。虽然党内右派对此表示担忧，但在革命胜利之前，这些都是值得争取的力量。"
  fcf_international_events.8.desc.b:0 "好消息！巴黎的同志联络我们，他们不仅承认我们是中国唯一合法的政府还承诺协助我们的革命！曾经流亡在法国的中国同志也在巴黎的帮助下逐渐回国，除此之外，法国人还许诺会派遣一批人员来协助我们进行国民经济重建。尽管党内有一批人对于法国人的殷勤呈现出担忧甚至是反对，但在中国工团党的牵头下，中法的合作有望更进一步。"
  fcf_international_events.8.a:0 "多谢同志们。"

  fcf_international_events.9.title:0 "科西嘉困境"
  fcf_international_events.9.desc:0 ""
  fcf_international_events.9.a:0 "成立自治政府。"
  fcf_international_events.9.b:0 "这一定是赤匪的阴谋！"

  fcf_international_events.10.title:0 "科西嘉宣布独立"
  fcf_international_events.10.desc:0 "就在我们困于非洲殖民地起义的时候，意想不到的消息从科西嘉传来：尽管我们早就知晓黑手党早已深入到科西嘉社会的各处，但我们认为其在大体上还是站在我们一边，他们和大陆的走私往来也可以给我们带来经济和情报上的收益。\n\n然而，黑手党的意识形态显然要比我们认为的更加无耻，在看到我们的政府深陷殖民战争的泥潭的时候，他们居然认为我们即将“不再作为一个国家存在”？！靠着这个荒谬的理由，“为了科西嘉的繁荣与人民的安全”，他们发动了一场全民公投，宣布脱离我们的统治。我们原本寄希望于当地的政府军可以镇压这些宵小之徒，但他们早就被黑手党收买为了自己的私军。\n\n但这些都不是最令人意外的！这些黑社会们居然想着和大陆的赤匪联系，几乎可以肯定的是，他们的行动得到了来自大陆的默许乃至支持。我们先前对于他们的宽容态度让这些家伙蹬鼻子上脸。哪里能挣钱，他们就站在哪边，现在他们觉得我们的政权已经丧失了“可以盈利”的空间，转头就和赤匪勾搭在一起！\n\n然而，我们对此有任何办法吗？没有，我们根本抽不出任何兵力去围剿科西嘉的叛乱，甚至一部分舰队还被截留在了科西嘉。这无疑会使得我们面对非洲的战局更加困难，协约国也将失去地中海最重要的支点。"
  fcf_international_events.10.a:0 "黑手党和赤匪，果然是一丘之貉！"

  fcf_international_events.11.title:0 "科西嘉与马赛"
  fcf_international_events.11.desc:0 "自科西嘉自治政府建立以来，我们就时常关注这个新生的政权。我们当然知道他们是由黑手党幕后掌权的“假民主”政府，不过这也不妨碍我们和他们展开一系列的“交流”。\n\n黑手党并不是只在科西嘉活动，马赛是他们在大陆最重要的节点，甚至可以说，比起科西嘉，马赛才是黑手党的老巢。作为流氓无产者，他们同样参与了革命，甚至从中捞了不少好处，退伍的士兵们也乐意加入到黑手党的裙带网络，这使得他们在马赛实际上有着和科西嘉差不多的地位。\n\n好处和坏处都是有的，黑手党都是一些以利益为上的家伙，他们会向阿尔及尔的反动政府输送我们的情报，走私商品到协约国去。当然，我们——主要是马赛的统治者——也这么做了，因此我们并没有占据多大的道德高地。\n\n不过，从现实政治的角度出发，和这些黑手党搞好关系可以使得科西嘉在立场上更偏向我们，而非是阿尔及尔的伪政府。甚至更进一步的说，科西嘉或许能重回法兰西的怀抱也说不定。"
  fcf_international_events.11.a:0 "黑手党也可以搞革命嘛！"
  fcf_international_events.11.b:0 "只要科西嘉回归，一切都好说。"
  fcf_international_events.11.c:0 "我们不会和黑手党做交易。"

  fcf_international_events.12.title:0 "供养者"
  fcf_international_events.12.desc:0 ""
  fcf_international_events.12.a:0 "他们要多少我们给多少！"
  fcf_international_events.12.b:0 "所有协约国成员都应该承担。"
  fcf_international_events.12.c:0 "让这帮土匪滚出去！"

  fcf_international_events.13.title:0 "[NFA.GetName]要求支付科西嘉的维护费"
  fcf_international_events.13.desc:0 ""
  fcf_international_events.13.a:0 "给他们。"
  fcf_international_events.13.b:0 "做梦！"

  fcf_international_events.14.title:0 "来自大陆的盟友"
  fcf_international_events.14.desc:0 "我们的革命火种刚刚点燃，但旧世界的余孽——协约国，正试图用刺刀和炮火将我们扼杀。前线的弹药消耗和装备损耗是惊人的，每延迟一分钟，都有同志在为缺乏足够的装备而付出生命的代价。\n\n就在我们最需要外援的紧要关头，来自[FRA.GetName]的消息抵达了堪培拉。一艘挂着红旗的商船，冒着被敌方海军截击的风险，终于抵达了我们的港口。\n\n船上卸下的，是我们此刻最急需的革命的钢与火：成批的步枪和火炮。这是一笔真正的军事援助，世界工团主义的核心看到了我们在太平洋上点燃的火种，并决心不惜一切代价支持我们。"
  fcf_international_events.14.a:0 "国际主义万岁！"

  fcf_international_events.15.title:0 "工团革命的幽灵"
  fcf_international_events.15.desc:0 "自从在大陆上的兄弟们失陷于赤色浪潮，澳大拉西亚一直是帝国在南太平洋最坚固的堡垒。然而，最近几周，这种安全感正在被一股令人不安的低语所取代。\n\n军情部门的报告如雪片般飞来，指出潜伏的工团主义者和激进工人正在变得愈发大胆。在新南威尔士的码头，工人们拒绝卸载来自印度的货物；在昆士兰的矿区，小规模的罢工迅速演变成与地方警察的冲突；甚至在堪培拉的郊区，也出现了印着三支箭或燃烧火焰的非法宣传品。\n\n这些行动似乎是分散的，缺乏统一的指挥，但它们的基调是一致的——反对国王、反对帝国，呼吁建立一个由工人统治的“联盟”。情报官员担心，[FRA.GetName]和[ENG.GetName]的广播宣传与资金正通过地下渠道渗透进来，而当地对现状的不满正在成为点燃革命的燃料。我们不能再忽视这些阴影下的骚动了。"
  fcf_international_events.15.a:0 "天佑国王……"

  fcf_international_events.16.title:0 "一个统一的伊比利亚？"
  fcf_international_events.16.desc:0 "我们与半岛上的革命同志们在反对旧世界反动势力的斗争中结下了深厚的友谊，但毗邻的两个新政权在各自的革命进程和治理模式上，仍然存在显著差异。\n\n最近，来自[FRA.GetName]的外交使团提出了一个大胆的、甚至是具有历史意义的愿景：将整个伊比利亚半岛的革命力量统一为一个强大的“伊比利亚社会主义联邦”。他们指出，一个统一的政治实体将能够彻底掌控直布罗陀海峡，在国际社会中拥有更大的发言权，并有效地对抗来自非洲和地中海的威胁。\n\n这个提案在最高委员会中引起了激烈的辩论。如果接受，我们将获得巨大的战略利益，但也可能意味着我们必须在多大程度上为了“统一的效率”而牺牲我们对革命原则的坚持。我们能否接受一个牺牲部分自治以换取整体强大的伊比利亚？"
  fcf_international_events.16.a:0 "伊比利亚的工人，联合起来！"
  if_socialist_iberia_accept_swf:0 "§C如果§Y[POR.GetName]§!接受：§!"
  if_socialist_iberia_accept_por:0 "§C如果§Y[SWF.GetName]§!接受：§!"
  fcf_international_events.16.b:0 "西班牙和葡萄牙之所以是两个国家是有原因的。"

  fcf_international_events.17.title:0 "黑手党掌控科西嘉！"
  fcf_international_events.17.desc:0 ""
  fcf_international_events.17.a:0 "现在他们彻底疯狂了！"

  fcf_international_events.18.title.a:0 "伊比利亚设想得以实现！"
  fcf_international_events.18.title.b:0 "伊比利亚维持现状"
  fcf_international_events.18.desc.a:0 "来自[SWF.GetName]和[POR.GetName]的同志已经接受了我们的提议，正式将两国合并为一国，伊比利亚结束了数百年来的分裂状态，这无疑是世界无产阶级力量的又一次壮大！从今往后不再有西班牙人和葡萄牙人，只有伊比利亚人！"
  fcf_international_events.18.desc.b:0 "出于种种现实考量，[SWF.GetName]和[POR.GetName]最终没有达成共识，一个统一的伊比利亚计划再一次被搁置了。秉持尊重各国的原则，我们能做的也只有表示遗憾和支持他们所做出的一切选择了。"
  fcf_international_events.18.a:0 "工人没有祖国！"
  fcf_international_events.18.b:0 "实在可惜。"

  fcf_international_events.19.title:0 "我们的邻居"
  fcf_international_events.19.desc:0 "二十年前，法兰西的资产阶级为了自己的利益而与德意志帝国展开帝国主义之间的内战，而我们英勇的工人与同志选择对无谓的战争说不。我们的革命最终取得了胜利，却是阉割的胜利。我们为了确保革命政权的存续而不得不与德意志帝国妥协。我们虽然失去了土地，但终究得到了人民，但我们绝不会忘记世界大战的耻辱，我们也绝不会抛弃那些生活在德意志帝国统治下的法兰西同胞，以及那些同样被资本主义与君主主义剥削的德意志工人。社会主义的解放终将会在法兰西和德意志一同实现。\n\n然而，由于我们的政权本就建立在反对战争之上，即使我们明白公社必将与德意志帝国爆发一场大战，但我们的人民依然希望战端并不由我们而起。虽然我们可以进行更加激进的对德策略，但这无疑会鼓舞我们国内的军国主义与民族主义情绪，而这对于社会主义的建设来说注定是百害而无一利的。\n\n总联委中对于处理德国的问题上态度并不一致，主战派希望我们展现出更加进攻的姿态，而主和派则认为战争对于所有人来说都是灾难，我们真正要做的应该是确保不被德国入侵，而不是主动地挑起争端。\n\n军团的老兵们都希望在新的大战中一雪前耻，那些民族主义者则希望收复在大战中失去的法兰西故土，爱国主义者也不愿放弃战争这一报仇雪恨的机会；光谱的另一端则是无政府主义者和新社会主义者意想不到的联盟——他们都反对战争，但无政府主义者宣称的是德意志工人的第二次革命，而新社会主义只不过是机械地反对一切国内事务之外的活动罢了。但总而言之，关于德国的外交方向必须得到确认。"
  fcf_international_events.19.a:0 "我们会为大战复仇。"
  fcf_international_events.19.b:0 "无产阶级之间没有矛盾。"

  fcf_international_events.20.title:0 "意想不到的接触"
  fcf_international_events.20.desc:0 "出乎我们的意料的是，[FRA.GetName]——革命思想的老巢——居然能主动与我们接触，他们声称同为大战的受害者，怀揣着对失去故土的同情希望在未来对于[BUL.GetName]的潜在战争中和我们进行合作。说是合作，但其实只不过是他们单方面向我们提供军官团和武器装备，而他们要的却是我们国内的经济利益：关于贸易的优惠，甚至是在我国国内的投资。\n\n这种举措毫无疑问地引起了国内保守派和反工团主义者的反对，他们认为这是恶魔的交易，是用我们的民族的灵魂去交换物质的利益。然而，在中间派和左翼看来，这不仅可以加强我们面对敌人的实力，也可以缓解国内经济危机。虽然[FRA.GetName]可能注定不是我们的朋友，但在面对共同的敌人的时候，我们也可以并肩作战。"
  fcf_international_events.20.a:0 "告诉巴黎，我们愿意合作。"
  fcf_international_events.20.b:0 "我们绝不会和魔鬼合作。"

  fcf_international_events.21.title:0 "革命的风暴"
  fcf_international_events.21.desc:0 "帝国内务部的办公桌快被淹没了。来自布拉格、克拉科夫、布达佩斯和萨格勒布的警察报告堆积如山，每一份都散发着墨水和恐慌的气息。线人们的密报、被截获的信件、对工厂“怠工”的分析……所有情报都指向一个共同的、令人不安的结论。\n\n帝国的空气正变得稀薄。一种熟悉的、令人窒息的寂静笼罩着非德意志人的街区，就像风暴来临前那种万物屏息的时刻。这不是1918年的那种绝望，而是1848年的那种……期待。\n\n马扎尔的民族主义者正在与捷克的激进分子秘密会面。克罗地亚的知识分子在用加密的电报与波兰的地下组织联络。他们在挖掘一个近一个世纪前的幽灵，并试图为其注入新的、愤怒的生命。描绘着科苏特头像的粗糙传单在夜色中被贴上墙壁，又在黎明前被巡警匆匆撕下。本应在酒馆里抱怨工资的工人，现在却在低声讨论“民族自决”。\n\n古老的伤疤正在被重新撕开，而这一次，他们似乎找到了共同的语言：对维也纳的仇恨。这不再是零星的抗议。这是一场正在汇聚的风暴。"
  fcf_international_events.21.a:0 "革命回来了……"
  fcf_international_events.21.b:0 "哈布斯堡的末日到了！"
  anti_habsburg_front:0 "反哈布斯堡民族解放阵线"

  fcf_international_events.22.title:0 "哈布斯堡的末日"
  fcf_international_events.22.desc:0 "维也纳陷落了。\n\n最后的炮声在内城区的狭窄街道上回荡后，整座城市陷入了死寂。烟柱从霍夫堡宫和议会大厦升起。双头鹰的旗帜被扯下，取而代之的是马扎尔人的三色旗，以及紧随其后的捷克、克罗地亚——乃至加利西亚的旗帜。他们曾经的臣民，现在成了他们的征服者。\n\n在美泉宫的镜厅里，来自“反哈布斯堡民族解放阵线”的代表们齐聚一堂。一名匈牙利军官——他显然是这里的领导者——将马靴踏在精致的洛可可式椅子上。他面前站着的是瑟瑟发抖的帝国总理和几位残存的部长。\n\n一份文件被扔在桌上，标题用粗体字写着：《维也纳宣言》。\n\n“读吧，”匈牙利人示意道，他的德语带着浓重的口音。“一个帝国的墓志铭。”\n\n文件的内容简洁而残酷：哈布斯堡-洛林家族必须立即放弃其对奥地利、匈牙利、波西米亚以及所有皇室领地(Crownlands)的全部宣称。奥地利帝国——这个维系了数百年的多民族“牢笼”——必须即刻解体。宣言要求奥地利政府无条件承认匈牙利、捷克、克罗地亚以及所有其他“受压迫民族”的完全独立与主权。\n\n一个时代，在枪炮的轰鸣与墨水的寒意中，终结了。"
  fcf_international_events.22.a:0 "我们别无选择……"
  fcf_international_events.22.b:0 "啊，甜蜜的自由！"

  fcf_international_events.23.title:0 "帝国的末路"
  fcf_international_events.23.desc:0 "帝国正在从内部腐烂。\n\n无论是在布达佩斯和布拉格的民族主义者是否已经点燃了边疆，还是双头鹰是否已被迫签署了屈辱的条约，其结果是相同的：维也纳的权威已化为乌有。\n\n真正的威胁不再仅仅来自那些遥远的省份；它已经渗透到了帝国的核心。空气中充满了叛乱的气息。从法沃里滕的工人区，工团主义者高举着红旗，高唱着禁歌，他们的队伍正向内城区挺进。而在环城大道上，学生、中产阶级甚至是一些心怀不满的商人，则挥舞着简单的红白红三色旗——一个没有皇室纹章的、共和国的旗帜。\n\n往日里势不两立的激进分子，此刻却被一个共同的口号团结在一起：“打倒哈布斯堡！”(Nieder mit Habsburg!)\n\n警察部队或是在街垒后自保，或是干脆撕掉了他们的帽徽，加入了人群。关于军队忠诚度的报告自相矛盾，但结论是明确的：他们不能被依赖。霍夫堡宫已是一座孤岛。一个延续千年的王朝，现在只剩下几个在华丽房间里来回踱步的惊恐大臣。大门外的喧嚣，预示着最后的时刻即将来临。"
  fcf_international_events.23.a:0 "哈布斯堡该滚蛋了！"
  fcf_international_events.23.b:0 "我们将重回德意志。"

  fcf_international_events.24.title:0 "我们可悲的兄弟"
  fcf_international_events.24.desc:0 "一封加急电报被重重地拍在柏林威廉大街的办公桌上。电文的内容令人震惊，却又在预料之中。\n\n哈布斯堡王朝，那个统治中欧数个世纪的古老家族，已经失去了对维也纳的控制。\n\n电文的来源有两种可能：要么来自我们惊慌失措的大使，生动地描述着共和派甚至是工团主义暴徒在环城大道上游行，霍夫堡宫已陷入一片混乱；要么——也许更可悲——来自奥地利皇室仅存的残余，字里行间充满了对“德意志兄弟”出兵干预的卑微恳求。\n\n无论哪种情况，事实都已明了：“奥地利问题”——那个俾斯麦首相以为在1866年就已一劳永逸解决的问题——再次以最尖锐的方式摆在了德意志帝国面前。\n\n一个分崩离析、陷入无政府状态的奥地利，对帝国的安全构成了直接威胁。一个工团主义的维也纳政权，更是绝对无法容忍的噩梦，它将彻底打开我们柔软的南部防线。帝国参谋部的将军们早已制定了应急预案。这是一个风险，但一些人低声说，这也是一个“完成德意志”的历史机遇。"
  fcf_international_events.24.a:0 "一个统一的德意志，本应如此。"
  fcf_international_events.24.b:0 "我们不能忍受一个共和国出现在帝国的南部。"
  fcf_international_events.24.c:0 "这有可能导致俄法的介入，风险太大了。"

  fcf_international_events.25.title:0 "红色前线"
  fcf_international_events.25.desc.a:0 "一份来自巴黎的加密电报意义重大。[FRA.GetName]绕过了所有传统的外交渠道，直接向我们的革命委员会发出了呼吁。\n\n电报中，巴黎的同志们赞扬了我们在北欧取得的初步胜利，但他们的话锋很快转向了地图上的其他地方。在我们的边境之外，斯堪的那维亚半岛的大部分地区仍被反动君主、资产阶级议会和旧世界的军队所牢牢控制。\n\n公社的提议直截了当：他们希望我们能成为“北欧的红色前线”。他们承诺将提供“兄弟般的援助”——顾问、物资以及更直接的支持。他们的目标是以我们为跳板，将革命的火种撒遍整个斯堪的那维亚，让革命的旗帜插满波罗的海与丹麦海峡的沿岸。这是一个诱人的前景，但也几乎肯定会将我们推向与柏林及其在北方的盟友直接对抗的第一线。"
  fcf_international_events.25.desc.b:0 "安全部门的最新报告令人不安。近几个月来，一股暗流正在我们的工厂和港口中涌动。工人们的抱怨不再仅仅关于工时和面包价格，他们开始低声谈论“工团主义”、“总罢工”和“巴黎的同志”。\n\n这绝非巧合。我们的情报显示，[FRA.GetName]正试图将斯堪的那维亚半岛变成他们“革命输出”的下一个目标。来自巴黎的煽动者伪装成水手和商人，在我们的工会中散布激进思想。非法的传单和手册——印刷精美，显然是来自国外——正在工人里秘密流传。\n\n[FRA.GetName]的目标很明确：他们试图在北欧点燃一场社会主义革命，而我们不幸成为了他们的目标。我们的工人中有不少人已经受到了这些危险思想的蛊惑。如果不迅速采取行动，这股“红色前线”的暗流很可能演变成一场颠覆我们社会根基的风暴。"
  fcf_international_events.25.a:0 "斯堪的纳维亚的工人，联合起来！"
  fcf_international_events.25.b:0 "一帮暴徒。"

