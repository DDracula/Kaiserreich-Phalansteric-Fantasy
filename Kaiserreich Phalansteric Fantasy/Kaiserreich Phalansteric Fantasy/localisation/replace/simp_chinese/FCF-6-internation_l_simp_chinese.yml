###非洲
  #中非
  

  #殖民幻梦
  GER_MAF_colonial_illusion_activating_tt:0 "解锁§Y殖民幻梦§!机制\n如果处理不当，§Y[MAF.GetName]§!将解体，而§Y[GER.GetName]§!也将陷入另一场§R更加恐怖的经济危机§!"

  MAF_colonial_illusion_modifier:0 "非洲金海"
  MAF_colonial_illusion_modifier_desc:0 "[MAF_colonial_illusion_modifier_desc_loc]"
  MAF_colonial_illusion_modifier_desc_inactive:0 "自世界大战结束和英国革命爆发以来，德国便成为了非洲无可争议的霸主。殖民派将这片广袤领土描绘为德国工业取之不尽的原料基地，容克、银行家和各大企业则从铁路、矿山与种植园的扩张中看到了无穷商机。源源不断送回本土的报表似乎也证明了他们的判断：[MAF.GetName]的贸易额逐年攀升，新的矿藏不断发现，一项项宏伟工程陆续开工；只要再投入一些资本，非洲迟早会成为德国最宝贵的海外资产。"
  MAF_colonial_illusion_modifier_desc_activating:0 "世界大战结束和英国革命爆发以来，德国便成为了非洲无可争议的霸主。殖民派将这片广袤领土描绘为德国工业取之不尽的原料基地，容克、银行家和各大企业则从铁路、矿山与种植园的扩张中看到了无穷商机。\n\n然而，[MAF.GetName]远没有报表上看起来那般繁荣。十余年来，[MAF.GetName]始终未能建立一套行之有效的“德国体制”，仍在很大程度上依靠英、法、比旧殖民政府留下的官僚机构，境内甚至保留着众多“土著王国”。德国在非洲的统治因此显得支离破碎，各殖民地之间乃至殖民地内部都难以实现有效的行政、交通与信息交流，也给反德势力留下了串联和起事的空间。\n\n德国本土并非对此一无所知，但殖民政府、旧官僚与特许公司各自掌握一部分账目，柏林很难看清这片庞大领地的全貌。非洲的真实混乱远远超出了德国贵族与投资者的想象；不过，只要送回本土的报表依然漂亮，只要铁路、矿山和种植园仍许诺着未来的利润，新的资本便会继续涌来。"

  GER_MAF_colonial_illusion_category:0 "殖民幻梦"
  GER_MAF_colonial_illusion_category_desc:0 "[GER_MAF_colonial_illusion_category_desc_loc]"
  GER_MAF_colonial_illusion_category_desc_GER:0 "黑色星期一迫使我们重新审视过去的经济政策。当目光转向德国庞大的海外资产时，一个无法回避的问题随之出现：我们究竟从非洲得到了什么？\n\n显然，§Y[MAF.GetName]§!从来称不上什么“模范殖民地”。当地行政混乱，财政长期依赖本土补贴，投资效率低下，账目中更充斥着虚报与空账。过去，只要殖民地还能许诺利润，我们便有耐心、也有理由陪他们把这出戏演下去。如今泡沫已经破裂，这些积弊都成了德国必须承担的麻烦；更可怕的是，我们甚至不知道麻烦究竟有多大。\n\n立即揭开全部真相，很可能引发又一轮更加严重的经济危机；继续熟视无睹，却也不再现实。德国在非洲的统治已经显露裂痕，殖民政府仍在不断索取新的资金，而忙于处理国内危机的柏林又不可能直接接管这片辽阔而混乱的领地。我们必须在不使整个殖民信用体系立即崩溃的前提下逐步查清账目、控制损失，并重新决定德国究竟应当如何处置它的非洲帝国。\n\n$MAF_colonial_report_GER$：[?MAF.MAF_colonial_report|.1Y]\n我们评估的§Y[MAF.GetName]§!稳定度：[?GER_MAF_stability|Y.1%%](对外宣称稳定为[?MAF.stability|Y.1%])\n§Y可信度§!：[?GER_MAF_credibility|G.1%%]\n§g随着可信度的提高，我们将知晓§Y[MAF.GetName]§!的真实情况§!\n\n§Y$MAF_colonial_illusion_modifier$§!的效果将每周修正\n\n我们目前每月给§Y[MAF.GetName]§!提供\n[?MAF_construction_points_monthly|+=.0]$MAF_construction_points$\n[?MAF_suppress_points_monthly|+=.0]$MAF_suppress_points$"

  GER_MAF_colonial_illusion_category_desc_MAF:0 "德国本土的经济危机戳破了我们精心编织的谎言。所幸，我们的账目足够分散，报表也足够复杂；不幸的是，柏林已经意识到这些账目并不可信。\n\n我们的行政体系支离破碎，缺乏最基本的管理能力，甚至连殖民政府的命令究竟能够传达到哪些地方都说不清楚。日常事务仍由旧殖民官僚、特许公司和地方统治者分别处理，而达累斯萨拉姆所做的，往往只是汇总并验收他们送来的成果。为了维持德国投资者的热情，我们不断许诺新的铁路、矿山、种植园和未来收益；只要本土资金继续涌入，这些承诺便总能依靠下一笔投资维持下去。\n\n黑色星期一正在撕碎这种心照不宣的欺骗。不过，柏林同样清楚，如果我们立即展示真实的账目，殖民投资的崩溃只会令德国的经济危机更加严重。因此，德国需要一份还能维持信心的报表，我们也需要德国资金继续维持统治。至少在他们真正查清一切以前，这场表演还必须继续下去。\n\n$MAF_colonial_report_MAF$：[?MAF_colonial_report|.1Y]\n$MAF_true_stability$：[?MAF_true_stability|Y.1%%](对外宣称稳定为[?MAF.stability|Y.1%])\n§Y注水度§!：[?MAF_report_padding|Y.1%%]\n§Y本土怀疑度§!：[?GER.GER_MAF_credibility|R.1%%]\n§g随着怀疑度的提高，我们的数据造假的效果将会降低§!\n\n§Y$MAF_colonial_illusion_modifier$§!的效果将每周修正\n\n$MAF_construction_points$：[?MAF_construction_points|Y.0]\n-本土每月给我们提供：[?GER.MAF_construction_points_monthly|+=.0]\n-每月我们产出：[?MAF_construction_points_monthly|+=.0]\n$MAF_suppress_points$：[?MAF_suppress_points|Y.0]\n-本土每月给我们提供：[?GER.MAF_suppress_points_monthly|+=.0]\n-每月我们产出：[?MAF_suppress_points_monthly|+=.0]\n§g每点$MAF_construction_points$或$MAF_suppress_points$等于10政治点数§!\n\n各殖民地状况：\n[MAF_territory_965_stability]([?MAF_territory_stability^965|.1%%]) §Y$mittelafrika_territory_965$§!的经济状况：[?MAF_territory_economy^965|.1G]\n[MAF_territory_927_stability]([?MAF_territory_stability^927|.1%%]) §Y$mittelafrika_territory_927$§!的经济状况：[?MAF_territory_economy^927|.1G]\n[MAF_territory_295_stability]([?MAF_territory_stability^295|.1%%]) §Y$mittelafrika_territory_295$§!的经济状况：[?MAF_territory_economy^295|.1G]\n[MAF_territory_539_stability]([?MAF_territory_stability^539|.1%%]) §Y$mittelafrika_territory_539$§!的经济状况：[?MAF_territory_economy^539|.1G]\n[MAF_territory_877_stability]([?MAF_territory_stability^877|.1%%]) §Y$mittelafrika_territory_877$§!的经济状况：[?MAF_territory_economy^877|.1G]\n[MAF_territory_876_stability]([?MAF_territory_stability^876|.1%%]) §Y$mittelafrika_territory_876$§!的经济状况：[?MAF_territory_economy^876|.1G]\n[MAF_territory_541_stability]([?MAF_territory_stability^541|.1%%]) §Y$mittelafrika_territory_541$§!的经济状况：[?MAF_territory_economy^541|.1G]\n[MAF_territory_973_stability]([?MAF_territory_stability^973|.1%%]) §Y$mittelafrika_territory_973$§!的经济状况：[?MAF_territory_economy^973|.1G]\n[MAF_territory_274_stability]([?MAF_territory_stability^274|.1%%]) §Y$mittelafrika_territory_274$§!的经济状况：[?MAF_territory_economy^274|.1G]\n[MAF_territory_547_stability]([?MAF_territory_stability^547|.1%%]) §Y$mittelafrika_territory_547$§!的经济状况：[?MAF_territory_economy^547|.1G]\n[MAF_territory_548_stability]([?MAF_territory_stability^548|.1%%]) §Y$mittelafrika_territory_548$§!的经济状况：[?MAF_territory_economy^548|.1G]\n[MAF_territory_813_stability]([?MAF_territory_stability^813|.1%%]) §Y$mittelafrika_territory_813$§!的经济状况：[?MAF_territory_economy^813|.1G]\n[MAF_territory_871_stability]([?MAF_territory_stability^871|.1%%]) §Y$mittelafrika_territory_871$§!的经济状况：[?MAF_territory_economy^871|.1G]\n§g每月，每个$MAF_territory_stability_stable$的殖民地将§G提高§!我们的$MAF_true_stability$，而每个$MAF_territory_stability_uncontrol$的殖民地将§R降低§!我们的$MAF_true_stability$§!"

