  fcf_international_events.268.desc:0 "黑色星期一的震荡很快传遍了整个非洲。德国银行冻结殖民贷款，各大企业取消订单，港口中堆满了无人问津的可可、棉花、铜矿与橡胶。矿山和种植园开始停工裁员，各地殖民政府的税收也随之骤降。官员们仍然坚称这只是暂时的市场波动，但危机显然才刚刚开始。"
  fcf_international_events.268.a:0 "快让它停下来！"

  fcf_international_events.269.title:0 "采取行动"
  fcf_international_events.269.desc:0 ""
  fcf_international_events.269.a:0 "进行建设。"
  fcf_international_events.269.b:0 "进行镇压。"
  fcf_international_events.269.c:0 "按下不表。"

  fcf_international_events.270.title:0 "殖民地脱离控制！"
  fcf_international_events.270.desc:0 ""
  fcf_international_events.270.a:0 "我们要尽快镇压他们！"

  fcf_international_events.271.title:0 "殖民统治崩溃"
  fcf_international_events.271.desc:0 ""
  fcf_international_events.271.a:0 "何以至此！"

  fcf_international_events.272.title:0 "非洲崩溃"
  fcf_international_events.272.desc:0 ""
  fcf_international_events.272.a:0 "我们完蛋了！"

  fcf_international_events.273.title:0 "本土放弃干预"
  fcf_international_events.273.desc:0 ""
  fcf_international_events.273.a:0 "这算好事还是坏事？"

  fcf_international_events.274.title:0 "第二波冲击"
  fcf_international_events.274.desc:0 ""
  fcf_international_events.274.a:0 "还没结束吗？！"

  fcf_international_events.275.title:0 "第三波冲击"
  fcf_international_events.275.desc:0 ""
  fcf_international_events.275.a:0 "终于结束了吗？"

  fcf_international_events.276.title:0 "遍地叛军"
  fcf_international_events.276.desc:0 ""
  fcf_international_events.276.a:0 "造反了！"

  fcf_international_events.277.title:0 "本土直接介入"
  fcf_international_events.277.desc:0 ""
  fcf_international_events.277.a:0 "太好了！"

  fcf_international_events.278.title:0 "本土增设殖民军"
  fcf_international_events.278.desc:0 ""
  fcf_international_events.278.a:0 "太好了！"

  fcf_international_events.279.title:0 "本土放弃非洲"
  fcf_international_events.279.desc:0 ""
  fcf_international_events.279.a:0 "完蛋了！"

