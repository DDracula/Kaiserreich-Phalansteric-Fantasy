  FCF_international_intervention_countermeasures_category_COR:0 "龙争虎斗科西嘉"
  FCF_international_intervention_countermeasures_category_desc_COR:0 "在大战前，黑手党就是科西嘉的顽疾。随着两个法国的出现，科西嘉成为两个法国政府之间“非正式”的中转站，黑手党在马赛和阿尔及尔之间腾挪，最终使得科西嘉彻底沦为了黑手党的私有财产。“要么加入黑手党，要么滚出科西嘉”是形容这里最好的语句。随着名义上的统治政府——阿尔及尔政府的日益衰落，科西嘉的野心，或更准确的说，黑手党的野心日益扩大。他们不想被一个累赘的政府拖累，他们需要赚钱，黑手党的意识形态是“出价高者胜”，至于谁会成为这场棋局的胜者？反正黑手党肯定是赚的。\n\n科西嘉的未来：[state_of_mafia_final_result_loc]([?COR.state_of_mafia_result|.0])§!\n§P黑手党§!将在彻底掌控§Y科西嘉§!后做出最终的选择([?COR.party_popularity_100@paternal_autocrat|.2]/60)"
