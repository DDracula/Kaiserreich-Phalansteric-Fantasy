  FCF_international_intervention_countermeasures_category_desc_HOL:0 "自[FRA.GetName]和[ENG.GetName]革命以来，作为他们的近邻，我国国内的激进左翼思潮也越发活跃起来。就在最近，我们得到线人的消息，我国的工人运动乃至合法的左翼组织都和[FRA.GetName]有秘密联系。他们得到了来自巴黎的贿赂，并试图将社会主义甚至是革命带到荷兰。我们决不能把国民交给这些玷污民主的宵小之徒，如果他们想要摧毁这一切，就来试试吧！"

