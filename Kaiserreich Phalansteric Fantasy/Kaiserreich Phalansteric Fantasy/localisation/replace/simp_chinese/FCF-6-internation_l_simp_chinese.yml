###外交部事件
  fcf_diplomacy_events.1.title:0 "[FRA.GetName]寻求贸易协议"
  fcf_diplomacy_events.1.desc:0 "法国自革命后就丧失了其殖民地，从而在很多资源方面不得不依赖外国进口，现如今他们希望和我们——拥有他们所需资源的国家——签订一份协议，来缓解他们的资源问题。可问题是，我们为什么要这么做？\n\n他们的外交委员和经济委员表明，如果我们有意接触，那么一场关于交换的谈判就将展开，围绕我们付出什么，以及我们得到什么。"
  fcf_diplomacy_events.1.a:0 "让我们看看他们的诚意。"
  fcf_diplomacy_events.1.b:0 "我们不会和赤匪谈判。"

  fcf_diplomacy_events.2.title:0 "[FROM.GetName]拒绝谈判"
  fcf_diplomacy_events.2.desc:0 "外交委员告知我们，我们先前向[FROM.GetName]抛出的橄榄枝已经被他们拒绝，他们没有看到和我们贸易的巨大潜力，而将自己囚禁在反对社会主义的意识形态囚笼中。"
  fcf_diplomacy_events.2.a:0 "真令人遗憾。"

  fcf_diplomacy_events.3.title:0 "[FROM.GetName]接受谈判"
  fcf_diplomacy_events.3.desc:0 "外交委员告诉我们，我们我们先前向[FROM.GetName]抛出的橄榄枝已经被他们接受，我们是时候开始准备和他们的谈判了。显然，主动方是拥有我们所需资源的[FROM.GetName]，但我们也不能在损害我们利益的情况下向他们妥协。\n\n无论是什么国家，直接的经济输送都是最简单粗暴的谈判筹码，但这可能导致我们本就不健康的财政进一步恶化。另一种方案是开放我们的市场给对方，这也十分有吸引力，但本国的企业可能颇有微词。又或者，我们可以通过利用当地的工人运动来迫使他们接受我们的条件，然而，这可能导致很多意外的发生，而极左派们也会认为我们是在利用国际工人运动为国家牟利。\n\n当然，最重要的是对方是否会同意，否则我们摆出再多的筹码都是无济于事。"
  fcf_diplomacy_events.3.a:0 "钱就是用来花的。"
  fcf_diplomacy_events.3.b:0 "降低我们对其的关税。"
  fcf_diplomacy_events.3.c:0 "利用该国的工人运动。"
  fcf_diplomacy_events.3.d:0 "让他们提出条件。"
  trade_agreement_result_tooltip:0 "最终的贸易协定效果将会是："
  ease_supply_chain_issues:0 "§G将有可能缓解我们的§Y$FCF_economy_supply_chain_modifier$§!§!"

  fcf_diplomacy_events.4.title:0 "[FRA.GetName]寻求我们的条件"
  fcf_diplomacy_events.4.desc:0 "在我们同意了和[FRA.GetName]谈判后，他们摆出一副谦逊的姿态，询问我们想从中获得什么。我们并没有因为他们的社会主义意识形态从而对他们抱有不切实际的幻想或敌意，在纯粹的经济学上来看，和法国这样一个大国做贸易注定有许多益处。如果我们靠着资源优势而得寸进尺，反而会使得我们陷入被动。\n\n最直接粗暴的方案是索要经济输送，这可以使得我们在资源上损失的利润得到一定的补偿，但对于对方的政府而言，注定是一笔不小的开支。或者我们也可以要求降低对我们的关税，好让我们的商品更容易进入法国甚至法伦施泰尔的的市场。此外，我们还有一种选择，作为社会主义老巢的巴黎都和我们进行协议了，这也可以迫使国内的社会主义者们偃旗息鼓一段时间。更进一步的，我们可以要求巴黎管好这帮社会主义者，不要给我们添乱。"
  fcf_diplomacy_events.4.a:0 "要求经济输送。"
  fcf_diplomacy_events.4.b:0 "要求关税减免。"
  fcf_diplomacy_events.4.c:0 "要求控制工人运动。"

  fcf_diplomacy_events.5.title:0 "[FROM.GetName]的条件"
  fcf_diplomacy_events.5.desc.a:0 "[FROM.GetName]给出了他们的条件：要求经济输送。这很实际，他们想要靠这来补偿他们在资源协议中损失的利润。现在的问题是，我们的财政支持这种可能吗？"
  fcf_diplomacy_events.5.desc.b:0 "[FROM.GetName]给出了他们的条件：降低关税，开放市场。这在我们的意料之中，也是贸易协议中最常见的利益交换。这不会对我们造成直接的影响，但随着时间推移，我们的劳动者和企业可能对此表现出不满。"
  fcf_diplomacy_events.5.desc.c:0 "[FROM.GetName]给出了他们的条件：控制当地的工人运动，让他们不要对抗政府。这实在出乎我们的预料，他们想借助我们的社会主义领袖地位来维护他们资产阶级政府的统治。当然这也并非建立在对于工人阶级的镇压之上，我们可以通过在表面答应对方的请求，但在暗中继续支持我们的工人同志。不过，至少在最近一段时间，我们可能需要同志们低调一些。"
  fcf_diplomacy_events.5.a:0 "接受条件。"
  fcf_diplomacy_events.5.b:0 "拒绝条件。"

  fcf_diplomacy_events.6.title:0 "与[FROM.GetName]达成协议"
  fcf_diplomacy_events.6.desc:0 "经过谈判，建立在资源贸易和利益交换上的贸易协议已经达成，愿我们两国之间的友谊长存！"
  fcf_diplomacy_events.6.a:0 "太好了。"

  fcf_diplomacy_events.7.title:0 "与[FROM.GetName]的谈判破裂"
  fcf_diplomacy_events.7.desc:0 "经过谈判，我们两国之间在资源贸易和利益交换上并没有达成一致，这使得协议最终流产。"
  fcf_diplomacy_events.7.a:0 "真遗憾。"

  fcf_diplomacy_events.8.title:0 "[FRA.GetName]的诚意"
  fcf_diplomacy_events.8.desc.a:0 "[FRA.GetName]给出了他们的条件：经济输送。这很实际，我们可以靠此补偿在资源协议中损失的利润。现在的问题是，我们靠此就能被收买了吗？"
  fcf_diplomacy_events.8.desc.b:0 "[FRA.GetName]给出了他们的条件：降低关税，开放市场。这在我们的意料之中，也是贸易协议中最常见的利益交换。这可以让我们的商品更容易进入法国甚至法伦施泰尔的的市场。"
  fcf_diplomacy_events.8.desc.c:0 "[FRA.GetName]给出了他们的条件：控制当地的工人运动，让他们不要对抗政府。这实在出乎我们的预料，我们没想到他们作为社会主义领袖，居然会主动维护我们资产阶级政府的统治。当然这也不可能建立在对于工人阶级的镇压之上，他们完全可以通过在表面答应，但在暗中继续支持我国的工人运动。不过，至少在最近一段时间，我国的工人运动可能会低调一些。"
  fcf_diplomacy_events.8.a:0 "接受条件。"
  fcf_diplomacy_events.8.b:0 "拒绝条件。"

  fcf_diplomacy_events.9.title:0 "与[FROM.GetName]的协议失效"
  fcf_diplomacy_events.9.desc:0 "我们先前与[FROM.GetName]签订的协议因为种种原因失效了，我们不再从中获得收益。"
  fcf_diplomacy_events.9.a:0 "真遗憾。"

  fcf_diplomacy_events.11.title:0 "[FRA.GetName]的橄榄枝"
  fcf_diplomacy_events.11.desc:0 "令人意外的是，我们的邻居，大战中的敌人，革命的老巢——[FRA.GetName]最近向我们的外交部门提出了一个邀请：不是为了嘲讽我们在经济危机的窘迫，而是“为了欧洲的和平与稳定”。他们想要恢复德法之间的贸易往来，甚至更近一步，寻求在各方面的合作，特别是资源方面。\n\n很显然，他们似乎想要凭借经济危机对于我们的打击从而在我们身上获利，但是否仅仅志在于此，也难以判断。但是这一举动最直观的后果就是，我们或许可以缓解经济危机的压力，甚至可以堵住国内社会主义者的嘴巴，当然同时遭到右派对我们“向赤匪妥协”的指责。\n\n在谈判开始之前，一切都是未知数，但问题就在于，我们应当和[FRA.GetName]进行重启经济交流的谈判吗？"
  fcf_diplomacy_events.11.a:0 "现实政治不会屈服于意识形态。"
  fcf_diplomacy_events.11.b:0 "我们永远不会和赤匪谈判。"

  fcf_diplomacy_events.12.title:0 "[FRA.GetName]寻求进一步合作"
  fcf_diplomacy_events.12.desc:0 "文本大意：法国希望我们和他们达成“特殊关系”，而非只是目前泛泛的。作为欧洲仅剩不多的民主国家，君主制的确比起社会主义者更加不适合我们合作。"
  fcf_diplomacy_events.12.a:0 "让我们看看法国人想耍什么花招。"
  fcf_diplomacy_events.12.b:0 "君主国的确是欧洲民主的祸患。"
  fcf_diplomacy_events.11.c:0 "我们不会和赤匪合作。"

  fcf_diplomacy_events.13.title:0 "[SWI.GetName]同意谈判"
  fcf_diplomacy_events.13.desc:0 "文本大意：提出要求"
  fcf_diplomacy_events.13.a:0 "建立法裔自治区。"
  fcf_diplomacy_events.13.b:0 "更紧密的经济联系。"
  fcf_diplomacy_events.13.c:0 "开放边境。"
  fcf_diplomacy_events.13.d:0 "为可能的战争做准备。"

  fcf_diplomacy_events.14.title:0 "以及？"
  fcf_diplomacy_events.14.desc:0 "文本大意：提出要求，要求越多，越不可能接受"
  fcf_diplomacy_events.14.a:0 "建立法裔自治区。"
  fcf_diplomacy_events.14.b:0 "更紧密的经济联系。"
  fcf_diplomacy_events.14.c:0 "开放边境。"
  fcf_diplomacy_events.14.d:0 "为可能的战争做准备。"  
  fcf_diplomacy_events.14.e:0 "就这么多。"  

  fcf_diplomacy_events.15.title:0 "[FRA.GetName]的提议"
  fcf_diplomacy_events.15.desc:0 "[FRA.GetName]向我们提出以下要求：\n\n[SWI_special_relationship_with_france_autonomy_loc][SWI_special_relationship_with_france_economy_loc][SWI_special_relationship_with_france_open_borders_loc][SWI_special_relationship_with_france_war_loc]"
  SWI_special_relationship_with_france_autonomy_desc:0 ""
