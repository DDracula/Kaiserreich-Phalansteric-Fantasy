  FCF_international_intervention_countermeasures_category_BEL_soc:0 "独立共和国计划"
  FCF_international_intervention_countermeasures_category_desc_BEL_soc:0 "比利时工党已经接受了法国人的建议，试图将比利时变成一个社会主义的共和国，一举摆脱德国人的阴影。然而这注定是艰难的，一不小心就有可能将西欧拉入另一次世界大战。因此，我们计划通过一系列巧妙的“失误”，让德国人不得不给予我们独立的地位，随后，我们就将成为一个自由的共和国。\n\n[bel_independent_plan_republic]\n[bel_independent_plan_wallonia]\n[bel_independent_plan_police]"
