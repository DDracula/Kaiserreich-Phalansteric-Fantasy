#工业企业
  l_aluminium_francais:0 "法兰西铝业联合体"
  l_aluminium_francais_desc:0 "创立于1911年的法国铝业联合体，最初是国内几家铝业公司共同设立的销售与技术协调机构。革命后，旧股东虽已退出历史舞台，其遍布阿尔卑斯与比利牛斯山麓的电解厂、实验室和销售网络却被完整保留下来，并被纳入冶金产业联合会。如今，它负责协调铝土矿进口、水电配额、各厂产量与加工标准，同时推动铝材在航空、电气和交通领域的应用。对联邦而言，法兰西铝业联合体已经不再是一家追逐垄断利润的卡特尔，而是连接原料、能源与尖端工业的重要枢纽。"

  airliquide:0 "液化空气联合体"
  airliquide_desc:0 "液化空气联合体创立于1902年，凭借乔治·克洛德改进的空气液化技术，逐渐建立起横跨欧洲、美洲与亚洲的生产网络。革命后，法国境内的工厂由工人委员会接管，海外分支则继续依照当地制度经营，并通过专利授权、设备供应和技术人员交换与巴黎保持联系。如今，联合体在化学产业联合会内协调氧气、氮气和乙炔的生产，同时为冶金焊接、化学合成、矿山作业与医院供氧提供保障。它也是联邦少数仍能维持全球技术网络的工业组织之一。"

  association_francaise_des_metaux:0 "法兰西金属联合体"
  association_francaise_des_metaux_desc:0 "法国金属联合体由原法国金属公司的各地工厂改组而来，主要负责铜、铅、锌及其合金的加工与供应。圣但尼、塞里丰坦和卡斯泰尔萨拉桑等地的工厂仍由各自的工厂委员会经营，联合体则在冶金产业联合会内部协调进口原料、生产订单与加工标准，并组织各厂交换轧制、拉丝和无缝管材技术。联邦的电网、铁路、机械制造与军需生产都离不开这些并不起眼的有色金属制品，使联合体成为重工业体系中最难被替代的环节之一。"

  societe_de_transports_d_energie_des_alpes:0 "阿尔卑斯能源输送公司"
  societe_de_transports_d_energie_des_alpes_desc:0 "阿尔卑斯能源输送公司成立于1920年，是联邦最早专门负责跨地区电力互联的组织。它将萨瓦山区的水电站同里昂、圣艾蒂安及罗讷—汝拉地区的工业中心连接起来，使原本彼此独立的发电与配电机构得以交换余电。输电线路分别归沿途各区委员会所有，公司则负责统一调度、设备维护与通行费用结算。凭借这套横跨群山的高压电网，阿尔卑斯的“白煤”得以持续流向里昂的工厂与于吉讷的电炉，并在枯水季节由其他电网反向补充。"

  compagnie_generale_de_la_telegraphie_sans_fil:0 "无线电报总公司"
  compagnie_generale_de_la_telegraphie_sans_fil_desc:0 "无线电报总公司于1918年由法国无线电公司及一批通信企业联合建立。革命后，原有控股关系被取消，公司名称则作为各专业工厂、实验室与通信工程队的共同组织保留下来。它主要研制远距离发射机、舰船与航空电台、定向设备及专业电子管，并为联邦建设国际无线电通信设施。凭借集中的研究力量和遍布海外的技术联系，无线电报总公司始终处在法国无线电工业的最前沿。"

  ducretet_thomson:0 "迪克雷泰-汤姆孙"
  ducretet_thomson_desc:0 "迪克雷泰工场最初以科学仪器和实验设备闻名，1930年与法国汤姆孙体系建立合作后，逐渐转向收音机和留声机的大规模生产。巴黎沃耶街的工厂由工厂委员会经营，工程师负责设计，所属产业联合会则协调真空管、扬声器和金属机件的供应。与专注专业设备的无线电报总公司不同，迪克雷泰—汤姆孙将无线电带进了普通人的客厅，其“世界之声”收音机也成为联邦最容易辨认的电子产品之一。"

