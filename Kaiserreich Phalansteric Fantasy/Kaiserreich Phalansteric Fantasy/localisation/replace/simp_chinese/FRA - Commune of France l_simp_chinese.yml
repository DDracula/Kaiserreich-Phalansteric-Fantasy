  KR_phalanstere_desc:0 "法伦施泰尔，由法国的社会主义者乌托邦社会主义者查尔斯·傅立叶提出，意为“自给自足的和谐社区”。该机构将在发展社会主义经济、进一步经济整合、资助研究和发展项目以及建立常备国际合作委员会方面给予帮助，这些都有助于世界上已获解放的国家齐心协力，为最后的斗争作好准备。"

