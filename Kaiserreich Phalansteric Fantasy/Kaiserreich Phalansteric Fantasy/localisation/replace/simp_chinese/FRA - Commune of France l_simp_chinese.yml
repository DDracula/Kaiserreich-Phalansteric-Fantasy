  FRA_communard_spirit:0 "公社精神"
  FRA_communard_spirit_desc:0 "我们是被反动的共和分子残酷镇压的第一个建立的社会主义政权巴黎公社的遗产。1920年，工人阶级终于完成了对资产阶级的复仇，推翻了秩序党的军事专政。我们，公社社员的儿女，必须捍卫我们的政权和我们的精神，我们再也不会被暴君压迫！"

  FRA_renseignements_generaux_lar:0 "情报总委"
  FRA_renseignements_generaux_lar_desc:0 "情报总委（Renseignements Généraux）是公社的耳目，收集威胁我们无产阶级之梦的国内外情报。而情报总委的任务不仅仅是安全工作，他们还负责在国内外宣传我们社会主义革命的价值观和原则。通过情报收集和分析，他们协助敲定了我们的外交政策，是我们努力打破全球资本枷锁的尖兵。\n\n在每一间仍然由资产阶级掌控工厂中都存在着我们的同情者，我们的关系网无人能挡。"

  FRA_bhartiya_support:0 "法国提供军事支援"
  FRA_bhartiya_support_desc:0 "我们已经从法国盟友处获得了军事援助。事实证明，这种无私的支援对击败反动的王公联邦和帝国主义印度自治领至关重要。我们希望有朝一日能够报答法国人的帮助，但是现在我们必须专注于手头的工作。"

  FRA_support_bharatiya:0 "已同意向印度公社派遣军事顾问。"
  FRA_created_phalanstere:0 "§Y[FRA.GetNameDef]§!：$has_completed_focus$$FRA_found_the_phalanstere_international$§!"

  phalanstere_research_name:0 "法伦施泰尔国际"
  phalanstere_research_desc:0 "在第三国际会议期间，与会各方已同意了一个联合世界范围内各个社会主义国家的计划，该计划致力于共享各国科研努力和技术成功。这一计划自从提出起就雄心勃勃，这个“法伦施泰尔国际”致力于帮助世界范围内的所有社会主义团体。"

  FRA_KR_gathering_storm_desc:0 "1919年12月24日的平安夜政变将第三共和国彻底推向了毁灭，军政府的反动统治最终导致了新年罢工和巴黎起义。在外省的军队也发生了大规模的倒戈，最终在特鲁瓦与白军决战，并取得了最终的胜利，使得巴黎得以从革命者和军政府的僵持之中解救出来。革命者最终得到了整个法兰西，并在这里展开了人类最伟大的实践。一个社会主义-工团主义的法兰西就此站上了世界舞台。革命后的法兰西迅速进入到了重建状态，虽然各政治派系之间略有矛盾，但在同一面红旗下团结起来。然而，在革命重建工作完成之后，法兰西的命运又该走向何方？"
  FRA_country_intro_background:0 "GFX_FRA_intro"
  FRA_country_intro_header:0 "法兰西公社联邦现状：内战"
  FRA_country_intro_content:0 "1919年春，法兰西第三共和国在第一次世界大战末期陷入深重危机。德意志帝国发动“祖国会战”，法军士气低落，贡比涅失守。尽管菲利普·贝当在克莱蒙战役中利用坦克反击挽回声誉，但协约国随后的五月攻势因步兵拒绝进攻而陷入僵局，前线爆发大规模兵变。\n\n国内政局随之动荡。5月22日，巴黎爆发反对乔治·克列孟梭的大罢工。费尔南·洛里奥与鲍里斯·苏瓦林脱离工人国际法国支部，成立革命工人党，主张武装夺取政权。6月，激进党领袖加斯顿·杜梅尔格接任总理，因其坚持战争且圣米耶勒战役惨败，导致了法军历史上规模最大的兵变。\n\n7月，共和社会主义党领袖阿里斯蒂德·白里安组阁，试图通过《马提尼翁协定》安抚总工会领袖莱昂·儒奥，但遭到了由皮埃尔·莫纳特领导的革命工团委员会的抵制。11月6日，白里安被迫签署割地赔款的《凡尔赛和约》，法兰西举国哗然，右翼军方与左翼革命力量同时向濒临崩溃的共和政府发起冲击。\n\n12月17日，以贝当、斐迪南·福煦为首的高级军官团在战争部密谋，炮制“革命暴动计划”以欺骗政府。同日，共和退伍军人协会核心成员雷蒙·列斐伏尔与革命工人党领导层会晤，秘密建立了覆盖驻军的“士兵友谊会”网络。\n\n12月24日，贝当发动“平安夜政变”。白里安逃亡波尔多，权力陷入真空。在军队刺刀的威逼下，国民议会授予约瑟夫·霞飞元帅全权。第三共和国名存实亡，军政府随即查封《人道报》，搜捕洛里奥、苏瓦林等左翼领袖。然而，铁路工会与共和退伍军人协会利用通信网络迅速通报政变消息，温和派与激进派工会达成临时同盟。\n\n1920年1月1日，新年总罢工导致巴黎全城停电，士兵开枪射杀平民引发大规模暴动。1月5日，在圣日耳曼大街爆发血腥冲突，双方伤亡惨重。工人们撤向右岸搭建街垒，共和退伍军人协会组织赤卫队进行武装反抗。\n\n1月5日至12日，第一届全国劳动联合所与士兵委员会代表大会在巴黎召开。1月12日，革命群众攻占巴黎市政厅，升起红旗。同日深夜，贝当因前线驻军不稳被迫收缩防线至第七区。\n\n1月12日傍晚，维克多·格里夫埃尔宣布成立法兰西公社公共安全委员会。尽管共和退伍军人协会领袖列斐伏尔在策动万塞讷军营倒戈时不幸牺牲，但万塞讷与圣但尼驻军的起义彻底动摇了军政府的统治根基。此前，工人国际法国支部在图尔大会上分裂，以让·龙格和马塞尔·加香为首的多数派宣布支持革命政府。\n\n1月13日，法兰西全境爆发规模宏大的国内战争。里尔、里昂、马赛等地相继起义。全法铁路大罢工切断了白军的补给线。2月至3月，红军在罗讷河谷战役中覆灭白军主力。3月8日，波尔多解放。3月9日至4月6日，红军在特鲁瓦全歼了贝当在法国东北部唯一的机动兵力。此战之后，中左翼势力纷纷宣布拥护革命。4月11日，巴黎解围。白军残部在逃往阿尔及利亚的过程中溃不成军。5月15日，随着布雷斯特水兵起义，最后一批白军撤离本土，国内战争以革命方的彻底胜利告终。"

